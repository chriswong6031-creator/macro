# CPI Relative Importance Weights — December 2025 basis (in effect Jan–Dec 2026)
#
# Source: https://www.bls.gov/cpi/tables/relative-importance/2025.htm
# Table 1 (2024 Weights): Relative importance of components in the Consumer Price Indexes
# U.S. city average, December 2025. CPI-U (All Urban Consumers).
# Basis: 2024 expenditure weights; in effect for the January–December 2026 CPI.
#
# Fetch method: keyless HTTP GET with User-Agent 'BLS-DataFetch/1.0 (research)'
#   (standard python-requests UA returns 403; custom descriptive UA returns 200)
# Fetch status: SUCCESS (fetched 2026-07-08)
# Source annotation: fetched from BLS official table; values transcribed verbatim.
# All-items denominator: 100.000

meta:
  weight_year_effective: 2026
  basis: "December 2025 relative importance (2024 expenditure weights)"
  source_url: "https://www.bls.gov/cpi/tables/relative-importance/2025.htm"
  last_updated: "2026-07-08"
  index: "CPI-U (All Urban Consumers), U.S. city average"
  fetch_method: "HTTP GET with User-Agent 'BLS-DataFetch/1.0 (research)'"
  fetch_status: "success"
  all_items_denominator: 100.000
  note: >
    Weights are frozen for Jan–Dec 2026. Refresh each January using collectors/bls_cpi_weights.py.
    PIT-rule: treat as revision_optimistic for the weight leg (not ALFRED-vintaged).

