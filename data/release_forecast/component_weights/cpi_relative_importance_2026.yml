# ============================================================
# BRIDGE BLOCK WEIGHTS (as used in engine/release_cpi_bridge.py)
# Key = block name, value = RI weight used in bridge calculation
# ============================================================

bridge_blocks:

  # Block 1: Energy — gasoline + electricity
  energy:
    total_weight: 6.383
    gasoline_weight: 2.895
    electricity_weight: 2.375
    other_energy_weight: 1.113  # motor fuel ex-gasoline + household energy ex-electricity
    note: >
      Gasoline from GASREGW (reference-month avg); electricity from APU000072610.
      Other energy (fuel oil, gas service, other motor fuel) = prior_only at the block level.
      Bridge uses gasoline + electricity as modelled sub-blocks; weights from BLS table.

  # Block 2: Shelter (OER + rent of primary + lodging)
  shelter:
    total_weight: 35.625
    rent_of_primary_residence: 7.840
    owners_equivalent_rent: 26.204
    lodging_away_from_home: 1.289
    note: >
      Full shelter basket (35.625) used for nowcast contribution.
      Lodging-away-from-home is prior_only in practice (no free proxy) but weight is
      included in shelter_total since shelter_nowcast covers the OER+rent core.
      The bridge applies shelter_nowcast to the total shelter weight for simplicity;
      gap noted in provenance.

  # Block 3: Food at Home
  food_at_home:
    total_weight: 8.325
    note: >
      PPI WPU01 (farm products) as directional signal; CUSR0000SAF11 for prior MoM.
      revision_optimistic for both sources.

  # Block 4: Core Goods (commodities less food and energy)
  core_goods:
    total_weight: 19.176
    note: >
      PPIFIS + PPIFES pipeline momentum. ALFRED-vintaged (PIT-safe).
      Covers: new vehicles, used vehicles, apparel, medical commodities, other core goods.

  # Block 5: Core Services ex-Shelter
  core_services_ex_shelter:
    total_weight: 25.118  # corrected 2026-07-14: 79.919 - 35.625 - 19.176 = 25.118; engine _CORE_SVC_XS_W
    note: >
      Approximated as all-items-less-food-and-energy minus shelter minus core_goods.
      CUSR0000SASLE persistence. revision_optimistic.
      (Was 44.294 before 2026-07-14; prior calculation forgot to subtract core_goods 19.176.)
      See engine/release_cpi_bridge.py _CORE_SVC_XS_W = 25.118 for the governing constant.

  # Prior-only blocks (confidence = 0.0)
  food_away_from_home:
    total_weight: 5.373
    prior_only: true
  alcoholic_beverages:
    total_weight: 0.840
    prior_only: true
  new_vehicles:
