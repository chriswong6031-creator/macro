# NFP Preliminary Benchmark Revision Estimates
# BLS publishes a preliminary benchmark revision estimate each late summer / fall
# (for the reference period ending March of the same year):
#   Through ~2010 : typically published in October
#   ca. 2011-2018 : moved to late September (e.g. Sep 29, 2011; Sep 27, 2012)
#   2019+         : moved to August (Aug 21, 2019; Aug 24, 2022; Aug 23, 2023;
#                   Aug 21, 2024) or September (Sep 9, 2025)
# When |preliminary_estimate| > 100 (thousands), the Track S flag fires for the
# following January NFP print.
#
# Fields:
#   published_month: YYYY-MM (actual month the BLS preliminary was released)
#   reference_period_end: YYYY-MM (March of that year — the benchmark reference date)
#   preliminary_estimate: int (thousands; positive = upward revision)
#   cite: URL
#
# Engine matching: _check_preliminary_benchmark() matches on the YEAR portion of
# published_month only (i.e. pub.startswith("{ref.year-1}-")), so the correct
# entry fires regardless of the specific month.
#
# Source: https://www.bls.gov/ces/publications/benchmark.htm

preliminary_benchmarks:

  - published_month: "2007-10"
    reference_period_end: "2007-03"
    preliminary_estimate: -297
    cite: "https://www.bls.gov/ces/publications/benchmark.htm"

  - published_month: "2008-10"
    reference_period_end: "2008-03"
    preliminary_estimate: -376
    cite: "https://www.bls.gov/ces/publications/benchmark.htm"

  - published_month: "2009-10"
    reference_period_end: "2009-03"
    preliminary_estimate: -824
    cite: "https://www.bls.gov/ces/publications/benchmark.htm"

  - published_month: "2010-10"
    reference_period_end: "2010-03"
    preliminary_estimate: -366
    cite: "https://www.bls.gov/ces/publications/benchmark.htm"

  - published_month: "2011-09"
    reference_period_end: "2011-03"
    preliminary_estimate: 192
    # Released Sep 29, 2011 per BLS announcement.
    # Source: https://www.calculatedriskblog.com/2011/09/employment-comment-on-preliminary.html
    cite: "https://www.bls.gov/ces/publications/benchmark.htm"

  - published_month: "2012-09"
    reference_period_end: "2012-03"
    preliminary_estimate: 386
    # Released Sep 27, 2012 per BLS; Calculated Risk coverage confirms date.
    # Source: https://www.calculatedriskblog.com/2012/09/employment-preliminary-annual-benchmark.html
    cite: "https://www.bls.gov/ces/publications/benchmark.htm"

  - published_month: "2019-08"
    reference_period_end: "2019-03"
    preliminary_estimate: -501
    # Released Aug 21, 2019. Source: https://www.bls.gov/ces/notices/2019/2019-ces-preliminary-benchmark-revision.htm
    cite: "https://www.bls.gov/ces/publications/benchmark.htm"

  - published_month: "2022-08"
    reference_period_end: "2022-03"
    preliminary_estimate: 462
    # Released Aug 24, 2022. Source: https://www.bls.gov/ces/notices/2022/2022-ces-preliminary-benchmark-revision.htm
    cite: "https://www.bls.gov/ces/publications/benchmark.htm"
    note: "Final: +517k in January 2023 benchmark revision"

  - published_month: "2023-08"
    reference_period_end: "2023-03"
    preliminary_estimate: -306
    # Released Aug 23, 2023. Source: https://www.bls.gov/ces/notices/2023/2023-preliminary-benchmark-revision-release-date.htm
    cite: "https://www.bls.gov/ces/publications/benchmark.htm"

  - published_month: "2024-08"
    reference_period_end: "2024-03"
    preliminary_estimate: -818
    # Released Aug 21, 2024. Source: https://www.bls.gov/ces/notices/2024/2024-preliminary-benchmark-revision-release-date.htm
    cite: "https://www.bls.gov/ces/publications/benchmark.htm"
    note: "Largest downward preliminary revision since 2009; flagged Jan 2025 benchmark print"

  - published_month: "2025-09"
    reference_period_end: "2025-03"
    preliminary_estimate: -911
    # Released Tue Sep 9, 2025, 10:00 ET (USDL-25-1352). Private -880k, government -31k.
    # Largest preliminary benchmark revision on record (since 2002); final lands with
    # the Jan-2026 Employment Situation (Feb 2026).
    # Sources: https://www.bls.gov/news.release/prebmk.nr0.htm ;
    # https://www.bls.gov/sae/notices/2025/preliminary-benchmark-announcement-2025.htm
    cite: "https://www.bls.gov/news.release/prebmk.nr0.htm"
    note: "Largest preliminary revision on record (-0.6%); flags the Jan 2026 benchmark print"

