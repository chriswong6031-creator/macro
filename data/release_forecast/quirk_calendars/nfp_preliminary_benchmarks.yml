# NFP Preliminary Benchmark Revision Estimates
# BLS publishes a preliminary benchmark revision estimate each October
# (for the reference period ending March of the same year).
# When the preliminary is > |100k|, the Track S flag fires for the
# following January NFP print.
#
# Fields:
#   published_month: YYYY-MM (typically October each year)
#   reference_period_end: YYYY-MM (typically March of that year)
#   preliminary_estimate: int (thousands; positive = upward revision)
#   source: BLS CES benchmark revision page
#   cite: URL
#
# Source: https://www.bls.gov/ces/publications/benchmark.htm

preliminary_benchmarks:

