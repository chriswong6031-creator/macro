# data/china_official/phrase_book.yml — the Communiqué Diff phrase book (W4 B1).
#
# Spec: research/QUALITATIVE_INTELLIGENCE_UPGRADE_BY_FABLE.md D9, §2.2, Appendix
# P4 ("44-formula phrase-book seed (needs human review)"). The ~44 canonical
# formulas of Chinese official policy language whose APPEARANCE, DISAPPEARANCE, or
# elevation moves whole sectors (适度宽松 reappearing, 房住不炒 dropping, …).
#
# EACH ENTRY:
#   zh:            the canonical formula (verbatim; the string the diff engine matches)
#   gloss:         short English gloss
#   domain:        monetary | fiscal | property | industrial | growth | reform |
#                  regulation | tech | consumption | employment | external | politics
#   polarity:      +1 risk-ON / easing / pro-growth ; -1 risk-OFF / tightening /
#                  restrictive ; 0 neutral-or-ambiguous. THIS IS A HUMAN-REVIEW FIELD.
#   review_status: PROVISIONAL until a human confirms polarity.
#   variants:      OPTIONAL list of equivalent surface forms that count as the SAME
#                  formula (e.g. 适度宽松 ~ 适度宽松的货币政策). The engine matches
#                  the canonical `zh` OR any variant.
#
# CRITICAL RISK NOTE (spec §5 "Phrase-book subjectivity"): polarity labels are
# context-dependent and are marked PROVISIONAL — they must NOT drive a signed
# signal until a human reviews them. The Communiqué Diff engine emits
# APPEARED / DROPPED / lead-shift events as SALIENCE-ONLY (direction=0) qledger
# claims regardless of polarity, so UNSIGNED events are safe to accrue immediately.
# polarity rides along for display + future signed use only.
#
# review_status meanings:
#   PROVISIONAL  — seeded by machine/spec; polarity NOT yet human-confirmed.
#   REVIEWED     — a human confirmed zh/gloss/domain/polarity.
#   DISPUTED     — a human flagged the entry as context-dependent / unreliable.

schema: communique_diff.phrase_book.v1
seeded_at: "2026-07-02"
review_note: >
  All entries PROVISIONAL. Polarity is a human-review field; nothing signed until
  reviewed. The engine emits salience-only events, so appearance/disappearance is
  safe to accrue today.

