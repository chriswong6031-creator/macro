      - 2026-06-04  # (from standard BoC calendar; confirm at source)
      - 2026-07-15
      - 2026-09-02  # confirmed
      - 2026-10-28  # confirmed
      - 2026-12-09  # confirmed
    source: "https://www.bankofcanada.ca/core-functions/monetary-policy/key-interest-rate/"

  # Source: https://www.rba.gov.au/media-releases/2025/mr-25-02.html
  # (verified 2026-07-12; 8 meetings/year; date = decision announcement day, 2:30pm AEDT)
  RBA:
