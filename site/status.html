<!doctype html>
<html lang="en">
<head>
<script data-dbase src="data_base.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>VPS status · mastermind-x</title>
<link rel="stylesheet" href="assets/css/702e0509.css?v=702e0509">
</head>
<body>
<div class="wrap">
  <h1>mastermind-x · VPS status</h1>
  <div class="sub" id="sub">loading…</div>
  <div id="cards"></div>
  <div class="foot">
    auto-refresh 30s · raw: <a href="/api/status">/api/status</a> ·
    loops: <code>*/3</code> site-pull · <code>*/5</code> live-scoring · daily terminal-refresh
  </div>
</div>
<script>
const CARDS = [
  { key:'site', label:'Site pull (main → droplet, every 3 min)',
    line: c => `commit <b>${c.commit||'?'}</b> · ${c.commit_time? new Date(c.commit_time).toLocaleString():'?'}`,
    grade: c => 'green' },   // pull is event-driven; presence = healthy
  { key:'overlay', label:'Live engine scoring (overlay, every 5 min · mkt hrs)',
    line: c => c.status==='missing' ? '<span class="err">not built yet</span>'
              : `built <b>${c.built||'?'}</b> · ${c.fresh}/${c.n} fresh`,
    grade: c => c.status==='missing' ? 'red' : c.age_min==null ? 'gray'
              : c.age_min<10 ? 'green' : c.age_min<90 ? 'amber' : 'gray',
    note: c => c.age_min!=null && c.age_min>=90 ? '(stale = markets closed; refreshes next session)' : '' },
  { key:'terminal_data', label:'Terminal data refresh (daily 21:30 UTC)',
    line: c => c.status==='missing' ? '<span class="err">missing</span>'
              : `as_of <b>${c.as_of||'?'}</b> · ${c.symbols} symbols`,
    grade: c => c.status==='missing' ? 'red' : c.age_min==null ? 'gray'
              : c.age_min < 60*30 ? 'green' : 'amber' },
];
function ageStr(m){ if(m==null) return ''; if(m<90) return m.toFixed(0)+'m ago';
  if(m<60*48) return (m/60).toFixed(1)+'h ago'; return (m/1440).toFixed(1)+'d ago'; }
async function load(){
  const box=document.getElementById('cards'); const sub=document.getElementById('sub');
  try{
    const r=await fetch('/api/status',{cache:'no-store'}); const d=await r.json();
    sub.textContent = `commit ${d.commit} · checked ${new Date().toLocaleTimeString()}`;
    box.innerHTML = CARDS.map(spec=>{
      const c=d.checks[spec.key]||{}; const g=spec.grade(c);
      const note=spec.note?spec.note(c):'';
      return `<div class="card"><div class="dot ${g}"></div><div style="flex:1">
        <div class="head"><span class="name">${spec.label}</span><span class="age">${ageStr(c.age_min)}</span></div>
        <div class="meta">${spec.line(c)} ${note?`<span class="age">${note}</span>`:''}</div>
      </div>`;
    }).join('');
  }catch(e){ sub.innerHTML='<span class="err">/api/status unreachable — API may be down</span>'; }
}
load(); setInterval(load, 30000);
</script>
<script defer data-whb data-root="" src="wh_banner.js?v=37bf40aa"></script>
<footer class="site-footer">
  <span class="made">© 2026 MastermindX Inc</span>
</footer>
</body>
</html>
