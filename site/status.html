<!doctype html>
<html lang="en">
<head>
<script data-dbase src="data_base.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>VPS status · mastermind-x</title>
<style>
  :root { --bg:#0a0b0e; --card:#131722; --line:#1f2733; --txt:#d6dae3; --dim:#8b94a3;
          --green:#26c281; --amber:#e8b339; --red:#f0566b; --blue:#2962ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; padding:28px 18px; }
  .wrap { max-width:680px; margin:0 auto; }
  h1 { font-size:18px; font-weight:600; margin:0 0 2px; letter-spacing:.3px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:12px; display:flex; align-items:flex-start; gap:12px; }
  .dot { width:10px; height:10px; border-radius:50%; margin-top:5px; flex:0 0 auto;
         box-shadow:0 0 8px currentColor; }
  .dot.green{color:var(--green);background:var(--green)} .dot.amber{color:var(--amber);background:var(--amber)}
  .dot.red{color:var(--red);background:var(--red)} .dot.gray{color:var(--dim);background:var(--dim);box-shadow:none}
  .name { font-weight:600; }
  .meta { color:var(--dim); font-size:12.5px; }
  .meta b { color:var(--txt); font-weight:600; }
  .head { display:flex; justify-content:space-between; align-items:baseline; }
  .age { font-size:12px; color:var(--dim); }
  .err { color:var(--red); }
  .foot { color:var(--dim); font-size:11.5px; margin-top:16px; }
  a { color:var(--blue); text-decoration:none; }
  /* our own scrollbars — matched to this page's palette */
  * { scrollbar-width:thin; scrollbar-color:color-mix(in srgb,var(--dim) 42%,transparent) transparent; }
  *::-webkit-scrollbar { width:11px; height:11px; }
  *::-webkit-scrollbar-track { background:transparent; }
  *::-webkit-scrollbar-thumb { background:color-mix(in srgb,var(--dim) 42%,transparent);
    border-radius:999px; border:3px solid transparent; background-clip:padding-box; }
  *::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb,var(--dim) 68%,transparent); }
  *::-webkit-scrollbar-thumb:active { background:color-mix(in srgb,var(--blue) 62%,var(--dim)); }
  *::-webkit-scrollbar-corner { background:transparent; }
</style>
</head>
<body>
<div class="wrap">
  <h1>mastermind-x · VPS status</h1>
  <div class="sub" id="sub">loading…</div>
  <div id="cards"></div>
  <div class="foot">
    auto-refresh 30s · raw: <a href="/api/status">/api/status</a> ·
    loops: <code>*/3</code> site-pull · <code>*/5</code> live-scoring · daily terminal-refresh
  </div>
</div>
<script>
const CARDS = [
  { key:'site', label:'Site pull (main → droplet, every 3 min)',
    line: c => `commit <b>${c.commit||'?'}</b> · ${c.commit_time? new Date(c.commit_time).toLocaleString():'?'}`,
    grade: c => 'green' },   // pull is event-driven; presence = healthy
  { key:'overlay', label:'Live engine scoring (overlay, every 5 min · mkt hrs)',
    line: c => c.status==='missing' ? '<span class="err">not built yet</span>'
              : `built <b>${c.built||'?'}</b> · ${c.fresh}/${c.n} fresh`,
    grade: c => c.status==='missing' ? 'red' : c.age_min==null ? 'gray'
              : c.age_min<10 ? 'green' : c.age_min<90 ? 'amber' : 'gray',
    note: c => c.age_min!=null && c.age_min>=90 ? '(stale = markets closed; refreshes next session)' : '' },
  { key:'terminal_data', label:'Terminal data refresh (daily 21:30 UTC)',
    line: c => c.status==='missing' ? '<span class="err">missing</span>'
              : `as_of <b>${c.as_of||'?'}</b> · ${c.symbols} symbols`,
    grade: c => c.status==='missing' ? 'red' : c.age_min==null ? 'gray'
              : c.age_min < 60*30 ? 'green' : 'amber' },
];
function ageStr(m){ if(m==null) return ''; if(m<90) return m.toFixed(0)+'m ago';
  if(m<60*48) return (m/60).toFixed(1)+'h ago'; return (m/1440).toFixed(1)+'d ago'; }
async function load(){
  const box=document.getElementById('cards'); const sub=document.getElementById('sub');
  try{
    const r=await fetch('/api/status',{cache:'no-store'}); const d=await r.json();
    sub.textContent = `commit ${d.commit} · checked ${new Date().toLocaleTimeString()}`;
    box.innerHTML = CARDS.map(spec=>{
      const c=d.checks[spec.key]||{}; const g=spec.grade(c);
      const note=spec.note?spec.note(c):'';
      return `<div class="card"><div class="dot ${g}"></div><div style="flex:1">
        <div class="head"><span class="name">${spec.label}</span><span class="age">${ageStr(c.age_min)}</span></div>
        <div class="meta">${spec.line(c)} ${note?`<span class="age">${note}</span>`:''}</div>
      </div>`;
    }).join('');
  }catch(e){ sub.innerHTML='<span class="err">/api/status unreachable — API may be down</span>'; }
}
load(); setInterval(load, 30000);
</script>
<script defer data-whb data-root="" src="wh_banner.js?v=37bf40aa"></script>
<footer class="site-footer">
  <span class="made">© 2026 MastermindX Inc</span>
</footer>
</body>
</html>
