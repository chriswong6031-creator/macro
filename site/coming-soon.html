<!DOCTYPE html>
<html lang="en">
<head>
<script data-dbase src="data_base.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mastermind — Coming Soon</title>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Tokens ── */
:root {
  --bg: #0a0b0f;
  --surface: #111217;
  --border: #1e2030;
  --text-primary: #e8eaf0;
  --text-secondary: #7a7f96;
  --text-muted: #4a4e63;
  --accent: #4f6ef7;
  --accent-glow: rgba(79, 110, 247, 0.18);
  --gold: #c9a84c;
  --gold-dim: rgba(201, 168, 76, 0.12);
}

/* ── Aurora background ── */
body {
  min-height: 100dvh;
  background-color: var(--bg);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
               Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* Aurora orbs — pure CSS, no external images */
body::before, body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  z-index: 0;
  animation: drift 18s ease-in-out infinite alternate;
}
body::before {
  width: 520px; height: 400px;
  top: -80px; left: -100px;
  background: radial-gradient(ellipse, rgba(79,110,247,0.22) 0%, transparent 70%);
  animation-delay: 0s;
}
body::after {
  width: 460px; height: 380px;
  bottom: -80px; right: -80px;
  background: radial-gradient(ellipse, rgba(201,168,76,0.14) 0%, transparent 70%);
  animation-delay: -9s;
}

@keyframes drift {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(30px, 20px) scale(1.06); }
  100% { transform: translate(-15px, 35px) scale(0.97); }
}

/* ── Shimmer line ── */
.shimmer-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--accent) 30%,
    var(--gold) 50%,
    var(--accent) 70%,
    transparent 100%);
  background-size: 200% 100%;
  animation: shimmer 4s linear infinite;
  z-index: 10;
  opacity: 0.7;
}
@keyframes shimmer {
  0%   { background-position: 200% center; }
  100% { background-position: -200% center; }
}

/* ── Language toggle (checkbox-hack, no JS) ── */
#lang-toggle { display: none; }

.lang-switch {
  position: fixed;
  top: 20px; right: 24px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  user-select: none;
}
.lang-switch span {
  display: inline-block;
  padding: 5px 11px;
  font-size: 12px;
  letter-spacing: 0.04em;
  font-weight: 500;
  color: var(--text-muted);
  background: var(--surface);
  transition: color 0.2s, background 0.2s;
}
.lang-switch .l-en { border-right: 1px solid var(--border); }

/* Default (EN active) */
.lang-switch .l-en { color: var(--text-primary); background: #1a1c25; }
.lang-switch .l-zh { color: var(--text-muted); }

/* When toggled: ZH active */
#lang-toggle:checked ~ * .lang-switch .l-en { color: var(--text-muted); background: var(--surface); }
#lang-toggle:checked ~ * .lang-switch .l-zh { color: var(--text-primary); background: #1a1c25; }

/* EN/ZH visibility layers */
.t-en, .t-zh { display: inherit; }
.t-zh { display: none; }
#lang-toggle:checked ~ * .t-en { display: none !important; }
#lang-toggle:checked ~ * .t-zh { display: inherit !important; }

/* For flex/block contexts */
.t-en.flex-item { display: flex; }
.t-zh.flex-item { display: none; }
#lang-toggle:checked ~ * .t-en.flex-item { display: none !important; }
#lang-toggle:checked ~ * .t-zh.flex-item { display: flex !important; }

/* ── Main card ── */
.card {
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 56px 48px 52px;
  max-width: 520px;
  width: calc(100% - 40px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.03) inset,
    0 24px 80px rgba(0,0,0,0.5),
    0 0 40px var(--accent-glow);
}

/* Gold top-edge accent */
.card::before {
  content: "";
  position: absolute;
  top: -1px; left: 20%; right: 20%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  border-radius: 1px;
}

/* ── Wordmark ── */
.wordmark {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 36px;
}

/* Inline SVG mark — an abstract "M" / signal motif */
.wordmark svg {
  flex-shrink: 0;
}

.brand-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-primary);
  line-height: 1;
}

/* ── Divider ── */
.divider {
  width: 40px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin-bottom: 32px;
}

/* ── Headlines ── */
.headline {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  line-height: 1.2;
  margin-bottom: 14px;
}
.headline-zh {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--text-primary);
  line-height: 1.3;
  margin-bottom: 14px;
}

.subline {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.65;
  max-width: 360px;
}

/* ── Status dot row ── */
.status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 40px;
  padding: 10px 18px;
  background: rgba(79,110,247,0.06);
  border: 1px solid rgba(79,110,247,0.15);
  border-radius: 100px;
}
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.55; transform: scale(0.85); }
}
.status-text {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--accent);
}

/* ── Footer ── */
.footer {
  position: fixed;
  bottom: 20px;
  left: 0; right: 0;
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  z-index: 5;
  letter-spacing: 0.04em;
}

/* ── Responsive ── */
@media (max-width: 480px) {
  .card { padding: 40px 28px 38px; }
  .headline { font-size: 24px; }
  .headline-zh { font-size: 22px; }
  .subline { font-size: 14px; }
  .wordmark { margin-bottom: 28px; }
  body::before { width: 320px; height: 280px; filter: blur(80px); }
  body::after  { width: 300px; height: 260px; filter: blur(80px); }
}

/* ── Reduced-motion respect ── */
@media (prefers-reduced-motion: reduce) {
  body::before, body::after { animation: none; }
  .shimmer-bar { animation: none; opacity: 0.4; }
  .status-dot  { animation: none; }
}
</style>
</head>
<body>

<!-- language toggle state: unchecked = EN, checked = ZH -->
<input type="checkbox" id="lang-toggle">

<div class="shimmer-bar"></div>

<!-- all content wrapped so the CSS sibling combinator works -->
<div style="display:contents">

  <!-- lang switch -->
  <label class="lang-switch" for="lang-toggle" aria-label="Switch language">
    <span class="l-en">EN</span>
    <span class="l-zh">中</span>
  </label>

  <!-- main card -->
  <main class="card" role="main">

    <!-- wordmark -->
    <div class="wordmark">
      <!-- Inline SVG: stylised signal bars / M motif -->
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Background circle -->
        <circle cx="18" cy="18" r="17.5" stroke="rgba(201,168,76,0.25)" stroke-width="1"/>
        <!-- Signal bars — evokes market data / Mastermind "M" -->
        <rect x="7"  y="22" width="4" height="7"  rx="1.5" fill="#4f6ef7" opacity="0.55"/>
        <rect x="13" y="17" width="4" height="12" rx="1.5" fill="#4f6ef7" opacity="0.75"/>
        <rect x="19" y="11" width="4" height="18" rx="1.5" fill="#c9a84c" opacity="0.85"/>
        <rect x="25" y="14" width="4" height="15" rx="1.5" fill="#4f6ef7" opacity="0.65"/>
      </svg>
      <span class="brand-name">Mastermind</span>
    </div>

    <div class="divider"></div>

    <!-- EN headline -->
    <h1 class="headline t-en">Something great<br>is on its way.</h1>
    <!-- ZH headline -->
    <h1 class="headline-zh t-zh">精彩即将登场</h1>

    <!-- EN subline -->
    <p class="subline t-en">
      We're putting the finishing touches on a new experience.<br>
      Check back soon — it'll be worth it.
    </p>
    <!-- ZH subline -->
    <p class="subline t-zh">
      我们正在进行最后的调试与完善。<br>
      请稍后回来——值得等待。
    </p>

    <!-- status indicator -->
    <div class="status-row" role="status" aria-live="polite">
      <div class="status-dot"></div>
      <!-- EN -->
      <span class="status-text t-en">Launching soon</span>
      <!-- ZH -->
      <span class="status-text t-zh">即将上线</span>
    </div>

  </main>

  <!-- footer -->
  <footer class="footer">
    <span class="t-en">&copy; Mastermind. All rights reserved.</span>
    <span class="t-zh">&copy; Mastermind 保留所有权利</span>
  </footer>

</div><!-- end contents wrapper -->

</body>
</html>
