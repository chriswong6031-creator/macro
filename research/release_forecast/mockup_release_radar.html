<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Release Radar MRI-R24 Mockup — Card + Modal</title>
<style>
/* ---- Reset + base ---- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:13px;line-height:1.5;background:var(--bg);color:var(--text);
  transition:background .2s,color .2s}

/* ---- Light theme ---- */
:root,[data-theme="light"]{
  --bg:#f5f5f7;--panel:#fff;--panel2:#f9f9fb;--line:#e2e2e8;
  --text:#1a1a1a;--muted:#6b7280;--up:#16a34a;--down:#dc2626;
  --warn:#d97706;--accent:#2563eb
}
/* ---- Dark theme ---- */
[data-theme="dark"]{
  --bg:#0f1117;--panel:#1a1d27;--panel2:#1e2130;--line:#2d3347;
  --text:#e8eaf0;--muted:#8b94a8;--up:#4ade80;--down:#f87171;
  --warn:#fbbf24;--accent:#60a5fa
}

/* ---- Controls ---- */
.controls{position:sticky;top:0;z-index:100;background:var(--panel);
  border-bottom:1px solid var(--line);padding:8px 16px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.controls label{font-size:11.5px;color:var(--muted)}
.controls select,.controls button{font-size:12px;padding:3px 9px;
  border:1px solid var(--line);border-radius:5px;background:var(--panel2);
  color:var(--text);cursor:pointer}
.controls button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---- Layout ---- */
.demo-wrap{max-width:1100px;margin:0 auto;padding:20px}
.demo-section{margin-bottom:28px}
.demo-section h3{font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);margin-bottom:12px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.demo-grid-wrap{display:flex;gap:24px;flex-wrap:wrap}
.demo-col{flex:1 1 480px;min-width:340px}
.demo-col-label{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;color:var(--muted);margin-bottom:8px}

/* ---- Language visibility ---- */
[data-lang="en"] .l-zh{display:none}
[data-lang="zh"] .l-en{display:none}

/* ---- RR CSS (copied from template) ---- */
#rr-content h2,.rr-heading{margin:0 0 4px;font-size:15px;font-weight:700}
.rr-subline{font-size:11.5px;color:var(--muted);margin-bottom:14px}
.rr-grid{display:flex;flex-wrap:wrap;gap:12px}
.rr-card{flex:1 1 220px;min-width:200px;max-width:340px;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  position:relative;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.rr-card:hover{border-color:var(--accent);
  box-shadow:0 2px 8px color-mix(in srgb,var(--text) 8%,transparent)}
.rr-card-head{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.rr-card-name{font-size:13.5px;font-weight:700}
.rr-card-period{font-size:10.5px;color:var(--muted)}
.rr-countdown{font-size:10.5px;font-variant-numeric:tabular-nums;padding:1px 6px;
  border-radius:4px;background:var(--panel);border:1px solid var(--line);margin-left:auto}
.rr-proj-row{margin:6px 0 4px}
.rr-proj-label{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.rr-point{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.rr-chips-row{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 4px}
.rr-exp{display:inline-flex;align-items:center;padding:2px 8px;
  border-radius:12px;font-size:10.5px;font-weight:600}
.rr-exp-above{background:color-mix(in srgb,var(--down) 15%,transparent);
  color:var(--down);border:1px solid color-mix(in srgb,var(--down) 30%,transparent)}
.rr-exp-below{background:color-mix(in srgb,var(--up) 15%,transparent);
  color:var(--up);border:1px solid color-mix(in srgb,var(--up) 30%,transparent)}
.rr-exp-aligned{background:color-mix(in srgb,var(--muted) 20%,transparent);
  color:var(--muted);border:1px solid color-mix(in srgb,var(--muted) 30%,transparent)}
.rr-skew{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;
  border-radius:12px;font-size:10.5px;font-weight:600}
.rr-skew-hot{background:color-mix(in srgb,var(--down) 18%,transparent);
  color:var(--down);border:1px solid color-mix(in srgb,var(--down) 35%,transparent)}
.rr-skew-cool{background:color-mix(in srgb,var(--up) 18%,transparent);
  color:var(--up);border:1px solid color-mix(in srgb,var(--up) 35%,transparent)}
.rr-skew-inline{background:color-mix(in srgb,var(--warn) 18%,transparent);
  color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.rr-cov{display:inline-flex;align-items:center;padding:2px 7px;
  border-radius:4px;font-size:9.5px;font-weight:600}
.rr-cov-fresh{background:color-mix(in srgb,var(--up) 15%,transparent);
  color:var(--up);border:1px solid color-mix(in srgb,var(--up) 30%,transparent)}
.rr-cov-partial{background:color-mix(in srgb,var(--warn) 15%,transparent);
  color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.rr-cov-stale{background:color-mix(in srgb,var(--down) 15%,transparent);
  color:var(--down);border:1px solid color-mix(in srgb,var(--down) 30%,transparent)}
.rr-cov-prior{background:color-mix(in srgb,var(--muted) 15%,transparent);
  color:var(--muted);border:1px solid color-mix(in srgb,var(--muted) 30%,transparent)}
.rr-card-conf{font-size:10px;color:var(--muted);margin-top:4px}
.rr-card-conf b{color:var(--text)}
.rr-card-do-note{font-size:9px;color:var(--muted);font-style:italic;margin-top:5px;line-height:1.4}
.rr-card-tap{font-size:9.5px;color:var(--muted);margin-top:5px;text-align:right}
.rr-bmo-note{font-size:11.5px;color:var(--muted);font-style:italic}
.rr-nodata-note{font-size:11px;color:var(--muted);font-style:italic;padding:4px 0}
/* Modal */
.rr-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);
  z-index:9900;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.rr-modal-overlay.open{display:flex}
.rr-modal{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  width:100%;max-width:600px;padding:20px 22px;position:relative;
  box-shadow:0 8px 32px rgba(0,0,0,.28)}
.rr-modal-close{position:absolute;top:12px;right:14px;background:none;border:none;
  font-size:18px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 6px}
.rr-modal-close:hover{color:var(--text)}
.rr-modal-title{font-size:16px;font-weight:700;margin:0 0 2px;padding-right:28px}
.rr-modal-sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}
.rr-modal-section{margin:10px 0}
.rr-modal-section-label{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;color:var(--muted);margin-bottom:5px;padding-bottom:3px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.rr-interval-bar{position:relative;height:8px;border-radius:4px;
  background:var(--panel);border:1px solid var(--line);margin:4px 0 2px;overflow:visible}
.rr-interval-fill{position:absolute;top:0;bottom:0;border-radius:3px;
  background:color-mix(in srgb,var(--up) 35%,transparent)}
.rr-interval-tick{position:absolute;top:-3px;bottom:-3px;width:2px;
  background:var(--text);border-radius:1px}
.rr-interval-labels{display:flex;justify-content:space-between;
  font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rr-bench{margin:6px 0 5px;padding:8px 10px;background:var(--panel);
  border:1px solid var(--line);border-radius:7px}
.rr-bench-label{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);margin-bottom:5px}
.rr-bench-row{display:flex;justify-content:space-between;
  font-size:11.5px;font-variant-numeric:tabular-nums;padding:2px 0}
.rr-bench-name{color:var(--muted)}
.rr-bench-val{font-weight:600}
.rr-meta-row{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:11px;color:var(--muted);margin:5px 0}
.rr-policy{margin:6px 0 4px;font-size:11px;display:flex;flex-wrap:wrap;gap:4px 10px}
.rr-policy-item{color:var(--muted)}
.rr-policy-item b{color:var(--text);font-weight:600}
.rr-empty{font-size:11.5px;color:var(--muted);font-style:italic;padding:6px 0}
.rr-placeholder{color:var(--muted);font-size:12px;font-style:italic;padding:8px 0}
.rr-asof{font-size:10px;color:var(--muted);margin-top:10px}
.rr-footer{font-size:10px;color:var(--muted);margin-top:12px;
  padding-top:8px;border-top:1px solid var(--line);line-height:1.5}
.rr-scoreboard{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.rr-scoreboard-title{font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.rr-track-table{width:100%;border-collapse:collapse;font-size:11px}
.rr-track-table th{font-size:9.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);text-align:left;padding:2px 5px 4px;
  border-bottom:1px solid var(--line)}
.rr-track-table td{padding:2px 5px;font-variant-numeric:tabular-nums;
  border-bottom:1px solid color-mix(in srgb,var(--line) 40%,transparent)}
.rr-comp-section{margin:8px 0 4px}
.rr-comp-label{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.rr-comp-rows{display:flex;flex-direction:column;gap:3px}
.rr-comp-row{display:flex;align-items:center;gap:5px;font-size:10.5px}
.rr-comp-name{width:130px;flex-shrink:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-comp-bar-wrap{flex:1;position:relative;height:8px;border-radius:3px;
  background:var(--panel);border:1px solid var(--line);overflow:hidden}
.rr-comp-bar-fill-pos{position:absolute;top:0;bottom:0;left:50%;
  background:color-mix(in srgb,var(--down) 55%,transparent);border-radius:0 2px 2px 0}
.rr-comp-bar-fill-neg{position:absolute;top:0;bottom:0;right:50%;
  background:color-mix(in srgb,var(--up) 55%,transparent);border-radius:2px 0 0 2px}
.rr-comp-val{width:48px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;
  font-size:10px;color:var(--text)}
.rr-comp-muted{color:var(--muted);font-style:italic}
.rr-conf-section{margin:6px 0 4px}
.rr-conf-bar-wrap{display:flex;height:7px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.rr-conf-seg-known{background:color-mix(in srgb,var(--up) 70%,transparent)}
.rr-conf-seg-proxy{background:color-mix(in srgb,var(--warn) 65%,transparent)}
.rr-conf-seg-residual{background:color-mix(in srgb,var(--muted) 40%,transparent)}
.rr-conf-legend{display:flex;gap:10px;margin-top:3px;font-size:9.5px;color:var(--muted)}
.rr-conf-leg-dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:2px;vertical-align:middle}
.rr-mkt-row{display:flex;align-items:center;gap:8px;font-size:11px;padding:3px 0;border-top:1px dashed var(--line);margin-top:4px}
.rr-mkt-label{color:var(--muted)}
.rr-mkt-val{font-weight:600;font-variant-numeric:tabular-nums}
.rr-mkt-source{font-size:9.5px;padding:1px 5px;border-radius:3px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.rr-sdist-wrap{display:flex;align-items:center;gap:6px;margin:4px 0}
.rr-sdist-bar-wrap{flex:1;display:flex;height:7px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.rr-sdist-hot{background:color-mix(in srgb,var(--down) 60%,transparent)}
.rr-sdist-inline{background:color-mix(in srgb,var(--warn) 50%,transparent)}
.rr-sdist-cold{background:color-mix(in srgb,var(--up) 60%,transparent)}
.rr-sdist-legend{display:flex;gap:7px;font-size:9.5px;color:var(--muted)}
.rr-sens-footer{margin-top:6px;padding-top:5px;border-top:1px solid var(--line);
  font-size:10px;color:var(--muted);line-height:1.6}
.rr-sens-note{font-size:9px;color:var(--muted);font-style:italic;margin-top:1px}
.rr-rev-risk{font-size:10.5px;color:var(--muted);margin:3px 0}
.rr-quirk-row{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 2px}
.rr-quirk-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;
  border-radius:4px;font-size:9.5px;line-height:1.4;
  background:color-mix(in srgb,var(--warn) 18%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--text)}
.rr-quirk-icon{font-size:10px}
.rr-bridge-row{display:flex;align-items:center;gap:5px;font-size:10.5px;padding:1px 0}
.rr-bridge-name{width:130px;flex-shrink:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-bridge-bar-wrap{flex:1;position:relative;height:8px;border-radius:3px;
  background:var(--panel);border:1px solid var(--line);overflow:hidden}
.rr-bridge-fill-pos{position:absolute;top:0;bottom:0;left:50%;
  background:color-mix(in srgb,var(--down) 55%,transparent);border-radius:0 2px 2px 0}
.rr-bridge-fill-neg{position:absolute;top:0;bottom:0;right:50%;
  background:color-mix(in srgb,var(--up) 55%,transparent);border-radius:2px 0 0 2px}
.rr-bridge-val{width:52px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;
  font-size:10px;color:var(--text)}
.rr-bridge-prior{font-size:9px;color:var(--muted);font-style:italic}
.rr-shadow-row{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;margin:6px 0;font-size:11px}
.rr-shadow-label{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.rr-shadow-warn{font-size:9.5px;color:var(--down);font-style:italic;
  border-left:2px solid var(--down);padding-left:6px;margin-top:4px;line-height:1.4}
.rr-modal-do-note{font-size:9.5px;color:var(--muted);font-style:italic;
  margin-top:12px;padding-top:8px;border-top:1px solid var(--line);line-height:1.5}
</style>
</head>

  if(isBenchmarkOnly){projBlock='<div class="rr-proj-row"><div class="rr-proj-label"><span class="l-en">Projection</span><span class="l-zh">预测</span></div><span class="rr-bmo-note"><span class="l-en">Benchmark-only (§6 kill rule)</span><span class="l-zh">仅基准对比（§6规则）</span></span></div>';}
  else if(isNoData){projBlock='<div class="rr-nodata-note"><span class="l-en">Awaiting data — machinery ships, series not yet on disk</span><span class="l-zh">待数据 — 系统就绪，序列未入库</span></div>';}
  else{projBlock='<div class="rr-proj-row"><div class="rr-proj-label"><span class="l-en">Our projection</span><span class="l-zh">本方预测</span></div><span class="rr-point">'+esc(ptStr)+'</span></div>';}
  return'<div class="rr-card" data-idx="'+idx+'">'
    +'<div class="rr-card-head"><span class="rr-card-name">'+relName(rel,rt)+'</span><span class="rr-card-period">'+esc(item.period||'')+'</span><span class="rr-countdown">'+daysLabel+'</span></div>'
    +projBlock
    +(chips?'<div class="rr-chips-row">'+chips+'</div>':'')
    +(conf?'<div class="rr-card-conf"><span class="l-en">Confidence: <b>'+esc(conf)+'</b></span><span class="l-zh">置信度：<b>'+esc(conf)+'</b></span></div>':'')
    +'<div class="rr-card-do-note"><span class="l-en">display-only — not a signal / not consensus 非信号·非共识</span><span class="l-zh">仅展示 — 非信号·非共识</span></div>'
    +'<div class="rr-card-tap"><span class="l-en">tap for detail ▸</span><span class="l-zh">点击查看 ▸</span></div>'
    +'</div>';
}

function renderModal(item){
  var rel=item.release||'',rt=item.release_type||'',proj=item.projection||{};
  var isClaims=rel.toLowerCase()==='claims',isNfp=rel.toLowerCase()==='nfp',isRetail=rel.toLowerCase()==='retail',useK=isClaims||isNfp;
  var isBenchmarkOnly=proj.mode==='benchmark_only',pit=item.pit||{};
  var isNoData=isRetail&&(String(pit.reason||'').indexOf('no_data')!==-1||(proj.p10==null&&proj.p90==null));
  var shadows=item.shadows||{},v3=shadows.v3_factor||null,bridge=shadows.cpi_bridge||null;
  var cf=item.coverage_flags||null,conf=item.confidence,er=item.expectation_read,sk=item.surprise_skew;
  var title=relName(rel,rt);
  var sub=(item.period||'')+(item.release_date?' · '+esc(item.release_date):'')+(item.days_to!=null?' · <span class="l-en">in '+item.days_to+' days</span><span class="l-zh">'+item.days_to+'天后</span>':'');
  var html='<div class="rr-modal-title">'+title+'</div><div class="rr-modal-sub">'+sub+'</div>';
  if(!isBenchmarkOnly&&!isNoData){var chips=expectationChip(er||null)+skewChip(sk||null)+coverageChip(cf||null);if(chips)html+='<div class="rr-chips-row" style="margin-bottom:10px">'+chips+'</div>';}
  if(!isBenchmarkOnly&&!isNoData&&proj.p10!=null){html+='<div class="rr-modal-section"><div class="rr-modal-section-label"><span class="l-en">Projection interval (p10–p90)</span><span class="l-zh">预测区间（p10–p90）</span></div>'+intervalBar(proj)+'</div>';}
  if(item.benchmark_set){html+='<div class="rr-modal-section">'+benchStrip(item.benchmark_set,rel)+'</div>';}
  /* Section 4: Champion attribution (4-block ridge: energy/shelter/core_persistence/pipeline).
     Reads item.components ONLY — does NOT fall back to bridge data (MRI-R26 rework-ui). */
  var champComponents=(item.components&&Array.isArray(item.components)&&item.components.length)?item.components:null;
  if(!isBenchmarkOnly&&!isNoData&&champComponents){html+='<div class="rr-modal-section"><div class="rr-modal-section-label"><span class="l-en">Component attribution</span><span class="l-zh">组件归因</span></div>'+componentsBar(champComponents,rel)+'</div>';}
  /* Section 5: CPI bridge waterfall (6-7 blocks from shadows.cpi_bridge — DISTINCT from section 4). */
  if(!isBenchmarkOnly&&!isNoData&&bridge){html+='<div class="rr-modal-section"><div class="rr-modal-section-label"><span class="l-en">CPI bridge waterfall</span><span class="l-zh">CPI桥接瀑布</span></div>'+cpiBridgeWaterfall(bridge)+'</div>';}
  /* Section 6: Confidence composition — prefer confidence_v2/confidence_components_v2; fallback to coverage_flags proxy. */
  var cv2=item.confidence_v2!=null?item.confidence_v2:conf;
  var cv2comps=item.confidence_components_v2||null;
  if(!isBenchmarkOnly&&!isNoData&&cv2!=null){if(!cv2comps&&cf&&cf.weight_coverage>0){var wc=Number(cf.weight_coverage||0),fp=Number(cf.fresh_proxy_coverage||0),nv=Number(cf.non_vintaged_share||0);cv2comps={w_known:wc*(1-nv),w_proxy:wc*nv+(1-wc)*fp,w_residual:Math.max(0,1-wc*(1-nv)-wc*nv-(1-wc)*fp)};}if(cv2comps){html+='<div class="rr-modal-section"><div class="rr-modal-section-label"><span class="l-en">Confidence composition</span><span class="l-zh">置信度构成</span></div>'+confidenceBar(cv2,cv2comps)+'</div>';}}
  if(!isBenchmarkOnly&&!isNoData&&item.surprise_distribution){html+='<div class="rr-modal-section"><div class="rr-modal-section-label"><span class="l-en">Surprise distribution</span><span class="l-zh">惊喜分布</span></div>'+surpriseDistGauge(item.surprise_distribution)+'</div>';}
  if(item.benchmark_set&&item.benchmark_set.market_implied){var miHtml=marketImpliedRow(item.benchmark_set.market_implied);if(miHtml)html+='<div class="rr-modal-section">'+miHtml+'</div>';}
  if(!isBenchmarkOnly&&!isNoData&&item.reaction_sensitivity){html+='<div class="rr-modal-section"><div class="rr-modal-section-label"><span class="l-en">Reaction sensitivity</span><span class="l-zh">市场反应敏感度</span></div>'+reactionSensRow(item.reaction_sensitivity)+'</div>';}
  if(item.quirk_flags&&item.quirk_flags.length){html+='<div class="rr-modal-section"><div class="rr-modal-section-label"><span class="l-en">Quirk flags</span><span class="l-zh">特殊标记</span></div>'+quirkChips(item.quirk_flags)+'</div>';}
  if(!isBenchmarkOnly&&isNfp&&item.revision_risk){html+='<div class="rr-modal-section"><div class="rr-modal-section-label"><span class="l-en">Revision risk</span><span class="l-zh">修正风险</span></div>'+revisionRiskLine(item.revision_risk)+'</div>';}
  if(!isBenchmarkOnly&&v3){html+='<div class="rr-modal-section"><div class="rr-modal-section-label"><span class="l-en">v3_factor challenger shadow vs champion</span><span class="l-zh">v3因子挑战者 vs 冠军</span></div>'+v3FactorRow(v3,isClaims,isNfp)+'</div>';}
  if(item.policy_backdrop){html+='<div class="rr-modal-section"><div class="rr-modal-section-label"><span class="l-en">Policy backdrop</span><span class="l-zh">政策背景</span></div>'+policyStrip(item.policy_backdrop)+'</div>';}
  html+='<div class="rr-modal-do-note"><span class="l-en">display-only — not a signal / not consensus 非信号·非共识 · model projections, not investment advice · scored forward in public</span><span class="l-zh">仅展示 — 非信号·非共识 · 模型预测，非投资建议 · 正向评分公开记录</span></div>';
  return html;
}

var _items=[];

function openModal(item){
  var overlay=document.getElementById('rr-modal-overlay'),inner=document.getElementById('rr-modal-inner');
  if(!overlay||!inner)return;
  inner.innerHTML=renderModal(item);
  overlay.setAttribute('data-lang',document.documentElement.getAttribute('data-lang')||'en');
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
}
function openCpiModal(){
  var cpi=_items.find(function(i){return i.release_type==='cpi_headline';});
  if(cpi)openModal(cpi);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var o=document.getElementById('rr-modal-overlay');if(o)o.classList.remove('open');document.body.style.overflow='';}});
document.getElementById('rr-modal-overlay').addEventListener('click',function(e){if(e.target===this){this.classList.remove('open');document.body.style.overflow='';}});

// Watch lang changes
new MutationObserver(function(){
  var lang=document.documentElement.getAttribute('data-lang')||'en';
  document.getElementById('rr-modal-overlay').setAttribute('data-lang',lang);
}).observe(document.documentElement,{attributes:true,attributeFilter:['data-lang']});

// Render on load
(function(){
  var d=DATA,upcoming=d.upcoming||[],lastScored=d.last_scored||[],asof=d.asof||'';
  _items=upcoming;
  var cards=upcoming.map(function(item,idx){return renderCard(item,idx);}).join('');
  var content=document.getElementById('rr-content');
  content.innerHTML='<div class="rr-grid">'+cards+'</div>'
    +'<div class="rr-asof"><span class="l-en">as of '+esc(asof)+'</span><span class="l-zh">截至 '+esc(asof)+'</span></div>'
    +'<div class="rr-footer"><span class="l-en">Model projections · display-only · not investment advice · scored forward in public</span><span class="l-zh">模型预测 · 仅展示 · 非投资建议 · 正向评分公开记录</span></div>';
  content.querySelectorAll('.rr-card').forEach(function(el){
    var idx=parseInt(el.getAttribute('data-idx'),10);
    el.addEventListener('click',function(){if(_items[idx])openModal(_items[idx]);});
  });
  document.getElementById('rr-scoreboard-wrap').innerHTML=scoreboardBlock(lastScored);
  // Auto-open CPI headline modal for visual review
  setTimeout(openCpiModal,200);
})();
</script>
</body>
</html>
