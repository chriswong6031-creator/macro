# Lossless machine-readable projection of
# research/imce/IMCE_PREREGISTRATION_AND_EVALUATION_CONTRACT_V1.md
# The MD document BINDS. This YAML carries no independent authority; on any
# apparent divergence, the MD controls. [A26]
# Supersedes IMCE_PREREGISTRATION_CANDIDATE.yaml (schema v0).

schema: imce.preregistration_candidate.v1
status: candidate_not_registered
date: 2026-08-20
binds: research/imce/IMCE_PREREGISTRATION_AND_EVALUATION_CONTRACT_V1.md
supersedes:
  md: IMCE_PREREGISTRATION_AND_EVALUATION_CONTRACT.md
  yaml: IMCE_PREREGISTRATION_CANDIDATE.yaml

authority:
  may_rank: false
  may_gate: false
  may_size: false
  may_escalate: false
  may_trade: false
  may_originate: false

# Registration is a future act (IMCE-03): repository pin and config_hash are
# recorded only at registration, never before. No SHA in this file is
# "registered" today. [A25]
registration:
  registered: false
  repository_pin_observed: null
  config_hash: null
  freezer_of_record: fable_operator
  freeze_location:
    - research/imce/IMCE_PREREGISTRATION_AND_EVALUATION_CONTRACT_V1.md
    - future trial-ledger declared_budget rows (IMCE-03, not yet performed)
  two_commit_discipline: criteria_commit_strictly_precedes_runner_or_outcome_commit

owner_candidate: cycle_pattern
requires_fable_adjudication: true

primary_question: >-
  Conditional on a source-backed mechanism state frozen before the outcome,
  does a fixed market-recognition vector add out-of-sample information beyond
  the mechanism-only baseline for a registered next-state or 63-trading-day
  risk target?

prospective_accrual_first_posture:            # [A24]
  historical_arm_is_promotion_path: false
  historical_arm_role: instrumentation_episode_record_design_validation
  claim_classes:
    - name: cycle_block_claims
      description: forecast_edge
      reachable_from_history: false
      reachable_prospectively: true
    - name: transcription_fidelity_claims       # [G8-B5]
      description: passport_field_reproduction_denominator_crosswalk_fidelity
      natural_replicate: issuer_quarter_row
      reachable_from_history: true
      forecast_authority: none
    - name: coverage_abstention_claims          # [G8-B5]
      description: coverage_and_abstention_calibration
      natural_replicate: effective_block
      denomination: effective_blocks_under_independent_shock_law_with_deff
      row_counts: printed_never_used_as_n
      forecast_authority: none

trials:                                        # [A5][A6]
  - family_candidate: rf.cycle_pattern.imce_phase_v0
    status: not_declared
    cell_budget: 3
    cell_definition: 3 state targets x pooled homebuilder stratum x contrast [M vs family/age prior]
    targets:
      - next_local_state_1_reporting_period
      - next_local_state_3_reporting_periods
      - false_repair_3_reporting_periods
  - family_candidate: rf.cycle_pattern.imce_sync_v0
    status: not_declared
    cell_budget: 2
    cell_definition: targets {next_local_state_1rp, forward_63d_drawdown_tail} x contrast [M+R vs M]
    primary_comparison: mechanism_plus_recognition_vs_mechanism_only
  - family_candidate: rf.cycle_pattern.imce_risk_v0
    status: not_declared
    cell_budget: 1
    cell_definition: forward_63d_drawdown_tail x [M vs family/stratum prior]
    target: forward_63_trading_day_drawdown_tail

historical_cell_budget_total: 6                # [A5]

fdr:                                           # [A6]
  partitions:
    - name: imce_hist_v0
      q: 0.10
      member_cells: 6
      note: single BH-FDR partition over the union of all 6 historical cells; the three rf.* family names are trial-ledger provenance labels, not separate FDR partitions

baselines:                                     # [A22][A23]
  - family_age_prior
  - tape_only
  - mechanism_only
  - recognition_only
  - matched_macro_industry_state
  - shuffled_mechanism_within_time_block
  - pseudo_event_dates
  - structural_epoch_placebo:
      homebuilders: epoch_placebo
      pre_declared_per_cohort: true
  - current_snapshot_backfill_exclusion:
      status: rule_not_control
      rule: absence_of_captured_historical_snapshot_means_not_reconstructable_dropped_never_backfilled
  - leave_issuer_out:
      pre_declared_list: [DHI, PHM, TOL, KBH]
      selection_rule: mechanical_estimability_rule
  - leave_cycle_out: required

secondary_comparisons:                         # [A7]
  in_fdr_partition: false
  budget: 0
  verdict_bearing: false
  print_only: true
  members:
    - R_vs_age_prior
    - M_vs_age_prior
    - M_plus_R_vs_tape_only

validation:
  time_split: rolling_or_expanding_origin_by_calendar_time
  group_split: effective_cycle_block
  embargo_trading_days: 63                     # [A22] was "at least the target horizon"
  prospective_holdout_2024_plus:
    selected: true                             # [A22] was "if that holdout is selected"
    no_parameter_refit: true
  leave_issuer_out: pre_declared_list_DHI_PHM_TOL_KBH   # [A22] was "where_estimable"
  leave_cycle_out: required
  fdr_q: 0.10
  bootstrap:
    unit: episode_or_month_block
    ci_type: one_sided_90_percent            # [A21]
    draws_and_seed: registered_at_preregistration
  min_effective_blocks: 40                   # [A12]
  parameter_ranges: single_frozen_values_required   # [A22] was "preferably single frozen values"; any grid counts into cell budget
  sign_stability_share: 2_of_3_blocks        # [A21]
  materiality_test: sign_survives_every_leave_one_block_out_and_every_leave_one_issuer_out_refit  # [A21]

min_effective_blocks_provenance:               # [A12]
  imported_from: BC-1
  original_unit: monthly_panel_stamps
  ruling: keep_40_for_promote_eligible
  non_promoting_rung:
    exists_today: false
    condition_if_added_later: own_preregistered_floor_plus_hard_authority_ceiling_bound_to_all_false_authority_flags

effective_block_law:                           # [A9]
  unit: independent_shock_realization
  forbidden_inflators: [issuers, rows, targets, horizons, directions, overlapping_windows]
  deff_rule:
    applies_to: issuer_episode_derived_n_effective_blocks
    rho_estimator: frozen_pre_outcome_fit_on_train_folds_only
    raw_block_count: always_printed_alongside_effective_count

frozen_hierarchy:                              # [A10]
  meaning: frozen_in_the_pre_outcome_registration_commit
  cross_cohort_pooling_may_shrink_estimates: true
  cross_cohort_pooling_may_increase_n_effective_blocks: false

issuer_residual_rungs:                         # [A11]
  rung_8:
    min_issuer_episodes: 8
    min_distinct_blocks: 5
    authority: research_only
  rung_12:
    min_issuer_episodes: 12
    min_distinct_blocks: 8
    additional_requirement: matured_prospective_cohort
    authority: requires_separate_promotion
  both_rungs_reachable_for_any_current_cohort: false

frozen_historical_block_list:                  # [A8]
  - name: gfc_bust
    start: 2006
    end: 2009
  - name: gfc_recovery_land_light
    start: 2010
    end: 2013
  - name: taper_2013_partial
    start: 2013
    end: 2013
  - name: grind_2014_2019_incl_2018_air_pocket
    start: 2014
    end: 2019
  - name: pandemic_boom
    start: 2020
    end: 2021
  - name: rate_shock_cancellation_spike
    start: 2022
    end: 2023
  - name: affordability_incentive_era
    start: 2024
    end: 2026
change_requires: new_amendment_log_entry

reachable_status_table:                        # [A1]
  celh:
    honest_historical_blocks: barred_by_rule
    historical_cells: 0
    max_reachable_ladder_rung_on_history: DESCRIPTIVE
  homebuilders:
    honest_historical_blocks: "5-7"
    historical_cells: 6
    fdr_partition: imce_hist_v0
    fdr_q: 0.10
    max_reachable_ladder_rung_on_history: REGISTERED_TO_REPLAYED_ESTIMATION_ONLY
    never_reaches: [DISPLAY, PROMOTE_ELIGIBLE]
  memory:
    honest_historical_blocks: "2 completed + 1 open (ungradeable)"
    historical_cells: 0
    max_reachable_ladder_rung_on_history: REGISTERED
  banks:
    honest_historical_blocks: "~3, 0 PIT-clean"
    historical_cells: 0
    max_reachable_ladder_rung_on_history: DESCRIPTIVE_FEASIBILITY
preregistered_expectation: no_cohort_can_satisfy_min_effective_blocks_40_on_historical_data_all_historical_cell_statuses_fixed_pre_outcome

predetermined_historical_status:               # [A2][A3]
  status_labels:
    - promoted_null
    - underpowered_accruing
  label_assignment: mechanical_by_preregistered_n_eff_vs_floor_computed_pre_outcome_never_post_hoc
  all_6_historical_cells_prelabeled: underpowered_accruing
  requeue_pointer_semantics: per_house_research_factory_runbook
  sub_floor_nominal_pass:
    outcome_label: underpowered_accruing
    point_estimate_status: archived_descriptive_only    # [G8-B7] prior-carry deleted
    role_in_prospective_cells: none
    prospective_cells_graded: prior_free
    display: false
    truth_statement: false
    citation: false
  status_governance:                            # [G8-M7]
    underpowered_accruing_is: research_factory_trial_ledger_status_only
    cpi_truth_status: forbidden_without_schema_and_consumer_matrix_amendment

celh:
  role: descriptive_autopsy_only
  may_enter_inferential_sample: false
  status: barred
  historical_cells: 0

memory:                                        # [A14][A15]
  honest_n_completed_episodes: 2
  honest_n_open_episodes: 1
  open_episode_gradeable: false
  status: registered_only
  historical_inferential_cells: 0
  leave_cycle_out_defined_at_b2: false
  two_axis_coupling:
    axes: [legacy, hbm]
    causally_coupled: true
    coupling_date: "2025-01-01"
    treated_as_two_strata: false
    treated_as_two_blocks: false
    mechanism_grammar_epochs_cross_folds: false

homebuilders:                                  # [A1][A17][A18][G8-B4][G8-M2][G8-M6]
  honest_historical_blocks_min: 5
  honest_historical_blocks_max: 7
  historical_cells: 6
  max_reachable_ladder_rung_on_history: REGISTERED_TO_REPLAYED_ESTIMATION_ONLY
  never_reaches: [DISPLAY, PROMOTE_ELIGIBLE]
  episode_rekey_basis: calendar_month
  fiscal_to_calendar_crosswalk: frozen_pre_outcome
  survivorship:
    roster_is_2026_survivor_roster: true
    episode_substrate_survivor_stamped: true
    hb0_must_produce_named_delisted_bankrupt_acquired_census: true
    until_then_every_readout_carries_survivorship_disclosure: true
    cohort_mean_without_disclosure: forbidden
  epoch_clock_rule:
    operating_clock_epochs: descriptive_only
    recognition_outcome_partitions_use: available_at_boundaries
    epochs_frozen: before_any_outcome_inspection
  vintage_rider:
    hb0_per_source_vintage_audit: required
    vintage_less_leg_pit_class: revision_optimistic_disclosed
  cancellation_rate_denominator:
    canonical_per_issuer: single_frozen_with_printed_conversion
    alternate_convention_sensitivity_rerun: mandatory
    flip_under_alternate_convention: not_a_pass
  len:
    excluded_from_cancellation_rate_cells: true
    exclusion_reason: era_correlated_missingness_no_press_release_cancellation_rate
    break_flag: millrose_2025_02
    exclusion_printed: true
  nvr:
    treatment: separate_stratum_or_designated_transfer_test
    pooled_to_raise_n: false
    inclusion_exclusion_frozen_pre_outcome: true

banks:                                         # [A1][A13]
  honest_historical_blocks: 3
  pit_clean_historical_blocks: 0
  historical_cells: 0
  status: feasibility_only
  max_reachable_ladder_rung_on_history: DESCRIPTIVE_FEASIBILITY
  call_report_ubpr_fry9c_historical_data: not_reconstructable
  reconstructed_as_of_from_revised_series: forbidden
  bank_cell_declaration_precondition:
    prospective_self_archival_lane_required: true
    lane_fields: [start_date, archive_manifest, hash_pinned_vintage_per_cutoff, observation_date_per_cutoff]

ordinal_sensors:                               # [A16]
  fields:
    - samsung_wafer_starts
    - samsung_asp
    - skhynix_wafer_starts
    - skhynix_asp
  level: directional_only_ordinal
  forbidden_in_cardinal_cells: true
  directional_field_entering_cardinal_model: missingness_event_never_imputation

recognition_vector_design_provenance:          # [A4][G8-M10][G8-B3]
  r_t_frozen_at: imce_00_architecture_freeze_2026_08_20_before_wave_a1
  constructions_named_a_priori:
    fixed_anchor_2w_macd: engine_technicals_macd_hist_classic_12_26_9
    confluence_contract_reference: engine_canon_w2_bull_rsi_macd
    third_implementation: forbidden
  g2_unregistered_descriptive_tape:
    status: quarantined_census_evidence
    citable_by_truth_statement_display_or_registered_cell: false
    r_t_fields_changed_after_it_existed: false
  fallback_disjunction: deleted_as_unexecutable

missingness_law:                               # [A19][A20]
  missing_never_zero: true
  not_licensed_separate_from_missing: true
  not_reconstructable_separate_from_missing: true
  primary_comparison_population: same_eligible_population_for_baseline_and_challenger
  complete_case_mechanical_test:
    hashed_population_manifest: frozen_pre_outcome
    metrics_reported_on: intersection_population
    dropped_row_counts_reported_by_reason: true
  era_correlated_missing_indicator_in_primary_comparison: forbidden
  disclosure_alone_sufficient: false
  coverage_degradation_can_demote_or_abstain: true
  coverage_degradation_imputed_by_llm: false

horizon_law:                                   # [A22][A26]
  market_primary: 63_trading_days
  market_diagnostic_5d:
    exists_automatically: true
    role: non_claim_diagnostic
    in_fdr_partition: false
    verdict_bearing: false
  market_diagnostic_21d:
    exists_automatically: true
    role: non_claim_diagnostic
    in_fdr_partition: false
    verdict_bearing: false
    genuine_21d_claim_requires: own_declared_budgeted_cell
  horizon_126d:
    qledger_claim_permitted: false
    role: off_render_descriptive_only
  off_horizon_verdicts: forbidden

stop_conditions:                               # [A25]
  - architecture_not_accepted
  - episode_anchor_unresolved_for_required_join
  - rights_unresolved
  - pit_not_reconstructable
  - effective_n_below_floor
  - structural_epoch_not_frozen
  - criteria_commit_does_not_precede_outcome_access
  - reachable_status_table_not_recorded            # [A25] new

prospective_law:                               # [A24]
  nightly_is_sole_forward_ledger_advancer: true
  first_observation_wins_per_cutoff_episode: true
  historical_backfill_into_prospective_cohort: forbidden
  corrections: append_and_supersede_never_rewrite_original_packet
  market_and_mechanism_outcomes_accrue_separately: true
  live_and_backtest_badges_blend: false
  come_back_date:
    computed_from: [accrual_rate, n_floor]
    published_at_registration: true
    homebuilders_estimate: "~2145 at census accrual rate"
    memory_and_banks: later_still
  counters:
    n_blocks_hist: 0
    n_blocks_prosp: 0
  preregistered_minimum_prospective_share_before_promotion: required_value_tbd_at_registration

authority_ladder:
  sequence: [DESCRIPTIVE, REGISTERED, REPLAYED, DISPLAY, PROSPECTIVE_SHADOW, PROMOTE_ELIGIBLE]
  step_implies_next: false
  historical_arm_is_promotion_path: false        # [A24]
  prophet_opportunity_authority_requires: separate_decision_and_consumer_contract
  position_sizing_requires: additional_independent_gate
