        basis_field: short_int__basis
        missingness_field: short_int__absent
        reason_field: short_int__reason
        max_staleness_sessions: 21   # monthly FINRA settlement cycle
        null_semantics: unmeasured
        pit_status_change_note: >-
          PIT STATUS MOVED snapshot_not_pit -> pit_settlement IN PR-2, on #5602's merged
          fix (2026-08-14).  Producer knowability RECONCILED IN #5705 (merged
          2026-08-15 as 7811075a): `lib/finra_knowable.py` defines the 8th NYSE session
          strictly after settlement (`KNOWABLE_LAG_SESSIONS = 8`), then `_si_normalise`
          floors that date by the stored `knowable_date` and by `capture_date` (monotone
          later only).  The retired `settlement + 10 calendar days` rule is gone from
          the producer; it under-waited 2-3 days on every committed settlement and
          preceded capture on every row.  BACKTEST ADMISSION (PR-3A): `pit_settlement`
          is in the arena's BACKTEST_LAWFUL_STATUSES because the #5705 producer law is
          the registered publication-lag gate.  PIT-lawful is NOT estimable.  Three
          caveats BIND every consumer.
          (1) DEPTH: committed history is 3 settlements; under #5705 the first
          knowable date is 2026-07-22 (the 06-30 settlement's capture floor), not
          2026-07-10.  Re-run scripts/backfill_finra_short_interest.py before any deep
          historical join (the 2018+ panel parquet is absent on the primary checkout)
          — a three-settlement series supports coverage receipts, not inference.
          (2) BASIS MIXING: the five stamped store columns above are the snapshot-era
          emission; `short_int__knowable_date` joins the store schema only when
          reconstruction rows stamp.  Key on `basis_field` — a frame mixing
          `pit_settlement` and `snapshot_not_pit` bases without disclosure is not a
          PIT frame.
          (3) LAG PROVENANCE: cite `lib/finra_knowable.py` / #5705.  Do not cite the
          retired `_SI_KNOWABLE_LAG_DAYS = 10` comment as current law.
        note: >-
          `settlement_date` is the OBSERVATION date, not the publication date (FINRA
          publishes ~8 sessions later) — the reader's knowable_date gate is what makes a
          historical resolution lawful, and any deep join must keep joining on
          publication knowability, never on settlement alone.

