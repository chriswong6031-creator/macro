  F8_ATTENTION_CROWDING:
    title: Attention and crowding
    # Probe = attention.  measured 2026-08-07: attention__views 0.588 board / 0.691 curated
    # in the COMMITTED parquet — the stamped column survives even though the `data/attention`
    # STORE is host/R2-only.  NO OVERRIDE: 0.588 clears 0.50 only on the host-stamped frame,
    # and a clone/CI frame that reconstructs attention from the store sees ZERO.  Lowering
    # the floor would hide exactly that (§4.2 flag 4).  F8 abstains wherever attention is
    # dark, which is the correct behaviour and is reported, not repaired by the floor.
    #
    # HONEST STATE: after the ext_z, theme-heat and turnover single-home rulings, F8 has NO
    # wired feature column that is `pit`.  Its crowding hypotheses are §10.7 registered
    # interactions and orthogonalized derivatives of F2/F5 — not memberships.  This family is
    # thin BY LAW, and that is the anti-double-count law working, not a gap to fill.
    coverage_floor: 0.50
    max_staleness_sessions: 1        # attention refreshes daily on the host
    shared_upstream: >-
      Blowoff shares its price-derivation with F2 (correlation reported in the §5.3 blocks).
      The S-C theme-heat-as-crowding read and any extension-as-crowding read enter ONLY as
      §10.7 registered interactions or F2/F5-orthogonalized derivatives — NEVER as second
      memberships.
    members:
      - name: attention
        source: data/attention (host/R2-only) -> Context Snapshot `attention` dim
        columns: [attention__views, attention__log_views]
        pit_status: forward_only
        availability_field: attention__as_of
        basis_field: attention__basis
        missingness_field: attention__absent
        reason_field: attention__reason
        host_only: true
        null_semantics: unmeasured
        coverage_probe: true
        note: >-
          HOST-ONLY: the `data/attention` store is not in git, so a clone/CI reconstruction
          sees zero coverage while the committed CV column still carries stamped values —
          two different readings of the same dim.  `forward_only`: with no clone-visible
          history there is nothing to reconstruct backwards, so it is excluded from backtest
          frames and accrues forward.  Arena reports MUST print per-dimension coverage so
          host-only darkness cannot masquerade as a null result (§4.2 flag 4).

      - name: news_burst
        source: news-burst detector
        # PR-1b: `news_burst` WIRED from the graded-board frame — the board's own chip,
        # fired on >= 3 recent items (scripts/grade_us_board.py:768).
        columns: [news_burst]
        planned_columns: [news_burst_z]
        wired: true
        wired_from: us_board_ledger/retro_grades.parquet
        pit_status: pit
        availability_field: as_of
        null_semantics: measured_negative
        pit_status_change_note: >-
          PIT STATUS MOVED forward_only -> pit IN PR-1b, and the move is scoped to the
          LEDGER WIRING ONLY.  `forward_only` was correct while this member's only route
          to a frame was the host-only attention store, which a clone or a CI run cannot
          see backwards — with no clone-visible history there is nothing to reconstruct.
          The graded-board ledger is a DIFFERENT route with a different verdict: the chip
          is a frozen published payload stamped under the board's own `as_of`, committed
          to git, and reconstructible by anyone with the repo.  BINDING ON THE NEXT
          EDITOR: `news_burst_z` is still planned and still routes through the host-only
          store.  When it wires, it must carry its OWN pit verdict — it does not inherit
          this one, and a member cannot launder a store's darkness by sharing a name with
          a store that is lit.
        sign_note: >-
          THE WEAKEST A-PRIORI SIGN IN THE C1 SET, named as such rather than buried.  The
          filed direction is POSITIVE (attention arriving with a catalyst on an
          already-admitted name).  F8's charter also carries a CROWDING reading under
          which a burst is NEGATIVE.  §5.1 forbids a second membership for the second
          hypothesis, so the crowding read is a §10.7 registered interaction for a later
          rung — never a rival sign here, and never a sign chosen by looking at which one
          scored better.

      - name: blowoff_risk
        source: engine/roc_blowoff.py
        columns: []
        planned_columns: [blowoff_state]
        wired: false
        pit_status: pit
        availability_field: stamp_date
        null_semantics: unmeasured
        note: >-
          Shares price-derivation with F2's `ext_z` (see `known_redundancy_edges`).  Admitted
          to F8 only as an F2-orthogonalized derivative once the correlation is measured in
          the §5.3 blocks; before that measurement it is display-tier here.

      - name: crowding_flags
