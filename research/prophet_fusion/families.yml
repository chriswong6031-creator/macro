        basis_field: options__basis
        missingness_field: options__absent
        reason_field: options__reason
        max_staleness_sessions: 3    # chain store refreshes ~2-3x/week
        era_break: "2026-08-07"
        null_semantics: unmeasured
        coverage_probe: true
        note: >-
          §5.2: options NON-scalars stay research-side.  Only the scalar dim fields above are
          features.  Pooled inference across the 2026-08-07 chain-store era boundary requires
          disclosure (§7 era hygiene).

      - name: short_interest
