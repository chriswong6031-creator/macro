        columns: []
        planned_columns: [crowding_flag_state]
        wired: false
        pit_status: forward_only
        availability_field: null
        null_semantics: unmeasured

# ---------------------------------------------------------------------------
# §5.2 Composite-decomposition law.  These are lineage edges that FORBID VOTES.
# The harness refuses each `composite` below as a raw feature and accepts only the typed
# legs named in `decompose_to`, each routed to exactly one family.
# ---------------------------------------------------------------------------
forbidden_composites:

  - composite: opportunity_score
    owner: engine/intel_hub.py
    reason: >-
      The hub's own feeders (news / alt / radar / buy-board / policy) already overlap F1-F4,
      and its buy-board leg LITERALLY READS THE BOARD'S POPULATION — hub agreement with
      Prophet is substantially self-agreement.  A blended hub scalar is that self-agreement
      cast as an independent vote.
    decompose_to:
      - {input: leading_vs_lagging_gap, family: F3_THEME_STRUCTURE}
      - {input: lifecycle_stage, family: F3_THEME_STRUCTURE}
      - {input: edge_remaining, family: F3_THEME_STRUCTURE}
      - {input: isolated_pre_consensus_flag, family: F8_ATTENTION_CROWDING}
      - {input: feeder_directions_strengths, family: F4_CATALYST_EVENT}
      - {input: signal_governor_trust, family: F6_MACRO_REGIME}
      - {input: contradiction_intensity, family: F6_MACRO_REGIME}
      - {input: source_provenance, family: F6_MACRO_REGIME}

  - composite: composite_conviction
    owner: engine/intel_hub.py
    reason: "Same hub self-agreement lineage as `opportunity_score`; never ingested as a scalar."
    decompose_to:
      - {input: leading_vs_lagging_gap, family: F3_THEME_STRUCTURE}
      - {input: lifecycle_stage, family: F3_THEME_STRUCTURE}
      - {input: edge_remaining, family: F3_THEME_STRUCTURE}
      - {input: isolated_pre_consensus_flag, family: F8_ATTENTION_CROWDING}
      - {input: feeder_directions_strengths, family: F4_CATALYST_EVENT}
      - {input: signal_governor_trust, family: F6_MACRO_REGIME}
      - {input: contradiction_intensity, family: F6_MACRO_REGIME}

  - composite: conviction
    owner: engine/stock_score.py
    reason: >-
      MEASURED ANTI-PREDICTIVE as an ordering (US_BOARD_MEASUREMENT §1).  A blended scalar
      that is anti-predictive is not a weak feature, it is a wrong one; its legs may still
      carry signal and must be raced separately.
    decompose_to:
      - {input: momentum_leg, family: F2_MOMENTUM_EXTENSION,
         constraint: "dedup against residual_alpha first — rho = 0.984 (us_board_rank.py:1475)"}
      - {input: revisions_leg, family: F4_CATALYST_EVENT}
      - {input: vol_leg, family: F8_ATTENTION_CROWDING}

  - composite: composite_z
    owner: engine/stock_score.py
    reason: "The z-scored form of `conviction`; same anti-predictive measurement, same law."
    decompose_to:
      - {input: momentum_leg, family: F2_MOMENTUM_EXTENSION,
         constraint: "dedup against residual_alpha first — rho = 0.984"}
      - {input: revisions_leg, family: F4_CATALYST_EVENT}
      - {input: vol_leg, family: F8_ATTENTION_CROWDING}

  - composite: setup
    owner: engine/setups.py
    reason: "Display-only blended setup label, measured with `conviction` in the same anti-predictive leg."
    decompose_to:
      - {input: momentum_leg, family: F2_MOMENTUM_EXTENSION,
         constraint: "dedup against residual_alpha first — rho = 0.984"}
      - {input: revisions_leg, family: F4_CATALYST_EVENT}
      - {input: vol_leg, family: F8_ATTENTION_CROWDING}

  - composite: confluence_k
    owner: scripts/grade_us_board.py (`confluence_plus.k`)
    reason: >-
      PR-1b.  A COUNT OF AGREEING EVIDENCE, which is the anti-double-count budget spent
      as a single ballot.  `k` says how many confirmers lit up; it does not say WHICH,
      so a model reading it cannot be asked the §16.3 correlated-evidence question at
      all, and two confirmers that share an upstream count as two.  §5.1's whole
      construct is that agreement among lineage-sharing lobes is ONE fact, not N — a
      raw k is that error in numeric form.  Admissible only decomposed into the
      per-confirmer flags, each already homed below.
    decompose_to:
      - {input: signal_gate_cascade, family: F1_TECHNICAL_CONFLUENCE}
      - {input: sue_surprise, family: F4_CATALYST_EVENT}
      - {input: smart_money_board_chip, family: F5_FLOW_POSITIONING}
      - {input: insider_panel, family: F5_FLOW_POSITIONING}
      - {input: options_state, family: F5_FLOW_POSITIONING}
      - {input: news_burst, family: F8_ATTENTION_CROWDING}

  - composite: potential_score
    owner: engine/name_score.py
    reason: >-
      The rival in-house composite.  It is the arena's G2 BASELINE (§8.1) — raced as an
      ordering on one ruler — and is therefore never also a FEATURE: a baseline ingested as
      evidence cannot be beaten by anything, it is merely re-fit.  Its components decompose
      as below.
    decompose_to:
      - {input: trigger, family: F1_TECHNICAL_CONFLUENCE}
      - {input: fuel, family: F2_MOMENTUM_EXTENSION}
      - {input: survive, family: F8_ATTENTION_CROWDING}
      - {input: tailwind, family: F3_THEME_STRUCTURE}
      - {input: confidence, family: F6_MACRO_REGIME}
      - {input: edge_mult, family: F4_CATALYST_EVENT}
      - {input: edge_mult, family: F5_FLOW_POSITIONING}

# ---------------------------------------------------------------------------
# §5.1 / §5.2 known redundancy edges.  ASSERTED FROM RECEIPTS TODAY, re-measured in PR-2
# under the §5.3 plan (Spearman blocks, conditional MI, cross-fitted residualization,
# per-family leave-one-out ablations).  These are the priors an "N families agree" claim
# must be audited against.
# ---------------------------------------------------------------------------
known_redundancy_edges:

  - pair: [F2_MOMENTUM_EXTENSION.residual_alpha, F2_MOMENTUM_EXTENSION.composite_momentum_leg]
    relation: "Spearman rho = 0.984"
    kind: same_quantity_renamed
    source: "engine/us_board_rank.py:1475 comment, via masterplan §5.1 F2"
    consequence: >-
      THE canonical documented double-count.  The momentum leg IS residual alpha under a new
      name; it may enter only as an orthogonalized residual, never as a second vote.

  - pair: [F2_MOMENTUM_EXTENSION.total_return_z, F2_MOMENTUM_EXTENSION.residual_alpha]
    relation: "corr = +0.37"
    kind: shared_price_derivation
    source: "masterplan §5.1 F2"
    consequence: "Same-family budget; both may enter but share one family budget, not two."

  - pair: [F8_ATTENTION_CROWDING.blowoff_risk, F2_MOMENTUM_EXTENSION.extension_z]
    relation: "shared price-derivation; correlation to be reported in the §5.3 blocks"
    kind: shared_price_derivation
    source: "masterplan §5.1 F8"
    consequence: >-
      Blowoff is admitted to F8 only as an F2-orthogonalized derivative once measured;
      until then it is display-tier and carries no F8 vote.

  - pair: [F3_THEME_STRUCTURE.hub_theme_leg, "F1_TECHNICAL_CONFLUENCE..F4_CATALYST_EVENT"]
    relation: "hub feeders (news / alt / radar / buy-board / policy) overlap F1-F4"
    kind: shared_upstream_feeders
    source: "masterplan §5.2 Intelligence Hub; engine/intel_hub.py:845-850 reads signal_gate.json"
    consequence: >-
      Hub agreement with Prophet is substantially SELF-agreement — the dependency runs from
      the hub INTO the board's own gate artifact, and the buy-board leg reads the board's
      population.  Only typed decomposed hub inputs are admissible (see
      `forbidden_composites`), and even those share the receiving family's budget.

  - pair: [F5_FLOW_POSITIONING.insider_panel, "insider_intel chips / name_score edge blend / hub clusters"]
    relation: "one `sec_insider` panel reaches >=3 surfaces"
    kind: single_producer_multiple_surfaces
    source: "masterplan §5.1 F5"
    consequence: "A chip agreeing with the dim is self-agreement, not confirmation. One vote."

  - pair: [F3_THEME_STRUCTURE.theme_membership, "F3 theme_heat / relay_window / basket_turn_state"]
    relation: "one producer (`data/baskets/*`) feeds membership, chips, basket-turn cohorts AND relay windows"
    kind: single_producer_multiple_surfaces
    source: "masterplan §5.1 F3"
    consequence: >-
      Agreement among these is ONE fact, not four.  This is why relay is homed in F3 rather
      than treated as an independent structural read.

  - pair: [F1_TECHNICAL_CONFLUENCE.entry_stage, F1_TECHNICAL_CONFLUENCE.cycle_ladder]
    relation: "both read the same underlying state (`name_score._trigger` reads both)"
    kind: shared_upstream_state
    source: "masterplan §5.1 F1"
    consequence: "One MACD/StochRSI machinery family-wide; same family budget."

  - pair: [F5_FLOW_POSITIONING.options_state, "options internals (charm / DOI / trail-RV)"]
    relation: "heavily cross-correlated; documented charm/DOI kills cite trail-RV IC 0.5-0.6 confounds"
    kind: shared_upstream_state
    source: "masterplan §5.1 F5"
    consequence: "Options sub-features are one budget; an internals ensemble is not breadth."
