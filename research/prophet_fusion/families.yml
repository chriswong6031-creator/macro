    shared_upstream: >-
      Options internals are heavily cross-correlated (the charm/DOI kills cite trail-RV
      IC 0.5-0.6 confounds).  The SINGLE `sec_insider` panel reaches >=3 surfaces
      (insider_intel chips + the `insider__` dim + name_score's edge blend + hub clusters) —
