    shared_upstream: >-
      Row-constant per night — cross-sectionally DEGENERATE BY CONSTRUCTION.  Lawful only as
      router / interaction axes (§10.2), NEVER as cross-sectional rankers.  Before any router
      axis is used, `engine.regime_conditioning_coverage.assess()` must return `estimable`
      for that axis on the training frame (§9.10, `DNR:KILL-PER-SIGNAL-FAMILY-RELIABILITY`
      compliance): the 2026-08-05 kill measured the family x regime interaction 3.8x SMALLER
      than the family main effect, and the router must beat that bar on estimable cells.
    members:
