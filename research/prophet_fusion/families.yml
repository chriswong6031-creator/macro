    members:
      - name: options_state
        source: engine/options_flow.py + engine/gex_confirm.py -> Context Snapshot `options` dim
        # PR-1b: `gex_confirm_verdict` WIRED from the graded-board frame — the same
        # producer (engine/gex_confirm.py) reaching the board as its published verdict.
        # SIGN comes from the producer's own vocabulary, `_LABEL` + confirm_at/caution_at
        # (gex_confirm.py:45-52, applied :177): confirm = +1, neutral = 0, caution = -1.
        # There is NO "infirm" value.  The module's charter — "a confirmer can only LOWER
        # confidence, never manufacture a buy" — is why this is a confirmer, not a ranker.
        columns: [options__skew, options__gex, gex_confirm_verdict]
        wired_from: [candidates, us_board_ledger/retro_grades.parquet]
        ledger_availability_field: as_of
        pit_status: pit
