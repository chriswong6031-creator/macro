# Prophet US Conditional Intelligence Fusion — evidence-family registry (v1)
#
# THIS FILE IS THE LAW.  The masterplan's §5.1 table is its prose view
# (`research/PROPHET_CONDITIONAL_FUSION_MASTERPLAN_BY_FABLE.md`, §5.1/§5.2, PIT verdicts
# §4.1/§4.2, staleness/abstention semantics §7 O6, join law §9.1).  Where prose and this
# file disagree, this file governs and the prose is amended.
#
# WHAT IT IS FOR.  Every feature the fusion model ever sees belongs to exactly ONE family.
# Families are the unit of anti-double-count budgeting (§10.6) at every arena rung C1–C5.
# The registry exists so that law is enforced by a test over a machine-readable file, never
# by prose: see `tests/test_prophet_fusion_families.py`.
#
# WHAT IT IS NOT.  It carries no authority.  It ranks nothing, sizes nothing, gates nothing,
# originates no signal, escalates nothing.  The `authority:` block below is the pin; a PR
# that flips any of those booleans is a doctrine amendment, not a refactor.
#
# CENSUS RECEIPT.  Every `# measured …` comment in this file was read on 2026-08-14 from
# `data/us_prophet_rank/candidates/2026-08.parquet` (7,759 rows; stamps 2026-08-05/06/07).
# "board frame" = the 153 rows with `tier == "curated" AND eligible == True` on the
# 2026-08-07 stamp — the only stamp in the file that carries curated rows.  "curated frame"
# = all 1,717 curated rows.  Coverage numbers rot: they are a dated receipt, not a contract.
# The contracts are the `coverage_floor` / `max_staleness_sessions` / `pit_status` fields.

schema: prophet_fusion.families.v1

# ---------------------------------------------------------------------------
# Anti-authority-creep pin.  All five are false and stay false for this artifact.
# ---------------------------------------------------------------------------
authority:
  can_rank: false
  can_size: false
  can_gate: false
  can_originate_signal: false
  can_escalate: false

# ---------------------------------------------------------------------------
# Frame plumbing.  Join keys and identity columns are NEVER features — they are
# excluded from the one-column-one-family uniqueness pool by construction.
# ---------------------------------------------------------------------------

# §9.1: context features join on (stamp_date, ticker, board_definition); §7 Population:
# "curated only" joins on `tier == "curated"`.
frame_keys: [stamp_date, ticker, board_definition, tier]

# Orphan guard.  Read 2026-08-14: the registry homes ALL 180 columns of the pinned schema
# exactly once, across families + frame_keys + frame_identity + strata + baseline_roles +
# excluded_columns.  The store self-heals FORWARD by schema union (§13 adds telemetry columns
# within days), so a NEW column must not red the suite — but a member deleted out from under
# its columns must.  The test therefore asserts accounted >= n_columns, never equality.
store_schema_pin:
  file: data/us_prophet_rank/candidates/2026-08.parquet
  stamp: "2026-08-07"
  n_columns: 180

# ---------------------------------------------------------------------------
# WIRED-FROM DATING (PR-1b).  A member's `columns:` are validated against the schema of
# the store(s) it is WIRED FROM, not against one hard-coded store.
#
# WHY THIS BLOCK EXISTS.  The `sue_surprise` note below records the trap it closes: the
# planned-vs-real vise had NO GREEN STATE across a wiring transition.  A member wired
# from a second store had to either claim a column the candidates store lacks (phantom
# column -> red) or leave the column unhomed (unregistered feature -> the harness refuses
# it).  The arena races on the GRADED-BOARD frame (§8.5 frame 2) whose columns live in
# `data/us_board_ledger/retro_grades.parquet`; those columns are real evidence with a
# real home, and pretending otherwise pushed them outside the anti-double-count budget.
#
# THE CHECK STAYS STRICT.  `wired_from` NARROWS, never widens: a member declaring a store
# must have every claimed column in THAT store (or, for a dual-wired member, in one of
# the stores it names).  A member declaring nothing keeps the original candidates-store
# rule byte-for-byte.  A typo is still a red.
wired_from_stores:
  candidates:
    file: data/us_prophet_rank/candidates/2026-08.parquet
    default: true
    note: "The wide-context PIT frame (§8.5 frame 1). The default for every member."
  us_board_ledger/retro_grades.parquet:
    file: data/us_board_ledger/retro_grades.parquet
    default: false
    availability_field: as_of
    pit_rationale: >-
      PIT for this frame BY CONSTRUCTION, verified not asserted: every column below is
      read by `scripts/grade_us_board.py::_row_features` off `r`, the FROZEN PUBLISHED
      BOARD PAYLOAD for that night (git-history boards unioned with snapshots.jsonl),
      and stamped under the board's own `as_of`.  Nothing is re-derived from a mutable
      latest.json, and no derived statutory lag is used as a join key (§9.1).  The
      availability field is therefore the store's OWN publication stamp, `as_of`.
    null_semantics_caveat: >-
      The chip constructors coerce with `bool(...)`, so a missing KEY on a
      schema-era board also lands as False — `bool(None)` is False — which means
      the False-vs-NaN distinction in the parquet is PER-ERA, never per-name: whole
      pre-schema dates (boards before 2026-06-30) read back NULL, while on any
      schema-era date every name reads a bool and an individually-absent producer
      is indistinguishable from measured_negative (verified 2026-08-14: coverage is
      exactly 0.000 on 06-15..06-24 and exactly 1.000 on all 17 later dates — no
      intra-date nulls exist anywhere).  The arena reports coverage per date so the
      era boundary cannot masquerade as a measured null.

# On the row but not evidence: board bookkeeping.  `sector` is identity — the sector
# EVIDENCE column is `sector__sector_node`, homed in F3.
frame_identity: [name, sector, lane, eligible, buyable]

# §7 era hygiene: era stamps enter as STRATA, never as features.  As features they are
# row-constant per night and would inherit F6's cross-sectional degeneracy; as strata they
# fragment n, and the fragmentation is the honest cost and is reported.
# `board_definition` is both a join key and a stratum — that is intentional.
strata:
  columns: [board_definition, selection_era, anchor_era]
  excluded_eras:
    - id: disclosed_null_era
      range: "2026-08-03..2026-08-06"
      action: exclude          # never imputed (`data/us_board_ledger/README.md`)
  era_boundaries:
    - {id: price_basis, date: "2026-08-06", note: "grades-store fill basis break"}
    - {id: options_chain_store, date: "2026-08-07", note: "options era_break, see F5.options_state"}
    - {id: score_scale_v1_v2, note: "replayed v1-era scores diverge up to 16.3 pts from published (§6.6)"}
    - {id: cv_universe_widening, note: "08-05/06 curated rows = 0, 08-07 = 1,717; coverage is reported PER STAMP DATE, never pooled across this break"}

# Ranker / board OUTPUTS.  Arena BASELINES, never features: ingesting a score as
# evidence reproduces that ranker by construction.  Roles are DEFINITION-AWARE.
# A timeless `champion_baseline.columns` list is forbidden — on us_prophet_v3 the
# canonical prophet_score is C1, not the retired v2 heuristic (DSC:CHAMPION-BASELINE-
# COLUMNS-CARRY-THE-CHALLENGER).  The W3 reader must never infer comparator identity
# from a bare column name.
baseline_roles:
  published_ranker_output:
    columns: [prophet_score, score_rank, display_rank]
    interpreted_under: board_definition
    note: >-
      Canonical published score/rank.  Meaning follows board_definition: v2/v2_fallback
      rows carry the retired heuristic; us_prophet_v3 rows carry C1.  Always pair with
      board_definition.  Not a shadow comparator by column name alone.
  retired_shadow_output:
    columns:
      # Order matches engine.us_context_vector.SHADOW_COLUMNS (store family).
      - prophet_shadow_definition
      - prophet_shadow_score
      - prophet_shadow_score_rank
      - prophet_shadow_signal
      - prophet_shadow_entry
      - prophet_shadow_edge
      - prophet_shadow_runway
      - prophet_shadow_quality
      - prophet_shadow_signal_points
      - prophet_shadow_entry_points
      - prophet_shadow_edge_points
      - prophet_shadow_runway_points
      - prophet_shadow_quality_points
    valid_when:
      board_definition: us_prophet_v3
      prophet_shadow_definition: us_prophet_v2_shadow
    note: >-
      Zero-authority retired v2 scorer, stamped on the same row (#5769 /
      DEC:US-SHADOW-ACCRUES-UNDER-ITS-OWN-COLUMN-FAMILY).  Null on off-board rows and
      on us_prophet_v2_fallback nights.  Never copy these values into canonical
      prophet_* columns.
  legacy_v2_decomposition:
    columns:
      - prophet_signal
      - prophet_signal_points
      - prophet_entry
      - prophet_entry_points
      - prophet_edge
      - prophet_edge_points
      - prophet_runway
      - prophet_runway_points
      - prophet_quality
      - prophet_quality_points
    null_by_design_on: [us_prophet_v3]
    note: >-
      The retired five-leg decomposition.  Populated on historical v1/v2 and explicit
      fallback rows.  NULL BY DESIGN on us_prophet_v3 because C1 has no five-leg
      decomposition.  That null is attribution, not a bug.
  published_board_output:
    columns: [featured]
    note: >-
      Board consequence of canonical order (who is featured), not a shadow comparator
      and not a ranker score.

# Compatibility: definition-keyed mapping, NEVER a timeless column list.
# Consumers that still look up champion_baseline must go through by_board_definition.
champion_baseline:
  by_board_definition:
    us_prophet_v2:
      roles: [published_ranker_output, published_board_output, legacy_v2_decomposition]
    us_prophet_v2_fallback:
      roles: [published_ranker_output, published_board_output, legacy_v2_decomposition]
    us_prophet_v3:
      roles: [published_ranker_output, published_board_output, retired_shadow_output]
      null_by_design: [legacy_v2_decomposition]
  note: >-
    Kept as a definition-keyed index so older readers do not invent a timeless
    champion from a bare column name.  There is no champion_baseline.columns list.

# Present in the store, deliberately not evidence.
# The OUTCOME stores are labels, never features (masterplan §7; the arena label
# builder scripts/prophet_fusion_labels.py is allowlisted through the grades
# store's zero-authority fence on exactly this declaration — reading outcomes as
# LABELS is the permitted class, reading them as FEATURES is leakage by
# construction).  tests/test_prophet_fusion_families.py reds any family member
# claiming one of these columns.
label_only_stores:
  - store: data/us_prophet_rank/grades/
    reader: engine.us_prophet_grades.load_grades
    label_only_columns: [fwd_ret, bench_ret, excess_spy, fwd_mfe, fwd_mdd,
                         entry_price, fill_date, mark_date, graded_asof]
  - store: data/us_board_ledger/retro_grades.parquet
    reader: scripts/prophet_fusion_labels.py
    label_only_columns: [ret, excess_spy, excess_sector, etf_ret, sector_etf,
                         mae_close_excess_spy, mae_close_excess_sector,
                         fwd_mfe_5, fwd_mfe_10, fwd_mfe_21, fwd_mfe_63]

excluded_columns:
  - columns: [pool_definition, pool_lane, pool_lane_reasons, pool_headline_reason, pool_rank,
              pool_display_rank, pool_in_buy_lane, pool_admission_class, pool_open_plan]
    reason: >-
      Candidate-pool lane telemetry (`engine/us_candidate_lanes.py`), display-only and
      authority-fenced by its own `TestNoAuthorityLeak`.  It records how the board's
      admission machinery lost names — it is a description of the champion's selection,
      not independent evidence about the name.
  - columns: [altdata_conv_gte2]
    reason: >-
      PR-1b.  An UNHOMED CROSS-DESK COUNT: the ledger column is
      `bool(altdata.convergence_score >= 2)` (scripts/grade_us_board.py:766), i.e. "at
      least two alt-data desks agreed".  It has no single family because its inputs
      span several — which is exactly the shape §5.2 forbids as a vote.  A count of
      agreeing evidence spends the whole anti-double-count budget in one ballot and
      then hides which lobes were counted, so the correlated-evidence question (§16.3)
      becomes unaskable.  Admissible only decomposed into the per-desk directions that
      produced it, each routed to its own family.  NOT a statement that alt-data
      convergence is uninformative — a statement that this SHAPE cannot vote.
  - columns: [forensics__workbench_url]
    reason: "Display URL. Not a measurement."
  - columns: [context_dims]
    reason: >-
      Frame-level missingness manifest (which Context Snapshot dims stamped that night).
      Read by the harness as coverage metadata — see `semantics.missingness_manifest_column`
      — never fed to a model as a feature.

# ---------------------------------------------------------------------------
# Semantics the harness must implement.  These are the mechanical statements of
# §7 O6's abstention clause and the #4485 null-never-false law, at model scale.
# ---------------------------------------------------------------------------
semantics:
  null_is_not_zero: >-
    A null is UNMEASURED.  It is never false, never zero, never neutral.  A zero
    contribution IS imputation at the neutral value and is therefore forbidden as the
    handling of a missing family — abstention and a zero vote are different acts and the
    model must be able to tell them apart.
  missingness_is_first_class: >-
    Every family contributes an explicit per-family missingness indicator carried as a
    model input in its own right.  Where the store already ships one (`<dim>__absent`) it
    is named in the member's `missingness_field` and is the indicator; where it does not,
    the harness derives one from the member's `columns` and says so in its coverage table.
    `<dim>__reason` carries WHY the value is missing and is named in `reason_field` —
    "no panel for this ticker" and "panel starved upstream" are different facts and a
    router trained without them learns the wrong one (§13.4).
  abstention_is_not_a_zero_vote: >-
    A family below its `coverage_floor` on the evaluation frame ABSTAINS: it contributes
    no value, its missingness indicator is set, and it may not be REPORTED ON for that
    frame (a metric computed over a frame where the family was dark is not a null result
    about the family, it is a null result about the frame).
  null_semantics_enum: [unmeasured, measured_negative, not_applicable]
  null_semantics_meaning:
    unmeasured: "Null means the producer did not answer for this row. Counts against coverage."
    measured_negative: >-
      Null means the producer answered and the answer was 'no event' (8-K recency with no
      filing in window; no earnings inside the reaction window).  Does NOT count against
      coverage — an event family is sparse by nature and a coverage floor read over its
      event legs would abstain a live channel (§4.1, 8-K "event-sparse by nature").
    not_applicable: "Null means the row is outside the field's defined population (e.g. `stage` off-board)."
  coverage_definition: >-
    A family's coverage on a frame = the share of board-adjacent rows for which at least
    one member marked `coverage_probe: true` is non-absent.  Probes are chosen as the
    members whose null means `unmeasured`, so the floor measures whether the family's
    evidence CHANNEL is live, not whether its evidence happened to fire.  "Board-adjacent"
    = `tier == "curated"`; the on-board subset (`eligible == True`) is reported beside it,
    never instead of it.
  variance_floor: >-
    PR-2, the registered floor-law amendment (DSC:COVERAGE-FLOOR-MEASURES-PRESENCE-NOT-
    VARIANCE).  The coverage floor measures PRESENCE and cannot see a member whose values
    are almost all the same value: presence ~100%, information ~0 (PR-1b measured it —
    news_burst fired on 19 of 1,493 graded-frame rows, its within-date percentile was a
    near-constant, and F8's leave-one-family-out delta was exactly 0.000 with CI [0,0],
    yet the 0.50 presence floor admitted it).  The amendment adds a VARIANCE axis beside
    the presence axis, defined GENERALLY on features alone — no outcome data enters the
    rule, so it cannot be tuned to results: for each wired member on an evaluation frame,
    count per date the DISTINCT non-null sign-oriented values among that date's rows; a
    date "carries variation" when that count is >= 2 (a single measured value cannot
    order a cross-section, and rank-of-one is degenerate).  The member is VOTE-INERT on
    that frame when the share of frame dates carrying variation falls below
    `min_dates_with_variation_share` (registered default 0.50; per-family and per-member
    overrides permitted, same override ladder as `max_staleness_sessions`).  A
    vote-inert member still appears in every census, coverage table and redundancy
    matrix — inertness is DISCLOSED, never hidden — but it carries no vote in any family
    aggregation and is excluded from every fitted design matrix, with the exclusion and
    its per-date variation share printed.  Genuinely sparse-but-VARIABLE members (an
    event flag firing on a few percent of rows most dates) pass, which is the DSC
    falsifier's own acceptance test and is pinned by suite.  Vote-inertness is
    FRAME-RELATIVE and computed by the harness at evaluation time — it is never a
    registry constant, because a member inert on one frame may be live on the next.
    A PROSPECTIVE evaluation must compute it as-of each night (the PR-1b whole-frame
    floor look-ahead lesson applies to this axis identically) — UNIMPLEMENTED as of
    PR-2, whose harness computes the share over its frozen historical frame; the
    as-of-night form is carried to PR-3's shadow lane, and no prospective consumer
    exists before it.
  variance_floor_spec:
    axis: within_date_distinct_nonnull_oriented_values
    min_distinct_values_per_date: 2
    min_dates_with_variation_share: 0.50
    excluded_from: [family_vote_aggregation, fitted_design_matrices]
    retained_in: [census, coverage_tables, redundancy_matrices, display]
    structural_note: >-
      F6's `cross_sectional: false` members read 0.00 on this axis by construction; the
      STRUCTURAL exclusion remains the named reason for F6 (row-constant per night), and
      reports keep "structurally excluded" and "vote-inert on this frame" apart — the
      first is a property of the family's design, the second a measured property of a
      member on a frame.
  staleness_definition: >-
    `max_staleness_sessions` bounds how many sessions a member's value may be carried
    forward from its PRODUCER's last refresh before that member abstains.  It is not a
    property of the candidates store's stamp — the store re-stamps every column nightly, so
    a stamp-based staleness reading is vacuous (it is always 0) exactly for the members
    that are staleest.  A member's own `max_staleness_sessions` overrides its family's; the
    family's value is the default for members that declare none.  A family abstains when
    every member is stale or absent.  13F, monthly FINRA settlements, 2-3x/wk options and
    daily theme cannot share one staleness notion (§7 O6) — this is why the override exists.
  missingness_manifest_column: context_dims
  unregistered_column_policy: refuse
  unregistered_column_note: >-
    The candidates store self-heals forward by schema union, so new columns appear without
    a code change here.  The harness REFUSES any column not homed in this file rather than
    ingesting it under a guessed family — an unhomed column has no family budget, and a
    feature with no family budget is a free vote.

# ---------------------------------------------------------------------------
# The eight families.  One-column-one-family is enforced by
# `tests/test_prophet_fusion_families.py::TestOneColumnOneFamily`.
#
# The §5.1 single-home amendments are BINDING and pinned by name in that test:
#   * `ext_z`            -> F2 only.  F8's crowding read of extension enters, if ever, as
#                           an F2-orthogonalized derivative registered separately.
#   * relay columns      -> F3 only.  Its price-derivation is provenance, not membership.
#   * `theme_heat_rank`  -> F3 only.  The S-C theme-heat-as-crowding hypothesis is a §10.7
#                           registered interaction, not an F8 membership.
#   * turnover columns   -> F5 only.  RESOLVED HERE: §5.1 named "turnover percentile" under
#                           F5 and "turnover tail" under F8, which is a double home the §5.1
#                           amendments did not adjudicate.  Ruled by the amendments' own
#                           rule (a dual-role COLUMN gets a single home plus, if wanted, an
#                           explicitly derived orthogonalized second term): the measure is
#                           liquidity/flow and lives in F5; F8's tail read enters, if ever,
#                           as an F5-orthogonalized derivative registered separately.
# ---------------------------------------------------------------------------
families:

  # =========================================================================
  F1_TECHNICAL_CONFLUENCE:
    title: Technical confluence
    # Registered default. Probe = signal_gate_cascade.
    # measured 2026-08-07: tier_cascade 0.895 board / 0.080 curated; gate legs 1.000 board.
    # The curated-frame reading is low because the cascade verdict is only computed for
    # names that reach the gate — but `gate_state`/`gate_provisional` are 0.988/1.000 on
    # the curated frame, so the CHANNEL is live frame-wide and the family passes.
    coverage_floor: 0.50
    max_staleness_sessions: 1        # signal_gate runs nightly
    shared_upstream: >-
      One MACD/StochRSI machinery family-wide.  `entry_signal` and the cycle ladder read the
      same underlying state (`name_score._trigger` reads both).  LER's C-detectors
      deliberately overlap the terminal dots.  Agreement inside this family is one fact.
    members:
      - name: signal_gate_cascade
        source: engine/signal_gate.py verdict via candidates store
        columns: [tier_cascade, tier_sub, ticks, bars_to_cross, fresh_bars, gate_weight,
                  gate_state, gate_reason, gate_provisional, near_miss_reason, htf_s1, htf_s2]
        pit_status: pit
        availability_field: signal_asof
        null_semantics: unmeasured
        coverage_probe: true

      - name: history_sufficiency
        source: engine/signal_gate.py bar-count context via candidates store
        columns: [young_history, history_bars]
        pit_status: pit
        availability_field: stamp_date
        null_semantics: unmeasured
        note: >-
          Load-bearing, not bookkeeping.  §13.2 records `macd_bear` as silently FAIL-OPEN on
          short-history names (`float(nan) < float(nan)` is False), so bar count is exactly
          what distinguishes "not topped" from "could not tell".  A confluence feature read
          without it inherits the fail-open.

      - name: entry_stage
        source: engine/entry_signal.py via the board's `stage` field
        columns: [stage]
        pit_status: pit
        availability_field: stamp_date
        null_semantics: not_applicable   # null = row is not in the staged board population
        # measured 2026-08-07: 0.516 board / 0.046 curated.

      - name: cycle_ladder
        source: engine/cycles.py state/label (STATE_DISPLAY vocabulary)
        columns: []
        planned_columns: [cycle_state, cycle_label]
        wired: false
        pit_status: pit
        availability_field: stamp_date
        null_semantics: unmeasured
        note: >-
          The grades store's `signal_class` is mapped from this same vocabulary and is
          currently null by a named sibling-lane debt (store README) — until it lands,
          class-conditional claims are impossible and are not made.

      - name: washout_lifecycle
        source: engine/washout_turn.py weekly lifecycle
        columns: []
        planned_columns: [washout_stage, washout_active]
        wired: false
        pit_status: pit
        availability_field: stamp_date
        null_semantics: unmeasured

      - name: coiled_context
        source: engine/coiled.py coiled / washout context
        columns: []
        planned_columns: [coiled_state]
        wired: false
        pit_status: pit
        availability_field: stamp_date
        null_semantics: unmeasured

      - name: early_turn_state
        source: engine/us_early_turn.py starter tier
        columns: []
        planned_columns: [early_turn_state]
        wired: false
        pit_status: pit
        availability_field: stamp_date
        null_semantics: unmeasured

      - name: leader_pullback_event
        source: engine/us_leader_pullback.py reset events
        columns: []
        planned_columns: [leader_pullback_state]
        wired: false
        pit_status: pit
        availability_field: stamp_date
        null_semantics: measured_negative   # null = no reset event in window

      - name: ler_detector_families
        source: "Live Entry Radar (#5578) `entry_event.v1` — G0/C1-C5 detector families"
        columns: []
        planned_columns: [ler_detector_family, ler_event_state]
        wired: false
        pit_status: pit
        availability_field: stamp_date
        null_semantics: measured_negative
        note: >-
          Store owned by #5578 PR-2; this program CONSUMES from its first row and duplicates
          nothing.  The Entry head is DEFERRED until LER grades exist (§7 O4) — a deferred
          head is reported as deferred, never proxied.

      - name: mwr
        source: multi-week reversal detector
        columns: []
        planned_columns: [mwr_state]
        wired: false
        pit_status: pit
        availability_field: stamp_date
        null_semantics: measured_negative

  # =========================================================================
  F2_MOMENTUM_EXTENSION:
    title: Momentum and extension
    # Probe = residual_alpha. measured 2026-08-07: alpha 0.941 board / 0.930 curated;
    # ext_z 1.000 board / 0.988 curated.  PASSES.
    coverage_floor: 0.50
    max_staleness_sessions: 1        # price-derived, recomputed nightly
    shared_upstream: >-
      THE canonical documented double-count: corr(alpha, composite.legs.momentum) = 0.984
      (`engine/us_board_rank.py:1475` comment) — the momentum leg IS residual alpha under a
      new name.  `total_return` vs alpha corr +0.37.  See `known_redundancy_edges`.
    members:
      - name: residual_alpha
        source: build_site alpha via build_stock_library.py:2674-2682 -> candidates store
        columns: [alpha, alpha_percentile]
        pit_status: pit
        availability_field: stamp_date
        null_semantics: unmeasured
        coverage_probe: true

      - name: extension_z
        source: engine/extension.py -> candidates store
        columns: [ext_z]
        pit_status: pit
        availability_field: stamp_date
        null_semantics: unmeasured
        single_home_ruling: >-
          §5.1 amendment, BINDING: `ext_z` lives in F2 ONLY.  F8's crowding read of
          extension enters, if ever, as an F2-orthogonalized derivative registered as its
          own member — never as a second membership.

      - name: antichase_shadow
