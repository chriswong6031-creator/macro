    # F6 is ROW-CONSTANT by construction (one value for every name on a given night), so a
    # row-share coverage floor is all-or-nothing: coverage is 1.0 or 0.0, never 0.6.  A
    # partial regime read on a frame means a BROKEN JOIN, not sparse evidence, and would
    # silently split the frame into two macro worlds.  0.50 would therefore be a floor that
    # can never bind. measured 2026-08-07: 1.000 on every regime column, board and curated.
    coverage_floor: 1.00
