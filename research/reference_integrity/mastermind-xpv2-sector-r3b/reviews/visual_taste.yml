first_pass:
  frozen_at: "2026-08-22T13:08:11Z"
  verdict: BLOCK
  findings:
    - id: VTC-001
      severity: blocker
      capability: SC-036
      finding: >-
        The Map's quadrant scatter encodes nothing in colour — 37 of 39 markers share one
        identical fill, color(srgb 0.545098 0.576471 0.631373 / 0.62); only the selected dot
        and its ring differ. Radius varies but hue/lightness carry no quadrant, sector, or
        direction. The headline names "Big Pharma is furthest along" yet Big Pharma is
        locatable only via the selection marker. Sub-claim as frozen: --q1..--q4 are declared
        12x (including ZH inversions) and referenced 0x while production uses them ~118x.
    - id: VTC-002
      severity: blocker
      capability: SC-054
      finding: >-
        Explore's first viewport is 75% chrome at 1440x900 (first data row at y=676) and 79%
        at 390x844 (y=667) where ZERO data rows are fully visible. The CATEGORY <details>
        renders open only at 1440 (200px tall vs 64px collapsed at 820/390) — the expanded
        default lands on the one surface with room to show data. Headline claims "49 baskets
        — every member, every record" while the default renders 16 of 49 (top 8 / bottom 8).
    - id: VTC-003
      severity: major
      capability: SC-002
      finding: >-
        ZH-only WCAG 2.2 AA failure on the primary state vocabulary at 11px on dark —
        立即买入 (Overview) and 现可入场 (Confluence) measure 4.26:1, 风险偏好 (Money) 4.45:1,
        against the 4.5:1 floor for text under 18px. The EN counterparts of the identical
        components pass at 5.58:1 / 5.76:1. Cause: the inherited 红涨绿跌 inversion swaps
        --up to #e06464 without re-tuning it for this size on this surface.
    - id: VTC-004
      severity: major
      capability: SC-054
      finding: >-
        Under data-lang="zh", 16 of 19 visible Explore chips carry no CJK and 15 have no
        .l-zh span at all, while the same concepts are translated elsewhere in the same
        artifact (医疗保健 appears 9x, including "大型药企 · 医疗保健" on Overview).
    - id: VTC-005
      severity: major
      capability: SC-001
      finding: >-
        Overview's "WHY IT IS HERE" column is a constant string within the Buy Now lane —
        the identical sentence "Leading and still broad — room to add on the trend." renders
        for all five buyable groups. The column that justifies the action carries zero
        differentiating information exactly where the action is taken.
    - id: VTC-006
      severity: major
      capability: SC-006
      finding: >-
        Confluence "Stock picks" gives the heaviest visual weight in each row to a bare
        unlabeled decimal (0.60 / 0.54, class "r3-fig tnum") carrying no column header, no
        unit, no title and no aria-label — the least explained element on the row is its
        most prominent one.
    - id: VTC-007
      severity: minor
      capability: SC-088
      finding: >-
        Money's style/risk ETF block colours the sign of a descriptive ratio red or green
        inside a block captioned "Descriptive, never a buy list" — four red, one green reads
        pre-linguistically as "mostly bad" for what is a neutral rotation reading.
    - id: VTC-008
      severity: minor
      capability: SC-088
      finding: >-
        What's Moving's "CHANGED THIS WEEK" 10-cell grid gives the eye no ranking: no
        magnitude encoding and no magnitude ordering (rendered −2.3, +4.7, −0.3, +2.2, +0.9,
        +1.4, +4.6, −3.6, +0.2, +0.6), on a view whose entire job is what moved.
    - id: VTC-009
      severity: minor
      capability: SC-045
      finding: >-
        The two rotation rows repeat one sentence frame with swapped nouns ("X sits N% below
