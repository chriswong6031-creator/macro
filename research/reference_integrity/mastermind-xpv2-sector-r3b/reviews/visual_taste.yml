      true distribution shape is still legible. Sophisticated information design; this seat
      first misread it as a defect and the measurement overturned the eye.
    - >-
      The 红涨绿跌 locale inversion is implemented completely and correctly — --up/--down swap
      under data-lang="zh" with matching light-mode variants and --ink-mix-* rungs, so ZH
      gains render red and losses green with no second palette anywhere.
    - >-
      The mobile Map drops the scatter entirely for a labelled 2x2 quadrant grid naming
      members per quadrant — better information design than the desktop chart it replaces.
    - >-
      Zero horizontal overflow at every width from 1440 down to 160 CSS px across all six
      views, independently probed. The author's earlier GATE4 overflow defects are genuinely
      closed, not merely re-crops.
    - >-
      Zero clipped text and zero sub-24px tap targets across 96 independently audited cells
      (4 widths x 2 themes x 2 languages x 6 views).
    - >-
      Light mode is a designed art direction, not an inverted dark one — tinted rail against
      white content panels, hairline separation, softened --r3-thread.
    - >-
      Mobile Explore restructures rows into labelled stacked cards rather than compressing
      six numeric columns.
    - >-
      Money's stat tiles carry plain-word glance-tier annotations ("healthy majority", "more
