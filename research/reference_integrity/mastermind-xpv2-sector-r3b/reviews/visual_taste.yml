second_pass:
  amended_at: "2026-08-22T13:15:55Z"
  rationale_read:
    - research/reference_integrity/mastermind-xpv2-sector-r3b/ORCHESTRATOR_ADJUDICATIONS.md
    - research/reference_integrity/mastermind-xpv2-sector-r3b/design_notes.md
    - research/reference_integrity/mastermind-xpv2-sector-r3b/copy_ledger.md
    - research/reference_integrity/mastermind-xpv2-sector-r3b/responsive_contract.md
    - research/reference_integrity/mastermind-xpv2-sector-r3b/accessible_alternative_contract.md
    - research/reference_integrity/mastermind-xpv2-sector-r3b/baseline.yml
    - mockups/refs/reference_integrity/mastermind-xpv2-sector-r3b/build/DESIGN_SYSTEM_SPEC.md
    - mockups/refs/reference_integrity/mastermind-xpv2-sector-r3b/build/QA_ATTACK_REPORT.md
  amendments:
    - finding: VTC-001
      action: downgraded
      note: >-
        Severity blocker → minor, and the dead-token sub-claim is WITHDRAWN as factually
        wrong. Two corrections. (1) --q1..--q4 are the MACRO-REGIME quadrant colours
        (theme.css:219-220 "Goldilocks -> red" / "Stagflation -> green"; canada_history.j2:73
        pairs var(--q1) with "Goldilocks"), NOT relative-rotation quadrants; binding them to
        Leading/Weakening would be semantic misuse, and carrying them unused inside a
        declared verbatim token mirror is correct, not dead weight. (2) DESIGN_SYSTEM_SPEC §3
        states the reserved-hue law — "colour appears only for direction, health, wayfinding,
        provisional tier, or lock. Everything else is achromatic" — and quadrant membership
        qualifies for none of those, so monochrome markers are the law correctly applied, not
        laziness. SC-036 itself describes the scatter as "context-labeled, no gated call",
        and SC-037 supplies an accessible text/table equivalent, so the information is
        reachable. What survives is narrow and unrefuted: withholding colour was right, but
        nothing non-chromatic replaced the encoding it would have carried, so a 38-point
        scatter is navigable only by hover while its own headline names a member the reader
        cannot find. Shape, direct labelling of the named leaders, or leader lines would all
        satisfy the reserved-hue law. R3C input, not a bar to this reference.
    - finding: VTC-002
      action: downgraded
      note: >-
        Severity blocker → minor. DESIGN_SYSTEM_SPEC §333 sets the above-fold budget as
        "chrome + the answer + at most two supporting modules" at 1440x900 and "the answer
        within one swipe" at 390 — the frozen composition satisfies both on the letter, since
        the answer is first and the filter is one module. The measured fold economics stand
        (75% / 79%, zero mobile rows) and the desktop-only open default remains unexplained
        by any rationale document, but a composition that meets its own stated budget is a
        taste disagreement, not a defect to correct in the reference. Recommend R3C revisit
        the 1440 default-open state specifically; it is the single lever that costs 136px.
    - finding: VTC-003
      action: upheld
      note: >-
        UPHELD AND ESCALATED, major → blocker; this is the sole basis of the final verdict.
        The rationale strengthens rather than excuses it. DESIGN_SYSTEM_SPEC §366 sets the
        artifact's own law — "Contrast: text ≤18px ≥4.5:1 on its actual painted surface …
        Never bypass an --ink-* rung with a literal" — and §3 asserts the ZH flip happens
        "by construction … with no second palette". The measured outcome violates that law
        in exactly the locale the construction was built to serve: 4.26:1 / 4.26:1 / 4.45:1
        against 4.5:1, on the three labels that carry the call. Verified twice by independent
        methods (CDP computed styles with alpha compositing, then WCAG relative-luminance
        recomputed from token hexes: ZH 4.27, EN 5.58). QA_ATTACK_REPORT §494 and §628 place
        "colour-contrast ratios" explicitly OUT OF SCOPE, so this axis was never tested by
        the author — it is an untested gap, not an adjudicated tradeoff. The system already
        owns the remedy: --ink-mix-up is set below 100% for light precisely to solve this,
        and is left at 100% for dark. Setting a zh-dark rung (e.g. an effective #e57a7a,
        measured 5.11:1) clears AA without a second palette and without touching EN.
    - finding: VTC-004
      action: downgraded
      note: >-
        Reattributed, major → minor. The gap is real and user-facing but is NOT
        reference-authored: the producer emits no Chinese twin for this field at all
        (category_zh occurs 0 times across 126 category occurrences and 15 distinct values,
        against name_zh 6,625x and sector_zh 278x). The reference therefore cannot translate
        the chips without inventing copy, which the verbatim-render law forbids, and
        copy_ledger.md §4 discloses it in advance as a "recorded producer gap" citing QA §3.
        My first-pass "same concept translated elsewhere" observation was factually true but
        misattributed: 医疗保健 comes from name_zh/sector_zh, fields the producer does emit.
        Correct owner is the producer / R3C.
    - finding: VTC-005
      action: withdrawn
      note: >-
        WITHDRAWN. The repeated sentence is producer data, not design copy: reco_why_en
        appears 105 times in the embedded fixture with only 8 distinct values, one canned
        sentence per reco class ("Leading and still broad…" for accumulate, "In play but no
        fresh edge here…" for hold, "Momentum and breadth breaking down…" for avoid). The
        reference renders it verbatim as the RIG law requires — "Nothing here re-ranks,
        re-lanes, re-counts, re-classifies or re-orders". The weakness is genuine for the
        end user but is upstream; the reference could not fix it without editing producer
        output. Filed as producer/R3C input.
    - finding: VTC-006
      action: upheld
      note: >-
        UPHELD at major, unchanged. No rationale document addresses it — DESIGN_SYSTEM_SPEC,
        design_notes.md and ORCHESTRATOR_ADJUDICATIONS contain no treatment of the Stock
        picks figure. The doctrine's ban on untranslated stats at glance tier applies
        directly: the heaviest mark in the row is a unitless decimal with no header, title or
        aria-label. Correctable in implementation with a column label or a plain-word gloss,
        so it rides as a condition rather than joining the block.
    - finding: VTC-007
      action: downgraded
      note: >-
        Downgraded to observation. The reserved-hue law (§3) permits colour for "direction",
        and the sign of a style spread is a direction, so the treatment is lawful. The
        tension with the block's own "Descriptive, never a buy list" caption is real but is a
        wording/emphasisquestion, not a rule violation.
    - finding: VTC-008
      action: downgraded
      note: >-
        Half withdrawn. The ordering complaint is refuted — the grid follows the producer's
        sector order and the RIG law explicitly forbids re-ordering, so sorting by magnitude
        would be a violation, not an improvement. What survives is only the absence of any
        achromatic magnitude encoding (a bar or scale, as Money's tick rails already do
        lawfully), which would add ranking without re-ordering. Minor.
    - finding: VTC-009
      action: withdrawn
      note: >-
        WITHDRAWN, same class as VTC-005. The sentence frame is production's own composition,
        mirrored with its source cited inline in the candidate (rotation_events.js:168-170).
        Not reference-authored copy.
    - finding: VTC-010
      action: downgraded
      note: >-
        Half withdrawn on my own measurement error, half upheld. The "134x" figure counted
        stylesheet DECLARATIONS, not rendered output; live measurement across all six views
        at 1440 finds exactly ONE element rendering at 9px ("20d vs market") plus a handful
        of 9.5px "?" receipt glyphs, and Confluence renders none. The pervasive sub-ramp tier
        I asserted does not exist and that claim is withdrawn. What stands is the AA failure
        on that single element — 3.91:1 dark / 3.43:1 light against the §366 floor — which
        joins VTC-003 as the same untested-axis defect class and shares its remedy.
    - finding: VTC-011
      action: upheld
      note: Unaddressed by responsive_contract.md; minor, rides as an R3C polish note.
    - finding: VTC-012
      action: withdrawn
      note: >-
        WITHDRAWN — the first-pass claim "holds 22px" was my measurement error and is
        retracted. I had measured .si-vr-t, an inheriting flex wrapper carrying no font-size
        of its own; the element that actually paints the answer is .r3-answer-line, and it
        steps 22px → 19px (≤767) → 17.5px (≤359) exactly as DESIGN_SYSTEM_SPEC §48 declares
        (candidate lines 587 and 624). Re-measured at 1440/820/767/390/359/320/195 the ramp
        is correct at every breakpoint. What remains true is only the consequence: at 195 CSS
        px the answer block still occupies ~269px of a 900px viewport (~30%) at one to two
        words per line, because a 68-character sentence in a ~160px column wraps to ~11 lines
        even at the correctly reduced 17.5px. That is specified behaviour satisfying WCAG
        1.4.10 with zero overflow and no content loss — an aesthetic consequence of 200% zoom,
        not a defect. No action.
    - finding: VTC-013
      action: upheld
      note: Cosmetic; unaddressed in rationale. Rides as polish.
    - finding: VTC-014
      action: upheld
      note: >-
        Upheld as advisory only, explicitly not charged against R3B. Confirmed inherited —
        production theme.css carries the identical px ramp with zero relative units, and
        DESIGN_SYSTEM_SPEC §3 mandates the token block be a verbatim mirror. Belongs to a
        platform-level ticket, never to this cycle.
  verdict: BLOCK

verdict_rationale: >-
  BLOCK, narrowly and surgically, on VTC-003 with VTC-010's AA half as the same defect class.
  This is a strong artifact and the block should be read as such: four of my fourteen
  first-pass findings were withdrawn or reattributed once the rationale was revealed, two more
  were refuted on my own re-measurement, and the two I opened as blockers both fell to
  documented, coherent design law. The reserved-hue law, the state-ledge grammar, the
  proportional spread bar, the locale inversion, the mobile recompositions and the responsive
  hardening are the work of a serious design lane, and the composition genuinely clears the
  "billion-dollar institutional fintech" bar on the Action views. What it does not clear is
  its own written accessibility law, in the non-English locale, on the three labels that carry
  the call: 立即买入, 现可入场 and 风险偏好 measure 4.26–4.45:1 where DESIGN_SYSTEM_SPEC §366
  requires 4.5:1, and the author's QA declared colour contrast out of scope so nothing in the
  cycle would have caught it. This must be corrected in the reference rather than ridden into
  implementation for three reasons: the reference IS the migration law, so implementers copying
  it faithfully reproduce the failure; the defect is invisible to every EN reviewer because the
  identical components pass at 5.58:1; and accessibility conditions attached to an otherwise
  approved reference are the class of condition most likely to be dropped. The fix is small and
  already native to the system — a zh-dark --ink-mix-up rung below 100%, mirroring what light
  mode already does — and I would expect a single fix round to clear this to PASS.

conditions_if_cleared:
  - {ref: VTC-006, condition: "Label the Stock picks figure — column header or plain-word gloss plus an accessible name; no bare unitless decimal as the heaviest mark in a row."}
  - {ref: VTC-002, condition: "R3C should revisit Explore's 1440 default-open CATEGORY details; it is the single 136px lever between a compliant fold and a useful one."}
  - {ref: VTC-001, condition: "R3C should add a non-chromatic locator to the desktop scatter (direct labels for named leaders, or shape) so the headline's named group is findable without hover, preserving the reserved-hue law."}
  - {ref: VTC-004, condition: "Producer-side: emit category_zh, or ratify EN category chips as intentional untranslatable tokens in the ZH copy standard."}
  - {ref: VTC-005, condition: "Producer-side: reco_why_en carries 8 distinct strings across 105 rows; per-row differentiation is a producer improvement, not a reference one."}

strongest_and_weakest:
  strongest_viewport: "1440 dark EN Confluence — the state ledge, the count-proportional spread bar and the green-emphasised headline verb compose one dominant, unambiguous object."
  weakest_viewport: "390 Explore — 79% of the first screen is chrome and no data row is fully visible."
  still_looks_vibe_coded: >-
    Explore's filter block (78 buttons; 15 chips in an undifferentiated three-row wrap) and its
    "60D TREND" sparkline column — baseline-less, uniform grey squiggles that read as decoration
    rather than data.
  should_not_become_site_wide_law:
    - "An 11px state label in the ZH up-ink at 4.26:1 — the pattern behind VTC-003."
    - "Bare unitless figures as the heaviest mark in a row (VTC-006)."
    - "A quadrant chart with no locator of any kind once colour is correctly withheld (VTC-001)."
    - "Sub-ramp 9px text on an already-failing contrast pair (VTC-010)."

limitations_and_not_evaluable:
  - axis: eyes_on_coverage
    note: >-
      All 40 mandated matrix crops were generated by this seat and all 96 audit cells were
      instrumented, but 13 crops received individual human-equivalent visual inspection
      (1440 dark EN x6; 1440 light EN overview/map/money; 1440 dark ZH overview/explore;
      390 dark EN explore/map; 320 dark EN confluence; 195 zoom200 money). The remainder were
      captured and machine-audited for contrast, tap targets, clipping and overflow but not
      individually eyeballed. Recorded as a limitation rather than claimed as full coverage.
  - axis: production_chrome
    note: >-
      The candidate renders inside the R3B harness shell, not the production _site_nav family.
      Composition judgements about first-viewport economics therefore exclude real chrome
      height, which would worsen every fold measurement reported here, VTC-002 most of all.
  - axis: motion_and_interaction
    note: >-
      Captured with reduced_motion=reduce and via scripted activation. Transitions, hover
      states, focus-visible rings and the Time Machine deferred-fetch behaviour were NOT
      evaluated as visual/taste axes.
  - axis: fixture_bound_states
    note: >-
      NOT_EVALUABLE on this fixture, consistent with the authors' own disclosure — ai_watch is
      null so the A8 "Model analysis" branch never paints; the forming bucket is empty
      everywhere so the 4-cap path is unexercised; n_thin>0 is unobserved for Nasdaq/Russell;
      loading and partial states are not capturable.
  - axis: typography_rendering
    note: >-
      Rendered on macOS with San Francisco leading --font-ui. CJK fell to the platform
      PingFang SC. Windows/Linux CJK fallback (Noto Sans CJK SC / Microsoft YaHei) was not
      inspected and may shift ZH metrics.
  - axis: finding_id_collision
    note: >-
      The handoff mandates the VTC-nnn prefix, but the R2 predecessor cycle also used it —
      ORCHESTRATOR_ADJUDICATIONS §3 and §9 cite "the VTC-002 hidden-offscreen defect class"
      and predecessor "VTC-009, VTC-010" against intelligence_hub/LENS. The IDs in THIS receipt
      are new and unrelated to those. Flagged so continuity does not silently merge them.

evidence:
  first_pass_freeze: research/reference_integrity/mastermind-xpv2-sector-r3b/reviews/visual_taste_evidence/FIRST_PASS_FREEZE.md
  method: >-
    Candidate extracted from git at dc84f78c and hash-verified before rendering. Headless
    Chromium 151.0.7922.34 via a scratchpad Playwright venv. View activation drove the real
    .si-view-btn click path and every capture self-verified which .si-view was actually visible
    before shooting. Contrast computed from CDP computed styles with alpha compositing against
    the true painted ancestor surface, then independently recomputed from token hexes using the
    WCAG relative-luminance formula. Crops and audit JSON are session-local and not committed;
    every numeric claim in this receipt is reproducible from the method above.
  self_corrections_during_review:
    - "An apparent candidate-hash mismatch at the start was my own error — '2>&1' folded git's stderr into the hash input, and the handoff's candidate path carries a typo ('mastermind-xpv2-sc-r3b' for the real 'mastermind-xpv2-sector-r3b'). The frozen bytes verify exactly."
    - "A first contrast sweep reporting ~70 failing cells was my parser reading Chromium's color(srgb …) 0-1 components as 0-255. Corrected to 10 real failures across 48 cells."
    - "A DOM probe returning 'Explore has no table' was my selector matching the rail nav link, which also carries data-view. Corrected to .si-view[data-view=…]."
