overall_read: >-
  R5.2 closes the three things it aimed at — the pin is real and carries the class
  fact at all three photographed quadrants, the lead symmetry law now reads as a
  shape distinction rather than an ink one in four quadrants, and the mobile fold is
  reached by landing rather than by squeezing type. What it does not close is the
  pattern it keeps re-opening: a constant printed once at the top and then 23 more
  times down the stream, now surviving in the lead slot with both acceptance gates
  drawn around it. Against that sits one genuinely new ambiguity the round created
  — an unsubjected aggregate whose "3 earlier" shares a word, a numeral and a
  viewport with a row chip meaning the opposite — and a mobile reduction that moved
  a ratified caveat off the glance tier onto a Tier-2 landing with no visible
  affordance, no touch path, and no crop anywhere in 63 files showing it open.
  None of that is a false claim to a user. All of it is cheap to fix.
