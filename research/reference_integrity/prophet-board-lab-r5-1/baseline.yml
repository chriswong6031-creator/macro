# Production Baseline Manifest (RIG V1 §4/§5) — design memory for D-LAB-R5.1.
#
# THE BASELINE MOVED. At R5 the baseline was the board alone, because the Lab
# did not exist. R5 shipped nine Lab capabilities that two independent critics
# examined and largely praised, so R5.1's baseline is the BOARD **plus those
# nine** — a revision may not quietly lose what the cycle it answers created,
# and the R5 verdict's `preserved_strengths` list is the record of what must
# survive. Capability ids are stable across revisions (RIG §5), so every board
# id below is byte-identical to the one in prophet-board-lab-r5/baseline.yml.
schema: mastermind.rig_baseline.v1
reference_id: prophet-board-lab-r5-1
captured_at: "2026-08-19"

production:
  route: us_stocks.html
  live_url: https://mastermindx.io/us_stocks.html
  source_commit: d772fbd6f884
  source_paths:
    - templates/dashboard.html.j2
    - templates/_prophet_card.html.j2
    - templates/_us_board_cards.html.j2
    - templates/tier_preview.js
    - templates/theme.css
    - engine/us_board_rank.py
    - engine/prophet_board_read.py
    - scripts/build_stock_library.py
    - scripts/build_prophet.py
  shared_surfaces:
    - stock.html
  reference_baseline:
    path: mockups/refs/prophet_lab
    frozen_sha: 6ee8f34480ce3299b4692a3e732c6a5c75d9782a
    verdict: REVISE
    verdict_ref: research/reference_integrity/prophet-board-lab-r5/verdict.yml
    status: "REVISE — 3 majors (VTL-401/402/403) + 18 conditions; the artifact this cycle revises"
  underlying_reference:
    path: mockups/refs/institutionalize/us_stocks
    frozen_sha: 168a9be00691
    status: "NOT APPROVED and NEVER INDEPENDENTLY REVIEWED — R5 verdict condition C8; loaded unmodified"

evidence:
  screenshots:
    # the R5 artifact's own crops are the visual before-state for this revision
    - {path: mockups/refs/institutionalize/us_stocks/crops/01-desktop-dark-en.png, viewport: desktop, theme: dark,  locale: en}
    - {path: mockups/refs/institutionalize/us_stocks/crops/04-desktop-light-zh.png, viewport: desktop, theme: light, locale: zh}
    - {path: mockups/refs/institutionalize/us_stocks/crops/25-filter-delivering-zero.png, viewport: desktop, theme: dark, locale: en}
    - {path: mockups/refs/prophet_lab/crops/01-live-desktop-dark-en.png,  viewport: desktop, theme: dark,  locale: en}
    - {path: mockups/refs/prophet_lab/crops/10-lab-desktop-dark-en.png,   viewport: desktop, theme: dark,  locale: en}
    - {path: mockups/refs/prophet_lab/crops/13-lab-desktop-light-zh.png,  viewport: desktop, theme: light, locale: zh}
    - {path: mockups/refs/prophet_lab/crops/14-lab-mobile390-dark-en.png, viewport: mobile,  theme: dark,  locale: en}
  gaps:
    - axis: access
      value: "the R5 artifact's crops as committed AT the R5 SHA"
      reason: >
        The crop filenames are shared between R5 and R5.1 (one frozen path, one atomic freeze —
        RIG §3, and the R5 verdict's crops_namespace adjudication), so the paths above now render
        the R5.1 bytes. The R5 pixels remain retrievable at the frozen SHA
        `git show 6ee8f34480ce:mockups/refs/prophet_lab/crops/<name>`, and the R5 critic receipts
        quote what they showed. Recorded because "the before-shot is in git, not on disk" is a
        real limitation of freezing one path rather than two.
    - axis: access
      value: "live production screenshots of us_stocks.html"
      reason: >
        Unchanged from R5: the live board is behind paid auth and this worktree is sparse.
        Production's current behaviour is re-censused from source with file:line receipts in
        research/prophet_v4/D_LAB_R5_BLOCKER_RECENSUS.md (citations corrected under C5).
    - axis: viewport
      value: "tablet widths (768-1180)"
      reason: >
        Still not captured as crops. R5.1 adds a NEW breakpoint at 980w (the selector wrap, C4),
        so this band now carries a real layout change that no committed crop shows. Named as an
        evidence gap rather than left to be discovered.

user_job: >
  The Chairman opens the U.S. Prophet page to see every plan being tracked on US stocks and where
  each one stands today — and, as an operator, to inspect exact early-entry candidates in real
  time before Prophet has written a plan for them, without losing the rest of the page while he
  does it.

core_interactions:
  - "Scan the board and find what is actionable now."
  - "Read one setup completely without opening it."
  - "Filter the board by lifecycle cell from the ladder."
  - "Open a name's detail surface from its card."
  - "Reveal the tail of the book in place."
  - "Read the record (Evidence), the sourced Groups band, and the Candidates population."
  - "As an operator: flip to LAB, inspect early candidates, and flip back."
  - "In LAB: choose one of six boards, filter by observation class, tell a live sighting from history, and compare a candidate to Prophet."

information_hierarchy:
  - "Page title + purpose + one as-of / freshness state"
  - "The headline live count and the seven-cell lifecycle ladder"
  - "The principal grid region — Setups in LIVE, the Lab observation stream in LAB"
  - "Candidates: a separate population in a different form"
  - "Groups (sourced themes) and Evidence (the track record with its interval)"

design_lineage:
  rulings:
    - ref: "R5 verdict — prophet-board-lab-r5/verdict.yml"
      evidence: "research/reference_integrity/prophet-board-lab-r5/verdict.yml"
      implication: >
        REVISE over VTL-401/402/403 plus 18 conditions. Also rules: approval warrants
        composition and disclosure only (never the two warranted:false authority claims);
        R4's composition is unreviewed and blocks P-MP1-SHELL (C8); the r3 amendment is
        accepted, bounded by C9; crops stay beside the artifact.
    - ref: "LAB-0 §6.5 — 'the principal Prophet grid'"
      evidence: "research/prophet_v4/LAB0_B5_RECUT_OPERATOR_LAB_2026-08-18.md §6.5"
      implication: >
        Ruled at R5 to be a NARROWING clause: the controller owns one region of a page that
        demonstrably has others. A page-level mode would not have been written as 'grid'.
    - ref: "R4 count-cell precedent (key-absence renders an em dash plus a disclosure line)"
      evidence: "mockups/refs/institutionalize/us_stocks/crops/25-filter-delivering-zero.png"
      implication: "The house idiom for 'unknown' at a count position, adopted by R5.1 for the pill row."
    - ref: "DESIGN_DOCTRINE Law 4 — no per-row repetition of a constant"
      evidence: "docs/DESIGN_DOCTRINE.md §2 Law 4"
      implication: >
        R5 argued an exception for the seed chip; VTL-408 refused it and R5.1 withdraws the
        exception, replacing 23 repeats with a sticky divider.
    - ref: "MASTER_PRODUCT_DESIGN_SYSTEM_V1 §9.12 error law / §15 touch floor"
      evidence: "research/MASTER_PRODUCT_DESIGN_SYSTEM_V1.md:407, :550, :645"
      implication: "An error names what failed AND what still works, WITH retry; touch targets >=40x40."
    - ref: "DNR:KILL-PROPHET-POP-MERGE · DNR:KILL-WASHOUT-TURN · DNR:KILL-OUTCOME-AUDITION"
      evidence: "research/DO_NOT_REBUILD.md"
      implication: "Unchanged from R5: no population change, intersection mints nothing, no outcome read for ranking."
    - ref: "DEC:LER-EXPERT-EVENT-FAMILIES-PRESERVED"
      evidence: "agentos/workstreams/WS-LIVE-ENTRY-RADAR.md"
      implication: "One card may carry multiple experts[], each keeping its exact identity."
  rejected_variants:
    - "R5: LAB as a page-level mode (VTL-401 — deletion of two core sections)."
    - "R5: one pill treatment for both 'unknown' and 'zero' (VTL-402)."
    - "R5: the favourable lead in accent ink with the adverse result in the absence idiom (VTL-403)."
    - "R5: the per-row seed chip repeated 23 times, argued as a Law-4 exception (VTL-408 — withdrawn)."
    - "R5.1, considered and rejected: adding an edge-fade/chevron affordance to the 390 selector scroller. Removing the scroller is better than affording it — six boards are a product contract, not an overflow."
    - "R5.1, considered and rejected: hiding the ladder in LAB to buy back a 390 fold. That is the deletion VTL-401 blocked, in miniature."
    - "R5.1, considered and rejected: pagination of the Lab stream (see proposal.yml information_economics)."
  comments:
    - path: "mockups/refs/institutionalize/us_stocks/board.css:996"
      note: "R4 hides .bh-purpose below 720w ('the h1 already says what this is') — which is why the R5.1 survivor test is DIFFERENTIAL against LIVE at the same viewport rather than an absolute count."
    - path: "mockups/refs/prophet_lab/lab.js (lead)"
      note: "The sign is the branch. A generator convention (null for adverse) had been standing in for a guard, and it hid two of five branches from every crop."

