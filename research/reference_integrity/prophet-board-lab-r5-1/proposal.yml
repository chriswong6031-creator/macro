  - id: xc.bilingual
    disposition: IMPROVE
    target: >
      aria-labels now bind to the language like the visible copy (C11); the EN glance vocabulary is
      as plain as the ZH (C15); the copy-law scan covers both languages across all six boards and
      both modes (C3); and the ZH lead pair carries the sign as legibly as the EN pair does.
    rationale: >
      R5 shipped English-only assistive labels and an EN enum-shorthand where the ZH had the plain
      word — inverted bilingual parity (VTL-403/VTL-405, VTC-403).
    r52_correction: >
      PR51-7 — the VTL-403 symmetry law makes the three measured outcomes identically quiet, so the
      WORD carries the entire sign. EN got that free (subject and verb both flip); the R5.1 ZH pair
      did not — 「比 Prophet 早 N 天看到」 against 「Prophet 早 N 天」 shared the polarity character
      早 and the numeral. The adverse case is now 「Prophet 领先我们 N 天」, sharing no character with
      早. PR51-5 also repaired the ZH leak guard itself: D17b probed "Live sighting" and
      "Seed · history", strings the same revision had retired, so the check could not fail. Probes
      are current vocabulary and D17c now asserts each is PRESENT in EN before its absence in ZH is
      credited.
    r52_correction_2: >
      VTL51-506 — the residue of the "Live" overload. VTL-405 de-overloaded it once by making the
      observation class a PHRASE rather than the bare word; the phrase still contained the word in
      both languages, so the page carried LIVE (mode), "Seen live" (row class) and "Seen live"
      (filter) — 实时 / 实时观测 / 实时观测. The class is now "Seen first-hand" / 「第一手观测」,
      which shares nothing with the mode word in either language. Taken rather than recorded as
      accepted residue because a clean de-collision existed AND it is more accurate: the axis this
      class measures is provenance, not timing, and the opposite of "From history" is "seen
      first-hand", never "live". The divider and the baseline copy drop "live" with it.
  - {id: xc.light_dark,           disposition: RETAIN, target: "unchanged; every new state is captured in both themes"}
  - id: xc.mobile_390
    disposition: IMPROVE
    target: >
      All six frozen boards are on screen at 390 with no scroller (D20) and at 1000, just above the
      breakpoint R5.1 retired (D20d); the Lab's own controls clear the 40px touch floor (D20c); the
      rail no longer breaks "not a sighting" mid-phrase; and the class label survives deep scroll at
      390 rather than only at the top of the region (D6c3).
    rationale: >
      R5 hid three of six product-contract boards behind an unaffordanced scroller that the
      page-level overflow checks were structurally blind to (VTL-411/VTC-401).
    r52_correction: >
      PR51-2 — R5.1 scoped the wrap to `max-width: 980px` on the claim that "above 980w all six fit
      on one line anyway". Measured, the strip clears 981w by 22px, and the pill widths are a
      function of the COUNTS, which this surface does not control: a three-digit count on any board
      reopens VTL-411 in a band no check looked at. The wrap is unconditional at R5.2 — identical
      behaviour with no threshold to be wrong about — and D20d pins the previously dark band.
      R52-D2 — and the deeper 390 defect: the LAB mode returned ZERO complete observations above the
      844px fold. R5.1 disclosed that as the unavoidable bill for R51-M1 and C4, which was the right
      thing to do and the wrong place to stop. Measured: the first row began at 1,009px and stands
      294px tall, so it had to start by 550px; the ladder (295px) and the six wrapped selectors
      (137px) account for 432px, so compression cannot reach 550 while both stand — deleting the
      Lab's ENTIRE preamble still leaves the row 181px past the fold, and would cost Law 1 its
      stance line. Three preamble lines therefore demote to landings that already existed or were
      made for them (the board subtitle, printed verbatim on every pill's tip; the overlap footnote,
      onto those same tips; the lead total, into the split chip's LENS) and the region is LANDED on
      flip. Neither R51-M1 nor C4 is reopened: the ladder is where it was, all six boards are still
      on screen, and D24 now requires one complete observation above the fold in both languages.
    r53_correction: >
      THE MOBILE REDUCTION WAS RIGHT IN SHAPE AND WRONG IN THREE PARTICULARS, all closed at R5.3.
      (a) VTL52-603 + PR52-4, reached independently by both C12 seats: the overlap footnote was NOT
      demotable. At 390 the six pills read 14/6/10/28/7/30 — sum 65 against a population of 30, with
      28 two chips from 30 — so it is precisely a caveat WITHOUT WHICH the visible integers mislead,
      and the ratified exception (MPDS:386-389) makes that the last thing to leave the glance tier.
      Its CLAUSE is back at <=560 ("Boards overlap — these do not add up." / 「各板块互有重叠 ——
      数字不能相加。」) with the full sentence still on the pill tips: the EXPLANATION demotes, the
      WARNING does not. D27 checks it VISIBLE at 390 in EN and ZH with all six integers present;
      M32 re-hides it. TWO lines demote here now, not three.
      (b) PR52-4 / VTL52-604 / 605: the demotions' landings could not be OPENED at <=560. The R4
      LENS binds mouseover/focusin only, so under a coarse pointer there was no gesture at all, and
      no crop in 63 files photographed a popover anywhere — the capture path actively parked the
      cursor to close one before shooting. lab.js adds a tap/dismiss path over the SAME .lens-pop
      element and data-tip attributes (board.js is frozen R4 and is not edited); .lab-split and
      .lab-agg take .lab-auth's dotted underline; [data-lens-open] marks the open carrier. D28 drives
      a real tap under any-pointer:coarse in both languages, D28c the dismissal, M30 removes it, and
      crops 56/57 photograph the landing open at 390 in EN and ZH.
      (c) PR52-2: landRegion ignored the sticky-chrome offset syncMarkOffset was already computing,
      so on a route whose header pins the flip scrolled the reader's own control BEHIND the chrome —
      the failure D24b forbids, in the one configuration D24b never ran. landRegion now targets
      bandTop - --lab-mark-top and D24/D24b run at chrome=1 too, counting the fold from the offset.
      Measured 390x844 post-fix: chrome=0 EN band 0 / first row 422 (h 322) / 1 complete row /
      control top 12; chrome=1 EN offset 72 / band 72 / first row 494 / 1 complete row / control top
      84; ZH the same shape. M33 drops the offset and is caught by D24b.
  - {id: xc.lens_receipts,        disposition: RETAIN, target: "unchanged; every machine identity still lives on a receipt, now proven across 14 views"}
