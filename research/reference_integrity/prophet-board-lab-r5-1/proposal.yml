  - id: add.unknown_count_mark
    what: "An explicit unknown mark at every count position when the feed is not answering, with the line that makes the glyph a statement."
    evidence: "crops 46-48; verify D18-D18f"
  - id: add.sticky_class_divider
    what: "The baseline divider pins while the rows it governs are on screen, replacing 23 per-row constants."
    evidence: "crops 30/31/34; verify D6c"
  - id: add.error_retry
    what: "A retry control on the unavailable state, beside the escape hatch."
    evidence: "crops 46-48; verify D23"
  - id: add.row_count_statement
