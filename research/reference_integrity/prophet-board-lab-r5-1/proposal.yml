# Proposal ledger (RIG V1 §5-§6) — D-LAB-R5.1, re-frozen after the R5.2 fix round.
#
# THE SHORT VERSION: five capabilities move from RETAIN to IMPROVE, because the
# R5 verdict found them regressed or under-served; everything else is RETAIN,
# and three of the board's own capabilities are BETTER SERVED than at R5 —
# R5's mode deleted them and R5.1's does not. The authority delta is unchanged
# and still carries two warranted:false claims. Nothing is REMOVED.
#
# ── R5.2 FIX ROUND (this SHA) ───────────────────────────────────────────────
# The R5.1 product_regression critic returned BLOCK on PR51-1: `lab.observation_
# class` was booked IMPROVE, `add.sticky_class_divider` was booked as an
# addition, and `task.tell_live_from_history` minted BETTER on "the same
# guarantee, one constant instead of 23" — all three against a sticky divider
# that COULD NOT PIN, because `.lab-stream { overflow: hidden }` made the list a
# scrollport. Measured by the critic at 390x844, 2,000px into the seed region:
# four seed rows on screen, zero worded class labels.
#
# The mechanism is now real and BEHAVIOURALLY proven (D6c3 scrolls past the
# divider at 1440 and 390 and reads its rect; M22 re-adds the overflow and is
# caught only there). The dispositions below therefore KEEP their direction —
# the capability is genuinely improved — but each one that rested on the pin now
# NAMES what was false at f889d5eb35f3, so no reader has to diff two SHAs to
# learn that a booked capability spent a revision inert. Seven cheap minors
# (PR51-2/3/5/6/7/10/12/13) are folded in; DESIGN_NOTES.md §0b is the map.
#
# The visual_taste first pass (PASS_WITH_CONDITIONS, two further majors) folds
# into the same round: R52-D1 (the constant VTL-408 targeted was still printing
# on all 23 rails; the pin hardcoded top:0 against a production sticky nav; an
# empty .lab-lead--adverse hook sat waiting to be filled), R52-D2 (at 390x844
# the LAB mode returned ZERO complete observations above the fold), R52-D3
# (missing theme x language corners and a 390 lead crop that showed only
# chrome), plus VTL51-506 (the "Live" overload's residue) and VTL51-505 (a lead
# aggregate). All taken; DESIGN_NOTES.md §0b.1 is the map.
#
# Nothing in R51-M1/M2/M3 was touched: D4b-D4f, D18-D18f and D19-D19g all still
# pass and M7/M14/M15/M16 all still bite. R51-M1's ladder and C4's six on-screen
# boards are both intact — the 390 fold was bought with demotions and a landing,
# never by reopening either.
