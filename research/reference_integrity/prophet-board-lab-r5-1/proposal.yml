dispositions:
  # ── the board. All RETAIN, and three of them are BETTER SERVED than at R5:
  #    R5's page-level mode removed them on mode entry (VTL-401) and R5.1's
  #    grid-scoped mode does not. They are still RETAIN, not IMPROVE — the
  #    capability itself is unchanged; what changed is that the Lab stopped
  #    taking it away.
  - {id: board.title_and_purpose, disposition: RETAIN, target: "unchanged in both modes; the subtitle no longer disappears on mode entry (D4c)"}
  - {id: board.freshness_state,   disposition: RETAIN, target: "unchanged in both modes; the plan book's as-of and behind-the-tape banner now survive LAB, because they date the plan book and the plan book is still on the page (D4c)"}
  - {id: board.headline_count,    disposition: RETAIN, target: "unchanged in both modes (D4b)"}
  - {id: board.lifecycle_ladder,  disposition: RETAIN, target: "unchanged in both modes and fully operable in LAB; one line states that a cell click returns to Live, so nothing is inert (D4b/D4f)"}
  - {id: board.count_law,         disposition: RETAIN, target: "untouched — the Lab prints no plan-book quantity"}
  - {id: board.key_absence_disclosure, disposition: IMPROVE, target: "extended to the Lab's pill row: unavailable prints an em dash plus a disclosure line, empty prints a real 0 (D18*)", rationale: "R5 conflated unknown with zero at the pill row (VTL-402) — the one place this capability had not reached"}
  - {id: board.progressive_expansion, disposition: RETAIN, target: "unchanged in LIVE"}
  - {id: board.table_view,        disposition: RETAIN, target: "unchanged in LIVE"}
  - {id: board.anonymous_gate,    disposition: RETAIN, target: "unchanged; the Lab affordance is absent entirely without entitlement (D3/D3b, crops 04/05)"}
  - {id: board.empty_state,       disposition: RETAIN, target: "unchanged in LIVE"}
  - {id: card.chart_hero,         disposition: RETAIN, target: "unchanged in LIVE; the Lab row still leads with the chart"}
  - {id: card.printed_null_chart, disposition: RETAIN, target: "unchanged; inherited by the Lab row at the same-height/printed-absence law"}
  - {id: card.live_quote,         disposition: RETAIN, target: "unchanged; the Lab row keeps the unconditional data-sym slot"}
  - {id: card.stance_chip,        disposition: RETAIN, target: "unchanged in LIVE; still deliberately absent from a Lab row (D13)"}
  - {id: card.no_read_chip,       disposition: RETAIN, target: "unchanged in LIVE"}
  - {id: card.identity_link,      disposition: RETAIN, target: "unchanged; the Lab row uses the same stock.html#TICKER convention"}
  - {id: card.priority,           disposition: RETAIN, target: "unchanged in LIVE; absent from the Lab by design (no ranking authority)"}
  - {id: card.trigger_chip,       disposition: RETAIN, target: "unchanged in LIVE"}
  - {id: card.marks,              disposition: RETAIN, target: "unchanged in LIVE"}
  - {id: card.caution_carrier,    disposition: RETAIN, target: "unchanged in LIVE"}
  - {id: card.lifecycle_mark,     disposition: RETAIN, target: "unchanged in LIVE; the Lab still quotes the ruled lexicon verbatim in its Prophet comparison"}
  - {id: card.zone_footer,        disposition: RETAIN, target: "unchanged in LIVE"}
  - {id: card.episode_chip,       disposition: RETAIN, target: "unchanged in LIVE. Its 'must disambiguate on a card seen alone' principle no longer licenses the Lab's per-row class chip — VTL-408 refused that reading and R5.1 withdrew it"}
  - {id: section.candidates,      disposition: RETAIN, target: "unchanged in BOTH modes (D4d) — R5 removed it on mode entry"}
  - {id: section.groups,          disposition: RETAIN, target: "unchanged in BOTH modes (D4d)"}
  - {id: section.evidence_record, disposition: RETAIN, target: "unchanged in BOTH modes (D4d) — the surface an operator would use to judge a sighting is no longer removed in the same gesture that shows it"}
  - {id: xc.bilingual,            disposition: IMPROVE, target: "aria-labels now bind to the language like the visible copy (C11); the EN glance vocabulary is as plain as the ZH (C15); the copy-law scan covers both languages across all six boards and both modes (C3)", rationale: "R5 shipped English-only assistive labels and an EN enum-shorthand where the ZH had the plain word — inverted bilingual parity (VTL-403/VTL-405, VTC-403)"}
  - {id: xc.light_dark,           disposition: RETAIN, target: "unchanged; every new state is captured in both themes"}
  - {id: xc.mobile_390,           disposition: IMPROVE, target: "all six frozen boards are on screen at 390 with no scroller (D20); the Lab's own controls clear the 40px touch floor (D20c); the rail no longer breaks 'not a sighting' mid-phrase", rationale: "R5 hid three of six product-contract boards behind an unaffordanced scroller that the page-level overflow checks were structurally blind to (VTL-411/VTC-401)"}
  - {id: xc.lens_receipts,        disposition: RETAIN, target: "unchanged; every machine identity still lives on a receipt, now proven across 14 views"}
  # ── the Lab, as R5 established it ───────────────────────────────────────
  - {id: lab.mode_control,        disposition: IMPROVE, target: "the mode now scopes to the principal grid region and the Lab renders inside a bounded, labelled region with an explicit end rule (D4b-D4f)", rationale: "VTL-401 — a page-level mode deleted three baseline capabilities, two of them core; the ruling's own remedy is separation, not deletion"}
  - {id: lab.six_boards,          disposition: RETAIN, target: "the same six frozen ids, unchanged; now all reachable at 390 (D9/D9b/D20) and carrying an overlap disclosure (VTL-406)"}
  - {id: lab.observation_spine,   disposition: RETAIN, target: "unchanged — a preserved strength both critics named"}
  - {id: lab.observation_class,   disposition: IMPROVE, target: "the divider is now sticky, so the class label is present wherever it applies instead of being repeated on 23 rows; four structural channels remain on the row (D6c/D6c1/D6c2/D6e/D6f/D6h)", rationale: "VTL-408 — 23 repeats of a constant below a divider that had already established the fact. The mid-scroll worry that justified them is answered by making the divider sticky rather than by keeping the repeats"}
  - {id: lab.expert_chips,        disposition: RETAIN, target: "unchanged; identities still never merged (D8/D7c)"}
  - {id: lab.prophet_comparison,  disposition: RETAIN, target: "unchanged; still quotes the ruled lifecycle lexicon"}
  - {id: lab.measured_lead,       disposition: IMPROVE, target: "signed and symmetric: five branches, one ink for all measured outcomes, the null idiom reserved for genuine absences, Math.abs removed (D19-D19g)", rationale: "VTL-403 — the only self-referential metric on the surface rendered one-sidedly, and an adverse magnitude was structurally unprintable"}
  - {id: lab.degraded_states,     disposition: IMPROVE, target: "unavailable gains retry and keeps the last known-good stamp; its pill counts are unknown marks, never zeros (D18*/D23*)", rationale: "VTL-402 and VTL-409 — the error state denied the reader the one fact that says how stale their last read was, and asserted counts it had never received"}
  - {id: lab.authority_disclosure, disposition: RETAIN, target: "unchanged in substance; merged with the stance line into one sentence (VTL-412), receipt unchanged (D11/D11b)"}

