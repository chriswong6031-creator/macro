      NEW ROW at R5.1, because the R51-M1 fix creates it. R5 hid the plan-book stamp in LAB on the
      reasoning that it would date the wrong producer; with the plan book's own sections now
      present, it dates exactly what it describes. Two stamps coexist and each is scoped: the page
      header's outside the Lab region, the feed's inside it. Recorded so a critic checks the
      scoping rather than discovering two as-ofs on one page.

information_economics:
  words_per_card:
    production: "~12-15 visible words per Prophet card."
    proposal: >
      ~16-22 visible words per Lab row — DOWN from R5's ~20-26. The per-row seed chip (6 words on
      23 of 30 rows) is gone, replaced by a sticky divider counted once.
  findings:
    - >
      Net word count on the Lab plane FELL at R5.1 while three capabilities were added. The
      removals: 23 seed chips (VTL-408) and one of the two synonymous disclaimer lines (VTL-412).
      The additions: a "Showing N of M" line, a board-overlap line, and — only when the feed is
      down — an unknown-disclosure line. The band above the pills went from three lines to two.
    - >
      R5.2 spends ONE line back at the divider, and spends it on the axis that was under-served.
      The divider is now two members: a PINNED one carrying the date, the class name and one
      governing sentence (~8 EN words), and a non-pinned one carrying the lesson (~30 words) stated
      once where the stream crosses the date. R5.1's divider was one 25-word sentence that was
      supposed to pin; pinning it would have spent roughly 12% of a 390 viewport permanently
      re-teaching a rule the reader had already read on the way past it. The split is the same
      demotion the sort basis takes at 390 — the constant stays, the explanation lands somewhere
      rather than repeating. Net against R5.1 as SHIPPED (an inert divider): +1 line of fixed
      viewport at 390, in exchange for the class noun existing at all below the fold.
    - >
      The unknown-disclosure line is spent deliberately and only in the state that needs it. It is
      the sentence that turns an em dash from a glyph into a statement, which is the whole of
      VTL-402; a dash with no line would have been a quieter version of the same defect.
    - >
      Still WORDIER than a Prophet card, and still for one reason: a Lab row must state why a
      number is absent ("Lead not measurable"). That is the disclosure whose omission is the
      failure this surface exists to prevent.
    - >
      One constant still repeats per row: the PROPHET eyebrow. Kept as the cheapest way to keep
      the comparison attributed to a different producer, now that plan-book sections share the
      page again. A reviewer who disagrees should say so — it is the last repeated constant left.
  preserved:
    - "The LIVE board's word count is untouched; the mode control still adds two words and two labels."
    - "The Lab still answers 'so what do I do' ONCE, in the band."
    - "One as-of per producer, each scoped to the region it describes (see auth.plan_book_dating)."
    - "Machine identity remains entirely below the glance tier, now proven across 14 views rather than one (C3)."
