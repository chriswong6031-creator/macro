authority_delta:
  - id: auth.lab_observation_exists
    production_claim: "Production asserts nothing about early-entry candidates."
    proposal_claim: "The surface asserts that a named detector fired on a named ticker, and — for live-forward rows — the clock time we first saw it."
    direction: stronger
    warranted: false
    evidence: >
      UNCHANGED from R5 and still unwarranted: R-LAB-1 has not landed, no canonical
      mastermind.entry_event.v1 stream exists, and every timing/detector/observation-class fact in
      the fixture is synthetic (DESIGN_NOTES §4, marked data-mock-lab). The R5 verdict adjudicated
      this APPROVE_AHEAD_OF_PRODUCER_SCOPED — approval warrants composition and disclosure only —
      with fail-closed condition C6 binding P-LAB-API and C7 binding the rebake. Both are carried
      as CARRIED_BLOCK in continuity.yml. Re-declared warranted:false rather than inherited
      quietly, because the producer still does not exist.
  - id: auth.measured_lead
    production_claim: "Production asserts no lead over anything."
    proposal_claim: "A signed Lab-to-Prophet lead on live-forward rows: 'Seen N days before Prophet', 'Same day as Prophet', or 'Prophet was N days earlier'."
    direction: stronger
    warranted: false
    evidence: >
      Same producer dependency. What CHANGED at R5.1 is that the claim is now two-sided: the
      surface can state a result against itself, and the fixture exercises that branch. The
      LAB-0 §4 impossibility for seeds is unchanged and still proven to bite (D6, M2). C2's sign
      guard is discharged for the reference (Math.abs removed, D19f) and carried against
      P-LAB-API/P-LAB-UI.
  - id: auth.zero_authority
    production_claim: "The board's cards carry stance, priority and lifecycle."
    proposal_claim: "The Lab explicitly ranks nothing, sizes nothing, originates nothing and mutates nothing, and says so at the glance tier."
    direction: weaker
    warranted: true
    evidence: "LAB-0 §1/§5; all-false authority block asserted by D11; the disclosure is now ONE sentence merged with the stance (VTL-412), pinned by D11b."
  - id: auth.prophet_state_quotation
    production_claim: "The seven ruled lifecycle cell words, weight-only and hue-free."
    proposal_claim: "The same seven words, quoted verbatim."
    direction: equal
    warranted: true
    evidence: "Quotation, not restatement. Unchanged from R5."
  - id: auth.intersection_board
    production_claim: "n/a"
    proposal_claim: "lab-g0-c2a-v1 shows names carrying both marks."
    direction: equal
    warranted: true
    evidence: "Display set intersection only; detector_id = null, nothing minted (DNR:KILL-WASHOUT-TURN). D9d. Unchanged from R5."
  - id: auth.plan_book_dating
    production_claim: "The page header dates the plan book with one as-of and a behind-the-tape state."
    proposal_claim: "The same stamp, now visible in LAB as well, alongside the Lab's own separate feed stamp inside the Lab region."
    direction: equal
    warranted: true
    evidence: >
      NEW ROW at R5.1, because the R51-M1 fix creates it. R5 hid the plan-book stamp in LAB on the
      reasoning that it would date the wrong producer; with the plan book's own sections now
      present, it dates exactly what it describes. Two stamps coexist and each is scoped: the page
      header's outside the Lab region, the feed's inside it. Recorded so a critic checks the
      scoping rather than discovering two as-ofs on one page.

information_economics:
  words_per_card:
    production: "~12-15 visible words per Prophet card."
    proposal: >
      ~16-22 visible words per Lab row — DOWN from R5's ~20-26. The per-row seed chip (6 words on
      23 of 30 rows) is gone, replaced by a sticky divider counted once.
  findings:
    - >
      Net word count on the Lab plane FELL at R5.1 while three capabilities were added. The
      removals: 23 seed chips (VTL-408) and one of the two synonymous disclaimer lines (VTL-412).
      The additions: a "Showing N of M" line, a board-overlap line, and — only when the feed is
      down — an unknown-disclosure line. The band above the pills went from three lines to two.
    - >
      The unknown-disclosure line is spent deliberately and only in the state that needs it. It is
      the sentence that turns an em dash from a glyph into a statement, which is the whole of
      VTL-402; a dash with no line would have been a quieter version of the same defect.
    - >
      Still WORDIER than a Prophet card, and still for one reason: a Lab row must state why a
      number is absent ("Lead not measurable"). That is the disclosure whose omission is the
      failure this surface exists to prevent.
    - >
      One constant still repeats per row: the PROPHET eyebrow. Kept as the cheapest way to keep
      the comparison attributed to a different producer, now that plan-book sections share the
      page again. A reviewer who disagrees should say so — it is the last repeated constant left.
  preserved:
    - "The LIVE board's word count is untouched; the mode control still adds two words and two labels."
    - "The Lab still answers 'so what do I do' ONCE, in the band."
    - "One as-of per producer, each scoped to the region it describes (see auth.plan_book_dating)."
    - "Machine identity remains entirely below the glance tier, now proven across 14 views rather than one (C3)."
