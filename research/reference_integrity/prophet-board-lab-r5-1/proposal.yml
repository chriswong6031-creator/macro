authority_delta:
  - id: auth.lab_observation_exists
    production_claim: "Production asserts nothing about early-entry candidates."
    proposal_claim: "The surface asserts that a named detector fired on a named ticker, and — for live-forward rows — the clock time we first saw it."
    direction: stronger
    warranted: false
    evidence: >
      UNCHANGED from R5 and still unwarranted: R-LAB-1 has not landed, no canonical
      mastermind.entry_event.v1 stream exists, and every timing/detector/observation-class fact in
      the fixture is synthetic (DESIGN_NOTES §4, marked data-mock-lab). The R5 verdict adjudicated
      this APPROVE_AHEAD_OF_PRODUCER_SCOPED — approval warrants composition and disclosure only —
      with fail-closed condition C6 binding P-LAB-API and C7 binding the rebake. Both are carried
      as CARRIED_BLOCK in continuity.yml. Re-declared warranted:false rather than inherited
      quietly, because the producer still does not exist.
  - id: auth.measured_lead
    production_claim: "Production asserts no lead over anything."
    proposal_claim: "A signed Lab-to-Prophet lead on live-forward rows: 'Seen N days before Prophet', 'Same day as Prophet', or 'Prophet was N days earlier'."
    direction: stronger
    warranted: false
    evidence: >
      Same producer dependency. What CHANGED at R5.1 is that the claim is now two-sided: the
      surface can state a result against itself, and the fixture exercises that branch. The
      LAB-0 §4 impossibility for seeds is unchanged and still proven to bite (D6, M2). C2's sign
      guard is discharged for the reference (Math.abs removed, D19f) and carried against
      P-LAB-API/P-LAB-UI.
  - id: auth.zero_authority
    production_claim: "The board's cards carry stance, priority and lifecycle."
    proposal_claim: "The Lab explicitly ranks nothing, sizes nothing, originates nothing and mutates nothing, and says so at the glance tier."
    direction: weaker
    warranted: true
    evidence: "LAB-0 §1/§5; all-false authority block asserted by D11; the disclosure is now ONE sentence merged with the stance (VTL-412), pinned by D11b."
  - id: auth.prophet_state_quotation
    production_claim: "The seven ruled lifecycle cell words, weight-only and hue-free."
    proposal_claim: "The same seven words, quoted verbatim."
    direction: equal
    warranted: true
