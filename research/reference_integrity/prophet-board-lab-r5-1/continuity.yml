          P-MP1-SHELL stays blocked until R4's composition gets one or a design authority records
          an explicit override naming this condition.

      - id: C9-PREDECESSOR-AMENDMENT-RULE
        kind: condition
        disposition: RESOLVED_BY_CHANGE
        evidence: >
          Complied with, and not re-exercised. The r3 verdict amendment made at R5 satisfies every
          guard rail the condition records: shape-only, all 11 texts byte-identical (verified by
          the R5 product-regression critic against both origin/main and the sha256-pinned
          r4/r3_source copy), an in-file amendment header naming the amending cycle, the vendored
          pinned copy untouched, and reported in the successor README and the session return.
          THIS cycle amends no predecessor record at all — the R5 verdict, both R5 receipts and
          every earlier artifact set are byte-untouched by this branch.
        changed_files:
          - research/reference_integrity/prophet-board-5514-r3/verdict.yml

      - id: C12-SECOND-CRITIC-QUARANTINE
        kind: condition
        disposition: CARRIED_BLOCK
        note: >
          THIS CYCLE'S OWN OBLIGATION, and this author cannot discharge it. The condition requires
          the R5.1 cycle to complete the proper §6 two-pass shape: both critics' first passes
          frozen before any reveal, then the rationale revealed for genuine amendment passes. No
          review receipt exists in this packet, no verdict, and no approval. The rationale docs
