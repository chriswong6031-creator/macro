          pin is real. The divider split so only the CONSTANT pins (date + class badge + one
          governing sentence); the lesson scrolls away with the crossing. `.lab-cls--seed`, orphaned
          by VTL-408 with zero references, is re-used as the pinned class badge. D6c3 is BEHAVIOURAL
          — scrolls 1,200px past the divider at 1440 and 390 and asserts rect.top clamps to 0 with
          seed rows on screen; receipts 1440: top 0px / 9 seeds, 390: top 0px / 4 seeds at scrollY
