          API's to implement and prove.

      - id: C7-REBAKE-TAKES-ITS-OWN-SHA
        kind: condition
        disposition: CARRIED_BLOCK
        note: >
          Binds the post-producer refresh. No rebake has occurred: the Lab fixture at this SHA is
          still synthetic on the Lab plane and real on the Prophet/identity plane, exactly as at
          R5. When R-LAB-1 lands, the rebake takes its own frozen SHA and a lightweight RIG
          re-check scoped to the observation-class panel and the lead slot.

      - id: C8-R4-COMPOSITION-UNREVIEWED
        kind: condition
        disposition: CARRIED_BLOCK
        note: >
          Unchanged and unchangeable by this cycle. R4's COMPOSITION has still never had a RIG §6
          dual-critic pass; the R5 verdict adjudicated its ten RESOLVED_BY_CHANGE rows as factual
          closure claims only. This artifact continues to load R4 unmodified (empty diff,
