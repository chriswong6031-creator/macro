  - id: AUTH-CLAIMS-SCOPED
    text: "auth.lab_observation_exists and auth.measured_lead remain warranted:false and are adjudicated APPROVE_AHEAD_OF_PRODUCER_SCOPED (R5 verdict, restated here): approval warrants composition and disclosure only; the claims bind fail-closed via C6/C7 until the Radar producer exists. Neither claim is certified by this cycle's approval."
  - id: R53-SCOPE
    text: "R5.3 is the final composition-touching round barring new law breaches: exactly the six blocking rulings above plus the takeable minors (PR52-6 .lab-agg check+mutation; PR52-7 exclusion clause in the landing; PR52-8 D21c real assertion; VTL52-606 pinned-strip date clause; VTL52-607 meta-strip separators; VTL52-608 criterion wording; PR52-10 divider spine idiom — designer's judgment on the last three, decline with a reason) and the editorial baseline.yml re-stamps (:70, :117-118). New frozen SHA, honest dispositions, scoped delta re-check by BOTH C12 seats, and the visual seat's deferred rationale-reveal amendment pass completes then."
  - id: R53-CARRIED
    text: "Carried unchanged from the R5 verdict and binding on later waves: C6 (live-forward fails closed without an envelope-derived first_observed_at), C7 (rebake takes its own SHA + scoped re-check), C8 (R4 composition needs its own dual-critic pass or a named override before P-MP1-SHELL — that pass is running in parallel with R5.3), C12 (completed for the product seat this cycle; visual seat completes at R5.3)."
  - id: R53-LANDING-ADOPTION
    text: "The LAB-entry landing is approved as reference-only choreography (both seats). If P-LAB-UI adopts it: sticky-chrome offset on the scroll target (PR52-2's fix) + its own acceptance check under the real site nav + its own adjudication against the standing viewport veto (MPDS:320-321)."

preserved_strengths:
  - "The pinned divider is real and carries chip + sentence at all three photographed quadrants; sticky chrome is measured, not hardcoded (both critics, independently, live)."
  - "Lead symmetry is a shape distinction with zero ink asymmetry across four quadrants; adverse magnitudes printable; ZH 领先 rewrite closes the glance collision."
  - "Unknown-is-not-zero trichotomy with a designed explainer in every quadrant; grid scope holds everywhere; the mobile fold is met by landing, not compression."
  - "The artifact's receipts are honest and reproducible: the product seat reproduced continuity.yml's own probe numbers to the pixel under a different browser driver."
  - "The landing reads as navigation, not hijack (visual seat), and is lawful under §6.5 and the standing veto (product seat, clause-by-clause)."

