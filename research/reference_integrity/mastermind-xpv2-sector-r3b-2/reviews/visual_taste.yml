strongest_counterargument: >
  The 390 ZH Track record preserves a horizontally scrollable dense table whose scrollbar
  competes visually with the logged-results row, and the 320 2x3 navigation consumes a
  substantial part of the first viewport. A stricter taste critic could condition approval
  on a quieter overflow affordance or less chrome. I do not: preserving column geometry is
  preferable to crushing or hiding evidence, the page itself never overflows, all six tasks
  remain immediately discoverable, and the primary answer still arrives within the first view.

