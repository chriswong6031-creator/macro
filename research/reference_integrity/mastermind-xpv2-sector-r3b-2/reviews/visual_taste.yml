strengths_not_to_disturb:
  - Restrained blue thread and largely achromatic chrome; semantic hues remain meaningful.
  - One dominant answer per view, strong primary-name hierarchy, compact mono receipts, and disciplined density.
  - Light mode earns depth through surface and border structure rather than saturation.
  - Mobile is a genuine recomposition: 2x3 navigation, stacked state cells, inline figure labels, and selective treemap naming.
  - Emoji-free Track record is more institutional and remains clearly authored.
  - EN/ZH typography and direction-color behavior feel intentional rather than mechanically translated.
  - No sci-fi glow, novelty gradient, decorative badge inflation, or childish garnish.

