user_job: >
  An institutional-grade US equity investor moving through six linked instruments on one desk
  (Overview / Map / Moving / Money & Breadth / Explore / Confluence) to decide what deserves
  attention right now, understand market rotation and breadth context, and find timing-supported
  entries -- while every number, state, action, universe, route, access boundary, null and clock
  stays faithful to the frozen canonical producers (COMMISSION.md S0).

core_interactions:
  - "Overview: scan the five-lane Act-Now board (buy_now/buy_soon/on_the_run/take_profits/hold+avoid), open a real row, read Bottoming Watch, reach the self-grader"
  - "The Map: read quadrant/rotation placement, select a group, reach the accessible list/table equivalent"
  - "What's Moving: read recent rotation/fragmentation change from the five bound nightly artifacts, reach Desk Watch"
  - "Money & Breadth: read flow/breadth context, inspect the market-heat treemap and its accessible equivalent"
  - "Explore: search/filter/sort the basket table, inspect a performance chart, reach Time Machine / Forming Narratives / Track Record"
  - "Confluence: switch all four universes (S&P/Nasdaq/Russell/Baskets), read state distribution, drill into group/member/stock detail"

information_hierarchy:
  - "which of six instruments answers the current task (view/rail selection, COMMISSION.md S6.1 canonical order)"
  - "the one dominant object per view (Overview Act-Now board / Map chart / Moving change strip / Money flow-and-breadth / Explore table+chart / Confluence universe board)"
  - "supporting evidence beside the dominant object (counts, chips, secondary reads)"
  - "a clear deeper path (drill to stock/group detail, history, grader) -- COMMISSION.md S6.2"

