  - "OUT OF SEAT SCOPE, evaluated by other seats: mobile/accessibility geometry (so R3B1-09 severe zoom and the 44x44 effective-target half of R3B1-08 were not ruled on), visual taste, and data/authority label provenance beyond the label-integrity checks recorded above."
  - "R3B1-11 contrast was NOT measured by this seat; contrast_audit.py and zoom_sweep.py were not run. The receipt makes no claim about the contrast matrix or the zoom matrix."
  - "Acceptance items R3A 59/59, verify_reference.py, the RIG checker and the deterministic rebuild hash were not re-run here: verify_reference.py rebuilds the artifact twice into a temp tree and re-runs the whole browser chain, which this seat judged out of proportion to a review-only pass whose four constituent browser gates (inventory, mutation, aria, lang) were each re-run individually and passed. A build-determinism regression is therefore NOT covered by this receipt."
  - "Access states were exercised through REF.setAccessState, the artifact's own harness. Real anonymous HTTP 401/403 against production /premiumdata/ is a server property this artifact cannot execute and was not tested."
  - "The regression baseline is the frozen predecessor artifact, not production. A capability that production has and BOTH references lack would not appear in the diff; this seat's D1 coverage of that class is only what inventory_check.py's 15 production-sourced pins assert."
  - "Money heatmap tile geometry was read from 503 hrefs and computed styles, not from a scrolled visual crop of the tile layer."
  - "Light mode was not separately measured. This seat's EN/ZH passes ran in the artifact's default theme; theme-conditional label breakage, if any, is uncovered here."

