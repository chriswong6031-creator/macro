findings:
  - id: PRC1R-001
    severity: minor
    attribution: candidate_owned
    title: "R3B1-02's receipt button drives #r3-receipt with aria-expanded but no aria-controls, unlike the three R3B1-08 buttons that drive the same panel"
    location: 'mockups/refs/reference_integrity/mastermind-xpv2-sector-r3b-1/proposal/MASTERMIND_SECTOR_CENTRAL_R3_CANDIDATE.html — selector [data-r3b1="02"] button.r3-rcpt.r3-rcpt--named'
    measurement: >
      getAttribute('aria-expanded') = "false" before activation and "true" after keyboard Enter,
      but getAttribute('aria-controls') = null. The panel it actually opens is div#r3-receipt
      .r3-tipbox (display:block, 360x99, confirmed visible after both Enter and a 390 touch tap).
      The three Moving controls commissioned under R3B1-08 open that SAME node and each DO carry
      aria-controls="r3-receipt". So one shared disclosure target is wired two different ways
      within one artifact.
    why_it_matters: >
      An aria-expanded with no aria-controls is not invalid ARIA, so aria_id_audit.py cannot see
      it (it audits references that exist, not references that are missing) — this is a gap the
      candidate's own hardened R3B1-14 guards are blind to by construction, which is the exact
      failure class R3B1-14 was commissioned to end.
    attribution_evidence: >
      Candidate-owned: r3-rcpt/r3-tipbox is reference-local markup introduced by this cycle. No
      production template emits data-r3b1 or r3-rcpt.
    smallest_remedy: 'Add aria-controls="r3-receipt" to the [data-r3b1="02"] r3-rcpt button, matching the three R3B1-08 buttons. One attribute.'
    overlap: Mobile/Accessibility seat may also reach this; not adjudicated here.

  - id: PRC1R-002
    severity: minor
    attribution: candidate_owned
    title: "The R3B1-13 Conviction header is display:none at <=640px, so the commissioned label reaches sighted mobile users nowhere"
    location: 'div.r3-cols[data-r3b1="13"] in the Confluence view; CSS rule ".r3-cols" and its <=640px breakpoint'
    measurement: >
      At 1440: display:grid, 1182x31, aria-hidden="true", text "STOCK / CONVICTION / WHY IT IS HERE".
      At 390: getComputedStyle(...).display = "none", 0x0. The only surviving carrier of the label at
      390 is span.r3-vh, whose computed style is position:absolute; width:1px; height:1px;
      clip:rect(0,0,0,0); clip-path:inset(50%) — a screen-reader-only node, 0x0 painted. So at 390 the
      value 0.60 is rendered with no visible name; the fix is present only above the breakpoint.
    why_it_matters: >
      R3B1-13 was commissioned because a bare 0.xx with no label is unreadable. That condition is
      still true at mobile widths.
    attribution_evidence: >
      Candidate-owned: .r3-cols, .r3-vh and the breakpoint are reference-local CSS authored by this
      cycle. templates/subsectors.js:331 emits the label as a plain <th>, so the hiding is not inherited.
    smallest_remedy: 'Under the <=640px rule, unhide the existing per-row span.r3-vh (or render an inline name before the number) so the mobile card carries the visible name. No new markup is required; the node already exists in every row.'
    overlap: >
      CONFIRMED overlap with the Visual/Taste seat, whose VTC1-001 charges the same node
      (.r3-cols aria-hidden + hidden <=640px). Recorded here because "did the commissioned fix
      land" is this seat's question; the severity ruling belongs to the adjudicator, and this
      seat does not adjudicate it.

