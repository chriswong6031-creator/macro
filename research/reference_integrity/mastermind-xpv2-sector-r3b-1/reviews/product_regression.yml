    severity: minor
    attribution: upstream_producer_owned
    title: '"Conviction" now names two different quantities on one page, and its ZH twin differs between them'
    measurement: >
      templates/subsectors.js:331 -> L('Conviction', '综合把握') labels combined_score, a 0-1 value
      (engine/subsector_confluence.py:347), rendered in the candidate's Confluence view as 0.60 / 0.54.
