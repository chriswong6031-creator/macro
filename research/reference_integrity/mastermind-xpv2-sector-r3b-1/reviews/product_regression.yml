      candidate copied them; it did not mint either. The six-view composition that puts them on one
      page is on the commission's do-not-reopen list, so it is not a candidate defect either.
    smallest_remedy: 'Producer-side, in R3C: rename one of the two, or give the subsector picks column a qualified name. No candidate edit.'
