    owner: candidate
    finding: the 5-segment horizontal state ramp survives into the vertical mobile stack, where it maps to nothing (visible in evidence/confluence-390-dark-en.png)
    smallest_remedy: suppress or re-map the ramp when the ledge stacks
  - id: VTC1-007
