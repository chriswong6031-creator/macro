findings:
  - id: VTC1-001
    severity: blocker
    owner: candidate
    commissioned_item: R3B1-13
    finding: >
      All three .r3-cols column legends carry aria-hidden="true" AND are switched off by
      @media (max-width:640px){ .r3-cols{ display:none } }. Consequences: (1) R3B1-13's visible
      "Conviction / 综合把握" header is absent at 390 and 320 — the build's own
      evidence/confluence-390-dark-en.png shows COIN 0.60 / NSC 0.54 with no header, which is
