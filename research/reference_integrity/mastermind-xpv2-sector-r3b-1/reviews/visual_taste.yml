      twin, so 16 figures have no accessible name at ANY width, contradicting copy_ledger_r3b1.md:137
      ("never a naked decimal to a screen reader either"); (3) on Overview the graded board's own
      strength score renders as <span class="r3-fig tnum">76<span class="r3-delta up tnum">+27.2%</span></span>
      — no aria-label, no .r3-vh, not in a table — an unexplained number on the primary consumer viewport.
    principle: COMMISSION R3B1-14 — "A guard true before the feature is not a guard"; here, a label true only at 1440
    smallest_remedy: >
      Extend the existing cf-picks .r3-vh pattern to the other 16 .r3-fig elements (one span each),
      and either keep .r3-cols visible <=640px or emit a compact inline label. No architecture change,
      no new component, no production edit.
  - id: VTC1-002
    severity: major
    owner: candidate
    finding: 'treemap sector-group labels overlap at 320 and 390 — "Communication Services" x "Healthcare", overlapX=17px'
    note: Lane B's fitHeatLabels() (D-3) gates painted width for .hm-t > .sym ticker labels only; group labels are uncovered
    smallest_remedy: apply the same painted-width gate to sector labels — drop rather than overlap
  - id: VTC1-003
    severity: major
    owner: candidate
    cross_seat: mobile_accessibility
    finding: 503 treemap tap targets at 17px height at 390/320; every one under 24px in one dimension
    note: MAC-002's zoom_sweep.py measured painted clipping, not target size — a different property
    smallest_remedy: below the existing 640px breakpoint lead with the two escape hatches already in the component, or render the 11-tile sector roll-up
  - id: VTC1-004
    severity: minor
    owner: candidate
    finding: >
      Map/Themes renders ranks 1,3,4,6,7,8,9,10,11,12 (2 and 5 are sectors, filtered by the active tab).
      The only disclosure is an orphan <p class="r3-note">Rank across all groups</p> at y=1640, 1075px
      below the column it explains.
    smallest_remedy: fold the scope into the column header (two-line header pattern already used on Overview) and drop the orphan
  - id: VTC1-005
    severity: minor
    owner: candidate
    finding: '"RECENTLY WRONG (LOGGED)" binds .up/.dn, so 6 of 8 logged misses render in the reserved up-green'
    smallest_remedy: neutral ink for that row only, via the token route
  - id: VTC1-006
