verdict_rationale: >
  BLOCK, narrowly and surgically, on VTC1-001 alone. This should be read as a strong artifact:
  six of my twenty-four first-pass findings were withdrawn or reattributed once the rationale was
  revealed, three more were downgraded against do-not-reopen items, and my two loudest first-pass
  charges — the "Validated" badge and the flow-heatmap contrast — both fell to correct, documented,
  verifiable upstream attribution. design_system_dependency_r3c.md is the best artifact of its kind
  I have reviewed: it measures, attributes, and states why each repair does not belong to a bounded
  correction cycle. R3B1-13's refusal to rename a producer column, with the contract cited, checks out
  line by line.
  The block stands because VTC-006 is carried in continuity.yml as a RESOLVED_BY_CHANGE blocker whose
  resolving evidence is 1440-only, and the defect it named — "the unlabeled 0.xx decimal is the heaviest
  element on its row" — is fully reinstated at 390 and 320 by the reference's own CSS. The same mechanism
  strips the label from the graded board's strength score on Overview and leaves 16 of 18 figures with no
  accessible name at any width, which the copy ledger asserts is closed. A correction cycle should not
  close with its headline correction unshipped on the primary consumer viewport.

