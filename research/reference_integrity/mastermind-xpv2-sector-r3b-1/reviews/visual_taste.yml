strongest_and_weakest:
  strongest_viewport: >
    390 dark EN Overview — the lane board leads, the group name is the dominant mark, the score/delta
    pair sits right, and the gated "sign in to see the full lane" line closes the card cleanly. This is
    the one screen that reads unambiguously as a premium institutional product.
  weakest_viewport: >
    390 Money & Breadth — the 503-name treemap shrinks rather than recomposes: ~490 unlabelled tiles,
    two colliding sector labels, and 503 sub-24px targets, immediately above two large, well-made escape
    hatches that would have served the same job better.
  still_looks_like_a_compliant_mockup: >
    The whole-market scatter on Moving — 1151px, the tallest band on its view, for 270 anonymous
    role="img" dots with one label and no retrieval path. Honestly declared as context texture, but it
    spends the most space on the least retrievable information.

