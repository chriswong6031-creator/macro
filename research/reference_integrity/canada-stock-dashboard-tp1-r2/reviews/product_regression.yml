    - {finding: PRC-205, action: withdrawn, note: "FALSIFIED at source under the pass-2 grant: both token families are :root-defined in theme.css (with light and light+zh overrides), so no var() chain can go invalid; the ZH flip is the accepted estate stance law with the quotes-only Canada exception verified preserved."}
