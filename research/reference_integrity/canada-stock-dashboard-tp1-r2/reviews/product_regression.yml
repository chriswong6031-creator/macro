  findings:
    - id: PRC-201
      severity: major
      capability: leadership.themes_only_rank
      finding: >
        Presentation-minted breadth promoted from whisper to meter with an 8%
        floor that paints unknown and zero as real quantity: the composer's
        Math.max(8, ...) floor plus null-membership rows ("—") now renders a
        visible 8% fill at 3px/opacity 1 where the baseline's 1px/50% whisper
        made it invisible — a legible non-zero measure for a group the board
        simultaneously declares unknown, inverting missing≠zero in pixels; the
        measure is an unlabeled presentation-owned normalization (count / max
        of visible five) whose scale shifts with the visible set.
      disposition_requested: label the measure and suppress the fill at null/zero, or restore whisper weight.
    - id: PRC-202
      severity: major
      capability: leadership.expand_modal
      finding: >
        Entire modal presentation gated on an unguaranteed sibling adjacency
        over a hard display:none base: every recovering rule incl. the
        .is-open opener is scoped .mx-stockdash--ca ~ .ca-v36-modal, and the
        siblinghood depends on .site-nav being a direct body child — a shared
        nav-family property this surface does not own; if a wrapper appears,
        the base display:none wins and "Expand leadership" becomes a dead
        button that still locks page scroll.
      disposition_requested: scope modal rules by class or composer-set data attribute; drop the unconditional display:none.
    - id: PRC-203
      severity: major
      capability: platform.fail_soft_legacy
      finding: >
        The board is now gated behind the stylesheet: a style-only failure
        (404/401/CDN blip on stock-dashboard.css) silently deletes every V3.8
        capability after ~4.5s of retries, and the serial CSS round-trip
        precedes composer fetch + the two artifact fetches — a second single
        point of failure and added time-to-board that the baseline's inline
        stylesheet made impossible.
      disposition_requested: inject composer unconditionally with independent stylesheet arrival, or carry a critical-path fallback; emit a signal on final CSS failure.
    - id: PRC-204
      severity: minor
      capability: prophet.population_filters
      finding: >
        Active-filter state reads clearly in light (2-3px --link inset rails)
        and nearly not at all in dark (inherited ~6% tint only, ~1.09:1) —
        "which group is filtering the board" is a state meaning both art
        directions must share; only its material may differ.
    - id: PRC-205
      severity: minor
      capability: platform.theme_lang
      finding: >
        Lane/stance hues moved to the --ink-pv-*/--pv-* family with no
        baseline ZH cell to prove rendered hues unchanged, and each binding is
        a two-level var() chain whose terminal fallback is itself a custom
        property — if --pv-* is undefined in any scope the declaration goes
        invalid and four lane heads + every stance chip fall to inherited
        color with no other symptom.
    - id: PRC-206
      severity: minor
      capability: leadership.expand_modal
      finding: >
        Modal Name and Leaders values render right-aligned under left-aligned
        headers (ragged-left ranking list, hardest-to-scan alignment);
        attribution unresolved — no baseline modal cell exists, so possibly an
        inherited production defect a canonical reference should not adopt
        silently.
    - id: PRC-207
      severity: minor
      capability: leadership.themes_only_rank
      finding: >
        Breadth fill lost its width fallback (baseline width:var(--breadth,8%)
        → proposal width:var(--breadth)) — a row rendered without the inline
        property collapses to zero width instead of the documented minimum.
        (Critic severity: nit; recorded at the schema floor.)
    - id: PRC-208
      severity: minor
      capability: platform.theme_lang
      finding: >
        Body-level font-family declaration dropped (baseline set it on
