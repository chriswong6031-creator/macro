    - {finding: PRC-207, action: upheld, note: "Re-verified; repair must COORDINATE with PRC-201 — restoring a literal 8% fallback would strengthen paint-null-as-quantity; correct form is a 0 fallback or 8% paired with null suppression. Stays at the schema minor floor."}
