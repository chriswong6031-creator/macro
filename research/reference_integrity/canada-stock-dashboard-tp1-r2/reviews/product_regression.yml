    - {finding: PRC-202, action: downgraded, note: "Fail-closed base and sibling scope are the authority's explicit orders answering the predecessor fail-OPEN exposure; both requested repairs are barred (namespace law / byte-identity); the scroll-lock half is itself inherited byte-identical. Residual latent dead-button+scroll-lock mode recorded as the ordered trade-off's cost. major → minor."}
