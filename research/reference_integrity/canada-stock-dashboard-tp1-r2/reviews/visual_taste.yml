    - ZH reads as native composition (localized dates, translated controls,
      no CJK uppercase mangling, coherent 红涨绿跌 flip that leaves amber
      health unflipped).
    - Mobile is a deliberate re-composition (stance selector + expanded lane
      with hue rail; full-bleed single-column cards; unambiguous selected
      chip in both themes).
  measurement_note: >
