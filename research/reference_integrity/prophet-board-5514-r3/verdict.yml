  - task: task.staleness_awareness
    verdict_stands: WORSE
    resolution: upheld_revise
    note: "Drives PRC-305. Not waived."
  - task: task.momentum_context
    verdict_stands: WORSE
    resolution: accepted_as_blocked_data
    note: >
      The change pill is at parity; only the sparkline half is degraded, on 134/179 rows, and
      that gap is a genuine BLOCKED_DATA with a named contract, a measured coverage number and
      an operator-ruled escalation (G-D, #5541). ACCEPTED as a data dependency and NOT counted
      as a design regression — with the express exception of its layout consequence, which is
      VTC-301 and is not excused.
authority_delta_adjudication:
  - row: auth.anon_gate_copy
    resolution: upheld_revise
    note: "Unwarranted. Drives PRC-302."
  - row: auth.table_levels
    resolution: upheld_revise
    note: >
      Unwarranted as shipped. The tier split is not defensible in its current form: the table
      keeps the three execution numbers the card tier banned and drops the four decision fields
      the board actually ranks on. Either the table carries stance, Priority and zone and drops
      the levels, or the card-tier ban is re-adjudicated on the record.

overrides: []

verdict: REVISE

# RIG §13.3 SHAPE-ONLY AMENDMENT — added by the D-LAB-R5 cycle, 2026-08-18.
# A successor must carry every condition forward BY ID; these were bare strings and
# therefore uncitable, which `check_reference_integrity.py` reports as
# `condition-without-id` the moment a successor exists. Ids 1-8 are the blocker each
# condition remedies; 9-11 are minted. Every `text:` below is BYTE-IDENTICAL to the
# string it replaced — no verdict content was added, removed, softened or reordered.
# The frozen evidence copy this record was judged against is vendored and sha256-pinned
# separately at prophet-board-5514-r4/r3_source/verdict.yml and is untouched.
conditions:
  - id: PRC-301
    text: "PRC-301 — the card routes to the name's detail surface, or the capability receives an explicit disposition with a reachability proof. A hover affordance with no destination is not a disposition."
  - id: PRC-302
    text: "PRC-302 — the anonymous gate's copy matches what a subscriber actually lands on, or the card tier's level ban is re-adjudicated on the record."
  - id: PRC-305
    text: "PRC-305 — the behind-the-tape state gets a slot and a capability id, or an explicit REMOVE with its §1 fields. Production ships this banner today."
  - id: PRC-306
    text: "PRC-306 — every row of the book is reachable as a card (in-place expansion as production does it, pagination, or a filter that reaches them), or the table carries the board's own decision fields so it is an honest second representation rather than a demotion."
  - id: VTC-301
    text: "VTC-301 — stop stretching short cards against tall neighbours. The artifact already renders these rows well in two other layouts; the canonical grid must not be the one place they read as broken."
  - id: DA-001
    text: "DA-001 — DESIGN_NOTES §0b.1 and §7 are amended to record that the state=paid exemption was withdrawn under PRC-203, or §0b.1 is struck. No document that becomes law may ship two contradictory positions unmarked."
  - id: DA-002
    text: "DA-002 — the r2 non-waivable stance-distinctness condition is discharged on the CHIP as well as the chart (dark --ink-mix-up off 100%, or .pv-buy .pv-chip re-pointed), so a dark Buy card is not two direction inks."
  - id: DA-003
    text: "DA-003 — the compare page renders its specimen at the payload's true stance, scopes divergent shared classes into .cmp-prod so production is shown in production's values, carries a cost list for the revised column, and adds a chartless/no-read specimen."
  - id: COND-VTC-302-NOT-BLOCKING
    text: "VTC-302 is NOT blocking (downgraded on the critic's own pass-2 evidence: 8 of 11 canonical BUY cards also carry the Featured ring and solid badge). It is conditioned, and a concrete ramp satisfying all three constraints in all four theme x language quadrants is recorded in the receipt — including that the fix is a change of mix DIRECTION (toward --text), not more deepening, and that the light values are the shipped --ink-up formula the badges already render."
  - id: COND-MAJORS-CARRIED
    text: "Remaining majors carried as revision work, not gates: VTC-303/304/306/307/308, PRC-307/309/310/311/312/313/314."
  - id: COND-RESUBMISSION
    text: "Resubmission is a new frozen SHA with fresh critic receipts under a new artifact set or an appended cycle; existing receipts go stale the moment proposal.yml's frozen_sha moves (RIG §3), and approval is possible only then."

preserved_strengths:
  - "All four r2 blockers genuinely closed and independently verified: the count law over one universe, producer-bound Groups with the regime chips deleted, the ⚠N risk carrier restored with a keyboard-reachable popover, and the stance-branched zone that restores production's anti-chase encoding."
  - "The one-universe cure is the right call on the merits — it chose a real integrity fix over a cosmetic one, and it closes arithmetically (62+95+0+0+2 = 159; 159+20 = 179; 40 + '+119 more' = 159)."
  - "Groups now renders 8 sourced themes with rank, recommendation, run length, member count and a printed as-of, and states an honest no-read when the key is absent rather than inventing a market call to fill the composition."
  - "The disclosed no-read chip refuses to guess a stance from a disclaimed engine — a genuine REDUCTION in claimed authority, and the correct call."
  - "Light mode is fixed as a design, not a token swap: true #fff cards on a #f7f8fa canvas with a real shadow."
  - "The empty-vs-absent state writing is the best product copy in either artifact ('The cell is empty today, not missing…' / '…which is why the cell shows a dash rather than a zero')."
  - "Ruled seven-cell lifecycle, ladder-as-filter, Resolved outside the live total, episode identity with dated N-of-M chips, and an anonymous gate that withholds by absence rather than by overlay."
  - "The artifact ships its own mutation-resistant verification harness (136/136 at this SHA) and G-D is minted as a hard production data gate rather than used as an excuse to weaken the reference."
  - "Reviewer B's pass-2 answer supplies a complete, verified remedy for the salience inversion — a rare case where the critique arrives with the fix already proven across all four theme x language quadrants."

# ── Independent evidence the authority ran, beyond the two receipts ───────────
authority_spot_verification:
  method: "frozen fixture parsed directly; artifact served at the frozen SHA and measured in a real browser"
  confirmed_exactly:
    - "PRC-303 — GPCR: verb='FRESH BUY', trg='triggered', star=true, entry=53.14, caution 'Don't chase above the buy zone', while stance='blocked_data' and zk='none'. 5 rows carry a verb under a blocked_data stance."
    - "PRC-306 — union across default + all seven filters = 102/179 reachable; 77 unreachable. Matches the receipt."
    - "PRC-312 — 27 rows are life='entered' with stance='wait'."
    - "PRC-304 — demoChange(tk) is literally (h*31 + charCodeAt) % 997 over the ticker string."
    - "DA-002 — dark --ink-mix-up:100% so --ink-up == --up == #45b873; the solid BUY chip and the up-change text resolve to the same value."
  confirmed_with_correction:
    - "PRC-301 — substance holds; the receipt's 'nothing reads location.hash' is imprecise (board.js:804 WRITES it for the lifecycle filter). Conclusion unchanged: no consumer resolves a plan id."
  confirmed_in_ordering_refined_in_magnitude:
    - >
      VTC-302 — measured by sampling RENDERED PIXELS (playwright, DSF 2), because getComputedStyle
      does not reliably resolve color-mix() on this path and produced a spurious rgb(0,1,0) for
      --pv-buy on the first attempt. Dark: WAIT 6.67 > NO-READ 4.00 > BUY 3.78. Light: NO-READ
      4.46 > BUY 3.66 > WAIT 3.50. --pv-buy resolves to rgb(56,159,99), matching the hand-computed
      color-mix. The ordering — which is the finding — holds under both the card-background and
      chart-backdrop references; the absolute ratios differ between them.
  precision_the_record_must_carry: >
    BUY at 3.78 / 3.66 still clears the WCAG 1.4.11 3:1 floor for graphical objects. This is a
    SALIENCE-ORDERING defect, not an accessibility violation, and must not be written up as the
    latter.

# ── Not waived by this verdict (separate production-migration blockers) ───────
production_migration_blockers_preserved:
  - id: G-D
    pr: 5541
    status: open
    note: >
      The plan book's actionability axis reaches 61/179 and enrichment 45/179. Diagnosed as a
      PUBLICATION gap, not an availability gap (entry_status is an admission stamp being read as
      a live measurement; the join used a screener population against a ledger population;
      records exist for 162 of 166 plan tickers). Approving or revising a VISUAL REFERENCE does
      not waive this, and it is not a reason to weaken the reference.
  - id: overtime_producer_contradiction
    pr: 5540
    status: open
    note: >
      Outcome B — vocabulary defect. The producer is correct: age_days is anchored to
      signal_date while days_elapsed/tau and horizon expiry are anchored to plan_clock_date(),
      so 'past its horizon' computed by a reader disagrees with phase=overtime by construction.
      Held open, not cured by hiding. Not waived by this verdict.
