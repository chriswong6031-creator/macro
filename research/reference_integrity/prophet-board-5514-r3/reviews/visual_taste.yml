  answers:
    net_vs_prior_revision: 'NET BETTER, and not marginally — but every one of my surviving findings
      sits in the blast radius of a prior cure, which is the part the record must keep straight.

      Cured relative to 0fc975a, verified in the frozen code and payload: PRC-203, the count law, is
      genuinely fixed — one universe, no view exemption, and the arithmetic closes (62+95+0+0+2 = 159
      = live_total; 159 live + 20 resolved = 179 = active_count; 40 rendered + "+119 more" = 159). PRC-207
      is fixed for the two worst offenders — the regime/breadth/posture chips are gone and Groups is
      rebound to a canonical artifact rendering 8 real themes with rank, recommendation, run length,
      member count and a printed as-of. PRC-201 is fixed — the ⚠N carrier is back as a counted pill
      with a popover bound to real fields, 18 rows tonight. PRC-202 is fixed — the zone is stance-branched
      again (active 19 / re-add 7 / muted 35 / no-band 118 in the payload, matching §0a.B), so GPCR
      and RIO read "No zone — stand aside" where DAR prints an active band. My own r2 predecessor''s
      VTC-203 is fixed — light cards are true #fff on a #f7f8fa canvas with a real shadow, and they
      sit ON the page in 00-R3-light-en.png.

      Two prior conditions are HALF-implemented, and both halves cost something. VTC-204 (Featured aura
      + --pv-buy pin, the condition the r2 verdict called non-waivable) is implemented on background,
      border-color and box-shadow and NOT on the rail — VTC-303. VTC-202 (stance values distinct from
      the direction tokens) is implemented for the chart hue and NOT for the BUY chip: --ink-mix-up
      is 100% in the dark :root, so --ink-up == --up, and the solid BUY badge samples (69,184,115) =
      #45b873 = --up exactly — the same value as the up-change ink on the same card. The condition''s
      stated purpose was that a Buy card not be two direction inks; in dark mode the chip still is one.

      Did satisfying the conditions CAUSE my findings? For four of them, demonstrably yes, and the causal
      chain is specific rather than rhetorical: (1) VTC-301 is PRC-203''s shadow. The r2 cycle''s own
      Reviewer B measured this defect (VTC-212, "40-60px void that reads as broken/loading") and the
      r2 second pass downgraded it to polish on the express ground that state=paid filtered the un-enriched
      rows out of the canonical view. PRC-203 removed that filter by design. The void was not introduced
      — it was PROMOTED from a disclosed honesty lens into the flagship grid, and it grew from 40-60px
      to 97px because the mixed row now stretches a 24px placeholder against a 74px chart. A regression
      is still a regression, and this one is still a blocker, but the record should say that R3 chose
      a real integrity cure over a cosmetic one and then did not pay the layout bill the cure created.
      (2) VTC-302''s dark half is VTC-202''s shadow, and the arithmetic is instructive. Before the cure,
      dark --pv-buy == --up = #45b873 at CR 6.34, ranking BUY second behind amber. After, #389f63 at
      CR 4.79, ranking BUY LAST behind no-read grey. In light the identical change moved BUY from 3.61
      to 4.44 — an improvement, from third to second. One deepening mix was applied to both themes;
      deepening raises contrast on white and lowers it on a dark panel. The WAIT-over-BUY inversion
      pre-existed R3 and is inherited from theme.css; the NO-READ-over-BUY inversion is new and is this
      cure''s doing. (3) VTC-307 is PRC-207''s shadow: the producer-less market content was deleted
      as demanded, the section header was kept, and the page now closes on two rows of empty furniture.
      PRC-207 asked for content to be sourced, removed, or marked illustrative — it did not ask for
      a shell. (4) VTC-304''s third amber is PRC-201''s shadow: the ⚠N carrier the r2 verdict demanded
      back took --warn, which was already both the WAIT stance and the trigger chip. VTC-303 is the
      inverse case and should be recorded as such: it is not a side-effect of a cure, it is a cure applied
      to three of four properties.

      '
    fix_exists_for_302: "YES — a ramp exists that satisfies all three constraints in all four theme\
      \ x language quadrants, and the artifact already contains most of it. The conflict the question\
      \ feared does not exist, but the reason it looked like it might is worth stating: on the dark\
      \ panel, amber #e0a030 sits at CR 7.01 while pure --up green sits at 6.34 and pure zh --up red\
      \ at 4.69. Any DEEPENING mix of --up can only move further below amber. So it is true that no\
      \ deepened --up-derived Buy can out-contrast the current --pv-wait on dark. The free parameter\
      \ R3 did not use is the DIRECTION of the distinctness mix — \"distinct from --up\" never required\
      \ \"darker than --up\", and on a dark surface the correct direction is toward --text, which raises\
      \ salience and creates distinctness in the same move.\nConcrete candidate, verified end to end\
      \ (contrast against the card surface: --panel2 #1e222a in dark, #fff in light; deltaE76 against\
      \ the live direction token in the same quadrant):\n\n  DARK\n    --pv-buy:    color-mix(in srgb,\
      \ var(--up) 82%, var(--text))\n    --pv-wait:   #a8761f          (decoupled from --warn)\n   \
      \ .pv-noread { --pvh: #6e7684 } (decoupled from --muted)\n    dark+en  buy #5fbe87  BUY 7.02 >\
      \ WAIT 4.00 > NO-READ 3.48   dE(buy,--up) 10.1\n    dark+zh  buy #de7a7b  BUY 5.44 > WAIT 4.00\
      \ > NO-READ 3.48   dE(buy,--up) 12.5\n\n  LIGHT\n    --pv-buy:    color-mix(in srgb, var(--up)\
      \ 62%, var(--text))\n    --pv-wait:   #a2650f\n    .pv-noread { --pvh: #8794a6 }\n    light+en\
      \ buy #1e6d47  BUY 6.29 > WAIT 4.77 > NO-READ 3.08   dE(buy,--up) 24.9\n    light+zh buy #8b353a\
      \  BUY 7.85 > WAIT 4.77 > NO-READ 3.08   dE(buy,--up) 28.8\n\nAll twelve values clear the WCAG\
      \ 1.4.11 3:1 floor for a graphical object; every step is at least 1.15x; the ordering is BUY >\
      \ WAIT > NO-READ in all four quadrants; and --pv-buy still derives from --up, so the zh flip stays\
      \ automatic and structural rather than re-authored (condition iii).\nThree things make this cheaper\
      \ than it looks. First, the light values are not invented: color-mix(--up 62%, --text) IS the\
      \ shipped --ink-up formula under light (--ink-mix-up: 62%), and #1e6d47 / #8b353a are the exact\
      \ pixels the BUY badge already renders today — I sampled them off 00-R3-light-en.png and 00-R3-light-zh.png.\
      \ The light half of this fix is \"point --pv-buy at the ink the card already uses\". Second, the\
      \ dark half is the same formula with the dark --ink-mix-up moved off 100%, which simultaneously\
      \ closes NEW-A — the BUY chip would stop being byte-identical to --up, which is what r2's VTC-202\
      \ actually asked for and did not get. Third, --pv-wait is ALREADY a separate token (board.css:39);\
      \ R3 merely set it equal to --warn. Decoupling it is a value change, not a structural one, and\
      \ it is the same edit VTC-304 needs.\nTwo caveats the authority should price in. (i) The dark+zh\
      \ step (5.44 vs 4.00) is the tightest, because red cannot reach green's luminance at equal chroma\
      \ — the ordering holds but with less headroom than dark+en; if a wider margin is wanted, --pv-wait\
      \ must go darker still rather than the red going lighter, or the zh red will drift pink. (ii)\
      \ Fixing --pv-wait does NOT by itself fix VTC-304: it separates the WAIT stance amber from the\
      \ trigger/caution amber by a hair, which arguably reads as two near-identical ambers. The clean\
      \ joint cure is this ramp for the stance channel PLUS re-hueing ⚡Triggered to the verb, which\
      \ is what production does (prod-desktop-dark-en-card-zoom.png renders it green on a Buy card).\n\
      One further ordering fact for the record, not a finding: --pv-hold and the no-read --pvh both\
      \ resolve to --muted, so HOLD and \"No read yet\" paint identical chart strokes. If the ramp is\
      \ re-authored, they should be given separate rungs or the identity should be declared deliberate\
      \ — \"we have no read\" and \"we read it and say hold\" are different statements.\n"
    flagship_principle_ruling: 'The principle is real, the violation is real, and the number in the
      question does not describe what the page photographs — all three at once.

      Verified against the file: DESIGN_NOTES §0b.1 states "A 60%-`暂无判断` board must not become the flagship
      reference", and it states it as the JUSTIFICATION for the very mechanism R3 removed — the state=paid
      subset that rendered 33 full-fidelity rows under a canonical 162 headline. §0a.C then says "One
      universe, no view exemption. The reference-only subset is gone. paid and today render the same
      population." board.js:106 confirms the code follows §0a.C. So the two sections are not in tension
      by accident: the later one repeals the earlier one, and the document ships both without marking
      it. §7 compounds it — "The reference view (state=paid) shows the product once G-D is met; state=today
      and state=fallback show what ships if it is not" is false at this SHA, because paid and today
      are the same render.

      Ruling on the visual result. At the POPULATION level the principle is violated exactly as written:
      97 of 159 live rows (61%) carry blocked_data, the "+119 more" and the table view expose all of
      them, and the frozen reference''s canonical state is the honest state. At the RENDERED-GRID level
      it is not: the priority sort puts 27 stanced rows in the top 40, so the canonical grid is 13 no-read
      of 40 (33%), and 00-R3-dark-en.png shows a first screen with BUY badges, WAIT chips and real charts,
      not a wall of 暂无判断. The board a reviewer photographs is not a 60% no-read board. That distinction
      matters, and it should not be flattened in either direction.

      What the principle was actually written to prevent — a flagship reference whose dominant visual
      texture is absence — HAS happened, but through a different door than the one §0b.1 was watching.
      It is not the no-read chip that does it: it is the ENRICHMENT gap, because 20 of the 40 canonical
      cards are chartless and each renders a 97px void (VTC-301). 33% of the grid says "no read"; 50%
      of the grid is half-empty. §0b.1 guarded the stance axis and the damage came in on the spark axis,
      which G-D §7.2 tracks separately (45/179) and which the notes treat as the softer of the two dependencies.
      It is the harder one visually.

      And the principle is now in direct conflict with a merged blocker. PRC-203 requires the canonical
      view to reconcile with the count law over one universe; §0b.1 requires the flagship not to show
      that universe when it is 60% no-read. Both cannot hold. R3 chose PRC-203, which is the right call
      — a blocker from the design authority outranks an internal design note, and a reference that lies
      about its own counts is worse than one that shows an unflattering book. But the choice must be
      recorded, not left implicit in two contradictory paragraphs of the same document. Condition: DESIGN_NOTES
      §0b.1 and §7 are amended to state that the state=paid exemption was withdrawn under PRC-203 and
      that the flagship now renders the true book, or §0b.1 is struck. Leaving a repealed principle
      in the rationale of a document that becomes law is how the repealed version gets rebuilt later.

      '
  compare_page_assessment: 'The compare page argues honestly about the two variants it is replacing
    and dishonestly by omission about itself. It is not a strawman — that is worth saying first. The
    v1 column renders v1''s real defects (no chart, no quote, no name/sector, "day 2 of 45", a three-line
    paragraph, the Entry/T1/Void footer) and gives it a fair three-item credit list; the production
    column reproduces the four-dot rail and the accent bar and credits production with five things the
    revision kept. The keep/drop lists are accurate against the artifacts they describe, and the light
    crop (71) shows the light-mode card/canvas fix without flattering it. As an argument for retiring
    the four-dot rail and for rejecting v1''s grayscale card, it is convincing and I accept it.

    Three specific things it does not argue honestly.

    (1) The specimen is off-payload. The lede says "One real plan row (FTI · TechnipFMC, entered 2026-08-10)
    rendered three ways from the SAME committed payload, so what differs is design and not data." All
    three columns are hardcoded to class "pvcard pv-hold" with the chip text hardcoded to Hold / 持有
    (compare.html:107, 159). FTI''s stance in the committed payload is `wait` — the main board renders
    it with an amber WAIT chip, verified in 00-R3-dark-en.png. So the one claim the lede makes about
    its own fidelity is false, and it is false in the single most convenient direction available: HOLD
    is the only stance whose --pvh is --muted, so choosing it renders all three cards chromatically
    neutral and removes the stance-ink question — the exact question VTC-302 and r2''s VTC-202 are about
    — from the comparison. Rendered at FTI''s real WAIT, the revised column would show an amber chart
    under an amber WAIT chip beside an amber ⚡Triggered chip, next to a production column whose ⚡ is
    green.

    (2) The incumbent is rendered in the challenger''s stylesheet. compare.html loads board.css and
    overrides only .cmp-prod-scoped rules for the rail, the border tint, the 4-dot stepper and the Edge
    slot. .pv-trg is not among them, so production''s ⚡Triggered renders in R3''s --warn amber in both
    the dark and light compare crops — while the actual production artifact (prod-desktop-dark-en-card-zoom.png)
    renders it GREEN, verb-hued, with amber used exactly once on ⚠2. Any regression that lives in a
    shared class name is invisible in this comparison by construction, and VTC-304 is precisely such
    a regression.

    (3) The ledger is asymmetric. Production gets a three-item "What must go"; v1 gets a six-item "What
    must go"; the revised column gets "Kept from production", "Kept from #5514", "Dropped from both"
    and "Added" — four lists, none of which is a cost. The artifact''s own adjudication assigns debits
    to both variants it is replacing and none to itself, on a page whose stated purpose is adjudication.

    Fourth, and structural rather than dishonest: the specimen is one of the 45 of 179 rows that carry
    a spark and one of the 62 of 159 that carry a stance. The modal card on the board it is arguing
    for — chartless, no-read, 97px void — is never drawn. A three-way adjudication of the card is entitled
    to pick one row, but a reference gate should see the same three-way on the row the grid is actually
    made of. Recommend: re-render the compare at FTI''s true stance, scope .pv-trg (and any other divergent
    shared class) inside .cmp-prod to production''s real values, add a "what it costs" list to the revised
    column, and add a second specimen row that is chartless and no-read.

    '
