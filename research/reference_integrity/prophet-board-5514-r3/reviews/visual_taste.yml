  overall_read: 'In its parts this is frequently better than production — the one-population ladder,
    the reconciled counts, the empty-vs-absent states and the compact degraded grid are all real advances
    that production has no answer to. But as the board a paying user actually opens tonight it is worse,
    and for the two reasons a dense trading surface exists: where the eye lands, and whether the page
    looks worth reading. The canonical desktop grid is roughly half holes (19 of 40 cards carry a 54%-empty
    void), and the pre-attentive colour layer ranks WAIT and "No read yet" ABOVE BUY in both themes,
    so the strongest marks on the board belong to the names the user must not act on. A demanding user
    would take production''s card grid and this artifact''s chrome.

    '
  findings:
  - id: VTC-301
    severity: blocker
    title: The canonical desktop grid's dominant texture is a 54%-empty card — and the void is a layout
      choice, not a data consequence
    evidence: 'board.css:365-368 (.pv-grid { align-items: stretch }) + board.css:553 (.pv-zn { margin-top:
      auto }) + board.css:458-462 (.pv-nochart height 24px) against board.css:447 (.pv-chart svg height
      74px). Pixel-measured in 00-R3-dark-en.png: the RIO card spans y383-578 (195px) and contains a
      single uniform empty run of 105px = 54% of the card. Census: 19 of the 40 cards in 00-R3-dark-en--full.png
      are chartless; in 20-filter-ready.png — the primary actionable filter, 62 setups — 8 of the 15
      visible cards are voids. Counter-evidence that this is layout and not data: 10-fallback-dark-en.png
      and 11-fallback-light-zh.png render the SAME chartless content as clean ~78px compact cards with
      no void at all (because every card in the row is equally short), and 05-mobile390-dark-en--full.png
      does the same at 1 column (board.css:768).

      '
    production_behavior: 'Every card is the same ~200px unit carrying a verb-hued sparkline (prod-desktop-dark-en-card-zoom.png);
      the grid has uniform texture and no holes.

      '
    proposal_behavior: 'In a multi-column row the chartless card is stretched to the tallest sibling''s
      height and the surplus collects as one blank region between the lifecycle word and the zone footer.

      '
    why_it_matters: 'As law this ships a flagship board whose most common visual is an empty rectangle,
      and it photographs as a broken render rather than as honest degradation. The artifact already
      contains two better renderings of identical data (uniform fallback, mobile single column), so
      the defect is not caused by the missing enrichment — it is caused by stretching one short card
      against tall neighbours. Worst hit is the Ready filter, i.e. the screen the user opens to decide
      what to work on.

      '
  - id: VTC-302
    severity: blocker
    title: Chart-stroke salience is inverted against actionability in both themes — BUY is the dimmest
      mark on the board
    evidence: 'board.css:452 (.pv-chart svg * { stroke: var(--pvh) !important }) with the stance map
      at board.css:392-399 and the ramps at board.css:26-28, 37-41, 52-60. Computed contrast of the
      chart stroke against its card surface — dark on --panel2 #1e222a: WAIT #e0a030 = 7.01:1, NO-READ
      (--muted #8b93a1) = 5.15:1, BUY (color-mix(#45b873 80%, #063a24) = #389f63) = 4.78:1. Light on
      #fff: NO-READ (--muted #5d6b7e) = 5.43:1, BUY (#1b894c) = 4.44:1, WAIT #b9791a = 3.61:1. Visually
      confirmed on 2x crops of row 1 of 00-R3-dark-en.png and 00-R3-light-en.png: GPCR''s "No read yet"
      grey chart is the heaviest block in the light row; FTI''s amber WAIT chart is the loudest in the
      dark row; DAR''s BUY green is the quietest in both.

      '
    production_behavior: 'Verb hue drove a small pill plus a sparkline, and the BUY/FEATURED treatment
      was the brightest thing on the card — the green solid BUY badge, green Triggered chip, green tracker
      and green ZONE label all in one direction (prod-desktop-dark-en-card-zoom.png).

      '
    proposal_behavior: 'The chart is promoted to the card''s largest element and hued by stance, but
      the three stance ramps were never ordered by luminance, so the least actionable states carry the
      strongest strokes.

      '
    why_it_matters: 'The chart is the only genuinely pre-attentive element on the card and the board''s
      stated job is "shortlist the few names worth acting on today". Across a 5-column grid the user''s
      eye is pulled systematically to WAIT and to cards where the machine has no opinion. In light mode
      the single loudest chart on the page belongs to a card that says "No read yet" — the inversion
      is total.

      '
  - id: VTC-303
    severity: major
    title: The Featured treatment renders two different hues 1px apart, half-reverting the pinned-Featured
      ruling
    evidence: 'board.css:413-419 pins .pvcard.pv-featured background, border-color and box-shadow to
      var(--pv-buy); board.css:427-432 draws the 3px lit top rail (.pv-featured::before) from var(--pvh),
      the card''s own stance hue. Pixel-sampled 00-R3-dark-en.png: GPCR (Featured + "No read yet") top
      rail y384-386 = (135,143,157) fading to (97,104,115) — grey; its left border at x82 = (57,101,87)
      — green. DAR (Featured + BUY) rail = (55,153,96) green, border (57,101,87) green. In zh the same
      GPCR card gets a RED ring (--pv-buy flips at board.css:72) around a grey rail on a card reading
      暂无判断: 06-mobile390-dark-zh.png, 41-anon-locked-light-zh.png.

      '
    production_behavior: 'Featured glow pinned to --pv-buy regardless of verb, as a single coherent
      pick-cohort cue (design_lineage: templates/_prophet_card.html.j2:47-54).

      '
    proposal_behavior: 'Ring obeys the pin; rail does not. The two halves of the same 3px of chrome
      disagree on every non-BUY Featured card.

      '
    why_it_matters: 'GPCR is the #1 card on the board by priority and is the anonymous visitor''s only
      unblurred specimen. A green (en) or red (zh) "this is a pick" ring wrapped around a grey rail
      and the words "No read yet" reads as a rendering bug, and the split quietly reverts half of a
      recorded operator ruling.

      '
  - id: VTC-304
    severity: major
    title: Amber now carries three contradictory meanings on one card; production reserved it for caution
      alone
    evidence: 'board.css:27 (--warn: #e0a030) and board.css:39 (--pv-wait: #e0a030) are byte-identical.
      .pv-wait .pv-chip resolves through --pvh-ink -> --ink-warn -> --warn (board.css:80, 394, 475-481);
      .pv-trg (the ⚡Triggered chip) is pinned to --warn (board.css:486-491); .pv-cau-btn (⚠N) is pinned
      to --warn (board.css:806-813). In 00-R3-dark-en.png the FTI card stacks "WAIT" and "⚡Triggered"
      as two same-amber pills 3px apart. Production''s card zoom (prod-desktop-dark-en-card-zoom.png)
      shows ⚡Triggered rendered GREEN — verb-hued — with amber appearing exactly once, on ⚠2.

      '
    production_behavior: One meaning for amber on the card, caution; the trigger chip took the verb
      hue.
    proposal_behavior: 'Amber simultaneously means stance=WAIT, event=TRIGGERED and count=CAUTION; on
      a BUY card the amber Triggered chip now sits beside the green BUY badge.

      '
    why_it_matters: 'WAIT ("do nothing") and TRIGGERED ("the entry just fired") are opposite instructions
      rendered in the same ink, so the colour layer stops being decodable without reading every word
      — on a surface whose whole premise is that colour is decodable. On a BUY card the amber chip reads
      as a warning attached to the buy.

      '
  - id: VTC-305
    severity: major
    title: The lifecycle mark is decorative at shipped size, and two of the seven ruled cells are pixel-identical
    evidence: 'board.css:258-261 (.mx-mark { width: 26px; height: 4px; color: var(--text) }). board.css:279-280:
      ".mx-mark--entered::before, .mx-mark--delivering::before { top:.5px; height:3px; background: currentColor
      }" — Entered and Delivering render the IDENTICAL mark. Ready differs from Entered only by the
      right half of a 26px bar dropping to 22% alpha (board.css:272-274); Overtime only by a flat 38%
      alpha (board.css:284). At 1x in 00-R3-dark-en.png, GPCR "—— Entered" and RIO "—— Ready" are indistinguishable
      without reading the word.

      '
    production_behavior: 'A 4-stage rail with a dot at one of four POSITIONS along a track (prod-desktop-dark-en-card-zoom.png)
      — position is one of the strongest pre-attentive channels.

      '
    proposal_behavior: 'A 26x3px bar whose seven ruled states collapse, at real size, into roughly four
      visual classes (dashed hairline / solid / faint / outlined), with the word carrying the actual
      distinction. The mark is also pinned to var(--text), making it the brightest ink on a chartless
      card while carrying almost no discriminating information.

      '
    why_it_matters: 'The encoding moved from a strong channel (position) to one of the weakest (3px
      bar weight), so the on-card lifecycle is now read-tier rather than glance-tier, and the one distinction
      a holder most cares about — Entered versus Delivering — has no visual difference at all. Mitigating
      and worth recording: the word is always printed so no information is lost, and the ladder-as-filter
      answers "show me the Ready ones" better than any per-card mark could.

      '
  - id: VTC-306
    severity: major
    title: The anonymous shop window is a card that says "No read yet" and "No zone — stand aside"
    evidence: '40-anon-locked-dark-en.png, 40-anon-locked-dark-en--full.png, 42-anon-locked-390-dark.png,
      41-anon-locked-light-zh.png — the single unblurred specimen is GPCR: dashed grey "No read yet"
      chip, -2.1% change, grey chart, "No zone — stand aside". The choice is mechanical (top of the
      priority sort) and per the ledger 97/179 rows carry the no-read stance, so it recurs. At 390w
      (42-anon-locked-390-dark.png) that one card is the ENTIRE above-the-fold product demonstration
      — the purple gate sits below the fold. Compounding: the gate copy promises "entry, target and
      void levels included" while the paid card behind it prints a zone, not those three numbers (they
      exist only in the table, 60-table-invalidated.png).

      '
    production_behavior: 'The board''s proof to a visitor was quantitative and mid-page: "Track record
      · 59% win · +0.45% a trade" plus a fired row at +40.9% (prod-desktop-dark-en-standouts-board.png).

      '
    proposal_behavior: 'One free card chosen by sort order, plus a gate that describes a richer card
      than the one on show.

      '
    why_it_matters: 'The secondary user job is an anonymous visitor deciding whether the machine is
      real. The single artifact offered as evidence is a card on which the machine states it has no
      read and no zone — the least persuasive object on the board — and the gate''s copy writes a cheque
      the surface does not cash.

      '
  - id: VTC-307
    severity: major
    title: The page decays to nothing — it ends on five empty pills and four bare links with no number
      anywhere
    evidence: '00-R3-dark-en--full.png (bottom) and 40-anon-locked-dark-en--full.png: "MARKET CONTEXT
      · the weather, not the trade" renders five bare navigation pills (Breadth / Indexes & mega-caps
      / Flow / Rates / Regime) carrying no content at all; "EVIDENCE & RECORD" renders four bare text
      links (Track record / How Prophet works / Calibration lab / Closed plans archive) carrying zero
      numbers. Page rhythm on the 2782px full crop: grid ~60% of the page, then Candidates, then Groups,
      then Market context, then Evidence — each section thinner and emptier than the one before.

      '
    production_behavior: 'Track record rendered as a chip with a sparkline glyph and live figures mid-page,
      and the page closed on a designed CTA panel ("Expand the Prophet shortlist").

      '
    proposal_behavior: 'Two consecutive sections that are pure navigation furniture, as the last thing
      on the page.

      '
    why_it_matters: 'A section header that promises market context and delivers five link pills reads
      as unfinished, and a board that ends on its emptiest row leaves the impression that the product
      runs out of material. This is a composition problem independent of the reachability question in
      the ledger: even if the links resolve, the page''s closing move went from evidence to a nav list.

      '
  - id: VTC-308
    severity: major
    title: Multi-episode and Resolved render ~20 visually identical husk cards, each printing "PRIORITY
      —"
    evidence: '30-multi-episode-en.png — 19 of the 20 visible cards are the same object: grey "No read
      yet" chip, "— —" quote placeholder, ticker, "PRIORITY —", an Episode N of M chip, a bar plus "Entered",
      "No zone — stand aside". 27-filter-resolved.png — 18 of 20 the same with "Closed — in the record".
      The null priority is styled but still labelled: board.css:522 (.pv-prin--na { color: var(--muted)
      }), so the word PRIORITY is repeated ~20 times beside an em-dash. Each card also carries the VTC-301
      void.

      '
    production_behavior: Not represented — production had no episode or resolved card surface.
    proposal_behavior: 'The full card component is reused for rows that have no chart, no quote, no
      stance and no priority.

      '
    why_it_matters: 'A 5-across grid of near-identical husks has no hierarchy — there is nothing for
      the eye to land on and no basis on which the sort can be read. The artifact already proves the
      better instrument: 10-fallback-dark-en.png renders exactly this content as clean ~78px compact
      rows. The card is simply the wrong form for a priority-less archive, and 25 of the 159 live rows
      are in this state interleaved into the main grid (per the lens note on 30-multi-episode-en.png).

      '
  - id: VTC-309
    severity: minor
    title: Candidates restates six names already on the grid, contradicting its own copy, and its shelf
      pills carry prose tails
    evidence: 'board.js:632 — "var cr = B.cand_rows.slice(0, 6);" with no exclusion of names already
      rendered as setups. In 00-R3-dark-en--full.png all six candidate rows (DAR, MRK, GPCR, CVCO, KEYS,
      WBD) are also setup cards above, directly under copy reading "A candidate is not a setup: it becomes
      one only when a plan is written for it, which is what the board above counts." Separately the
      shelf pills embed explanation inside the pill — "35 Setting up not there yet — prepare", "12 Ran
      — don''t chase the move already started".

      '
    production_behavior: 'Triage shelves were two tokens each ("Setting up 27"); the Passed-on / Recently-fired
      lists named different stocks from the card grid.

      '
    proposal_behavior: 'A duplicate, visually downgraded restatement (bare row + price, no stance, lifecycle
      or zone) of names the user has just scanned, under copy asserting they are a different population.

      '
    why_it_matters: 'The section''s only reason to exist is the setup/candidate distinction, and the
      rendered data refutes it on screen. The prose-tailed pills also push explanation back into chrome,
      which is the pattern the 2026-08-03 kill removed from cards.

      '
  - id: VTC-310
    severity: minor
    title: ~35 lines of the stylesheet describe a five-lane action grid the artifact never renders
    evidence: 'board.css:615-647 (.actiongrid, .actcol, .act-buy/.act-soon/.act-run/.act-trim/.act-hold,
      .acth*, .act-row, .stance-sel) plus the mobile rules at board.css:771-772 (".stance-sel { display:
      flex }", ".actcol[data-lane]:not([data-lane=buy]) { display: none }"). Zero occurrences of actiongrid,
      stance-sel, data-lane or act-buy in board.js or index.html, so the mobile rules govern nothing.

      '
    production_behavior: 'This is production''s live "WHAT TO ACT ON NOW" five-lane module (prod-desktop-dark-en-pagetop.png).

      '
    proposal_behavior: Its styling is carried forward in the reference stylesheet but never rendered.
    why_it_matters: 'This artifact is about to become canonical law that follower pages inherit. Shipping
      a dead copy of a production module inside the reference invites a later surface to resurrect it
      by accident, and it obscures which of the reference''s components are actually normative.

      '
  - id: VTC-311
    severity: minor
    title: The light+zh stance ramp is a cascade side effect, not a design — it inherits the dark-mode
      deepeners
    evidence: 'board.css:72-74 declares --pv-buy/--pv-near/--pv-avoid inside html[data-lang="zh"], mixing
      toward the dark-theme partners #4a0f0f / #5a1616 / #06331f. board.css:76 (html[data-theme="light"][data-lang="zh"])
      redefines only --up/--down/--q1/--q3 and never the pv-* ramp. Since html[data-theme="light"] (line
      56) and html[data-lang="zh"] (line 72) carry equal specificity (0,1,1), the later zh block wins,
      so light+zh resolves --pv-buy to color-mix(#cf4040 80%, #4a0f0f) = #b43636 — 5.96:1 on white,
      which happens to be legible.

      '
    production_behavior: n/a — the zh flip is inherited from production's token contract.
    proposal_behavior: 'Three of the four theme x language quadrants have an explicitly authored stance
      ramp; light+zh does not, and lands where it lands by source order.

      '
    why_it_matters: 'The zh direction flip is load-bearing brand identity (design_lineage, _prophet_card.html.j2:14-16).
      Leaving one of its four quadrants unowned means a future edit to either the light block or the
      zh block silently re-tunes a shipped Chinese surface, and the heavier maroon it currently produces
      is visibly weightier than the light-en green it mirrors (00-R3-light-zh.png vs 00-R3-light-en.png).

      '
  - id: VTC-312
    severity: minor
    title: The page's headline claim invites an addition that does not visibly work
    evidence: '00-R3-dark-en.png — "159 live setups today · the six cells below add up to this number"
      sits above Watch(—) 62 95 0 0 2. The five printed integers reach 159 only if the dashed Watch
      cell is read as zero, and 24-filter-watch-absent.png states explicitly that the dash means not
      published, NOT zero ("This tier has a producer, but tonight''s build did not publish it yet —
      which is why the cell shows a dash rather than a zero").

      '
    production_behavior: '"69 shown · 93 setups" beside five shelf counts — the count defect this replaces.'
    proposal_behavior: 'A reconciliation claim attached to a row in which one of the six addends is
      deliberately blank; it reconciles tonight only because the absent tier happens to be empty.

      '
    why_it_matters: 'The reconciled count is this design''s headline honesty win, and the one sentence
      that advertises it asks the reader to perform a sum they cannot complete on screen. It undersells
      a genuinely good idea and will read as an error on any night the Watch tier is both unpublished
      and non-zero.

      '
  preserved_strengths: &id001
  - 'The empty-versus-absent distinction is the best design work in the artifact and production has
    nothing like it: 25-filter-delivering-zero.png reads "Nothing is in Delivering right now / The cell
    is empty today, not missing: a plan lands here when at or past the first target", and 24-filter-watch-absent.png
    reads "This tier has a producer, but tonight''s build did not publish it yet — which is why the
    cell shows a dash rather than a zero". Plain words, the mechanism named, a recovery button, and
    the section total honours the dash ("SETUPS — in Watch"). This is compliant null disclosure done
    as product writing rather than as a footnote.

    '
  - 'The uniform degraded grid (10-fallback-dark-en.png, 11-fallback-light-zh.png) is excellent and
    is more scannable than production''s card grid: five across, ~78px per card, ticker + priority +
    lifecycle mark + word + zone + date, and not one wasted pixel. It proves the design system can compress
    hard when the row is homogeneous.

    '
  - 'The ladder as both headline and filter is a real advance on production''s pill shelf: one population,
    large legible integers, and the terminal Resolved cell physically separated by a gap and a dashed
    border with "not in today''s count" (board.css:216-228). The reconciliation is shown rather than
    asserted, which is exactly the count cure production needed.

    '
  - 'The zh direction flip is wired correctly end to end, including on live change ink: board.css:69-76
    plus 00-R3-dark-zh.png, where -2.1% renders green and +0.8% renders red while the stance chip, chart
    stroke, zone label and Featured ring all flip to red. Load-bearing brand identity preserved, not
    merely translated.

    '
  - 'Light mode is designed rather than swapped: board.css:64-65 re-mixes every semantic ink toward
    --text via the --ink-mix-* ramp so saturated hues do not glare on white, and board.css:868-876 gives
