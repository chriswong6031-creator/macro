schema: mastermind.rig_review.v1
reference_id: prophet-board-5514-r3
artifact_sha: 6ad6b51bc351bb7e32a77960abe11f6ddb63475c

reviewer:
  identity: "independent Opus reviewer agent B — RIG r3 cycle, visual/taste critic"
  role: visual_taste_critic
  model: opus
