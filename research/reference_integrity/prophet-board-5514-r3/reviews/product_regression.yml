  - finding: PRC-303
    new_severity: major
    note: 'Q7 supplies a fact I did not have and it is a good one. Production''s GPCR "BUY" came through
      the management engine''s `recommended_action` — an engine that disclaims order authority — and
      the prior mapping defaulted an unobtainable stance to `wait`, originating a signal the engine
      never stated. The operator ruled the producer to be `entry_status` only (2026-08-13), factored
      from us_board_rank.py:365-368 and drift-pinned in gen_fixture/verify. Refusing the disclaimed
      verb is therefore a correct authority DE-escalation, not a regression. I WITHDRAW both the "the
      read was obtainable" component and the "GPCR differs from production" component, and I credit
      that §C fixed R2''s residual by putting GPCR back in the canonical view. WHAT SURVIVES, at major:
      the on-card incoherence. Q7 rules the stance producer and Q9 rules the ⚡ producer; nothing rules
      what happens when they land together. GPCR renders "⚡ Triggered" (tooltip: the trigger fired)
