      that instance was fixed and pinned, and the class recurred at a new site.

      '
    action: upheld
  - finding: PRC-321
    note: 'R2 PRC-216, upheld, and listed in the authority''s conditions ("390w Resolved partition (PRC-216)
      and the remaining B minors as polish"). Unaddressed. §3 still asserts "Resolved is outside the
      live count three ways: outside the enclosure past a divider, labelled ''not in today''s count'',
