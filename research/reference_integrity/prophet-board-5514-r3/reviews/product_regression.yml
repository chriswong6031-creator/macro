      the ledger states "NOT ESTABLISHED" in its own words. A RELOCATE whose destination renders four
      bare #ev anchors and zero figures is a REMOVE without its four mandatory fields. Not BLOCKED_DATA
      under any reading: production prints 59% win · +0.45% a trade, RECENTLY FIRED 12 with per-name
      outcomes, and Passed on tonight 27 of 69 today.

      '
    action: upheld
  - finding: PRC-308
    new_severity: minor
    note: 'Q1 + spawn gate G-D supply the fact I lacked, and it is a textbook legitimate BLOCKED_DATA:
      name/sector/lane/spark come through the candidate join at 45/179; the named insufficient contract
      is a per-plan enrichment block on index.json.plans[] keyed over the full book; it is explicitly
      not authorised by MP-1 and needs its own packet line; and the operator ruled it a hard implementation
      dependency before the production migration rather than a reason to weaken the reference. I WITHDRAW
      any fault for degraded cards appearing on the canonical board — that is the operator-ratified
      consequence of §C, and the alternative was R2''s PRC-203 blocker. WHAT SURVIVES, at minor: bookkeeping
      only. There is no capability id for card identity, so the loss of company name and sector rides
      on card.chart_hero''s disposition rather than carrying its own row — which is why my pass-1 read
      mistook an escalated dependency for an implicit deletion.

