    - id: PRC-317
      severity: minor
      title: Groups prints ranks from an undisclosed population
      capability_or_task: auth.groups_read (direction stronger, warranted true)
      evidence: >
        board.js:683 renders g.rank; the payload's eight themes carry ranks 1, 5, 6, 7, 9, 11, 12, 19 while the
        section header (board.js:664-665) reads "8 themes in favour". Visible in every full crop.
      production_behavior: n/a — sector intelligence lives elsewhere.
      proposal_behavior: >
        Eight cards numbered out of an unnamed universe of at least 19, with no statement of the denominator or
        of why 2, 3, 4, 8, 10 are absent.
      why_it_matters: >
        A rank without its denominator is a stronger claim than the producer supports — the user cannot tell
        whether "7 · Gold Miners" is 7 of 8 or 7 of 40. The section otherwise handles provenance well (as_of
        stamp, explicit no-read empty state), which makes the gap conspicuous.

    - id: PRC-318
      severity: minor
      title: Zero-width zones print as ranges
      capability_or_task: card.zone_chip (IMPROVE)
      evidence: >
        4 of the 61 zone-bearing rows have zlo == zhi (CENX 46.46, BKSY 26.73, FBRT 7.70, SBSI 32.52);
        board.js:404/407/410 render money(zlo) + "&ndash;" + money(zhi) unconditionally, producing
