    - id: PRC-320
      severity: minor
      title: The reference's own frozen reconciliation receipt is arithmetically wrong against its own fixture
      capability_or_task: add.population_reconciliation
      evidence: >
        index.html:27 — "Every count on the page reconciles against that payload: 62+96+0+0+4 = 162 = open_count."
        The fixture has ready 62, entered 95, invalidated 2, open_count 159, and the sum lists five addends for
        six cells (Watch omitted). index.html:25-26 names "site/prophet/index.json asof 2026-08-12" and
        "us_standouts.json as_of 2026-08-10" while board-data.js:1-6 and the payload carry asof 2026-08-13 and
        themes_asof 2026-08-12. index.html:21-22 enumerates ?state=paid|anon|empty|episodes, omitting the
        `fallback` state that board.js:98 implements and board.js:760 exposes in the harness.
      production_behavior: n/a
      proposal_behavior: >
        A stale hand-written receipt frozen inside the reference, contradicting the data file two lines below it.
      why_it_matters: >
        Non-user-facing, but it is the artifact's own proof of the count cure and it does not hold — the exact
        shape of a receipt written from the wrong variable. Anyone auditing the reference by reading its header
        gets 162/96/4 and a state list missing a state.

    - id: PRC-321
      severity: minor
      title: The mobile ladder collapses the separation that carries "Resolved sits outside the total"
      capability_or_task: task.population_truth (BETTER)
      evidence: >
        board.js:194 emits '<div class="mx-ladder-gap">' to hold Resolved apart from the six live cells on
        desktop. At ≤720px the ladder reflows to a 4+3 grid (crops 05-mobile390-dark-en.png,
        12-fallback-390-dark-en.png, 42-anon-locked-390-dark.png, 33-multi-episode-390-en.png), placing Resolved
        as the third cell of a row that also holds Overtime and Invalidated, with "not in today's count"
        (board.js:202) as a caption beneath the whole row.
      production_behavior: n/a
      proposal_behavior: >
        On mobile, Resolved reads as the seventh cell of a continuous ladder; only a dashed border and an
        ambiguously-placed caption distinguish it.
      why_it_matters: >
        The desktop composition is what makes "the six cells add up, Resolved does not" legible; on the smaller
        viewport the distinction rests on the caption alone, which is where the count claim is most likely to
        be misread.

  preserved_strengths:
    - "Count reconciliation is genuinely exact, and I could not break it: the six live cells sum to live_total
       (0+62+95+0+0+2 = 159), live_total + resolved = grand_total = len(rows) = 179, and rendered + '+N more'
       equals the published count in the unfiltered board and all seven lifecycle filters (7/7). This is a real
       cure for production's '69 shown · 93 setups' duplication, and it holds arithmetically, not just in the crop."
    - "The zero-vs-absent distinction is the best epistemic work in the artifact and is rare in shipped product:
       an empty cell says 'The cell is empty today, not missing: a plan lands here when …' (board.js:522), while
       an unpublished tier says 'This tier has a producer, but tonight's build did not publish it yet — which is
       why the cell shows a dash rather than a zero' (board.js:520). Crops 24, 25, 26 show all three forms."
    - "The empty-board state is handled with integrity: the Resolved record survives a quiet day
       (board.js:110), and the copy frames the null as a result rather than an outage — 'Nothing qualified
       tonight — that is a result, not an outage' (board.js:483; crop 50-empty-dark-en--full.png)."
    - "The zh direction-colour convention is implemented completely and correctly, not just on the change pill:
       board.css:69-76 flips --up/--down/--q1/--q3 and re-mixes --pv-buy/--pv-near/--pv-avoid under
       html[data-lang='zh'], with a light-theme override at higher specificity, so Buy renders red and Avoid
       renders green in both themes (crops 00-R3-dark-zh--full.png, 00-R3-light-zh.png, 23-filter-invalidated-zh.png).
       This is the operator's load-bearing colour law preserved rather than reasoned away."
    - "The operator's 2026-08-03 kill of verdict/what-to-do prose is respected in the strongest possible way:
       the payload carries do, do_zh, pulse and pulse_zh on all 179 rows and the card renders none of them.
       There is no paragraph anywhere on any card in any state."
    - "'No read yet' is a model null disclosure — it names the absence, distinguishes it from neutrality in its
       tooltip ('that is not the same as neutral, and not a hold', board.js:258), and is keyboard-reachable via
       tabindex plus the focusin handler at board.js:839-841. My complaint in PRC-303 is that it is applied over
       an available value, not that the pattern is wrong; the pattern is right and the chart and quote should
       have copied it."
    - "The Priority tooltip carries the ruled honest gloss verbatim — 'It is not a win probability, an expected
       return, or a confidence score' (board.js:339) — the value is never hued (board.css:399 keeps noread at
       --muted), and a missing score renders an em dash rather than a zero (board.js:342-343)."
    - "The caution capability returns as progressive disclosure — a counted pill opening a hover/focus popover
       (board.js:366-376) — rather than card prose, which is the correct resolution of the tension between the
       prose kill and the need to surface risk before acting."
    - "Episode handling is a genuine addition production does not have: one card per plan row with dated
       'Episode N of M' chips (board.js:377-382), so a name appearing twice is explained rather than confusing
       (crops 30/31/32/33). The forward-link half of it does not work (PRC-301), but the chips do."
    - "Groups is properly sourced: rank, recommendation, run length and member count come from the payload with
       an as_of stamp printed on the surface (board.js:696-698), and an absent key renders an explicit
       'No theme read published … Nothing is asserted in its place' (board.js:670-677) rather than authored
       filler. Dropping 22 authored sector rows for 8 sourced ones is the right trade."
    - "The ladder doubles honestly as the filter, every filtered view carries a labelled escape ('Clear filter' /
       'Show all live setups', board.js:221-224, 524-525), the active cell is aria-pressed (board.js:183), and
       the filter state round-trips through the query string and hash (board.js:798-812)."
    - "The Candidates/Setups separation is correct and well-explained: 'A candidate is not a setup: it becomes
       one only when a plan is written for it, which is what the board above counts' (board.js:619), with the
       shelf counts reconciling (22+35+12+1+0 = 70 = cand_total) and empty shelves rendering no chip
       (board.js:625)."
