    action: downgraded
  - finding: PRC-320
    note: 'Materially widened by the reveal. This is not one stale comment in index.html — DESIGN_NOTES
      is stale in the same way and more extensively. Verified against the frozen fixture: §0b-1 "162
      live" vs 159; §3 "Resolved still 17" vs 20; §5 "One printed total (69) … 28+27+10+2+2" vs 70 and
      22+35+12+1+0; §0b-4 Featured "10" vs 11 and New "40" vs 0. The pattern is clean and worth the
      authority''s attention: every R3-AUTHORED number reconciles exactly (§A 18 cautions, §B 19/7/35/118,
      Q1 45/179, Q7b 97/159, Q9 8/0), and every stale number sits in an R2 CARRY-OVER section that was
      not re-derived after line 53''s payload re-bake. Held at minor because none of it is user-facing
      — but these are the numbers the design authority reads to adjudicate, and line 53''s claim that
      "the invariants re-derived and still hold" is true only of the count invariants. R2''s own PRC-215
