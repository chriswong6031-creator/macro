  - The caution capability returns as progressive disclosure — a counted pill opening a hover/focus
    popover (board.js:366-376) — rather than card prose, which is the correct resolution of the tension
    between the prose kill and the need to surface risk before acting.
  - 'Episode handling is a genuine addition production does not have: one card per plan row with dated
    ''Episode N of M'' chips (board.js:377-382), so a name appearing twice is explained rather than
    confusing (crops 30/31/32/33). The forward-link half of it does not work (PRC-301), but the chips
    do.'
  - 'Groups is properly sourced: rank, recommendation, run length and member count come from the payload
    with an as_of stamp printed on the surface (board.js:696-698), and an absent key renders an explicit
    ''No theme read published … Nothing is asserted in its place'' (board.js:670-677) rather than authored
    filler. Dropping 22 authored sector rows for 8 sourced ones is the right trade.'
  - The ladder doubles honestly as the filter, every filtered view carries a labelled escape ('Clear
    filter' / 'Show all live setups', board.js:221-224, 524-525), the active cell is aria-pressed (board.js:183),
    and the filter state round-trips through the query string and hash (board.js:798-812).
  - 'The Candidates/Setups separation is correct and well-explained: ''A candidate is not a setup: it
    becomes one only when a plan is written for it, which is what the board above counts'' (board.js:619),
    with the shelf counts reconciling (22+35+12+1+0 = 70 = cand_total) and empty shelves rendering no
    chip (board.js:625).'
