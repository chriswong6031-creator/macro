      board (00-R3-dark-en--full.png, 00-R3-light-en.png) the degraded cards appear interleaved with
      no disclosure at all.

      '
    production_behavior: A verb-hued sparkline on every card; there is no blank state to explain.
    proposal_behavior: 'A silent empty rectangle on 20 of the 40 visible cards, which a user cannot
      distinguish from flat price, a broken render, or a design choice.

      '
    why_it_matters: 'House epistemics law''s compliant null form is a plain-word disclosure plus a Tier-2
      receipt — which this artifact does correctly for the stance ("No read yet" + a tooltip that distinguishes
