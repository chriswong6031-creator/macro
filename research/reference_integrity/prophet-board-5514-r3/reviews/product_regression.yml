  - finding: PRC-310
    note: 'Ownership is now shared, but the sentence is still false. §0b-5 records "下方 6 个状态合计" as an
      operator wording adopted verbatim — and the operator supplied the absence line ("「观察」将在下一次收盘更新后发布")
      too, so both halves of the contradiction are operator-sourced and neither party appears to have
      noticed they collide. §3''s "Key-absence is not zero" shows the designer reasoned carefully about
      the CELL and not about the headline that sums it. Under RIG §9 a prior decision is presumptively
      preserved but may be overturned explicitly; the correct disposition is a flag-back to the operator,
      not a unilateral rewrite — which is why I hold this at major rather than raising it.

      '
    action: upheld
  - finding: PRC-311
    note: 'Q3 answers a different component than the one I raised. It explains why the strip is THIN
      — the payload carries no transition dates, only age_days, so only the derivable figure is printed
      — and I accept that fully. It says nothing about SCOPE. Computing the count over the active result
      set `r` instead of `B.rows` (board.js:535) is a one-line change that invents no producer, and
      without it the board''s single "what changed" integer describes 179 rows inside a frame the user
