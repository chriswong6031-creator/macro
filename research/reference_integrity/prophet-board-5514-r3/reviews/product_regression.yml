    - id: PRC-314
      severity: major
      title: Resolved plans render as live — an active zone range, a live price, and a signed green change
      capability_or_task: card.zone_chip (IMPROVE — "stance-branched four ways") · task.lifecycle_position (BETTER)
      evidence: >
        board.js:400-417 tests zk === "active"/"readd"/"muted" BEFORE r.life === "resolved", so AGNT
        (life=resolved, zk=muted, zlo 4.10, zhi 4.22) prints "ZONE $4.10-$4.22" instead of "Closed — in the
        record". The quote overlay (board.js:321-329) is unconditional, so AGNT ($4.28, -2.4%) and FBRT
        ($8.05, +1.1% in up-ink) render a live price and change on closed, graded plans. AGNT also renders
        PRIORITY 69 where the other 19 resolved cards render "—". Crops 27-filter-resolved.png (AGNT is the
        first card) and 32-multi-episode-resolved.png (FBRT).
      production_behavior: Not represented — production has no Resolved treatment.
      proposal_behavior: >
        18 of 20 resolved cards are correct and quiet; 2 read as open positions, one of them with a live buy
        zone and a ranked priority.
      why_it_matters: >
        Resolved treatment is one of this reference's headline improvements and the first card of the Resolved
        filter is wrong. A closed plan showing a buy zone and a green change reads as an open position with a
        gain. The fix is a branch reorder, but as frozen the reference teaches the wrong precedence.

    - id: PRC-315
      severity: major
      title: >
        The Regime/Breadth/Posture removal is filed as an ADDITION, and its authority-delta row misstates
        production's baseline
      capability_or_task: add.regime_chips_removed · auth.market_read (direction "equal", warranted true)
      evidence: >
        The ledger files "the Regime / Breadth / Posture chips are deleted outright; nothing replaces them"
        under `additions`, where §1's REMOVE fields (rationale, user_job_impact, superiority_case, approval_ref)
        never apply and no baseline capability id exists to make it visible to the coverage rule. auth.market_read
        asserts production_claim "no board-level regime/breadth/posture assertion" — contradicted by the
        production baseline the ledger itself supplies: prod-desktop-dark-en-pagetop.png renders
        "Regime **Reflation**", "Posture **DEFENSIVE**", and "MARKET STATE **Risk-on** · conditions supportive"
        with a Risk radar link. Internally inconsistent too: board.js:703-712 reserves a five-tab "Market context"
        strip whose fifth tab is "Regime", rendered as dead #ctx anchors (crop 00-R3-dark-en--full.png).
      production_behavior: A stated market regime, posture and market-state read at the top of the route.
      proposal_behavior: >
        Nothing asserted, and five empty tabs where the assertion used to be.
      why_it_matters: >
        Removing an over-claiming market read may well be right — but under §1 it has to be a REMOVE with its
        four mandatory fields, not an entry in `additions`, and the authority-delta row cannot claim "equal"
        against a production baseline that plainly makes the claim. Filing a deletion as an addition is the exact
        route around the no-implicit-deletion rule this gate exists to close.

    - id: PRC-316
      severity: minor
      title: An unmapped payload slug ships as user-facing copy in both languages
      capability_or_task: add.themes_producer · auth.groups_read
      evidence: >
        board.js:653-659 defines RECO for accumulate/hold/watch/avoid/trim; board.js:681 falls back to
        '{ en: g.reco, zh: g.reco }'. The themes payload carries reco "enter" on theme 19 (Space Economy /
        太空经济), so the card reads "enter 5d up 15 names" in EN and "enter 5 天走强 15 只" in ZH — visible in
        00-R3-dark-en--full.png, 00-R3-dark-zh--full.png, 51-empty-light-zh.png and every other full crop.
      production_behavior: Sector intelligence lives on its own surface with mapped vocabulary.
      proposal_behavior: A raw producer slug, untranslated, on a recommendation card.
      why_it_matters: >
        Violates the bilingual content law and the banned-vocabulary rule (no raw slugs on glance-tier surfaces).
        The failure is silent by construction: any recommendation value the map does not know reaches the user
