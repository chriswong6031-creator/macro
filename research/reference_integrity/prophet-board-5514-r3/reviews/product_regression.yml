    action: upheld
  - finding: PRC-315
    note: 'Withdrawn on a fact I lacked. R2 PRC-207 establishes that the Regime/Breadth/Posture chips
      were the R2 MOCKUP''s own hardcoded string literals at board.js:718-720 — not a production capability
      — and the R2 design authority ruled PRC-207 blocking, requiring they be "sourced, removed, or
      unmistakably marked illustrative-fixture-only". The R3 deletion is therefore the authority-ordered
      remedy for a mockup-introduced defect, `additions` is the correct filing (the thing removed was
      itself a prior addition), and auth.market_read''s "equal / warranted" is defensible within the
      board''s scope. My pass-1 charge — that a deletion was filed as an addition to escape §1''s REMOVE
      fields — is refuted. Residual, offered as an ask rather than sustained as a finding: production''s
      page-top chips on the same route make "no board-level regime/breadth/posture assertion" ambiguous,
      so the reference should state its scope boundary for the migration builder; and add.regime_chips_removed''s
      "nothing replaces them" sits beside a five-tab Market context strip whose fifth tab is "Regime"
      (board.js:703-712).

      '
    action: withdrawn
  - finding: PRC-316
    note: 'Unaddressed, and the reveal identifies its origin. §D replaced R2''s 22 fabricated sector
      rows (the PRC-207 blocker) with payload-sourced themes rendering "rank, recommendation, run length
      and member count straight from the payload" — and "straight from the payload" is precisely the
      path that leaks an unmapped slug. RECO (board.js:653-659) knows five values; the payload carries
      a sixth ("enter"), and board.js:681 falls back to the raw string in BOTH languages. A correct
      remedy for a producer-less section introduced an untranslated internal token in its place.

      '
    action: upheld
  - finding: PRC-317
    note: 'Unaddressed; same §D sourcing lineage. Ranks 1, 5, 6, 7, 9, 11, 12, 19 are printed beside
      "8 themes in favour" with no denominator, so the surface exposes a scale of at least 19 while
      naming 8 members. §D takes care to print the as_of and to refuse invention on an absent key —
      the missing denominator is the one provenance fact that did not make it onto the surface.

      '
    action: upheld
  - finding: PRC-318
    note: 'Unaddressed. §B enumerates the four-way branch and its exact tally but not the zero-width
      case; 4 of the 61 zone-bearing rows have zlo == zhi and render "$X–$X", including CENX on the
