    action: upheld
  answers:
    blocked_data_ruling: 'No. None of the three convert, and the artifact itself shows why — it knows
      how to file a real BLOCKED_DATA and did so twice. Q1/G-D item 2 (name/sector/lane/spark at 45/179)
      and Q7b/G-D item 1 (entry_status at 61/179, 97 of 159 live rows blocked) each name the insufficient
      contract, name the escalation, name the interim, and are operator-ruled as hard dependencies gating
      the commissioning of the migration builder. Those are exemplary, and they are why I downgraded
      PRC-308 to bookkeeping and withdrew my fault for degraded cards on the canonical board. PRC-301
      (card link) — NO. A navigation target is not data. stock.html#TICKER is the live production route
      today, the payload carries id and tk on 179/179, and nothing is missing but the anchor element.
      The artifact instead ships a non-link <article> that retains text-decoration:none (board.css:384)
      and a hover lift (board.css:387) — the affordance without the destination, which is the precise
      thing R2''s condition told it to resolve either way. It appears on no keep, drop or must-go list
      in DESIGN_NOTES §1 or in the designer''s own three-way compare. This is the "chose not to build"
      case the coordinator names, and calling it blocked would be the reverse error §1 warns about.
      PRC-305 (staleness) — NO. Every input exists inside the artifact: it holds asof 2026-08-13, cand_asof
      2026-08-12 and themes_asof 2026-08-12 simultaneously and prints one unconditional "Settled close"
      token. Production computes and renders the behind-state from the same lane today. What is missing
      is a UI state, not a producer. The R3 payload re-bake to a same-day asof means the reference cannot
      exhibit the state even in principle, so the omission is now unfalsifiable from the crops — the
      opposite of what an escalation would achieve. PRC-306 (77 card-unreachable rows) — NO. GRID_CAP=40
      is a literal (board.js:230) and the seven table columns are a literal (board.js:561-562). Priority
      exists on 93/179 and stance on 62/179; adding them as columns invents no producer, and where they
      are null the card tier already ships the em-dash path. The one genuinely data-bounded aspect —
      that many table rows would show a dash — is the artifact''s own established idiom, not a blocker.
      The converse rule the authority should apply: G-D and Q2 are hard dependencies on what may ship
      to PRODUCTION. They do not license a frozen REFERENCE to omit a UI state whose data it already
      holds (305), a navigation target that needs no data at all (301), or a surface cap that is an
      integer literal (306). R2''s authority said this in terms and it still governs: "a hard production
      dependency governs what ships to production — it does not authorize a frozen reference" with the
      defects it does not cover.

      '
    design_notes_contradiction: 'It holds, and §0b-1 is the stale leftover. Verified in code: board.js:106
      declares `var isRef = S.state === "paid" || S.state === "today"` and NEVER reads it; rows() (board.js:132-147)
      applies only the episodes, fallback, life and resolved filters, with no state=paid subset anywhere.
      The frozen fixture is one universe — 179 rows, 159 live, 97 no-read, 40 rendered + "+119 more"
      = 159 — so §C is what ships and the dead isRef variable is the literal vestige of the deleted
      exemption. §0b-1''s "33 today", "162 live · the Prophet book" and "state=today is … the state
      the count law is verified against" describe the R2 artifact; that is corroborated by R2''s PRC-203
      blocker, which recorded exactly that behaviour, and by §C''s own text naming "the earlier ''reference
      renders 33, headline says 162'' split" as the thing it removed. The stale-number sweep confirms
      the boundary: §0b-1''s 162, §3''s 17 Resolved and §5''s 69/28+27+10+2+2 are all R2 values, while
      every R3-authored figure reconciles exactly. The more important half of your question: YES, the
      artifact now violates a design principle its own notes record, and the reversal is unadjudicated.
      §0b-1 does not merely describe — it states a rule: "A 60%-暂无判断 board must not become the flagship
      reference." R3 makes precisely that board the flagship reference (97 of 159 live rows, 61%, disclosed
      no-read; 13 of the 40 rendered cards). I judge the reversal CORRECT on the merits — the count-law
      exemption was an R2 blocker the authority ordered removed, §C''s remedy is the right one, and
      I credited it above. But RIG §9 is explicit that a prior decision may be overturned only explicitly,
      "never by omission", and nothing overturns this one. §C explains why the exemption went and asserts
      that "enrichment coverage now shows honestly on the cards instead of being filtered away"; it
      never returns to the recorded principle, and no keep/drop line, open question or lineage entry
      marks it as superseded. The practical cost is real, not clerical: the two passages describe different
      products — one shows 33 full-fidelity cards under a 162 headline, the other 159 rows at 61% no-read
      — and a migration builder handed this reference plus these notes has no way to tell which is law.
      The remedy is cheap: delete §0b-1 as superseded, or record the reversal as a lineage entry stating
      that the count law outranks the flagship-quality principle and that G-D is the mechanism intended
      to eventually satisfy both.

      '
    repeat_findings:
      third_consecutive_revision:
