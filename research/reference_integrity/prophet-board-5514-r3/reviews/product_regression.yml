  findings:

    - id: PRC-301
      severity: blocker
      title: The card-to-name-detail link is deleted outright, with no capability id and no disposition
      capability_or_task: task.open_name_detail (no baseline capability id exists — that is part of the finding)
      evidence: >
        board.js:286 opens the card as '<article class="' + cls + '" data-life=...' — an <article>, not an
        <a>. The only href a card can emit is board.js:389 '<a class="pv-newer" href="#id=' + esc(r.newer) + '">',
        present on 2 of 179 rows. Those anchors are inert twice over: cards carry data-id (board.js:287), never
        an id attribute, so the fragment matches no element; and nothing in board.js reads location.hash
        (board.js:804 and 811 only write it). Production: prod-desktop-dark-en-card-zoom.png and the board
        shots show the whole card as a link to the per-name detail. The capability ledger has no id for it,
        so it never received a disposition — yet production_core_interactions names it ("toggle grid/table;
        open a name via card link").
      production_behavior: >
        Every card is a link into the per-name read (stock.html#TICKER); the deeper receipts, plan and dossier
        are one click from any card on the board.
      proposal_behavior: >
        0 of 179 names route anywhere. The board is a terminal surface: the user can see a name and can see
        nothing further about it.
      why_it_matters: >
        This is RIG §1 implicit deletion of a core navigation capability — the mechanism the gate exists to
        stop. The ledger's own matrix marks task.open_name_detail critical:true / WORSE, which under §6 is
        review-blocking until adjudicated; because no capability id covers it, the checker's ledger-coverage
        rule (L2) cannot see it at all. "Choose which setups to work on today" is not completable when the
        board cannot hand a name off to the read that justifies it.

    - id: PRC-302
      severity: blocker
      title: The anonymous gate promises entry, target and void levels that no card at any tier renders
      capability_or_task: auth.anon_gate_copy (ledger direction/warranted both "unresolved") · task.anon_proof
      evidence: >
        board.js:437-439 — "The rest are part of the live board — entry, target and void levels included.
        The counts above stay honest whether you subscribe or not." ZH at the same lines: "其余计划同在这块看板上，
        含入场价、目标价与失效价。" The card renderer (board.js:275-421) never emits r.entry, r.inval or r.t1;
        those three fields appear only inside the table branch (board.js:560-576). Crops
        40-anon-locked-dark-en--full.png and 41-anon-locked-light-zh.png show the promise sitting directly
        beneath the single unlocked card (GPCR), which reads "No read yet" and "No zone — stand aside".
      production_behavior: >
        Production makes no such promise; its conversion panel says "Expand the Prophet shortlist — more
        model-ranked setups, with the same signal detail and discipline" (prod-desktop-dark-en-standouts-board.png).
      proposal_behavior: >
        The paying-tier surface the visitor is being sold — the card grid, which is the default view — carries
        none of the three named numbers. They exist only if the user finds and toggles the table view, which
        the gate copy never mentions.
      why_it_matters: >
        A specific, checkable product promise at the paywall that the product does not keep in its default
        state. Under §6 this is authority the engine does not warrant, made worse by being the one place the
        product speaks to someone deciding whether to pay. I resolve the ledger's "unresolved" row as NOT warranted.

    - id: PRC-303
      severity: blocker
      title: >
        The rank-1 card contradicts itself and contradicts production — "No read yet" and "No zone" on a name
        the payload calls FRESH BUY, beside a "trigger fired" chip and a caution naming the buy zone it denies
      capability_or_task: card.stance_verb (IMPROVE) · auth.stance_source (claimed weaker / warranted true)
      evidence: >
        Fixture row GPCR: verb "FRESH BUY", stance "blocked_data", trg "triggered", zk "none", star true,
        pri 90.5, flags [["Already moving. Don't chase above the buy zone.", ...]]. Rendered
        (crops 00-R3-dark-en.png, 00-R3-dark-zh--full.png, 05-mobile390-dark-en.png, 40-anon-*, 07-*):
        "No read yet" chip (board.js:296-299, tooltip "The entry read ... has not published for this plan"),
        "⚡ Triggered" chip (board.js:310-312, tooltip "The entry trigger fired in the last few sessions"),
        "⚠1" whose only sentence names "the buy zone", and a footer reading "No zone — stand aside"
        (board.js:416). Production renders the same name, same board, as BUY with ZONE $52.15-$53.81
        (prod-desktop-dark-en-card-zoom.png). Arithmetic: 5 rows carry a payload verb yet render "No read yet"
        (GPCR, VSEC, DXYZ, AYI, CSR); 3 rows pair a "buy zone" caution with a "No zone" footer, 2 of them
        (GPCR, VSEC) inside the visible 40; both are ★Featured.
      production_behavior: >
        One ruling stance word per card, present, and a zone chip that agrees with it.
      proposal_behavior: >
        The board's highest-priority, Featured, trigger-fired card tells a paying user there is no read and
        nothing to do, while warning against chasing above a zone it says does not exist.
      why_it_matters: >
        This is the first card in every desktop crop, the only card the anonymous visitor sees, and the exact
        card production chose for its own anatomy zoom — the head-to-head is unavoidable. It falsifies
        auth.stance_source's "unobtainable -> disclosed absence, warranted: true": for these rows the read was
        obtainable, it is in the same row of the same fixture. An honest null is a strength; a null asserted
        over an available value, next to two chips that assert the opposite, is an incoherent claim on the
        face of the product.

    - id: PRC-305
      severity: blocker
      title: Degraded-freshness disclosure is deleted; the header can only ever assert "Settled close"
      capability_or_task: task.staleness_awareness (critical:true, ledger verdict WORSE; no capability id exists)
      evidence: >
        board.js:724-746 header() emits '<span class="dtp-token closed">…Settled close</span>' plus
        esc(B.asof) unconditionally — there is no branch, and a grep of board.js/board.css for
        stale|behind|degrad|delayed|outdated returns only board.js:306 ("fired in the last few sessions") and
        the .dtp-token CSS at board.css:132-139. Production carries a persistent amber banner in all four
        board captures — "Still ranked on prices as of 2026-08-10 — 2 sessions behind. We're updating it;
        check a live quote before you act." (zh: "仍按截至 2026-08-10 的价格排序，落后 2 个交易日…") — plus the
        header line "dots reflect prices as of 2026-08-10 — verify before acting" and a page-top
        "● Delayed 2026-08-10" pill (prod-desktop-dark-en-pagetop.png).
      production_behavior: >
        When the ranking prices are behind the tape, the board says so before anything else, in both languages,
        on desktop and mobile, and tells the user what to do about it.
      proposal_behavior: >
        A single "Settled close · 2026-08-13" token in the page head. No state, anywhere in the artifact, can
        express that the board is behind.
      why_it_matters: >
        The one disclosure on this surface that exists to stop a user acting on stale prices. It is not in the
        capability ledger, so it received no disposition — implicit deletion of a safety capability. It is also
        authority inflation by omission: a board that can only say "Settled close" asserts a freshness it has
        no mechanism to verify, on exactly the day when production would be warning the user.

    - id: PRC-306
      severity: blocker
      title: >
        77 of 179 plan rows can never be rendered as a card in any state or filter; their only representation
        is a seven-column table that drops priority, stance, zone, chart, caution, sector and company name
      capability_or_task: card.priority_score (RETAIN) · task.readiness_rank (BETTER) · task.table_overflow
      evidence: >
        GRID_CAP = 40 (board.js:230); shown = r.slice(0, GRID_CAP) (board.js:585). Computed union of the
        rendered top-40 across state=paid and all seven life filters = 102 of 179 rows; 77 rows are card-
        unreachable. Overflow routes to '?view=table' (board.js:597). The table's columns are fixed at
        board.js:561-562: Ticker · Lifecycle · Entry · Void · First target · Opened · Episode — verified in
        crops 60-table-invalidated.png and 61-table-resolved-zh.png. Null-priority rows sort last
        (board.js:154, ap = a.pri == null ? -1 : a.pri), so the 86 rows with no priority are pushed below the
        cap by construction, and the only surface that reaches them has no priority column.
      production_behavior: >
        "Showing 15 of 74 · Show 15 more · Show all 74" (desktop) / "Showing 6 of 74 · Show 6 more · Show all 74"
        (mobile) — user-controlled progressive expansion that keeps every row in the card tier with its verb,
        hue, chart, priority, tracker and zone intact.
      proposal_behavior: >
        A hard 40-card ceiling with no expander, and a single overflow route into a stripped table. 119 of the
        159 live rows on the default board are reachable only as Ticker + Lifecycle + three dollar levels.
      why_it_matters: >
        card.priority_score is filed RETAIN and task.readiness_rank BETTER, but for 119/159 rows on the default
        board there is no surface in the artifact that shows a priority at all — the disposition overstates.
        Production's in-place expansion is itself a user capability with no ledger id and no disposition
        (implicit deletion). And the substitution inverts the reference's own authority discipline: the rows a
        user can least contextualise are the ones presented purely as execution numbers (see PRC-313).

    - id: PRC-304
      severity: major
      title: Every price-change value in every crop is a hash of the ticker string, rendered with direction ink
      capability_or_task: card.live_change (RETAIN) · task.price_now (BETTER) · task.momentum_context (WORSE)
      evidence: >
        board.js:269-273 — demoChange(tk) returns ((hash(tk) % 61) - 28) / 10, a pure function of the ticker
        with no market input; board.js:321-329 renders it into '.nb-chg pv-chg' with an up/down class and, when
        non-null, data-mock-live="1" (an invisible attribute). Reproduced independently and matched to the
        crops exactly: GPCR -2.1%, FTI +0.7%, DAR +0.8%, MRK +2.1%, CVCO +3.2%, SGML -2.8%, KEYS +1.2%,
        AGNT -2.4%, FBRT +1.1%. Production's own captures render this pill as "—"
        (prod-desktop-dark-en-card-zoom.png: "$53.81 —").
      production_behavior: >
        The change pill is bound to live.js and shows an em dash when unhydrated — production's committed
        evidence shows the honest dash.
      proposal_behavior: >
        45 cards display an invented signed percentage in up/down colour; the remaining 134 show "—". Nothing
        visible distinguishes the two populations' provenance.
      why_it_matters: >
        The crops are the artifact the design authority and every downstream migration reviewer compare against;
        a conformance check will "match" a fabricated number. It also props up two matrix verdicts: task.price_now
        is scored BETTER and card.live_change RETAIN is justified as "the one place direction ink appears on the
        card; zh flip pinned by verify.py" — so the direction-colour guard is being pinned against hash output
        rather than data. The design (unconditional slot, live.js-bound) is sound; a condition to render the
        existing em-dash path instead of demoChange fully carries this.

    - id: PRC-307
      severity: major
      title: board.track_record_strip is filed RELOCATE to a destination that renders no numbers at all
      capability_or_task: board.track_record_strip (RELOCATE, reachability "NOT ESTABLISHED") · task.anon_proof
      evidence: >
        board.js:713-721 evidence() emits four bare anchors — Track record / How Prophet works / Calibration lab
        / Closed plans archive — all href="#ev", and no numeric content whatsoever. Confirmed in
        00-R3-dark-en--full.png, 40-anon-locked-dark-en--full.png and 50-empty-dark-en--full.png. Production
        renders "Track record · 59% win · +0.45% a trade →", a "measurement updated" chip, "What changed today · 30 →",
        "RECENTLY FIRED 12" with "SGHT +40.9% since signal · fired 8 sessions ago", and "Passed on tonight 27 of 69"
        with an earnings-watch row (prod-desktop-dark-en-standouts-board.png; zh and light equivalents).
      production_behavior: >
        Four independent quantitative proofs of the machine, on the board itself, above the fold on mobile.
      proposal_behavior: >
        Four link labels. An anonymous visitor gets no number, and neither does a paying one.
      why_it_matters: >
        RIG §1 requires a RELOCATE to carry proof the user can still reach the capability; the ledger honestly
        records that it cannot. A RELOCATE whose destination is a placeholder is a REMOVE that never had to
        supply rationale, user_job_impact, superiority_case or approval_ref. "Judge whether the machine is real"
        is the stated secondary user job and the proposal has no answer for it. Note the same silent loss covers
        "Passed on tonight" and "Recently fired", neither of which has a capability id either.

    - id: PRC-308
      severity: major
      title: Company name and sector disappear on 134/179 rows with no capability id, no disposition and no disclosure
      capability_or_task: (no ledger id) — folded into card.chart_hero's BLOCKED_DATA dependency string only
      evidence: >
        nm and sec are present on 45/179 rows (arithmetic). board.js:335 and 345 emit them only when truthy, so
        the rest render a bare ticker. In the flagship crop 00-R3-dark-en--full.png, 20 of the 40 rendered cards
        show no company name and no sector: RIO, FN, CENX, ROIV, HP, DAN, ADAM, RGTI, WINA, USAR, XPEL, WT,
        HASI, BHP, NGVT, NVDA, FCX, BNY, MDB, SOUN. Production's information hierarchy carries
        "ticker · company · PRIORITY" and "sector · chips" as separate rows on every card
        (prod-desktop-dark-en-card-zoom.png).
      production_behavior: Every card names the company and its sector.
      proposal_behavior: >
        Half the visible board, and 75% of the full book, is a four-letter ticker with no identity.
      why_it_matters: >
        The BLOCKED_DATA dependency string names "name/sector/lane/spark" but the disposition is attached only
        to card.chart_hero; there is no capability id for card identity, so two production hierarchy rows are
        deleted without any disposition of their own — §1 implicit deletion. Sector is also load-bearing for the
        Groups section the same page renders: a user cannot connect "Accumulate: Gold Miners" to a card whose
        sector is blank.

    - id: PRC-309
      severity: major
      title: >
        The chart null is hidden rather than printed, and the stated interim ("slot at chart height") is not
        what the artifact does
      capability_or_task: card.chart_hero (BLOCKED_DATA — interim field)
      evidence: >
        board.css:458-462 sets '.pv-nochart { height: 24px; ... }' against '.pv-chart svg { height: 74px }'
        (board.css:447) — one third the height on desktop; they match only under the ≤720px rule at
        board.css:896. The slot carries no text: board.js:291 emits '<div class="pv-nochart"></div>'. The only
        explanation of what the blank means lives at board.js:497-501 and renders exclusively under
        state=fallback — a mockup-only lens (crops 10/11/12) that no user can reach. On the canonical board
        (00-R3-dark-en--full.png, 00-R3-light-en.png) the degraded cards appear interleaved with no disclosure
        at all.
      production_behavior: A verb-hued sparkline on every card; there is no blank state to explain.
      proposal_behavior: >
        A silent empty rectangle on 20 of the 40 visible cards, which a user cannot distinguish from flat price,
        a broken render, or a design choice.
      why_it_matters: >
        House epistemics law's compliant null form is a plain-word disclosure plus a Tier-2 receipt — which this
        artifact does correctly for the stance ("No read yet" + a tooltip that distinguishes absence from
        neutral, board.js:254-260) and not at all for the chart or the quote. §1 requires BLOCKED_DATA to state
        what the UI does meanwhile; the UI states nothing, and the ledger's description of the slot is
        contradicted by the CSS.

    - id: PRC-310
      severity: major
      title: >
        "the six cells below add up to this number" is asserted while the surface simultaneously discloses that
        one of the six has no published value
      capability_or_task: task.population_truth (verdict BETTER) · board.triage_shelves (IMPROVE — the count cure)
      evidence: >
        board.js:167-173 prints liveTotal() = 159 with the sub-line "the six cells below add up to this number";
        board.js:186 renders Watch as '&mdash;' when watchAbsent(); board.js:206-209 prints "Watch tier publishes
        from the next nightly." The published live_total was computed with the unknown Watch treated as zero
        (62+95+0+0+2 = 159). Both statements appear on the same screen in every crop; crop 24-filter-watch-absent.png
        makes the contradiction explicit — "This tier has a producer, but tonight's build did not publish it yet
        — which is why the cell shows a dash rather than a zero" sits under a headline claiming exact six-cell
        reconciliation.
      production_behavior: >
        Production's defect is the opposite one — duplicated vocabulary ("69 shown · 93 setups" beside five shelf
        counts) — but it never claims an identity it cannot support.
      proposal_behavior: >
        Claims exact reconciliation over six addends, one of which it states is unknown.
      why_it_matters: >
        Population truth is the reference's flagship claim and the matrix scores it BETTER. The arithmetic is in
        fact exact for the five published cells (verified 7/7 across filters) — the defect is the sentence, which
        overstates by one cell and is refuted by the product's own absence note. Either the headline scopes to the
        published cells or the total is disclosed as provisional.

    - id: PRC-311
      severity: major
      title: >
        "What changed today · N opened in the last day" is computed over the whole book and printed inside every
        filtered view
      capability_or_task: task.population_truth (BETTER) · add.population_reconciliation
      evidence: >
        board.js:535-537 — fresh = B.rows.filter(...) — filters the full 179-row book, never the active result
        set r, and the strip is emitted at board.js:538-545 for every non-empty state. Crop
        22-filter-invalidated.png shows "15 opened in the last day" above 2 cards; 27-filter-resolved.png shows
        the same 15 above 20 closed plans; 60-table-invalidated.png shows it above a 2-row table.
      production_behavior: >
        Production's equivalent ("What changed today · 30") sits outside the filtered grid, attached to the board
        as a whole.
      proposal_behavior: >
        A count describing 179 rows is rendered inside a frame the user has just narrowed to 2.
      why_it_matters: >
        It is the one printed integer on this board that does not describe the population on screen, inside the
        reference whose stated cure is "one population behind every printed integer". Fixing it is a one-line
        scope change; leaving it in the reference makes the defect law.

    - id: PRC-312
      severity: major
      title: Two prescriptive vocabularies collide on the card — 27 "Entered" plans carry a "Wait" stance chip
      capability_or_task: card.stance_verb (IMPROVE) · card.stage_tracker (IMPROVE) · task.act_today_boundary
      evidence: >
        Lifecycle x stance cross-tab over the fixture: entered+wait 27, entered+buy 4, ready+hold 2. 13 of the
        40 cards the default board renders carry a colliding pair (11 of them Entered+Wait). Crop
        21-filter-entered.png: HP, DAN, RGTI, WINA, HASI, CENX and others read "WAIT" above "Entered";
        crop 33-multi-episode-390-en.png shows FBRT reading "WAIT" above "Entered" above "ZONE $7.70-$7.70".
      production_behavior: >
        One prescriptive word per card (the verb) plus a descriptive price-shape rail
        (Bottoming→Turning→Ready→Trend) that makes no action claim — so the two never contradict.
      proposal_behavior: >
        An action word ("Wait") sits directly above a position word ("Entered"): the card tells a user who is
        already in the trade not to enter yet.
      why_it_matters: >
        The design lineage records "second lifecycle chip beside the rail" as a rejected variant on exactly this
        ground ("one lifecycle vocabulary per card", red-team #3). The proposal reintroduces the collision in a
        different form. task.act_today_boundary is scored UNKNOWN; on the visible board it is worse than UNKNOWN
        for a third of the cards, because the two instruments give opposing instructions.

