    - id: PRC-319
      severity: minor
      title: >
        Three of the seven ruled lifecycle cells have no card rendering anywhere in the artifact, while
        proposal_screenshot_gaps asserts there are none
      capability_or_task: card.stage_tracker (IMPROVE — "ruled seven-cell lifecycle")
      evidence: >
        Fixture counts are watch 0, delivering 0, overtime 0, so no Watch, Delivering or Overtime card can ever
        render (crops 24, 25, 26 show only their empty states). new is false on 179/179, so the "New" chip
        (board.js:350) never renders — production's card carries it (prod-desktop-dark-en-card-zoom.png).
        trg === "imminent" on 0/179, so the Imminent branch (board.js:304-312) never renders. The ledger
        declares `proposal_screenshot_gaps: []`.
      production_behavior: n/a (different lifecycle vocabulary).
      proposal_behavior: >
        The reference canonicalising a seven-cell lifecycle demonstrates card treatment for four of them.
      why_it_matters: >
        A migration builder implementing against this reference has no reference for three ruled cells, the New
        chip, or the Imminent trigger state. The gap is a fixture-availability limit rather than a design
