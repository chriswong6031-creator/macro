      NEW in R3 and could not have existed in R2, where the caution was deleted entirely (that was R2''s
      PRC-201). Restoring the risk ledger created a collision the rationale never anticipated: 3 rows
      pair a "buy zone" caution with a "No zone" footer, 2 of them (GPCR, VSEC) among the 40 rendered,
      both ★Featured.

      '
