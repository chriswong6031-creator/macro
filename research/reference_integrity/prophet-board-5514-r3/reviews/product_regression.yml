  - finding: PRC-312
    note: 'R2 PRC-208, upheld in both passes, and an explicit authority condition ("resolve the Wait-beside-Entered
      gloss collision with one vocabulary rule on-card"). Unaddressed in §0a and in every open question.
      It is now more prevalent in absolute terms — 27 Entered+Wait rows against R2''s 17 of 33 — and
      R2''s second exemplar survives with the same tickers: 5 rows read "⚡ Triggered" beside "Ready",
      where the board''s own gloss defines Ready as "plan armed, trigger not fired" (DAR, MRK, KEYS,
      KALU, STLD; DAR and STLD are R2''s named pair). §5 remains the sharpest evidence against it: the
      designer holds the one-referent-per-page law and applied it to two SECONDARY Candidates sub-lines
      for the same 入场 collision, while leaving it on the primary card for a second consecutive cycle.

      '
    action: upheld
  - finding: PRC-313
    note: 'R2 PRC-212, upheld and strengthened, and an explicit authority condition (drop the levels
      or re-adjudicate the card-tier ban). Neither was done: §1 line 200 RESTATES the ban in R3 — "The
      Entry / T1 / Void three-number footer … framed Prophet as an order-execution oracle … exact levels
      live in plan detail" — while board.js:561-572 still ships all three as table columns one toggle
      from the grid. New in R3: AGNT prints void $5.49 above entry $4.28 on a BULL plan, unflagged,
      in the resolved table (crop 61) — evidence that the surface applies no validation to numbers it
      presents at execution precision.

      '
    action: upheld
  - finding: PRC-314
    note: 'Addressed nowhere in the reveal, and the causal chain matters for the authority. §B restored
      the zone_kind branch to cure R2''s PRC-202 blocker, and its tally is exactly right (19/7/35/118
      verified). But the restored branch tests zk before `life === "resolved"` (board.js:400-417), so
      a resolved row carrying a muted zone now prints a range — AGNT, the first card of the Resolved
      filter, renders ZONE $4.10-$4.22 with a live quote, a simulated -2.4% and PRIORITY 69 while the
      other 19 correctly read "Closed — in the record" and "PRIORITY —". This is a defect introduced
