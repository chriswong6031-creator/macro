    evidence: 'nm and sec are present on 45/179 rows (arithmetic). board.js:335 and 345 emit them only
      when truthy, so the rest render a bare ticker. In the flagship crop 00-R3-dark-en--full.png, 20
      of the 40 rendered cards show no company name and no sector: RIO, FN, CENX, ROIV, HP, DAN, ADAM,
      RGTI, WINA, USAR, XPEL, WT, HASI, BHP, NGVT, NVDA, FCX, BNY, MDB, SOUN. Production''s information
      hierarchy carries "ticker · company · PRIORITY" and "sector · chips" as separate rows on every
      card (prod-desktop-dark-en-card-zoom.png).

      '
    production_behavior: Every card names the company and its sector.
    proposal_behavior: 'Half the visible board, and 75% of the full book, is a four-letter ticker with
      no identity.

      '
    why_it_matters: 'The BLOCKED_DATA dependency string names "name/sector/lane/spark" but the disposition
      is attached only to card.chart_hero; there is no capability id for card identity, so two production
      hierarchy rows are deleted without any disposition of their own — §1 implicit deletion. Sector
      is also load-bearing for the Groups section the same page renders: a user cannot connect "Accumulate:
      Gold Miners" to a card whose sector is blank.

      '
  - id: PRC-309
    severity: major
    title: 'The chart null is hidden rather than printed, and the stated interim ("slot at chart height")
      is not what the artifact does

      '
    capability_or_task: card.chart_hero (BLOCKED_DATA — interim field)
    evidence: 'board.css:458-462 sets ''.pv-nochart { height: 24px; ... }'' against ''.pv-chart svg
      { height: 74px }'' (board.css:447) — one third the height on desktop; they match only under the
      ≤720px rule at board.css:896. The slot carries no text: board.js:291 emits ''<div class="pv-nochart"></div>''.
      The only explanation of what the blank means lives at board.js:497-501 and renders exclusively
