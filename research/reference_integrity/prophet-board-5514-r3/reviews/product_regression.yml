  preserved_strengths: &id001
  - 'Count reconciliation is genuinely exact, and I could not break it: the six live cells sum to live_total
    (0+62+95+0+0+2 = 159), live_total + resolved = grand_total = len(rows) = 179, and rendered + ''+N
    more'' equals the published count in the unfiltered board and all seven lifecycle filters (7/7).
    This is a real cure for production''s ''69 shown · 93 setups'' duplication, and it holds arithmetically,
    not just in the crop.'
  - 'The zero-vs-absent distinction is the best epistemic work in the artifact and is rare in shipped
    product: an empty cell says ''The cell is empty today, not missing: a plan lands here when …'' (board.js:522),
    while an unpublished tier says ''This tier has a producer, but tonight''s build did not publish
    it yet — which is why the cell shows a dash rather than a zero'' (board.js:520). Crops 24, 25, 26
    show all three forms.'
  - 'The empty-board state is handled with integrity: the Resolved record survives a quiet day (board.js:110),
    and the copy frames the null as a result rather than an outage — ''Nothing qualified tonight — that
    is a result, not an outage'' (board.js:483; crop 50-empty-dark-en--full.png).'
  - 'The zh direction-colour convention is implemented completely and correctly, not just on the change
    pill: board.css:69-76 flips --up/--down/--q1/--q3 and re-mixes --pv-buy/--pv-near/--pv-avoid under
    html[data-lang=''zh''], with a light-theme override at higher specificity, so Buy renders red and
    Avoid renders green in both themes (crops 00-R3-dark-zh--full.png, 00-R3-light-zh.png, 23-filter-invalidated-zh.png).
    This is the operator''s load-bearing colour law preserved rather than reasoned away.'
  - 'The operator''s 2026-08-03 kill of verdict/what-to-do prose is respected in the strongest possible
    way: the payload carries do, do_zh, pulse and pulse_zh on all 179 rows and the card renders none
    of them. There is no paragraph anywhere on any card in any state.'
  - '''No read yet'' is a model null disclosure — it names the absence, distinguishes it from neutrality
    in its tooltip (''that is not the same as neutral, and not a hold'', board.js:258), and is keyboard-reachable
    via tabindex plus the focusin handler at board.js:839-841. My complaint in PRC-303 is that it is
    applied over an available value, not that the pattern is wrong; the pattern is right and the chart
