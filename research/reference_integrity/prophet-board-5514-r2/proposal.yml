    proposal: "same instruments restored (chip/hue/chart/priority/zone) at reduced chroma budget + lifecycle word + sourced badges; three rows above the fold vs two"
    verdict: EQUIVALENT
    notes: "parity restored by design; the deliberate chroma reduction (chip+chart only) trades grid-level hue saturation for per-card coherence — critics judge whether scanning survives"

