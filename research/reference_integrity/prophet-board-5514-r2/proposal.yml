# ── Dispositions ───────────────────────────────────────────────────────────────
# Baseline ids with NO row: card.caution_popover — the ⚠N risk ledger has no
# carrier in the revised card (board.js card() 279-385 renders stance/trigger/
# quote/chart/identity/priority/marks/lifecycle/zone; no caution chip, no
# caution popover; DESIGN_NOTES never dispositions it). Founding PRC-003 stands.
dispositions:
  - id: card.chart_hero
    disposition: BLOCKED_DATA
    rationale: >
      Restored as the card's hero at shipped height (74px, spark zone band, verb-hue
      recolour law restored — board.js:293-295, DESIGN_NOTES §1 'Preserved from
      production'); coverage remains partial: spark_svg arrives via the candidate join
      on 45/179 rows; un-enriched rows render a quiet .pv-nochart slot.
    dependency: "per-plan enrichment block on index.json.plans[] keyed by ticker over the full plan book (name/sector/lane/spark) — today 45/179 (DESIGN_NOTES §6 Q1)"
    escalation: "spawn gate G-D minted in DESIGN_NOTES §7 (operator-ruled 2026-08-13: hard implementation dependency before MP-1 production migration, 'not another reason to weaken the reference'); PR #5514 body carries the gate table"
    interim: "state=fallback lens committed (crops 10-12) so the degraded card is reviewable: it still answers ticker, stance, priority, lifecycle, zone, date; state=paid renders only contract-met rows (33) as the canonical reference view"

  - id: card.live_quote
    disposition: RETAIN
    target: "unconditional quote slot overlaid top-right of the chart (board.js:319-333) — .nb-px[data-sym] node EXISTS on every card so live.js hydrates 100% of rows; un-hydrated reads an em dash exactly as the shipped card server-renders"

  - id: card.live_change
    disposition: RETAIN
    target: >
      .nb-chg pill beside the quote, direction ink (the one place direction ink
      appears on the card), zh flip pinned by verify G2-G4. Crop values are a
      disclosed deterministic demo overlay marked data-mock-live (DESIGN_NOTES §6
      Q10 — no committed artifact carries per-ticker intraday change; production
      value is real and client-painted).

  - id: card.priority_score
    disposition: RETAIN
    target: "PRIORITY label + 0-100 value in the shipped slot (board.js:341-347), honest non-win-probability tooltip restored; quiet by design, never hued; ruled by Priority Engine masterplan §3.8 (DESIGN_NOTES §6 Q8 — Edge stays the legacy fail-soft)"

  - id: card.zone_chip
    disposition: RETAIN
    target: "zone footer restored as the glance-tier abstraction — ZONE $lo–$hi with date pinned right (DESIGN_NOTES §2 anatomy); Entry/T1/Void three-number footer removed ('it framed Prophet as an order-execution oracle'); exact levels live in plan detail"

  - id: card.stance_verb
    disposition: IMPROVE
    rationale: >
      One-word stance chip restored top-left (Buy/Near/Wait/Hold/Avoid ·
      买入/临近/等待/持有/回避) with its producer now RULED: projected from Prophet's
      entry/actionability axis only, factored from the shipped engine buckets
      (us_board_rank.py:365-368 → four buckets → five verbs, DESIGN_NOTES §6 Q7);
      the prior fallthrough to the management engine's recommended_action was
      rejected as an authority violation. Drift mechanically prevented
      (gen_fixture refusal + verify M1-M4, mutation-tested). Unobtainable stance
      renders a disclosed hue-free "No read yet" chip — BLOCKED_DATA, never a
      guessed Wait (§6 Q7b).
    target: "stance chip, chart overlay top-left; solid badge for Buy only, tint+border for the rest (shipped hierarchy restored — correction pass §0b.3)"

  - id: card.verb_hue_identity
    disposition: IMPROVE
    rationale: >
      Restored with a deliberately reduced budget: chroma is spent on the stance chip
      and the chart (spark + zone band recoloured to --pvh via the shipped recolour
      law), direction ink only on the live change; the full-card verb wash
      (::before accent bar, verb-tinted border) is removed. zh 红涨绿跌 flip pinned by
      verify G2-G4 after the correction pass found the --pv-* family missing
      (DESIGN_NOTES §6 Q10 'fidelity bug found and fixed'). Lifecycle stays hue-free
      per ruling — hue on the stance channel, weight on the lifecycle channel, the
      two never collide (the founding verdict's reconciliation condition).
    target: "stance chip + chart hue; Featured is a ring, never a container wash; violet lock-only"

  - id: card.compact_glance_geometry
    disposition: IMPROVE
    rationale: >
      "Everything a reader needs is answerable without opening the card, and no
      paragraph is required for any of it" (DESIGN_NOTES §2). Plan-clock telemetry,
      paragraph what_to_do copy, and the Entry/T1/Void rows are all removed from the
      grid; vertical footprint reduced so three card rows are visible above the fold
      (§3, no semantics reduced).
    target: "card anatomy §2 — chip/trigger/quote row, chart, identity+priority, marks ≤3, lifecycle mark+word, zone footer"

  - id: card.stage_tracker
    disposition: IMPROVE
    rationale: >
      The producer-less four-dot rail stays retired (two of four steps structurally
      unreachable); replaced by the ruled seven-cell lifecycle, now compact on-card:
      weight mark + cell word, no gloss sentence (board.js:370-377). The card's top
      weight cap from v1 is removed so the mark does not compete with the chart —
      the ladder↔card link is carried by the inline mark.
    target: "ruled lifecycle mark + word in the card body; ladder cells with identity/selection on different geometric channels"

  - id: card.asof_stamp
    disposition: RETAIN
    target: "per-card as-of restored — the zone footer pins the signal date right (ZONE $70.66–$72.35 · Aug 10)"

  - id: board.triage_shelves
    disposition: IMPROVE
    rationale: >
      Candidates preserved as the second population with the shipped triage shelves,
      one printed total (69 = 28+27+10+2+2), two shipped sub-lines relabelled under
      the one-referent-per-page law (DESIGN_NOTES §5). Founding PRC-010 residue: the
      shelves render as pills without the production filter affordance.
    target: "Candidates section, pill shelves, non-adjacent to Setups"

  - id: board.track_record_strip
    disposition: RELOCATE
    destination: "§Evidence & record section (board.js:691-696: Track record / How Prophet works / Stage definitions / Past boards links)"
    reachability: >
      Section links render in the artifact, but the quantitative proof strip itself
      (59% win · +0.45% a trade · fired/passed-on rows) is NOT rendered anywhere in
      the mockup — the links are placeholders to surfaces outside this artifact's
      scope. Founding PRC-011 is not cured by this artifact; carried as an open
      finding for the critics/verdict.

