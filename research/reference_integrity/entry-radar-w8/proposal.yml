dispositions:
  - id: surface.absent
    disposition: BLOCKED_DATA
    dependency: "W9 production UI + W4 live evaluator — no production entry_radar.html may ship from this PR"
    escalation: "WS:LIVE-ENTRY-RADAR wave W9; W9_IMPLEMENTATION_HANDOFF.md"
    interim: "This reference HTML is served only from mockups/refs/entry_radar/. A page-level REFERENCE banner is mandatory. templates/entry_radar.html.j2 and site/entry_radar.html are not created."
  - id: sister.prophet_card_language
    disposition: RETAIN
    target: "mockups/refs/entry_radar/radar.css tokens + .pvcard/.pv-chip/.pv-quote/.bh/.mx-ladder geometry copied from pinned Prophet Board tree d540f493a097"
  - id: contract.expert_identities
    disposition: IMPROVE
    target: ".er-xchip[data-expert] + one card per (ticker, expert)"
    rationale: "No production Radar surface existed; the reference makes G0/C1/C2/C3/C5 first-class and refuses a generic entry signal."
  - id: contract.c4_not_a_fire
    disposition: IMPROVE
    target: ".er-lane--c4 and .er-c4[data-role=stratification_only]"
    rationale: "C4 is visible as context and cannot be a lane filter or a card expert."
  - id: contract.no_fabricated_edge
    disposition: IMPROVE
    target: "[data-priority=accruing] and [data-opportunity=not_yet_measured]"
    rationale: "Priority/Opportunity slots exist as honest placeholders; no numbers."
  - id: contract.freshness_honesty
    disposition: IMPROVE
    target: "freshness footer + stale/unavailable/raw/degraded card treatments"
    rationale: "Provisional, confirmed, stale, unavailable, and raw-basis are distinct and not tooltip-only."
  - id: contract.false_start_memory
    disposition: IMPROVE
    target: ".er-fs[data-false-starts] + drawer history"
    rationale: "False starts are counted on the card and listed in the drawer."
  - id: contract.multi_expert
    disposition: IMPROVE
    target: "state=multi renders three cards for FIX.MANY"
    rationale: "Same ticker, three expert lanes, three episode ids."

