  amendments:
    - finding: VTC-001
      action: upheld
      note: >
        DESIGN_NOTES treat purpose + sister as load-bearing so a Prophet
        reader does not read Own-It. That sentence earns its place. The
        in-flow mock-note duplicating the banner, plus eight lanes plus a
        stale banner on the default board, is still a report. Purpose on
        desktop can stay; the duplicate REFERENCE paragraph can go.
    - finding: VTC-002
      action: upheld
      note: >
        Notes say the slot exists so W9 does not invent layout. A board-level
        "Priority ACCRUING — W6 has not measured" line plus an em-dash on the
        card keeps the slot without sixteen identical shouts.
    - finding: VTC-003
      action: upheld
      note: >
        Author VTC-W8-002 RETAIN ("Featured = Best-lane live candidate only")
        is false against the fixtures (see PRC-004). I will not accept a
        RETAIN of a glow whose own rule the bytes break.
    - finding: VTC-004
      action: upheld
      note: >
        Author PRC-W8-002 FIXED the --pv-buy ZH flip and that fix is real
        (M13). I credit it. The remaining --ok vs ZH --down collision is a
        different defect and was not in their list.
    - finding: VTC-005
      action: upheld
      note: >
        Author lists "390px is one column; page overflow-x: hidden" as a
        strength. That is the instrument I am rejecting as proof. Overlay
        wrap (their VTC-W8-001 RETAIN) is the same class of "sister geometry
        excuses a clip."
    - finding: VTC-006
      action: upheld
      note: >
        This is their VTC-W8-001. I reached it from the CSS and crop 01/61
        before opening their critique. RETAIN "do not invent a third card
        width" is a real constraint; it does not make a wrapped overlay on
        the flagship card good. Condition: drop the C2 variant from the
        overlay (it already lives on the cohort row / drawer) or drop the
        quote reservation on C2 cards.
    - finding: VTC-007
      action: upheld
      note: "Unaddressed. One lifecycle carrier on glance is enough."
    - finding: VTC-008
      action: upheld
      note: "Author VTC-W8-004 RETAIN — I agree C4 must stay visible. Held at minor."
    - finding: VTC-009
      action: upheld
      note: "Unaddressed. Structural bilingualism is a strength; 首选/累计中 are the visual authority problem."
    - finding: VTC-010
      action: upheld
      note: "Unaddressed. Not a condition for freeze; a W9 paid-gate crop should show the board silhouette."
  verdict: PASS_WITH_CONDITIONS
  closing_note: >
    As a product this would feel like the Prophet Board's sibling, which is
    the operator directive, and it would feel slightly more like a research
    memo than a scan board. The honesty work (banner, demotion, no fake
    numbers) is visible and good. I would not freeze the unlabeled featured
    glow, the sixteen ACCRUING stamps, or overflow-x:hidden-as-390-proof as
    canonical law. I would freeze the card geometry, the weight marks, the
    light plane, and the demotion language.
