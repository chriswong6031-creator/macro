  findings:
    - id: PRC-001
      severity: major
      capability: contract.freshness_honesty
      finding: >
        Required quiet crop (10-quiet-dark-en.png) prints "0 in the Probe Set" because
        radar.js:83 special-cases quiet to 0, while the empty well (RADAR_COPY.empty)
        says "The Probe Set can still be live — quiet is a state, not a broken page."
        The required no-candidates crop teaches two opposite facts on one screen.
    - id: PRC-002
      severity: major
      capability: contract.no_fabricated_edge
      finding: >
        Every non-empty crop prints "Sorted by lifecycle, then expert identity" but
        radar.js never sorts — rows follow authored RADAR_STATES order. A printed
        ranking rule that the renderer does not implement is a fabricated order.
    - id: PRC-003
      severity: major
      capability: contract.no_fabricated_edge
      finding: >
        The Best lane (crop 01 "Best 10"; ZH "首选 10") is an unmeasured rank —
        all non-stale firing candidates — sitting next to Priority ACCRUING.
        Contract §14 names the lane; it does not license a counted "best" without W6.
        首选 is stronger than Best.
    - id: PRC-004
      severity: major
      capability: contract.no_fabricated_edge
      finding: >
        Silent pv-featured aura on FIX.WASH and FIX.TURN only (radar-data.js
        featured:true ×2). Ten cards pass the Best filter; two glow. No Featured
        label. Fabricated importance without a measured Priority.
    - id: PRC-005
      severity: major
      capability: contract.freshness_honesty
      finding: >
        Provisional C1 and confirmed C3/G0 share the same filled-green CANDIDATE
        chip and --ok spark (radar.css .er-cand .pv-chip.er-lifechip). Distinction
        lives on the cohort/footer line only. Contract §14: 1D LIVE · provisional
        never masquerades as Daily confirmed. Footer is honest; the strongest
        glance mark is not.
    - id: PRC-006
      severity: major
      capability: contract.freshness_honesty
      finding: >
        state=stale / FIX.OLD (crop 20) renders "No path yet" because the stale
        fixture omits spark. Stale is a freshness fact, not a missing path.
        Demotion CSS is correct (dashed, no lift); the null is the wrong null.
    - id: PRC-007
      severity: major
      capability: sister.prophet_card_language
      finding: >
        Contract §14 glance anatomy requires component states (1D Stoch / MACD-RSI /
        Structure / Lobe evidence) and a zone + invalidation footer. Neither slot
        exists, even as UNAVAILABLE / ACCRUING. Footer is freshness-only.
        Invalidation is drawer-only. A founding reference that omits contracted
        slots teaches W9 the reduced card as law.
    - id: PRC-008
      severity: major
      capability: sister.prophet_card_language
      finding: >
        Contract §14 drawer order requires why-now, what is recovering, still
        structurally strong, risk geometry / asymmetry, what else sees it (lobes),
        trustworthiness / sample, and a fire-path mini chart (arm / trough / turn /
        promotion). The drawer is why-here / why-armed / why-candidate / C2 / C4 /
        invalidation / expiry / Opportunity / clocks / history / siblings.
        Opportunity is the only honest empty slot; the rest were never reserved.
    - id: PRC-009
      severity: minor
      capability: contract.expert_identities
      finding: >
        Arena experts G0/C1/C2/C3/C5 are unflat (one card per ticker×expert;
        FIX.MANY = three episodes). Recorded Terminal families from §18 A1
        (amber EARLY, STARTER pending/failed, RE-ENTRY reclaim/repair) have no
        lane or card identity. Intelligence = C5 only. No slot means W9 can
        flatten those families by omission.
    - id: PRC-010
      severity: major
      capability: surface.absent
      finding: >
        Cards are full-hit-target links to #${ticker} (radar.js:179;
        .pv-open::after inset:0) with hover underline + lift. No element carries
        id=ticker. This is Prophet PRC-301 (affordance without destination)
        restated as an in-page hash. Founding surface has no stock.html — the
        honest form is no link, not a fake one.
    - id: PRC-011
      severity: minor
      capability: contract.no_fabricated_edge
      finding: >
        Priority prints ACCRUING on unavailable, stale, probing, and degraded
        cards (crop 50 FIX.VOID, crop 20 FIX.OLD). The number is correctly
        absent; the word implies a live measurement on a null reading. W6 has
        not started.
    - id: PRC-012
      severity: minor
      capability: contract.no_fabricated_edge
      finding: >
        ZH Priority slot is 累计中 (RADAR_COPY.pri_accruing). That reads as a
        running total being summed, not "not yet measured." Opportunity's
        尚未测量 is the honest twin.
    - id: PRC-013
      severity: minor
      capability: contract.freshness_honesty
      finding: >
        Drawer heading "Why candidate / fired" (RADAR_COPY.drawer.why_cand)
        renders on probing / unavailable / pre-candidate cards whose body says
        they have not fired (crop 50, C5). The heading overclaims; the body does not.
    - id: PRC-014
      severity: minor
      capability: contract.freshness_honesty
      finding: >
        Default-board Candidate cell is 11 and includes FIX.OLD (stale). Best
        excludes it (10). Lifecycle≠freshness is correct per §13, but the
        Candidate cell does not disclose that 1 of 11 is demoted. The page
        banner does; the integer does not.
  strengths:
