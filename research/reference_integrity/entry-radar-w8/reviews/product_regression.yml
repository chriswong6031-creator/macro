    - "REFERENCE · SYNTHETIC · NOT PRODUCTION banner is on every state including anon. Tickers are REF.*/FIX.*. No templates/entry_radar.html.j2 or site/entry_radar.html on the branch."
    - "Anon gate lists what the paid board shows and explicitly refuses levels and win probability — the inverse of Prophet PRC-302."

second_pass:
  amended_at: "2026-08-15T08:50:00Z"
  revealed_inputs:
    - mockups/refs/entry_radar/DESIGN_NOTES.md
    - mockups/refs/entry_radar/CRITIQUE.md
    - mockups/refs/entry_radar/FINDING_DISPOSITIONS.md
    - mockups/refs/entry_radar/W9_IMPLEMENTATION_HANDOFF.md
    - research/reference_integrity/entry-radar-w8/proposal.yml
  amendments:
    - finding: PRC-001
      action: upheld
      note: >
        Author PRC-W8-005 ACCEPT_FOR_W8 records that quiet forces 0 and treats
        it as fixture metadata. It does not address the empty-well sentence that
        contradicts the 0. DESIGN_NOTES §2 says "Probe Set may still be non-zero
        on other states" and the empty copy still claims the Probe Set can be
        live on this view. Revealed rationale confirms the contradiction was
        seen and filed as acceptable. I do not accept a required crop that
        argues with itself.
    - finding: PRC-002
      action: upheld
      note: >
        Unmentioned in the author critique. DESIGN_NOTES do not claim a sort
        implementation. The lie is only in the user-facing setups-bar copy.
    - finding: PRC-003
      action: upheld
      note: >
        Contract §14 names Best; I do not ask the lane to disappear. What the
        rationale does not justify is a counted 首选/Best without W6 and without
        an ACCRUING qualifier on the lane itself.
    - finding: PRC-004
      action: upheld
      note: >
        Aggravated by the reveal. DESIGN_NOTES §0 and author VTC-W8-002 claim
        featured aura is "a Best-lane mark only" / "Featured = Best-lane live
        candidate only." Fixtures refute that: Best=10, featured=2, and the
        glow has no label. A documented rule that the bytes do not implement
        is worse than an undocumented glow.
    - finding: PRC-005
      action: upheld
      note: >
        Author did not raise this. DESIGN_NOTES §2 says provisional treatment
        is "dashed provisional freshness; never Daily confirmed." Footer/cohort
        satisfy the letter. The filled CANDIDATE chip + --ok spark still give
        provisional and confirmed the same glance authority. Held at major.
    - finding: PRC-006
      action: upheld
      note: >
        Unmentioned. Stale fixture simply has no spark; the 74px printed-null
        lesson (VTC-301) was applied to the wrong absence.
    - finding: PRC-007
      action: upheld
      note: >
        Aggravated. DESIGN_NOTES §1 redefines glance anatomy downward (no
        component states, no zone/invalidation footer). W9_IMPLEMENTATION_HANDOFF
        CAN COPY NOW lists that reduced card as copyable law. proposal.yml has
        no BLOCKED_DATA row for the omitted §14 slots. This is how a contract
        page is laundered into a smaller one.
    - finding: PRC-008
      action: upheld
      note: >
        Same laundering. Drawer order in DESIGN_NOTES §1 is the reduced list.
        W4 wait-list names live fields, not "do not reserve the slots."
        Priority/Opportunity show they know how to reserve an honest empty;
        they reserved only those two.
    - finding: PRC-009
      action: downgraded
      note: >
        W8 scope is the arena (G0/C1–C5). A1 is ledger law; a UI reference
        that does not invent STARTER/RE-ENTRY lanes before PR-2 family keys
        is correct. Residual, still minor: W9 handoff must say recorded
        Terminal families are not Intelligence synonyms when they appear.
    - finding: PRC-010
      action: upheld
      note: >
        Aggravated. DESIGN_NOTES §5 claims Radar refuses Prophet PRC-301
        because "ticker is a real in-page link." The bytes are href="#FIX.WASH"
        with no matching id. They named the R4 defect, claimed it closed, and
        shipped the same shape. Founding BLOCKED_DATA (no stock.html) would
        have been an honest no-link card.
    - finding: PRC-011
      action: upheld
      note: "Unaddressed. ACCRUING as the W6 slot preview is fine; printing it on UNAVAILABLE is not."
    - finding: PRC-012
      action: upheld
      note: "Unaddressed. 尚未测量 already exists on the Opportunity slot."
    - finding: PRC-013
      action: upheld
      note: "Unaddressed. Branch the heading on lifecycle or say Why this row."
    - finding: PRC-014
      action: upheld
      note: "Author banner is the disclosure; the Candidate integer still includes the stale row. Held at minor."
  verdict: PASS_WITH_CONDITIONS
  closing_note: >
    I did not rubber-stamp the author pass. The attack list the commissioning
    brief named is mostly clean: sister language without Own-It or seven-cell
    plans; experts unflat; C4 not a fire; no fabricated Priority/Opportunity
    number; stale/unavailable/raw/degraded are not live fires; no production
    entry_radar.html; ACCRUING / NOT YET MEASURED slots exist. What fails
    freeze-as-W9-law is a set of copy and slot lies — quiet crop vs 0 Probe
    Set, a sort rule that is not a sort, Best/首选 as an unmeasured rank,
    featured documented as Best and implemented as two silent glows, §14
    anatomy omitted then listed as CAN COPY, and a dead #ticker link claimed
    as the PRC-301 close. Conditions, not a rewrite.
