    - "C4 cannot be a row expert (throw), cannot be a lane filter, and renders as dashed context only. DNR:KILL-WASHOUT-TURN is respected on the surface."
    - "No Priority number, no Opportunity number, no 92% likely, no Own-It, no seven-cell plan ladder, no entry/target/void on the card or in the anon gate."
