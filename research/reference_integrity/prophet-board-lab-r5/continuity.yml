# Revision continuity closure (RIG V1.1 §13) — derived, then dispositioned.
#
#   python3 scripts/check_reference_integrity.py --mandate prophet-board-lab-r5
#
# HOW TO READ EVERY ROW BELOW, because the provenance is unusual and a stranger
# would otherwise mis-read it:
#
#   The r3 verdict's ten blockers were closed by the **R4 closure cycle**
#   (research/reference_integrity/prophet-board-5514-r4/), whose artifact this
#   candidate loads UNMODIFIED. So `changed_files` names the path that CARRIES
#   the fix in the new SHA — not a path this cycle edited. This cycle edited
#   none of them; that is the point of R5 being additive.
#
#   Every one of those closures was authored by the same lane that wrote the
#   fix, and **none has ever been confirmed by an independent critic**: the R4
#   cycle produced a SHA and stopped, minting no artifact set, no reviews and no
#   verdict. RESOLVED_BY_CHANGE below therefore means "a checkable change exists
#   in the new SHA", NOT "a critic agreed". The R5 cycle is the first
#   opportunity to adjudicate them, and it must adjudicate them — approving the
#   Lab while leaving R4's own closures unreviewed would launder them.
#
# Where the item also has a PRODUCTION half, the row says so and points at
# research/prophet_v4/D_LAB_R5_BLOCKER_RECENSUS.md, which measured all twelve
# against origin/main rather than copying R4's five-day-old prose. Three are
# still open in production (PRC-303, VTC-301's printed null, DA-002) and are
# recorded there, not hidden here.
