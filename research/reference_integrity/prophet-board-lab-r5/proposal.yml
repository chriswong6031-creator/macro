# ── DISPOSITIONS ────────────────────────────────────────────────────────────
# Every baseline id, exactly once. All RETAIN, and the reason is mechanical
# rather than promised: index.html loads board.css / board-data.js / board.js
# from the R4 directory UNMODIFIED, LIVE is painted by board.js, and LAB→LIVE
# RE-EXECUTES board.js rather than restoring a snapshot. Two committed proofs:
#   * crops 04/05 (op=0): with no operator entitlement there is not one Lab node
#     on the page (verify D3/D3b — #board carries zero `lab-*` elements and the
#     card count equals a cold load).
#   * crop 50 (round trip): after LIVE→LAB→LIVE the visible card count is
#     identical to a cold load, the ladder and status cluster are back, and no
#     Lab node survives (verify D15/D15b, capture asserts it before shooting).
