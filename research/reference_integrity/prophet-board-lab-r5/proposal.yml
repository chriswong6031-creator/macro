# ── AUTHORITY DELTA (RIG §7) ────────────────────────────────────────────────
# Does the proposal claim MORE than production? Two rows say yes, and neither is
# warranted by a running system at this SHA. They are the reviewers' first question.
authority_delta:
  - id: auth.lab_observation_exists
    production_claim: "Production asserts nothing at all about early-entry candidates."
    proposal_claim: "The surface asserts that a named detector fired on a named ticker, and — for live-forward rows — the clock time we first saw it."
    direction: stronger
    warranted: false
    evidence: >
      NOT warranted at this SHA, stated plainly. Radar's live transport (R-LAB-1 / W4.1) has
      not landed, so no canonical mastermind.entry_event.v1 stream exists and every timing and
      detector fact in the fixture is synthetic (DESIGN_NOTES §4; marked data-mock-lab in the
      DOM). The claim becomes warranted only when the Lab reads the canonical Radar output and
      derives first_observed_at from the live pack envelope pass_ts, per LAB-0 §4/§5. Until
      then this reference is a claim about COMPOSITION AND DISCLOSURE, not about data. The
      reviewers should adjudicate whether a reference may be approved ahead of its producer.
  - id: auth.measured_lead
    production_claim: "Production asserts no lead over anything."
    proposal_claim: "'Seen N days before Prophet' on live-forward rows."
    direction: stronger
    warranted: false
    evidence: >
      Same dependency as above, plus a design constraint that is already binding: a measured
      lead is structurally impossible on a retrospective seed (LAB-0 §4 forbids reconstructing
      a missing signal_known_ts), which verify D6 pins and mutation M2 proves bites. So the
      strong claim is confined by construction to the only class that could ever support it —
      but the class itself is not yet real.
  - id: auth.zero_authority
    production_claim: "The board's cards carry stance, priority and lifecycle — display/narrative authority."
    proposal_claim: "The Lab explicitly ranks nothing, sizes nothing, originates nothing and mutates nothing, and says so at the glance tier."
    direction: weaker
    warranted: true
    evidence: "LAB-0 §1/§5; the payload's authority block is all-false and verify D11 asserts it; the disclosure sentence is on the surface (D11b)."
  - id: auth.prophet_state_quotation
    production_claim: "The seven ruled lifecycle cell words, weight-only and hue-free."
    proposal_claim: "The same seven words, quoted verbatim in the Lab's Prophet comparison."
    direction: equal
    warranted: true
    evidence: "Quotation, not restatement — one referent, one vocabulary (PROPHET_RULING_J9C_J10 §6). lab.js LEX is the R4 lexicon copied with its provenance noted in place."
  - id: auth.intersection_board
    production_claim: "n/a"
    proposal_claim: "lab-g0-c2a-v1 shows names carrying both marks."
    direction: equal
    warranted: true
    evidence: >
      Deliberately NOT a new claim: a display set intersection over already-minted events.
      detector_id = null, zero events/episodes/scores minted, no washout x turn construction
      created or promoted (DNR:KILL-WASHOUT-TURN). The surface says so on its own receipt and
      verify D9d asserts the sentence is there.

# ── INFORMATION ECONOMICS (RIG §7) ──────────────────────────────────────────
information_economics:
  words_per_card:
    production: >
      ~12-15 visible words per Prophet card (axis + stance verb, ticker, name, sector, up to
      three marks, lifecycle word, zone label and date) — counted off the R4 card anatomy.
    proposal: >
      ~20-26 visible words per Lab row (time + basis label, ticker, name, sector, class chip,
      one to three reading chips, PROPHET eyebrow + lifecycle word + plan-open date + lead
      clause) — counted off the rendered rows in crop 10.
  findings:
    - >
      The Lab row is WORDIER than a Prophet card, by roughly 8-11 words, and that is a real
      cost recorded rather than argued away. It is spent on exactly two things a Prophet card
      never has to carry: the row's own epistemic class ("Seed · history, not a sighting") and
      the reason a number is absent ("Lead not measurable"). Both are disclosures whose
      omission is the failure this surface exists to prevent, so the budget was spent there
      and cut everywhere else.
    - >
      Nothing was converted from a chart into prose. The chart stays first and stays the same
      height as the Prophet card's, and the readings stay chips rather than sentences.
    - >
      Two constants repeat per row: the class chip and the PROPHET eyebrow. The class chip is
      argued for explicitly against doctrine Law 4 in DESIGN_NOTES §2.4, on the R4 episode-chip
      precedent (a row must be self-describing when seen alone). The eyebrow is the cheapest
      available way to keep the comparison attributed to a different producer; a reviewer who
      disagrees should say so.
    - >
      The sort-basis sentence is the one line demoted rather than kept at every width: it
      moves to the count chip's LENS at 390w (a landing, not a deletion).
  preserved:
    - "The LIVE board's own word count is untouched — the mode control adds two words ('Operator view') and two labels."
    - "The Lab answers 'so what do I do' ONCE, in the band, rather than per row: 'Watch — don't chase. Nothing here is a Prophet call.'"
    - "One as-of on the Lab plane (the feed's last pass), not two — and it is the Lab's own producer, never the plan book's."
    - "Machine identity is entirely below the glance tier: verify D7 asserts that seventeen slugs and internal class names appear nowhere in the rendered text."
