additions:
  - id: add.mode_control
    what: "An operator-only LIVE | LAB segmented control, mounted inline in the existing status cluster so it costs the production composition no vertical space."
    evidence: "crops 01-05 (rest) / 10-17 (engaged); verify D1/D1b/D2/D3/D5"
  - id: add.six_boards
    what: "The six frozen Lab board selectors, labelled in plain words, with the exact detector/expert identity on each selector's LENS receipt."
    evidence: "crops 20-27; verify D9/D9b/D9c/D9d"
  - id: add.observation_spine
    what: "A newest-first stream on a continuous time spine, with a dated baseline marker where continuous live watching began."
    evidence: "crops 10-13, 25, 30-34; verify D10/D10b"
  - id: add.observation_class
    what: "An unmistakable live-sighting vs retrospective-seed distinction carried structurally — spine style, node fill, time-slot content, chip treatment, ink — not by a badge alone."
    evidence: "crops 30-34; verify D6/D6b/D6c/D6c2/D6d/D6e/D6f"
  - id: add.expert_chips
    what: "One chip per expert, identities never merged, each carrying its own detector/event id on its receipt."
    evidence: "crops 23/26; verify D8/D8b/D7c"
  - id: add.prophet_comparison
    what: "A per-row Prophet comparison band quoting the ruled lifecycle word and the plan-open date, on its own recessed plane."
    evidence: "crops 10-13; baseline capability card.lifecycle_mark is the source of the vocabulary"
  - id: add.measured_lead
    what: "A measured Lab→Prophet lead, shown ONLY on a true live-forward observation. Every other case prints why there is no number."
    evidence: "crops 10-13 (all three non-measured cases visible); verify D6/D6g"
  - id: add.lab_states
    what: "Lab-specific empty / behind / unavailable states, each staying visibly LAB with no LIVE fallback, including a spine gap marker for 'nothing since HH:MM'."
    evidence: "crops 40-48; verify D14/D14b/D14c"
  - id: add.authority_disclosure
    what: "A glance-tier stance and a zero-authority statement, with the all-false authority block on its receipt."
    evidence: "crops 10-13; verify D11/D11b"

