first_pass:
  frozen_at: "2026-08-19T00:00:00Z"
  verdict: PASS_WITH_CONDITIONS
  findings:
    - id: PRC-401
      severity: major
      capability: board.progressive_expansion
      finding: >
        "LAB->LIVE re-derives, never restores" is pinned only by the self-reported
        C.repaints counter (verify.py:307 D15d); D15/D15b/D15c (verify.py:294-306)
        are all satisfied by a restored snapshot, and mutation M8
        (mutation_test.py:69-72) breaks the counter rather than the mechanism. The
        mechanism itself is correct — lab.js:510-525 destroys the subtree and
        re-executes board.js — so this is a proof gap, not an artifact defect.
    - id: PRC-402
      severity: minor
      capability: card.live_quote
      finding: >
        lab.js:378-382 renders the measured lead through Math.abs() with no sign
        or zero guard, so a negative lead would print "Seen N days before Prophet"
        and lead==0 prints "Seen 0 days before Prophet". Unreachable in the
        committed fixture (all six live leads are null/null/null/1/2/3), but this
        reference is the spec P-LAB-API/UI implements.
    - id: PRC-403
      severity: minor
      capability: xc.bilingual
      finding: >
        The banned-vocab loop (verify.py:248-252) and the 17-slug glance-tier leak
        test (verify.py:177-184) read one EN capture of the default board only;
        ZH copy, the five non-default boards and the LIVE view are unscanned. No
        actual leak found by inspection — this is coverage, not a defect.
    - id: VTC-401
      severity: minor
      capability: xc.mobile_390
      finding: >
        At 390w three of the six frozen LAB-0 §3 boards are off-screen inside
        lab.css:133 .lab-sel-wrap{overflow-x:auto} with no edge fade or chevron
        (crops/14-lab-mobile390-dark-en.png clips "Turning up" mid-phrase), and
        D14c/D16 are structurally blind to it because they measure
        documentElement.scrollWidth, which the inner scroller keeps clean.
    - id: DA-401
      severity: minor
      finding: >
        Two re-census attributions are imprecise while their substance verifies:
        --up sits at templates/theme.css:72/:148, not the cited :80-81/:152-153
        (D_LAB_R5_BLOCKER_RECENSUS.md:160-163, continuity.yml:171-173); and commit
        444f80d62774 does not touch engine/prophet_bridge.py, where plan_clock_date
        was introduced by 242aafda0dc7 (#4684), contra the §0 headline at :31-33.
    - id: VTC-402
      severity: minor
      finding: >
        lab.css:11 states the token policy as "no hex literal"; lab.css:93 is
        color: #fff. Sole hex in the file; the rest of the token discipline
        verifies clean (no stance ink; --up/--down confined to .nb-chg at :275-276).
    - id: DA-402
      severity: minor
      finding: >
        crops/25-board-all-early.png is sha256-identical to
        crops/10-lab-desktop-dark-en.png (and their --full twins likewise) because
        lab-all-early-v1 is the default selection, so "36 views / 49 files" is 46
        unique files and the 20-27 selector range carries one non-independent shot.
        All six boards remain photographed. crops/50 being identical to crops/01 is
        by contrast legitimate and load-bearing (capture.py:180-195 asserts the
        round trip before shooting).
    - id: VTC-403
      severity: minor
      capability: xc.bilingual
      finding: >
        aria-label on the three Lab groups is English-only under data-lang=zh
        (lab.js:154 "Board mode", :234 "Lab boards", :266 "Observation class")
        while all visible copy is fully bilingual.
  strengths:
    - >
      The seed-vs-live distinction is genuinely unmistakable at a glance and
      genuinely structural, not a badge: compare crops/10-lab-desktop-dark-en.png
      (solid spine, filled node, "09:52 ET / first seen / Aug 14", solid-border
      "Live sighting", "Seen 1 day before Prophet") against
      crops/30-seeds-only-dark-en.png (dashed spine, hollow node, "Aug 7 / signal
      date / not a sighting", dashed-border "Seed · history, not a sighting",
      "Lead not measurable", desaturated chart ink). The dated baseline marker
      ("Aug 8 — Continuous live watching began here") is drawn where the stream
      actually crosses it, so it reads as data rather than caption. And the
      partition is sound by construction, not by fixture luck: LAB-0 §4 makes a
      seed's date <= baseline <= a live row's first sighting, so newest-first
      sorting can never place a live row below the marker.
    - >
      "R5 is R4 plus a layer" is enforced, not asserted:
      git diff --stat origin/main FETCH_HEAD -- mockups/refs/institutionalize
      templates/theme.css is EMPTY, and index.html:40,48,50 load the R4
      board.css/board-data.js/board.js unmodified. MP-1's no-theme.css-change law
      holds; the achromatic-Lab claim holds on one existing token (--prov, via
      --lab-acc at lab.css:37) with zero new palette and zero stance ink.
    - >
      The degraded states genuinely stay LAB with no LIVE fallback, in the Lab's
      own voice rather than borrowed production copy: crops/43-lab-behind-dark-en.png
      carries FEED BEHIND, a warning band naming the exact silence ("11:36 ET,
      3h 28m ago"), and a spine gap marker "nothing since 11:36 ET" — three
      independent carriers, and mutation M11 proves the silent-fallback defect
      LAB-0 §6.5 names by name is actually caught.
    - >
      The operator gate is absence, not disablement: crops/04-live-no-operator-dark-en.png
      is the R4 board with no LIVE|LAB control anywhere, and D3 requires zero
      lab-* nodes inside #board while D3b pins the card count to the cold load.
    - >
      The packet argues against itself where it would be easy not to: it records
      the Lab row as 8-11 words WORDIER than a Prophet card rather than arguing it
      away, scores task.return_to_live EQUIVALENT rather than BETTER because
      "nothing happened to the board" is the correct outcome, files its own two
      authority claims as warranted:false, names R4's unreviewed state as a
      laundering risk, corrects the R4 note's own --ink-up mechanism error, and
      leaves six of twelve re-census items with explicit uncertainty rather than
      resolving them by assertion.
    - >
      mutation_test.py is a real anti-vacuity harness, not decoration: a
      non-matching mutation is a hard error rather than a skip (:136-140), an
      already-failing baseline refuses to measure (:125-130), two mutations may not
      share a sole catcher (:161-169), and the crash-reports-no-failures hole the
      notes describe is genuinely closed by the __CRASH__ sentinel (:106-118, 145-149).

