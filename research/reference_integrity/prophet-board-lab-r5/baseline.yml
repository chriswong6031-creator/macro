# Production Baseline Manifest (RIG V1 §4/§5) — design memory for D-LAB-R5.
#
# WHAT THE BASELINE IS HERE, because this cycle's shape is unusual:
#   The Lab does not REPLACE a production surface — no early-entry inspection
#   surface exists today. What it extends is the U.S. Prophet Board, whose
#   current best statement is the frozen R4 reference (itself unapproved), and
#   whose shipped statement is the production template family. So the ledger
#   below inventories THE BOARD's capabilities: every one of them must survive
#   the Lab's arrival untouched, and `proposal.yml` dispositions each one.
#   The Lab's own behaviours are NOT capabilities being preserved — they are
#   `additions`, and they are listed there so the authority audit sees them.
schema: mastermind.rig_baseline.v1
reference_id: prophet-board-lab-r5
captured_at: "2026-08-18"

production:
  route: us_stocks.html
  live_url: https://mastermindx.io/us_stocks.html
  source_commit: d772fbd6f884
  source_paths:
    - templates/dashboard.html.j2          # the board section, ladder, freshness banner
    - templates/_prophet_card.html.j2      # the shipped .pvcard
    - templates/_us_board_cards.html.j2    # card context assembly, cautions, zone kind
    - templates/tier_preview.js            # the anonymous/free tier gate + copy
    - templates/theme.css                  # tokens, incl. the --pv-* stance family
    - engine/us_board_rank.py              # the board's ranking + status buckets
    - engine/prophet_board_read.py         # the G-D join (actionability + enrichment)
    - scripts/build_stock_library.py       # _compute_board_staleness (freshness producer)
    - scripts/build_prophet.py             # the plan book publisher
  shared_surfaces:
    - stock.html                           # the card's link destination
  reference_baseline:
    path: mockups/refs/institutionalize/us_stocks
    frozen_sha: 168a9be00691
    status: "NOT APPROVED — no artifact set, no reviews, no verdict were ever minted for the R4 cycle"

