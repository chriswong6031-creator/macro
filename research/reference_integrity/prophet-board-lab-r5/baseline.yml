  - {id: board.freshness_state, user_job: "Know whether the ranking is on settled or stale prices before acting", evidence: "mockups/refs/institutionalize/us_stocks/board.js:168-190,1119-1145", importance: core}
  - {id: board.headline_count, user_job: "See how many live setups there are tonight", evidence: "mockups/refs/institutionalize/us_stocks/board.js:221-240", importance: core}
  - {id: board.lifecycle_ladder, user_job: "See the whole book partitioned by lifecycle, and filter to one cell", evidence: "mockups/refs/institutionalize/us_stocks/board.js:221-334", importance: core}
  - {id: board.count_law, user_job: "Trust the integers: every printed quantity reconciles over one universe", evidence: "mockups/refs/institutionalize/us_stocks/board.js:119-128", importance: core}
  - {id: board.key_absence_disclosure, user_job: "Tell 'not published' apart from 'zero'", evidence: "mockups/refs/institutionalize/us_stocks/board.js:129", importance: core}
  - {id: board.progressive_expansion, user_job: "Reach every plan row as a card, in place", evidence: "mockups/refs/institutionalize/us_stocks/board.js:851-870", importance: core}
  - {id: board.table_view, user_job: "Read the book as an alternate tabular representation", evidence: "mockups/refs/institutionalize/us_stocks/board.js:1155-1161", importance: supporting}
  - {id: board.anonymous_gate, user_job: "As an unentitled reader, see what the paid board provides, withheld by absence", evidence: "mockups/refs/institutionalize/us_stocks/board.js:611-636", importance: core}
  - {id: board.empty_state, user_job: "Understand a quiet day without mistaking it for a broken page", evidence: "mockups/refs/institutionalize/us_stocks/board.js:190-196", importance: supporting}
