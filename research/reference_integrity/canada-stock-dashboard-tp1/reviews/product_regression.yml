# Critic receipt (RIG V1 §6) — Reviewer A, product regression. Two-pass with
# rationale quarantine; first pass frozen at commit before rationale reveal.
schema: mastermind.rig_review.v1
reference_id: canada-stock-dashboard-tp1
role: product_regression
artifact_sha: e2091032ad1f53eb8b8cfa3767aa6498f414193e

reviewer:
  identity: "rig-critic-a-lattice-heron-7734"
  model: opus
  independent_of_author: true

quarantine:
  first_pass_inputs:
    - user/business job (baseline.yml user_job)
    - production-before artifact (baseline-dark/light-en-1440.png + pre-change source copies baseline-canada-stock-v36.js / baseline-dashboard-icons.js)
    - proposed-after artifact (comment-redacted frozen copies of stock-dashboard.css / canada-stock-v36.js / dashboard-icons.js + 15 rendered proposal PNGs)
    - capability ledger (baseline.yml)
  rationale_received_after_first_pass: true
  notes: >
    Proposed-artifact comments were uniformly redacted in the pass-1 copies
    because the deployed stylesheet header carries the designer rationale
    (DARK DELTA ledger); the critic judged behavior and rendered output.
    Critic's own declaration: quarantine honored in full — no proposal.yml/
    manifest.yml, nothing under templates/ or site/, no theme-parity docs,
    no PR/Slack/prior-review material, no git history commands.

first_pass:
  frozen_at: "2026-08-29T00:05:46Z"
  verdict: PASS_WITH_CONDITIONS
  findings:
    - id: PRC-001
      severity: major
      capability: leadership.expand_modal
      finding: >
        .ca-v36-stance is rescoped to .mx-stockdash--ca .ca-v36-stance
        (stylesheet) but the modal is appended to document.body as a SIBLING
        of the composed main, so the full-ranking Action column loses border,
        uppercase, size and semantic hue in BOTH themes
        (proposal-modal-light/dark-en-1440.png rows y=214..817 render
        Accumulate/Hold/Avoid as uniform muted plain text where at-rest rows
        show green ACCUMULATE / blue HOLD chips); the same rescoping drops the
        body-level font-family the baseline set, so nothing outside the
        composed main inherits the dashboard UI font.
    - id: PRC-002
      severity: major
      capability: leadership.themes_only_rank
      finding: >
        .ca-v36-lead-basis is rescoped the same way (baseline had it
        unscoped), so the modal pane heading collapses its basis pill into the
        garbled single string "Theme Leadership Theme rank"
        (proposal-modal-light/dark-en-1440.png y=138), destroying the mandated
        visible-basis disclosure at the one surface where all 16 owner ranks
        are read, while the at-rest panel keeps a correct THEME RANK pill.
    - id: PRC-003
      severity: major
      capability: leadership.themes_only_rank
      finding: >
        The light-only 2px --link breadth rule (stylesheet light section)
        promotes the count/max breadth whisper (1px/opacity .5 in dark) into a
        prominent blue quantitative rule in light only
        (proposal-light-en-1440.png y=1219/1277/1335/1393/1451): it gives
        data-ink weight to a presentation-derived ratio published nowhere, at
        100% breadth it reads as a plain full-width divider while at 60-80% it
        reads as a bar, and it makes the same number carry different authority
        in dark than in light.
    - id: PRC-004
      severity: major
      capability: platform.fail_soft_legacy
      finding: >
        The composer's stylesheet now arrives as a separately-cached asset
        behind a hand-typed key (stock-dashboard.css?v=20260828) against an
        entitled/no-store composer script — a CSS/JS skew class the baseline
        made structurally impossible by carrying the sheet inline; there is no
        runtime handshake (no sentinel custom property asserted before mount),
        and because the legacy-panel hide rule moved into that sheet the
        mismatch cannot fail soft once buildShell has relocated the cards out
        of the legacy panels.
    - id: PRC-005
      severity: minor
      capability: platform.fail_soft_legacy
      finding: >
        ensureStockDashCss gates inject() entirely on link.onload with backoff
        only on the error path and no timeout, while the two data artifacts
        carry an explicit 2.5s degrade timer for exactly this hazard — a
        stalled (rather than errored) stylesheet strands an entitled
        subscriber on the legacy page for the browser's own network timeout.
    - id: PRC-006
      severity: minor
      capability: leadership.expand_modal
      finding: >
        All modal presentation is bound to DOM adjacency via
        .mx-stockdash--ca ~ .ca-v36-modal, valid only while .site-nav's parent
        is body; a future wrapper on the shared nav family stops the
        combinator matching and strips the modal's display:none default —
        failing OPEN as permanently visible unstyled ranking content.
    - id: PRC-007
      severity: minor
      capability: platform.fail_soft_legacy
      finding: >
        ensureStockDashCss is declared bare at top level of the site-wide icon
        hydrator, outside any IIFE unlike every other unit in that file, so it
        is published on window for every page loading dashboard-icons.js.
        (Critic severity: nit; recorded at minor, the schema's floor.)
  strengths:
    - Dark desktop EN is near-exact preservation (pixel diff outside the
      animated ticker confined to antialiasing bands; every lane, count,
      chip, rank, card, clock and route in identical position).
    - The light Act-Now treatment is a genuine second art direction, not a
      token swap (boxed panel2 lane cards become white-material columns with
      4%-tinted semantic header bands; lane membership stays unambiguous).
    - Stance hues move off the quote-direction inks onto the dedicated
      --ink-pv family — exactly the separation the design lineage demands —
      with hues measurably preserved and the --ok/--act quote binding kept
      verbatim.
    - EN/ZH stance-hue behaviour is symmetric across both themes, so the
      locale convention is not silently theme-dependent.
    - Total-failure ordering of the new dependency is correct — a fully dead
      stylesheet leaves the untouched legacy page; the HK loader is left
      byte-identical.
    - The composer diff is genuinely presentation-only — the only behavioural
      deltas are injectCss()/FONT_UI deletion and the mount-class line; no
      ranking, filter, membership, clock, quote or fetch semantics moved.
  capability_dispositions_note: >
    preserved: actnow.four_lane_map, actnow.per_group_membership,
    actnow.research_routes, prophet.top_picks_projection, prophet.live_quotes,
    clocks.board_vs_live, record.track_record, platform.two_fetch_degrade,
    platform.theme_lang, platform.sm_hidden_rescue.
    regressed: leadership.themes_only_rank (PRC-002/003),
    leadership.expand_modal (PRC-001/006), platform.fail_soft_legacy
    (PRC-004/005).
    unverified (no evidence cell): prophet.grid_table_xor (Table view),
    prophet.population_filters (filtered/pill/empty states),
    nav.terminal_routes.

second_pass:
  amended_at: "2026-08-29T00:32:00Z"
  amendments:
    - {finding: PRC-001, action: upheld, note: "Confirmed by the designer as a genuine TP-1 regression scheduled for repair; stays major — the full-ranking modal is where a subscriber scans 16 themes and semantic hue is the scan mechanism (root re-verified: descendant-scoped .ca-v36-stance vs body-sibling modal)."}
    - {finding: PRC-002, action: downgraded, note: "Caption words pre-exist in the composer h4 (re-verified at source); the basis disclosure survives as text and only the pill styling died — a legibility defect cleared by the same rescoping fix as PRC-001. major → minor."}
    - {finding: PRC-003, action: upheld, note: "The disclosed motivation (whisper read as stray underline on white) answers why light strengthened the track but neither defect: 100% breadth is indistinguishable from a plain divider, and the same unlabeled count/max ratio carries different authority in light than dark. Both facts go to the design authority. Stays major."}
    - {finding: PRC-004, action: downgraded, note: "The disclosed private,no-store receipts for BOTH assets close the stale-CSS/fresh-JS skew class; residual = mount atomicity rests on a Cache-Control header asserted nowhere in the reviewed bytes, and the vestigial ?v= literal reads as a cache contract it is not. major → minor."}
    - {finding: PRC-005, action: upheld, note: "Conceded as a fair hardening gap; the fetch-vs-link reason explains the omission without removing it — a stalled (not errored) stylesheet still strands an entitled subscriber for the browser's own timeout. Stays minor."}
    - {finding: PRC-006, action: upheld, note: "In-source documentation is disclosure, not mitigation; the mode remains fail-OPEN because the modal's only display:none lives inside the combinator-gated rule — an unconditional base rule would make it fail closed at zero design cost. Stays minor."}
    - {finding: PRC-007, action: upheld, note: "The sibling-IIFE reason explains why the global exists but not why it must — one enclosing IIFE removes the window write on every page. Stays nit."}
  pass2_corrections:
    - id: SC-001
      target: "pass-1 strength: 'dark desktop EN is a near-exact preservation'"
      status: partly_falsified
      note: >
        The revealed seven-delta ledger contradicts that wording: the critic's
        own pixel probes (buy (69,184,115)→(93,188,134), avoid
        (224,100,100)→(221,113,114)) were mis-attributed to antialiasing in
        pass 1 and are the declared buy/avoid ink alignments. Corrected claim:
        dark is deliberately altered in declared, individually defensible ways
        that preserve every semantic distinction, not unchanged.
    - id: SC-002
      target: "designer claim: near/IN-FAVOUR ink rebound to var(--ink-link)"
      status: verified_as_restore_not_change
      note: >
        The baseline composer already bound .near to var(--ink-link,var(--link))
        and IN-FAVOUR measures (122,167,224) identically in baseline and
        proposal dark shots — the rebinding restores production, changing
        nothing the critic could contest.
  conditions_for_pass:
    - "Repair PRC-001 (and PRC-002, same root): scope .ca-v36-stance and .ca-v36-lead-basis to reach the sibling modal; recapture the modal cell in both themes."
    - "Adjudicate PRC-003 at design-authority altitude on both facts (100%-reads-as-divider collision; dark/light authority split)."
    - "Supply missing evidence cells: filtered state (pill, is-active, empty branches), Table view both themes, baseline modal cell."
  residual_open_findings: {blocker: 0, major: 2, minor: 4, nit: 1}
  verdict: PASS_WITH_CONDITIONS
