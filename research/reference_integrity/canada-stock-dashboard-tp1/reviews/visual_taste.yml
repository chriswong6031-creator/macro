      strengthened).
    - Mobile is deliberate re-composition, not a squeezed desktop (stance chip
      strip with exactly one lane expanded; lane-2 shot proves the switch
      re-composes; single-column full-bleed cards).
    - All Candidates holds one grammar across both themes with WAIT states
      correctly amber and the honest "9 shown · 9 on board" count intact.

