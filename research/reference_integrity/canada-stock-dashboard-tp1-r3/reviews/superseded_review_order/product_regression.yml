first_pass:
  # Judged frozen SHA 2d463e7c4e8f (the pre-repair R3 head).
  verdict: BLOCK
  findings:
    - id: PRC-301
      severity: blocker
      capability: "leadership.expand_modal, prophet.population_filters, prophet.grid_table_xor, prophet.top_picks_projection (evidence integrity)"
      finding: >
        Nine of eleven named state cells depict a build that is not the frozen
        artifact: the Uranium leadership gauge measures 355px (27% of the row,
        the old percentage geometry, byte-identical to the baseline) in the
        modal, filtered, filter-miss, tableview and all-candidates shots, while
        the frozen code can only draw a fixed ~200px track — so the modal,
        active-filter, filter-miss, table-view and all-candidates states carry
        no valid dark-or-light evidence for the artifact under review.
    - id: PRC-302
      severity: major
      capability: leadership.expand_modal
      finding: >
        Modal presentation is gated on a general-sibling accident: an
        unconditional display:none plus every reveal rule scoped
        .mx-stockdash--ca ~ .ca-v36-modal, while the composer inserts the root
        after the nav and appends the modal to body — the day .site-nav is not
        a direct body child, the match fails, display:none wins, and "Expand
        leadership" becomes a silently dead button with no fallback.
    - id: PRC-303
      severity: minor
      capability: leadership.expand_modal
      finding: >
        The modal loses header/value alignment agreement: td.num is
        right-aligned while every th stays left-aligned, so Rank and Names
        headers float away from the values they label.
    - id: PRC-304
      severity: minor
      capability: "leadership.themes_only_rank, platform.theme_lang"
      finding: >
        The gauge's reference track is materially weaker in light (~1.2:1 off
        white) than dark, so at partial value the light reader sees a bare bar
        with no visible "out of what" — the one thing the track exists to supply.
    - id: PRC-305
      severity: minor
      capability: leadership.themes_only_rank
      finding: >
        The gauge is anchored left:0, 200px long, sitting under the leaders
        ticker list while the count it encodes sits at the far right of the
        row — it reads as an underline of the ticker string rather than as a
        measurement belonging to the row.
    - id: PRC-306
      severity: minor
      capability: "platform.fail_soft_legacy, platform.two_fetch_degrade"
      finding: >
        Time-to-board regresses: the composer is serialized behind an
        un-preloaded stylesheet round-trip, and on a flaky response the user
        holds on the legacy page through 1500ms + 3000ms of silent backoff.
    - id: PRC-307
      severity: minor
      capability: platform.fail_soft_legacy
      finding: >
        The stylesheet is fetched at a hand-pinned ?v= token, cache-coupling
        two files that must move together; a CSS change shipped without a bump
        serves warm caches a stylesheet that no longer matches the class
        contract — styled-wrong rather than fail-soft.
    - id: PRC-308
      severity: minor
      capability: "platform.theme_lang, leadership.themes_only_rank"
      finding: >
        The rank token is hard-coded English and never routed through bi() —
        "Theme #" + rank at both the at-rest and modal sites — so ZH users read
        an English rank label inside otherwise localized copy whose own header
        correctly reads 排名. Byte-identical to production, so not a
        regression, but ratifying this file ratifies the defect.
    - id: PRC-309
      severity: minor   # critic severity: nit; recorded at the schema floor
      capability: platform.fail_soft_legacy
      finding: >
        ensureStockDashCss is declared at file top level outside any IIFE, so
        the shared site-wide icon asset leaks a global onto every page.
  strengths:
    - Breadth gauge tells the truth about three membership states — null yields
      no marker class and no track, a known zero an empty track, a positive
      count a proportional fill; production's Math.max(8, …) floor painted a
      false 8% tick on exactly the case the missing-is-not-zero law protects.
    - It reads as a measure at partial and full value, fill-vs-track luminance
      separation production's 1px 50%-opacity hairline never had.
    - Active vs hover finally differ (production collapsed both into one 6%
      wash, making the filter state nearly invisible).
    - Light is a second art direction, not a token swap — lanes drop the card
      for hairline-divided columns, the flush border becomes an inset header
      rail over a 4% semantic tint, the Prophet grid becomes a recessed well
      with white shadowed cards.
    - Raw non-token colour is eliminated; radii move to the canonical scale;
      measured dark hues improve contrast while light hues are unchanged.
    - Product semantics survive where the lineage binds them — the Canada
      Western quote exception verbatim, per-group membership nulls, the count
      and filter-affordance gating, the non-switching empty state, the honest
      "N shown · M on board" count, the .sm-hidden rescue, and the two fetches
      with their 2.5s degrade are byte-identical.
    - >
      The runtime injectCss() stylesheet is genuinely gone, and the loader's
      failure path is correct — after three attempts the composer never runs
      and the legacy page stays visible and functional.

second_pass:
  # Judged the REPAIRED artifact e509db03ee5f (the SHA advanced between passes
  # in direct response to pass 1; all 22 evidence images re-taken at the new head).
  verdict: PASS_WITH_CONDITIONS
  continuation_note: >
    Executed by a continuation context of the same reviewer identity; it
    received the rationale before reading evidence (inverting the intended
    ordering) and could not read its own frozen text because the receipt did
    not yet exist. Mitigation applied by the critic: the four withdrawals rest
    on its own pixel and byte re-verification, never on the coordinator's
    assertions, and each amendment states which basis it used.
  amendments:
    - {finding: PRC-301, action: withdrawn, note: "Re-verified and closed: all 22 images re-taken at the new head; the bounded gauge measures x[73..274] (~206px track) on every row of every previously-stale state, and mobile rescales to ~116px. The 355px geometry is not reproducible anywhere in the current evidence."}
    - {finding: PRC-302, action: downgraded, note: "Downgraded on the authority ground ONLY — the fail-closed base was expressly ordered after an earlier cycle found the opposite (combinator break exposing unstyled content), and a composer data attribute was outside the fence. NOT closed: the dead-button residual survives and must be carried by name."}
    - {finding: PRC-303, action: withdrawn, note: "Re-verified against the composer's actual emission: th:last-child hits Count at both column counts and th:first-child:nth-last-child(5) matches Rank only in the 5-column rk-true layout. Residual noted: the selector encodes a literal column count, so a future composer column change would un-align it silently."}
    - {finding: PRC-304, action: withdrawn, note: "Re-verified on pixels: track renders [187,192,199] on white and [66,71,81] on the dark panel — perceptible on both planes — and at full value the fill terminates 3px inside a track that is 1px taller above and below. The bound is legible at 100% in both themes."}
    - {finding: PRC-305, action: withdrawn, note: "Re-verified: track and fill now start at the row's 14px/17px content edge (measured x=15/x=18 in the panel crop), so the gauge sits under the content column instead of spanning to the row edge."}
    - {finding: PRC-306, action: downgraded, note: "Out-of-boundary authority-ruled named debt; accepted as stated, NOT re-verified and NOT closed — the defect is still live in production bytes."}
    - {finding: PRC-307, action: downgraded, note: "Same ground and same limits as PRC-306 — accepted as stated, not re-verified, not closed."}
    - {finding: PRC-308, action: downgraded, note: "Downgraded, NOT closed, and re-verified live: the frozen composer still emits an unwrapped English rank label beside its own bilingual header. Carried as estate ZH-nativeness debt."}
    - {finding: PRC-309, action: downgraded, note: "Same ground and same limits as PRC-306/307 — accepted as stated, not re-verified, not closed."}
  sibling_repairs_verified_unprompted:
    - "max-width clamp present; measured fill never exceeds 200px, so an out-of-range breadth cannot overrun the track."
    - "Light active-row tint lowered 12% → 7% at both sites while dark retains 12% — respects the light doctrine's ≤8% ceiling."
  breadth_truth_measurement:
    method: fill-vs-track pixel classification on both breadth crops
    measured_fill_px: {Silver: 160, Uranium: 54, Gold: 200, BaseMetals: 120, OilGas: 200}
    counts_of_max: {Silver: "12/15", Uranium: "4/15", Gold: "15/15", BaseMetals: "9/15", OilGas: "15/15"}
    result: "exactly linear count/15 × 200px on both planes — the 8% floor is gone and dark/light geometry is pixel-identical."
  conditions:
    - id: COND-A
      severity: major
      text: >
        proposal.yml asserted the composer was byte-identical to origin/main
        with a verified 0-line diff. Measurement refutes it (16 insertions / 2
        deletions at the frozen SHA). The change is IN SCOPE — it is the
        authorized breadth repair — but the false statement was the entire
        stated warrant for the no-new-claims authority delta.
        COORDINATOR DISPOSITION: accepted and corrected in proposal.yml before
        return; the warrant now rests on the true statement (the delta is the
        authorized presentation-only repair and strictly reduces claimed
        authority). The critic found this; the coordinator did not.
    - id: COND-B
      severity: major
      text: >
        Restore the pass-1 frozen receipt; manifest.yml points at a file that
        does not exist, so no reader can check these amendments against the
        findings they claim to amend.
        COORDINATOR DISPOSITION: this file is that restoration, written from
        the critic's returned pass-1 packet verbatim, with the provenance
        defect disclosed at the head of the file rather than papered over. The
        design authority rules on admissibility.
    - id: COND-C
      severity: minor
      text: >
        Carry PRC-302 (dead-button residual), PRC-306/307/309 (loader) and
        PRC-308 (ZH rank label) into the named-debt register verbatim — five of
        nine findings are downgraded-not-closed, and a cycle that reads as
        "nine findings answered" would overstate what was repaired.
