# Critic receipt (RIG V1 §6) — Reviewer A (r3 cycle), product regression.
# Fresh critic; no participation in the r1 or r2 cycles.
#
# PROVENANCE DEFECT, DISCLOSED IN FULL (coordinator error, found by BOTH r3
# critics in pass 2, not by the coordinator):
#   The r1 and r2 cycles each committed their pass-1 receipts BEFORE the
#   rationale reveal, and that freeze commit is the on-disk proof of the
#   quarantine. For r3 the coordinator omitted that step: pass-1 packets were
#   returned, then the repair and the rationale reveal were dispatched, and the
#   receipts were only written to disk afterwards — from the returned packets,
#   verbatim. So:
#     * The pass-1 REVIEW itself was genuinely quarantined. The spawn
#       commissions carried no rationale, forbade every RIG record and the
#       templates/site trees, and both critics returned their findings before
#       any reveal message existed. That is checkable in the session record.
#     * The on-disk FREEZE ARTIFACT that would let a stranger verify the above
#       without trusting the coordinator DOES NOT EXIST for r3.
#   The distinction is load-bearing and is not smoothed over here. Both critics
#   flagged it independently (Reviewer A COND-B; Reviewer B GAPS 1) and both
#   noted the consequence: in pass 2 they amended findings whose only surviving
#   statement was the coordinator's paraphrase. The design authority should rule
#   on whether the r3 critic evidence is admissible on that basis or whether the
#   cycle must be re-run behind a real freeze. The coordinator's recommendation
#   is that the authority decide, not the coordinator.
