first_pass:
  # Judged frozen SHA 2d463e7c4e8f (the pre-repair R3 head).
  verdict: PASS_WITH_CONDITIONS
  findings:
    - {id: VTC-301, severity: major, finding: "The breadth gauge's bounding track is drawn below perceptibility in BOTH themes (measured 1.37:1 dark, 1.34:1 light) and carries no border or end cap, so at full value — two of five rows in every shipped shot — the bounded instrument is visually identical to a plain rule; the proportion only reads at mid values."}
    - {id: VTC-302, severity: major, finding: "The gauge is positioned left:0 inside a row whose content padding is 14px, so the track starts flush against the panel border ~13px left of every other element in the row, and its 200px length terminates near where the ticker string above it ends while sharing that text's muted ink — it reads as an accidental underline of the ticker list rather than a measurement belonging to the row."}
    - {id: VTC-303, severity: major, finding: "The EN mobile lane selector truncates all four stance names, but lane names ARE the stances under ratified case law and the self-labeling chip strip requires full display names; ZH mobile proves the geometry is not forcing it, so at 390 the EN subscriber loses the plain-word stance that is the panel's whole point."}
    - {id: VTC-304, severity: major, finding: "ZH is not yet a native composition: the English word 'Theme' prints untranslated before every ZH theme name, and the Prophet card sector subtitles stay English on the same screen where the lanes render those same sectors in Chinese — one datum in two languages on one page."}
    - {id: VTC-305, severity: minor, finding: "In the leadership modal every column header is left-aligned while numeric cells are right-aligned, so across a 16-row scan the Rank head sits ~100px left of the values it labels and Names is offset from its column — two of five columns have no visual anchor."}
    - {id: VTC-306, severity: minor, finding: "The active-filter row highlight stops at the dashed divider and excludes the route-arrow cell, leaving a notch at the right end of the marked row, and the light tint is --link 12% against the doctrine's ≤8% ceiling for light highlight rows; the 3px rail is correct and is the important half of the callout idiom."}
    - {id: VTC-307, severity: minor, finding: "The active filter chip prints with no space after the colon and the dismiss glyph glued to the final word in both themes — the one control that says 'your population is filtered' is the least typographically finished control on the row."}
    - {id: VTC-308, severity: minor, finding: "The gauge fill is unclamped and leader-normalized, with nothing pinning breadth ≤ 100, so the top row always paints a full track by construction and an out-of-range value would silently overrun the track and still read as full."}
    - {id: VTC-309, severity: minor, finding: "Tier-1 jargon rides into the ratified reference in the table view ('await confluence' filling the Entry column, 'Mom Screen' heading a column); likely inherited product copy rather than presentation, but ratifying this set as canonical law ratifies the copy with it."}
    - {id: VTC-310, severity: minor, finding: "(critic severity: nit; recorded at the schema floor) The gauge encodes exactly the datum already printed as the NAMES figure at the opposite end of the same ~1300px row with no label joining them, where the ratified shared-scale-bar idiom pairs a bar with its number adjacently — the strongest available cue for what the bar means sits 1200px away from it."}
  strengths:
    - Light is authored as a second art direction, not a token swap — ~40
      light-scoped rules turn lane cards into hairline columns with inset rails
      and 4% state tints, give the top pick a 1px ring instead of a bloom,
      recess the segmented track, and scrim the modal with a cool text-derived
      wash; it passes the stranger test.
    - Colour-law discipline is exemplary — zero raw hex literals in 30.5KB of
      CSS, every value a token or a color-mix on one.
    - Breadth legibility is materially better than production (from an
      effectively invisible ~1.3:1 full-row hairline to a measured ~3.8:1 bar).
    - Dark identity is preserved without drift outside the leadership row.
    - The states are honest and calm as designs — filter-miss shows the count,
      a plain-word explanation and a real recovery, with no refutation
      vocabulary anywhere.
    - Table view is a real second archetype rather than a squeezed grid.
    - Mobile is deliberate re-composition, with the gauge unit re-scaled for
      390 rather than inherited at desktop size.
    - ZH direction rebinding is internally consistent across the whole board
      while the breadth gauge stays achromatic, so no directional meaning is
      accidentally minted.

