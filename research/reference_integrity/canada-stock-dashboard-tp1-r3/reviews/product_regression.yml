  first_pass_inputs:
    - user/business job (redacted packet: job, core interactions, information hierarchy)
    - capability ledger (redacted packet)
    - production-before artifact (comment-redacted composer at c819f6428f91)
    - proposed-after artifact (comment-redacted source at the frozen SHA + 24 rendered cells)
  rationale_received_after_first_pass: true
  packet_construction: >
    The critic was handed a purpose-built packet, not the repository. All CSS and
    JS comments were stripped (the stylesheet carries its rationale as a comment
    ledger); the baseline's chronology note, its design_lineage constraints and
    every TP-1 string were removed. An automated leakage scan over the packet for
