  forbidden_and_declared_unread: >
    research/reference_integrity/ (every cycle), the repository templates/ and
    site/ trees, research/THEME_PARITY*, docs/superpowers/plans/*,
    docs/DESIGN_DOCTRINE.md, every acceptance record, all PR and Slack content,
    every git history command, and the other reviewer's output.
  critic_declaration: >
    Honored in full. The critic states it read only the four packet files, the
    evidence PNGs named in its commission, a directory listing of that folder,
    PIL reads of those PNGs and two scratchpad crops derived from them; and that
    it ran no git log/show/diff/blame. Nothing about the author's reasoning,
    prior verdicts or repair narrative entered the review.

first_pass:
  # FROZEN BEFORE REVEAL. frozen_commit is this file's own freeze commit; see
  # manifest.yml and the RESULT returned to Sol for the ancestry proof.
  frozen_at: "2026-08-30T22:05:00Z"
  verdict: PASS_WITH_CONDITIONS
  coverage: >
    13 of 24 evidence cells opened or measured; the mobile 390 axis was closed on
    a second sweep after the coordinator refused a first pass that left it
    unverified. Cells not fully read are named under gaps rather than passed.
  findings:
    - id: PRA-401
      severity: major
      capability: "platform.fail_soft_legacy (and by consequence every core capability)"
      finding: >
        The composer is injected only from inside the stylesheet's success
        callback. ensureStockDashCss(inject) calls inject() from link.onload;
        link.onerror retries and, after 3 attempts, falls through with NO
        terminal branch — onReady is never invoked, so the composer is never
        appended. The before build carried its own stylesheet and could not be
        blocked by an asset failure. Anything that makes the stylesheet fail
        three times (stale ?v= against a purged edge object, CDN 5xx, cache
        partition miss, CSP style-src tightening) silently deletes the entire
        board for that user, who gets the legacy page with no act-now lanes, no
        Top Picks/All Candidates switch, no filter counts and no leadership
        modal, with no console assertion, beacon or degraded-mode chip. It is
        fail-soft, hence major and not blocker — but it converts one static asset
        into a single point of failure for a surface that previously had none,
        and it inverts the degrade contract, since two_fetch_degrade guarantees a
        render in 2.5s when DATA is slow while the board cannot render at all
        when the STYLESHEET is slow past the ladder.
      clearing_condition: >
        Either give attemptLoad a terminal branch calling onReady() after the
        last failed attempt (composer mounts unstyled-but-functional, matching
        the before guarantee), or explicitly ratify "no CSS implies no dashboard"
        and add the missing failure signal.
      evidence: "after dashboard-icons.js:215-228 and :248; contrast before canada-stock-v36.js:139-184 and :394"
    - id: PRA-402
      severity: minor
      capability: "leadership.expand_modal, leadership.themes_only_rank"
      finding: >
        All modal styling, plus the modal's stance and rank chips, hangs off a
        general-sibling combinator scoped .mx-stockdash--ca ~ .ca-v36-modal,
        while the composer inserts main after the nav and appends the modal to
        body. Combined with the unconditional .ca-v36-modal display:none, a
        future shell change that wraps .site-nav in a header does not degrade the
        modal — it makes it permanently unopenable, Expand-leadership becomes a
        dead control, and nothing surfaces an error. The before styled the modal
        position-independently. Resilience finding; it works today in both themes.
      evidence: "after stock-dashboard.css:292, :294-299, :43-48, :169-183, :451-463; DOM assembly after canada-stock-v36.js:362 and :370"
    - id: PRA-403
      severity: minor
      capability: "platform.fail_soft_legacy, cross-route hygiene"
      finding: >
        ensureStockDashCss is declared at file top level, outside any IIFE and
        outside "use strict", unlike the three sibling blocks in the same file,
        so the site-wide icon decorator publishes a global on every route that
        loads it. Separately the HK loader calls inject() with no CSS gate while
        the CA loader gates on the stylesheet; if the HK composer ever adopts the
        .mx-stockdash family it mounts against a stylesheet nobody loaded.
        Harmless today, unmarked trap.
      evidence: "after dashboard-icons.js:193 vs IIFE form at :2, :231, :251; HK gate absent at :268"
    - id: PRA-404
      severity: minor
      capability: "leadership.themes_only_rank (modal reading)"
      finding: >
        th:first-child:nth-last-child(5) plus td.num right-align the Rank column
        — a left-edge identifier, not a quantity. In the light modal the Rank
        header's right edge sits at x~273 while the table's left content edge is
        x~148, leaving a ~110px dead gutter down the left of the dialog with
        "Theme #1" jammed against the Name column it must be distinguished from.
        The inline leadership list left-aligns the same value, and the 390 crop
        confirms the inconsistency persists at mobile. One quantity aligned two
        ways, one click apart. Right-aligning the trailing Names count is
        correct; extending it to Rank is over-reach.
      evidence: "after stock-dashboard.css:321 and :323-326; proposal-modal-light-en-1440.png"
    - id: PRA-405
      severity: minor
      capability: prophet.live_quotes
      classification: evidence-matrix defect (not an artifact defect)
      finding: >
        Every change cell in all 24 images renders an em-dash — no live tick at
        capture time — so no .up or .down pixel exists anywhere in the matrix.
        The ledger marks live quotes core and states the requirement as Western
        green-up/red-down even under ZH. That clause is UNFALSIFIABLE from this
        evidence: the declarations demonstrably survive, but the rendered result
        cannot be confirmed, and this is precisely where it matters — the ZH
        cells show every surrounding semantic colour correctly inverting to the
        CJK convention, so the one element required to RESIST that inversion is
        the one element the matrix cannot show. Minor because the declarations
        are byte-equivalent in intent to the before build and regression risk is
        low, not because the gap is unimportant.
      clearing_condition: "one cell captured during a live session, ZH, with at least one non-flat change value"
      evidence: "after stock-dashboard.css:237-240; before canada-stock-v36.js:172; all 24 images"
    - id: PRA-406
      severity: minor
      capability: "prophet.population_filters (honest filter-miss state), platform.theme_lang"
      classification: evidence-matrix defect (not an artifact defect)
      finding: >
        The filter-miss cell exists in LIGHT ONLY. This is not a symmetric
        omission: the filter-miss surface is composed largely of light-specific
        rules with no dark twin in evidence — the empty region sits on a
        light-only card-grid background override, and the escape control gets a
        light-only panel background and card shadow. In dark neither applies, so
        the empty state renders on the panel surface with a different button
        treatment and no elevation: a materially different composition that no
        committed cell shows. Under the house theme law both themes must be
        adjudicated as designs; the dark filter-miss state has not been. The dark
        rules are inherited unchanged and unlikely to be broken, but "unlikely"
        is not evidence.
      clearing_condition: "one proposal-filtermiss-dark-en-1440.png"
      evidence: "after stock-dashboard.css:390 and :414-416; directory listing shows exactly one filtermiss cell, light"
  mobile_390_resolution:
    verdict: VERIFIED, no finding
    detail: >
      All four sub-claims hold across all four theme x locale mobile cells plus
      the lane-switch cell. The segmented lane control is a real control (tab 2
      selected switches the body to IN FAVOUR with its own accent and rows, same
      DOM position). Exactly one lane body renders. The card grid is 1-up. The
      reduced gauge encodes honestly at small size — track measured 116px exactly
      against calc(100 * 1.1 * 1px + 6px), fills 88/30/110/66/110px against
      counts 12/4/15/9/15 of max 15, i.e. 80/27/100/60/100 percent, exact in all
      20 measurements, so the encoding is viewport-independent.
    inherited_not_introduced: >
      EN tab labels truncate at 390 ("Buy N…", "Botto…", "Redu…"). The before
      build carries byte-identical rules, so this is inherited estate debt, not a
      TP-1 regression; the after actually improves light by tinting unselected
      tabs.
  strengths:
    - Breadth is honest and legible at both viewports. The before floored every
      group at 8% of row width, so a near-zero group still drew a bar — the
      encoding lied at the low end. The after emits no bar and no track when
      membership is unknown, extending the missing-is-not-zero discipline to
      leadership, and the new track finally supplies a denominator where the
      before had an essentially unreadable 1px hairline at half opacity.
    - Light is designed as a different material, not a token swap. The before's
      light was the dark composition with variables changed. The after gives
      light its own act-now grammar — lanes lose card chrome for one continuous
      hairline-divided surface, the accent moves to an inset rule over a 4%
      header tint, divider logic is re-derived at 2-up and 1-up, and card depth
      switches from glow to shadow.
    - Hardcoded non-token colours are gone; radii moved to the canonical scale
      with the old literals kept as fallbacks.
    - Selected state is finally distinguishable from hover — the before collapsed
      both into an identical 6% wash, so a user could not tell which group was
      filtering the board.

second_pass:
  # Run AFTER the freeze commit above and after the rationale/constraints reveal.
  verdict: PASS_WITH_CONDITIONS
  continuation_note: >
    DISCLOSED CONTINUATION. The host purged the pass-1 critic context after the
    freeze, so this pass was executed by a continuation of the same reviewer
    identity rather than the original process. It reconstructed the position from
    the COMMITTED pass-1 receipt (frozen in d075b8b95ec3 before any reveal), the
    unchanged packet and the committed evidence. Quarantine ORDERING therefore
    remains provable by git ancestry — the findings existed in the tree before the
    reveal — but CONTINUITY OF REASONING between passes does not: the critic
    re-derived each mechanism from bytes rather than recalling why it was written,
    and states that any weight placed on "the same mind judged twice" should be
    discounted accordingly. This is a material improvement on the superseded
    cycle, where the receipt did not exist and the critic worked from the
    coordinator's paraphrase; it is not equivalent to an unbroken context.
  method_note: >
    All byte checks were re-run against the frozen artifact SHA via git show, NOT
    the working tree. The critic flags this as load-bearing: the records-branch
    worktree lacks the modal alignment rules entirely, so a working-tree check
    would have reported the PRA-404 rules as absent from the repo. Reviewers on
    this reference must pin to the artifact SHA.
  amendments:
    - finding: PRA-401
      action: upheld
      severity: major
      basis: re-verified-evidence
      note: >
        Ratification accepted and the earlier reviewer's reading conceded as
        defensible — the legacy page does survive, and the fail-soft omission is
        deliberate and documented in an authored comment plus a ledger, which a
        comment-stripped packet could not show. Severity holds anyway on two
        checked grounds. The pass-1 clearing condition offered two exits: a
        terminal onReady(), or ratify "no CSS implies no dashboard" AND add the
        missing failure signal. The reveal supplies the ratification; bytes show
        NO signal — no console, no beacon, no degraded-mode class — so half the
        condition is unmet. And ratification does not touch the asymmetry: a
        contract written when the composer owned its CSS cannot pre-authorise a
        dependency that did not then exist. The finding was never "the clause is
        violated"; it is "the change enlarges the failure set of a frozen surface
        and the new failure mode is unsignalled".
    - finding: PRA-402
      action: upheld
      severity: minor
      basis: re-verified-evidence
      note: >
        The ordered-repair history is corroborated in the artifact's own comments
        and the DOM premise independently confirmed. The finding was never that
        the combinator is wrong; it is that combinator plus fail-closed base makes
        a future shell change silently FATAL rather than degrading — the opener
        lives inside the scoped family while the unconditional display:none is
        page-global, so if adjacency breaks the modal stays hidden with no error.
        Added evidence for the same finding: the file cites "no bare page-global
        selectors" nine lines before authoring one. Carried as forward debt for
        TP-2; the clean fix is a composer data attribute, outside the frozen
        boundary.
    - finding: PRA-403
      action: downgraded
      severity: minor
      critic_severity_word: nit
      basis: mixed
      severity_note: >
        The critic downgraded to "nit", which is not a legal RIG severity;
        recorded at the schema floor "minor" with the critic's word preserved, the
        same treatment applied elsewhere in this estate.
      note: >
        Re-verification FALSIFIED the critic's own pass-1 wording: "unmarked trap"
        is wrong — the artifact carries an explicit KNOWN LIMIT naming the
        single-caller constraint, the multi-caller listener-death mechanism, TP-2
        and HK as the trigger, and the remedy. The HK-scope half rests on
        AUTHORITY CONTEXT ALONE and is labelled as such; the critic did not read
        the boundary document. The global-leak half survives on bytes and the
        reveal does not address it: the loader is the sole top-level declaration
        outside every IIFE, and is loaded by at least six route families, so it
        publishes on routes that never load this stylesheet. Disclosure is not
        enforcement — nothing mechanically stops TP-2 adding the second caller.
    - finding: PRA-404
      action: upheld
      severity: minor
      basis: re-verified-evidence
      premise_rejected: true
      note: >
        THE REVEALED PREMISE DID NOT SURVIVE RE-VERIFICATION, and the coordinator
        records that against itself. The reveal stated this was an ordered repair
        of modal headers misaligned from their values. Production-before bytes
        show otherwise: the accepted V3.8 modal-table rule set gives td NO
        text-align at all, and an exhaustive grep for text-align right in the
        before stylesheet returns exactly one hit, the inline lane count — no
        modal-table rule. In accepted V3.8 both the numeric cells and the headers
        rendered left-aligned and the table was internally consistent. The AFTER
        build adds an explicit td text-align left and a NEW td.num text-align
        right, and only then right-aligns the headers. The mismatch "repaired" at
        R3 was therefore CREATED by an earlier step of this same TP-1 chain, and
        the repair propagated a new presentation decision rather than reverting
        it. This matters beyond taste: the stylesheet asserts the work "restores
        the ACCEPTED V3.8 production rendering; it is not a new dark decision" —
        for this table that claim is FALSE, in both themes, on a core capability.
        Status upgraded from "over-reach" to "introduced regression against the
        frozen rendering". Needs an authority decision: revert td.num
        right-alignment for Rank (restoring V3.8 and removing the need for the
        positional header selector entirely), or ratify the new alignment as a
        deliberate change to the frozen surface.
    - finding: PRA-405
      action: upheld
      severity: minor
      basis: re-verified-evidence
      disposition: named-debt-not-blocking
      note: >
        Artifact half re-confirmed equivalent in intent to the before build. The
        critic answers the coordinator's question plainly: NAMED DEBT, and it must
        not be recorded as verified. The gap keeps its teeth — live quotes is a
        CORE capability, its requirement is Western green-up/red-down EVEN UNDER
        ZH, and the ZH cells show every surrounding semantic colour correctly
        inverting to the CJK convention, so the one element required to RESIST
        that inversion is the one element the matrix cannot show. The capability
        is declaration-verified and render-unverified, and the acceptance record
        must say so in those words.
    - finding: PRA-406
      action: upheld
      severity: minor
      basis: re-verified-evidence
      disposition: blocking-condition-on-this-verdict
      note: >
        Re-confirmed by directory listing. NOT a symmetric omission waivable by
        inheritance: the filter-miss surface is composed substantially of
        light-specific rules with no dark twin in evidence, so in dark the empty
        state renders on a different surface with a different button treatment and
        no elevation — a materially different composition that no committed cell
        shows. Under the house theme law both themes must be adjudicated as
        designs. "Inherited and unlikely to be broken" is a prediction, not a
        cell. This is why the pass-2 verdict is PASS_WITH_CONDITIONS and not PASS;
        it is not BLOCK because surrounding dark evidence is dense (10 dark cells)
        and this is a single derived state. Clearing condition: one
        proposal-filtermiss-dark-en-1440.png.
  open_carried_as_named_debt:
    - "PRA-401 major — ratification on record; the failure-signal half of the clearing condition is unmet on bytes. Needs a terminal onReady() or an explicit failure signal, plus an authority ruling on the two-reviewer split."
    - "PRA-402 minor — forward debt for TP-2; the composer data attribute is outside the frozen boundary."
    - "PRA-403 minor (critic word: nit) — HK seam remedy disclosed but not enforced; the top-level global remains."
    - "PRA-404 minor — authority decision required: revert to V3.8 alignment, or ratify a deliberate change to the frozen surface. The artifact's own restoration claim is false for this table."
    - "PRA-405 minor — declaration-verified, render-unverified; must not appear as passed."
    - "PRA-406 minor — the blocking condition on this verdict; one dark filter-miss cell."
  observations_not_findings:
    - "The hand-stamped cache token makes the cache key hand-maintained: an edit to the stylesheet without bumping the constant serves stale CSS to warm caches, and the site immutable list makes that durable. No test pins the two together."
    - "A bare page-global modal display none is authored nine lines after the file cites an architecture rule forbidding bare page-global selectors."
    - "The existing-link branch can silently never resolve: a listener attached to a link that already errored never fires, the same terminal-branch shape as PRA-401 on a different path. Unreachable today given the loader guard."
    - "A declared capture manifest in the packet — which cells were attempted and why any were skipped — would let a blind first pass distinguish 'the artifact lacks this state' from 'the coordinator did not capture this state', without revealing rationale."
