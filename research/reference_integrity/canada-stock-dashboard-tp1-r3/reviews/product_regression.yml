# Critic receipt (RIG V1 §6) — product regression, R3 REVIEW-ORDER RE-RUN.
#
# This receipt replaces the earlier r3 product_regression receipt, whose review
# ORDER could not be proven: its pass-1 findings were never committed before the
# rationale reveal, so no stranger could verify the quarantine. The superseded
# receipt is preserved verbatim at reviews/superseded_review_order/ and every one
# of its findings is carried in continuity.yml — nothing evaporates.
#
# This cycle was run under Sol CONTINUE (carrier
# theme-parity-tp1-canada-20260828-sol-001, ts 1788118073.730499) with a
# genuinely fresh critic that had never seen the surface, the prior verdicts, the
# RIG records, or any repair narrative. THIS FILE IS THE FIRST-PASS FREEZE: it is
# committed BEFORE any rationale or constraint is revealed, and git ancestry —
# not the coordinator's word — is the proof of that ordering.
