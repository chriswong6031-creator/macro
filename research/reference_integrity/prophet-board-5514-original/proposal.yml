# ── User-Task Regression Matrix (RIG §6) ───────────────────────────────────────
user_tasks:
  - id: task.glance_scan
    task: scan the grid and shortlist the 2-3 most actionable names in seconds
    critical: true
    production: "verb pill + verb hue + chart shape + PRIORITY number: a grid scan is pre-attentive (hue/shape), ~2s per row"
    proposal: "hue-free weight caps + lifecycle word + prose 'why' + three money rows: every card must be read"
    verdict: WORSE
    notes: "visual compression replaced by text; density law says dashboards are scanned, not read"

  - id: task.price_now
    task: know where price is now relative to the stated levels before acting
    critical: true
    production: "live quote + change on-card (live.js), beside the zone range"
    proposal: "static nightly plan levels only; no live quote anywhere on the card"
    verdict: WORSE

  - id: task.momentum_context
    task: detect chase/momentum context (what did this just do?)
    critical: true
    production: "live change pill + sparkline geometry"
    proposal: "neither exists; 'past its 45-day window' is the only recency signal"
    verdict: WORSE

  - id: task.readiness_rank
    task: judge which setups are most ready today
    critical: true
    production: "PRIORITY 0-100 printed with honest gloss; Featured cohort glow"
    proposal: "priority survives only as invisible sort order (board.js:200); no printed value, no cohort cue"
    verdict: WORSE

  - id: task.lifecycle_position
    task: know where each setup sits in its lifecycle, with counts that reconcile
    critical: true
    production: "4-stage rail with a producer-less state (known defect) + duplicated count vocabulary"
    proposal: "ruled 7-cell lifecycle, exhaustive partition, ladder=filter, counts reconcile exactly, Resolved outside the live count"
    verdict: BETTER

  - id: task.population_truth
    task: trust that the board's numbers describe one real population
    critical: true
    production: "'69 shown · 93 setups' beside five shelf counts — three count vocabularies"
    proposal: "one canonical total (162), every setup integer a ladder value or difference; mutation-tested"
    verdict: BETTER

  - id: task.duplicate_episodes
    task: understand a name that appears twice (two commitments)
    critical: false
    production: "not represented (ticker-keyed board)"
    proposal: "one card per plan row + dated 'Episode N of M' chips + forward links"
    verdict: BETTER

  - id: task.act_today_boundary
    task: know which names I am allowed to act on today
    critical: true
    production: "Live now shelf + ⚡ trigger chips + zone active/muted states"
    proposal: "ready/entered cells + 'in the entry window' gloss + Entry level"
    verdict: UNKNOWN
    notes: "different mechanisms; neither obviously dominates without user evidence"

# ── Authority Delta (RIG §6) ───────────────────────────────────────────────────
authority_delta:
  - id: auth.zone_to_levels
    production_claim: "ZONE $52.15–$53.81 (a relevant range; 5 presentation states)"
    proposal_claim: "Entry 52.15 · T1 58.90 · Void 49.80 — labelled execution levels on every card"
    direction: stronger
    warranted: false
    evidence: >
      plan JSON carries the fields, but production deliberately renders the compact
      zone only: exact entry/stop/target numbers are the paid payload and the
      execution-prescriptive framing was never shipped on the glance tier
      (P0 packet §C ACCESS; terse-verb ruling _prophet_card.html.j2:26-34).

  - id: auth.window_position
    production_claim: "no holding-period claim on-card (age_days/horizon_days exist in data, rendered nowhere — repo-wide template grep)"
    proposal_claim: "'day 12 of 45' / 'past its 45-day window' on every card head"
    direction: stronger
    warranted: false
    evidence: >
      implies a required/declared holding window the engine does not stand behind on
      the glance tier; the artifact's own notes (Q2) document the producer
      contradiction — 16 rows past their declared window while the Overtime cell
      reads 0 — i.e. the claim's producer disagrees with the ruled cell.

  - id: auth.prose_thesis
    production_claim: "one terse ruling verb (buy/near/wait/hold/avoid); guidance prose operator-killed 2026-08-03"
    proposal_claim: "multi-line what-to-do prose on every card (.pv-do)"
    direction: stronger
    warranted: false
    evidence: "re-introduces prescriptive narrative the operator explicitly removed ('not coming back'); no new ruling authorizes it"

# ── Information-Economics Audit (RIG §6) ───────────────────────────────────────
information_economics:
  words_per_card:
    production: "≈18 visible words at rest (card-zoom evidence; verb+chips+ticker+name+PRIORITY+zone+date)"
    proposal: "≈45-70 visible words at rest (lifecycle word+gloss, window line, name·sector, prose do_, three labelled money rows, episode chip) — estimate from frozen crops 01/16; no stopwatch claims"
  findings:
    - "chart (pre-attentive geometry) replaced by nothing; price geometry now absent (BLOCKED_DATA mis-filed as removal)"
    - "compact visual state (verb hue, zone chip states, tracker dots) replaced by words that must be read"
    - "prose re-enters the dense grid (.pv-do) — the exact reading-unit-vs-glance-unit conversion the 2026-08-03 kill removed"
    - "three labelled money rows per card repeat information the zone chip carried in one"
    - "glance tier → reading tier conversion across a 40-card grid multiplies read cost ~40×"
  preserved:
    - "ladder/cap weight grammar is itself excellent visual compression (lifecycle without hue)"
    - "count reconciliation removes the cognitive tax of three disagreeing vocabularies"
