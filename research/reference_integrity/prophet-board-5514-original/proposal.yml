# ── Dispositions, as the original artifact actually made them ──────────────────
# Baseline ids with NO row here: card.live_quote, card.live_change,
# card.priority_score, card.compact_glance_geometry, card.caution_popover —
# all silently absent from the frozen card (board.js card() 218-285 renders none
# of them; DESIGN_NOTES.md never mentions their fate). Implicit deletion.
dispositions:
  - id: card.chart_hero
    disposition: REMOVE
    rationale: >
      spark_svg is a candidate-join enrichment covering 45/179 plan rows (25%); the
      chart hero is dropped entirely rather than shown on a quarter of cards
      (DESIGN_NOTES.md Q1, verbatim). Data-coverage-motivated removal.
    # user_job_impact, superiority_case, approval_ref: ABSENT in the original.

  - id: card.zone_chip
    disposition: REMOVE
    rationale: >
      replaced by explicit plan-book execution geometry: Entry / T1 / Void money rows
      in the card footer (board.js:275-282), sourced from fields every plan row carries
      (DESIGN_NOTES.md Q1 card spine).
    # superiority_case and approval_ref ABSENT: no receipt that explicit execution
    # levels beat the compact zone abstraction on a glance surface; the terse-verb
    # and paid-payload rulings point the other way.

  - id: card.verb_hue_identity
    disposition: REMOVE
    rationale: >
      "the card does NOT get a verb hue bar — a saturated colour at the card's head,
      on a card whose primary classification is hue-free by law, would invite exactly
      the 'lifecycle by colour' misread the ruling forbids" (DESIGN_NOTES.md §2.3).
      Extends the lifecycle direction-neutrality ruling (which governs lifecycle marks)
      to the card's entire color identity.
    # approval_ref ABSENT: no ruling extends J9C/J10's mark-neutrality to deleting
    # the stance-verb hue system, the zh direction flip, or the Featured cohort glow.

  - id: card.stance_verb
    disposition: RELOCATE
    rationale: >
      the ruling stance word is not rendered; the lifecycle fact column (cell word +
      gloss, board.js:242-247) and the entry-window gloss stand in for it.
    destination: "lifecycle fact column (Ready/Entered word + gloss)"
    # reachability ABSENT: a lifecycle state is not a stance — Entered says where the
    # plan is, not what the user should do; no proof the stance job is still served.

  - id: card.stage_tracker
    disposition: IMPROVE
    rationale: >
      the producer-less four-dot triage rail is removed ("No .pv-stp, no .pv-dot" —
      DESIGN_NOTES.md §5) and replaced by the ruled 7-cell lifecycle: ladder cells +
      the same .mx-cap weight geometry on every card (board.js:221-223), counts that
      reconcile exactly (62+96+0+0+4=162), mutation-tested by tools/verify.py.
    target: "count ladder + per-card lifecycle cap + fact column (ruling J9C/J10)"

  - id: card.asof_stamp
    disposition: RELOCATE
    rationale: "per-card as-of replaced by board-level freshness + dated episode chips on multi-row names (board.js:257-264)"
    destination: "board header .dtp/.pbs stamp; episode chips carry dates on multi-episode names"

  - id: board.triage_shelves
    disposition: IMPROVE
    rationale: >
      triage shelves survive as the Candidates section — a second population with its
      own noun and form (pills, no caps), one printed total (69 = 28+27+10+2+2), two
      shipped strings relabelled per the one-referent-per-page law (DESIGN_NOTES.md §4,
      §4.1). The Setups/Candidates separation cures the count-vocabulary defect.
    target: "Candidates section (§4) + count ladder for Setups"

  - id: board.track_record_strip
    disposition: RETAIN
    target: "evidence & record section (P0 §B structure row 5)"

