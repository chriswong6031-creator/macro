  strengths:
    - "Count integrity is genuinely better than production: one canonical total, a single cellCount() accessor with a grep-able audit rule, Resolved held outside the live total — this directly cures the duplicated count vocabulary baseline.yml files as a known defect."
    - "Key-absent is distinguished from zero and disclosed in plain words (em-dash + 'Watch tier publishes from the next nightly') — a stricter reading of the nulls-printed law than production applies to its own dark inputs."
    - "The weight-encoded lifecycle marks are direction-neutral and not colour-only, so they survive the zh red/green inversion and colour-vision deficits; identical cap geometry on ladder cell and card makes the two read as one governed population."
    - "One card per plan row with dated 'Episode N of M · opened <date>' chips and 'Newer plan on this name →' cross-links makes two separate commitments on one ticker legible for the first time."
    - "Window position ('day 8 of 45' / 'past its 45-day window') is a real new fact production does not carry, and it is what makes an Overtime cell legible at all."
    - "The anonymous path puts exactly one card's data in the DOM and fills the row with contentless skeletons — a stronger gating posture than production's blur over fully-rendered teaser content."
    - "Candidates are separated into their own noun with their own printed-once total and an explicit 'a candidate is not a setup' sentence."
    - "Empty and empty-filter states are differentiated and explained rather than blank."
    - "Table view renders every row of the active filter and prints the rendered count so the surface reconciles with no remainder."
    - "The designer surfaced rather than papered over a live data disagreement (16 open rows past their declared window while the Overtime cell is 0) in an in-code comment escalating it as an open question."

second_pass:
  amended_at: "2026-08-13T06:32:00Z"
  amendments:
    - {finding: PRC-001, action: upheld, note: "Q1 measures the CANDIDATE-JOIN price at 25%, but the live-quote path is ticker-keyed, not join-keyed — the ruling keeps data-ticker expressly 'for the live-quote JS' — so 100% of plan rows could carry a live price; the constraint explains dropping a stale join field, not dropping the live tape from a card that prints a Void level."}
    - {finding: PRC-002, action: downgraded, note: "blocker→major: Q1's drop-entirely-vs-25% rule is a defensible product call and P0 §B's card-depth ladder omits the chart; but no replacement for 'read recent geometry without opening anything' and no escalation asking PR-0(c) to source a spark for plan rows — dropped without a successor."}
    - {finding: PRC-003, action: upheld, note: "Not addressed anywhere in the notes — the ⚠N ledger is computed from conviction/plan data, not candidate-join rows, so Q1 does not cover it; §7's '.pvcard is the shipped card with its rail removed' is materially inaccurate about a card that also lost its entire risk tier while gaining Entry/T1/Void."}
    - {finding: PRC-004, action: upheld, note: "The notes never mention .pv-do, the 2026-08-03 operator kill, or the line-clamp; 'why' as a one-word slot name cannot reinstate an overturned design that renders imperative, position-presuming, truncated boilerplate."}
    - {finding: PRC-005, action: upheld, note: "Unaddressed; made worse by the rationale's own reliance on the receipts tier (lane meaning in LENS, Extended texture on 'Plan detail / LENS') while the artifact offers no route to any per-name or per-plan detail at all."}
    - {finding: PRC-006, action: downgraded, note: "blocker→major for the hue half: §2.3 gives a genuine ruling-anchored reason (saturated colour at the card head on a hue-free classification invites the lifecycle-by-colour misread) with computed-style verification in both languages; it does not cover the VERB itself (DNR:KILL-PROPHET-POP-MERGE keeps the card verb as the ruling stance), so the stance-word loss stands as major."}
    - {finding: PRC-007, action: upheld, note: "Priority appears in the notes only as sort order; the score is a plan-payload field (the mockup itself sorts on it), so no coverage constraint explains dropping the value while keeping nothing of the honest gloss."}
    - {finding: PRC-008, action: downgraded, note: "major→minor: §2.5 shows the em-dash is deliberate ruling-grounded key-absence rendering and the five-cell reconciliation is exact; what remains is a one-line copy defect ('six cells add up' above a cell that cannot be added), not a count-integrity failure."}
    - {finding: PRC-009, action: upheld, note: "Q3 earns the 'only print the derivable figure' decision completely — but the defect is that the ONE printed figure is recounted from filtered rows in breach of the file's own COUNT LAW and silently rescopes under a filter (17→0) with an unchanged label, which Q3 does not address."}
    - {finding: PRC-010, action: downgraded, note: "major→minor: §4/§4.1 justify the relocation as a second population with audited copy and exact decomposition; but ruling §5:192 grants the screener 'shelf grouping + filter as today' and the reference renders inert spans — the filter-affordance loss is unexplained even though the relocation is justified."}
    - {finding: PRC-011, action: upheld, note: "Unaddressed; §1 asserts the section order ends with 'does this machine work', yet that section carries four bare links and zero figures — the rationale states the intent the artifact fails to deliver."}
    - {finding: PRC-012, action: upheld, note: "Unaddressed; the notes are precise about the two source as-of dates, which makes the absence of any degraded/behind state for the ranking prices a gap the author was demonstrably positioned to see."}
    - {finding: PRC-013, action: downgraded, note: "major→minor: the as-of date is a plan-book field so Q1 gives no cover — but the artifact adds a per-card freshness fact of its own (window position) that partly serves the same job, which pass-1 severity did not credit."}
    - {finding: PRC-014, action: upheld, note: "'40 cards + 122 more = 162' is a count-law success but not a capability argument for routing 122 of 162 rows into a table that drops name, sector, lane, window position and the why-line; the notes never weigh that trade."}
    - {finding: PRC-015, action: downgraded, note: "Split by cause — major with partial cover for lane only (Q1's 44/179 + §5's deliberate no-recovery-chip). NOT covered: ★ Featured, New, Blow-off risk, Theme just turned, Adjusted, and the shipped ANTICIPATION 'Extended? Not checked' printed null — none is a join field, and deleting a shipped printed-null while adding a new one for Watch is not a coverage consequence."}
    - {finding: PRC-016, action: upheld, note: "Unaddressed; the notes rely on LENS carrying displaced meaning while the artifact carries two hover targets on a 40-card page — an unremarked shortfall rather than a stated tradeoff."}
    - {finding: PRC-017, action: downgraded, note: "major→minor: name/sector are join-conditional by construction (45/179) and Q6 shows the author systematically flagged his own new zh strings for a native pass — the zh lane is disclosed, not neglected; the untranslated sector on the 25% that DO render still needs tr()."}
    - {finding: PRC-018, action: downgraded, note: "major→minor, reclassified correctly-escalated: Q2 names the contradiction precisely, refuses to relabel a ruled cell (not the designer's call), and routes it to the ruling lane — the right disposition; the residue is that the flagship first card still renders both halves as fact with no on-card reconciliation."}
    - {finding: PRC-019, action: upheld, note: "§1 presents Groups' '22 sectors & themes moving' inside the governed-populations table as if governed, when it is the sum of five hardcoded literals over 22 invented narratives, and the hardcoded regime header claim is never mentioned — a document this rigorous about producer-less cells cannot leave its own producer-less section unlabelled."}
    - {finding: PRC-020, action: downgraded, note: "major→minor: §7 scopes the artifact as G-C only with migration gated on G-A/G-B, so the fork is a question for MP-1's implementation against the ruling's parameterized-variant grant; remains a condition on adoption-as-law because the artifact is what a builder would copy."}
    - {finding: PRC-021, action: upheld, note: "Unaddressed; entry/targets/invalidation are plan-book fields present on every row, so no coverage constraint applies, and the footer/prose disagreement about what the entry actually is remains a self-contradiction inside the mockup's own data."}
    - {finding: PRC-022, action: withdrawn, note: "§0 documents query-parameter state switching as the harness contract for the whole mockup — reload-based filtering is the capture mechanism, not a proposed production interaction; grading it as prescribed behaviour was my error."}
    - {finding: PRC-023, action: downgraded, note: "minor→nit for the ladder wrap (dashed outline and caption survive at 390w, zero horizontal scroll asserted per shot); the one-up mobile grid against production's two-up stands as a scan-cost observation the notes do not weigh."}
  verdict: BLOCK
  closing_note: >
    The rationale is a genuinely strong document and it changes the picture on roughly half
    the file: Q1's 25% join-coverage measurement legitimately explains the chart, lane chip
    and name/sector losses; §2.3 gives a real ruling-anchored reason for the hue-free card;
    Q2, Q3, Q4 and Q6 are model escalations that name defects rather than paper over them;
    and §0's harness contract withdraws PRC-022 outright. What it cannot excuse is the
    cluster that is not a coverage consequence at all — the ⚠N risk ledger, the ruling
    stance verb, the Priority value, the printed-null marks, the per-name detail link, and
    the board-level staleness warning are all plan-book-side or ticker-keyed facts, deleted
    while the card simultaneously gained Entry/T1/Void and imperative position-presuming
    prose that an operator killed in 2026-08-03 and the notes never mention. Verdict stays
    BLOCK on PRC-001/003/004/005 alone: a card that instructs "Exit the full position"
    while showing no live price, no chart, no cautions and no route to the receipts tier is
    more authoritative and less falsifiable than the surface it replaces, and no disclosed
    constraint asks for that trade.
