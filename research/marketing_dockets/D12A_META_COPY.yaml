# Multi-page family patterns — builder substitutes {name} from each page's context.
family_patterns:
  fund:   # fund_*.html (52 pages) — {name} = fund display name
    seo_title: "{name} 13F Holdings & Moves — Mastermind"
    seo_desc: "{name}'s latest 13F — top holdings, new stakes, exits and conviction shifts, with four-quarter memory. Updated each filing cycle."
  strategy:   # strategy_*.html (46 pages) — {name} = strategy display name
    seo_title: "{name} — Strategy Scorecard — Mastermind"
    seo_desc: "The {name} strategy — rules, live stance and full track record, updated with each close."
  report:   # report_*.html (6 pages) — title from report registry; desc = the report's
            # own visible lede/subtitle, truncated ~155 chars (never invent content).
    seo_title: "{report_title} — Mastermind Research"
    seo_desc: "{report_lede}"

# Rules for pages found in site/ but not listed above (e.g. lab pages): default
# seo_title = existing <title> stripped of dates; seo_desc = one honest sentence from
# the page's own hero/subtitle text; flag any page where no honest sentence exists.
