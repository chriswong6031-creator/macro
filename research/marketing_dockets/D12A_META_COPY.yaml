# D12A ratified meta copy table — consumed by PR B (mechanical application).
# Law (see D12A R6): seo_title/seo_desc are EN plain text (no t()/markup, no internal
# state names, no untranslated stats, never the word "validated"); <title> tags are NOT
# edited in W1. seo_path = the page filename. Descriptions target ~120-160 chars.
# Pages already carrying full _seo_head (macro, us_stocks, china, hk, canada, bonds,
# forex, cycle, commodities, macro_context, market_structure, movers, transmission,
# china_mechanics, stage_analysis, china_stocks, hk_stocks, index, confluence_screener)
# are NOT listed — leave them untouched.
# If a template already emits an inline <meta name="description"> or canonical, REMOVE
# the inline tag when adding the _seo_head include (no duplicate meta).

