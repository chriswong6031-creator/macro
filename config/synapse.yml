      LT-3a (Long-Hold External Foundation). Buyback execution reader + capital
      allocation display block. Reads repurchases from statements_quarterly.parquet
      (PaymentsForRepurchaseOfCommonStock), shares/debt_lt/dividends from
      fundamentals_panel.parquet, and sbc from statements.parquet (sparse until
      LT-1 backfill lands — null handled gracefully as 'unavailable').

      FROZEN v1 display semantics (display conventions, not registered hypotheses):
        capital_allocation_delta: 'accretive' (shares_yoy_change <= -0.5% AND
          repurch_ttm > 0) | 'dilutive' (shares_yoy_change >= +3%, threshold from
          scripts/research/missed_hold_study.py; note: stock_fundamentals.py uses a
          separate multi-year dilution_pct=5.0 threshold) | 'neutral' |
          'unavailable' (shares data missing).
        buyback_yield: repurch_ttm / mcap.
        net_buyback_after_sbc: (repurch_ttm - sbc_ttm) / mcap (null if sbc
          unavailable or repurch_coverage='partial' to prevent period mismatch).
        share_count_reduction_confirmed: shares_yoy_change <= -0.5%.
        debt_funded_buyback_flag: repurch_ttm > 0 AND debt_lt latest > debt_lt prior FY.

      PARTIAL COVERAGE FALLBACK: quarterly repurchases column is sparsely populated
      (~1 quarter in TTM for 97% of names). When quarterly coverage is partial,
      repurch_ttm falls back to fundamentals_panel.repurchases (annual, PIT-safe),
      reflected in repurch_coverage='annual_fallback'. This ensures repurch_ttm
      and sbc_ttm are on the same annual period footing.

      POINT-IN-TIME: quarterly rows require filed date present AND filed <= build date.
      Dedup on (ticker, fiscal_year, fiscal_quarter) retains latest-filed row.
