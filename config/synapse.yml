      filed, gm_change_bp, gm_cur_pct, gm_prior_pct, rev_yoy_pct, peer_n,
      peer_median_change_bp, peer_gate), peer_n, peer_median_change_bp,
      coverage_n_quarters, _display_only, _horizon_role, _version, _schema.
      Fire condition (review-opener per FFB-R7 — magnitude alone does not separate;
      peer gate is the discriminator per FFB-R9): TWO consecutive filed quarters with
      (a) revenue YoY > 0, (b) gm YoY change <= -100bp, (c) same-sector peer median
      gm change > company change + 50bp (company-specific deterioration).
      PIT: quarters visible only from their real SEC filed date.
      Fiscal alignment: Q2 vs Q2 prior year only (never calendar-adjacent).
      Peer coverage: min 15 same-sector names; below threshold → unverifiable.
      NEVER state=broken (LHB-R3). Thresholds are review-openers only (FFB-R7).
      FIREWALL: horizon_role=hold_thesis. MUST NOT feed board ordering, alert triage,
      top-setups gates, or push floor (LH-R1). fdr_family=long_hold (LH-R5).

