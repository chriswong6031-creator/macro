      LT-4 (Long-Hold External Foundation). Per-ticker thesis funnel state snapshot.
      Transparent AND-gate of independently registered flags (LH-R2: no composite,
      no weights, no behavioral surface).

      State enum (frozen v1, exactly 3 values):
        not_eligible: s4_coverage fires OR any of s1/s2/s3 fires.
        watch_for_thesis: survival gates all pass but not yet candidate-eligible.
        thesis_candidate_shadow: survival pass + piotroski_f >= 6 + not dilutive.

      Survival flags:
        s1_dilution: shares_yoy_change >= +3% (threshold from capital_allocation.py
          _DILUTIVE_SHARES_CHANGE_PCT, matched to missed_hold_study.py).
        s2_moat_falsifier: any of the 4 moat sensors firing (engine/moat_falsifiers.py).
        s3_solvency: Altman Z < 1.81 (distress floor; engine/stock_fundamentals._altman).
        s4_coverage: fewer than 2 of {shares_yoy, moat sensors, altman_z} computable.

      Candidate upgrade gate (in addition to survival pass):
        piotroski_f >= 6 (engine/stock_fundamentals._piotroski, existing computation).
        capital_allocation_delta != 'dilutive' ('unavailable' does NOT disqualify).

      Ceiling = thesis_candidate_shadow. No 'active_thesis' state anywhere (W3-locked;
      G1-DEFERRED ruling 2026-07-06).

      Context (NOT gate inputs, printed for transparency):
        expectation_state (engine/expectation_state — ED-7 descriptive pass RBC=0.041
          is TINY; SUE wrong-sign at the trap ruler per EXPECT_DRIFT_RULER_P_RESULTS.md
          — explicitly NOT a gate input).
