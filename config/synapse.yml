      from engine/stock_fundamentals._leverage_ratios() via data/edgar/statements.parquet:
        interest_coverage, net_debt_to_op_income, net_debt_to_ebitda.
      All three are None-safe; Financial-sector names and sparse filers produce None.
      net_debt_to_op_income is an EBITDA proxy (uses operating income as D&A substitute);
      any future UI surface MUST carry a proxy label for this ratio.
      net_debt_to_ebitda requires D&A (DepreciationDepletionAndAmortization) which
      accrues via the collectors/edgar_facts.py weekly drip — mostly None until drip runs.
      Amendment-3 structural descriptors (additive; decision table UNCHANGED):
        decline_herf / decline_geometry (family E, DISPLAY-CANDIDATE) — latest trailing-63-bar
          loss-Herfindahl bound from engine.entry_primitives.decline_concentration_series, plus its
          current-day cross-sectional tercile label flush/mixed/grind. A decline-SHAPE read, NOT an
          escalation. CHIP-blocked until the true eq_band cache lands (RUL-28).
        underwater_bars / underwater_state (family F, ADVERSE-CONTEXT, shadow-only) — latest
          bars-since-trailing-252-peak bound from engine.entry_primitives.time_underwater_series,
          plus its tercile label short/mid/long. Caution context / de-escalation-eligible only, never
          a buy signal; not surfaced on the QA page. Both descriptors accrue on the shadow forward-
          ledger data/shadow/bottom_sensors_geometry_book.jsonl (engine/neuralweb/bottom_sensors_shadow;
          not weight-bearing — mirrors the unregistered engine/shadow_book pattern).

