        insider (positioning.insider, context only).

      Columns: ticker, as_of, state, state_reason, s1_dilution_fired, s1_dilution_value,
        s2_moat_falsifier_fired, s2_sensors_fired, s3_solvency_fired, s3_altman_z,
        s3_altman_approx, s4_coverage_fired, s4_n_computable, piotroski_score,
        piotroski_of, capital_allocation_delta, _display_only, _horizon_role, _version.

      FIREWALL: horizon_role=hold_thesis. MUST NOT feed board ordering, alert triage,
      top-setups gates, or push floor (LH-R1). fdr_family=long_hold (LH-R5).
      No scored_path_surfaces. Display/research tier only.

