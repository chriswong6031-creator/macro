meta:
  schema_version: 1
  description: >
    The signal-bus registry: one entry per cross-engine artifact that flows between
    producers and consumers inside the Macro Dashboard engine. Every registered artifact
    names its single authoritative producer, owner program, freshness SLA, storage
    location, tier on the qual_ladder vocabulary, and the full consumer list derived from
    the W0 census (workflow wf_67ace3c1 + wf_dd79661a red-team, 2026-07-04). This file
    is PASSIVE in W0 — it names what exists; it does not yet enforce read-gating or stamp
    envelopes (those follow in W1 and W2). The integrity gate (scripts/check_synapse_registry.py)
    validates producer existence, field completeness, and enum membership on every CI run.
  tier_vocabulary:
    - display       # rendered, salience-eligible; NO arithmetic on scored surfaces
    - shadow        # computed + claim-registered + graded nightly; never rendered as conviction
    - confirmer     # passed §3 gate (n_dates>=25, Wilson CI > 0 vs matched control, etc.)
    - scored        # composite re-validation + 63d OOS accrual passed
    - infrastructure  # operational rail: bus, index, manifest — not a signal
  article2_surfaces:
    - alert_triage     # engine/alert_triage.py money-path
    - board_ordering   # board rank / standout ordering surfaces
    - top_setups       # discovery/top-setups page gating
    - attention_queue  # missing-tape attention queue
    - push_floor       # push-notification floor (notify.py)
  horizon_role_vocabulary:
    # LH-R1 (Long-Hold Thesis Masterplan W0): every artifact declares its horizon.
    # The CI gate (check_synapse_registry.py) hard-fails any entry without this field.
    # check_synapse_reads.py (PR-D) will enforce the firewall bidirectionally.
    - tactical_entry  # feeds ~days-to-weeks entry/rotation decisions (entry-stack fires,
                      # gates, boards, alert-triage surfaces, oracle rotation)
    - hold_thesis     # feeds 12-36mo ownership evidence — NO artifacts stamped here yet;
                      # first hold_thesis artifacts arrive in W1 after the missed-hold study
    - dual            # feeds BOTH horizons with SEPARATE calibrations (rare; requires
                      # a notes field justifying why one artifact serves both clocks)
    - context         # descriptive/diagnostic, horizon-agnostic (regime, breadth,
                      # neural-web infrastructure, qualitative desks, cycle data, BTC vector,
                      # foresight, ops rails, cortex, governance)

