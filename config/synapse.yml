        s4_coverage: fewer than 2 of {shares_yoy, moat sensors, altman_z} computable.

      Candidate upgrade gate (in addition to survival pass):
        piotroski_f >= 6 (engine/stock_fundamentals._piotroski, existing computation).
        capital_allocation_delta != 'dilutive' ('unavailable' does NOT disqualify).

      Ceiling = thesis_candidate_shadow. No 'active_thesis' state anywhere (W3-locked;
      G1-DEFERRED ruling 2026-07-06).

