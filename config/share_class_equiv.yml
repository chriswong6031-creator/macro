    canonical: CWEN
    comment: "Clearway class A -> class C canonical (class C more liquid)"

  # Rush Enterprises
  - ticker: RUSHA
    canonical: RUSHB
    comment: "Rush Enterprises class A -> class B (class B more liquid in 13F context)"

  # Heico Corporation
  - ticker: HEI.A
    canonical: HEI
    comment: "Heico class A -> common canonical"

  # Brown-Forman
  - ticker: BF.B
    canonical: BF.A
    comment: "Brown-Forman class B (no vote) -> class A canonical; different CUSIP stems"

  # Lennar
  - ticker: LEN.B
    canonical: LEN
    comment: "Lennar class B (no vote) -> class A canonical"

  # Moog
  - ticker: MOG.B
    canonical: MOG.A
    comment: "Moog class B -> class A canonical"

  # Molson Coors
  - ticker: TAP.A
    canonical: TAP
    comment: "Molson Coors class A -> class B canonical (class B more liquid)"

  # Greif
  - ticker: GEF.B
    canonical: GEF
    comment: "Greif class B -> class A canonical"

  # John Wiley
  - ticker: JW.B
    canonical: JW.A
    comment: "John Wiley class B -> class A canonical"

  # Central Garden and Pet
