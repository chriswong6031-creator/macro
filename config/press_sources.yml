# config/press_sources.yml — PRESS-FEEDS curated source register (D05 Addendum 2).
#
# The canonical source register the Media masterplan (rev 4, PRESS-FEEDS wave B1)
# calls for. Ships DARK by default — every lane is gated by the daemon
# kill-switches (MARKETING_FASTLANE_ENABLED + the outbox kill-switch). Pollers
# make ZERO repo/git writes; all cursor / seen / spend / counter state lives in
# data/marketing/press/ (gitignored).
#
# Back-compat: the existing wire RSS lane still reads config/marketing.yml
# `breaking:` (unchanged — breaking_feed.poll_all is its canonical driver). The
# wire_rss section below REFERENCES those six sources so this file is the single
# human-readable register; press_providers does not re-poll them.
#
# Hard laws (D05 Addendum 2 + appendix §2 kills that STAND):
#   - NO first-party scraping. Providers consume ONLY the documented published
#     endpoints below (mirror RSS, mirror JSON archive, twitterapi.io read API).
#     No browser automation, no cookie auth, no HTML scraping, no Nitter.
#   - Deterministic relevance decides what is market-moving; the LLM only
#     summarizes facts present in the source snippet (breaking_summary validator).
#   - Corroboration classes (§3): direct-quote (mirror-verified own post) = single
#     primary source OK; hearsay = >=2 independent sources or attributed phrasing;
#     single-wire uncorroborated political/geopolitical NEVER instant-publishes.

# ─────────────────────────────────────────────────────────────────────────────
# Tier W — licensed / free wire RSS (the spine). Canonical poll config lives in
# config/marketing.yml `breaking:`; listed here for the register of record only.
# ─────────────────────────────────────────────────────────────────────────────
wire_rss:
  # source-of-truth: config/marketing.yml breaking.sources (breaking_feed.poll_all)
  canonical_config: "config/marketing.yml#breaking.sources"
  references:
    - key: fed_press          # Federal Reserve   (official)
    - key: bls_news           # Bureau of Labor Statistics (official)
    - key: bea_news           # Bureau of Economic Analysis (official)
    - key: whitehouse_actions # White House presidential-actions (official)
    - key: cnbc_top           # CNBC              (wire)
    - key: marketwatch_top    # MarketWatch       (wire)

# ─────────────────────────────────────────────────────────────────────────────
# Tier M — Truth Social relay mirrors (published feeds; wire-relay posture).
# ─────────────────────────────────────────────────────────────────────────────
truth_mirrors:
  # Primary Truth-Social detector: fast poll, conditional GET, honest UA.
  - key: trumpstruth
    provider: trumpstruth
    kind: rss
    url: "https://trumpstruth.org/feed"
    source_name: "Truth Social (via trumpstruth.org)"
    tier: mirror
    author: "Donald J. Trump"
    poll_interval_s: 75          # hot loop 60-90 s window
    enabled: true

  # CNN archive: corroboration + nightly backfill ONLY. 19 MB payload →
  # conditional GET mandatory; NEVER the hot loop.
  - key: cnn_truth_backfill
    provider: cnn_truth_backfill
    kind: json
    url: "https://ix.cnn.io/data/truth-social/truth_archive.json"
    source_name: "Truth Social (via CNN archive)"
    tier: mirror
    author: "Donald J. Trump"
    poll_interval_s: 21600       # 6 h — backfill/corroboration cadence, never hot
    enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# Tier X — twitterapi.io read relay (key via env TWITTERAPI_IO_KEY; skips cleanly
# when unset). Per-handle poll tier + corroboration class. source_tier=x_relay.
# ─────────────────────────────────────────────────────────────────────────────
x_follow:
  provider: twitterapiio
  base_url: "https://api.twitterapi.io"
  endpoint: "/twitter/user/last_tweets"
  auth_header: "X-API-Key"
  key_env: "TWITTERAPI_IO_KEY"
  price_per_1k_tweets_usd: 0.15
  min_charge_per_request_usd: 0.00015
  # Exclude any account flagged parody/commentary/fan (PCF). Satire is hard-blocked
  # at ingestion regardless of this flag (see satire_blocklist below).
  exclude_pcf_labeled: true
  poll_tiers:
    fast: 75      # 60-90 s
    mid:  105     # 90-120 s
    slow: 300
  handles:
    # fast (60-90 s)
    - handle: DeItaone        # class: hearsay (Bloomberg-terminal relay)
      tier: fast
      corroboration_class: hearsay
    - handle: FirstSquawk
      tier: fast
      corroboration_class: hearsay
    - handle: financialjuice
      tier: fast
      corroboration_class: hearsay
    - handle: zerohedge
      tier: fast
      corroboration_class: hearsay
    - handle: WHPressPool     # WH pool reports — "Trump told reporters..." surfaces here
      tier: fast
      corroboration_class: hearsay
    # mid (90-120 s)
    - handle: NewsWire_US
      tier: mid
      corroboration_class: hearsay
    - handle: remarks
      tier: mid
      corroboration_class: hearsay
    - handle: Osint613
      tier: mid
      corroboration_class: hearsay
    - handle: BRICSinfo
      tier: mid
      corroboration_class: hearsay
      strict_corroboration: true
    - handle: rawsalerts
      tier: mid
      corroboration_class: hearsay
      strict_corroboration: true
    - handle: StockMKTNewz
      tier: mid
      corroboration_class: hearsay
    - handle: tradfi
      tier: mid
      corroboration_class: hearsay
    - handle: unusual_whales
      tier: mid
      corroboration_class: hearsay
    - handle: WatcherGuru
      tier: mid
      corroboration_class: hearsay
    - handle: WhaleInsider
      tier: mid
      corroboration_class: hearsay
    # slow (300 s)
    - handle: HormuzLetter     # route to brief_candidates, not fast wire
      tier: slow
      corroboration_class: hearsay
      route: brief_candidates
    - handle: CoinDesk
      tier: slow
      corroboration_class: hearsay
    - handle: Cointelegraph
      tier: slow
      corroboration_class: hearsay

# ─────────────────────────────────────────────────────────────────────────────
# Satire / parody hard blocklist — excluded at INGESTION (never scored, never
# posted). Seed: HalfwayPost. Add PCF-labeled accounts here as they surface.
# ─────────────────────────────────────────────────────────────────────────────
satire_blocklist:
  - HalfwayPost

# ─────────────────────────────────────────────────────────────────────────────
# Spend — monthly hard cap for the twitterapi.io lane (USD). At cap the lane
# STOPS and emits a start-of-line ::warning (repo GH-annotation law).
# ─────────────────────────────────────────────────────────────────────────────
spend:
  twitterapiio_monthly_cap_usd: 75.0

# ─────────────────────────────────────────────────────────────────────────────
# Actions press wire (E7) — the GitHub Actions deployment of this lane, run by
# .github/workflows/marketing-press-wire.yml every 5 minutes via
# scripts/marketing_press_wire.py.
#
# WHY IT EXISTS. The VPS daemon emits press items to the GITIGNORED outbox spool
# (outbox._host_items_path), which the Actions publisher — a different checkout —
# has never been able to fold. Press and Trump-wire posts have therefore never
# reached X. The Actions lane emits through the git-TRACKED items.jsonl the
# publisher actually reads.
#
# ONE LANE AT A TIME. Set the repo variable PRESS_WIRE_DAEMON_ACTIVE=true and the
# Actions lane stands down before polling anything, so the daemon can be armed
# later (it reaches ≤90 s latency; Actions' cron floor is 5 minutes) without two
# pollers spending the same cap out of two different state stores.
# ─────────────────────────────────────────────────────────────────────────────
actions_wire:
  # This lane's twitterapi.io sub-cap, carved from the $75 account cap above and
  # clamped to it in code (a typo here can only lower the ceiling).
  #
  # THE THREE SUB-CAPS MUST LEAVE A RESERVE, and nothing in code sums them — each
  # lane clamps only against the $75 account cap, so three lanes each "within
  # budget" can still bill $75 together. They were exactly $75: this wire 55.0,
  # reply_discovery.monthly_usd_cap 15.0, and config/marketing.yml
  # intel.monthly_usd_cap 5.0 — zero reserve, so any lane's minimum-charge
  # rounding, a retry, or a manual backfill overdraws the real account and the
  # first lane to notice is whichever one gets its request refused.
  # 50 + 15 + 5 = 70 leaves a $5 reserve, pinned by
  # tests/test_marketing_press_wire.py::TestSpendCapReserve, so a future cap edit
  # that erases the reserve is red.
  #
  # THE CAP MUST SIT ABOVE THE PLAN, not below it. A cap under the projected spend
  # is not conservative — it just goes dark around day 26 of every month, which is
  # a silent outage rather than a budget. The projection below is ~$46.6/mo, so
  # $50 still leaves ~7% head-room over the plan; the tier intervals, not this
  # number, are the lever if that margin ever needs to grow.
  monthly_usd_cap: 50.0

  # PER-TIER POLL INTERVALS, SECONDS — these OVERRIDE x_follow.poll_tiers when
  # the lane runs in Actions, and only there (the daemon reads x_follow.poll_tiers
  # unchanged). They are intervals rather than "every Nth run" because GitHub's
  # scheduler fires late and drops ticks; the provider's own persisted last_poll
  # clock enforces them, so drift costs seconds instead of a whole cycle.
  #
  # THE BUDGET MATH (scripts/marketing_press_wire.projected_monthly_usd computes
  # it every run and tests/test_marketing_press_wire.py asserts it against the cap,
  # so a config edit that overruns turns the suite red rather than the invoice):
  #
  #   $/request = max($0.00015 min charge, 20-tweet page / 1000 * $0.15) = $0.003
  #     fast   5 handles * 86400/1140  = 379 req/day
  #     mid   10 handles * 86400/6900  = 125 req/day
  #     slow   3 handles * 86400/42600 =   6 req/day
  #     total                          = 510 req/day
  #   510 * $0.003 * 30.44 days        = ~$46.6/mo   (cap $55)
  #
  # WHY FAST IS 19 MINUTES AND NOT 5. Polling all 18 handles on every */5 run is
  # 5,184 requests/day = ~$466/mo — six times the whole estate cap. The sub-5-minute
  # path is carried by the FREE tiers: the wire RSS lane and the trumpstruth mirror
  # poll every run at zero marginal cost, and those are the lanes a Trump post
  # actually breaks on first. twitterapi.io buys corroboration breadth and the
  # handles no RSS feed covers — worth $47/mo, not worth $466.
  #
  # WHERE THE HEAD-ROOM CAME FROM. The mid tier, not the fast one. Mid handles are
  # aggregators and sector accounts; the five fast handles (DeItaone, FirstSquawk,
  # financialjuice, zerohedge, WHPressPool) are the ones a market-moving headline
  # crosses first, so their 20-minute effective cadence is the number to protect.
  poll_tiers:
    fast: 1140      # 19 min  (a run 40 s early still fires it on the 20-min tick)
    mid:  6900      # 115 min (-> a 2 h effective cadence)
    slow: 42600     # 11 h 50 min

  # Billed page size used by the projection above. The endpoint has no page-size
  # parameter; this is the documented default and the number the invoice keys on.
  tweets_per_request: 20

  # Persist the scoring brain's story spine / signal corpus / source authority in
  # the COMMITTED cursors.json? Default false. That file is rewritten whole 288
  # times a day, and those three stores are the only parts of it that grow — at
  # 500 KB that is ~144 MB/day of poorly-deltable git objects. With
  # breaking.scoring.rank_ordering dark (its default) they change no gate: they
  # feed `_components` provenance and an ordering that ships off. Flip this ON in
  # the same edit that arms rank_ordering; the byte ceiling below still guards.
  persist_scoring: false
  cursors_max_bytes: 262144      # 256 KB — over this the scoring stores are dropped

# ─────────────────────────────────────────────────────────────────────────────
# Reply desk discovery (XG-W4) — the SECOND consumer of the twitterapi.io key.
#
# ONE BUCKET, TWO LANES. twitterapi.io is a single account with a single $75/mo
# cap (above). The Trump wire lane owns that bucket; this lane carves a small
# sub-budget out of it and must never starve the wire. The enforcement is
# deliberately asymmetric (engine/marketing/reply_discovery.py):
#   * reply spend increments only the REPLY counter, never the wire's, so the
#     wire's own cap check literally cannot see this lane — it is structurally
#     impossible for reply polling to stop the wire;
#   * reply polling additionally stops when the combined spend it can observe
#     reaches the shared cap. Reply yields to the wire, never the reverse.
#
# Cursors and spend live in HOST state (~/.mastermind/reply_desk/discovery/),
# never in the repo checkout — the M1 is the nightly render host.
#
# This lane needs its own provider class because the wire's provider hardcodes
# includeReplies=false and counts only the "tweets" response key: both are
# exactly wrong for a reply desk, where the replies ARE the product and the
# mentions/thread endpoints return different shapes.
# ─────────────────────────────────────────────────────────────────────────────
reply_discovery:
  enabled: true
  # Sub-budget carved from twitterapiio_monthly_cap_usd. One of the three lanes
  # summed by test_marketing_press_wire.py::TestSpendCapReserve (wire 50 + this 15 + intel 5 =
  # 70, $5 reserve under the $75 account cap) — raising it needs the same test.
  monthly_usd_cap: 15.0
  base_url: "https://api.twitterapi.io"
  auth_header: "X-API-Key"
  key_env: "TWITTERAPI_IO_KEY"   # same read-only key; never mingled with posting creds
  endpoints:
    author_posts: "/twitter/user/last_tweets"
    mentions: "/twitter/user/mentions"
    post_replies: "/twitter/tweet/replies"
  # Which target tiers are worth paying to read replies on. Relationship threads
  # are where conversations start; breakout threads are read top-level only,
  # because a giant thread's replies are clutter we would not enter anyway.
  include_replies_for_tiers: [relationship]
  max_requests_per_tick: 12

# ─────────────────────────────────────────────────────────────────────────────
# Alpaca — Benzinga-powered news via the official REST endpoint (IS-W1 free
# spine). `enabled: true` is harmless without keys: the poller no-ops with one
# preflight notice when either env var is absent, so arming is decided by env
# presence on each host, never by this file alone. The WS slot stays recorded
# for a future streaming adapter; the 75s tick polls REST.
# ─────────────────────────────────────────────────────────────────────────────
alpaca:
  enabled: true
  rest_url: "https://data.alpaca.markets/v1beta1/news"
  ws_url: "wss://stream.data.alpaca.markets/v1beta1/news"
  key_env: "ALPACA_API_KEY_ID"
  secret_env: "ALPACA_API_SECRET_KEY"
  # Politeness + budget: the free news endpoint is generous, but this lane never
  # needs more than one page per tick. min_interval_s floors the poll cadence
  # even if the daemon tick shrinks; limit is the per-request page size.
  min_interval_s: 60
  limit: 50
  # Exclude bodies over this size from body_snippet (headline still ingests).
  snippet_max_chars: 400

# ─────────────────────────────────────────────────────────────────────────────
# Wire lane emission policy — flagship interim lane (B1). Only the top-K highest
# salience wire items/day may emit for the flagship account; counter persisted in
# the daemon's LOCAL state (data/marketing/press/, never the repo).
# ─────────────────────────────────────────────────────────────────────────────
wire:
  # Daily wire emissions PER WIRE DESK (W4d, 2026-08-02). Was 3, and 3 was never
  # measured; 10 is, by replaying 438 real polled items (six breaking.sources RSS
  # feeds + the two free Truth mirrors) through press_lane.run_press_tick in
  # hourly ticks. Full derivation lives with the code default in
  # engine/marketing/press_lane.py::_DEFAULT_FLAGSHIP_TOP_K — the short version:
  #
  #   * the number is bounded ABOVE by flagship's own ramp cap (20/day in
  #     marketing.yml sentinel.ramp.account_overrides), halved so the nightly
  #     ladder and the publish-time lanes still have a desk to post to;
  #   * bounded BELOW by measured supply — the busiest replayed day cleared 6
  #     items above the salience floor off a PARTIAL 43-candidate day, so 3 was
  #     dropping half of them into a `continue` nothing counted;
  #   * NOT a quality gate. `flagship_salience_floor` below, the market-nexus
  #     test, the corroboration gate and breaking.salience_threshold decide WHICH
  #     items go out and none of them moved. On most days SUPPLY binds first
  #     (~45% of the ingest is a mirror duplicate and nearly all the rest scores
  #     under the floor), so this is headroom for the busy day, not a firehose.
  #
  # marketing.yml `breaking.flagship_top_k_per_day` OVERRIDES this key when it is
  # present — the volume decision may sit beside the desk roster it governs.
  flagship_top_k_per_day: 10
  # THE FLOOR WAS EXACTLY THE CEILING OF ONE CLASS, AND THAT IS WHY THIS WIRE
  # ONLY EVER POSTED BEA PRINTS (2026-07-31).
  #
  # It was 70.0. Read that against breaking_relevance's own taxonomy:
  #
  #     macro_print  55 + official 15 = 70   <- clears, EXACTLY
  #     policy       50 + mirror   12 = 62   <- can never clear
  #     geopolitical 40 + official 15 = 55   <- can never clear
  #     company_news 30 + mirror   12 = 42   <- can never clear
  #
  # A floor set at the arithmetic ceiling of a single class silently reduced a
  # six-source news wire to an official-macro-print relay. The evidence matches
  # exactly: across its whole life this lane has booked TWO items, and both were
  # BEA prints (GDP advance estimate, personal income/outlays). Trump, the White
  # House and every company story were excluded by construction, not by editorial
  # judgement — the pollers ran, scored, and were arithmetically incapable of
  # clearing the bar. scripts/marketing_press_wire.floor_diagnostic had been
  # printing the proof on every empty tick ("the highest event-class base is 55
  # and the best press tier bonus is +12").
  #
  # 30.0 is read off the OBSERVED distribution, not the theoretical one. A live
  # tick scores its 13 candidates bimodally: real classified news at 34.8 (CNBC
  # company_news) and 37.2 (a Truth Social policy post), then unclassified `none`
  # noise at 4.8-7.2. 30 sits in the empty middle of that gap: it admits both
  # real items and rejects all eleven noise rows, with headroom before the noise
  # band. Actual scores run well under the class bases (recency/keyword decay),
  # which is why calibrating against the taxonomy alone would have been wrong.
  #
  # VOLUME IS NOT WHAT THIS KNOB PROTECTS — `flagship_top_k_per_day` above is
  # (3 when this note was written, 10 since W4d), and THIS FLOOR IS UNCHANGED by
  # that raise. Lowering the floor cannot flood a desk; it can only change WHICH
  # items compete for the day's slots. That is the whole point: the competition
  # should be between the day's best stories, not between one class and nothing.
  # The same separation runs the other way — raising the per-desk budget changes
  # HOW MANY of the items already above this floor may go out, and never which.
  flagship_salience_floor: 30.0
  # Corroboration window for hearsay-class items: two independent sources must
  # arrive within this window for a hearsay item to clear to instant-publish.
  corroboration_window_s: 1800

  # ── B4a live-wire rail (news.html retention surface) ──────────────────────
  # The rail shows EVERYTHING above this LOWER floor (incl. digest-class items X
  # never posts); X gets only the flagship top-K. Rail payload = last N items.
  rail_salience_floor: 40.0
  rail_max_items: 50
  # Where the wires.v1 rail payload is published (first writable wins). VPS live
  # dir first (served to registered users via the @reg_asset default-deny route);
  # repo-relative dev path is gitignored (data/marketing/press/). NEVER a git write.
  wires_sink_paths:
    - "/var/lib/macro-live/public/live/wires.json"
    - "data/marketing/press/wires.json"
  # Age bound on the rolling window. The item cap alone lets a quiet feed keep
  # serving days-old items as though they were the live wire.
  rail_max_age_h: 48
  # Non-public wire_rank.v1 sidecar for the Mastermind brain: the same window,
  # ranked by ELEMENT ORDER only (the file carries no numbers). Deleting this key
  # disarms the write — the code default is false.
  rank_sidecar_enabled: true

  # ── Real-time Intelligence Desk ──────────────────────────────────────────
  # The wire is the speed layer; this is the durable story layer. It clusters
  # repeated reports across ticks, retains the source receipts, adds honest
  # session-market context, and prepares evidence-bound X review drafts. It
  # advances whenever the fastlane is running, independently of outbound X
  # publishing. All state is host-local / gitignored.
  intelligence:
    salience_floor: 30.0
    max_packets_per_tick: 100
    retention_h: 72
    active_h: 48
    max_stories: 1500
    snapshot_max_items: 80
    db_paths:
      - "/var/lib/macro-live/state/intelligence/intelligence.db"
      - "data/marketing/press/intelligence.db"
    snapshot_paths:
      - "/var/lib/macro-live/public/live/intelligence.json"
      - "data/marketing/press/intelligence.json"
    # ── V2 (INTELLIGENCE_DESK_V2_BY_FABLE.md) ────────────────────────────────
    # Claim-registry aliasing: the deterministic clustering floor when the story
    # spine's optional backends (datasketch / local encoder) are absent. Same
    # entity+event_class claim within ttl_h merges IF the headlines share enough
    # tokens — jaccard_min normally, tight_jaccard_min inside tight_window_min.
    claims:
      ttl_h: 24
      jaccard_min: 0.15
      # Inside tight_window_min the wording bar LOWERS to this; it is never
      # bypassed (a bare OR merged two different same-ticker stories 10min apart).
      tight_jaccard_min: 0.05
      tight_window_min: 45
    # Snapshot-time honesty: pace recomputed from evidence timestamps; a market
    # stamp older than market_stale_min is served as null, never as current.
    market_stale_min: 30
    pace:
      rising_recent_min: 20     # newest evidence within this = candidate Rising
      rising_sources_60m: 2     # …when ≥2 sources landed inside 60m
      cooling_h: 6              # no evidence for this long = Cooling
    timeline_max: 12
    # Desk zh twins ride the SAME cached translator + fail-soft contract as the
    # rail's B4c pass (labeled-EN fallback when DEEPSEEK_API_KEY is absent).
    zh_enabled: true
    zh_per_tick: 10
    # LLM draft/why phrasing (D-wave): the #3937 phrase-or-fallback pattern —
    # engine facts in, model phrases, numeric/call/hedge gates reject, existing
    # deterministic draft remains the fallback. Spend only on confirmed/high-
    # impact stories; dark-safe when the model key is unresolvable.
    llm:
      enabled: true
      model_key: "marketing_copy"
      max_per_tick: 4
      shapes: ["wire", "analysis"]
    # Engine-fact context joins (display-tier, engine-originated only). A stale
    # artifact is SKIPPED, never served as a fresh fact.
    engine_context:
      enabled: true
      max_lines: 3
      fresh_days: 45

  # B4c: give each NEW rail item a Chinese twin via the cached news translator
  # (engine/news_translate.py). The key is the exact text sent, so a headline
  # costs one cheap call for its whole life in the window. The lane writes its
  # cache under the gitignored data/marketing/press/ and suppresses the
  # lib.ai_costs append (nightly is the sole ledger advancer) — see
  # scripts/marketing_fastlane_daemon.py::_zh_cfg.
  #
  # DEFAULT IS OFF IN CODE: deleting this key disarms the spend. It also stays
  # dark on its own when news_translation is disabled, or when the host cannot
  # reach the provider this lane is routed to — which since 2026-07-31 is the
  # ATTACHED CODEX SUBSCRIPTION (Terra), not DEEPSEEK_API_KEY. _zh_cfg overrides
  # the global config.yml provider for this lane alone: the VPS has the codex
  # login and no DeepSeek key, the nightly/render runners are the exact inverse.
  # news_translate.translator_ready() answers per-provider and the daemon logs the
  # real reason once a tick; an item without `zh` renders as English plus a plain
  # "英文原文" marker — never a blank or a faked translation.
  # Override keys if the lane ever needs the metered endpoint back:
  # zh_provider (codex|deepseek), zh_model, zh_effort.
  zh_enabled: true
  # Per-tick budget. The tick has ~75s and its heartbeat only touches afterwards,
  # so the zh pass may never be what makes a healthy daemon look dead. Items past
  # the cap keep English + the marker and roll into the next tick.
  zh_per_tick: 16
  # 45s, raised from 20 on 2026-07-31 with the move to codex: a codex turn is a CLI
  # process spawn PLUS the model call, where the old budget only had to cover an
  # HTTP round trip (deepseek needed ~20s). Sized for Terra at low effort. A
  # timeout still fails soft — the batch returns None and the items ship English
  # with the marker — so a budget that is too small is silently ineffective rather
  # than loud, which is exactly why it is set generously here.
  zh_timeout_s: 45
  # Wire bodies run to the wire_deep budget; the shared 360 default would cut them
  # off mid-sentence.
  zh_max_chars: 700

  # ── B2-COPY wire voice ────────────────────────────────────────────────────
  # Rotating opener pool (deterministic hash + per-account no-repeat), key-phrase
  # law in the LLM prompt, AI-tell rejection (imported from press validators),
  # model tiering (sonnet flagship / haiku volume). Absent => deterministic
  # defaults, so a B1-shaped config is a clean no-op enhancement.
  voice:
    enabled: true
    # LLM tier: sonnet-class above the salience floor, haiku below. Keys resolve
    # via config.yml llm_models. A disarmed/keyless run never reaches an LLM call
    # (breaking.llm env gate holds) and lands on the deterministic fallback.
    llm_tier_salience_floor: 80.0
    llm_tier_flagship: "marketing_copy"   # sonnet-class (config.yml llm_models)
    llm_tier_volume: "press_brief"        # haiku-class  (config.yml llm_models)
    # opener_pools: {register: [openers...]} may override the built-in per-register
    # pools (engine/marketing/wire_voice.py). Omitted => the seed pools ship.

  # ── B2-COPY dual-format law (deterministic picker — NEVER the LLM) ─────────
  format:
    # wire_deep is reserved for high-salience explanatory registers (topics /
    # claims / brief_candidates) with a rich enough source body; else flash.
    deep_salience_floor: 75.0
    deep_source_min_chars: 220
    flash_max_chars: 280
    flash_max_sentences: 2
    deep_min_chars: 400
    deep_max_chars: 700

  # ── B2-COPY tape-stamp engine (threshold-gated; missing/stale/quiet => none) ─
  tape:
    enabled: true
    min_move_pct: 0.4          # |changePct| floor for a stamp to appear
    staleness_max_s: 1800      # quote older than this => NO stamp (never stale)
    # quote_store_paths: VPS live store first, repo fallback (matches the daemon).
    quote_store_paths:
      - "/var/lib/macro-live/public/live/quotes.json"
      - "site/live/quotes.json"

# ─────────────────────────────────────────────────────────────────────────────
# Summarize-with-citation LLM lane — reuses config/marketing.yml breaking.llm
# gating exactly (both cfg enabled AND env MARKETING_LLM_ENABLED). Referenced here
# for the register of record; press_providers does not duplicate the gate.
# ─────────────────────────────────────────────────────────────────────────────
llm:
  canonical_config: "config/marketing.yml#breaking.llm"
