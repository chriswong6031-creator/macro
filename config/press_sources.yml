# config/press_sources.yml — PRESS-FEEDS curated source register (D05 Addendum 2).
#
# The canonical source register the Media masterplan (rev 4, PRESS-FEEDS wave B1)
# calls for. Ships DARK by default — every lane is gated by the daemon
# kill-switches (MARKETING_FASTLANE_ENABLED + the outbox kill-switch). Pollers
# make ZERO repo/git writes; all cursor / seen / spend / counter state lives in
# data/marketing/press/ (gitignored).
#
# Back-compat: the existing wire RSS lane still reads config/marketing.yml
# `breaking:` (unchanged — breaking_feed.poll_all is its canonical driver). The
# wire_rss section below REFERENCES those six sources so this file is the single
# human-readable register; press_providers does not re-poll them.
#
# Hard laws (D05 Addendum 2 + appendix §2 kills that STAND):
#   - NO first-party scraping. Providers consume ONLY the documented published
#     endpoints below (mirror RSS, mirror JSON archive, twitterapi.io read API).
#     No browser automation, no cookie auth, no HTML scraping, no Nitter.
#   - Deterministic relevance decides what is market-moving; the LLM only
#     summarizes facts present in the source snippet (breaking_summary validator).
#   - Corroboration classes (§3): direct-quote (mirror-verified own post) = single
#     primary source OK; hearsay = >=2 independent sources or attributed phrasing;
#     single-wire uncorroborated political/geopolitical NEVER instant-publishes.

# ─────────────────────────────────────────────────────────────────────────────
# Tier W — licensed / free wire RSS (the spine). Canonical poll config lives in
# config/marketing.yml `breaking:`; listed here for the register of record only.
# ─────────────────────────────────────────────────────────────────────────────
wire_rss:
  # source-of-truth: config/marketing.yml breaking.sources (breaking_feed.poll_all)
  canonical_config: "config/marketing.yml#breaking.sources"
  references:
    - key: fed_press          # Federal Reserve   (official)
    - key: bls_news           # Bureau of Labor Statistics (official)
    - key: bea_news           # Bureau of Economic Analysis (official)
    - key: whitehouse_actions # White House presidential-actions (official)
    - key: cnbc_top           # CNBC              (wire)
    - key: marketwatch_top    # MarketWatch       (wire)

# ─────────────────────────────────────────────────────────────────────────────
# Tier M — Truth Social relay mirrors (published feeds; wire-relay posture).
# ─────────────────────────────────────────────────────────────────────────────
truth_mirrors:
  # Primary Truth-Social detector: fast poll, conditional GET, honest UA.
  - key: trumpstruth
    provider: trumpstruth
    kind: rss
    url: "https://trumpstruth.org/feed"
    source_name: "Truth Social (via trumpstruth.org)"
    tier: mirror
    author: "Donald J. Trump"
    poll_interval_s: 75          # hot loop 60-90 s window
    enabled: true

  # CNN archive: corroboration + nightly backfill ONLY. 19 MB payload →
  # conditional GET mandatory; NEVER the hot loop.
  - key: cnn_truth_backfill
    provider: cnn_truth_backfill
    kind: json
    url: "https://ix.cnn.io/data/truth-social/truth_archive.json"
    source_name: "Truth Social (via CNN archive)"
    tier: mirror
    author: "Donald J. Trump"
    poll_interval_s: 21600       # 6 h — backfill/corroboration cadence, never hot
    enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# Tier X — twitterapi.io read relay (key via env TWITTERAPI_IO_KEY; skips cleanly
# when unset). Per-handle poll tier + corroboration class. source_tier=x_relay.
# ─────────────────────────────────────────────────────────────────────────────
x_follow:
  provider: twitterapiio
  base_url: "https://api.twitterapi.io"
  endpoint: "/twitter/user/last_tweets"
  auth_header: "X-API-Key"
  key_env: "TWITTERAPI_IO_KEY"
  price_per_1k_tweets_usd: 0.15
  min_charge_per_request_usd: 0.00015
  # Exclude any account flagged parody/commentary/fan (PCF). Satire is hard-blocked
  # at ingestion regardless of this flag (see satire_blocklist below).
  exclude_pcf_labeled: true
  poll_tiers:
    fast: 75      # 60-90 s
    mid:  105     # 90-120 s
    slow: 300
  handles:
    # fast (60-90 s)
    - handle: DeItaone        # class: hearsay (Bloomberg-terminal relay)
      tier: fast
      corroboration_class: hearsay
    - handle: FirstSquawk
      tier: fast
      corroboration_class: hearsay
    - handle: financialjuice
      tier: fast
      corroboration_class: hearsay
    - handle: zerohedge
      tier: fast
      corroboration_class: hearsay
    - handle: WHPressPool     # WH pool reports — "Trump told reporters..." surfaces here
      tier: fast
      corroboration_class: hearsay
    # mid (90-120 s)
    - handle: NewsWire_US
      tier: mid
      corroboration_class: hearsay
    - handle: remarks
      tier: mid
      corroboration_class: hearsay
    - handle: Osint613
      tier: mid
      corroboration_class: hearsay
    - handle: BRICSinfo
      tier: mid
      corroboration_class: hearsay
      strict_corroboration: true
    - handle: rawsalerts
      tier: mid
      corroboration_class: hearsay
      strict_corroboration: true
    - handle: StockMKTNewz
      tier: mid
      corroboration_class: hearsay
    - handle: tradfi
      tier: mid
      corroboration_class: hearsay
    - handle: unusual_whales
      tier: mid
      corroboration_class: hearsay
    - handle: WatcherGuru
      tier: mid
      corroboration_class: hearsay
    - handle: WhaleInsider
      tier: mid
      corroboration_class: hearsay
    # slow (300 s)
    - handle: HormuzLetter     # route to brief_candidates, not fast wire
      tier: slow
      corroboration_class: hearsay
      route: brief_candidates
    - handle: CoinDesk
      tier: slow
      corroboration_class: hearsay
    - handle: Cointelegraph
      tier: slow
      corroboration_class: hearsay

# ─────────────────────────────────────────────────────────────────────────────
# Satire / parody hard blocklist — excluded at INGESTION (never scored, never
# posted). Seed: HalfwayPost. Add PCF-labeled accounts here as they surface.
# ─────────────────────────────────────────────────────────────────────────────
satire_blocklist:
  - HalfwayPost

# ─────────────────────────────────────────────────────────────────────────────
# Spend — monthly hard cap for the twitterapi.io lane (USD). At cap the lane
# STOPS and emits a start-of-line ::warning (repo GH-annotation law).
# ─────────────────────────────────────────────────────────────────────────────
spend:
  twitterapiio_monthly_cap_usd: 75.0

# ─────────────────────────────────────────────────────────────────────────────
# Reply desk discovery (XG-W4) — the SECOND consumer of the twitterapi.io key.
#
# ONE BUCKET, TWO LANES. twitterapi.io is a single account with a single $75/mo
# cap (above). The Trump wire lane owns that bucket; this lane carves a small
# sub-budget out of it and must never starve the wire. The enforcement is
# deliberately asymmetric (engine/marketing/reply_discovery.py):
#   * reply spend increments only the REPLY counter, never the wire's, so the
#     wire's own cap check literally cannot see this lane — it is structurally
#     impossible for reply polling to stop the wire;
#   * reply polling additionally stops when the combined spend it can observe
#     reaches the shared cap. Reply yields to the wire, never the reverse.
#
# Cursors and spend live in HOST state (~/.mastermind/reply_desk/discovery/),
# never in the repo checkout — the M1 is the nightly render host.
#
# This lane needs its own provider class because the wire's provider hardcodes
# includeReplies=false and counts only the "tweets" response key: both are
# exactly wrong for a reply desk, where the replies ARE the product and the
# mentions/thread endpoints return different shapes.
# ─────────────────────────────────────────────────────────────────────────────
reply_discovery:
  enabled: true
  monthly_usd_cap: 15.0        # sub-budget carved from twitterapiio_monthly_cap_usd
  base_url: "https://api.twitterapi.io"
  auth_header: "X-API-Key"
  key_env: "TWITTERAPI_IO_KEY"   # same read-only key; never mingled with posting creds
  endpoints:
    author_posts: "/twitter/user/last_tweets"
    mentions: "/twitter/user/mentions"
    post_replies: "/twitter/tweet/replies"
  # Which target tiers are worth paying to read replies on. Relationship threads
  # are where conversations start; breakout threads are read top-level only,
  # because a giant thread's replies are clutter we would not enter anyway.
  include_replies_for_tiers: [relationship]
  max_requests_per_tick: 12

# ─────────────────────────────────────────────────────────────────────────────
# Alpaca — WS wire slot. Disabled until a key exists (BUILD GATE — no key yet).
# ─────────────────────────────────────────────────────────────────────────────
alpaca:
  enabled: false
  ws_url: "wss://stream.data.alpaca.markets/v1beta1/news"
  key_env: "ALPACA_API_KEY_ID"
  secret_env: "ALPACA_API_SECRET_KEY"

# ─────────────────────────────────────────────────────────────────────────────
# Wire lane emission policy — flagship interim lane (B1). Only the top-K highest
# salience wire items/day may emit for the flagship account; counter persisted in
# the daemon's LOCAL state (data/marketing/press/, never the repo).
# ─────────────────────────────────────────────────────────────────────────────
wire:
  flagship_top_k_per_day: 3
  flagship_salience_floor: 70.0
  # Corroboration window for hearsay-class items: two independent sources must
  # arrive within this window for a hearsay item to clear to instant-publish.
  corroboration_window_s: 1800

  # ── B4a live-wire rail (news.html retention surface) ──────────────────────
  # The rail shows EVERYTHING above this LOWER floor (incl. digest-class items X
  # never posts); X gets only the flagship top-K. Rail payload = last N items.
  rail_salience_floor: 40.0
  rail_max_items: 50
  # Where the wires.v1 rail payload is published (first writable wins). VPS live
  # dir first (served to registered users via the @reg_asset default-deny route);
  # repo-relative dev path is gitignored (data/marketing/press/). NEVER a git write.
  wires_sink_paths:
    - "/var/lib/macro-live/public/live/wires.json"
    - "data/marketing/press/wires.json"
  # Age bound on the rolling window. The item cap alone lets a quiet feed keep
  # serving days-old items as though they were the live wire.
  rail_max_age_h: 48

  # ── Real-time Intelligence Desk ──────────────────────────────────────────
  # The wire is the speed layer; this is the durable story layer. It clusters
  # repeated reports across ticks, retains the source receipts, adds honest
  # session-market context, and prepares evidence-bound X review drafts. It
  # advances whenever the fastlane is running, independently of outbound X
  # publishing. All state is host-local / gitignored.
  intelligence:
    salience_floor: 30.0
    max_packets_per_tick: 100
    retention_h: 72
    active_h: 48
    max_stories: 1500
    snapshot_max_items: 80
    db_paths:
      - "/var/lib/macro-live/state/intelligence/intelligence.db"
      - "data/marketing/press/intelligence.db"
    snapshot_paths:
      - "/var/lib/macro-live/public/live/intelligence.json"
      - "data/marketing/press/intelligence.json"

  # B4c: give each NEW rail item a Chinese twin via the cached news translator
  # (engine/news_translate.py). The key is the exact text sent, so a headline
  # costs one cheap call for its whole life in the window. The lane writes its
  # cache under the gitignored data/marketing/press/ and suppresses the
  # lib.ai_costs append (nightly is the sole ledger advancer) — see
  # scripts/marketing_fastlane_daemon.py::_zh_cfg.
  #
  # DEFAULT IS OFF IN CODE: deleting this key disarms the spend. It also stays
  # dark on its own when news_translation is disabled or DEEPSEEK_API_KEY is
  # absent on the host, and an item without `zh` renders as English plus a plain
  # "英文原文" marker — never a blank or a faked translation.
  zh_enabled: true
  # Per-tick budget. The tick has ~75s and its heartbeat only touches afterwards,
  # so the zh pass may never be what makes a healthy daemon look dead. Items past
  # the cap keep English + the marker and roll into the next tick.
  zh_per_tick: 16
  zh_timeout_s: 20
  # Wire bodies run to the wire_deep budget; the shared 360 default would cut them
  # off mid-sentence.
  zh_max_chars: 700

  # ── B2-COPY wire voice ────────────────────────────────────────────────────
  # Rotating opener pool (deterministic hash + per-account no-repeat), key-phrase
  # law in the LLM prompt, AI-tell rejection (imported from press validators),
  # model tiering (sonnet flagship / haiku volume). Absent => deterministic
  # defaults, so a B1-shaped config is a clean no-op enhancement.
  voice:
    enabled: true
    # LLM tier: sonnet-class above the salience floor, haiku below. Keys resolve
    # via config.yml llm_models. A disarmed/keyless run never reaches an LLM call
    # (breaking.llm env gate holds) and lands on the deterministic fallback.
    llm_tier_salience_floor: 80.0
    llm_tier_flagship: "marketing_copy"   # sonnet-class (config.yml llm_models)
    llm_tier_volume: "press_brief"        # haiku-class  (config.yml llm_models)
    # opener_pools: {register: [openers...]} may override the built-in per-register
    # pools (engine/marketing/wire_voice.py). Omitted => the seed pools ship.

  # ── B2-COPY dual-format law (deterministic picker — NEVER the LLM) ─────────
  format:
    # wire_deep is reserved for high-salience explanatory registers (topics /
    # claims / brief_candidates) with a rich enough source body; else flash.
    deep_salience_floor: 75.0
    deep_source_min_chars: 220
    flash_max_chars: 280
    flash_max_sentences: 2
    deep_min_chars: 400
    deep_max_chars: 700

  # ── B2-COPY tape-stamp engine (threshold-gated; missing/stale/quiet => none) ─
  tape:
    enabled: true
    min_move_pct: 0.4          # |changePct| floor for a stamp to appear
    staleness_max_s: 1800      # quote older than this => NO stamp (never stale)
    # quote_store_paths: VPS live store first, repo fallback (matches the daemon).
    quote_store_paths:
      - "/var/lib/macro-live/public/live/quotes.json"
      - "site/live/quotes.json"

# ─────────────────────────────────────────────────────────────────────────────
# Summarize-with-citation LLM lane — reuses config/marketing.yml breaking.llm
# gating exactly (both cfg enabled AND env MARKETING_LLM_ENABLED). Referenced here
# for the register of record; press_providers does not duplicate the gate.
# ─────────────────────────────────────────────────────────────────────────────
llm:
  canonical_config: "config/marketing.yml#breaking.llm"
