        RE-MEASURED 2026-08-14 after the rule-4 same-program restriction (same 378 engines):
        212 findings — 21 AUTHORITY_WITHOUT_EVIDENCE, 109 OUTPUT_CLASS_MISSING, 45
        SCORED_PATH_SURFACES_INCOMPLETE, 2 SPECIES_UNBOUND, 0 unresolvable and 0 unchecked
        — plus 35 GRADED_BY_DESIGN_IS_HEURISTIC; authority is unchanged. These are DATED
        MEASUREMENTS, deliberately not pinned by any test: every one of them moves when a
        sibling PR touches config/synapse.yml, and pinning them is what made rounds 1 and 2
        scheduled fleet-wide reds.
      - >-
        `graded_by_design: "yes"` IS A WEAK HEURISTIC IN TWO OF ITS FOUR RULES, AND SAYS
        SO. It means "the ledger waterfall resolved a store-shaped path", and rule 1
        accepts any artifact path matching /ledger/i ANYWHERE IN THE PATH while rule 4 hops
        to a SAME-PROGRAM consumer whose MODULE NAME matches /grade|ledger/i. A name is not
        proof that graded rows are written, so every `yes` reached that way is a GUESS and
        some of those guesses are wrong on live rows. The derived claim is neither dropped
        nor trusted: every engine carries graded_by_design_evidence — `strong` (rule 2, the
        producer statically imports engine.qledger and a desk literal resolves by AST; or
        rule 3, an artifact DECLARES tier shadow/scored/confirmer, which synapse's own
        meta.tier_vocabulary defines as claim-registered and graded), `weak_path_heuristic`
        (rules 1 and 4), or `none`. Every weak `yes` is ENUMERATED as
        GRADED_BY_DESIGN_IS_HEURISTIC on every run — 35 of the 100 `yes` engines measured
        2026-08-14 — rather than described in prose or kept in a hand-maintained list of
        known-wrong rows, which would rot. T7 MUST NOT treat a weak `yes` as gradeability.
        Mirrored in the engine/intelligence_registry.py module docstring.
      - >-
        THE DISCLOSURE SAID "FILENAME" AND WAS MEASURABLY WRONG UNTIL 2026-08-14, and the
        enum value said so too (`weak_filename_heuristic`). `_LEDGER_PATH_RE` is
        unanchored, so a DIRECTORY component satisfies rule 1: 5 of the 35 live rule-1
        matches carry `ledger` only in a directory — data/qledger/claims.jsonl,
        data/qledger/falsifier_evaluations.jsonl, data/board_ledger/ca_board.parquet and
        the two data/us_board_ledger/retro_grades*.parquet — and ALL FIVE are real grading
        stores whose semantics live in the directory name. Tightening the match to the
        basename was therefore measured and REJECTED (it would drop five true positives —
        the shrink direction, where a detector going blind reads exactly like a detector
        getting stricter); the fix was honesty, so the value is now `weak_path_heuristic`
        and every disclosure string says PATH. Do not re-litigate the narrowing without
        re-running that measurement, which is recorded in _cell_ledger_paths' docstring.
      - >-
        LEDGER WATERFALL RULE 4 IS SAME-PROGRAM ONLY SINCE 2026-08-14; the cross-program
        form is deleted, not deprecated. It used to adopt ANY grader-shaped consumer's
        ledger "EVEN CROSS-PROGRAM". Measured that day on the live corpus: 7 engines
        resolved by rule 4 and SIX of the seven hops crossed a program boundary and were
        wrong or unearned — engine/run.py::engine-fix, the nightly orchestrator, was
        "graded by" hk-canada's data/board_ledger/ca_board.parquet, and
        scripts/build_stock_library.py::us-stocks-prebreakout resolved through
        scripts/grade_us_board.py, a producer owning TWO cells with DIFFERENT ledgers, so
        the per-producer hop index made an ARBITRARY pick. The index is now keyed by
        (producer, owner_program) and the hop may only land inside the resolving engine's
        own program. Live effect measured the same day: rule-4 count 7 -> 1 (the surviving
        hop is engine/experiments_registry.py::qualitative-intelligence ->
        engine/qledger.py::qualitative-intelligence, a program grading its own output), the
        other six fall to rule 5 and publish `ledger='none'` /
        `graded_by_design='no — not yet'`, `yes` 106 -> 100, weak evidence 41 -> 35, and
        the content-finding total 222 -> 212. The engine count is unchanged at 378 — this
        deletes unearned SEMANTICS, never a row.
      - >-
        graded_by_design='yes' also requires a STORE-shaped ledger: a Python module, a
        charter config, and an unexpanded template/glob path cannot hold a graded row, and
        an engine/*_ledger.py producer with no store-shaped artifact falls THROUGH the
        waterfall rather than being its own ledger. Directory paths
        (data/metabolism/agenda/) DO count as stores — refusing them would be the
        shrink-direction failure this tightening exists to avoid, since a detector that
        goes blind reads exactly like a detector getting stricter.
      - >-
        Derived authority UNDER-COUNTS on day one because its input is under-populated:
        only 11 of 642 synapse artifacts carry a non-empty scored_path_surfaces, and
        prophet-index is a confirmed false negative (tier=display, no surfaces, yet
        consumed by scripts/build_site.py). The correct claim is "authority is derived and
        auditable", NEVER "all authority-bearing engines are identified".
      - >-
        The scored_path_surfaces completeness detector is low-precision BY CONSTRUCTION:
        scripts/build_site.py is a consumer on 37 artifacts and scripts/build_stock_library.py
        on 14, so consumer-membership in an Article-2 module is far too wide to carry
        authority. It PROPOSES (45 engines flagged) and never promotes — deriving
        user_ranking from it was rejected on that measurement.
      - >-
        output_class is the only field with a real human cost (113 engines require one as
        measured 2026-08-12). It is deliberately left null rather than guessed:
        output_class selects the metric contract, and a wrong metric contract is worse than
        a null one. There is no auto-proposal mode — curating it is T7's work, through the
        four-key overlay, one rationale per row.
      - >-
        ANNOTATION BUDGET: C-1 findings are annotated per engine (each names its concrete
        heal); every other code is aggregated into one annotation with a count; the
        fail-closed COULD NOT LOOK line is a third channel, budgeted at exactly one. One
        annotation per finding would bury the actionable rows. The budget governs only what
        GitHub RENDERS: since 2026-08-14 EVERY finding, C-1 included, is also printed as a
        plain `  [CODE] engine: detail` line, because an annotation-only deliverable is
        invisible to a terminal run, to a grep of the log body, and to anyone reading the
        raw job log rather than the Actions summary.
      - >-
        Resolvability is NOT adequacy. AUTHORITY_EVIDENCE_UNRESOLVABLE proves only that a
        qual_ladder_ref points at something real — a key in config/qual_ladder.yml or a
        FILE that exists inside this repo. It cannot prove that the document pre-registers
        anything; that judgment belongs to T7's backlog drain. What it does close is the
        set of ways the C-1 backlog was drainable to zero without a single real prereg: an
        arbitrary non-empty string, a DIRECTORY (`git show HEAD:research` exits 0 on a
        tree, so the earlier path_exists probe accepted any folder), and an ABSOLUTE PATH
        (`root / "/etc/passwd"` is `/etc/passwd` under pathlib's absolute-operand rule, so
        the worktree half of the probe answered True for any file on the machine).
        MISSING, UNRESOLVABLE and UNCHECKED are three DISJOINT codes because they need
        three different heals; none of the three is ever silent, and none counts as
        evidence.
    owner_program: qualitative-intelligence
    notes: >
      warn was chosen over the sibling precedent epistemics.qledger_metric_validity's
      manual + ci_wiring:[]. VALID_SEVERITIES permits empty ci_wiring only for
      manual/discipline/known_spurious, so `manual` means the audit never runs against the
      real corpus unless a human remembers. `warn` requires real wiring, so the C-1
      backlog is visible as ::warning annotations on every PR and the count is trackable.
      DATED PROMOTION PLAN: promote to `hard` with --strict in the same PR that drives the
      authority>display evidence_ref backlog to zero, owned by T7 of
      research/MASTERMIND_INTELLIGENCE_OS_V1_PLAN.md. An upgrade needs no ruling; a
      downgrade does. The prescribed C-1 heal is to fill qual_ladder_ref in
      config/synapse.yml — it repairs the canonical source rather than papering over the
      gap in a side file. T1 deliberately did NOT invent those citations: a prereg pointer
      that does not exist is worse than a null one.

  - law_id: cycles.stretch_oracle_disclosure
    summary: >
      The two stretch/extension oracles (O1 ladder.alignment.overextended, the
      oscillator-dominant 4-leg brake; O2 entry_signal.status == "extended", a
      relabel of urgency=="caution") legitimately disagree on ~38% of names, so the
      contract is DISCLOSURE, not agreement: every flagged name must carry the leg
      that actually fired (invariants I1-I4 in the checker; contract doc
      docs/site_semantics/stretch_oracles.md), and the divergence counter is
      re-emitted nightly against the store the render just wrote, so a stale
      divergence number can never again be the newest one anybody has.
    source_ref:
      - scripts/check_stretch_oracle_contract.py
      - docs/site_semantics/stretch_oracles.md
      - tests/test_stretch_oracle_contract.py
      - "PR #5574 (feat(cycles): disclose which leg fires the overextension brake)"
    severity: warn
    check_script: scripts/check_stretch_oracle_contract.py
    ci_wiring:
      - workflow: .github/workflows/daily.yml
        job: engine
        lane: hook
      - workflow: .github/workflows/engine-render.yml
        job: engine-render
        lane: hook
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; the invariant battery (I1-I4 plus the confusion-matrix
      shape) lives in tests/test_stretch_oracle_contract.py against synthetic
      stores, run in pr_ci by the legacy picks-boards pytest sweep, and the live
      gate is the warn-only in-process self-check at the end of
      scripts/build_stock_library.py's stockdata render.
    allowlist: null
    ratchet: null
    known_limits:
      - site/stockdata is nightly-render output and is NOT committed, so no pr_ci
        lane can run the checker against a real store (CLI exits 2 "nothing to
        check" in a plain checkout); PR-tier coverage is the synthetic-store pytest
        suite only.
      - The in-process nightly invocation is display-tier and never fatal (the
        guard must never break the render); violations surface as line-start
        ::warning annotations, never exit codes — lane=hook mirrors the
        surface_freshness precedent for builder-embedded gates.
    owner_program: cycles
    notes: >
      Invoked in-process (lazy import, never a workflow run: body) by
      `scripts/build_stock_library.py` after the stockdata render in the daily and
      engine-render lanes. Operator CLI:
      `python3 scripts/check_stretch_oracle_contract.py site/stockdata`.
      Registered 2026-08-14 by the PR-1b fusion session healing the
      house-law-registry census red that #5574 left (checker shipped without an
      entry; every full-suite ci-pack run since was red on this job).
