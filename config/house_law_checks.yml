        internally valid (mid-flight is legal), and a revise/rejected set keeps its
        upheld findings without failing CI — that record IS the artifact. Full
        L1-L6 arms at status approved and under --evaluate.
    owner_program: design-migration-factory
    notes: >
      Founding regression fixture: research/reference_integrity/prophet-board-5514-original/
