      - engine-render wiring is check-only (that lane is network-free); the
        healing lanes are daily.yml (--heal) and the intraday fast-path's
        refresh_regime_if_stale (calendar-aware market reference).
    owner_program: engine-fix-masterplan
    notes: >
      Third leg of the stale-data defense: #1823 fixed the push (--autostash),
      #1830 detects committed-data freezes after the fact (heartbeat), this
      gate prevents the engine lane from persisting fresh-looking canonical
      state off a calendar-stale store — and self-heals the daily lane.

  - law_id: data.ohlc_basis_coherence
    summary: >
      The breadth OHLC caches must share ONE yfinance adjustment basis:
      data/<ns>/_closes_cache, _high_cache and _low_cache are written from the
      same download, and where all three are present the bar must satisfy
      low <= close <= high. yfinance auto_adjust back-adjusts ONLY the window it
      downloads, so a split or large dividend re-bases the fresh 1mo window while
      the cached history keeps the old basis. Both repair paths
      (BreadthAdapter._merge_refreshed and scripts/heal_breadth_split_seams.py)
      run seam_suspects over the CLOSES matrix ALONE and rewrite the extras only
      as a side effect of a closes-flagged ticker — so a basis split confined to
      high/low is invisible to every scanner in the tree (2026-08-06 incident:
      REZI close/high 1.29-1.44 on 773 of 773 bars, 989 bad bars across 37
      tickers, zero alarms). Close-only consumers are unaffected, which is what
      makes it silent; ATR's TR = max(H-L, |H-C_prev|, |L-C_prev|) is dominated
      by the basis gap and blows up for build_pick_lab, calibrate_bottom_radar
      and residual_momentum_phase0.
    source_ref:
      - scripts/check_ohlc_basis_coherence.py
      - collectors/breadth.py
      - scripts/heal_breadth_split_seams.py
      - "2026-08-06 split-basis incident (memory: high-low-panel-can-split-basis-from-the-closes-panel)"
    severity: warn
    check_script: scripts/check_ohlc_basis_coherence.py
    ci_wiring:
      - workflow: .github/workflows/daily.yml
        job: collect
        lane: scheduled
      - workflow: .github/ci/legacy-jobs.yml
        job: ohlc-basis-coherence
        lane: pr_ci
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Two tiers by design. Only a SPLIT is fatal — worst excess >= 10% of the
        bar's own range, or >= 20% of a ticker's overlapping bars with at least 5
        of them. Isolated bad bars (yfinance ex-dividend rounding; 17 such bars
        across the three US panels at 2026-08-06, worst 2.5%) annotate as
        ::warning and never gate. A basis drift that is BOTH under 10% and
        confined to fewer than a fifth of a ticker's bars is reported as noise,
        not caught — the alternative is a guard that reds every night on a
        permanent data-quality floor.
      - Coverage is deliberately NOT asserted. The extras stores are
        forward-accruing (collectors/breadth.py "the store grows forward from
        first collection"), so high/low legitimately carry a fraction of the
        closes history — a median 55 bars against 777 at 2026-08-06. A ticker
        whose high/low are entirely absent is therefore invisible here; that is a
        coverage question, owned by the extras store's own accrual, not a basis
        question.
      - The verdict over live data belongs to the daily lane, not the PR pack.
        The nightly collection pushes straight to main, so no PR gate can see the
        commit that introduces a split; the pack lane tests the guard (synthetic
        frames) plus a reader-level pin over the committed caches, and asserts no
        verdict on them (they advance nightly — asserting one asserts about today).
      - continue-on-error in daily.yml by design (a data finding must never
        discard hours of collected bytes). The teeth are the ::error annotation
        and data/quality/ohlc_basis_coherence.json, committed by "commit market
        data" in the same job.
      - Panel discovery is by filesystem shape (any data/<ns>/ holding all three
        caches), so a namespace that never ships an extras store is silently out
        of scope rather than reported missing. Today that is every non-US breadth
        universe plus russell_breadth.
    owner_program: breadth-collector
    notes: >
      The guard closes a hole exactly the shape of the two repair paths: both
      scan closes and heal extras only in that scan's shadow. Two concrete ways a
      split survives them — _merge_refreshed's extras graft is filtered by
      `t in w.columns` against the FRESH window (a ticker healed in closes but
      absent from that batch's High keeps poisoned extras, with no warning because
      the closes half succeeded), and heal_breadth_split_seams.heal reindexes the
      re-pull onto the EXISTING ex.index, so it can pair a healed closes column
      with extras it never touched.

