        HAPPENED (dual independent critics, rationale quarantine, frozen first
        pass, design-authority verdict packet, approval receipt) and left
        auditable receipts — never that the design is good.
      - >-
        The data-motivated-REMOVE rule (blocked-data-as-removal) is a LEXICAL
        heuristic over the rationale text. Deliberately no allowlist: by RIG §1 a
        removal caused by data insufficiency is definitionally a mis-filed
        BLOCKED_DATA, so a match is enforcement, and a rationale that cannot be
        told apart from a data excuse is not yet a documented product decision.
      - >-
