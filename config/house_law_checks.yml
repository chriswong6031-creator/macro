        same adapter list fills (e.g. china_lhb) are not covered by this check.
      - >-
        The threshold is 3 sessions behind — sized to absorb a long weekend plus
        one public holiday and the lane's own once-a-day gate — so a fresh
        freeze stays silent for its first three sessions by design.
    owner_program: engine-fix-masterplan
    notes: >
