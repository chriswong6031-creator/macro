schema: house_law_checks.v1
updated: "2026-08-16"

# Canonical registry of every house law and its enforcement status.
# Maintained by scripts/check_house_law_registry.py (meta-guard).
# To add a new guard: (1) create scripts/check_<slug>.py, (2) add an entry here,
# (3) wire the new ci.yml / pages.yml step. The meta-guard blocks merges of
# unregistered check_*.py files. Severity downgrades or entry removals require
# an operator/Fable ruling recorded in the PR.

checks:

  # ── UI / rendering guards ──────────────────────────────────────────────────

  - law_id: ui.crypto_shelf_governor
    summary: >
      The Bitcoin Vector and Crypto Cockpit Tier-1 spines are closed sets.
      Once a surface carries its first data-shelf marker, vector must expose
      exactly S1-S6 plus one data-verdict marker and crypto must expose exactly
      H1-H8. W0 deliberately leaves legacy templates unarmed; W1 and W2 arm
      their respective surface by shipping the complete marker set.
    source_ref:
      - scripts/check_crypto_shelves.py
      - mockups/refs/crypto_cockpit/README.md
    severity: hard
    check_script: scripts/check_crypto_shelves.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: crypto-shelves
        lane: pr_ci
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Source-level marker counting cannot prove that CSS or client code leaves every shelf visible.
      - Content nested inside the final details shelf is intentionally outside the Tier-1 count.
    owner_program: crypto-cockpit-masterplan
    notes: >
      The unmarked legacy templates pass with a notice during W0. Partial migration
      is fail-closed: the first marker arms the exact-set and one-verdict checks.

  - law_id: ui.hub_a11y
    summary: >
      The landing hub (and any globe-deck page) must keep its accessibility
      contract: no focusable elements inside aria-hidden subtrees, the <head>
      boot sets the document language, the light-theme pill contrast override
      is present, viewport-fit=cover + safe-area insets ship, and theme.js
      syncs documentElement.lang. Locks in the 2026-07-10 hub a11y fixes
      (PR #2096/#2104 review findings).
    source_ref:
      - scripts/check_hub_a11y.py
      - research/hub_ux_program.md
      - "PR #2195"
    severity: hard
    owner_program: hub-ux-program
    check_script: scripts/check_hub_a11y.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: hub-a11y
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      Pure-stdlib static checker; functional coverage provided by
      tests/test_check_hub_a11y.py (34 cases incl. violating fixtures).

  - law_id: ui.inline_js_parses
    summary: >
      Every inline <script> block AND quoted on*= handler attribute in committed
      site HTML must be syntactically valid JavaScript (handlers node-checked as
      function bodies, mirroring browser handler compilation). Smart-quote
      contamination (U+2018/U+2019/U+201C/U+201D as JS delimiters — in <script>
      code position or anywhere in a raw on*= value) is a hard error, including
      in templates/*.j2 (Jinja-stripped). A script syntax error blanks the page
      silently (IIFE aborts); a handler error throws on every click.
    source_ref:
      - scripts/check_inline_js.py
      - "PRs #152 #155 #2321 #2409"
    severity: hard
    check_script: scripts/check_inline_js.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: inline-js
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
      - workflow: .github/workflows/render.yml
        job: render
        lane: render
      - workflow: .github/workflows/engine-render.yml
        job: engine-render
        lane: render
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Scans committed site/; does not cover dynamically generated fragments
        injected by JavaScript at runtime.
      - .j2 templates get the smart-quote scan only — node cannot parse Jinja,
        so plain-JS syntax errors in a .j2 still surface at the next render.
      - Handlers in unquoted attribute syntax (onclick=f()) are not extracted
        (none in the tree; quoted is the house style).
      - Curly quotes INSIDE JS string literals are legal (bilingual display
        copy); only code-position/raw-attribute hits are contamination.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.site_asset_refs_resolve
    summary: >
      Every template-decided href/src in committed site HTML must resolve to a
      file in the tree. A page that links a missing asset or page is a silent
      404 — the HTML is well-formed and the render succeeds, so the break shows
      up only in production (#3988 and #4042 pruned a stylesheet a sibling page
      still linked; templates/ticker.html.j2 emitted the PLURAL ../baskets/
      directory for pages shipping under site/basket/, dead on 605 pages and 909
      links since the directory was named). Links to stocks/<TICKER>.html warn
      instead of failing: which ticker pages exist is decided nightly by data, so
      hard-gating peer/movers/crypto naming would wedge the render on ordinary
      universe churn.
    source_ref:
      - scripts/check_site_asset_refs.py
      - "PRs #3988 #4042 #4056"
    severity: hard
    check_script: scripts/check_site_asset_refs.py
    ci_wiring:
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
      - workflow: .github/workflows/render.yml
        job: render
        lane: render
      - workflow: .github/workflows/engine-render.yml
        job: engine-render
        lane: render
      - workflow: .github/workflows/closing-bell.yml
        job: closingbell
        lane: scheduled
      - workflow: .github/workflows/earlyclose.yml
        job: earlyclose
        lane: scheduled
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Proves file EXISTENCE, not markup validity. Values carrying ${, {{, <, }
        or whitespace are template/JS fragments rather than URLs and are skipped,
        so a genuinely broken href built by JS at runtime is invisible here.
      - Scans committed site/ only; a link a page builds client-side from a JSON
        payload is not covered.
      - /api/* and /ws/* are served by the FastAPI app, not the file tree, so
        they are exempt by prefix rather than checked.
    owner_program: engine-fix-masterplan
    notes: >
      _KNOWN_GAPS is the escape hatch and is currently EMPTY — the six gaps the
      guard shipped with each got their own emitter fix, and
      tests/test_check_site_asset_refs.py ratchets the empty state so a re-pin has
      to be argued in review rather than riding in with a fresh 404.

  - law_id: ui.government_revenue_projection_integrity
    summary: >
      The public Government Revenue surface must be one governed projection of
      committed canonical evidence: canonical and public JSON twins are
      byte-identical, schemas and the content-derived workspace bundle are valid,
      the compact HTML shell is semantically equal to the canonical display
      payload, required workbench markers remain present, and first-paint HTML
      stays inside its raw-byte budget. This prevents a long-running generic
      renderer from rebasing an older full payload over newer procurement truth.
    source_ref:
      - scripts/check_government_revenue_projection.py
      - tests/test_check_government_revenue_projection.py
      - "PR #4223"
    severity: hard
    check_script: scripts/check_government_revenue_projection.py
    ci_wiring:
      - workflow: .github/workflows/render.yml
        job: render
        lane: render
      - workflow: .github/workflows/engine-render.yml
        job: engine-render
        lane: render
    selftest: false
    selftest_exempt_reason: >
      Pure read-only projection checker with focused tamper fixtures covering
      stale twins, malformed matching schemas, oversized or missing shells,
      bundle mismatch, semantic company-shell drift, workflow commit/push
      placement, and metadata-replay invalidation.
    allowlist: null
    ratchet: null
    known_limits:
      - Proves committed serialization and first-paint integrity, not browser
        interactivity after hydration or authorization middleware behavior.
      - Exact issuer attribution and award-event truth are governed separately;
        this fence prevents projection drift but does not create source evidence.
    owner_program: government-revenue-foresight
    notes: >
      Both render lanes repeat the checker after their final heals and immediately
      before each commit or push. The render metadata shortcut is disabled when
      canonical procurement data or any projection-writing helper changed since
      the render parent.

  - law_id: ui.site_js_parses
    summary: >
      Every standalone site/*.js bundle (loaded via <script src=...>) must parse
      without syntax errors. Smart-quote delimiters once blanked markets.html for
      ~2 days (PR #1004 → #1353).
    source_ref:
      - scripts/check_site_js.py
      - "PR #1353"
    severity: hard
    check_script: scripts/check_site_js.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: inline-js
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: false
    selftest_exempt_reason: >
      Thin node --check wrapper; covered by the same CI job as ui.inline_js_parses.
    allowlist: null
    ratchet: null
    known_limits:
      - Skips vendor/CDN bundles that are not committed to site/.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.admin_js_no_undef
    summary: >
      Every bare identifier in admin/static/*.js must resolve to something in
      scope. app.js is a flat top-level browser script, so a `let` declared in
      one function and read from another parses clean, reviews clean, and throws
      a ReferenceError only when the code path runs. PR #3693 shipped exactly
      that ("rejBox is not defined") and the admin Outbox panel rendered BLANK in
      production for ~2 days until #3871 module-scoped it as OBX_REJ. node
      --check cannot see it — an undefined identifier is valid syntax — so this
      runs eslint with a single rule, no-undef.
    source_ref:
      - scripts/check_admin_js.py
      - "PRs #3693 #3871"
    severity: hard
    check_script: scripts/check_admin_js.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: admin-js-no-undef
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      Thin eslint wrapper with no logic of its own to verify; the detection
      guarantee is covered by tests/test_admin_js_no_undef.py, which plants the
      #3693 defect shape in a temp file and asserts the guard flags it.
    allowlist: null
    ratchet: null
    known_limits:
      - Only the no-undef rule runs. Typos that resolve to a real global
        (e.g. `name`, `status`, `length` on window) are legal references and
        stay invisible.
      - Assumes admin/static/index.html keeps injecting no extra globals; a
        future vendor <script> would need its names added to the eslint env.
      - Needs node + npx on the runner. The pytest lane fails RED rather than
        skipping when the tooling is missing under CI, so an unrunnable guard
        can never read green.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.nav_gap
    summary: >
      Every page's shared nav menu must maintain a top gap (body top padding).
      A page that zeroes body padding jams the menu against the viewport top.
    source_ref:
      - scripts/check_nav_gap.py
      - "PR #471"
    severity: hard
    check_script: scripts/check_nav_gap.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: nav-gap
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: false
    selftest_exempt_reason: >
      Covered by tests/test_check_nav_gap.py.
    allowlist: null
    ratchet: null
    known_limits:
      - Scans committed site/ HTML; does not cover pages generated only at runtime.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.nav_mega
    summary: >
      Every page that renders the shared nav must carry the Research mega-menu.
      An out-of-loop or hand-static page can freeze the nav without the mega-menu.
    source_ref:
      - scripts/check_nav_mega.py
    severity: hard
    check_script: scripts/check_nav_mega.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: nav-mega
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: false
    selftest_exempt_reason: >
      No dedicated selftest; the check is deterministic over committed site HTML.
    allowlist: null
    ratchet: null
    known_limits:
      - Only catches pages already committed to site/; new pages built outside the
        render loop are not caught until they land in site/.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.title_i18n
    summary: >
      Translated (CJK / t() / zh-interpolated) text must never appear inside HTML
      title= attributes, and t()/td() dual-span markup must never appear inside a
      <title> ELEMENT (RCDATA — markup renders as literal browser-tab text, #2705).
      The dual-span l-en/l-zh mechanism cannot operate in either place. Plain CJK
      inside a <title> element is allowed — the element rule is markup-in-RCDATA,
      not language. Law source: CLAUDE.md ("no translated text in title= attributes").
    source_ref:
      - scripts/check_title_i18n.py
      - CLAUDE.md
    severity: hard
    check_script: scripts/check_title_i18n.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: title-i18n
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Template <title> element rule is line-scoped (dodges committee.html.j2's
        JS-built SVG title strings), so a bare <title> wrapped across lines with the
        t()/td() call on its own line is not caught; {% block title %} bodies ARE
        region-scanned.
      - Rendered-site rule span-checks the page <title> (first title element) only;
        inline-SVG <title> tooltips deeper in the page are not span-checked.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.zh_filing_term
    summary: >
      申报 must never appear in user-facing Chinese copy. A native reader hears a
      TAX or CUSTOMS declaration (申报纳税, 海关申报) — a self-report filed under
      legal compulsion — where the platform means a market DISCLOSURE: an SEC
      10-K, a 13F, a congressional STOCK Act report is a 披露. Scans templates/
      line by line plus the string literals of engine/ and scripts/ builders, so
      a wrong label is caught at its source rather than a nightly render later.
      Swept by hand twice before the gate existed (PR #4830 Filing Forensics,
      PR #4855 site-wide).
    source_ref:
      - scripts/check_zh_filing_term.py
      - "PR #4855"
      - "PR #4830"
    severity: hard
    check_script: scripts/check_zh_filing_term.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: zh-filing-term
        lane: pr_ci
    selftest: true
    allowlist: config/zh_filing_term_allowlist.json
    ratchet:
      date: "2026-09-07"
      action: >-
        Drop the three `pending` entries in config/zh_filing_term_allowlist.json
        (templates/index.html behind PR #4765; templates/fundamental_forensics.js
        and .html.j2 behind PR #4830) once those PRs land. The guard prints a
        ::notice the moment a pending file's count falls below its frozen budget,
        so the cleanup announces itself; this clock catches the case where the
        PRs are abandoned and the exemptions quietly become permanent.
    known_limits:
      - Python COMMENTS and DOCSTRINGS are skipped by construction — developer
        documentation is never rendered, and without the skip, writing the law
        down ("use 披露, never 申报") would break the law wherever it is recorded.
      - Rendered site/ is NOT scanned. A hit there always originates in templates/
        or a builder, both of which are; scanning the render output would red main
        on a stale artifact no PR author can fix by hand.
      - data/ is NOT scanned. Exchange announcements collected upstream use 申报
        as an order-entry term of art; the platform does not author that text.
      - The `pending` ratchet is per-FILE, not per-phrase, so while an in-flight
        PR owns a file the guard only caps its count — it cannot tell a swapped
        occurrence from an original one.
    owner_program: engine-fix-masterplan
    notes: >
      Allowlist entries are phrase-scoped AND file-scoped: an occurrence is exempt
      only inside a licensed phrase's span in a licensed file. The two live
      exemptions are the genuine other senses — 申报失业金 (filing for unemployment
      benefits, engine/release_quirks.py) and 买入申报 (SSE/HKEX order-entry term in
      the hk-connect scraper's title filter). Narrowness is pinned by --selftest and
      by tests/test_zh_filing_term.py::test_allowlist_is_file_scoped.

  - law_id: ui.template_site_sync
    summary: >
      Every plain-copy page asset (a non-.j2 file directly under templates/ that
      also ships as site/<name>) must byte-match its template at every commit.
      2026-07-07 incident: the scope=all engine-render run (110 min, checkout
      9208ef4920) pushed commit 2ae709f9f0 whose site/sector_cycles.js was
      byte-identical to the CHECKOUT-TIME template blob — the push step's
      `git pull --rebase -X theirs` resolved the conflict against #1793's
      de-escalation (merged mid-render) in favor of the stale copy, resurrecting
      "validated" wording and reddening validated-claims on main (fixed in #1799).
      Render lanes self-heal via --fix post-rebase; PR CI + the publish gate keep
      one-sided template/site edits from arming the divergence window.
    source_ref:
      - scripts/check_template_site_sync.py
      - "2026-07-07 incident (commits 2ae709f9f0 → bc81006240 / #1799)"
    severity: hard
    check_script: scripts/check_template_site_sync.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: template-site-sync
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
      - workflow: .github/workflows/render.yml
        job: render
        lane: render
      - workflow: .github/workflows/engine-render.yml
        job: engine-render
        lane: render
      - workflow: .github/workflows/daily.yml
        job: engine
        lane: scheduled
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Direct children of templates/ only; .j2 render inputs and the
        templates/fonts/ binary copytree are out of scope.
      - Pairs whose site copy does not exist yet are skipped (new asset not
        yet shipped).
      - theme.js is compared against its baked form (Supabase config injected
        by lib.site_assets); in stdlib-only contexts (pages.yml publish) this
        degrades to a token-split prefix/suffix compare.
    owner_program: engine-fix-masterplan
    notes: >
      In the three render lanes the wiring is `--fix` inside the push retry
      loop (post-rebase, pre-push) — a self-heal, not a gate: the lane re-copies
      every pair from post-rebase templates/ and folds the delta into a
      follow-up "render-sync" commit.

  - law_id: ui.interfonts_theme_sync
    summary: >
      The Inter @font-face blocks in templates/_interfonts.html.j2 (the
      self-hosted-font partial included in the <head> of the 16 standalone
      templates that do not link theme.css, PR #2119) must be byte-identical,
      in order, to the @font-face lines at the top of templates/theme.css —
      and exactly six of them must exist. The partial is a manual copy whose
      comment says "keep the two in sync"; without this gate an edit to
      theme.css's @font-face rules (a new weight, a renamed font file) drifts
      silently past the partial and the standalone pages lose the self-hosted
      font again — the exact regression #2119 fixed.
    source_ref:
      - scripts/check_interfonts_sync.py
      - templates/_interfonts.html.j2
      - "PR #2119"
    severity: hard
    check_script: scripts/check_interfonts_sync.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: template-site-sync
        lane: pr_ci
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Line-prefix match only — @font-face rules must stay one-per-line at
        column 0 in both files; the exact-count assertion (EXPECTED_COUNT=6
        in the script) catches a reformat that breaks this shape in both
        files at once, where list equality would pass vacuously.
      - Does not verify that the standalone templates actually include the
        partial, nor that site/fonts/ ships the referenced .woff2 files.
    owner_program: engine-fix-masterplan
    notes: >
      Wired as extra steps inside the existing template-site-sync pr_ci job
      (ci.yml already triggers on templates/**). Render lanes never write
      templates/, so a hand-edited PR is the only drift vector — pr_ci is the
      complete enforcement point; no render/publish wiring needed.

  - law_id: ui.font_ui_defined
    summary: >
      Every templates/*.html.j2 whose body-level CSS sets the page font via
      var(--font-ui) (font-family: or the font: shorthand in a body{} rule)
      must either link theme.css (a <link rel="stylesheet"> whose href
      attribute points at theme.css — the href VALUE, never the bare string,
      because CSS comments mention theme.css and defeat naive greps) or define
      --font-ui: locally, and should also include _interfonts.html.j2 so the
      self-hosted Inter actually loads (warning if missing). An undefined
      custom property makes the font-family declaration
      invalid-at-computed-value -> unset, so the ENTIRE page renders in the
      browser default serif (Times) — the #2195 sweep broke 6 standalone page
      families this way, fixed in #2647 (local :root definition +
      _interfonts include, commodities.html.j2 precedent). Partials
      (_*.html.j2) referencing var(--font-ui) are allowed (the token resolves
      at host-page level) and emit a warning-level note only.
    source_ref:
      - scripts/check_font_ui_defined.py
      - "PR #2647"
      - "PR #2195"
    severity: hard
    check_script: scripts/check_font_ui_defined.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: font-ui-defined
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      Pure-stdlib static checker; functional coverage provided by
      tests/test_check_font_ui_defined.py (44 cases incl. the real pre-#2647
      broken shapes, minified/uppercase CSS, Jinja-in-style-block, and the
      naive-grep theme.css comment trap).
    allowlist: null
    ratchet: null
    known_limits:
      - Textual flat CSS scan (selector{block} realignment; Jinja tags are
        pre-stripped so an interpolation inside a style block cannot void the
        scan) — a body font rule contributed to a host page by an included
        partial is attributed to the partial (warning) rather than the host,
        and Jinja-conditional branches are treated as always-active.
      - Presence-based, not cascade-resolved — a theme.css link with
        media="print" or disabled satisfies the check even though the sheet
        never applies on screen, and a --font-ui definition anywhere in the
        page counts regardless of selector reachability.
      - Checks templates/ only, not rendered site/ copies — render lanes
        regenerate pages from these templates, so the template is the sole
        drift vector.
      - Does not verify that _interfonts.html.j2's referenced .woff2 files
        ship in site/fonts/ (ui.interfonts_theme_sync guards the partial's
        @font-face contents).
    owner_program: engine-fix-masterplan
    notes: >
      var(--font-ui, fallback) usages with an explicit fallback are still
      held to the same rule — the page would silently lose Inter even though
      it would not fall all the way back to Times.

  - law_id: ui.ms_board_coherence
    summary: >
      Every rendered Market State board (site/macro.html + the CN/HK/CA
      dashboards) must be single-snapshot coherent — verdict word, 0-100 score,
      meter tick, thesis, override notes and flip line must all be derivable
      from ONE engine/market_state.py snapshot ("Risk Radar forces Risk-off."
      note => score <= 41 and verdict Risk-off; "Capped at Mixed" => score <= 59,
      never Risk-on; verdict word <=> score band; thesis/flip shape <=> verdict).
      2026-07-07 incident: render commit 5bf116a3b3 raced the 07:10
      engine-render (7a1c30ced4); the push step's `git pull --rebase -X theirs`
      resolved conflict regions toward the replayed stale render, stitching
      upstream's score 56/"Mixed" beside the stale "Risk Radar forces Risk-off."
      note — a hybrid ui.template_site_sync cannot catch (it guards plain-copy
      assets, not rendered pages).
    source_ref:
      - scripts/check_ms_board_coherence.py
      - engine/market_state.py
      - "2026-07-07 incident (commit 5bf116a3b3 = hybrid of 7a1c30ced4 + d944f0d713)"
    severity: hard
    check_script: scripts/check_ms_board_coherence.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: ms-board-coherence
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
      - workflow: .github/workflows/render.yml
        job: render
        lane: render
      - workflow: .github/workflows/engine-render.yml
        job: engine-render
        lane: render
      - workflow: .github/workflows/daily.yml
        job: engine
        lane: scheduled
      - workflow: .github/workflows/asia-close.yml
        job: asia
        lane: scheduled
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Parses the EN (l-en) spans only — EN/ZH share each <p> source line, so a
        line-granular rebase stitch cannot split the pair.
      - Factor-row tones are not checked against the verdict (a legitimately
        mixed board carries mixed tones).
