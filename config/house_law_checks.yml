        job: engine
        lane: hook
      - workflow: .github/workflows/engine-render.yml
        job: engine-render
        lane: hook
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - >-
        Invoked from inside scripts/build_baskets.py main() (the build_allocation
        hook pattern — no dedicated workflow step; PAT lacks workflow scope),
        so wiring is lane:hook via the workflows that run build_baskets.
      - >-
        Warn-only by design (exit 0 always) — a stale surface must not block the
