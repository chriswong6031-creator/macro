      surface is born compliant, and the backlog is retired one packet at a time
      instead of in one heroic red-build weekend. Rules 5-8 (new `*-card`
      classes, banned Tier-1 vocabulary, inline `<style>` byte size, emoji
      codepoints) are heuristics or measurements and stay warn-tier for as long
      as this script exists.
