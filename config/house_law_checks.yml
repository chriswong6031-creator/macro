  - law_id: ci.vintage_pin_fence
    summary: >
      Tests must not equality-pin a live nightly store (govrev latest/candidates,
      options episodes.jsonl, prophet plans, spine predictions.parquet, the
      Release Radar tree under data/release_forecast including cpi_truth,
      data/fred_vintage/release_targets, vector and commodity alert jsonl,
      alerts_log.parquet, tripwire latch state). A hand-typed ``== N`` / ``<= N``
      against a store the nightly advances reddens main and then, through
      merge-on-green, every armed PR. Legal: a watermarked prefix slice, a
      census derived from a committed receipt, a named disclosure set, or the
      #5547 cold-test pattern (bind config.data_dir to empty tmp, or pass
      explicit root=). Shrink-only baseline: fingerprints leave when the pin
      is gone; do not add a row to ship a new pin.
    source_ref:
      - scripts/check_vintage_pin_fence.py
      - tests/test_vintage_pin_fence.py
      - ".github/ci/legacy-jobs.yml"
    severity: hard
    check_script: scripts/check_vintage_pin_fence.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: vintage-pin-fence
        lane: pr_ci
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - The live scan is a targeted ratchet over tests that read the named
        stores; it is not a general AST linter of every ``== N`` in the tree.
      - A store must be added to LIVE_STORES in the script before a new
        nightly-advanced path is covered.
      - Default-root readers are a closed set (convergence_tier, measured_ic).
        A helper that wraps those calls is a known miss unless the test body
        also names the store or calls the reader directly.
      - Bare config.data_dir() joins and pd.read_parquet loaders taint only
        when the suffix matches a named LIVE_STORES path; an unnamed sibling
        under data/ is invisible until it is added to LIVE_STORES.
    owner_program: pipeline-reliability
    notes: >
      Added with the 2026-08-13 CI traffic-jam fence. The three detonations
      that motivated it (govrev assert 23==8, options 384→1206, prophet
      open-keys 10→11) were healed by #5524; leftover equality pins stay on
      the shrink-only baseline and warn, they never red. Expanded 2026-08-13
      after #5515 missed spine parquet (#5547) and Release Radar
      inflation-truth (unrun-release-forecast) plus sibling alert/tripwire
      stores. Directory prefixes now cover data/release_forecast/** and
      data/fred_vintage/release_targets/**; parquet loaders of a data_dir
      path taint the same way a Path(__file__) chain does. The #5547 cold
      data_dir bind is a legal pattern, not a new check.

