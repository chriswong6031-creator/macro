      last SPY daily close against lib/nyse_calendar's expected session — an
      exchange-calendar reference with zero data dependencies, so it still fires
      when the WHOLE nightly collection push dies and every committed store
      agrees on the stale date (2026-07-07 incident: run 28845154707's collect
      push died 5x pre-#1823; the engine persisted a faithful-but-stale
      RISK_OFF the live feed carried all session).
    source_ref:
      - scripts/check_price_store_freshness.py
      - lib/nyse_calendar.py
      - "2026-07-07 incident (commits b1cd43c98f / 38dc031b11; PRs #1823 #1830)"
    severity: warn
    check_script: scripts/check_price_store_freshness.py
    ci_wiring:
      - workflow: .github/workflows/daily.yml
        job: engine
        lane: scheduled
      - workflow: .github/workflows/engine-render.yml
        job: engine-render
        lane: render
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Unscheduled one-off closures (mourning days, disasters) must be appended
        to lib/nyse_calendar.ONE_OFF_CLOSURES when announced; a missing entry
        costs a false red step + honest stale stamp — and the intraday
        fast-path's refresh_regime_if_stale re-pulls yahoo (keyless, ~16s) and
        logs store-behind-market on every ~30-min tick until the date is
        listed — never a silent wrong fresh.
      - continue-on-error by design — the engine job's if:always() philosophy
        (a scraper failure must still produce a dashboard from cached data);
        the teeth are the --heal yahoo re-pull in the daily lane, the
        freshness.stale stamp engine.market_state.persist writes into the
        canonical snapshot, and the no-regress refusal to clobber a fresher one.
      - engine-render wiring is check-only (that lane is network-free); the
        healing lanes are daily.yml (--heal) and the intraday fast-path's
        refresh_regime_if_stale (calendar-aware market reference).
    owner_program: engine-fix-masterplan
    notes: >
      Third leg of the stale-data defense: #1823 fixed the push (--autostash),
      #1830 detects committed-data freezes after the fact (heartbeat), this
      gate prevents the engine lane from persisting fresh-looking canonical
      state off a calendar-stale store — and self-heals the daily lane.

  - law_id: ops.surface_freshness
    summary: >
      First-class display surfaces (allocation, baskets, oracle_state,
      sector_pulse) must not silently serve stale as_of dates. The sentinel
      compares each artifact's as_of stamp against lib/nyse_calendar's expected
      session and prints a ::warning:: annotation per stale surface
      (2026-07-06→09 incident: data/allocation froze for 3 sessions inside an
      exit-0-always sub-build while the allocation page kept rendering the old
      leader; FTR masterplan FT-R8).
    source_ref:
      - scripts/check_surface_freshness.py
      - lib/nyse_calendar.py
      - research/FAST_TURN_TWO_SPEED_TAPE_MASTERPLAN_BY_FABLE.md
