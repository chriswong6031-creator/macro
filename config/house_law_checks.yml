  - law_id: ops.membership_snapshot_cadence
    summary: >
      The basket-membership point-in-time planes (同花顺 concept baskets, US
      thematic baskets) must not be able to go cold without anyone being told.
      Both snapshot writers are CONTENT-deduped — a dated side-car is written
      only when membership differs from the newest one stored — which is right
      (membership moves on the vendor's schedule, not the trading calendar) and
      means a writer that is deduping and a writer that has been UNWIRED leave
      the identical trace on disk: nothing. That is not hypothetical. The THS
      PIT store held exactly two snapshots, 2026-06-30 and 2026-07-08, while
      `scripts/build_baskets_china_ths.py --snapshot` ran green ~35 nights in a
      row: the step was healthy, its INPUT was frozen, because the scraper
      (collectors/china_ths_concepts.py) and the seeder
      (scripts/seed_china_ths_baskets.py) appeared in NO workflow at all and the
      2026-07-08 file was a hand-run bundled with a feature commit. The tripwire
      therefore grades three independent axes: cadence (the writer's own
      `_cadence.json` liveness stamp, rewritten on every run INCLUDING the dedup
      skip), source (a THS scrape receipt with complete:true inside the weekly
      budget — the axis that sees a live writer on a frozen input), and
      coherence (the PIT parquet's newest snapshot_date must not lag the newest
      dated side-car, catching a backfill that stopped running).
    source_ref:
      - scripts/check_membership_snapshot_freshness.py
      - scripts/scrape_ths_weekly.py
      - engine/basket_membership_pit.py
      - contracts/baskets_china_ths/scrape_receipt.v1.schema.json
      - tests/test_membership_snapshot_freshness.py
      - "GMI masterplan §7 W1a (research/GLOBAL_MARKET_INTELLIGENCE_MASTERPLAN_BY_FABLE.md)"
      - "2026-06-30→08-11 THS membership freeze (2 snapshots in 6 weeks, ~35 green nights)"
    severity: warn
