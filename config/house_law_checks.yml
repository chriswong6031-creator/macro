  - law_id: ops.workflow_yaml_parses
    summary: >
      Every file under .github/workflows/ must load as YAML and carry an on:
      trigger block plus a non-empty jobs: mapping. An unparseable workflow
      file makes GitHub stamp a FAILED zero-job run on every push to every
      branch carrying it (2026-07-10→11 incident: metabolism-agenda.yml
      shipped with column-0 python -c continuation lines that terminated the
      run: | block scalar — ~325 failed runs in ~26h from a schedule-only
      workflow; introduced #2135, file repaired #2260). dag-conformance only
      yaml-loads workflows declared as dag.yml lanes, so non-lane workflows
      had no parse guard at all.
    source_ref:
      - scripts/check_workflow_yaml.py
      - "PR #2260 (file repair)"
      - "PR #2135 (regression origin)"
    severity: hard
    check_script: scripts/check_workflow_yaml.py
    ci_wiring:
