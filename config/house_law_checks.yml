  - law_id: data.append_only_assertions
    summary: >
      A historical assertion over an append-only store must not become false
      merely because a VALID NEW ROW was appended. The rule is MONOTONICITY, not
      equality: `len(rows) == 28` and `ledger_ids <= graded_ids` are fragile;
      `>= floor`, `x in store`, `set(keys) == FIELDS`, a constant-bounded prefix
      slice, a per-row schema contract, and two reads of the same store in one
      run are safe. Covers BOTH shapes the defect takes — an assert over store
      content, and a CI gate whose failing exit code is a function of it.
    source_ref:
      - scripts/check_append_only_assertions.py
      - tests/test_append_only_assertions.py
      - config/synapse.yml
      - research/EVAL_OS_GUARDLAW_T3_HANDOFF_2026-08-12.md
    severity: discipline
    check_script: scripts/check_append_only_assertions.py
    ci_wiring: []
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - >-
        PRODUCER SIBLING (false positive). A store compared to a receipt written by
        the SAME producer run is safe because both move in lockstep, but is reported.
        Observed at tests/test_chronicle.py:2294, where the manifest records rows=5051
        and events.jsonl is 5051 lines. Closing it needs a `producer:` sibling lookup
        in config/synapse.yml.
      - >-
        WITHIN-RUN VIA AN INTERMEDIARY (false positive). When one side reaches the
        store through a call the scanner cannot see into, only the other side carries
        taint. Observed at tests/test_personality_relief_hazard.py:400, where `state`
        comes back from prh.update() over the same ledger being counted.
      - >-
        FROZEN FIRST ROW (false positive). `registration, *events = rows` makes
        `registration` row 0, which an append cannot change; reported anyway at
        tests/test_personality_relief_hazard.py:357. The BYTE form of the same idea
        (`raw[:50_790]`) IS recognised and is not reported.
      - >-
        UNREGISTERED STORE (false negative). A live append-only store missing from
        config/synapse.yml is invisible. data/basket_turn/ledger.jsonl is tracked in
        git and pinned by `assert len(live) == 8` at
        tests/test_basket_membership_stamps.py:259, and this guard reports zero
        findings in that file because synapse.yml carries data/us_basket_turn/ and
        data/china_basket_turn/ but not that path.
      - >-
        ROW-GRAIN MEMBERSHIP (false negative, deliberate). The per-row carve-out
        cannot distinguish a schema contract (`row["kind"] == "event"`, legal) from an
