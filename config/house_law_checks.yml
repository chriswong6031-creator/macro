schema: house_law_checks.v1
updated: "2026-07-11"

# Canonical registry of every house law and its enforcement status.
# Maintained by scripts/check_house_law_registry.py (meta-guard).
# To add a new guard: (1) create scripts/check_<slug>.py, (2) add an entry here,
# (3) wire the new ci.yml / pages.yml step. The meta-guard blocks merges of
# unregistered check_*.py files. Severity downgrades or entry removals require
# an operator/Fable ruling recorded in the PR.

checks:

  # ── UI / rendering guards ──────────────────────────────────────────────────

  - law_id: ui.hub_a11y
    summary: >
      The landing hub (and any globe-deck page) must keep its accessibility
      contract: no focusable elements inside aria-hidden subtrees, the <head>
      boot sets the document language, the light-theme pill contrast override
      is present, viewport-fit=cover + safe-area insets ship, and theme.js
      syncs documentElement.lang. Locks in the 2026-07-10 hub a11y fixes
      (PR #2096/#2104 review findings).
    source_ref:
      - scripts/check_hub_a11y.py
      - research/hub_ux_program.md
      - "PR #2195"
    severity: hard
    owner_program: hub-ux-program
    check_script: scripts/check_hub_a11y.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: hub-a11y
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      Pure-stdlib static checker; functional coverage provided by
      tests/test_check_hub_a11y.py (34 cases incl. violating fixtures).

  - law_id: ui.inline_js_parses
    summary: >
      Every inline <script> block in committed site HTML must be syntactically
      valid JavaScript. A syntax error blanks the page silently (IIFE aborts).
    source_ref:
      - scripts/check_inline_js.py
      - "PRs #152 #155"
    severity: hard
    check_script: scripts/check_inline_js.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: inline-js
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
      - workflow: .github/workflows/render.yml
        job: render
        lane: render
      - workflow: .github/workflows/engine-render.yml
        job: engine-render
        lane: render
    selftest: false
    selftest_exempt_reason: >
      Thin node --check wrapper; functional coverage provided by
      tests/test_check_inline_js.py.
    allowlist: null
    ratchet: null
    known_limits:
      - Scans committed site/; does not cover dynamically generated fragments
        injected by JavaScript at runtime.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.site_js_parses
    summary: >
      Every standalone site/*.js bundle (loaded via <script src=...>) must parse
      without syntax errors. Smart-quote delimiters once blanked markets.html for
      ~2 days (PR #1004 → #1353).
    source_ref:
      - scripts/check_site_js.py
      - "PR #1353"
    severity: hard
    check_script: scripts/check_site_js.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: inline-js
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: false
    selftest_exempt_reason: >
      Thin node --check wrapper; covered by the same CI job as ui.inline_js_parses.
    allowlist: null
    ratchet: null
    known_limits:
      - Skips vendor/CDN bundles that are not committed to site/.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.nav_gap
    summary: >
      Every page's shared nav menu must maintain a top gap (body top padding).
      A page that zeroes body padding jams the menu against the viewport top.
    source_ref:
      - scripts/check_nav_gap.py
      - "PR #471"
    severity: hard
    check_script: scripts/check_nav_gap.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: nav-gap
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: false
    selftest_exempt_reason: >
      Covered by tests/test_check_nav_gap.py.
    allowlist: null
    ratchet: null
    known_limits:
      - Scans committed site/ HTML; does not cover pages generated only at runtime.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.nav_mega
    summary: >
      Every page that renders the shared nav must carry the Research mega-menu.
      An out-of-loop or hand-static page can freeze the nav without the mega-menu.
    source_ref:
      - scripts/check_nav_mega.py
    severity: hard
    check_script: scripts/check_nav_mega.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: nav-mega
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: false
    selftest_exempt_reason: >
      No dedicated selftest; the check is deterministic over committed site HTML.
    allowlist: null
    ratchet: null
    known_limits:
      - Only catches pages already committed to site/; new pages built outside the
        render loop are not caught until they land in site/.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.title_i18n
    summary: >
      Translated (CJK / t() / zh-interpolated) text must never appear inside HTML
      title= attributes. The dual-span l-en/l-zh mechanism cannot operate in
      attributes, so a bilingual title= renders both languages mashed together.
      Law source: CLAUDE.md ("no translated text in title= attributes").
    source_ref:
      - scripts/check_title_i18n.py
      - CLAUDE.md
    severity: hard
    check_script: scripts/check_title_i18n.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: title-i18n
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; scans template source deterministically.
    allowlist: null
    ratchet: null
    known_limits:
      - Scans templates/ source; does not re-scan rendered site/ HTML.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.template_site_sync
    summary: >
      Every plain-copy page asset (a non-.j2 file directly under templates/ that
      also ships as site/<name>) must byte-match its template at every commit.
      2026-07-07 incident: the scope=all engine-render run (110 min, checkout
      9208ef4920) pushed commit 2ae709f9f0 whose site/sector_cycles.js was
      byte-identical to the CHECKOUT-TIME template blob — the push step's
      `git pull --rebase -X theirs` resolved the conflict against #1793's
      de-escalation (merged mid-render) in favor of the stale copy, resurrecting
      "validated" wording and reddening validated-claims on main (fixed in #1799).
      Render lanes self-heal via --fix post-rebase; PR CI + the publish gate keep
      one-sided template/site edits from arming the divergence window.
    source_ref:
      - scripts/check_template_site_sync.py
      - "2026-07-07 incident (commits 2ae709f9f0 → bc81006240 / #1799)"
    severity: hard
    check_script: scripts/check_template_site_sync.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: template-site-sync
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
      - workflow: .github/workflows/render.yml
        job: render
        lane: render
      - workflow: .github/workflows/engine-render.yml
        job: engine-render
        lane: render
      - workflow: .github/workflows/daily.yml
        job: engine
        lane: scheduled
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Direct children of templates/ only; .j2 render inputs and the
        templates/fonts/ binary copytree are out of scope.
      - Pairs whose site copy does not exist yet are skipped (new asset not
        yet shipped).
      - theme.js is compared against its baked form (Supabase config injected
        by lib.site_assets); in stdlib-only contexts (pages.yml publish) this
        degrades to a token-split prefix/suffix compare.
    owner_program: engine-fix-masterplan
    notes: >
      In the three render lanes the wiring is `--fix` inside the push retry
      loop (post-rebase, pre-push) — a self-heal, not a gate: the lane re-copies
      every pair from post-rebase templates/ and folds the delta into a
      follow-up "render-sync" commit.

  - law_id: ui.interfonts_theme_sync
    summary: >
      The Inter @font-face blocks in templates/_interfonts.html.j2 (the
      self-hosted-font partial included in the <head> of the 16 standalone
      templates that do not link theme.css, PR #2119) must be byte-identical,
      in order, to the @font-face lines at the top of templates/theme.css —
      and exactly six of them must exist. The partial is a manual copy whose
      comment says "keep the two in sync"; without this gate an edit to
      theme.css's @font-face rules (a new weight, a renamed font file) drifts
      silently past the partial and the standalone pages lose the self-hosted
      font again — the exact regression #2119 fixed.
    source_ref:
      - scripts/check_interfonts_sync.py
      - templates/_interfonts.html.j2
      - "PR #2119"
    severity: hard
    check_script: scripts/check_interfonts_sync.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: template-site-sync
        lane: pr_ci
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Line-prefix match only — @font-face rules must stay one-per-line at
        column 0 in both files; the exact-count assertion (EXPECTED_COUNT=6
        in the script) catches a reformat that breaks this shape in both
        files at once, where list equality would pass vacuously.
      - Does not verify that the standalone templates actually include the
        partial, nor that site/fonts/ ships the referenced .woff2 files.
    owner_program: engine-fix-masterplan
    notes: >
      Wired as extra steps inside the existing template-site-sync pr_ci job
      (ci.yml already triggers on templates/**). Render lanes never write
      templates/, so a hand-edited PR is the only drift vector — pr_ci is the
      complete enforcement point; no render/publish wiring needed.

  - law_id: ui.ms_board_coherence
    summary: >
      Every rendered Market State board (site/macro.html + the CN/HK/CA
      dashboards) must be single-snapshot coherent — verdict word, 0-100 score,
      meter tick, thesis, override notes and flip line must all be derivable
      from ONE engine/market_state.py snapshot ("Risk Radar forces Risk-off."
      note => score <= 41 and verdict Risk-off; "Capped at Mixed" => score <= 59,
      never Risk-on; verdict word <=> score band; thesis/flip shape <=> verdict).
      2026-07-07 incident: render commit 5bf116a3b3 raced the 07:10
      engine-render (7a1c30ced4); the push step's `git pull --rebase -X theirs`
      resolved conflict regions toward the replayed stale render, stitching
      upstream's score 56/"Mixed" beside the stale "Risk Radar forces Risk-off."
      note — a hybrid ui.template_site_sync cannot catch (it guards plain-copy
      assets, not rendered pages).
    source_ref:
      - scripts/check_ms_board_coherence.py
      - engine/market_state.py
      - "2026-07-07 incident (commit 5bf116a3b3 = hybrid of 7a1c30ced4 + d944f0d713)"
    severity: hard
    check_script: scripts/check_ms_board_coherence.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: ms-board-coherence
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
      - workflow: .github/workflows/render.yml
        job: render
        lane: render
      - workflow: .github/workflows/engine-render.yml
        job: engine-render
        lane: render
      - workflow: .github/workflows/daily.yml
        job: engine
        lane: scheduled
      - workflow: .github/workflows/asia-close.yml
        job: asia
        lane: scheduled
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Parses the EN (l-en) spans only — EN/ZH share each <p> source line, so a
        line-granular rebase stitch cannot split the pair.
      - Factor-row tones are not checked against the verdict (a legitimately
        mixed board carries mixed tones).
      - Pages without an ms-verdict section are skipped (not every market ships
        the board).
    owner_program: engine-fix-masterplan
    notes: >
      Render lanes wire it twice: a pre-commit gate (restore-from-HEAD + fail
      RED — the commit step is `if: always()`, so a plain red step would not
      stop the push) and a post-rebase `--heal-from origin/main` inside the push
      retry loop, which restores any incoherent page WHOLESALE from post-rebase
      main — a coherent board at most one render old beats a stitched hybrid;
      the next render re-lands freshness.

  # ── Git hygiene ────────────────────────────────────────────────────────────

  - law_id: git.no_conflict_markers
    summary: >
      No committed file may contain literal git conflict markers
      (<<<<<<< / ======= / >>>>>>>). A merge once shipped markers inside
      templates/dashboard.html.j2; Jinja treats them as plain text, so they
      rendered visibly. Selftest proves the guard fires before it is trusted.
    source_ref:
      - scripts/check_conflict_markers.py
      - "2026-07-03 incident"
    severity: hard
    check_script: scripts/check_conflict_markers.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: conflict-markers
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Scans templates/, engine/, scripts/, site/; does not cover binary or
        gitignored files.
    owner_program: engine-fix-masterplan
    notes: >
      Selftest flag is spelled --self-test (hyphenated).

  # ── Epistemics guards ──────────────────────────────────────────────────────

  - law_id: epistemics.validated_claims
    summary: >
      Every affirmative use of the word "validated" (EN + ZH "已验证") in
      user-facing surfaces must trace to a stored, leak-free, pre-registered
      artifact or an allowlisted justification. Negated/hedged uses are ignored.
      Law source: CLAUDE.md ("The word 'validated' in user-facing text is
      CI-enforced").
    source_ref:
      - scripts/check_validated_claims.py
      - CLAUDE.md
      - "PREREGISTRATION.md §4, D2 §4.3"
    severity: hard
    check_script: scripts/check_validated_claims.py
    ci_wiring:
      - workflow: .github/workflows/cycle-calibration.yml
        job: calibrate
        lane: scheduled
      - workflow: .github/workflows/ci.yml
        job: validated-claims
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: true
    allowlist: data/regime/validated_claims_allowlist.json
    ratchet: null
    known_limits:
      - Scans templates/, site/*.js, generated *_data.js only; does not scan
        research/*.md (frozen Fable ruling 2026-07-06 — see
        epistemics.research_docs_not_scanned).
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: epistemics.trial_registration
    summary: >
      Every multiple-testing harness (validate_* / *_phase0 scripts) must register
      its trial budget in the trial ledger. An unregistered harness makes DSR/kill/FDR
      deflation calculations dishonest.
    source_ref:
      - scripts/check_trial_registration.py
      - "engine/trial_ledger.py"
    severity: hard
    check_script: scripts/check_trial_registration.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: trial-budgets
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic scan over script names vs trial ledger.
    allowlist: inline
    ratchet: null
    known_limits:
      - Allowlist (LEGACY_UNREGISTERED) only shrinks; new scripts must register.
      - Scans script names by file pattern; does not parse script contents.
    owner_program: engine-fix-masterplan
    notes: >
      Allowlist is inline in the script (LEGACY_UNREGISTERED constant) and only shrinks.

  - law_id: epistemics.no_literal_ntrials
    summary: >
      No new code may call deflated_sharpe with a caller-asserted literal n_trials
      instead of ledger=; literal trial counts make budget tracking impossible.
    source_ref:
      - tests/test_no_literal_ntrials.py
    severity: hard
    check_script: tests/test_no_literal_ntrials.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: trial-budgets
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      This entry is a pytest suite, not a standalone script; pytest is the test runner.
    allowlist: inline
    ratchet: null
    known_limits:
      - Allowlist (LEGACY_LITERAL_NTRIALS) only shrinks.
    owner_program: engine-fix-masterplan
    notes: >
      check_script points at the test file because enforcement is via pytest, not a
      standalone guard script. This suite ran in NO workflow until 2026-07-06 — the
      registry wiring pass caught the gap and the file was added to the trial-budgets
      pytest invocation the same day.

  - law_id: epistemics.badge_passport
    summary: >
      Every conviction badge rendered in a desk brief must carry a provenance
      passport. A badge without a passport is an unearned claim.
    source_ref:
      - scripts/check_badge_passport.py
      - "engine/passport.py"
      - "audit #41"
    severity: hard
    check_script: scripts/check_badge_passport.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: outcome-spine
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic scan over site/ HTML.
    allowlist: inline
    ratchet: null
    known_limits:
      - Allowlist (LEGACY_NO_PASSPORT) is fully drained — no new items allowed.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: epistemics.claim_passport
    summary: >
      Every qual-ladder field that reaches a scored consumer must have a registered
      claim passport entry in config/qual_ladder.yml. Grandfathered debt entries
      (state=DISPLAY) must be cleared once the §3 gate passes.
    source_ref:
      - scripts/check_claim_passport.py
      - config/qual_ladder.yml
    severity: hard
    check_script: scripts/check_claim_passport.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: house-law-registry
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic scan over engine/*.py vs qual_ladder.yml.
      Script exits 0 on the live repo (15 grandfathered DEBT entries, PASS result).
    allowlist: config/qual_ladder.yml
    ratchet: null
    known_limits:
      - 15 grandfathered DEBT entries (altdata.signal_score, policy.dir) are
        DISPLAY-state (gated); must be cleared once §3 gate passes.
      - ADVISORY unregistered fields (31+) are printed but do not fail the check.
    owner_program: qualitative-intelligence-masterplan
    notes: >
      Wired into house-law-registry job (exit 0 confirmed 2026-07-06).

  - law_id: epistemics.statement_tape_schema
    summary: >
      Every non-comment row in data/statement_tape/registry.jsonl must match the
      binding statement-tape schema (date / speaker / venue / quote / stance_tag /
      added_by / added_at; stance_tag in the fixed vocabulary), and no key may
      imply an LLM-emitted signal or forecast (PS-R1 banned key substrings:
      "signal", "forecast", "prediction", "probability", "prob", "edge").
    source_ref:
      - scripts/check_statement_tape.py
      - data/statement_tape/registry.jsonl
      - research/MAG7_FIELD_GUIDE.md
      - "PR #2297"
    severity: hard
    check_script: scripts/check_statement_tape.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: statement-tape
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic stdlib scan of a committed jsonl artifact.
      Functional coverage lives in tests/test_statement_tape.py (wired into the
      ci.yml pytest whitelist by #2297).
    allowlist: null
    ratchet: null
    known_limits:
      - An absent paraphrase field is a soft warning, not a hard fail (the schema
        default-falses it).
    owner_program: fl-e-statement-tape
    notes: >
      Registered 2026-07-12 after #2297 shipped the guard script without a
      registry entry — the census meta-guard failed EVERY open PR's merge-commit
      CI until this row + the statement-tape ci.yml job landed.

  # ── Contracts guards ───────────────────────────────────────────────────────

  - law_id: contracts.reliability_contract
    summary: >
      A field that has been gated out (reliability state < threshold) must not
      render directionally in any template or site page. Audit #46.
    source_ref:
      - scripts/check_reliability_contract.py
      - "audit #46"
    severity: hard
    check_script: scripts/check_reliability_contract.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: trial-budgets
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic scan over site/ and templates/.
    allowlist: null
    ratchet: null
    known_limits:
      - Literal-path scan; does not catch dynamically computed field references.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: contracts.artifact_drift
    summary: >
      Each artifact in site/factordata/contracts/artifact_manifest.json must not
      drift from the live artifact's actual top-level JSON fields. Schema drift
      between producer and consumer is invisible at trade time without this gate.
    source_ref:
      - scripts/check_contract_drift.py
      - "site/factordata/contracts/artifact_manifest.json"
      - "NW Rails PR-7 R4"
    severity: warn
    check_script: scripts/check_contract_drift.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: contract-drift
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic comparison of manifest vs live artifacts.
    allowlist: null
    ratchet:
      date: "2026-07-13"
      action: >
        Drop --warn-only in the ci.yml contract-drift job step AND flip this
        entry's severity warn->hard in the same PR (the script's default is
        already hard-fail; keep step and registry in lockstep).
    known_limits:
      - Wildcard artifacts (per_stock_intel, per_stock_signal) are skipped when
        no live sample is present — normal on CI runners.
    owner_program: nw-rails-lobes
    notes: null

  - law_id: contracts.board_contradictions
    summary: >
      The standout board must not show loud labels that contradict its own quiet
      fields: FRESH on stale/extended cross, urgency=imminent on blocked label,
      green band on Lagging verdict, negative-alpha slot-1 while positive-alpha
      rows exist in the same lane.
    source_ref:
      - scripts/check_board_contradictions.py
      - "engine/desk_scorer.py"
    severity: hard
    check_script: scripts/check_board_contradictions.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: board-contradictions
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic validation of JSON artifact fields.
    allowlist: null
    ratchet: null
    known_limits:
      - PR gate skips when the artifact is not touched by the PR. Fresh renders
        are graded warn-only by the builder's render-lane self-check
        (scripts/build_stock_library.py, "board-contradictions self-check" log
        line, added in PR 2171); the pages.yml twin is workflow_dispatch-only
        and guards manual GitHub Pages mirror re-deploys, not nightly renders.
    owner_program: us-stocks-prebreakout
    notes: null

  # ── Cycles guards ──────────────────────────────────────────────────────────

  - law_id: cycles.cross_page_consistency
    summary: >
      The same instrument must show the same pos_v2/phase_v2 across every page
      that renders it (cycle / country_cycles / markets / sector), within
      tolerance, or carry a declared basis label.
    source_ref:
      - scripts/check_cycle_consistency.py
      - "W3.6 ruling R3-M3"
    severity: hard
    check_script: scripts/check_cycle_consistency.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: cycle-consistency
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic cross-page scan of committed site/ JSON.
    allowlist: null
    ratchet: null
    known_limits:
      - Tolerance is set by the checker; basis labels must be machine-readable.
    owner_program: cycle-intelligence
    notes: null

  - law_id: cycles.ontology_js_sync
    summary: >
      The committed site/cycle_ontology.js must exactly match what
      engine/cycle_ontology.py produces at HEAD. A stale committed JS is
      especially dangerous around the ONTOLOGY_AXIS flag-day axis-flip.
    source_ref:
      - scripts/gen_ontology_js.py
