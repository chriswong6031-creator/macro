      push died 5x pre-#1823; the engine persisted a faithful-but-stale
      RISK_OFF the live feed carried all session).
    source_ref:
      - scripts/check_price_store_freshness.py
      - lib/nyse_calendar.py
      - "2026-07-07 incident (commits b1cd43c98f / 38dc031b11; PRs #1823 #1830)"
    severity: warn
    check_script: scripts/check_price_store_freshness.py
    ci_wiring:
