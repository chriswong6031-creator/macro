  - law_id: ops.nightly_liveness
    summary: >
      The authoritative nightly (daily.yml / Build B) must produce a run for every
      completed NYSE session, that run must conclude success, the Prophet store must
      actually advance to that session, and each of the five market boards (US, China,
      Hong Kong, Canada, International) must advance on its OWN exchange calendar. All
      four are separate failures and each is observable on its own.
    source_ref:
      - scripts/check_nightly_liveness.py
      - tests/test_workflow_file_size.py
    severity: hard
    check_script: scripts/check_nightly_liveness.py
    ci_wiring:
      - workflow: .github/workflows/nightly-liveness.yml
        job: liveness
        lane: scheduled
      - workflow: .github/ci/legacy-jobs.yml
        job: dag-conformance
        lane: pr_ci
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - >-
        Detection floor is the schedule: 08:00Z and 14:00Z. A bake that dies at 23:00Z
        is reported the next morning, not within the hour. That is deliberate — the
        nightly legitimately runs for hours, so a tighter slot could only report
        INDETERMINATE and would train the operator to ignore the channel.
      - >-
        Check C reads the COMMITTED site/prophet/index.json, so it proves the store
        advanced in git, not that the VPS served it. The 3-min pull and the VPS-side
        freshness_sentinel own that last hop.
      - >-
        Blindness (API error, missing artifact, unparseable stamp) is INDETERMINATE by
        design and exits 0. A guard that is permanently blind therefore reads green;
        test_default_repo_matches_the_git_remote pins the one input most likely to
        cause that silently.
      - >-
        Watches Build B only. Build A (closing-bell.yml) ran green through the entire
        2026-08-11/12 outage while the board it re-rendered still read
        price_through=2026-08-10, so its health proves nothing about the ledger.
      - >-
        Check D grades each market board on its own exchange calendar. The mainland
        budget additionally requires the board to be older than
        lib/cn_calendar.MAX_LEGIT_CLOSURE_DAYS (11 calendar days), because that holiday
        table is deliberately minimal and the State Council routinely extends Spring
        Festival and Golden Week past the statutory core it encodes. That floor applies
        only INSIDE a closure window (a scheduled weekday closure between the board's
        stamp and the expected session), so outside a holiday the mainland pages at 2
        sessions like every other market. Consequence to accept: a China board that dies
        ON THE EVE of a long closure is caught at 11+ calendar days rather than 2
        sessions. Checks A and B still cover the lane that bakes it, within hours.
      - >-
        Budgets are measured, not assumed. A healthy board swept across every 08:00Z and
        14:00Z slot of 2026-2028 breaches on none of the five markets; a board frozen
        after the 2026-08-14 bake first pages at hk/cn 08-18 14:00Z, us/ca 08-19 08:00Z,
        intl 08-21 08:00Z. Re-run that sweep before changing any budget.
      - >-
        Canada is graded on lib/tsx_calendar.py, written for this check. International
        has NO single exchange calendar — the board unions Tokyo, London, Seoul,
        Sydney, Mumbai, Milan, Taipei and Madrid — and degrades to a Mon-Fri
        approximation carrying a documented +2-session tolerance.
      - >-
        International is a KNOWN blind spot today: site/factordata/intl_setups.json has
        carried as_of=null on every commit in main's history, because compute_intl_alpha
        stamps no as_of on any return path (scripts/build_intl_library.py, adversarial
        review D1, PR #5674). The check reports it INDETERMINATE every run and says why
        rather than inventing a verdict; tests/test_nightly_liveness.py pins that state
        so a future stamp is noticed.
      - >-
        Hong Kong's typhoon closures cannot be rule-computed and live in
        lib/hk_calendar.ONE_OFF_CLOSURES. A missing entry over-counts the lag (a false
        "stale"), never under-counts, so two consecutive unrecorded No.8 / Black
        Rainstorm days could produce one false page until the date is appended.
    owner_program: prophet-us-eyes-open
    notes: >
      Registered after the 2026-08-11/12 two-session outage, in which the US nightly
      went dark and no existing instrument reported it. heartbeat.yml could not:
      max_age_hours=96 is sized so a Friday bake still looks alive on Monday, and it
      runs on the same macstudio pool as the lane it watches. freshness_sentinel could
      not: PROPHET_MAX_SESSIONS_BEHIND=1 is correct (between the close and the bake,
      one behind IS healthy) and therefore blind for ~24h. Both measure DATA; what
      broke was the SCHEDULE, after #5362 pushed daily.yml past GitHub's silent
      ~512,000-byte processing cap. This guard asks GitHub whether a run was created
      at all, which is the only question that sees a stranded workflow file in hours.
      Fixture dates in --selftest are constants with no relation to the wall clock.
      Check D (per-market board freshness) was added 2026-08-17 after the Canada board
      froze: site/factordata/canada_standouts.json held as_of=2026-08-13 from 2026-08-14
      onward while daily.yml ran green, the render lane re-committed the file nightly (so
      its git mtime was always minutes old), and its US, HK and mainland siblings
      advanced. Checks A-C were all satisfied — A and B watch the lane, C watches ONE
      artifact, and that artifact belongs to a different market. A re-render is not an
      advance, and a green lane is not a green board. The workflow's sparse-checkout list
      is load-bearing for D: a missing path degrades that market to INDETERMINATE (exit
      0) rather than turning the lane red, so tests/test_nightly_liveness.py pins the two
      lists together.

  - law_id: governance.intelligence_registry_integrity
    summary: >
      The Mastermind engine registry is a DERIVED ON-DEMAND VIEW, never hand-authored and
      NEVER COMMITTED. It is a pure function of config/synapse.yml, config/qual_ladder.yml,
      an AST scan of producer source, data/species/registry.json and data/qledger/, built
      in memory by scripts/build_intelligence_registry.py and read by consumers either as
      an import or off `--json` stdout. Only four curated keys may live in
      config/intelligence_registry_overlay.yml. This law fires ONLY on INVARIANTS of the
      derivation and of the hand-edited overlay: a synapse artifact mapping to zero or to
      more than one engine (the partition must be TOTAL and DISJOINT), an authority value
      that names no derivation rule or no artifact that carries it (attribution), an
      overlay key outside the four-key allowlist, an overlay key that is DERIVED, an
      overlay row for a cell the partition does not contain (orphan), a curated
      not_an_engine exclusion of an AUTHORITY-BEARING or evaluated cell, an unknown enum
      value, a missing required field, a null ledger, or an exclusion with an empty reason
      or one that does not record what it deletes. The key allowlist IS the executable form
      of DNR:KILL-PARALLEL-KNOWLEDGE-BASE — without it the overlay silently becomes the
      hand-authored engine list that row forbids.
    source_ref:
      - engine/intelligence_registry.py
      - scripts/build_intelligence_registry.py
      - scripts/check_intelligence_registry.py
      - config/intelligence_registry_overlay.yml
      - research/MASTERMIND_INTELLIGENCE_OS_V1_PLAN.md
    severity: warn
    check_script: scripts/check_intelligence_registry.py
    ci_wiring:
      - workflow: .github/ci/legacy-jobs.yml
        job: intelligence-registry
        lane: pr_ci
    selftest: true
    allowlist: config/intelligence_registry_overlay.yml
    ratchet: null
    known_limits:
      - >-
        THERE IS NO DRIFT GUARD, NO COMMITTED ARTIFACT AND NO `--check` EQUALITY MODE, and
        none may be re-added. Two earlier rounds committed a generated
        data/intelligence_registry.json plus a generated Markdown mirror and pinned them by
        equality against a "stable" input; both were scheduled fleet-wide reds and the pin
        merely RELOCATED between rounds. Round 1 pinned against data/qledger/claims.jsonl
        (append-only); round 2 moved the pin to config/synapse.yml, a MORE volatile input.
        Both rounds cited churn figures taken off a SHALLOW clone (13 and 26 commits in 14
        days) and both UNDERSTATED it. RE-MEASURED ON FULL HISTORY 2026-08-14 (unshallowed,
        11,971 commits reachable): data/qledger/claims.jsonl 70 commits and
        config/synapse.yml 69 commits in the trailing 14 days — 5.4x and 2.7x the shallow
        figures, so the conclusion is strengthened, not softened. The third candidate,
        data/species/registry.json, looked stable at "one commit in its whole history";
        on full history it has 17, every one an adjudication PR (last #4358, 2026-08-03).
        It is genuinely low-churn — but a pin needs stability of CONTENT, and an
        adjudication rewrites exactly the rows a registry derives from. There is no stable
        input on this repo to pin against, so nothing generated is committed and nothing
        is pinned.
      - >-
        SEVERITY IS `warn`, NOT `hard`, EVEN THOUGH THESE ARE PR-CAUSED INVARIANTS. The
        two previous rounds each argued a hard pin was legitimate because "every input
        moves only via a PR", and both were refuted 3/3 by measurement rather than by
        argument. The invariants here really are green by construction, but the same
        sentence was true of the drift pin, so the severity stays advisory until T7 has run
        the gate against the live corpus for a sustained period. Structural violations
        still exit non-zero on the guard's own exit code, so a real violation is visible in
        the job log; `warn` governs how loudly the registry treats it, not whether the
        script reports it.
      - >-
        FAIL CLOSED, NOT SILENT — AND KEYED ON THE PLANE THAT WENT BLIND (ruling
        2026-08-14, amended the same day). The summary line ALWAYS carries an `inputs=`
        clause; when any input could not be read it reads `inputs=INCOMPLETE (...)`, NAMES
        what was missed AND NAMES ITS PLANE, and the COULD NOT LOOK annotation and the
        --json `unreadable_inputs`/`unreadable_by_plane` carry the same facts. What differs
        by plane is only the EXIT CODE. PR-PLANE (config/synapse.yml, the overlay,
        config/qual_ladder.yml, data/species/registry.json, the Article-2 module table,
        producer SOURCE — all config and code, all moved only by a pull request) exits
        non-zero on EVERY run, with or without --strict: a PR author can cause it and a PR
        author can fix it. DATA-PLANE is exactly ONE input, data/qledger/claims.jsonl, the
        only one an automated lane advances (70 commits in the 14 days to 2026-08-14); it
        is fully reported and exits non-zero only under --strict. THE FIRST FORM OF THIS
        RULING GATED ON ANY INCOMPLETE READ, which handed the nightly the power to red
        every PR in flight: one truncated line of 46,696 in the claim store reddened the
        whole intelligence-registry job, for a file no PR author touches — the
        scheduled-fleet-red shape this program has been refuted for three rounds running,
        arriving through the fix for a different one. DEFERRED, WITH AN OWNER: no lane
        passes --strict yet, so corruption of the claim store currently ALERTS everywhere
        and GATES nowhere; wiring a nightly-side --strict run is T7's, in the same wave
        that drains the C-1 backlog and flips this law to `hard`. "Unreadable" includes
        PARTIAL: a store that opens but whose lines do not all parse is named with its
        count (`data/qledger/claims.jsonl (2 unparseable line(s) of 4)`) while the rows
        that DID parse stay in the view — the null law requires the incompleteness be
        REPRESENTED, not that the readable half be discarded. A document that reads but
        does not PARSE is the same state as one that could not be read: synapse -> NOT
        CHECKED + exit 1, overlay and qual_ladder -> treated as absent and NAMED, never a
        bare traceback. Sparse agent worktrees carry no data/ on disk while ~39,900 data
        paths are tracked in HEAD, so every read — including producer SOURCE and the
        qual_ladder_ref probe — goes through the worktree-then-`git show` ladder, and a
        producer readable from neither is announced rather than silently skipped.
      - >-
        `not_an_engine` is the most destructive of the four overlay keys and was once the
        least gated: a 3-character reason removed an authority-bearing engine with every
        law green (measured 2026-08-12: 378 -> 376 engines, gate_size 5 -> 4). It now
        requires ratified_by, a date, a >=40-character reason and a DNR:<KEY>-shaped
        citation if it cites one; exclusions are derived BEFORE being excluded so each
        records its would_be_authority; a curated exclusion of an authority-bearing or
        scored/confirmer/shadow cell is a structural violation; and excluded rows are still
        audited for content findings, so an exclusion cannot deflate the backlog. The
        curated-exclusion count is NOT pinned at zero by a test — a count over
        config/synapse.yml is exactly the class of pin this round deleted.
      - >-
        The engine unit is (producer, owner_program). Measured 2026-08-12, 32 of 378
        engines mix artifact tiers, so the engine-level authority roll-up (a MAX)
        OVERSTATES authority for the low-tier siblings in those cells. A consumer acting
        per-artifact must read artifacts[].artifact_authority, not the roll-up.
      - >-
        The qledger desk literal is extracted by AST from register()/register_batch()/
        make_claim() call sites. A dynamic or indirect desk value does not resolve (1
        producer measured 2026-08-12: engine/china_special_situations.py); those engines
        fall through to ledger waterfall rules 3-5. The builder emits a ::notice naming
        them, so the gap is counted rather than invisible.
      - >-
        Species-to-engine binding is by ledger path, so several species sharing one
        ledger collapse to one engine. Measured 2026-08-12: 17 species bind to
        us_board_ledger, so the conservative least-advanced rule renders that engine
        phase0 even though 6 of the bound species are validated. The full bound set is
        recorded in validation_state_evidence.
      - >-
        `graded_by_design: "yes"` IS PARTLY A WEAK HEURISTIC — see the fuller disclosure in
        epistemics.engine_authority_evidence. Ledger waterfall rules 1 and 4 resolve the
        ledger from a PATH / MODULE-NAME SUBSTRING, so a `yes` they produce is a guess.
        Every engine carries graded_by_design_evidence in {strong, weak_path_heuristic,
        none} and every weak `yes` is enumerated as GRADED_BY_DESIGN_IS_HEURISTIC on every
        run.
    owner_program: qualitative-intelligence
    notes: >
      Split from epistemics.engine_authority_evidence deliberately: one entry would force
      one severity, and the two laws describe different things — this one the derivation's
      own invariants, the sibling the pre-existing corpus backlog those invariants surface.
      Registered at `warn` rather than `hard` per the second known_limit: the argument for
      `hard` here ("green by construction, every input is PR-caused") is verbatim the
      argument that justified the drift pin in rounds 1 and 2, and it was wrong both times,
      so the severity waits on evidence rather than on reasoning. Wired as its OWN legacy
      job `intelligence-registry` (CEO ruling 2026-08-14), not folded into neural-web:
      run_ci_pack.py::_run_job RETURNS on the first non-zero step, so inside a shared job
      there is no safe position — first MASKS the nine sibling suites behind it, last goes
      DARK behind any of them (#4779, an absence of red is not a pass) — and a step-level
      `if: always()` is unavailable because ALLOWED_STEP_KEYS is {name, run, uses, with}.
      188 jobs were measured for consolidation first; zero exact-duplicate signatures and
      no safe merge existed, so the one-off pack rebalance is the cheaper cost.

  - law_id: epistemics.engine_authority_evidence
    summary: >
      An engine holding authority over a human must point at the evidence that earned it.
      Measured 2026-08-12 (Finding C-1): four of the five tier=scored synapse artifacts —
      vector-calibration, hazard-model, vol-regime-gate, vol-regime-basket-overlay-gate —
      carry NO qual_ladder_ref, so things with rank/size/gate authority do not name their
      prereg. Finding C-2: synapse `tier` does not express authority over a human at all —
      site-us-standouts (the Prophet board that orders what a paying user sees) carried
      the same tier=display as a decorative chip. This law reports every ARTIFACT above
      display authority whose qual_ladder_ref is MISSING (AUTHORITY_WITHOUT_EVIDENCE),
      every qual_ladder_ref that resolves to neither a config/qual_ladder.yml key nor an
      existing repo FILE (AUTHORITY_EVIDENCE_UNRESOLVABLE — a DIRECTORY is not a prereg),
      every ref the resolver was given no inputs to probe (AUTHORITY_EVIDENCE_UNCHECKED —
      "could not look", which is reported and is NOT counted as evidence), every
      gate-tripping engine with no curated output_class, every graded_by_design='yes'
      standing on a path-substring heuristic (GRADED_BY_DESIGN_IS_HEURISTIC), a
      graded_by_design value contradicting a resolved ledger, a species whose ledger_binding matches no
      engine (SPECIES_UNBOUND), a registered qledger desk with zero rows in the claim
      corpus, and the scored_path_surfaces completeness flag (an artifact read by an
      Article-2 enforcer module while declaring no surfaces — the measured prophet-index
      case).
    source_ref:
