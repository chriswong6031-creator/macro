        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      The checker has a mutation-focused pytest suite covering fork-route drift,
      computed migration labels, reusable-workflow delegation, trust-gate removal,
      topology overlap, and unregistered custom-label consumers; the checker and
      suite run together in the registered workflow-yaml legacy job.
    allowlist: null
    ratchet: null
    known_limits:
      - >-
        Repository lint is a merge guard, not a runtime admission boundary. The
        live home runners must also reside in the organization runner group that
        is restricted server-side to exact workflow paths pinned to refs/heads/main.
      - >-
        Existing pre-Wave-B/C production self-hosted labels are outside this
