  - law_id: design.reference_integrity
    summary: >
      No reference laundering: a proposed design reference may not become law
      until the product/taste judgment happened, in the right order,
      independently, and left receipts. No implicit deletion — every production
      capability receives an explicit disposition, a data-motivated REMOVE is a
      mis-filed BLOCKED_DATA, a WORSE verdict on a critical user task and an
      unwarranted "stronger" authority claim are review-blocking until
      adjudicated, and receipts-or-no-canon: only a reference carrying a valid
      approval receipt may be cited as compliant by a registry row or as
      canonical by a migration packet.
