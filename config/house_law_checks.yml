      not treated as a security boundary.

  - law_id: ops.no_skip_only_suites
    summary: >
      No test may skip in every CI job that names it. A suite can be named by a
      job, be triggerable, and still execute nowhere — because the one job that
      names it does not install what its `pytest.importorskip("X")` / module-probe
      `skipif` gates need. That is the third darkness class, between UNRUN and
      UNTRIGGERABLE, and an importorskip added to clear a red lane creates it by
      construction: main goes green AND weaker in the same commit. It shipped
      twice — #3703, then #3722→#3738 (fixed by #3760, where six tests including
      the two load_ohlcv crypto-source regressions executed in ZERO jobs for the
      day they were on main). The check is static: per test file collect the skip
      gates, per job collect the test files its `run:` steps name and the modules
      its single pip install line provides, and fail when no naming job provides
      a gated module. A first-party gate resolves to that module's own
      third-party import closure (engine.indicators_m2 → numpy/pandas).
    source_ref:
      - scripts/check_skip_only_suites.py
      - "PR #3760 (chart-render/chart-render-data pairing; filed this follow-up)"
      - "PR #3703 (first occurrence)"
    severity: hard
    check_script: scripts/check_skip_only_suites.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: workflow-yaml
        lane: pr_ci
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - >-
        Gates on things pip cannot install are deliberately out of scope: a data
        artifact (_PANEL.exists()) or a binary (shutil.which("node")) is a
        different darkness class with a different fix.
      - >-
        Suites that NO job names are reported as UNRUN and never fail this gate —
        scripts/audit_unrun_tests.py owns that class, and wiring every unrun suite
        would blow the ci-pack budget.
      - >-
        Scope was `tests/` only until 2026-08-06 (#4693), which made this gate and
        both censuses blind to research/-resident guard suites — the ones most
        likely to be dark, because a packet fenced to files-only writes its suite
        next to the instrument. Discovery is now the whole tree via
        scripts/audit_unrun_tests.discover_suites().
      - >-
        A test_-shaped FILENAME is not a suite: three files under research/ are CLI
        measurement instruments that collect zero tests. Classification reads the
        AST for what pytest would collect rather than trusting the name, so those
        are excluded — reporting them would make the census noise, which is the
        failure mode these guards exist to end.
      - >-
        Transitive dependency closure (PACKAGE_REQUIRES) is a hand-maintained
        table of hard runtime deps. Under-declaring costs a false red;
        over-declaring costs a missed skip-only suite. It is deliberately
        restricted to certainties (pandas→numpy, jinja2→markupsafe, …).
    owner_program: null
    notes: >
      Complements ops.workflow_yaml_parses and the ci-pack packing contract in the
      same job. Its first run surfaced four pre-existing skip-only suites
      (test_marketing_content, test_marketing_live_verify, test_publish_r2,
      test_research_vault), all repaired in the PR that added the guard.

  - law_id: ops.ci_trigger_closure
    summary: >
      A guarded suite's TRIGGER PATHS must reach every module the suite measures.
      The fourth darkness class, and the reverse direction of every census beside
      it: audit_unrun_tests.py asks "can ANY edit start this job" — an any() over
      the closure, satisfied by the test file itself — so a suite stays
      "triggerable" while the ONE module it exists to guard is matched by no
      `on.pull_request.paths` entry. An edit to exactly that module then ships
      without ever running its own guard. The check is static: discover the
      PR-gated workflows (a workflow with no `paths:` covers everything it runs
      unconditionally; one WITH `paths:` governs both its own `run:` steps and any
      job manifest it hands a runner, which is how the packed legacy jobs inherit
      ci.yml's single filter), resolve each named suite's direct first-party reads
      (imports, import_module literals, repo-relative path literals, ROOT/"a"/"b.py"
      joins), and fail when a resolved module is reachable by no gate that runs it.
    source_ref:
      - scripts/check_ci_trigger_closure.py
      - tests/test_ci_trigger_closure.py
      - "PR #4649 (guard shipped)"
      - "PR #3488 (a guard whose own edit cannot start the workflow is half wired)"
      - "PR #4559 (fixture-only heal — same class)"
      - "PR #4733 (false positive, healed the wrong way — see allowlist)"
    severity: hard
    check_script: scripts/check_ci_trigger_closure.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: workflow-yaml
        lane: pr_ci
    selftest: true
    allowlist: "inline (`# ci-trigger-closure: data` comment at the fixture site)"
    ratchet: null
    known_limits:
      - >-
        A path literal is evidence of a read, not proof of one. A suite whose
        SUBJECT MATTER is path filtering (merge-on-green, ci-trigger, paths-filter)
        carries file NAMES as fixture data, so the heuristic and the domain collide
        by construction. #4733 healed one such finding by adding two `research/**`
        artifacts to ci.yml's paths — encoding a dependency that does not exist and
        arming the full 4-pack run on every edit to two decision-packet files. The
        author-declared `# ci-trigger-closure: data` marker is the sanctioned form;
        it covers the line it sits on when that line carries a path literal, and
        otherwise the statement it opens or the one directly below. It reaches only
        literals and joins — an import is a read no comment can excuse — and every
        suppression is counted in the summary and named by `--report`. Inference was
        prototyped and rejected: "a literal that never reaches an open/read_text/Path
        call is data" drops 787 of 3,824 subjects across 132 suites, including
        PRESS_MUST_RESTART's 15 real ones (reached through @pytest.mark.parametrize).
      - >-
        The gate is DIRECT reads only (depth 1). `--depth N` widens the report to
        transitive reads and is deliberately NOT gated: past depth 1 the
        path-literal heuristic starts resolving placeholder strings out of
        docstrings, and a guard that cries wolf gets ignored — which is the exact
        failure mode this file exists to end.
      - >-
        Reachability is decided under GitHub's `paths` glob semantics (exact,
        fnmatch, `prefix/**` subtree). A path expression GitHub accepts but this
        resolver models differently would be judged on the model, not the runner.
      - >-
        Suites that NO job names are UNRUN, not trigger gaps —
        scripts/audit_unrun_tests.py owns that class.
      - >-
        Scope was tests/ only until 2026-08-06 (#4693) — a suite wired from
        research/ was invisible to this gate even once wired. Suites now come from
        audit_unrun_tests.discover_suites() and run-step tokens resolve against
        that inventory, so a test_-shaped CLI instrument named by a run: step is
        not gated as a suite.
    owner_program: null
    notes: >
      Registered by the 2026-08-06 base heal. The guard shipped wired in #4649
      (workflow-yaml, beside its two sibling censuses) but was never added to this
      registry, so the meta-guard's CENSUS pass hard-failed ci-pack-2 on main and
      on every open PR head — the same shape as the flow_continuity.statement_tape
      entry below, which was registered by a post-hoc census fix for the same
      reason. Belongs to the darkness-census family with ops.no_skip_only_suites
      and ops.workflow_yaml_parses in the same job.

  - law_id: ops.government_revenue_amount_semantics
    summary: >
