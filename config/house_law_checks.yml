schema: house_law_checks.v1
updated: "2026-07-06"

# Canonical registry of every house law and its enforcement status.
# Maintained by scripts/check_house_law_registry.py (meta-guard).
# To add a new guard: (1) create scripts/check_<slug>.py, (2) add an entry here,
# (3) wire the new ci.yml / pages.yml step. The meta-guard blocks merges of
# unregistered check_*.py files. Severity downgrades or entry removals require
# an operator/Fable ruling recorded in the PR.

checks:

  # ── UI / rendering guards ──────────────────────────────────────────────────

  - law_id: ui.inline_js_parses
    summary: >
      Every inline <script> block in committed site HTML must be syntactically
      valid JavaScript. A syntax error blanks the page silently (IIFE aborts).
    source_ref:
      - scripts/check_inline_js.py
      - "PRs #152 #155"
    severity: hard
    check_script: scripts/check_inline_js.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: inline-js
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
      - workflow: .github/workflows/render.yml
        job: render
        lane: render
      - workflow: .github/workflows/engine-render.yml
        job: engine-render
        lane: render
    selftest: false
    selftest_exempt_reason: >
      Thin node --check wrapper; functional coverage provided by
      tests/test_check_inline_js.py.
    allowlist: null
    ratchet: null
    known_limits:
      - Scans committed site/; does not cover dynamically generated fragments
        injected by JavaScript at runtime.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.site_js_parses
    summary: >
      Every standalone site/*.js bundle (loaded via <script src=...>) must parse
      without syntax errors. Smart-quote delimiters once blanked markets.html for
      ~2 days (PR #1004 → #1353).
    source_ref:
      - scripts/check_site_js.py
      - "PR #1353"
    severity: hard
    check_script: scripts/check_site_js.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: inline-js
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: false
    selftest_exempt_reason: >
      Thin node --check wrapper; covered by the same CI job as ui.inline_js_parses.
    allowlist: null
    ratchet: null
    known_limits:
      - Skips vendor/CDN bundles that are not committed to site/.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.nav_gap
    summary: >
      Every page's shared nav menu must maintain a top gap (body top padding).
      A page that zeroes body padding jams the menu against the viewport top.
    source_ref:
      - scripts/check_nav_gap.py
      - "PR #471"
    severity: hard
    check_script: scripts/check_nav_gap.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: nav-gap
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: false
    selftest_exempt_reason: >
      Covered by tests/test_check_nav_gap.py.
    allowlist: null
    ratchet: null
    known_limits:
      - Scans committed site/ HTML; does not cover pages generated only at runtime.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.nav_mega
    summary: >
      Every page that renders the shared nav must carry the Research mega-menu.
      An out-of-loop or hand-static page can freeze the nav without the mega-menu.
    source_ref:
      - scripts/check_nav_mega.py
    severity: hard
    check_script: scripts/check_nav_mega.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: nav-mega
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: false
    selftest_exempt_reason: >
      No dedicated selftest; the check is deterministic over committed site HTML.
    allowlist: null
    ratchet: null
    known_limits:
      - Only catches pages already committed to site/; new pages built outside the
        render loop are not caught until they land in site/.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: ui.title_i18n
    summary: >
      Translated (CJK / t() / zh-interpolated) text must never appear inside HTML
      title= attributes. The dual-span l-en/l-zh mechanism cannot operate in
      attributes, so a bilingual title= renders both languages mashed together.
      Law source: CLAUDE.md ("no translated text in title= attributes").
    source_ref:
      - scripts/check_title_i18n.py
      - CLAUDE.md
    severity: hard
    check_script: scripts/check_title_i18n.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: title-i18n
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; scans template source deterministically.
    allowlist: null
    ratchet: null
    known_limits:
      - Scans templates/ source; does not re-scan rendered site/ HTML.
    owner_program: engine-fix-masterplan
    notes: null

  # ── Git hygiene ────────────────────────────────────────────────────────────

  - law_id: git.no_conflict_markers
    summary: >
      No committed file may contain literal git conflict markers
      (<<<<<<< / ======= / >>>>>>>). A merge once shipped markers inside
      templates/dashboard.html.j2; Jinja treats them as plain text, so they
      rendered visibly. Selftest proves the guard fires before it is trusted.
    source_ref:
      - scripts/check_conflict_markers.py
      - "2026-07-03 incident"
    severity: hard
    check_script: scripts/check_conflict_markers.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: conflict-markers
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Scans templates/, engine/, scripts/, site/; does not cover binary or
        gitignored files.
    owner_program: engine-fix-masterplan
    notes: >
      Selftest flag is spelled --self-test (hyphenated).

  # ── Epistemics guards ──────────────────────────────────────────────────────

  - law_id: epistemics.validated_claims
    summary: >
      Every affirmative use of the word "validated" (EN + ZH "已验证") in
      user-facing surfaces must trace to a stored, leak-free, pre-registered
      artifact or an allowlisted justification. Negated/hedged uses are ignored.
      Law source: CLAUDE.md ("The word 'validated' in user-facing text is
      CI-enforced").
    source_ref:
      - scripts/check_validated_claims.py
      - CLAUDE.md
      - "PREREGISTRATION.md §4, D2 §4.3"
    severity: hard
    check_script: scripts/check_validated_claims.py
    ci_wiring:
      - workflow: .github/workflows/cycle-calibration.yml
        job: calibrate
        lane: scheduled
      - workflow: .github/workflows/ci.yml
        job: validated-claims
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: true
    allowlist: data/regime/validated_claims_allowlist.json
    ratchet: null
    known_limits:
      - Scans templates/, site/*.js, generated *_data.js only; does not scan
        research/*.md (frozen Fable ruling 2026-07-06 — see
        epistemics.research_docs_not_scanned).
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: epistemics.trial_registration
    summary: >
      Every multiple-testing harness (validate_* / *_phase0 scripts) must register
      its trial budget in the trial ledger. An unregistered harness makes DSR/kill/FDR
      deflation calculations dishonest.
    source_ref:
      - scripts/check_trial_registration.py
      - "engine/trial_ledger.py"
    severity: hard
    check_script: scripts/check_trial_registration.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: trial-budgets
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic scan over script names vs trial ledger.
    allowlist: inline
    ratchet: null
    known_limits:
      - Allowlist (LEGACY_UNREGISTERED) only shrinks; new scripts must register.
      - Scans script names by file pattern; does not parse script contents.
    owner_program: engine-fix-masterplan
    notes: >
      Allowlist is inline in the script (LEGACY_UNREGISTERED constant) and only shrinks.

  - law_id: epistemics.no_literal_ntrials
    summary: >
      No new code may call deflated_sharpe with a caller-asserted literal n_trials
      instead of ledger=; literal trial counts make budget tracking impossible.
    source_ref:
      - tests/test_no_literal_ntrials.py
    severity: hard
    check_script: tests/test_no_literal_ntrials.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: trial-budgets
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      This entry is a pytest suite, not a standalone script; pytest is the test runner.
    allowlist: inline
    ratchet: null
    known_limits:
      - Allowlist (LEGACY_LITERAL_NTRIALS) only shrinks.
    owner_program: engine-fix-masterplan
    notes: >
      check_script points at the test file because enforcement is via pytest, not a
      standalone guard script. This suite ran in NO workflow until 2026-07-06 — the
      registry wiring pass caught the gap and the file was added to the trial-budgets
      pytest invocation the same day.

  - law_id: epistemics.badge_passport
    summary: >
      Every conviction badge rendered in a desk brief must carry a provenance
      passport. A badge without a passport is an unearned claim.
    source_ref:
      - scripts/check_badge_passport.py
      - "engine/passport.py"
      - "audit #41"
    severity: hard
    check_script: scripts/check_badge_passport.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: outcome-spine
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic scan over site/ HTML.
    allowlist: inline
    ratchet: null
    known_limits:
      - Allowlist (LEGACY_NO_PASSPORT) is fully drained — no new items allowed.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: epistemics.claim_passport
    summary: >
      Every qual-ladder field that reaches a scored consumer must have a registered
      claim passport entry in config/qual_ladder.yml. Grandfathered debt entries
      (state=DISPLAY) must be cleared once the §3 gate passes.
    source_ref:
      - scripts/check_claim_passport.py
      - config/qual_ladder.yml
    severity: hard
    check_script: scripts/check_claim_passport.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: house-law-registry
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic scan over engine/*.py vs qual_ladder.yml.
      Script exits 0 on the live repo (15 grandfathered DEBT entries, PASS result).
    allowlist: config/qual_ladder.yml
    ratchet: null
    known_limits:
      - 15 grandfathered DEBT entries (altdata.signal_score, policy.dir) are
        DISPLAY-state (gated); must be cleared once §3 gate passes.
      - ADVISORY unregistered fields (31+) are printed but do not fail the check.
    owner_program: qualitative-intelligence-masterplan
    notes: >
      Wired into house-law-registry job (exit 0 confirmed 2026-07-06).

  # ── Contracts guards ───────────────────────────────────────────────────────

  - law_id: contracts.reliability_contract
    summary: >
      A field that has been gated out (reliability state < threshold) must not
      render directionally in any template or site page. Audit #46.
    source_ref:
      - scripts/check_reliability_contract.py
      - "audit #46"
    severity: hard
    check_script: scripts/check_reliability_contract.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: trial-budgets
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic scan over site/ and templates/.
    allowlist: null
    ratchet: null
    known_limits:
      - Literal-path scan; does not catch dynamically computed field references.
    owner_program: engine-fix-masterplan
    notes: null

  - law_id: contracts.artifact_drift
    summary: >
      Each artifact in site/factordata/contracts/artifact_manifest.json must not
      drift from the live artifact's actual top-level JSON fields. Schema drift
      between producer and consumer is invisible at trade time without this gate.
    source_ref:
      - scripts/check_contract_drift.py
      - "site/factordata/contracts/artifact_manifest.json"
      - "NW Rails PR-7 R4"
    severity: warn
    check_script: scripts/check_contract_drift.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: contract-drift
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic comparison of manifest vs live artifacts.
    allowlist: null
    ratchet:
      date: "2026-07-13"
      action: >
        Drop --warn-only in the ci.yml contract-drift job step AND flip this
        entry's severity warn->hard in the same PR (the script's default is
        already hard-fail; keep step and registry in lockstep).
    known_limits:
      - Wildcard artifacts (per_stock_intel, per_stock_signal) are skipped when
        no live sample is present — normal on CI runners.
    owner_program: nw-rails-lobes
    notes: null

  - law_id: contracts.board_contradictions
    summary: >
      The standout board must not show loud labels that contradict its own quiet
      fields: FRESH on stale/extended cross, urgency=imminent on blocked label,
      green band on Lagging verdict, negative-alpha slot-1 while positive-alpha
      rows exist in the same lane.
    source_ref:
      - scripts/check_board_contradictions.py
      - "engine/desk_scorer.py"
    severity: hard
    check_script: scripts/check_board_contradictions.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: board-contradictions
        lane: pr_ci
      - workflow: .github/workflows/pages.yml
        job: publish
        lane: publish
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic validation of JSON artifact fields.
    allowlist: null
    ratchet: null
    known_limits:
      - PR gate skips when the artifact is not touched by the PR (deploy-gate
        twin in pages.yml covers every fresh render).
    owner_program: us-stocks-prebreakout
    notes: null

  # ── Cycles guards ──────────────────────────────────────────────────────────

  - law_id: cycles.cross_page_consistency
    summary: >
      The same instrument must show the same pos_v2/phase_v2 across every page
      that renders it (cycle / country_cycles / markets / sector), within
      tolerance, or carry a declared basis label.
    source_ref:
      - scripts/check_cycle_consistency.py
      - "W3.6 ruling R3-M3"
    severity: hard
    check_script: scripts/check_cycle_consistency.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: cycle-consistency
        lane: pr_ci
    selftest: false
    selftest_exempt_reason: >
      No selftest flag; deterministic cross-page scan of committed site/ JSON.
    allowlist: null
    ratchet: null
    known_limits:
      - Tolerance is set by the checker; basis labels must be machine-readable.
    owner_program: cycle-intelligence
    notes: null

  - law_id: cycles.ontology_js_sync
    summary: >
      The committed site/cycle_ontology.js must exactly match what
      engine/cycle_ontology.py produces at HEAD. A stale committed JS is
      especially dangerous around the ONTOLOGY_AXIS flag-day axis-flip.
    source_ref:
      - scripts/gen_ontology_js.py
      - engine/cycle_ontology.py
      - "W1.5 A10/A12 ruling"
    severity: hard
    check_script: null
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: cycle-ontology-js
        lane: pr_ci
    selftest: false
    allowlist: null
    ratchet: null
    known_limits:
      - Enforced by `python3 -m scripts.gen_ontology_js --check` (diff mode);
        does not validate semantic correctness of the ontology itself.
    owner_program: cycle-intelligence
    notes: >
      check_script is null because enforcement is via gen_ontology_js --check
      (a generator in diff/check mode), not a dedicated check_*.py script.

  # ── Authority guards ───────────────────────────────────────────────────────

  - law_id: authority.cycle_pattern
    summary: >
      No Article-2 money-path module (alert_triage / board_ordering / top_setups)
      may read the cycle-pattern lake (data/cycle_pattern/). The CPI substrate is
      display-only (context tier); lake outputs must never reach scored/board/alert
      pipelines.
    source_ref:
      - scripts/check_cycle_pattern_authority.py
      - "CPI P2"
    severity: hard_for_protected_paths
    check_script: scripts/check_cycle_pattern_authority.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: cycle-pattern-authority
        lane: pr_ci
      - workflow: .github/workflows/cycle-calibration.yml
        job: calibrate
        lane: scheduled
    selftest: true
    allowlist: inline
    ratchet: null
    known_limits:
      - Literal-path scan only; misses dynamic path construction (e.g.
        f"data/cycle_pattern/{name}") that assembles the forbidden path at runtime.
      - _ALLOWED_READER_PREFIXES list: money-path modules are never exemptable.
    owner_program: cycle-intelligence
    notes: null

  - law_id: authority.research_factory
    summary: >
      No Article-2 money-path module may read data/research_factory/ or import
      engine.research_factory. The factory is display-only (A0-A2 ceiling);
      factory outputs must never reach scored/board/alert pipelines.
    source_ref:
      - scripts/check_research_factory_authority.py
      - "RF-11 Research Factory W1"
    severity: hard_for_protected_paths
    check_script: scripts/check_research_factory_authority.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: research-factory-authority
        lane: pr_ci
    selftest: true
    allowlist: data/research_factory/authority_allowlist.json
    ratchet:
      date: "2026-09-15"
      action: >
        Bare-WARN debt drained 2026-07-06 (all 23 non-Article-2 readers declared in
        authority_allowlist.json). Remaining: operator review of the 4 cycle_pattern
        cross-lake entries (apply_cycle_pattern_lattice_batch2_outcomes writes factory
        transitions; 3 truth_guard flag-only importers) — ratify or remove their
        allowlist entries, then set this ratchet to null.
    known_limits:
      - Literal-path scan only; misses dynamic path construction.
    owner_program: research-factory
    notes: null

  # ── Neural Web guards ──────────────────────────────────────────────────────

  - law_id: nw.synapse_registry
    summary: >
      The synapse.yml registry must be internally consistent: all paths exist,
      enums are valid, no duplicate artifact paths.
    source_ref:
      - scripts/check_synapse_registry.py
      - config/synapse.yml
    severity: hard
    check_script: scripts/check_synapse_registry.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: synapse-read-gate
        lane: pr_ci
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Validates registry internal consistency; does not verify that artifact
        content matches the declared schema.
    owner_program: neural-web
    notes: null

  - law_id: nw.synapse_reads
    summary: >
      Every file that reads a registered synapse artifact must either appear in the
      baseline or be declared in config/synapse.yml. Article-2 money-path violations
      are hard-fail; other undeclared reads are warn-tier.
    source_ref:
      - scripts/check_synapse_reads.py
      - data/neuralweb/read_gate_baseline.json
      - config/synapse.yml
    severity: hard_for_protected_paths
    check_script: scripts/check_synapse_reads.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: synapse-read-gate
        lane: pr_ci
    selftest: true
    allowlist: data/neuralweb/read_gate_baseline.json
    ratchet: null
    known_limits:
      - Literal-path scan only; misses string-assembled artifact paths.
    owner_program: neural-web
    notes: >
      Allowlist also includes config/synapse.yml consumer declarations.

  - law_id: nw.factor_boundaries
    summary: >
      No Article-2 module may write to synapse artifact paths or reference
      forbidden fields (RUL-NW9/NW11 display-only law). Factor outputs are
      display-only and must never reach scored/alert pipelines.
    source_ref:
      - scripts/check_factor_boundaries.py
      - "RUL-NW9 RUL-NW11"
    severity: hard
    check_script: scripts/check_factor_boundaries.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: synapse-read-gate
        lane: pr_ci
    selftest: true
    allowlist: inline
    ratchet: null
    known_limits:
      - Literal-path scan; does not catch dynamically constructed paths.
      - Inline _ALLOWED_ACTIONS_ALLOWLIST_PREFIXES exempts allowed_actions
        readers; editing that list silently widens the exemption.
    owner_program: factor-intelligence
    notes: null

  - law_id: nw.dag_conformance
    summary: >
      The per-workflow build-module sequences declared in config/dag.yml must
      exactly match the live .github/workflows/ files. Any undeclared drift
      (lane mismatch not covered by a divergences entry) fails CI.
    source_ref:
      - scripts/check_dag_conformance.py
      - config/dag.yml
      - "Neural Web W5a"
    severity: hard
    check_script: scripts/check_dag_conformance.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: dag-conformance
        lane: pr_ci
    selftest: true
    allowlist: config/dag.yml
    ratchet: null
    known_limits:
      - Textual (AST-level) lane comparison; does not verify execution ordering
        across parallel bands.
      - Two suspect drift entries exist from W5a adoption and are tracked but
        not yet resolved.
    owner_program: neural-web
    notes: >
      Allowlist is config/dag.yml divergences section.

  - law_id: nw.evidence_clock_display_only
    summary: >
      The Global Evidence Clock artifact (data/neuralweb/evidence_clock.json)
      is display-only attention routing: authority must be display_only, every
      row must carry promote/mutate_source_state in forbidden_actions, states
      must stay inside the 9-state vocabulary, clock_ids must be unique, and
      summary counts must match rows. The builder reads every clock source and
      may never mutate one (EC-R1..R8).
    source_ref:
      - scripts/check_evidence_clock.py
      - research/evidence_clock/ADJUDICATION_BY_FABLE.md
    severity: hard
    check_script: scripts/check_evidence_clock.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: evidence-clock
        lane: pr_ci
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - Validates the committed artifact structurally; the builder's read-only
        runtime invariance is enforced by unit tests and review, not this gate.
    owner_program: neural-web
    notes: null

  - law_id: nw.ruling_graph_conflicts
    summary: >
      Ruling Graph guard (RUL-CL-6/7/8): a new fdr_family token in changed files
      must be declared in the ruling graph's known_fdr_families (H1, hard); a
      privacy-boundary token must never reach site/ or scripts that write to
      site/ (H2 BRIDGE law, hard). Warn tier: re-proposal of a killed/deferred
      idea without citing its ruling_id (W1) and expired come_back_on clocks (W2).
    source_ref:
      - scripts/check_ruling_conflicts.py
      - research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
      - config/ruling_graph.yml
    severity: hard
    check_script: scripts/check_ruling_conflicts.py
    ci_wiring:
      - workflow: .github/workflows/ci.yml
        job: ruling-graph
        lane: pr_ci
    selftest: true
    allowlist: config/ruling_graph.yml
    ratchet: null
    known_limits:
      - Deterministic substring matching only; W1 re-proposal detection can
        false-positive on benign mentions of a killed idea's match_term.
    owner_program: neural-web
    notes: >
      Registered by the evidence-clock PR as census catch-up — the script
      shipped in #1795 in a race with the #1793 meta-guard census.

  - law_id: nw.entity_thesis_registry
    summary: >
      ETM integrity gate: data/neuralweb/entity_thesis_mechanism_registry.json
      must keep schema/authority discipline (all rows display_only,
      is_context_only true), namespace grammar per registry_type, no invented
      links (every edge carries source.path + source.detail and resolvable
      endpoints), suggestion-only duplicate flags, recomputable counts, and
      referential integrity against species/candidates/trial-ledger sources
      (ETM-C1..C7).
    source_ref:
