  - law_id: design.system_ratchet
    summary: >
      The design system can only hold if drift is measured before it is banned.
      templates/ carries ~19k hand-rolled decisions the token layer already owns
      — colour literals, font stacks, raw radii, shadow palettes declared as
      custom properties in page-scoped selectors — and each one is a surface that
      will diverge the next time theme.css moves. A gate that reds on all of them
      on day one is a gate somebody disables in week one, so this guard ships
      REPORT-ONLY (R0): it prints per-rule counts plus capped exemplars on every
      PR and always exits 0. The blocking arm is written and tested from the same
      commit rather than deferred — `--mode enforce` exits non-zero on the four
      mechanical rules (colour literal, font-family literal, non-token
      border-radius, literal-valued custom property outside theme.css) — but it
      only ever looks at templates a page-registry row marks
      `design_system.compliant`, or at templates the registry has never seen.
