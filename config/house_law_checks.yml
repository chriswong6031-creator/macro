        job: workflow-yaml
        lane: pr_ci
    selftest: true
    allowlist: null
    ratchet: null
    known_limits:
      - >-
        PyYAML (YAML 1.1) is not GitHub's exact parser; semantic errors GitHub
        rejects (bad expression syntax, unknown keys) can still pass here. The
        guard covers the observed lethal class: parse failure and missing
        on:/jobs: blocks.
    owner_program: null
    notes: >
      Complements nw.dag_conformance (lane-sequence drift on declared lanes)
      by asserting bare loadability of ALL workflow files, lane or not.

  - law_id: ops.runner_routing_policy
    summary: >
      Public-repository pull-request workflows remain exactly GitHub-hosted during
      Wave B/C, cannot delegate through reusable-workflow call jobs, and cannot
      consume the bounded PC/M1 migration labels. Only registered main-branch
      workflow-dispatch canaries may request those labels, downstream of a hosted
      trust gate. PC render and CI labels remain disjoint and the M1 canary cannot
      regain a broad production label.
    source_ref:
