  - lanes: [engine-render]
    differs: >
      build_world_state runs BEFORE the render band in engine-render (as the W1 express-lane
      step, lines 146/148), whereas in daily.yml it is the LAST serial step after the band.
    reason: >
      The express lane places world_state immediately after engine.run to give the render
      band an up-to-date world state. The nightly places it last because many band outputs
      (oracle_state, alerts_triage) contribute to it. Both placements are deliberate and
      serve different freshness objectives.
    evidence: engine-render.yml:109-131 (recompute step includes build_world_state at line 146)

  - lanes: [engine-render, render]
