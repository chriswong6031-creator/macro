# MODULES — 25-module IO table from the W5a scout
# (reads, writes, impure, needs_secrets, event_driven flags)
# ---------------------------------------------------------------------------
modules:

  - module: engine.run
    reads:
      - data/macro/*.parquet
      - data/fred/*.parquet
      - data/stocks/*.parquet
      - data/breadth/breadth.parquet
      - data/bonds/bond_health.json
      - data/forex/latest.json
      - data/risk_radar/forward_log.parquet
      - data/signal_archive/mtf_signals_latest.json
      - data/regime/regime_one.json
      - site/vol/regime.json
    writes:
      - data/regime/latest.json
      - data/regime/regime_history.parquet
      - data/regime/base_effect_fwd.jsonl
      - data/regime/regime_one.json
      - data/regime/regime_vector.parquet
    impure: false
    needs_secrets: false
    event_driven: false

  - module: scripts.build_signal_quality
    reads:
      - data/stocks/*.parquet
      - data/intraday/<T>.parquet
    writes:
      - site/signals/<SYM>.json
      - data/signal_archive/mtf_signals_latest.json
    impure: false
    needs_secrets: false
    event_driven: false

  - module: scripts.build_fundamental_forensics
    reads:
      - data/edgar/statements_quarterly.parquet
      - data/edgar/statements.parquet
      - data/edgar/fundamentals.parquet
      - data/universe/membership.parquet
      - data/breadth/ticker_sectors.parquet
      - data/fundamental_forensics/private/disclosures/<TICKER>.json
    writes:
      - data/fundamental_forensics/private/state.json.gz
      - site/fundamental_forensics.html
      - site/fundamental_forensics.css
      - site/fundamental_forensics.js
    impure: false
    needs_secrets: false
    event_driven: false
    note: >
      Broad-universe normalized projection with optional bounded accession-aware disclosure
      slices prebuilt by the separate private source spine. Neither lane has trading authority.
      The local state is gitignored and a credentialed --publish-only step copies it to the
      private Research Vault R2 bucket after validation and byte-for-byte read-back.

  - module: scripts.run_fundamental_forensics_wave2
    reads:
      - data/fundamental_forensics/raw/<CIK>/submissions/latest.json
      - data/fundamental_forensics/archive/manifests/<CIK>/*/manifest.json
      - r2://private-research/fundamental_forensics/sec-source/v1/latest.json
    writes:
      - data/fundamental_forensics/raw/<CIK>/submissions/*.json.gz
      - data/fundamental_forensics/archive/objects/sha256/*/*.bin.gz
      - data/fundamental_forensics/archive/manifests/<CIK>/*/manifest.json
      - data/fundamental_forensics/private/disclosures/<TICKER>.json
      - r2://private-research/fundamental_forensics/sec-source/v1/latest.json
    impure: true
    needs_secrets: true
    event_driven: false
    note: >
      Explicit operator/collect-lane SEC source spine only. It restores a verified
      private snapshot, fetches at most the configured comparable 10-K/10-Q documents
      for an explicit capped issuer list, builds local disclosure projections, then
      read-back-verifies the next immutable private snapshot. It never renders or
      publishes browser state, never walks a universe, and never mirrors SEC source
      bytes into git or a public bucket.

  - module: scripts.build_site
    reads:
