# DIVERGENCES — declared lane-difference ledger
# Two kinds:
#   documented: {lanes, differs, reason, evidence}  — intentional, no CI red
#   suspect:    {lanes, differs, status: suspect, note}  — undocumented drift,
#               stays visible in every checker run; only SHRINKS (each entry
