meta:
  schema_version: 1
  description: >
    Neural Web W5a — per-workflow-step lane inventory with cluster units as first-class
    entries. Each lane maps one (workflow, job) pair to its ordered build-module steps.
    A step is either {id, module} (serial) or {id, cluster: {cl_name: [module, ...]}}
    (parallel band). The conformance checker (scripts/check_dag_conformance.py) diffs
    these declared sequences against the live YAML workflows and exits 1 on any mismatch
    not covered by a divergences entry.
  granularity: workflow-step

# ---------------------------------------------------------------------------
# LANES — one entry per (workflow, job) that invokes build modules
# ---------------------------------------------------------------------------
lanes:

  # ── daily.yml / collect ──────────────────────────────────────────────────
  - workflow: .github/workflows/daily.yml
    job: collect
    steps:
      - id: fetch_r2_attention
        module: scripts.fetch_r2
        args: [--dirs, attention]
        note: >
          SLF-048 attention store restore (#1677) — data/attention/*.parquet are
          gitignored (R2 data plane, deep history 2015-07→). Runs BEFORE the
          collectors so wiki_pageviews' ~120d upsert extends deep history instead
          of rebuilding a shallow window. continue-on-error; the publish-back step
          at the end of this lane is gated on this step's outcome.
      - id: collect_us
        module: scripts.collect
        args: [--exclude-group, asia, --exclude, sam_gov_opportunities, --skip-shadow-importance]
        note: >
          SAM opportunities are excluded because government-revenue-live is the
          sole serialized SAM ledger writer. After this daily checkpoint lands,
          a synchronous reusable-workflow call makes that same dedicated lane
          fold changed USAspending evidence before engine context readers start.
          fetch_finviz_themes also runs in this step but is called as
          'python scripts/fetch_finviz_themes.py' (not python -m), so the
          conformance parser cannot extract it via _PYTHON_M_RE. It is intentionally
          omitted from the declared module list to keep parser output consistent.
          --skip-shadow-importance (2026-07-14 collect split): the ~13-14m
          shadow_importance_v0 + _pit passes run standalone in the collect_tail
          lane below, off the engine job's critical path. The forward-ledger
          graders (grade_breadth_divergence / grade_policy_calendar /
          grade_qledger) STAY inside this step (COLLECT_LANE=nightly) — the
          nightly sole-advancer law is untouched by the split.
      - id: compile_capital_structure_events
        module: scripts.compile_capital_structure_events
        note: >
          Capital Structure Intelligence W0-W1 offline compiler. Runs after the
          SEC collector closes verified source bundles and before the data
          checkpoint, so an integrity failure blocks publication of a partial
          event generation. Context-only; it has no rank, size, gate, trade, or
          Prophet authority.
          The preceding collect step also runs the separate bounded Company Facts
          source intake only after verified complete-submission anchors exist. That
          collector publishes its own source-manifest/coverage receipt and is not an
          input to this event compiler or a share-count ledger consumer.
      - id: compile_capital_structure_document_terms
        module: scripts.compile_capital_structure_document_terms
        note: >
          Capital Structure Intelligence W2B precision-first direct SEC fee-table
          transcription. Reads primary/EX-FILING FEES children from complete submissions
          only through the exact named source-manifest store namespace, emits row/security-
          scoped decimal strings and exact cell spans, and fails on missing/mismatched bytes. It does not aggregate
          rows or create instruments, remaining capacity, risk, probability, ranking,
          sizing, entry, or Prophet authority.
      - id: build_capital_structure_projection
        module: scripts.build_capital_structure_projection
        note: >
          Offline deterministic observed-filing-state projection. It verifies the
          event compiler's telemetry-last receipt before publishing a canonical JSON
          artifact and byte-identical public twin. Context-only; unknown terms and
          issuer-state capabilities remain explicitly unavailable.
      - id: audit_massive_store
        module: scripts.audit_massive_store
        note: >
          Content tripwire for the whole-market daily store, given its OWN step
          because this lane runs --exclude-group asia and scripts/collect.py skips
          the entire run_quality_audits gate on any partial run (--only / --group /
          --exclude-group) — so this audit had never executed nightly, and the
          2026-07 freeze ran 18 sessions behind that hole with zero coverage.
          continue-on-error: the module bare-prints line-start ::error/::warning
          annotations and exits 1 on a content fail, and the night's commit must
          stay safe; those annotations plus the engine job's strict audit_r2 anchor
          carry the alarm. COLLECT_LANE=nightly is load-bearing — the store-absent
          skip path only annotates on that lane, so without it the "restore failed
          -> store did not advance" warning is never emitted. Writes
          data/quality/massive_store_audit.json (picked up by "commit data").
      - id: publish_r2_attention
        module: scripts.publish_r2
        args: [--dirs, attention]
        note: >
          SLF-048 attention publish-back (#1677) — the day's upserted increments
          ride back to R2 so tomorrow's restore + the render-side restores read a
          CURRENT deep store. Gated on fetch_r2_attention's outcome (a shallow
          rebuild after a failed restore must never clobber 11y of history; the
          append-only guard + bytes floor in publish_r2 are the second fence).
          Runs AFTER "commit data" so the data commit is never delayed. Non-fatal.

  # ── daily.yml / collect_tail ─────────────────────────────────────────────
  # 2026-07-14 collect split: the slow post-adapter accrual band (ThetaData
  # tape-flow, TIL organs, shadow-importance, qledger backfill) moved here from
  # the collect job so the engine job (needs: collect) starts ~30-75m earlier.
  # needs: collect → a fresh checkout+pull reads tonight's committed stores.
  # Engine does NOT wait on this job; every same-night reader of these outputs
  # tolerates ≤1-run-stale data (the factor_series sibling contract).
  - workflow: .github/workflows/daily.yml
    job: collect_tail
    steps:
      - id: tape_flow_forward
        module: scripts.build_tape_flow_daily
        args: [--mode, forward]
        note: >
          T2a tape-flow features — forward accrual (options-tape P2.x, #1435).
          Prior-trading-day trade+NBBO tape for the gex_symbols() universe via
          ThetaData wildcard-bulk; aggregates inline to signed-flow features.
          Non-fatal: terminal absent or any error warns and continues.
          outputs: [data/tape_flow/daily/*.parquet, data/tape_flow/_state.json]
      - id: tape_flow_episodes
        module: scripts.build_tape_flow_daily
        args: [--mode, episodes, --budget-minutes, "30"]
        note: >
          T2a episode-window backfill (#1441) — Tier-S episodes 2022→, ETF anchors.
          Hard-stop at 30 min (budget_deadline); state resumes next night.
          Runs AFTER the forward step so the daily row always lands first. Non-fatal.
      - id: tape_flow_etf_history
        module: scripts.build_tape_flow_daily
        args: [--mode, etf-history, --budget-minutes, "20"]
        note: >
          T2a ETF-history backfill (#1441) — 20 ETF anchors, full history 2017→.
          Hard-stop at 20 min; runs last of the three tape-flow steps. Non-fatal.
      - id: collect_dol_certs
        module: scripts.collect_dol_certs
        note: >
          TIL W7 (PR-W7) DOL foreign-labor-certification quarterly ingest.
          Off the render critical path. Detects newest quarterly LCA/PERM
          disclosure file not yet ingested, downloads, normalizes to compact
          store data/dol_certs/certs.parquet (runner-local, gitignored).
          No-ops in seconds when no new quarter exists.
          Env override: DOL_CERTS_STORE. Always exits 0 (tolerant).
      - id: build_hiring_velocity
        module: scripts.build_hiring_velocity
        note: >
          TIL W7 (PR-W7) per-basket hiring-intent velocity (collect lane).
          Cheap once certs.parquet exists — pure in-memory aggregation, no
          network calls. Produces data/dol_certs/hiring_velocity.json
          (runner-local) + site/basketdata/hiring_intent.json (git-tracked).
          FENCE: cert_velocity_z is a SEPARATE display leg — never fused
          into fused_obs_z. Employer→ticker via lib.warn_fuzzy.
          Always exits 0 (tolerant; absent store → honest null written).
      - id: collect_census_trade
        module: collectors.census_trade
        note: >
          TIL W8 (PR-W8) Census HS-code import-flow monthly ingest.
          Off the render critical path. Fetches monthly general import value
          (GEN_VAL_MO) and quantity (GEN_QY1_MO) from Census International
          Trade API (api.census.gov/data/timeseries/intltrade/imports/hs)
          for 29 curated HS-codes across 11 onshoring/substitution themes.
          Requires CENSUS_API_KEY env var (API is NOT keyless — verified
          2026-07-09; keyless returns 302). No-ops with honest null if key
          absent. Backfills since 2018-01 on first run; incremental after.
          Hard-capped at 450 requests/run (--max-requests; documented API
          limit is 500/day/key) — the ~2,900-request first backfill
          self-chunks across ~7 nightly runs via the state file.
          Output: data/trade_flows/imports_monthly.parquet (git-stored, small).
          State: data/trade_flows/census_state.json.
          Per-code failure isolation: one bad HS code never voids others.
          Missing-month safety: newest month 404 never stops older months.
          Always exits 0 (tolerant).
      - id: build_theme_trade_flows
        module: engine.theme_trade_flows
        note: >
          TIL W8 (PR-W8) per-theme import-flow YoY/acceleration rollup.
          Reads data/trade_flows/imports_monthly.parquet (git-stored).
          Pure in-memory aggregation, no network calls.
          Produces:
            data/neuralweb/theme_trade_flows.json  (git-tracked)
            site/basketdata/trade_flows.json       (git-tracked; compact)
          Sign convention: rising_imports_confirms = more imports confirms
          theme demand; falling_imports_confirms = import decline confirms
          domestic-substitution (onshoring). No composite across themes.
          FENCE: SEPARATE display leg — never fused into fused_obs_z.
          Always exits 0 (tolerant; absent parquet → honest null written).
      - id: collect_clinicaltrials_themes
        module: collectors.clinicaltrials_themes
        note: >
          TIL W10 (PR-W10) ClinicalTrials.gov theme-level pipeline density ingest.
          Off the render critical path. Runs nightly; FULL FETCH from 2018-01-01
          on every run (no incremental mode — CT.gov v2 API exposes only current
          study state; per-study update detection not feasible without full scan).
          Deduplication by (modality_id, nct_id) keep-first prevents double-counting.
          State file (ct_themes_state.json) records last-ingest date per modality
          for monitoring only — does NOT gate fetch scope.
          Fetches INDUSTRY-sponsored studies from the v2 API (keyless — verified
          2026-07-09) for 9 curated modalities across 3 health-adjacent themes
          (glp1_obesity, diagnostics_lifesci, medical_devices).
          INDUSTRY filter: AREA[LeadSponsorClass]INDUSTRY.
          Per-modality isolation: one bad modality never voids the run.
          PIT law: keyed by studyFirstPostDate; ingest_date stored separately;
          vocabulary_version stamps query definition.
          PHASE NOTE: API returns only current phase (non-PIT for backfill rows).
          Output: data/clinical_trials/modality_monthly.parquet (git-stored, small).
          State: data/clinical_trials/ct_themes_state.json (monitoring only).
          Env override: CLINICAL_THEMES_STORE.
          Always exits 0 (tolerant).
      - id: build_theme_clinical
        module: engine.theme_clinical
        note: >
          TIL W10 (PR-W10) per-theme clinical-pipeline capital-commitment rollup.
          Reads data/clinical_trials/modality_monthly.parquet (git-stored).
          Pure in-memory aggregation, no network calls.
          Like-month YoY law: all YoY comparisons use trailing-12m vs prior-12m
          window (seasonal registration patterns cancel).
          Produces:
            data/neuralweb/theme_clinical.json   (git-tracked; NW artifact)
            site/basketdata/clinical_pipeline.json (git-tracked; compact site)
          Outputs: registration velocity YoY, enrollment-commitment trend,
          phase-distribution read (phase at ingest — near-PIT for trailing-12m
          registrations; backfill prior-window phase is upper-biased toward late
          phase; cross-cohort comparison is confounded and not published as
          "migration" signal). FENCE: SEPARATE display leg — never fused into
          fused_obs_z. Always exits 0 (tolerant; absent parquet → honest null).
      - id: build_theme_options_witness
        module: engine.theme_options_witness
        note: >
          TIL W11 (PR-W11) per-theme options-tape crowding-hazard witness.
          Reads from ThetaData EOD store (THETADATA_STORE env;
          /Users/chriswong/theta-ops-wt/data/thetadata_eod default; runner-local).
          STORE ABSENT → keep-last-real: committed real legs newer than 6d are
          kept (write skipped); otherwise honest null artifact emitted. Exit 0
          either way. This step is dispatched from the launchd ops-wt lane with
          THETADATA_STORE set (same pattern as com.mastermind.optionshub, plus
          a commit+push tail in run_theme_options_witness.sh); since the
          2026-07-26 theta-m1 runner pin the collect_tail lane also runs
          store-bearing (the M1 host holds the store — real path, ~4.6m
          measured), while on any store-less runner (render path, dev worktree)
          it stays a fast no-op that keeps or null-refreshes the artifact per
          the keep-last-real law.
          Three legs (no composite — R-TIL-3 / WA-R1):
            Leg A: call-OI HHI concentration per basket (median HHI across members)
            Leg B: put/call OI ratio (PCR) per basket — EXIT-CROWD L3 accrual
            Leg C: IV premium vs realized-vol (event-premium hazard)
          OI timing law: oi[t-1] throughout (same-day OI = lookahead bug).
          Bounded reads: current + prior year only; theme baskets only (18 themes).
          Coverage suppression: baskets with <40% member OI coverage → null legs.
          Per-underlying isolation: one bad root never voids the basket.
          Produces:
            data/neuralweb/theme_options_witness.json  (git-tracked; NW artifact)
            site/basketdata/options_witness.json        (git-tracked; compact site)
          HAZARD framing only: high = crowded/fragile, never bullish.
          FENCE: SEPARATE display leg — never fused into any score.
          Authority: all may_rank/gate/size/escalate=false; is_context_only=true.
          Banned: DOI family (dead W-E1); skew-deceleration (unsupported).
          Always exits 0 (tolerant).
      - id: build_discovery_confluence
        module: scripts.build_discovery_confluence
        note: >
          TIL W9 (PR-W9) two-source early-discovery confluence (off render path).
          Runs edgar_phrase_velocity (FTS hit counts from data/edgar/*.parquet)
          and theme_adoption (GitHub star velocity from data/github/repo_stars.parquet),
          then joins the two legs to emit discovery candidates.
          Outputs:
            site/basketdata/phrase_velocity.json  (git-tracked)
            site/basketdata/github_adoption.json  (git-tracked)
            data/neuralweb/discovery_confluence.json  (git-tracked)
          Runner-local parquets in data/edgar_phrase_velocity/ (gitignored;
          env override: EDGAR_PHRASE_VELOCITY_STORE).
          NO LLM. Deterministic n-gram/statistics only.
          DISPLAY/WATCHLIST — all outputs may_rank/may_gate/may_size/may_escalate=false.
          Always exits 0 (tolerant; absent stores → honest nulls written).
      - id: shadow_importance_v0
        module: scripts.shadow_importance_v0
        note: >
          importance_v0 SHADOW lane (W3) — scores the full US+CN qbus store and
          registers HIGH/LOW band claims (idempotent salts). Moved out of
          scripts.collect 2026-07-14 (collect split; collect-core passes
          --skip-shadow-importance) — ~13-14m combined with the _pit pass, the
          spike leg of the old 98.5m collectors step. Ordering vs grade_qledger
          is NOT load-bearing: the grader only grades claims matured ≥5d
          (engine/qledger._matured), so one-job-later registration never changes
          grading arithmetic. __main__ uses lib.procutil.hard_exit (#2196 —
          parquet one-shots can deadlock in pyarrow shutdown). Non-fatal.
      - id: shadow_importance_v0_pit
        module: scripts.shadow_importance_v0_pit
        note: >
          importance_v0 PIT-correct tape (W4) — the _pit families are the PRIMARY
          leak-free tape on the duel scoreboard; accrues nightly alongside W3.
          Same move/idempotency/hard_exit rationale as shadow_importance_v0 above.
      - id: backfill_qledger_us
        module: scripts.backfill_qledger_us
        note: >
          ALTDATA_REBOOT W2 (#2397) — per-channel qledger claim backfill: one
          claim family per real altdata claim; also registers new radar
          edge_snapshots and policy theses as qledger claims. Idempotent
          (stable claim_ids prevent duplicates). Reads data/altdata/theses.jsonl
          from tonight's collect-core commit; runs BEFORE "commit tail data" so
          claims.jsonl rides the same push. Non-fatal (step always exits 0).
      - id: corp_credit
        module: engine.corp_credit
        note: >
          CCW-W2 g-spread engine (§3-P2). Reads tonight's holdings from
          collect-core's commit (data/corp_bonds/holdings/*) + data/fred/DGS*.parquet
          (CMT curve) + data/corp_bonds/issuer_themes.json. Writes
          data/corp_bonds/series/{issuer_daily,theme_daily,sector_daily,market_daily,
          maturity_wall,bond_panel_latest}.parquet + data/corp_bonds/latest.json +
          data/corp_bonds/validation.json. Non-fatal (CCW-R16).
      - id: credit_momentum
        module: engine.credit_momentum
        note: >
          CCW-W3 credit momentum organ (§3-P3). Runs AFTER corp_credit (reads its
          series output). Reads archive-merged FRED spread series (hy_oas/ig_oas
          1996→, ladder ~3y), Moody's DBAA/DAAA, FINRA breadth/sentiment
          (data/corp_bonds/finra_*.parquet from W5 collector), yahoo ETF prices
          (LQD/HYG/TLT/IEF), theme/market series from corp_credit, and holdings
          snapshots for own-store breadth. Writes data/corp_bonds/credit_momentum.json
          and data/corp_bonds/forward_log.jsonl (keep-FIRST ledger).
          Spread velocity-percentile is PRIMARY; oscillator crosses SECONDARY per
          CCW-R15. Display-tier; authority all-false. Non-fatal (CCW-R16).
      - id: equity_earnings
        module: collectors.equity_earnings
        note: >
          MLC-W5 root-cause fix (rotation-miss postmortem #2576): equity_earnings
          existed but was never scheduled — earnings.parquet stayed empty and the
          W1.5 blackout gate + W5 chips fail-open stale. Sweeps Nasdaq's public
          calendar (~66 weekdays) → data/earnings/earnings.parquet (ticker-indexed:
          next_date, next_time, eps_forecast, surprises_json, surprises_as_of,
          as_of). Bot-wall-aware: a blocked first call keeps the existing cache and
          exits 0. ~3.5m/night (measured 07-29). Non-fatal.
          INVOKED BARE — no args means "whole breadth universe". Passing --tickers
          collapses the universe to that subset and leaves every other row on a
          frozen as_of; that is the 2026-06-19 freeze (a 3-name demo default in the
          module's __main__ pinned the nightly for six weeks). Writes
          data/earnings/earnings.parquet (git-tracked).
      - id: audit_earnings_freshness
        module: scripts.audit_earnings_freshness
        note: >
          MLC-W5 freshness tripwire. Reads the just-written earnings.parquet and
          fires ::warning:: on the exact postmortem failure shape (fresh as_of but
          0 / <50 rows, or rows present with zero next_dates) so a silent empty
          store surfaces loudly instead of gating nothing. Writes
          data/quality/earnings_freshness_audit.json. Non-fatal (never fails build).

  # ── daily.yml / engine ──────────────────────────────────────────────────
  - workflow: .github/workflows/daily.yml
    job: engine
    steps:
      - id: fundamental_forensics_sec_restore_acquire
        module: scripts.run_fundamental_forensics_wave2
        note: >
          Wave 2 Filing Forensics source spine (hard gate): restore the latest
          private, checksum-verified SEC raw/archive snapshot, then acquire a
          strictly bounded explicit issuer set. Partial SEC coverage fails this
          nightly lane before the compact state may be rebuilt or published.
          No public mirror and no render are involved.
      - id: fundamental_forensics_disclosure_project_sync
        module: scripts.run_fundamental_forensics_wave2
        note: >
          Wave 2 continuation after successful restore/acquisition: build
          accession-aware local disclosure projections and read-back-sync the
          raw/archive snapshot to the private Research R2 prefix. The explicit
          compute clock is sampled after source receipt creation.
      - id: fetch_r2_attention
        module: scripts.fetch_r2
        args: [--dirs, attention]
        note: >
          SLF-048 attention store restore (#1677) — build_site.build_attention_data
          reads data/attention/*.parquet (gitignored, R2-hosted). Non-fatal: absent
          store = attention chip silently absent this render.
      # price-store freshness gate (2026-07-07 incident guard) — precedes the serial spine
      - id: check_price_store_freshness
        module: scripts.check_price_store_freshness
        args: [--heal]
      # serial spine (pre-band)
      - id: build_signal_quality
        module: scripts.build_signal_quality
      - id: validate_signals
        module: scripts.validate_signals
      - id: build_track_record
        module: scripts.build_track_record
      - id: audit_sizes
        module: scripts.audit_sizes
        note: non-fatal size tripwire
      - id: export_signal_contracts
        module: scripts.export_signal_contracts
        note: non-fatal
      - id: build_sp500_heatmap_caps
        module: scripts.build_sp500_heatmap
        note: >
          --refresh-caps-only pre-render step: (re)builds the committed
          data/sp500_heatmap/reference.parquet (ticker -> shares, weekly
          Polygon sweep self-gated on the embedded asof stamp) so every lane
          sizes heatmap tiles by real market cap. Non-fatal,
          continue-on-error; the payload itself is built inside build_site.
      - id: engine_run
        module: engine.run
      - id: build_shock_deescalation
        module: engine.shock_deescalation
        note: >
          Policy-shock W2-E de-escalation protocol (PS-R7/PS-R9) — runs after engine.run
          so market_drivers.append_log has already advanced the coherence columns in
          data/regime/market_drivers_log.parquet. Writes data/reflexes/shock_deescalation/
          firings.jsonl (keep-first per date) + site/live/shock_state.json. Non-fatal:
          any error degrades to active=False without breaking the build.
      - id: build_spvector
        module: scripts.build_spvector
      - id: factor_ic_scorecard
        module: scripts.factor_ic_scorecard
        args: [--deep]
      - id: build_alt_data_pre
        module: scripts.build_alt_data
        note: first pass (before altdata_brain)
      - id: build_smart_money
        module: scripts.build_smart_money
      - id: build_policy_lever
        module: scripts.build_policy_lever
        note: Policy-Shock W2-F — ARMED/QUIET lever card; non-fatal; site artifact only (PS-R7)
      # NWS-01 fix (#2658): build_news + grade_news_events moved out of cl_baskets to the
      # serial spine BEFORE build_site, so news.html renders against the CURRENT
      # macro_releases.json / rejected.json / calibration.json instead of the prior run's.
      - id: build_news
        module: scripts.build_news
        note: display-tier/leaf (context-only); ~1-3 min serial cost accepted for board coherence
      - id: grade_news_events
        module: scripts.grade_news_events
        note: writes site/news/calibration.json which build_site reads (W4 side-artifact)
      # OEU M-FIX — same class as the NWS-01 fix above: the MSP data spine must run
      # BEFORE build_site, which renders market_structure.html from
      # data/market_structure/latest.json inside its MSP block. It previously sat in
      # the parallel cl_gex band AFTER build_site, so the page shipped one generation
      # stale every night (the Weekly Range / gamma / systematic blocks described the
      # previous run). Cheap (<10s); inputs are collect-job artifacts, not band output.
      - id: build_market_structure
        module: scripts.build_market_structure
        note: >
          MSP W1 market-structure data spine (VC/CTA systematic flows + gamma +
          dispersion + week_map). Lane-gated ledger (COLLECT_LANE=nightly); artifact
          data/market_structure/latest.json, consumed by build_site's MSP render block.
      - id: build_fundamental_forensics
        module: scripts.build_fundamental_forensics
        note: >
          Deterministic Filing Forensics display/context projection. Reads the committed
          SEC quarterly and annual panels, writes an ignored private state plus the public
          data-free workbench shell, and grants no score or trading authority.
      - id: build_site
        module: scripts.build_site
      - id: build_ticker_pages
        module: scripts.build_ticker_pages
        note: >
          Ticker dossier pages v2 — engine-internal, runs AFTER build_site so it
          reads fresh site/stockdata/<T>.json (~1,595 tickers) + site/ohlc/<T>.json
          written by the render pass above. Outputs site/stocks/<TICKER>.html +
          site/stocks/index.html + site/sitemap.xml update. Rides the engine
          "commit engine outputs" git add site/. Non-fatal: ::warning on failure,
          never aborts the render. v2 universe = sp500+sp400+sp600
          (~1,506 active). Min-info gate ≥3 sections per ticker. Freshness gate:
          noindex + sitemap exclusion when newest as_of > 14d.
      - id: build_index_leadership
        module: scripts.build_index_leadership
        note: >
          Index Leadership rotation board — dead-wire fix #2597 wired it into
          daily.yml (AFTER build_site: reads subsector_confluence*/regime_timeline
          written by the render pass; BEFORE build_stock_board_v2, its consumer;
          COLLECT_LANE=nightly arms the snapshots.jsonl forward-ledger append).
          Declared here post-hoc — #2597 added the workflow step without the
          dag.yml row, hard-failing dag-conformance on every PR (healed in #2605).
