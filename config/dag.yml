# ---------------------------------------------------------------------------
# DIVERGENCES — declared lane-difference ledger
# Two kinds:
#   documented: {lanes, differs, reason, evidence}  — intentional, no CI red
#   suspect:    {lanes, differs, status: suspect, note}  — undocumented drift,
#               stays visible in every checker run; only SHRINKS (each entry
#               either gets a documented reason or the lanes get fixed)
# ---------------------------------------------------------------------------
divergences:

  # ── DOCUMENTED ──────────────────────────────────────────────────────────

  - lanes: [engine-render]
    differs: >
      cl_gex omits scripts.build_gex_board (daily/render include it)
    reason: >
      build_gex_board is NOT a pure function of committed data — it fetches ~700 live
      CBOE option chains (~22 min, cdn.cboe.com, rate-limited). Including it would break
      the engine-render lane's "no network" invariant. GEX consumers read the committed
      data/gex/latest.json; the page keeps the last nightly's values until the nightly
      `daily` (or manual scope=gex dispatch) refreshes them.
    evidence: engine-render.yml:214-226

  - lanes: [engine-render]
    differs: >
      cl_misc omits engine.policy_intent_desk (daily/render include it)
    reason: >
      policy_intent_desk is an LLM builder requiring DEEPSEEK_API_KEY. The engine-render
      lane carries no secrets ("NO secrets → no network" invariant in the lane header).
      Without the key the module exits rc=134 (SIGABRT). The committed
      site/policy_intent.json is kept from the last nightly until the nightly refreshes it.
    evidence: engine-render.yml:264-270

  - lanes: [engine-render]
