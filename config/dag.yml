      discoverability; the divergence documents that it is an embedded call, not a
      standalone module invocation in the workflow YAML.
    evidence: scripts/build_site.py (W4 block after committee.html render)

  # ── SUSPECT — undocumented drift inherited at W5a adoption ─────────────
  # Each entry either gets a documented reason or the lanes get fixed in a future PR.
  # This list ONLY SHRINKS.

  - lanes: [render, engine-render]
    differs: >
