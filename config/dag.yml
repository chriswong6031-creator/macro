# ---------------------------------------------------------------------------
# DIVERGENCES — declared lane-difference ledger
# Two kinds:
#   documented: {lanes, differs, reason, evidence}  — intentional, no CI red
#   suspect:    {lanes, differs, status: suspect, note}  — undocumented drift,
#               stays visible in every checker run; only SHRINKS (each entry
#               either gets a documented reason or the lanes get fixed)
# ---------------------------------------------------------------------------
divergences:

  # ── DOCUMENTED ──────────────────────────────────────────────────────────

  - lanes: [engine-render]
    differs: >
      cl_gex omits scripts.build_gex_board (daily/render include it)
    reason: >
      build_gex_board is NOT a pure function of committed data — it fetches ~700 live
      CBOE option chains (~22 min, cdn.cboe.com, rate-limited). Including it would break
      the engine-render lane's "no network" invariant. GEX consumers read the committed
      data/gex/latest.json; the page keeps the last nightly's values until the nightly
      `daily` (or manual scope=gex dispatch) refreshes them.
    evidence: engine-render.yml:214-226

  - lanes: [engine-render]
    differs: >
      cl_misc omits engine.policy_intent_desk (daily/render include it)
    reason: >
      policy_intent_desk is an LLM builder requiring DEEPSEEK_API_KEY. The engine-render
      lane carries no secrets ("NO secrets → no network" invariant in the lane header).
      Without the key the module exits rc=134 (SIGABRT). The committed
      site/policy_intent.json is kept from the last nightly until the nightly refreshes it.
    evidence: engine-render.yml:264-270

  - lanes: [engine-render]
    differs: >
      All LLM brains absent: engine.master_brain, engine.ai_desk, engine.narrative_brain,
      engine.risk_brain, engine.altdata_brain, engine.master_brain_scorer,
      engine.ai_desk_scorer, engine.demand_ledger, engine.demand_chain_phase0,
      engine.risk_radar_review, engine.radar_scorer, scripts.grade_us_board,
      scripts.archive_signals, scripts.notify — all present in daily.yml engine job.
    reason: >
      Documented in engine-render.yml header (lines 17-20): "DELIBERATELY skipped (belong
      to the nightly): collectors, the master/ai_desk/narrative/altdata LLM brains + their
      scorers, build_special_situations (EDGAR), factor_series/stock_briefs,
      notify/archive_signals." The express lane carries no secrets; the nightly is the sole
      advancer of forward-accountability ledgers.
    evidence: engine-render.yml:17-20

  - lanes: [engine-render]
    differs: >
      build_world_state runs BEFORE the render band in engine-render (as the W1 express-lane
      step, lines 146/148), whereas in daily.yml it is the LAST serial step after the band.
    reason: >
      The express lane places world_state immediately after engine.run to give the render
      band an up-to-date world state. The nightly places it last because many band outputs
      (oracle_state, alerts_triage) contribute to it. Both placements are deliberate and
      serve different freshness objectives.
    evidence: engine-render.yml:109-131 (recompute step includes build_world_state at line 146)

  - lanes: [engine-render, render]
    differs: >
      cl_china (build_china) and cl_hk (build_hk) are band clusters in engine-render and
      render, but NOT in daily.yml (daily omits them from its nightly band entirely).
    reason: >
      cl_china and cl_hk were MOVED from daily.yml to asia-close.yml (runs 08:30 UTC after
      the HK cash close) so CN/HK pages render SETTLED closes instead of stale marks.
      render.yml and engine-render.yml include cl_china/cl_hk in their band because those
      lanes use COMMITTED data (no timing dependency).
    evidence: "daily.yml:413 (comment: cl_china / cl_hk MOVED to .github/workflows/asia-close.yml)"

  - lanes: [render, engine-render]
    differs: >
      cl_baskets omits scripts.build_subsector_confluence (×3 variants) and
      scripts.build_cohort_metrics vs daily.yml cl_baskets which includes them.
    reason: >
      subsector_confluence (--default/--nasdaq/--russell) and cohort_metrics are omitted
      from the render/engine-render express lanes because they perform expensive computation
      (universe-wide confluence scoring, cohort peer washout metrics) that is only justified
      in the nightly full rebuild. The committed subsector_confluence.json artifacts from the
      last nightly are served unchanged until the next nightly run. This is consistent with
      the render lane's stated purpose: re-render pages from COMMITTED data.
    evidence: render.yml header (lines 1-30), render.yml:261-265 (cl_baskets definition)

  - lanes: [intraday-fastpath]
    differs: >
      Only 3 steps (refresh_regime_if_stale, build_live_overlay, build_risk_state); all
      nightly band modules absent.
    reason: >
      Documented in intraday-fastpath.yml header: the fast/slow split — only price-driven
      leaves run every 30 min during RTH; the slow regime/conviction/brain layer stays in
      the nightly. The three steps are the complete fast path by design.
    evidence: intraday-fastpath.yml:1-17

  - lanes: [sentinel, commodity-sentinel, whitehouse-sentinel]
    differs: >
      Minimal module sets (1-2 modules each); all nightly band modules absent.
    reason: >
      Event-driven sentinels: commit ONLY on state transition (rc=10). These are by design
      minimal; the secondary build step (build_vector / build_commodities / build_whitehouse)
      is conditional on a state change and not a general page rebuild. No drift to correct.
    evidence: sentinel.yml:39-47; commodity-sentinel.yml:42-55; whitehouse-sentinel.yml:54-74

  - lanes: [weekly]
    differs: >
      Serial-only (no parallel band); omits most US-only builders (build_baskets,
      build_subsector_confluence, build_sector_central, build_news, build_seasonality, etc.)
      and includes calibration steps absent from daily (calibrate_china, calibrate_hk,
      calibrate_commodities, calibrate_bonds, calibrate_rate_inflation, calibrate_vector,
      validate_gex, recalibrate, signal_factory, dead-name drips).
    reason: >
      Weekly runs deep-recalibration (model refit, dead-name de-bias, factor series) on
      Saturday when CI capacity is available. Band parallelism is not needed (only one
      runner, Saturday quiet hours). US-only page builders run every nightly; the weekly's
      purpose is calibration + international builds, not full US page rebuild.
    evidence: "weekly.yml:18-21 (comment: weekly does collectors + all calibrations + every dashboard build)"

  # ── SUSPECT — undocumented drift inherited at W5a adoption ─────────────
  # Each entry either gets a documented reason or the lanes get fixed in a future PR.
  # This list ONLY SHRINKS.

  - lanes: [render, engine-render]
    differs: >
      cl_misc order differs from daily cl_misc: render has sectorcyc→countrycyc→cycle→markets
      vs daily cycle→sectorcyc→countrycyc (no markets). render adds build_markets; daily does
      not. No documented justification for the order difference or the build_markets addition.
    status: suspect
    note: >
      UNDOCUMENTED drift inherited at W5a adoption — needs owner review.
      render.yml cl_misc line 266-276 (render adds build_markets, order differs from daily.yml
      lines 420-429). Either document why render needs build_markets + the different order, or
      align the order and remove build_markets from the render lane.

  - lanes: [engine-render]
    differs: >
      cl_misc omits build_sector_cycles, build_country_cycles, build_cycle, and build_markets
      vs both daily.yml and render.yml cl_misc. Only policy_intent_desk omission is documented.
    status: suspect
    note: >
      UNDOCUMENTED drift inherited at W5a adoption — needs owner review.
      engine-render.yml cl_misc (lines 241-244) contains only: build_seasonality,
      build_reports, build_policy_watch, build_index_changes. The omission of
      build_sector_cycles, build_country_cycles, build_cycle, and build_markets lacks a
      documented justification (policy_intent_desk omission IS documented at lines 234-244).
      If these are intentionally omitted for the same reason as policy_intent_desk (LLM/secret
      dependency or long-running), add a comment and a documented divergence entry here.

# ---------------------------------------------------------------------------
# MODULES — 25-module IO table from the W5a scout
# (reads, writes, impure, needs_secrets, event_driven flags)
# ---------------------------------------------------------------------------
modules:

  - module: engine.run
    reads:
      - data/macro/*.parquet
      - data/fred/*.parquet
      - data/stocks/*.parquet
      - data/breadth/breadth.parquet
      - data/bonds/bond_health.json
      - data/forex/latest.json
      - data/risk_radar/forward_log.parquet
      - data/signal_archive/mtf_signals_latest.json
      - data/regime/regime_one.json
      - site/vol/regime.json
    writes:
      - data/regime/latest.json
      - data/regime/regime_history.parquet
      - data/regime/base_effect_fwd.jsonl
      - data/regime/regime_one.json
      - data/regime/regime_vector.parquet
    impure: false
    needs_secrets: false
    event_driven: false

  - module: scripts.build_signal_quality
    reads:
      - data/stocks/*.parquet
      - data/intraday/<T>.parquet
    writes:
      - site/signals/<SYM>.json
      - data/signal_archive/mtf_signals_latest.json
    impure: false
    needs_secrets: false
    event_driven: false

  - module: scripts.build_site
    reads:
      - data/regime/latest.json
      - data/regime/regime_history.parquet
      - data/breadth/breadth.parquet
      - site/basketdata/baskets.json
      - site/factordata/sector_pulse.json
      - site/allocationdata/allocation.json
      - data/regime/spvector_latest.json
      - data/market_state/forward_log.jsonl
      - data/experiments/registry_seed.json
      - data/edgar/ic_scorecard.json
    writes:
      - site/macro.html
      - site/us_stocks.html
      - site/regime_timeline.json
      - site/macrodata/macro_signals.json
      - site/factordata/factors.json
      - site/factordata/alerts_triage.json
      - data/market_state/latest.json
    impure: false
    needs_secrets: false
    event_driven: false
    note: >
      Also calls build_subsector_rotation (line 3209), build_stock_library,
      market_state.persist() at runtime — full write surface is a superset of
      declared outputs (lower bound).

  - module: scripts.build_stock_library
    reads:
      - data/regime/latest.json
      - data/breadth/breadth.parquet
      - data/breadth/_closes_cache.parquet
      - site/altdata/by_ticker.json
      - data/baskets/membership.json
    writes:
      - site/factordata/us_standouts.json
      - site/factordata/signal_gate.json
    impure: true
    needs_secrets: false
    event_driven: false
    note: >
      Mixed: pure computation PLUS optional per-build drip fetches (SEC/Wikipedia
      equity_profile, edgar_rpo, edgar_headcount). Drip fetches are network calls and
      are suppressed in engine-render/render lanes via RENDER_NO_DRIP=1.

  - module: scripts.build_baskets
