            - scripts.build_china
          cl_hk:
            - scripts.build_hk
          cl_gex:
            - scripts.build_vol_regime
            - scripts.build_options_flow
            # FD-EXP (2026-07-30): flow_desk.html/json had NO express coverage in either
            # intraday lane (the #3515 freeze class). Admitted once all three of the
            # builder's data/ write paths became COLLECT_LANE=nightly-gated in code
            # (HOUSE-U5, #4007), making the express bake site/-only: zero network, ~2.6s.
            # AFTER build_options_flow — the desk reads THIS run's site/flow/index.json
