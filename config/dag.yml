      - data/oracle/tape_onset_ledger.jsonl
    impure: false
    needs_secrets: false
    event_driven: true
    note: >
      Event-driven — detects new rotation complexes vs prior state by diffing oracle_state.
      P0 (Step 11b): reversion forward ledger nightly accrual + grading.
      P1 (Step 11c): oracle_reversion_state.json sidecar (display tier, reads P2 authority
      additively). W6 (Step 15): Rotation Turn Desk — armed A15 windows + member fires
      + display artifact + forward ledger (DISPLAY-ONLY under hard law).
      W7 (Step 17): Qualitative filter PIT stamps + accrual report.
      FTR-W7 (Step 19): TAPE-ONSET (unconfirmed) display tier — registration
      research/ORACLE_TAPE_ONSET_TIER_REGISTRATION.md. Additive fields on
      oracle_turn_desk.json + sidecar oracle_tape_onset.json + trial ledger
      tape_onset_ledger.jsonl. DISPLAY-ONLY; no authority granted.

