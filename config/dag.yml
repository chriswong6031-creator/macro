meta:
  schema_version: 1
  description: >
    Neural Web W5a — per-workflow-step lane inventory with cluster units as first-class
    entries. Each lane maps one (workflow, job) pair to its ordered build-module steps.
    A step is either {id, module} (serial) or {id, cluster: {cl_name: [module, ...]}}
    (parallel band). The conformance checker (scripts/check_dag_conformance.py) diffs
    these declared sequences against the live YAML workflows and exits 1 on any mismatch
    not covered by a divergences entry.
  granularity: workflow-step

# ---------------------------------------------------------------------------
# LANES — one entry per (workflow, job) that invokes build modules
# ---------------------------------------------------------------------------
lanes:

  # ── daily.yml / collect ──────────────────────────────────────────────────
  - workflow: .github/workflows/daily.yml
    job: collect
    steps:
      - id: fetch_r2_attention
        module: scripts.fetch_r2
        args: [--dirs, attention]
        note: >
          SLF-048 attention store restore (#1677) — data/attention/*.parquet are
          gitignored (R2 data plane, deep history 2015-07→). Runs BEFORE the
          collectors so wiki_pageviews' ~120d upsert extends deep history instead
          of rebuilding a shallow window. continue-on-error; the publish-back step
          at the end of this lane is gated on this step's outcome.
      - id: collect_us
        module: scripts.collect
        args: [--exclude-group, asia]
        note: >
          fetch_finviz_themes also runs in this step but is called as
          'python scripts/fetch_finviz_themes.py' (not python -m), so the
          conformance parser cannot extract it via _PYTHON_M_RE. It is intentionally
          omitted from the declared module list to keep parser output consistent.
      - id: tape_flow_forward
        module: scripts.build_tape_flow_daily
        args: [--mode, forward]
        note: >
          T2a tape-flow features — forward accrual (options-tape P2.x, #1435).
          Prior-trading-day trade+NBBO tape for the gex_symbols() universe via
          ThetaData wildcard-bulk; aggregates inline to signed-flow features.
          Non-fatal: terminal absent or any error warns and continues.
          outputs: [data/tape_flow/daily/*.parquet, data/tape_flow/_state.json]
      - id: tape_flow_episodes
        module: scripts.build_tape_flow_daily
        args: [--mode, episodes, --budget-minutes, "30"]
        note: >
          T2a episode-window backfill (#1441) — Tier-S episodes 2022→, ETF anchors.
          Hard-stop at 30 min (budget_deadline); state resumes next night.
          Runs AFTER the forward step so the daily row always lands first. Non-fatal.
      - id: tape_flow_etf_history
        module: scripts.build_tape_flow_daily
        args: [--mode, etf-history, --budget-minutes, "20"]
        note: >
          T2a ETF-history backfill (#1441) — 20 ETF anchors, full history 2017→.
          Hard-stop at 20 min; runs last of the three tape-flow steps. Non-fatal.
      - id: publish_r2_attention
        module: scripts.publish_r2
        args: [--dirs, attention]
        note: >
          SLF-048 attention publish-back (#1677) — the day's upserted increments
          ride back to R2 so tomorrow's restore + the render-side restores read a
          CURRENT deep store. Gated on fetch_r2_attention's outcome (a shallow
          rebuild after a failed restore must never clobber 11y of history; the
          append-only guard + bytes floor in publish_r2 are the second fence).
          Runs AFTER "commit data" so the data commit is never delayed. Non-fatal.

  # ── daily.yml / engine ──────────────────────────────────────────────────
  - workflow: .github/workflows/daily.yml
    job: engine
    steps:
      - id: fetch_r2_attention
        module: scripts.fetch_r2
        args: [--dirs, attention]
        note: >
          SLF-048 attention store restore (#1677) — build_site.build_attention_data
          reads data/attention/*.parquet (gitignored, R2-hosted). Non-fatal: absent
          store = attention chip silently absent this render.
      # serial spine (pre-band)
      - id: build_signal_quality
        module: scripts.build_signal_quality
      - id: validate_signals
        module: scripts.validate_signals
      - id: build_track_record
        module: scripts.build_track_record
      - id: audit_sizes
        module: scripts.audit_sizes
        note: non-fatal size tripwire
      - id: export_signal_contracts
        module: scripts.export_signal_contracts
        note: non-fatal
      - id: engine_run
        module: engine.run
      - id: build_spvector
        module: scripts.build_spvector
      - id: factor_ic_scorecard
        module: scripts.factor_ic_scorecard
        args: [--deep]
      - id: build_alt_data_pre
        module: scripts.build_alt_data
        note: first pass (before altdata_brain)
      - id: build_smart_money
        module: scripts.build_smart_money
      - id: build_site
        module: scripts.build_site
      - id: build_stock_board_v2
        module: scripts.build_stock_board_v2
      - id: build_reflexivity_overlay
        module: scripts.build_reflexivity_overlay
        note: W4 reflexivity overlay — display-only, runs after build_stock_board_v2
      - id: build_impulse
        module: scripts.build_impulse
      - id: build_dispersion_regime
        module: scripts.build_dispersion_regime
        note: NW Rails W2 PR-4 — L3 dispersion regime lens (display-only, seconds)
      - id: build_dt_contra_state
        module: scripts.build_dt_contra_state
        note: DT-NW-1 — aggregate per-ticker dt_contra chip state into NW display artifact (display-only, seconds)
      - id: build_congress
        module: scripts.build_congress
      - id: build_foresight
        module: scripts.build_foresight
      # parallel band
      - id: band
        cluster:
          cl_markets:
            - scripts.build_commodities
            - scripts.build_spr
            - scripts.build_forex
            - scripts.build_bonds
            - scripts.build_crossasset
            - scripts.build_transmission
            - scripts.build_discovery
          cl_gex:
            - scripts.build_gex_board
            - scripts.build_vol_regime
            - scripts.build_options_flow
            - scripts.build_flow_desk
            - scripts.build_options_screener
            - scripts.build_options_skew
            - scripts.build_options_ivspread
            - scripts.build_options_entry_state
            - scripts.build_darkpool_desk
          cl_baskets:
            - scripts.build_baskets
            - scripts.build_subsector_confluence
            - scripts.build_subsector_confluence --nasdaq
            - scripts.build_subsector_confluence --russell
            - scripts.build_cohort_metrics
            - scripts.build_news
            - scripts.build_methodology
          cl_special:
            - scripts.build_special_situations
          cl_misc:
            - scripts.build_seasonality
            - scripts.build_reports
            - scripts.build_cycle
            - scripts.build_sector_cycles
            - scripts.build_country_cycles
            - scripts.build_measurement
            - scripts.append_sync_gauge
            - engine.policy_intent_desk
            - scripts.build_policy_watch
            - scripts.build_index_changes
            - scripts.build_cycle_pattern_live
      # serial post-band
      - id: build_sector_central
        module: scripts.build_sector_central
      - id: build_vector
        module: scripts.build_vector
      - id: master_brain_scorer
        module: engine.master_brain_scorer
      - id: master_brain
        module: engine.master_brain
      - id: ai_desk_scorer
        module: engine.ai_desk_scorer
      - id: demand_ledger
        module: engine.demand_ledger
      - id: demand_chain_phase0
        module: scripts.demand_chain_phase0
      - id: build_demand
        module: scripts.build_demand
      - id: ai_desk
        module: engine.ai_desk
      - id: narrative_brain
        module: engine.narrative_brain
      - id: risk_brain
        module: engine.risk_brain
      - id: risk_radar_review
        module: engine.risk_radar_review
      - id: radar_scorer
        module: engine.radar_scorer
      - id: grade_us_board
        module: scripts.grade_us_board
        args: [--nightly]
      - id: stamp_options_state
        module: scripts.stamp_options_state
        note: "Options Alpha W1.3 — context-only nullable options-state stamp on board ledger"
      - id: validate_options_entry
        module: scripts.validate_options_entry
        note: "Options Alpha W1.3 — pre-registered options entry-quality gate"
      - id: build_calibration
        module: scripts.build_calibration
      - id: build_spine_index
        module: scripts.build_spine_index
        note: "neural-web W2 — spine query index (read-side union over all graded ledgers)"
      - id: build_kernel_estimates
        module: scripts.build_kernel_estimates
        note: "neural-web W3 — reliability kernel estimates (engine × regime × horizon cells; display-first)"
      - id: build_kernel_diagnostics
        module: scripts.build_kernel_diagnostics
        note: "neural-web W3 PR3 — decay curves (kernel_families.json) + lagging-signal detector (lagging_signals.json); display-first, resilient"
      - id: build_kernel_half_lives
        module: scripts.build_kernel_half_lives
        note: "signal-commons W2 — measured holding-horizon half-lives (half_life.json); monotone-decrease gate, nulls printed; display-only, resilient"
      - id: build_confluence_graph
        module: scripts.build_confluence_graph
        note: "neural-web W4 — confluence graph v1 (typed nodes: engine/sector/regime/thesis/episode; feeds/stable/leads/contradicts/confirms edges; contradiction detector 6 pairs; display-only under hard law)"
      - id: altdata_brain
        module: engine.altdata_brain
      - id: build_alt_data_post
        module: scripts.build_alt_data
        note: second pass (re-emit after altdata_brain)
      - id: build_radar_plus
        module: scripts.build_radar_plus
      - id: build_radar_ic
        module: scripts.build_radar_ic
      - id: build_radar_page
        module: scripts.build_radar_page
      - id: build_intelligence
        module: scripts.build_intelligence
      - id: build_briefing
        module: scripts.build_briefing
      - id: build_intel_hub
        module: scripts.build_intel_hub
      - id: build_aibrief
        module: scripts.build_aibrief
      - id: build_mastermind
        module: scripts.build_mastermind
      - id: build_ai_desk_page
        module: scripts.build_ai_desk_page
      - id: notify
        module: scripts.notify
      - id: push_alerts
        module: scripts.push_alerts
        # W6a: config-gated OFF (alert_push.enabled=false); pure no-op until operator enables
      - id: archive_signals
        module: scripts.archive_signals
      - id: archive_context_snapshots
        module: scripts.archive_context_snapshots
        note: >
          non-fatal; append-only context PIT history (keep-FIRST per date) into
          data/signal_archive/context_daily.parquet — fixes P-D5-3 class of
          'no PIT context history' problems going forward.
          inputs: [data/regime/latest.json, data/market_state/latest.json,
                   data/sentiment_crypto/fear_greed.parquet]
          outputs: [data/signal_archive/context_daily.parquet]
      - id: signal_sanity
        module: scripts.signal_sanity
      - id: build_whitehouse_page_only
        module: scripts.build_whitehouse
        args: [--page-only]
      - id: inject_wh_banner
        module: scripts.inject_wh_banner
      - id: inject_data_base
        module: scripts.inject_data_base
      - id: oracle_nightly
        module: scripts.oracle_nightly
      - id: build_world_state
        module: scripts.build_world_state
      - id: fetch_oracle_panels
        module: scripts.fetch_oracle_panels
        note: non-fatal; PR-C1 RUL-7 — downloads oracle panel_s.parquet + panel_m.parquet from R2 so build_bottom_sensors can populate sponsorship_state; degrades gracefully when R2 creds absent
      - id: build_bottom_sensors
        module: scripts.build_bottom_sensors
        note: non-fatal; display-only bottom-sensor envelope (Amendment 1 Lane B0) — wired 2026-07-06 after build_world_state; benchmark 2.29s
      - id: build_thesis_funnel_history
        module: scripts.research.build_thesis_funnel_snapshot
        note: >
          non-fatal; LT-4 thesis funnel longitudinal history append (PR-A2).
          Invoked as build_thesis_funnel_snapshot --write-history; gated on that
          flag per sole-advancer law. Appends keep-FIRST rows (ticker, snapshot_date)
          to data/research/thesis_funnel_history.parquet. Runs after build_bottom_sensors.
          Display-only; no scored_path_surfaces; FIREWALL LH-R1.
      - id: build_nw_mastermind_context
        module: scripts.build_nw_mastermind_context
        note: non-fatal; NW→Mastermind context bridge (macro #1567) — declares the live daily.yml engine step that was added without a dag.yml entry (merge-race drift)
      - id: build_neuralweb_health
        module: scripts.build_neuralweb_health
        note: non-fatal; PR-C NW lobe-status surface — two-phase (engine job = previous_run cortex; cortex job --refresh-cortex = current_run); after all NW lobe producers
      - id: build_neuralweb_brief
        module: scripts.build_neuralweb_brief
        note: non-fatal; PR-D NW daily brief surface — engine phase writes phase='engine' after health; cortex job --finalize writes phase='final' + upserts history row
      - id: research_factory_monitor
        module: scripts.research_factory_monitor
        note: non-fatal; Research Factory W6 — paper monitor, regime-aware decay, nightly forward-ledger wiring (RF-8/RF-9/RF-10); data/research_factory/ writes covered by 'git add data/' in commit step
      - id: build_options_flow_attention
        module: scripts.build_options_flow_attention
        note: non-fatal reflex; neural-web W-D — direction-free options-flow attention trigger (nightly EOD fold)
      - id: build_feeds
        module: scripts.build_feeds
        note: non-fatal; per-ticker JSON feeds
      - id: publish_r2
        module: scripts.publish_r2
        note: non-fatal; uploads OHLC + stockdata stores to Cloudflare R2
      - id: audit_r2
        module: scripts.audit_r2
        note: non-fatal; data-plane freshness check
        note2: >
          build_canada_library and build_intl_library also run in the "library rebuild"
          step via a shell loop ('for mod in scripts.build_canada_library ...; do python -m
          $mod; done') which the conformance parser cannot extract (variable expansion).
          They are intentionally omitted from declared steps.

  # ── daily.yml / factor_panel ───────────────────────────────────────────
  - workflow: .github/workflows/daily.yml
    job: factor_panel
    steps:
      - id: build_factor_panel
        module: scripts.build_factor_panel
        note: >
          Incremental nightly factor panel build (bounded 10-day window).
          Writes data/factordata/panel/ which is gitignored. Fail-soft.
      - id: factor_contradictions_detector
        module: engine.neuralweb.factor_contradictions
        note: >
          P1-D — Pair G borrowed_strength detector. Runs after factor_panel.
          Writes data/neuralweb/factor_contradictions.jsonl and
          data/reflexes/factor_attention/firings.jsonl (single-writer).
          Non-fatal (always exits 0).
          inputs: [data/factordata/panel/, site/factordata/us_standouts.json]
          outputs: [data/neuralweb/factor_contradictions.jsonl,
                    data/reflexes/factor_attention/firings.jsonl]
      - id: build_factor_intelligence_state
        module: scripts.build_factor_intelligence_state
        note: >
          RUL-NW1/NW10/NW11 — Builds committed factor intelligence state
          artifact + long-term factor pool artifacts. Fail-open (always
          exits 0). Single job advance per RUL-NW1 ruling.
          inputs: [data/factordata/panel/, site/factordata/factor_series.json,
                   data/edgar/ic_scorecard.json,
                   data/neuralweb/factor_contradictions.jsonl,
                   data/reflexes/factor_attention/firings.jsonl,
                   data/reflexes/factor_attention/grades.jsonl,
                   data/reflexes/factor_attention/probation.json,
                   data/neuralweb/machine_registry.jsonl,
                   site/factordata/us_standouts.json]
          outputs: [data/neuralweb/factor_intelligence_state.json,
                    site/neuralwebdata/factor_intelligence_state.json,
                    data/factordata/factor_state_history.jsonl,
                    data/factordata/fire_coordinates.jsonl]

  # ── daily.yml / factor_series ───────────────────────────────────────────
  - workflow: .github/workflows/daily.yml
    job: factor_series
    steps:
      - id: build_factor_series
        module: scripts.build_factor_series

  # ── daily.yml / stock_briefs ────────────────────────────────────────────
  - workflow: .github/workflows/daily.yml
    job: stock_briefs
    steps:
      - id: build_stock_briefs
        module: scripts.build_stock_briefs
      - id: publish_r2_stockdata
        module: scripts.publish_r2
        note: non-fatal; syncs stockdata store to R2

  # ── daily.yml / cortex ───────────────────────────────────────────────────
  - workflow: .github/workflows/daily.yml
    job: cortex
    steps:
      - id: register_factor_hypotheses
        module: scripts.register_factor_hypotheses
        note: >
          Factor Intelligence P2 — registers operator hypotheses H1-H5 in the
          machine registry IN THE CORTEX JOB's tree (persistence fix: the
          factor_ops.yml dispatch actions wrote to another workflow's checkout
          and were wiped by the next fresh checkout before any commit step
          could see them; the W27 h1-h3 and W28 h4-h5 dispatch registrations
          were both lost this way). Idempotent by hypothesis text; batch-atomic
          weekly-budget pre-flight (3/ISO-week shared with cortex) with
          --defer-on-budget nightly retry. Runs BEFORE cortex_deliberation so
          operator batches claim budget ahead of cortex-proposed hypotheses.
          Non-fatal (always exits 0 in the workflow step).
          inputs: [data/neuralweb/machine_registry.jsonl]
          outputs: [data/neuralweb/machine_registry.jsonl,
                    data/neuralweb/governance.jsonl,
                    data/trial_ledger.jsonl]
      - id: cortex_deliberation
        module: engine.neuralweb.cortex
        note: >
          Neural Web W7b PR2 — Opus-class bounded tool-use loop over world_state/
          spine/kernel/graph/governance.  stake_hypothesis now calls
          metabolism.register_hypothesis directly (live registration path).
          Write surfaces: attention firings
          (data/reflexes/cortex_attention/), committee memo
          (data/neuralweb/cortex/memo.json + site/neuralweb/cortex_memo.json),
          hypothesis inbox (data/neuralweb/cortex/hypothesis_inbox.jsonl),
          machine registry (data/neuralweb/machine_registry.jsonl via metabolism).
          Staleness-gated spend; single-call fallback on error; always exits 0.
          needs_secrets: true (CLAUDE_CODE_OAUTH_TOKEN + ANTHROPIC_API_KEY).
          impure: true (LLM non-determinism).
          A2 refused today — shadow probation (empty attention record).
          inputs: [data/neuralweb/world_state.json,
                   data/neuralweb/spine_index.parquet,
                   data/neuralweb/confluence_graph.json,
                   data/neuralweb/kernel_estimates.parquet,
                   data/neuralweb/governance.jsonl,
                   data/neuralweb/cortex/probation.json]
          outputs: [data/reflexes/cortex_attention/firings.jsonl,
                    data/neuralweb/cortex/memo.json,
                    site/neuralweb/cortex_memo.json,
                    data/neuralweb/cortex/hypothesis_inbox.jsonl,
                    data/neuralweb/cortex/last_run_state.json,
                    data/neuralweb/machine_registry.jsonl]
      - id: grade_cortex_attention
        module: scripts.grade_cortex_attention
        note: >
          W7b PR2 — Nightly cortex attention grader + A2 earn-in evaluation.
          Runs AFTER cortex_deliberation in the same cortex job.
          Single-writer for grades.jsonl and probation.json.
          Falsifier classes: realized_move (forward_metrics vs SPY),
          escalation (alert artifact check), verdict_change (world_state history).
          A2 earn-in: constitution.grant_authority with min_n=25, min_events=8.
          Governance events on transitions only (refused→granted or granted→refused).
          Today: granted=False (empty attention record — n=0 < 25).
          inputs: [data/reflexes/cortex_attention/firings.jsonl,
                   data/yahoo/*.parquet,
                   data/neuralweb/world_state.json]
          outputs: [data/reflexes/cortex_attention/grades.jsonl,
                    data/neuralweb/cortex/probation.json,
                    data/neuralweb/governance.jsonl]
      - id: grade_factor_attention
        module: scripts.grade_factor_attention
        note: >
          P1-D — Nightly factor_attention reflex grader + A2 earn-in.
          Parallel grader to grade_cortex_attention; owns the
          data/reflexes/factor_attention/ subtree (NOT cortex paths).
          Runs AFTER grade_cortex_attention, BEFORE evaluate_cortex_hypotheses.
          Non-fatal (always exits 0).
          inputs: [data/reflexes/factor_attention/firings.jsonl,
                   data/yahoo/*.parquet]
          outputs: [data/reflexes/factor_attention/grades.jsonl,
                    data/reflexes/factor_attention/probation.json,
                    data/neuralweb/governance.jsonl]
      - id: evaluate_cortex_hypotheses
        module: scripts.evaluate_cortex_hypotheses
        note: >
          W7b PR2 — Generic cortex hypothesis evaluator.
          Runs AFTER spine-index build (needs: engine via cortex job needs chain).
          For each registered hypothesis with come_back <= today:
            STRICT post-registration filter: as_of > registered_at enforced at entry.
            PATH A (lead_lag/sector_conditional/conditional_regime): spine/qledger join.
            PATH B (entry_quality): walk_forward stop-out harness.
            Verdict against PRE-COMMITTED gate ONLY (no metric switching).
            Passed → queued for quarterly cortex FDR batch (promotion requires gauntlet).
          impure: false.
          inputs: [data/neuralweb/machine_registry.jsonl,
                   data/neuralweb/spine_index.parquet,
                   data/yahoo/*.parquet]
          outputs: [data/neuralweb/machine_registry.jsonl (status update),
                    data/neuralweb/cortex/evaluator_run.json,
                    data/neuralweb/governance.jsonl]
      - id: build_neuralweb_health_cortex
        module: scripts.build_neuralweb_health
        note: >
          PR-C NW lobe-status surface — cortex-job phase (--refresh-cortex flag).
          Second phase of the two-phase health build: re-reads cortex grader outputs
          (data/reflexes/cortex_attention/grades.jsonl, probation.json) written by
          grade_cortex_attention and grade_factor_attention, then patches
          overall_status/summary_counts in the health.json already written by the
          engine-job phase. Runs with `if: always()` so health.json reflects the
          latest cortex state even when cortex_deliberation is skipped or fails.
          Non-fatal (always exits 0 in the workflow step).
          inputs: [data/neuralweb/health.json,
                   data/reflexes/cortex_attention/grades.jsonl,
                   data/reflexes/factor_attention/grades.jsonl,
                   data/neuralweb/cortex/last_run_state.json]
          outputs: [data/neuralweb/health.json,
                    site/neuralweb/health.json]
      - id: build_neuralweb_brief_cortex
        module: scripts.build_neuralweb_brief
        note: >
          PR-D NW daily brief surface — cortex-job phase (--finalize flag).
          Rebuilds with phase='final' using post-refresh-cortex health.json,
          rewrites both data/ and site/ copies, and upserts one compact history row
          keyed by as_of into data/neuralweb/daily_brief_history.jsonl.
          Runs with `if: always()`. Non-fatal (always exits 0).
          inputs: [data/neuralweb/health.json, data/neuralweb/world_state.json,
                   site/neuralwebdata/confluence_graph.json,
                   data/neuralweb/mastermind_context.json,
                   data/neuralweb/cortex/memo.json,
                   data/neuralweb/daily_brief_history.jsonl]
          outputs: [data/neuralweb/daily_brief.json,
                    site/neuralwebdata/daily_brief.json,
                    data/neuralweb/daily_brief_history.jsonl]

  # ── asia-close.yml / asia ───────────────────────────────────────────────
  - workflow: .github/workflows/asia-close.yml
    job: asia
    steps:
      - id: collect_asia
        module: scripts.collect
        args: [--group, asia]
      - id: build_china
        module: scripts.build_china
      - id: build_china_sector_desk
        module: scripts.build_china_sector_desk
      - id: build_china_sector_cycles
        module: scripts.build_china_sector_cycles
      - id: build_china_cycles_scorecard
        module: scripts.build_china_cycles_scorecard
      - id: build_china_sector_central
        module: scripts.build_china_sector_central
      - id: build_flow_velocity
        module: scripts.build_flow_velocity
      - id: build_subsector_confluence_china
        module: scripts.build_subsector_confluence
        args: [--china]
      - id: build_hk
        module: scripts.build_hk
      - id: build_baskets_china
        module: scripts.build_baskets_china
      - id: build_baskets_china_ths
        module: scripts.build_baskets_china_ths
      - id: build_baskets_hk
        module: scripts.build_baskets_hk
      - id: build_cn_reversal_sleeve
        module: scripts.build_cn_reversal_sleeve
      - id: inject_data_base
        module: scripts.inject_data_base
      - id: publish_r2_asia
        module: scripts.publish_r2
        note: non-fatal; uploads CN/HK OHLC + stockdata to R2
      - id: audit_r2_asia
        module: scripts.audit_r2
        note: >
          non-fatal; data-plane freshness anchor check. build_china_library and
          build_hk_library also run in the library-restore step via a shell loop
