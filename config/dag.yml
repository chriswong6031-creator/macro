      W4 context scanner (CORTEX JOB, nwci-w4). Runs three FROZEN v1 templates
      (T1 composition drift, T2 outcome heterogeneity, T3 co-occurrence shift)
      against pre-declared budget fdr_family='context_scan'. Refuses to run
      without a declared budget row (GovernorRefusal). Outputs are display/context
      tier only (horizon_role=context); candidates NEVER rank or score anything
      (R-CI5, R-CI6, Article 2). Dedupe against oracle/species/machine/trial-ledger
      + own archive (dead-stays-dead). Decay after 60 days.

  # ── daily.yml / causal ───────────────────────────────────────────────────
  - workflow: .github/workflows/daily.yml
    job: causal
    steps:
      - id: build_causal_inventory
        module: scripts.build_causal_inventory
        note: >
          CHF W3 — nightly feature inventory refresh (CHF-R4). Reads
          config/causal_priors.yml and all registered feature stores.
          Outputs data/neuralweb/causal_feature_inventory.json and refreshes
          the compiled kill-mask mirror. Non-fatal (always exits 0).
      - id: build_causal_frontier
        module: scripts.build_causal_frontier
        note: >
          CHF W3 — nightly drift-only step (CHF-R8). No batteries. Builds
          frontier coverage map, surprise queue, and lab state (data/ + site/
          copies). Inputs: causal_feature_inventory.json, causal_edges.jsonl,
          causal_nulls.jsonl. Outputs: causal_frontier.json,
          causal_surprise_queue.jsonl, causal_lab_state.json (×2). Non-fatal.
      - id: build_causal_confluence_audit
        module: scripts.build_causal_confluence_audit
        note: >
          CHF W6 — nightly anti-mirage auditor (CHF-R10). Deterministic rule
          application over committed artifacts; zero R-ORTH recomputation
          (RUL-ORTH-9); zero LLM content (RUL-ORTH-11). Reads
          causal_feature_inventory.json, confluence_graph.json,
          covariance_spine.json, causal_priors.yml, causal_mechanisms.jsonl.
          Outputs data/neuralweb/causal_confluence_audit.json. Runs after
          build_causal_frontier (lab state must be current). Non-fatal.
      - id: build_causal_edges
        module: scripts.build_causal_edges
        note: >
          CHF W3 — weekly bounded battery (CHF-R8, K≤40). Tuesday-gated
          (date +%u == 2); no-op on other days. Runs CHF-R5 estimator suite
          (HAC, cross-ticker permutation, lag placebo, time-shift placebo
          DT-R14, circular block bootstrap, era split DT-R16) over top-K
          unexplored/accruing frontier cells. Writes causal_edges.jsonl +
          causal_nulls.jsonl + data/trial_ledger.jsonl. Non-fatal.
      - id: run_causal_brainstorm
        module: scripts.run_causal_brainstorm
        note: >
          CHF W5 — weekly LLM brainstorm runner (CHF-R8/R17). Tuesday-gated
          (date +%u == 2); full run happens Tuesdays only. Checks auto_loop in
          config/causal_llm.yml (armed true 2026-07-09 by operator ruling,
          #2061; false → pack-only degradation for scheduled trigger).
          Scheduled identity: CLAUDE_CODE_OAUTH_TOKEN ONLY (operator ruling
          2026-07-09, masterplan §9 — ANTHROPIC_API_KEY and deepseek are
          excluded from the scheduled path; supersedes the original W-AUTO
          service-key line for CHF).
          Full mode: generator→skeptic→compiler→ingest (ISO-week idempotent,
          ≤3 cards/week). Writes causal_mechanisms.jsonl, causal_brainstorm_runs.jsonl,
          causal_llm_lane.json, governance.jsonl. Non-fatal (exit 0 always).
      - id: run_causal_brainstorm_status
        module: scripts.run_causal_brainstorm
        note: >
          Nightly lane-status refresh (--status-only; the non-Tuesday else
          branch of the brainstorm step). Rewrites causal_llm_lane.json from
          config truth (armed | awaiting_phase_a) without building a pack or
          calling any LLM; preserves the current ISO week's run outcome
          (ok / degraded_pack_only). Added 2026-07-11: before this, the lane
          artifact was written only on Tuesdays, so the #2061 arming was
          invisible in it for days. Non-fatal (exit 0 always).

  # CSP-W6 (2026-07-17): forward-ledger heartbeat (post-publish detector).
  # Runs as a dedicated job that needs both engine and publish (daily.yml).
  # Never gates, never fails a downstream step (exit 0 always — CSP-R1).
  - id: check_ledger_advance
    module: scripts.check_ledger_advance
    note: >
      CSP-W6 — Forward-ledger heartbeat. Post-publish detection step: on trading
      days where the site republished (--render-happened flag from the workflow),
      asserts each registered forward ledger's newest asof advanced vs the
      previous-run snapshot. On stall, appends type_=ledger_stall via the W6b
      push_ops_alert spine (same channel as check_builder_failstreaks.py) and
      emits a ::warning:: annotation. Persists snapshot in
      data/ci/ledger_heartbeat_state.json (sole writer). Trading-day aware;
      idempotent per calendar date. Always exits 0 (CSP-R1: detection and
      disclosure, never fail-dark). Wired as a separate post-publish job in
      daily.yml (needs: [engine, publish], if: always()).

