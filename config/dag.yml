  # ── daily.yml / cortex ───────────────────────────────────────────────────
  - workflow: .github/workflows/daily.yml
    job: cortex
    steps:
      - id: build_context_risk
        module: scripts.build_context_risk
        note: >
          nw-context-intelligence W3 (R-CI7) — Personality risk lens (display-only).
          Reads git-tracked inputs: site/factordata/us_standouts.json,
          site/factordata/stock_personality.json, site/regime_timeline.json.
          Computes board/universe archetype composition ratios, weighted risk profile
          from field-guide fingerprints (context_risk_constants.py), regime-conditional
          21d P10 tail (current quad x liquidity; cells below n=887 floor print
          insufficient_n). Always exits 0 (fail-open per cortex-job law).
          inputs: [site/factordata/us_standouts.json,
                   site/factordata/stock_personality.json,
                   site/regime_timeline.json]
          outputs: [data/neuralweb/context_risk.json,
                    site/neuralwebdata/context_risk.json]
      - id: register_factor_hypotheses
        module: scripts.register_factor_hypotheses
        note: >
          Factor Intelligence P2 — registers operator hypotheses H1-H5 in the
          machine registry IN THE CORTEX JOB's tree (persistence fix: the
          factor_ops.yml dispatch actions wrote to another workflow's checkout
          and were wiped by the next fresh checkout before any commit step
          could see them; the W27 h1-h3 and W28 h4-h5 dispatch registrations
          were both lost this way). Idempotent by hypothesis text; batch-atomic
          weekly-budget pre-flight (3/ISO-week shared with cortex) with
          --defer-on-budget nightly retry. Runs BEFORE cortex_deliberation so
          operator batches claim budget ahead of cortex-proposed hypotheses.
          Non-fatal (always exits 0 in the workflow step).
          inputs: [data/neuralweb/machine_registry.jsonl]
          outputs: [data/neuralweb/machine_registry.jsonl,
                    data/neuralweb/governance.jsonl,
                    data/trial_ledger.jsonl]
      - id: build_context_candidates
        module: scripts.build_context_candidates
        note: >
          W4 nw-context-intelligence — context scanner (CORTEX JOB). Runs three
          FROZEN v1 templates (T1 composition drift, T2 outcome heterogeneity,
          T3 co-occurrence shift) against pre-declared budget fdr_family=context_scan.
          Refuses to run without budget row (GovernorRefusal). Display/context tier
          only (R-CI6, Article 2). Dedupe against oracle/species/machine/trial-ledger
          + own archive (dead-stays-dead). Decay after 60 days unrefreshed.
          Non-fatal (always exits 0 in the workflow step).
          inputs: [data/neuralweb/spine_index.parquet,
                   data/us_board_ledger/retro_grades.parquet,
                   data/neuralweb/context_candidates.jsonl,
                   data/trial_ledger.jsonl]
          outputs: [data/neuralweb/context_candidates.jsonl,
                    data/trial_ledger.jsonl]
      - id: cortex_deliberation
        module: engine.neuralweb.cortex
        note: >
          Neural Web W7b PR2 — Opus-class bounded tool-use loop over world_state/
          spine/kernel/graph/governance.  stake_hypothesis now calls
          metabolism.register_hypothesis directly (live registration path).
          Write surfaces: attention firings
          (data/reflexes/cortex_attention/), committee memo
          (data/neuralweb/cortex/memo.json + site/neuralweb/cortex_memo.json),
          hypothesis inbox (data/neuralweb/cortex/hypothesis_inbox.jsonl),
          machine registry (data/neuralweb/machine_registry.jsonl via metabolism).
          Staleness-gated spend; single-call fallback on error; always exits 0.
          needs_secrets: true (CLAUDE_CODE_OAUTH_TOKEN + ANTHROPIC_API_KEY).
          impure: true (LLM non-determinism).
          A2 refused today — shadow probation (empty attention record).
          inputs: [data/neuralweb/world_state.json,
                   data/neuralweb/spine_index.parquet,
                   data/neuralweb/confluence_graph.json,
                   data/neuralweb/kernel_estimates.parquet,
                   data/neuralweb/governance.jsonl,
                   data/neuralweb/cortex/probation.json]
          outputs: [data/reflexes/cortex_attention/firings.jsonl,
                    data/neuralweb/cortex/memo.json,
                    site/neuralweb/cortex_memo.json,
                    data/neuralweb/cortex/hypothesis_inbox.jsonl,
                    data/neuralweb/cortex/last_run_state.json,
                    data/neuralweb/machine_registry.jsonl]
      - id: grade_cortex_attention
        module: scripts.grade_cortex_attention
        note: >
          W7b PR2 — Nightly cortex attention grader + A2 earn-in evaluation.
          Runs AFTER cortex_deliberation in the same cortex job.
          Single-writer for grades.jsonl and probation.json.
          Falsifier classes: realized_move (forward_metrics vs SPY),
          escalation (alert artifact check), verdict_change (world_state history).
          A2 earn-in: constitution.grant_authority with min_n=25, min_events=8.
          Governance events on transitions only (refused→granted or granted→refused).
          Today: granted=False (empty attention record — n=0 < 25).
          inputs: [data/reflexes/cortex_attention/firings.jsonl,
                   data/yahoo/*.parquet,
                   data/neuralweb/world_state.json]
          outputs: [data/reflexes/cortex_attention/grades.jsonl,
                    data/neuralweb/cortex/probation.json,
                    data/neuralweb/governance.jsonl]
      - id: grade_factor_attention
        module: scripts.grade_factor_attention
        note: >
          P1-D — Nightly factor_attention reflex grader + A2 earn-in.
          Parallel grader to grade_cortex_attention; owns the
          data/reflexes/factor_attention/ subtree (NOT cortex paths).
          Runs AFTER grade_cortex_attention, BEFORE evaluate_cortex_hypotheses.
          Non-fatal (always exits 0).
          inputs: [data/reflexes/factor_attention/firings.jsonl,
                   data/yahoo/*.parquet]
          outputs: [data/reflexes/factor_attention/grades.jsonl,
                    data/reflexes/factor_attention/probation.json,
                    data/neuralweb/governance.jsonl]
      - id: evaluate_cortex_hypotheses
        module: scripts.evaluate_cortex_hypotheses
        note: >
          W7b PR2 — Generic cortex hypothesis evaluator.
          Runs AFTER spine-index build (needs: engine via cortex job needs chain).
          For each registered hypothesis with come_back <= today:
            STRICT post-registration filter: as_of > registered_at enforced at entry.
            PATH A (lead_lag/sector_conditional/conditional_regime): spine/qledger join.
            PATH B (entry_quality): walk_forward stop-out harness.
            Verdict against PRE-COMMITTED gate ONLY (no metric switching).
            Passed → queued for quarterly cortex FDR batch (promotion requires gauntlet).
          impure: false.
          inputs: [data/neuralweb/machine_registry.jsonl,
                   data/neuralweb/spine_index.parquet,
                   data/yahoo/*.parquet]
          outputs: [data/neuralweb/machine_registry.jsonl (status update),
                    data/neuralweb/cortex/evaluator_run.json,
                    data/neuralweb/governance.jsonl]
      - id: build_neuralweb_health_cortex
        module: scripts.build_neuralweb_health
        note: >
          PR-C NW lobe-status surface — cortex-job phase (--refresh-cortex flag).
          Second phase of the two-phase health build: re-reads cortex grader outputs
          (data/reflexes/cortex_attention/grades.jsonl, probation.json) written by
          grade_cortex_attention and grade_factor_attention, then patches
          overall_status/summary_counts in the health.json already written by the
          engine-job phase. Runs with `if: always()` so health.json reflects the
          latest cortex state even when cortex_deliberation is skipped or fails.
          Non-fatal (always exits 0 in the workflow step).
          inputs: [data/neuralweb/health.json,
                   data/reflexes/cortex_attention/grades.jsonl,
                   data/reflexes/factor_attention/grades.jsonl,
                   data/neuralweb/cortex/last_run_state.json]
          outputs: [data/neuralweb/health.json,
                    site/neuralweb/health.json]
      - id: build_neuralweb_brief_cortex
        module: scripts.build_neuralweb_brief
        note: >
          PR-D NW daily brief surface — cortex-job phase (--finalize flag).
          Rebuilds with phase='final' using post-refresh-cortex health.json,
          rewrites both data/ and site/ copies, and upserts one compact history row
          keyed by as_of into data/neuralweb/daily_brief_history.jsonl.
          Runs with `if: always()`. Non-fatal (always exits 0).
          inputs: [data/neuralweb/health.json, data/neuralweb/world_state.json,
                   site/neuralwebdata/confluence_graph.json,
                   data/neuralweb/mastermind_context.json,
                   data/neuralweb/cortex/memo.json,
                   data/neuralweb/daily_brief_history.jsonl]
          outputs: [data/neuralweb/daily_brief.json,
                    site/neuralwebdata/daily_brief.json,
                    data/neuralweb/daily_brief_history.jsonl]
      - id: build_orchestrator_log
        module: scripts.build_orchestrator_log
        note: >
          W-AI orchestrator run log — one deterministic run-log entry per pipeline
          run (+ every-N-runs review row) composed from artifacts the run already
          produced. Runs AFTER build_neuralweb_brief --finalize so the entry records
          the run's final state; committed in the cortex commit lane. Runs with
          `if: always()`. Deterministic, no LLM. Non-fatal (always exits 0).
          inputs: [data/neuralweb/health.json,
                   data/neuralweb/daily_brief.json,
                   data/governance/mastermind_feedback_summary.json]
          outputs: [data/neuralweb/orchestrator_runlog.jsonl,
                    data/neuralweb/orchestrator_reviews.jsonl,
                    site/neuralwebdata/orchestrator_runlog.json]

  # ── daily.yml / active_build_map ─────────────────────────────────────────
  - workflow: .github/workflows/daily.yml
    job: active_build_map
    steps:
      - id: build_active_build_map
        module: scripts.build_active_build_map
        note: >
          Advisory air-traffic-control artifact for multi-agent sessions.
          Reads GitHub PR state via gh CLI (open PRs, file collisions, recent merges);
          writes docs/ACTIVE_BUILD_MAP.md and data/governance/active_builds.json.
          Fail-open: gh unavailable or any gh error exits 0 and leaves existing output files untouched.
          ADVISORY ONLY — gates nothing in CI or the pipeline.

  # ── asia-close.yml / asia ───────────────────────────────────────────────
  - workflow: .github/workflows/asia-close.yml
    job: asia
    steps:
      - id: collect_asia
        module: scripts.collect
        args: [--group, asia]
      # build_china stays a SERIAL head (2026-07-14 band restructure): it writes the
      # china regime gate + regime_history, china_standouts.json and the risk_radar_intl
      # CN forward log/calibration — inputs read by nearly every builder in band A. Its
      # in-process build_china_library ProcessPool also gets the box to itself here.
      - id: build_china
        module: scripts.build_china
      # ── parallel band A (2026-07-14): the post-spine builders run as 5 mutually
      # independent background clusters (engine-job pattern), each internally ordered
      # by its own data deps. Per-module doctrine notes retained as comments:
      #   sector_cycles → cycles_scorecard: grader reads forward_log.parquet appended
      #     by the cycles build the same run (falsifiability loop).
      #   policy_transmission (W4, CN-SYS-R11): collect-fed only; parked in cl_sector
      #     so its live tail is on disk before band B's cycle_phase.
      #   masterminds/strategies (W9 lane unification, was build_vector fallback):
      #     strategies re-runs the mastermind backtests via code import — ordered to
      #     avoid duplicate CPU, not for correctness.
      #   microstructure → participation (W1 → W2, CN-SYS-R11): zt_breadth leg reads
      #     the limit tape appended the same run.
      #   baskets_china (W8-R5): calls engine.china_basket_turn.run() inline — writes
      #     basket_turn_cn.json + appends data/china_basket_turn/ledger.jsonl
      #     (CN_LANE=asia gate); display-tier expected-NULL forward meter (FT-R9).
      #   baskets_china_ths (W8-R5): reads basket_turn_cn.json (written by
      #     baskets_china above) and annotates THS basket rows with turn states.
      #   baskets_china_ths --snapshot: W1 THS PIT membership snapshot side-car.
      #   rotation_events_china / _hk (RC-R14 display-tier): read their region's
      #     baskets.json in-process — each kept AFTER its baskets build (the old
      #     serial chain ran rotation_events_hk BEFORE baskets_hk, reading the prior
      #     session's committed file; now same-session). Southbound context embedded
      #     in the HK payload is a display receipt only — never a detector input
      #     (HKRV-R2).
      #   intel chain (CN-SYS W5a Scope 2, extracted from build_china.py, non-fatal):
      #     validation → (news → policy_watch) → altdata → radar → synthesis; the
      #     fan-in tail (intel_hub → intel_bus) runs in band B because it also reads
      #     analogs/special_sits from cl_flowconf.
      - id: band_a
        cluster:
          cl_sector:
            - scripts.build_china_sector_desk
            - scripts.build_china_sector_cycles
            - scripts.build_china_cycles_scorecard
            - scripts.build_china_policy_transmission
            - scripts.build_china_masterminds
            - scripts.build_china_strategies
          cl_flowconf:
            - scripts.build_flow_velocity
            - scripts.build_subsector_confluence --china
            - scripts.build_china_microstructure
            - scripts.build_china_participation
            - scripts.build_china_analogs
            - scripts.build_china_special_situations
          cl_cn_baskets:
            - scripts.build_baskets_china
            - scripts.build_baskets_china_ths
            - scripts.build_baskets_china_ths --snapshot
            - scripts.build_cn_reversal_sleeve
            - scripts.build_subsector_rotation_china
            - scripts.build_subsector_rotation_china_pages
            - scripts.build_rotation_events_china
          cl_hk:
            - scripts.build_hk
            - scripts.build_baskets_hk
            - scripts.build_rotation_events_hk
          cl_intel:
            - scripts.build_china_validation
            - scripts.build_china_news
            - scripts.build_china_policy_watch
            - scripts.build_china_altdata
            - scripts.build_china_radar
            - scripts.build_china_synthesis
            - scripts.build_narrative_radar
      # ── parallel band B: cross-cluster consumers, after the band-A barrier ──
      #   cl_state (CN-SYS Batch-2, non-fatal, CN-SYS-R11/R13): cycle_phase (W3 phase
      #     tape + falsifier ledger) → market_state (W6 sovereign spine,
      #     china_market_state.v1; degrades to phase=null if W3 missed) → mechanics
      #     (W8 cockpit — reads spine artifacts).
      #   cl_intel_tail: intel_hub (command apparatus) → intel_bus (mastermind fan-in).
      #   cl_central: sector_central reads cl_sector's cycles data JS + the spine's
      #     regime gate + basket membership (the CN analog of daily.yml's post-band
      #     build_sector_central).
      - id: band_b
        cluster:
          cl_state:
            - scripts.build_china_cycle_phase
            - scripts.build_china_market_state
            - scripts.build_china_mechanics
            # W3 CNH forward calendar (display tier; reads data/china_omo +
            # data/china_earnings, writes site/chinastatedata/calendar.json only).
            # RIC-R3: context only — it never gates/sizes a risk or state channel, so
            # it rides at the TAIL of this cluster and nothing downstream reads it.
            - scripts.build_china_calendar
          cl_intel_tail:
            - scripts.build_china_intel_hub
            - scripts.build_china_intel
          cl_central:
            - scripts.build_china_sector_central
      # serial post-band
      - id: check_builder_failstreaks
        module: scripts.check_builder_failstreaks
        note: >
          Builder fail-streak sentinel — asia-close port of the daily.yml #2704/#2738
          step: scans BOTH band scratch dirs (band A + band B, one invocation — two
          would decay the other band's slugs) and advances the CN/HK ledger
          data/ci/builder_failstreaks_asia.json (--lane asia; the script binds each
          write lane to exactly one ledger, so this lane can never advance daily.yml's
          ledger). Observability only — always exits 0, never blocks the deploy.
          Declared here to match asia-close.yml (asia job, post-band-B serial step).
      # ── W8-R7: CN MTF upturn organ runs INLINE inside build_china_library.main() ──
      # compute_cn() is called at end of build_china_library.main() after board arrays
      # are assembled (see engine/mtf_upturn.py CN lane). No standalone script entry
      # added here — inline call; parser cannot extract. Output: site/chinastockdata/
      # mtf_upturn_cn.json + data/mtf_upturn_cn/ledger.jsonl (CN_LANE=asia gate).
      # ── CN Pick Lab (CNPL-R8): runs AFTER build_china_library (library step) ──
      # build_china_library produces the CN snapshot; build_china_pick_lab reads it.
      # Runs in the library-restore step shell loop (after CN library); wired here
      # for conformance documentation only (the parser cannot extract shell loops).
      - id: build_china_pick_lab
        module: scripts.build_china_pick_lab
        note: >
          non-fatal; ≤2 min; CN Pick Lab asia-lane runner (CNPL-R8). Reads CN
          snapshot from data/china_pick_lab/snapshots/, enriches with chinastatedata
          + THS baskets, runs 20 books + flagship2_mirror, grades via (H+L)/2 fills,
          writes site/labdata/china_pick_lab.json + site/china_stocks_lab.html.
          CN_LANE=asia required for all ledger/data writes.
      # ── HK Pick Lab (HKPL-R8): runs AFTER build_hk_library (library step) ──
      # build_hk_library produces the HK snapshot; build_hk_pick_lab reads it.
      # Wired here for conformance documentation; step runs in asia-close.yml.
      - id: build_hk_pick_lab
        module: scripts.build_hk_pick_lab
        note: >
          non-fatal; ≤2 min; HK Pick Lab asia-lane runner (HKPL-R8). Reads HK
          snapshot from data/hk_pick_lab/snapshots/, enriches with organ artifacts
          (ADR bridge, CBBC, filing bus, narrative, catalyst calendar, standouts),
          runs 20 books + flagship2_mirror, grades via next-HK-session close with
          halt law, writes site/labdata/hk_pick_lab.json + site/hk_stocks_lab.html
          + enriched site/factordata/hk_1d_velocity_desk.json.
          CN_LANE=asia required for all ledger/data writes.
      - id: inject_data_base
        module: scripts.inject_data_base
      - id: externalize_css
        module: scripts.externalize_css
      - id: optimize_assets
        module: scripts.optimize_assets
      - id: check_template_site_sync_fix
        module: scripts.check_template_site_sync
        args: [--fix]
        note: >
          non-fatal (|| true); ui.template_site_sync self-heal inside the "commit
          engine outputs" push retry loop (post-rebase, pre-push) — added by #3285
          after the 2026-07-23 incident (4b356dd6b1a): externalize_css lifts the
          plain-copy landing/chat pages' inline <style> to hashed files, and this
          lane shipped the resulting template↔site divergence, reddening the sync
          gate on main. Mirrors the render.yml/engine-render.yml/daily.yml step.
      - id: publish_r2_asia
        module: scripts.publish_r2
        note: non-fatal; uploads CN/HK OHLC + stockdata to R2
      - id: audit_r2_asia
        module: scripts.audit_r2
        note: >
          non-fatal; data-plane freshness anchor check. build_china_library and
          build_hk_library also run in the library-restore step via a shell loop
          ('for mod in scripts.build_china_library ...; do python -m $mod; done')
          which the conformance parser cannot extract. Intentionally omitted.

