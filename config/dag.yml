  # ── daily.yml / standout_audit_us ───────────────────────────────────────
  # SA-W1: US two-axis attribution organ. Off-render, reads committed
  # retro_grades.parquet from the engine job. Writes evidence packs, scoreboard,
  # fitness card. Non-fatal; always exits 0.
  - workflow: .github/workflows/daily.yml
    job: standout_audit_us
    steps:
      - id: standout_audit_us
        module: engine.standout_audit
        note: >
          SA-W1 US attribution + fitness card. Reads data/us_board_ledger/
          retro_grades.parquet (committed by engine job). Writes
          data/standout_audit/us_attribution.parquet,
          data/standout_audit/us_evidence.jsonl,
          data/standout_audit/us_audit_state.json,
          site/factordata/us_audit_scoreboard.json,
          data/metabolism/fitness/standouts_us.json.
          Non-fatal (exits 0 on error; writes data_gap sentinels).
      - id: prophet_pick_autopsies
        module: scripts.run_prophet_pick_autopsies
        note: >
          Prophet Trade Memory public-book accrual. Reviews newly matured US
          Prophet picks through the canonical winner/loser autopsy writer,
          emitting evidence-timed causal chains and research hypotheses only.
          The output has no ranking, sizing, gating, suppression, escalation,
          or alert authority. Non-fatal and idempotent by pick episode ID.
      - id: prophet_operator_trade_memory
        module: scripts.run_trade_memory
        args: [--cap, "8"]
        note: >
          Prophet Trade Memory private operator-book review. Reads and writes
          only the configured owner's RLS-scoped Supabase episode and pattern
          rows, prints counts rather than personal facts, and commits no private
          artifact. Public Prophet autopsies are read only as evidence for the
          same owner's derived pattern view. Research hypotheses stop at
          ready_for_prereg and must pass the existing Causal Lab/gauntlet before
          gaining any signal authority. Non-fatal.
      - id: build_track_record_page
        module: scripts.build_track_record_page
        note: >
          Prophet W1 — US track record sub-page. Read-only over data inputs
          (no ledger writes, no network, no data/ mutations). Reads
          data/us_board_ledger/retro_grades.parquet,
          data/us_board_ledger/snapshots.jsonl,
          site/factordata/us_board_track.json,
          site/factordata/us_board_outcomes.json,
          site/factordata/us_audit_scoreboard.json,
          data/standout_audit/us_attribution.parquet (data_gap-safe).
          Writes site/factordata/us_track_history.json,
          site/us_track_record.html.
          Never-raise contract (SA-R16): absent inputs emit data_gap sentinels.
          Arrow one-shot: hard_exit(0) at end.
      - id: prophet_governor
        module: engine.neuralweb.prophet_governor
        note: >
          Prophet W2 — cross-market governor (PR-R1/R4/R5/R6). Read-only over committed
          stores (no ledger writes, no network, no data/ mutations except the two new
          output artifacts). Reads: data/us_board_ledger/retro_grades.parquet,
          site/factordata/us_board_track.json, site/factordata/us_board_outcomes.json,
          site/factordata/us_audit_scoreboard.json, data/metabolism/fitness/standouts_us.json,
          site/factordata/us_track_history.json, data/china_standout_track/board.parquet,
          data/metabolism/fitness/standouts_cn.json, data/board_ledger/hk_board.parquet,
          data/board_ledger/ca_board.parquet (via board_ledger.scorecard()),
          site/factordata/intl_setups.json, data/prophet/ledger.jsonl,
          site/prophet/index.json, site/labdata/pick_lab.json,
          site/labdata/china_pick_lab.json.
          Writes: data/neuralweb/prophet_status.json, data/neuralweb/prophet_suggestions.json.
          Never-raise contract (SA-R16): absent inputs emit data_gap sentinels (SA-R15).
          Cross-market honesty: no pooled return statistics (PR-R5).
          Arrow one-shot: hard_exit(0) at end.
      - id: fetch_r2_massive_stock_day
        module: scripts.fetch_r2
        note: >
          Read-only restore of the massive_stock_day store, which
          engine/marketing/hot_tape_pack.py scans as its ~20k-name WIDE TAIL
          (unioned freshest-source-per-ticker with the curated data/baskets/ohlcv
          and data/stocks trees). This job's checkout never held the store, so the
          nightly pack silently covered only the ~3k curated names. continue-on-error
          and NOT gating the marketing step: a failed restore costs coverage, never
          the job.
      - id: marketing_governor
        module: scripts.build_marketing
        note: >
          Marketing lobe NW governor. Deterministic Growth-OS state snapshot; reads
          config/marketing.yml + data/marketing/ seed ledgers. Writes:
          data/neuralweb/marketing_state.json, site/neuralwebdata/marketing_lobe.json.
          Never-raise; display-only; originates no market signal.
      - id: ad_central_ingest
        module: scripts.ad_ingest_run
        note: >
          Ad Central Plane O ingest (research/AD_CENTRAL_MASTERPLAN.md §2). Reads
          ad_exposure rows from the first-party analytics_events table via the
          Supabase Management API (SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF)
          and folds them into the arena ledgers. Writes:
          data/marketing/ad_central/{assignments,outcomes}.jsonl — forward-only, and
          this is their SOLE advancer (an intraday lane may only --dry-run).
          Units are keyed on the SERVER-stamped visitor_id, never on anything the
          browser sends, so the denominator cannot be forged by the client that
          chose the arm. Idempotent: the window is a lookback, not a watermark, so a
          missed night self-heals and a re-read appends nothing.
          Unconfigured (no PAT) is a SKIP, not a failure — exits 0 having written
          nothing. Never-raise; display-only; originates no market signal.
      - id: persona_memory
        module: engine.marketing.persona_memory
        note: >
          XG-W3 persona-memory consolidator. Folds the host/VPS runtime spool
          (emission-time phrase-fatigue, relationship-touch and open-promise
          counters, which make ZERO tracked-repo writes intraday — the same
          posture as the outbox's items-host.jsonl) into the tracked ledgers
          under data/marketing/personas/. Nightly is the SOLE advancer of those
          ledgers (charter §2 amendment 13), so this is their only writer.
          Idempotent: records dedup on a stable key, because a retried nightly
          that double-counted would silently TIGHTEN every per-quirk frequency
          cap those counters bound. A host with no spool is a no-op that exits 0
          and prints a ::notice — most runners never emit anything. Never-raise
          (set +e, exit 0); a non-zero rc only prints a ::warning.
      - id: marketing_learning
        module: scripts.marketing_learning_nightly
        note: >
          XG-W6 learning loop — the ONE feedback loop four charters described
          (D05 §7 ≡ IS-W5 ≡ Persona W4 report card ≡ Media W2 scorecards). Four
          ordered actions in one step, and BOTH orderings are load-bearing:
          (0) poll twitterapi.io for outcomes on replies we SENT, inside the
          existing reply sub-budget — before consolidation, or every reply label
          lags a night behind its own evidence; (1) labels.consolidate advances
          data/marketing/learning/{labels.jsonl,scorecard.json} from the LIVE
          metrics poll (data/marketing/post_metrics.jsonl, written by
          marketing-publish.yml), the reply desk's host store and the gitignored
          intraday spool; (2) health_monitor.run grades every desk on the CONFIG
          roster and runs the network tripwire, writing health.json and (only
          when armed) halts.json; (3) report.
          Nightly is the SOLE advancer of data/marketing/learning/ — an AST
          guard pins consolidate() as its only writer. Idempotent: rows dedup on
          a stable (surface, subject, day) key, so a retried nightly cannot
          double the n the n-floor gates on.
          Runs AFTER persona_memory and is independent of it. At M0 nothing has
          sent, so the outcome poll bills nothing; with no telemetry the whole
          step is a no-op that writes a valid empty scorecard. Both halt actions
          default to `warn`, so this step silences no desk until an operator
          arms it. Never-raise (set +e, exit 0); a non-zero rc only prints a
          ::warning. Display-only; originates no market signal.

  # ── daily.yml / oracle_offrender ────────────────────────────────────────
  # Oracle off-render job: panel rebuild + episodes + Time Machine + Ratio Lens.
  # Declared here to satisfy DAG conformance; non-fatal throughout.
  - workflow: .github/workflows/daily.yml
    job: oracle_offrender
    steps:
      - id: fetch_r2_oracle
