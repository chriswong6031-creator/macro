# The BioCatalyst closed-beta launch denominator.  It names every source
# family closed beta depends on by exact source or adapter id and version,
# records the rights disposition and SLO denominators for each, and states
# exactly which product features each family unlocks or leaves unavailable.
# A family whose source is not eligible is recorded UNAVAILABLE with its
# blocker.  This file is a denominator, not an activation: it arms nothing,
# changes no rights or entitlement, is not an operator decision, and is not
# evidence that any soak ran.  The single launch_critical row in
# config/biocatalyst_sources.yml does not satisfy it.
