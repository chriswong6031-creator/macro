# config/metabolism_budget.yml — Metabolism budget governor config (A7).
#
# IMMUTABLE: this file is an operator-ratified policy document.
# Loop-authored PRs may NOT modify it.  Changes require a T2 operator-tap.
#
# Per R-AUT-2 and §6 of the masterplan:
#   "set the per-cycle token/USD cap in metabolism_budget.yml (IMMUTABLE) —
#    the loop physically cannot exceed it."
#
# Schema: metabolism_budget.v1
schema: metabolism_budget.v1
generated_at: "2026-07-09"
owner_program: metabolism-phase-a

# ── Per-cycle hard caps ───────────────────────────────────────────────────────

# Hard USD cap per cycle.  When cumulative spend >= this value, all remaining
# stages emit a clean journaled no-op and exit 0.
per_cycle_usd_cap: 25

# Hard token cap per cycle.  Set conservatively: 1M output tokens ≈ $15 at
# Opus pricing; 25M is a hard ceiling that is well above any normal cycle.
per_cycle_token_cap: 25000000

# Maximum number of proposals a single PROPOSE run may emit.
max_docket_size: 5

# ── Per-lobe caps (inherit per_cycle unless overridden) ──────────────────────

lobe_caps:
  til:
    per_cycle_usd_cap: 25
    per_cycle_token_cap: 25000000
    max_docket_size: 5
    # Per-lobe circuit breaker: after this many consecutive failed PRs for the
    # lobe, auto-set a per-lobe pause flag.
    breaker_trip: 3
  # SA-W3: standout lobes added as loop-manageable (SA-R1). Caps mirror til.
  # Roster: 64 → 65 of 66 (max_active_nonscored_lobes).
  site-us-standouts:
    per_cycle_usd_cap: 25
    per_cycle_token_cap: 25000000
    max_docket_size: 5
    breaker_trip: 3
  site-china-standouts:
    per_cycle_usd_cap: 25
    per_cycle_token_cap: 25000000
    max_docket_size: 5
    breaker_trip: 3

# ── Circuit breaker config ───────────────────────────────────────────────────

# Number of consecutive failed PRs for a lobe before auto-pausing that lobe.
# Mirrors healthcheck.py's breaker_trip pattern.
circuit_breaker_trip: 3

# ── Budget tracking artifact ─────────────────────────────────────────────────

# The budget ledger is tracked at data/metabolism/budget_ledger.json.
# It is append-only (decremented per stage); a full-cycle reset happens at
# cycle start.  Over-cap → clean no-op + journal entry.
budget_ledger_path: data/metabolism/budget_ledger.json

# ── Roster-budget governor (V2-C, R-V2-7) ────────────────────────────────────
#
# Operator-ratified cap on the number of active non-scored lobes the loop
# may charter.  Current roster = 63 (display + shadow + confirmer NW-scope
# lobes from synapse.yml as of 2026-07-10).  Cap = current + 3.
#
# When the charter queue would exceed max_active_nonscored_lobes, the loop
# does NOT silently block: it emits a digest ASK tap card via V2-D tap.py
# so the operator can raise this number.
#
# max_probation_lobes: how many lobes may be in 'probation' simultaneously
# before the ladder pauses new demotions (prevents cascade kills from a
# feed outage that disables many lobes at once).
#
# These values are IMMUTABLE (loop PRs cannot modify them; R-V2-8).
# An operator raises them via a T2 tap-gated human PR.
max_active_nonscored_lobes: 66    # 65 current (SA-W3 adds site-china-standouts) + 1 headroom (SA-R1; operator-ratified 2026-07-10 base was 63+3)
max_probation_lobes: 5            # max simultaneous probation lobes (anti-cascade)

# ── Genesis-specific caps (R-V6-3 — W2 genesis gauntlet) ─────────────────────
#
# There is deliberately NO per-cycle genesis count cap (operator directive
# 2026-07-12): genesis throughput is gated on QUALITY + CAPACITY, never on a
# count — good charters are not throttled; each one independently needs the
# scout evidence floor, the deterministic genesis screen, and its own two-key
# grant.  The binding capacity is max_probation_lobes above: a newborn lands
# in probation, so at most that many unproven newborns can exist at once
# (grants earlier in the same cycle consume slots immediately).  Enforced by
# _genesis_screen in engine/metabolism/adjudicate.py (R-V6-3b revised).

# genesis_accountability_days: a genesis lobe that produces ZERO matured
# (graded) contracts within this many days triggers a demotion docket from the
# lifecycle machine (R-V6-6, W3).  45 days = one probation window.
# IMMUTABLE: loop PRs cannot modify this.
genesis_accountability_days: 45   # days before accountability-clock demotion (R-V6-6)

# ── Audit gate config (R-V7-1c — diff-budget sanity check) ──────────────────
#
# audit_max_diff_lines: maximum allowed +/- lines in a build-lane PR diff.
# A PR whose diff exceeds this threshold is REJECTED by the deterministic
# pre-screen in engine/metabolism/audit.py without calling the LLM auditor.
# This prevents runaway builds from merging unattended.
# IMMUTABLE: loop PRs may NOT modify this value (R-V2-8).
audit_max_diff_lines: 2000   # R-V7-1c

# ── Never-stuck durability (R-V5-1, R-V5-2) ──────────────────────────────────
#
# max_build_attempts: maximum times a "failed" dispatch may be re-attempted
# before the proposal is permanently parked (operator-tap insight emitted).
# A foreign_file_abort parks after ONE occurrence regardless of this cap.
max_build_attempts: 2

# stale_running_ttl_hours: a "running" journal marker older than this is treated
# as stale (crashed runner / OOM) and NOT counted as claimed.  Default = 3h ≈ 2×
# the 90-minute build timeout.
stale_running_ttl_hours: 3

# ── Audit-reject remediation cap (R-V7-7) ────────────────────────────────────
#
# max_audit_rebuild_attempts: after this many audit-reject rebuild dispatches,
# the proposal PARKS with an audit_rebuild_exhausted insight; the rejected
# draft PR is left for operator review and never silently dropped.
# IMMUTABLE: loop PRs may NOT modify this value (R-V2-8).
max_audit_rebuild_attempts: 2   # R-V7-7

# ── Meta-learning prior de-rank thresholds (R-V8-11) ─────────────────────────
#
# prior_demote_min_n: minimum number of closed contracts in a bucket before the
#   de-rank floor can fire.  Below this count the sample is too small to trust.
#   IMMUTABLE: loop PRs may NOT modify this value.
prior_demote_min_n: 5

# prior_demote_hit_rate: buckets with hit_rate STRICTLY BELOW this value AND
#   n >= prior_demote_min_n are demoted to the bottom of the agenda.
#   Demoted items remain visible with prior_demoted:true.
#   IMMUTABLE: loop PRs may NOT modify this value.
prior_demote_hit_rate: 0.25
# ── Reflex-arc config (R-V8-6..R-V8-9) ──────────────────────────────────────
#
# max_open_revert_prs: maximum simultaneously open DRAFT revert PRs that
# metabolism_revert.py may maintain.  Prevents runaway revert queues.
# IMMUTABLE: loop PRs may NOT modify this value.
max_open_revert_prs: 2          # R-V8-6

# tap_reping_days: taps held longer than this many days receive a re-ping
# (Telegram + insight).  Default 7 = one week of silence is unusual enough
# to re-surface.
tap_reping_days: 7              # R-V8-8

# tap_park_days: taps held longer than this many days are parked with an
# operator_tap_expired insight so the docket is never silently infinite.
# Parking is NOT execution — the held plan stays held.
tap_park_days: 21               # R-V8-8

# ── Construction park expiry (R-V8-9 FIX-5) ──────────────────────────────────
#
# park_expiry_days: a parked_construction row auto-releases after this many days
# unless a fresh FALSIFIER_TRIPPED for the same cycle re-parks it.  This mirrors
# the R-V8-8 tap-expiry pattern so a dead-unpark does not become a permanent
# one-way block.  The release_grant_id path (future ADJUDICATE wire) takes
# priority over expiry and is checked first.
# IMMUTABLE: loop PRs may NOT modify this value.
park_expiry_days: 30           # R-V8-9 FIX-5
