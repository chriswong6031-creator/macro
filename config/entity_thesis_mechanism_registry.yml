# CONTRACT (ETM-R3 / ETM-R4):
#   - Every curated_theses row MUST have source_refs + curated_by.
#     Rows missing either field are SKIPPED by the builder and recorded as conflicts.
#   - This registry is DISPLAY-ONLY: it never merges local systems, never gates,
#     never ranks, never originates signals.  Source systems remain authoritative.
