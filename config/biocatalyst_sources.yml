b0a_canary:
  source_id: clinicaltrials_gov_v2
  universe_mode: explicit_nct_allowlist
  allowlist_config_env: BIOCATALYST_CANARY_NCTS
  default_allowlist: []
  production_enable_env: BIOCATALYST_ENABLED
  default_enabled: false
  allowed_contracts:
    - ctgov_fetch_run.v1
    - source_page_receipt.v1
    - source_record.v1
    - evidence_claim.v1
    - trial_source_snapshot.v1
    - trial_snapshot_observation.v1
    - trial_snapshot.v1
    - trial_version_diff.v1
    - trial_coverage_epoch.v1
    - ctgov_watermark.v1
  allowed_product_language: "ClinicalTrials.gov's registry record changed; first observed within this interval."

# BC-B1S0 is a contract-and-capacity prerequisite, not a second collector
# mode.  It may prove bounded discovery semantics against hermetic fixtures;
# it cannot open the network, publish a trial generation, or arm production.
b1s0_discovery_control:
  source_id: clinicaltrials_gov_v2
  implementation_state: dark_contract_and_hermetic_harness_only
  universe_mode: declared_last_update_post_date_window
  source_selection_field: LastUpdatePostDate
  source_query_form: "AREA[LastUpdatePostDate]RANGE[YYYY-MM-DD,YYYY-MM-DD]"
  source_dataset_clock: /version.dataTimestamp
  knowledge_clock: response_received_at
  source_selection_precision: day
  default_enabled: false
  live_network_allowed: false
  worker_mode_available: false
  public_projection_allowed: false
  api_exposure_allowed: false
  storage_publication_allowed: false
  allowed_contracts:
    - ctgov_discovery_scope.v1
    - ctgov_discovery_run.v1
    - ctgov_discovery_coverage_epoch.v1
  allowed_scope_language: "Records returned for this declared ClinicalTrials.gov source query."
  prohibited_claims:
    - complete_clinicaltrials_gov_universe
    - missing_record_means_deleted
    - last_update_post_date_is_event_time
    - last_update_post_date_is_knowledge_time
    - discovery_membership_is_issuer_or_security_identity
    - partial_or_quarantined_run_is_publishable

# BC-B1S1 validates a finite declared cohort against fixtures only.  It is not
# a discovery, collection, storage, publication, product, or activation lane.
b1s1_fixed_cohort_control:
  source_id: clinicaltrials_gov_v2
  implementation_state: validation_only_fixed_cohort_control
  universe_mode: fixed_explicit_nct_cohort
  membership_authority: fixed_cohort_only
  candidate_admission_policy: candidate_subset_only
  minimum_nct_ids: 1
  maximum_nct_ids: 25
  maximum_query_bytes: 299
  default_enabled: false
  live_network_allowed: false
  worker_mode_available: false
  public_projection_allowed: false
  api_exposure_allowed: false
  storage_publication_allowed: false
  consumers: []
  authority: facts_and_context_only
  allowed_contracts:
    - ctgov_fixed_cohort.v1
  prohibited_claims:
    - dynamic_cohort_expansion
    - live_ingestion
    - identity_mapping
    - scoring
    - prediction
    - prophet_authority
    - neural_web_authority
    - ranking
    - sizing
    - alerts
  prohibited_uses:
    - dynamic_cohort_expansion
    - live_ingestion
    - identity_mapping
    - scoring
    - prediction
    - prophet_authority
    - neural_web_authority
    - ranking
    - sizing
    - alerts

b2_history_canary:
  source_id: clinicaltrials_gov_record_history
