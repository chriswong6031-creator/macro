# Earnings-call qualitative scorer — config (SGA W4, rulings SGA-R5/R6).
#
# The scorer harness (engine/earnings_qual.py) reads this to know which provider
# to try first, the local Qwen endpoint, model names, the daily call cap, and the
# prompt version.  It is provider-agnostic: the SAME harness runs on the operator's
# Windows PC or VPS against the private Ollama/OpenAI-compatible endpoint serving
# Qwen3.5-9B-Q4 and — as a cloud fallback, off the render path — on
# Anthropic/DeepSeek via engine/llm_auth.make_call().
#
# SGA-R5: all output is context-only (is_context_only:true) — never a signal,
# never a gate, never a sizing input, until the promotion gauntlet passes.
# SGA-R6: the Windows worker is producer-only — it writes R2, NEVER git.

# Provider waterfall.  'openai_compat' is the local Qwen path (base_url below).
# 'anthropic'/'deepseek'/'codex' route through engine/llm_auth; Kimi uses its
# OpenAI-compatible endpoint. Codex is never inserted implicitly here; an
# attached subscription is used only when the worker explicitly names it.
# The harness tries providers in this order and stops at the first that answers.
provider_order:
  - openai_compat        # local Qwen on the PC (primary — free, private)
  - deepseek             # V4 Flash burst/fallback extractor (very low metered cost)
  - kimi                 # visual/Chinese/model-diversity fallback
  - anthropic            # last-resort cloud fallback (Haiku, metered)

# --- local OpenAI-compatible endpoint (the Qwen path) ---------------------------
# base_url is a PLACEHOLDER — the worker overrides it from its own env/args when it
# runs on the PC or VPS. Default points at Ollama's OpenAI-compatible endpoint.
openai_compat:
  base_url: "http://localhost:11434/v1"  # override with EARNINGS_LLM_BASE_URL
  model: "qwen3.5:9b"                    # multimodal Ollama model id
  api_key_env: "LOCAL_LLM_API_KEY"        # optional; most local servers ignore it
  connect_timeout_s: 5                     # fail over quickly when the LAN host is down
  timeout_s: 120
  max_tokens: 1200
  # NO per-rung transcript bound here on purpose — this rung inherits the global
  # max_chars/tail_chars below, like every other rung.
  #
  # The rungs CAN carry different windows: adding `max_chars`/`tail_chars` to any
  # provider block overrides the global for that rung only (see
  # engine/earnings_qual._rung_text_bounds, and the resolved bound is logged per
  # call).  That lever exists because an under-configured local server does not
  # error over its window — it drops the overflow and answers the partial prompt
  # with a markdown summary instead of JSON (HTTP 200, finish_reason "stop"),
  # which reads downstream as invalid_json, burns the bounded retry, and falls
  # through to a metered provider.  If that recurs, set the bound HERE rather
  # than lowering the global; `_log_prompt_truncation` names the symptom.
  #
  # It does not apply today.  #4784 capped this rung at 8,000 chars because the
  # host was running Ollama's 4,096-token default with OLLAMA_CONTEXT_LENGTH
  # unset; the operator set OLLAMA_CONTEXT_LENGTH=32768 (User scope) and
  # restarted the server on 2026-08-06, so the endpoint now serves a
  # 32,768-token window.  The model itself (qwen3.5:9b, Qwen 3.5 9.7B Q4_K_M)
  # declares qwen35.context_length = 262144, so 32,768 is the server setting,
  # not a model ceiling.  Measured after the change, against the real
  # _SYSTEM_PROMPT with /no_think + reasoning_effort:none, through the same
  # http://127.0.0.1:11435/v1 bridge:
  #    9,000 user-prompt chars ->  3,583 prompt_tokens, finish_reason stop, JSON
  #   24,000 user-prompt chars ->  8,797 prompt_tokens, finish_reason stop, JSON
  #   24,000 chars, token-dense (numeric segment tables, the worst real case)
  #                           -> 14,156 prompt_tokens, finish_reason stop, JSON
  # Before the fix, 24,000 chars pinned at prompt_tokens 2,050 and returned
  # prose.  An 8,000-char cap now truncates transcripts to a third of what this
  # endpoint reads, so it is removed.

# --- cloud fallback model ids (routed via engine/llm_auth) -----------------------
# Cheapest lane only — earnings scoring is off the render-critical path.
opus_model: "claude-haiku-4-5"            # 'anthropic' provider (cheap Haiku)
deepseek_model: "deepseek-v4-flash"        # routine extraction; Pro reserved for publishable prose
codex_source_model: "gpt-5.6-terra"        # optional explicit subscription rung
codex_reasoning_effort: "low"              # extraction does not need deep search
# llm_auth env-var names (waterfall credential lookups):
oauth_token_env: "CLAUDE_CODE_OAUTH_TOKEN"
api_key_env: "ANTHROPIC_API_KEY"
deepseek_key_env: "DEEPSEEK_API_KEY"
deepseek_base_url: "https://api.deepseek.com/anthropic"

# Kimi/Moonshot is optional. It is not called unless MOONSHOT_API_KEY is set.
kimi:
  base_url: "https://api.moonshot.ai/v1"
  model: "kimi-k2.6"
  api_key_env: "MOONSHOT_API_KEY"
  timeout_s: 120
  max_tokens: 1200

# --- run economics ---------------------------------------------------------------
# A 2,000–3,500-name universe produces roughly 22–38 calls/day on average at
# four calls/name/year, with much larger earnings-season bursts. Local Qwen can
# absorb this cheaply; a persistent queue carries overflow across runs.
daily_cap: 64                              # max scores per score_new() invocation
# GLOBAL transcript bound — applies to every rung that does not set its own
# max_chars/tail_chars in its provider block above.  As of 2026-08-06 that is
# EVERY rung, local included.  Do NOT lower it to accommodate a small local
# context window — that is what the per-rung override exists for.
#
# 24,000 was leaving most of the call on the floor.  Measured over the 64 calls
# scored on 2026-08-14: 86% were truncated, the median truncated call discarded
# 17,048 characters (42% of its own text), and the worst kept 36% — the model was
# scoring a third of a call and reporting a confident read of it.  Source lengths
# ran median 37,755 / p90 53,594 / max 66,645 chars.
#
# 48,000 is derived from the endpoint measurements above, not chosen for looks.
# Body density from those two data points (netting out the old ~480-token system
# prompt) is 0.347 tok/char on prose and 0.570 on the token-dense worst case.
# Against the 32,768-token window, with the v3 system prompt (~1,190 tok) and the
# 1,200-token response reserve:
#     48,000 chars  ->  29,740 tok worst case, a 9% margin
#     53,000 chars  ->  32,589 tok worst case, a 1% margin — too close
# Overshooting is not a soft failure: the server does not error over its window,
# it drops the overflow and answers with prose instead of JSON, which reads as
# invalid_json, burns the bounded retry and falls through to a METERED provider.
# So the margin is the point.  Truncation at this cap: 28% of calls rather than
# 86%.  Pinned by tests/test_earnings_prompt_quality.py, which fails if the
# configured bound stops fitting the measured window.
max_chars: 48000                           # transcript is truncated to this length
tail_chars: 16000                          # preserve Q&A tail on long calls
retry_on_bad_json: 1                       # one retry when the model returns non-JSON

# --- prompt version --------------------------------------------------------------
# This is a LABEL, not the whole stamp.  The row's `prompt_version` is
# `<this label>+<sha8 of the system prompt that actually ran>`
# (engine.earnings_qual.resolve_prompt_version).
#
# It used to be this string alone, which made the field unable to answer the one
# question it exists for.  Every row stamped `equal-v2` was scored by the engine's
# "mirror" prompt, while the file that defined PROMPT_VERSION = "equal-v2"
# (tools/earnings_worker/prompts.py) was imported by nothing — so the stamp named
# text that had never executed, and neither direction held: editing the prompt did
# not move the stamp, and moving the stamp did not imply an edit.  The appended
# fingerprint closes both.
prompt_version: "equal-v3"
analysis_schema_version: "earnings-qual/v2"

# --- usage attribution (ai_costs ledger, cloud lanes only) -----------------------
usage_lane: "earnings_qual"
