# Earnings-call qualitative scorer — config (SGA W4, rulings SGA-R5/R6).
#
# The scorer harness (engine/earnings_qual.py) reads this to know which provider
# to try first, the local Qwen endpoint, model names, the daily call cap, and the
# prompt version.  It is provider-agnostic: the SAME harness runs on the operator's
# Windows PC or VPS against the private Ollama/OpenAI-compatible endpoint serving
# Qwen3.5-9B-Q4 and — as a cloud fallback, off the render path — on
# Anthropic/DeepSeek via engine/llm_auth.make_call().
#
# SGA-R5: all output is context-only (is_context_only:true) — never a signal,
# never a gate, never a sizing input, until the promotion gauntlet passes.
# SGA-R6: the Windows worker is producer-only — it writes R2, NEVER git.

# Provider waterfall.  'openai_compat' is the local Qwen path (base_url below).
# 'anthropic'/'deepseek'/'codex' route through engine/llm_auth; Kimi uses its
# OpenAI-compatible endpoint. Codex is never inserted implicitly here; an
# attached subscription is used only when the worker explicitly names it.
# The harness tries providers in this order and stops at the first that answers.
provider_order:
  - openai_compat        # local Qwen on the PC (primary — free, private)
  - deepseek             # V4 Flash burst/fallback extractor (very low metered cost)
  - kimi                 # visual/Chinese/model-diversity fallback
  - anthropic            # last-resort cloud fallback (Haiku, metered)

# --- local OpenAI-compatible endpoint (the Qwen path) ---------------------------
# base_url is a PLACEHOLDER — the worker overrides it from its own env/args when it
# runs on the PC or VPS. Default points at Ollama's OpenAI-compatible endpoint.
openai_compat:
  base_url: "http://localhost:11434/v1"  # override with EARNINGS_LLM_BASE_URL
  model: "qwen3.5:9b"                    # multimodal Ollama model id
  api_key_env: "LOCAL_LLM_API_KEY"        # optional; most local servers ignore it
  connect_timeout_s: 5                     # fail over quickly when the LAN host is down
  timeout_s: 120
  max_tokens: 1200
  # PER-RUNG transcript bound — overrides the global max_chars/tail_chars below
  # for THIS rung only (see engine/earnings_qual._rung_text_bounds).  The rungs
  # do not share a context window: this endpoint serves 4,096 tokens, while the
  # cloud rungs read the full 24,000 characters comfortably.  Over the window
  # the server does not error — it drops the overflow and answers with a
  # markdown summary instead of JSON (HTTP 200, finish_reason "stop"), which
  # reads downstream as invalid_json, burns the bounded retry, and falls
  # through to a metered provider on every real transcript.
  # Measured 2026-08-06 against the real system prompt on qwen3.5:9b, with
  # /no_think + reasoning_effort:none applied (max_tokens 600 vs 1200 changed
  # nothing, so this is the context window, not the completion reservation):
  #   6,000 chars -> 2,547 prompt_tokens, JSON      9,000 -> 3,583, JSON
  #   8,000 chars -> 3,238 prompt_tokens, JSON     10,000 -> 3,932, NO JSON
  #  11,000+ chars -> prompt_tokens pinned at 2,050 (silently truncated)
  # 8,000 sits a full step below the 10,000 failure point: real transcripts are
  # more token-dense than the synthetic text measured above, so they consume
  # MORE tokens per character.  Do not tune this to the measured edge.
  max_chars: 8000
  tail_chars: 3000                         # ~the global 1:3 tail ratio, and under
                                           # max_chars//2 so it is never clamped

# --- cloud fallback model ids (routed via engine/llm_auth) -----------------------
# Cheapest lane only — earnings scoring is off the render-critical path.
opus_model: "claude-haiku-4-5"            # 'anthropic' provider (cheap Haiku)
deepseek_model: "deepseek-v4-flash"        # routine extraction; Pro reserved for publishable prose
codex_source_model: "gpt-5.6-terra"        # optional explicit subscription rung
codex_reasoning_effort: "low"              # extraction does not need deep search
# llm_auth env-var names (waterfall credential lookups):
oauth_token_env: "CLAUDE_CODE_OAUTH_TOKEN"
api_key_env: "ANTHROPIC_API_KEY"
deepseek_key_env: "DEEPSEEK_API_KEY"
deepseek_base_url: "https://api.deepseek.com/anthropic"

# Kimi/Moonshot is optional. It is not called unless MOONSHOT_API_KEY is set.
kimi:
  base_url: "https://api.moonshot.ai/v1"
  model: "kimi-k2.6"
  api_key_env: "MOONSHOT_API_KEY"
  timeout_s: 120
  max_tokens: 1200

# --- run economics ---------------------------------------------------------------
# A 2,000–3,500-name universe produces roughly 22–38 calls/day on average at
# four calls/name/year, with much larger earnings-season bursts. Local Qwen can
# absorb this cheaply; a persistent queue carries overflow across runs.
daily_cap: 64                              # max scores per score_new() invocation
# GLOBAL transcript bound — applies to every rung that does not set its own
# max_chars/tail_chars in its provider block above.  The cloud rungs read this
# in full; do NOT lower it to accommodate a small local context window, that is
# what the per-rung override exists for.
max_chars: 24000                           # transcript is truncated to this length
tail_chars: 8000                           # preserve Q&A tail on long calls
retry_on_bad_json: 1                       # one retry when the model returns non-JSON

# --- prompt version --------------------------------------------------------------
# Bump when tools/earnings_worker/prompts.py changes materially.  Stored on every
# row's scored_at context (not the row itself) and surfaced in the manifest so
# scores from different prompt generations can be told apart at promotion time.
prompt_version: "equal-v2"
analysis_schema_version: "earnings-qual/v2"

# --- usage attribution (ai_costs ledger, cloud lanes only) -----------------------
usage_lane: "earnings_qual"
