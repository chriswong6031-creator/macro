# config/theme_pathways.yml — TIL W2 (PR-D) Beneficiary/Loser Pathway Graph
#
# Curated supply-chain graph per canonical theme.
# Canonical theme ids come from config/theme_crosswalk.yml — read-only here.
# basket_refs reference basket ids from the crosswalk (theme_crosswalk.yml basket_ids)
# NO bare ticker lists — tickers expressed ONLY via basket_refs.
#
# Node types:
#   enabling_infrastructure | bottleneck | direct_beneficiary | implementer
#   downstream_winner | impaired_incumbent | second_order_risk
#
# Edge schema: {src, dst, order (1|2|3), side (winner|loser), confidence (low|med|high), rationale}
#
# Loser legs are AVOID-shaped evidence framing (TI-R2 / short-side lobe ruling: L1 = AVOID-not-SHORT).
# TI-R5 fence: no runtime shock→beneficiary escalation. Graph is curated taxonomy, not a rotation call.
#
# Language law: no "buy/sell/short/rotate now" in any label or rationale.
# Banned words: validated, caused, proved, proof.
#
# Version: 1 (2026-07-09, TIL W2 PR-D)

version: 1
date: "2026-07-09"
note: >
  Curated beneficiary/loser chains for all 18 foresight-mapped canonical themes.
  basket_refs carry only basket ids from the crosswalk; no bare ticker lists.
  Loser legs are AVOID-shaped evidence, never directional short calls.
  This config is PR-reviewed; runtime mutation is forbidden (TI-R5).

themes:

  # ────────────────────────────────────────────────────────────────────────────
  # ai_semiconductors — AI / Semiconductor capex chain (encoded from engine/demand_chain.py)
  # ────────────────────────────────────────────────────────────────────────────
  - theme_id: ai_semiconductors
    nodes:
      - id: ai_semis__driver
        label_en: "Hyperscaler AI capex commitment"
        label_zh: "云厂商AI资本开支承诺"
        node_type: enabling_infrastructure
        basket_refs: []
        rationale: "Hyperscaler (MSFT/Alphabet/AMZN/Meta/ORCL) annual capex is the demand pool for the AI buildout; commitments lead chip revenue ~2-4 quarters."

      - id: ai_semis__bottleneck_compute
        label_en: "Advanced compute silicon supply"
        label_zh: "先进算力芯片供给"
        node_type: bottleneck
        basket_refs:
          - ai_semiconductors
        rationale: "HBM and leading-edge GPU/accelerator capacity is the binding constraint on AI infrastructure buildout pace."

      - id: ai_semis__direct_beneficiary
        label_en: "AI accelerator & compute silicon"
        label_zh: "AI加速器与算力芯片"
        node_type: direct_beneficiary
        basket_refs:
          - ai_semiconductors
          - ai_infra
        rationale: "Basket members capture the direct revenue pool: accelerators, networking silicon, and HBM directly consumed by hyperscaler capex."

      - id: ai_semis__implementer_wfe
        label_en: "Wafer-fab equipment (WFE)"
        label_zh: "晶圆制造设备（WFE）"
        node_type: implementer
        basket_refs:
          - semicap_equipment
        rationale: "WFE spend is a lagged step back in the capex chain; wafer starts committed today convert to equipment orders 1-3 quarters prior."

      - id: ai_semis__downstream_power
        label_en: "Data-center power & cooling"
        label_zh: "数据中心供电与散热"
        node_type: downstream_winner
        basket_refs:
          - data_center_power
          - ai_neoclouds
        rationale: "Power and cooling demand is an indirect but durable beneficiary of capacity additions; PUE improvements slow the intensity but not the absolute MW demand."

      - id: ai_semis__impaired_legacy_semis
        label_en: "Legacy semiconductor nodes (mature/trailing edge)"
        label_zh: "成熟制程半导体"
        node_type: impaired_incumbent
        basket_refs: []
        rationale: "AVOID-shaped: capex concentration in leading-edge AI compute crowds out pricing leverage for commodity/mature-node producers; overcapacity risk in trailing nodes."

      - id: ai_semis__second_order_power_grid
        label_en: "Grid & electrification build (2nd-order)"
        label_zh: "电网与电气化建设（二阶）"
        node_type: second_order_risk
        basket_refs:
          - power_grid
        rationale: "Datacenter power demand growth outpaces incremental renewable capacity; grid interconnection queue is the second-order binding constraint."

    edges:
      - src: ai_semis__driver
        dst: ai_semis__bottleneck_compute
        order: 1
        side: winner
        confidence: high
        rationale: "Hyperscaler capex commitments directly translate to accelerator orders within 1-2 quarters."
      - src: ai_semis__bottleneck_compute
        dst: ai_semis__direct_beneficiary
        order: 1
        side: winner
        confidence: high
        rationale: "Revenue flows directly into accelerator/networking silicon basket members."
      - src: ai_semis__direct_beneficiary
        dst: ai_semis__implementer_wfe
        order: 2
        side: winner
        confidence: med
        rationale: "Leading-edge capacity additions require WFE spend; lag is 1-3 quarters."
      - src: ai_semis__direct_beneficiary
        dst: ai_semis__downstream_power
        order: 2
        side: winner
        confidence: med
        rationale: "Compute density growth increases per-rack power draw and cooling requirements."
      - src: ai_semis__driver
        dst: ai_semis__impaired_legacy_semis
        order: 2
        side: loser
        confidence: med
        rationale: "AVOID-shaped: capex concentrated at leading edge reduces pricing leverage in mature nodes; trailing-edge basket members face structural headwinds."
      - src: ai_semis__downstream_power
        dst: ai_semis__second_order_power_grid
        order: 3
        side: winner
        confidence: low
        rationale: "MW demand growth from AI datacenters is a second-order tailwind for grid capex; interconnection backlogs are the binding constraint."

  # ────────────────────────────────────────────────────────────────────────────
  # memory_storage — HBM & NAND supply chain
  # ────────────────────────────────────────────────────────────────────────────
  - theme_id: memory_storage
    nodes:
      - id: mem__driver
        label_en: "AI training memory intensity (HBM demand)"
        label_zh: "AI训练内存需求（HBM）"
        node_type: enabling_infrastructure
        basket_refs:
          - ai_semiconductors
        rationale: "Each successive AI model generation requires more HBM bandwidth per accelerator; demand is near-exclusively driven by the AI buildout."

      - id: mem__bottleneck_hbm
        label_en: "HBM capacity (CoWoS / advanced packaging)"
        label_zh: "HBM产能（CoWoS先进封装）"
        node_type: bottleneck
        basket_refs:
          - memory_storage
        rationale: "CoWoS advanced packaging capacity is the physical binding constraint on HBM output; qualification lead times stretch 6-12 months."

      - id: mem__direct_beneficiary
        label_en: "Memory & HBM producers"
        label_zh: "存储与HBM生产商"
        node_type: direct_beneficiary
        basket_refs:
          - memory_storage
        rationale: "Basket members are the primary revenue recipients of HBM pricing power during capacity-constrained periods."

      - id: mem__impaired_nand
        label_en: "NAND / commodity DRAM oversupply"
        label_zh: "NAND与通用DRAM供给过剩"
        node_type: impaired_incumbent
        basket_refs:
          - memory_storage
        rationale: "AVOID-shaped: capex pivot to HBM within the same fabs draws down NAND and commodity DRAM capacity; oversupply risk persists in non-AI memory segments."

    edges:
      - src: mem__driver
        dst: mem__bottleneck_hbm
        order: 1
        side: winner
        confidence: high
        rationale: "AI training workload growth is the primary demand driver for HBM."
      - src: mem__bottleneck_hbm
        dst: mem__direct_beneficiary
        order: 1
        side: winner
        confidence: high
        rationale: "Constrained HBM supply with growing AI demand supports pricing for basket members."
      - src: mem__bottleneck_hbm
        dst: mem__impaired_nand
        order: 2
        side: loser
        confidence: med
        rationale: "AVOID-shaped: fab time redirected to HBM reduces commodity memory output but also risk/reward for non-AI memory in the same basket."

  # ────────────────────────────────────────────────────────────────────────────
  # semicap_equipment — Wafer-fab equipment cycle
  # ────────────────────────────────────────────────────────────────────────────
  - theme_id: semicap_equipment
    nodes:
      - id: wfe__driver
        label_en: "Leading-edge fab investment decisions"
        label_zh: "先进制程晶圆厂投资决策"
        node_type: enabling_infrastructure
        basket_refs:
          - ai_semiconductors
          - memory_storage
        rationale: "Fab build/expansion commitments by leading-edge foundries and IDMs are the demand source for WFE; orders follow commitment decisions by 1-4 quarters."

      - id: wfe__bottleneck_litho
        label_en: "EUV lithography capacity"
        label_zh: "EUV光刻产能"
        node_type: bottleneck
        basket_refs:
          - semicap_equipment
        rationale: "EUV tools are the capacity-constrained item in advanced node fabs; lead times extend to 18-24 months."

      - id: wfe__direct_beneficiary
        label_en: "WFE producers"
        label_zh: "晶圆制造设备商"
        node_type: direct_beneficiary
        basket_refs:
          - semicap_equipment
        rationale: "Basket members capture WFE orders directly; book-to-bill is the leading revenue signal."

      - id: wfe__second_order_materials
        label_en: "Process materials & specialty gases"
        label_zh: "工艺材料与特种气体"
        node_type: second_order_risk
        basket_refs: []
        rationale: "Process chemistry and specialty gases see volume uplift from increased wafer starts but lack the pricing leverage of equipment suppliers."

    edges:
      - src: wfe__driver
        dst: wfe__bottleneck_litho
        order: 1
        side: winner
        confidence: high
        rationale: "Fab investment decisions convert to EUV tool orders within 1-4 quarters."
      - src: wfe__bottleneck_litho
        dst: wfe__direct_beneficiary
        order: 1
        side: winner
        confidence: high
        rationale: "EUV and supporting WFE revenues flow directly to basket members."
      - src: wfe__direct_beneficiary
        dst: wfe__second_order_materials
        order: 2
        side: winner
        confidence: low
        rationale: "Higher wafer starts lift process materials consumption as a second-order effect."

  # ────────────────────────────────────────────────────────────────────────────
  # data_center_power — Data-center power & cooling buildout
  # ────────────────────────────────────────────────────────────────────────────
  - theme_id: data_center_power
    nodes:
      - id: dcp__driver
        label_en: "Hyperscaler & neocloud power procurement"
        label_zh: "云厂商与新云算力电力采购"
        node_type: enabling_infrastructure
        basket_refs:
          - ai_neoclouds
          - ai_semiconductors
        rationale: "Hyperscaler and neocloud operators are signing long-term power purchase agreements; MW procurement is the pipeline metric."

      - id: dcp__bottleneck_permitting
        label_en: "Grid interconnection & permitting"
        label_zh: "电网接入与许可审批"
        node_type: bottleneck
        basket_refs:
          - power_grid
        rationale: "FERC interconnection queue and state permitting timelines are the binding constraint on new datacenter power delivery; average queue wait has grown to 3-5 years."

      - id: dcp__direct_beneficiary
        label_en: "Data-center power & cooling equipment"
        label_zh: "数据中心供电与冷却设备"
        node_type: direct_beneficiary
        basket_refs:
          - data_center_power
        rationale: "Basket members provide transformers, UPS, cooling units, and liquid cooling directly consumed by datacenter builds."

      - id: dcp__downstream_nuclear
        label_en: "Nuclear & SMR power supply"
        label_zh: "核能与小型模块堆发电"
        node_type: downstream_winner
        basket_refs:
          - nuclear_power
          - uranium_miners
        rationale: "24/7 carbon-free power demand from hyperscalers is a structural tailwind for nuclear PPA agreements and SMR development timelines."

      - id: dcp__impaired_diesel_gen
        label_en: "Diesel backup generation incumbents"
        label_zh: "柴油备用发电设备商"
        node_type: impaired_incumbent
        basket_refs: []
        rationale: "AVOID-shaped: hyperscaler sustainability commitments and carbon targets are displacing diesel backup generation with battery and cleaner alternatives."

    edges:
      - src: dcp__driver
        dst: dcp__bottleneck_permitting
        order: 1
        side: loser
        confidence: high
        rationale: "AVOID-shaped: permitting/interconnection backlog is slowing delivery; projects with secured interconnection command premium."
      - src: dcp__driver
        dst: dcp__direct_beneficiary
        order: 1
        side: winner
        confidence: high
        rationale: "Power procurement commitments convert to equipment orders for cooling and power infrastructure."
      - src: dcp__direct_beneficiary
        dst: dcp__downstream_nuclear
        order: 2
        side: winner
        confidence: med
        rationale: "24/7 power demand drives hyperscaler interest in nuclear PPAs and SMR partnerships."
      - src: dcp__driver
        dst: dcp__impaired_diesel_gen
        order: 2
        side: loser
        confidence: med
        rationale: "AVOID-shaped: decarbonization mandates and battery storage are reducing the role of diesel backup generation."

  # ────────────────────────────────────────────────────────────────────────────
  # nuclear_power — Nuclear & SMR power
  # ────────────────────────────────────────────────────────────────────────────
  - theme_id: nuclear_power
    nodes:
      - id: nuke__driver
        label_en: "Corporate 24/7 carbon-free power demand"
        label_zh: "企业全天候清洁电力需求"
        node_type: enabling_infrastructure
        basket_refs:
          - data_center_power
          - ai_neoclouds
        rationale: "Hyperscaler sustainability commitments and AI power growth are driving demand for 24/7 carbon-free electricity, channeling interest to nuclear PPAs."

      - id: nuke__bottleneck_uranium
        label_en: "Uranium supply (enrichment & conversion)"
        label_zh: "铀供给（浓缩与转化）"
        node_type: bottleneck
        basket_refs:
          - uranium_miners
        rationale: "Enrichment and conversion capacity is the supply-chain bottleneck; Western enrichment capacity is constrained post-Russia sanctions."

      - id: nuke__direct_beneficiary
        label_en: "Nuclear operators & SMR developers"
        label_zh: "核电运营商与小型模块堆开发商"
        node_type: direct_beneficiary
        basket_refs:
          - nuclear_power
        rationale: "Basket members include utility-scale nuclear operators with PPAs and SMR technology developers with growing order books."

      - id: nuke__implementer_uranium_miners
        label_en: "Uranium miners"
        label_zh: "铀矿开采商"
        node_type: implementer
        basket_refs:
          - uranium_miners
        rationale: "Uranium mining supply is the feedstock input; miners benefit from structural long-term contract demand."

      - id: nuke__impaired_natgas
        label_en: "Natural gas peaker plants"
        label_zh: "天然气调峰电厂"
        node_type: impaired_incumbent
        basket_refs: []
        rationale: "AVOID-shaped: long-duration clean power PPAs reduce the economics for gas peakers in competitive power markets."

    edges:
      - src: nuke__driver
        dst: nuke__bottleneck_uranium
        order: 1
        side: winner
        confidence: med
        rationale: "New reactor commitments and SMR deals increase long-term uranium demand, tightening enrichment capacity."
      - src: nuke__bottleneck_uranium
        dst: nuke__implementer_uranium_miners
        order: 1
        side: winner
        confidence: high
        rationale: "Uranium supply tightness flows through to miner revenue via long-term contract pricing."
      - src: nuke__driver
        dst: nuke__direct_beneficiary
        order: 1
        side: winner
        confidence: high
        rationale: "Hyperscaler PPAs and SMR development agreements underpin order books for nuclear basket members."
      - src: nuke__driver
        dst: nuke__impaired_natgas
        order: 2
        side: loser
        confidence: low
        rationale: "AVOID-shaped: structural shift to 24/7 carbon-free power reduces relative competitiveness of gas peakers in forward capacity markets."

  # ────────────────────────────────────────────────────────────────────────────
  # grid_electrification — Grid & electrification buildout
  # ────────────────────────────────────────────────────────────────────────────
  - theme_id: grid_electrification
    nodes:
      - id: grid__driver
        label_en: "US grid investment legislation & datacenter load growth"
        label_zh: "美国电网投资立法与数据中心负荷增长"
        node_type: enabling_infrastructure
        basket_refs:
          - data_center_power
        rationale: "IRA-driven transmission investment and datacenters' surging load growth are the dual demand drivers for grid buildout spending."

      - id: grid__bottleneck_transformer
        label_en: "High-voltage transformer supply"
        label_zh: "高压变压器供给"
        node_type: bottleneck
        basket_refs:
          - power_grid
        rationale: "Lead times for large power transformers have extended to 2-3 years; capacity is concentrated among a small number of domestic/allied producers."

      - id: grid__direct_beneficiary
        label_en: "Power grid equipment & EPC"
        label_zh: "电网设备与工程总包"
        node_type: direct_beneficiary
        basket_refs:
          - power_grid
        rationale: "Basket members are direct revenue recipients of transmission and distribution capex."

      - id: grid__downstream_winner_copper
        label_en: "Copper wiring & cable"
        label_zh: "铜线缆"
        node_type: downstream_winner
        basket_refs:
          - reshoring
        rationale: "Grid transmission expansion is highly copper-intensive; cable and conductor demand is a durable second-order beneficiary."

      - id: grid__impaired_coal_dispatch
        label_en: "Coal generation dispatch"
        label_zh: "煤电调度"
        node_type: impaired_incumbent
        basket_refs: []
        rationale: "AVOID-shaped: grid modernization and renewable integration accelerate coal plant retirements."

    edges:
      - src: grid__driver
        dst: grid__bottleneck_transformer
        order: 1
        side: winner
        confidence: high
        rationale: "Grid investment converts to transformer orders; supply tightness enhances pricing power for domestic producers."
      - src: grid__bottleneck_transformer
        dst: grid__direct_beneficiary
        order: 1
        side: winner
        confidence: high
        rationale: "Equipment demand flows to basket members as the primary supply source."
      - src: grid__direct_beneficiary
        dst: grid__downstream_winner_copper
        order: 2
        side: winner
        confidence: med
        rationale: "Grid expansion is copper-intensive; each GW of transmission requires substantial copper cable and conductors."
      - src: grid__driver
        dst: grid__impaired_coal_dispatch
        order: 2
        side: loser
        confidence: med
        rationale: "AVOID-shaped: grid modernization and renewable penetration reduce coal's dispatch hours and capacity value."

  # ────────────────────────────────────────────────────────────────────────────
  # cybersecurity — Cybersecurity spend
  # ────────────────────────────────────────────────────────────────────────────
  - theme_id: cybersecurity
    nodes:
      - id: cyber__driver
        label_en: "AI-era threat surface expansion"
        label_zh: "AI时代威胁面扩展"
        node_type: enabling_infrastructure
        basket_refs:
          - ai_semiconductors
          - ai_infra
        rationale: "AI adoption expands the attack surface through new attack vectors, model poisoning, and proliferation of autonomous threat actors; compliance mandates follow."

      - id: cyber__bottleneck_talent
        label_en: "Cybersecurity talent & credential scarcity"
        label_zh: "网络安全人才与认证稀缺"
        node_type: bottleneck
        basket_refs:
          - cybersecurity
        rationale: "Certified security professionals are in structural deficit; platform consolidation is one response — advantaging large integrated vendors."

      - id: cyber__direct_beneficiary
        label_en: "Cybersecurity platform vendors"
        label_zh: "网络安全平台厂商"
        node_type: direct_beneficiary
        basket_refs:
          - cybersecurity
        rationale: "Basket members capture the enterprise security budget directed at AI-native threat prevention, SOC automation, and identity security."

      - id: cyber__impaired_legacy_siem
        label_en: "Legacy on-premise SIEM / point-product vendors"
        label_zh: "传统本地SIEM与单点产品厂商"
        node_type: impaired_incumbent
        basket_refs: []
        rationale: "AVOID-shaped: platform consolidation and AI-native threat detection erode revenue for legacy on-premise point-product vendors."

    edges:
      - src: cyber__driver
        dst: cyber__bottleneck_talent
        order: 1
        side: winner
        confidence: high
        rationale: "Talent scarcity advantages platform vendors offering automation; enterprises consolidate on fewer integrated solutions."
      - src: cyber__bottleneck_talent
        dst: cyber__direct_beneficiary
        order: 1
        side: winner
        confidence: high
        rationale: "Platform consolidation and AI-native security products flow revenue to basket members."
      - src: cyber__driver
        dst: cyber__impaired_legacy_siem
        order: 2
        side: loser
        confidence: med
        rationale: "AVOID-shaped: legacy point-product spend is being consolidated away; margin compression risk for non-platform players."

  # ────────────────────────────────────────────────────────────────────────────
  # defense_aerospace — Defense & aerospace
  # ────────────────────────────────────────────────────────────────────────────
  - theme_id: defense_aerospace
    nodes:
      - id: def__driver
        label_en: "NATO re-armament & allied defense budget expansion"
        label_zh: "北约重整军备与盟友防务预算扩张"
        node_type: enabling_infrastructure
        basket_refs:
          - defense
        rationale: "Allied defense spending commitments (NATO 2% GDP+ targets) and US supplemental appropriations are the primary demand driver for defense systems."

      - id: def__bottleneck_propulsion
        label_en: "Missile & munition propulsion supply"
        label_zh: "导弹与弹药推进系统供给"
        node_type: bottleneck
        basket_refs:
          - defense
        rationale: "Solid rocket motor and propulsion component production is the primary production bottleneck for guided munitions replenishment."

      - id: def__direct_beneficiary
        label_en: "Defense prime contractors"
        label_zh: "国防主承包商"
        node_type: direct_beneficiary
        basket_refs:
          - defense
        rationale: "Basket members are the primary revenue recipients of re-armament and systems modernization programs."

      - id: def__implementer_sensors
        label_en: "Defense sensors, electronics & C2"
        label_zh: "国防传感器、电子与指控系统"
        node_type: implementer
        basket_refs:
          - defense
        rationale: "Sensors, radars, electronic warfare systems, and command/control electronics are the enabling sub-systems for modern defense platforms."

      - id: def__second_order_dual_use
        label_en: "Dual-use technology (AI / autonomy)"
        label_zh: "军民两用技术（AI与自主系统）"
        node_type: second_order_risk
        basket_refs:
          - robotics_automation
          - ai_semiconductors
        rationale: "Autonomous systems and AI-chip content in defense platforms create second-order demand linkage to civilian AI and robotics baskets."

    edges:
      - src: def__driver
        dst: def__bottleneck_propulsion
        order: 1
        side: winner
        confidence: high
        rationale: "Re-armament spending translates to munitions orders constrained by propulsion supply."
      - src: def__bottleneck_propulsion
        dst: def__direct_beneficiary
        order: 1
        side: winner
        confidence: high
        rationale: "Defense primes are primary contractors for re-armament programs."
      - src: def__direct_beneficiary
        dst: def__implementer_sensors
        order: 2
        side: winner
        confidence: med
        rationale: "Platform modernization programs pull through sensor and electronics sub-system orders."
      - src: def__direct_beneficiary
        dst: def__second_order_dual_use
        order: 3
        side: winner
        confidence: low
        rationale: "AI autonomy content in defense platforms creates second-order linkage to civilian AI semiconductor and robotics baskets."

  # ────────────────────────────────────────────────────────────────────────────
  # robotics_automation — Robotics & automation
  # ────────────────────────────────────────────────────────────────────────────
  - theme_id: robotics_automation
    nodes:
      - id: rob__driver
        label_en: "Labor cost & reshoring-driven automation investment"
        label_zh: "劳动力成本与回岸制造自动化投资"
        node_type: enabling_infrastructure
        basket_refs:
          - reshoring
        rationale: "Persistent wage inflation and onshoring mandates are compressing margins for manufacturers, accelerating the ROI hurdle for automation capital spending."

      - id: rob__bottleneck_actuators
        label_en: "Precision actuators & servo motors"
        label_zh: "精密执行器与伺服电机"
        node_type: bottleneck
        basket_refs:
          - robotics_automation
        rationale: "High-precision actuators and servo drives are the primary lead-time-constrained components in industrial robot delivery."

      - id: rob__direct_beneficiary
        label_en: "Industrial robots & cobots"
        label_zh: "工业机器人与协作机器人"
        node_type: direct_beneficiary
        basket_refs:
          - robotics_automation
        rationale: "Basket members are the direct revenue recipients of factory automation capex; cobot adoption is expanding the addressable market."

      - id: rob__downstream_ai_vision
        label_en: "AI vision & perception software"
        label_zh: "AI视觉与感知软件"
        node_type: downstream_winner
        basket_refs:
          - ai_infra
          - ai_semiconductors
        rationale: "Robotic systems increasingly embed AI vision; demand for perception chips and software is a downstream winner."

      - id: rob__impaired_manual_assembly
        label_en: "Labor-intensive assembly operations"
        label_zh: "劳动密集型组装作业"
        node_type: impaired_incumbent
        basket_refs: []
