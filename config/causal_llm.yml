# CHF-R8 autonomy gate — the operator risk-acceptance switch.
#
# auto_loop was flipped to true by DIRECT OPERATOR RULING on 2026-07-09
# (chat directive: "set to auto loop"), superseding the Phase-A earn-in that
# CHF-R8 originally required. The masterplan status log (§9 in
# research/CAUSAL_HYPOTHESIS_FACTORY_MASTERPLAN_BY_FABLE.md) records the ruling.
#
# Identity (operator ruling 2026-07-09, same entry): scheduled runs use the
# user's CLAUDE_CODE_OAUTH_TOKEN ("don't use api key, use oauth"). This
# overrides the original W-AUTO service-key requirement for CHF. The runner
# enforces it: when trigger=scheduled, ONLY the 'oauth' provider is accepted;
# ANTHROPIC_API_KEY and deepseek are excluded from the scheduled path.
#
# NEVER change weekly_budget_cards or model_roles without a CHF ruling amendment.

schema: causal_llm.v1

# Gate — must be true for scheduled runs to invoke the LLM chain.
auto_loop: true

# Phase-A completion criteria — SUPERSEDED by the operator ruling above.
# Kept for the record; the earn-in metrics still print on the lab state.
phase_a:
  required_cards: 5           # ≥5 schema-valid cards filed from one full operator cycle
  required_exits: 1           # ≥1 candidate through exit (a) or (b)
  completed: true             # operator ratified early (2026-07-09 chat directive)
  notes: 'Operator-directed early flip 2026-07-09; Phase-A earn-in superseded by direct ratification. Identity switched to OAuth in the same ruling.'

# Model roles (CHF-R17: LLM chain only — no cortex model changes).
model_roles:
  generator: 'claude-sonnet-4-6'          # pack → JSON card array
  skeptic: 'claude-opus-4-8'             # cards → categorical ADVISORY findings
  compiler: 'claude-haiku-4-5-20251001'  # surviving cards → strict schema JSON

# Weekly budget cap (CHF-R8 + causal_ingest_brainstorm ISO-week lock: ≤3/week).
# This config value is advisory; the hard enforcement is in causal_ingest_brainstorm.py.
weekly_budget_cards: 3
