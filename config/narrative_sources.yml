# ── Google Trends term map ────────────────────────────────────────────────────
# ticker -> ONE consumer search term (a brand or product) whose Google search
# interest is a meaningful demand / attention proxy. Weekly relative-interest 0-100
# is collected by collectors/google_trends.py (pytrends, ~20/night rotating) into
# data/google_trends/<TICKER>.parquet; the Stage Analysis page reads it via
# engine/altdata_stage.py as a DISPLAY-ONLY fade-risk / crowding CAUTION chip
# (never a gate — SGA-R2/R4). Curation gate: only liquid, brand-name tickers where a
# consumer searches the PRODUCT (not the ticker) — search interest is noise for
# B2B / holding-co / commodity names, so those are deliberately absent. The map is
# small on purpose and GROWS with the fresh-Stage-2 board as brand-name names surface.
google_trends:
  terms:
    AAPL: "iphone"
    TSLA: "tesla"
    AMZN: "amazon"
    GOOGL: "google"
    META: "instagram"
    MSFT: "xbox"
