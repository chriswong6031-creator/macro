# Narrative Ignition W2 — PR-reviewed feed registry (NAR-R11)
# Public-tier sources only: no auth, no paywall circumvention, no credentials.
# Citrini feeds are EXCLUDED — owned by the CITR program (research/CITRINI_HANDOFF_FOR_NEW_SESSION.md).
# All additions/removals require a PR (this file is the R-TIL-9 curation gate).

# ── Substack RSS feeds ────────────────────────────────────────────────────────
# Each entry: feed_id (slug, stable dedup key), rss_url (public RSS), description.
# Public RSS endpoints serve title + teaser; no paywall content is parsed.
substack_rss:
  - feed_id: semianalysis
    rss_url: "https://www.semianalysis.com/feed"
    description: "SemiAnalysis — semiconductor & AI infrastructure deep dives"

  - feed_id: doomberg
    rss_url: "https://doomberg.substack.com/feed"
    description: "Doomberg — energy & industrial commodities"

  - feed_id: geopolitical_futures
    rss_url: "https://geopoliticalfutures.com/feed/"
    description: "Geopolitical Futures — macro geopolitical analysis"

  - feed_id: clouded_judgment
    rss_url: "https://cloudedjudgement.substack.com/feed"
    description: "Clouded Judgment — SaaS / public-market software"

  - feed_id: banking_on_ai
    rss_url: "https://bankingonai.substack.com/feed"
    description: "Banking on AI — AI adoption in fintech and financial services"

