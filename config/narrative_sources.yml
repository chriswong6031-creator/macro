# ── EDGAR 8-K velocity universe note ─────────────────────────────────────────
# The Edgar8kVelocityAdapter uses the same SP1500 large-cap universe as the
# polygon_news breadth universe (data/{breadth,midcap_breadth,smallcap_breadth}/
# constituents.parquet) plus the narrative basket membership.json. No separate
# registry needed — the universe is derived at runtime from those stores.
# CIK mapping via data/edgar/company_tickers.json (monthly refresh in collect.py).
edgar_8k_velocity:
  universe_note: >
    SP1500 large-cap slice via breadth/constituents.parquet union
    baskets/membership.json. CIK map from data/edgar/company_tickers.json.
  pace_s: 0.12
  lookback_days: 90
  stale_days: 3
