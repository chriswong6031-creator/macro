    # PR-W2: Prophet is the NW governor lobe federating the standout accountability
    # machinery across US/CN/HK/CA/intl (PR-R1). Dict-form fitness_sensors promote
    # prophet to loop-manageable (R-V4-10 charter mechanism). Roster: 65 → 66 of 66
