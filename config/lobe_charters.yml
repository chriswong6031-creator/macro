      maturity_date: '2026-09-15'
      accruing: true
      description: Fraction of matured picks with a committed autopsy artifact; rises as pick lab fires mature (PR-R3).
    - id: dashboard_freshness
      store: data/neuralweb/prophet_status.json
      maturity_date: '2026-09-15'
      accruing: true
      description: Fraction of monitored artifacts within SLA across all markets (PR-R6 dashboard-integrity).
