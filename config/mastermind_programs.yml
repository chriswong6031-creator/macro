    name: Macro Context Index across all repositories
    flow_type: retrieval
    purpose: Retrieve governed Macro, Terminal, and Portfolio documents through one project context architecture.
    participants:
      - repo: macro
        role: control_plane
      - repo: terminal
        role: consumer
      - repo: mastermind
        role: consumer
    authority_note: Retrieval preserves source authority classes and does not create new runtime authority.
    canonical_refs:
      - repo: macro
        path: config/context_index.yml
    implementation:
      - repo: macro
        roots:
          - config/context_index.yml
          - engine/context_index/

