schema: mastermind_programs.v1

meta:
  title: Mastermind-X global semantic system registry
  canonical_home: macro
  generated_output: docs/MASTERMIND_SYSTEM_MAP.md
  description: >
    Operator-curated semantic truth for the complete three-repository Mastermind-X
    organism. This layer explains durable ownership, relationships, repository
    boundaries, product exposure, and authority boundaries. It does not replace
    Synapse artifact truth, lobe charters, runtime contracts, rulings, or the
    project Active Build Map.
  authority: architecture_and_advisory_only
  repository_baselines:
    macro: b49eae4ef69b97581208cd872004f111786381cd
    terminal: eb5216452d17822b76c6d1177e3761f8477dfa95
    mastermind: 26b31066f4a850445b1bd25c4ee45d4f59938537
  source_registries:
    - repo: macro
      path: config/synapse.yml
    - repo: macro
      path: config/lobe_charters.yml
    - repo: macro
      path: config/context_index.yml
    - repo: macro
      path: research/DO_NOT_REBUILD.md
  maintenance: >
    Change this file only when durable architecture changes. Put live PR state,
    collisions, and recently merged work in the project Active Build Map.
  known_unresolveds:
    - No direct current-head Terminal to Mastermind Portfolio import, API, or schema contract is proven.
    - Portfolio vendor/macro is a symlink to a managed sparse checkout that floats with Macro origin/main; no live imported Macro SHA is attested.
    - The live Portfolio Prophet adapter is absent from Portfolio config/contracts.yml.
    - Macro publishes Neural Web context with all authority booleans false, but Portfolio defaults context prompts on and decision mode to shrink while its authority map says both default off; deployed runtime authority is un-attested.
    - Several live Terminal bridges rely on implementation tests rather than formal schemas under Terminal contracts.
    - Macro owner labels codex-b5, engine-fix, and hk-canada remain explicitly split instead of being force-mapped.
    - Nine lobe charters use the causal-hypothesis-factory owner even though its canonical charter defines CHF as a program, not a lobe; this operational-registry contradiction remains unresolved.

ontology:
  program_kinds:
    - cognitive_system
    - cognitive_service
    - decision_engine
    - intelligence_program
    - semantic_rail
    - data_plane
    - research_program
    - infrastructure
    - project_infrastructure
  lifecycle_states:
    - operating
    - building
    - planned
    - parked
    - dormant
    - deprecated
  scopes:
    - repository
    - project
  relationship_types:
    - contains
    - extends
    - consumes_from
    - feeds_context_to
    - governs
    - evaluates
    - persists
    - renders_through
    - coordinates_with
  relationship_modes:
    - conceptual
    - planned
    - implemented
    - contracted
    - research_adapter
  repository_roles:
    - implementation_owner
    - producer
    - consumer
    - adapter
    - renderer
    - publisher
    - control_plane
    - state_owner
    - product_host
  contract_flow_types:
    - data
    - context
    - decision_receipt
    - presentation
    - publication
    - authentication
    - provider_capacity
    - operational_control
    - retrieval
  authority_classes:
    - advisory_only
    - context_only
    - display_only
    - research_only
    - decision_bearing
    - deterministic_control
    - presentation_only
    - operational_control
  owner_dispositions:
    - mapped
    - alias_of
    - subprogram_of
    - infrastructure_only
    - dormant
    - deprecated
    - unresolved_split
    - unresolved
  domain_dispositions:
    - mapped
    - infrastructure_only
    - proposal_only
    - prototype_not_deployed
    - unresolved

categories:
  cognitive_architecture:
    name: Cognitive architecture
    description: Memory, synthesis, retrieval, and operator-facing reasoning systems.
  decision_and_portfolio:
    name: Decision and portfolio systems
    description: Candidate selection, paper-book decisions, deterministic controls, and accountability.
  market_intelligence:
    name: Market intelligence
    description: Durable domain programs that produce evidence, context, and research.
  terminal_capabilities:
    name: Terminal analytical capabilities
    description: Workstation-owned market data, charting, signal records, alerts, and user-state behavior.
  semantic_and_data_rails:
    name: Semantic and data rails
    description: Governed context, contracts, and publication paths between systems.
  project_infrastructure:
    name: Project infrastructure
    description: Shared coordination, authentication, provider, retrieval, and governance services.

repositories:
  macro:
    name: Macro Dashboard
    github: mastermindx-market-intelligence/macro
    default_branch: main
    role: >
      Global semantic home, market-intelligence production system, Neural Web and
      Prophet host, web dashboard publisher, entitlement authority, and shared
      cross-repository context plane.
    owns:
      - Market and macro intelligence artifacts and their evidence contracts
      - Neural Web context publication and Prophet upstream decisions
      - Canonical billing and entitlement state
      - Global ontology, Context Index, rulings, and signal registry
    does_not_own:
      - Terminal chart interaction or user workspace state
      - Mastermind paper-book sizing, settlement, or portfolio ledgers
    canonical_orientation:
      - repo: macro
        path: CLAUDE.md
      - repo: macro
        path: docs/SIGNAL_BUS.md
      - repo: macro
        path: research/MASTERMIND_SUPERINTELLIGENCE_MASTERPLAN.md
  terminal:
    name: Mastermind Terminal
    github: mastermindx-market-intelligence/mastermind-terminal
    default_branch: master
    role: >
      Canonical responsive market workstation and presentation/control plane,
      with its own quote, ingest, signal-record, alert, and user-state systems.
    owns:
      - Interactive charts, drawings, indicators, workspaces, and user state
      - BFF validation, quote ingestion, signal records, and alert behavior
      - Terminal product composition and native thin-shell behavior
    does_not_own:
      - Macro upstream intelligence, Prophet, Neural Web, or billing authority
      - Mastermind autonomous paper-book allocation
    canonical_orientation:
      - repo: terminal
        path: AGENTS.md
      - repo: terminal
        path: DEPLOY.md
      - repo: terminal
        path: terminal/AGENTS.md
  mastermind:
    name: Mastermind Portfolio
    github: mastermindx-market-intelligence/Mastermind
    default_branch: master
    role: >
      Seven-book paper-only portfolio operating system with deterministic managed-book
      sizing, deterministic constraints for user-sized self-directed orders, marking,
      settlement, control-plane governance, learning, and bounded publication to Macro.
    owns:
      - Paper portfolio state, mandates, managed-book sizing, self-directed constraints, and simulated settlement
      - Portfolio decision and outcome ledgers
      - Portfolio learning, experiments, and operator workflows
    does_not_own:
      - Macro signal origination or Prophet sizing authority
      - Terminal charting and user analytics
      - Broker execution
    canonical_orientation:
      - repo: mastermind
        path: AGENTS.md
      - repo: mastermind
        path: research/MASTERMIND_CHARTER_V2.md
      - repo: mastermind
        path: research/MASTERMIND_V2_ARCHITECTURE.md

programs:
  mastermind-semantic-system-map:
    name: Mastermind-X Semantic System Map
    category: project_infrastructure
    kind: project_infrastructure
    lifecycle_state: operating
    scope: project
    purpose: Provide one durable self-model for the complete three-repository organism.
    strategic_role: Let agents place work correctly before inventing a program, contract, or product seam.
    owns:
      - Durable program identity and conceptual ownership
      - Repository-aware relationships and product bindings
      - Explicit ontology coverage dispositions
    does_not_own:
      - Live PR state or path collisions
      - Artifact runtime facts, lobe lifecycle, or decision authority
    repo_bindings:
      - repo: macro
        role: implementation_owner
    relationships:
      coordinates_with:
        - project-active-build-control
        - cross-repo-contract-governance
        - macro-context-index
    canonical_docs:
      - repo: macro
        path: docs/MASTERMIND_SYSTEM_MAP.md
    implementation:
      - repo: macro
        roots:
          - config/mastermind_programs.yml
          - scripts/build_mastermind_system_map.py
    product_surfaces: []
    decision_boundary:
      authority_class: advisory_only
      summary: Names architecture and points to authority owners but changes no runtime behavior.

  project-active-build-control:
    name: Project Active Build Control
    category: project_infrastructure
    kind: project_infrastructure
    lifecycle_state: operating
    scope: project
    purpose: Show current and recently merged work, collisions, and declared cross-repo dependencies across all three repositories.
    strategic_role: Reduce duplicate builds and cross-session merge collisions without becoming a release gate.
    owns:
      - Advisory live-build inventory
      - Same-repository changed-path collision detection
      - Explicit PR dependency extraction
    does_not_own:
      - Durable program truth
      - Merge authorization or runtime gating
    repo_bindings:
      - repo: macro
        role: implementation_owner
    relationships:
      coordinates_with:
        - mastermind-semantic-system-map
        - cross-repo-contract-governance
    canonical_docs:
      - repo: macro
        path: docs/PROJECT_ACTIVE_BUILD_MAP.md
      - repo: macro
        path: docs/ACTIVE_BUILD_MAP.md
    implementation:
      - repo: macro
        roots:
          - scripts/build_project_active_build_map.py
          - data/governance/project_active_builds.json
    product_surfaces: []
    decision_boundary:
      authority_class: advisory_only
      summary: Reports live coordination state and gates nothing.

  cross-repo-contract-governance:
    name: Cross-Repository Contract Governance
    category: project_infrastructure
    kind: project_infrastructure
    lifecycle_state: building
    scope: project
    purpose: Make producer, consumer, presentation, privacy, and authority seams explicit across repositories.
    strategic_role: Detect hidden dependencies and fallback-green failures before they become product drift.
    owns:
      - Global contract inventory and boundary findings
      - Repo-aware producer and consumer responsibility descriptions
    does_not_own:
      - Payload schemas owned by implementation contracts
      - Runtime promotion or trading authority
    repo_bindings:
      - repo: macro
        role: implementation_owner
      - repo: terminal
        role: consumer
      - repo: mastermind
        role: consumer
    relationships:
      governs:
        - macro-intelligence-adapter
        - portfolio-publication
        - shared-auth-entitlements
        - shared-ai-provider-control
      coordinates_with:
        - project-active-build-control
    canonical_docs:
      - repo: macro
        path: research/CROSS_REPO_CONTRACT_BOUNDARY_AUDIT_2026-08-11.md
    implementation:
      - repo: macro
        roots:
          - config/mastermind_programs.yml
    product_surfaces: []
    decision_boundary:
      authority_class: advisory_only
      summary: Audits seams and records owners without changing payload behavior.

  shared-auth-entitlements:
    name: Shared Authentication and Entitlements
    category: project_infrastructure
    kind: project_infrastructure
    lifecycle_state: operating
    scope: project
    purpose: Carry authenticated identity and canonical paid-product entitlement between Macro and Terminal.
    strategic_role: Keep billing authority centralized while allowing repository-local fail-closed presentation gates.
    owns:
      - Macro-to-Terminal identity and entitlement boundary
      - Separation of canonical billing state from UI hints
    does_not_own:
      - Terminal user-workspace contents
      - Portfolio operator bearer authentication, personal-portfolio CRUD, or mutation-route policy
    repo_bindings:
      - repo: macro
        role: control_plane
      - repo: terminal
        role: adapter
    relationships:
      coordinates_with:
        - terminal-user-services
        - macro-mastermind-ai
    canonical_docs:
      - repo: terminal
        path: terminal/AGENTS.md
      - repo: macro
        path: CLAUDE.md
    implementation:
      - repo: macro
        roots:
          - app/
      - repo: terminal
        roots:
          - terminal/lib/entitlement.ts
          - terminal/app/api/billing/
    product_surfaces:
      - macro-dashboard
      - terminal-workstation
    decision_boundary:
      authority_class: operational_control
      summary: Macro owns canonical billing state; Terminal owns its fail-closed entitlement proxy and UI behavior. Portfolio uses a separate operator bearer plane.
      authority_sources:
        - repo: macro
          path: CLAUDE.md
        - repo: terminal
          path: terminal/AGENTS.md

  shared-ai-provider-control:
    name: Shared AI Provider Control Plane
    category: project_infrastructure
    kind: project_infrastructure
    lifecycle_state: operating
    scope: project
    purpose: Share provider discovery, authentication pools, cooling, and quota state across Macro and Portfolio reasoning services.
    strategic_role: Prevent isolated credential islands while keeping deterministic fallbacks local to the caller.
    owns:
      - Provider availability and capacity coordination
      - Shared authentication-pool and cooling semantics
    does_not_own:
      - Portfolio book tools or deterministic fallbacks
      - Reasoning product semantics
    repo_bindings:
      - repo: macro
        role: control_plane
      - repo: mastermind
        role: adapter
    relationships:
      coordinates_with:
        - macro-mastermind-ai
        - portfolio-mastermind-ai
        - portfolio-desk
    canonical_docs:
      - repo: mastermind
        path: AGENTS.md
    implementation:
      - repo: macro
        roots:
          - engine/codex_provider.py
          - engine/llm_auth.py
          - engine/neuralweb/key_pool.py
      - repo: mastermind
        roots:
          - brain/provider_waterfall.py
          - brain/key_rotor.py
          - brain/client.py
    product_surfaces:
      - macro-mastermind-ai
      - portfolio-operator
    decision_boundary:
      authority_class: operational_control
      summary: Coordinates provider capacity only; it grants no market or portfolio authority.
      authority_sources:
        - repo: macro
          path: CLAUDE.md
        - repo: mastermind
          path: AGENTS.md

  macro-context-index:
    name: Macro Context Index
    category: project_infrastructure
    kind: project_infrastructure
    lifecycle_state: building
    scope: project
    purpose: Retrieve governed project context from Macro and the two sibling repositories.
    strategic_role: Give agents one authority-classed retrieval entry point without duplicating source documents.
    owns:
      - Context source discovery and authority-class metadata
      - Project-aware retrieval routes
    does_not_own:
      - Source-document truth or semantic program ownership
      - Runtime market context
    repo_bindings:
      - repo: macro
        role: implementation_owner
      - repo: terminal
        role: consumer
      - repo: mastermind
        role: consumer
    relationships:
      consumes_from:
        - mastermind-semantic-system-map
      coordinates_with:
        - macro-context-rail
    canonical_docs:
      - repo: macro
        path: research/MACRO_CONTEXT_INDEX_BUILD_DOCKET_FOR_FABLE.md
    implementation:
      - repo: macro
        roots:
          - config/context_index.yml
          - engine/context_index/
    product_surfaces: []
    decision_boundary:
      authority_class: advisory_only
      summary: Retrieves project sources; it does not convert them into decision authority.

  neural-web:
    name: Neural Web
    category: cognitive_architecture
    kind: cognitive_system
    lifecycle_state: operating
    scope: project
    purpose: Govern memory, context routing, evidence synthesis, attention, contradiction, and system learning.
    strategic_role: Connect specialized intelligence without turning one cognitive layer into every decision engine.
    owns:
      - Cognitive routing, memory, metabolism, and governance
      - Context synthesis and evidence-aware attention
      - Context publication to authorized consumers
    does_not_own:
      - Signal origination, stock picks, portfolio sizing, or execution
      - Oracle rotation or Prophet decision authority
    repo_bindings:
      - repo: macro
        role: implementation_owner
      - repo: terminal
        role: consumer
      - repo: mastermind
        role: consumer
    relationships:
      contains:
        - operating-cortex
        - market-memory
      consumes_from:
        - macro-context-rail
        - thematic-intelligence
        - market-regime-risk
        - causal-hypothesis-factory
      feeds_context_to:
        - prophet
        - macro-mastermind-ai
        - portfolio-desk
        - target: terminal-charting
          mode: contracted
          contract: macro-terminal-neural-web
          note: Terminal renders the contracted display-only context; no signal or decision authority transfers.
      coordinates_with:
        - signal-governance
    canonical_docs:
      - repo: macro
        path: research/NEURAL_WEB_MASTERPLAN_BY_FABLE.md
      - repo: macro
        path: docs/NEURAL_WEB_CASE_LAW.md
    implementation:
      - repo: macro
        roots:
          - engine/neuralweb/
          - scripts/build_neuralweb_brief.py
          - site/neuralwebdata/
    product_surfaces:
      - macro-dashboard
      - terminal-workstation
      - portfolio-operator
    decision_boundary:
      authority_class: context_only
      summary: Context and cognition only unless a separate ratified consumer contract explicitly promotes an input.

  operating-cortex:
    name: Operating Cortex
    category: cognitive_architecture
    kind: cognitive_service
    lifecycle_state: operating
    scope: repository
    purpose: Provide deterministic attention, contradiction, retrieval, and hypothesis support inside Neural Web.
    strategic_role: Turn governed evidence into inspectable cognitive assistance for operator and agent workflows.
    owns:
      - Attention and contradiction surfaces
      - Context retrieval and hypothesis assistance
    does_not_own:
      - Ranking, gating, sizing, veto, execution, or signal origination
      - Synthetic Market Memory research outputs not wired into the live cortex
    repo_bindings:
      - repo: macro
        role: implementation_owner
    relationships:
      consumes_from:
        - macro-context-rail
      coordinates_with:
        - target: market-memory
          mode: planned
          note: No live Market Memory adapter is wired into engine/neuralweb/cortex.py.
      feeds_context_to:
        - macro-mastermind-ai
    canonical_docs:
      - repo: macro
        path: research/MASTERMIND_SUPERINTELLIGENCE_MASTERPLAN.md
    implementation:
      - repo: macro
        roots:
          - engine/neuralweb/cortex.py
          - engine/neuralweb/ask_brain.py
    product_surfaces:
      - macro-mastermind-ai
    decision_boundary:
      authority_class: context_only
      summary: Assists cognition but cannot alter money-path decisions.

  market-memory:
    name: Market Memory
    category: cognitive_architecture
    kind: data_plane
    lifecycle_state: building
    scope: repository
    purpose: Preserve point-in-time, as-known-at historical state and analogue-retrieval foundations.
    strategic_role: Let cognition compare current conditions with honest prior states without hindsight leakage.
    owns:
      - Point-in-time memory foundations and replayable context
      - Analogue evidence stores and provenance
    does_not_own:
      - A complete market simulator
      - Domain facts, options episodes, Prophet decisions, or portfolio authority
    repo_bindings:
      - repo: macro
        role: implementation_owner
    relationships:
      feeds_context_to:
        - target: research-factory
          mode: research_adapter
          evidence_refs:
            - macro:engine/research_factory/adapter_market_memory.py
          note: The implemented adapter is research-only and is not wired into the live Operating Cortex.
      coordinates_with:
        - target: operating-cortex
          mode: planned
          note: The synthetic W5A kernel is not the live Cortex; a live adapter requires separate review.
        - neural-web
        - causal-hypothesis-factory
        - signal-episode-atlas
    canonical_docs:
      - repo: macro
        path: research/KONSEKI_CLEAN_ROOM_MARKET_MEMORY_AND_COGNITIVE_ARCHITECTURE_FOR_FABLE_2026-08-08.md
    implementation:
      - repo: macro
        roots:
          - engine/neuralweb/market_memory.py
          - contracts/market_memory/
    product_surfaces: []
    decision_boundary:
      authority_class: context_only
      summary: Historical context and research foundation only.

  macro-mastermind-ai:
    name: Mastermind AI for Macro
    category: cognitive_architecture
    kind: cognitive_service
    lifecycle_state: operating
    scope: repository
    purpose: Provide an operator-facing Analyst OS over governed Macro evidence and tools.
    strategic_role: Make the intelligence system interrogable without handing the language layer hidden market authority.
    owns:
      - Macro user conversation, explanation, and governed tool orchestration
      - Brain-to-Terminal chart command origin and quota boundary
    does_not_own:
      - Portfolio scheduled-manager reasoning
      - Deterministic rank, gate, size, or execution authority
    repo_bindings:
      - repo: macro
        role: implementation_owner
      - repo: terminal
        role: renderer
    relationships:
      consumes_from:
        - operating-cortex
        - neural-web
        - prophet
      renders_through:
        - terminal-charting
      coordinates_with:
        - shared-auth-entitlements
        - shared-ai-provider-control
    canonical_docs:
      - repo: macro
        path: research/MASTERMIND_SUPERINTELLIGENCE_MASTERPLAN.md
    implementation:
      - repo: macro
        roots:
          - engine/neuralweb/brain_gateway.py
          - site/mm_brain.js
      - repo: terminal
        roots:
          - terminal/components/BrainWidget.tsx
          - terminal/lib/chartBus.ts
    product_surfaces:
      - macro-mastermind-ai
      - terminal-brain
    decision_boundary:
      authority_class: advisory_only
      summary: Explains and orchestrates governed tools but does not silently acquire their authority.

  portfolio-mastermind-ai:
    name: Mastermind AI for Portfolio
    category: cognitive_architecture
    kind: cognitive_service
    lifecycle_state: operating
    scope: repository
    purpose: Provide portfolio-operator reflection, nudges, directives, and chat.
    strategic_role: Expose portfolio accountability and reasoning separately from scheduled book-manager brains.
    owns:
      - Operator-facing portfolio reflection and dialogue
      - Portfolio nudges and directives
    does_not_own:
      - Scheduled portfolio-manager decisions
      - Deterministic sizing, gates, settlement, or broker execution
    repo_bindings:
      - repo: mastermind
        role: implementation_owner
    relationships:
      consumes_from:
        - portfolio-learning-accountability
        - macro-intelligence-adapter
      coordinates_with:
        - shared-ai-provider-control
    canonical_docs:
      - repo: mastermind
        path: research/MASTERMIND_CHARTER_V2.md
    implementation:
      - repo: mastermind
        roots:
          - brain/mastermind_ai.py
          - brain/nw_reflection.py
          - brain/advisor.py
          - app/web.py
    product_surfaces:
      - portfolio-operator
    decision_boundary:
      authority_class: advisory_only
      summary: Operator cognition only; portfolio engines retain binding controls.

  research-factory:
    name: Research Factory
    category: cognitive_architecture
    kind: research_program
    lifecycle_state: operating
    scope: repository
    purpose: Govern candidate research, deduplication, challenge design, and evidence progression.
    strategic_role: Convert curiosity into inspectable research without prematurely promoting claims.
    owns:
      - Candidate lifecycle, deduplication, challenge, and evidence receipts
      - Research provenance and progression through nonbinding stages
    does_not_own:
      - Live signal admission or portfolio decisions
    repo_bindings:
      - repo: macro
        role: implementation_owner
    relationships:
      feeds_context_to:
        - neural-web
        - signal-governance
      coordinates_with:
        - causal-hypothesis-factory
    canonical_docs:
      - repo: macro
        path: research/RESEARCH_FACTORY_MASTERPLAN_BY_FABLE.md
    implementation:
      - repo: macro
        roots:
          - engine/research_factory/
          - scripts/research_factory_run.py
    product_surfaces:
      - macro-research-workbenches
    decision_boundary:
      authority_class: research_only
      summary: Produces candidates and evidence, not live decisions.

  causal-hypothesis-factory:
    name: Causal Hypothesis Factory
    category: cognitive_architecture
    kind: research_program
    lifecycle_state: operating
    scope: repository
    purpose: Generate and falsify causal explanations around observed market conditions.
    strategic_role: Act as an idea immune system rather than a signal generator.
    owns:
      - Hypothesis generation, challenge, falsification, and evidence receipts
    does_not_own:
      - Signals, ranks, gates, sizes, or trades
      - A lobe identity or lobe-cap slot; its canonical charter defines CHF as a program
    repo_bindings:
      - repo: macro
        role: implementation_owner
    relationships:
      coordinates_with:
        - target: market-memory
          mode: planned
          note: Market Memory has no live store or adapter into CHF at the audited baseline.
      feeds_context_to:
        - neural-web
        - research-factory
    canonical_docs:
      - repo: macro
        path: research/CAUSAL_HYPOTHESIS_FACTORY_MASTERPLAN_BY_FABLE.md
    implementation:
      - repo: macro
        roots:
          - engine/neuralweb/causal_frontier.py
          - scripts/run_causal_brainstorm.py
    product_surfaces:
      - macro-research-workbenches
    notes: >
      Raw lobe-charter coverage currently reports nine charters under this owner.
      That conflicts with the canonical CHF program-not-lobe ruling and is surfaced
      as an unresolved operational-registry inconsistency, not endorsed here.
    decision_boundary:
      authority_class: research_only
      summary: Hypotheses remain nonbinding until another governed system qualifies them.
    ontology_status:
      classification: program_not_lobe
      consumes_lobe_cap: false
      source:
        repo: macro
        path: research/CAUSAL_HYPOTHESIS_FACTORY_MASTERPLAN_BY_FABLE.md
      conflict_note: Nine raw lobe-charter rows still carry this owner label and remain an explicit operational-registry contradiction.

  macro-context-rail:
    name: Neural Web Macro Context Rail
    category: semantic_and_data_rails
    kind: semantic_rail
    lifecycle_state: operating
    scope: repository
    purpose: Normalize governed runtime macro context for Neural Web consumers.
    strategic_role: Separate retrieval indexing from live as-of-aware context consumption.
    owns:
      - Runtime macro-context envelopes and reader semantics
    does_not_own:
      - Project-document retrieval
      - Underlying domain facts or decision authority
    repo_bindings:
      - repo: macro
        role: implementation_owner
    relationships:
      feeds_context_to:
        - neural-web
        - operating-cortex
      coordinates_with:
        - macro-context-index
    canonical_docs:
      - repo: macro
        path: research/NW_MACRO_CONTEXT_RAIL_MASTERPLAN_BY_FABLE.md
    implementation:
      - repo: macro
        roots:
          - scripts/build_macro_context.py
    product_surfaces: []
    decision_boundary:
      authority_class: context_only
      summary: Carries runtime context and inherits the authority of its source contracts.

  signal-governance:
    name: Signal Governance and Metabolism
    category: semantic_and_data_rails
    kind: infrastructure
