        role: producer
      - repo: terminal
        role: adapter
    authority_note: >
      Receipts remain opaque. Terminal validates the whole artifact before writes,
      preserves last-good state for omitted symbols, and clears only on explicit empty.
    canonical_refs:
      - repo: terminal
        path: ingest/pull_macro_opportunities.py
    implementation:
