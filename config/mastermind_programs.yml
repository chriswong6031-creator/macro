    flow_type: data
    purpose: Refresh bounded Macro artifacts for Portfolio sizing-freeze inputs and context readers.
    participants:
      - repo: macro
        role: producer
      - repo: mastermind
        role: adapter
    authority_note: >
      Portfolio validates and consumes whitelisted inputs under local controls. Current
      implementation follows latest Macro origin/main through a tracked symlink and is
      not genuinely pinned despite stale submodule wording.
    canonical_refs:
      - repo: mastermind
        path: config/contracts.yml
    implementation:
      - repo: mastermind
        roots:
          - data_layer/macro_refresh.py

  macro-mastermind-prophet:
    name: Macro Prophet to Portfolio
    flow_type: decision_receipt
    purpose: Supply prophet.index/v1 candidates and trade geometry to Portfolio managers.
    participants:
      - repo: macro
        role: producer
      - repo: mastermind
        role: adapter
    authority_note: Prophet is additive discovery and geometry only; it cannot size, gate, or vote in Portfolio.
    canonical_refs:
      - repo: mastermind
        path: portfolio/prophet_feed.py
    implementation:
      - repo: mastermind
        roots:
          - portfolio/prophet_feed.py

  macro-mastermind-neural-web:
    name: Macro Neural Web context to Portfolio
    flow_type: context
    purpose: Supply freshness-gated mastermind_context.json to Portfolio reasoning.
    participants:
      - repo: macro
        role: producer
      - repo: mastermind
        role: adapter
    authority_note: >
      Macro declares the artifact context-only and publishes all authority booleans false.
      Portfolio source currently defaults MASTERMIND_NW_CONTEXT on and
      MASTERMIND_NW_DECISION to shrink, contrary to config/authority_map.yml default-off
      claims. Effective runtime authority is un-attested; fail closed until producer
      contract, consumer defaults, governance map, tests, and deployment agree.
    canonical_refs:
      - repo: mastermind
        path: brain/neural_web_context.py
    implementation:
      - repo: mastermind
        roots:
          - brain/neural_web_context.py

  mastermind-macro-public-snapshot:
    name: Portfolio public snapshot to Macro
    flow_type: publication
    purpose: Publish mastermind_snapshot.v1 across all registered paper books to Macro-hosted surfaces.
    participants:
      - repo: mastermind
        role: publisher
      - repo: macro
        role: product_host
    authority_note: >
      Position and pending-order rows use key projections, while other selected book
      fields and the performance block are copied as constructed. The public projection
      excludes per-position cost_basis, entry_price, current_price, shares, and
      notional or market value. It intentionally includes tickers, weights, reasoning
      and entry-level prose, plus aggregate simulated starting_nav, current_nav, cash,
      invested, and dollar-valued series and notes. Portfolio ledgers remain authoritative.
    canonical_refs:
      - repo: mastermind
        path: bridge/macro_snapshot.py
    implementation:
      - repo: mastermind
        roots:
          - bridge/macro_snapshot.py
      - repo: macro
        roots:
          - site/mastermind/

  mastermind-macro-neural-feedback:
    name: Portfolio Neural Web feedback to Macro
    flow_type: context
    purpose: Publish mastermind_nw_feedback.v3 counts, codes, outcomes, audits, reflection, bounded nudge detail, and intake-scrubbed operator directives to Macro consumers.
    participants:
      - repo: mastermind
        role: publisher
      - repo: macro
        role: consumer
    authority_note: >
      Structured ledger-derived fields omit tickers, position sizes, and notional
      values. Bounded operator-directive prose is public, is not ticker-scrubbed,
      and receives pattern-based secret redaction; it transfers no portfolio-control
      authority. The public v3 payload also includes up to ten bot-authored nudge
      detail strings plus opaque IDs and dates. Macro re-whitelists its derived
      summary to counts and codes with all authority booleans false.
    canonical_refs:
      - repo: mastermind
        path: bridge/nw_feedback.py
    implementation:
      - repo: mastermind
        roots:
          - bridge/nw_feedback.py

  mastermind-macro-private-ops:
    name: Portfolio non-site operations to Macro data
    flow_type: publication
    purpose: Commit exact-path cost, key-event, and provider-pool status artifacts into Macro administration.
    participants:
      - repo: mastermind
        role: publisher
      - repo: macro
        role: consumer
    authority_note: >
      These artifacts are outside HTTP-served site/ paths but are committed to Macro's
      public repository. Treat cost, key-event, provider-key ID, and pool-status metadata
      as public-repository-visible; move transport out of public Git if confidentiality
      is required.
    canonical_refs:
      - repo: mastermind
        path: docs/DELIVERY_WORKFLOW.md
    implementation:
      - repo: mastermind
        roots:
          - scripts/export_macro_snapshot.py
          - app/scheduler.py

  shared-provider-control-plane:
