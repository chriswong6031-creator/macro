cross_repo_contracts:
  terminal-auth-entitlement:
    name: Macro entitlement gateway to Terminal
    flow_type: authentication
    purpose: Carry Terminal Supabase identity to Macro canonical billing and entitlement truth.
    participants:
      - repo: macro
        role: control_plane
      - repo: terminal
        role: adapter
    authority_note: >
      Macro owns Stripe secrets and canonical tier/status. Terminal owns fail-closed
      proxy and UI behavior. Terminal profile flags are hints only, negative or error
      results are not cached, and client authorization is not forwarded upstream.
    canonical_refs:
      - repo: terminal
        path: terminal/AGENTS.md
    implementation:
      - repo: terminal
        roots:
          - terminal/lib/entitlement.ts
          - terminal/app/api/billing/gateway.ts

  macro-brain-terminal-chart-bus:
    name: Macro Brain to Terminal Chart Bus
    flow_type: operational_control
    purpose: Deliver typed chart commands and streaming Brain output to the Terminal renderer.
    participants:
      - repo: macro
        role: producer
      - repo: terminal
        role: renderer
    authority_note: >
      Macro owns reasoning, quota, entitlement, and command origin. Terminal validates
      and applies bounded chart mutations. AI drawings remain ephemeral unless a user
      separately saves them.
    canonical_refs:
      - repo: terminal
        path: docs/CHART_ENGINE_MASTERPLAN.md
    implementation:
      - repo: macro
        roots:
          - engine/neuralweb/brain_gateway.py
