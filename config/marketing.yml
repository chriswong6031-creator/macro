## config/marketing.yml — Marketing lobe configuration
## Drives engine/neuralweb/marketing_governor.py
## Spec §5 (frozen contract).
##
## Mixed-tilt model: every desk posts ALL 7 content types; the tilt
## shifts emphasis so desks feel distinct without being clones.
## signal is the largest weight on every account (min 0.28).
## All weights ≥ 0.03.

# Funnel W1a (D07): canonical UTM links — every post-text URL is tagged exactly once.
links:
  base_url: "https://mastermind-x.com/"
  utm_source: "x"
  short_links: true

positioning:
  category: "Accountable AI market intelligence"
  promise: "Know what changed, why it matters, and what to watch next."
  proof: "Every important conclusion carries evidence, invalidation, timestamp, and outcome history."
  icp: "Self-directed, research-intensive swing/position investors following 10–100 names."
  first_paid_job: "Continuously monitor what matters to my holdings/watchlist and tell me when the causal picture changes."

settings:
  trial_variant: "7_trading_days"      # or 14_calendar_days | value_moment_limited
  desk_network_stage: "A"              # A warm | B assisted | C autonomous
  paid_enabled: false
  auditor_strict: true
  north_star_window_days: 90
  radar_tiers_enabled: false           # D06: Movers Desk drops T3 (dead-attention) cashtags when true; off until first nightly verified

radar:
  # megacap/meme always-liquid attention list, operator-editable
  t1_always: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO, AMD, NFLX, PLTR, COIN, HOOD, MSTR, SMCI, GME, AMC]

# ─────────────────────────────────────────────────────────────────────────────
# Sentinel — trust_office W1 plan-level policy gate (engine/marketing/sentinel.py)
#
# D02 actuator LAW: read ALL caps from this block — NEVER hardcode constants
# in the actuator. If this block is absent the sentinel falls back to in-code
# conservative defaults, but the actuator must not have its own fallback copy.
#
# The ramp schedule below is binding once D08 is live. D02 reads
# sentinel.ramp.weeks_1_2 / weeks_3_4 / week_5_plus by account age.
# Week-1-2 numbers come from the D08 red-team appendix (X policy conservative floor).
# ─────────────────────────────────────────────────────────────────────────────
sentinel:
  # Cross-account near-duplicate threshold — lowered from 0.60 to 0.50 per
  # D08_APPENDIX_X_POLICY_REDTEAM §4: finance copy is templated so 0.60 lets
  # genuinely similar posts pass; the policy bar is "substantially similar".
  # Lower = more aggressive blocking; false-positive rewrites are the safe direction.
  near_dup_jaccard: 0.50

  # Base cadence caps.
  # Daily post volume is UNLIMITED (operator 2026-07-24 — autonomous cadence).
  # -1 is the "no limit" sentinel decoded by sentinel._cap_unlimited (null does
  # NOT work: _get collapses a present-null back to the default). Volume is paced
  # instead by the post-time 10-minute floor (min_minutes_between_any_posts, a
  # later phase) + the 2-week link gate below. The code default stays 2 as a safe
  # bounded fallback if this key is ever missing. NOTE: the ramp: table below is
  # currently decorative — no account-age selector reads it (see MASTERPLAN F1).
  max_posts_per_account_per_day: -1   # unlimited
  max_same_cashtag_per_account_per_day: 1
  max_replies_per_account_per_day: 0

  # min_minutes_between_posts is NOT enforced at plan tier (queue slots have no
  # timestamps). It is the contract value the D02 actuator MUST read from here
  # and honour at post time, never post faster than this floor.
  # Base = weeks_1_2 value (120 min); actuator relaxes to 90 at week 5+.
  min_minutes_between_posts: 120

  # Stale-receipts refusal: if the graded-receipts ledger is older than this
  # many days, the whole plan is refused (we must not post receipts we can't back).
  max_receipt_age_days: 7

  # Link policy — new accounts posting links is a named X spam trigger;
  # same link twice is a documented suspension trip (D08 R2). Forbidden until week 5.
  links_allowed: false

  # Media cap per account per day — UNLIMITED (-1). Signal posts carry charts, so
  # a low media cap would quarantine most of them as media_cap_daily once daily
  # volume is unlimited; the two must move together. Residual: all-chart content
  # on a cold account can read as a content farm (D08 R4) — the 10-min floor + the
  # 2-week link gate are the mitigations the operator accepted. Code default stays
  # 1 as a safe fallback.
  max_media_posts_per_account_per_day: -1   # unlimited

  # Per-post cashtag breadth cap — cashtag piggybacking (many tickers in one post)
  # is an actively-suspended financial-spam vector (D08 R3). Cap distinct $TICKER
  # tokens in headline+body. theme_list is exempt (see sentinel.py comment).
  max_cashtags_per_post: 3

  # New-follows cap — follow churn is the fastest X suspension trigger; automated
  # following is banned outright (D08 R7). Any follows in week 5+ must be
  # manual-only, operator-performed. Actuator must never script follows.
  max_new_follows_per_account_per_day: 0

  # Financial-advice phrasing lexicon (word-boundary, case-insensitive).
  # Defense-in-depth at the plan layer — some overlap with copywriter._BANNED_VOCAB
  # is intentional (different seams).
  lexicon_phrases:
    - "you should buy"
    - "you should sell"
    - "get in now"
    - "get in before"
    - "guaranteed"
    - "can't lose"
    - "cannot lose"
    - "sure thing"
    - "easy money"
    - "risk-free"
    - "risk free"
    - "free money"
    - "no-brainer"
    - "back up the truck"
    - "load up"
    - "all-in"
    - "to the moon"
    - "price target guaranteed"

  # Regex patterns (case-insensitive) for financial-advice phrasing.
  lexicon_patterns:
    - '\b(will|going to|gonna)\s+(hit|reach|touch|double|triple|10x)\b'
    - '\bcan''?t\s+(go|drop|fall)\b'

  # Ramp schedule — full per-tier cap table (D08 §3).
  # D02 actuator selects the right tier by account creation date (see desk_network
  # accounts for the `created:` field to fill at account creation).
  # Base values above = weeks_1_2 floor. D02 raises caps when the account ages.
  ramp:
    weeks_1_2:
      max_posts_per_account_per_day: 2
      min_minutes_between_posts: 120
      links_allowed: false
      max_media_posts_per_account_per_day: 1
      max_same_cashtag_per_account_per_day: 1
      max_replies_per_account_per_day: 0
      max_new_follows_per_account_per_day: 0
    weeks_3_4:
      max_posts_per_account_per_day: 3
      min_minutes_between_posts: 120
      links_allowed: false
      max_media_posts_per_account_per_day: 2
      max_same_cashtag_per_account_per_day: 2
      max_replies_per_account_per_day: 0
      max_new_follows_per_account_per_day: 0
    week_5_plus:
      max_posts_per_account_per_day: 4
      min_minutes_between_posts: 90
      links_allowed: true   # ≤1 link post/day enforced by actuator
      max_media_posts_per_account_per_day: 3
      max_same_cashtag_per_account_per_day: 2
      max_replies_per_account_per_day: 2   # Sentinel-gated
      max_new_follows_per_account_per_day: 5   # manual-only; actuator must NOT script follows

# ─────────────────────────────────────────────────────────────────────────────
# Publish — W1 live social publisher (scripts/marketing_publisher.py +
# engine/marketing/social_publisher.py). DARK BY DEFAULT: this block only names
# the backend and per-account channel ids; nothing posts unless BOTH the
# kill-switch env MARKETING_PUBLISH_ENABLED=1 AND the runner's --live flag are
# set. The Buffer personal access token is read from env BUFFER_TOKEN (never
# committed — see .env.example).
# ─────────────────────────────────────────────────────────────────────────────
publish:
  backend: buffer          # only "buffer" is implemented today
  require_approval: true   # only outbox items an operator approved may post
  # Operator decision 2026-07-24 ("auto-approve flagship signals"): the runner
  # auto-advances queued→approved for EVERY item clearing all publish gates
  # (validate_postable, a channel id configured for its account, under the daily
  # cap, not operator-held), then the live tape gate below re-verifies each one
  # against fresh quotes before it actually posts. Flagship-only in practice:
  # only `flagship` has a channel id + enabled:true, and the auto-approve pass
  # skips any account without a configured channel. Note: this is the ONLY lever
  # that clears nightly content_studio signals — auto_approve_kinds is locked to
  # the publish-time mover lane (provenance publisher_live_movers). Set back to
  # false to return to fully-manual approval in the admin Outbox.
  auto_approve: true       # was false; flagship posts autonomously (tape-gated)

  # Chart-image attach (D02 image pipeline). When true, content_studio renders a
  # PNG variant of each single-name signal chart at plan-build time, writes it to
  # data/marketing/outbox/media/<as_of>/<chart_id>.png, and (if R2 creds exist on
  # the nightly Mac) uploads it to the public data plane and stamps media_url on
  # the item; the publisher then attaches media_url to the post. X rejects SVG —
  # PNG only. false = never render, never upload, never attach (text-only). The
  # Sentinel max_media_posts_per_account_per_day cap still governs at post time.
  media_enabled: true

  # Scoped exception to require_approval: kinds listed here auto-approve WHEN the
  # item was generated by the publish-time lane (provenance publisher_live_movers).
  # These are descriptive tape posts (no entry advice), generated seconds before
  # posting from live quotes, sentinel-capped and re-verified by the live tape
  # gate. Operator-authored/nightly items of ANY kind still require approval.
  # Empty list = no exception (fully manual).
  auto_approve_kinds: [mover, theme_list]

  # Post-time live tape gate (engine/marketing/live_verify.py). The content
  # plan is written off yesterday's EOD close; posting slots run mid-session
  # the NEXT day. Every item re-verifies against 15-min-delayed live quotes
  # before it may post: adverse-move / underwater / runaway claims quarantine,
  # unverifiable signals hold until the next slot. Values are pct-points vs
  # prior close unless noted.
  live_gate:
    enabled: true
    max_quote_age_min: 45      # older quote = missing during a posting slot
    signal_adverse_pct: -4.0   # same-day move against the signal direction
    chart_adverse_pct: -7.0    # chart/watchlist posts held on a crash day
    receipt_adverse_pct: -5.0  # no report cards while the name bleeds
    underwater_pct: 0.02       # live price through entry (mirror of plan-time)
    runaway_pct: 0.12          # live price past entry = no longer actionable
    move_claim_min_ratio: 0.3  # mover/theme pct claims must keep sign + 30% size
    earnings_guard: true       # never post a signal into the ticker's print day

  # Publish-time mover/theme generation (engine/marketing/publish_time_content.py).
  # mover ("Mover of the Day") + theme_list ("Theme Tape") posts are the ONE family
  # the nightly plan generates but never emits: a "+7% today" claim written at
  # 23:45 ET is stale by the next open. Instead the publisher generates them AT
  # publish time from the freshest tape in that checkout, auto-approves ONLY this
  # scoped lane (see auto_approve_kinds), and lets the live tape gate re-verify.
  # Text-only (no media → never touches the media cap).
  publish_time_movers:
    enabled: true
    max_per_run: 2           # network-wide new items per slot run
    min_abs_mover_pct: 3.0   # floor for a single-name move claim
    min_abs_theme_pct: 1.0   # floor for a theme-average claim
    max_quote_age_min: 45    # generation freshness gate (mirrors live_gate)
    min_active_tiles: 25     # flat-tape belt: skip unless ≥N S&P names moved ±0.5% (closed-market guard)

  # Per-account Buffer channel id. Empty placeholder until a real token exists —
  # discover the X channel id with:
  #   BUFFER_TOKEN=... python -m scripts.marketing_publisher --list-channels
  channels:
    flagship: "6a61f3d5e2638b94d7bd6c9b"  # @mastermindx001 (twitter)

  # Per-account link policy at POST time. flagship = true: the operator wants
  # links to their own site (mastermind-x.com). This is the publisher-tier gate;
  # the Sentinel plan-tier links_allowed (default false) still governs emission.
  links_allowed:
    flagship: true

departments:
