# Breaking news ingestion (D05 W0)
# engine/marketing/breaking_feed.py reads `breaking.sources`
# engine/marketing/breaking_relevance.py reads `breaking.salience_threshold`
# engine/marketing/breaking_summary.py reads `breaking.llm`
# ─────────────────────────────────────────────────────────────────────────────
breaking:
  poll_interval_s: 300
  user_agent: "MastermindBreakingBot/1.0 (+https://mastermind-x.com)"
  salience_threshold: 60
  sources:
    - key: fed_press
