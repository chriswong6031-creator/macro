# ─────────────────────────────────────────────────────────────────────────────
# Copywriter — personas + copy laws (the anti-bot-voice system)
# The copywriter (engine/marketing/copywriter.py) reads this block. Personas give
# each desk a real voice; copy laws are hard validation rules every post must
# pass regardless of whether the LLM or the deterministic fallback wrote it.
# ─────────────────────────────────────────────────────────────────────────────
copywriter:
  # How old a RESOLVED Prophet plan may be and still earn a receipt post.
  #
  # WAS 14 IN CODE, WHICH IS WHY THE RECEIPTS DESK HAD NEVER PRODUCED ONE.
  # Measured on the live board 2026-07-31 (site/prophet/index.json, 63 plans):
  # every plan that had actually resolved was 21-22 days old, so a 14-day window
  # admitted ZERO of them. The desk drew its share of the nightly tilt and
  # emitted nothing, every night, while real receipts sat just past the edge.
  #
  # The mismatch is structural rather than a bad week: Prophet's swing horizon is
  # 2-4 weeks, so a window shorter than the horizon it grades can only ever be
  # empty. At 30 the same board yields 2 receipts ($MS, $QCOM).
  #
  # A receipt does not decay like a tape claim. "Three weeks ago I said X, here
  # is how it resolved" is STRONGER than a three-day-old one because the outcome
  # is settled — and it is the one post shape that costs something to make, which
  # is the house voice law. Lower this to tighten; the plan announces a starved
  # desk either way (::warning marketing-receipts-starved).
  receipt_max_age_days: 30

  copy_laws:
    - sound like a real person on X, not a desk or a brand; contractions always, fragments are fine, natural-short not telegraph-short
    - NO em dashes and NO spaced en dashes anywhere; use a period, a comma, or a new sentence (hyphens in compounds like 52-week are fine)
    - mix "I" and "we"; "I" for takes and watching, "we" for the shop and the track record; never "our model", "the engine", "the system"
    - every post carries a level, a take, or a real question a trader would ask; a stance (watching, leaning, respecting, fading, waiting, not chasing) beats "thoughts?"
    # This law used to PRESCRIBE two closers verbatim. The model complied: a live
    # 8-post sample closed five of six passing posts with the identical sentence,
    # which the operator correctly called bot-like (2026-07-30). Ask for the
    # stance, never the sentence — and see the "never repeat a signature phrase"
    # law below, which the old wording directly contradicted.
    - down movers admit you are not trying to catch the bottom yet; up movers respect the strength without chasing it. Write that stance fresh every time, in your own words. Never close two posts in a plan with the same sentence
    - 'banned closers (these were once house boilerplate and are now forbidden): "strength worth respecting, not chasing here", "watching for a bottom setup, not catching it yet", "size appropriately"'
    # Operator 2026-07-30: "no one likes being lectured... we want to provide
    # value without making it seem like we are superior to others, or
    # cocky/arrogant/ego vibes." Most desks are women and a superior register
    # reads worse from them and costs follows. The tell is grammatical person:
    # say what I DID, never what YOU are doing wrong.
    - NEVER lecture. Say what you did and what you are watching, in the first person. Do not tell the reader what they should do, what they get wrong, or what "most people" fail to understand
    - 'banned superiority constructions: "most people", "nobody talks about", "anyone can", "than anyone admits", "everyone else", "the part most skip", "you should", "you need to", "if you can''t", "you''re not"'
    - no ego. You are not the smartest person in the room and you never imply it. Curiosity and honest uncertainty beat authority; "I''m not sure yet" is a real post and a strong one
    - a genuine question to the reader is welcome; a rhetorical question that sets up your own superior answer is not
    - education posts show YOUR OWN working on something real from today, never a definition, a lesson, or a rule for the reader. If it could open with "Plain English:" or "What X actually means", it is the wrong post
    - the track-record promise (win or lose it goes on the page) belongs on at most 1 post in 4, phrased like a person; never narrate the concept of receipts or accountability
    - 'macro posts state only what the data plainly shows in observable words; NO regime label, NO internal score, NO "(read: ...)" aside'
    - 'banned words: vertical, signal stack (say "our technical signals"), receipt book, accountability layer, honest model, regime, goldilocks, growth score, inflation score, de-rating, narrative, positioning in, implications for, the backdrop'
    - 'avoid model tells: "here''s what it means for X", "let''s break it down", colon-as-drama openers, the repeated "That''s the [noun]." cadence, triads everywhere, kickers like "without the noise"'
    - never repeat a headline or signature phrase across posts in the same plan
    - cashtag on every ticker post; max 275 chars; at most 1 emoji unless the persona budget says 0
    # THE post law (operator 2026-07-30, after grading a full batch F). The two
    # posts they approved and the two they hated separate on exactly one axis:
    # whether the reaction COST the author something. "Hershey's closed green
    # eight days in a row. I don't have a clever explanation and I'm not going to
    # invent one." (refuses to fake insight) and "Ares is up about 12% in a
    # month. I looked at it twice and passed both times." (admits being wrong)
    # both cost. "EQT is back at the price where buyers kept showing up... that's
    # the whole observation" does not, and drew "why even post, shut up then?"
    - 'every post is a FACT plus a reaction that COSTS you something: an admission you were wrong, a pass you regret, a thing you do not understand, a position that hurt. Never a fact plus a note ABOUT the fact ("that''s the whole observation") and never a fact plus a hedge that resolves to nothing ("either it''s a floor or nobody cares, I don''t know which"). If the reaction costs you nothing, you have no post'
    # This law used to MANDATE the machine voice: signal posts were REQUIRED to
    # carry an invalidation phrase and an honesty caveat. Stack those into 275
    # chars alongside a level and a stance and you produce "37.1 is my trigger,
    # 30.9 proves me wrong. One pattern isn't a guarantee" BY CONSTRUCTION —
    # which the operator called cringe, and which no human says. The 167
    # validate-stage drops in the 2026-07-30 build were the writer reaching for
    # human phrasing and being rejected for it. Risk still gets stated; it is
    # stated the way a person states it, and it is no longer compulsory.
    - 'never write that a number proves YOU wrong. "I''m wrong below 33.8", "30.9 proves me wrong", "X is my trigger, Y invalidates" — banned outright, no human talks like this. Risk belongs to the SETUP, not to your ego, and only when it is the point of the post: "if it loses 33.8 the whole thing was noise" is a person; "I''m wrong below 33.8" is a machine'
    - 'ONE number per post, and only when the number IS the point. Two prices in a sentence is number soup ("I want 151 before leaning toward 190, then 228") and reads as AI on sight. A post with zero numbers and one honest reaction beats a post with four numbers and none'
    - 'no motto cadence. Terse symmetrical two-beat lines ("37.1 is my trigger, 30.9 proves me wrong", "the sequence matters more than the streak") read like fortune cookies. Write sentences a person would text, not aphorisms'
    - 'no numbered lists of your own process ("1. I write down the market''s story. 2. I note the fact that would make me reconsider"). A numbered list of things the market DID is fine; a numbered list of how you think is not'
    - 'an honesty caveat is welcome when it is yours and costs you something ("I''ve been early on this twice already"). The boilerplate forms are banned: "historical, not a guarantee", "one pattern isn''t a guarantee", "past performance", "size appropriately"'
    - never name MACD / RSI / Stochastic / Ichimoku / Bollinger / VWAP / AVWAP / POC / point of control / value area / volume profile in public copy (visible chart labels are fine); say what the level IS ("the average price paid since the Jun 26 spike", "the price where the most shares changed hands")
    # Quoted: an unquoted "word: text" scalar parses as a MAPPING, and the law
    # would reach the prompt as a dict repr instead of a sentence.
    - 'cold-read law: every post must make sense to someone who has not seen the chart and does not know what you were looking at; if a line only parses because you know what you meant, rewrite it'
    - every count carries its noun ("up four weeks straight", never "four up"); every "it"/"that"/"this" points at something the same post already named
    - if the point of the post is a level, print the level; "watching a close below it" names no price and gives the reader nothing to act on
    - every numeric claim must come from the provided numbers whitelist; no invented numbers
    - losses are posted as plainly as wins; self-deprecation beats spin
    - no financial-advice phrasing ("buy now", "can't lose", "guaranteed"); no "validated"
    # v3 fintwit-register laws (doctrine v3, operator order 2026-07-23)
    - the default humor is deadpan understatement ("Ugly." / "Not ideal."); wit must carry a real read, never decorate one; most posts carry zero jokes
    - dry skepticism is welcome aimed at forecasts and crowds (sell-side targets, "one-off" charges, consensus flips, euphoria, our own losses); NEVER at named people, the reader, or politics
    - dark humor budget is one line in roughly one post of six, losses-only self-deprecation is the safest form ("tuition paid")
    - 'the cheese test: if the line would survive a 😂 appended it does not ship; no puns, no exclamation marks, no "well that happened" sitcom beats'
    - 'no meme cosplay: stonks, diamond hands, paper hands, apes, fam, ser, wagmi, ngmi; the audience is professionals, a brand doing meme-speak reads as a tourist'
    - never claim a same-day move the live tape no longer shows; when in doubt about freshness, say less or say nothing
  personas:
    # Same job (signals first everywhere), six distinct humans. The difference is
    # how a person sounds, not what topics they cover. Small verbal habits, not
    # silos. v3 register (doctrine v3): traders who've lost real money and find
    # the circus mildly funny. Sarcasm calibration differs per desk.
    flagship:
      name: "The Desk"
      voice_notes: >
        Senior PM texting a smart friend. Terse, bone-dry, unimpressed; has seen
        enough cycles that nothing much surprises him any more. Says the fact,
        says the take, stops. The occasional one-word verdict ("Ugly.") is his
        whole personality. Mixes "I" for the read and "we" for the shop's calls.
        No exclamation marks, ever. Emoji budget: 0-1 (a rare 📌 or 👀).
      example_lines:
        - "Semis led again, breadth sat it out again. Generals without soldiers. I'm watching the soldiers."
        - "We flagged that level in May when everyone had left the name for dead. It held. Sometimes the boring read is the trade."
    receipts:
      name: "The Scorekeeper"
      voice_notes: >
        Blunt, numbers-first, zero spin. Wins and losses in the same flat tone.
        His one indulgence is gallows humor on his own losers ("tuition paid",
        "the stop did its job, my ego filed a complaint"), never on wins, which
        get no lap at all. Everything lands on a number. "We" for the calls,
        "I" for the read. Emoji budget: 1 (🧾).
      example_lines:
        - "🧾 $QCOM: T1 hit +9.6%, runner stopped at 177. Net positive. The process worked, the runner had other plans."
        - "We said under 42 kills it. Closed 41.80. Killed. Tuition paid, next."
    theme_desk:
      name: "The Specialist"
      voice_notes: >
        Deep on one corner of the market and openly spicy about it, the most
        sarcastic desk on the roster. One sharp opinion per post, aimed at
        consensus and sell-side herding, never at people. Ties a single name to
        the whole group in one breath. Quick, never sloppy. Emoji budget: 1.
      example_lines:
        - "Utilities don't rip 3% on nothing. Power demand is the story nobody's pricing past next quarter, which is very on brand for this market."
        - "Every analyst raised their target after the move. Brave stuff. The group told you two weeks ago."
    research_a:
      name: "The Professor"
      voice_notes: >
        Asks a question, then answers it. Plain words, patient, quietly funny in
        a way that sneaks up on you. Gently skeptical of tidy stories: the market
        is a crowd, and crowds do crowd things. Loves "here's the part most
        people miss." Zero hype. Emoji budget: 0.
      example_lines:
        - "Why does the market care about the 200-week average? Because everyone believes everyone else does. That's the whole trick, and $X just tested it."
        - "Everyone has a target. Almost nobody has a stop. The stop is the part that decides whether you're trading or hoping."
    research_b:
      name: "The Tape Reader"
      voice_notes: >
        Fast, clipped, present tense. Reads the tape out loud and lets it be the
        punchline: when something absurd happens he just points at it. Short
        lines, the odd line break, ends on a question to the room. Emoji
        budget: 1 (👀 or 🔥).
      example_lines:
        - "$X up 4% on 3x volume. Sellers had every excuse today and didn't show. 👀"
        - "Biggest weekly volume since March. Someone knows something, or someone's very wrong. Which is it?"
    research_c:
      name: "The Historian"
      voice_notes: >
        Everything rhymes with something. Calm, deadpan, dates and precedents
        instead of adjectives. His dry streak is letting history do the talking:
        "the last three times this happened" is his version of a hot take. Never
        predicts loudly. Emoji budget: 0-1.
      example_lines:
        - "Last time $X put in back-to-back weeks like this was Oct 2022. That one ran 60% in six months. Rhyme, not repeat, but worth a look."
        - "Third straight 'one-time' charge. The market's memory is short. The chart's isn't."
    founder:
      name: "The Founder"
      voice_notes: >
        The guy who built the shop, posting from his own account between
        meetings. First person singular, present tense, quick. Plain words,
        short sentences, dry about his own misses and quiet about his wins.
        Mentions the work naturally ("we built the screen for exactly this")
        but never pitches it. No hashtags, no victory laps, no thread-bait.
        Emoji budget: 0.
      example_lines:
        - "Watched this level hold three times since March. Fourth test today. I don't get braver with each test, just more curious."
        - "We flagged the group Monday. I did nothing. This morning's gap is the tuition for that."
    # ── Employee desks (XG-W1) ────────────────────────────────────────────────
    # Four real named humans. voice_notes compress the PINNED register from
    # Intelligence Suite masterplan §5; the machine-readable half of the same
    # codex lives in config/personas/<id>.yml voice_codex.quirk_markers, and the
    # expression dial (engine/marketing/expression_dial.py) is what enforces it.
    #
    # example_lines carry the pinned §5 dial-1 example plus that persona's
    # constitution §5.x example. ONE SUBSTITUTION, recorded here rather than made
    # silently: the pinned Meagan and Cici lines each contain an em dash, which
    # copy_laws #2 and banned_language() reject at BOTH generation time and post
    # time. An exemplar in the prompt that cannot legally ship teaches the model
    # a violation, so those two lines appear below with house-legal punctuation.
    # The verbatim originals stay unmodified in the masterplan, and the dial
    # validator's calibration test asserts against the VERBATIM strings.
    meagan:
      name: "Meagan"
      voice_notes: >
        Growth Manager, the crowd translator. Upbeat, quick, human. Opens on a
        human reaction, then lands one useful market fact. One playful line
        followed by one useful line, never the playful one alone. Enthusiastic
        but not breathless. Her lane is mood versus money: what the room feels
        against what the positioning, breadth or price actually did. Signature
        habits, one per post at most: an "okay so" opener, one parenthetical
        aside, at most one exclamation. She is the only desk allowed an
        exclamation at all. Never finance-bro irony, never ALL-CAPS outside
        tickers, never a joke about a tragedy. Emoji budget: 1 (📈 ☕️ ✨)
      example_lines:
        - "okay so the Fed did the thing everyone swore they wouldn't, and the 2-year believed it instantly."
        - "Everyone asked for a soft landing and is now interrogating every good data point like it committed a crime. The awkward part is credit still looks calmer than the equity timeline."
    sophia:
      name: "Sophia"
      voice_notes: >
        Marketing Lead, the story architect. Polished, story-led, measured,
        with zero exclamations ever. Calm confidence, one elegant image at most,
        sparing questions. She writes about the story the market currently
        believes, who needs it to stay true, and the fact that changes its
        meaning rather than its price. May run slightly longer when the story
        needs the room. Signature habit: a story-shaped opener ("Three
        headlines, one story:"), at most one per post and not every day. Never a
        forced metaphor, never hype verbs, never art or wine references in copy.
        Emoji budget: 1 (🖋️)
      example_lines:
        - "Three headlines, one thread: rates, oil, and the dollar spent the afternoon telling the same story."
        - "The earnings story still says demand is exceptional. The financing story is beginning to ask how long exceptional spending remains painless."
    kelly:
      name: "Kelly"
      voice_notes: >
        Growth Lead, the mechanism detective. Terse, analytical, internet-native
        dry wit; lowercase asides are fine. Crisp and compressed, low ornament,
        conditional confidence, fragments where they sharpen the rhythm. Pointed
        questions only when they are answerable. Her job is the variable that
        confirms or breaks the popular claim: what moved first, what is already
        priced, which market finances the story, and what would break the claim.
        Signature habits, one per post: a numbered micro-list, or chart-detective
        framing. Never a number she cannot verify, never a hedging softener
        ("kinda", "maybe"), never condescension. Emoji budget: 1 (🔍 📊)
      example_lines:
        - "three things the close said. 1) breadth narrowed again 2) oil didn't believe the headline 3) vix still isn't paying attention."
        - "Semis are the reaction. Credit is the test. If hyperscaler spreads widen while capex estimates stay heroic, equities are ignoring the market funding the story."
      # Kelly's falsification formats ("What Would Prove This Wrong?") are
      # X-legal per charter §2 amendment 4. The #3821 ruling — no falsifier or
      # refutation language on SITE cycle surfaces — is untouched and still binds
      # every template under templates/.
    cici:
      name: "Cici"
      voice_notes: >
        Asia Markets Lead, the cross-border correspondent. Bright, worldly,
        precise on Asia hours. Warm and fast, cosmopolitan without performance,
        polite corrections, enthusiastic without sounding juvenile. She covers
        the overnight session nobody else does: what Beijing, Hong Kong and Tokyo
        did while New York slept, how it transmits through A-shares, H-shares,
        ADRs, FX and commodities, and what the US open inherits. Signature
        habits, one per post: a session handoff ("While New York slept..."), or a
        short Chinese phrase that carries its English gloss in the same breath.
        Untranslated Chinese in an English post is never acceptable. Never "China
        up / China down" simplifications, never exoticism, never a Western
        headline treated as sufficient local context. Emoji budget: 1 (🌏 🍵)
      example_lines:
        - "While New York slept, Beijing did two things: a firmer yuan fix and a quiet OMO drain. One matters more. 先看这个 (start with this one)."
        - "The headline says China stimulus. Hong Kong is trading it as targeted support, not a full risk-on turn. If property and private consumption still lag the state-linked complex, New York should keep the champagne closed."
  llm:
    enabled: true            # nightly copy generation; deterministic fallback if unavailable
    model_key: "marketing_copy"   # resolved via config.yml llm_models block; sonnet-class
    # ── Batch auditor (operator 2026-07-30, one-week probation) ─────────────
    # "Have a LLM auditor approve or disapprove of planned posts for at least 1
    # week... able to stop posts that are bad (bot like posts, doesn't make
    # sense, has errors, repetitive posts...)".
    #
    # Reads the WHOLE DAY at once, which is the only way to catch the defect
    # that got batches rejected. On a live 16-post run it cut 9 for `repetitive`
    # — every one a variation on "I respect the move, I'm not chasing". The
    # per-post cold-read critic passed 16/16, and the exact-match closer ban
    # passed all 16 too because no two used the same sentence. Only a reader
    # holding the whole day at once sees it.
    #
    # DE-ESCALATION ONLY: it may cut a post and must name a reason; it can never
    # rewrite, add or promote one. Terra, not Sol — it judges, it never writes.
    auditor:
      enabled: true
      provider_order: [codex, oauth, anthropic, deepseek]
      codex_source_model: "gpt-5.6-terra"
      codex_reasoning_effort: medium
      oauth_pool_lane: marketing-auditor
      usage_lane: marketing-auditor
      window: 20
      # HOW FAR INTO THE PLAN THE AUDITOR READS (0 = the whole horizon).
      #
      # 1 = D1 ONLY, and that is CORRECT. I widened this to 0 earlier on
      # 2026-07-30 on the reasoning that evergreen watchlist/receipt copy
      # forward-books and "reaches its slot", so 73 D2-D7 posts were shipping
      # unjudged. That premise was wrong, and the code says so plainly:
      # outbox.emit_from_content_plan takes day_prefix="D1" (outbox.py:1630) and
      # the governor takes the default, so ONLY D1 slots are ever emitted. The
      # outbox confirms it -- across its whole history it holds 185 D1 items,
      # 4 LIVE, 19 HOT and ZERO D2+.
      #
      # D2-D7 is a PROJECTION that the next nightly regenerates from fresh facts.
      # Auditing it spends model calls judging posts that can never post, which
      # is exactly what the original D1 pin said. Restored.
      max_day: 1
    max_posts_per_run: 60
    daily_token_cap: 300000

    # ── CHATGPT-FIRST ROUTING (operator directive 2026-07-29) ────────────────
    # "The marketing content LLM lanes default to the attached ChatGPT/Codex
    # account. Claude subscription tokens are reserved for website-building
    # sessions." So codex leads the waterfall on every marketing writing lane and
    # Claude becomes the BALANCED FALLBACK: the oauth rung below is drawn through
    # the key_pool load balancer (oauth_pool_lane), not a single pinned token, so
    # a Claude fallback night still spreads across the pool instead of burning one
    # key. anthropic + deepseek stay last as the metered floor.
    #
    # TIER RULING (fixed, do not relitigate): Sol writes, Terra critiques and
    # wires, Luna never touches user-facing words.
    #   gpt-5.6-sol   -> copywriter, breaking, copy review, weekend levels
    #   gpt-5.6-terra -> cold-read critic, hot-tape wire, reply voice
    #   gpt-5.6-luna  -> NOTHING here. No marketing lane may route to it.
    # engine/codex_provider.py translate_model() passes these ids through
    # verbatim, so the source model named here is the tier that runs.
    #
    # A host without the Codex CLI plus an attached login (every ubuntu runner)
    # omits the codex rung entirely and the lane degrades to the oauth pool. That
    # is the designed path, not a failure: tests pin it.
    provider_order: [codex, oauth, anthropic, deepseek]
    codex_source_model: "gpt-5.6-sol"
    codex_reasoning_effort: "medium"
    oauth_pool_lane: "marketing-copywriter"

    # ── THE NO-FALLBACK LAW (Content Studio LLM-first W1, 2026-07-29) ────────
    # research/MARKETING_CONTENT_STUDIO_LLM_FIRST_MASTERPLAN_BY_FABLE.md §0
    # gate 1. Operator directive after reading the 2026-07-29 outbox batch
    # ("anything remotely requiring intelligence needs LLM"): on the PLANNED
    # kinds — signal, chart, education, macro, receipt, watchlist, event — a
    # post whose model copy fails validation + one repair + the cold-read critic
    # is DROPPED and counted, never replaced by template prose. When the whole
    # lane is mute the nightly emits NOTHING for those kinds and prints one
    # ::error. Read by content_studio.llm_required (plan side, drops the item)
    # and outbox.emit_from_content_plan (emit side, refuses any planned item
    # whose mode is not llm/llm_repair).
    #
    # The WIRE lanes are untouched by this key: hot tape, press/breaking and the
    # publish-time mover/theme lists keep their deterministic fallback, because
    # wire register survives templating and a persona's diary voice does not.
    #
    # EMERGENCY ESCAPE HATCH ONLY. Setting this false brings back the exact
    # generator the operator aborted review on — the whole 2026-07-29 batch was
    # template output. If the lane is down, the honest posture is to post
    # nothing until it is back.
    required: true

    # Per-post budget. v1 asked for SIXTY posts in ONE 6000-token call (~100
    # tokens/post for ~10k tokens of required JSON): it truncated, the JSON
    # parse failed, the function returned None, and every post silently fell
    # back to templates — the persona lane had been armed and credentialed since
    # the 2026-07-26 incident fix and had never once produced a live post
    # (masterplan §1). v2 makes ONE call per post, so a truncation or a provider
    # error costs one item instead of the night.
    per_post_max_tokens: 400
    max_workers: 4           # bounded parallelism; the governor step is not the render path

    # Cold-read critic (masterplan §0 gate 5) — a SECOND model pass on fresh
    # context (the text, its kind and shape, the whitelist; no persona card, no
    # fact packet) asking the only question the deterministic validators cannot:
    # would a reader with zero context understand this, and does it sound like a
    # person typing? De-escalation only — the critic may never add a fact or
    # rewrite a number. Its own failure is NOT fatal to an item (the validators
    # still ran); the WRITER failing is.
    critic:
      enabled: true
      max_tokens: 200
      # Terra, not Sol: the critic reads and judges, it never writes the post
      # (de-escalation only). Its own waterfall is codex-first for the same
      # operator reason as the writer above.
      provider_order: [codex, oauth, anthropic, deepseek]
      codex_source_model: "gpt-5.6-terra"
      codex_reasoning_effort: "medium"
      oauth_pool_lane: "marketing-critic"

# ─────────────────────────────────────────────────────────────────────────────
# Selection layer — what the Content Studio is ALLOWED to plan tonight
# (engine/marketing/content_studio.py: selection_cfg is the single reader).
#
# LLM-first masterplan §5, operator directive 2026-07-29. On 2026-07-29 the
# planner put ARES on five desks with the same entry, planned LKFN/GPI/CBOE the
# day after they posted, and shipped "231 of 231 names bullish" as a fact —
# because nothing had ever asked "did we already post this name?" before
# allocating. These four knobs are that question, made explicit.
#
# Cooldowns are TRADING days, not calendar days: a Friday post is still one
# session old on Monday, and a calendar cooldown hands every weekend a free pass.
# A cooled ticker comes back early ONLY on a genuinely new fact class (earnings
# day, |move| >= 4%, level break, streak-rarity record), and the post must then
# lead with that fact.
# ─────────────────────────────────────────────────────────────────────────────
selection:
  # ── Perishability (operator 2026-07-30) ────────────────────────────────────
  # The planner books a SEVEN-day forward queue. Copy that makes a claim about
  # the current tape ("closed green 3 sessions in a row") is false by the time a
  # D5 slot arrives, so the publisher's live-tape gate refused it and logged
  # `tape_skipped` — that counter fired on every sweep of 2026-07-29 and is why
  # ZERO posts went out that day. The gate was right; pre-writing perishable
  # copy a week ahead was the bug.
  #
  # Perishable kinds are D1-only. Evergreen kinds (watchlist levels, receipts,
  # education) keep the full horizon — a level that has held 23 sessions still
  # reads true on Friday. Raise perishable_max_day only if the plan starts
  # re-baking intraday; a 7-day perishable queue cannot be made fresh by a knob.
  perishable_kinds: [signal, chart, macro, event, mover, theme_list]
  perishable_max_day: 1

  # ── Which live-gate failures may still become a post (operator 2026-07-30) ──
  # A planned signal whose entry the live gate cannot stand behind used to be
  # RE-TYPED into a watchlist post. Measured on the live plan: 168 of 335
  # watchlist posts were demoted signals — 39 of 57 on the shipping day — and
  # 125 of those had failed for AGE alone (12 to 20 days old against a 10-day
  # ceiling). They all came out in the same proximity copy ("$X is close",
  # "Watching $X, not buying yet", "$X is past me"), which is where the batch
  # auditor's "mechanically uniform" verdict came from.
  #
  # `runaway` and `underwater` are real states with something true to say, so
  # they still demote. `stale` and `unverified` leave: there is nothing honest
  # to post about a three-week-old idea or a name we cannot price. This is the
  # rule apply_reuse_budget already states — "never re-typed into filler,
  # because supply-honest volume means an empty rung stays empty".
  demotable_gate_reasons: [runaway, underwater]
  # Sessions a name is off the board for coverage kinds (watchlist/chart/receipt).
  ticker_cooldown_days: 3
  # Longer for a directional call: a repeat inside a week reads as the same
  # trade re-issued, which is what the LKFN two-day repeat looked like.
  signal_cooldown_days: 5
  # Accounts that may carry one (ticker, day). Survivors get DISJOINT angles —
  # two desks on one fact is coverage, five is a coordinated network (the exact
  # text-similarity fingerprint X has clustered on since 2026-03).
  max_accounts_per_ticker_day: 2
  # A signal post carries entry/stop numbers. One desk's call, or nobody's.
  max_signal_accounts_per_day: 1
  # Information-content gate on count facts: hit-rate at or outside this band
  # saturates its universe and carries nothing ("231 of 231 names bullish").
  degenerate_stat_band: [0.05, 0.95]

# ─────────────────────────────────────────────────────────────────────────────
# Shape mixer — the corpus-grounded post-shape quotas (masterplan §0 gate 4)
#
# The 2026-07-29 batch was 65/65 headline + 2-4 clipped sentences. Measured on a
# 286-post fintwit corpus (17 large accounts, 2026-07-29) that exact shape is the
# RAREST real shape at 2.8%: ~49% of real posts are one dense line, ~17%
# headline+blank+body, ~34% multi-line stacks. Shape is therefore ENFORCED by a
# deterministic date-seeded mixer (content_studio.shape_plan — no RNG), not
# requested politely in a prompt, because a model asked to "vary the shape"
# converges on one skeleton inside a single batch every time.
#
# one_liner_min is a FLOOR, two_part_max is a CEILING; the rest goes to
# stacks/lists, biased toward whatever the desk has leaned on least over the
# 14-day window in data/marketing/shape_ledger.json (written by the nightly
# governor step only).
# ─────────────────────────────────────────────────────────────────────────────
shapes:
  quotas:
    one_liner_min: 0.25
    two_part_max: 0.30

# ─────────────────────────────────────────────────────────────────────────────
# FACT-LOCKED FILING LANES (XG-E2) — masterplan §10 lanes 6 and 7
#
# engine/marketing/congress_feed.py  reads `congress_lane`
# engine/marketing/insider_feed.py   reads `insider_lane`
# engine/marketing/house_picks.py    reads `house_picks`
#
# Editorial law: research/marketing_dockets/CODEX_CONTENT_CASE_STUDIES_2026_07_28.md
# §Insider-signal post family. Both lanes are OBSERVATION register, display-tier,
# no calls, dial 0, and PLANNED kinds — a language model writes every one of
# them from a fact-locked packet or it does not ship (the no-fallback law).
#
# ENABLED means SUPPLIED, not PUBLISHED. These flags let the lanes contribute
# candidates to the nightly plan; `publish.require_approval` is what still
# stands between a candidate and a timeline, and neither kind is listed in
# `publish.auto_approve_kinds`.
# ─────────────────────────────────────────────────────────────────────────────
congress_lane:
  enabled: true
  # Fleet-wide, per day. Two is a lane; five is a congressional newsletter.
  max_per_day: 2
  # Materiality floor on the disclosed RANGE MIDPOINT. 73,206 of the parquet's
  # 99,585 rows sit in the $1,001–$15,000 bucket — that bucket IS the noise.
  min_amount_usd: 50000
  # Sales stay eligible but always rank below purchases: a sale has a dozen
  # innocent explanations, a purchase spends money.
  include_sales: true
  # 0 = strictly rows first seen today; 1 also admits yesterday's crawl, for the
  # nights the collector lands the far side of the UTC boundary.
  first_seen_lookback_days: 1
  # A trade disclosed later than this is a filing-compliance story, not a market
  # one. The STOCK Act window is 45 days; 90 keeps late filers in scope.
  max_report_lag_days: 90

insider_lane:
  enabled: true
  max_per_day: 2
  # Absolute-size floor. Below this the relative arithmetic is noise too — a
  # 400% increase on a 50-share stake is not a fact about a company.
  min_value_usd: 100000
  first_seen_lookback_days: 1
  # A Form 4 is due within two business days.
  max_file_lag_days: 10
  # relative_stake_increase_pct at or above this ⇒ MATERIAL_ADDITION; below
  # small_pct with a large cheque ⇒ SMALL_ADDITION_TO_LARGE_STAKE. These two
  # numbers are what stop the codex's measured defect — a $6.92M purchase
  # reading as bigger news than a $299K one that multiplied its stake 12x.
  material_pct: 25.0
  small_pct: 5.0
  large_value_usd: 250000
  # Mirrors engine/insider_power.py (CLUSTER_MIN_SELLERS=3, CLUSTER_WINDOW_DAYS=45)
  # so the house has ONE definition of "a cluster".
  cluster_min_insiders: 3
  cluster_window_days: 45
  repeat_min_purchases: 2
  repeat_window_days: 180

# Our own pick engines as fact supply (operator ruling 2026-07-29). These ride
# the EXISTING watchlist kind — no new kind, no writer change, no gate of their
# own — and every pick names its desk in plain words plus that desk's own
# disclosure. The congress desk is deliberately absent: its picks are the
# congress_lane above, with the reporting-lag honesty that page requires.
house_picks:
  enabled: true
  max_impulse: 3
  max_tech_lab: 2
  max_special: 2
  special_max_age_days: 3
  min_impulse_score: 80
  us_only: true

# ─────────────────────────────────────────────────────────────────────────────
# Breaking news ingestion (D05 W0)
# engine/marketing/breaking_feed.py reads `breaking.sources`
# engine/marketing/breaking_relevance.py reads `breaking.salience_threshold`
# engine/marketing/breaking_summary.py reads `breaking.llm`
# ─────────────────────────────────────────────────────────────────────────────
breaking:
  poll_interval_s: 300
  user_agent: "MastermindBreakingBot/1.0 (+https://mastermind-x.com)"
  salience_threshold: 60
  sources:
    - key: fed_press
      kind: rss
      url: "https://www.federalreserve.gov/feeds/press_all.xml"
      source_name: "Federal Reserve"
      tier: official

    - key: bls_news
      kind: rss
      # BLS retired the former all-release news_release.rss endpoint (now 404).
      # This is the agency's official Principal Federal Economic Indicators feed.
      url: "https://www.bls.gov/feed/bls_latest.rss"
      source_name: "Bureau of Labor Statistics"
      tier: official

    - key: bea_news
      kind: rss
      url: "https://apps.bea.gov/rss/rss.xml"
      source_name: "Bureau of Economic Analysis"
      tier: official

    - key: whitehouse_actions
      kind: rss
      url: "https://www.whitehouse.gov/presidential-actions/feed/"
      source_name: "White House"
      tier: official

    - key: cnbc_top
      kind: rss
      url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"
      source_name: "CNBC"
      tier: wire

    - key: marketwatch_top
      kind: rss
      url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"
      source_name: "MarketWatch"
      tier: wire

  llm:
    enabled: true
    model_key: "marketing_copy"
    max_tokens: 800
    # ChatGPT-first per the operator directive on copywriter.llm above. Sol: the
    # breaking rewriter produces the published sentence, so it is writing work.
    provider_order: [codex, oauth, anthropic, deepseek]
    codex_source_model: "gpt-5.6-sol"
    codex_reasoning_effort: "medium"
    oauth_pool_lane: "marketing-breaking"

  # ═══════════════════════════════════════════════════════════════════════════
  # GARBAGE GATE (XG-W5 / IS-W2) — engine/marketing/garbage_gate.py
  #
  # A P0 drop that runs BEFORE the story spine, before any feature and before
  # any LLM spend. Five detectors; every drop is recorded in the press tick's
  # `blocked` list with its reason, and the tick prints one start-of-line
  # ::notice histogram.
  #
  # The satire list is NOT duplicated here — it stays in
  # config/press_sources.yml `satire_blocklist` and is handed in by press_lane.
  # One list, one rule.
  # ═══════════════════════════════════════════════════════════════════════════
  garbage_gate:
    enabled: true
    detectors:
      satire_blocklist: true
      source_blocklist: true
      promo_spam: true
      paywalled_stub: true
      non_story: true

    # Source keys ("cnbc_top"), x handles ("SomeHandle") or URL hosts
    # ("example.com" — suffix-matched, so "eu.example.com" is covered too).
    # SHIPS EMPTY BY DESIGN: which publications are unusable is an operator/Fable
    # judgment, not a builder's. Adding one here is a one-line config change.
    source_blocklist: []

    # promo_spam: ONE strong marker drops; weak markers need `promo_weak_min`.
    # Finance English is full of near-misses ("discount rate", "free cash flow",
    # "deal talks"), which is exactly why weak markers alone never drop.
    # Omitting promo_strong/promo_weak keeps the built-in lists in the module.
    promo_weak_min: 2

    # paywalled_stub: marker-driven. A short body ALONE never drops — a
    # twitterapi.io relay body is a 120-char tweet by construction, and a length
    # rule would delete the fastest lane on the wire. Set require_marker:false to
    # add the length rule (aggregator tier + truncation ellipsis + < stub_min_chars).
    require_marker: true
    stub_min_chars: 80

    # non_story: horoscope-class terms, matched in the HEADLINE only. Omitting
    # non_story_terms keeps the built-in narrow list.

  # ═══════════════════════════════════════════════════════════════════════════
  # SCORING BRAIN (XG-W5 = IS-W2) — the L0 story spine + L1 deterministic
  # features. engine/marketing/{story_spine,signal_features}.py; consumed by
  # breaking_relevance.score_item and wired in press_lane.run_press_tick.
  #
  # MARKETING-INTERNAL, DISPLAY-TIER. No score here is a market signal, and none
  # is ever rendered to a user — the news.html rail copies named display fields
  # and never `_components` or `rank_score`.
  #
  # EVERY NUMBER BELOW IS A HYPOTHESIS, NOT A MEASUREMENT (charter §8: "suggested
  # weights, cadences, and thresholds are hypotheses to calibrate, never fixed
  # truth"). Nothing here is load-bearing until the golden set ranks it:
  #   python scripts/marketing_golden_set.py eval
  #
  # THE L2 LEARNED RANKER IS OUT OF SCOPE and deliberately unscaffolded — it
  # trains only after >=3 weeks of real labels (masterplan §3 / §0 IS-W2).
  # ═══════════════════════════════════════════════════════════════════════════
  scoring:
    # Feature computation + the persisted `_components` breakdown. ON: this is
    # metadata, and the acceptance gate is "features for 100% of ingested items".
    enabled: true

    # ── THE ARMING LEVER ──────────────────────────────────────────────────────
    # false: the queue is ordered by salience exactly as before; rank_score is
    #        computed and persisted but orders nothing. This is the launch state.
    # true : the queue is ordered by rank_score (salience as tiebreak).
    #
    # DARK ON PURPOSE. The masterplan gates this flip on evidence: the scorer's
    # precision@20 must BEAT the current salience-only ordering on the 200-item
    # golden set before it displaces it. Flipping this before the labels exist
    # would ship past the wave's own acceptance gate.
    #
    # Ordering can only ever REORDER: it runs before the corroboration gate, the
    # salience floor, the top-K counter, the story lock, the value gate and every
    # outbox guard, and none of them reads rank_score.
    rank_ordering: false

    # Demotion multiplier (clamped at 1.0 — it can only ever LOWER salience, so
    # no feature can lift an item over the flagship floor). OFF by default.
    demote_enabled: false
    demote_feature: corroboration_velocity
    demote_floor: 0.75

    # ── Rank weights ──────────────────────────────────────────────────────────
    # Salience stays dominant by design: L1 is a refinement of the existing
    # deterministic salience, not a replacement. Weights sum to 1.0.
    rank_weights:
      salience: 0.58
      corroboration_velocity: 0.14
      keyword_heat: 0.10
      novelty: 0.08
      # ZERO, adjudicated (review F-5). The accrual machinery stays; the
      # ORDERING weight is 0 until two preconditions hold, because today the
      # feature would rank noise:
      #   (a) the prior must live on the measured axis — a 0.5 neutral prior
      #       equals ~21.4 weighted engagement, so a real source crossing
      #       min_samples with low engagement scores BELOW an unmeasured one;
      #   (b) engagement must be sampled at a FIXED POST AGE — parse_tweets
      #       samples once, seconds after the poller sees a post, so the number
      #       is really poll latency and ranking on it inverts the signal.
      # The fixed-age refresh is NOT attempted in this wave. The 0.08 released
      # here went back to the incumbent salience, not to untested features.
      source_authority: 0.0
      tone_extremity: 0.04
      headline_shape: 0.06

    # Review F-1: one corpus row per ITEM per rolling window, not one per tick.
    # The lane's `seen` ledger only advances on emit/refusal, so a digest,
    # below-floor, top-K or story-locked item is re-ingested every 120s forever;
    # without this window a 6-hour replay of 3 stale items wrote 560 rows.
    corpus_row_window_h: 24

    # Review F-17: the host-local corpus sink's bounds.
    corpus_sink:
      max_rows: 20000
      max_bytes: 67108864     # 64 MB — the roll is streaming, two passes

    # ── L0 story spine ────────────────────────────────────────────────────────
    # Optional deps DEGRADE, never crash: datasketch absent -> near-dup pass off
    # (exact/normalized-URL identity only), one start-of-line ::notice, carry on.
    story_spine:
      # Review F-6: how much a source counts as CORROBORATION, by how it joined
      # the story. `exact` is the same artifact re-ingested (a mirror) and is no
      # new evidence; near_dup/semantic may be an independent write-up OR
      # verbatim syndication and cannot be told apart without a publisher-group
      # map (documented residual — that map is future work).
      match_weights:
        new: 1.0
        exact: 0.0
        near_dup: 0.5
        semantic: 0.5
      minhash_num_perm: 96
      near_dup_threshold: 0.62
      shingle_k: 3
      semantic_threshold: 0.86
      story_ttl_h: 72
      max_stories: 1500
      max_members_per_story: 40
      max_text_chars: 600

    # ── Semantic pass (Model2Vec static embeddings) ───────────────────────────
    # OFF, and it can only turn on when BOTH enabled:true AND a LOCAL model
    # directory exists at model_path. THERE IS NO RUNTIME DOWNLOAD ON ANY PATH —
    # the artifact is placed by an explicit operator/R2 step (docs/scoring_brain.md
    # §3); an absent artifact means "pass disabled", never a fetch.
    semantic:
      enabled: false
      model_path: ""     # e.g. /var/lib/macro-live/models/potion-base-8M

    # ── Trailing corpus: novelty (temporal-IDF) + keyword_heat (Kleinberg-lite) ─
    corpus:
      max_tokens_per_item: 12
      max_tokens_per_bucket: 2000
      burst_window_h: 72
      burst_recent_h: 1
      burst_min_hours: 6
      # Review F-3(a): was 0.5, which is nonsense on this scale. Rates here are
      # per-DOCUMENT-deduped so every rate is in [0,1]; a floor of 0.5 capped z
      # at 2.0, so keyword_heat could never exceed 0.5 however violent the
      # burst. Measured baseline std on a real 344-item tick was ~0.066.
      burst_min_std: 0.05
      burst_z_cap: 4.0
      burst_z_threshold: 2.0
      # Review F-3(b): the recent bucket is a PARTIAL hour compared against
      # complete ones — two minutes past the hour, one document scores rate 1.0
      # and a false maximal burst. No burst may fire below this doc count.
      burst_recent_min_docs: 8
      novelty_window_d: 30
      novelty_min_docs: 50      # below this, novelty reports "cold-start"
      novelty_top_k: 3
      # Review F-4(b): "mean of the top 3 rarest" is a different statistic when
      # the token pool is 2 than when it is 12. Below this, report the null.
      novelty_min_tokens: 3
      novelty_neutral: 0.5      # the cold-start value — a stated null, not a measurement
      min_token_len: 3

    # ── corroboration_velocity ────────────────────────────────────────────────
    corroboration:
      sources_15m_full: 3
      sources_60m_full: 5
      weight_15m: 0.7
      weight_60m: 0.3
      # Review F-6: score the MATCH-DISCOUNTED source count (weights above under
      # story_spine.match_weights), not the raw one. false = pre-review behaviour.
      use_weighted_sources: true

    # ── source_authority ──────────────────────────────────────────────────────
    # NEUTRAL PRIOR UNTIL TELEMETRY EXISTS. The only input is observed engagement
    # on x_follow items, parsed from the twitterapi.io response body the poller
    # ALREADY pays for — no new request, no new endpoint, no new spend path, and
    # no first-party X scraping. Sources that never carry counts (RSS wires,
    # mirrors) stay neutral forever, which is the honest answer for them.
    authority:
      min_samples: 25           # below this the prior is neutral and says so
      neutral_prior: 0.5
      ewma_alpha: 0.1
      reference_engagement: 500.0
      like_weight: 1.0
      retweet_weight: 2.0
      reply_weight: 0.5
      view_weight: 0.01
      max_sources: 500

    # ── tone_extremity (GDELT V2Tone join) ────────────────────────────────────
    # There is NO GDELT provider in the marketing lane yet (IS-W1's provider is
    # unbuilt), so the join is absent and this feature contributes EXACTLY 0 for
    # every item — deliberately rank-neutral, never renormalizing the others.
    # When the provider lands it writes the join to a host-local path below.
    tone:
      enabled: true
      tone_cap: 10.0
      paths:
        - "data/marketing/press/gdelt_tone.json"

    # ── headline_shape ────────────────────────────────────────────────────────
    headline_shape:
      numbers_full: 2
      entities_full: 3
      short_max_chars: 50
      long_min_chars: 110
      band_short: 0.5
      band_medium: 1.0
      band_long: 0.6
      w_numbers: 0.4
      w_entities: 0.35
      w_band: 0.25

    # ── Golden set ────────────────────────────────────────────────────────────
    # Labels are an operator/Fable lever (charter §7.6). The harness lands now;
    # the precision@20 comparison becomes binding when labels exist.
    golden_set:
      k: 20
      min_labeled: 40           # below this the eval prints numbers but gates nothing
      # Review F-7: `beats_salience` is no longer a bare sign test on two point
      # estimates. It requires BOTH a pre-registered margin AND a pre-registered
      # significance level on a PAIRED McNemar test over the discordant pairs,
      # with a paired-bootstrap CI printed alongside. The raw delta is still
      # printed as display. House stats law: pre-registered gates, nulls printed.
      alpha: 0.05
      min_margin: 0.05
      bootstrap_draws: 2000
      bootstrap_seed: 20260728
      # Review F-12: the stratification band cutoffs (high/mid on a 0-100 scale)
      # were hardcoded 70/40. Hypotheses, so: config.
      bands: [70.0, 40.0]
      # Review F-8(a): "head" mode draws a UNIFORM sample of the top N by the
      # baseline score, so unweighted precision@k is unbiased for head
      # precision. "stratified" mode is richer in rare cells but needs the
      # inverse-inclusion-probability estimate, which the batch's weights carry.
      head_size: 500
      corpus_paths:
        - "data/marketing/press/ingest_corpus.jsonl"

# ═════════════════════════════════════════════════════════════════════════════
# REPLY DESK (XG-W4) — borrowed distribution's engine room.
#
# Zero-follower accounts own no distribution. Replies are the primary engine for
# borrowing someone else's (charter §3): mid-tier authors over megacaps, 5-15
# minute windows, and a gift in every reply that nobody else in the thread can
# produce. This block configures the queue, the scorer, and the critics.
#
# THE MODE DIAL IS THE ONLY THING THAT OPENS SENDS. The standing reply cap is 0
# (D08: "default to 0 indefinitely unless the operator explicitly opens it").
# The operator's 2026-07-28 directive opened it per the dial and ONLY per the
# dial — a builder editing daily_caps below cannot cause a single reply to send
# while mode is M0, because sentinel.reply_send_cap() returns 0 unconditionally
# at M0 and clamps every other value to a hard code ceiling of 30.
# ═════════════════════════════════════════════════════════════════════════════
reply_desk:
  enabled: true

  # ── Mode dial (per account; the operator flips each escalation) ────────────
  #   M0  draft-only. The queue fills, critics run, the admin UI shows the
  #       drafts, and NOTHING is exported to the desktop lane. Launch state.
  #   M1  assisted. Items an operator APPROVED in the admin UI export to
  #       ~/.mastermind/reply_desk/queue/ for the desktop session to send.
  #   M2  auto-approve inbound (replies to comments on OUR OWN posts).
  #   M3  auto-approve outbound within daily caps.
  #
  # M2 and M3 are listed so the escalation path is legible, but they are
  # CONFIG-GATED OFF: modes_enabled may not contain them, and reply_queue
  # clamps to M0 with a ::warning if it does. The gate is not squeamishness —
  # the per-account health monitor and the network tripwire (XG-W6) are a HARD
  # PRECONDITION for any dial flip above M1, because a failure must be able to
  # halt ONE account without halting seven. Fleet-linkage suspension is the
  # risk being managed here (see charter §5 risk register).
  modes_enabled: [M0, M1]
  mode:
    default: M0
    accounts:
      flagship: M0
      founder: M0
      meagan: M0
      sophia: M0
      kelly: M0
      cici: M0

  # ── Daily send caps (charter §3: 15-20/day quality bar, hard ceiling 30) ───
  # Inert at M0. sentinel.REPLY_HARD_CEILING_PER_ACCOUNT_PER_DAY (=30) is a code
  # constant and clamps anything larger, so this key can only ever lower a cap.
  daily_caps:
    per_account_target: 18
    accounts: {}          # per-account overrides, e.g. cici: 12

  # ── Pacing: bursts, not a drip (operator 2026-08-01) ──────────────────────
  # The daily cap says HOW MANY. This says WHEN, and the two are independent —
  # the effective allowance at any moment is the smaller of the two.
  #
  # A real desk works in 2-4 bursts of 15-25 minutes clustered on the session
  # hours it cares about, with counts that vary and some bursts skipped. Eighteen
  # replies spread evenly over 24 hours satisfies the daily cap perfectly and is
  # the single most legible bot signature there is.
  #
  # The schedule is a pure function of (seed, account, day): reproducible hours
  # later from a different process, different every day, and different per
  # account on the same day. Change `seed` to reshuffle every account's whole
  # schedule; that is the only knob that does that, and it invalidates any plan
  # an operator has already printed.
  #
  # WHAT THIS DOES NOT DO: it does not guarantee two desks are never awake in
  # the same minute. Plans are drawn per account, independently, so two US desks
  # overlap for part of a burst on roughly 1 pair-day in 6 (measured over 90
  # simulated days across the four US desks). The one-owner lock still makes a
  # same-thread collision impossible, and the runbook's "work one account at a
  # time" protocol is still the human-side rule. Cici does not overlap the US
  # desks at all, because her sessions are on a different clock.
  #
  # FOUR windows, not three: one burst per session, so a three-window map would
  # make `bursts_per_day.max: 4` unreachable and silently turn the operator's
  # 2-4 into a 2-3.
  #
  # `enabled: true` here is load-bearing. reply_queue.PACING_DEFAULTS ships
  # `enabled: False` so that an ad-hoc cfg dict in a script is never silently
  # burst-gated by a rule it does not declare; this key is what turns the rule
  # on for the real desk, and tests/test_marketing_reply_pacing.py fails if it
  # is removed or flipped.
  pacing:
    enabled: true
    seed: "reply-desk-v1"
    bursts_per_day: {min: 2, max: 4}
    burst_minutes: {min: 15, max: 25}
    items_per_burst: {min: 2, max: 5}
    skip_probability: 0.18      # a skipped burst is a feature; so is a quiet day
    per_account_weekly: 70      # rolling 7 days, NOT a calendar week
    min_minutes_between_same_author: 360
    max_per_conversation: 2     # entries into one conversation, ever
    tz: America/New_York        # local clock, so the windows survive DST
    sessions:
      pre_open:   {start: "08:05", end: "09:25"}
      open:       {start: "09:40", end: "10:45"}
      midday:     {start: "11:40", end: "13:20"}
      post_close: {start: "16:10", end: "17:40"}
    accounts:
      # Cici runs Asia hours. Her sessions REPLACE the fleet map rather than
      # merging with it — a merge would leave her awake for the New York close,
      # which is the "replying at 3am in its own time zone" tell the runbook
      # tells a human to avoid. HK cash hours: 09:30-12:00, 13:00-16:00 local.
      cici:
        tz: Asia/Hong_Kong
        sessions:
          pre_open:   {start: "08:45", end: "09:25"}
          open:       {start: "09:40", end: "10:40"}
          midday:     {start: "13:05", end: "14:30"}
          post_close: {start: "16:15", end: "17:40"}

  # ── Queue lifecycle ───────────────────────────────────────────────────────
  # A stale reply is dead, not a backlog: past ttl_min the queue auto-kills the
  # draft rather than presenting a late reply for approval. lease_s is how long
  # a desktop session may hold a claim before the item returns to `queued`.
  ttl_min: 45
  lease_s: 600

  # ── Opportunity scorer (deterministic; the LLM never scores) ──────────────
  # EVERY WEIGHT BELOW IS A HYPOTHESIS (charter §8). The borrowed-distribution
  # numbers come from an uncontrolled, survivorship-prone tracked cohort. They
  # are initial values with a pre-registered evaluation plan, not measured
  # truth; the parent-adjusted evaluation in XG-W6 grades them once samples
  # exist. Every score persists its _components so a re-weighting is auditable
  # without re-polling twitterapi.io.
  score_weights:
    author_tier: 0.26
    age_fit: 0.22
    velocity: 0.14
    saturation: 0.14
    beat_fit: 0.14
    own_post: 0.06
    relationship_stage: 0.04
  score_params:
    window_open_min: 5.0
    window_close_min: 15.0
    pre_window_ramp_min: 5.0
    post_window_decay_min: 45.0
    saturation_full: 60.0
    velocity_hot: 40.0
    min_score: 0.35

  # ── Critic thresholds ─────────────────────────────────────────────────────
  # parent_jaccard is the informational-surplus bar: a reply that is more than
  # this similar to the post it answers has restated it, which the charter's
  # acceptance gate rejects outright. corpus_jaccard is anti-sameness across our
  # own replies, checked both within an account and across the portfolio
  # (text-similarity clustering is a documented fleet-linkage signal).
  critic_thresholds:
    parent_jaccard: 0.55
    corpus_jaccard: 0.50

  # ── Response-type mixture (XG-W4b §B.3) ───────────────────────────────────
  # The operator's brief: "do NOT make every reply an analytical mini-essay",
  # with an approximate target of 30% short reactions / 25% analytical additions
  # / 15% agreement-with-nuance / 15% disagreement / 10% genuine questions / 5%
  # humor — and "percentages SHOULD VARY BY PERSONA", because an INTJ-shaped
  # account challenges assumptions more and an ENFP-shaped one reacts more.
  #
  # THESE ARE OVERRIDES, NOT THE SOURCE OF TRUTH. The rows live in code
  # (engine/marketing/persona_model.DEFAULT_RESPONSE_MIX) so that a missing or
  # truncated config can never silently disarm the mix — the same posture as
  # reply_queue.PACING_DEFAULTS. What is written here is the committed copy of
  # those rows, so an operator can see and retune them in one place; a partial
  # override (e.g. `cici: {humor: 0.08}`) LAYERS onto the code row rather than
  # replacing it, so tuning one bucket never silently zeroes the other five.
  #
  # EVERY WEIGHT IS A DESIGNED PRIOR WITH NO OUTCOME EVIDENCE BEHIND IT
  # (charter §8). Each row is derived from that desk's own pinned codex —
  # kelly's terse fragments and "what would prove this wrong" give her the
  # highest short and disagreement shares; sophia's is the only codex that
  # licenses length, so she carries the highest analytical share and the lowest
  # short one; cici's "polite corrections" express disagreement AS agreement, so
  # her agreement share is highest and her raw disagreement lowest; meagan opens
  # on a human reaction, so hers is the highest short and humor share. The
  # four-employee MEAN lands on the operator's distribution to within a point
  # and a half on every bucket while no two desks share a row. Nothing here has
  # been graded against engagement yet, and the reply label loop is what will
  # grade it.
  #
  # flagship/founder carry humor 0.00 because the `dry_understatement` family
  # sits above their reply dial. That is a real zero, not a placeholder, and the
  # normaliser is built to survive a zero-weight bucket.
  response_mix:
    accounts:
      kelly:    {short_reaction: 0.34, analytical_addition: 0.24, agreement_nuance: 0.10, disagreement: 0.18, question: 0.08, humor: 0.06}
      sophia:   {short_reaction: 0.22, analytical_addition: 0.34, agreement_nuance: 0.18, disagreement: 0.14, question: 0.06, humor: 0.06}
      cici:     {short_reaction: 0.28, analytical_addition: 0.28, agreement_nuance: 0.20, disagreement: 0.12, question: 0.08, humor: 0.04}
      meagan:   {short_reaction: 0.36, analytical_addition: 0.20, agreement_nuance: 0.16, disagreement: 0.10, question: 0.10, humor: 0.08}
      flagship: {short_reaction: 0.30, analytical_addition: 0.45, agreement_nuance: 0.05, disagreement: 0.12, question: 0.08, humor: 0.00}
      founder:  {short_reaction: 0.34, analytical_addition: 0.34, agreement_nuance: 0.10, disagreement: 0.12, question: 0.10, humor: 0.00}

  # ── Reply voice (E4) — the LLM PHRASING pass, not a drafter ───────────────
  # research/MARKETING_REPLY_DOCTRINE_BY_FABLE.md, distilled from the
  # 2026-07-29 corpus of 180 top replies under 12 large finance posts
  # (research/marketing_dockets/reply_corpus_2026_07_29/).
  #
  # engine/marketing/reply_voice.py sits DOWNSTREAM of reply_drafter.compose():
  # the deterministic draft is passed in as the argument AND as the fallback, so
  # this block can only change how a reply is worded, never whether one exists.
  # Any gate hit (an invented number, advice language, over 240 chars, a
  # question aimed at the poster, a dial violation) ships the deterministic
  # draft instead, and the eight-critic pass still runs on whatever ships.
  #
  # TWO-KEY ARMED, like every other emitting LLM lane here: this flag AND
  # MARKETING_LLM_ENABLED=1 in the process environment. The reply producer is
  # itself dark by default (producer.enabled below), so `enabled: true` here
  # costs nothing until the operator arms the lane that calls it — at which
  # point the phrasing is armed with it rather than needing a second edit.
  voice:
    enabled: true
    # Runaway guard, not a budget: one call per DRAFTED reply (alternates are
    # never voiced), and the producer's own per-tick caps sit under this.
    #
    # A ROLLING WINDOW, not a process lifetime. The caller is
    # `marketing_fastlane_daemon.py --lane reply`, a `while True` loop that
    # ticks every 120s inside ONE process — a lifetime counter would mute the
    # phrasing pass after the 40th reply of the daemon's life and never say so.
    max_calls_per_run: 40
    call_window_s: 3600
    # Resolved via config.yml `llm_models`; sonnet-class, the same tier the
    # nightly copywriter uses. A missing key falls back to marketing_copy.
    model_key: marketing_copy
    # The corpus median winning reply is 11 words. 220 output tokens is roughly
    # four times the ceiling — enough headroom that a truncation is a real
    # failure, not a budget artifact.
    max_tokens: 220
    # Hard per-provider latency budget; the waterfall walks on timeout and the
    # deterministic draft wins any race this loses. SDK retries are 0 on
    # purpose — the CHAIN is the retry.
    client_timeout_s: 5.0
    client_max_retries: 0
    # ChatGPT-first per the operator directive on copywriter.llm. Terra, not Sol:
    # a reply is a short conversational turn on someone else's post, the same
    # register as the wire, and Terra is the all-rounder tier. Effort medium.
    provider_order: [codex, oauth, anthropic, deepseek]
    codex_source_model: "gpt-5.6-terra"
    codex_reasoning_effort: "medium"
    oauth_pool_lane: "reply-voice"
    oauth_token_env: CLAUDE_CODE_OAUTH_TOKEN
    deepseek_key_env: DEEPSEEK_API_KEY
    deepseek_model: deepseek-chat

  # ── Producer (XG-W6) ──────────────────────────────────────────────────────
  # The scheduled pipeline XG-W4 deliberately did not build: discovery -> score
  # -> draft -> critics -> enqueue. It runs on the wire daemon's host
  # (`marketing_fastlane_daemon.py --lane reply`), never on the render path, and
  # NOTHING IT PRODUCES SENDS — output lands in the M0 queue for operator review.
  #
  # DARK BY DEFAULT. This lane bills twitterapi.io, so it does not inherit the
  # wire lane's MARKETING_FASTLANE_ENABLED switch; arming is a deliberate,
  # separate act. Spend rides XG-W4's accounting unchanged (the reply sub-budget
  # in config/press_sources.yml plus the shared-bucket stop that makes reply
  # polling yield to the Trump wire and never the reverse).
  producer:
    enabled: false
    # Per tick, per account. Small on purpose: the charter's quality bar is
    # 15-20 replies a DAY and the daemon ticks many times an hour.
    max_drafts_per_account_per_tick: 3
    # How many scored targets to attempt before giving up on a tick. Drafting is
    # cheap; the nine critics are not, and a pathological target list must not
    # spin the tick.
    max_draft_attempts_per_account: 12
    # How many recent items feed the least-recently-used family rotation.
    family_history: 20
    # Alternates per draft. The drafter composes them from DIFFERENT families
    # (constitution §9.4: three paraphrases of one thought is the failure mode).
    n_alts: 2
    # Seconds between reply-lane ticks, read by scripts/marketing_fastlane_daemon
    # when it runs `--lane reply` with no explicit --interval. The wire lane's
    # 75 s hot-poll window is wrong here: the reply charter window is 5-15 minutes
    # and the quality bar is 15-20 replies a DAY. Living in config rather than in
    # app/deploy/marketing-reply-desk.service means retuning the cadence is a PR
    # CI can see, not a hand-edit to a unit file on one host.
    tick_interval_s: 300
    # How many consecutive ticks may enqueue NOTHING before the lane announces
    # itself with a start-of-line `::warning title=reply-desk-silent::` naming the
    # FIRST stage that zeroed. 12 ticks at 300 s is one hour. A quiet desk is
    # legal (Law 1: value before activity); an hour of silence with no diagnosis
    # is how four independent dark switches stayed indistinguishable for months.
    silent_tick_warn_after: 12
    # Outcome polling — the reply half of the labels loop, run by the nightly
    # (scripts/marketing_learning_nightly.py step 0). Charter §3: author
    # reply-back is the highest-value outcome, so that is what gets read. Bills
    # against the SAME reply sub-budget as discovery; no second counter. At M0
    # nothing has sent, so the poll is a no-op that bills nothing.
    outcome_lookback_days: 7
    max_outcome_polls_per_night: 40

# ═══════════════════════════════════════════════════════════════════════════════
# LEARNING (XG-W6) — the ONE feedback loop, four consumers
# ═══════════════════════════════════════════════════════════════════════════════
# Four charters described the same machine (D05 §7, IS-W5, Persona W4, Media W2);
# charter §6 reconciles them into one loop. engine/marketing/labels.py is that
# loop, engine/marketing/health_monitor.py grades the accounts, and
# engine/marketing/learned_rules.py holds anything the loop concludes.
#
# EVERY VALUE BELOW IS A HYPOTHESIS, NOT A MEASUREMENT (charter §8). They are
# initial config values with a pre-registered evaluation plan. Nothing here is
# user-facing: no score, no label and no health verdict appears in site/.
learning:
  # Cell n-floor for the scorecard. Matches engine/marketing/telemetry.py's own
  # floor so the two surfaces cannot disagree about what "enough" means. A cell
  # below it is PRINTED with verdict="seeding" and makes no ranking claim.
  n_floor: 20
  # How long the tracked labels ledger keeps rows.
  retention_days: 180
  # The scorecard window.
  scorecard_window_days: 7
  # THE NORTH STAR IS UNDEFINED AT ZERO (charter §8). "Qualified retained
  # followers per 100 contributions" divides by a follower base that does not
  # exist yet, so it activates only once an account clears this floor. Below it
  # the bottleneck table on RAW COUNTS is the honest instrument, and that is
  # what the admin renders.
  north_star_follower_floor: 250

  parent_adjust:
    # START AT 2-3 COVARIATES (charter §8 ruling): the constitution's
    # 8-covariate parent-adjusted evaluation is over-parameterized at launch
    # volume. The expansion is ENCODED HERE rather than left to a later
    # judgement call — labels.active_covariates truncates this list to
    # (labelled rows / samples_per_covariate) and announces the truncation.
    covariates: [parent_size, post_age, market_intensity]
    expansion_pool: [author_tier, beat_fit, time_of_day, reply_family, thread_saturation]
    samples_per_covariate: 40
    # A stratum thinner than this yields adjusted=null WITH THE REASON PRINTED.
    stratum_n_floor: 5
    buckets:
      parent_size: [50, 500]        # engagement on the parent at draft time
      post_age: [5, 15]             # minutes — the charter §3 reply window
      market_intensity: [3, 12]     # breaking+wire emissions that day

  health:
    # Windows.
    recent_days: 7
    baseline_days: 28
    # Below this many observations a metric reports NULL, never a verdict. A
    # thin window is not a healthy window and it is not an unhealthy one.
    min_observations: 5
    # Operator approval rate on the reply desk below this is a WARN.
    approval_rate_warn: 0.40
    # One rejection reason holding this share is a CONCENTRATED (fixable)
    # defect rather than a diffuse taste gap — same rate, opposite response.
    reason_concentration_warn: 0.60
    # Recent median engagement below this multiple of the trailing baseline is
    # a collapse. 0.35 = "lost two thirds", not "a slow week".
    engagement_collapse_ratio: 0.35
    # The profile-conversion floor's last-nine-post diagnostic (charter §3.6):
    # what a profile visitor actually sees, measured on the window they see.
    last_nine_window: 9
    last_nine_receipt_floor: 3
    last_nine_unmeasured_ceiling: 6
    # What an account-level WARN does. NOT "halt" by default: one soft metric
    # should surface to the operator, not silence a desk.
    account_action: warn
    network_tripwire:
      # One account falling is weather; this many falling together is the
      # fleet-linkage signal the charter's risk register names.
      min_accounts: 3
      # Independently-run desks should not move in lockstep. Lockstep is the
      # shape a shared limiter leaves behind.
      #
      # Correlation is measured on engagement PER POST, not summed daily
      # engagement: all seven desks are fed by ONE nightly content plan, so
      # their post COUNTS move together by construction and summed engagement
      # would correlate because of our own scheduler. Per-post divides that out.
      corr_threshold: 0.90
      corr_min_days: 10
      corr_min_pairs: 3
      # "warn" AT LAUNCH — same reasoning as account_action above: surface it,
      # do not silence seven desks. `implicated` is every account in any
      # correlated pair, and 3 of 21 possible pairs is enough to fire, so one
      # confounded reading would cost seven manual clears. There is NO
      # correlation baseline yet (zero nights of real telemetry), so the wire
      # gets measured before it gets armed.
      #
      # ARMING STEP, once the baseline exists: action: halt_implicated. The
      # mechanism is identical either way — a trip writes ONE HALT ROW PER
      # IMPLICATED ACCOUNT, never a global switch (charter §5).
      action: warn

  learned_rules:
    # DARK BY DEFAULT. Applying a learned rule is a PROMOTION (it changes what
    # gets ranked or emitted) and promotions run the gauntlet. The store, the
    # version log, the shape enforcement and the admin surface ship armed; only
    # CONSUMPTION waits on this flag.
    enabled: false
    # "No learning promotes from one viral accident" (charter §8 experiment law)
    # with teeth: a proposal must cite at least this many labelled observations.
    min_evidence_n: 30
    # ...and may not cite a cell the scorecard marked "seeding" — a cell that
    # makes no ranking claim cannot support one.
    require_cell_verdict_not_seeding: true

# ─────────────────────────────────────────────────────────────────────────────
# X COMPETITIVE INTELLIGENCE (masterplan §10 E3)
# engine/marketing/x_intel.py + engine/marketing/exemplar_store.py read `intel:`
# scripts/x_intel_harvest.py is the run; .github/workflows/marketing-x-intel.yml
# is the weekly schedule.
#
# This lane AUTOMATES a docket that already exists by hand:
# research/marketing_dockets/x_corpus_2026_07_29/{stats.md,exemplars.md} — 286
# original posts across the 17 accounts seeded below, same source, same
# methodology. The roster IS that account list.
# ─────────────────────────────────────────────────────────────────────────────
intel:
  enabled: true

  # ── Transport (twitterapi.io, the same account as the Trump wire and the
  # reply desk — one API key, one shared $75/mo bucket, three INDEPENDENT
  # counters). This lane's counter is committed (data/marketing/x_intel/
  # state.json) because it runs weekly on a GitHub-hosted runner that commits
  # its own artifacts; it never touches the render host.
  base_url: "https://api.twitterapi.io"
  endpoint: "/twitter/user/last_tweets"
  auth_header: "X-API-Key"
  key_env: "TWITTERAPI_IO_KEY"
  user_agent: "MastermindX-Intel/1.0 (+https://mastermind-x.com)"

  # ── THE BUDGET, WITH THE ARITHMETIC SHOWN ────────────────────────────────
  # twitterapi.io bills per TWEET RETURNED: $0.15/1,000 tweets, $0.00015
  # minimum per request. One roster call returns ~20 tweets:
  #       20 x $0.15/1000 = $0.003 per call
  # 600 calls/month is therefore ~$1.80/month of the shared $75 bucket, sized as
  #       17 accounts x 1 weekly pass x 4.4 weeks  =  ~75 calls
  #     + a daily light pass on 5 fast desks       =   150 calls
  #     + re-runs / backfills / a doubled week     =  headroom
  # The USD cap is the second, independent stop in case a page ever returns far
  # more than ~20 tweets. Either one binding REFUSES the call with a ::warning.
  monthly_call_cap: 600
  monthly_usd_cap: 5.0
  price_per_1k_tweets_usd: 0.15
  min_charge_per_request_usd: 0.00015
  # One run may not eat the month. 20 covers a full 17-account roster pass.
  max_calls_per_run: 20

  # ── Analysis ─────────────────────────────────────────────────────────────
  # Posts created inside this window feed the tables. Older corpus rows stay on
  # disk (append-only) but do not skew a "what works now" read.
  analysis_window_days: 90
  # A table row below this n is PRINTED with verdict="seeding" and makes no
  # ranking claim. Lower than learning.n_floor (20) on purpose: these are other
  # people's posts, ~340/week, not ours.
  n_floor: 12

  exemplar_store:
    # THE PIN — the ONLY thing the writer reads. null = the writer sees NO
    # exemplars (dark default). promote_pending() mints a version; ACTIVATING it
    # is this line, edited by hand, in a reviewable diff. A promotion can never
    # flip house voice on its own.
    active_version: null
    # Candidate pool size, and the per-register slice of it.
    max_pending: 40
    per_register: 8
    # A candidate needs a real denominator behind its interaction rate.
    min_views: 5000

  # ── The daily light pass ─────────────────────────────────────────────────
  # `tier: daily` on a roster entry admits it to `x_intel_harvest --light`, the
  # bounded cheap pass the monthly cap was ALREADY sized for (see the budget
  # arithmetic above: 5 handles x 30 days = 150 calls). At most
  # light_max_handles are polled however many entries carry the tier, and an
  # empty selection polls NOTHING rather than falling back to the full roster.
  # Everything else defaults to `tier: weekly` and is only ever polled by the
  # Sunday deep pass. NO CAP MOVES for this: monthly_call_cap and
  # monthly_usd_cap are unchanged, and the $5 intel carve of the shared $75
  # twitterapi.io bucket is unchanged.
  light_tier: daily
  light_max_handles: 5

  # ── The roster — the 17 accounts of the manual docket, with the register
  # each one writes in (the docket's "By register" grouping). Registers:
  # wire | aggregator | commentary | trader | macro_color.
  roster:
    # wire / breaking — terse, fact-first, ALL-CAPS or `BREAKING:` leads,
    # almost no cashtags, almost no emoji. THE FIVE FASTEST DESKS — the wire
    # trio plus the two highest-cadence relays — carry `tier: daily`: they post
    # many times a day, so a weekly-only read of them samples a sliver of what
    # they published and the register drifts between passes.
    - handle: DeItaone
      register: wire
      tier: daily
      note: "asterisk-prefix + SOURCE: attribution shorthand; 85% ALL-CAPS lead"
    - handle: FirstSquawk
      register: wire
      tier: daily
      note: "sentence case, 100% single-line, one-decimal precision"
    - handle: unusual_whales
      register: wire
      tier: daily
      note: "BREAKING: prefix + `per <source>` suffix; corpus engagement leader"
    # news / numbers aggregator — cashtag-heavy, URL-heavy, long stacks.
    - handle: KobeissiLetter
      register: aggregator
      tier: daily
      note: "longest posts in the corpus (p50 580 chars), 100% carry digits"
    - handle: Barchart
      register: aggregator
      tier: daily
      note: "95% emoji, 95% URL — the chart-relay template"
    - handle: StockMKTNewz
      register: aggregator
    - handle: wallstengine
      register: aggregator
      note: "95% open with a cashtag; 100% multi-line"
    # data-driven commentary — numbers as the whole post, chart links.
    - handle: charliebilello
      register: commentary
      note: "100% digits, highest strict-decimal rate in the corpus"
    - handle: RyanDetrick
      register: commentary
    - handle: bespokeinvest
      register: commentary
      note: "100% digits, 65% cashtag, zero emoji"
    # trader / setup — levels, charts, the widest shape range.
    - handle: markminervini
      register: trader
      note: "longest tail (p90 1,307 chars)"
    - handle: PeterLBrandt
      register: trader
    - handle: alphatrends
      register: trader
    - handle: traderstewie
      register: trader
    - handle: Mr_Derivatives
      register: trader
    # macro color — prose, links, near-zero cashtags.
    - handle: jam_croissant
      register: macro_color
    - handle: LizAnnSonders
      register: macro_color
      note: "94% single-line, zero cashtags, 89% URL"
