## config/marketing.yml — Marketing lobe configuration
## Drives engine/neuralweb/marketing_governor.py
## Spec §5 (frozen contract).
##
## Mixed-tilt model: every desk posts ALL 7 content types; the tilt
## shifts emphasis so desks feel distinct without being clones.
## signal is the largest weight on every account (min 0.28).
## All weights ≥ 0.03.

# Funnel W1a (D07): canonical UTM links — every post-text URL is tagged exactly once.
links:
  base_url: "https://mastermind-x.com/"
  utm_source: "x"
  short_links: true

positioning:
  category: "Accountable AI market intelligence"
  promise: "Know what changed, why it matters, and what to watch next."
  proof: "Every important conclusion carries evidence, invalidation, timestamp, and outcome history."
  icp: "Self-directed, research-intensive swing/position investors following 10–100 names."
  first_paid_job: "Continuously monitor what matters to my holdings/watchlist and tell me when the causal picture changes."

settings:
  trial_variant: "7_trading_days"      # or 14_calendar_days | value_moment_limited
  desk_network_stage: "A"              # A warm | B assisted | C autonomous
  paid_enabled: false
  auditor_strict: true
  north_star_window_days: 90
  radar_tiers_enabled: false           # D06: Movers Desk drops T3 (dead-attention) cashtags when true; off until first nightly verified

radar:
  # megacap/meme always-liquid attention list, operator-editable
  t1_always: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO, AMD, NFLX, PLTR, COIN, HOOD, MSTR, SMCI, GME, AMC]

# ─────────────────────────────────────────────────────────────────────────────
# Sentinel — trust_office W1 plan-level policy gate (engine/marketing/sentinel.py)
#
# D02 actuator LAW: read ALL caps from this block — NEVER hardcode constants
# in the actuator. If this block is absent the sentinel falls back to in-code
# conservative defaults, but the actuator must not have its own fallback copy.
#
# The ramp schedule below is binding once D08 is live. D02 reads
# sentinel.ramp.weeks_1_2 / weeks_3_4 / week_5_plus by account age.
# Week-1-2 numbers come from the D08 red-team appendix (X policy conservative floor).
# ─────────────────────────────────────────────────────────────────────────────
sentinel:
  # Cross-account near-duplicate threshold — lowered from 0.60 to 0.50 per
  # D08_APPENDIX_X_POLICY_REDTEAM §4: finance copy is templated so 0.60 lets
  # genuinely similar posts pass; the policy bar is "substantially similar".
  # Lower = more aggressive blocking; false-positive rewrites are the safe direction.
  near_dup_jaccard: 0.50

  # Base cadence caps (base = weeks_1_2 tier).
  # W1 has no account-age wiring, so in-force defaults must assume brand-new accounts.
  # D02 actuator RAISES caps by ramp tier (see ramp: below) — never lowers them.
  max_posts_per_account_per_day: 2
  max_same_cashtag_per_account_per_day: 1
  max_replies_per_account_per_day: 0

  # min_minutes_between_posts is NOT enforced at plan tier (queue slots have no
  # timestamps). It is the contract value the D02 actuator MUST read from here
  # and honour at post time, never post faster than this floor.
  # Base = weeks_1_2 value (120 min); actuator relaxes to 90 at week 5+.
  min_minutes_between_posts: 120

  # Stale-receipts refusal: if the graded-receipts ledger is older than this
  # many days, the whole plan is refused (we must not post receipts we can't back).
  max_receipt_age_days: 7

  # Link policy — new accounts posting links is a named X spam trigger;
  # same link twice is a documented suspension trip (D08 R2). Forbidden until week 5.
  links_allowed: false

  # Media cap per account per day — fresh accounts posting all-chart content reads
  # as a content farm (D08 R4). Ramp 1→2→3; base = weeks_1_2 value.
  max_media_posts_per_account_per_day: 1

  # Per-post cashtag breadth cap — cashtag piggybacking (many tickers in one post)
  # is an actively-suspended financial-spam vector (D08 R3). Cap distinct $TICKER
  # tokens in headline+body. theme_list is exempt (see sentinel.py comment).
  max_cashtags_per_post: 3

  # New-follows cap — follow churn is the fastest X suspension trigger; automated
  # following is banned outright (D08 R7). Any follows in week 5+ must be
  # manual-only, operator-performed. Actuator must never script follows.
  max_new_follows_per_account_per_day: 0

  # Financial-advice phrasing lexicon (word-boundary, case-insensitive).
  # Defense-in-depth at the plan layer — some overlap with copywriter._BANNED_VOCAB
  # is intentional (different seams).
  lexicon_phrases:
    - "you should buy"
    - "you should sell"
    - "get in now"
    - "get in before"
    - "guaranteed"
    - "can't lose"
    - "cannot lose"
    - "sure thing"
    - "easy money"
    - "risk-free"
    - "risk free"
    - "free money"
    - "no-brainer"
    - "back up the truck"
    - "load up"
    - "all-in"
    - "to the moon"
    - "price target guaranteed"

  # Regex patterns (case-insensitive) for financial-advice phrasing.
  lexicon_patterns:
    - '\b(will|going to|gonna)\s+(hit|reach|touch|double|triple|10x)\b'
    - '\bcan''?t\s+(go|drop|fall)\b'

  # Ramp schedule — full per-tier cap table (D08 §3).
  # D02 actuator selects the right tier by account creation date (see desk_network
  # accounts for the `created:` field to fill at account creation).
  # Base values above = weeks_1_2 floor. D02 raises caps when the account ages.
  ramp:
    weeks_1_2:
      max_posts_per_account_per_day: 2
      min_minutes_between_posts: 120
      links_allowed: false
      max_media_posts_per_account_per_day: 1
      max_same_cashtag_per_account_per_day: 1
      max_replies_per_account_per_day: 0
      max_new_follows_per_account_per_day: 0
    weeks_3_4:
      max_posts_per_account_per_day: 3
      min_minutes_between_posts: 120
      links_allowed: false
      max_media_posts_per_account_per_day: 2
      max_same_cashtag_per_account_per_day: 2
      max_replies_per_account_per_day: 0
      max_new_follows_per_account_per_day: 0
    week_5_plus:
      max_posts_per_account_per_day: 4
      min_minutes_between_posts: 90
      links_allowed: true   # ≤1 link post/day enforced by actuator
      max_media_posts_per_account_per_day: 3
      max_same_cashtag_per_account_per_day: 2
      max_replies_per_account_per_day: 2   # Sentinel-gated
      max_new_follows_per_account_per_day: 5   # manual-only; actuator must NOT script follows

departments:
  growth_os:
    lifecycle_state: building
    authority_level: G2
    budget_envelope_usd: 0
  # Optional per-department overrides below.
  # Unspecified departments use coded DEPARTMENT_CHARTERS defaults.
  # Fields: lifecycle_state, authority_level, budget_envelope_usd

desk_network:
  stage: A
  accounts:
    - id: flagship
      kind: branded
      beat: "What changed and why it matters"
      voice: "authoritative desk"
      # Per-account kill-switch: uncomment to disable this account's items in the sentinel gate.
      # disabled: true
      # created: YYYY-MM-DD   # fill at account creation — drives ramp tier lookup (D02)
      # Flagship: heavy on signal + macro; the authoritative read
      tilt:
        signal: 0.32
        chart: 0.10
        education: 0.08
        macro: 0.14
        receipt: 0.08
        watchlist: 0.05
        event: 0.05
        mover: 0.10
        theme_list: 0.08

    - id: receipts
      kind: branded
      beat: "Visual evidence + public report card"
      voice: "dry, receipts-forward"
      # Receipts: heavy on receipt + chart; accountability desk
      tilt:
        signal: 0.26
        chart: 0.18
        education: 0.05
        macro: 0.07
        receipt: 0.18
        watchlist: 0.05
        event: 0.05
        mover: 0.08
        theme_list: 0.08

    - id: theme_desk
      kind: branded
      beat: "Rotating high-attention vertical"
      voice: "specialist"
      # Theme: heavy on signal + event + theme_list; follows high-attention moments
      tilt:
        signal: 0.28
        chart: 0.10
        education: 0.08
        macro: 0.08
        receipt: 0.06
        watchlist: 0.05
        event: 0.14
        mover: 0.10
        theme_list: 0.11

    - id: research_a
      kind: generic
      beat: "Macro/rates/liquidity explainers"
      voice: "educational"
      # Research A: heavy on macro + education; the explainer desk
      tilt:
        signal: 0.24
        chart: 0.08
        education: 0.18
        macro: 0.20
        receipt: 0.05
        watchlist: 0.05
        event: 0.03
        mover: 0.10
        theme_list: 0.07

    - id: research_b
      kind: generic
      beat: "Single-stock why-is-it-moving fast desk"
      voice: "fast, reactive"
      # Research B: heavy on signal + mover + theme_list; the Tape Reader reach desk
      tilt:
        signal: 0.30
        chart: 0.16
        education: 0.04
        macro: 0.06
        receipt: 0.06
        watchlist: 0.04
        event: 0.08
        mover: 0.14
        theme_list: 0.12

    - id: research_c
      kind: generic
      beat: "Charts + historical analogues"
      voice: "pattern/history"
      # Research C: heavy on chart + watchlist; pattern and historical context desk
      tilt:
        signal: 0.26
        chart: 0.22
        education: 0.06
        macro: 0.06
        receipt: 0.05
        watchlist: 0.13
        event: 0.05
        mover: 0.10
        theme_list: 0.07

# ─────────────────────────────────────────────────────────────────────────────
# Copywriter — personas + copy laws (the anti-bot-voice system)
# The copywriter (engine/marketing/copywriter.py) reads this block. Personas give
# each desk a real voice; copy laws are hard validation rules every post must
# pass regardless of whether the LLM or the deterministic fallback wrote it.
# ─────────────────────────────────────────────────────────────────────────────
copywriter:
  copy_laws:
    - every post carries at least one concrete, checkable fact (a number, a level, a record, a streak)
    - never repeat a headline or signature phrase across posts in the same plan
    - cashtag on every ticker post; max 275 chars; at most 1 emoji unless the persona budget says 0
    - signal posts carry an invalidation or "what would change this" line and an honesty disclosure
    - never name MACD / RSI / Stochastic / Ichimoku / Bollinger in public copy ("signal stack" is fine; visible chart labels are fine)
    - every numeric claim must come from the provided numbers whitelist — no invented numbers
    - losses are posted as plainly as wins; self-deprecation beats spin
    - no financial-advice phrasing ("buy now", "can't lose", "guaranteed"); no "validated"
  personas:
    flagship:
      name: "The Desk"
      voice_notes: >
        Measured, confident, first-person-plural. Dry wit, never jokey. Leads with
        the sharpest fact, then the read, then what would change our mind. Writes
        like a senior PM talking to smart friends — short declaratives, no filler,
        no exclamation marks. Emoji budget: 0-1 (📌 or 👀 at most, rarely).
      example_lines:
        - "Semis carried the tape again. That's the third time this month the generals led while breadth sat out — we're watching the soldiers."
        - "$X reclaimed the level everyone gave up on in May. Positioning did the rest."
    receipts:
      name: "The Scorekeeper"
      voice_notes: >
        Blunt, numbers-first, zero spin. Posts wins and losses with the same flat
        tone; slightly self-deprecating on losses ("the stop did its job, our ego
        didn't"). Everything resolves to a number. Emoji budget: 1 (🧾).
      example_lines:
        - "🧾 $QCOM, graded: T1 hit +9.6%, runner stopped at 177. Net positive, process held, thesis didn't."
        - "We said below 42 kills it. It closed 41.80. Killed. Next."
    theme_desk:
      name: "The Specialist"
      voice_notes: >
        Sector nerd energy. Connects one stock's move to the bigger theme in one
        breath, exactly one sharp opinion per post. Fluent, quick, occasionally
        spicy but never sloppy. Emoji budget: 1.
      example_lines:
        - "Utilities don't rip 3% on nothing. Data-center power demand is the story nobody's pricing past next quarter."
    research_a:
      name: "The Professor"
      voice_notes: >
        Explains like the best teacher you had — plain words, a rhetorical question,
        then the answer. Patient, zero hype, quietly funny. Loves "here's the part
        most people miss." Emoji budget: 0.
      example_lines:
        - "Why does the market care about the 200-week average? Because everyone believes everyone else does. That's the whole trick — and $X just tested it."
    research_b:
      name: "The Tape Reader"
      voice_notes: >
        Fast, clipped, present-tense. Reads the tape out loud. Short lines, line
        breaks, asks the audience one question. Emoji budget: 1 (👀 or 🔥).
      example_lines:
        - "$X up 4% on 3x volume. Sellers had every excuse today and didn't show. 👀"
        - "Biggest weekly volume since March. Someone knows something or someone's wrong. Which is it?"
    research_c:
      name: "The Historian"
      voice_notes: >
        Everything rhymes with something. Calm, patient, loves "last time this
        happened" and dated precedents. Never predicts loudly — points at the
        precedent and lets it talk. Emoji budget: 0-1.
      example_lines:
        - "Last time $X put in back-to-back weeks like this was Oct 2022. That one went 60% in six months. Rhyme, not repeat — but worth a look."
  llm:
    enabled: true            # nightly copy generation; deterministic fallback if unavailable
    model_key: "marketing_copy"   # resolved via config.yml llm_models block; sonnet-class
    max_posts_per_run: 60
    daily_token_cap: 300000

# ─────────────────────────────────────────────────────────────────────────────
# Breaking news ingestion (D05 W0)
# engine/marketing/breaking_feed.py reads `breaking.sources`
# engine/marketing/breaking_relevance.py reads `breaking.salience_threshold`
# engine/marketing/breaking_summary.py reads `breaking.llm`
# ─────────────────────────────────────────────────────────────────────────────
breaking:
  poll_interval_s: 300
  user_agent: "MastermindBreakingBot/1.0 (+https://mastermind-x.com)"
  salience_threshold: 60
  sources:
    - key: fed_press
      kind: rss
      url: "https://www.federalreserve.gov/feeds/press_all.xml"
      source_name: "Federal Reserve"
      tier: official

    - key: bls_news
      kind: rss
      url: "https://www.bls.gov/feed/news_release.rss"
      source_name: "Bureau of Labor Statistics"
      tier: official

    - key: bea_news
      kind: rss
      url: "https://apps.bea.gov/rss/rss.xml"
      source_name: "Bureau of Economic Analysis"
      tier: official

    - key: whitehouse_actions
      kind: rss
      url: "https://www.whitehouse.gov/presidential-actions/feed/"
      source_name: "White House"
      tier: official

    - key: cnbc_top
      kind: rss
      url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"
      source_name: "CNBC"
      tier: wire

    - key: marketwatch_top
      kind: rss
      url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"
      source_name: "MarketWatch"
      tier: wire

  llm:
    enabled: true
    model_key: "marketing_copy"
    max_tokens: 800
