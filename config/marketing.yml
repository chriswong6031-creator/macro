## config/marketing.yml — Marketing lobe configuration
## Drives engine/neuralweb/marketing_governor.py
## Spec §5 (frozen contract).
##
## Mixed-tilt model: every desk posts ALL 7 content types; the tilt
## shifts emphasis so desks feel distinct without being clones.
## signal is the largest weight on every account (min 0.28).
## All weights ≥ 0.03.

# Funnel W1a (D07): canonical UTM links — every post-text URL is tagged exactly once.
links:
  base_url: "https://mastermind-x.com/"
  utm_source: "x"
  short_links: true

positioning:
  category: "Accountable AI market intelligence"
  promise: "Know what changed, why it matters, and what to watch next."
  proof: "Every important conclusion carries evidence, invalidation, timestamp, and outcome history."
  icp: "Self-directed, research-intensive swing/position investors following 10–100 names."
  first_paid_job: "Continuously monitor what matters to my holdings/watchlist and tell me when the causal picture changes."

settings:
  trial_variant: "7_trading_days"      # or 14_calendar_days | value_moment_limited
  desk_network_stage: "A"              # A warm | B assisted | C autonomous
  paid_enabled: false
  auditor_strict: true
  north_star_window_days: 90
  radar_tiers_enabled: false           # D06: Movers Desk drops T3 (dead-attention) cashtags when true; off until first nightly verified

# ─────────────────────────────────────────────────────────────────────────────
# Ad Central — creative fan-out, split tests, budget allocation.
# research/AD_CENTRAL_MASTERPLAN.md; engine/marketing/ad_{creative,matrix,arena,stats,allocator}.py
#
# G-A TRIPLE GATE: no adapter spends a cent unless ALL THREE are true —
#   settings.paid_enabled: true   ·   ad_central.envelope.daily_usd > 0   ·   operator arm
# Any one off ⇒ the allocator returns a dry-run plan. Do not "simplify" this to
# one switch; three independent arms is the point (masterplan §0 G-A).
# ─────────────────────────────────────────────────────────────────────────────
ad_central:
  envelope:
    daily_usd: 0                 # Phase 1 ships at zero. Raising this alone spends nothing.
    per_arm_daily_cap_usd: 20    # hard ceiling per ad per day
    min_daily_usd: 5             # platform floor — below this a budget buys nothing

  arena:
    # Assignments per arm before ANY verdict, promotion, kill, or scale-up.
    # Matches engine/marketing/telemetry.py's n-floor law. Lowering this does not
    # make a test conclude sooner; it makes it conclude wrongly.
    n_floor: 100
    credible_level: 0.90         # interval width on every reported rate
    decisive: 0.95               # P(best) required before an arm is declared a winner
    practical_pp: 0.5            # differences inside ±this read as "these are the same"
    # Beta prior. (1,1) is uniform — conservative at small n, which is the safe
    # direction. Printed in every verdict so a reader can see what was assumed.
    prior_alpha: 1
    prior_beta: 1
    exploration_floor_share: 0.10  # min budget share an arm holds until it clears n_floor

  matrix:
    max_creatives: 24            # cap on one fan-out
    jaccard_ceiling: 0.7         # same near-dup ceiling the organic lane flags at

radar:
  # megacap/meme always-liquid attention list, operator-editable
  t1_always: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO, AMD, NFLX, PLTR, COIN, HOOD, MSTR, SMCI, GME, AMC]

# ─────────────────────────────────────────────────────────────────────────────
# Supply — candidate-pool breadth and selection-diversity knobs.
#
# ONE OWNER (masterplan §3 PR-B.4). This block is defined and read by
# engine/marketing/attention_source.py (`supply_config` + the typed accessors
# beside it); the SELECTOR that acts on the diversity numbers is PR-C's
# content_studio work and is deliberately not wired yet. Defining the knobs
# here first is what stops PR-C from inventing a second, disagreeing copy of
# them somewhere in the selection path — the per-lane kwarg drift the recon
# found at nine chart call sites is the same failure one file earlier.
#
# Every value below is also hard-coded as a default in `_SUPPLY_DEFAULTS`, so
# deleting this block degrades to the same numbers rather than to zero. The
# accessors are the only sanctioned reader: an actuator must never carry its
# own fallback copy of a cap (the sentinel block above states the same law).
# ─────────────────────────────────────────────────────────────────────────────
supply:
  # How many candidates each read-only pool may return. These are POOL sizes,
  # not post counts — the selector draws from them under its own cadence caps.
  pool_caps:
    dollar_volume: 120          # nightly ADV pack, by its own dollar-volume rank
    options_volume: 80          # data/options_flow latest-session contract volume
    retail_attention: 80        # WSB mentions ∪ Wikipedia attention z
    earnings_this_week: 60      # earnings.parquet next_date ≤ 5 sessions
    stage2_leaders: 60          # Weinstein stage 2, USA, by SATA
    stage_transitions: 40       # stage_flag changed vs the prior snapshot

  # §0 gate 6 long tail: a rotation that only ever revisits the hot ~20 names
  # is a narrower desk than the corpus we are matching (~5 brand-new long-tail
  # names per day). A shortfall must print a ::warning, never silently narrow.
  long_tail_quota:
    min_fresh_per_day: 3        # names not posted inside the window below
    not_posted_within_days: 30

  # §0 gate 6 concentration cap. A live story legitimately gets several posts a
  # day; three CHART posts on one ticker in one day is where it stops reading
  # as coverage and starts reading as a hobby horse.
  per_ticker_day:
    max_chart_posts: 3

  # Freshness beats coverage. A pool whose source lags by more than this many
  # trading sessions returns [] and says so in an annotation, rather than
  # letting a two-week-old attention rank pose as today's.
  freshness:
    max_stale_sessions: 3
    # Per-pool budgets, EMPTY on purpose — every pool is judged by the single
    # number above until an operator decides otherwise. Measured on 2026-08-02,
    # two sources do not refresh daily and are therefore refused most days:
    # data/earnings/earnings.parquet swept 2026-06-19 and 2026-07-28 (two
    # stamps, weeks apart) and the Weinstein stage backfill is a weekly
    # artifact stuck at 2026-07-17. Both are genuinely stale — the collectors
    # are the fix, not the gate — so this lever stays un-pulled and the empty
    # pools keep printing their annotations. Example, if ever wanted:
    #   per_pool: {earnings_this_week: 10, stage2_leaders: 10}
    per_pool: {}

  tiers:
    # ADV floor a name from the nightly liquid-market ADV pack
    # (data/marketing/) must clear to enter the cashtag-tier universe. Matches
    # that pack's own construction filter, so today this admits every name it
    # ships and exists to be raisable, not to bite.
    #
    # NAMING, deliberate and load-bearing: this key and the two comments above
    # do NOT spell the intraday attention program's module name, and neither
    # does this sentence. THIS FILE is one of six the program's safety-stack
    # guard holds read-only to it (TestSafetyStack, in that program's radar
    # suite under tests/), and unlike the five source files it lists, the
    # config file's invariant is ABSOLUTE — no sanctioned-token exception
    # exists for it, and the guard is right that a config knob is exactly the
    # shape of reach it defends against. Widening the exception to fit this
    # block would have traded a real guard for a comment. A reader who wants
    # the artifact path finds it in engine/marketing/attention_source.py,
    # which is not on that list and names it freely.
    pack_min_adv_dollars: 25000000

# ─────────────────────────────────────────────────────────────────────────────
# Sentinel — trust_office W1 plan-level policy gate (engine/marketing/sentinel.py)
#
# D02 actuator LAW: read ALL caps from this block — NEVER hardcode constants
# in the actuator. If this block is absent the sentinel falls back to in-code
# conservative defaults, but the actuator must not have its own fallback copy.
#
# The ramp schedule below is ENFORCED as of 2026-07-27. The seam is
# sentinel.resolve_ramp() → gate_plan(): every ENABLED desk_network account
# resolves an age tier from its `created:` date against the PLAN's as_of date
# (never a wall clock — the gate must be deterministic from plan inputs), and
# the caps that actually govern its items are the STRICTER of (base block below,
# that tier's row). Week-1-2 numbers come from the D08 red-team appendix (X
# policy conservative floor).
# ─────────────────────────────────────────────────────────────────────────────
sentinel:
  # Cross-account near-duplicate threshold — lowered from 0.60 to 0.50 per
  # D08_APPENDIX_X_POLICY_REDTEAM §4: finance copy is templated so 0.60 lets
  # genuinely similar posts pass; the policy bar is "substantially similar".
  # Lower = more aggressive blocking; false-positive rewrites are the safe direction.
  near_dup_jaccard: 0.50

  # Base cadence caps.
  # Daily post volume is UNLIMITED HERE (operator 2026-07-24 — autonomous
  # cadence). -1 is the "no limit" sentinel decoded by sentinel._cap_unlimited
  # (null does NOT work: _get collapses a present-null back to the default). The
  # code default stays 2 as a safe bounded fallback if this key is ever missing.
  # The ramp: table below narrows this key per account: an enabled desk resolves
  # an age tier from its `created:` date and is bounded by the STRICTER of (this
  # value, that tier's row) — at plan tier via sentinel.gate_plan, and at post
  # time via outbox.effective_cap_for (#3884 F1). So a week-1 desk is at 2/day
  # everywhere, not just in the plan.
  #
  # WHAT PACES VOLUME (updated XG-W2). The 2026-07-24 decision left this key as a
  # deliberately blunt GLOBAL backstop — one number for every account, which read
  # fine with one live desk and became a hole at seven. The pacing that actually
  # binds is, in order:
  #   1. the per-account CADENCE RESOLVER (cadence_resolver: below) — each
  #      account's own posts_per_day / min_spacing_min / session window, read
  #      from config/personas/<id>.yml. This is the per-account law; the specs'
  #      cadence blocks were decorative until XG-W2, and ARMED 2026-07-28 once
  #      their numbers were reconciled with the ramp tiers below. It is the only
  #      per-account SPACING bound in the stack.
  #   2. the post-time global floor (publish.min_minutes_between_any_posts) — 4
  #      minutes since #3924, network-wide. It was 10 and was pacing seven desks
  #      as if they were one; it is an anti-collision floor, not a cadence.
  #   3. this key, narrowed by the ramp tier — the network-wide ceiling. Still
  #      honoured, still able to LOWER any account below its spec. Setting it
  #      back to a real number is a valid tightening at any time; the resolver
  #      does not replace it.
  # The three compose as stricter-of, in that order. The 2-week link gate below
  # is unchanged.
  #
  # STILL OPEN (#3884 F6). The ramp tier's own min_minutes_between_posts is
  # never consumed at post time — outbox.sentinel_contract returns base values
  # only, and the XG-W2 resolver reads SPACING from the persona spec, not from
  # the tier. So a week-1 desk's daily VOLUME is tier-bounded while its spacing
  # is spec-bounded. Composing the two (stricter-of, same shape as the cap) is
  # the remaining half of the tier-aware cadence contract and is deliberately
  # not built here — it needs the resolver to take an account age, which is a
  # design decision, not a patch.
  max_posts_per_account_per_day: -1   # unlimited (global backstop; see above)
  # Raised 1 -> 3 (operator 2026-07-28) alongside the 10/20-per-day volume.
  # At 1/day the cashtag cap became the binding limit the instant volume rose:
  # a 47-name plan pool spread over 10 posts collides constantly, and the base
  # is the STRICTER half of the ramp merge, so leaving it at 1 would have
  # silently pinned every tier back to 1 no matter what the tier rows said.
  # The per-POST breadth guard (max_cashtags_per_post, the actual D08 R3
  # piggybacking vector) is untouched at 2 for ramping desks.
  max_same_cashtag_per_account_per_day: 3
  max_replies_per_account_per_day: 0

  # ── Post-time gates (ported from #3928) ────────────────────────────────────
  # Enforced by scripts/marketing_publisher.py at the last gate before the
  # network, over ONE account's same-day posted history. Lane-blind on purpose:
  # the nightly plan, the wire lanes, the press bridge and an operator "post now"
  # all land in the same account's day and only the publisher sees all of them.
  #
  # Per-account template-FRAME similarity (tickers and numbers blanked, token
  # Jaccard). Two posts by one desk in one day at or above this are one template
  # wearing two tickers: "$TEL close to going" / "$CBOE close to going" /
  # "$FDS close to going" all shipped on the founder desk on 2026-07-28 because
  # every dedup gate in the tree compares raw tokens and the tickers differ.
  # Measured over the live outbox on 2026-07-29: of 124 same-(account, day)
  # pairs among approved/posted items exactly ONE scores at or over 0.60 (the
  # flagship "$PLTR into the week" / "$MSFT into the week" pair at 0.778, which
  # is the defect); the next-highest pair is 0.500.
  frame_similarity: 0.60
  # Per-account daily cap on the no-ticker, no-chart kinds (macro/event/
  # education). Kelly's entire 2026-07-28 output was four of them, each a
  # different way to say "I post my results", so she shipped nothing after
  # review. They are seasoning, not a meal.
  #
  # content_studio.apply_reuse_budget reads THIS SAME KEY and trims the emitted
  # day to it, so the publisher's copy is a cross-lane backstop rather than a
  # scythe through planned work: on the 2026-07-28/29 plans the allocator gave
  # flagship 6 filler slots a day (sophia's tilt allows 10), and arming only the
  # publish-time half would have quarantined 5 of 6 every night with nothing
  # upstream saying so. -1 = unlimited.
  max_filler_per_account_per_day: 1

  # THE BAR (operator 2026-07-28): "a post must name a ticker, state a dated
  # fact with its numbers, and then say something that FOLLOWS from that fact."
  # This gate covers the first two clauses over every ORIGINATED post from every
  # lane and vintage (replies are exempt — a reply is a conversation).
  #
  # DARK ON PURPOSE. Arming it drops the no-ticker kinds outright: macro, event,
  # education and the planner's ticker-free watchlist slot cannot name a cashtag
  # by construction. That is a product ruling about whether those lanes exist,
  # not a bug fix, so the publisher EVALUATES the floor every sweep and
  # annotates what arming would refuse (the same land-dark shape
  # cadence_resolver.enabled uses) and enforces nothing until this flips true.
  require_ticker_and_number: false

  # min_minutes_between_posts is NOT enforced at plan tier (queue slots have no
  # timestamps). It is the contract value the D02 actuator MUST read from here
  # and honour at post time, never post faster than this floor.
  # Operator re-spec 2026-07-27: the signal ladder moved from 2h to 45-min slots
  # (19 slots/day, S1..S19), so this plan-tier floor drops from 120 to 45 to
  # match. The hard anti-spam rule stays the publish.min_minutes_between_any_posts
  # 10-min global floor (unchanged).
  # 45 -> 30 (operator 2026-07-28) to match the 30-minute ladder step. This is
  # a MAX-WINS knob in the ramp merge (the longer wait governs), so the base
  # value is a FLOOR on how fast any tier may go — at 45 it would have
  # overridden every 30 in the tier rows below.
  min_minutes_between_posts: 30

  # Stale-receipts refusal: if the graded-receipts ledger is older than this
  # many days, the whole plan is refused (we must not post receipts we can't back).
  max_receipt_age_days: 7

  # Link policy — new accounts posting links is a named X spam trigger;
  # same link twice is a documented suspension trip (D08 R2). Forbidden until week 5.
  links_allowed: false

  # Media cap per account per day — UNLIMITED (-1). Signal posts carry charts, so
  # a low media cap would quarantine most of them as media_cap_daily once daily
  # volume is unlimited; the two must move together. Residual: all-chart content
  # on a cold account can read as a content farm (D08 R4) — the 10-min floor + the
  # 2-week link gate are the mitigations the operator accepted. Code default stays
  # 1 as a safe fallback.
  max_media_posts_per_account_per_day: -1   # unlimited

  # Per-post cashtag breadth cap — cashtag piggybacking (many tickers in one post)
  # is an actively-suspended financial-spam vector (D08 R3). Cap distinct $TICKER
  # tokens in headline+body. theme_list is exempt (see sentinel.py comment).
  # A ramping account uses the STRICTER of this and its tier's own
  # max_cashtags_per_post (2 for weeks 1-4).
  max_cashtags_per_post: 3

  # New-follows cap — follow churn is the fastest X suspension trigger; automated
  # following is banned outright (D08 R7). Any follows in week 5+ must be
  # manual-only, operator-performed. Actuator must never script follows.
  max_new_follows_per_account_per_day: 0

  # Signal-post disclosure law — whether a `type: signal` post (a directional
  # call) must carry a not-financial-advice / "historical, not a guarantee" /
  # do-your-own-research anchor before it clears the gate (mirrors the anchor set
  # in sentinel._has_disclosure and copywriter.validate_copy §6). The in-code
  # default is True (safe missing-key fallback). Set False here by OPERATOR RULING
  # 2026-07-26: signal posts are NO LONGER quarantined for a missing disclosure
  # line. This is a deliberate compliance-posture change and is DISTINCT from the
  # FTC / network-affiliation disclosure regime the operator struck in Agentic
  # Media rev-3 (#3490). Reversible: set true (or delete the key) to re-enable.
  # NOTE: the advice-lexicon guard below ("guaranteed", "can't lose", "to the
  # moon", …) is UNAFFECTED by this knob and still bans reckless phrasing.
  require_signal_disclosure: false

  # Financial-advice phrasing lexicon (word-boundary, case-insensitive).
  # Defense-in-depth at the plan layer — some overlap with copywriter._BANNED_VOCAB
  # is intentional (different seams).
  lexicon_phrases:
    - "you should buy"
    - "you should sell"
    - "get in now"
    - "get in before"
    - "guaranteed"
    - "can't lose"
    - "cannot lose"
    - "sure thing"
    - "easy money"
    - "risk-free"
    - "risk free"
    - "free money"
    - "no-brainer"
    - "back up the truck"
    - "load up"
    - "all-in"
    - "to the moon"
    - "price target guaranteed"

  # Regex patterns (case-insensitive) for financial-advice phrasing.
  lexicon_patterns:
    - '\b(will|going to|gonna)\s+(hit|reach|touch|double|triple|10x)\b'
    - '\bcan''?t\s+(go|drop|fall)\b'

  # Ramp schedule — full per-tier cap table (D08 §3). ENFORCED since 2026-07-27
  # (the "decorative table" gap, MASTERPLAN F1, is closed).
  #
  # HOW IT BINDS. sentinel.resolve_ramp() reads each ENABLED desk_network
  # account's `created:` date, subtracts it from the PLAN's as_of date, and picks
  # a tier: <14d weeks_1_2, <28d weeks_3_4, <graduate_after_days week_5_plus,
  # and at/after graduate_after_days the account is GRADUATED — it uses the base
  # block above untouched. Never a wall-clock read: the tier is a pure function of
  # (as_of, created), so re-gating the same plan always yields the same verdict.
  #
  # MERGE LAW while ramping (not graduated) — the effective cap is the STRICTER
  # of (base, tier), per knob:
  #   * numeric caps  → the MINIMUM, where -1/unlimited is the LOOSEST value
  #                     (base -1 + tier 2 ⇒ 2)
  #   * links_allowed → logical AND (base false + tier true ⇒ false)
  #   * min_minutes_between_posts → the MAXIMUM (the longer wait wins)
  # This is what lets both operator rulings stand at once: the 2026-07-24
  # unlimited-cadence ruling keeps governing WARMED (graduated) accounts, while
  # the D08 floor governs COLD ones. A ramp row can therefore only ever tighten a
  # cold account, never loosen a warm one.
  #
  # Missing/unparseable `created:` on an ENABLED account fails CLOSED to
  # weeks_1_2 and prints a ::warning. So does a missing/unparseable plan `as_of`
  # (which fails the WHOLE network closed) and an unparseable value inside a tier
  # row below (that value is ignored; the base block governs that one knob).
  #
  # WHAT IS AND IS NOT WIRED. The tier rows below are enforced by the PLAN gate
  # (sentinel.gate_plan) and by the two post-time seams that consult
  # sentinel.resolve_ramp — outbox.effective_cap_for (daily volume, publisher +
  # actuator + admin) and the publish-time mover/theme lane. Two entries are
  # computed but NOT consumed anywhere yet:
  #   * min_minutes_between_posts — the D02 actuator reads its spacing floor from
  #     outbox.sentinel_contract, which returns BASE values only. The tier values
  #     are 45 to match the 45-min ladder re-spec (2026-07-27) and are carried in
  #     the gate report, but nothing narrows post-time spacing per tier today. A
  #     tier-aware cadence contract is XG-W2 cadence-resolver work.
  #   * max_new_follows_per_account_per_day — the plan tier computes it, but the
  #     only consumer of a follows number is the actuator contract, which is
  #     likewise base-only. Follows are manual-only regardless (D08 R7: the
  #     actuator must never script a follow), so the tier value is documentation
  #     of intent, not an enforced ceiling.
  # Do not write a comment claiming either is honoured at post time until a
  # consumer actually reads it.
  ramp:
    # Days of account age at which the ramp stops applying entirely and the base
    # block above governs alone. 8 weeks — one full ramp plus a 4-week cushion
    # past week_5_plus, which is where D08 §3 stops prescribing.
    # CLAMPED to >= 28 in code (sentinel.effective_graduate_after_days): below
    # that the knob is inert, because the age<14 and age<28 branches fire first,
    # so a configured 20 would delete the week_5_plus window without graduating
    # anyone sooner. The resolved value is printed in the gate report.
    graduate_after_days: 56

    # Per-account cap overrides — sentinel.resolve_ramp applies these ON TOP of
    # the account's tier row, and unlike the tier merge they may LOOSEN (an
    # override means what it says). Same value contract as a tier row: -1 or
    # "unlimited" = no limit, junk = ignored with a ::warning.
    #
    # WHY THIS EXISTS. The tier ladder is purely age-based, so on 2026-07-28 every
    # enabled desk was under 14 days old and flagship — the warmed, established
    # account — sat on the identical 2-posts/day floor as a desk created that
    # morning. The alternatives were both worse: back-dating flagship's `created:`
    # would silently walk it through the whole ramp and corrupt the one field the
    # age gate trusts, and loosening weeks_1_2 far enough for flagship would hand
    # every cold desk the same cadence. Overrides are named, per-desk, and printed
    # in the gate report so a wide cap is always traceable to a decision.
    #
    # Operator 2026-07-28: flagship posts every 30 minutes, up to 20/day.
    account_overrides:
      flagship:
        max_posts_per_account_per_day: 20
        max_media_posts_per_account_per_day: 20
        min_minutes_between_posts: 30
        # Operator 2026-07-28 ("when semiconductors are all down big we should
        # already be posting lists"): flagship is the warmed desk, and the
        # sector/theme lists the publish-time lane generates every 30 minutes
        # from live quotes were 100% dropped — 18 per sweep on a day semis were
        # routing — because no account was past the theme_list ramp. The ramp's
        # cold-account piggybacking concern (≥4 cashtags, no history to read
        # against) does not describe flagship; it stays in force for every
        # other desk.
        theme_list_allowed: true
    weeks_1_2:
      # Operator re-spec 2026-07-28: 10 posts/account/day (was 2). The desks were
      # publishing ~5 posts across the WHOLE network because 2/day is a launch
      # floor, not a working cadence. Spacing drops 45 -> 30 to match the 30-min
      # ladder. See account_overrides below for flagship's 20.
      max_posts_per_account_per_day: 10
      min_minutes_between_posts: 30
      links_allowed: false
      # Tracks max_posts_per_account_per_day ON PURPOSE — see the base block's
      # note: charts and daily volume "must move together". A media cap BELOW
      # the post cap does not strip the image, it QUARANTINES the post
      # (reason media_cap_daily), so every ticker post now carrying a chart
      # would have cost this desk half its daily volume. (operator 2026-07-28)
      max_media_posts_per_account_per_day: 10
      # 1/day made the cashtag cap the binding limit the moment volume rose:
      # 10 posts drawn from a 47-name plan pool collide constantly. 3 keeps the
      # piggybacking guard meaningful (D08 R3 is about MANY tickers in ONE post,
      # which max_cashtags_per_post still bounds at 2 here) without throwing away
      # most of the day's queue.
      max_same_cashtag_per_account_per_day: 3
      max_replies_per_account_per_day: 0
      max_new_follows_per_account_per_day: 0
      # Cashtag breadth on a cold account. A post naming 3+ tickers is the
      # piggybacking fingerprint D08 R3 describes; 2 is the conservative floor.
      max_cashtags_per_post: 2
      # theme_list ("Theme Tape") posts carry ≥4 member cashtags BY FORMAT
      # (copywriter.validate_copy requires it), which is exactly the shape the
      # breadth cap exists to stop — so on a cold account the format itself is
      # quarantined (reason ramp_theme_list) rather than exempted. Re-allowed at
      # week 5, when the account has a posting history to be read against.
      theme_list_allowed: false
    weeks_3_4:
      max_posts_per_account_per_day: 14
      min_minutes_between_posts: 30
      links_allowed: false
      max_media_posts_per_account_per_day: 14
      max_same_cashtag_per_account_per_day: 3
      max_replies_per_account_per_day: 0
      max_new_follows_per_account_per_day: 0
      max_cashtags_per_post: 2
      theme_list_allowed: false
    week_5_plus:
      max_posts_per_account_per_day: 20
      min_minutes_between_posts: 30
      links_allowed: true   # ≤1 link post/day enforced by actuator
      max_media_posts_per_account_per_day: 20
      max_same_cashtag_per_account_per_day: 3
      max_replies_per_account_per_day: 2   # Sentinel-gated
      max_new_follows_per_account_per_day: 5   # manual-only; actuator must NOT script follows
      max_cashtags_per_post: 3
      theme_list_allowed: true

# ─────────────────────────────────────────────────────────────────────────────
# Publish — W1 live social publisher (scripts/marketing_publisher.py +
# engine/marketing/social_publisher.py). DARK BY DEFAULT: this block only names
# the backend and per-account channel ids; nothing posts unless BOTH the
# kill-switch env MARKETING_PUBLISH_ENABLED=1 AND the runner's --live flag are
# set. The Buffer personal access token is read from env BUFFER_TOKEN (never
# committed — see .env.example).
# ─────────────────────────────────────────────────────────────────────────────
publish:
  backend: buffer          # only "buffer" is implemented today
  require_approval: true   # only outbox items an operator approved may post
  # Operator decision 2026-07-24 ("auto-approve flagship signals"): the runner
  # auto-advances queued→approved for EVERY item clearing all publish gates
  # (validate_postable, a channel id configured for its account, under the daily
  # cap, not operator-held), then the live tape gate below re-verifies each one
  # against fresh quotes before it actually posts. Flagship-only in practice:
  # only `flagship` has a channel id + enabled:true, and the auto-approve pass
  # skips any account without a configured channel. Note: this is the ONLY lever
  # that clears nightly content_studio signals — auto_approve_kinds is locked to
  # the publish-time mover lane (provenance publisher_live_movers). Set back to
  # false to return to fully-manual approval in the admin Outbox.
  auto_approve: true       # was false; flagship posts autonomously (tape-gated)

  # HOW WIDE THAT FLAG REACHES (Content Studio W1, masterplan §7, 2026-07-29).
  #   kinds — the flag turns the pass ON, but only `auto_approve_kinds` items
  #           from the publish-time lane (provenance publisher_live_movers) may
  #           clear it. The nightly PLANNED kinds (signal, chart, education,
  #           macro, receipt, watchlist, event) go back to the operator's Outbox
  #           and wait for a decision.
  #   all   — the pre-W1 blanket: every kind, every provenance, no human.
  #
  # WHY IT DEFAULTS TO `kinds`. On 2026-07-29 the blanket auto-approved 61
  # persona posts the operator then aborted reviewing at post 15. The
  # descriptive publish-time tape posts (mover / theme_list) are generated
  # seconds before posting from live quotes and re-verified by the live tape
  # gate — those stay automatic. Diary-register copy is a judgment call and
  # earns autonomy per (account, kind) on measured approve rates (XG approve
  # ladder), not by default. Breaking / wire keep their own immediate paths and
  # are unaffected either way.
  #
  # This is the ONE line to flip back to full autonomy. It governs the
  # `--auto-approve` CLI flag too (the flag documents itself as equivalent to
  # `auto_approve`); an unknown value falls back to `kinds` with a warning,
  # because the failure mode of a typo here is publishing unreviewed copy.
  auto_approve_scope: kinds   # kinds | all

  # Global post-time anti-spam floor (cadence masterplan Phase 2): no two posts
  # go out within this many minutes of each other, across ALL accounts — enforced
  # in scripts/marketing_publisher.py (_within_floor), seeded from the last posted
  # ledger row so it holds across cron runs, so an accumulated backlog drains
  # gradually instead of bursting. Distinct from the sentinel's per-account
  # PLAN-time min_minutes_between_posts. 0 = disabled.
  # 10 -> 4 (2026-07-28). Ten minutes GLOBAL is one post per desk per hour
  # across seven accounts, and it was the binding constraint the moment the
  # cron-grid coupling was removed: a sweep with 24 due items posted 2 and
  # logged skipped_floor=18. Bursting is a PER-ACCOUNT risk — one desk firing
  # six posts in a minute is the spam signature; six desks posting once each
  # across four minutes is not — and the per-account bound already exists in
  # cadence_resolver (running in shadow, cadence_shadow=14 that same sweep).
  # 4m keeps a hard anti-burst floor while letting the desks pace themselves:
  # 15/hr network, 2.5/hr per desk. Send-time jitter still scatters each post
  # off the round minute so two desks never land on the same second.
  min_minutes_between_any_posts: 4

  # How far ahead of `now` one sweep may book an item that is inside the floor
  # above (scripts/marketing_publisher.py: _forward_book_horizon_cfg). 0 = off,
  # which restores the old behaviour: the item defers to the NEXT cron sweep.
  #
  # Why it is on (2026-07-28). Deferring made the CRON GRID the throughput unit —
  # one post per sweep, 30 sweeps/day, so 30 posts/day network-wide however many
  # the desks generated. With seven desks producing ~59/day that stranded most of
  # the queue nightly, and any dropped sweep made it worse. Booking forward keeps
  # the spacing identical (the item goes to Buffer customScheduled at the moment
  # the floor clears) and lets the 10-min floor be the real governor: ~6 posts/hr,
  # ~81 across the 4:00 AM–5:30 PM PT window, paced exactly as before.
  #
  # 60, not higher: every item is tape-verified at BOOK time, so this is how
  # stale a booked read may be when it actually sends. Keep it near the live
  # gate's max_quote_age_min (45) — booking the whole day at 09:00 would ship
  # 5 PM posts written against the 09:00 tape.
  max_forward_book_min: 60

  # Send-time jitter, in minutes (scripts/marketing_publisher.py). A LADDER item
  # no longer books at the exact sweep minute: it books at (floor-cleared time +
  # crc32(item_id) % (post_jitter_max_min + 1)) minutes. Fixed cron-sweep minutes
  # are a temporal-regularity bot signature — an account whose posts land at
  # :00/:15/:30 every day reads as scheduled automation, which is the detection
  # class the June 2026 purge leaned on. The offset is derived from the item id,
  # never from a clock or an RNG, so a dry-run and the live run book the SAME
  # minute and no test needs a frozen clock. 0 = disabled (exact sweep minute,
  # the pre-2026-07-27 behaviour), which is also the in-code default. IMMEDIATE /
  # breaking items are NOT jittered — added latency is the one thing breaking
  # cannot afford.
  #
  # THE REAL DISTRIBUTION IS NOT UNIFORM. The Buffer adapter refuses a dueAt that
  # is not comfortably in the future and floors every scheduled post at now+3min
  # (social_publisher._MIN_DUE_LEAD). Offsets 0-3 therefore all land on the same
  # minute, so at max 7 the delivered offsets are {3,3,3,3,4,5,6,7} — HALF the
  # mass sits on the lead minute, and only 5 distinct minutes are reachable. That
  # is still enough to break an exact-minute signature and it is why the number
  # is 7 rather than 3; do not read this knob as "uniform 0..N". Raising
  # _MIN_DUE_LEAD, or raising this value, are the two levers on that shape.
  post_jitter_max_min: 7

  # Chart-card CTA. false = the outbound post card's footer keeps the brand
  # lockup (favicon + mastermind-x.com + tagline) but DROPS the "Start free
  # 14-day trial" button. A trial button burned into every single image is a
  # promotional / content-farm fingerprint (D08 R4) and the flagship is a cold
  # account with no posting history to offset it. The in-code default is true
  # (the legacy card, unchanged for every caller that does not thread this knob);
  # false here is the cold-account reputation posture. Re-enable at operator
  # discretion once the accounts are past the ramp.
  chart_cta_enabled: false

  # Breaking dispatch (cadence masterplan Phase 3, operator re-spec 2026-07-27).
  # An IMMEDIATE item — a fastlane earnings post, an operator "Post now" click, a
  # publish-time mover — now posts NOW, unconditionally: it is exempt from the
  # global floor, the per-account daily cap, and any deferral horizon. (The old
  # immediate_defer_max_minutes booking horizon is retired — breaking is
  # unlimited.) Every SAFETY gate still runs: text validation, the live tape
  # gate, the per-account near-dup repeat gate, the channel-id requirement, and
  # the kill-switch. A posted immediate item still advances the in-memory floor
  # by the 10-min global spacing so the NEXT ladder post budges accordingly.

  # Chart-image attach (D02 image pipeline). When true, content_studio renders a
  # PNG variant of each single-name signal chart at plan-build time, writes it to
  # data/marketing/outbox/media/<as_of>/<chart_id>.png, and (if R2 creds exist on
  # the nightly Mac) uploads it to the public data plane and stamps media_url on
  # the item; the publisher then attaches media_url to the post. X rejects SVG —
  # PNG only. false = never render, never upload, never attach (text-only). The
  # Sentinel max_media_posts_per_account_per_day cap still governs at post time.
  media_enabled: true

  # Scoped exception to require_approval: kinds listed here auto-approve WHEN the
  # item was generated by the publish-time lane (provenance publisher_live_movers).
  # These are descriptive tape posts (no entry advice), generated seconds before
  # posting from live quotes, sentinel-capped and re-verified by the live tape
  # gate. Operator-authored/nightly items of ANY kind still require approval.
  # Empty list = no exception (fully manual).
  auto_approve_kinds: [mover, theme_list]

  # Post-time live tape gate (engine/marketing/live_verify.py). The content
  # plan is written off yesterday's EOD close; posting slots run mid-session
  # the NEXT day. Every item re-verifies against 15-min-delayed live quotes
  # before it may post: adverse-move / underwater / runaway claims quarantine,
  # unverifiable signals hold until the next slot. Values are pct-points vs
  # prior close unless noted.
  live_gate:
    enabled: true
    max_quote_age_min: 45      # older quote = missing during a posting slot
    signal_adverse_pct: -4.0   # same-day move against the signal direction
    chart_adverse_pct: -7.0    # chart/watchlist posts held on a crash day
    receipt_adverse_pct: -5.0  # no report cards while the name bleeds
    underwater_pct: 0.02       # live price through entry (mirror of plan-time)
    runaway_pct: 0.12          # live price past entry = no longer actionable
    move_claim_min_ratio: 0.3  # mover/theme pct claims must keep sign + 30% size
    earnings_guard: true       # never post a signal into the ticker's print day

  # Publish-time mover/theme generation (engine/marketing/publish_time_content.py).
  # mover ("Mover of the Day") + theme_list ("Theme Tape") posts are the ONE family
  # the nightly plan generates but never emits: a "+7% today" claim written at
  # 23:45 ET is stale by the next open. Instead the publisher generates them AT
  # publish time from the freshest tape in that checkout, auto-approves ONLY this
  # scoped lane (see auto_approve_kinds), and lets the live tape gate re-verify.
  # Text-only (no media → never touches the media cap).
  publish_time_movers:
    enabled: true
    max_per_run: 2           # network-wide new items per slot run
    min_abs_mover_pct: 3.0   # floor for a single-name move claim
    min_abs_theme_pct: 1.0   # floor for a theme-average claim
    max_quote_age_min: 45    # generation freshness gate (mirrors live_gate)
    min_active_tiles: 25     # flat-tape belt: skip unless ≥N S&P names moved ±0.5% (closed-market guard)
    # Per-call lane allowlist (XG-W1). This lane picks an account straight from
    # desk_network and builds a mover/theme item — it never consults tilt, so the
    # employee desks' zeroed mover/event weights cannot reach it. The charter
    # already decided employees launch on non-news/tape kinds (§7 sequencing);
    # this is where that decision is ENFORCED for the per-call lanes.
    # Employees launch on the NIGHTLY content_studio lane only (tilt-governed,
    # in-batch variant rotation keeps two desks from twinning).
    # UNLOCK: charter §6 XG-W2 (cadence resolver) + XG-W3 (desk feeds). Widen
    # this list then, not before. Omitting the key falls back to this same pair.
    accounts: [flagship, founder]

  # Publish-time DAILY READ ("My read on today's move", kind=event).
  # SAME root problem as publish_time_movers, one family over: the nightly plan
  # bakes the event post at ~04:00 UTC but schedules it after the close, so it
  # ships a driver read written ~18h stale (two consecutive nights once posted
  # BYTE-IDENTICAL copy). The fix: generate the read AT publish time from the
  # FRESH daily brief (site/neuralwebdata/daily_brief.json refreshes intraday —
  # it carries why_the_tape_moved), on the after-close ladder slot, once/day.
  #
  # DARK BY DEFAULT. `enabled: false` ⇒ behaviour is byte-for-byte unchanged:
  # the nightly still emits the event post and the publisher does nothing new.
  # Nothing auto-posts until the operator arms it. ARMING IS TWO STEPS:
  #   1. set enabled: true here (the nightly then STOPS emitting event so the
  #      publish-time read is the only event post — no double-post), AND
  #   2. add `event` to publish.auto_approve_kinds above (the scoped auto-approve
  #      only approves provenance publisher_live_movers items whose kind is
  #      listed there; without it the read enqueues but waits for manual approval).
  # Eyeball dry-runs (--dry-run) before doing either.
  publish_time_read:
    enabled: false           # DARK by default — operator arms after dry-runs (see above)
    slot: "S8"               # after-close ladder slot the daily read fires on (18:00 PT; once/day)
    # Per-call lane allowlist (XG-W1) — same reasoning as publish_time_movers
    # above: this lane picks accounts straight from desk_network and never reads
    # tilt, so the employee desks' zeroed event weight cannot reach it. Enforces
    # the charter's §7 sequencing decision; unlock is §6 XG-W2 + XG-W3.
    accounts: [flagship, founder]

  # Per-account Buffer channel id. Empty placeholder until a real token exists —
  # discover the X channel id with the buffer-channels workflow (Actions →
  # buffer-channels → Run workflow), or locally:
  #   BUFFER_TOKEN=... python -m scripts.marketing_publisher --list-channels
  channels:
    flagship: "6a61f3d5e2638b94d7bd6c9b"  # @mastermindx001 (twitter)
    founder: "6a67dd714b2d03035f4f9659"   # @w_chris6031 (twitter) — founder's personal account, wired 2026-07-27
    # Employee desks + the news property, discovered by the buffer-channels
    # workflow and bound 2026-07-28 (XG-W1). All seven live Buffer channels are
    # now addressable; a channel id is the POSTING address, not an arming
    # decision — desk_network.enabled is what decides whether an account
    # generates at all, and mastermind_news is deliberately disabled there.
    meagan: "6a681b5e4b2d03035f52d4fc"          # @meagmastermind (twitter)
    sophia: "6a6810824b2d03035f52ac24"          # @sophmastermind (twitter)
    kelly: "6a681b4d4b2d03035f52d3ec"           # @mastermindkelly (twitter)
    cici: "6a6822f94b2d03035f5312a5"            # @mastermindcici (twitter)
    mastermind_news: "6a6823a74b2d03035f53147b" # @mastermindnews1 (twitter) — channel bound, account DARK until the XG-W2 cadence resolver

  # Per-account link policy at POST time. flagship = true: the operator wants
  # links to their own site (mastermind-x.com). This is the publisher-tier gate;
  # the Sentinel plan-tier links_allowed (default false) still governs emission.
  # founder: intentionally absent (= false) — links from a freshly wired account
  # are a named X spam trigger; flip after ~2 weeks like the flagship ramp.
  links_allowed:
    flagship: true

# ─────────────────────────────────────────────────────────────────────────────
# AUTONOMOUS APPROVAL DESK — engine/marketing/approval_desk.py
# Wired into scripts/marketing_publisher.py's sweep, between the publish-time
# generators and the candidate selection.
#
# WHY IT EXISTS. `publish.auto_approve_scope: kinds` above confines the
# auto-approve pass to the publish-time lane, so the nine PLANNED kinds
# (signal, chart, education, macro, receipt, watchlist, event, congress,
# insider) were left to the operator-approve path: the admin UI writes
# data/marketing/outbox/decisions.jsonl and outbox.apply_decisions turns an
# `approve` row into a transition. THAT FILE HAS ZERO ROWS IN REPO HISTORY.
# Every planned post that ever reached X was hand-moved by an agent session,
# and the rest sat queued until a reaper retired them. The desk is the operator
# instruction "closely audit them, then approve them so they go out quickly
# without me" written as a machine gate: six named checks, three verdicts
# (approve / quarantine with the evidence in the note / leave it for a human).
#
# The desk is an ADDITIONAL bar, never a bypass. Everything an approved item
# faced before — the live tape gate, the chart law, near-dup, the voice gates,
# the per-account cap, the spacing floor — still runs at dispatch.
# ─────────────────────────────────────────────────────────────────────────────
approval_desk:
  # SHIPS TRUE. The operator asked for the autonomy explicitly, so this line is
  # the kill switch rather than the arming switch: `false` returns the planned
  # kinds to the (empty) manual-approval path they have been stuck in. A
  # MISSING block also reads as enabled — deleting the key must not silently
  # disarm a desk somebody asked for.
  enabled: true

  # Per-sweep approval ceiling. A trickle valve, not a quality bound: the
  # measured nightly plan is ~218 items across seven desks, and clearing all of
  # them in one sweep hands the dispatch loop a backlog that the daily caps and
  # the 4-minute spacing floor then meter out over DAYS — which lets queue order
  # decide what ships and buries the freshest reads behind the stalest. 40 per
  # sweep against a ~30-sweep day keeps the approved pool near what the lane can
  # actually drain. Overflow is not rejected: it stays `queued` and is re-audited
  # next sweep against fresher evidence.
  max_approvals_per_sweep: 40

  # The kinds the desk polices. `breaking` is absent (it has a working
  # all-gates-passed immediate path and a TTL in minutes); `mover` and
  # `theme_list` are absent (kind-scoped auto-approve already clears them
  # seconds after generation); `wire`, `earnings`, `reply` and `news` lanes own
  # their own admission.
  kinds:
    - signal
    - chart
    - education
    - macro
    - receipt
    - watchlist
    - event
    - congress
    - insider

  # Liveness. Matches outbox._STALE_QUEUED_HOURS (36) on purpose, so the desk's
  # bar and the nightly reaper's bar are ONE number. The desk RUNS
  # outbox.expire_stale_planned at this age (filling the gap that it only ever
  # ran at nightly emit, never during the trading day) and then applies the same
  # bar itself to the planned items that reaper does not cover — chiefly the
  # weekend_levels watchlist lane, which is a planned kind on a real ladder slot
  # and was swept by nobody.
  ttl_hours: 36

  # Per-kind override, only meaningful when STRICTER than ttl_hours above (the
  # reaper has already taken anything older in the covered set). Ships empty:
  # nothing about liveness changes until an operator says a kind perishes faster.
  ttl_hours_by_kind: {}

  # Same-account near-dup bar for the desk's dedup check, against what this
  # account actually POSTED in the last 7 days. Deliberately LOOSER than the
  # publisher's post-time gate (outbox._NEAR_DUP_JACCARD = 0.7), which still
  # runs on everything the desk approves: at 0.85 the desk refuses to bless the
  # obvious repeats, and the tighter gate stays the last word before the network.
  dedup_jaccard: 0.85

  # Max |target / quoted price - 1|, in percent, before a printed target is a
  # hard fail. Every kind the desk polices is SWING-HORIZON (2-4 weeks) — the
  # intraday kinds are all out of scope — so there is no horizon to branch on.
  # Past 35% over that window the number is almost always a chart fact (a
  # 52-week high, a prior cycle peak) that the writer promoted into a price
  # objective. Measured example: "$LPG at 43.91 ... Target 68.41" (+55.8%).
  max_target_move_pct: 35

# ─────────────────────────────────────────────────────────────────────────────
# Cadence resolver (XG-W2) — the PER-ACCOUNT posting law
# engine/marketing/cadence_resolver.py; wired into scripts/marketing_publisher.py
#
# Each account's numbers live in its own spec (config/personas/<id>.yml
# `cadence:` — posts_per_day, min_spacing_min, jitter_min, weekend_shape, and
# the XG-W2 `session` territory clock). This block carries only the knobs that
# are network-wide. An account with no persona spec ABSTAINS: the resolver never
# invents a bound, so nothing regresses for a lane that has no spec behind it.
#
# Doctrine: editorial constitution §13.8 (adaptive cadence). v1 covers the
# config-driven half of that list — time zone, territory, weekend shape, and
# anti-regularity jitter. Market opportunity, topic load, relationship follow-ups
# and output quality need signals that do not exist yet; they arrive with the
# XG-W5 scoring brain through the documented `market_state` seam. Nothing here
# consults an LLM, and the resolver can only refuse, never escalate.
# ─────────────────────────────────────────────────────────────────────────────
cadence_resolver:
  # ARMED 2026-07-28, after the persona cadence blocks were reconciled with the
  # D08 ramp. It landed dark (XG-W2) for a good reason: the specs still carried
  # their W1 declarations — 3-4 posts/day at a 120-180 MINUTE spacing floor —
  # against a ramp that grants 10/day per desk and 20 to the flagship, and the two
  # are ANDed at post time. One cycle of shadow verdicts said exactly that:
  #
  #   flagship posts_per_day=4 posted_today=3 min_spacing_min=120 -> min_spacing
  #   sophia   posts_per_day=3 posted_today=2 min_spacing_min=180 -> min_spacing
  #   founder  posts_per_day=3 posted_today=3                     -> daily_cap
  #
  # Arming on those numbers would have cut the network from 70 posts/day to 20 and
  # made every cap #3904 raised dead config. The specs now sit at or above every
  # ramp tier they will reach, so on a weekday the resolver binds nothing the ramp
  # was not already binding (measured: 70/70 today, 90/90 at the +14d tier).
  #
  # What arming ADDS is the per-account SPACING floor. #3924 removed the 10-minute
  # global floor because it paced seven desks as if they were one; that left only
  # publish.min_minutes_between_any_posts (4 min, network-wide) and NOTHING
  # bounding a single desk's burstiness — which is the shape an automation
  # heuristic actually reads. This is the per-account bound the global floor was
  # wrongly standing in for.
  #
  # It also turns on weekend shaping (weekend_shape below) and Cici's territory
  # clock. The specs moved to `medium` (0.67 -> 13 posts of 20) rather than
  # `light` (0.34 -> 7), which would have fallen under the operator's 10/day floor.
  # Guard: tests/test_marketing_cadence_ramp_coherence.py.
  enabled: true

  # IMMEDIATE / breaking items skip the resolver, honouring the standing
  # operator ruling of 2026-07-27 ("breaking has no limits") that already
  # exempts them from the daily cap and the global 10-minute floor. Surfaced as
  # a key rather than a buried constant: a wire-cadence property (mastermind_news)
  # may well want its breaking flow bounded when it arms, and that must be a
  # config flip, not a code change.
  exempt_immediate: true

  # weekend_shape -> the fraction of posts_per_day an account may spend on a
  # Saturday/Sunday. Charter §8 law: a suggested cadence is a HYPOTHESIS, so
  # these are config, not constants. A shaped weekend THINS an account (the
  # resolved budget floors at 1); it never silences one.
  weekend_factors:
    light: 0.34
    medium: 0.67
    full: 1.0

# ─────────────────────────────────────────────────────────────────────────────
# One conversation, one owner (XG-W2) — engine/marketing/story_lock.py
# Charter §2 amendment 6: a cross-account same-story lock at emission time, a
# hard lock and not an editorial preference. Two of our accounts covering one
# story is a network-linkage tell that the near-dup radar CANNOT catch, because
# two desks writing the same event in two genuine voices do not collide on
# wording. Scope is cross-account only — an account re-drawing its own story is
# a repeat, which is the near-dup guard's job.
# ─────────────────────────────────────────────────────────────────────────────
story_lock:
  enabled: true
  # How long one account owns a story. After the window a second desk may
  # legitimately pick up a developing story with a new angle. A hypothesis like
  # every other cadence number here — grade it when XG-W6 telemetry exists.
  window_minutes: 720   # 12h

# ─────────────────────────────────────────────────────────────────────────────
# Wire routing (XG-W2) — engine/marketing/wire_routing.py
# Which account owns a wire/breaking emission, by breaking_relevance event_class.
# Before XG-W2 this was `_ACCOUNT = "flagship"` hardcoded in press_lane.py, so
# the wire lane could address exactly one of the seven live Buffer channels —
# including never the account whose entire job IS the wire. Routing is config
# now: changing it is an edit here, never a code change.
#
# LIVENESS IS NOT ROUTING. A class routed to an account that is not enabled in
# desk_network falls back to `default` with a ::warning, so intent and reality
# are both visible. mastermind_news is wired-but-dark on purpose; enabling that
# desk is the single flip that arms its routes.
# ─────────────────────────────────────────────────────────────────────────────
wire_routing:
  default: flagship
  classes:
    macro_print: flagship
    policy: flagship
    geopolitical: flagship
    company_news: flagship
    earnings: flagship
    none: flagship
    # When mastermind_news arms, the wire classes that belong to the publication
    # move here — e.g.
    #   macro_print: mastermind_news
    #   company_news: mastermind_news
    # and nothing in engine/ changes.

# ─────────────────────────────────────────────────────────────────────────────
# Desk feeds + franchises + persona memory (XG-W3)
#   engine/marketing/desk_feed.py · franchises.py · persona_memory.py · value_gate.py
#
# Charter §4: every account knows its day. The feed ASSEMBLES candidates from
# four lanes (scheduled franchise slots, breaking, market-hours, analysis) and
# hands them to the existing generation paths. It posts nothing and queues
# nothing — the sentinel, the approve-ladder and the cadence resolver all still
# bind exactly as before.
#
# EVERY NUMBER HERE IS A HYPOTHESIS (charter §8, and the constitution's own §20
# closing instruction: suggested weights and thresholds are to be calibrated,
# never fixed truth). They are config precisely so XG-W6 telemetry can re-rank
# them without a code change, and no weight is load-bearing until it has.
# ─────────────────────────────────────────────────────────────────────────────
desk_feed:
  # Lane base scores. Breaking outranks a scheduled slot because a franchise
  # window is open all session and a print is not (§7.5 "why now?").
  lane_weights:
    breaking: 40
    scheduled: 30
    market_hours: 25
    analysis: 20
  # A franchise slot is a recurring promise to the reader — §8.5's last-nine-post
  # diagnostic wants at least two items from a recognisable franchise.
  franchise_bonus: 6
  # Anti-sameness (§13.7): an over-used n-gram is penalised, not banned.
  fatigue_penalty: 8
  # Chronicle context budget per candidate. Chronicle W1/W2 are UNBUILT; the W0
  # pack() returns narratives: [] by contract, which is the honest empty.
  chronicle_token_budget: 1200

franchises:
