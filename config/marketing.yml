## config/marketing.yml — Marketing lobe configuration
## Drives engine/neuralweb/marketing_governor.py
## Spec §5 (frozen contract).
##
## Mixed-tilt model: every desk posts ALL 7 content types; the tilt
## shifts emphasis so desks feel distinct without being clones.
## signal is the largest weight on every account (min 0.28).
## All weights ≥ 0.03.

positioning:
  category: "Accountable AI market intelligence"
  promise: "Know what changed, why it matters, and what to watch next."
  proof: "Every important conclusion carries evidence, invalidation, timestamp, and outcome history."
  icp: "Self-directed, research-intensive swing/position investors following 10–100 names."
  first_paid_job: "Continuously monitor what matters to my holdings/watchlist and tell me when the causal picture changes."

settings:
  trial_variant: "7_trading_days"      # or 14_calendar_days | value_moment_limited
  desk_network_stage: "A"              # A warm | B assisted | C autonomous
  paid_enabled: false
  auditor_strict: true
  north_star_window_days: 90

departments:
  growth_os:
    lifecycle_state: building
    authority_level: G2
    budget_envelope_usd: 0
  # Optional per-department overrides below.
  # Unspecified departments use coded DEPARTMENT_CHARTERS defaults.
  # Fields: lifecycle_state, authority_level, budget_envelope_usd

desk_network:
  stage: A
  accounts:
    - id: flagship
      kind: branded
      beat: "What changed and why it matters"
      voice: "authoritative desk"
      # Flagship: heavy on signal + macro; the authoritative read
      tilt:
        signal: 0.32
        chart: 0.10
        education: 0.08
        macro: 0.14
        receipt: 0.08
        watchlist: 0.05
        event: 0.05
        mover: 0.10
        theme_list: 0.08

    - id: receipts
      kind: branded
      beat: "Visual evidence + public report card"
      voice: "dry, receipts-forward"
      # Receipts: heavy on receipt + chart; accountability desk
      tilt:
        signal: 0.26
        chart: 0.18
        education: 0.05
        macro: 0.07
        receipt: 0.18
        watchlist: 0.05
        event: 0.05
        mover: 0.08
        theme_list: 0.08

    - id: theme_desk
      kind: branded
      beat: "Rotating high-attention vertical"
      voice: "specialist"
      # Theme: heavy on signal + event + theme_list; follows high-attention moments
      tilt:
        signal: 0.28
        chart: 0.10
        education: 0.08
        macro: 0.08
        receipt: 0.06
        watchlist: 0.05
        event: 0.14
        mover: 0.10
        theme_list: 0.11

    - id: research_a
      kind: generic
      beat: "Macro/rates/liquidity explainers"
      voice: "educational"
      # Research A: heavy on macro + education; the explainer desk
      tilt:
        signal: 0.24
        chart: 0.08
        education: 0.18
        macro: 0.20
        receipt: 0.05
        watchlist: 0.05
        event: 0.03
        mover: 0.10
        theme_list: 0.07

    - id: research_b
      kind: generic
      beat: "Single-stock why-is-it-moving fast desk"
      voice: "fast, reactive"
      # Research B: heavy on signal + mover + theme_list; the Tape Reader reach desk
      tilt:
        signal: 0.30
        chart: 0.16
        education: 0.04
        macro: 0.06
        receipt: 0.06
        watchlist: 0.04
        event: 0.08
        mover: 0.14
        theme_list: 0.12

    - id: research_c
      kind: generic
      beat: "Charts + historical analogues"
      voice: "pattern/history"
      # Research C: heavy on chart + watchlist; pattern and historical context desk
      tilt:
        signal: 0.26
        chart: 0.22
        education: 0.06
        macro: 0.06
        receipt: 0.05
        watchlist: 0.13
        event: 0.05
        mover: 0.10
        theme_list: 0.07

# ─────────────────────────────────────────────────────────────────────────────
# Copywriter — personas + copy laws (the anti-bot-voice system)
# The copywriter (engine/marketing/copywriter.py) reads this block. Personas give
# each desk a real voice; copy laws are hard validation rules every post must
# pass regardless of whether the LLM or the deterministic fallback wrote it.
# ─────────────────────────────────────────────────────────────────────────────
copywriter:
  copy_laws:
    - every post carries at least one concrete, checkable fact (a number, a level, a record, a streak)
    - never repeat a headline or signature phrase across posts in the same plan
    - cashtag on every ticker post; max 275 chars; at most 1 emoji unless the persona budget says 0
    - signal posts carry an invalidation or "what would change this" line and an honesty disclosure
    - never name MACD / RSI / Stochastic / Ichimoku / Bollinger in public copy ("signal stack" is fine; visible chart labels are fine)
    - every numeric claim must come from the provided numbers whitelist — no invented numbers
    - losses are posted as plainly as wins; self-deprecation beats spin
    - no financial-advice phrasing ("buy now", "can't lose", "guaranteed"); no "validated"
  personas:
    flagship:
      name: "The Desk"
      voice_notes: >
        Measured, confident, first-person-plural. Dry wit, never jokey. Leads with
        the sharpest fact, then the read, then what would change our mind. Writes
        like a senior PM talking to smart friends — short declaratives, no filler,
        no exclamation marks. Emoji budget: 0-1 (📌 or 👀 at most, rarely).
      example_lines:
        - "Semis carried the tape again. That's the third time this month the generals led while breadth sat out — we're watching the soldiers."
        - "$X reclaimed the level everyone gave up on in May. Positioning did the rest."
    receipts:
      name: "The Scorekeeper"
      voice_notes: >
        Blunt, numbers-first, zero spin. Posts wins and losses with the same flat
        tone; slightly self-deprecating on losses ("the stop did its job, our ego
        didn't"). Everything resolves to a number. Emoji budget: 1 (🧾).
      example_lines:
        - "🧾 $QCOM, graded: T1 hit +9.6%, runner stopped at 177. Net positive, process held, thesis didn't."
        - "We said below 42 kills it. It closed 41.80. Killed. Next."
    theme_desk:
      name: "The Specialist"
      voice_notes: >
        Sector nerd energy. Connects one stock's move to the bigger theme in one
        breath, exactly one sharp opinion per post. Fluent, quick, occasionally
        spicy but never sloppy. Emoji budget: 1.
      example_lines:
        - "Utilities don't rip 3% on nothing. Data-center power demand is the story nobody's pricing past next quarter."
    research_a:
      name: "The Professor"
      voice_notes: >
        Explains like the best teacher you had — plain words, a rhetorical question,
        then the answer. Patient, zero hype, quietly funny. Loves "here's the part
        most people miss." Emoji budget: 0.
      example_lines:
        - "Why does the market care about the 200-week average? Because everyone believes everyone else does. That's the whole trick — and $X just tested it."
    research_b:
      name: "The Tape Reader"
      voice_notes: >
        Fast, clipped, present-tense. Reads the tape out loud. Short lines, line
        breaks, asks the audience one question. Emoji budget: 1 (👀 or 🔥).
      example_lines:
        - "$X up 4% on 3x volume. Sellers had every excuse today and didn't show. 👀"
        - "Biggest weekly volume since March. Someone knows something or someone's wrong. Which is it?"
    research_c:
      name: "The Historian"
      voice_notes: >
        Everything rhymes with something. Calm, patient, loves "last time this
        happened" and dated precedents. Never predicts loudly — points at the
        precedent and lets it talk. Emoji budget: 0-1.
      example_lines:
        - "Last time $X put in back-to-back weeks like this was Oct 2022. That one went 60% in six months. Rhyme, not repeat — but worth a look."
  llm:
    enabled: true            # nightly copy generation; deterministic fallback if unavailable
    model_key: "marketing_copy"   # resolved via config.yml llm_models block; sonnet-class
    max_posts_per_run: 60
    daily_token_cap: 300000

# ─────────────────────────────────────────────────────────────────────────────
# Breaking news ingestion (D05 W0)
# engine/marketing/breaking_feed.py reads `breaking.sources`
# engine/marketing/breaking_relevance.py reads `breaking.salience_threshold`
# engine/marketing/breaking_summary.py reads `breaking.llm`
# ─────────────────────────────────────────────────────────────────────────────
breaking:
  poll_interval_s: 300
  user_agent: "MastermindBreakingBot/1.0 (+https://mastermind-x.com)"
  salience_threshold: 60
  sources:
    - key: fed_press
      kind: rss
      url: "https://www.federalreserve.gov/feeds/press_all.xml"
      source_name: "Federal Reserve"
      tier: official

    - key: bls_news
      kind: rss
      url: "https://www.bls.gov/feed/news_release.rss"
      source_name: "Bureau of Labor Statistics"
      tier: official

    - key: bea_news
      kind: rss
      url: "https://apps.bea.gov/rss/rss.xml"
      source_name: "Bureau of Economic Analysis"
      tier: official

    - key: whitehouse_actions
      kind: rss
      url: "https://www.whitehouse.gov/presidential-actions/feed/"
      source_name: "White House"
      tier: official

    - key: cnbc_top
      kind: rss
      url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"
      source_name: "CNBC"
      tier: wire

    - key: marketwatch_top
      kind: rss
      url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"
      source_name: "MarketWatch"
      tier: wire

  llm:
    enabled: true
    model_key: "marketing_copy"
    max_tokens: 800
