    kind: llm_oauth
    secret_ref: CLAUDE_CODE_OAUTH_TOKEN
    scope: >
      Anthropic Claude API access via OAuth token.  Used by whitehouse-sentinel,
      asia-close, cortex, and future metabolism PROPOSE/ADJUDICATE stages.
    storage_locus: gh-secret
    allowed_lanes:
      - whitehouse-sentinel
      - asia-close
      - metabolism-propose     # Phase A — not yet armed
      - metabolism-adjudicate  # Phase A — not yet armed
      - metabolism-agenda
      - metabolism-attention
      - metabolism-dream
      - metabolism-audit
      - metabolism-shadow
      - metabolism-standout
      - cortex
      - whitehouse
      - causal-brainstorm
      - signal-foundry
      - extraction-drift
      - commodity-news
      - risk-brain
      - risk-radar-review
      - influence-extract
      - narrative-brain
      - altdata-brain
      - news-llm
      - ask-brain
      - orchestrator-chat
      - brain-fast       # MNZ-W6a: haiku fallback for fast lane when DeepSeek absent
      - brain-pro        # MNZ-W6a: opus/sonnet pro lane
      # ── Marketing content lanes (operator directive 2026-07-29) ──────────
      # ChatGPT-first: the marketing writing lanes default to the attached Codex
      # account so Claude subscription tokens stay reserved for website-building
      # sessions. Tier map: Sol writes (copywriter, breaking, copy review,
      # weekend levels ride the copywriter lane), Terra critiques and wires
      # (critic, hot-tape wire, reply voice). Luna is never routed user-facing
      # words. Config: config/marketing.yml copywriter.llm (+ .critic),
      # breaking.llm, reply_desk.voice and config.yml hot_tape.llm.
      - marketing-copywriter     # Sol
      - marketing-breaking       # Sol
      - marketing-copy-review    # Sol
      - marketing-critic         # Terra
      - hot-tape-wire            # Terra
      - reply-voice              # Terra
    allowed_tiers:
      - T0
      - T1
      - T2
    rotation_state: active
    kill_state: active
    notes: >
      Already a GH secret (confirmed by whitehouse-sentinel.yml usage).
      A2 preflight gate (Phase A) pings cheapest tier to verify health before
      any build stage is allowed to proceed.

