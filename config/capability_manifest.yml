  - capability_id: vps_deploy_key
    kind: vps_deploy
    secret_ref: VPS_DEPLOY_KEY
    scope: >
      SSH private key for deploying rendered site artifacts to the live VPS.
      Used by render.yml and engine-render.yml deploy steps.
    storage_locus: gh-secret
    allowed_lanes:
      - render
      - engine-render
    allowed_tiers:
      - T0
      - T1
    rotation_state: active
    kill_state: active
    notes: >
      Loop stages may NEVER use this capability (R-AUT-12: no VPS shell for the loop).
      Changes to the live site reach VPS only through the render tail, never a
      loop-direct shell command.

