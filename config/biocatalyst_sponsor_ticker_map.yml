# BioCatalyst W3-C — sponsor -> ticker REVIEWED map.
#
# A bounded, curated, PR-reviewed lookup from a ClinicalTrials.gov
# `leadSponsor.name` string to one ticker inside the declared healthcare basket
# universe.  It is NOT a general point-in-time identity service and it is NOT an
# inferred join.
#
# EVERY LINK IN THIS FILE WAS SUGGESTED BY A MODEL.  33 of them were ADMITTED by
# the repository operator under the named ruling recorded in `operator_ruling`
# below — 29 on 2026-08-07 (Ruling 2) and four more on 2026-08-08 (Ruling 3) —
# and those 33 resolve.  A model still cannot admit its own suggestion: an
# admitted row must carry an operator attestation — a named human reviewer, a
# timestamp, and the ruling document bound by content digest — and
# tests/test_biocatalyst_sponsor_ticker_map.py fails on any admitted row
# without one.  A model cannot manufacture attributed human authority, so the
# fence is "nothing may be admitted WITHOUT attributed human authority" rather
# than the weaker "nothing may be admitted".
#
# Admission is NOT source verification.  Each admitted row keeps its
# `model_suggested_candidate` provenance and its "Unverified against a live
# ClinicalTrials.gov record" note, because that is what is true: the operator
# authorized the admission, not a per-row check against a live record.
#
# THE TICKER IS NOT ALWAYS THE SPONSOR.  Every admitted row declares
# `issuer_relationship`: `direct_issuer` means the sponsor string IS the listed
# issuer; `parent_of_subsidiary_sponsor` means the sponsor string is a
# SUBSIDIARY and the ticker is its PARENT.  Ruling 3 admitted the four
# subsidiary rows — Cepheid to DHR, Genentech to RHHBY, Janssen R&D to JNJ,
# Merck Sharp & Dohme to MRK — which is a modelling choice with a visible
# consequence: a Genentech trial surfaces under Roche.  A reader must be able to
# tell that apart from a trial the issuer sponsored itself, so the row says so.
#
# THE REMAINING 16 `ambiguous_queued` ROWS STAY QUEUED.  Neither a blanket
# authorization nor Ruling 3's narrow group answers a renamed-entity,
# joint-venture, CRO, or outside-the-universe question; each of those needs a
# per-case answer and remains a standing operator to-do.
#
# Ambiguity is queued, never guessed.  A sponsor that matches several issuers,
# is an operating subsidiary, is a joint venture, was renamed, or sits outside
# the declared universe carries `ambiguous_queued` with its competing candidates
# recorded for the reviewer.
#
# Every link carries an effective interval, so a later rename, spin-off, or
# ticker reuse opens a NEW interval instead of rewriting what the map said
# before.  Because these rows are model-suggested they may not be back-dated:
# `valid_from` is the day the candidate was asserted, not a claim about history.
#
# This exists for post-selection context only — explaining a name AFTER Prophet
# selects it.  It may never originate, rank, reorder, size, or gate a candidate,
# and it is wired to no scoring path, no Prophet path, and no Neural Web path.
#
# `contract_id` registers the document with ContractRegistry; `schema` mirrors
# the first-line idiom of the sibling BioCatalyst config files.

contract_id: biocatalyst_sponsor_ticker_map.v1
schema: biocatalyst_sponsor_ticker_map.v1
schema_version: "1.0.0"
map_version: w3c.3
effective_at: "2026-08-07T00:00:00Z"
owner: biocatalyst
state: reviewed_map_contains_admitted_rows
authority: facts_and_context_only
authority_ceiling: A1_EXPLAIN
purpose: post_selection_context_only

# The named human authority every admitted row attests to.  `sha256` binds the
# exact bytes of the ruling: if the document changes, the admissions no longer
# carry the authorization they claim, and validation fails closed.
operator_ruling:
  reference: research/BIOCATALYST_OPERATOR_RULING_2026-08-07.md
  sha256: 6d6fe5771b70a2c3f6eacab4b2b1bb270331a1bc8c121064293905846d98a530
  ruled_at: "2026-08-07T00:00:00Z"
  authorizing_operator: "Repository operator (chriswong6031-creator)"
  instruction: "yes for both, do for me"
  scope: "Ruling 2 (2026-08-07) admits the 29 candidate rows. Ruling 3 (2026-08-08) admits the four subsidiary_of_listed_issuer rows to their listed parents. The remaining 16 ambiguous rows stay queued."

# Derived from data/baskets/membership.json at validation time, never hardcoded.
universe:
  source_file: data/baskets/membership.json
  baskets:
    - big_pharma
    - managed_care
    - obesity_glp1
    - us_sector_health
  distinct_ticker_count: 70
  derivation: union_of_declared_basket_members_read_at_validation_time

review_policy:
  admission_authority: named_human_pull_request_review_only
  model_may_admit: false
  default_review_state: candidate_unreviewed
  resolvable_review_states:
    - reviewed_admitted
  unresolved_row_behavior: return_unavailable_with_reason_never_a_guess

interval_semantics:
  kind: candidate_assertion_window_not_historical_claim
  valid_to_null_meaning: open_ended_until_a_reviewer_closes_it
  model_suggested_backdating: forbidden_valid_from_is_at_or_after_effective_at

prohibited_uses:
  - originate_signal
  - rank_security
  - reorder_candidate
  - select_security
  - size_position
  - gate_decision
  - score
  - prophet_authority
  - neural_web_authority
  - alerts
  - public_projection
  - fuzzy_name_matching

