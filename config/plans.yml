# config/plans.yml — monetization catalog (MNZ-R12: prices/tiers ship as config, never literals).
#
# Single source of truth consumed by:
#   scripts/stripe_bootstrap.py  — creates the matching Stripe products / prices / entitlement features
#   app/billing.py               — maps (tier, interval) -> price lookup_key, and price/product -> tier + features
#   templates/plans.html.j2      — renders the pricing table + computed savings badges (baked at build time)
#
# Amounts are integer minor units of `currency` (USD cents). `annual.unit_amount` is the FULL yearly
# charge; the per-month-equivalent shown on the plans page is DERIVED (annual/12), never stored.
#
# Price lookup keys are versioned so a rack-price change never steals the lookup key from an older
# Price. Stripe Prices are immutable and existing subscriptions must remain grandfathered. The
# `legacy_lookup_keys` list keeps those subscriptions mapped to the correct entitlement tier.
schema: plans_catalog.v1
currency: usd

# Entitlement features (Stripe Entitlements, GA). `key` is the Stripe feature lookup_key + the value
# mirrored into user_entitlements.features[]. These gate real surfaces:
#   site_full             -> the premium HTML/JSON wall (W3)
#   terminal_live_options -> the Terminal live-options surface (Terminal repo; paid + trialing)
#   chat_opus             -> the Mastermind Pro (Opus) chat lane
features:
  - key: site_full
    name: Full site access
  - key: terminal_live_options
    name: Terminal live options
  - key: chat_opus
    name: Mastermind Pro chat (Opus)

# Display contract for the Terminal indicator library. The Terminal gates advanced
# modules directly from the account tier (free < insider < pro); this block lets the
# two pricing surfaces describe that same cumulative access without inventing counts.
# Keep it aligned with terminal/lib/suites/* module definitions and IndicatorsModal.
terminal_indicators:
  core_count: 21
  advanced_total: 31
  access:
    free: 1
    insider: 15
    pro: 31

# Paid products. `tier` is the string written to user_entitlements.tier and read by
# brain_gateway._resolve_tier (must match config/brain.yml quota keys: insider | pro).
products:
  insider:
    tier: insider
    # Display name only — the `insider` key, `tier: insider`, the lookup keys and every
    # entitlement string are unchanged (a rename migration owns those separately).
    name: Essential
    # No trial (operator 2026-07-31): the funnel puts everyone who wants to try the
    # product into Pro's 7 days; Essential is a deliberate manual choice, bought outright.
    # 0 means app/billing.py OMITS trial_period_days rather than sending a zero — Stripe
    # Checkout rejects trial_period_days below 1, so "no trial" must be an absent field.
    trial_days: 0
    features: [site_full, terminal_live_options]
    legacy_lookup_keys:
      - insider_monthly
      - insider_annual
      - insider_2026_monthly
      - insider_2026_annual
    prices:
      monthly: { lookup_key: insider_2026_v2_monthly, unit_amount: 9900,  interval: month }
      annual:  { lookup_key: insider_2026_v2_annual,  unit_amount: 90000, interval: year }
  pro:
    tier: pro
    name: Pro
    trial_days: 7
    features: [site_full, terminal_live_options, chat_opus]
    legacy_lookup_keys:
      - pro_monthly
      - pro_annual
      - pro_2026_monthly
      - pro_2026_annual
    prices:
      monthly: { lookup_key: pro_2026_v2_monthly, unit_amount: 14900,  interval: month }
      annual:  { lookup_key: pro_2026_v2_annual,  unit_amount: 130800, interval: year }

# Founding Pro is a limited offer on the annual Pro product, not a fourth entitlement tier.
# The checkout paths automatically apply this Stripe promotion while it is active. The Promotion
# Code owns the atomic cap for first-time founders. Its underlying uncapped Coupon is used only by
# the backend for customers who already hold the durable Stripe Customer entitlement, allowing
# them to pause, cancel, expire, and later resume at the same grandfathered rate without consuming
# a second founding membership.
offers:
  founding_pro:
    name: Founding Pro
    tier: pro
    interval: annual
    unit_amount: 90000
    # Preserve the exact $900 founder total even after future regular Pro price increases.
    base_lookup_key: pro_2026_v2_annual
    base_unit_amount: 130800
    max_redemptions: 2000
    public_count_threshold: 25
    entitlement_metadata_key: mm_founding_pro_entitled
    coupon_id: mastermind_founding_pro_annual_2026_v2
    promotion_code: FOUNDINGPRO2026V2
    retire_promotion_codes: [FOUNDINGPRO2026]
    duration: forever
    # Scheduled withdrawal of the founding allotment (operator, 2026-07-27). A reserved
    # pool — memberships pulled from public sale — starts at `baseline_unavailable` minus
    # whatever was already redeemed, then grows by `daily_step` on every day with zero new
    # redemptions (a day's real redemptions replace that day's step). app/billing.py both
    # PUBLISHES the shrunken availability and ENFORCES it at checkout, so the public
    # "N of cap still available" claim is literally true. Ledger: founding_allotment.json
    # under MACRO_API_STATE_DIR. Deleting the ledger re-seeds deterministically as if every
    # elapsed day since baseline had been quiet.
    allotment_pacing:
      baseline_date: 2026-07-27
      baseline_unavailable: 244
      daily_step: 2
      timezone: America/New_York

# Entitlement precedence — if a customer ever holds overlapping active subscriptions, the
# highest-ranked tier wins. Also the display order (low -> high) on the plans page.
tier_rank: [free, insider, pro]
