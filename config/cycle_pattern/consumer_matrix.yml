# CPI Consumer Matrix
# ======================================================
# Defines which pipeline surfaces are ALLOWED or FORBIDDEN to consume each
# class of cycle-pattern artifact.  Enforced by
# scripts/check_cycle_pattern_authority.py (hard CI gate, literal-path reader
# scan) AND by engine/cycle_pattern/consumer_authority.py (the single
# canonical consumer-vocabulary validator, reused by both
# engine/cycle_pattern/truths.py's validate_truth() at write time and by
# check_cycle_pattern_authority.py at CI scan time — CPI-H1 ruling 11).
#
# Artifact classes mirror the truth status enum in the truth registry
# (engine/cycle_pattern/truths.py) plus two structural classes for lake
# and candidate artifacts, and explicit retired/superseded classes
# (CPI-H1 ruling 7 — previously undefined; see IMCE_A2_CPI_TRUTH_VOCABULARY_
# AUDIT_V1.md §3 nit).
#
# THIS FILE IS THE SINGLE CANONICAL REGISTRY of allowed_consumers /
# forbidden_consumers vocabulary for the CPI truth registry (CPI-H1 ruling 1,
# research/imce/IMCE_A2_CPI_TRUTH_VOCABULARY_AUDIT_V1.md). Prior to CPI-H1 two
# disagreeing vocabularies coexisted (this matrix's `surfaces:` section vs.
# config/cycle_pattern/truth_schema.md's prose "Consumer categories" list) —
# 17 of 29 registry rows used the schema-doc's now-canonicalized aliases
# (measurement_surface, honesty_display) undetected, because no code path
# checked token identity (A2 F3/F4). truth_schema.md now documents this
# authority rather than maintaining a second list. Any new consumer surface
# MUST be added here first — the token is not valid anywhere else until it is.
#
# Design principles:
#   - Allowed/forbidden lists are DISJOINT (a surface cannot appear in both).
#   - A surface not listed in either list is an IMPLICIT WARN (not a hard fail)
#     for non-scored artifact classes; it IS a hard fail for scored artifacts.
#   - The "scored" class has the most restricted allowed list: only surfaces
#     that have passed the explicit authority-grant check may consume it.
#   - Lake artifacts (parquet data files) have a wide allowlist; only the
#     money-path surfaces are explicitly forbidden.
#   - EVERY truth row's forbidden_consumers must carry all four money_path
#     tokens below, regardless of status/effect_class (CPI-H1 ruling 5) —
#     HARD-enforced by engine/cycle_pattern/consumer_authority.py
#     (validate_consumer_vocabulary raises).
#   - allowed_consumers may NEVER contain a money_path token, and
#     allowed_consumers/forbidden_consumers may never overlap on any token —
#     both HARD-enforced by the same module (Fable adjudication, 2026-08-21).
#   - Row allowlists are LEAST-PRIVILEGE subsets of their status class — a
#     row is never mechanically widened just because its class could permit
#     a surface (CPI-H1 ruling 8). This is a NORMATIVE CONVENTION with
#     ADVISORY tooling only (Fable adjudication, 2026-08-21): per-status
#     `allowed_consumers` below were never widened to include every narrow
#     display token some pre-existing rows legitimately use (e.g. CPI-008's
#     `sync_gauge_display` on a `promoted_null` row), so
#     engine/cycle_pattern/consumer_authority.py reports class-subset
#     mismatches as a non-fatal WARN
#     (`advisory_class_subset_violations()`), never a hard fail — hard-failing
#     would either wrongly reject pre-existing rows or force an unreviewed
#     vocabulary-governance call this module has no authority to make. The 7
#     known violations as of the CPI-H1 heal are escalated to Sol in
#     research/imce/IMCE_D1C_RELEASE_RECORD.md, not resolved here.
#
# Schema version: v0  (2026-07-06; CPI-H1 heal 2026-08-21)
# Owner: cycle-intelligence

schema_version: "v0"
owner_program: "cycle-intelligence"
created: "2026-07-06"

# ── Surface name registry ─────────────────────────────────────────────────────
# Canonical names used throughout this file — the ONLY tokens permitted in any
# truth row's allowed_consumers/forbidden_consumers
# (engine/cycle_pattern/consumer_authority.py rejects any other token as an
# orphan, with a specific "retired alias" message for the tokens named in the
# CPI-H1 heal). Adding a surface here does NOT grant access — surfaces must
# also appear in the allowed_consumers list of the relevant artifact class to
# be usable by a specific status.
surfaces:
  # Money-path surfaces (scored authority; any read of a restricted artifact
  # by these surfaces is a HARD CI failure regardless of allowlist). Every
  # truth row's forbidden_consumers must carry all four (CPI-H1 ruling 5) —
  # this is the "universal money-path floor" referenced throughout this file.
  money_path:
    - board_rank
    - oracle_escalation
    - sector_central_direction_score
    - position_sizing

  # Display, measurement, and research/documentation surfaces (allowed to
  # cite display/confirmer truths per their status class). measurement_page
  # and cycle_docs are the canonicalized targets of the retired
  # measurement_surface/honesty_display aliases (CPI-H1 ruling 2); the
  # remaining names were previously documented only in truth_schema.md's
  # prose list and are folded in here so this file is complete (ruling 1).
  display:
    - measurement_page
    - cycle_docs
    - neuralweb_context
    - hazard_cone_display
    - risk_context_strip
    - tripwire_context
    - sync_gauge_display
    - cone_rendering
    - mechanism_summary
    - hypothesis_generation
    - monitoring

  # Research / factory surfaces
  research:
    - research_factory

  # Narrow/contextual forbidden tokens — row- or class-specific, NOT part of
  # the universal four-token money-path floor above (CPI-H1 ruling 5 /
  # A2 F7: this is the "money-path-four" reading of truth_schema.md's
  # forbidden-token requirement — these three remain row-level, not
  # universally required).
  narrow_forbidden:
    - lead_lag_interaction_layer
    - ladder_calibration_input
    - high_authority_truth_evidence

# ── Retired aliases (CPI-H1 heal; DO NOT reintroduce) ─────────────────────────
# Tokens formerly written by one or more scripts before the vocabulary was
# reconciled (research/imce/IMCE_A2_CPI_TRUTH_VOCABULARY_AUDIT_V1.md §1/§5/
# §8a). engine/cycle_pattern/consumer_authority.py rejects every one of these
# with a specific message; listed here for documentation only — this is NOT a
# second live vocabulary. Canonicalized aliases map to their replacement;
# retired-outright tokens map to null (no established pipeline surface named
# this — A2 F1, CPI-H1 ruling 4; any real future surface needs its own
# reviewed registration above, and any underlying research restriction
# belongs in the truth's falsifiers/notes prose, not a forbidden_consumers
# token).
retired_aliases:
  measurement_surface: measurement_page
  honesty_display: cycle_docs
  research_factory_intake: research_factory
  display_descriptive: cycle_docs
  display: null            # CPI-016's private vocabulary — retired to the
  display_only: null       # ordinary promoted_null contract (ruling 3)
  forward_allocation: null       # not an established pipeline surface (ruling 4)
  signal_generation: null        # not an established pipeline surface (ruling 4)
  hazard_score_design: null      # not an established pipeline surface (ruling 4)
  hazard_baseline_override: null # latent, never-fired code token — retired
                                  # before the branch that would have minted
                                  # it ever fires (A2 F1, ruling 4)


# ── Artifact classes ──────────────────────────────────────────────────────────

artifact_classes:

  # ── promoted_null ─────────────────────────────────────────────────────────
  # An adjudicated null truth: actively displayed as an honest null.
  # The null actively guards against re-belief; money-path surfaces must never
  # cite it as a positive signal.
  - class: promoted_null
    description: >
      Adjudicated null truth (status=promoted_null in truths.jsonl).
      Displayed as honest null on measurement and documentation surfaces.
      Must NEVER reach board_rank, oracle_escalation,
      sector_central_direction_score, or position_sizing — those surfaces
      cannot use a null as a positive gate input.
    allowed_consumers:
      - measurement_page      # measurement.html Null Library section
      - cycle_docs            # cycle documentation surfaces (honest display)
      - research_factory      # factory lifecycle / candidate dedup context
    forbidden_consumers:
      - board_rank
      - oracle_escalation
      - sector_central_direction_score
      - position_sizing
      - neuralweb_context     # NW lobe may not cite nulls as positive context

  # ── display ───────────────────────────────────────────────────────────────
  # Approved for measurement and documentation surfaces; not yet a confirmed
  # gate input.  Risk-only truths (CPI-002, CPI-004, CPI-005) are display class.
  - class: display
    description: >
      Truth approved for measurement surfaces and honest risk-context display
      (status=display in truths.jsonl).  May appear in NW cycle-pattern lobe
      as a context signal (never as a score).  Must not feed board_rank,
      oracle_escalation, sector_central_direction_score, or position_sizing
      without passing an explicit DL-1/DL-2 gate.
    allowed_consumers:
      - measurement_page
      - cycle_docs
      - research_factory
      - neuralweb_context     # cycle-pattern lobe (context only, not scored)
    forbidden_consumers:
      - board_rank
      - oracle_escalation
      - sector_central_direction_score
      - position_sizing

  # ── confirmer ─────────────────────────────────────────────────────────────
  # Used as a confirming gate in a pipeline; still not a direct score input.
  - class: confirmer
    description: >
      Truth used as a confirming gate (status=confirmer in truths.jsonl).
      May feed confirmer-gated pipeline steps but not direct rank/sizing.
    allowed_consumers:
      - measurement_page
      - cycle_docs
      - research_factory
      - neuralweb_context
    forbidden_consumers:
      - board_rank
      - oracle_escalation
      - sector_central_direction_score
      - position_sizing

  # ── scored ────────────────────────────────────────────────────────────────
  # Passed a pre-registered gate with a machine-readable gate artifact.
  # Most restricted class: only explicitly authorized surfaces.
  # Note: no current CPI truth has reached scored status (2026-07-06).
  # This class entry is forward-declared so the harness can enforce it
  # before any truth reaches scored status.
  - class: scored
    description: >
      Truth that passed a pre-registered gate (status=scored; gate artifact
      required in evidence_refs).  May reach constrained pipeline consumers
      only after an explicit DL-1/DL-2 authority grant is recorded in the
      truth registry.  Any surface not in allowed_consumers is a HARD fail.
    allowed_consumers:
      - measurement_page
      - cycle_docs
      - research_factory
      - neuralweb_context     # context-only even for scored truths
    forbidden_consumers:
      - board_rank            # requires DL-1 explicit gate — not yet granted
      - oracle_escalation     # requires explicit grant
      - sector_central_direction_score  # requires explicit grant
      - position_sizing       # requires DL-1 + DL-2 gates — not yet granted
    notes: >
      When a truth passes DL-1, its entry in truths.jsonl must be updated to
      add the relevant money-path surface to allowed_consumers via a
      human_review-driven transition_truth() call, which appends a NEW
      versioned row (append-only — the old row is never mutated).
      CORRECTION (CPI-H1, A2 finding F3): the authority check's ORIGINAL
      literal-path reader-module scan (scripts/check_cycle_pattern_
      authority.py's scan()) does NOT re-read truths.jsonl at scan time — it
      has no knowledge of this file's content, only of which Python modules
      contain the literal string "data/cycle_pattern/". CPI-H1 added a
      SECOND, additive check to the same script — scan_registry_vocabulary()
      — that DOES open and parse truths.jsonl directly, validating every
      truth_id's latest version against this matrix via
      engine/cycle_pattern/consumer_authority.py. So: the literal-path scan
      still never reads this file; the registry-vocabulary scan does, every
      CI run, not just at DL-1 time. Consumer-vocabulary content, including
      this expansion rule, is enforced at both truth-write time
      (validate_truth()) and CI scan time via the same module (CPI-H1 ruling
      11/12). No surface may self-add itself — only an explicit human_review
      transition may expand the allowed list for scored truths.

  # ── candidates ────────────────────────────────────────────────────────────
  # Proposed / registered / screened candidates in the Research Factory;
  # not yet adjudicated truths.  Wide allowlist; money-path surfaces forbidden.
  - class: candidates
    description: >
      Research Factory candidate artifacts (data/cycle_pattern/ files read
      during the candidate lifecycle: lake, trial outputs, screened parquets).
      Engine and builder scripts may read freely; money-path surfaces are
      forbidden because candidates have not passed the frozen gates.
    allowed_consumers:
      - measurement_page      # candidate counts / trial status display
      - cycle_docs
      - research_factory
    forbidden_consumers:
      - board_rank
      - oracle_escalation
      - sector_central_direction_score
      - position_sizing
      - neuralweb_context     # NW lobe must not consume unvetted candidates

  # ── lake_artifacts ────────────────────────────────────────────────────────
  # Infrastructure parquet / JSON files in data/cycle_pattern/ that feed the
  # feature lake, state panel, outcomes spine, and entity map.  These are
  # read by builder scripts, engine modules, and tests — not by money-path
  # surfaces.
  - class: lake_artifacts
    description: >
      Core infrastructure artifacts: entities.parquet, state_monthly.parquet,
      state_monthly_meta.json, outcomes.parquet, state_daily_live.parquet.
      Wide read access for builders and engine; forbidden from direct
      consumption by money-path surfaces (they must go through scored truths
      or an explicitly gated adapter).
    allowed_consumers:
      - measurement_page
      - cycle_docs
      - research_factory
      - neuralweb_context     # cycle-pattern lobe adapter reads state summary
    forbidden_consumers:
      - board_rank
      - oracle_escalation
      - sector_central_direction_score
      - position_sizing
    notes: >
      The NW lobe reads a COMPACT SUMMARY (cycle_pattern_state.json), not
      the raw lake files.  Direct reads of data/cycle_pattern/*.parquet by
      NW cortex modules are a WARN-level finding (not HARD) unless the module
      is also in the money-path set.

  # ── retired ───────────────────────────────────────────────────────────────
  # No longer active (status=retired in truths.jsonl); excluded from
  # active_truths(). Previously undefined in this file — CPI-H1 ruling 7
  # (A2 §3 nit: retired/superseded answered to no artifact_classes entry).
  - class: retired
    description: >
      Retired truth (status=retired in truths.jsonl). Excluded from
      active_truths(). Memory is preserved for provenance per
      truth_schema.md's append-only design principle, but a retired truth
      must never feed board_rank, oracle_escalation,
      sector_central_direction_score, or position_sizing, and must not be
      cited by the NW lobe as live context — it is historical record only.
    allowed_consumers:
      - cycle_docs            # historical record / provenance display
      - research_factory      # factory lifecycle audit trail
    forbidden_consumers:
      - board_rank
      - oracle_escalation
      - sector_central_direction_score
      - position_sizing
      - neuralweb_context      # retired truths are not live NW context

  # ── superseded ────────────────────────────────────────────────────────────
  # Replaced by a newer truth (status=superseded in truths.jsonl); same
  # posture as retired. Previously undefined in this file — CPI-H1 ruling 7.
  - class: superseded
    description: >
      Superseded truth (status=superseded in truths.jsonl). Excluded from
      active_truths(). Same posture as retired: memory preserved for
      provenance, never a money-path or live NW-context input.
    allowed_consumers:
      - cycle_docs
      - research_factory
    forbidden_consumers:
      - board_rank
      - oracle_escalation
      - sector_central_direction_score
      - position_sizing
      - neuralweb_context
