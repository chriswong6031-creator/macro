schema: fundamental_forensics.metric_catalog/v1
catalog_id: fundamental_forensics_core_gaap_metrics
catalog_version: 1.0.0
available_at: "2026-08-02T00:00:00Z"
content_sha256: 0271e126568f2a9cd6f29f4fe0a1d8d0e66ff757ec18223b6dc9bc6bb7d80bad

duration_consolidated: &duration_consolidated
  period_constraints:
    kind: duration
    allowed_forms: [10-K, 10-K/A, 10-Q, 10-Q/A]
    min_duration_days: 1
    max_duration_days: 400
  dimensional_profile:
    mode: consolidated_only
    allowed_axes: []
    require_dimensions: false
    allow_member_selection: false

instant_consolidated: &instant_consolidated
  period_constraints:
    kind: instant
    allowed_forms: [10-K, 10-K/A, 10-Q, 10-Q/A]
  dimensional_profile:
    mode: consolidated_only
    allowed_axes: []
    require_dimensions: false
    allow_member_selection: false

income_statement: &income_statement
  presentation_constraints:
    statement: income_statement
    sign_convention: as_reported
    display_scale: native
    comparability: same_unit_same_period

cash_flow_statement: &cash_flow_statement
  presentation_constraints:
    statement: cash_flow_statement
    sign_convention: as_reported
    display_scale: native
    comparability: same_unit_same_period

balance_sheet: &balance_sheet
  presentation_constraints:
    statement: balance_sheet
    sign_convention: as_reported
    display_scale: native
    comparability: same_unit_same_period

derived_presentation: &derived_presentation
  presentation_constraints:
    statement: derived
    sign_convention: formula_defined
    display_scale: native
    comparability: same_unit_same_period

direct_review: &direct_review
  review:
    required: false
    triggers: [alias_disagreement, unexpected_unit, unexpected_dimension]
  no_result:
    mode: withhold
    codes: [missing_standard_fact, outside_period_constraint, disallowed_dimension]

derived_review: &derived_review
  review:
    required: true
    triggers: [missing_dependency, dependency_unit_mismatch, dependency_period_mismatch]
  no_result:
    mode: withhold
    codes: [missing_dependency, incompatible_dependencies, division_by_zero]

