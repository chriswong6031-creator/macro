      Platinum-group-metals producer sleeve (created 2026-08-07), the third
      precious-metals leg beside gold_miners and silver_miners. Same standing as
      both — an industrial/autocatalyst-driven metal cycle covered by cross-market
      narrative rotation, not a canonical foresight theme.

  - id: mag7
    reason: >
      Mega-cap tech concentration basket (AAPL/MSFT/NVDA/GOOGL/META/AMZN/TSLA).
      Not a thematic foresight category; it is a factor/market-structure lens.
      Covered by the us_stocks board, not TIL themes.

