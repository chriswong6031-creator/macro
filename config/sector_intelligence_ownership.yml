schema: sector_intelligence_ownership.v1
effective_at: "2026-08-03T02:44:38Z"
status: f0_reconciled_partial_freeze
reconciled_against_commit: c2d466f2f568cc4c730d68ced758fafde0c6257a

policy:
  one_writer_required: true
  cross_domain_access: versioned_read_adapter_only
  unresolved_owner_behavior: block_or_degrade
  duplicate_writer_behavior: hard_fail
  user_state_owner: terminal_supabase
  authority_owner: neural_web_a5_governor

runtime_controls:
  biocatalyst_prospective_accrual:
    operational_owner: mastermindx_platform_ops
    implementation_state: implemented_b4e_dark_until_external_seal
    verifier_module: engine.biocatalyst.activation
    worker_gate:
      gate_artifact: "/var/lib/macro-biocatalyst/activation/gate.json"
      heartbeat_artifact: "/var/lib/macro-biocatalyst/activation/heartbeat.json"
      access: root_write_worker_read_only
      failure_behavior: quarantine_before_collection_store_or_pointer_mutation
    credential_planes:
      worker_data_plane: "/etc/macro-biocatalyst.env"
      root_control_plane: "/etc/macro-biocatalyst-control.env"
      control_token_visible_to_worker: false
    external_requirements:
      - exact_bucket_scoped_worker_token
      - indefinite_bucket_lock_covering_biocatalyst_prefix
      - no_lifecycle_delete_covering_biocatalyst_prefix
      - immutable_preflight_receipt_conditional_create_and_readback
      - fresh_root_written_heartbeat
    deprecated_non_authority:
      BIOCATALYST_R2_RETENTION_CONFIRMED: "cannot authorize prospective collection"

# These names freeze cross-plane compatibility slots; they do not create a
# second writer or make a blocked dependency available. Only the current trial
# read API is usable by BioCatalyst today. The shared-plane fixture proves the
# modules/contracts/statuses remain what this registry claims.
read_adapters:
  biocatalyst_trial_read_api.v1:
    canonical_owner: biocatalyst
    implementation_state: implemented_current_record_facts_only
    module: app.biocatalyst
    callable: router
    route_prefix: /api/biocatalyst/v1
    routes:
      - /api/biocatalyst/v1/health
      - /api/biocatalyst/v1/trials
      - /api/biocatalyst/v1/trials/changes
      - /api/biocatalyst/v1/trials/milestones
      - /api/biocatalyst/v1/trials/prospective-changes
      - /api/biocatalyst/v1/trials/{nct_id}
    input_identity: source_native_nct_id
    output_contracts:
      - trial_snapshot.v1
      - trial_history_read_model.v1
      - trial_prospective_change_read_model.v1
    transport: authenticated_site_full_private_no_store
    point_in_time_scope: committed_current_public_generation
    compatibility_fixture: data/biocatalyst/fixtures/shared_plane_read_adapters.v1.json
    biocatalyst_eligible: true
    limitations:
      - current_record_facts_only
      - no_issuer_or_security_identity
      - no_model_or_signal_authority

  biocatalyst_company_identity_pit_adapter.v1:
    canonical_owner: corporate_intelligence
    implementation_state: blocked_no_pit_identity_adapter
    module: null
    callable: null
    available_dependency:
      module: engine.neuralweb.company_intelligence_reader
      callable: read_company_intelligence
      output_contract: company_intelligence_context.v1
      scope: ticker_keyed_context_only_not_identity_or_asset_ownership
    compatibility_fixture: data/biocatalyst/fixtures/shared_plane_read_adapters.v1.json
    biocatalyst_eligible: false
    blocker: reviewed_point_in_time_company_identity_contract

  biocatalyst_security_identity_pit_adapter.v1:
    canonical_owner: market_data_security_master
    implementation_state: unavailable_bootstrap_roster_only
    module: null
    callable: null
    available_dependency:
      module: collectors.symbol_directory
      scope: us_exchange_roster_not_complete_security_master
    compatibility_fixture: data/biocatalyst/fixtures/shared_plane_read_adapters.v1.json
    biocatalyst_eligible: false
    blocker: complete_point_in_time_security_and_corporate_actions_contract

  biocatalyst_corporate_document_span_adapter.v1:
    canonical_owner: corporate_intelligence
    implementation_state: blocked_no_cross_domain_read_adapter
    module: null
    callable: null
    available_dependency:
      module: engine.fundamental_forensics.sec_document_spine
      scope: owner_internal_sec_document_substrate_not_biocatalyst_contract
    compatibility_fixture: data/biocatalyst/fixtures/shared_plane_read_adapters.v1.json
    biocatalyst_eligible: false
    blocker: versioned_document_and_exact_span_read_contract

  biocatalyst_capital_structure_pit_adapter.v1:
    canonical_owner: capital_structure
    implementation_state: blocked_current_projection_has_no_biocatalyst_pit_adapter
    module: null
    callable: null
    available_dependency:
      module: app.capital_structure
      routes:
        - /api/capital-structure/v1/coverage
        - /api/capital-structure/v1/overview
        - /api/capital-structure/v1/issuers/resolve
        - /api/capital-structure/v1/issuers/{issuer_id}
        - /api/capital-structure/v1/issuers/{issuer_id}/events
      output_contract: capital_structure.projection_bundle.v1
      transport: authenticated_site_full_private_no_store
      scope: current_observed_filing_state_without_cash_runway_or_dilution
    compatibility_fixture: data/biocatalyst/fixtures/shared_plane_read_adapters.v1.json
    biocatalyst_eligible: false
    blocker: versioned_internal_pit_adapter_with_unavailable_state_semantics

# B0a froze the source-fact lanes needed by the NCT Trial Capsule; B4D advances
# only their official-API prospective observation and public read-model seams.
# Company identity, a complete security master, Corporate documents, and Capital
# Structure remain explicit dependencies rather than BioCatalyst fallbacks.
registrations:
  clinicaltrials_source_record:
    canonical_owner: biocatalyst
    implementation_state: frozen_for_b0a
    writer:
      service: macro_biocatalyst_worker
      module: collectors.biocatalyst.clinicaltrials_v2
      storage_class: private_immutable_object
      artifact: "biocatalyst/raw/clinicaltrials/v2/{nct_id}/{content_sha256}.json"
      schema: source_record.v1
    cadence: hourly_canary
    retry_replay_policy: receipt_backed_idempotent_replay
    consumers:
      - biocatalyst_trial_projection
      - biocatalyst_exact_diff
    operational_owner: mastermindx_platform_ops

  trial_snapshot_and_exact_diff:
    canonical_owner: biocatalyst
    implementation_state: implemented_b4d_retention_gated
    writer:
      service: macro_biocatalyst_worker
      module: engine.biocatalyst.prospective
      storage_class: private_append_only_ledger
      artifact: "/var/lib/macro-biocatalyst/state/"
      schemas:
        - trial_snapshot.v1
        - trial_snapshot_observation.v1
        - trial_version_diff.v1
        - trial_coverage_epoch.v1
    cadence: after_complete_source_run
    retry_replay_policy: content_addressed_idempotent_replay
    consumers:
      - biocatalyst_read_projection
    operational_owner: mastermindx_platform_ops

  biocatalyst_read_projection:
    canonical_owner: biocatalyst
    implementation_state: implemented_b4d_retention_gated
    writer:
      service: macro_biocatalyst_worker
      module: engine.biocatalyst.publication
      storage_class: vps_atomic_public_projection
      artifact: "/var/lib/macro-biocatalyst/public/"
      schemas:
        - trial_snapshot.v1
        - trial_version_diff.v1
        - trial_history_read_model.v1
        - trial_prospective_change_read_model.v1
    cadence: after_complete_source_run
    retry_replay_policy: temp_write_fsync_rename
    consumers:
      - macro_biocatalyst_api
    operational_owner: mastermindx_platform_ops

  drugs_at_fda_release_archive:
    canonical_owner: biocatalyst
    implementation_state: dark_b4a_private_only
    source_rights_gate:
      source_registry: drugs_at_fda
      production_ingest_allowed: false
      public_projection: blocked_until_review
    writer:
      service: macro_biocatalyst_regulatory_worker
      module: collectors.biocatalyst.drugs_at_fda
      storage_class: private_immutable_source_archive
      artifact: "biocatalyst/raw/drugs_at_fda/{landing|archive}/{content_sha256}.{html|zip}"
      schemas:
        - drugs_at_fda_release_receipt.v1
        - drugs_at_fda_table_manifest.v1
    cadence: blocked_until_source_rights_and_operator_arming
    retry_replay_policy: receipt_backed_content_addressed_idempotent_replay
    consumers:
      - drugs_at_fda_private_query_index
    prohibited_uses:
      - public_projection
      - product_api
      - user_facing_regulatory_lens
      - issuer_company_or_ticker_resolution
      - trial_or_asset_resolution
      - regulatory_outcome_or_probability_inference
      - neural_web_or_prophet_authority
    operational_owner: mastermindx_platform_ops

  drugs_at_fda_private_query_index:
    canonical_owner: biocatalyst
    implementation_state: dark_b4a_private_only
    source_rights_gate:
      source_registry: drugs_at_fda
      production_ingest_allowed: false
      public_projection: blocked_until_review
    writer:
      service: macro_biocatalyst_regulatory_worker
      module: collectors.biocatalyst.drugs_at_fda
      storage_class: private_atomic_sqlite_generation
      artifact: "/var/lib/macro-biocatalyst-regulatory/state/generations/{release_id}/release.sqlite"
      schemas:
        - fda_application_snapshot.v1
        - fda_submission_observation.v1
        - fda_regulatory_event.v1
        - fda_application_dossier.v1
    cadence: after_complete_private_release_archive
    retry_replay_policy: replay_from_receipted_exact_archive_before_atomic_pointer_advance
    consumers: []
    prohibited_uses:
      - public_projection
      - cross_source_entity_join
      - company_or_ticker_identity
      - pdufa_or_pending_application_claim
      - ind_hold_or_complete_response_letter_claim
      - clinical_or_medical_interpretation
      - prophet_candidate_origination
      - neural_web_decision_authority
    operational_owner: mastermindx_platform_ops

  generic_company_identity:
    canonical_owner: corporate_intelligence
    implementation_state: partial_ticker_context_reader_not_pit_identity
    writer: null
    bootstrap_read_only_sources:
      - module: collectors.symbol_directory
        artifact: "data/symbol_directory/cik_map/YYYY-MM-DD.parquet"
        scope: source_native_us_listed_ticker_cik_title_only
    prohibited_uses:
      - private_company_identity
      - temporal_company_alias_history
      - asset_ownership_inference
    required_before:
      - biocatalyst_b2_company_bridge
      - issuer_document_extraction
    operational_owner: corporate_intelligence

  security_identity_and_corporate_actions:
    canonical_owner: market_data_security_master
    implementation_state: bootstrap_only_not_registered_as_complete_master
    writer:
      service: macro_collect
      module: collectors.symbol_directory
      storage_class: private_point_in_time_snapshots
      artifact: "data/symbol_directory/snapshots/YYYY-MM-DD.parquet"
      schema: symbol_directory_snapshot.v1
    limitations:
      - us_exchange_roster_only
      - incomplete_corporate_action_history
      - no_private_companies
      - no_global_security_master
    required_before:
      - biocatalyst_b2_security_bridge
    operational_owner: market_data_ops

  corporate_documents_and_spans:
    canonical_owner: corporate_intelligence
    implementation_state: owner_substrates_exist_no_biocatalyst_read_contract
    writer: null
    prohibited_biocatalyst_fallbacks:
      - duplicate_sec_collector
      - duplicate_transcript_store
      - duplicate_document_index
    required_before:
      - issuer_disclosed_pdufa_claims
      - issuer_hold_or_crl_claims
      - partnership_economics_extraction
    operational_owner: corporate_intelligence

  capital_structure_projection:
    canonical_owner: capital_structure
    implementation_state: current_authenticated_projection_available
    writer:
      service: capital_structure_projection_builder
      module: scripts.build_capital_structure_projection
      storage_class: atomic_current_projection_twin
      artifact: data/capital_structure/projection.json
      schema: capital_structure.projection_bundle.v1
    prohibited_biocatalyst_fallbacks:
      - duplicate_cash_calculation
      - duplicate_burn_calculation
      - duplicate_dilution_engine
    required_before:
      - cash_through_catalyst
      - financing_survival
      - dilution_distribution
    operational_owner: capital_structure

  saved_queries_watchlists_and_assignments:
    canonical_owner: terminal_supabase
    implementation_state: active_external_plane
    writer:
      service: mastermind_terminal
      module: terminal_supabase_product_plane
      storage_class: tenant_scoped_database
      artifact: null
      schema: product_user_state_existing
    prohibited_biocatalyst_fallbacks:
      - local_user_database
      - browser_owned_canonical_state
    operational_owner: terminal_platform_ops

  cross_sector_read_federation:
    canonical_owner: neural_web
    implementation_state: interface_only
    writer:
      service: neural_web
      module: engine.neuralweb
      storage_class: governed_read_projection
      artifact: null
      schema: sector_intelligence_packet.v1
    prohibited_uses:
      - domain_truth_writes
      - source_record_mutation
      - prediction_origination
    operational_owner: neural_web

  authority_and_promotion:
    canonical_owner: neural_web_a5_governor
    implementation_state: active_governance
    writer:
      service: neural_web
      module: engine.neuralweb.constitution
      storage_class: authority_ledger
      artifact: null
      schema: authority_manifest.v1
    operational_owner: neural_web

  final_technical_selection:
    canonical_owner: prophet
    implementation_state: active_external_plane
    writer:
      service: prophet
      module: engine.prophet
      storage_class: governed_signal_artifact
      artifact: null
      schema: existing_prophet_contracts
    prohibited_biocatalyst_fallbacks:
      - candidate_origination
      - candidate_reordering
      - gating
      - sizing
    operational_owner: prophet

b0_closure:
  state: open
  b0a_may_ship: true
  blockers:
    - generic_company_identity_executable_contract
    - complete_market_data_security_master_registration
    - corporate_documents_and_spans_executable_contract
    - capital_structure_biocatalyst_pit_read_adapter
  unblocked_scope:
    - source_canonical_nct_identity
    - clinicaltrials_raw_receipts
    - bounded_trial_read_api
  conditional_schema_scope:
    prospective_trial_observations:
      canonical_registration: trial_snapshot_and_exact_diff
      schema: trial_snapshot_observation.v1
      availability: dark_until_runtime_retention_gate
      required_environment:
        BIOCATALYST_PROSPECTIVE_ENABLED: "1"
        BIOCATALYST_R2_ACTIVATION_ID: "r2_activation_<24-hex>"
        BIOCATALYST_R2_ACCOUNT_ID: "<32-hex-cloudflare-account>"
      required_root_artifacts:
        - "/var/lib/macro-biocatalyst/activation/gate.json"
        - "/var/lib/macro-biocatalyst/activation/heartbeat.json"
    exact_registry_record_diffs:
      canonical_registration: trial_snapshot_and_exact_diff
      schema: trial_version_diff.v1
      availability: dark_until_runtime_retention_gate
      required_environment:
        BIOCATALYST_PROSPECTIVE_ENABLED: "1"
        BIOCATALYST_R2_ACTIVATION_ID: "r2_activation_<24-hex>"
        BIOCATALYST_R2_ACCOUNT_ID: "<32-hex-cloudflare-account>"
      required_root_artifacts:
        - "/var/lib/macro-biocatalyst/activation/gate.json"
        - "/var/lib/macro-biocatalyst/activation/heartbeat.json"
