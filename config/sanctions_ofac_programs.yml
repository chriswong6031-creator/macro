# OFAC sanctions programmes -> country. Reviewed by hand against the committed
# SDN snapshot codes (data/sanctions_ofac/sdn_snapshot.csv) and OFAC's published
# programme / country pages. No inference, no model output, no heuristics.
# Consumed by engine/sanctions_map.py. Country keys are ISO3 matching the
# Natural Earth base map in templates/_worldmap_base.html.j2 (existing geospatial
# identity plane — not a second country master).
#
# `thematic:` lists authorities that are not country-scoped (global terrorism,
# narcotics, WMD, cyber, etc.). They count toward the programme total but do
# NOT inflate "could not verify a country" and do NOT hatch the whole map.
