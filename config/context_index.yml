# CXI-1b multi-repo config
# schema: macro_context_index.config.v2
# Authority ceiling: agent context support only. Never signal, rank, gate, or scored-path.
# Private/memory sources: NOT included here — CXI-4 adds private overlay.

schema: macro_context_index.config.v2

projects:

  macro-dashboard:
    root: "."
    # No root_env needed — "." resolves relative to the invoking repo root.
    visibility: shared
    db: shared.sqlite
    sources:

      # A0 — constitutional
      - id: repo-constitution
        roots:
          - CLAUDE.md
        authority_class: A0
        visibility: shared
        chunker: whole_file
        source_type: config

      # A1 — canonical structured truth (kill registry / ruling graph)
      - id: repo-do-not-rebuild
        roots:
          - research/DO_NOT_REBUILD.md
        authority_class: A1
        visibility: shared
        chunker: registry_rows
        source_type: ruling

      - id: repo-ruling-config
        roots:
          - config/ruling_graph.yml
          - config/compiled_kill_registry.yml
          - config/signal_foundry_blocklist.yml
          - config/synapse.yml
        authority_class: A1
        visibility: shared
        chunker: yaml_keys
        source_type: config

      - id: repo-config-yml
        roots:
          - config/*.yml
        authority_class: A1
        visibility: shared
        chunker: yaml_keys
        source_type: config

      # A1 — Signal Bus
      - id: repo-signal-bus
        roots:
          - docs/SIGNAL_BUS.md
        authority_class: A1
        visibility: shared
        chunker: markdown_sections
        source_type: ruling

      # A4 — temporal state (active build map)
      - id: repo-active-build-map
        roots:
          - docs/ACTIVE_BUILD_MAP.md
        authority_class: A4
        visibility: shared
        chunker: markdown_sections
        source_type: research

      # A3 — durable interpretation (docs + research markdown)
      - id: repo-docs
        roots:
          - docs/**/*.md
        authority_class: A3
        visibility: shared
        chunker: markdown_sections
        source_type: research

      - id: repo-research
        roots:
          - research/**/*.md
        authority_class: A3
        visibility: shared
        chunker: markdown_sections
        source_type: research

      # A2 — implementation truth (source code)
      - id: repo-engine
        roots:
          - engine/**/*.py
        authority_class: A2
        visibility: shared
        chunker: python_symbols
        source_type: code

      - id: repo-scripts
        roots:
          - scripts/**/*.py
        authority_class: A2
        visibility: shared
        chunker: python_symbols
        source_type: code

      - id: repo-collectors
        roots:
          - collectors/**/*.py
        authority_class: A2
        visibility: shared
        chunker: python_symbols
        source_type: code

      - id: repo-lib
        roots:
          - lib/**/*.py
        authority_class: A2
        visibility: shared
        chunker: python_symbols
        source_type: code

      # A2 — tests
      - id: repo-tests
        roots:
          - tests/**/*.py
        authority_class: A2
        visibility: shared
        chunker: python_symbols
        source_type: test

    deny:
      - "**/.env*"
      - "**/*credential*"
      - "**/*secret*"
      - "**/auth.json"
      - "site/**"
      - "data/**"
      - "**/__pycache__/**"
      - "**/node_modules/**"
      - "research/artifacts/**"
      - "ObsidianBrain/**"
      - ".context-index/**"
      - ".git/**"

  terminal:
    root: "~/Documents/Cluade/charting-app"
    root_env: MACRO_CTX_TERMINAL_ROOT
    visibility: private
    db: terminal.sqlite
    sources:

      # A0-equivalent — constitution stack
      - id: terminal-constitution
        roots:
          - README.md
          - HANDOFF.md
          - TERMINAL-ASSESSMENT.md
        authority_class: A0
        visibility: private
        chunker: markdown_sections
        source_type: config

      # A3 — docs
      - id: terminal-docs
        roots:
          - docs/**/*.md
          - "*/README.md"
        authority_class: A3
        visibility: private
        chunker: markdown_sections
        source_type: research

      # A1 — contracts (JSON via yaml_keys)
      - id: terminal-contracts
        roots:
          - contracts/**/*.json
        authority_class: A1
        visibility: private
        chunker: yaml_keys
        source_type: config

      # A1 — migrations
      - id: terminal-migrations
        roots:
          - supabase/migrations/*.sql
        authority_class: A1
        visibility: private
        chunker: code_blocks
        source_type: config

      # A2 — Python source
      - id: terminal-python
        roots:
          - ingest/**/*.py
          - signal_layer/**/*.py
          - scripts/**/*.py
          - api/**/*.py
        authority_class: A2
        visibility: private
        chunker: python_symbols
        source_type: code

      # A2 — TypeScript/JS source
      - id: terminal-ts
        roots:
          - terminal/components/**/*.tsx
          - terminal/lib/**/*.ts
          - terminal/app/**/*.tsx
          - terminal/*.ts
          - hub/**/*.js
        authority_class: A2
        visibility: private
        chunker: code_blocks
        source_type: code

      # A2 — tests
      - id: terminal-tests
        roots:
          - tests/**/*.py
        authority_class: A2
        visibility: private
        chunker: python_symbols
        source_type: test

      # A1 — example configs
      - id: terminal-config
        roots:
          - config/*.example.yml
        authority_class: A1
        visibility: private
        chunker: yaml_keys
        source_type: config

    deny:
      - "**/.env*"
      - "**/.claude/**"
      - "terminal/public/data/**"
      - "**/node_modules/**"
      - "terminal/.next/**"
      - "data/**"
      - "web/**"
      - "**/__pycache__/**"
      - "**/*.parquet"
      - "**/*.tsbuildinfo"
      - "**/*credential*"
      - "**/*secret*"

  mastermind:
    root: "~/Documents/Cluade/Mastermind"
    root_env: MACRO_CTX_MASTERMIND_ROOT
    visibility: private
    db: mastermind.sqlite
    sources:

      # A0-equivalent — constitution stack
      - id: mastermind-constitution
        roots:
          - CLAUDE.md
          - AGENTS.md
          - DOCTRINE.md
          - MAINTENANCE.md
          - README.md
        authority_class: A0
        visibility: private
        chunker: markdown_sections
        source_type: config

      # A3 — docs + research
      - id: mastermind-docs
        roots:
          - docs/**/*.md
          - research/**/*.md
        authority_class: A3
        visibility: private
        chunker: markdown_sections
        source_type: research

      # A1 — config
      - id: mastermind-config
        roots:
          - config/*.yml
        authority_class: A1
        visibility: private
        chunker: yaml_keys
        source_type: config

      # A1 — SQL
      - id: mastermind-sql
        roots:
          - sql/*.sql
        authority_class: A1
        visibility: private
        chunker: code_blocks
        source_type: config

      # A2 — Python source (all major packages)
      - id: mastermind-python
        roots:
          - app/**/*.py
          - bot/**/*.py
          - brain/**/*.py
          - bridge/**/*.py
          - control_plane/**/*.py
          - data_layer/**/*.py
          - loop/**/*.py
          - portfolio/**/*.py
          - scripts/**/*.py
        authority_class: A2
        visibility: private
        chunker: python_symbols
        source_type: code

      # A2 — tests
      - id: mastermind-tests
        roots:
          - tests/**/*.py
        authority_class: A2
        visibility: private
        chunker: python_symbols
        source_type: test

      # A1 — pyproject.toml
      - id: mastermind-pyproject
        roots:
          - pyproject.toml
        authority_class: A1
        visibility: private
        chunker: code_blocks
        source_type: config

    deny:
      - "data/**"
      - "vendor/**"
      - "**/.claude/**"
      - "catboost_info/**"
      - "prototype/**"
      - "**/.env*"
      - "**/*.parquet"
      - "**/*.db"
      - "**/*.sqlite"
      - "**/__pycache__/**"
      - "**/*credential*"
      - "**/*secret*"
