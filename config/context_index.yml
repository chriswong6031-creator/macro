# CXI-1b multi-repo config
# schema: macro_context_index.config.v2
# Authority ceiling: agent context support only. Never signal, rank, gate, or scored-path.
# Private/memory sources: NOT included here — CXI-4 adds private overlay.

schema: macro_context_index.config.v2

projects:

  macro-dashboard:
    root: "."
    # No root_env needed — "." resolves relative to the invoking repo root.
    visibility: shared
    db: shared.sqlite
    sources:

      # A0 — constitutional
      - id: repo-constitution
        roots:
          - CLAUDE.md
        authority_class: A0
        visibility: shared
        chunker: whole_file
        source_type: config

      # A1 — canonical structured truth (kill registry / ruling graph)
      - id: repo-do-not-rebuild
        roots:
          - research/DO_NOT_REBUILD.md
        authority_class: A1
        visibility: shared
        chunker: registry_rows
        source_type: ruling

      - id: repo-ruling-config
        roots:
          - config/ruling_graph.yml
          - config/compiled_kill_registry.yml
          - config/signal_foundry_blocklist.yml
          - config/synapse.yml
        authority_class: A1
        visibility: shared
        chunker: yaml_keys
        source_type: config

      - id: repo-config-yml
        roots:
          - config/*.yml
        authority_class: A1
        visibility: shared
        chunker: yaml_keys
        source_type: config

      # A1 — Signal Bus
      - id: repo-signal-bus
        roots:
          - docs/SIGNAL_BUS.md
        authority_class: A1
        visibility: shared
        chunker: markdown_sections
        source_type: ruling

      # A4 — temporal state (active build map)
      - id: repo-active-build-map
        roots:
          - docs/ACTIVE_BUILD_MAP.md
          - docs/PROJECT_ACTIVE_BUILD_MAP.md
        authority_class: A4
        visibility: shared
        chunker: markdown_sections
        source_type: research

      # A4 — temporal state (Agent OS work identity + session transfer).
      # Same class as ACTIVE_BUILD_MAP and for the same reason: a workstream's status,
      # waves and next_action describe the state of the work RIGHT NOW and go stale the
      # moment a wave lands.  `whole_file` because one record IS one retrieval unit —
      # agentos/README.md rule 1 pins one record per file, and the records are small by
      # design (§7 field-count budget), so section-splitting them would return half a
      # record with its frontmatter contract missing.
      - id: agentos-workstreams
        roots:
          - agentos/workstreams/*.md
        authority_class: A4
        visibility: shared
        chunker: whole_file
        source_type: research

      - id: agentos-handoffs
        roots:
          - agentos/handoffs/*.md
        authority_class: A4
        visibility: shared
        chunker: whole_file
        source_type: research

      # A3 — durable interpretation (docs + research markdown)
      - id: site-semantics
        roots:
          - docs/site_semantics/**/*.md
        authority_class: A3
        visibility: shared
        chunker: markdown_sections
        source_type: research

      - id: repo-docs
        roots:
          - docs/**/*.md
        authority_class: A3
        visibility: shared
        chunker: markdown_sections
        source_type: research

      - id: repo-research
        roots:
          - research/**/*.md
        authority_class: A3
        visibility: shared
        chunker: markdown_sections
        source_type: research

      # A3 — durable interpretation (Agent OS reasoning + evidence).
      # DELIBERATELY A3, NOT A1.  A decision record says why the organization chose
      # something; it does not hold kill authority.  `research/DO_NOT_REBUILD.md` keeps
      # that (A1, `repo-do-not-rebuild` above) and a killing decision writes BOTH — see
      # agentos/README.md §"Relationship to the stores that already exist".  Promoting
      # these to A1 would give a record that any session may mint the same rank as an
      # adjudicated kill row, which is exactly the authority hop the Agent OS refuses.
      - id: agentos-decisions
        roots:
          - agentos/decisions/*.md
        authority_class: A3
        visibility: shared
        chunker: whole_file
        source_type: research

      - id: agentos-discoveries
        roots:
          - agentos/discoveries/*.md
        authority_class: A3
        visibility: shared
        chunker: whole_file
        source_type: research

      # The contract a cold session reads before writing a record.  Sectioned, unlike
      # the records themselves: it is a document with independently useful parts.
      - id: agentos-readme
        roots:
          - agentos/README.md
        authority_class: A3
        visibility: shared
        chunker: markdown_sections
        source_type: research

      # DELIBERATELY NOT INDEXED — `agentos/schema/*.yml`.  Those four files are machine
      # mirrors of research/MASTERMIND_AGENT_OS_STATE_SCHEMA.md, which `repo-research`
      # already indexes.  Two copies of one field table split the retrieval vote between
      # them and push the authored source down the ranking, so the duplicate costs recall
      # and buys nothing.  Read the schema doc; the mirrors exist for validators.

      # A2 — implementation truth (source code)
      - id: repo-engine
        roots:
          - engine/**/*.py
        authority_class: A2
        visibility: shared
        chunker: python_symbols
        source_type: code

      - id: repo-scripts
        roots:
          - scripts/**/*.py
        authority_class: A2
        visibility: shared
        chunker: python_symbols
        source_type: code

      - id: repo-collectors
        roots:
          - collectors/**/*.py
        authority_class: A2
        visibility: shared
        chunker: python_symbols
        source_type: code

      - id: repo-lib
        roots:
          - lib/**/*.py
        authority_class: A2
        visibility: shared
        chunker: python_symbols
        source_type: code

      # A2 — tests
      - id: repo-tests
        roots:
          - tests/**/*.py
        authority_class: A2
        visibility: shared
        chunker: python_symbols
        source_type: test

    deny:
      - "**/.env*"
      - "**/*credential*"
      - "**/*secret*"
      - "**/auth.json"
      # GENERATED rollup of every agentos/ record, regenerated nightly and marked
      # DO-NOT-EDIT.  `repo-docs` would otherwise index a second full copy of the record
      # set: the same sentences retrieved twice, once from the record that owns them and
      # once from a derived page a session must never edit.  The records are the
      # retrieval truth; the rollup is a human view.
      - "docs/AGENT_OS_STATE.md"
      - "site/**"
      - "data/**"
      - "**/__pycache__/**"
      - "**/node_modules/**"
      - "research/artifacts/**"
      - "ObsidianBrain/**"
      - ".context-index/**"
      - ".git/**"

  terminal:
    root: "~/Documents/Cluade/charting-app"
    root_env: MACRO_CTX_TERMINAL_ROOT
    visibility: private
    db: terminal.sqlite
    sources:

      # A0-equivalent — constitution stack
      - id: terminal-constitution
        roots:
          - README.md
          - HANDOFF.md
          - TERMINAL-ASSESSMENT.md
        authority_class: A0
        visibility: private
        chunker: markdown_sections
        source_type: config

      # A3 — docs
      - id: terminal-docs
        roots:
          - docs/**/*.md
          - "*/README.md"
        authority_class: A3
        visibility: private
        chunker: markdown_sections
        source_type: research

      # A1 — contracts (JSON via yaml_keys)
      - id: terminal-contracts
        roots:
          - contracts/**/*.json
        authority_class: A1
        visibility: private
        chunker: yaml_keys
        source_type: config

      # A1 — migrations
      - id: terminal-migrations
        roots:
          - supabase/migrations/*.sql
        authority_class: A1
        visibility: private
        chunker: code_blocks
        source_type: config

      # A2 — Python source
      - id: terminal-python
        roots:
          - ingest/**/*.py
          - signal_layer/**/*.py
          - scripts/**/*.py
          - api/**/*.py
        authority_class: A2
        visibility: private
        chunker: python_symbols
        source_type: code

      # A2 — TypeScript/JS source
      - id: terminal-ts
        roots:
          - terminal/components/**/*.tsx
          - terminal/lib/**/*.ts
          - terminal/app/**/*.tsx
          - terminal/*.ts
          - hub/**/*.js
        authority_class: A2
        visibility: private
        chunker: code_blocks
        source_type: code

      # A2 — tests
      - id: terminal-tests
        roots:
          - tests/**/*.py
        authority_class: A2
        visibility: private
        chunker: python_symbols
        source_type: test

      # A1 — example configs
      - id: terminal-config
        roots:
          - config/*.example.yml
        authority_class: A1
        visibility: private
        chunker: yaml_keys
        source_type: config

    deny:
      - "**/.env*"
      - "**/.claude/**"
      - "terminal/public/data/**"
      - "**/node_modules/**"
      - "terminal/.next/**"
      - "data/**"
      - "web/**"
      - "**/__pycache__/**"
      - "**/*.parquet"
      - "**/*.tsbuildinfo"
      - "**/*credential*"
      - "**/*secret*"

  mastermind:
    root: "~/Documents/Cluade/Mastermind"
    root_env: MACRO_CTX_MASTERMIND_ROOT
    visibility: private
    db: mastermind.sqlite
    sources:

      # A0-equivalent — constitution stack
      - id: mastermind-constitution
        roots:
          - CLAUDE.md
          - AGENTS.md
          - DOCTRINE.md
          - MAINTENANCE.md
          - README.md
        authority_class: A0
        visibility: private
        chunker: markdown_sections
        source_type: config

      # A3 — docs + research
      - id: mastermind-docs
        roots:
          - docs/**/*.md
          - research/**/*.md
        authority_class: A3
        visibility: private
        chunker: markdown_sections
        source_type: research

      # A1 — config
      - id: mastermind-config
        roots:
          - config/*.yml
        authority_class: A1
        visibility: private
        chunker: yaml_keys
        source_type: config

      # A1 — SQL
      - id: mastermind-sql
        roots:
          - sql/*.sql
        authority_class: A1
        visibility: private
        chunker: code_blocks
        source_type: config

      # A2 — Python source (all major packages)
      - id: mastermind-python
        roots:
          - app/**/*.py
          - bot/**/*.py
          - brain/**/*.py
          - bridge/**/*.py
          - control_plane/**/*.py
          - data_layer/**/*.py
          - loop/**/*.py
          - portfolio/**/*.py
          - scripts/**/*.py
        authority_class: A2
        visibility: private
        chunker: python_symbols
        source_type: code

      # A2 — tests
      - id: mastermind-tests
        roots:
          - tests/**/*.py
        authority_class: A2
        visibility: private
        chunker: python_symbols
        source_type: test

      # A1 — pyproject.toml
      - id: mastermind-pyproject
        roots:
          - pyproject.toml
        authority_class: A1
        visibility: private
        chunker: code_blocks
        source_type: config

    deny:
      - "data/**"
      - "vendor/**"
      - "**/.claude/**"
      - "catboost_info/**"
      - "prototype/**"
      - "**/.env*"
      - "**/*.parquet"
      - "**/*.db"
      - "**/*.sqlite"
      - "**/__pycache__/**"
      - "**/*credential*"
      - "**/*secret*"
