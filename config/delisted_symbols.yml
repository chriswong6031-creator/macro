# Delisted-symbol exit ledger — securities that STOPPED EXISTING.
#
# This is the EXIT half of the symbol-lifecycle pair. Its sibling is the RENAME
# half (`breadth.ticker_fixups` / `lib.ticker_aliases` in config.yml): a rename is
# a KEY MIGRATION — the same security keeps trading under a new symbol, so the
# fetch is re-pointed and the history moves with it. A delisting is the opposite:
# there is no symbol to re-point at, because the tape ended. Never resolve one
# with the other's mechanism.
#
# WHY THIS FILE EXISTS (research/RESOLUTION_20260806_SIDE_STORE_SYMBOLS.md).
# `data/yahoo` extras CTRA and TPH were carried for months as "frozen feeds" — the
# #4643 scan demotion kept them honest with deliberately cause-neutral copy ("no
# new data since X") because stale-vs-renamed-vs-delisted was not established per
# name. It is established now: both were acquired, both filed Form 25-NSE, and
# their store tips are their LAST TRADING SESSIONS, not a broken pull. A symbol
# whose security stopped existing must not be
#   * requested nightly forever (it can never return, and a permanent entry in the
#     never-silent missing-symbol warning trains the reader to ignore the one
#     tripwire that would catch the NEXT real outage), nor
#   * described to a user as "no new data" (#4616 law: delisted is not stale).
#
# WHAT A ROW DOES NOT DO. It never deletes the store and never removes the ticker
# from `stock_search.extra_tickers` — the page and its deep links stay alive
# (CSP-R1, fail-dark is not an option), the history stays readable for replay and
# backtests, and scoring authority is stripped instead. A row is a DISCLOSURE, not
# a deletion.
#
# EVERY ROW IS RESOLVED, NEVER INFERRED (#4622 protocol). Required evidence before
# adding one: the security is absent from the NASDAQ symbol directory
# (nasdaqtraded.txt covers NYSE/NYSE American/NASDAQ/Cboe), AND the issuer's SEC
# filing history shows the exit (Form 25 / 25-NSE exchange delisting notice, and
# usually a Form 15 deregistration and a merger 8-K carrying Item 2.01/3.01).
# A vendor probe saying "possibly delisted" is a HINT, never the evidence — Yahoo
# says exactly that about a live security whose symbol merely changed (TCNNF, which
# turned out to be an uplisting to NYSE:TRLV), and static vendor metadata routinely
# outlives a real delisting (#4616).
#
# `successor_ticker` is deliberate and load-bearing. It is null for every row here:
# an all-stock acquirer (Devon) is a DIFFERENT, pre-existing security on its own
# price line, and a cash acquirer (Sumitomo Forestry) leaves no US-listed line at
# all. Neither continues this series, so neither may be spliced onto it. Fill it in
# only for an exit that genuinely hands the same tape to a new symbol, and then
# treat it as a rename (key migration), not as a row here.

