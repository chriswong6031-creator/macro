schema: mastermind.production_topology.v1
project_id: mastermind-x
version: 1
owner: macro-admin

runtime_state_policy:
  visibility: private_authenticated
  collection: on_demand
  commit: never
  public_publish: never
  semantic_program_id_pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$"

repositories:
  - id: macro
    slug: mastermindx-market-intelligence/macro
    branch: main
    deployment_contract: origin/main is pulled into /opt/macro and served atomically.
    deployed_probe: {kind: git_head, path: /opt/macro}
    canonical_probe: {kind: git_remote_ref, remote: "https://github.com/mastermindx-market-intelligence/macro.git", ref: refs/heads/main}
    runtime_probe: {kind: http_json, url: "http://127.0.0.1:8000/api/health", sha_field: commit}
    runtime_match_policy: selective_restart
    refs: [app/deploy/update.sh, app/deploy/setup.sh, app/deploy/macro-api.service]
    semantic_program_id: null
  - id: terminal
    slug: mastermindx-market-intelligence/mastermind-terminal
    branch: master
    deployment_contract: origin/master is built from /opt/terminal/.gitsrc into /opt/terminal/terminal.
    deployed_probe: {kind: text_file, path: /opt/terminal/terminal/.deployment-id, resolve_path: /opt/terminal/.gitsrc}
    canonical_probe: {kind: git_remote_ref, remote: "https://github.com/mastermindx-market-intelligence/mastermind-terminal.git", ref: refs/heads/master}
    runtime_probe: {kind: http_html_attribute, url: "http://127.0.0.1:3000/terminal", attribute: data-dpl-id}
    refs: [mastermind-terminal:DEPLOY.md, mastermind-terminal:ops/terminal-build.sh]
    semantic_program_id: null
  - id: portfolio
    slug: mastermindx-market-intelligence/Mastermind
    branch: master
    deployment_contract: the exact current origin/master archive is deployed to /opt/mastermind.
    deployed_probe: {kind: text_file, path: /opt/mastermind/.deployed_git_sha}
    canonical_probe: {kind: github_ref, slug: mastermindx-market-intelligence/Mastermind, ref: master}
    runtime_probe: {kind: http_json, url: "http://127.0.0.1:8001/health", sha_field: version}
    refs: [Mastermind:scripts/deploy_from_git.sh, Mastermind:scripts/deploy_code_to_vps.sh]
    semantic_program_id: null

services:
  - id: macro.edge
    repo: macro
    owner: macro-admin
    kind: web_service
    host_class: vps
    units: [caddy.service]
    expected_state: active
    refs: [app/deploy/Caddyfile, app/deploy/setup.sh]
    semantic_program_id: null
  - id: macro.api
    repo: macro
    owner: macro-admin
    kind: api_service
    host_class: vps
    units: [macro-api.service]
    expected_state: active
    health_probe: {kind: http_json, url: "http://127.0.0.1:8000/api/health"}
    refs: [app/deploy/macro-api.service, app/deploy/api-setup.sh]
    semantic_program_id: null
  - id: macro.admin
    repo: macro
    owner: macro-admin
    kind: api_service
    host_class: vps
    units: [admin.service]
    expected_state: active
    health_probe: {kind: http, url: "http://127.0.0.1:8787/healthz"}
    refs: [admin/deploy/admin.service, admin/deploy/setup-admin.sh]
    semantic_program_id: null
  - id: terminal.web
    repo: terminal
    owner: macro-admin
    kind: web_service
    host_class: vps
    units: [terminal.service]
    expected_state: active
    health_probe: {kind: http, url: "http://127.0.0.1:3000/terminal"}
