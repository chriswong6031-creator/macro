    semantic_program_id: null
  - id: portfolio.api_scheduler
    repo: portfolio
    owner: macro-admin
    kind: scheduler
    host_class: vps
    units: [mastermind.service]
    expected_state: active
    health_probe: {kind: http_json, url: "http://127.0.0.1:8001/health"}
    refs: [Mastermind:ops/mastermind-vps.service.d/authoritative.conf, Mastermind:app/scheduler.py]
