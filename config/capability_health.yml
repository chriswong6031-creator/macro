# config/capability_health.yml — F13 V1 capability registry (declarative CONFIG, not a
# store). Read by scripts/build_capability_health.py, resolved by
# engine/capability_health.py.
#
# SEED COHORT LAW (frozen commission §1): every entry below names ONLY receipt sources
# verified to exist in the code read while building this registry (2026-09-04) — no
# receipt source here is invented. Two commission candidates were DROPPED rather than
# guessed at:
#   * "brain chat gateway" — no synapse artifact is produced by
#     engine/neuralweb/brain_gateway.py (it is a live FastAPI service, not a nightly
#     artifact producer), and no confirmed engine.llm_auth `lane` string for its model
#     calls was found in the code read. Adding it would have required inventing either
#     an artifact id or a provider_rung ref.
#   * "research vault (quota state)" — the download-quota ledger
#     (engine/research_vault/download_quota.py) is per-user runtime state under
#     $MACRO_API_STATE_DIR, not a deterministic repo artifact; data/research_vault/ has
#     no config/synapse.yml registration and no data/run_status.json source key.
# Both are reported as GAPS in the F13 V1 build packet, not silently worked around.
#
# receipt_sources[].type is a CLOSED vocabulary enforced by
# engine.capability_health.validate_registry / RECEIPT_TYPES:
#   output_health_artifact — ref is a config/synapse.yml artifact id; the loader reads
#                             it out of scripts.build_output_health's resolved view.
#   nightly_lane            — ref is a data/run_status.json `sources.<ref>` key (or the
#                             literal `__global__` for the top-level `last_run` heartbeat).
#   provider_rung           — ref is the `lane` string engine/provider_health.py rows are
#                             recorded under (engine.llm_auth.make_call(lane=...)).
#   sentinel_probe          — ref is a scripts/freshness_sentinel.py SURFACES id, read
#                             from the already-written site/live/staleness.json (this
#                             builder makes no network calls of its own).
#
# clocks declared per receipt_sources[i] name which of last_attempted / last_successful /
# data_as_of / render_release that specific source can supply; the loader only ever
# writes the clocks it declares.

capabilities:
  - id: prophet_us
    label_en: "Prophet — US Board"
    label_zh: "Prophet — 美股看板"
    owner: "prophet program"
    artifacts:
      - site/prophet/index.json
    receipt_sources:
      - type: output_health_artifact
        ref: prophet-index
        clocks: [data_as_of]
    # A `nightly_lane: __global__` heartbeat source was DROPPED here (repair 2026-09-04,
    # post-review). `__global__` can only ever bind last_attempted — `scripts/collect.py`
    # writes data/run_status.json's top-level `last_run` unconditionally regardless of
    # per-source outcome, so it never proves a success. Under the (correct, ruled)
    # worst-fold law that a source with no prior success is could_not_look and can never
    # be masked by a sibling (engine.capability_health's C1/I3 repair), keeping it here
    # would have permanently forced prophet_us to could_not_look even when prophet-index
    # itself reads confidently healthy — a source that can NEVER contribute anything but
    # could_not_look adds no honest signal, only permanent poison. prophet-index alone is
    # the real receipt for this capability.
    stale_after_hours: 30
    next_action_hint: >-
      Check the nightly-liveness.yml watchdog and site/prophet/index.json's own
      source_asof; scripts/prophet_rescue.py is the sole auto-redispatcher.
    next_action_hint_zh: >-
      检查 nightly-liveness.yml 看门狗任务，以及 site/prophet/index.json 自身的
      source_asof 字段；scripts/prophet_rescue.py 是唯一的自动重新调度器。

  - id: market_reference
    label_en: "Market Reference Data Build"
    label_zh: "市场参考数据构建"
    owner: "data ingestion"
    artifacts:
      - data/run_status.json
    # ROUND-3 repair (2026-09-06 independent review, item 1): fred/yahoo are
    # `nightly_lane` sources — they never truthfully bind `data_as_of`. Their
    # `last_date` is collectors/base.py's group-MAX OBSERVATION date across the
    # source's own stored series, not an as-of instant (fred's FEDTARMD FOMC
    # projection series legitimately carries a far-future last_date on a completely
    # healthy lane). scripts/build_capability_health.py's `nightly_lane_facts` no
    # longer maps `last_date` onto `data_as_of` at all, so declaring that clock here
    # would only ever describe a clock this source can never actually supply.
    receipt_sources:
      - type: nightly_lane
        ref: fred
        clocks: [last_attempted, last_successful]
      - type: nightly_lane
        ref: yahoo
        clocks: [last_attempted, last_successful]
    stale_after_hours: 30
    next_action_hint: >-
      Check daily.yml's collect/engine job logs for the fred/yahoo sources in
      data/run_status.json.
    next_action_hint_zh: >-
      检查 daily.yml 中 collect/engine 任务的日志，核实 data/run_status.json 里
      fred、yahoo 这两个数据源的状态。

  - id: stock_dossiers
    label_en: "Stock Dossiers (R2 stockdata)"
    label_zh: "个股档案（R2 stockdata）"
    owner: "long-hold / stockdata"
    artifacts:
      - site/stockdata/mag7_regime.json
      - "site/stockdata/<TICKER>.json"
    receipt_sources:
      - type: output_health_artifact
        ref: mag7-regime-site
        clocks: [data_as_of]
      - type: output_health_artifact
        ref: stock-personality-block
        clocks: [data_as_of]
    stale_after_hours: 30
    next_action_hint: >-
      A could_not_look here on a checkout is expected — mag7-regime-site is
      gitignored-local and stock-personality-block is an R2 per-ticker family path;
      neither is probeable from a repo checkout. Verify on the live host or via publish_r2.
    next_action_hint_zh: >-
      在仓库检出环境中读到 could_not_look 是预期情况——mag7-regime-site 属于本地
      gitignore 文件，stock-personality-block 是 R2 上按股票代码存放的路径，两者都
      无法在仓库检出中探测；请到生产主机上核实，或通过 publish_r2 核实。

  - id: foresight_desk
    label_en: "Thematic Foresight Desk"
    label_zh: "主题前瞻台"
    owner: "qualitative-intelligence"
    artifacts:
      - site/basketdata/foresight_cascade.json
      - data/foresight/health_log.jsonl
    receipt_sources:
      - type: output_health_artifact
        ref: site-foresight-cascade
        clocks: [data_as_of]
    stale_after_hours: 30
    next_action_hint: >-
      Check scripts/build_foresight.py and data/foresight/health_log.jsonl's most
      recent row for which legs are DARK/PARTIAL.
    next_action_hint_zh: >-
      检查 scripts/build_foresight.py，并查看 data/foresight/health_log.jsonl
      最新一行，确认哪些环节处于 DARK/PARTIAL 状态。

  - id: chronicle
    label_en: "Market Context Chronicle"
    label_zh: "市场脉络编年志"
    owner: "chronicle / event spine"
    artifacts:
      - data/chronicle/manifest.json
      - data/chronicle/state_log.jsonl
    receipt_sources:
      - type: output_health_artifact
        ref: chronicle-manifest
        clocks: [data_as_of]
      - type: output_health_artifact
        ref: chronicle-state-log
        clocks: [data_as_of]
    stale_after_hours: 30
    next_action_hint: >-
      Check daily.yml's "Chronicle — market context timeline spine" step and
      scripts/build_chronicle.py's own stdout for rc != 0.
    next_action_hint_zh: >-
      检查 daily.yml 中 "Chronicle — market context timeline spine" 步骤，
      以及 scripts/build_chronicle.py 自身标准输出中 rc != 0 的情况。
