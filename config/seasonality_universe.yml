# Stock seasonality (calendar clock) — universe SELECTION POLICY.
#
# This file deliberately does NOT carry a ticker roster. The roster is MEASURED
# by scripts/build_stock_seasonality.py: every symbol in data/yahoo/ whose
# complete-year count clears `min_complete_years` is covered, and the count is
# recomputed from the parquet store on every run.
#
# Hand-listing tickers is how this program would ship a lie. The store is
# bimodal — a large cohort of decades-old companies (GILD, BIIB, JNJ, MRK, and
# every one of the household mega-caps) carries only ~2 complete years here
# because it was backfilled recently, while unglamorous names carry 40+. A
# roster written from what "looks established" would promise depth the data does
# not have. The threshold and the scope fence live here so the covered set can
# grow without a code change; the membership does not.
meta:
  schema: biopharma_seasonality.universe_policy.v1
  owner_program: biopharma-seasonality-intelligence
  description: >
    Selection policy for the stock seasonality calendar clock. Membership is
    measured from data/yahoo/, never hand-listed.

selection:
  # A symbol is covered only with at least this many COMPLETE years, where a
  # complete year is "first session <= Jan 10 and last session >= Dec 20".
  # The unit of evidence is one complete year, so this is the sample-size floor.
  min_complete_years: 15
  # The panel keeps at most this many of the most recent complete years; the
  # count actually available is published alongside it.
  years_cap: 25
  # Scope fence. This tranche is a STOCK/ETF calendar explorer: FX crosses,
  # continuous futures, and raw index quotes are a different instrument class
  # with a different adjustment story (an index quote carries no dividend
  # adjustment at all, so its curve is not comparable to an ETF's). Widening
  # the fence is a one-line change here, not a code change.
  exclude_prefixes: ["_"]
  exclude_suffixes: ["_X", "_F"]
  exclude:
    - SPX     # index quote, price-return only; SPY is the tradable, adjusted read
    - SPXW    # weekly variant of the same index quote
    - "DX-Y.NYB"

# The benchmark leg for the market-neutral panel. Its own residual against
# itself is identically zero, so the benchmark ships with no `neutral.market`.
benchmark: SPY
default_symbol: SPY

# Display labels for the index picker. Symbols absent from this map fall back to
# the SEC company title (data/edgar/company_tickers.json) and then to the ticker
# itself; `sector` is null rather than guessed, because a fabricated sector is
# worse than an honest blank on a page whose whole thesis is not overclaiming.
