    # structural reason the legal pages are: a page whose whole job is to tell a
    # stranger — and a crawler that has never had a session — who we are cannot
    # sit behind a wall that asks them to prove who THEY are first. No signals,
    # no customer data, no write surface.
    - /about.html
    - /plans.html
    # Free signal-stack lead magnet. Rank 1 exposes its matching tickers; paid
    # rows are omitted server-side and render only counts + the trial CTA, so
    # the public shell contains no premium ticker payload.
    - /confluence_screener.html
    # Public acquisition dashboards. macro/start expose the broad market read;
    # macro drill-downs still require registration. us_stocks applies the
    # anonymous=1 / Free=3 / paid=full summary preview in tier_preview.js.
    - /macro.html
    - /start.html
    - /us_stocks.html
