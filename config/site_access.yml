    # @media (prefers-reduced-motion: no-preference) — .ilx-path gets a
    # stroke-dashoffset and .ilx-area/.ilx-dot/.ilx-bar get opacity:0 — and the
    # ink only draws once .ilx-in lands (illus.css:332-338), of which illus.js is
    # the SOLE writer. So CSS alone leaves every figure permanently blank, and JS
    # alone leaves them solid black (fill:none never applied). Both, and they
    # render. That black state is live today: computed style on bonds.html is
    # `fill: rgb(0, 0, 0)`, the SVG default, so the yield-curve figure paints as
    # a solid blob. illus.js makes zero network calls (one IntersectionObserver
    # plus window.ilxMount/ilxReveal) and the path geometry is already inline in
    # the public HTML, so the pair moves no data whatsoever.
    - /illus.css
    - /illus.js
    # ── Watchlist page funnel shell (watchlist.html) — P0 anonymous-husk fix,
    # 2026-08-12 (Watchlist/Portfolio W0 commissioning packet §2.7 / §0
    # "Anonymous funnel" precondition; chipped ahead of the W2 flagship
    # rebuild) ───────────────────────────────────────────────────────────────
    #
    # The 2026-08-04 *.html change opened the shell, but ALL TEN of the page's
    # scripts stayed default-deny, so anonymous production served a publicly
    # cached husk: no empty state, no sign-in CTA, zero console errors because
    # nothing ran. These SIX are the funnel shell: the page's own store is the
    # visitor's list (localStorage; Supabase after sign-in), so the empty
    # state, add-holding UI and the #wl_signin "Sign in to sync" CTA render
    # with zero gated reads. Network surface, verified file by file plus an
    # adversarial red-team pass (2026-08-12): watchlist.js, watchstore.js,
    # market_books.js and mtf.js make no network calls; portfolio.js reads
    # only gated data/portfolio_ctx.json (401 → stage rows omit, and only
    # after a modeled position exists).
    #
    # FOUR of the page's scripts are deliberately NOT here, and the difference
    # is the whole boundary:
    #   * stockdata.js — the page ships a data_base fetch shim that diverts
    #     every <market>stockdata/* read to the public R2 bucket, so with
    #     window.SD present an open shell RENDERS graded per-ticker output
    #     (conviction band, ladder state, entry urgency) to signed-out
    #     visitors. The anonymous shell therefore boots WITHOUT window.SD —
    #     watchlist.js carries the signed-out guards (same PR) and draws no
    #     signal claims at all.
    #   * watchlist_risk.js + risk_core.js + factor_exposure.js — payload-free
    #     but they ARE the calibrated decision rule (thresholds, escalation
    #     ladder, score→label boundaries) in code form; publishing the rule is
    #     a product disclosure the W2 flagship wave must decide deliberately
    #     against its anonymous-funnel exit gate, not inherit as a husk-fix
    #     side effect. Anonymously they could draw nothing anyway:
    #     factor_betas.json and transmission_chains.json stay gated and
    #     401 → null.
    - /watchlist.js
    - /watchstore.js
    - /market_books.js
    - /portfolio.js
    # A1B fast start is the same visitor-owned funnel surface: pure parsing/CSS
    # plus a UI client that delegates only to WatchStore.portfolio. None reads a
    # gated signal source, publishes holdings, or touches Watchlists.
    - /portfolio_import.css
    - /portfolio_import.js
    - /portfolio_import_ui.js
    # A1A (#6109) added /portfolio_state.js to the Caddyfile's public matchers
    # and to @watchlist_shell_versioned, but never here — so the edge served it
    # anonymously while the reviewed policy still called it non-public. The
    # cross-check that exists to catch exactly that
    # (test_shared_cache_headers_match_only_reviewed_public_paths) went red and
    # merged anyway, because its only CI home was the `gate: data` tier-gate
    # job. Reconciled to what the edge already does, and the guard moved onto
    # the merge gate in the same PR.
    #
    # It belongs with its four siblings above on the merits, not just for
    # consistency: portfolio_state.js is the DOM-free pure computation of the
    # canonical Portfolio read, with zero network calls of its own — the
    # `portfolio_snapshot.v1` object it derives is private and stays in the
    # client, and nothing about serving the CODE anonymously publishes it. The
    # gated reads on that page are still portfolio.js's data/portfolio_ctx.json
    # (401 -> stage rows omit), unchanged here.
    - /portfolio_state.js
    - /mtf.js
    # The unified chat widget client — public theme.js injects it on every
    # root-level page for every visitor (document-relative src, so the SEO
    # subtrees are a separate, pre-existing gap), and its 401 was killing the
    # anonymous chat launcher on all of them, not just here. Its data plane is
    # the Bearer-authenticated /api/brain/* gateway plus the public R2 bar
    # store; the script carries no signals or customer data. Also promoted by
    # the in-flight stock.html heal (#5409) — listed in both so each stands
    # alone; dedupe on whichever lands second.
    - /mm_brain.js
    #
    # terminal_overlay.js LOOKS like the next mm_brain.js and is NOT — recorded
    # here because the resemblance is the trap. theme.js does build
    # `_mmOverlaySrc` (theme.js:288) and prewarmTerminal() does call
    # loadTerminalOverlay() for every visitor (theme.js:352), and the standalone
    # file does 401. But scripts/site_assets.py BUNDLES the overlay source into
    # the emitted theme.js (see the block comment at theme.js:5475), where it
    # runs as a top-level IIFE and sets window.MDXTerminalOverlay before any
    # idle callback fires — so loadTerminalOverlay's guard (theme.js:295) short-
    # circuits and the standalone URL is never requested. Verified against the
    # LIVE theme.js, which is byte-identical to the repo copy and contains the
    # inline definition. Promoting it would widen the boundary for a file
    # production never fetches. Fetching /terminal_overlay.js by hand and seeing
    # a 401 does NOT show the page needs it.
    #
    # Existing Terminal ingest compatibility. Remove after the separate
    # Terminal session moves these fetches behind authenticated transport.
    - /factordata/tech_lab.json
  prefixes:
    - /assets/css/
    # Content-hashed page scripts, minted by scripts/externalize_css.py from
    # inline `<script data-externalize>` blocks. Same shape as the CSS tree
    # beside it: derived, per-page presentation code with no signal payload —
    # the render-time DATA those scripts read stays inline in the (gated) HTML.
    # The hash IS the filename, so an edit mints a new URL and the Caddyfile's
    # @public_versioned immutable-1y rule can never serve stale bytes.
    - /assets/js/
    - /assets/landing/
    - /factordata/tech_events/
    # Free SEO estate (active product ruling / PR #3387).
    - /stocks/
    - /products/
    - /tools/
    - /learn/
    - /blog/
    # Per-report SEO landing pages + crawl hub (#3392/#3487): public teaser with
