# config/site_access.yml — reviewed serving boundary for www.mastermind-x.com.
#
# Caddy is DEFAULT-DENY for static ASSETS: any non-HTML path not in `public` is
# routed through the registration wall, then through app/paywall.py. The paywall
# is independently feature-flagged; registration protection is live regardless.
#
# HTML DOCUMENTS ARE NOT IN THAT CLASS ANY MORE (operator 2026-08-04). Every
# *.html page shell is served to anonymous visitors — the registration wall that
# used to 302 ~239 member pages to /?signin=1&ret=<path> was removed, along with
# the @reg_html / @reg_html_err matchers that enforced it. See the block comment
# in app/deploy/Caddyfile above @reg_asset.
#
# So this file's `public` list no longer decides whether a PAGE is reachable —
# it decides whether an ASSET is. The .html entries below are retained because
# the Caddy @reg_asset exclusion list is compared against this file byte-for-byte
# by tests/test_site_access_boundary.py; they are now belt-and-braces, not the
# thing holding a page open.
#
# The paid product is the PAYLOAD, not the page. What still gates:
#   * everything under `premium.enforced_early` (/premiumdata/,
#     /capital-structure-data/, and the two named snapshots) — 403 for anonymous
#     AND Free, ahead of the PAYWALL_ENABLED switch;
#   * every per-ticker <market>stockdata/*.json graded emit;
#   * every other data path not named under `public` below.
# An anonymous visitor therefore reads the shell, the methodology and the honest
# totals, and tier_preview.js paints the locked slot where the paid rows sit.
#
# Moving an ASSET into `public` is still a security-sensitive product change.
# Keep the matching list in app/deploy/Caddyfile byte-for-byte aligned; the
# boundary test fails if the two drift.
# ── /api/* is NOT governed by this file ──────────────────────────────────────
# Caddy excludes /api/* from @reg_asset (those paths are reverse-proxied to
# macro-api before file serving), so an API router gates itself or not at all.
# tests/test_site_access_boundary.py says as much and scopes itself out of it.
#
# That assumption went unchecked once and should not again. The 2026-08-11
# serving-boundary census found `/api/government-revenue/*` answering 200 to an
# anonymous reader across all 24 routes, while its sibling desk's
# `/api/capital-structure/v1/coverage` answered 401. RULED (2026-08-11):
# unintentional — auth was never wired, not removed (no commit in the file's
# history ever carried `Depends`), no doc ever stated an access tier, and the
# two routers that ARE deliberately public (app/hub.py,
# app/company_intelligence.py) both say so in their module docstring, which
# app/government_revenue.py did not. It is now site_full-gated router-wide and
# proven over HTTP by tests/test_government_revenue_api_auth.py.
#
# The argument for leaving it open — "the underlying facts are public
# USAspending records" — is true of the INPUTS and does not carry the payload:
# the routes serve the resolved issuer<->UEI/CAGE graph, revision-aware award
# history and house-scored fields (company `confidence` tiers; the weighted,
# rank-ordered `company_candidates` rail), which the program's own masterplan
# calls its moat. Public inputs do not make a derived product free.
#
# Note also that "authority tier: display/context only" in that masterplan is an
# EPISTEMICS tier (may a signal rank/size/gate a trade — no), not an ACCESS tier
# (must a reader be entitled — yes). Conflating the two is what left it open.
#
# KNOWN GAP, deliberately not closed here: `/government-revenue-data/` is
# default-deny but NOT under `premium.enforced_early`, so while PAYWALL_ENABLED=0
# a registered Free account can still direct-fetch the bulk artifacts the API now
# gates (dossiers.json alone is ~42 MB). `/capital-structure-data/` is listed
# below for exactly this reason. Closing it is a one-line prefix add, but this
# file's own rule requires the matching plans-page line in the same PR — that is
# a product/pricing statement, so it is flagged for the operator rather than
# taken unilaterally.
schema: site_access.v1

public:
  exact:
    - /
    - /index.html
    # Entity page (SEO_SUPERCHARGE_MASTERPLAN §0.10). Public for the same
    # structural reason the legal pages are: a page whose whole job is to tell a
    # stranger — and a crawler that has never had a session — who we are cannot
    # sit behind a wall that asks them to prove who THEY are first. No signals,
    # no customer data, no write surface.
    - /about.html
    - /plans.html
    # Free signal-stack lead magnet. Rank 1 exposes its matching tickers; paid
    # rows are omitted server-side and render only counts + the trial CTA, so
    # the public shell contains no premium ticker payload.
    - /confluence_screener.html
    # Public acquisition dashboards. macro/start expose the broad market read;
    # macro drill-downs still require registration. us_stocks applies the
    # anonymous=1 / Free=3 / paid=full summary preview in tier_preview.js.
    - /macro.html
    - /start.html
    - /us_stocks.html
    # Research Vault preview. Anonymous visitors see the latest three summaries
    # and a Pro upgrade wall; the original PDFs remain private behind the
    # authenticated /api/research/view and /api/research/download routes.
    - /research_vault.html
    - /research_vault_app.js
    # Public evidence-first product shell. All analytical reads remain behind
    # authenticated no-store API routes; only the SEO/context shell is public.
    - /market_memory.html
    # Tier-preview shells, promoted from free_registered to ANONYMOUS-public
    # (SEO_SUPERCHARGE_MASTERPLAN §A1/W1a). The pages themselves are preview
    # SHELLS: honest totals + methodology + a small newest-first preview slice +
    # a bilingual upgrade wall, with the controls baked inert. Every paid row
    # lives in the payloads listed under premium.enforced_early below
    # (/premiumdata/ prefix plus the two raw snapshots), which are unchanged by
    # this promotion and keep 403ing anonymous and Free alike. Nothing about the
    # split moved — only who may read the shell.
    #
    # Why anonymous rather than registered: special_situations is the ONE desk
    # Google ever rewarded (41 impressions of demand) and the registration wall
    # 302s Googlebot, which never has a session, into /?signin=1 — a soft-404
    # shape that costs the crawl and gains nothing, since the shell holds no paid
    # rows to protect. The wall the visitor meets is the UPGRADE wall, which is
    # the product statement we actually want a stranger to read.
    - /special_situations.html
    - /china_special_situations.html
    - /etfs.html
    # china_heatmap.html — the A-share sector treemap, opened by
    # SEO_SUPERCHARGE_MASTERPLAN W2 (spec:
    # research/seo_supercharge/W2_HEATMAP_ETFS_PREVIEW_SPEC.md, Part A). This one
    # is neither of the two shapes above. The Special Situations shells were
    # already split and W1a moved only their access class; etfs.html was fully
    # server-rendered and had to have its graded rows taken off the URL. The
    # heatmap shipped ZERO content: a 76-line shell that built every tile, stat
    # and mover in the browser, so flipping the boundary alone would have handed
    # Google a thin-content 200 in place of a 302 — the same soft-404 shape this
    # program exists to undo, with the worse failure mode that Google keeps it.
    # The same PR therefore server-renders the summary layer (market pulse,
    # breadth stats, sector ladder, both mover boards) so the page has real
    # above-the-fold content before any JS runs.
    #
    # What is free is nearly everything, and honestly so: a heatmap of market
    # performance IS market context. Returns, breadth, medians, sector strength,
    # market-cap sizing, biggest movers and every one of the ~1,500 tiles are how
    # the market traded, not something we compute. The single walled surface is
    # our graded read on one name (band, 0-100 score, verdict), which reaches the
    # page only through <market>stockdata/<T>.json — a path this file does not
    # list, so it keeps its default-deny class and the hover card renders a
    # locked slot instead. So the page gets one gate note, one micro-wall inside
    # the hover card and one CTA row: no .tier-wall, because a wall over content
    # that is free would be a lie, and five walls on a free page would be nagging.
    #
    # Only china flips here. hk_heatmap.html and canada_heatmap.html run the same
    # template and builder and adopt the preview by adding one line each — the
    # page reads its gate state from THIS list, so the boundary and the wall can
    # never disagree.
    - /china_heatmap.html
    # The tile map itself. It IS the free content: without it the treemap never
    # draws for an anonymous visitor, and it carries only returns, sector labels,
    # market-cap sizing and (W2 T-A2) the two market facts the hover card shows —
    # last close and distance from the 200-day average. No score, no ranking, no
    # verdict; the graded block stays in the per-ticker files, which stay gated.
    #
    # Registered deliberately rather than assumed: this hands a clean daily-close
    # A-share returns dataset to any scraper. It is the same data the page renders
    # anyway, on a daily-close cadence with the delay disclosed, so it is free by
    # the same policy that makes the public quote planes free — but it is a give,
    # and the give is the point (W2 spec T-A1, ACCEPTED).
    #
    # marketdata/sp500_heatmap.json is NOT here: it is served from the VPS live
    # plane through @vps_external and has its own handling. Leave it alone.
    - /marketdata/china_heatmap.json
    # etfs.html — the fund-conviction desk, converted to a tier-preview shell and
    # opened to anonymous visitors by SEO_SUPERCHARGE_MASTERPLAN W2 (spec:
    # research/seo_supercharge/W2_HEATMAP_ETFS_PREVIEW_SPEC.md, Part B). Unlike
    # the two shells above, this page was NOT already split: the same PR that
    # opens it also moves every graded row off the URL. What ships free is the
    # header, the honest totals, a non-graded stance line derived only from the
    # rotation backdrop, that backdrop in full, the complete 77-fund coverage
    # directory and the disclosure footer. What does NOT ship is the ranked
    # consensus board, the fresh-conviction cards, every per-fund add and the
    # trim shelf — all of it in /premiumdata/etfs.json, which the
    # premium.enforced_early prefix below 403s for anonymous and Free alike.
    # Zero stock rows are free here: both boards are best-first, and previewing a
    # best-first board hands over its head, which is the part people pay for.
    # Support desk (SEE W2). Public by construction: the people who most need it
    # are the ones who cannot sign in, and a contact form behind a registration
    # wall is a contact form that never receives the account/billing tickets it
    # exists for. The page ships no signals and no customer data; its one write
    # surface (POST /api/support/ticket) is abuse-hardened server-side.
    - /support.html
    # Unsubscribe (SEE W4). Public for a harder reason than the support desk: a person
    # who wants our marketing email to stop must never be asked to sign in first, and
    # RFC 8058 one-click has no session to present. The page reads a signed HMAC token
    # and mutates nothing on load; its one write surface (POST /api/email/unsubscribe)
    # authorises on that token alone. Deliberately kept OUT of the sitemap
    # (lib/seo.py _EXCLUDE_NAMES) — public to reach, not a page to index.
    - /unsubscribe.html
    # Legal pages — public so anyone (and search crawlers) can read them without
    # an account. Static est-article pages built from content/seo/pages/*.md.
    - /privacy.html
    - /terms.html
    - /disclaimer.html
    - /favicon.svg
    - /favicon.ico
    - /apple-touch-icon.png
    - /robots.txt
    # IndexNow ownership proof (engine/marketing/indexnow.py). The file contains
    # only the submission key, which is PUBLIC by protocol design: ownership is
    # demonstrated by serving the same string the API call carries, so a secret
    # here would defeat the mechanism. Bing/Yandex/Seznam fetch it on every
    # submission — if it is not public, no URL we push is ever accepted.
    - /88bb90b05303e3cf469878ebc4dc7543.txt
    - /sitemap.xml
    # Public machine-readable discovery documents. They contain marketing
    # metadata only; no generated signals or protected data.
    - /llms.txt
    - /brand-facts.json
    - /onboard.css
    - /onboard.js
    - /tier_preview.css
    - /tier_preview.js
    # Page stylesheets for the two hand-edited plain-copy pages (#3676). They
    # carry the styling that used to ride inline inside index.html / chat.html,
    # so they are exactly as public as the pages themselves — and must be, or
    # the landing ships unstyled to every anonymous visitor. Presentation only:
    # no signals, no customer data, no application logic. chat_nav.css used to
    # sit here as chat.html's second block; it was a frozen fork of the mega-menu
    # half of navigation-refresh.css, styling markup the shared partial no longer
    # emits, and was deleted when chat.html adopted the canonical header
    # (scripts/sync_chat_nav.py). navigation-refresh.css below now covers it.
    - /landing.css
    # Shared choreography for the public landing and product-story pages.
    # Presentation only: no market payloads, account state, or customer data.
    - /scene-motion.css
    - /scene-motion.js
    - /chat.css
    - /theme.css
    # Public Market Memory shell assets. They contain presentation/read-client
    # logic only; every analytical payload remains behind the authenticated API.
    - /market_memory.css
    - /market_memory.js
    # Shared navigation layout + animated ticker search. Presentation only; the
    # protected stock libraries it reads remain behind the registration wall.
    - /navigation-refresh.css
    # Public visual dependency imported by theme.css. Contains only the shared
    # navigation icon masks; no customer data or application logic.
    - /product-nav-icons.css
    # Empty in the repository and atomically generated from the VPS environment
    # after each publish. It exposes only Logo.dev's browser-safe image token.
    - /logo_config.js
    # Lazy company-logo adapter. Contains no token and no market data; without a
    # runtime publishable token it renders deterministic local monograms.
    - /stock-logos.js
    - /theme.js
    # Presentation/runtime code required by the three public dashboard shells.
    # The signal-bearing JSON endpoints these scripts request remain outside
    # this allowlist and therefore keep their existing account/tier gates.
    - /dashboard-icons.css
    - /dashboard-icons.js
    - /chart_i18n.js
    - /timemachine.js
    - /tablesort.js
    - /charts.js
    - /risk_state_live.js
    - /release_publications_live.js
    - /heatmap.js
    - /stocktable.js
    - /globe-deck.js
    - /sky.js
    - /hub-welcome.js
    - /vendor/d3-array.min.js
    - /vendor/d3-geo.min.js
    - /vendor/topojson-client.min.js
    # Static Natural Earth topology consumed by the public start-page globe.
    # Contains geometry only — no signals, customer data, or account state.
    - /world-110m.json
    # Ad Central Plane O split-test shim (research/AD_CENTRAL_MASTERPLAN.md §2).
    # Must be public for the same reason theme.js is: it runs before auth resolves,
    # on anonymous visitors — who are precisely the population a landing-page test
    # measures. Contains no customer data: it reads an inline arena config, picks a
    # variant from a local id, and reports the choice. The visitor identity it is
    # joined on is the httpOnly mm_aid cookie, which this file cannot read.
    - /adtest.js
    - /account.js
    # Loaded by account.js on every page to fold the non-home country menus into
    # International. Must be public for the same reason theme.js and account.js
    # are: account.js requests it before auth resolves, so a 401 here would make
    # the browser fetch fail on every anonymous page view. Contains nav DOM
    # transform logic and reads only the market preference already in the user's
    # own session — no signals, no customer data.
    - /nav_market.js
    - /supabase.js
    - /data_base.js
    - /live.js
    - /live_config.js
    # VPS live plane. These are published by atomic rename into
    # /var/lib/macro-live/public (site/live/ is gitignored); the repo copy is
    # only the zero-downtime fallback. Quotes/breadth are display-tier market
    # context; release_publications contains official public event facts only.
    #
    # THIS LIST IS THE EXCEPTION, NOT THE PREFIX. Everything else under /live/
    # flows through Caddy's @reg_asset default-deny route. In particular
    # /live/prophet_live.json (Prophet Live provisional states, masterplan §4.4a)
    # MUST NOT join it. It names which tickers are armed and which are forming
    # today — pre-publication board membership, which is what the "don't show the
    # real board free" ruling (#3391, which regwalled /factordata/*) is about.
    # (The armed trigger LEVELS are not in it; they stay in the R2 pack.) It is
    # deliberately left undeclared everywhere in this file so it takes the
    # premium.default_tier below — the same tier as the board artifact it
    # overlays — and tests/test_prophet_live_vps_lane.py pins that.
    - /live/quotes.json
    - /live/breadth.json
    - /live/release_publications.json
    # Freshness-sentinel staleness state (masterplan W1 dead-man switch). Public
    # by design: it is the input the on-site staleness banner reads, and a
    # banner that only authenticated users can see defeats its purpose. Carries
    # only per-surface freshness verdicts and timestamps — no ticker rows,
    # scores, or customer data.
    - /live/staleness.json
    - /prophet/showcase.json
    # Claim-bounded methodology only: explicitly reports that live forecasts,
    # screener data, and the event graph are not yet commissioned. It contains
    # no ticker rows, scores, customer data, or proprietary market payload.
    - /seasonalitydata/methodology.json
    # Stock seasonality calendar clock — the two git-tracked files of that
    # artifact set. Public because the payload carries no forecast, no score and
    # no cross-symbol ordering: it is computed calendar statistics over public
    # split/dividend-adjusted price history, shipped WITH the selection
    # accounting that prices them (a per-symbol familywise null plus a
    # program-level fire rate against the 5% chance expectation), and the
    # methodology manifest describing exactly this has been public since the
    # foundation landed.
    #
    # THIS LIST IS THE EXCEPTION, NOT A PREFIX — deliberately, and for a reason
    # that is about delivery rather than sensitivity. The ~290 per-symbol entity
    # files are gitignored and served from Cloudflare R2 (publish_r2 --dirs
    # seasonalitydata/entities), so they never pass through Caddy at all and a
    # /seasonalitydata/ prefix here would widen the boundary for nothing. The one
    # entity file below is the default symbol, kept committed so the page has an
    # honest first paint (and something indexable) without R2.
    - /seasonalitydata/index.json
    - /seasonalitydata/entities/SPY.json
    # Calendar Clock (stock_seasonality). Public by product ruling: the page makes
    # NO forecast and NO ranking — it is an explorer over public price history, so
    # there is no premium payload behind it in this tranche. Two more reasons it
    # cannot sit behind the wall: /seasonalitydata/methodology.json is already
    # public, and a public methodology pointing at a gated page is incoherent; and
    # "stock seasonality" is the search term the incumbent's traffic rests on, which
    # a registration-walled page can never earn. Its CSS/JS are presentation and
    # client-side arithmetic only — every heavy per-symbol panel is fetched from R2
    # through DATA_BASE and never passes through Caddy. When the cross-symbol
    # screener lands it gets the tier-preview treatment (docs/TIER_PREVIEW_PATTERN.md,
    # the confluence_screener precedent) — that is where the paid boundary belongs.
    - /stock_seasonality.html
    - /stock_seasonality.css
    - /stock_seasonality.js
    # Filing Forensics presentation + client. The SHELL was opened to anonymous
    # visitors by the 2026-08-04 *.html change, but these two were never
    # promoted with it, so the page served a 200 whose stylesheet and script
    # both 401'd: an unstyled, non-functional skeleton of a paid product, which
    # is the worst of both boundaries — it protects nothing a stranger wanted
    # and advertises nothing we sell.
    #
    # Safe because the split is already where it belongs. Neither file carries a
    # finding, a company row, a receipt field or any embedded payload: the CSS
    # is presentation, and the JS is a pure fetcher whose only two network calls
    # are /api/forensics/state and /api/forensics/v1/attested-history. Both of
    # those routes stay untouched behind require_site_full_user (401 signed out,
    # 403 unentitled), so promoting the client changes who can read the
    # WORKBENCH, never who can read the WORK. The page's own preview shell is
    # server-rendered into fundamental_forensics.html and contains product
    # anatomy, methodology, the SEC basis and two aggregate totals — the number
    # of companies read and the number of changes ranked — but no rows to
    # protect. The totals are free by the rule templates/tier_preview.js states
    # outright: a count names nobody, while the member rows are the product.
    # They are projected field by field from the private summary by
    # build_fundamental_forensics.public_summary_projection(), which can emit
    # only those two integers, so no symbol, ranking or finding can reach a
    # public byte through them.
    - /fundamental_forensics.css
    - /fundamental_forensics.js
    # Existing Terminal ingest compatibility. Remove after the separate
    # Terminal session moves these fetches behind authenticated transport.
    - /factordata/tech_lab.json
  prefixes:
    - /assets/css/
    # Content-hashed page scripts, minted by scripts/externalize_css.py from
    # inline `<script data-externalize>` blocks. Same shape as the CSS tree
    # beside it: derived, per-page presentation code with no signal payload —
    # the render-time DATA those scripts read stays inline in the (gated) HTML.
    # The hash IS the filename, so an edit mints a new URL and the Caddyfile's
    # @public_versioned immutable-1y rule can never serve stale bytes.
    - /assets/js/
    - /assets/landing/
    - /factordata/tech_events/
    # Free SEO estate (active product ruling / PR #3387).
    - /stocks/
    - /products/
    - /tools/
    - /learn/
    - /blog/
    # Per-report SEO landing pages + crawl hub (#3392/#3487): public teaser with
    # the in-page Pro gate; full summaries + PDFs stay behind /api auth.
    - /research/
    - /fonts/

# These remain account-gated, but do not require a paid entitlement when the
# premium switch is armed. They are the free-tier hook specified by the
# monetization masterplan. Everything not public/free/deny is Insider+ by
# default, so a newly generated engine artifact cannot silently become public.
#
# A page listed here may still be a PAID surface: the tier-preview pattern
# (docs/TIER_PREVIEW_PATTERN.md) serves a free-visible preview shell at the
# canonical URL and keeps the paid content in a separate /premiumdata/ payload
# that this policy enforces. Listing the shell here is what lets a Free account
# see the preview instead of the lock interstitial once the paywall is armed.
free_registered:
  exact:
    - /news.html
    - /china_news.html
    - /methodology.html
    - /coming-soon.html
    - /report_bessent_jun24.html
    - /regime_timeline.json
    # PRESS-FEEDS B4a live-wire rail (D05 Addendum 2 §6). The news.html audience is
    # exactly this tier: the X account is the teaser, the signed-in wire is the
    # retention surface + registration driver. Published by atomic rename into
    # /var/lib/macro-live/public/live/ by the fastlane daemon (display-tier breadth,
    # honest corroboration chips — no ranked signal); the repo copy is dev-only and
    # gitignored. Kept free_registered (NOT public): registered users only, unlike
    # /live/quotes.json's public breadth. No Caddyfile change — an un-allowlisted
    # /live/wires.json already flows through the @reg_asset default-deny route.
    - /live/wires.json
    # Durable companion to the speed wire: merged stories, source receipts,
    # session-market context, and review-only X drafts. Same registered-news
    # product tier as news.html and wires.json; never public/anonymous.
    - /live/intelligence.json
    # (The two Special Situations tier-preview shells moved UP to public.exact on
    # 2026-08-02 — SEO_SUPERCHARGE_MASTERPLAN W1a. Their paid payloads are still
    # enforced under premium.enforced_early below; only the shells opened.)
    # BioCatalyst's registered preview shell contains no study facts. The
    # same-origin ClinicalTrials.gov API remains code-enforced at site_full, so
    # this page can explain and load the workspace without leaking its records.
    - /biocatalyst.html
    # Presentation and authenticated API client paired with the registered
    # preview shell. Neither asset embeds study facts; keeping them at the same
    # tier prevents an entitled-but-free user receiving a bare inert document.
    - /biocatalyst.css
    - /biocatalyst.js
  prefixes:
    - /news/
    - /chinanews/
    - /macrodata/

# Build previews and internal QA surfaces are not customer content. They return
# 404 even to an entitled user and even while PAYWALL_ENABLED=0.
deny:
  exact:
    - /_mockup_ccw_credit_desk.html
    - /_mockup_research_vault.html
    - /qa_bottom_sensors.html
    - /status.html
  prefixes: []

premium:
  default_tier: essential
  required_feature: site_full

  # Paths whose premium requirement is enforced RIGHT NOW, ahead of the
  # site-wide PAYWALL_ENABLED launch switch. `PAYWALL_ENABLED=0` keeps the rest
  # of the estate in staging (registered users see everything); these paths do
  # not wait for it, so a paid desk can ship one surface at a time.
  #
  # Rules for anything added here:
  #   * it must be a data payload, never a whole page — the page URL keeps a
  #     free-visible preview shell so a Free account gets product, not a wall;
  #   * the preview shell must not contain the payload's rows (the split is the
  #     boundary; a client-side hide is a marketing wall, not a gate);
  #   * add the matching plans-page line in the same PR — the feature list and
  #     the gate are one product statement.
  # See docs/TIER_PREVIEW_PATTERN.md.
  enforced_early:
    exact:
      # The desk's per-ticker context emit (setup grade/score/tier/washout). No
      # browser fetches it — engines read it off disk — so gating the URL closes a
      # direct-link leak of the same paid signal the page now gates.
      - /allocationdata/special_situations.json
      # The China desk's raw snapshot — the same named rows the page now gates,
      # in machine form (unlock/letter queues, the ranked boards, the by_ticker
      # rollup). Only server-side readers touch it (engine/china_intel_hub.py and
      # scripts/build_china_altdata.py read it off disk), so gating the URL closes
      # a direct-link leak without breaking anything.
      - /chinaspecialdata/special.json
    prefixes:
      - /premiumdata/
      # Canonical/public projection twins may be published for controlled
      # server-side distribution, but browser reads must stay on the private
      # API. Lock the whole static estate so a guessed direct URL cannot bypass
      # the Capital Structure desk entitlement boundary.
      - /capital-structure-data/
