  scored_consumers: []
  notes: >
    CN lane novelty-v0 PIT-correct challenger claims (W4 re-backfill). Uses
    utc=True tz normalisation so CN seendate strings are no longer coerced to NaT,
    and echo_stats asof filter prevents future-corroboration inflation. These are
