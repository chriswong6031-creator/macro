# config/qual_ladder.yml — Qualitative-Signal Promotion Ladder Registry
#
# Spec reference: §2.1 (Claim Passport), §3 (promotion protocol),
# research/QUALITATIVE_INTELLIGENCE_UPGRADE_BY_FABLE.md
#
# LADDER STATES (§3):
#   DISPLAY    — rendered, salience-eligible, NO arithmetic on traded pages
#   SHADOW     — computed + claim-registered + graded nightly; never rendered as conviction
#   CONFIRMER  — passed §3 gate: n_dates>=25, wilson_ci_low>0 vs matched control,
#                incremental info over price+VIX, block-bootstrap stable
#   SCORED     — composite-level re-validation + 63d OOS accrual
#
# AUTO-DEMOTION: rolling-window CI falls below zero → back one rung, pinned with
# reason/date (narrative_regime precedent).
#
# HONEST SEEDING (2026-07-02): per the scoreboard facts in the W3 brief —
#   placebo entity |excess|=6.17% (n=158), hand china_news HIGH/LOW ≈6.3/6.6% (n=230/262)
#   → indistinguishable from placebo → NOTHING has passed the §3 gate yet.
#   All fields start DISPLAY or SHADOW. The two known leaks (altdata→scored pages,
#   policy lean→intel_hub) are DISPLAY with grandfathered:true and an explicit
#   gated_by note so the linter passes today and the debt is visible.
#
# FIELD CONVENTIONS:
#   field:        the Python attribute/key name as read from the data artifact
#   producer:     engine module that emits the field
#   claim_family: qledger claim_family tag (for track_record.json grouping)
#   ladder_state: DISPLAY | SHADOW | CONFIRMER | SCORED
#   max_weight:   maximum allowed weight in any composite (null = display-only / no cap yet)
#   grandfathered: true = W0 interim gate keeps the read alive; MUST be removed once
#                  the §3 gate produces a verdict
#   gated_by:     the W0 code-level gate that limits blast radius while UNGRADED
#   scored_consumers: list of engine modules that consume this field in a scoring
#                     context (used by the linter); CONFIRMER+ required for scored reads

# ---------------------------------------------------------------------------
# ALTDATA — Signal Intelligence Desk (engine/altdata_emit.py → site/altdata/*.json)
# ---------------------------------------------------------------------------
altdata.signal_score:
  field: signal_score
  artifact_glob: "site/altdata/mastermind.json"
  producer: engine/altdata_emit.py
  claim_family: altdata
  ladder_state: DISPLAY
  max_weight: null
  grandfathered: true
  gated_by: >
    W0 gate: 'n_scored>0' condition on altdata artifact; the field's arithmetic
    consumption in radar_ticker/radar_plus/intelligence is retained for display
    ranking only (not as a direction-signed bet) until §3 gate clears.
  scored_consumers:
    - engine/radar_ticker.py
    - engine/radar_plus.py
    - engine/intelligence.py
    - engine/intel_hub.py
  notes: >
    altdata signal_score at 5d is indistinguishable from placebo (§2.1 scoreboard fact).
    Arithmetic reads in scored consumers are grandfathered with n_scored>0 gate; must
    be re-evaluated when n_dates>=25 in the qledger track record.

