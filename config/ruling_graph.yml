---
# config/ruling_graph.yml — Canonical case-law store for the Macro Dashboard.
#
# Build products (never edit by hand):
#   site/neuralwebdata/ruling_graph.json  — public-research rows, CI-verified
#   docs/NEURAL_WEB_CASE_LAW.md          — full case-law reference doc
#
# Regenerate: python3 scripts/build_ruling_graph.py
# Check:      python3 scripts/build_ruling_graph.py --check
# CI guard:   scripts/check_ruling_conflicts.py
#
# Append-friendly layout: each ruling is a `- ruling_id: ...` block,
# two-space indents, no YAML anchors/aliases, plain strings.
# Use `>` folded blocks only for ruling/scope_fence/notes where needed.
# The orchestrator (Fable) will append ~100 more extracted rows after v1 seed.

meta:
  schema: neuralweb.ruling_graph.v1
  frozen_by: research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
  precedence_order:
    - constitution_standing_law    # rank 1 — CLAUDE.md, engine/neuralweb/constitution.py
    - fable_adjudication_doc       # rank 2 — frozen Fable masterplans and adjudication docs
    - ratified_pr_body             # rank 3 — merged PR body / squash description
    - synapse_config_law           # rank 4 — config/synapse.yml notes / config/dag.yml
    - code_guard_docstring         # rank 5 — CI guard scripts and engine docstrings
    - data_row_status_log          # rank 6 — data/experiments/registry_seed.json, governance.jsonl
    - research_packet              # rank 7 — Codex / Fable-exit research handoffs
  status_vocab:
    - active_law
    - adopted
    - residue_adopted
    - deferred
    - killed
    - no_build
    - duplicate
    - blocked
    - superseded
  object_kind_vocab:
    - constitution
    - process
    - lobe
    - rail
    - wave
    - study
    - context
    - data_contract
    - signal_family
  authority_vocab:
    - A0_OBSERVE
    - A1_EXPLAIN
    - A2_ATTEND
    - A3_DE_ESCALATE
    - A4_QUARANTINE
    - A5_GOVERN_TIERS
    - A6_TUNE
    - A7_ORIGINATE
  privacy_vocab:
    - public_research
    - internal_only
  # known_fdr_families: populated by grepping the repo for fdr_family tokens.
  # Grep command used:
  #   grep -rhoE "fdr_family['\"]?\s*[:=]\s*['\"]?[a-z0-9_]+" \
  #     config/ engine/ scripts/ research/ data/neuralweb/ \
  #     | grep -oE "[a-z][a-z0-9_]+" | grep -v "^fdr$|^family$" | sort -u
  # Run date: 2026-07-06. dedupe+sort applied; partial prefix "leadlag_" normalized to leadlag.
  known_fdr_families:
    - alpha_grammar_confluence_v1
    - cortex
    - cycle_pattern_analog
    - cycle_pattern_ft
    - cycle_pattern_lattice
    - dilution_hazard
    - esx_decline_geometry
    - esx_ev_blackout
    - esx_htf_turn
    - esx_htf_turn_dose
    - esx_null_competitors
    - esx_ql_overlay
    - esx_sq_phase0
    - esx_underwater
    - esx_vol_transition
    - esx_washout_x_turn
    - leadlag
    - long_hold
    - macro_context
    - macro_tx
    - operator
    - ota_qual
    - replay
    - short_side
    - staleness_delay_v1
    - stock_personality_compat
    - turn_pr
  site_privacy_tokens:
    - held_book
    - held-book
    - fill_price
    - fills_ledger
    - avg_cost
    - cost_basis
    - position_size
    - book_positions
  public_token_denylist:
    - glassnode
    - swissblock
    - hedgeye
    - dannytrades
    - "danny trades"
    - held_book
    - fill_price
    - avg_cost
    - cost_basis
    - position_size

rulings:

  - ruling_id: RUL-CL-1
    local_id: CL-1
    short_name: canonical-source-of-truth
    title: config/ruling_graph.yml is the single canonical case-law store
    ruling: >
      `config/ruling_graph.yml` is the single canonical store of case-law rows;
      `site/neuralwebdata/ruling_graph.json` and `docs/NEURAL_WEB_CASE_LAW.md`
      are deterministic build products of it, and no `data/` JSONL ledger exists in v1.
    status: active_law
    object_kind: process
    owner_program: ruling-graph
    authority_ceiling: null
    privacy_class: public_research
    scope_fence: null
    forbidden_actions:
      - create a data/ JSONL ledger for rulings
      - edit site/neuralwebdata/ruling_graph.json by hand
      - edit docs/NEURAL_WEB_CASE_LAW.md by hand
    unblock_condition: null
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
    source_quote: >
      `config/ruling_graph.yml` is the single canonical store of case-law rows;
      `site/neuralwebdata/ruling_graph.json` and `docs/NEURAL_WEB_CASE_LAW.md`
      are deterministic build products of it, and no `data/` JSONL ledger exists in v1.
    source_pr: null
    supersedes: []
    superseded_by: []
    nondelegable: true
    match_terms:
      - ruling_graph.yml
      - JSONL ledger
      - case-law store
    aliases: []
    notes: >
      git history is the event log; a forward ledger would create a nightly-advancer
      obligation (house ledger law) with no consumer. Supersession is expressed in-row
      (supersedes/superseded_by), and the YAML is the review surface Fable/operator edit.

  - ruling_id: RUL-CL-2
    local_id: CL-2
    short_name: two-axis-vocabulary
    title: Status and object_kind are separate vocabulary axes
    ruling: >
      Codex's single 12-class list conflates disposition with object kind; the frozen
      vocabulary is two axes: `status` ∈ {active_law, adopted, residue_adopted, deferred,
      killed, no_build, duplicate, blocked, superseded} and `object_kind` ∈ {constitution,
      process, lobe, rail, wave, study, context, data_contract, signal_family}.
    status: active_law
    object_kind: process
    owner_program: ruling-graph
    authority_ceiling: null
    privacy_class: public_research
    scope_fence: null
    forbidden_actions:
      - use a single combined status/kind field
      - add new status or object_kind values without an adjudication amendment
    unblock_condition: null
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
    source_quote: "Codex's single 12-class list conflates disposition with object kind; the frozen vocabulary is two axes: `status` ∈ {active_law, adopted, residue_adopted, deferred, killed, no_build, duplicate, blocked, superseded} and `object_kind` ∈ {constitution, process, lobe, rail, wave, study, context, data_contract, signal_family}."
    source_pr: null
    supersedes: []
    superseded_by: []
    nondelegable: true
    match_terms:
      - status vocabulary
      - object_kind vocabulary
      - two-axis
    aliases: []
    notes: >
      A killed lobe proposal and a killed script are different objects with the same
      disposition; one axis cannot carry both.

  - ruling_id: RUL-CL-3
    local_id: CL-3
    short_name: globally-unique-namespaced-ids
    title: Ruling IDs are globally unique and namespaced
    ruling: >
      Bare in-doc labels collide across programs (RUL-7 exists in entry-stack and elsewhere;
      RUL-27..34 overlap nontech numbering), so graph `ruling_id`s are globally unique —
      already-unique house labels (RUL-F3.8, DT-R14, LH-R11, RF-6, RUL-ORTH-8) are kept
      verbatim, and colliding plain-numbered labels get a program prefix (ESX-RUL-7,
      NW-RUL-3) with the bare label preserved in `aliases`.
    status: active_law
    object_kind: process
    owner_program: ruling-graph
    authority_ceiling: null
    privacy_class: public_research
    scope_fence: null
    forbidden_actions:
      - add a row with a bare generic ruling_id that may collide with another program
      - remove program prefix from a namespaced id
    unblock_condition: null
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
    source_quote: >
      Bare in-doc labels collide across programs (RUL-7 exists in entry-stack and
      elsewhere; RUL-27..34 overlap nontech numbering), so graph `ruling_id`s are
      globally unique — already-unique house labels (RUL-F3.8, DT-R14, LH-R11, RF-6,
      RUL-ORTH-8) are kept verbatim, and colliding plain-numbered labels get a program
      prefix (ESX-RUL-7, NW-RUL-3) with the bare label preserved in `aliases`.
    source_pr: null
    supersedes: []
    superseded_by: []
    nondelegable: true
    match_terms:
      - ruling_id collision
      - globally unique
      - program prefix
    aliases: []
    notes: null

  - ruling_id: RUL-CL-4
    local_id: CL-4
    short_name: verbatim-source-quotes
    title: Every row carries a verbatim source quote; source_lines is dropped
    ruling: >
      Every row MUST carry `source_quote`, a verbatim contiguous excerpt (40–400 chars)
      from `source_doc`, and CI verifies byte-presence of every quote in its source;
      `source_lines` is dropped from the schema.
    status: active_law
    object_kind: process
    owner_program: ruling-graph
    authority_ceiling: null
    privacy_class: public_research
    scope_fence: null
    forbidden_actions:
      - omit source_quote from any row
      - use source_lines instead of source_quote
      - write a source_quote that is not a verbatim substring of source_doc
      - originate ruling text from LLM memory without a verifiable source
    unblock_condition: null
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
    source_quote: "Every row MUST carry `source_quote`, a verbatim contiguous excerpt (40–400 chars) from `source_doc`, and CI verifies byte-presence of every quote in its source; `source_lines` is dropped from the schema."
    source_pr: null
    supersedes: []
    superseded_by: []
    nondelegable: true
    match_terms:
      - source_quote
      - verbatim quote
      - anti-hallucination
    aliases: []
    notes: >
      Line numbers rot on edit; quotes are self-verifying. This is the
      anti-false-certainty guarantee: a row whose quote cannot be found does not merge,
      therefore LLM-invented law cannot merge. This mechanically enforces
      "no LLM-authored ruling rows" — LLMs transcribe, never originate.

  - ruling_id: RUL-CL-5
    local_id: CL-5
    short_name: precedence-order
    title: Seven-level precedence order governs ruling conflicts
    ruling: >
      Precedence: (1) Constitution / CLAUDE standing law, (2) Fable masterplan or
      adjudication doc, (3) ratified PR body, (4) synapse/config law, (5) code
      guard/docstring, (6) data row or status log, (7) Codex/Fable-exit research
      packet; on conflict the lower-precedence row must cite `superseded_by`.
    status: active_law
    object_kind: process
    owner_program: ruling-graph
    authority_ceiling: null
    privacy_class: public_research
    scope_fence: null
    forbidden_actions:
      - allow a lower-precedence row to override a higher-precedence row without citing superseded_by
    unblock_condition: null
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
    source_quote: >
      Precedence: (1) Constitution / CLAUDE standing law, (2) Fable masterplan or
      adjudication doc, (3) ratified PR body, (4) synapse/config law, (5) code
      guard/docstring, (6) data row or status log, (7) Codex/Fable-exit research
      packet; on conflict the lower-precedence row must cite `superseded_by`.
    source_pr: null
    supersedes: []
    superseded_by: []
    nondelegable: true
    match_terms:
      - precedence order
      - superseded_by
    aliases: []
    notes: Codex order adopted verbatim.

  - ruling_id: RUL-CL-6
    local_id: CL-6
    short_name: conflict-checker-severities-v1
    title: Conflict checker hard-fails on FDR family and privacy tokens only (v1)
    ruling: >
      The v1 checker hard-fails on exactly two crisp classes — (a) a new `fdr_family`
      token not present in the graph's known-families set, and (b) held-book/fill/position
      tokens appearing under public `site/` paths — and everything else (killed-idea
      re-proposal without citation, deferred-before-clock, lobe-charter language, quote
      drift, expired clocks) is WARN in v1.
    status: active_law
    object_kind: process
    owner_program: ruling-graph
    authority_ceiling: null
    privacy_class: public_research
    scope_fence: >
      WARN-to-HARD ratchet for killed-idea re-proposal and lobe-charter language is
      registered as W5 come-back wave; do not escalate until the graph has two clean weeks.
    forbidden_actions:
      - add new HARD checks to check_ruling_conflicts.py without an adjudication amendment
      - hard-fail lobe-charter language before graph becomes the charter registry
    unblock_condition: Two clean weeks with graph as charter registry (W5 come-back).
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
    source_quote: >
      The v1 checker hard-fails on exactly two crisp classes — (a) a new `fdr_family`
      token not present in the graph's known-families set, and (b) held-book/fill/position
      tokens appearing under public `site/` paths — and everything else (killed-idea
      re-proposal without citation, deferred-before-clock, lobe-charter language, quote
      drift, expired clocks) is WARN in v1.
    source_pr: null
    supersedes: []
    superseded_by: []
    nondelegable: true
    match_terms:
      - conflict checker
      - hard-fail severity
      - WARN severity
    aliases: []
    notes: >
      Codex proposed hard-fail for lobe charters and privacy changes broadly; lobe
      charters have no machine-readable registry yet, so a HARD gate would be a vibes
      gate. WARN until the graph itself becomes that registry.

  - ruling_id: RUL-CL-7
    local_id: CL-7
    short_name: deterministic-matching-only
    title: Re-proposal detection uses deterministic diff-aware substring scan only
    ruling: >
      Re-proposal detection is a deterministic, diff-aware substring scan of each row's
      curated `match_terms` against changed research/config files, requiring the ruling_id
      string to appear in the changed file to clear; no LLM matching runs in CI.
    status: active_law
    object_kind: process
    owner_program: ruling-graph
    authority_ceiling: null
    privacy_class: public_research
    scope_fence: null
    forbidden_actions:
      - use LLM or fuzzy/semantic matching in CI re-proposal detection
      - skip the ruling_id citation requirement for clearing a match
    unblock_condition: null
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
    source_quote: >
      Re-proposal detection is a deterministic, diff-aware substring scan of each row's
      curated `match_terms` against changed research/config files, requiring the ruling_id
      string to appear in the changed file to clear; no LLM matching runs in CI.
    source_pr: null
    supersedes: []
    superseded_by: []
    nondelegable: true
    match_terms:
      - re-proposal detection
      - LLM matching CI
    aliases: []
    notes: null

  - ruling_id: RUL-CL-8
    local_id: CL-8
    short_name: no-bespoke-clocks
    title: Clocked rows must reference experiments registry; no bespoke clock stores
    ruling: >
      A row with `come_back_on` must carry `experiment_ref` pointing at an
      experiments-registry id when a matching registry entry exists; the checker WARNs
      on clocked rows with no ref.
    status: active_law
    object_kind: process
    owner_program: ruling-graph
    authority_ceiling: null
    privacy_class: public_research
    scope_fence: null
    forbidden_actions:
      - create a second bespoke clock store separate from data/experiments/registry_seed.json
      - allow come_back_on rows to drift without experiment_ref when a registry entry exists
    unblock_condition: null
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
    source_quote: >
      A row with `come_back_on` must carry `experiment_ref` pointing at an
      experiments-registry id when a matching registry entry exists; the checker WARNs
      on clocked rows with no ref.
    source_pr: null
    supersedes: []
    superseded_by: []
    nondelegable: true
    match_terms:
      - bespoke clock
      - come_back_on
      - experiment_ref
    aliases: []
    notes: >
      RF-9 applied to the graph itself. The registry
      (data/experiments/registry_seed.json) is the house clock spine; the graph must
      not become a second, drifting clock store.

  - ruling_id: RUL-CL-9
    local_id: CL-9
    short_name: public-exposure-denylist
    title: Public JSON carries only public_research rows; denylist tokens hard-fail
    ruling: >
      `site/neuralwebdata/ruling_graph.json` carries only rows with `privacy_class:
      public_research`, and the build hard-fails if a public row contains a denylisted
      token (competitor/source names and held-book vocabulary); rows from
      personality-source adjudications default to `privacy_class: internal_only`.
    status: active_law
    object_kind: process
    owner_program: ruling-graph
    authority_ceiling: null
    privacy_class: public_research
    scope_fence: >
      Public site JSON: public_research rows only. No held-book, fill, position, or
      competitor-name tokens in any public row's serialized content.
    forbidden_actions:
      - expose internal_only rows in site/neuralwebdata/ruling_graph.json
      - include meta.public_token_denylist tokens in any public row serialized content
      - include held-book/fill/position vocabulary in public rows
    unblock_condition: null
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
    source_quote: >
      `site/neuralwebdata/ruling_graph.json` carries only rows with `privacy_class:
      public_research`, and the build hard-fails if a public row contains a denylisted
      token (competitor/source names and held-book vocabulary); rows from
      personality-source adjudications default to `privacy_class: internal_only`.
    source_pr: null
    supersedes: []
    superseded_by: []
    nondelegable: true
    match_terms:
      - public exposure
      - privacy_class
      - denylist
      - held-book vocabulary
    aliases: []
    notes: null

  - ruling_id: RUL-CL-10
    local_id: CL-10
    short_name: no-pr-template-v1
    title: No PR template section in v1; CI checker carries enforcement
    ruling: >
      The Codex-proposed PR-template YAML section is DROPPED: no PR template exists in
      this repo and `gh pr create` (the only PR path agents use) does not apply templates
      non-interactively, so the CI checker carries the enforcement instead.
    status: active_law
    object_kind: process
    owner_program: ruling-graph
    authority_ceiling: null
    privacy_class: public_research
    scope_fence: null
    forbidden_actions:
      - add a ruling_graph_checked YAML PR template to the repo in v1
    unblock_condition: null
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
    source_quote: >
      The Codex-proposed PR-template YAML section is DROPPED: no PR template exists in
      this repo and `gh pr create` (the only PR path agents use) does not apply templates
      non-interactively, so the CI checker carries the enforcement instead.
    source_pr: null
    supersedes: []
    superseded_by: []
    nondelegable: true
    match_terms:
      - PR template
      - ruling_graph_checked
    aliases: []
