      - "assume parallel nightly jobs share filesystem state"
    unblock_condition: null
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: "research/factor_intelligence/NW_INTEGRATION_ADJUDICATION_BY_FABLE.md"
    source_quote: "Nightly jobs do NOT share tree state.** Every daily.yml job does a fresh `actions/checkout@v4` + `git pull origin main`."
    source_pr: 1624
    supersedes: []
    superseded_by: []
    nondelegable: false
    match_terms:
