  - ruling_id: RUL-CL-12
    local_id: CL-12
    short_name: graph-own-authority
    title: The ruling graph is display-only context; it may never gate, rank, or score
    ruling: >
      The ruling graph is itself `object_kind: context`, `authority_ceiling: A1_EXPLAIN`,
      display-only, all authority booleans false; it may never gate, rank, score, or
      block a build by itself — its CI checker enforces *citation*, not *permission*,
      and only Fable/operator change law.
    status: active_law
    object_kind: context
    owner_program: ruling-graph
    authority_ceiling: A1_EXPLAIN
    privacy_class: public_research
    scope_fence: >
      The graph is context-only. All authority booleans false. The CI checker enforces
      citation (did the PR cite the relevant ruling?), never permission (is this action
      allowed?). Only Fable or the operator may change law.
    forbidden_actions:
      - use the ruling graph to gate a build or deployment
      - use the ruling graph to rank or score signals
      - let the CI checker block work based on authority rather than citation
    unblock_condition: null
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
    source_quote: >
      The ruling graph is itself `object_kind: context`, `authority_ceiling: A1_EXPLAIN`,
      display-only, all authority booleans false; it may never gate, rank, score, or
      block a build by itself — its CI checker enforces *citation*, not *permission*,
      and only Fable/operator change law.
    source_pr: null
    supersedes: []
    superseded_by: []
    nondelegable: true
    match_terms:
      - ruling graph authority
      - display-only graph
      - graph gates build
    aliases: []
    notes: null

  - ruling_id: RUL-CL-13
    local_id: CL-13
    short_name: succession-operator-only-acceptance
    title: Post-Fable rows proposed by anyone; accepted only by operator; nondelegable classes blocked
    ruling: >
      Fable seed rows are canonical; post-Fable rows may be *proposed* by any actor but
      *accepted* only by the operator, and rows touching authority, privacy, FDR families,
      lobe charters, or reviving a `killed` row are nondelegable — they stay blocked absent
      a frozen replacement adjudication procedure.
    status: active_law
    object_kind: process
    owner_program: ruling-graph
    authority_ceiling: null
    privacy_class: public_research
    scope_fence: >
      Nondelegable classes: authority changes, privacy class changes, new FDR family
