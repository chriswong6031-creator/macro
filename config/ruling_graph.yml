  - ruling_id: RUL-CL-11
    local_id: CL-11
    short_name: v1-scope-fence
    title: v1 ships exactly the YAML, scripts, tests, generated docs, synapse, and CI job
    ruling: >
      v1 ships exactly: the curated YAML, `scripts/build_ruling_graph.py`,
      `scripts/check_ruling_conflicts.py`, `tests/test_ruling_graph.py`, the generated
      `docs/NEURAL_WEB_CASE_LAW.md` + site JSON, synapse registration, and the CI job;
      the admin panel tab, cortex read-only tools (`read_ruling_graph` et al.), and the
      Research Factory packet hook are registered come-back waves, not v1.
    status: active_law
    object_kind: process
    owner_program: ruling-graph
    authority_ceiling: null
    privacy_class: public_research
    scope_fence: >
      v1 only: YAML + build script + conflict checker + tests + generated docs + synapse
      entry + CI job. Admin tab, cortex tools, and Research Factory hook are W2-W4.
    forbidden_actions:
      - add admin panel tab in v1
      - add cortex read_ruling_graph tools in v1
      - add Research Factory packet hook in v1
    unblock_condition: null
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: research/RULING_GRAPH_ADJUDICATION_BY_FABLE.md
    source_quote: >
      v1 ships exactly: the curated YAML, `scripts/build_ruling_graph.py`,
      `scripts/check_ruling_conflicts.py`, `tests/test_ruling_graph.py`, the generated
      `docs/NEURAL_WEB_CASE_LAW.md` + site JSON, synapse registration, and the CI job;
      the admin panel tab, cortex read-only tools (`read_ruling_graph` et al.), and the
