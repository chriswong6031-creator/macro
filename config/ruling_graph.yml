      - "treat OOS decay as evidence of true non-stationarity without null calibration"
    unblock_condition: null
    come_back_on: null
    experiment_ref: null
    fdr_family: null
    precedence_rank: 2
    source_doc: "research/pca_factor_orthogonality/R_ORTH_MASTERPLAN_BY_FABLE.md"
    source_quote: "The OOS-orthogonality-decay headline is a noise artifact, not evidence.** Opus review (2026-07-06) reproduced the diagnostic exactly, then constructed the null: at n=21, the max-|off-diagonal| PC correlation statistic has a finite-sample floor of ~0.40–0.71"
    source_pr: 1739
    supersedes: []
