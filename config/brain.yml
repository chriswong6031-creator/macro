# config/brain.yml — Brain gateway lane config (MNZ-W6a, §3.5 + Amendment 2).
#
# MNZ-R12: quotas and model ids live here, never hardcoded in the gateway.
# The loader (brain_gateway._load_brain_config) falls back to sane hardcoded
# defaults when this file is missing or a key is absent.
#
# Schema: brain_config.v1

schema: brain_config.v1

# ── Lane definitions ───────────────────────────────────────────────────────────
lanes:
  fast:
    # Primary: DeepSeek via Anthropic-compatible endpoint.
    # Fallback: claude-haiku-4-5 when DEEPSEEK_API_KEY absent/dead.
    provider_order:
      - deepseek
      - anthropic        # haiku fallback only — model overridden below
    # DeepSeek renamed its models: "deepseek-chat" was retired and now 400s
    # ("supported API model names are deepseek-v4-pro or deepseek-v4-flash").
    # Fast is the SPEED tier: v4-flash answers a one-liner in ~1.45s TTFT vs v4-pro's
    # 3.68s. v4-pro stays as Pro's degraded rung (quality backstop). Verified live
    # on the VPS key 2026-07-26.
    deepseek_model: deepseek-v4-flash
    # v4 models THINK by default (content[0] is a ThinkingBlock) — the compat endpoint
    # accepts thinking={"type":"disabled"} (probed: 2.55s → 1.15s, ~4× fewer output
    # tokens). Fast answers directly; only the pro lane pays for thinking.
    deepseek_thinking: disabled
    # The failover chain IS the retry: the SDK's default max_retries=2 re-tries the
    # SAME dead key with backoff before the next candidate is ever tried.
    client_max_retries: 0
    # SDK default is 600s — a hung candidate would stall the turn ~10min.
    client_timeout_s: 120
    deepseek_key_env: DEEPSEEK_API_KEY
    deepseek_base_url: https://api.deepseek.com/anthropic
    # Fallback model when DeepSeek unavailable (operator-configurable)
    fallback_model: claude-haiku-4-5
    max_tokens: 2000
    tool_budget: 5
    usage_lane: brain-fast

  pro:
    # Primary: claude-opus-5 (newest Opus; same $5/$25 pricing as 4.8, 1M context,
    #          adaptive thinking + effort). Fallback: claude-sonnet-4-6 when Opus unavailable.
    provider_order:
      - oauth
      - anthropic
    opus_model: claude-opus-5
    fallback_model: claude-sonnet-4-6
    # Headroom for high-effort adaptive thinking (thinking tokens count against max_tokens).
    max_tokens: 8000
    tool_budget: 10
    usage_lane: brain-pro
    # "High intensity" (operator 2026-07-25): adaptive thinking + high effort, applied ONLY on
    # the Claude Pro path (opus/sonnet/fable). NEVER sent to DeepSeek (Anthropic-compat 400s on
    # output_config/thinking) or Haiku 4.5 (effort + adaptive thinking unsupported → error).
    # See _model_supports_effort_thinking() in brain_gateway.py for the gate.
    effort: high        # low | medium | high | xhigh | max
    thinking: adaptive  # adaptive | off
    # The failover chain IS the retry (see fast lane): with every pool key weekly-capped
    # on opus, the SDK default re-tried each dead key twice at ~2.4s a candidate — 25-31s
    # of dead time per turn (measured in journalctl -u macro-api) before DeepSeek served.
    client_max_retries: 0
    # Longer than fast: high-effort adaptive-thinking answers legitimately run minutes,
    # and a NO-TOOL pro turn produces its whole 8000-token answer inside ONE
    # non-streaming create — setting any client timeout DISABLES the SDK's
    # max_tokens-scaled non-streaming timeout (it only applies at DEFAULT_TIMEOUT), so
    # this must cover the full long-answer case itself, not just "a hung candidate".
    # 240 timed out slow-but-healthy answers and then re-paid the wall per rung
    # (review MAJOR-1 on #3586).
    client_timeout_s: 600
    # NOTE: pro's degraded deepseek-v4-pro rung keeps thinking ENABLED (quality backstop
    # for a capped pool) — deliberately no `deepseek_thinking` key on this lane.
    # Degraded-capacity fallbacks (operator 2026-07-25): when the OAuth pool is fully
    # rate-capped on Opus/Sonnet (every subscription token 429s on the higher tiers —
    # observed live), serve a REAL answer from these instead of a blank/"unavailable"
    # turn. Tried in order AFTER opus/sonnet, so a healthy Opus quota always wins.
    #   deepseek-v4-pro  — metered, strong, INDEPENDENT of the capped subscriptions
    #   claude-haiku-4-5 — rides the same OAuth pool (works when a subscription's
    #                      Opus/Sonnet weekly cap is hit but Haiku still has headroom)
    # effort/thinking are auto-omitted for these (see _model_supports_effort_thinking).
    degraded_models:
      - deepseek-v4-pro
      - claude-haiku-4-5
    deepseek_key_env: DEEPSEEK_API_KEY
    deepseek_base_url: https://api.deepseek.com/anthropic
    # OAuth-pool weekly ceiling for Mastermind (operator 2026-07-25): the metabolism
    # BUILD loop backs a key off at 85% weekly (budget_gate weekly_key_stop_pct); the
    # user-facing Mastermind chat may lean on a key up to this weekly-% before it is
    # de-prioritised, leaving a subscription reserve. Soft ordering only — never excludes
    # a key (fail-open: a fully-capped pool still gets tried, then falls to the degraded
    # models). Wired via build_providers → _oauth_pool_candidates; env override
    # MASTERMIND_WEEKLY_CEILING_PCT.
    weekly_ceiling_pct: 95

# ── Per-tier request allowances (MNZ-R12: config-not-literals) ────────────────
# Periods: week = ISO week (UTC), month = calendar month (UTC),
#          trial = within current_period_end window when status='trialing'
quotas:
  free:
    fast:
      limit: 5
      period: week
    pro:
      limit: 0
      period: month

  trial:
    # status='trialing' uses trial allowances regardless of tier name
    fast:
      limit: 25
      period: trial
    pro:
      limit: 3
      period: trial

  insider:
    fast:
      limit: 300
      period: month
    pro:
      limit: 10
      period: month

  pro:
    fast:
      limit: 1000
      period: month
    pro:
      limit: 150
      period: month

# ── Token backstop ceilings per user per calendar month ───────────────────────
# First ceiling hit wins; tracked separately from request quotas.
token_ceilings:
  fast: 5000000    # 5M tokens/month per user on fast lane
  pro: 2000000     # 2M tokens/month per user on pro lane

# ── Tier resolver cache TTL ───────────────────────────────────────────────────
tier_cache_ttl_seconds: 60

# ── Deep Research mode (MNZ-W6b) ─────────────────────────────────────────────
# mode='research' forces the pro lane, raises the tool budget, and prepends a
# structured-report directive to the system prompt.  Pro-eligibility gated:
# requires pro quota limit > 0 AND pro quota remaining > 0 (same ledger as a
# normal Pro turn — no new quota bucket).
research:
  tool_budget: 20
  max_tokens: 8000   # token ceiling note: billed against pro lane ceiling

# Chart-command bus (MNZ-W6b) allowlists are NOT config: they mirror the Terminal chart's
# actual capabilities (its DetectCmd kinds, indicator keys, timeframe set — all defined in
# the Terminal TS code), so they live as module constants in engine/neuralweb/brain_gateway.py
# (_CHART_TF_ALLOWLIST / _CHART_INDICATOR_ALLOWLIST / _CHART_DETECTION_ALLOWLIST). Editing a
# list here would not change what the chart can do — it must track the Terminal build.

# ── Supabase thread store table names ────────────────────────────────────────
thread_tables:
  threads: brain_threads
  messages: brain_messages
