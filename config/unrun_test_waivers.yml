# Suites that are named by no `run:` step ON PURPOSE.
#
# SCHEMA: repo-relative suite path -> reason (one non-empty string). The gate in
# scripts/audit_unrun_tests.py enforces exactly that shape: a non-mapping file, a
# non-string reason, or an EMPTY reason is a hard red, because a waiver without an
# argument is a baseline row wearing a disguise. Every waived-and-unrun row is
# reprinted with its reason on every run — a waiver only stays honest while it is in
# front of whoever reads the census output.
#
# THIS IS NOT A DUMPING GROUND, and it is not the backlog. The 2026-08-09 backlog of
# 969 unrun suites lives in config/unrun_test_baseline.json, which is shrink-only.
# A row here is an EXCEPTION: it needs a measured reason, a named owner, and the
# condition under which it is deleted. The default answer for a new dark suite is to
# wire it into the job that owns its subject (see the signal-contract
# research-resident steps in .github/ci/legacy-jobs.yml for the pattern).

tests/test_entry_radar_w8_rig.py: >-
  W8 Live Entry Radar reference RIG (PR #5737). Listing this file in
  signal-contract edits .github/ci/legacy-jobs.yml, which is a global CI
  invalidator (full 194-job suite) and a ci-authority hit. Measured on
  7a21c455: that listing ran unrun-picks-boards and failed
  tests/test_us_prophet_fusion.py byte-parity (us_prophet_v2_shadow vs
  us_prophet_v2) whose engine bytes matched main. Static pins live in
  mockups/refs/entry_radar/tools/verify.py; live Playwright geometry is
  W9-COND-2. Owner: WS:LIVE-ENTRY-RADAR. Delete this row and add the file
  to the signal-contract entry-radar step when W9 production CI is
  commissioned (or when a non-invalidating pack path exists).

