# config/product_experience/page_registry_overrides.yml
#
# The ONLY hand-maintained input to data/product_experience/page_registry.json.
# Everything else in that file is derived from repo sources by
# scripts/build_product_page_registry.py and re-derived on every run.
#
# THE LAW
#   1. Judgment-only fields live here and are NEVER derived: `priority`,
#      `archetype`, `design_system`, `primary_user_question`, `owner`, plus
#      lifecycle rulings and the access/entitlement facts a static reader cannot
#      honestly see (a guest mode, a middleware redirect, an entitlement
#      resolved at request time).
#   2. Every entry SHOULD carry `evidence: [paths]` — the file(s) that make the
#      claim checkable.  An entry with no evidence is a claim with no receipt.
#      `note:` is appended to the row's notes so the reason travels with the row.
#      `why:` stays HERE and never reaches the JSON: it records why a judgment
#      call went the way it did, for the next reader of this file.
#   3. An override on a page_id that no longer exists is a HARD ERROR: the build
#      exits non-zero and prints a `::error` annotation.  Stale overrides are how
#      a registry starts describing pages that were deleted a year ago.
#   4. Only the fields in OVERRIDABLE (see the script) may be set here.  An
#      override can never invent a route, a builder, or a source template — those
#      are derived-only, so the registry cannot be talked into a page that the
#      code does not actually render.
#
# Regenerate after editing:
#   python3 scripts/build_product_page_registry.py --as-of <ISO8601>
#
# PRIORITY SCOPE (v1).  Only the P0 set is assigned here — the surfaces that
# carry acquisition, activation, or the paid product itself.  P1–P3 assignment
# is a separate work item and everything else stays `unclassified` rather than
# being filled in by whoever ran the script last.
#
# ARCHETYPE SCOPE (DS-PR-1).  Every row now carries one of the ten canonical
# archetype ids from the design-system constitution (§10) — the vocabulary is
# CLOSED and enforced by the builder, and `unclassified` is no longer used by any
# row.  An archetype names the CANONICAL COMPOSITION a route must follow, so it
# tracks what the page IS, not how important it is and not whether it is live:
# an internal mockup of a desk is still a desk.  Entries are grouped by archetype
# below; a judgment call carries `why:`.
#
# DESIGN_SYSTEM SCOPE (DS-PR-1, ratchet R0).  `design_system` is the governance
# claim for scripts/check_design_system.py.  Shape:
#   compliant:        bool, REQUIRED.  No row is compliant today.
#   governed_regions: optional [{template, region}].  ABSENT means the whole
#                     `source_template` is governed once compliant is true.
#   exempt:           optional {reason, expires: "YYYY-MM-DD"} — quote the date.
#   migrated_pr:      optional int — the PR that made the surface compliant.
#   evidence:         optional str | [str] — the migration's evidence matrix.
# `archetype` inside `design_system` is a HARD ERROR: one fact, one home.
# Only the two dashboard rows are seeded, because templates/dashboard.html.j2 is
# rendered TWICE from one file (scripts/build_site.py mode="macro" -> macro.html,
# mode="stocks" -> us_stocks.html; the body class at dashboard.html.j2:2047 is
# what separates them), so a whole-file claim there would be two claims wearing
# one hat.

