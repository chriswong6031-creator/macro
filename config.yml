    "1072.HK": Dongfang Electric

  # -- Global Risk Overlay (the PRIMARY HK driver) ----------------------------
  # Composite risk-on/off from factors mostly already in the store. sign = +1 if
  # RISING-is-risk-on, -1 if RISING-is-risk-off. copper_gold is computed in code
  # from yahoo HG=F / GC=F. Framed as a CONCURRENT risk state, not a forecast.
  global_factors:
    slope_window: 20
    baseline_window: 60
    z_threshold: 0.40
    risk_on_z: 0.30                 # composite z above this = Risk ON; below -this = Risk OFF
    min_factors: 3                  # need >= this many factors present, else risk_state = unknown
                                    # (factors start at different dates: DXY 1971 .. EEM 2003)
    components:
      dxy:    {group: yahoo, ticker: "DX-Y.NYB", sign: -1, weight: 1.0}
      vix:    {group: yahoo, ticker: "^VIX",     sign: -1, weight: 1.0, use_log: true}
      spy:    {group: yahoo, ticker: "SPY",      sign: 1.0, weight: 1.0}
      copper_gold: {sign: 1.0, weight: 1.0}      # HG=F / GC=F (global cyclical pulse)
      usdcny: {group: china, ticker: "CNY=X",    sign: -1, weight: 0.75}
      eem:    {group: hk,    ticker: "EEM",      sign: 1.0, weight: 1.0}
      vhsi:   {group: hk,    ticker: "^HSIL",    sign: -1, weight: 0.75, use_log: true}  # HK's own fear gauge (VHSI)
    peg:                            # USD/HKD convertibility band (HKD=X)
      strong: 7.75                  # strong-side = inflow/easing
      weak: 7.85                    # weak-side = outflow/HSI headwind (HKMA defends)
      pressure_pct: 25.0            # within this % of the band toward weak-end = outflow pressure

  # -- HKMA peg-funding mechanics (the actual liquidity drain when HKMA defends -
  # the 7.85 weak-side peg). Keyless JSON API. See research/HK_DATA_AUDIT.md. -----
  hkma:
    base_url: https://api.hkma.gov.hk/public/market-data-and-statistics/daily-monetary-statistics
    liquidity_segment: daily-figures-interbank-liquidity   # aggregate balance + O/N & 1m HIBOR + TWI + base rate + peg bands
    hibor_segment: hk-interbank-ir-daily                   # multi-tenor HIBOR fixing (O/N..12m)
    retries: 3

  # -- AH premium — computed basket of dual-listed pairs (H-share in HK vs A-share
  # in Shanghai/Shenzhen, FX-adjusted). A high premium = the A-share is dearer, so
  # the HK-listed H-share is the cheaper way to own the same company. H-legs are HK
  # constituents (hk_breadth cache); A-legs come from the china_search close store.
  ah_pairs:                         # H-share (.HK) : A-share twin (.SS/.SZ)
    "0939.HK": "601939.SS"          # China Construction Bank
    "1398.HK": "601398.SS"          # ICBC
    "3988.HK": "601988.SS"          # Bank of China
    "1288.HK": "601288.SS"          # Agricultural Bank of China
    "3328.HK": "601328.SS"          # Bank of Communications
    "2318.HK": "601318.SS"          # Ping An Insurance
    "2628.HK": "601628.SS"          # China Life
    "2601.HK": "601601.SS"          # China Pacific Insurance
    "0857.HK": "601857.SS"          # PetroChina
    "0386.HK": "600028.SS"          # Sinopec
    "1088.HK": "601088.SS"          # China Shenhua
    "1211.HK": "002594.SZ"          # BYD

  breadth:
    lookback_days_live: 1100        # ~3y for 200DMA/NH-NL + cycle analysis on the search library
    ma_windows: [50, 200]
    nhnl_window: 252
    min_coverage: 0.6

  # -- Engine tunables (mirror of china.engine, HK inputs) --------------------
  engine:
    scoring: {slope_window: 20, baseline_window: 60, z_threshold: 0.45, min_components: 2}
    growth_axis:
      components:
        pmi_mfg: {weight: 1.0}            # China NBS PMI vs 50 (HSI earnings are China-driven)
        hshare_hsi: {weight: 1.0}         # HSCEI/HSI ratio — H-share leadership = China-cyclical risk appetite
        tech_hsi: {weight: 0.75}          # HS-TECH/HSI ratio — growth tilt (proxy ETF, 2020->)
        cyclical_defensive: {weight: 1.0} # HK cyclical/defensive basket
        breadth_direction: {weight: 0.5}  # % above 50d direction
        global_growth: {weight: 0.75}     # copper/gold (global cyclical pulse; HK 2x sensitive)
      cyclical_basket: ["1211.HK","0016.HK","2600.HK","2388.HK","0388.HK","0175.HK"]   # auto/property/materials/financials
      defensive_basket: ["0002.HK","0003.HK","0941.HK","0291.HK","1044.HK","0006.HK"]  # utilities/telecom/staples
    inflation_axis:
      components:
        cpi_direction: {weight: 1.0}      # China CPI YoY direction
        ppi_direction: {weight: 1.5}      # China PPI YoY direction (the stable Mainland signal -> upweighted)
        inflation_beta_basket: {weight: 0.5}  # HK energy+materials vs tech
      inflation_long_basket: ["0883.HK","0857.HK","1088.HK","2600.HK","0358.HK"]   # energy + materials
      inflation_short_basket: ["0700.HK","9988.HK","3690.HK","1810.HK"]            # internet/tech
    liquidity:                            # DUAL: PBoC (China M2) + Fed-via-peg (HKD distance) + southbound
      components:
        m2_growth: {weight: 1.0}          # China M2 YoY direction (PBoC stance)
        peg_pressure: {weight: 1.0}       # HKD toward weak-end = tightening/outflow
        southbound: {weight: 0.75}        # southbound Stock-Connect flow direction (mainland into HK)
      roc_window_d: 20
      # NOTE: an HKMA Aggregate-Balance leg was tested + MEASURED — it INVERTED the
      # overlay's edge (calibration: contracting +0.78 > expanding +0.37 at 21d, vs the
      # clean monotone expanding>contracting without it; peg-defense draining coincided
      # with the 2022-25 recovery). So the Aggregate Balance ships as a descriptive
      # PANEL only (engine/hk_inputs + the HKMA peg-funding panel), NOT a scored leg.
    quad:
      hysteresis_days: 7
      shock_override_z: 0.85
    cycle:
      index_near_high_pct: 3.0
      high_window_d: 60
    sector_preferences:                   # framework-preferred HK sectors per quad (keyed by sector name)
      Goldilocks:   ["Internet & Tech","Healthcare & Pharma","Consumer","Auto & EV"]   # growth+ infl-
      Reflation:    ["Energy","Materials","Financials & Banks","Property"]             # growth+ infl+
      Stagflation:  ["Energy","Materials","Telecom & Utilities","Insurance"]           # growth- infl+
      Growth-scare: ["Telecom & Utilities","Financials & Banks","Insurance","Healthcare & Pharma"]  # growth- infl-
    rs_ranking:
      benchmark: "^HSI"
      momentum_windows: [20, 60]
      trend_window: 200
      percentile_lookback_d: 252
    calibration:
      start_date: "2005-01-01"
      split_date: "2016-01-01"
      forward_days: [21, 63]
      ladder_fwd: 21
      ladder_step: 10

# ============================================================================
# Section 5 — Canada / S&P/TSX dashboard (commodity/CAD/BoC-vs-Fed overlay;
# keyless BoC VALET + StatsCan WDS + FRED comparables). See engine/canada_*.py.
# ============================================================================
canada:
  # -- Plane A: prices (group=canada) -----------------------------------------
  yahoo:
    retries: 3
    backoff_base_s: 5
    batch_size: 60
    benchmark: "^GSPTSE"            # S&P/TSX Composite — sector-RS benchmark + market anchor (deep history)
    market_index: "^GSPTSE"        # ladder-calibration anchor
    indices:                       # ticker: display name
      "^GSPTSE": S&P/TSX Composite
      "XIU.TO": iShares S&P/TSX 60
      "XIC.TO": iShares Core S&P/TSX Composite
    fx:
      "USDCAD=X": USDCAD
    sector_etfs:                   # ticker: [plain name, representative-constituent TradingView symbol]
      "XEG.TO": [Energy, "TSX:CNQ"]
      "XFN.TO": [Financials, "TSX:RY"]
      "ZEB.TO": [Banks, "TSX:TD"]
      "XGD.TO": [Gold Miners, "TSX:ABX"]
      "XMA.TO": [Materials, "TSX:NTR"]
      "XBM.TO": [Base Metals, "TSX:TECK.B"]
      "XIT.TO": [Information Technology, "TSX:SHOP"]
      "XUT.TO": [Utilities, "TSX:FTS"]
      "XRE.TO": [Real Estate, "TSX:REI.UN"]
      "XST.TO": [Consumer Staples, "TSX:ATD"]
      "XCG.TO": [Consumer Discretionary, "TSX:QSR"]
      "XCD.TO": [Communication Services, "TSX:BCE"]

  # -- Plane B: macro — Bank of Canada VALET + StatsCan WDS + FRED comparables -
  # All keyless. The CanadaMacroAdapter fetches each stored_col independently and
  # degrades (one broken series can't kill the others); history archived forever
  # by store.upsert. One parquet per stored_col under group `canada_macro`.
  macro:
    boc_base_url: https://www.bankofcanada.ca/valet/observations
    statcan_url: https://www150.statcan.gc.ca/t1/wds/rest/getDataFromVectorsAndLatestNPeriods
    fred_base_url: https://fred.stlouisfed.org/graph/fredgraph.csv
    retries: 3
    boc_recent: 6000               # VALET observations/<series>/json?recent=N (max daily history)
    enabled: [boc, statcan, fred]  # toggle whole sources
    boc_series:                    # stored_col: VALET series name
      policy_rate: V39079          # target overnight (policy) rate
      corra: AVG.INTWO             # CORRA overnight repo average
      cpi_yoy: STATIC_TOTALCPICHANGE   # headline CPI YoY % (BoC, fast)
      goc_2y: BD.CDN.2YR.DQ.YLD    # 2Y GoC benchmark yield
      goc_5y: BD.CDN.5YR.DQ.YLD
      goc_10y: BD.CDN.10YR.DQ.YLD  # 10Y GoC
      goc_long: BD.CDN.LONG.DQ.YLD
      goc_rrb: BD.CDN.RRB.DQ.YLD   # real-return bond yield (10y - rrb = breakeven inflation)
      usdcad_boc: FXUSDCAD         # USD/CAD (BoC noon)
    statcan_vectors:               # stored_col: StatsCan vector id (POST latestN)
      unemployment: v2062815       # LFS unemployment rate (fastest hard labour read)
      gdp_monthly: v65201210       # monthly real GDP by industry (index level -> YoY in engine)
      cpi_index: v41690973         # CPI all-items index
    fred_series:                   # stored_col: FRED id (comparables + US-coupling)
      house_prices: QCAR628BIS     # BIS real residential property price (housing fragility)
      cad_reer: RBCABIS            # BIS real broad effective CAD exchange rate
      us_2y: DGS2                  # US 2Y (BoC-vs-Fed coupling spread)
      us_10y: DGS10                # US 10Y
    statcan_latest_n: 240          # months of history per StatsCan vector

  # -- Insider transactions (SEDI via yfinance) — display-only context ---------
  # SEDI (Canada's insider-filing system) has no free machine-readable feed and is
  # CAPTCHA-walled; every paid vendor's insider product is US-SEC-only. The one free
  # programmatic path is yfinance get_insider_transactions() (undocumented Yahoo
  # quoteSummary endpoint) — SEDI-sourced dated filings for many .TO names, no key.
  # We keep only PERSONAL OPEN-MARKET trades ("Acquisition/Disposition in the public
  # market"), dropping issuer buybacks and option exercises, and summarise the net
  # buy/sell lean over a trailing window. CONTEXT, NOT a validated signal (SEDI lags
  # the trade by up to ~5 days; TSX insider breadth is thin). engine/canada_insider.py
  # drips it into data/canada_insider/ (freshness-cached), like fetch_earnings.
  insider:
    enabled: true
    window_days: 180        # trailing window for the net buy/sell lean
    max_new_per_build: 40   # yfinance drip cap per run (freshness-cached 12d)
    recent_n: 6             # rows in the recent-filings table
    min_shares: 0           # drop trades below this share count (0 = keep all)

  # -- Breadth / drill-down universe: curated large-cap TSX names by sector -----
  # Doubles as breadth denominator + per-sector drill-down + stock-search seed.
  # Verified .TO symbols (dash convention for class/unit shares: GIB-A, RCI-B,
  # TECK-B, CTC-A, EMP-A, *-UN REIT units). Dead/merged names excluded (MEG, NGT, NVEI).
  constituents:
    Financials: ["RY.TO","TD.TO","BNS.TO","BMO.TO","CM.TO","NA.TO","MFC.TO","SLF.TO","GWO.TO","IFC.TO","POW.TO","BN.TO","BAM.TO"]
    Energy: ["ENB.TO","TRP.TO","CNQ.TO","SU.TO","CVE.TO","IMO.TO","TOU.TO","PPL.TO","ARX.TO","WCP.TO"]
    Materials: ["ABX.TO","AEM.TO","WPM.TO","FNV.TO","K.TO","NTR.TO","TECK-B.TO","FM.TO","LUN.TO","CCO.TO"]
    Industrials: ["CP.TO","CNR.TO","WSP.TO","WCN.TO","TFII.TO","GFL.TO","STN.TO"]
    Technology: ["SHOP.TO","CSU.TO","GIB-A.TO","OTEX.TO","DSG.TO"]
    Communication: ["BCE.TO","T.TO","RCI-B.TO","QBR-B.TO"]
    Utilities: ["FTS.TO","EMA.TO","H.TO","AQN.TO","CPX.TO","NPI.TO"]
    Staples: ["ATD.TO","L.TO","DOL.TO","MRU.TO","WN.TO","SAP.TO","EMP-A.TO"]
    Discretionary: ["MG.TO","QSR.TO","GIL.TO","CTC-A.TO","ATZ.TO","BYD.TO","DOO.TO"]
    Real Estate: ["REI-UN.TO","CAR-UN.TO","FCR-UN.TO","GRT-UN.TO","CSH-UN.TO"]

  breadth:
    lookback_days_live: 1100        # ~3y for 200DMA/NH-NL + cycle analysis on the search library
    ma_windows: [50, 200]
    nhnl_window: 252
    min_coverage: 0.6               # fail the run if < this fraction of curated names resolve

  # -- Stock-search library universe (collectors/canada_universe.py) -----------
  # DECOUPLED from `constituents` (the curated large-cap BREADTH/calibration gauge,
  # which must stay stable — the regime engine is tuned on it). This is the BROAD
  # searchable set + the residual-alpha cross-section: the full S&P/TSX Composite
  # via the iShares XIC ETF holdings CSV (keyless; gives ticker + proper company
  # name + GICS sector + weight in one fetch — no get_info enrichment loop needed).
  # Mirrors the US design (breadth = S&P 500; search = the broader caches) and the
  # china_search pattern. closes/members committed (small) so the engine CI job has
  # them via git pull. The build library reads these FIRST, then the breadth cache,
  # then the sector ETFs / indices.
  search_universe:
    enabled: true
    size: 250                       # top-N Composite names by index weight -> searchable
    history_period: "5y"            # yfinance close history per name (engine needs >=300 rows)
    min_coverage: 0.6               # fail the run if < this fraction resolve closes
    ishares:
      url: https://www.blackrock.com/ca/investors/en/products/239837/fund/1464253357814.ajax
      params: {fileType: csv, fileName: XIC_holdings, dataType: fund}

  # -- Global / commodity overlay (the PRIMARY Canada driver) ------------------
  # Concurrent commodity / CAD / BoC-vs-Fed risk read. sign = +1 if RISING-is-risk-on
  # for the TSX, -1 if RISING-is-risk-off. copper_gold computed in code from yahoo
  # HG=F / GC=F. All inputs already collected in the `yahoo` group. DISPLAY-FIRST
  # (informs the read; not a silently-scored growth/inflation leg pre-validation).
  global_factors:
    slope_window: 20
    baseline_window: 60
    z_threshold: 0.40
    risk_on_z: 0.30                 # composite z above this = Risk ON; below -this = Risk OFF
    min_factors: 3                  # need >= this many factors present, else risk_state = unknown
    components:
      oil:    {group: yahoo, ticker: "CL=F",      sign: 1.0, weight: 1.0}      # WTI — CAD terms-of-trade + energy weight
      gold:   {group: yahoo, ticker: "GC=F",      sign: 1.0, weight: 0.75}     # gold — TSX gold weight + safe-haven
      copper_gold: {sign: 1.0, weight: 1.0}                                    # HG=F / GC=F — global cyclical pulse
      usdcad: {group: yahoo, ticker: "USDCAD=X",  sign: -1, weight: 1.0}       # CAD strength (USDCAD down = TSX risk-on)
      spy:    {group: yahoo, ticker: "SPY",       sign: 1.0, weight: 0.75}     # US equity beta
      vix:    {group: yahoo, ticker: "^VIX",      sign: -1, weight: 1.0, use_log: true}
      dxy:    {group: yahoo, ticker: "DX-Y.NYB",  sign: -1, weight: 0.5}       # USD strength = commodity headwind
    coupling:                       # BoC-vs-Fed policy + GoC-vs-UST curve (display read; canada_macro cols)
      boc_rate: policy_rate
      goc_2y: goc_2y
      goc_10y: goc_10y
      us_2y: us_2y
      us_10y: us_10y

  # -- Engine tunables (mirror of hk.engine, Canada inputs) -------------------
  engine:
    scoring: {slope_window: 20, baseline_window: 60, z_threshold: 0.45, min_components: 2}
    growth_axis:
      components:
        gdp_trend: {weight: 1.0}            # StatsCan monthly real GDP YoY direction
        unemployment_trend: {weight: 1.0}   # LFS unemployment direction (inverted in code: falling = growth+)
        cyclical_defensive: {weight: 1.0}   # energy+materials+gold+banks vs utilities+staples+telecom
        global_growth: {weight: 0.75}       # copper/gold (global cyclical pulse; TSX is commodity-levered)
        breadth_direction: {weight: 0.5}    # % above 50d direction
        tsx_spx: {weight: 0.5}              # TSX/SPX relative — commodity-cyclical leadership vs the US
      cyclical_basket: ["XEG.TO","XMA.TO","XGD.TO","ZEB.TO","XBM.TO"]   # energy/materials/gold/banks/base-metals
      defensive_basket: ["XUT.TO","XST.TO","XCD.TO"]                    # utilities/staples/telecom
    inflation_axis:
      components:
        cpi_direction: {weight: 1.5}        # BoC headline CPI YoY direction (strong, fast)
        breakeven_direction: {weight: 1.0}  # GoC 10y - RRB breakeven direction
        inflation_beta_basket: {weight: 0.75}  # energy+materials vs utilities+telecom+tech
      inflation_long_basket: ["XEG.TO","XMA.TO","XGD.TO"]              # commodity beneficiaries
      inflation_short_basket: ["XUT.TO","XCD.TO","XIT.TO"]            # rate/duration-sensitive
    liquidity:                              # BoC stance: policy-rate easing + curve steepening
      components:
        policy_easing: {weight: 1.0}        # BoC policy rate falling = expanding
        curve_steepening: {weight: 0.75}    # GoC 10y-2y steepening = easing/expansion ahead
      roc_window_d: 20
    quad:
      hysteresis_days: 7
      shock_override_z: 0.85
    cycle:
      index_near_high_pct: 3.0
      high_window_d: 60
    sector_preferences:                     # framework-preferred Canada sector ETFs per quad
      Goldilocks:   ["XIT.TO","XCG.TO","ZEB.TO","XST.TO"]              # growth+ infl-: tech/discretionary/banks/staples
      Reflation:    ["XEG.TO","XMA.TO","XGD.TO","XFN.TO"]              # growth+ infl+: energy/materials/gold/financials
      Stagflation:  ["XEG.TO","XGD.TO","XMA.TO","XUT.TO"]              # growth- infl+: energy/gold/materials/utilities
      Growth-scare: ["XUT.TO","XST.TO","XCD.TO","ZEB.TO"]             # growth- infl-: utilities/staples/telecom/banks
    rs_ranking:
      benchmark: "^GSPTSE"
      momentum_windows: [20, 60]
      trend_window: 200
      percentile_lookback_d: 252
    calibration:
      start_date: "2001-01-01"              # TSX sector ETFs start ~2001 (XIU 1999)
      split_date: "2013-01-01"
      forward_days: [21, 63]
      ladder_fwd: 21
      ladder_step: 10

# ===========================================================================
# International economies — holistic COMPARATIVE dashboard (Japan / South Korea
# / Taiwan / United Kingdom / Eurozone). ONE vertical, uniform multi-country
# engine so economies sit side-by-side on the SAME axes (not five Canada
# clones). All keyless: yfinance (indices/vol/FX), FRED OECD CSV + ECB (macro),
# UK-domiciled iShares UCITS holdings CSVs (stock universe, same ajax pattern as
# the canada XIC). Every regime/recession/drawdown/bubble read is DISPLAY-ONLY
# (history-anchored, never a scored signal). Europe = Eurozone aggregate + a
# Germany-vs-Italy (BTP-Bund) periphery-fragmentation read; stocks pan-European
# with per-country flags. Taiwan macro is thin on keyless sources -> degrades.
# ===========================================================================
intl:
  # -- Plane A: prices (group=intl) — yfinance indices + vol + FX -------------
  yahoo:
    retries: 3
    backoff_base_s: 5
    batch_size: 40

  # -- Plane B: macro — FRED OECD CSV + ECB (group=intl_macro) ----------------
  # Per-series degrade (one bad id can't kill the plane); FRED CSV is keyless.
  # Stored col = "<CC>_<metric>" per country plus the shared `extra_series`.
  macro:
    fred_base_url: https://fred.stlouisfed.org/graph/fredgraph.csv
    retries: 3
    extra_series:                  # stored_col: FRED id (Eurozone policy/liquidity, periphery, US anchor)
      ez_depo_rate: ECBDFR         # ECB deposit facility rate (policy)
      ez_refi_rate: ECBMRRFR       # ECB main refinancing rate
      ez_cb_assets: ECBASSETSW     # ECB total assets (EZ liquidity)
      de_10y: IRLTLT01DEM156N      # Bund 10y (periphery base)
      it_10y: IRLTLT01ITM156N      # BTP 10y (it_10y - de_10y = BTP-Bund fragmentation)
      es_10y: IRLTLT01ESM156N      # Bonos 10y (periphery context)
      fr_10y: IRLTLT01FRM156N      # OAT 10y
      us_10y: DGS10                # US anchor (global rate compare)
      us_2y: DGS2

  # -- Stock-search universe (collectors/intl_universe.py) --------------------
  # UK-domiciled iShares UCITS holdings CSVs (keyless ajax, same as canada XIC).
  # CSV columns Ticker/Name/Sector(GICS)/Location/Exchange -> Yahoo suffix +
  # country flag per row. Combined members + closes committed (small) like
  # canada_search. size = top-N per fund by index weight.
  search_universe:
    enabled: true
    size: 220                       # top-N per market by index weight
    history_period: "5y"
    min_coverage: 0.5
    ajax_holdings_id: "1472631233320"   # stable UK-site holdings loader id (self-heal: scrape page for [0-9]+\.ajax)

  # -- Countries (5 macro entities; Europe = Eurozone aggregate) --------------
  # Each: display, primary index + extras (yfinance), optional vol index, FX
  # pair (+ invert when quoted USD/XXX so "up = currency weaker = stress"),
  # the iShares UCITS universe fund, and FRED macro ids (degrade where absent).
  countries:
    JP:
      name: Japan
      name_zh: 日本
      flag: "🇯🇵"
      region: Asia
      index: "^N225"
      indices: {"^N225": Nikkei 225}
      vol: null                     # no keyless implied-vol on Yahoo -> engine uses realized vol
      fx: "USDJPY=X"
      fx_invert: true               # USD/JPY up = JPY weaker = stress
      ucits: {product_id: "251866", file_name: IJPN, suffix: ".T", slug: "ishares-msci-japan-ucits-etf-inc-fund"}
      fred:
        yield_10y: IRLTLT01JPM156N
        short_3m: IR3TIB01JPM156N
        # CPALTT01JPM659N (OECD MEI headline) discontinued 2021-06 — no live keyless
        # FRED replacement found (all OECD JP CPI variants freeze at 2021-06 or 404).
        # Series removed; JP real_yield is gated on CPI freshness and will show N/A.
        unemployment: LRHUTTTTJPM156S
        gdp: JPNRGDPEXP
        # MYAGM2JPM189S discontinued 2017-02 — removed (M2 not displayed on intl page).
    KR:
      name: South Korea
      name_zh: 韩国
      flag: "🇰🇷"
      region: Asia
      index: "^KS11"
      indices: {"^KS11": KOSPI}
      vol: null
      fx: "USDKRW=X"
      fx_invert: true
      ucits: {product_id: "251871", file_name: IKOR, suffix: ".KS", slug: "ishares-msci-korea-ucits-etf-inc-fund"}
      fred:
        yield_10y: IRLTLT01KRM156N
        short_3m: IR3TIB01KRM156N
        # CPALTT01KRM659N (OECD MEI headline) discontinued 2023-11. Replaced with
        # KORCPICORMINMEI (OECD core CPI YoY, current through 2025-04; monthly).
        cpi_yoy: KORCPICORMINMEI
        unemployment: LRHUTTTTKRM156S
        gdp: NGDPRSAXDCKRQ
