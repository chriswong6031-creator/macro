        inflation_beta_basket: {weight: 0.25}  # FLIPS (-2.0 / +1.2) -> demoted from 1.0
      inflation_long_basket: ["512400.SS","515220.SS"]   # nonferrous + coal
      inflation_short_basket: ["512760.SS","515000.SS"]  # semis + tech
    liquidity:
      components:
        m2_growth: {weight: 1.0}          # M2 YoY direction
        lpr_easing: {weight: 1.0}         # falling LPR -> expanding
      roc_window_d: 20
    quad:
      hysteresis_days: 7
      shock_override_z: 0.85
    cycle:
      index_near_high_pct: 3.0
      high_window_d: 60
    sector_preferences:                   # framework-preferred China sectors per quad
      Goldilocks:  ["512760.SS","515000.SS","512690.SS","515250.SS"]   # growth+ infl-: tech/semis/consumer
      Reflation:   ["512400.SS","515220.SS","512880.SS","512200.SS"]   # growth+ infl+: commodities/brokers/property
      Stagflation: ["512400.SS","515220.SS","512800.SS","159928.SZ"]   # growth- infl+: materials/banks/staples
      Growth-scare: ["512800.SS","159928.SZ","512170.SS"]              # growth- infl-: banks/staples/healthcare
    rs_ranking:
      benchmark: "510300.SS"
      momentum_windows: [20, 60]
      trend_window: 200
      percentile_lookback_d: 252
    calibration:
      start_date: "2005-01-01"
      split_date: "2016-01-01"            # split-half robustness boundary
      forward_days: [21, 63]
      ladder_fwd: 21                       # forward window for the ladder walk
      ladder_step: 10                      # walk every N days (10 keeps CI lean; per-state n still ample)

