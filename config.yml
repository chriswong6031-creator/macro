  enabled: true                   # client-side holdings watchlist page (needs stock_search)
  # empty-state quick-add chips; only those present in the nightly library show
  suggested: [SPY, QQQ, BTC-USD, GC=F]
  # OPTIONAL cloud account sync (Supabase). Leave url/anon_key blank to ship a
  # pure local-only watchlist (no accounts, no third-party calls). The anon key
  # is PUBLIC by design — per-user isolation is enforced by RLS, not by secrecy.
  # One-time setup: run templates/watchlist_supabase.sql in the Supabase SQL editor.
  supabase:
    url: "https://fsldfzlxyavsuwqbceod.supabase.co"
    anon_key: "sb_publishable_f33VG8fZuyIZPl_lZIDX3w_RFuuZtpv"   # publishable key — PUBLIC by design (RLS enforces isolation)

# -----------------------------------------------------------------------------
# Regime engine
# -----------------------------------------------------------------------------
engine:
  scoring:
    slope_window: 20              # days for direction-of-change slope
    baseline_window: 60           # z-score the slope against this trailing window of slopes
    z_threshold: 0.45             # |z| below this scores 0 (no signal); tuned 2026-06 (scripts/tune.py)
    min_components: 3             # fewer live components than this -> axis confidence = 0

  growth_axis:
    components:                   # name: {weight}; series construction in engine/axes.py
      copper_gold: {weight: 1.0}
      xly_xlp: {weight: 1.0}
      us2y_direction: {weight: 0.5}   # ambiguous when policy chases inflation (2022) — tuned down
      iwm_spy: {weight: 1.0}
      cyclical_defensive: {weight: 1.0}
      breadth_direction: {weight: 1.0}
      payrolls_trend: {weight: 0.5}     # slow confirmation, lower weight
      indpro_trend: {weight: 0.5}
      # real-time GROWTH nowcasts (research/QUANT_FACTOR_EXPANSION.md) — model-based
      # confirmations that lead the lagging payrolls/INDPRO. Absent pre-2008/2011
      # (axis renormalizes), so the 2008 episode is unchanged; they reinforce 2020.
      wei_trend: {weight: 0.5}          # Weekly Economic Index direction (weekly, 2008->)
      gdpnow_trend: {weight: 0.5}       # Atlanta Fed GDPNow direction (quarterly, 2011->)
    cyclical_basket: [XLI, XLB, XLF, XLY]
    defensive_basket: [XLP, XLU, XLV]

  inflation_axis:
    components:
      breakeven_10y_direction: {weight: 1.0}
      breakeven_5y5y_direction: {weight: 1.0}
      energy_rs: {weight: 1.0}
      oil_trend: {weight: 1.0}
      inflation_beta_basket: {weight: 1.0}   # (XLE+XLB)/(XLK+XLU)
      tips_nominal_momentum: {weight: 0.75}
      # underlying-inflation confirmation: Atlanta sticky-price CPI direction — a
      # real (not market-implied) persistent-inflation read (1967->, full history).
      sticky_cpi_direction: {weight: 0.5}
    inflation_long_basket: [XLE, XLB]
    inflation_short_basket: [XLK, XLU]

  quad:
    hysteresis_days: 7            # new quad must hold N consecutive days; tuned from 5 (whipsaw 20%->9%)
    shock_override_z: 0.85        # single-day |axis score| beyond this flips immediately; tuned from 0.7
    recession_hy_oas_min: 5.0     # % level threshold
    recession_oas_widening_days: 20
    inflation_shock_pctile: 0.90  # inflation axis score vs own history

  liquidity:
    roc_window_d: 20              # ~4 trading weeks
    expanding_threshold_bn: 25    # net-liq 4w change > +$25bn -> expanding
    contracting_threshold_bn: -25
    # quality classifier (engine/regime.liquidity_quality; 2026-07-02 incident):
    # benign vs stress vs hollow read, published beside the untouched overlay
    quality_enabled: true
    rrp_floor_bn: 100             # RRPONTSYD below this = buffer exhausted (unverified-prior)
    benign_fed_share_min: 0.5     # |dWALCL| share of the RoC below this = mechanical TGA/RRP move (unverified-prior)
    stress_oas_z: 1.0             # HY-OAS 20d-change z at/above this = credit confirming stress

  cycle:
    curve_inversion_level: 0.0
    oas_range_lookback_d: 504     # 2y
    oas_low_third: 0.33
    oas_high_third: 0.67

  transition:
    weakening_flags: 2
    transitioning_flags: 3
    # de-escalation ratchet (2026-07-02 semis-breakdown incident): escalate
    # instantly, clear slowly. Dwell values tagged (unverified-prior) — mirrored
    # from the bot-side macro_risk dwell machine, not yet independently tuned.
    ratchet_enabled: true         # single-flag revert to the memoryless counter
    clear_dwell_days: 5           # consecutive clean sessions to step DOWN one level (unverified-prior)
    rotation_persist_days: 10     # cyc/def slope contra-quad this long -> flag_rotation_persistence (unverified-prior)
    max_dwell_days: 15            # auto-release: a stuck state self-heals, never a hard lock (unverified-prior)
    contradiction_floor: true     # {cyclical_defensive, wei_trend} contra-growth pair forces >= WEAKENING
    breadth_price:
      index_near_high_pct: 2.0    # index within 2% of 60d high
      high_window_d: 60
      breadth_drop_pts: 10        # %>50DMA falls >10pts
      breadth_drop_window_d: 20
    credit_equity:
      ret_window_d: 20
      oas_z_threshold: 1.0
    ratio_inflection:
      slope_window_d: 50
    confidence_decay_window_d: 10
    gex_flip_proximity_pct: 1.0   # spot within 1% of gamma flip

  risk_radar:
    # THRESHOLD REVIEW (2026-07-02 incident, synthesis §4 item 6): when true,
    # cap_leadership also fires at 'caution' if the dominant scare is the
    # growth/defensive rotation with h21 pullback odds rising (the 07-01 tape:
    # caution 91/100 + rising odds, but cap_leadership stayed False). Default
    # false — the radar owner flips it deliberately; the incident is the falsifier.
    cap_leadership_on_rotation_caution: false

  sector_preferences:             # framework-preferred sectors per quad
    Q1: [XLK, XLC, XLY, QUAL]
    Q2: [XLE, XLF, XLI, XLB, IWM]
    Q3: [XLE, XLP, XLV, GC=F]
    Q4: [XLU, XLP, XLV, LQD]

  rs_ranking:
    benchmark: SPY
    momentum_windows: [20, 60]
    trend_window: 200
    percentile_lookback_d: 252

  confluence:                     # transparent checklist weights (sum path to 100)
    regime_aligned_risk_on: 25    # in current regime's preferred list + risk-on dial
    regime_aligned: 18
    regime_neutral: 8
    tape_leading: 25              # confirmed RS uptrend, not extended
    tape_improving: 15            # momentum up, trend unconfirmed (watch, don't buy)
    tape_weakening: 10
    tape_lagging: 4
    tape_extended: 12             # leading but stretched
    tech_above200: 10
    tech_above50: 7
    tech_macd: 5
    tech_rsi_sweet: 8             # rsi in the healthy-trend zone
    tech_rsi_ok: 4
    rsi_sweet_lo: 45
    rsi_sweet_hi: 70
    rsi_overbought: 75
    crowding_soft_pctile: 85
    crowding_soft_penalty: 5
    crowding_hard_pctile: 92
    crowding_hard_penalty: 10
    # --- Macro-risk SENSITIVITY table (per-sector beta to a risk-OFF reading) ----
    # How much a high macro-risk score (MRS, 0..1) should HURT each sector's heat
    # and its holdings' buy-setup conviction. MEASURED + shrunk: each SPDR's beta is
    # tied to its CONDITIONAL fwd-63d drawdown depth under high MRS over the deep
    # SPDR history (1998->), standardized cross-sectionally and shrunk 50% toward a
    # coarse 3-tier textbook prior to stay overfit-resistant. Re-derive offline with
    # `python -m scripts.calibrate_macro_betas` (adopt only if it agrees with the
    # prior's structure); the SIGN/tier ordering is separately gated by
    # scripts/research_macro_sector.py. Positive = cyclical / long-duration
    # (penalized in risk-off; financials & comms bite hardest, tech least);
    # negative = defensive (a small credit). Keyed by SPDR ticker AND GICS / display
    # sector name so both the sector pages (ticker) and the stock library (sector
    # name) resolve. See research/MACRO_RISK_INTEGRATION.md.
    sector_macro_beta:
      XLF: 1.0      # Financials — deepest conditional drawdown under high MRS
      XLC: 1.0      # Communications
      XLY: 0.64     # Consumer Discretionary
      XLB: 0.5      # Materials
      XLRE: 0.5     # Real Estate (rate-sensitive; thin history -> prior)
      XLI: 0.48     # Industrials
      XLK: 0.39     # Technology — shallower conditional drawdown than other cyclicals
      XLE: 0.16     # Energy — modest (oil drawdowns)
      XLU: -0.29    # Utilities (least defensive of the three — rate-sensitive)
      XLV: -0.46    # Health Care
      XLP: -0.56    # Consumer Staples — most defensive
      # GICS / display sector names (deep-history holdings + breadth constituents) —
      # mirror their SPDR's measured value.
      Technology: 0.39
      Information Technology: 0.39
      Consumer Discretionary: 0.64
      Financials: 1.0
      Communications: 1.0
      Communication Services: 1.0
      Industrials: 0.48
      Materials: 0.5
      Real Estate: 0.5
      Energy: 0.16
      Consumer Staples: -0.56
      Utilities: -0.29
      Health Care: -0.46

  # --- Bottoming-ENTRY gate (engine.cycles.mtf_alignment): the standout-strip selection
  # prerequisite. A name is only a BUY when its multi-timeframe MACD/StochRSI is turning
  # up FROM A LOW (a low-risk SWING entry), never mid-rally. These tune that read; the
  # engine carries the same values as fallbacks so a missing block can't break a build.
  entry_gate:
    stoch_oversold: 25            # 3D StochRSI must originate from < this (the "from the bottom" line)
    stoch_overbought: 80          # 3D/daily StochRSI above this = already run (excluded -> watch)
    daily_rsi_extension_cap: 62   # daily RSI14 hotter than this = too late for an early entry
    approach_days: 2              # daily "about to cross" ETA cap (trading days)
    stretch_block_pct: 30         # % over the 200dma = overextended chase (excluded -> watch)
    align_min_keep: 10            # never-empty backfill floor: keep >= this many before relaxing to APPROACHING

  # --- Macro-risk overlay: make aggregate macro risk a DETERMINISTIC, risk-OFF-
  # only factor in sector heat + per-stock buy-setup conviction. MRS (macro-risk
  # score, 0..1) is a pure function of the already-persisted conditions/regime legs
  # (engine.conditions.macro_risk_*); the penalty per instrument scales by the
  # sector_macro_beta table above. Framed as drawdown/sizing caution, NEVER alpha:
  # the cross-sectional edge is unproven (research/DISLOCATION_VALIDATION.md shows
  # one robust drawdown-median cell; returns/tail/hit all span 0). Magnitudes are
  # conservative and FIXED (not tuned to a backtest). enabled:false => exact pre-
  # overlay behavior. See research/MACRO_RISK_INTEGRATION.md.
  macro_overlay:
    enabled: true            # global kill-switch (false => overlay is a no-op)
    macro_max: 7             # max sector-heat swing (conservative; <= the +7 regime swing)
    macro_headwind: 7        # max per-stock buy-setup penalty (conservative; <= LIQ_HEADWIND=12)
    mrs_weights:             # weight each MRS leg toward the measured-edge legs
      recession: 1.0
      drawdown: 1.0
      nfci: 0.5
      liquidity: 0.5         # contracting-liquidity is the main cyclical/defensive
                             # differentiator — the B-1 sign-check only passes WITH
                             # it. It also has a uniform ladder nudge (LIQ_HEADWIND);
                             # the MRS leg adds sector differentiation on top — a
                             # small, intentional overlap, not double-counting noise.
      transition: 0.25

  # --- Fused equity-internal RISK STATE (engine/risk_state.py). The loud, EARLY
  # drawdown-risk gauge that LEADS the credit-weighted macro_risk above by fusing the
  # orphaned positioning/vol/breadth detectors. Inverse weighting of MRS: leading legs
  # dominate, slow credit/recession legs are light. Conjunction-based early warning,
  # NOT validated alpha; de-risk response is sizing only. See research/RISK_LAYER_DESIGN.md.
  # All keys optional — engine/risk_state.py bakes in these same defaults.
  risk_state:
    weights:
      complacency: 1.0       # hidden-fragility conjunction (keystone leg)
      breadth_div: 0.9       # index near highs while %>200dma weak
      dealer_gamma: 0.9      # dealer short-gamma / below flip / vol-hole
      technical: 0.8         # major indexes rolling over/breaking down (mtf_monitor)
      extension: 0.8         # parabolic / cohort-stretch froth (optional leg)
      vol_structure: 0.7     # backwardation (stress) or rich-VRP+calm (complacency)
      credit: 0.6            # HY OAS 21d widening + HYG-TLT rolling down
      turning_point: 0.4     # cross-leaf fragility meta-state
      cross_asset: 0.3       # bonds/fx not confirming an equity calm
      macro_backdrop: 0.3    # the validated credit/recession MRS, as a light anchor
    bands:                   # score (0-100) -> state cutoffs
      neutral: 20.0
      caution: 40.0
      elevated: 60.0
      risk_off: 80.0
    conjunction:             # the loud part: >=2 LEADING legs firing hard floors the
      threshold: 0.6         # state, so a few screaming legs aren't averaged to silence
      floor_2: caution       # >=2 hot leading legs -> at least caution
      floor_3: elevated      # >=3 hot leading legs -> at least elevated (fires the alert)
    alert_from: elevated     # state at/above which the loud banner + alert fire
    hyg_tlt_scale: 0.04      # HYG/TLT 20d drop that maps to full credit-ETF intensity
    gross:                   # subtract-only gross multiplier per state — the SIZING response
      caution: 0.90          # (de-gross + favor entries over chasing leaders), never selection
      elevated: 0.78
      risk_off: 0.60
      floor: 0.50            # never de-gross below this

  # --- Vol-regime SUBTRACT-ONLY sizing overlay. Lets the validated index vol-regime
  # (engine/vol_regime.py -> site/vol/regime.json) actually move money as a gross/sizing
  # caution in the baskets, per-stock ladder and Mastermind lenses. Drawdown / capital-
  # efficiency, NEVER alpha; never lifts rank/selection. The MECHANICAL vol-target leg is
  # always-on (a sizing rule, not a forecast); the REGIME-STATE caution fires on the
  # published kill-switch label; the continuous SCORED composite only deepens the cut when
  # data/vol_regime/gate.json is open (validate-first firewall). See engine/vol_regime.sizing_overlay.
  vol_regime_overlay:
    enabled: true            # global kill-switch (false => overlay is a no-op everywhere)
    gross_floor: 0.40        # never cut a consumer's gross below this (don't de-risk to ~0)
    warning_haircut: 0.85    # gross factor when regime == "warning"
    stress_haircut: 0.70     # gross factor when regime == "backwardation-stress" (kill-switch)
    scored_extra: 0.20       # extra cut scaled by |scored_score|, ONLY when the gate is open
    use_vol_target: true     # apply the mechanical vol-target scalar min(.,1.0) (always-on)
    ladder_headwind: 7       # max per-stock buy-setup ladder penalty (<= LIQ_HEADWIND=12)
  # --- Vol-Shock Risk Predictor (engine/vol_shock_scorecard.py). DISPLAY-ONLY /
  # validation-accruing: one forward 0-100 caution gauge fusing the LEADING vol-shock
  # precursors, with per-factor points that sum to the headline. Mirrors the in-code
  # DEFAULTS; the band edges + forward-outcome label are PRE-REGISTERED (do not tune
  # post-hoc — the forward outcome log grades them). Never scored, feeds no allocation.
  vol_shock:
    weights:                   # per-factor weights (leading precursors heavier than slow legs)
      concentration: 1.0       # cross-asset absorption pctile (documented drawdown leader)
      dealer_gamma: 1.0        # dealer short-gamma amplification (from market_gamma / GEX)
      vix_term: 0.8            # VIX term inversion (front-month fear bid)
      vrp_skew: 0.7            # compressed variance premium + skew tail
      put_call: 0.5            # complacent call-buying (young series => down-weighted)
      complacency: 0.8         # hidden-fragility state + breadth divergence
      drawdown: 0.6            # slower, VALIDATED macro-stress gauge
      turning_point: 0.5       # CAPPED conditioning flag (never-scored doctrine)
      event_window: 0.4        # additive positioning-fragility / event proximity
    bands:                     # PRE-REGISTERED band edges (0-100)
      elevated: 40
      high: 60
      extreme: 75
    putcall_young_n: 60        # put/call n_obs below this => young => down-weighted
    putcall_young_factor: 0.35
    turning_point_cap: 60      # turning_point sub-score ceiling (can't dominate)
    vix_term_lo: 0.85          # VIX/VIX3M ratio: deep contango => 0 risk
    vix_term_hi: 1.05          # inverted => max risk
    gamma_prox_pct: 3.0        # |spot_vs_flip_pct| window for dealer-gamma proximity
    outcome_horizon_d: 10      # forward-outcome label: realized SPY drawdown <= -X% OR
    outcome_spy_move_pct: 5.0  #   VIX intraday-high >= VIX_t * mult, within N trading days
    outcome_vix_jump_mult: 1.4

  # --- Quant-factor expansion: complementary nowcast / conditions / risk layer.
  # ADDITIVE — engine/conditions.py runs alongside the validated quad, never
  # alters it. See research/QUANT_FACTOR_EXPANSION.md.
  conditions:
    nfci_change_window_d: 65        # ~13 weeks: NFCI tightening/loosening trend
    nfci_pctile_lookback_d: 1260    # ~5y percentile of the conditions level
    systemic_stress:                # OFR FSI + commercial-paper spreads (research/DATA_SIGNAL_EXPANSION_2026.md)
      fsi_pctile_lookback_d: 1260   # ~5y percentile of the OFR FSI level
      fsi_change_window_d: 65       # ~13 weeks: FSI rising/easing trend
      cp_pctile_lookback_d: 1260    # ~5y percentile of the CP spreads
      elevated_pctile: 0.80         # FSI/CP percentile -> "elevated stress"
      acute_pctile: 0.95            # FSI/CP percentile -> "acute stress"
    labor:                          # high-frequency real-activity nowcast (research/REAL_ACTIVITY_NOWCAST.md)
      claims_yoy_window_d: 252      # ~1y change of the 4wk-MA claims level (rising = labor cooling)
      claims_z_lookback_d: 756      # ~3y rolling z of the 4wk-MA claims level
      indeed_chg_window_d: 63       # ~3m change of the Indeed postings index (labor demand trend)
      withheld_sum_window_d: 63     # trailing ~3m of ACTUAL deposit days (a flow — never ffilled)
      withheld_yoy_window_d: 252    # ~1y of deposit days for the YoY of the trailing sum
      news_z_lookback_d: 252        # ~1y rolling z of the daily news-sentiment level
      claims_yoy_warn_pct: 10.0     # 4wk-MA claims +10% y/y => "cooling" label
      indeed_chg_warn_pct: -5.0     # Indeed postings -5% over 3m => demand softening
    recession:                      # composite 0..100 recession-risk score
      weights: {sahm: 1.0, recession_prob: 0.8, ebp_prob: 0.8, curve: 1.0, ebp_level: 0.5, claims: 1.0}
      # LABOR leg = jobless claims (PRIMARY); Sahm is the graceful FALLBACK, used only when
      # the claims feed is unavailable. Phase-0/1.5 validated vs NBER 1967-2026 (8 recessions,
      # + ALFRED point-in-time): claims beats Sahm standalone AND in-composite at every horizon,
      # and REPLACE > AUGMENT > Sahm-only across revised / timing-lagged / PIT modes. So claims
      # carries the full labor weight (1.0, = Sahm's old weight); sahm's 1.0 is now its FALLBACK
      # weight. Set claims:0 to revert to Sahm. research/CLAIMS_RECESSION_VALIDATION.md
      claims_yoy_window_d: 252       # ~1y change of the 4wk-MA claims level
      claims_yoy_full: 0.40          # +40% y/y => full recessionary (clipped 0..1)
      sahm_full: 0.50               # Sahm >= this => recession underway (full stress)
      curve_invert_level: 0.0       # term-premium-adjusted slope below this => inversion stress
      curve_full_invert: -1.0       # ...and this deep => full curve stress
      ebp_level_pctile_lookback_d: 2520  # ~10y percentile for the EBP level leg
      elevated_score: 30            # >= => "elevated"
      high_score: 55                # >= => "high"
    inflation_nowcast:
      smooth_months: 3              # 3-month average of the monthly sticky/flex prints
    vrp:                            # equity volatility-risk-premium (implied - realized)
      realized_window_d: 21
      pctile_lookback_d: 504
      stress_level: 0.0             # VRP below this (realized > implied) => vol stress
    skew_pctile_lookback_d: 504     # CBOE SKEW percentile window
    term_structure:                 # VIX9D/VIX vs VIX3M as risk-appetite
      backwardation_ratio: 1.0      # vix/vix3m above this => backwardation (stress)
    corr:                           # realized stock-bond correlation regime
      window_d: 63
      high: 0.30                    # above this => the 2022 'bonds don't hedge' regime
      low: 0.0
    roro:                           # cross-asset Risk-On/Risk-Off composite
      z_window_d: 252
      risk_on: 0.35                 # composite z above this => risk-on
      risk_off: -0.35
    vol_target:                     # exposure scalar for the playbook dial
      target_vol_pct: 12.0          # annualized realized-vol target for SPX-like exposure
      realized_window_d: 21
      floor: 0.5                    # never scale exposure below/above these
      cap: 1.5
    # --- MEASURED higher-quality signals (research/QUANT_FACTOR_EXPANSION.md §6) -
    # Drawdown-risk gauge: a LEAN 4-factor macro-stress composite. RE-ISSUED on the
    # leak-free PIT frame with the live jobless-claims composition (audit #39,
    # scripts/validate_drawdown_risk_pit.py -> data/regime/drawdown_risk_pit.json):
    # extreme band -> P(>=10% dd in 63d, max drawdown) ~49% vs ~19% base; monotone
    # low 11% -> elevated 28% -> high 36% -> extreme 49%. The old 8/26/36/38 table was
    # measured on revised data + the retired Sahm leg and reproduced neither the live
    # frame nor the max-drawdown definition. curve & VIX were dropped (weak/coincident).
    # It is a DRAWDOWN-RISK gauge, NOT a return forecast (risk-off rebounds) and NOT a
    # clean recession leader.
    drawdown_risk:
      components: [recession_risk, nfci, ebp, hy_oas]
      z_lookback_d: 1260            # ~5y rolling z for each component
      pctile_lookback_d: 2520       # ~10y percentile -> 0..100 gauge
      elevated: 60
      high: 80
      extreme: 90
    # Capitulation gauge: contrarian bounce signal. MEASURED: VRP %ile>0.90 ->
    # +5.8%/63d, 88% positive (vs +2.8% base), shallower drawdowns; VIX>30 ->
    # +7.2%; COT ES washout (<10th %ile) -> +4.2%; stacked -> +9.6%/92%.
    capitulation:
      vrp_pctile: 0.90              # realized vol >> implied = panic
      vix_panic: 30.0
      cot_washout_pctile: 0.10      # COT ES net-spec wrung out (3y rolling)
      cot_pctile_lookback_d: 756
    # Complacency / hidden-fragility gauge: the DISPLAY-ONLY mirror of the
    # capitulation gauge above. Capitulation reads extreme FEAR (-> a measured
    # contrarian bounce); this reads the opposite tail — a CALM surface (cheap
    # VIX, steep contango) sitting over DETERIORATING internals (breadth not
    # confirming a strong tape, HY credit quietly widening): the 'calm but
    # fragile' backdrop. Deliberately NEVER scored — 'low VIX' is persistent and
    # ~neutral on forward returns, and the fragility only bites conditional on a
    # catalyst (the same reason the RORO composite gates nothing). Context, not a
    # timing signal. The warning fires only on the CONJUNCTION: calm AND weak.
    complacency:
      vix_pctile_lookback_d: 504     # ~2y window for the VIX percentile (the 'calm' read)
      vix_calm_pctile: 0.25          # VIX in the bottom quartile of its 2y range = complacent
      contango_calm: 0.95            # vix/vix3m below this = steep contango = calm front end
      breadth_pctile_lookback_d: 504 # ~2y window for the %>200dma percentile
      breadth_high_prox: 0.97        # SPY within 3% of its 1y high = strong/calm tape
      breadth_weak_pctile: 0.40      # %>200dma below this %ile WHILE tape strong = not confirming
      credit_widen_window_d: 21      # HY OAS change window for 'credit not confirming'
    # Regime-snap / narrative-relief detector: the VELOCITY complement to the
    # Fear<->Euphoria LEVEL read (engine/regime_snap.py). Fires when the cross-asset
    # RORO complex flips risk-on HARD and BROADLY over 1-3 sessions, AFTER a
    # capitulation washout — the 'relief rally' fingerprint (geopolitical
    # de-escalation, post-CPI relief, growth-scare reversal, the 2026-06 relief).
    # DISPLAY-ONLY: zero new data (reads the signed roro_<key> legs + the existing
    # capitulation gauge), NEVER scored, nothing in axes/regime/macro_risk reads it.
    # VERIFIED COINCIDENT, NOT PREDICTIVE: historical verification
    # (scripts/regime_snap_history.py) shows conditioned forward returns ~ base rate
    # (the velocity thrust alone, WITHOUT the washout gate, is NEGATIVE — a dead-cat
    # detector). So it is an ATTENTION radar — 'a regime is snapping, react' — never
    # a buy/size signal; the relief-magnitude describes the fear premium unwinding,
    # it is NOT an expected return. Promotion to anything scored requires a full
    # Phase-0 (PIT/FDR/Deflated-Sharpe) that it is NOT expected to pass.
    regime_snap:
      window_d: 2                    # 1-3 session change (2 captures a 2-day re-rate)
      leg_sigma_mult: 1.0            # leg 'flips' when its window-change > 1σ of its own history
      leg_std_lookback_d: 252
      min_legs: 4                    # >=4 of ~7 cross-asset legs flip risk-on together
      vel_pctile_lookback_d: 504     # ~2y window for the RORO-velocity percentile
      vel_min_pctile: 0.90           # RORO velocity in its top decile = a genuine thrust
      fear_lookback_d: 21            # 'recent' fear = trailing ~month
      fear_min: 0.40                 # the thrust must come OUT of a fear context (modest bar)
      require_capitulation: true     # AND a washout printed recently (the decisive gate)
      cap_lookback_d: 21             # window for 'a capitulation signal printed recently'
      veto:                          # AI knife-vs-dip durability read (engine/regime_snap_veto.py)
        enabled: true                # CONTEXT-ONLY, triggered on firing/building only; needs DEEPSEEK_API_KEY
        model: deepseek-v4-pro
        max_tokens: 1500
        headlines_n: 12              # recent headline titles handed to the model

  # --- Business-cycle model (engine/business_cycle.py). ADDITIVE — a Conference-
  # Board-style Leading/Coincident/Lagging decomposition that keeps the three tiers
  # SEPARATE so the lead-lag SEQUENCE (leading rolls over -> coincident peaks ->
  # lagging confirms) is readable, unlike the conditions recession_risk which blends
  # them into one score. Each tier = causal inverse-vol-standardized monthly
  # contributions (the CB standardization), cumulated to an index; the recession
  # signal is the CB "3 D's" (depth+duration via the 6-month momentum, diffusion via
  # breadth). The roc_threshold is in THIS index's own units — CALIBRATED by
  # scripts/validate_business_cycle.py against NBER dates (point-in-time where ALFRED
  # vintages exist), NOT CB's -4.3% (a different index's scaling). See
  # research/BUSINESS_CYCLE_MODEL.md. Effective N is tiny (~3 PIT recessions) — the
  # measured lead/false-positive stats are shipped WITH the signal, never implied.
  business_cycle:
    z_lookback_m: 120               # rolling window (months) for causal leg standardization (~10y)
    z_min_months: 36                # a leg must have this many months before it contributes
    roc_window_m: 6                 # the CB "6-month change" horizon (red line)
    trend_smooth_m: 6               # blue line = EMA span (months) over the 6-month momentum
    diffusion_window_m: 6           # breadth horizon: share of legs rising over this window
    rebase: 100.0                   # index level rebased to this at first valid month
    live_lag_m: 0                   # EXTRA uniform lag stacked on top of the per-leg PUB_LAG_M
                                    # publication schedule (engine/business_cycle.py). W2.7 replaced
                                    # the old single uniform live lag with a per-leg release-calendar
                                    # table applied SYMMETRICALLY on the live and validation paths
                                    # (macro-regime-6). The per-leg table IS the publication lag now;
                                    # this stays 0 (a nonzero value stress-shifts everything further).
    shadow_lag_m: 0                 # emit a SHADOW phase clock at this extra lag if it differs from
                                    # live_lag_m; both 0 by default → no shadow. Transparency hook only.
    signal:                         # CB 3 D's — CALIBRATED (scripts/validate_business_cycle.py writes
                                    # the LORO operating point to the calibration JSON, which wins over
                                    # these defaults ONLY when version-matched + fresh, else these are
                                    # used with a warning; macro-regime-miss). Headline stats are now
                                    # OUT-OF-SAMPLE (leave-one-recession-out); see the validation report.
                                    # These defaults are the LORO consensus operating point.
      roc_threshold: -1.25          # leading 6-month momentum below this = depth+duration (index units)
      diffusion_max: 50.0           # leading 6-month diffusion at/below this = broad weakening (CB-canonical)
      min_consecutive_m: 3          # both conditions must hold this many months (whipsaw filter)
      lookahead_window_m: 18        # a fire is a true positive if an NBER recession starts within this
      max_lead_window_m: 24         # a recession is "caught" if the signal fired within this many months before its peak

# -----------------------------------------------------------------------------
# Alerts (Phase 3 — rules defined now, wired after validation checkpoint)
# -----------------------------------------------------------------------------
alerts:
  transition_state_change: true
  axis_confidence_floor: 0.3
  sector_rs_percentile_hi: 90
  sector_rs_percentile_lo: 10
  holdings_active_change_pct: 20
  holdings_active_change_days: 5
  sector_holdings_accumulation: true   # decomposed sector-ETF weight-change signal
  net_liquidity_roc_sign_flip: true
  net_liquidity_roc_deadband_bn: 25    # ignore RoC flips within ±N bn of zero (kills "+7 -> -0bn" noise)
  net_liquidity_roc_confirm_days: 2    # ...and require the new sign to HOLD N days before firing
  hy_oas_1d_widening_z: 2.5
  gex_flip_cross: true
  gex_net_deadband_bn: 1.0             # ignore net-GEX sign flips within ±N bn of zero
  gex_flip_pct_deadband: 0.25          # ignore spot/flip crossings while hugging the flip (±N%)
  # --- Quant-factor expansion (engine/conditions.py) alerts ---
  conditions_recession_state_change: true   # recession-risk band crossed (low/elevated/high)
  nfci_tightening_z: 0.65              # NFCI crossing above this (tight) fires once
  sahm_trigger: 0.50                  # Sahm rule crossing >= this = labor-recession confirm
  ebp_widening_z: 2.0                 # EBP 1-month change this many sigma = credit risk-off
  drawdown_risk_high: 80              # macro-stress gauge crossing into the high band (P(dd) ~36%)
  capitulation_strong: 2              # capitulation gauge >= this (stacked) = contrarian bounce watch
  # --- fused equity-internal RISK STATE (engine/risk_state.py) alerts ---
  risk_state_elevated: true          # fire when the core risk-state crosses into elevated (>=60)
  hidden_fragility: true             # fire when complacency crosses into watch/hidden-fragility (calm + weak)
  breadth_divergence: true           # fire when index near 1y high while %>200dma turns weak
  # --- per-ticker / per-ETF alert feed (engine/ticker_alerts.py) ---
  ticker_timeline_days: 120           # window shown in each ticker / ETF alert feed
  ticker_max_events: 50               # cap on events kept per feed (most-recent-first)

notify:
  # public base URL of the published site (e.g. https://user.github.io/repo).
  # When set, alert pings deep-link to the exact scorecard panel on macro.html.
  # Leave blank to send alerts without a link.
  site_url: "https://chriswong6031-creator.github.io/macro"
  telegram:
    enabled: true                 # needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID secrets
  discord:
    enabled: true                 # DISCORD_WEBHOOK_URL, or falls back to DISCORD_WEBHOOK_WATCHLIST
                                   # (the one webhook that IS configured) so ops/heartbeat alerts
                                   # actually deliver. send_discord no-ops when neither is present.
  # ping the telegram/discord channel when a tracked EXPERIMENT's results become ready
  # (a forward track-record's verdict advances, or a come-back date arrives) so you don't
  # have to watch the admin Experiments tab. Fires once per experiment, on transition only.
  experiments_alerts: true

# Neural Web W6a — Push spine (engine/alert_triage.py:push_priority_alerts).
# CONFIG-GATED OFF by default.  Enabling this is an operator + Article-2 event:
# it converts the display-only triage priority score into automated outbound
# dispatch.  Priority inputs are unvalidated hand-weights (W_TIER/W_SEVERITY)
# and the cross-asset verdict — these are Article-2 surfaces.  No score is
# RAISED by push_priority_alerts; it only dispatches alerts that already cleared
# the threshold.  W6b: sender migration (routing existing 11 senders through this
# spine) follows when this gate is opened and the dedup window is measured.
alert_push:
  # W6b OPERATOR GATE — Article-2 event: this converts the display-only priority
  # score into automated outbound dispatch. RATIONALE: the three migrating senders
  # (basket_freeze, signal_sanity, healthcheck) already push raw Telegram today with
  # NO dedup and NO priority floor. Routing them through push_ops_alert() reduces
  # operator noise strictly — the dedup window + priority floor suppress repeat fires
  # that would otherwise reach the phone. enabled: false turns off ONLY the
  # dedup/priority/ledger layer — the migrated ops senders fall back to raw direct
  # dispatch (ops/liveness alerts are never silenced). enabled: true is the
  # noise-REDUCED mode (priority floor + 6h dedup). Signal-sentinel migrations
  # (vector/commodity) are phase 3 and are
  # NOT enabled here. Per design adjudication 2026-07-04: this IS the Article-2
  # operator-attention event; it is stated plainly in the W6b PR body.
  enabled: true
  threshold: 60             # priority floor (0-100); 60 = act/critical or act/major-fresh
  window_hours: 6           # dedup: same (source,type,asset) silenced for N hours after send

# Public R2 data-plane freshness tripwire (scripts/audit_r2.py). The heavy per-ticker
# stores are served to the live site from Cloudflare R2 (templates/data_base.js); every
# CI publish is non-fatal and no-ops without creds, so ONLY this probe notices a dead
# plane. Folded into the scheduled heartbeat via scripts/healthcheck.py (telegram + red
# run) and run `--strict --max-age-hours 2` right after each publish in daily/asia CI.
live_flow:
  cadence_sec: 120          # target poll interval (seconds between cycle starts)
  max_concurrent: 2         # HARD LAW — T1 backfill shares the terminal's 8-request cap
  etf_floor: 1000000        # $ gross premium notability floor for ETF anchors
  name_floor: 250000        # $ gross premium notability floor for single names
  retention_hours: 24       # trailing event window in feed_current.json
  top_names: 100            # single-name roots appended after ETF anchors
  near_dte_cap_days: 90     # current-day fallback: cap per-expiration pulls to <=90 DTE (near-dated flow, where notable premium lives)
  # etf_anchors: []         # defaults to 22 anchors (see live_flow_poller._resolve_universe)

# Committed-data-freeze tripwire — folded into the dead-man's-switch heartbeat
# (scripts/healthcheck.py check_committed_data_freshness).  Each witness is a
# cheap, always-liquid parquet file.  FAIL when > fail_after_sessions business
# days stale; WARN when > warn_after_sessions.  The heartbeat runs 14:30 UTC
# weekdays off a fresh checkout of main — so it reads COMMITTED data only.
healthcheck:
  # max_age_hours / breaker_trip / broad_outage stay at the scripts/healthcheck.py
  # code defaults (96h etc.) — this section is added purely for the data_freshness
  # tripwire below, not to retune the existing liveness thresholds.
  data_freshness:
    warn_after_sessions: 1
    fail_after_sessions: 2
    witnesses:              # cheap, always-liquid representatives per market
      - {label: "china_stocks 000001.SZ", path: "data/china_stocks/000001.SZ.parquet"}
      - {label: "china_stocks 600519.SS", path: "data/china_stocks/600519.SS.parquet"}
      - {label: "china_breadth",          path: "data/china_breadth/breadth.parquet"}
      - {label: "hk_stocks 0700.HK",      path: "data/hk_stocks/0700.HK.parquet"}
      - {label: "us_stocks AAPL",         path: "data/stocks/AAPL.parquet"}
    # China Golden Week + Spring Festival 2026–27 (starter set; extend as needed).
    # US/HK single-day holidays fall within the 2-session tolerance so are optional.
    holidays:
      - "2026-10-01"
      - "2026-10-02"
      - "2026-10-05"
      - "2026-10-06"
      - "2026-10-07"
      - "2026-10-08"
      - "2027-02-15"
      - "2027-02-16"
      - "2027-02-17"
      - "2027-02-18"
      - "2027-02-19"

r2_data_plane:
  public_base: "https://pub-f7ffb4441c5f4ad983ca56ec7c651c61.r2.dev"
  anchors: [stockdata, chinastockdata, feeds]  # freshest of <dir>/_manifest.json (put on EVERY successful publish) / <dir>/index.json; feeds = the bot-consumable contract plane (scripts/build_feeds.py, daily lane)
  max_age_hours: 26   # both lanes republish daily, landing ~05-10 UTC; the 14:30 UTC heartbeat sees ~5-9h
                      # fresh vs ~29-33h on the FIRST missed day — 26 trips on the first miss, ~30 can slide to day 2
  asof_max_days: 6    # stockdata/SPY.json `asof` (content-level): last bar date; 3-day weekend + a holiday tolerated

validation:
  start_date: "2007-01-01"
  whipsaw_max_days: 10            # regime lasting < this counts as whipsaw
  whipsaw_target_pct: 15
  forward_return_window_d: 60

# =============================================================================
# Data-quality audit suite (scripts/audit_prices · audit_macro · audit_universe),
# run at the END of scripts/collect.py. DETERMINISTIC rule-based checks only (no ML);
# READ-ONLY over the data stores (every audit only writes data/quality/*_audit.json,
# committed so the trend is visible run-over-run). The governance gate aborts the
# collect (RuntimeError) if more than `abort_fail_pct` of ANY universe fails, and
# merely warns+logs in the `warn_fail_pct`..`abort_fail_pct` band. Soft issues
# (big single-day moves, macro z-outliers, staleness) are logged FLAGS, never fails.
# =============================================================================
quality:
  # --- price stores (audit_prices) ---
  price_max_gap_days: 4          # > this many BUSINESS days between consecutive bars = a hole (fail; tolerates holidays)
  price_move_alert_pct: 20       # |single-day % move| beyond this = FLAG only (log, never fail)
  price_recent_days: 120         # gap + big-move checks look only at the last N calendar days. The stores are
                                 # append-only, so a NEW hole can only appear at the recent edge; this keeps
                                 # immutable deep-history exchange closures (9/11, Hurricane Sandy) from
                                 # false-failing the gate every run, and makes a flagged gap actionable.
  # --- macro series (audit_macro: data/fred · data/china_macro · data/eia) ---
  macro_revision_alert_pct: 5    # a SETTLED historical value changing by more than this vs the prior-run baseline = fail
  macro_stale_days: 45           # last observation older than this (+ the series cadence) = stale FLAG
  macro_outlier_z: 5             # |z| of the latest change beyond this = FLAG only (log, never fail)
  # --- configured universe (audit_universe: config.yml sector/basket/intl lists) ---
  universe_min_bars: 250         # a configured ticker with fewer rows is flagged "short"
  # --- massive_stock_day whole-market store (audit_massive_store) ---
  # 2026-07-03 incident tripwire: the store's manifest claimed latest=2026-06-30 over a
  # 110-day content hole (2026-03-13→2026-06-30). Ground truth = anchor parquets
  # (SPY/QQQ/AAPL/MSFT/IWM), never the manifest.
  massive_max_gap_bdays: 5       # > this many consecutive missing BUSINESS days in an anchor = coverage hole (fail)
  massive_stale_bdays: 5         # newest anchor bar older than this many business days = stale FLAG only
  massive_manifest_ahead_bdays: 2  # manifest latest_date > this many business days ahead of anchor content = lie (fail)
  massive_min_files: 100         # fewer parquets than this = store absent (CI runner checkout) -> skipped, never a fail
  # --- governance gate (collect.py) ---
  abort_fail_pct: 5              # > this % of a universe failing aborts the collect run
  warn_fail_pct: 1               # 1-5% only warns + logs
  # --- alerting ---
  email_alerts: false            # NEVER email — deterministic file + conspicuous log only (no email infra is wired)

# =============================================================================
# Commodity Vector (Section 5). Self-contained block, like `vector:`. Core four —
# gold, silver, oil (WTI), copper. Price + COT already collected 1995/2000-> and
# macro drivers come from the shared FRED/Yahoo store (see
# research/COMMODITY_DATA_AUDIT.md). The asset-agnostic price layer mirrors
# `vector:`; the driver axis + residual shock engine + COT positioning are
# commodity-specific. House rule: mechanical backtestable core; the news/LLM
# event layer is deferred (annotation-only, never a scoring input).
# =============================================================================

# =============================================================================
# Cross-Asset Vector (engine/cross_asset_trend.py) — multi-asset TREND (time-series
# momentum) + intermarket RATIOS + light CARRY context, over the keyless price
# stores (NO new collectors). A LEAF: nothing in scoring imports it. TREND is the
# canonical managed-futures factor; AQR's gross Sharpe ~1.8 is contested, so the
# AFTER-COST/DSR/permutation-null number from scripts/cross_asset_phase0.py is the
# published one (verdict: CONTESTED — shipped as a REGIME read, not a strategy).
# =============================================================================
cross_asset:
  universe:                          # name: [store-group, store-key, price-col, class]
    equity_us:  [yahoo, "SPY",      close, equity]
    equity_sm:  [yahoo, "IWM",      close, equity]
    credit_hy:  [yahoo, "HYG",      close, credit]
    gold:       [yahoo, "GC=F",     close, commodity]
    silver:     [yahoo, "SI=F",     close, commodity]
    copper:     [yahoo, "HG=F",     close, commodity]
    oil:        [yahoo, "CL=F",     close, commodity]
    dollar:     [yahoo, "DX-Y.NYB", close, fx]
    bond_10y:   [fred,  "DGS10",    us10y, rates]   # traded as -duration*Δyield proxy
    crypto:     [yahoo, "BTC-USD",  close, crypto]
  tsmom:
    lookbacks_d: [63, 126, 252]      # 3/6/12-month TSMOM, equal-weight blend of signs
    skip_d: 5                        # skip most-recent week (dodge 1-week reversal)
  ratios:
    pctile_lookback_d: 504           # ~2y window for the intermarket-ratio percentile
  calibration:
    start_date: "2007-01-01"         # all 10 legs live (HY-constrained); phase0 window
    cost_bps: 8                      # one-way; net-of-cost headline (futures-proxy slippage)

# =============================================================================
# Global central-bank LIQUIDITY (engine/global_liquidity.py) — the major-CB
# balance-sheet tide, USD-aggregated, from keyless FRED. Distinct from the BTC
# `global_liquidity` M2 read above (that's broad money; this is CB assets). A LEAF:
# context macro driver, not wired into scoring. Major CBs at usable frequency =
# Fed (weekly) + ECB (weekly) + BoJ (monthly); BoE is annual-only on FRED and a
# clean keyless PBoC series is unavailable, so they are omitted (honest). Each raw
# series -> local currency (unit_mult) -> USD (fx, invert for USD/XXX quotes) ->
# summed in USD trillions; impulse = 13-week & 52-week % change.
# =============================================================================
cb_liquidity:
  banks:                             # id: series, unit_mult(->local ccy), fx(yahoo, null=USD), invert
    fed: {series: WALCL,      unit_mult: 1.0e6, fx: null,        invert: false, label_en: "Federal Reserve", label_zh: "美联储"}
    ecb: {series: ECBASSETSW, unit_mult: 1.0e6, fx: "EURUSD=X",  invert: false, label_en: "ECB",            label_zh: "欧洲央行"}
    boj: {series: JPNASSETS,  unit_mult: 1.0e8, fx: "USDJPY=X",  invert: true,  label_en: "Bank of Japan",  label_zh: "日本央行"}
  impulse_windows_w: [13, 52]        # quarterly & YoY % change of the USD aggregate

# =============================================================================
# OFR Short-Term Funding Monitor (collectors/ofr.py) — repo/SOFR/money-market
# plumbing from the US Office of Financial Research's KEYLESS public JSON API
# (data.financialresearch.gov, "no tokens or registration"). FRBNY reference rates:
# SOFR + its 1/99 percentile distribution, EFFR, OBFR, and GC repo rates. Feeds the
# funding-stress leaf (engine/funding_stress.py) — CONTEXT, never scored.
# =============================================================================
ofr:
  enabled: true
  retries: 3
  series:                            # OFR mnemonic -> stored column name
    FNYR-SOFR-A: sofr
    FNYR-SOFR_99Pctl-A: sofr_p99
    FNYR-SOFR_1Pctl-A: sofr_p1
    FNYR-EFFR-A: effr
    FNYR-OBFR-A: obfr
    FNYR-BGCR-A: bgcr
    FNYR-TGCR-A: tgcr

funding_stress:
  pctile_lookback_d: 504             # ~2y trailing window for the spread/dispersion percentile

# =============================================================================
# Prediction markets (collectors/prediction_markets.py + engine) — market-implied
# odds for macro events from the keyless Polymarket Gamma API. Pairs with the
# FOMC/jobs catalyst calendar on macro.html. Event titles rotate, so each is matched
# by a title substring and the nearest-expiry/max-volume event is picked dynamically;
# each run APPENDS a dated snapshot (history accrues → backtestable later). Private-use
# dashboard. CONTEXT (crowd expectation), never wired into any score.
# =============================================================================
prediction_markets:
  enabled: true
  retries: 3
  events:                            # key: {match(title substr), pick, labels}
    fed_next:  {match: "Fed Decision", pick: nearest_end, label_en: "Next Fed decision", label_zh: "下次美联储决议"}
    fed_cuts:  {match: "rate cuts in", pick: max_volume,  label_en: "Fed cuts this year", label_zh: "今年降息次数"}
    recession: {match: "recession",    pick: max_volume,  label_en: "US recession",       label_zh: "美国衰退"}

# =============================================================================
# BIS global credit cycle (collectors/bis.py + engine/credit_cycle.py) — the
# credit-to-GDP GAP (Borio-Drehmann crisis early-warning) + debt-service ratios,
# from the BIS keyless SDMX v2 API (stats.bis.org, attribution-only licence).
# Quarterly, slow-moving structural CONTEXT on the bonds page — never scored.
# CG_DTYPE: A=credit/GDP ratio, B=trend, C=GAP (we take the gap).
# =============================================================================
bis:
  enabled: true
  retries: 3
  series:                            # store_key: {flow, full SDMX key, col}
    us_gap: {flow: WS_CREDIT_GAP, key: "Q.US.P.A.C", col: gap}
    us_dsr: {flow: WS_DSR,        key: "Q.US.P",     col: dsr}
    cn_gap: {flow: WS_CREDIT_GAP, key: "Q.CN.P.A.C", col: gap}
    cn_dsr: {flow: WS_DSR,        key: "Q.CN.P",     col: dsr}

credit_cycle:
  boom_gap: 10.0                     # credit-to-GDP gap above this = boom / elevated crisis risk (BIS)
  delever_gap: -2.0                  # below this = deleveraging
  countries:
    us: {gap: us_gap, dsr: us_dsr, label_en: "United States", label_zh: "美国"}
    cn: {gap: cn_gap, dsr: cn_dsr, label_en: "China",         label_zh: "中国"}

# =============================================================================
# Rate & inflation TRANSMISSION (engine/rate_inflation_transmission.py +
# scripts/calibrate_rate_inflation.py). A DISPLAY-ONLY leaf that traces how the
# interest-rate / rate-expectations / inflation (CPI, core PCE) state propagates —
# first/second/third order — into per-asset-class headwind/tailwind, with honest
# conditional scenarios. The per-asset pass-through COEFFICIENTS are MEASURED
# (data/transmission/calibration.json: signed split-half forward IC); this block
# holds only the tunables. NEVER scored: the calibrator's scored-leg gate found no
# rate/inflation leg that beats the forward-drawdown bar with purged-CV robustness,
# so every flag below defaults OFF (repricing is reactive; rate-of-change>level).
transmission:
  enabled: true
  calibration:
    split_date: "2015-01-01"         # split-half boundary for the forward-IC robustness check
  z_cap: 2.5                         # clip a driver's current z at +/- this when scoring contribution
  z_active: 0.7                      # |driver z| above this = "currently active / extended"
  effect_cut: 0.06                   # |net contribution| above this = headwind/tailwind (else neutral)
  min_ic: 0.04                       # ignore measured cells weaker than this when aggregating
  # display-only conditional scenarios — the shock sizes the page projects per-asset
  # moves for, using the MEASURED 63d sensitivity. Each is caveated (reactive, regime-
  # dependent, not a forecast).
  scenarios:
    - {key: real_up50,   driver: real10y_chg63,  shock_bp: 50,  label_en: "Real 10y +50bp (persists a quarter)",  label_zh: "实际10年期收益率 +50基点（持续一季度）"}
    - {key: real_dn50,   driver: real10y_chg63,  shock_bp: -50, label_en: "Real 10y -50bp (easing)",               label_zh: "实际10年期收益率 -50基点（宽松）"}
    - {key: be_up30,     driver: be10y_chg63,     shock_bp: 30,  label_en: "Breakeven +30bp (inflation scare)",     label_zh: "盈亏平衡通胀 +30基点（通胀恐慌）"}
    - {key: steepen,     driver: curve_tp_adj,    shock_bp: 50,  label_en: "Curve bull-steepens +50bp (cuts priced)", label_zh: "收益率曲线牛市变陡 +50基点（计入降息）"}
  # SCORED-LEG GATE flags — a rate/inflation risk leg is wired into the macro-risk
  # score ONLY if its flag is true AND it passed the calibrator's gate. All OFF: the
  # 2026-06 calibration found NONE eligible (real-rate SPEED is the strongest but is
  # regime-dependent / fails purged-CV). Flip on only after a refresh confirms.
  scored_legs:
    real_rate_shock: false           # real10y_chg63 -> MRS (DIRECTIONAL only, not robust)
    sticky_inflation: false          # corepce_gap -> MRS

# =============================================================================
# YIELD-CURVE analytics (engine/yield_curve.py) — the unified, theory-grounded
# interest-rate read surfaced on the transmission page + emitted dashboard-wide
# (latest.json["yield_curve"]). DISPLAY-ONLY: reuses the bond-engine curve primitives
# (probit / near-term forward spread / move taxonomy / un-inversion) and the
# transmission IC matrix; the scored-leg gate found NO curve leg robust enough to score.
yield_curve:
  enabled: true
  regime_window_d: 21                # ~1mo window for the bull/bear × steep/flat classification
  neutral_funds: 2.5                 # ~nominal-neutral funds anchor (r* ~0.5% + 2% target) for the Wright policy-stance read
  # (the percentile / momentum / PCA windows are engine constants — PCTILE_LOOKBACK 1260,
  #  MOM_WINDOW 63, PCA_WINDOW 1260 — documented in engine/yield_curve.py.)

# =============================================================================
# Treasury auction RESULTS (collectors/treasury_auctions.py + engine/treasury_supply.py)
# — the DEMAND side of the Treasury market from the keyless TreasuryDirect
# TA_WS/securities/auctioned feed. Display-only "supply absorption" panel on the
# bonds page: per-tenor bid-to-cover / indirect-share / dealer-takedown z-scores vs
# trailing same-tenor auctions + the bills-vs-coupons issuance mix. NEVER scored.
treasury_auctions:
  enabled: true
  retries: 3
  history_days: 3650               # the feed caps at the newest ~250 rows/type regardless
  types: [Bill, Note, Bond, TIPS, FRN]
  trailing: 8                      # same-tenor auctions in the z-score baseline window
  min_trailing: 5                  # need this many priors before scoring an auction
  strong_z: 0.6                    # |absorption z| band for the strong / soft tags
  recent: 10                       # auctions shown in the recent-auctions table
  mix_window_days: 90              # bills-vs-coupons mix window (vs the prior 90d)

commodities:
  assets:                          # name: [yahoo price ticker, cot store-series, class]
    gold:   ["GC=F", cot_gold,   precious]
    silver: ["SI=F", cot_silver, precious]
    copper: ["HG=F", cot_copper, industrial]
    oil:    ["CL=F", cot_oil,    energy]

  drivers:                         # shared macro series: name -> [store-group, store-name]
    real_yield:    [fred, DFII10]        # 10y TIPS real yield — the gold/silver anchor
    dxy:           [yahoo, "DX-Y.NYB"]   # US Dollar Index (1971->; gold/silver dollar driver)
    broad_dollar:  [fred, DTWEXBGS]      # broad trade-weighted USD (2006->); copper/oil driver (measured: corr -0.57/-0.46 vs DXY -0.47/-0.32)
    breakeven10:   [fred, T10YIE]        # 10y inflation breakeven
    breakeven5y5y: [fred, T5YIFR]
    us10y:         [fred, DGS10]
    us2y:          [fred, DGS2]
    fed_balance:   [fred, WALCL]         # Fed balance sheet (net-liquidity proxy)
    indpro:        [fred, INDPRO]        # industrial production (growth)
    vix:           [fred, VIXCLS]

  momentum:                        # ported price vote-ensemble -> [-1,+1]
    smooth_days: 3
    rsi_bull: 55
    rsi_bear: 45
    votes: {ema_trend: 1.0, ema_cross: 1.0, macd_hist: 1.0, sma200: 1.0, roc20: 1.0, rsi_zone: 1.0}
    trigger: 0.5
    exit: 0.25
    confirm_days: 3

  structure:                       # structure-shift oscillator [-1,+1]
    swing_window_d: 20
    breakout_lookback_d: 60
    confirm_days: 3
    trigger: 0.5
    exit: 0.25

  trend:                           # 12-month time-series momentum (TSMOM) — the canonical
    lookback_d: 252                # commodity factor. MEASURED: metals trend (gold up-trend
    confirm_days: 5                # +7.8%/126d 75% hit vs +3.3% down), oil MEAN-REVERTS
    scale: 0.30                    # (calibration tags oil INVERTED -> present as contrarian);
                                   # bounded score = tanh(12m_return / scale)

  risk:                            # saturating composite -> 0..100, threshold 25
    threshold: 25
    exit_threshold: 15
    deadband: 0.10
    vol_window_d: 30
    vol_pctile_lookback_d: 1260    # ~5y (commodities have deep history)
    drawdown_window_d: 90
    drawdown_full_stress: 0.30
    weights:                       # on-chain swapped for COT positioning stress
      vol_pctile: 1.0
      drawdown: 1.0
      momentum_deterioration: 0.75
      positioning_stress: 0.5      # crowded-long COT = downside risk
    oscillator_delta_d: 10
    oscillator_scale: 30

  gauges:
    vol_low_pctile: 0.30
    vol_high_pctile: 0.75
    flow_low_pctile: 0.30
    flow_high_pctile: 0.75

  driver_axis:                     # macro tailwind/headwind: per-asset orientation*weight
    change_window_d: 40            # driver direction = sign of N-day change (smoothed)
    smooth_days: 5
    weights:                       # sign = effect of a RISING driver on the commodity price
      gold:   {real_yield: -1.0, dxy: -1.0, breakeven10: 0.5, fed_balance: 0.5}
      silver: {real_yield: -1.0, dxy: -1.0, breakeven10: 0.5, indpro: 0.5}
      copper: {broad_dollar: -1.0, indpro: 1.0, real_yield: -0.5, us10y: 0.3}  # broad$ > DXY for copper (measured)
      oil:    {broad_dollar: -1.0, breakeven10: 0.5, indpro: 0.5}              # broad$ > DXY for oil (measured)
    trigger: 0.34                  # |score| above -> tailwind / headwind regime
    exit: 0.15

  residual:                        # exogenous-bid detector (the decoupling shock engine)
    return_window_d: 21            # horizon for actual & model-predicted returns
    drivers:                       # which driver CHANGES feed the regression, per asset
      gold:   [real_yield, dxy]
      silver: [real_yield, dxy]
      copper: [broad_dollar, indpro]
      oil:    [broad_dollar]
    min_train_d: 504               # >=2y before first fit (expanding, refit monthly — causal)
    refit_every_d: 21
    z_lookback_d: 252              # rolling std for the shock z-score
    shock_z: 1.5                   # |z| above -> shock flag
    decoupling_corr_window_d: 252
    decoupling_corr_max: 0.2       # |rolling corr to primary driver| below -> decoupled

  positioning:                     # COT spec extremes — ROLLING window (oil handoff, audit §2.3)
    pctile_lookback_d: 756         # ~3y rolling absorbs the 2022 oil NYMEX->ICE level shift
    crowded_long_pctile: 0.85
    crowded_short_pctile: 0.15

  cross_asset:                     # commodity-complex macro-regime quadrant
    ratio_window_d: 60
    dollar_trend_window_d: 60
    growth_proxy: copper_gold      # copper/gold ratio = market-implied growth/rates

  market_drivers:                  # daily "what's driving the tape" attribution (DISPLAY-ONLY)
    window_d: 5                    # attribution horizon — this week's dominant driver
    z_window_d: 252               # history each leg's move is z-scored against
    min_strength: 0.6             # below this avg |z| → "quiet" (no dominant driver)
    dominance_ratio: 1.3          # top must lead the runner-up by this → else "mixed"

  gold_silver_ratio:               # precious-metals value/mean-reversion (gold/silver)
    pctile_lookback_d: 756         # ~3y rolling. MEASURED: high GSR (silver cheap) -> silver
    high_pctile: 0.80              # +11.7%/126d vs +3.5% at low GSR; mild same-direction gold
    low_pctile: 0.20

  brent_wti:                       # oil energy-microstructure (Brent BZ=F vs WTI CL=F, both stored)
    spread_pctile_lookback_d: 504  # MEASURED: spread WIDENING -> WTI +8.2%/126d vs -1.8% narrowing
    change_window_d: 60

  # --- Phase 1 of the four-phase factor build-out: roll-yield CARRY -----------
  # Backwardation (front > deferred) earns positive roll yield and is THE dominant
  # long-run commodity return driver (research/QUANT_FACTOR_EXPANSION.md). Built
  # from Yahoo DATED futures contracts (CLN26.NYM etc.); the engine reconstructs a
  # continuous front-vs-second roll yield from the nearest live contracts.
  carry:
    contracts:                     # asset -> [root, yahoo exchange suffix]
      oil:    ["CL", ".NYM"]
      brent:  ["BZ", ".NYM"]
      gold:   ["GC", ".CMX"]
      silver: ["SI", ".CMX"]
      copper: ["HG", ".CMX"]
    months_back: 8                 # enumerate contract months from now-8 ...
    months_fwd: 5                  # ... to now+5 (drop non-active months that don't quote)
    history_d: 400                 # bdays of reconstructed carry to keep
    pctile_lookback_d: 504         # ~2y percentile of the roll yield
    backwardation_ann: 0.0         # ann roll yield above this => backwardation (positive carry)

  allocation:                      # strategy grids on (momentum, risk)
    variants:
      conservative: {mom_full: 0.6, risk_full: 15, mom_half: 0.5, risk_half: 25}
      moderate:     {mom_full: 0.5, risk_full: 25, mom_half: 0.0, risk_half: 40}
      aggressive:   {mom_full: 0.3, risk_full: 40, mom_half: -0.2, risk_half: 60}
      optimal:      {mom_full: 0.5, risk_full: 25, mom_half: 0.0, risk_half: 50}
    confirm_days: 2

  tactical:
    efficiency_window_d: 30
    strategic_min_efficiency: 0.35
    strategic_max_risk: 40

  calibration:
    start_date: "2001-01-01"       # Yahoo commodity history 2000->
    split_date: "2013-01-01"       # split-half robustness boundary
    forward_days: [21, 63, 126]
    whipsaw_max_days: 10
    whipsaw_target_pct: 15
    cost_bps: 8                    # one-way transaction cost (spread+roll slippage) per unit |Δpos|; liquid commodity futures/ETF proxy — wider than FX spot, tighter than BTC. Allocation CAGR/Sharpe are NET of this
    n_trials: 40                  # honest UPPER-BOUND of independent strategy configs explored per asset, for the Deflated Sharpe haircut — overestimate is conservative (de Prado); raise as you try more

  # --- Phase 5: alerts (daily state-change events) + intraday shock sentinel ---
  alerts:
    timeline_days: 60               # window shown on the commodities.html timeline
    risk_extreme_level: 50          # Risk Index held >= this ...
    risk_extreme_days: 21           # ... for this many days -> capitulation watch
    shock:                          # SYMMETRIC intraday vol-shock state machine (per asset):
      # commodities spike UP on supply shocks (oil/war) AND flush DOWN (gold/silver),
      # so unlike BTC's crash-only machine this fires on a move in EITHER direction.
      vol_window_h: 72              # trailing hourly realized-vol window
      move_window_h: 6              # acute-move measurement window
      enter_sigma: 3.0              # |move| this many sigma ...
      enter_pct:                    # ... AND beyond this absolute % (per-asset; commodity
        gold: 3.0                   #     vol << crypto, so thresholds are asset-specific)
        silver: 5.0
        copper: 4.0
        oil: 5.0
      extended_pct:                 # |24h move| beyond this -> escalate shock -> extended
        gold: 5.0
        silver: 8.0
        copper: 6.0
        oil: 9.0
      stabilize_quiet_h: 12         # quiet hours -> stabilizing
      normal_quiet_h: 48            # quiet hours -> back to normal
      intraday_lookback_d: 60       # trailing hourly window the state machine runs over

# =============================================================================
# Commodity Vector — Phase 6 news/event ANNOTATION layer (engine/commodity_news.py).
# DEFERRED · GATED · ANNOTATION-ONLY · DEFAULT OFF. Honest CONTEXT, never a scoring
# input — the mechanical core never imports it. The upcoming-catalysts watch list
# (OPEC/FOMC/EIA) is keyless and always rendered; headline-fetch (GDELT, keyless)
# + the optional AI cause-classifier only run when `enabled` (and, for the LLM, when
# `llm_classify` AND an ANTHROPIC_API_KEY are present).
# =============================================================================
commodity_news:
  enabled: false                  # MASTER SWITCH — nothing fetches unless true
  source: gdelt                   # only GDELT DOC 2.0 implemented (free, keyless)
  lang: eng                       # GDELT sourcelang filter
  max_records: 6                  # headlines fetched per event (keep small)
  window_days: 3                  # +/- days around the event date (pinned query)
  min_request_interval_s: 6       # GDELT pacing (>= its 5s/req rule + margin)
  cache_dir: data/commodity/news_cache
  cache_ttl_hours: 24
  llm_classify: false             # OPTIONAL AI cause-classifier — off even if a key is present
  llm_model: claude-haiku-4-5     # cheap; ~$0.0007/call
  llm_min_confidence: high        # code-side gate: below this -> "unknown"
  catalysts_horizon_days: 14      # upcoming OPEC/FOMC/EIA watch window (keyless, always on)

# =============================================================================
# Macro news & catalysts (engine/macro_news.py) — ANNOTATION layer for macro.html.
# A LEAF: imports nothing from the scoring core; nothing in scoring imports it.
# "Useful vs useless" news is decided WITHOUT AI: (1) GDELT is queried with a macro
# OR-clause + sourcecountry:US; (2) a reputable-source allowlist + (3) a title-level
# macro-theme gate keep only clearly-macro headlines from quality outlets and TAG
# each by theme; (4) dedup + recency. The "sentiment" shown is the quantitative
# SF-Fed Daily News Sentiment Index (already computed in conditions), NOT per-headline
# AI. The OPTIONAL llm_brief is the only AI — a gated, default-off narrator that
# writes one context paragraph and feeds NO score. Catalysts (FOMC + jobs report)
# are keyless and always on.
# =============================================================================
macro_news:
  enabled: true                   # MASTER SWITCH for the GDELT fetch + LLM brief
  lang: eng
  window_days: 4                  # fetch the last N days of macro news
  max_records: 200                # candidates pulled from GDELT before filtering
  max_show: 18                    # headlines shown after filtering
  min_importance_score: 34        # drops official/wire plumbing that is not macro-relevant
  min_request_interval_s: 6       # GDELT pacing
  gdelt_attempts: 2
  gdelt_timeout_s: 15
  use_official_feeds: true        # BEA/BLS/Census/Fed/TreasuryDirect/SEC RSS bundle
  use_official_pages: true        # Treasury/BEA/Census pages where RSS coverage is patchy
  use_news_feeds: true            # stock-wire + market RSS (CNBC/MarketWatch/SA/Benzinga/WSJ/Yahoo/NPR)
  news_window_days: 5
  official_window_days: 45
  cache_dir: data/macro/news_cache
  cache_ttl_hours: 12
  catalysts_horizon_days: 14
  # reputable macro/financial source allowlist (substring match on article domain).
  # Omit to use the built-in default list in engine/macro_news.py.
  sources: []
  # official release dates the calendar can't compute (CPI/GDP/Jackson Hole/etc.) —
  # add {type, date: 'YYYY-MM-DD', label, time_et} rows as the BLS/BEA schedule firms up.
  extra_catalysts: []
  # OPTIONAL AI brief — the only AI; off even if a key is present. Provider-agnostic
  # (DeepSeek/Anthropic wire), degrade-to-keyless, never scored.
  llm_brief: false
  llm_model: deepseek-chat
  base_url: https://api.deepseek.com/anthropic   # omit / null for native Anthropic
  api_key_env: DEEPSEEK_API_KEY

# =============================================================================
# News-vector PIT event bus (engine/news_vector.py) — Stage 1 of the narrative-
# quantification framework (memory narrative-quant-framework). A first-print,
# append-only, keep-FIRST event store over a NARRATIVE-scope GDELT slice
# (trade/geopolitics/industrial-policy + macro). DISPLAY-ONLY / CONTEXT-ONLY: its
# value is measurement integrity, not alpha — nothing here is ever scored. The LLM
# structured-extraction stage is STUBBED OFF (enabled + llm_extract both false).
# =============================================================================
news_vector:
  enabled: true                   # MASTER SWITCH for the GDELT fetch + accrual (ON: accrues the forward PIT event store)
  llm_extract: false              # Stage-C structured extraction — OFF in P0 (no model call)
  lang: eng
  window_days: 2                  # fetch the last N days of narrative news
  max_records: 120                # candidates pulled from GDELT before the gate
  min_request_interval_s: 6       # GDELT pacing (>=6s)
  cache_dir: data/news_vector/fetch_cache
  cache_ttl_hours: 12
  use_fred: true                  # scheduled_ref via FRED release dates; degrades to static CY2026
  # Omit `sources`/`query_terms` to use the built-in defaults in engine/news_vector.py.
  sources: []                     # reputable-source allowlist override (default = macro_news list)
  query_terms: []                 # GDELT OR-clause override (default = narrative core)

# =============================================================================
# China macro news, official policy-tone & narrative regime (engine/china_news.py +
# collectors/china_news.py) — the China sibling of macro_news/narrative_regime, powering
# the "📰 Macro news, sentiment & catalysts" panel on china.html. KEYLESS, DISPLAY-ONLY,
# never scored. The CCTV 新闻联播 policy-tone series is accrued by the collector; the
# Eastmoney 全球财经快讯 flash headlines are fetched at build time and cached.
# =============================================================================
china_news:
  enabled: true                   # MASTER SWITCH for the Eastmoney headline fetch + LLM brief
  backfill_days: 120              # collector: CCTV days fetched on --full-history (tone series seed)
  incremental_days: 6             # collector: CCTV days re-fetched each run (fills weekend/missed gaps)
  request_pace_s: 0.4             # collector: politeness pause between CCTV day-page fetches
  tone_window: 90                 # engine: z-score window (trading days) for the policy-tone
  tone_smooth: 5                  # engine: rolling-mean smoothing of the sparse daily tone
  max_records: 80                 # Eastmoney flashes pulled before the macro-theme gate
  max_show: 18                    # macro headlines shown after filtering
  min_importance_score: 34        # keeps official/global-wire context but drops weak filler
  use_official_pages: true        # PBoC/NBS/MOF/State Council/CSRC/SAFE/MOFCOM pages
  use_news_feeds: true            # SCMP/Nikkei RSS direct media leg
  use_news_pages: true            # Chinese-native pages (Yicai/STCN/CNStock/Sina/Eastmoney) + Caixin
  use_wire_gdelt: true            # Reuters/FT/SCMP/Caixin-style global wire via GDELT
  news_window_days: 7
  wire_window_days: 5
  wire_max_records: 180
  wire_attempts: 2
  wire_timeout_s: 12
  cache_dir: data/china_news/flash_cache
  cache_ttl_hours: 12
  # OPTIONAL AI brief — the only AI; off even if a key is present. Provider-agnostic
  # (DeepSeek/Anthropic wire), degrade-to-keyless, never scored.
  llm_brief: false
  llm_model: deepseek-chat
  base_url: https://api.deepseek.com/anthropic   # omit / null for native Anthropic
  api_key_env: DEEPSEEK_API_KEY

# Communiqué Diff (W4 B1) — discrete, dated phrase-diff events from official Chinese
# policy corpora (collectors/china_official_corpora.py + engine/communique_diff.py).
# The ONE China path to standalone validation (spec D9 / Appendix P4): rather than a
# bag-of-words tone, detect APPEARED / DROPPED / lead-item-shift of ~44 canonical
# formulas across a running window of official documents. SALIENCE-ONLY (direction=0)
# because phrase polarity is human-review PROVISIONAL; the forward log accrues today.
# Browser UA + pacing (gov.cn is IP-reputation-sensitive [P4], the FREDGRAPH_UA
# pattern). CONTEXT-ONLY, never a scoring input. See config/qual_ladder.yml.
china_official:
  enabled: true                   # MASTER SWITCH for the official-corpora collector
  request_pace_s: 1.0             # politeness pause between leaf fetches + between organs
  timeout_s: 15
  max_docs_per_organ: 12          # document leaves fetched per organ per crawl
  max_body_chars: 20000           # cap stored body text per document
  min_title: 6                    # skip anchor "titles" shorter than this
  fetch_bodies: true              # pull each leaf's body (else title-only, faster/politer)
communique_diff:
  window_days: 30                 # trailing comparable-document window per organ
  corpus_read_days: null          # read the full accrued corpus (null) or the last N day-files

# China News powerhouse — multi-source wire + PIT event bus + media-sentiment
# (engine/china_news_intel.py + collectors/china_news_wire.py). The China sibling of
# news_vector: a first-print, point-in-time, keep-FIRST headline log across several free
# wires + EN state RSS, theme-gated + scheduled-ref stamped, plus a media-sentiment index
# (CCTV tone blended with a daily multi-source wire tone). CONTEXT-ONLY, never scored.
# See research/CHINA_INTEL_POWERHOUSE.md §1.
china_news_intel:
  enabled: true                   # MASTER SWITCH for the multi-source headline fetch + accrual
  wire_sources:                   # akshare flash endpoints tried in order (each degrades)
    - stock_info_global_em
    - stock_info_global_sina
    - stock_info_global_ths
    - stock_info_global_futu
  rss_sources:                    # keyless English state-wire RSS (stdlib XML parse)
    - https://english.news.cn/rss/businessrss.xml
    - https://www.chinadaily.com.cn/rss/bizchina_rss.xml
  max_per_source: 60              # raw items pulled per wire before the theme gate
  max_show: 14                    # headlines shown in the feed after filtering
  sentiment_window: 90            # z-score window (days) for the media-sentiment index
  sentiment_smooth: 5             # rolling-mean smoothing of the blended daily tone
  cache_dir: data/china_news/intel_cache
  cache_ttl_hours: 6
  # OPTIONAL AI brief — same provider stack as china_news; off even with a key.
  llm_brief: false
  llm_model: deepseek-chat
  base_url: https://api.deepseek.com/anthropic
  api_key_env: DEEPSEEK_API_KEY

# =============================================================================
# Financial / sector / Mag-7 / thematic-basket news (engine/financial_news.py) — the
# flagship feed for the Research → News page. A LEAF: imports only lib.config +
# engine.news_common; nothing in scoring imports it. Ticker-TAGGED corpus from
# Polygon (+ Finnhub market/company) routed into Mag-7 / sector-ETF / basket /
# per-ticker sections via the entity map, plus keyless GDELT thematic queries per
# sector. Ranked by the transparent engine.news_common.quality_score; never scored.
# Keys reused from the daily build: POLYGON_API_KEY / MASSIVE_API_KEY, FINNHUB_KEY.
# =============================================================================
financial_news:
  enabled: true                   # MASTER SWITCH for the financial-news feed
  window_days: 3                  # how far back to pull ticker-tagged news
  cache_dir: data/financial_news/cache
  cache_ttl_hours: 12
  gdelt: true                     # keyless GDELT thematic supplement (market + 11 sectors)
  gdelt_window_days: 2
  gdelt_max_records: 40
  finnhub_company: true           # per-Mag7 company-news (7 extra Finnhub calls)
  include_quiver: true            # fold the Quiver /quivernews tail into the one news surface
  quiver_max: 60                  # most-recent Quiver press-release rows to fold in
  # per-section display caps (after dedup + quality rank)
  top_market: 18
  top_sector: 8
  top_mag7: 6
  top_basket: 8
  top_ticker: 6

# =============================================================================
# News LLM processor (engine/news_llm.py) — OPTIONAL cheap batch summaries + an
# "importance" re-rank layered on top of the deterministic quality score. It never
# gates a headline in/out and feeds NO score. Provider order: Claude Haiku via the
# subscription OAuth token (CLAUDE_CODE_OAUTH_TOKEN), then Claude Haiku via
# ANTHROPIC_API_KEY, then DeepSeek V4-Flash via DEEPSEEK_API_KEY. Degrades to a
# no-op pass-through whenever no credential is present.
# =============================================================================
news_llm:
  enabled: false                  # W5 P5 R3: DEFAULT OFF — zero silent spend. The
                                  # annotator computes llm_importance/llm_tone but NO
                                  # downstream consumer reads those fields (confirmed by
                                  # grep: only build_news._blend_key uses them for sort,
                                  # and the deterministic quality score is the primary key).
                                  # Re-enable only after registering a scored consumer in
                                  # config/qual_ladder.yml + a qledger claim family entry.
                                  # See engine/news_llm.py module docstring for details.
  provider_order: [oauth, anthropic, deepseek]
  oauth_token_env: CLAUDE_CODE_OAUTH_TOKEN
  deepseek_key_env: DEEPSEEK_API_KEY
  anthropic_model: claude-haiku-4-5
  deepseek_model: deepseek-chat
  batch_size: 12                  # headlines summarised per model call (when enabled)
  max_batches: 16                 # hard cap on model calls per build (cost guard)

# =============================================================================
# Company-profile translation (engine/translate.py + scripts/translate_profiles.py).
# The single-stock analyzer's "Business profile" blurb is sourced English free text
# (Wikipedia/SEC) — not a UI string, so it can't be dual-emitted like the rest of the
# i18n. This OPTIONAL, GATED, CACHED pass machine-translates each blurb to 简体中文 once
# (keyed by a hash of the English, so only new/changed text re-hits the API) and stores
# it in data/profile/descriptions_zh.parquet; _load_profiles() joins it so the analyzer
# can `lz()`-pick by language. DEFAULT OFF + degrade-never-raise: no key / disabled =>
# the blurb simply stays English (today's behavior). Provider-agnostic (Anthropic-compatible
# wire format): DeepSeek (cheap, 中文-native — the documented choice) or Anthropic.
# =============================================================================
profile_translation:
  enabled: true                   # gate; still a no-op unless the api_key_env key is set
  provider: deepseek              # deepseek | anthropic (label only; both use the anthropic SDK)
  model: deepseek-chat            # DeepSeek V3.x chat; or e.g. claude-haiku-4-5 for anthropic
  base_url: https://api.deepseek.com/anthropic   # omit / null for native Anthropic
  api_key_env: DEEPSEEK_API_KEY   # which env var (or .env entry) holds the key
  batch_size: 20                  # blurbs per request (short text; JSON-array contract, validated)
  max_chars: 600                  # truncate pathologically long blurbs before sending
  max_tokens: 4000                # response cap per batch

# =============================================================================
# News headline translation (engine/news_translate.py)
# Build-time, cached Simplified-Chinese translation for sourced English headlines.
# Static pages cannot safely call an API from the browser, so this runs only during
# local renders / daily workflows and degrades to English when unkeyed or rate-limited.
# =============================================================================
news_translation:
  enabled: true
  provider: deepseek
  model: deepseek-chat
  base_url: https://api.deepseek.com/anthropic
  api_key_env: DEEPSEEK_API_KEY
  batch_size: 16
  max_chars: 360
  max_tokens: 3000
  cache_dir: data/news_translation/cache

# Catalyst tone — market/regime narrative DIGEST (LLM Tier A; engine/catalyst_tone.py).
# LEAF · DEFAULT-OFF · CONTEXT-ONLY. Digests ONE public document (FOMC text, a
# regulatory release, dislocation-day catalyst text) into a typed tone/guidance/
# risk/shock-reversibility record. Runs on DeepSeek V4 Flash via its
# Anthropic-compatible endpoint (the same `anthropic` SDK, base_url + key swapped).
# Safety is in CODE: JSON-parse -> schema-validate -> verbatim-citation-verify ->
# confidence-floor -> degrade-never-raise. PUBLIC source documents only.
# Promotion of a field to a deterministic feature happens downstream, separately gated.
# =============================================================================
catalyst_tone:
  enabled: true                   # MASTER SWITCH — nothing calls the model unless true
  api_key_env: DEEPSEEK_API_KEY   # credential read from env / .env (gitignored)
  llm_base_url: https://api.deepseek.com/anthropic   # DeepSeek Anthropic-compat endpoint
  llm_model: deepseek-v4-flash    # cheap digest model ($0.14/$0.28 per 1M tok)
  llm_min_confidence: medium        # code-side floor: below this every field -> "unknown"
  max_tokens: 1500                 # OUTPUT cap (the JSON record is tiny); input can be a full doc
  max_doc_chars: 20000            # input doc is trimmed to the statement body + capped
  max_age_days: 120               # ignore FOMC statements older than this (stale context)
  cache_dir: data/catalyst/digest_cache   # one digest cached per meeting (never re-called)
  event_enabled: true             # Stage 3b: on a dislocation day with no FOMC read, digest that day's news
  event_window_days: 2            # GDELT window +/- around the dislocation day
  event_max_records: 8            # headlines fetched for the event digest (keep small)

# =============================================================================
# Master brain — multi-LENS macro SYNTHESIS (LLM Tier-B; engine/master_brain.py).
# LEAF · DEFAULT-OFF · RESEARCH/CONTEXT-ONLY. Reads the dashboards' deterministic
# latest.json files and writes an analyst's morning brief per lens. NEVER feeds a score.
# Three lenses share one engine + one set of LLM creds:
#   macro -> data/regime/master_brief.json  (cross-asset; shown on the US dashboard)
#   china -> data/regime/china_brief.json   (China & HK focused; shown on china.html)
#   btc   -> data/regime/btc_brief.json     (Bitcoin focused; shown on vector.html)
# Each also writes a site/ copy the dashboard panel fetches at runtime. The daily
# pipeline step `python -m engine.master_brain` runs every lens in `lenses` (below).
# Runs on DeepSeek V4 Pro now; swap llm_model/llm_base_url/api_key_env to move to
# Claude Opus later (e.g. llm_model: claude-opus-4-8, llm_base_url removed,
# api_key_env: ANTHROPIC_API_KEY). Sends DERIVED state (no holdings) to the provider.
# Run one lens on-demand: `python -m engine.master_brain china --force`.
# =============================================================================
master_brain:
  enabled: true                   # MASTER SWITCH — pipeline runs it only when true
  interval_days: 1                # regenerate the briefs every N days (1..7). 1 = every
                                  # build (default); >1 keeps the prior brief live and
                                  # skips the (paid) LLM call until it's that many days old
                                  # — set from the admin dashboard's AI Brief panel.
  lenses: [macro, china, btc]     # which briefs to generate (one LLM call each)
  api_key_env: DEEPSEEK_API_KEY
  llm_base_url: https://api.deepseek.com/anthropic
  llm_model: deepseek-v4-pro      # reasoning tier ($0.435/$0.87 per 1M tok)
  max_tokens: 8000                # V4 Pro is a REASONING model — thinking tokens count
                                  # against this cap, so the JSON needs headroom above
                                  # the ~1.2k it occupies (4000 truncated china/btc mid-JSON)
  translate_zh: true              # attach a 中文 version (cheap V4-Flash pass) per brief
  # rotation_thesis: "<override the macro lens's liquidity-rotation hypothesis>"
  # china_thesis: "<override the china lens's working thesis>"
  # btc_thesis:   "<override the btc lens's working liquidity thesis>"

# =============================================================================
# AI Desk — the accountable analyst LAYER (LLM Tier-C; engine/ai_desk.py).
# LEAF · CONTEXT-ONLY · NEVER-SCORED. The inference layer ON TOP of the TRUST-GRADED
# detectors: reads Engine-1 flow (site/basketdata/flow.json) + Engine-2 regime-snap
# (data/regime/regime_snap.json) and emits FALSIFIABLE conditional leans — each with a
# check-by date + an ENGINE-derived machine-checkable predicate — appended to
# data/ai_desk/theses.jsonl so the Phase-C scorer can grade them and feed the hit-rate
# back into conviction. Output is a DIRECTION, never a size or a trade; nothing in
# axes/regime/conditions imports it. Invoked from scripts/build_aibrief.py each build
# (after build_baskets writes flow.json). On-demand: `python -m engine.ai_desk --force`.
# =============================================================================
ai_desk:
  enabled: true                   # MASTER SWITCH — pipeline runs it only when true
  interval_days: 1                # regenerate the desk note every N days (1..7); 1 =
                                  # every build. >1 keeps the prior note live (and skips
                                  # the ledger append) until it's that many days old.
  api_key_env: DEEPSEEK_API_KEY
  llm_base_url: https://api.deepseek.com/anthropic
  llm_model: deepseek-v4-pro      # reasoning tier; swap to claude-opus-4-8 later
  max_tokens: 8000                # reasoning model — thinking tokens count vs cap
  max_theses: 3                   # cap leans per note (honesty over content)
  default_horizon_d: 20           # trading-day horizon when the model omits one
  falsifier_defaults:
    rel_return: 0.05              # ±5% sector-vs-SPY move = the wrong-way threshold
  panel:
    enabled: true                # Phase B: 4-analyst adversarial panel (opportunity/
                                 # skeptic/base-rate/structural) -> desk-head adjudicator.
                                 # false = single analyst (cheaper: 1 LLM call vs 5).

# Narrative Brain — Claude reasoning desk for the Divergence Radar (engine/narrative_brain.py).
# Reads site/basketdata/radar.json as an evidence pack; judges theme durability/continuity
# (Sonnet, per theme) + a cross-theme rotation read (Opus). Falsifiable + ledger-graded;
# a CODE clamp blocks ENTER on a fading/negative theme. CONTEXT-ONLY — no score/allocation.
narrative_brain:
  enabled: true                  # MASTER SWITCH (no-op anyway without a token)
  oauth_token_env: CLAUDE_CODE_OAUTH_TOKEN   # Claude-Code OAuth (Bearer + oauth beta header)
  api_key_env: ANTHROPIC_API_KEY             # fallback if no OAuth token
  models:
    durability: claude-sonnet-4-6   # per-theme durability/continuity (medium reasoning)
    rotation: claude-opus-4-8       # one cross-theme rotation synthesis (deep)
  interval_days: 1
  max_themes: 6                  # cap per-theme LLM calls (cost + honesty over breadth)
  max_tokens: 6000
  horizon_d: 21                  # trading-day horizon for the falsifiable proxy-vs-SPY check
  rel_threshold: 0.05            # ±5% proxy-vs-SPY = the wrong-way threshold

# Risk Brain — daily Claude/Opus DRAWDOWN-RISK officer over the deterministic risk stack
# (engine/risk_brain.py). LEAF · CONTEXT-ONLY · DEGRADE-NEVER-RAISE. Reads the engine's own
# outputs (risk_state, mtf_monitor, GEX, breadth, baskets, rotation, standouts), writes
# site/riskdata/risk_brain.json (a Mastermind contract artifact). The de-risk DIRECTIVE is a
# SIZING posture clamped in code to be no LESS cautious than the engine; never stock selection.
risk_brain:
  enabled: true                  # MASTER SWITCH (no-op anyway without a token)
  oauth_token_env: CLAUDE_CODE_OAUTH_TOKEN   # Claude-Code OAuth (Bearer + oauth beta header)
  api_key_env: ANTHROPIC_API_KEY             # fallback if no OAuth token
  model: claude-opus-4-8         # deep daily risk reasoning
  interval_days: 1
  max_tokens: 5000
  max_gross_tilt: 0.5            # cap on the subtract-only gross reduction the directive can imply
  horizon_d: 21                  # trading-day horizon for the falsifiable drawdown thesis
  dd_threshold_pct: 5.0          # the SPY drawdown the elevated-state thesis is graded on

# Risk Radar self-correction loop (engine/risk_radar_review.py). Opus reviews the radar's graded
# MISTAKES (false positives + missed drawdowns) and proposes calibration nudges to cut FPs + catch
# misses. TWO guards: a CODE clamp (bands +/-12 & ordered, leg thr_pct in [0.80,0.97], prob_cal in
# [0,0.6] & monotonic, alert_from >= caution) AND a do-no-harm BACKTEST gate (apply only if
# historical alert F1 improves full+2020 without breaking the evidence gate). Default-off w/o token.
risk_radar_review:
  enabled: true                  # MASTER SWITCH (no-op without a token)
  oauth_token_env: CLAUDE_CODE_OAUTH_TOKEN
  api_key_env: ANTHROPIC_API_KEY
  model: claude-opus-4-8
  interval_days: 7               # retune weekly (needs matured outcomes)
  max_tokens: 4000
  min_graded: 30                 # don't retune until >=30 calls have been graded
  band_max_delta: 12.0           # bands may move at most this far from the baked default

# =============================================================================
# White House Watch — primary-source policy monitor + Claude-Opus alert desk
# (engine/whitehouse_feed.py + engine/whitehouse_brain.py + scripts/build_whitehouse.py).
# LEAF · CONTEXT-ONLY · DEGRADE-NEVER-RAISE. The hourly `whitehouse-sentinel` workflow
# polls the White House RSS feeds; each NEW announcement is judged by the Opus brain for
# market significance. An activated alert drives the site-wide ticker banner
# (site/wh_banner.json → templates/wh_banner.js) and a report on site/whitehouse.html
# (implications · sector head/tailwinds · the names most exposed). Nothing here feeds a
# score, size or allocation. AUTH order: Claude-Code OAuth (Opus) → ANTHROPIC_API_KEY
# (Opus) → DeepSeek reasoning (so CI still runs without the subscription token).
# =============================================================================
whitehouse:
  enabled: true                   # MASTER SWITCH — no-op anyway without a provider
  oauth_token_env: CLAUDE_CODE_OAUTH_TOKEN   # the "Opus brain via the CLI" (Bearer + oauth beta)
  api_key_env: ANTHROPIC_API_KEY             # direct-API fallback
  deepseek_key_env: DEEPSEEK_API_KEY         # last-resort reasoning fallback (CI without the token)
  deepseek_base_url: https://api.deepseek.com/anthropic
  opus_model: claude-opus-4-8     # the significance + report model
  deepseek_model: deepseek-v4-pro
  provider_order: [oauth, anthropic, deepseek]
  max_tokens: 4000
  min_importance: 60              # importance floor (0-100) below which NO banner activates
  max_banner_days: 7             # hard ceiling on how long a banner stays live
  max_tickers: 8                 # cap named beneficiaries per alert (honesty over breadth)
  max_sectors: 6
  max_new_per_run: 6             # cap brain calls per sentinel run (cost guard)
  max_banner_alerts: 6           # cap LIVE banners on the scrolling ticker (readability)

# =============================================================================
# Alt-Data Brain — Claude-Opus convergence analyst for the Signal Intelligence desk
# (engine/altdata_brain.py). Reads the deterministic weighted-convergence substrate +
# the influence graph as an EVIDENCE PACK and emits an ACTIONABLE scored axis (action /
# conviction / direction + a FALSIFIABLE thesis graded vs SPY) that the Mastermind bot
# consumes. Runs in its OWN gated daily step (after build_alt_data) with the OAuth token,
# then re-renders the page. No-op without a token. A hard CODE clamp prevents ACCUMULATE
# on an extended name. Haiku does the cheap high-volume tagging (influence.extract below).
# =============================================================================
altdata_brain:
  enabled: true                  # MASTER SWITCH (no-op anyway without a token)
  oauth_token_env: CLAUDE_CODE_OAUTH_TOKEN   # Claude-Code OAuth (Bearer + oauth beta header)
  api_key_env: ANTHROPIC_API_KEY             # fallback if no OAuth token
  models:
    reasoning: claude-opus-4-8      # the cross-signal convergence reasoning (deep)
    tagging: claude-haiku-4-5-20251001   # cheap high-volume tagging (influence extractor)
  interval_days: 1
  max_clusters: 12               # cap the per-day clusters reasoned over (cost + focus)
  max_tokens: 8000
  horizon_d: 63                  # ~3 trading months — alt-data flow is medium-horizon
  rel_threshold: 0.05            # ±5% name-vs-SPY = the wrong-way threshold
  min_weighted: 0.9             # weighted-convergence floor to enter the evidence pack

# Influence graph — multi-actor affiliation graph (engine/influence). The curated seed
# (data/altdata/influence_seed.json) is always on; the LLM extractor that GROWS it from
# news is gated + default-off (cheap Haiku tagging via the OAuth path).
influence:
  extract:
    extract: false               # MASTER SWITCH for the LLM edge extractor (default off)
    oauth_token_env: CLAUDE_CODE_OAUTH_TOKEN
    api_key_env: ANTHROPIC_API_KEY
    model: claude-haiku-4-5-20251001
    news_limit: 50

# =============================================================================
# Stock desk — accountable AI JUDGMENT layer on the US standout top-picks
# (engine/stock_desk.py; T9). The per-stock sibling of ai_desk: turns each top pick's
# deterministic Conviction profile into a FALSIFIABLE LEAN (constructive/neutral/
# cautious/avoid vs SPY over a horizon) that is SCORED against realized returns into a
# track record. HONEST: the cross-sectional rank has no validated forward edge (the
# deep+PIT event gate is NEUTRAL — reports/sue-insider-deep-phase0.md) — this is
# accountability/explainability, not alpha. The model may NEVER overrule the risk reshape
# (a name flagged extended/avoid or cycle_blocked is clamped out of 'constructive'); it
# NEVER gives a size. One LLM call/build, gated. Run: `python -m engine.stock_desk --force`.
# =============================================================================
stock_desk:
  enabled: true                   # MASTER SWITCH — nothing calls the model unless true
  interval_days: 1                # regenerate leans every N days (1..7); 1 = every build
  api_key_env: DEEPSEEK_API_KEY
  llm_base_url: https://api.deepseek.com/anthropic
  llm_model: deepseek-v4-pro      # reasoning tier; swap to claude-opus-4-8 later
  max_tokens: 8000                # reasoning model — thinking tokens count vs cap
  max_picks: 6                    # judge the top N board names (1..12; honesty over breadth)
  default_horizon_d: 21           # trading-day horizon when the model omits one
  falsifier_defaults:
    rel_return: 0.05              # ±5% name-vs-SPY move = the wrong-way threshold

# =============================================================================
# Policy Intent Desk — the realpolitik LLM layer on the Fed/Admin intel substrate
# (engine/policy_intent_desk.py). LEAF · NEVER-SCORED · no-op without DEEPSEEK_API_KEY.
# Reads data/policy/intel.json + live market state -> dated, FALSIFIABLE intent leans
# (a proxy ticker vs SPY) appended to data/policy_intent/theses.jsonl and scored over
# time (reuses ai_desk_scorer evaluators). Surfaced on site/policy_watch.html.
# =============================================================================
policy_intent_desk:
  enabled: true                  # runs in the pipeline; degrades to no-op without the key
  api_key_env: DEEPSEEK_API_KEY
  llm_base_url: https://api.deepseek.com/anthropic
  llm_model: deepseek-v4-pro
  max_tokens: 8000
  interval_days: 7               # slow-moving policy layer — weekly regen (keeps prior note live between)
  max_theses: 5
  default_horizon_d: 40          # policy horizons run longer than flow (10..126 td)
  falsifier_defaults:
    rel_return: 0.05             # ±5% proxy-vs-SPY move = the wrong-way threshold

# =============================================================================
# Catalyst stock — single-stock research BRIEF (LLM "Option 2"; engine/catalyst_stock.py).
# LEAF · DEFAULT-OFF · RESEARCH/CONTEXT-ONLY. The per-stock analogue of master_brain:
# assembles ONE ticker's PUBLIC context (cycle/ladder signal + technical state +
# cross-sectional factor z-scores + SEC-EDGAR fundamentals), adds an OPTIONAL
# DeepSeek V4 Flash news digest (reuses catalyst_tone wholesale; gated by
# catalyst_tone.enabled), then a DeepSeek V4 Pro reasoning pass ->
# {summary, drivers[], risks[], catalysts[], confidence}. NEVER feeds a score/signal/
# size; NO holdings/positions/watchlist are ever read or sent. The static site can't
# call the model on demand (no server-side key), so the pipeline PRECOMPUTES briefs
# for the watchlist's suggested tickers + the action-board standouts into
# site/stockbrief/<TICKER>.json (cached per ticker per day, ~$0.04 each). On-demand
# any-ticker needs a serverless proxy (Supabase Edge Function) — documented follow-up.
# Run on-demand: `python -m engine.catalyst_stock AAPL --force`.
# =============================================================================
catalyst_stock:
  enabled: true                   # MASTER SWITCH — nothing calls the model unless true
  api_key_env: DEEPSEEK_API_KEY   # credential read from env / .env (gitignored)
  llm_base_url: https://api.deepseek.com/anthropic   # DeepSeek Anthropic-compat endpoint
  llm_model: deepseek-v4-pro      # reasoning tier for the brief ($0.435/$0.87 per 1M tok)
  llm_min_confidence: medium      # (news leg uses catalyst_tone's own floor)
  max_tokens: 2000                # OUTPUT cap — the brief is a small JSON record
  news_enabled: true              # OPTIONAL Flash news digest (also needs catalyst_tone.enabled)
  news_window_days: 5             # GDELT lookback window for company headlines
  news_max_records: 8             # headlines fetched per ticker (keep small)
  precompute_max: 30              # hard cap on tickers briefed per build (cost guard)
  brief_cache_dir: data/catalyst/stockbrief_cache   # one brief cached per ticker per day

# =============================================================================
# Forex Vector — currency signal board (research/FOREX_DASHBOARD.md).
# A structural CLONE of the commodities section: same conviction()/factor_panel
# engine, same -100..+100 scale + STRONG/weak bands, same split-half calibration.
# Three FX-specific deviations: (1) DOLLAR-FIRST — a broad-dollar master tile,
# and every pair's per-pair signal is scored on the dollar-ORTHOGONALIZED
# residual so 8 USD pairs aren't one repeated dollar bet; (2) verdict headline is
# RISK-CONTEXT (UIP failure + carry crash skew), LONG/SHORT-base secondary;
# (3) pegs/intervention force HOLD. Every input is free/keyless. All signals are
# CONTEXT, not alpha — see LIMITATIONS.md.
# =============================================================================
forex:
  active: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD, USDMXN, USDBRL, USDCNH]  # full board (Phase 3)

  # pair -> orientation + data wiring.
  #   base       = the non-USD currency we score (LONG-base = long it vs USD)
  #   invert     = yahoo symbol quotes USD as BASE (USD/xxx); take 1/price for base-vs-USD
  #   short_rate = fx_rates_short column for the carry differential (US leg = fed_funds/DFF)
  #   long_rate  = fx_rates_long column (foreign 10y) for the rate-differential factor vs US10y
  #   reer       = fx_reer column (BIS real effective rate) for the value factor
  #   carry: context = no carry weight (no clean free front-end rate) — EM tiles
  #   fred_fallback (price) is used when the Yahoo series has too little history (USD/CNH)
  assets:
    EURUSD: {yahoo: "EURUSD=X", fred: DEXUSEU, cot: cot_euro_fx, archetype: major,           base: EUR, invert: false, short_rate: ez_short, long_rate: ez_10y, reer: reer_ez}
    USDJPY: {yahoo: "USDJPY=X", fred: DEXJPUS, cot: cot_yen,     archetype: haven-funder,     base: JPY, invert: true,  short_rate: jp_short, long_rate: jp_10y, reer: reer_jp, peg: {kind: intervention, watch: [150, 162]}}
    AUDUSD: {yahoo: "AUDUSD=X", fred: DEXUSAL, cot: cot_aussie,  archetype: commodity-dollar, base: AUD, invert: false, short_rate: au_short, long_rate: au_10y, reer: reer_au, commodity: ["HG=F", "GC=F"]}
    GBPUSD: {yahoo: "GBPUSD=X", fred: DEXUSUK, cot: cot_pound,   archetype: major,            base: GBP, invert: false, short_rate: gb_short, long_rate: gb_10y, reer: reer_gb}
    USDCAD: {yahoo: "USDCAD=X", fred: DEXCAUS, cot: cot_cad,     archetype: commodity-dollar, base: CAD, invert: true,  short_rate: ca_short, long_rate: ca_10y, reer: reer_ca, commodity: ["CL=F"]}
    USDCHF: {yahoo: "USDCHF=X", fred: DEXSZUS, cot: cot_swiss,   archetype: haven-funder,     base: CHF, invert: true,  short_rate: ch_short, long_rate: ch_10y, reer: reer_ch, peg: {kind: snb}}
    USDMXN: {yahoo: "USDMXN=X", fred: DEXMXUS, cot: cot_peso,    archetype: em,               base: MXN, invert: true,  carry: context, reer: reer_mx}
    USDBRL: {yahoo: "USDBRL=X", fred: DEXBZUS, cot: cot_real,    archetype: em,               base: BRL, invert: true,  carry: context, reer: reer_br}
    USDCNH: {yahoo: "CNH=F",    fred: DEXCHUS, cot: null,        archetype: em-managed,       base: CNH, invert: true,  carry: context, reer: reer_cn, peg: {kind: managed}, onshore: cny_onshore}

  drivers:                          # shared macro series: name -> [store-group, store-name]
    dxy:          [yahoo, "DX-Y.NYB"]   # US Dollar Index (1971->)
    broad_dollar: [fred, DTWEXBGS]      # broad trade-weighted USD (2006->)
    broad_afe:    [fred, DTWEXAFEGS]    # advanced-economies leg
    broad_eme:    [fred, DTWEXEMEGS]    # emerging-economies leg
    us_short:     [fred, DFF]           # US policy (fed funds) — carry US leg
    us2y:         [fred, DGS2]
    us10y:        [fred, DGS10]
    vix:          [fred, VIXCLS]
    hy_oas:       [fred, BAMLH0A0HYM2]
    em_oas:       [fred, BAMLEMCBPIOAS]
    nfci:         [fred, NFCI]
    copper:       [yahoo, "HG=F"]
    gold:         [yahoo, "GC=F"]
    oil:          [yahoo, "CL=F"]
    spy:          [yahoo, SPY]
    eem:          [hk, EEM]             # EM-equity risk proxy (already collected under hk)
    cny_onshore:  [fred, DEXCHUS]       # onshore USD/CNY — vs offshore CNH=F = the CNH basis
    btc:          [yahoo, "BTC-USD"]    # bitcoin — dollar cross-asset transmission leg (2014->)
    us10y_real:   [fred, DFII10]        # US 10y TIPS real yield — the dollar's structural anchor (2003->)
    breakeven_10y: [fred, T10YIE]       # 10y inflation breakeven — real-vs-reflation smile arm
    fed_bs:       [fred, WALCL]          # Fed balance sheet (weekly) — USD-liquidity leg
    on_rrp:       [fred, RRPONTSYD]      # overnight RRP (daily) — net-liquidity drain
    tga:          [treasury, tga]        # Treasury General Account — the 3rd net-liq drain (audit #28)
    reer_us:      [fred, RBUSBIS]        # US BIS real-effective rate — dollar valuation (monthly, lagged)

  cnh:                                  # offshore(CNH)-onshore(CNY) basis = China stress / capital-flow gauge
    stress_bps: 150                     # basis above this (offshore yuan weaker) = depreciation / outflow stress
    inflow_bps: -100                    # basis below this (offshore stronger) = inflow / risk-on
    pctile_lookback_d: 504

  dollar:                           # broad-dollar master tile + orthogonalization
    legs: {broad: broad_dollar, advanced: broad_afe, emerging: broad_eme, index: dxy}
    trend_window_d: 63              # ROC window for the dollar trend / smile read
    beta_window_d: 252             # rolling regression of each pair on the broad dollar
    beta_min_train_d: 252
    dollar_day_z: 1.0              # |broad-dollar daily z| above this = a "dollar day" ...
    dollar_day_haircut: 0.5       # ... shrink per-pair confidence by this (false-consensus guard)
    risk:                          # the dollar-smile risk composite (hk_global-style, no HKD peg)
      components: {vix: 1.0, hy_oas: 0.75, em_oas: 0.75, copper_gold: 1.0, spy: 1.0, eem: 0.75}
      z_lookback_d: 252

  momentum:                         # ported price vote-ensemble -> [-1,+1]
    smooth_days: 3
    rsi_bull: 55
    rsi_bear: 45
    votes: {ema_trend: 1.0, ema_cross: 1.0, macd_hist: 1.0, sma200: 1.0, roc20: 1.0, rsi_zone: 1.0}
    trigger: 0.5
    exit: 0.25
    confirm_days: 3

  structure:                        # structure-shift oscillator [-1,+1]
    swing_window_d: 20
    breakout_lookback_d: 60
    confirm_days: 3
    trigger: 0.5
    exit: 0.25

  trend:                            # 12-month time-series momentum (TSMOM)
    lookback_d: 252
    confirm_days: 5
    scale: 0.12                     # FX moves << commodities -> smaller scale (tanh(12m_ret/scale))

  risk:                             # saturating composite -> 0..100 (FX vol << commodities)
    threshold: 25
    exit_threshold: 15
    deadband: 0.10
    vol_window_d: 30
    vol_pctile_lookback_d: 1260
    drawdown_window_d: 90
    drawdown_full_stress: 0.12      # 12% drawdown = full stress (FX-scaled)
    weights: {vol_pctile: 1.0, drawdown: 1.0, momentum_deterioration: 0.75, positioning_stress: 0.5}
    oscillator_delta_d: 10
    oscillator_scale: 30

  carry:                            # rate-differential carry: foreign short rate - US (DFF)
    us_leg: us_short                # piecewise-constant policy rates => ffill correct, monthly OK
    carry_to_vol: true             # risk-adjust by trailing FX realized vol (penalize fragile carry)
    vol_window_d: 60
    smooth_days: 5
    pctile_lookback_d: 756
    scale: 3.0                      # |annualized rate diff %| / scale -> bounded carry score

  positioning:                      # COT spec extremes (contrarian), rolling percentile
    pctile_lookback_d: 756
    crowded_long_pctile: 0.85
    crowded_short_pctile: 0.15

  residual:                         # decoupling / exogenous-shock detector (intervention, geopolitics)
    return_window_d: 21
    drivers: [broad_dollar, us2y]   # default driver set; AUD/CAD add their commodity leg in-engine
    min_train_d: 504
    refit_every_d: 21
    z_lookback_d: 252
    shock_z: 1.5
    decoupling_corr_window_d: 252
    decoupling_corr_max: 0.2

  conviction:                       # band mapping + hysteresis (reuse commodity engine)
    bands: {strong: 60, weak: 20}   # |score| -> STRONG / weak / FLAT
    hysteresis_confirm_days: 5

  value:                            # REER mean-reversion (slow valuation anchor)
    gap_window_d: 1260              # ~5y rolling mean of log-REER (the long-run "fair" level)
    z_lookback_d: 1260
    pub_lag_d: 45                   # BIS REER is monthly + ~6wk lag -> shift before use (no look-ahead)

  rates:                            # 10y yield-differential momentum (relative monetary policy)
    diff_window_d: 63               # change in (foreign 10y - US 10y) over this window
    z_lookback_d: 252
    pub_lag_d: 45                   # foreign 10y (OECD monthly) is lagged -> shift before use

  calibration:
    start_date: "2004-01-01"        # Yahoo FX-major history is deep; EM shorter
    split_date: "2015-01-01"        # BOTH halves straddle a carry unwind (2008 | 2015 SNB,2020,2022,2024)
    forward_days: [21, 63, 126]
    exclude_peg_windows: true       # excise managed/intervention/SNB eras from weight calibration
    whipsaw_max_days: 10
    whipsaw_target_pct: 15
    cost_bps: 2                     # one-way transaction cost (spread) per unit |Δpos|; tight G10 spot majors (EM wider, but modeled conservatively at the same leg). Conviction-allocation Sharpe is NET of this
    n_trials: 60                    # honest UPPER-BOUND of factor×pair configs screened, for the Deflated Sharpe haircut — overestimate is conservative (de Prado); raise as you try more

  alerts:
    timeline_days: 60
    shock:                          # per-pair |move| % that flags an FX shock (lower vol than commods)
      enter_pct: {EURUSD: 1.5, USDJPY: 2.0, GBPUSD: 1.8, AUDUSD: 2.0, USDCAD: 1.5, USDCHF: 1.8, USDMXN: 3.0, USDBRL: 3.5, USDCNH: 1.2}

  # ---------------------------------------------------------------------------
  # FX STRESS & REGIME RADAR — read the JOINT configuration of currency moves
  # (velocity + level) to NAME the macro scenario (carry unwind / dollar tightening /
  # EM crisis / safe-haven flight / reflation / intervention) and attach an HONEST,
  # EMPIRICAL probability = a PAST-TENSE conditional base rate, NEVER a forecast:
  # P(adverse forward move | stress intensity >= today's), with the unconditional base
  # rate, sample n (+ overlap-deflated n_eff=n/N) and a Wilson 95% CI on both. Strictly
  # causal (intensity uses only data <= t; forward label is (t,t+N]); DISPLAY-ONLY,
  # never scored / never fed to a conviction/allocation. See engine/forex_regime.py.
  # ---------------------------------------------------------------------------
  regime:
    enabled: true
    add_drivers:                    # extra series the radar needs (folded into drivers)
      move: [yahoo, "_MOVE"]        # ICE BofA MOVE bond-vol index (data/yahoo/_MOVE.parquet, 2002->)
    z_lookback_d: 252               # causal z baseline window (moments shift(1)-ed to exclude t)
    z_min_periods: 60
    ewma_halflife_d: 20             # velocity vol normalizer (EWMA realized vol)
    squash: {z_lo: 0.5, z_hi: 3.0}  # leg sub-intensity ramp (fire threshold ~0.6, saturates ~1.5x)
    probability:
      n_min_eff: 9                  # n_eff below this -> suppress the %, show words instead
      wilson_z: 1.96                # 95% Wilson score interval
      overlap_deflate: true         # n_eff = n_raw / N (one independent obs per N-day window)
    kinematics:
      lit_windows_d: [1, 5, 20]     # literal % moves shown per currency
      rvol_window_d: 20
      rvol_pctile_lookback_d: 504
    scenarios:                      # per-scenario: forward horizon + adverse-outcome theta + leg weights
      carry_unwind:
        min_legs: 3
        theta: {carry_dd: -0.06, spy_dd: -0.08, vix_level: 35}
        weights: {funder_5d_z: 1.0, carry_5d_z: 1.0, funder_minus_carry: 1.5,
                  carry_resid_corr: 0.75, dvix_z: 0.75, jpy_accel_z: 1.0}
      dollar_wrecking_ball:
        min_legs: 3
        theta: {eem_dd: -0.08, emoas_bp: 75}
        weights: {bdxy_20d_z: 1.0, bdxy_pctile: 1.0, usd_up_breadth: 1.5,
                  adv_vs_em_usd: 1.0, dreal_20d_z: 0.5, dnfci_20d_z: 0.75}
      em_crisis_capital_flight:
        min_legs: 3
        illustrative: true          # managed USD/CNH truncation
        theta: {em_resid_dd: -0.08, emoas_bp: 150}
        weights: {em_resid_10d_z: 1.0, em_minus_adv_z: 1.5, emoas_d5_z: 1.0,
                  cnh_basis: 0.75, em_fx_drawdown: 0.5, eem_10d_z: 0.75}
      haven_flight_risk_off:
        min_legs: 3
        theta: {spy_dd: -0.10, vix_level: 35, hyoas_bp: 150}
        weights: {haven_5d_z: 1.0, risk_dn_breadth: 1.5, vol_spike: 1.0,
                  hy_d5_z: 1.0, growth_scare: 0.75, gold_minus_spy: 0.5}
      reflation_risk_on:
        min_legs: 3
        theta: {risk_reversal: -0.06}
        weights: {risk_20d_z: 1.0, risk_minus_funder: 1.5, commodity_tailwind: 0.75,
                  credit_vol_compress: 0.75, dbe_20d_z: 0.5, low_resid_corr: 0.5}
      intervention_risk:
        min_legs: 2
        illustrative: true          # MoF/SNB intervention truncates the distribution
        theta: {usdjpy_1d_gap: -0.025}
        weights: {usdjpy_velocity: 1.5, usdjpy_level: 1.0, usdjpy_persistence: 1.0,
                  snb_cnh_strain: 0.5, rate_diff_context: 0.5}

  # ---------------------------------------------------------------------------
  # DOLLAR DESK — a deepened, multi-signal read of the master variable (broad USD).
  # ALL DISPLAY-ONLY / never scored: FX violates UIP, the dollar move is often the
  # tightening itself (coincident), and every forex conviction backtest fails the
  # deflated-Sharpe bar. These are REGIME / CONTEXT reads, not trade calls. See
  # research/FOREX_DASHBOARD.md + reports/forex-calibration.md.
  # ---------------------------------------------------------------------------
  dollar_desk:
    real_rate:                      # US 10y real yield (DFII10) + 10y breakeven regime
      z_lookback_d: 504             # ~2y z-score window for the real-yield level
      chg_window_d: 63             # breakeven / real-yield change horizon
      high_z: 0.5                   # real-yield z above this = restrictive (USD-supportive)
      low_z: -0.5
      be_high_z: 0.3                # breakeven-change z above this = reflation arm
      be_low_z: -0.3               # ...below this = disinflation arm
    fed_path:                       # implied Fed-funds path from ZQ futures (US leg only)
      group: rate_futures
      name: zq_path                 # cols m1,m3,m6,m12 (annualized % implied policy rate)
      near: m1
      far: m12
      reprice_window_d: 21         # change in the 12m-ahead implied rate = repricing momentum
      reprice_bps: 10              # |Δ| beyond this (bps) = a hawkish/dovish repricing lean
    positioning:                    # CFTC COT net-spec on the US Dollar Index (cot_dollar)
      cot: cot_dollar
      pctile_lookback_d: 756        # ~3y rolling percentile (min-periods guarded for thin tails)
      crowded_long_pctile: 0.85
      crowded_short_pctile: 0.15
    valuation:                      # US BIS REER vs its long-run mean (reuse value_signal)
      gap_window_d: 1260
      z_lookback_d: 1260
      pub_lag_d: 45
      stretch_z: 1.5               # |z| beyond this = "stretched" rich/cheap (position-size damper)
      rich_gap: 0.01               # |log REER gap| beyond this labels rich / cheap (else fair)
    trend:                          # broad-USD multi-horizon trend STACK (breadth/coherence read)
      horizons_d: [21, 63, 126, 252]
      up_frac: 0.75                # >= this fraction of horizons up = "up"; <= 1-this = "down"
    liquidity:                      # net Fed liquidity (WALCL - RRP) rate-of-change (context only)
      chg_window_d: 63
      z_lookback_d: 252
    smile:                          # enrich the existing 4-quad smile with a confirmation tally
      triple_red_window_d: 21       # USD- & SPY- & UST- together over this window = haven loss

  # ---------------------------------------------------------------------------
  # DOLLAR CROSS-ASSET TRANSMISSION — how today's broad-USD move co-moves with the
  # other markets (equities / commodities / bonds / EM / crypto). CONTEMPORANEOUS,
  # unstable, regime-dependent CO-MOVEMENT — never a forecast or a trade signal.
  # Betas are computed LIVE from the store (no hardcoded literature numbers).
  # ---------------------------------------------------------------------------
  transmission:
    fast_window_d: 63               # ~quarter rolling beta/corr (the "now" read)
    slow_window_d: 252             # ~year rolling beta/corr (the structural read)
    stale_corr: 0.10               # |fast corr| below this = "decoupled / indeterminate"
    flat_roc: 0.005                # |broad-USD ROC over the fast window| below this = "flat"
    assets:                         # label -> [store-group, name, sign_note]; sign computed live
      SPY:    [yahoo, SPY,             "US equities"]
      EEM:    [hk,    EEM,             "EM equities"]
      "GC=F": [yahoo, "GC=F",          "gold"]
      "CL=F": [yahoo, "CL=F",          "oil"]
      "HG=F": [yahoo, "HG=F",          "copper"]
      UST10:  [fred,  DGS10,           "10y Treasury (price = -yield)"]
      BTC:    [yahoo, "BTC-USD",       "bitcoin"]

  # ---------------------------------------------------------------------------
  # CURRENCY STRENGTH METER — rank each currency by trailing trend strength,
  # independent of any single pair. DESCRIPTIVE, never predictive (green != buy).
  # Built from the per-pair dollar-orthogonalized residuals + the broad-USD trend.
  # ---------------------------------------------------------------------------
  strength:
    horizons_d: {"1w": 5, "1m": 21, "3m": 63}
    default_horizon: "1m"

  # ---------------------------------------------------------------------------
  # INTERNATIONAL SCORECARDS — honest PIT backtests (reuse validation.backtest_core).
  # Carry harvests a real risk premium with a FAT LEFT TAIL; trend-following the
  # dollar is weak/whippy. Shown with a pre/post-2008 regime split; experimental.
  # ---------------------------------------------------------------------------
  scorecards:
    cost_bps: 2                     # one-way spread cost per unit |Δpos|
    split_date: "2008-09-15"        # Lehman — the carry-crash regime boundary
    carry:
      top_n: 3                      # long the top-N carry currencies, short the bottom-N
      rebalance_d: 21              # monthly rebalance
      vol_target: true             # inverse-vol scale the basket (carry-crash haircut)
      vol_window_d: 63
    haven:                          # risk-off haven basket — long havens (JPY/CHF) vs short
      vol_target: true             # risk currencies (AUD/CAD/EM); the MIRROR of carry —
      vol_window_d: 63             # bleeds carry as insurance, pays in risk-off

# -----------------------------------------------------------------------------
# Bitcoin Vector signal engine (Phase 2). Architecture reverse-engineered from
# Swissblock's published panels — see research/VECTOR_SIGNAL_RECON.md.
# Components are VOTE ENSEMBLES (mean of -1/0/+1 votes) and saturating
# composites; every band's forward-return record is measured by
# scripts/calibrate_vector.py and shipped to tooltips.
# -----------------------------------------------------------------------------
vector:
  # Override-Registry (W0/W2 masterplan).  Every rule that forces a size override
  # on the engine output must be DECLARED here.  Params stay in their canonical
  # config location (e.g. vector.allocation.midterm_gate) so existing consumers
  # continue to read them unchanged; the registry entry is the governance record.
  # Fields: id, thesis, basis_n, scope, dof_cost, release_rules, falsifier_authority,
  # grading_spec, params_ref.  dof_cost is charged to the DSR trial budget
  # (scripts/calibrate_vector.py n_trials) the moment the override is WRITTEN —
  # the registry makes degrees of freedom more expensive, never cheaper.
  overrides:
    - id: midterm_blackout
      thesis: >
        BTC has capitulated into every US midterm-election year (2014/2018/2022
        all saw severe markdown into the November vote).  The strategy sits flat
        (cash) from Jan 1 of a midterm year until ~election day to avoid the
        projected drawdown window.
      basis_n: 3                        # n=3 prior midterm cycles (machine-read)
      scope: "midterm years (year%4==2), Jan 1 → staged re-entry (W4 window spine) or legacy election day"
      dof_cost: 6                       # 3 (gate: decision-to-gate + year%4==2 selector + window shape)
                                        # + 1 (Class-1 confirm window N=5 — registered W2, never re-tuned)
                                        # + 2 (W4 re-entry: tranche schedule shape + the accelerator rule;
                                        #      spine dates derive from the thesis window = no new evidence DOF)
      release_rules:
        - kind: calendar                # self-release at ~election day (buy_lead_days offset,
                                        # params at vector.allocation.midterm_gate)
        # Class-1 AUTO-RELEASE — owner decision D1 (recorded 2026-07-02), ships ENABLED.
        # Anchor-independent structural invalidation: a NEW ALL-TIME-HIGH daily close
        # (close > running historical max — NOT close vs a hand-set anchor date) during
        # the claimed markdown, held for confirm_days consecutive closes above the broken
        # prior ATH. On confirm the gate steps down to the engine's RAW allocation (the
        # brake/conviction stack then governs); sticky for the remainder of the window.
        - kind: structural_invalidation
          signal: new_ath_close
          confirm_days: 5               # PRE-COMMITTED (masterplan §4 N2); counted in dof_cost — never re-tune
        # W4 STAGED RE-ENTRY — owner decision D4; masterplan N5 REDESIGNED after the
        # W1 trigger eval (all evidence triggers failed the pre-registered bar → the
        # calendar spine holds authority; evidence only accelerates fills).
        - kind: staged_reentry
          params_ref: vector.allocation.midterm_gate.reentry
      falsifier_authority: class1       # the falsifier is wired to the sizing object it polices (N2)
      # grading_spec = the FROZEN v1 sub-claim family (W5). MUST equal
      # engine/btc_override_ledger.FROZEN_SUBCLAIMS_V1 exactly — the ledger warns and
      # ignores any drift (post-hoc additions are barred).  Benchmark: the engine's own
      # raw series (raw_allocation); grading ledger: data/vector/override_ledger.jsonl.
      grading_spec:
        - drawdown_deepens_into_window
        - no_new_high
        - bottom_lands_in_window
        - re_entry_captures_recovery
      params_ref: vector.allocation.midterm_gate

  momentum:                       # vote ensemble -> [-1,+1]; their ±0.5 = triggers
    smooth_days: 3
    rsi_bull: 55
    rsi_bear: 45
    votes:                        # name: weight (mean is weight-normalized)
      ema_trend: 1.0              # close vs EMA50 & EMA50 slope
      ema_cross: 1.0              # EMA20 vs EMA50
      macd_hist: 1.0
      sma200: 1.0
      roc20: 1.0
      rsi_zone: 1.0
      sopr_momentum: 1.0          # SOPR 7d EMA vs 1.0 (selling pressure)
      sth_cost_basis: 1.0         # close vs STH realized price (2022->)
    trigger: 0.5                  # enter bull/bear at ±trigger
    exit: 0.25                    # hysteresis: stay in state until score falls back past ±exit
    confirm_days: 3               # cross must hold N days before regime flip

  risk:                           # saturating composite -> 0..100, threshold 25
    threshold: 25                 # enter high-risk at 25
    exit_threshold: 15            # hysteresis: drop back to low-risk only below 15
    deadband: 0.10                # raw stress below this maps to 0 (their pin-at-zero)
    vol_window_d: 30
    vol_pctile_lookback_d: 730
    drawdown_window_d: 90
    drawdown_full_stress: 0.30    # dd >= 30% from 90d high -> stress 1.0
    sopr_ema_d: 7
    etf_flow_sum_d: 7
    weights:
      vol_pctile: 1.0
      drawdown: 1.0
      sopr_stress: 1.0            # SOPR<1 depth
      interday_ratio: 0.75        # interday vs intraday vol split (Key Risk Elements)
      momentum_deterioration: 0.75
      etf_outflow: 0.5            # 2024-> only
      funding_stress: 0.5
    oscillator_delta_d: 10        # Risk Oscillator = 0.5 + bounded d(risk)/dt
    oscillator_scale: 30          # risk pts per 10d that map to ±0.5

  bfi:                            # Bitcoin Fundamental Index, bands 40/60
    growth_mom_d: 30              # active-address momentum window
    growth_base_d: 365
    pctile_lookback_d: 730
    liq_components_sum_d: 30      # realized-cap delta, stablecoin delta, etf flows
    smooth_d: 14
    band_lo: 40
    band_hi: 60

  structure:                      # structure-shift oscillator [-1,+1]
    swing_window_d: 20
    breakout_lookback_d: 60
    confirm_days: 3
    trigger: 0.5
    exit: 0.25

  gauges:
    vol_low_pctile: 0.30          # below -> Low; above high -> High; between = Sweet spot
    vol_high_pctile: 0.75
    flow_low_pctile: 0.30
    flow_high_pctile: 0.75

  environment:
    bull_min_momentum: 0.0        # mid-term env = trend + momentum sign
    prob_lookback: all            # 7d/3d probabilities from full-history base rates
    scenario_atr_d: 14
    scenario_atr_mult: 1.5

  allocation:                     # strategy grids on (momentum, risk)
    variants:
      conservative: {mom_full: 0.6, risk_full: 15, mom_half: 0.5, risk_half: 25}
      moderate:     {mom_full: 0.5, risk_full: 25, mom_half: 0.0, risk_half: 40}
      aggressive:   {mom_full: 0.3, risk_full: 40, mom_half: -0.2, risk_half: 60}
      optimal:      {mom_full: 0.5, risk_full: 25, mom_half: 0.0, risk_half: 50}  # re-tuned by calibration sweep
    confirm_days: 2               # whipsaw guard on allocation changes
    # Midterm-election blackout — the "proprietary cycle timer" gate (that is the only
    # name shown to users; the mechanism stays internal). US MIDTERM-election years
    # (even, year % 4 == 2: 2014 / 2018 / 2022 / 2026 / ...) have been hostile for BTC
    # INTO the vote (all three priors capitulated), so the strategy sits FLAT (cash)
    # from Jan 1 of a midterm year until ~election day, then re-engages around the vote.
    # Deterministic + point-in-time (the calendar is fixed years ahead -> no look-ahead).
    # Applied as the FINAL word over the grid / conviction / brake / bottom-overlay for
    # ALL variants, so the backtest reflects the rule too. n=3 midterms of BTC history.
    midterm_gate:
      enabled: true
      buy_lead_days: 0            # LEGACY release (applies ONLY when no projected window is computable, e.g. 2014)
      # W4 — staged auto re-entry (owner D4; masterplan N5 as REDESIGNED after the
      # W1 trigger eval failed ALL evidence triggers — research/BTC_REENTRY_TRIGGER_EVAL.md).
      # CALENDAR SPINE = the authority: the release edge moves off election day onto
      # the thesis monitor's projected bottom window (cycle top + 360d; 2026: Oct 1 —
      # the old calendar released AFTER the projected bottom). Tranches fill ON
      # SCHEDULE (T1 at window open, T2 +30d, T3 +60d), each sized against the
      # engine's RAW allocation — deterministic, zero evidence DOF. Evidence acts as
      # ACCELERATOR only (pulls the NEXT scheduled fill earlier; never blocks/vetoes).
      # Class-1 structural invalidation (D1) composes: earliest full release wins;
      # NOT haltable. halt_from freezes the spine + accelerators (owner switch).
      reentry:
        enabled: true
        tranches: [0.40, 0.30, 0.30]     # pre-committed spine weights
        schedule_offsets_d: [0, 30, 60]  # fill days after window open (top+360d)
        halt_from: null                  # owner HALT: ISO date — freeze fills from this date
        ledger_from: "2026-01-01"        # engagements before the registry era are not retro-ledgered
        accelerator:
          enabled: true
          # W1-registered fresh-cross definitions (BTC_REENTRY_TRIGGER_EVAL.md):
          mvrv_z_fresh_cross: {level: 0.0, min_days_above: 90}
          bottom_pressure_fresh_cross: {level: 0.45, min_days_below: 20}
    # Tier-1b blend: fold the CALIBRATION-CONFIRMED deep-history valuation tails
    # into the (momentum, risk) grid as contrarian overrides. Gated — the
    # allocation backtest must not degrade (see reports/vector-calibration.md).
    use_valuation_overlay: true
    deep_value_z: 0.0            # MVRV-Z below this = accumulation FLOOR (>=0.5)
    deep_value_nupl: 0.0        # ...or NUPL below this (corroborating, collinear)
    overvalued_mayer: 2.4       # Mayer above this = distribution CAP (<=0.5)
    overvalued_rr: 0.02         # Reserve Risk above this = distribution CAP (calibrated TOP)
    # Point-4 — "size by conviction, cap risk" (was: conviction was a UI label only,
    # a thin TOSS-UP and a strong EDGE both sized 1.0). The grid above sets DIRECTION;
    # these scale SIZE. Code defaults match these values, so the keys are optional.
    conviction_sizing: true      # scale the grid alloc by a continuous conviction multiplier
    conviction_floor: 0.5        # a coin-flip (TOSS-UP) setup still sizes this fraction of the grid
    conviction_toss: 0.05        # directional-confidence edge (cycle_position-0.5) <= this = TOSS-UP -> floor
    conviction_edge: 0.30        # ...>= this = EDGE -> full grid size; linear LEAN ramp between
    drawdown_brake: true         # ENFORCE a position cap that tightens as strategy equity goes underwater
    dd_threshold: 0.25           # no brake until the strategy is >25% below its equity high-water mark
    dd_decay: 1.0                # cut the cap by this per unit of drawdown beyond the threshold
    dd_floor: 0.40               # never cap exposure below this fraction (keep a core position)
    # Bottom-detector overlay (validation: reports/btc-vector-optimal-phase0.md). The
    # drawdown brake de-risks the allocation to ~cash THROUGH a crash, so it misses the
    # washout LOW. This adds exposure back when a multi-timeframe BOTTOM signal (StochRSI-
    # oversold breadth + deep drawdown + capitulation, all causal/close+OHLC) is strong ->
    # better entry prices. +15.6% final return at flat Sharpe; the SCORED gates (DSR /
    # bootstrap / split-half / leave-one-crisis-out / beats-200dma) all still pass.
    # Applied AFTER the brake (the brake protects on the way down, this re-engages at the low).
    bottom_overlay: true         # add size at washout bottoms the brake would otherwise miss
    bottom_boost: 0.40           # max allocation added at full bottom pressure
    bottom_cap: 1.0              # clip after the boost (1.0 = no leverage; >1 = lever the washout buy)
    bottom_thr: 0.30             # bottom-pressure (0..1) must exceed this before any boost is applied
    # ^ tuned (sweep on the engine bottom_pressure): boost 0.4 / cap 1.0 / thr 0.30 lifts
    #   final return +15.6% (final/HODL 1.21->1.40, CAGR 61.5->63.5%) at FLAT Sharpe
    #   (1.439->1.435) and MaxDD -41.2% (still 2.0x shallower than HODL -83.8%). Higher
    #   boost reaches +22% but only by adding risk (Sharpe down, DD -48%) -> not taken.
    # ^ tuned (sweep, reports/vector-calibration.md): conviction sizing is the value
    #   driver (lifts Sharpe/Sortino/DSR AND MaxDD); the brake is the costly safety
    #   leg, so it is GENTLE — keeps ~all of the conviction risk-adjusted gain while
    #   still cutting MaxDD ~5pp. Dial it harder (0.20/1.5/0.30) for more DD armor.

  ensemble:                       # fixed-form orthogonalized gate-passed ensemble (D-vec-ENSEMBLE)
    z_window_d: 365               # rolling z-score window for the band-map-oriented axes + the score
    beta_window_d: 252            # rolling-beta window for the causal orthogonalization (copied from forex; NOT tuned)
    beta_min_train_d: 252         # min bars before a residual beta is estimable (raw z until then)
    # The calibration promotion-gate (ensemble_promotion) tests whether this ensemble beats the
    # best single signal AND the hand-tuned composite_state on net Sharpe in BOTH halves. Current
    # verdict KEEP-HEURISTIC -> composite_state stays the headline; the ensemble is a transparency
    # card only. It is promoted to the live headline only if a future calibration sweeps all baselines.

  sizing:                         # conviction -> capped fractional-Kelly position size (D-vec-KELLY)
    kelly_frac: 0.5               # HALF-Kelly (full Kelly over-bets fat-tailed crypto; 0.25 = quarter)
    dd_budget: 0.25               # max tolerable 90d portfolio drawdown -> position capped so band p05 tail x size <= this
    pos_max: 1.0                  # never lever past 100% (sizing is for a long-only BTC sleeve)

  catalyst:                       # scheduled-binary (FOMC/jobs) event window (D-vec-CAT)
    imminent_days: 3              # a binary within this many days = "don't size into it" gate on the Kelly read

  cme_basis:                      # CME (regulated) futures carry — POSITIONING CONTEXT (D-vec-CME; measured ~0 forward edge)
    ann_mult: 12                  # front-month basis -> ~annualized (approx; continuous future, ~1mo to expiry)
    pctile_lookback_d: 365        # 1y percentile of the basis
    froth_pct: 0.7                # basis above this % = rich contango (leverage froth)
    stress_pct: -0.2              # below this = backwardation (stress / forced de-risk)

  futures_carry:                  # consolidated derivatives CARRY across the futures complex
    # One leverage-cycle read fusing the annualized carries we already store: CME
    # (regulated, 2017->), Deribit dated-future basis (snapshot), and perp funding
    # (annualized). z-scored vs their own ~1y norm; froth = leveraged longs paying up
    # (late-cycle), stress = backwardation/negative funding (deleveraging/capitulation).
    z_window_d: 365
    froth_z: 0.8                  # blended carry z above → "froth"
    stress_z: -0.8                # below → "stress"
    cme_weight: 1.0               # regulated, deepest → highest weight
    deribit_weight: 0.6           # offshore dated basis (shallow history)
    funding_weight: 0.8           # perp funding annualized

  btc_vs_alts:
    rs_window_d: 30               # relative-strength window across BTC/ETH/alts
    confirm_days: 3

  tactical:
    efficiency_window_d: 30       # |net move| / sum(|daily moves|): high = trending
    strategic_min_efficiency: 0.35
    strategic_max_risk: 40

  # --- Tier-1 accuracy upgrade (research/VECTOR_ACCURACY_UPGRADE.md) ---------
  # New STANDALONE axes — measured before being blended into the composites.
  valuation:                      # MVRV-Z / NUPL valuation axis (2010-> depth)
    z_window_d: 1460              # rolling std window for MVRV-Z (4y ~ one cycle;
                                  # ETF-era responsive vs. an expanding all-history std)
    z_min_periods_d: 365
    z_over: 3.5                   # enter "overvalued"
    z_over_exit: 2.0              # leave overvalued only back below this
    z_under: 0.0                  # enter "undervalued"
    z_under_exit: 0.8             # leave undervalued only back above this
    pctile_lookback_d: 1460
    reserve_risk_pctile_lookback_d: 1460   # Reserve Risk percentile (checkonchain 2010->)
    nupl_euphoria: 0.65           # NUPL bands (Glassnode-style)
    nupl_capitulation: 0.0

  miner:                          # hash ribbons + Puell (2010-> depth)
    hash_fast_d: 30
    hash_slow_d: 60
    puell_window_d: 365
    puell_min_periods_d: 180
    puell_low: 0.5                # <- miner capitulation / bottoming zone
    puell_high: 4.0              #  -> miner euphoria / topping zone

  cost_basis:
    mayer_window_d: 200           # Mayer Multiple = close / SMA200
    sth_ffill_limit_d: 5

  extreme:                        # contrarian capitulation/euphoria overlay (votes)
    sip_capitulation: 0.50        # supply-in-profit FRACTION (in_profit / supply)
    sip_euphoria: 0.95
    fg_capitulation: 25           # Fear & Greed index
    fg_euphoria: 80
    min_votes: 2                  # >=N agreeing sub-signals to flag the extreme

  options:                        # Deribit options-structure layer (Tier-2)
    # DVOL + VRP are calibratable (DVOL history 2021->); the per-strike structure
    # snapshot (skew/term/maxpain/GEX) accumulates forward = context until depth.
    dvol_pctile_lookback_d: 730
    dvol_low_pctile: 0.25         # complacency band
    dvol_high_pctile: 0.80        # fear/elevated band
    rv_window_d: 30               # realized vol window matched to DVOL's 30d horizon
    vrp_smooth_d: 5               # VRP = DVOL - realized vol, smoothed
    rv_cone_lookback_d: 1095      # ~3y percentile window for the realized-vol CONE + vol-of-vol (full-history, both-halves-clean; D-vec-RVCONE)
    # VRP MODEL (variance-risk-premium = implied DVOL − realized vol): a z-score + a
    # vol-pricing regime. vol_rich = options expensive vs delivered (rich premium →
    # vol mean-reverts down / sell-vol bias); vol_cheap = options underpricing risk
    # (cheap premium → vol-expansion / drawdown risk, the more actionable tail).
    vrp_z_window_d: 365
    vrp_rich_z: 0.7               # VRP z above → "vol_rich"
    vrp_cheap_z: -0.7             # VRP z below → "vol_cheap"
    # IV term structure (DVOL slope / ATM-IV 30d→90d): contango = calm/normal,
    # backwardation = front-end stress bid (near-dated fear).
    term_backwardation_pct: -1.0  # atm_iv_90d − atm_iv_30d below (pts) → "backwardation"
    # DVOL-implied forward expected-move band for the RISK model (±1σ over horizon).
    expected_move_horizon_d: 30

  leverage:                       # leverage/liquidation layer (Tier-2, ~2yr depth)
    # aggregate OI summed over consistently-present major venues (bgeo gives 15;
    # the bundled aggregate col goes NaN, so we sum a fixed core basket ourselves)
    oi_venues: [open_interest_futures_binance, open_interest_futures_bybit,
                open_interest_futures_okx, open_interest_futures_bitget,
                open_interest_futures_deribit, open_interest_futures_bitmex,
                open_interest_futures_gateIo, open_interest_futures_kucoin,
                open_interest_futures_huobi]
    pctile_lookback_d: 730
    change_window_d: 14           # OI / price change horizon for the divergence
    funding_z_window_d: 180       # funding extremity window
    # OKX rubik retail chips (DISPLAY-ONLY) — rubik history is shallow (~180d) so
    # the rolling windows are short; read via cfg.get(default) so a drift is safe
    okx_pctile_lookback_d: 180
    okx_z_window_d: 90
    stress_oi_pctile_w: 1.0       # leverage_stress = weighted mean of scaled parts
    stress_funding_w: 1.0
    stress_oi_rise_w: 0.5

  macro:                          # Tier-3 macro liquidity / risk-appetite overlay
    # net liquidity = WALCL - RRP - TGA ($bn, D10 normalization); BTC tracks its
    # RATE OF CHANGE (~months lead) more than its level. Deep history (BTC 2014->)
    # so this can be a real strategic signal, not just confirmation.
    netliq_roc_window_d: 91       # 13-week rate of change
    netliq_roc_scale: 0.03        # tanh scale for the liquidity driver
    yield_chg_window_d: 63        # ~quarter real-yield change
    yield_chg_scale: 0.4          # tanh scale (real yield in %; 0.4 = 40bp)
    dxy_roc_window_d: 63
    dxy_roc_scale: 0.04
    pctile_lookback_d: 1460       # credit/vix percentile window (~4y)
    weights:                      # macro_score = weighted mean, + = BTC tailwind
      liquidity: 1.0
      real_yield: 0.8
      credit: 0.8
      vix: 0.6
      dxy: 0.6
    enter: 0.2                    # macro_regime hysteresis: Tailwind/Headwind
    exit: 0.1

  onchain:                        # CryptoQuant-style on-chain regime (reproduced free)
    premium_smooth_d: 7           # Coinbase Premium = US institutional-demand proxy
    # Coinbase Premium MODEL: prefer the SELF-COMPUTED premium (Coinbase USD close vs
    # OKX BTC-USDT close, fresh daily) and splice the bgeo coinbase-premium-index onto the
    # deep tail. z/percentile extremity + a regime state + a smart-money divergence flag
    # (price trend vs premium trend). ETF-era institutional-demand context, NOT a deep anchor.
    premium_z_window_d: 180       # extremity z-score trailing window
    premium_pctile_lookback_d: 365
    premium_state_hi: 0.35        # EMA% above → "premium" (US institutions paying up)
    premium_state_overheat: 0.9   # EMA% above → "overheated" (FOMO/late-cycle froth)
    premium_state_lo: -0.2        # EMA% below → "discount"
    premium_state_deep: -0.6      # EMA% below → "deep_discount" (offshore-led capitulation)
    premium_div_window_d: 21      # price-vs-premium trend window for the divergence flag
    ssr_window_d: 365             # SSR oscillator z-score window (stablecoin dry powder)
    mpi_window_d: 365             # Miner Position Index = miner outflow USD / 365d MA
    mpi_min_periods_d: 120

  etf_flow:                       # US spot-ETF net flows (Swissblock #9; bgeo/Glassnode, 2024->)
    smooth_d: 5                   # rolling-sum window = the weekly flow regime
    min_periods_d: 3
    z_window_d: 90                # extremity z-score trailing window (vs recent norm)
    z_min_periods_d: 30
    state_enter_z: 0.6            # accumulation/distribution hysteresis on the flow z
    state_exit_z: 0.2
    # Farside per-fund layer (US$m, since 2024-01-11): the model also reads a USD net
    # flow, an EX-GBTC net (strips the incumbent's one-way unlock distortion), a
    # concentration (top-fund share of gross flow), and a price-vs-cumulative-flow
    # divergence. Farside is primary; bgeo etf-flow-btc is the cross-check / fallback.
    usd_smooth_d: 5               # rolling-sum window for the USD net-flow regime
    conc_window_d: 21             # window for the issuer-concentration read
    div_window_d: 21              # price-trend vs cumulative-flow-trend divergence window

  impulse:                        # Glassnode/Swissblock-style IMPULSE: z-scored
    # ACCELERATION of momentum (2nd derivative via MACD-histogram), gated for
    # chop by the Kaufman efficiency ratio, fused with a positioning impulse
    # (funding+OI shock). Spots the START/exhaustion of moves, not the level.
    accel_z_window_d: 90          # z-score window for the MACD-histogram (acceleration)
    er_window_d: 10               # Kaufman efficiency ratio window (chop gate, 0..1)
    pos_z_window_d: 60            # z-score window for funding/OI deltas
    accel_w: 0.65                 # weight on the price-acceleration core
    pos_w: 0.35                   # weight on the positioning impulse (when available)
    extreme: 1.0                  # |impulse| beyond this = a strong thrust/exhaustion
    participation_window_d: 14    # rolling % of positive-impulse days = breadth proxy

  composite:                      # headline market-state synthesis thresholds
    reserve_risk_top: 0.02        # reserve_risk above this = distribution (calibrated TOP)
    bfi_strong: 60                # BFI above this = fundamentals confirm risk-on
    cot_crowded_z: 1.5            # CME spec net-long z above this = crowded (contrarian top)
    funding_capitulation_z: -1.0  # funding z below this = crowded shorts (capitulation context, display-only tag)

  scenarios:                      # short-term scenario probabilities (build_vector)
    prob_horizon_d: 7             # forward horizon for the conditional base rate
    prob_shrink_alpha: 10         # empirical-Bayes shrinkage toward the momentum marginal
    prob_min_cell_n: 20           # below this, fall back to the marginal + label it
    prob_floor: 0.30              # cap probabilities to [floor, ceil] (anti-overfit)
    prob_ceil: 0.70
    macro_tilt_pp: 5              # macro tailwind/headwind nudges the prob +/- this (pp)
    cycle_tilt_pp: 5             # cycle-phase prior: markup +, markdown - (pp); now driven
                                 # by the bottom-anchored 1064/364 phase (tighter than halving)
    cycle_top_zone: 0.85         # last 15% of a leg = reversal zone -> the tilt flips sign
    atr_dvol_ref: 55              # DVOL ~= this -> ATR bands unscaled; higher widens them
    conv_band_pp: [3, 7]          # conviction cuts (pp from 50%): TOSS-UP <=3, LEAN <=7, EDGE >7.
                                  # Calibrated to the MEASURED reliable-cell up-rate spread
                                  # (51.9-57.1% at 7d, n>300) so ~3pp from 50 = an honest coin-flip,
                                  # not a confident call. EDGE also needs n>=300 + verdict + tape
                                  # corroboration (see _conviction in build_vector.py; D-vec-CONV).

  # --- New-factor hunt (research/VECTOR_NEW_FACTORS.md): three orthogonal axes
  # the model lacked — time/cycle, positioning, cross-asset co-movement. ---------
  cycle_clock:                    # halving-phase time prior (deterministic, FREE)
    halving_dates: ["2012-11-28", "2016-07-09", "2020-05-11", "2024-04-20"]
    cycle_len_d: 1458             # ~4y; cycle_pct = days_since_halving / this
    # phase boundaries in cycle_pct (tops cluster ~0.27-0.38 historically, n=3)
    accumulation_end: 0.22
    markup_end: 0.42
    markdown_end: 0.70

  cycle_phase_clock:              # bottom-anchored 1064/364 time structure (the chart's
    # "1064 days up / 364 days down" theory). A tighter view of the SAME ~4yr axis as
    # cycle_clock, anchored on observed lows/highs. Measured fit vs our own price history:
    # up 1067/1059/1050d, down 364/378d -> mean-abs-err 7.2d, but only n=3 (in-sample).
    # CONTEXT + soft prior, never a trigger. Timing only — NOT amplitude, NO price target.
    bottoms: ["2015-01-14", "2018-12-15", "2022-11-21"]   # observed cycle lows
    tops:    ["2017-12-16", "2021-11-08", "2025-10-06"]   # observed cycle highs
    up_days: 1064                 # markup leg length (mean of 1067/1059/1050)
    down_days: 364                # markdown leg length (n=2: 364/378 — the weak leg)
    overdue_pct: 1.10             # days_in > len*this w/o a new pivot -> status "overdue"

  positioning:                    # CME COT net-spec (already collected, now wired)
    z_window_d: 730               # ~2y z-score of net_spec_pct_oi (crowding extremes)
    ffill_limit_d: 10             # weekly report -> carry forward

  # --- Mastermind upgrade (research/VECTOR_FACTOR_ROADMAP_2026) ----------------
  miner_econ:                     # hashprice (USD revenue per unit hashrate) + flush — deep 2010-> anchor
    pctile_lookback_d: 1460       # ~4y rolling percentile of hashprice (margin position)
    z_window_d: 365               # z-score window on log-hashprice
    shock_window_d: 14            # hashrate %-change window (a flush = forced shutdown)
    shock_full: 15.0              # -15% hashrate in the window = a full capitulation flush
    capit_pctile: 15             # hashprice below this percentile = miner capitulation / bottoming
    euphoria_pctile: 85          # ...above this = miner euphoria
  conditional_beta:               # downside-vs-upside beta to NDX(QQQ)/gold — pure compute, deep
    beta_window_d: 90             # rolling regression window
    min_periods_d: 20             # min up/down days in the window before a beta is estimable
    pctile_lookback_d: 730        # 2y percentile of the downside beta
    high_down_beta_pctile: 70     # above this = "drawdown amplifier" regime
    decoupled_beta: 0.15          # downside beta below this = "diversifier" regime
  holder_spread:                  # STH-vs-LTH realization spread — bgeo ~1 cycle, CONTEXT
    smooth_d: 7
    dist_thresh: 0.02             # STH-SOPR minus LTH-SOPR above this = distribution tilt
    accum_thresh: -0.02           # ...below this = accumulation tilt
  attention:                      # Wikipedia pageviews — keyless attention axis, EXTREMES-only
    smooth_d: 7
    z_window_d: 365               # z-score of log-pageviews
    mania_z: 2.0                  # attention z above this = mania / blow-off froth
    apathy_z: -1.0                # ...below this = disinterest / apathy bottoms
  taker_flow:                     # OKX taker aggressor CVD — shallow, DISPLAY/accrue-forward
    cvd_window_d: 30              # rolling-sum window for the (buy-share - 0.5) lean
    z_window_d: 90
    div_window_d: 14             # price-vs-CVD divergence lookback

  cross_asset:                    # BTC rolling correlation regime (2nd-moment, FREE)
    corr_window_d: 90             # rolling Pearson window of daily returns
    pctile_lookback_d: 730
    coupled_thresh: 0.45          # BTC-SPX corr above this = risk-asset coupling
    decoupled_thresh: 0.0         # below this = decoupled / diversifier regime

  global_liquidity:               # US + China M2 growth impulse (the broad-money read
    # our Fed-balance-sheet net-liquidity lacks; EZ/JP/UK FRED M2 are discontinued,
    # so US+China = the two largest LIVE blocs). Money supply leads BTC ~10wk.
    us_weight: 0.4                # US vs China weight (China M2 ~60% larger in USD)
    accel_window_d: 90            # 3-month change of the YoY impulse
    expanding_thresh: 5.0         # global M2 YoY above this = liquidity tailwind
    stbl_growth_window_d: 30      # stablecoin supply growth window (the crypto-native liquidity TIDE; D-vec-STBL)
    stbl_z_lookback_d: 365        # de-trend window for the stablecoin growth z-score (2017 hyper-growth vs 2024 base comparable)

  alt_cycle:                      # altcoin-cycle / ETH allocation (allocation page)
    btc_season_line: 0.05         # ETH/BTC below = deep BTC-season
    alt_season_line: 0.07         # ETH/BTC above = alt-season confirmed
    ethbtc_ma_d: 350              # ~50-week ETH/BTC moving average
    slope_window_d: 56            # 8-week ETH/BTC slope
    pctile_lookback_d: 1095       # 3y ETH/BTC percentile
    btc_season_max: 25            # alt-season score <25 = BTC season
    alt_season_min: 75            # >75 = alt season
    soleth_ma_d: 100              # ~14-week SOL/ETH moving average (high-beta rotation)
    soleth_slope_d: 56            # 8-week SOL/ETH slope
    soleth_pctile_d: 730          # 2y SOL/ETH percentile (SOL-USD ~2020->)

  # Macro-regime composite deferred CONTEXT legs (engine/btc_netliq, etf_perfund,
  # btc_dat, btc_leverage_cascade). All DISPLAY-ONLY — they never size or gate.
  btc_netliq:
    enabled: true
    yoy_window_d: 252             # YoY ROC lookback for the Howell net-liquidity stack
  btc_etf_perfund:
    scrape_enabled: false         # Farside per-fund scrape OFF by default (read-only otherwise)
    url: "https://farside.co.uk/bitcoin-etf-flow-all-data/"
  btc_dat:
    json_path: "data/dat_holdings.json"   # manual 8-K-sourced MSTR/DAT drop (NOT 13F)
    margin_haircut: 0.78          # forced-sell trigger ~ avg_cost x this (≈ -22%)
    stale_after_days: 14          # asof older than this → stale flag (manual feed; ~weekly 8-K cadence)
  btc_leverage_cascade:
    high_funding_annual_pct: 50   # annualized funding above this = "high"
    sustain_days: 3               # consecutive days of high funding to flag a cascade

  calibration:
    start_date: "2015-01-01"      # price-signal backtests (Yahoo BTC 2014-09->)
    split_date: "2021-01-01"      # split-half robustness boundary
    forward_days: [7, 30, 90]
    whipsaw_max_days: 7
    whipsaw_target_pct: 15
    cost_bps: 10                  # one-way transaction cost (spread+fee) per unit |Δpos|; allocation backtest CAGR/Sharpe are NET of this
    n_trials: 65                  # honest UPPER-BOUND of independent strategy configs explored, for the Deflated Sharpe haircut — overestimate is conservative (de Prado); raise as you try more. +15 for the Point-4 conviction/brake sweep.
    cv_folds: 5                   # purged + embargoed walk-forward folds (embargo = max forward horizon) — the leak-free robustness gate complementing split_date (D-vec-GATES)

  # --- GBT meta-label leaf (engine/meta_label.py; scripts/meta_label_btc.py) ---
  # DEFAULT-OFF. A secondary HistGradientBoostingClassifier learns P(the primary
  # allocation call is correct) over `horizon` days from context features, used to
  # FILTER/SIZE — never direction. Fenced to this high-N layer (~3000 long calls)
  # because GBT overfits on the ~10-episode macro layer. NOT wired into the live
  # allocation: `enabled` must be flipped by a human only AFTER it proves out.
  meta_label:
    enabled: false                # leaf stays out of compute_all / the live grid
    primary_variant: optimal      # which alloc_<variant> grid sets the SIDE
    horizon: 30                   # forward label horizon (days) == the CV embargo
    barrier_mult: 1.0             # triple-barrier width = mult · trailing σ · √horizon
    vol_window: 30                # trailing window for the barrier vol (no look-ahead)
    cv_folds: 6                   # purged + embargoed folds (reuses validation.purged_folds)
    min_test_events: 20
    min_train_events: 150
    cost_bps: 10                  # one-way cost per unit |Δpos|; meta CAGR/Sharpe are NET of this
    start_date: "2015-01-01"
    min_sharpe_gain: 0.05         # verdict: meta must add ≥ this to the net Sharpe
    maxdd_tolerance_pp: 2.0       # ...and not worsen MaxDD by more than this
    dsr_floor: 0.90               # ...and clear this Deflated-Sharpe haircut

  # Alerts (Phase 3). Vector severity high|medium|info. Flash-crash thresholds
  # provisional (calibrated against known episodes; see research/VECTOR_ALERTS_DESIGN.md).
  alerts:
    timeline_days: 45               # detailed timeline window on vector.html
    flash:
      vol_window_h: 72              # trailing hourly realized-vol window
      drop_window_h: 6              # acute-drop measurement window
      # Genuine flash crashes are ACUTE drops (covid -40%, FTX -20%, Aug-2024
      # -15%) — absolute floors, not sigma alone (crypto fat tails make 3-sigma
      # 6h moves routine, which produced 800 false events). Enter needs a
      # statistical shock AND a real drop, or a big 24h fall outright.
      enter_sigma: 3.5              # 6h move this many sigma...
      enter_6h_pct: -7.0            # ...AND below this absolute 6h return %
      enter_24h_pct: -12.0          # OR a big 24h drop on its own
      tail_24h_pct: -18.0           # flash_crash -> tail_risk_event
      stabilize_quiet_h: 12         # hours without a new 24h low -> stabilizing_price
      normal_quiet_h: 48            # quiet hours -> back to normal
      impulse_window_h: 48          # EMA-of-returns horizon for the Impulse sign
    risk_extreme_days: 14           # risk_index >= threshold this many days -> capitulation watch
    risk_extreme_level: 50

# =============================================================================
# Bonds & bond-health dashboard (research/BOND_HEALTH_DASHBOARD.md)
# A health-first read of the bond market: what the curve, credit, real rates,
# rates-vol and funding plumbing say about economic health, regime and cycle.
# Reuses the shared macro feature frame (engine.inputs.build_features) + the
# already-validated conditions layer (recession_risk, drawdown_risk,
# stock_bond_corr). Thresholds are documented practitioner levels, NOT tuned to a
# backtest; the composite health score is a TRANSPARENT prior pending calibration
# (scripts/calibrate_bonds.py, Phase 4).
# =============================================================================
bonds:
  curve:
    nyfed_a: -0.5333              # NY Fed recession probit intercept (Estrella-Mishkin)
    nyfed_b: -0.6629             # ...slope on the 10y-3m spread (pp); P=Phi(a+b*spread)
    move_window_d: 21            # ~1mo window for the curve-move (bull/bear x steep/flat) taxonomy
    uninvert_lookback_d: 252     # was the curve inverted in the last ~1y, now positive? (un-inversion alarm)
    ntfs_tenors: [0.25, 0.5, 1, 2, 3, 5, 7, 10, 30]   # interpolation nodes (years) for the near-term forward
  credit:
    # HY OAS distress bands (%, 100bp = 1.0): the canary. <3 tight, 3-5 normal,
    # 5-8 elevated, >8 distress (>10 crisis — hit in 2000/2008/2020).
    hy_tight: 3.0
    hy_elevated: 5.0
    hy_distress: 8.0
    hy_crisis: 10.0
    widening_window_d: 20        # OAS change window for the credit-direction read
    pctile_lookback_d: 1260      # ~5y percentile context for OAS / baa-aaa
  rates_vol:
    # MOVE bands (the "VIX of bonds"). Post-2022 MOVE runs structurally higher.
    move_calm: 80
    move_elevated: 120
    move_crisis: 150
    z_window_d: 252
  plumbing:
    sofr_iorb_stress_bp: 5       # SOFR-IORB drifting > this (bp) above => reserve scarcity
    repo_spike_bp: 20            # SOFR99-SOFR > this (bp) => repo-stress spike
  cycle:                         # curve x credit four-box clock (mirrors engine.cycle thresholds)
    curve_level: 0.0             # 10y-3m below this => outright inverted
    flat_level: 1.0              # 10y-3m below this (~historical median) => flat/late-leaning
    oas_lookback_d: 504          # 2y window for the HY OAS percentile
    oas_low_third: 0.33
    oas_high_third: 0.67
  health:                        # composite 0..100 (higher = healthier). TRANSPARENT prior.
    # Built from the already-MEASURED recession_risk + drawdown_risk gauges plus
    # the credit / rates-vol stress reads. Each leg contributes a 0..100 STRESS
    # value; health = 100 - weighted-mean(stress legs over available).
    weights: {recession: 1.0, drawdown: 1.0, credit: 0.8, rates_vol: 0.6, plumbing: 0.4}
    healthy_score: 67            # >= => "healthy"
    stressed_score: 40           # <  => "stressed" (between => "mixed")
  calibration:
    split_date: "2013-01-01"      # split-half boundary for the discriminative drawdown IC
  sovereign:                   # euro all-AAA 10y FRAGMENTATION spread bands (pp); JGB 2s10s
    frag_elevated: 0.5         # ALL-minus-AAA 10y above this => elevated periphery stress
    frag_stress: 1.0           # ...above this => fragmentation stress
  alerts:
    timeline_days: 120             # durable (debounced) state-changes are sparse; show ~4mo

# =============================================================================
# Foreign sovereign yields (Bonds dashboard Phase 5) — ECB euro-area curve +
# Japan MoF JGB. The euro ALL-minus-AAA 10y spread is a free daily BTP-Bund-
# style fragmentation proxy; JGB 2s10s tracks post-YCC normalization.
# =============================================================================
sovereign:
  retries: 3
  ecb_url: https://data-api.ecb.europa.eu/service/data/YC
  ecb_series:                      # name -> ECB YC key (G_N_A = AAA-rated; G_N_C = all govt)
    ez_aaa_2y:  B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y
    ez_aaa_10y: B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y
    ez_all_10y: B.U2.EUR.4F.G_N_C.SV_C_YM.SR_10Y
  mof_url: https://www.mof.go.jp/jgbs/reference/interest_rate/data/jgbcm_all.csv
  jgb_tenors:                      # name -> Japanese column header in jgbcm_all.csv
    jgb_2y: "2年"
    jgb_10y: "10年"

# Home landing hub — combined alert feed from both dashboards
home:
  alerts:
    macro_feed: data/alerts/alerts_log.parquet     # engine/alerts.py output
    vector_feed: data/vector/alerts.jsonl
    macro_major_severities: [act, warn]            # homepage shows these macro tiers (skip info)
    macro_exclude_rules: [circuit_breaker_open]     # operational noise, not a market signal
    vector_major_severities: [high, medium]        # homepage shows these vector tiers
    commodity_feed: data/commodity/alerts.jsonl
    commodity_major_severities: [high]             # homepage shows commodity high-tier (shock/risk) only — medium is noisier
    max_items: 12
    dedup_window_days: 5                            # collapse identical headlines within N days
    macro_label: "Macro Vector"                    # renamed from "Macro Dashboard"

