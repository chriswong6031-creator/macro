# =============================================================================
# OFR Financial Stress Index — daily 33-variable global stress with functional +
# regional decomposition (keyless CSV). Feeds engine/conditions.systemic_stress;
# the Funding leg embeds a free offshore-dollar / x-ccy-basis proxy and the EM leg
# is genuinely additive vs the US-centric NFCI. See research/DATA_SIGNAL_EXPANSION_2026.md
# =============================================================================
cleveland_nowcast:                 # Cleveland Fed daily inflation nowcast (MRI-PR-A)
  # Two JSON files backing the interactive chart on the inflation-nowcasting page.
  # Each file contains one chart object per target month (157 at last count); each
  # chart has daily category labels (MM/DD) and four nowcast series: CPI, Core CPI,
  # PCE, Core PCE MoM percent. The "Actual *" series in the same file are the post-
  # release actuals (filled in after the official release lands). Storage:
  #   data/cleveland_nowcast/nowcast.parquet — first-seen vintage record keyed
  #   (target_period, series, obs_date), keep=first; committed by the nightly
  #   collect lane (bounded growth: ~4-16 rows/business day once backfilled).
  # Collector: collectors/cleveland_nowcast.py. Fail-open — any fetch/parse error
  # is logged and skipped; never raises into the collect lane.
  month_url: "https://www.clevelandfed.org/-/media/files/webcharts/inflationnowcasting/nowcast_month.json?sc_lang=en"
  retries: 3
  timeout: 60

ofr_fsi:                           # distinct from the OFR funding-rates collector (collectors/ofr.py, group "ofr")
  fsi_url: https://www.financialresearch.gov/financial-stress-index/data/fsi.csv
  retries: 4

rate_futures:                      # Fed policy path — keyless ZQ/SR3 implied curve (research/DATA_SIGNAL_EXPANSION_2026.md #2)
  # Multi-contract futures from Yahoo → a daily implied-policy-path snapshot at fixed
  # horizons (1/3/6/12m). DISPLAY-ONLY: the implied rate IS a market price, not a
  # forecast edge — never scored, never an MRS leg. Yahoo throttles the build sandbox
  # (429) so this is verified by synthetic scaffold; live CI fetches the real curve.
  horizons_m: [1, 3, 6, 12]        # months-ahead the path is interpolated to
  max_months: 18                   # ignore contracts further out than this (illiquid tail)
  roots:
    # ZQ = 30-Day Fed Funds (CBOT), MONTHLY contracts. 100-price = the avg EFFR the
    # market prices for that delivery month.
    zq:   {symbol_root: ZQ,  exchanges: [CBT, NYB], cadence: monthly,  label: "Fed Funds (ZQ)",   months: 14}
    # SR3 = 3-Month SOFR (CME), QUARTERLY IMM contracts (Mar/Jun/Sep/Dec). 100-price =
    # the compounded avg SOFR over the reference quarter. SOFR ≈ EFFR-few-bp.
    sofr: {symbol_root: SR3, exchanges: [CME],      cadence: quarterly, label: "SOFR 3M (SR3)",    months: 18}

uncertainty_indices:                 # EPU + GPR daily text-uncertainty (narrative-quant-framework P0)
  # Two peer-reviewed, free, KEYLESS daily indices that quantify the NARRATIVE REGIME
  # (the manufactured-volatility backdrop). DISPLAY-ONLY context: text-uncertainty has
  # robust content for realized VOL / tail / risk-premia but WEAK content for return
  # DIRECTION, and VIX beats EPU at vol-forecasting — so nothing here is scored. Both
  # endpoints are reachable from the sandbox (unlike FRED).
  retries: 3
  # US daily news-based Economic Policy Uncertainty (Baker-Bloom-Davis), CSV from 1985.
  epu_daily_url: https://www.policyuncertainty.com/media/All_Daily_Policy_Data.csv
  # Daily Geopolitical Risk index (Caldara-Iacoviello, AER 2022) — legacy .xls with the
  # index + THREAT/ACT split (threat reverts ~3mo; acts persist → the reversibility tag).
  gpr_daily_url: https://www.matteoiacoviello.com/gpr_files/data_gpr_daily_recent.xls

cot:
  socrata_url: https://publicreporting.cftc.gov/resource/6dca-aqww.json   # legacy futures-only
  zip_url_template: https://www.cftc.gov/files/dea/history/deacot{year}.zip
  retries: 3
  markets:                        # CFTC name prefixes (lists cover renames over time);
    es_spx: ["E-MINI S&P 500 "]   # trailing space excludes ESG/sector minis
    nasdaq: ["NASDAQ MINI", "NASDAQ-100 STOCK INDEX (MINI)"]
