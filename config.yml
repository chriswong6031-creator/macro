# -----------------------------------------------------------------------------
# Regime engine
# -----------------------------------------------------------------------------
engine:
  scoring:
    slope_window: 20              # days for direction-of-change slope
    baseline_window: 60           # z-score the slope against this trailing window of slopes
    z_threshold: 0.45             # |z| below this scores 0 (no signal); tuned 2026-06 (scripts/tune.py)
    min_components: 3             # fewer live components than this -> axis confidence = 0

  growth_axis:
    components:                   # name: {weight}; series construction in engine/axes.py
      copper_gold: {weight: 1.0}
      xly_xlp: {weight: 1.0}
      us2y_direction: {weight: 0.5}   # ambiguous when policy chases inflation (2022) — tuned down
      iwm_spy: {weight: 1.0}
      cyclical_defensive: {weight: 1.0}
      breadth_direction: {weight: 1.0}
      payrolls_trend: {weight: 0.5}     # slow confirmation, lower weight
      indpro_trend: {weight: 0.5}
      # real-time GROWTH nowcasts (research/QUANT_FACTOR_EXPANSION.md) — model-based
      # confirmations that lead the lagging payrolls/INDPRO. Absent pre-2008/2011
      # (axis renormalizes), so the 2008 episode is unchanged; they reinforce 2020.
      wei_trend: {weight: 0.5}          # Weekly Economic Index direction (weekly, 2008->)
      gdpnow_trend: {weight: 0.5}       # Atlanta Fed GDPNow direction (quarterly, 2011->)
    cyclical_basket: [XLI, XLB, XLF, XLY]
    defensive_basket: [XLP, XLU, XLV]

  inflation_axis:
    components:
      breakeven_10y_direction: {weight: 1.0}
      breakeven_5y5y_direction: {weight: 1.0}
      energy_rs: {weight: 1.0}
      oil_trend: {weight: 1.0}
      inflation_beta_basket: {weight: 1.0}   # (XLE+XLB)/(XLK+XLU)
      tips_nominal_momentum: {weight: 0.75}
      # underlying-inflation confirmation: Atlanta sticky-price CPI direction — a
      # real (not market-implied) persistent-inflation read (1967->, full history).
      sticky_cpi_direction: {weight: 0.5}
    inflation_long_basket: [XLE, XLB]
    inflation_short_basket: [XLK, XLU]

  quad:
    hysteresis_days: 7            # new quad must hold N consecutive days; tuned from 5 (whipsaw 20%->9%)
    shock_override_z: 0.85        # single-day |axis score| beyond this flips immediately; tuned from 0.7
    recession_hy_oas_min: 5.0     # % level threshold
    recession_oas_widening_days: 20
    inflation_shock_pctile: 0.90  # inflation axis score vs own history

  liquidity:
    roc_window_d: 20              # ~4 trading weeks
    expanding_threshold_bn: 25    # net-liq 4w change > +$25bn -> expanding
    contracting_threshold_bn: -25

  cycle:
    curve_inversion_level: 0.0
    oas_range_lookback_d: 504     # 2y
    oas_low_third: 0.33
    oas_high_third: 0.67

  transition:
    weakening_flags: 2
    transitioning_flags: 3
    breadth_price:
      index_near_high_pct: 2.0    # index within 2% of 60d high
      high_window_d: 60
      breadth_drop_pts: 10        # %>50DMA falls >10pts
      breadth_drop_window_d: 20
    credit_equity:
      ret_window_d: 20
      oas_z_threshold: 1.0
    ratio_inflection:
      slope_window_d: 50
    confidence_decay_window_d: 10
    gex_flip_proximity_pct: 1.0   # spot within 1% of gamma flip

  sector_preferences:             # framework-preferred sectors per quad
    Q1: [XLK, XLC, XLY, QUAL]
    Q2: [XLE, XLF, XLI, XLB, IWM]
    Q3: [XLE, XLP, XLV, GC=F]
    Q4: [XLU, XLP, XLV, LQD]

  rs_ranking:
    benchmark: SPY
    momentum_windows: [20, 60]
    trend_window: 200
    percentile_lookback_d: 252

  confluence:                     # transparent checklist weights (sum path to 100)
    regime_aligned_risk_on: 25    # in current regime's preferred list + risk-on dial
    regime_aligned: 18
    regime_neutral: 8
    tape_leading: 25              # confirmed RS uptrend, not extended
    tape_improving: 15            # momentum up, trend unconfirmed (watch, don't buy)
    tape_weakening: 10
    tape_lagging: 4
    tape_extended: 12             # leading but stretched
    tech_above200: 10
    tech_above50: 7
    tech_macd: 5
    tech_rsi_sweet: 8             # rsi in the healthy-trend zone
    tech_rsi_ok: 4
    rsi_sweet_lo: 45
    rsi_sweet_hi: 70
    rsi_overbought: 75
    crowding_soft_pctile: 85
    crowding_soft_penalty: 5
    crowding_hard_pctile: 92
    crowding_hard_penalty: 10
    # --- Macro-risk SENSITIVITY table (per-sector beta to a risk-OFF reading) ----
    # How much a high macro-risk score (MRS, 0..1) should HURT each sector's heat
    # and its holdings' buy-setup conviction. MEASURED + shrunk: each SPDR's beta is
    # tied to its CONDITIONAL fwd-63d drawdown depth under high MRS over the deep
    # SPDR history (1998->), standardized cross-sectionally and shrunk 50% toward a
    # coarse 3-tier textbook prior to stay overfit-resistant. Re-derive offline with
    # `python -m scripts.calibrate_macro_betas` (adopt only if it agrees with the
    # prior's structure); the SIGN/tier ordering is separately gated by
    # scripts/research_macro_sector.py. Positive = cyclical / long-duration
    # (penalized in risk-off; financials & comms bite hardest, tech least);
    # negative = defensive (a small credit). Keyed by SPDR ticker AND GICS / display
    # sector name so both the sector pages (ticker) and the stock library (sector
    # name) resolve. See research/MACRO_RISK_INTEGRATION.md.
    sector_macro_beta:
      XLF: 1.0      # Financials — deepest conditional drawdown under high MRS
      XLC: 1.0      # Communications
      XLY: 0.64     # Consumer Discretionary
      XLB: 0.5      # Materials
      XLRE: 0.5     # Real Estate (rate-sensitive; thin history -> prior)
      XLI: 0.48     # Industrials
      XLK: 0.39     # Technology — shallower conditional drawdown than other cyclicals
      XLE: 0.16     # Energy — modest (oil drawdowns)
      XLU: -0.29    # Utilities (least defensive of the three — rate-sensitive)
      XLV: -0.46    # Health Care
      XLP: -0.56    # Consumer Staples — most defensive
      # GICS / display sector names (deep-history holdings + breadth constituents) —
      # mirror their SPDR's measured value.
      Technology: 0.39
      Information Technology: 0.39
      Consumer Discretionary: 0.64
      Financials: 1.0
      Communications: 1.0
      Communication Services: 1.0
      Industrials: 0.48
      Materials: 0.5
      Real Estate: 0.5
      Energy: 0.16
      Consumer Staples: -0.56
      Utilities: -0.29
      Health Care: -0.46

  # --- Macro-risk overlay: make aggregate macro risk a DETERMINISTIC, risk-OFF-
  # only factor in sector heat + per-stock buy-setup conviction. MRS (macro-risk
  # score, 0..1) is a pure function of the already-persisted conditions/regime legs
  # (engine.conditions.macro_risk_*); the penalty per instrument scales by the
  # sector_macro_beta table above. Framed as drawdown/sizing caution, NEVER alpha:
  # the cross-sectional edge is unproven (research/DISLOCATION_VALIDATION.md shows
  # one robust drawdown-median cell; returns/tail/hit all span 0). Magnitudes are
  # conservative and FIXED (not tuned to a backtest). enabled:false => exact pre-
  # overlay behavior. See research/MACRO_RISK_INTEGRATION.md.
  macro_overlay:
    enabled: true            # global kill-switch (false => overlay is a no-op)
    macro_max: 7             # max sector-heat swing (conservative; <= the +7 regime swing)
    macro_headwind: 7        # max per-stock buy-setup penalty (conservative; <= LIQ_HEADWIND=12)
    mrs_weights:             # weight each MRS leg toward the measured-edge legs
      recession: 1.0
      drawdown: 1.0
      nfci: 0.5
      liquidity: 0.5         # contracting-liquidity is the main cyclical/defensive
                             # differentiator — the B-1 sign-check only passes WITH
                             # it. It also has a uniform ladder nudge (LIQ_HEADWIND);
                             # the MRS leg adds sector differentiation on top — a
                             # small, intentional overlap, not double-counting noise.
      transition: 0.25

  # --- Quant-factor expansion: complementary nowcast / conditions / risk layer.
  # ADDITIVE — engine/conditions.py runs alongside the validated quad, never
  # alters it. See research/QUANT_FACTOR_EXPANSION.md.
  conditions:
    nfci_change_window_d: 65        # ~13 weeks: NFCI tightening/loosening trend
    nfci_pctile_lookback_d: 1260    # ~5y percentile of the conditions level
    systemic_stress:                # OFR FSI + commercial-paper spreads (research/DATA_SIGNAL_EXPANSION_2026.md)
      fsi_pctile_lookback_d: 1260   # ~5y percentile of the OFR FSI level
      fsi_change_window_d: 65       # ~13 weeks: FSI rising/easing trend
      cp_pctile_lookback_d: 1260    # ~5y percentile of the CP spreads
      elevated_pctile: 0.80         # FSI/CP percentile -> "elevated stress"
      acute_pctile: 0.95            # FSI/CP percentile -> "acute stress"
    labor:                          # high-frequency real-activity nowcast (research/REAL_ACTIVITY_NOWCAST.md)
      claims_yoy_window_d: 252      # ~1y change of the 4wk-MA claims level (rising = labor cooling)
      claims_z_lookback_d: 756      # ~3y rolling z of the 4wk-MA claims level
      indeed_chg_window_d: 63       # ~3m change of the Indeed postings index (labor demand trend)
      withheld_sum_window_d: 63     # trailing ~3m of ACTUAL deposit days (a flow — never ffilled)
      withheld_yoy_window_d: 252    # ~1y of deposit days for the YoY of the trailing sum
      news_z_lookback_d: 252        # ~1y rolling z of the daily news-sentiment level
      claims_yoy_warn_pct: 10.0     # 4wk-MA claims +10% y/y => "cooling" label
      indeed_chg_warn_pct: -5.0     # Indeed postings -5% over 3m => demand softening
    recession:                      # composite 0..100 recession-risk score
      weights: {sahm: 1.0, recession_prob: 0.8, ebp_prob: 0.8, curve: 1.0, ebp_level: 0.5, claims: 1.0}
      # LABOR leg = jobless claims (PRIMARY); Sahm is the graceful FALLBACK, used only when
      # the claims feed is unavailable. Phase-0/1.5 validated vs NBER 1967-2026 (8 recessions,
      # + ALFRED point-in-time): claims beats Sahm standalone AND in-composite at every horizon,
      # and REPLACE > AUGMENT > Sahm-only across revised / timing-lagged / PIT modes. So claims
      # carries the full labor weight (1.0, = Sahm's old weight); sahm's 1.0 is now its FALLBACK
      # weight. Set claims:0 to revert to Sahm. research/CLAIMS_RECESSION_VALIDATION.md
      claims_yoy_window_d: 252       # ~1y change of the 4wk-MA claims level
      claims_yoy_full: 0.40          # +40% y/y => full recessionary (clipped 0..1)
      sahm_full: 0.50               # Sahm >= this => recession underway (full stress)
      curve_invert_level: 0.0       # term-premium-adjusted slope below this => inversion stress
      curve_full_invert: -1.0       # ...and this deep => full curve stress
      ebp_level_pctile_lookback_d: 2520  # ~10y percentile for the EBP level leg
      elevated_score: 30            # >= => "elevated"
      high_score: 55                # >= => "high"
    inflation_nowcast:
      smooth_months: 3              # 3-month average of the monthly sticky/flex prints
    vrp:                            # equity volatility-risk-premium (implied - realized)
      realized_window_d: 21
      pctile_lookback_d: 504
      stress_level: 0.0             # VRP below this (realized > implied) => vol stress
    skew_pctile_lookback_d: 504     # CBOE SKEW percentile window
    term_structure:                 # VIX9D/VIX vs VIX3M as risk-appetite
      backwardation_ratio: 1.0      # vix/vix3m above this => backwardation (stress)
    corr:                           # realized stock-bond correlation regime
      window_d: 63
      high: 0.30                    # above this => the 2022 'bonds don't hedge' regime
      low: 0.0
    roro:                           # cross-asset Risk-On/Risk-Off composite
      z_window_d: 252
      risk_on: 0.35                 # composite z above this => risk-on
      risk_off: -0.35
    vol_target:                     # exposure scalar for the playbook dial
      target_vol_pct: 12.0          # annualized realized-vol target for SPX-like exposure
      realized_window_d: 21
      floor: 0.5                    # never scale exposure below/above these
      cap: 1.5
    # --- MEASURED higher-quality signals (research/QUANT_FACTOR_EXPANSION.md §6) -
    # Drawdown-risk gauge: a LEAN 4-factor macro-stress composite. MEASURED:
    # >=80 -> P(>=10% drawdown in 63d) ~45% vs ~13% base; curve & VIX were dropped
    # because they tested weak/coincident. It is a DRAWDOWN-RISK gauge, NOT a
    # return forecast (risk-off rebounds) and NOT a clean recession leader.
    drawdown_risk:
      components: [recession_risk, nfci, ebp, hy_oas]
      z_lookback_d: 1260            # ~5y rolling z for each component
      pctile_lookback_d: 2520       # ~10y percentile -> 0..100 gauge
      elevated: 60
      high: 80
      extreme: 90
    # Capitulation gauge: contrarian bounce signal. MEASURED: VRP %ile>0.90 ->
    # +5.8%/63d, 88% positive (vs +2.8% base), shallower drawdowns; VIX>30 ->
    # +7.2%; COT ES washout (<10th %ile) -> +4.2%; stacked -> +9.6%/92%.
    capitulation:
      vrp_pctile: 0.90              # realized vol >> implied = panic
      vix_panic: 30.0
      cot_washout_pctile: 0.10      # COT ES net-spec wrung out (3y rolling)
      cot_pctile_lookback_d: 756
    # Complacency / hidden-fragility gauge: the DISPLAY-ONLY mirror of the
    # capitulation gauge above. Capitulation reads extreme FEAR (-> a measured
    # contrarian bounce); this reads the opposite tail — a CALM surface (cheap
    # VIX, steep contango) sitting over DETERIORATING internals (breadth not
    # confirming a strong tape, HY credit quietly widening): the 'calm but
    # fragile' backdrop. Deliberately NEVER scored — 'low VIX' is persistent and
    # ~neutral on forward returns, and the fragility only bites conditional on a
    # catalyst (the same reason the RORO composite gates nothing). Context, not a
    # timing signal. The warning fires only on the CONJUNCTION: calm AND weak.
    complacency:
      vix_pctile_lookback_d: 504     # ~2y window for the VIX percentile (the 'calm' read)
      vix_calm_pctile: 0.25          # VIX in the bottom quartile of its 2y range = complacent
      contango_calm: 0.95            # vix/vix3m below this = steep contango = calm front end
      breadth_pctile_lookback_d: 504 # ~2y window for the %>200dma percentile
      breadth_high_prox: 0.97        # SPY within 3% of its 1y high = strong/calm tape
      breadth_weak_pctile: 0.40      # %>200dma below this %ile WHILE tape strong = not confirming
      credit_widen_window_d: 21      # HY OAS change window for 'credit not confirming'

# -----------------------------------------------------------------------------
# Alerts (Phase 3 — rules defined now, wired after validation checkpoint)
# -----------------------------------------------------------------------------
alerts:
  transition_state_change: true
  axis_confidence_floor: 0.3
  sector_rs_percentile_hi: 90
  sector_rs_percentile_lo: 10
  holdings_active_change_pct: 20
  holdings_active_change_days: 5
  sector_holdings_accumulation: true   # decomposed sector-ETF weight-change signal
  net_liquidity_roc_sign_flip: true
  net_liquidity_roc_deadband_bn: 25    # ignore RoC flips within ±N bn of zero (kills "+7 -> -0bn" noise)
  net_liquidity_roc_confirm_days: 2    # ...and require the new sign to HOLD N days before firing
  hy_oas_1d_widening_z: 2.5
  gex_flip_cross: true
  gex_net_deadband_bn: 1.0             # ignore net-GEX sign flips within ±N bn of zero
  gex_flip_pct_deadband: 0.25          # ignore spot/flip crossings while hugging the flip (±N%)
  # --- Quant-factor expansion (engine/conditions.py) alerts ---
  conditions_recession_state_change: true   # recession-risk band crossed (low/elevated/high)
  nfci_tightening_z: 0.65              # NFCI crossing above this (tight) fires once
  sahm_trigger: 0.50                  # Sahm rule crossing >= this = labor-recession confirm
  ebp_widening_z: 2.0                 # EBP 1-month change this many sigma = credit risk-off
  drawdown_risk_high: 80              # macro-stress gauge crossing into the high band (P(dd) ~36%)
  capitulation_strong: 2              # capitulation gauge >= this (stacked) = contrarian bounce watch
  # --- per-ticker / per-ETF alert feed (engine/ticker_alerts.py) ---
  ticker_timeline_days: 120           # window shown in each ticker / ETF alert feed
  ticker_max_events: 50               # cap on events kept per feed (most-recent-first)

notify:
  # public base URL of the published site (e.g. https://user.github.io/repo).
  # When set, alert pings deep-link to the exact scorecard panel on macro.html.
  # Leave blank to send alerts without a link.
  site_url: "https://chriswong6031-creator.github.io/macro"
  telegram:
    enabled: true                 # needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID secrets
  discord:
    enabled: false                # needs DISCORD_WEBHOOK_URL secret

validation:
  start_date: "2007-01-01"
  whipsaw_max_days: 10            # regime lasting < this counts as whipsaw
  whipsaw_target_pct: 15
  forward_return_window_d: 60

# =============================================================================
# Commodity Vector (Section 5). Self-contained block, like `vector:`. Core four —
# gold, silver, oil (WTI), copper. Price + COT already collected 1995/2000-> and
# macro drivers come from the shared FRED/Yahoo store (see
# research/COMMODITY_DATA_AUDIT.md). The asset-agnostic price layer mirrors
# `vector:`; the driver axis + residual shock engine + COT positioning are
# commodity-specific. House rule: mechanical backtestable core; the news/LLM
# event layer is deferred (annotation-only, never a scoring input).
# =============================================================================

# =============================================================================
# Cross-Asset Vector (engine/cross_asset_trend.py) — multi-asset TREND (time-series
# momentum) + intermarket RATIOS + light CARRY context, over the keyless price
# stores (NO new collectors). A LEAF: nothing in scoring imports it. TREND is the
# canonical managed-futures factor; AQR's gross Sharpe ~1.8 is contested, so the
# AFTER-COST/DSR/permutation-null number from scripts/cross_asset_phase0.py is the
# published one (verdict: CONTESTED — shipped as a REGIME read, not a strategy).
# =============================================================================
cross_asset:
  universe:                          # name: [store-group, store-key, price-col, class]
    equity_us:  [yahoo, "SPY",      close, equity]
    equity_sm:  [yahoo, "IWM",      close, equity]
    credit_hy:  [yahoo, "HYG",      close, credit]
    gold:       [yahoo, "GC=F",     close, commodity]
    silver:     [yahoo, "SI=F",     close, commodity]
    copper:     [yahoo, "HG=F",     close, commodity]
    oil:        [yahoo, "CL=F",     close, commodity]
    dollar:     [yahoo, "DX-Y.NYB", close, fx]
    bond_10y:   [fred,  "DGS10",    us10y, rates]   # traded as -duration*Δyield proxy
    crypto:     [yahoo, "BTC-USD",  close, crypto]
  tsmom:
    lookbacks_d: [63, 126, 252]      # 3/6/12-month TSMOM, equal-weight blend of signs
    skip_d: 5                        # skip most-recent week (dodge 1-week reversal)
  ratios:
    pctile_lookback_d: 504           # ~2y window for the intermarket-ratio percentile
  calibration:
    start_date: "2007-01-01"         # all 10 legs live (HY-constrained); phase0 window
    cost_bps: 8                      # one-way; net-of-cost headline (futures-proxy slippage)

# =============================================================================
# Global central-bank LIQUIDITY (engine/global_liquidity.py) — the major-CB
# balance-sheet tide, USD-aggregated, from keyless FRED. Distinct from the BTC
# `global_liquidity` M2 read above (that's broad money; this is CB assets). A LEAF:
# context macro driver, not wired into scoring. Major CBs at usable frequency =
# Fed (weekly) + ECB (weekly) + BoJ (monthly); BoE is annual-only on FRED and a
# clean keyless PBoC series is unavailable, so they are omitted (honest). Each raw
# series -> local currency (unit_mult) -> USD (fx, invert for USD/XXX quotes) ->
# summed in USD trillions; impulse = 13-week & 52-week % change.
# =============================================================================
cb_liquidity:
  banks:                             # id: series, unit_mult(->local ccy), fx(yahoo, null=USD), invert
    fed: {series: WALCL,      unit_mult: 1.0e6, fx: null,        invert: false, label_en: "Federal Reserve", label_zh: "美联储"}
    ecb: {series: ECBASSETSW, unit_mult: 1.0e6, fx: "EURUSD=X",  invert: false, label_en: "ECB",            label_zh: "欧洲央行"}
    boj: {series: JPNASSETS,  unit_mult: 1.0e8, fx: "USDJPY=X",  invert: true,  label_en: "Bank of Japan",  label_zh: "日本央行"}
  impulse_windows_w: [13, 52]        # quarterly & YoY % change of the USD aggregate

# =============================================================================
# OFR Short-Term Funding Monitor (collectors/ofr.py) — repo/SOFR/money-market
# plumbing from the US Office of Financial Research's KEYLESS public JSON API
# (data.financialresearch.gov, "no tokens or registration"). FRBNY reference rates:
# SOFR + its 1/99 percentile distribution, EFFR, OBFR, and GC repo rates. Feeds the
# funding-stress leaf (engine/funding_stress.py) — CONTEXT, never scored.
# =============================================================================
ofr:
  enabled: true
  retries: 3
  series:                            # OFR mnemonic -> stored column name
    FNYR-SOFR-A: sofr
    FNYR-SOFR_99Pctl-A: sofr_p99
    FNYR-SOFR_1Pctl-A: sofr_p1
    FNYR-EFFR-A: effr
    FNYR-OBFR-A: obfr
    FNYR-BGCR-A: bgcr
    FNYR-TGCR-A: tgcr

funding_stress:
  pctile_lookback_d: 504             # ~2y trailing window for the spread/dispersion percentile

# =============================================================================
# Prediction markets (collectors/prediction_markets.py + engine) — market-implied
# odds for macro events from the keyless Polymarket Gamma API. Pairs with the
# FOMC/jobs catalyst calendar on macro.html. Event titles rotate, so each is matched
# by a title substring and the nearest-expiry/max-volume event is picked dynamically;
# each run APPENDS a dated snapshot (history accrues → backtestable later). Private-use
# dashboard. CONTEXT (crowd expectation), never wired into any score.
# =============================================================================
prediction_markets:
  enabled: true
  retries: 3
  events:                            # key: {match(title substr), pick, labels}
    fed_next:  {match: "Fed Decision", pick: nearest_end, label_en: "Next Fed decision", label_zh: "下次美联储决议"}
    fed_cuts:  {match: "rate cuts in", pick: max_volume,  label_en: "Fed cuts this year", label_zh: "今年降息次数"}
    recession: {match: "recession",    pick: max_volume,  label_en: "US recession",       label_zh: "美国衰退"}

# =============================================================================
# BIS global credit cycle (collectors/bis.py + engine/credit_cycle.py) — the
# credit-to-GDP GAP (Borio-Drehmann crisis early-warning) + debt-service ratios,
# from the BIS keyless SDMX v2 API (stats.bis.org, attribution-only licence).
# Quarterly, slow-moving structural CONTEXT on the bonds page — never scored.
# CG_DTYPE: A=credit/GDP ratio, B=trend, C=GAP (we take the gap).
# =============================================================================
bis:
  enabled: true
  retries: 3
  series:                            # store_key: {flow, full SDMX key, col}
    us_gap: {flow: WS_CREDIT_GAP, key: "Q.US.P.A.C", col: gap}
    us_dsr: {flow: WS_DSR,        key: "Q.US.P",     col: dsr}
    cn_gap: {flow: WS_CREDIT_GAP, key: "Q.CN.P.A.C", col: gap}
    cn_dsr: {flow: WS_DSR,        key: "Q.CN.P",     col: dsr}

credit_cycle:
  boom_gap: 10.0                     # credit-to-GDP gap above this = boom / elevated crisis risk (BIS)
  delever_gap: -2.0                  # below this = deleveraging
  countries:
    us: {gap: us_gap, dsr: us_dsr, label_en: "United States", label_zh: "美国"}
    cn: {gap: cn_gap, dsr: cn_dsr, label_en: "China",         label_zh: "中国"}

# =============================================================================
# Treasury auction RESULTS (collectors/treasury_auctions.py + engine/treasury_supply.py)
# — the DEMAND side of the Treasury market from the keyless TreasuryDirect
# TA_WS/securities/auctioned feed. Display-only "supply absorption" panel on the
# bonds page: per-tenor bid-to-cover / indirect-share / dealer-takedown z-scores vs
# trailing same-tenor auctions + the bills-vs-coupons issuance mix. NEVER scored.
treasury_auctions:
  enabled: true
  retries: 3
  history_days: 3650               # the feed caps at the newest ~250 rows/type regardless
  types: [Bill, Note, Bond, TIPS, FRN]
  trailing: 8                      # same-tenor auctions in the z-score baseline window
  min_trailing: 5                  # need this many priors before scoring an auction
  strong_z: 0.6                    # |absorption z| band for the strong / soft tags
  recent: 10                       # auctions shown in the recent-auctions table
  mix_window_days: 90              # bills-vs-coupons mix window (vs the prior 90d)

commodities:
  assets:                          # name: [yahoo price ticker, cot store-series, class]
    gold:   ["GC=F", cot_gold,   precious]
    silver: ["SI=F", cot_silver, precious]
    copper: ["HG=F", cot_copper, industrial]
    oil:    ["CL=F", cot_oil,    energy]

  drivers:                         # shared macro series: name -> [store-group, store-name]
    real_yield:    [fred, DFII10]        # 10y TIPS real yield — the gold/silver anchor
    dxy:           [yahoo, "DX-Y.NYB"]   # US Dollar Index (1971->; gold/silver dollar driver)
    broad_dollar:  [fred, DTWEXBGS]      # broad trade-weighted USD (2006->); copper/oil driver (measured: corr -0.57/-0.46 vs DXY -0.47/-0.32)
    breakeven10:   [fred, T10YIE]        # 10y inflation breakeven
    breakeven5y5y: [fred, T5YIFR]
    us10y:         [fred, DGS10]
    us2y:          [fred, DGS2]
    fed_balance:   [fred, WALCL]         # Fed balance sheet (net-liquidity proxy)
    indpro:        [fred, INDPRO]        # industrial production (growth)
    vix:           [fred, VIXCLS]

  momentum:                        # ported price vote-ensemble -> [-1,+1]
    smooth_days: 3
    rsi_bull: 55
    rsi_bear: 45
    votes: {ema_trend: 1.0, ema_cross: 1.0, macd_hist: 1.0, sma200: 1.0, roc20: 1.0, rsi_zone: 1.0}
    trigger: 0.5
    exit: 0.25
    confirm_days: 3

  structure:                       # structure-shift oscillator [-1,+1]
    swing_window_d: 20
    breakout_lookback_d: 60
    confirm_days: 3
    trigger: 0.5
    exit: 0.25

  trend:                           # 12-month time-series momentum (TSMOM) — the canonical
    lookback_d: 252                # commodity factor. MEASURED: metals trend (gold up-trend
    confirm_days: 5                # +7.8%/126d 75% hit vs +3.3% down), oil MEAN-REVERTS
    scale: 0.30                    # (calibration tags oil INVERTED -> present as contrarian);
                                   # bounded score = tanh(12m_return / scale)

  risk:                            # saturating composite -> 0..100, threshold 25
    threshold: 25
    exit_threshold: 15
    deadband: 0.10
    vol_window_d: 30
    vol_pctile_lookback_d: 1260    # ~5y (commodities have deep history)
    drawdown_window_d: 90
    drawdown_full_stress: 0.30
    weights:                       # on-chain swapped for COT positioning stress
      vol_pctile: 1.0
      drawdown: 1.0
      momentum_deterioration: 0.75
      positioning_stress: 0.5      # crowded-long COT = downside risk
    oscillator_delta_d: 10
    oscillator_scale: 30

  gauges:
    vol_low_pctile: 0.30
    vol_high_pctile: 0.75
    flow_low_pctile: 0.30
    flow_high_pctile: 0.75

  driver_axis:                     # macro tailwind/headwind: per-asset orientation*weight
    change_window_d: 40            # driver direction = sign of N-day change (smoothed)
    smooth_days: 5
    weights:                       # sign = effect of a RISING driver on the commodity price
      gold:   {real_yield: -1.0, dxy: -1.0, breakeven10: 0.5, fed_balance: 0.5}
      silver: {real_yield: -1.0, dxy: -1.0, breakeven10: 0.5, indpro: 0.5}
      copper: {broad_dollar: -1.0, indpro: 1.0, real_yield: -0.5, us10y: 0.3}  # broad$ > DXY for copper (measured)
      oil:    {broad_dollar: -1.0, breakeven10: 0.5, indpro: 0.5}              # broad$ > DXY for oil (measured)
    trigger: 0.34                  # |score| above -> tailwind / headwind regime
    exit: 0.15

  residual:                        # exogenous-bid detector (the decoupling shock engine)
    return_window_d: 21            # horizon for actual & model-predicted returns
    drivers:                       # which driver CHANGES feed the regression, per asset
      gold:   [real_yield, dxy]
      silver: [real_yield, dxy]
      copper: [broad_dollar, indpro]
      oil:    [broad_dollar]
    min_train_d: 504               # >=2y before first fit (expanding, refit monthly — causal)
    refit_every_d: 21
    z_lookback_d: 252              # rolling std for the shock z-score
    shock_z: 1.5                   # |z| above -> shock flag
    decoupling_corr_window_d: 252
    decoupling_corr_max: 0.2       # |rolling corr to primary driver| below -> decoupled

  positioning:                     # COT spec extremes — ROLLING window (oil handoff, audit §2.3)
    pctile_lookback_d: 756         # ~3y rolling absorbs the 2022 oil NYMEX->ICE level shift
    crowded_long_pctile: 0.85
    crowded_short_pctile: 0.15

  cross_asset:                     # commodity-complex macro-regime quadrant
    ratio_window_d: 60
    dollar_trend_window_d: 60
    growth_proxy: copper_gold      # copper/gold ratio = market-implied growth/rates

  gold_silver_ratio:               # precious-metals value/mean-reversion (gold/silver)
    pctile_lookback_d: 756         # ~3y rolling. MEASURED: high GSR (silver cheap) -> silver
    high_pctile: 0.80              # +11.7%/126d vs +3.5% at low GSR; mild same-direction gold
    low_pctile: 0.20

  brent_wti:                       # oil energy-microstructure (Brent BZ=F vs WTI CL=F, both stored)
    spread_pctile_lookback_d: 504  # MEASURED: spread WIDENING -> WTI +8.2%/126d vs -1.8% narrowing
    change_window_d: 60

  # --- Phase 1 of the four-phase factor build-out: roll-yield CARRY -----------
  # Backwardation (front > deferred) earns positive roll yield and is THE dominant
  # long-run commodity return driver (research/QUANT_FACTOR_EXPANSION.md). Built
  # from Yahoo DATED futures contracts (CLN26.NYM etc.); the engine reconstructs a
  # continuous front-vs-second roll yield from the nearest live contracts.
  carry:
    contracts:                     # asset -> [root, yahoo exchange suffix]
      oil:    ["CL", ".NYM"]
      brent:  ["BZ", ".NYM"]
      gold:   ["GC", ".CMX"]
      silver: ["SI", ".CMX"]
      copper: ["HG", ".CMX"]
    months_back: 8                 # enumerate contract months from now-8 ...
    months_fwd: 5                  # ... to now+5 (drop non-active months that don't quote)
    history_d: 400                 # bdays of reconstructed carry to keep
    pctile_lookback_d: 504         # ~2y percentile of the roll yield
    backwardation_ann: 0.0         # ann roll yield above this => backwardation (positive carry)

  allocation:                      # strategy grids on (momentum, risk)
    variants:
      conservative: {mom_full: 0.6, risk_full: 15, mom_half: 0.5, risk_half: 25}
      moderate:     {mom_full: 0.5, risk_full: 25, mom_half: 0.0, risk_half: 40}
      aggressive:   {mom_full: 0.3, risk_full: 40, mom_half: -0.2, risk_half: 60}
      optimal:      {mom_full: 0.5, risk_full: 25, mom_half: 0.0, risk_half: 50}
    confirm_days: 2

  tactical:
    efficiency_window_d: 30
    strategic_min_efficiency: 0.35
    strategic_max_risk: 40

  calibration:
    start_date: "2001-01-01"       # Yahoo commodity history 2000->
    split_date: "2013-01-01"       # split-half robustness boundary
    forward_days: [21, 63, 126]
    whipsaw_max_days: 10
    whipsaw_target_pct: 15
    cost_bps: 8                    # one-way transaction cost (spread+roll slippage) per unit |Δpos|; liquid commodity futures/ETF proxy — wider than FX spot, tighter than BTC. Allocation CAGR/Sharpe are NET of this
    n_trials: 40                  # honest UPPER-BOUND of independent strategy configs explored per asset, for the Deflated Sharpe haircut — overestimate is conservative (de Prado); raise as you try more

  # --- Phase 5: alerts (daily state-change events) + intraday shock sentinel ---
  alerts:
    timeline_days: 60               # window shown on the commodities.html timeline
    risk_extreme_level: 50          # Risk Index held >= this ...
    risk_extreme_days: 21           # ... for this many days -> capitulation watch
    shock:                          # SYMMETRIC intraday vol-shock state machine (per asset):
      # commodities spike UP on supply shocks (oil/war) AND flush DOWN (gold/silver),
      # so unlike BTC's crash-only machine this fires on a move in EITHER direction.
      vol_window_h: 72              # trailing hourly realized-vol window
      move_window_h: 6              # acute-move measurement window
      enter_sigma: 3.0              # |move| this many sigma ...
      enter_pct:                    # ... AND beyond this absolute % (per-asset; commodity
        gold: 3.0                   #     vol << crypto, so thresholds are asset-specific)
        silver: 5.0
        copper: 4.0
        oil: 5.0
      extended_pct:                 # |24h move| beyond this -> escalate shock -> extended
        gold: 5.0
        silver: 8.0
        copper: 6.0
        oil: 9.0
      stabilize_quiet_h: 12         # quiet hours -> stabilizing
      normal_quiet_h: 48            # quiet hours -> back to normal
      intraday_lookback_d: 60       # trailing hourly window the state machine runs over

# =============================================================================
# Commodity Vector — Phase 6 news/event ANNOTATION layer (engine/commodity_news.py).
# DEFERRED · GATED · ANNOTATION-ONLY · DEFAULT OFF. Honest CONTEXT, never a scoring
# input — the mechanical core never imports it. The upcoming-catalysts watch list
# (OPEC/FOMC/EIA) is keyless and always rendered; headline-fetch (GDELT, keyless)
# + the optional AI cause-classifier only run when `enabled` (and, for the LLM, when
# `llm_classify` AND an ANTHROPIC_API_KEY are present).
# =============================================================================
commodity_news:
  enabled: false                  # MASTER SWITCH — nothing fetches unless true
  source: gdelt                   # only GDELT DOC 2.0 implemented (free, keyless)
  lang: eng                       # GDELT sourcelang filter
  max_records: 6                  # headlines fetched per event (keep small)
  window_days: 3                  # +/- days around the event date (pinned query)
  min_request_interval_s: 6       # GDELT pacing (>= its 5s/req rule + margin)
  cache_dir: data/commodity/news_cache
  cache_ttl_hours: 24
  llm_classify: false             # OPTIONAL AI cause-classifier — off even if a key is present
  llm_model: claude-haiku-4-5     # cheap; ~$0.0007/call
  llm_min_confidence: high        # code-side gate: below this -> "unknown"
  catalysts_horizon_days: 14      # upcoming OPEC/FOMC/EIA watch window (keyless, always on)

# =============================================================================
# Macro news & catalysts (engine/macro_news.py) — ANNOTATION layer for macro.html.
# A LEAF: imports nothing from the scoring core; nothing in scoring imports it.
# "Useful vs useless" news is decided WITHOUT AI: (1) GDELT is queried with a macro
# OR-clause + sourcecountry:US; (2) a reputable-source allowlist + (3) a title-level
# macro-theme gate keep only clearly-macro headlines from quality outlets and TAG
# each by theme; (4) dedup + recency. The "sentiment" shown is the quantitative
# SF-Fed Daily News Sentiment Index (already computed in conditions), NOT per-headline
# AI. The OPTIONAL llm_brief is the only AI — a gated, default-off narrator that
# writes one context paragraph and feeds NO score. Catalysts (FOMC + jobs report)
# are keyless and always on.
# =============================================================================
macro_news:
  enabled: false                  # MASTER SWITCH for the GDELT fetch + LLM brief
  lang: eng
  window_days: 2                  # fetch the last N days of macro news
  max_records: 200                # candidates pulled from GDELT before filtering
  max_show: 10                    # headlines shown after filtering
  min_request_interval_s: 6       # GDELT pacing
  cache_dir: data/macro/news_cache
  cache_ttl_hours: 12
  catalysts_horizon_days: 14
  # reputable macro/financial source allowlist (substring match on article domain).
  # Omit to use the built-in default list in engine/macro_news.py.
  sources: []
  # official release dates the calendar can't compute (CPI/GDP/Jackson Hole/etc.) —
  # add {type, date: 'YYYY-MM-DD', label, time_et} rows as the BLS/BEA schedule firms up.
  extra_catalysts: []
  # OPTIONAL AI brief — the only AI; off even if a key is present. Provider-agnostic
  # (DeepSeek/Anthropic wire), degrade-to-keyless, never scored.
  llm_brief: false
  llm_model: deepseek-chat
  base_url: https://api.deepseek.com/anthropic   # omit / null for native Anthropic
  api_key_env: DEEPSEEK_API_KEY

# =============================================================================
# News-vector PIT event bus (engine/news_vector.py) — Stage 1 of the narrative-
# quantification framework (memory narrative-quant-framework). A first-print,
# append-only, keep-FIRST event store over a NARRATIVE-scope GDELT slice
# (trade/geopolitics/industrial-policy + macro). DISPLAY-ONLY / CONTEXT-ONLY: its
# value is measurement integrity, not alpha — nothing here is ever scored. The LLM
# structured-extraction stage is STUBBED OFF (enabled + llm_extract both false).
# =============================================================================
news_vector:
  enabled: true                   # MASTER SWITCH for the GDELT fetch + accrual (ON: accrues the forward PIT event store)
  llm_extract: false              # Stage-C structured extraction — OFF in P0 (no model call)
  lang: eng
  window_days: 2                  # fetch the last N days of narrative news
  max_records: 120                # candidates pulled from GDELT before the gate
  min_request_interval_s: 6       # GDELT pacing (>=6s)
  cache_dir: data/news_vector/fetch_cache
  cache_ttl_hours: 12
  use_fred: true                  # scheduled_ref via FRED release dates; degrades to static CY2026
  # Omit `sources`/`query_terms` to use the built-in defaults in engine/news_vector.py.
  sources: []                     # reputable-source allowlist override (default = macro_news list)
  query_terms: []                 # GDELT OR-clause override (default = narrative core)

# =============================================================================
# Company-profile translation (engine/translate.py + scripts/translate_profiles.py).
# The single-stock analyzer's "Business profile" blurb is sourced English free text
# (Wikipedia/SEC) — not a UI string, so it can't be dual-emitted like the rest of the
# i18n. This OPTIONAL, GATED, CACHED pass machine-translates each blurb to 简体中文 once
# (keyed by a hash of the English, so only new/changed text re-hits the API) and stores
# it in data/profile/descriptions_zh.parquet; _load_profiles() joins it so the analyzer
# can `lz()`-pick by language. DEFAULT OFF + degrade-never-raise: no key / disabled =>
# the blurb simply stays English (today's behavior). Provider-agnostic (Anthropic-compatible
# wire format): DeepSeek (cheap, 中文-native — the documented choice) or Anthropic.
# =============================================================================
profile_translation:
  enabled: true                   # gate; still a no-op unless the api_key_env key is set
  provider: deepseek              # deepseek | anthropic (label only; both use the anthropic SDK)
  model: deepseek-chat            # DeepSeek V3.x chat; or e.g. claude-haiku-4-5 for anthropic
  base_url: https://api.deepseek.com/anthropic   # omit / null for native Anthropic
  api_key_env: DEEPSEEK_API_KEY   # which env var (or .env entry) holds the key
  batch_size: 20                  # blurbs per request (short text; JSON-array contract, validated)
  max_chars: 600                  # truncate pathologically long blurbs before sending
  max_tokens: 4000                # response cap per batch
# Catalyst tone — market/regime narrative DIGEST (LLM Tier A; engine/catalyst_tone.py).
# LEAF · DEFAULT-OFF · CONTEXT-ONLY. Digests ONE public document (FOMC text, a
# regulatory release, dislocation-day catalyst text) into a typed tone/guidance/
# risk/shock-reversibility record. Runs on DeepSeek V4 Flash via its
# Anthropic-compatible endpoint (the same `anthropic` SDK, base_url + key swapped).
# Safety is in CODE: JSON-parse -> schema-validate -> verbatim-citation-verify ->
# confidence-floor -> degrade-never-raise. PUBLIC source documents only.
# Promotion of a field to a deterministic feature happens downstream, separately gated.
# =============================================================================
catalyst_tone:
  enabled: true                   # MASTER SWITCH — nothing calls the model unless true
  api_key_env: DEEPSEEK_API_KEY   # credential read from env / .env (gitignored)
  llm_base_url: https://api.deepseek.com/anthropic   # DeepSeek Anthropic-compat endpoint
  llm_model: deepseek-v4-flash    # cheap digest model ($0.14/$0.28 per 1M tok)
  llm_min_confidence: medium        # code-side floor: below this every field -> "unknown"
  max_tokens: 1500                 # OUTPUT cap (the JSON record is tiny); input can be a full doc
  max_doc_chars: 20000            # input doc is trimmed to the statement body + capped
  max_age_days: 120               # ignore FOMC statements older than this (stale context)
  cache_dir: data/catalyst/digest_cache   # one digest cached per meeting (never re-called)
  event_enabled: true             # Stage 3b: on a dislocation day with no FOMC read, digest that day's news
  event_window_days: 2            # GDELT window +/- around the dislocation day
  event_max_records: 8            # headlines fetched for the event digest (keep small)

# =============================================================================
# Master brain — multi-LENS macro SYNTHESIS (LLM Tier-B; engine/master_brain.py).
# LEAF · DEFAULT-OFF · RESEARCH/CONTEXT-ONLY. Reads the dashboards' deterministic
# latest.json files and writes an analyst's morning brief per lens. NEVER feeds a score.
# Three lenses share one engine + one set of LLM creds:
#   macro -> data/regime/master_brief.json  (cross-asset; shown on the US dashboard)
#   china -> data/regime/china_brief.json   (China & HK focused; shown on china.html)
#   btc   -> data/regime/btc_brief.json     (Bitcoin focused; shown on vector.html)
# Each also writes a site/ copy the dashboard panel fetches at runtime. The daily
# pipeline step `python -m engine.master_brain` runs every lens in `lenses` (below).
# Runs on DeepSeek V4 Pro now; swap llm_model/llm_base_url/api_key_env to move to
# Claude Opus later (e.g. llm_model: claude-opus-4-8, llm_base_url removed,
# api_key_env: ANTHROPIC_API_KEY). Sends DERIVED state (no holdings) to the provider.
# Run one lens on-demand: `python -m engine.master_brain china --force`.
# =============================================================================
master_brain:
  enabled: true                   # MASTER SWITCH — pipeline runs it only when true
  lenses: [macro, china, btc]     # which briefs to generate (one LLM call each)
  api_key_env: DEEPSEEK_API_KEY
  llm_base_url: https://api.deepseek.com/anthropic
  llm_model: deepseek-v4-pro      # reasoning tier ($0.435/$0.87 per 1M tok)
  max_tokens: 8000                # V4 Pro is a REASONING model — thinking tokens count
                                  # against this cap, so the JSON needs headroom above
                                  # the ~1.2k it occupies (4000 truncated china/btc mid-JSON)
  translate_zh: true              # attach a 中文 version (cheap V4-Flash pass) per brief
  # rotation_thesis: "<override the macro lens's liquidity-rotation hypothesis>"
  # china_thesis: "<override the china lens's working thesis>"
  # btc_thesis:   "<override the btc lens's working liquidity thesis>"

# =============================================================================
# Catalyst stock — single-stock research BRIEF (LLM "Option 2"; engine/catalyst_stock.py).
# LEAF · DEFAULT-OFF · RESEARCH/CONTEXT-ONLY. The per-stock analogue of master_brain:
# assembles ONE ticker's PUBLIC context (cycle/ladder signal + technical state +
# cross-sectional factor z-scores + SEC-EDGAR fundamentals), adds an OPTIONAL
# DeepSeek V4 Flash news digest (reuses catalyst_tone wholesale; gated by
# catalyst_tone.enabled), then a DeepSeek V4 Pro reasoning pass ->
# {summary, drivers[], risks[], catalysts[], confidence}. NEVER feeds a score/signal/
# size; NO holdings/positions/watchlist are ever read or sent. The static site can't
# call the model on demand (no server-side key), so the pipeline PRECOMPUTES briefs
# for the watchlist's suggested tickers + the action-board standouts into
# site/stockbrief/<TICKER>.json (cached per ticker per day, ~$0.04 each). On-demand
# any-ticker needs a serverless proxy (Supabase Edge Function) — documented follow-up.
# Run on-demand: `python -m engine.catalyst_stock AAPL --force`.
# =============================================================================
catalyst_stock:
  enabled: true                   # MASTER SWITCH — nothing calls the model unless true
  api_key_env: DEEPSEEK_API_KEY   # credential read from env / .env (gitignored)
  llm_base_url: https://api.deepseek.com/anthropic   # DeepSeek Anthropic-compat endpoint
  llm_model: deepseek-v4-pro      # reasoning tier for the brief ($0.435/$0.87 per 1M tok)
  llm_min_confidence: medium      # (news leg uses catalyst_tone's own floor)
  max_tokens: 2000                # OUTPUT cap — the brief is a small JSON record
  news_enabled: true              # OPTIONAL Flash news digest (also needs catalyst_tone.enabled)
  news_window_days: 5             # GDELT lookback window for company headlines
  news_max_records: 8             # headlines fetched per ticker (keep small)
  precompute_max: 30              # hard cap on tickers briefed per build (cost guard)
  brief_cache_dir: data/catalyst/stockbrief_cache   # one brief cached per ticker per day

# =============================================================================
# Forex Vector — currency signal board (research/FOREX_DASHBOARD.md).
# A structural CLONE of the commodities section: same conviction()/factor_panel
# engine, same -100..+100 scale + STRONG/weak bands, same split-half calibration.
# Three FX-specific deviations: (1) DOLLAR-FIRST — a broad-dollar master tile,
# and every pair's per-pair signal is scored on the dollar-ORTHOGONALIZED
# residual so 8 USD pairs aren't one repeated dollar bet; (2) verdict headline is
# RISK-CONTEXT (UIP failure + carry crash skew), LONG/SHORT-base secondary;
# (3) pegs/intervention force HOLD. Every input is free/keyless. All signals are
# CONTEXT, not alpha — see LIMITATIONS.md.
# =============================================================================
forex:
  active: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD, USDMXN, USDBRL, USDCNH]  # full board (Phase 3)

  # pair -> orientation + data wiring.
  #   base       = the non-USD currency we score (LONG-base = long it vs USD)
  #   invert     = yahoo symbol quotes USD as BASE (USD/xxx); take 1/price for base-vs-USD
  #   short_rate = fx_rates_short column for the carry differential (US leg = fed_funds/DFF)
  #   long_rate  = fx_rates_long column (foreign 10y) for the rate-differential factor vs US10y
  #   reer       = fx_reer column (BIS real effective rate) for the value factor
  #   carry: context = no carry weight (no clean free front-end rate) — EM tiles
  #   fred_fallback (price) is used when the Yahoo series has too little history (USD/CNH)
  assets:
    EURUSD: {yahoo: "EURUSD=X", fred: DEXUSEU, cot: cot_euro_fx, archetype: major,           base: EUR, invert: false, short_rate: ez_short, long_rate: ez_10y, reer: reer_ez}
    USDJPY: {yahoo: "USDJPY=X", fred: DEXJPUS, cot: cot_yen,     archetype: haven-funder,     base: JPY, invert: true,  short_rate: jp_short, long_rate: jp_10y, reer: reer_jp, peg: {kind: intervention, watch: [150, 162]}}
    AUDUSD: {yahoo: "AUDUSD=X", fred: DEXUSAL, cot: cot_aussie,  archetype: commodity-dollar, base: AUD, invert: false, short_rate: au_short, long_rate: au_10y, reer: reer_au, commodity: ["HG=F", "GC=F"]}
    GBPUSD: {yahoo: "GBPUSD=X", fred: DEXUSUK, cot: cot_pound,   archetype: major,            base: GBP, invert: false, short_rate: gb_short, long_rate: gb_10y, reer: reer_gb}
    USDCAD: {yahoo: "USDCAD=X", fred: DEXCAUS, cot: cot_cad,     archetype: commodity-dollar, base: CAD, invert: true,  short_rate: ca_short, long_rate: ca_10y, reer: reer_ca, commodity: ["CL=F"]}
    USDCHF: {yahoo: "USDCHF=X", fred: DEXSZUS, cot: cot_swiss,   archetype: haven-funder,     base: CHF, invert: true,  short_rate: ch_short, long_rate: ch_10y, reer: reer_ch, peg: {kind: snb}}
    USDMXN: {yahoo: "USDMXN=X", fred: DEXMXUS, cot: cot_peso,    archetype: em,               base: MXN, invert: true,  carry: context, reer: reer_mx}
    USDBRL: {yahoo: "USDBRL=X", fred: DEXBZUS, cot: cot_real,    archetype: em,               base: BRL, invert: true,  carry: context, reer: reer_br}
    USDCNH: {yahoo: "CNH=F",    fred: DEXCHUS, cot: null,        archetype: em-managed,       base: CNH, invert: true,  carry: context, reer: reer_cn, peg: {kind: managed}, onshore: cny_onshore}

  drivers:                          # shared macro series: name -> [store-group, store-name]
    dxy:          [yahoo, "DX-Y.NYB"]   # US Dollar Index (1971->)
    broad_dollar: [fred, DTWEXBGS]      # broad trade-weighted USD (2006->)
    broad_afe:    [fred, DTWEXAFEGS]    # advanced-economies leg
    broad_eme:    [fred, DTWEXEMEGS]    # emerging-economies leg
    us_short:     [fred, DFF]           # US policy (fed funds) — carry US leg
    us2y:         [fred, DGS2]
    us10y:        [fred, DGS10]
    vix:          [fred, VIXCLS]
    hy_oas:       [fred, BAMLH0A0HYM2]
    em_oas:       [fred, BAMLEMCBPIOAS]
    nfci:         [fred, NFCI]
    copper:       [yahoo, "HG=F"]
    gold:         [yahoo, "GC=F"]
    oil:          [yahoo, "CL=F"]
    spy:          [yahoo, SPY]
    eem:          [hk, EEM]             # EM-equity risk proxy (already collected under hk)
    cny_onshore:  [fred, DEXCHUS]       # onshore USD/CNY — vs offshore CNH=F = the CNH basis

  cnh:                                  # offshore(CNH)-onshore(CNY) basis = China stress / capital-flow gauge
    stress_bps: 150                     # basis above this (offshore yuan weaker) = depreciation / outflow stress
    inflow_bps: -100                    # basis below this (offshore stronger) = inflow / risk-on
    pctile_lookback_d: 504

  dollar:                           # broad-dollar master tile + orthogonalization
    legs: {broad: broad_dollar, advanced: broad_afe, emerging: broad_eme, index: dxy}
    trend_window_d: 63              # ROC window for the dollar trend / smile read
    beta_window_d: 252             # rolling regression of each pair on the broad dollar
    beta_min_train_d: 252
    dollar_day_z: 1.0              # |broad-dollar daily z| above this = a "dollar day" ...
    dollar_day_haircut: 0.5       # ... shrink per-pair confidence by this (false-consensus guard)
    risk:                          # the dollar-smile risk composite (hk_global-style, no HKD peg)
      components: {vix: 1.0, hy_oas: 0.75, em_oas: 0.75, copper_gold: 1.0, spy: 1.0, eem: 0.75}
      z_lookback_d: 252

  momentum:                         # ported price vote-ensemble -> [-1,+1]
    smooth_days: 3
    rsi_bull: 55
    rsi_bear: 45
    votes: {ema_trend: 1.0, ema_cross: 1.0, macd_hist: 1.0, sma200: 1.0, roc20: 1.0, rsi_zone: 1.0}
    trigger: 0.5
    exit: 0.25
    confirm_days: 3

  structure:                        # structure-shift oscillator [-1,+1]
    swing_window_d: 20
    breakout_lookback_d: 60
    confirm_days: 3
    trigger: 0.5
    exit: 0.25

  trend:                            # 12-month time-series momentum (TSMOM)
    lookback_d: 252
    confirm_days: 5
    scale: 0.12                     # FX moves << commodities -> smaller scale (tanh(12m_ret/scale))

  risk:                             # saturating composite -> 0..100 (FX vol << commodities)
    threshold: 25
    exit_threshold: 15
    deadband: 0.10
    vol_window_d: 30
    vol_pctile_lookback_d: 1260
    drawdown_window_d: 90
    drawdown_full_stress: 0.12      # 12% drawdown = full stress (FX-scaled)
    weights: {vol_pctile: 1.0, drawdown: 1.0, momentum_deterioration: 0.75, positioning_stress: 0.5}
    oscillator_delta_d: 10
    oscillator_scale: 30

  carry:                            # rate-differential carry: foreign short rate - US (DFF)
    us_leg: us_short                # piecewise-constant policy rates => ffill correct, monthly OK
    carry_to_vol: true             # risk-adjust by trailing FX realized vol (penalize fragile carry)
    vol_window_d: 60
    smooth_days: 5
    pctile_lookback_d: 756
    scale: 3.0                      # |annualized rate diff %| / scale -> bounded carry score

  positioning:                      # COT spec extremes (contrarian), rolling percentile
    pctile_lookback_d: 756
    crowded_long_pctile: 0.85
    crowded_short_pctile: 0.15

  residual:                         # decoupling / exogenous-shock detector (intervention, geopolitics)
    return_window_d: 21
    drivers: [broad_dollar, us2y]   # default driver set; AUD/CAD add their commodity leg in-engine
    min_train_d: 504
    refit_every_d: 21
    z_lookback_d: 252
    shock_z: 1.5
    decoupling_corr_window_d: 252
    decoupling_corr_max: 0.2

  conviction:                       # band mapping + hysteresis (reuse commodity engine)
    bands: {strong: 60, weak: 20}   # |score| -> STRONG / weak / FLAT
    hysteresis_confirm_days: 5

  value:                            # REER mean-reversion (slow valuation anchor)
    gap_window_d: 1260              # ~5y rolling mean of log-REER (the long-run "fair" level)
    z_lookback_d: 1260
    pub_lag_d: 45                   # BIS REER is monthly + ~6wk lag -> shift before use (no look-ahead)

  rates:                            # 10y yield-differential momentum (relative monetary policy)
    diff_window_d: 63               # change in (foreign 10y - US 10y) over this window
    z_lookback_d: 252
    pub_lag_d: 45                   # foreign 10y (OECD monthly) is lagged -> shift before use

  calibration:
    start_date: "2004-01-01"        # Yahoo FX-major history is deep; EM shorter
    split_date: "2015-01-01"        # BOTH halves straddle a carry unwind (2008 | 2015 SNB,2020,2022,2024)
    forward_days: [21, 63, 126]
    exclude_peg_windows: true       # excise managed/intervention/SNB eras from weight calibration
    whipsaw_max_days: 10
    whipsaw_target_pct: 15
    cost_bps: 2                     # one-way transaction cost (spread) per unit |Δpos|; tight G10 spot majors (EM wider, but modeled conservatively at the same leg). Conviction-allocation Sharpe is NET of this
    n_trials: 60                    # honest UPPER-BOUND of factor×pair configs screened, for the Deflated Sharpe haircut — overestimate is conservative (de Prado); raise as you try more

  alerts:
    timeline_days: 60
    shock:                          # per-pair |move| % that flags an FX shock (lower vol than commods)
      enter_pct: {EURUSD: 1.5, USDJPY: 2.0, GBPUSD: 1.8, AUDUSD: 2.0, USDCAD: 1.5, USDCHF: 1.8, USDMXN: 3.0, USDBRL: 3.5, USDCNH: 1.2}

# -----------------------------------------------------------------------------
# Bitcoin Vector signal engine (Phase 2). Architecture reverse-engineered from
# Swissblock's published panels — see research/VECTOR_SIGNAL_RECON.md.
# Components are VOTE ENSEMBLES (mean of -1/0/+1 votes) and saturating
# composites; every band's forward-return record is measured by
# scripts/calibrate_vector.py and shipped to tooltips.
# -----------------------------------------------------------------------------
vector:
  momentum:                       # vote ensemble -> [-1,+1]; their ±0.5 = triggers
    smooth_days: 3
    rsi_bull: 55
    rsi_bear: 45
    votes:                        # name: weight (mean is weight-normalized)
      ema_trend: 1.0              # close vs EMA50 & EMA50 slope
      ema_cross: 1.0              # EMA20 vs EMA50
      macd_hist: 1.0
      sma200: 1.0
      roc20: 1.0
      rsi_zone: 1.0
      sopr_momentum: 1.0          # SOPR 7d EMA vs 1.0 (selling pressure)
      sth_cost_basis: 1.0         # close vs STH realized price (2022->)
    trigger: 0.5                  # enter bull/bear at ±trigger
    exit: 0.25                    # hysteresis: stay in state until score falls back past ±exit
    confirm_days: 3               # cross must hold N days before regime flip

  risk:                           # saturating composite -> 0..100, threshold 25
    threshold: 25                 # enter high-risk at 25
    exit_threshold: 15            # hysteresis: drop back to low-risk only below 15
    deadband: 0.10                # raw stress below this maps to 0 (their pin-at-zero)
    vol_window_d: 30
    vol_pctile_lookback_d: 730
    drawdown_window_d: 90
    drawdown_full_stress: 0.30    # dd >= 30% from 90d high -> stress 1.0
    sopr_ema_d: 7
    etf_flow_sum_d: 7
    weights:
      vol_pctile: 1.0
      drawdown: 1.0
      sopr_stress: 1.0            # SOPR<1 depth
      interday_ratio: 0.75        # interday vs intraday vol split (Key Risk Elements)
      momentum_deterioration: 0.75
      etf_outflow: 0.5            # 2024-> only
      funding_stress: 0.5
    oscillator_delta_d: 10        # Risk Oscillator = 0.5 + bounded d(risk)/dt
    oscillator_scale: 30          # risk pts per 10d that map to ±0.5

  bfi:                            # Bitcoin Fundamental Index, bands 40/60
    growth_mom_d: 30              # active-address momentum window
    growth_base_d: 365
    pctile_lookback_d: 730
    liq_components_sum_d: 30      # realized-cap delta, stablecoin delta, etf flows
    smooth_d: 14
    band_lo: 40
    band_hi: 60

  structure:                      # structure-shift oscillator [-1,+1]
    swing_window_d: 20
    breakout_lookback_d: 60
    confirm_days: 3
    trigger: 0.5
    exit: 0.25

  gauges:
    vol_low_pctile: 0.30          # below -> Low; above high -> High; between = Sweet spot
    vol_high_pctile: 0.75
    flow_low_pctile: 0.30
    flow_high_pctile: 0.75

  environment:
    bull_min_momentum: 0.0        # mid-term env = trend + momentum sign
    prob_lookback: all            # 7d/3d probabilities from full-history base rates
    scenario_atr_d: 14
    scenario_atr_mult: 1.5

  allocation:                     # strategy grids on (momentum, risk)
    variants:
      conservative: {mom_full: 0.6, risk_full: 15, mom_half: 0.5, risk_half: 25}
      moderate:     {mom_full: 0.5, risk_full: 25, mom_half: 0.0, risk_half: 40}
      aggressive:   {mom_full: 0.3, risk_full: 40, mom_half: -0.2, risk_half: 60}
      optimal:      {mom_full: 0.5, risk_full: 25, mom_half: 0.0, risk_half: 50}  # re-tuned by calibration sweep
    confirm_days: 2               # whipsaw guard on allocation changes
    # Tier-1b blend: fold the CALIBRATION-CONFIRMED deep-history valuation tails
    # into the (momentum, risk) grid as contrarian overrides. Gated — the
    # allocation backtest must not degrade (see reports/vector-calibration.md).
    use_valuation_overlay: true
    deep_value_z: 0.0            # MVRV-Z below this = accumulation FLOOR (>=0.5)
    deep_value_nupl: 0.0        # ...or NUPL below this (corroborating, collinear)
    overvalued_mayer: 2.4       # Mayer above this = distribution CAP (<=0.5)
    overvalued_rr: 0.02         # Reserve Risk above this = distribution CAP (calibrated TOP)
    # Point-4 — "size by conviction, cap risk" (was: conviction was a UI label only,
    # a thin TOSS-UP and a strong EDGE both sized 1.0). The grid above sets DIRECTION;
    # these scale SIZE. Code defaults match these values, so the keys are optional.
    conviction_sizing: true      # scale the grid alloc by a continuous conviction multiplier
    conviction_floor: 0.5        # a coin-flip (TOSS-UP) setup still sizes this fraction of the grid
    conviction_toss: 0.05        # directional-confidence edge (cycle_position-0.5) <= this = TOSS-UP -> floor
    conviction_edge: 0.30        # ...>= this = EDGE -> full grid size; linear LEAN ramp between
    drawdown_brake: true         # ENFORCE a position cap that tightens as strategy equity goes underwater
    dd_threshold: 0.25           # no brake until the strategy is >25% below its equity high-water mark
    dd_decay: 1.0                # cut the cap by this per unit of drawdown beyond the threshold
    dd_floor: 0.40               # never cap exposure below this fraction (keep a core position)
    # ^ tuned (sweep, reports/vector-calibration.md): conviction sizing is the value
    #   driver (lifts Sharpe/Sortino/DSR AND MaxDD); the brake is the costly safety
    #   leg, so it is GENTLE — keeps ~all of the conviction risk-adjusted gain while
    #   still cutting MaxDD ~5pp. Dial it harder (0.20/1.5/0.30) for more DD armor.

  ensemble:                       # fixed-form orthogonalized gate-passed ensemble (D-vec-ENSEMBLE)
    z_window_d: 365               # rolling z-score window for the band-map-oriented axes + the score
    beta_window_d: 252            # rolling-beta window for the causal orthogonalization (copied from forex; NOT tuned)
    beta_min_train_d: 252         # min bars before a residual beta is estimable (raw z until then)
    # The calibration promotion-gate (ensemble_promotion) tests whether this ensemble beats the
    # best single signal AND the hand-tuned composite_state on net Sharpe in BOTH halves. Current
    # verdict KEEP-HEURISTIC -> composite_state stays the headline; the ensemble is a transparency
    # card only. It is promoted to the live headline only if a future calibration sweeps all baselines.

  sizing:                         # conviction -> capped fractional-Kelly position size (D-vec-KELLY)
    kelly_frac: 0.5               # HALF-Kelly (full Kelly over-bets fat-tailed crypto; 0.25 = quarter)
    dd_budget: 0.25               # max tolerable 90d portfolio drawdown -> position capped so band p05 tail x size <= this
    pos_max: 1.0                  # never lever past 100% (sizing is for a long-only BTC sleeve)

  catalyst:                       # scheduled-binary (FOMC/jobs) event window (D-vec-CAT)
    imminent_days: 3              # a binary within this many days = "don't size into it" gate on the Kelly read

  cme_basis:                      # CME (regulated) futures carry — POSITIONING CONTEXT (D-vec-CME; measured ~0 forward edge)
    ann_mult: 12                  # front-month basis -> ~annualized (approx; continuous future, ~1mo to expiry)
    pctile_lookback_d: 365        # 1y percentile of the basis
    froth_pct: 0.7                # basis above this % = rich contango (leverage froth)
    stress_pct: -0.2              # below this = backwardation (stress / forced de-risk)

  btc_vs_alts:
    rs_window_d: 30               # relative-strength window across BTC/ETH/alts
    confirm_days: 3

  tactical:
    efficiency_window_d: 30       # |net move| / sum(|daily moves|): high = trending
    strategic_min_efficiency: 0.35
    strategic_max_risk: 40

  # --- Tier-1 accuracy upgrade (research/VECTOR_ACCURACY_UPGRADE.md) ---------
  # New STANDALONE axes — measured before being blended into the composites.
  valuation:                      # MVRV-Z / NUPL valuation axis (2010-> depth)
    z_window_d: 1460              # rolling std window for MVRV-Z (4y ~ one cycle;
                                  # ETF-era responsive vs. an expanding all-history std)
    z_min_periods_d: 365
    z_over: 3.5                   # enter "overvalued"
    z_over_exit: 2.0              # leave overvalued only back below this
    z_under: 0.0                  # enter "undervalued"
    z_under_exit: 0.8             # leave undervalued only back above this
    pctile_lookback_d: 1460
    reserve_risk_pctile_lookback_d: 1460   # Reserve Risk percentile (checkonchain 2010->)
    nupl_euphoria: 0.65           # NUPL bands (Glassnode-style)
    nupl_capitulation: 0.0

  miner:                          # hash ribbons + Puell (2010-> depth)
    hash_fast_d: 30
    hash_slow_d: 60
    puell_window_d: 365
    puell_min_periods_d: 180
    puell_low: 0.5                # <- miner capitulation / bottoming zone
    puell_high: 4.0              #  -> miner euphoria / topping zone

  cost_basis:
    mayer_window_d: 200           # Mayer Multiple = close / SMA200
    sth_ffill_limit_d: 5

  extreme:                        # contrarian capitulation/euphoria overlay (votes)
    sip_capitulation: 0.50        # supply-in-profit FRACTION (in_profit / supply)
    sip_euphoria: 0.95
    fg_capitulation: 25           # Fear & Greed index
    fg_euphoria: 80
    min_votes: 2                  # >=N agreeing sub-signals to flag the extreme

  options:                        # Deribit options-structure layer (Tier-2)
    # DVOL + VRP are calibratable (DVOL history 2021->); the per-strike structure
    # snapshot (skew/term/maxpain/GEX) accumulates forward = context until depth.
    dvol_pctile_lookback_d: 730
    dvol_low_pctile: 0.25         # complacency band
    dvol_high_pctile: 0.80        # fear/elevated band
    rv_window_d: 30               # realized vol window matched to DVOL's 30d horizon
    vrp_smooth_d: 5               # VRP = DVOL - realized vol, smoothed
    rv_cone_lookback_d: 1095      # ~3y percentile window for the realized-vol CONE + vol-of-vol (full-history, both-halves-clean; D-vec-RVCONE)

  leverage:                       # leverage/liquidation layer (Tier-2, ~2yr depth)
    # aggregate OI summed over consistently-present major venues (bgeo gives 15;
    # the bundled aggregate col goes NaN, so we sum a fixed core basket ourselves)
    oi_venues: [open_interest_futures_binance, open_interest_futures_bybit,
                open_interest_futures_okx, open_interest_futures_bitget,
                open_interest_futures_deribit, open_interest_futures_bitmex,
                open_interest_futures_gateIo, open_interest_futures_kucoin,
                open_interest_futures_huobi]
    pctile_lookback_d: 730
    change_window_d: 14           # OI / price change horizon for the divergence
    funding_z_window_d: 180       # funding extremity window
    # OKX rubik retail chips (DISPLAY-ONLY) — rubik history is shallow (~180d) so
    # the rolling windows are short; read via cfg.get(default) so a drift is safe
    okx_pctile_lookback_d: 180
    okx_z_window_d: 90
    stress_oi_pctile_w: 1.0       # leverage_stress = weighted mean of scaled parts
    stress_funding_w: 1.0
    stress_oi_rise_w: 0.5

  macro:                          # Tier-3 macro liquidity / risk-appetite overlay
    # net liquidity = WALCL - RRP - TGA ($bn, D10 normalization); BTC tracks its
    # RATE OF CHANGE (~months lead) more than its level. Deep history (BTC 2014->)
    # so this can be a real strategic signal, not just confirmation.
    netliq_roc_window_d: 91       # 13-week rate of change
    netliq_roc_scale: 0.03        # tanh scale for the liquidity driver
    yield_chg_window_d: 63        # ~quarter real-yield change
    yield_chg_scale: 0.4          # tanh scale (real yield in %; 0.4 = 40bp)
    dxy_roc_window_d: 63
    dxy_roc_scale: 0.04
    pctile_lookback_d: 1460       # credit/vix percentile window (~4y)
    weights:                      # macro_score = weighted mean, + = BTC tailwind
      liquidity: 1.0
      real_yield: 0.8
      credit: 0.8
      vix: 0.6
      dxy: 0.6
    enter: 0.2                    # macro_regime hysteresis: Tailwind/Headwind
    exit: 0.1

  onchain:                        # CryptoQuant-style on-chain regime (reproduced free)
    premium_smooth_d: 7           # Coinbase Premium = US institutional-demand proxy
    ssr_window_d: 365             # SSR oscillator z-score window (stablecoin dry powder)
    mpi_window_d: 365             # Miner Position Index = miner outflow USD / 365d MA
    mpi_min_periods_d: 120

  etf_flow:                       # US spot-ETF net flows (Swissblock #9; bgeo/Glassnode, 2024->)
    smooth_d: 5                   # rolling-sum window = the weekly flow regime
    min_periods_d: 3
    z_window_d: 90                # extremity z-score trailing window (vs recent norm)
    z_min_periods_d: 30
    state_enter_z: 0.6            # accumulation/distribution hysteresis on the flow z
    state_exit_z: 0.2

  impulse:                        # Glassnode/Swissblock-style IMPULSE: z-scored
    # ACCELERATION of momentum (2nd derivative via MACD-histogram), gated for
    # chop by the Kaufman efficiency ratio, fused with a positioning impulse
    # (funding+OI shock). Spots the START/exhaustion of moves, not the level.
    accel_z_window_d: 90          # z-score window for the MACD-histogram (acceleration)
    er_window_d: 10               # Kaufman efficiency ratio window (chop gate, 0..1)
    pos_z_window_d: 60            # z-score window for funding/OI deltas
    accel_w: 0.65                 # weight on the price-acceleration core
    pos_w: 0.35                   # weight on the positioning impulse (when available)
    extreme: 1.0                  # |impulse| beyond this = a strong thrust/exhaustion
    participation_window_d: 14    # rolling % of positive-impulse days = breadth proxy

  composite:                      # headline market-state synthesis thresholds
    reserve_risk_top: 0.02        # reserve_risk above this = distribution (calibrated TOP)
    bfi_strong: 60                # BFI above this = fundamentals confirm risk-on
    cot_crowded_z: 1.5            # CME spec net-long z above this = crowded (contrarian top)
    funding_capitulation_z: -1.0  # funding z below this = crowded shorts (capitulation context, display-only tag)

  scenarios:                      # short-term scenario probabilities (build_vector)
    prob_horizon_d: 7             # forward horizon for the conditional base rate
    prob_shrink_alpha: 10         # empirical-Bayes shrinkage toward the momentum marginal
    prob_min_cell_n: 20           # below this, fall back to the marginal + label it
    prob_floor: 0.30              # cap probabilities to [floor, ceil] (anti-overfit)
    prob_ceil: 0.70
    macro_tilt_pp: 5              # macro tailwind/headwind nudges the prob +/- this (pp)
    cycle_tilt_pp: 5             # halving-phase prior: accumulation +, markdown - (pp)
    atr_dvol_ref: 55              # DVOL ~= this -> ATR bands unscaled; higher widens them
    conv_band_pp: [3, 7]          # conviction cuts (pp from 50%): TOSS-UP <=3, LEAN <=7, EDGE >7.
                                  # Calibrated to the MEASURED reliable-cell up-rate spread
                                  # (51.9-57.1% at 7d, n>300) so ~3pp from 50 = an honest coin-flip,
                                  # not a confident call. EDGE also needs n>=300 + verdict + tape
                                  # corroboration (see _conviction in build_vector.py; D-vec-CONV).

  # --- New-factor hunt (research/VECTOR_NEW_FACTORS.md): three orthogonal axes
  # the model lacked — time/cycle, positioning, cross-asset co-movement. ---------
  cycle_clock:                    # halving-phase time prior (deterministic, FREE)
    halving_dates: ["2012-11-28", "2016-07-09", "2020-05-11", "2024-04-20"]
    cycle_len_d: 1458             # ~4y; cycle_pct = days_since_halving / this
    # phase boundaries in cycle_pct (tops cluster ~0.27-0.38 historically, n=3)
    accumulation_end: 0.22
    markup_end: 0.42
    markdown_end: 0.70

  positioning:                    # CME COT net-spec (already collected, now wired)
    z_window_d: 730               # ~2y z-score of net_spec_pct_oi (crowding extremes)
    ffill_limit_d: 10             # weekly report -> carry forward

  cross_asset:                    # BTC rolling correlation regime (2nd-moment, FREE)
    corr_window_d: 90             # rolling Pearson window of daily returns
    pctile_lookback_d: 730
    coupled_thresh: 0.45          # BTC-SPX corr above this = risk-asset coupling
    decoupled_thresh: 0.0         # below this = decoupled / diversifier regime

  global_liquidity:               # US + China M2 growth impulse (the broad-money read
    # our Fed-balance-sheet net-liquidity lacks; EZ/JP/UK FRED M2 are discontinued,
    # so US+China = the two largest LIVE blocs). Money supply leads BTC ~10wk.
    us_weight: 0.4                # US vs China weight (China M2 ~60% larger in USD)
    accel_window_d: 90            # 3-month change of the YoY impulse
    expanding_thresh: 5.0         # global M2 YoY above this = liquidity tailwind
    stbl_growth_window_d: 30      # stablecoin supply growth window (the crypto-native liquidity TIDE; D-vec-STBL)
    stbl_z_lookback_d: 365        # de-trend window for the stablecoin growth z-score (2017 hyper-growth vs 2024 base comparable)

  alt_cycle:                      # altcoin-cycle / ETH allocation (allocation page)
    btc_season_line: 0.05         # ETH/BTC below = deep BTC-season
    alt_season_line: 0.07         # ETH/BTC above = alt-season confirmed
    ethbtc_ma_d: 350              # ~50-week ETH/BTC moving average
    slope_window_d: 56            # 8-week ETH/BTC slope
    pctile_lookback_d: 1095       # 3y ETH/BTC percentile
    btc_season_max: 25            # alt-season score <25 = BTC season
    alt_season_min: 75            # >75 = alt season
    soleth_ma_d: 100              # ~14-week SOL/ETH moving average (high-beta rotation)
    soleth_slope_d: 56            # 8-week SOL/ETH slope
    soleth_pctile_d: 730          # 2y SOL/ETH percentile (SOL-USD ~2020->)

  calibration:
    start_date: "2015-01-01"      # price-signal backtests (Yahoo BTC 2014-09->)
    split_date: "2021-01-01"      # split-half robustness boundary
    forward_days: [7, 30, 90]
    whipsaw_max_days: 7
    whipsaw_target_pct: 15
    cost_bps: 10                  # one-way transaction cost (spread+fee) per unit |Δpos|; allocation backtest CAGR/Sharpe are NET of this
    n_trials: 65                  # honest UPPER-BOUND of independent strategy configs explored, for the Deflated Sharpe haircut — overestimate is conservative (de Prado); raise as you try more. +15 for the Point-4 conviction/brake sweep.
    cv_folds: 5                   # purged + embargoed walk-forward folds (embargo = max forward horizon) — the leak-free robustness gate complementing split_date (D-vec-GATES)

  # --- GBT meta-label leaf (engine/meta_label.py; scripts/meta_label_btc.py) ---
  # DEFAULT-OFF. A secondary HistGradientBoostingClassifier learns P(the primary
  # allocation call is correct) over `horizon` days from context features, used to
  # FILTER/SIZE — never direction. Fenced to this high-N layer (~3000 long calls)
  # because GBT overfits on the ~10-episode macro layer. NOT wired into the live
  # allocation: `enabled` must be flipped by a human only AFTER it proves out.
  meta_label:
    enabled: false                # leaf stays out of compute_all / the live grid
    primary_variant: optimal      # which alloc_<variant> grid sets the SIDE
    horizon: 30                   # forward label horizon (days) == the CV embargo
    barrier_mult: 1.0             # triple-barrier width = mult · trailing σ · √horizon
    vol_window: 30                # trailing window for the barrier vol (no look-ahead)
    cv_folds: 6                   # purged + embargoed folds (reuses validation.purged_folds)
    min_test_events: 20
    min_train_events: 150
    cost_bps: 10                  # one-way cost per unit |Δpos|; meta CAGR/Sharpe are NET of this
    start_date: "2015-01-01"
    min_sharpe_gain: 0.05         # verdict: meta must add ≥ this to the net Sharpe
    maxdd_tolerance_pp: 2.0       # ...and not worsen MaxDD by more than this
    dsr_floor: 0.90               # ...and clear this Deflated-Sharpe haircut

  # Alerts (Phase 3). Vector severity high|medium|info. Flash-crash thresholds
  # provisional (calibrated against known episodes; see research/VECTOR_ALERTS_DESIGN.md).
  alerts:
    timeline_days: 45               # detailed timeline window on vector.html
    flash:
      vol_window_h: 72              # trailing hourly realized-vol window
      drop_window_h: 6              # acute-drop measurement window
      # Genuine flash crashes are ACUTE drops (covid -40%, FTX -20%, Aug-2024
      # -15%) — absolute floors, not sigma alone (crypto fat tails make 3-sigma
      # 6h moves routine, which produced 800 false events). Enter needs a
      # statistical shock AND a real drop, or a big 24h fall outright.
      enter_sigma: 3.5              # 6h move this many sigma...
      enter_6h_pct: -7.0            # ...AND below this absolute 6h return %
      enter_24h_pct: -12.0          # OR a big 24h drop on its own
      tail_24h_pct: -18.0           # flash_crash -> tail_risk_event
      stabilize_quiet_h: 12         # hours without a new 24h low -> stabilizing_price
      normal_quiet_h: 48            # quiet hours -> back to normal
      impulse_window_h: 48          # EMA-of-returns horizon for the Impulse sign
    risk_extreme_days: 14           # risk_index >= threshold this many days -> capitulation watch
    risk_extreme_level: 50

# =============================================================================
# Bonds & bond-health dashboard (research/BOND_HEALTH_DASHBOARD.md)
# A health-first read of the bond market: what the curve, credit, real rates,
# rates-vol and funding plumbing say about economic health, regime and cycle.
# Reuses the shared macro feature frame (engine.inputs.build_features) + the
# already-validated conditions layer (recession_risk, drawdown_risk,
# stock_bond_corr). Thresholds are documented practitioner levels, NOT tuned to a
# backtest; the composite health score is a TRANSPARENT prior pending calibration
# (scripts/calibrate_bonds.py, Phase 4).
# =============================================================================
bonds:
  curve:
    nyfed_a: -0.5333              # NY Fed recession probit intercept (Estrella-Mishkin)
    nyfed_b: -0.6629             # ...slope on the 10y-3m spread (pp); P=Phi(a+b*spread)
    move_window_d: 21            # ~1mo window for the curve-move (bull/bear x steep/flat) taxonomy
    uninvert_lookback_d: 252     # was the curve inverted in the last ~1y, now positive? (un-inversion alarm)
    ntfs_tenors: [0.25, 0.5, 1, 2, 3, 5, 7, 10, 30]   # interpolation nodes (years) for the near-term forward
  credit:
    # HY OAS distress bands (%, 100bp = 1.0): the canary. <3 tight, 3-5 normal,
    # 5-8 elevated, >8 distress (>10 crisis — hit in 2000/2008/2020).
    hy_tight: 3.0
    hy_elevated: 5.0
    hy_distress: 8.0
    hy_crisis: 10.0
    widening_window_d: 20        # OAS change window for the credit-direction read
    pctile_lookback_d: 1260      # ~5y percentile context for OAS / baa-aaa
  rates_vol:
    # MOVE bands (the "VIX of bonds"). Post-2022 MOVE runs structurally higher.
    move_calm: 80
    move_elevated: 120
    move_crisis: 150
    z_window_d: 252
  plumbing:
    sofr_iorb_stress_bp: 5       # SOFR-IORB drifting > this (bp) above => reserve scarcity
    repo_spike_bp: 20            # SOFR99-SOFR > this (bp) => repo-stress spike
  cycle:                         # curve x credit four-box clock (mirrors engine.cycle thresholds)
    curve_level: 0.0             # 10y-3m below this => outright inverted
    flat_level: 1.0              # 10y-3m below this (~historical median) => flat/late-leaning
    oas_lookback_d: 504          # 2y window for the HY OAS percentile
    oas_low_third: 0.33
    oas_high_third: 0.67
  health:                        # composite 0..100 (higher = healthier). TRANSPARENT prior.
    # Built from the already-MEASURED recession_risk + drawdown_risk gauges plus
    # the credit / rates-vol stress reads. Each leg contributes a 0..100 STRESS
    # value; health = 100 - weighted-mean(stress legs over available).
    weights: {recession: 1.0, drawdown: 1.0, credit: 0.8, rates_vol: 0.6, plumbing: 0.4}
    healthy_score: 67            # >= => "healthy"
    stressed_score: 40           # <  => "stressed" (between => "mixed")
  calibration:
    split_date: "2013-01-01"      # split-half boundary for the discriminative drawdown IC
  sovereign:                   # euro all-AAA 10y FRAGMENTATION spread bands (pp); JGB 2s10s
    frag_elevated: 0.5         # ALL-minus-AAA 10y above this => elevated periphery stress
    frag_stress: 1.0           # ...above this => fragmentation stress
  alerts:
    timeline_days: 120             # durable (debounced) state-changes are sparse; show ~4mo

# =============================================================================
# Foreign sovereign yields (Bonds dashboard Phase 5) — ECB euro-area curve +
# Japan MoF JGB. The euro ALL-minus-AAA 10y spread is a free daily BTP-Bund-
# style fragmentation proxy; JGB 2s10s tracks post-YCC normalization.
# =============================================================================
sovereign:
  retries: 3
  ecb_url: https://data-api.ecb.europa.eu/service/data/YC
  ecb_series:                      # name -> ECB YC key (G_N_A = AAA-rated; G_N_C = all govt)
    ez_aaa_2y:  B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y
    ez_aaa_10y: B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y
    ez_all_10y: B.U2.EUR.4F.G_N_C.SV_C_YM.SR_10Y
  mof_url: https://www.mof.go.jp/jgbs/reference/interest_rate/data/jgbcm_all.csv
  jgb_tenors:                      # name -> Japanese column header in jgbcm_all.csv
    jgb_2y: "2年"
    jgb_10y: "10年"

# Home landing hub — combined alert feed from both dashboards
home:
  alerts:
    macro_feed: data/alerts/alerts_log.parquet     # engine/alerts.py output
    vector_feed: data/vector/alerts.jsonl
    macro_major_severities: [act, warn]            # homepage shows these macro tiers (skip info)
    macro_exclude_rules: [circuit_breaker_open]     # operational noise, not a market signal
    vector_major_severities: [high, medium]        # homepage shows these vector tiers
    commodity_feed: data/commodity/alerts.jsonl
    commodity_major_severities: [high]             # homepage shows commodity high-tier (shock/risk) only — medium is noisier
    max_items: 12
    dedup_window_days: 5                            # collapse identical headlines within N days
    macro_label: "Macro Vector"                    # renamed from "Macro Dashboard"

