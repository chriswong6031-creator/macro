      "510500.SS": CSI 500
      "159915.SZ": ChiNext
      "588000.SS": STAR 50
    fx:
      "CNY=X": USDCNY
    sector_etfs:                    # ticker: [plain name, representative-constituent TradingView symbol]
      "512800.SS": [Banks, "SSE:601398"]
      "512880.SS": [Securities & Brokers, "SSE:600030"]
      "512690.SS": [Baijiu & Liquor, "SSE:600519"]
      "159928.SZ": [Consumer Staples, "SSE:600887"]
      "512170.SS": [Healthcare, "SSE:600276"]
      "159992.SZ": [Innovative Drugs, "SZSE:300760"]
      "512760.SS": [Semiconductors, "SSE:688981"]
      "515000.SS": [Technology, "SZSE:002230"]
      "515030.SS": [New-Energy Vehicle, "SZSE:300750"]
      "515790.SS": [Solar & Photovoltaic, "SSE:601012"]
      "512660.SS": [Defense & Military, "SSE:600760"]
      "512400.SS": [Nonferrous Metals, "SSE:601899"]
      "515220.SS": [Coal, "SSE:601088"]
      "512200.SS": [Real Estate, "SSE:600048"]
      "515250.SS": [Automobiles, "SZSE:002594"]
      "512980.SS": [Media, "SZSE:002027"]

  # -- Plane B: macro via Eastmoney datacenter JSON (group=china_macro) --------
  # Report-name -> column parsing lives in collectors/china_macro.py (logic, not
  # a tunable); this list toggles which series the collector attempts. Each
  # degrades independently (circuit breaker), and history is archived forever.
  macro:
    base_url: https://datacenter-web.eastmoney.com/api/data/v1/get
    referer: https://data.eastmoney.com/
    retries: 3
    page_size: 600                  # monthly series ~ <300 rows of history
    enabled: [pmi, cpi, ppi, money_supply, lpr, indpro, rmb_loan, fai, retail, customs, rrr]  # social_financing now via china_credit (mofcom legacy-SSL); bond_yield deferred (chinabond)
  hsgt:                             # Stock Connect daily flows — Eastmoney datacenter RPT_MUTUAL_DEAL_HISTORY
    # Replaces the dead push2his kamt.kline path (its northbound legs emit a constant synthetic
    # placeholder — +8.4M RMB/day — since the 2024-08-16 regulatory curtailment). Southbound NET is
    # fully live; northbound NET froze 2024-08-16 (turnover stays live, pre-freeze NET kept for history).
    url: https://datacenter-web.eastmoney.com/api/data/v1/get
    retries: 3
    page_size_full: 2000            # full backfill paginates (API caps each page at 2000 rows) back to 2014-11-17
    page_size_recent: 90            # incremental run: trailing ~quarter of trading days (single page)
    mutual_type:                    # combined legs (沪深港通合计)
      southbound: "006"             # mainland -> HK (港股通): live net / turnover / holdings
      northbound: "005"             # foreign -> A-shares (陆股通): turnover live, NET frozen 2024-08-16

  # -- Breadth / drill-down universe: curated large-cap A-shares by sector -----
  # Doubles as breadth denominator + per-sector drill-down holdings + stock-search
  # seed. ~6-8 blue chips/sector; bad/delisted tickers are dropped at collect time
  # (coverage is logged). This is a large-cap (CSI300-style) breadth gauge.
  constituents:
    Banks: ["601398.SS","601288.SS","601939.SS","601988.SS","600036.SS","601166.SS","600000.SS","000001.SZ"]
    Securities & Brokers: ["600030.SS","601995.SS","601688.SS","600999.SS","601211.SS","000776.SZ"]
    Baijiu & Liquor: ["600519.SS","000858.SZ","000568.SZ","600809.SS","002304.SZ","000799.SZ"]
    Consumer Staples: ["600887.SS","603288.SS","000895.SZ","600600.SS","603899.SS"]
    Healthcare: ["600276.SS","300760.SZ","603259.SS","000538.SZ","600196.SS","002821.SZ"]
    Semiconductors: ["688981.SS","603986.SS","002371.SZ","688012.SS","603501.SS","688041.SS"]
    Technology: ["002230.SZ","000725.SZ","002415.SZ","002475.SZ","300059.SZ","600588.SS"]
    New-Energy Vehicle: ["300750.SZ","002594.SZ","300014.SZ","002460.SZ","600884.SS"]
    Solar & Photovoltaic: ["601012.SS","300274.SZ","002129.SZ","688599.SS","002459.SZ"]
    Defense & Military: ["600760.SS","000768.SZ","600893.SS","002179.SZ","600038.SS"]
    Nonferrous Metals: ["601899.SS","603993.SS","600547.SS","000831.SZ","600111.SS"]
    Coal: ["601088.SS","600188.SS","601225.SS","000983.SZ","601898.SS"]
    Real Estate: ["600048.SS","000002.SZ","001979.SZ","600606.SS","000069.SZ"]
    Automobiles: ["600104.SS","601238.SS","000625.SZ","600660.SS","601633.SS"]
    Media: ["002027.SZ","300413.SZ","002624.SZ","300033.SZ"]

  breadth:
    lookback_days_live: 1100        # ~3y for 200DMA/NH-NL + cycle analysis on the search library
    ma_windows: [50, 200]
    nhnl_window: 252
    min_coverage: 0.6               # fail the run if < this fraction of curated names resolve

  # -- A-share search universe (collectors/china_universe.py) ------------------
  # DECOUPLED from `constituents` (the curated large-cap BREADTH/calibration gauge)
  # so importing hundreds of searchable names never perturbs the calibrated regime
  # engine. Mirrors the US design (breadth = S&P 500; search = + S&P 400/600 caches).
  # Universe = top-N mainland A-shares by market cap from Sina's market-center feed
  # (Chinese names included, verified 2026-06-13); English names + sectors are
  # enriched once via yfinance get_info and cached. Closes come from yfinance (3y+,
  # like breadth). Powers ONLY the search library (site/chinastockdata/), not
  # breadth/quad. data/china_search/{closes,members}.parquet are committed (small)
  # so the engine CI job has them via git pull — no fragile cross-job actions/cache.
  search_universe:
    enabled: true
    size: 800                       # top-N A-shares by market cap -> searchable
    min_mktcap_yi: 30               # liquidity floor (亿 RMB total market cap)
    history_period: "5y"            # yfinance close history per name (engine needs >=300 rows)
    enrich_per_run: 120             # max NEW yfinance get_info name/sector lookups per nightly run
    sina:
      url: https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeData
      node: hs_a                    # Hu-Shen A-share board (Shanghai + Shenzhen; excludes Beijing)
      page_size: 80                 # Sina max rows/page
      referer: https://finance.sina.com.cn/

  # -- Engine tunables (mirror of `engine:`, China inputs) ---------------------
  engine:
    scoring: {slope_window: 20, baseline_window: 60, z_threshold: 0.45, min_components: 2}
    growth_axis:
      # weights tuned 2026-06-13 by split-half forward-return discrimination
      # (scripts/calibrate_china.py diagnostic): components whose return relationship
      # FLIPS sign across sub-periods are demoted; stable ones kept at full weight.
      components:
        pmi_mfg: {weight: 1.0}            # NBS manufacturing PMI vs 50 — stable contrarian
        pmi_nonmfg: {weight: 0.5}         # rarely <50 pre-2016 (can't fully validate) -> half
        indpro_trend: {weight: 0.25}      # FLIPS (+0.96 pre / -3.60 post) -> demoted from 0.75
        cyclical_defensive: {weight: 1.0} # stable contrarian (post-2019 only)
        smallcap_largecap: {weight: 0.25} # FLIPS / ~0 edge -> demoted from 1.0
        breadth_direction: {weight: 0.5}  # ~0 measured edge + short history -> demoted from 1.0
      cyclical_basket: ["512880.SS","512400.SS","515250.SS","512200.SS","515030.SS"]
      defensive_basket: ["512800.SS","159928.SZ","512170.SS"]
    inflation_axis:
      components:
        cpi_direction: {weight: 1.0}      # stable (-3.5 pre / -1.1 post)
        ppi_direction: {weight: 1.5}      # STRONGEST + most stable signal (-14.3 / -2.1) -> upweighted
        inflation_beta_basket: {weight: 0.25}  # FLIPS (-2.0 / +1.2) -> demoted from 1.0
      inflation_long_basket: ["512400.SS","515220.SS"]   # nonferrous + coal
      inflation_short_basket: ["512760.SS","515000.SS"]  # semis + tech
    liquidity:
      components:
        m2_growth: {weight: 1.0}          # M2 YoY direction
        lpr_easing: {weight: 1.0}         # falling LPR -> expanding
      roc_window_d: 20
    quad:
      hysteresis_days: 7
      shock_override_z: 0.85
    cycle:
      index_near_high_pct: 3.0
      high_window_d: 60
    sector_preferences:                   # framework-preferred China sectors per quad
      Goldilocks:  ["512760.SS","515000.SS","512690.SS","515250.SS"]   # growth+ infl-: tech/semis/consumer
      Reflation:   ["512400.SS","515220.SS","512880.SS","512200.SS"]   # growth+ infl+: commodities/brokers/property
      Stagflation: ["512400.SS","515220.SS","512800.SS","159928.SZ"]   # growth- infl+: materials/banks/staples
      Growth-scare: ["512800.SS","159928.SZ","512170.SS"]              # growth- infl-: banks/staples/healthcare
    rs_ranking:
      benchmark: "510300.SS"
      momentum_windows: [20, 60]
      trend_window: 200
      percentile_lookback_d: 252
    calibration:
      start_date: "2005-01-01"
      split_date: "2016-01-01"            # split-half robustness boundary
      forward_days: [21, 63]
      ladder_fwd: 21                       # forward window for the ladder walk
      ladder_step: 10                      # walk every N days (10 keeps CI lean; per-state n still ample)

# ============================================================================
# Section 4 — Hong Kong / Hang Seng dashboard.  Full clone of the US/China
# regime dashboard, re-thought for HK: see research/HK_DATA_AUDIT.md.
# HK is ~2x more globally sensitive than the Mainland, so the engine has THREE
# legs — China fundamentals (reused china_macro), a PRIMARY global-risk overlay,
# and HK-internal price structure (H-share leadership, HS-TECH tilt, breadth).
# Sectors are DEEP synthetic baskets of curated constituents (15-25y history),
# not the thin HK sector-ETF complex.
# ============================================================================
hk:
  # -- Plane A: prices (group=hk) ---------------------------------------------
  yahoo:
    retries: 3
    backoff_base_s: 5
    batch_size: 60
    benchmark: "^HSI"               # Hang Seng Index — sector-RS benchmark + market anchor (1986->)
    market_index: "^HSI"            # deep-history ladder-calibration anchor
    indices:                        # ticker: display name
      "^HSI": Hang Seng Index
      "^HSCE": HSCEI (H-shares)
      "^HSCC": HS China-Affiliated
    tech_proxy: "3033.HK"           # HS TECH proxy (^HSTECH not on Yahoo): CSOP HS TECH ETF (2020->)
    etf_proxies:                    # ticker: display name (search/reference)
      "3033.HK": HS TECH ETF
      "2800.HK": Tracker Fund (HSI)
    fx:
      "HKD=X": USDHKD               # peg-distance capital-flow gauge (7.75 strong <-> 7.85 weak)
    extras:                         # collected into the `hk` group but not treated as searchable indices
      "EEM": MSCI EM ETF            # global-risk factor (EM equity)
      "^HSIL": HSI Volatility (VHSI)  # HK's native VIX (HSI 30-day implied vol; ^VHSI not on Yahoo)

  # -- Sectors = deep synthetic baskets of curated constituents ---------------
