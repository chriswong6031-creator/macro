# FINRA consolidated short interest (Phase 3 of the four-phase build-out). Free,
# keyless FINRA Query API — bi-monthly exchange-listed short interest + days-to-
# cover. Feeds a short_interest factor (high days-to-cover negatively predicts
# the cross-section — Hong-Li-Rajan-Sherman). Fetched from build_factors.
finra:
  url: https://api.finra.org/data/group/otcMarket/name/consolidatedShortInterest
  user_agent: "macro-dashboard research (personal; contact via repo issues)"
  page_size: 5000               # FINRA caps a single response at 5000 rows
  max_pages: 8                  # ~40k rows covers a full settlement snapshot
  lookback_dates: 8             # candidate settlement dates to probe (newest-first)

# SEC Form-4 insider transactions (Phase 4 of the four-phase build-out). The SEC
# "Insider Transactions Data Sets" ship one zip per quarter (TSV: SUBMISSION +
# NONDERIV_TRANS) covering EVERY Form 3/4/5 — so a single download aggregates net
# OPEN-MARKET insider buying/selling per issuer. Surfaced as an "insider activity"
# panel on the factors page (latest COMPLETED quarter — the bulk set is published
# quarterly, so it is a slow conviction read, not real-time). Fetched from build_factors.
sec_insider:
  zip_url: https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/{q}_form345.zip
  # SEC's WAF 403s any User-Agent containing 'github.com' (scraper heuristic) and
  # rejects non-contactable addresses, so the committed default is an example.com
  # placeholder that passes. SEC fair-access asks for a REAL contact — set
  # SEC_CONTACT_EMAIL in .env (gitignored) to override without leaking it publicly.
  user_agent: "Macro Dashboard Research admin@example.com"
  retries: 3
  lookback_quarters: 5          # probe the current quarter, then walk back to the latest published
  open_market_codes: [P, S]     # P = open-market purchase, S = open-market sale (exclude grants/exercises)
  min_trade_usd: 10000          # ignore de-minimis transactions
  panel_top_n: 20               # rows on the insider buying/selling leaderboards
  panel_start: 2006q1           # Phase-0 PIT panel backfill start (earliest structured form345 set)
  panel_window_months: 6        # trailing window for the size-normalised leaderboard (validated construction)

# =============================================================================
# EIA petroleum supply (Phase 2 of the four-phase build-out). The single biggest
# missing oil supply-shock driver per COMMODITY_DATA_AUDIT. EIA's keyless dnav
# "Download Series History" .xls endpoints (hist_xls/{ID}w.xls) — no API key —
# give weekly U.S. crude/gasoline/distillate stocks, Cushing, production and
# refinery utilization back to the 1980s/90s. Surfaced as a SUPPLY read on the
# oil page in the Commodity Vector (stocks vs 5y range, production trend).
# =============================================================================
eia:
  hist_xls_url: https://www.eia.gov/dnav/pet/hist_xls/{id}w.xls
  user_agent: "Mozilla/5.0 (macro-dashboard research)"
  retries: 3
  series:                          # column_name -> EIA dnav series id
    crude_stocks: WCESTUS1         # crude oil ending stocks excl SPR (kbbl)
    cushing_stocks: W_EPC0_SAX_YCUOK_MBBL   # Cushing, OK crude stocks (kbbl)
    gasoline_stocks: WGTSTUS1      # total motor gasoline stocks (kbbl)
    distillate_stocks: WDISTUS1    # distillate fuel stocks (kbbl)
    crude_production: WCRFPUS2     # field production of crude (kbbl/d)
    refinery_util: WPULEUS3        # refiner % utilization of capacity
    spr_stocks: WCSSTUS1           # crude oil ending stocks in the SPR (kbbl)
    refinery_inputs: WCRRIUS2      # refiner net input of crude (kbbl/d) — days-of-supply denom
    gasoline_supplied: WGFUPUS2    # product supplied of finished gasoline (kbbl/d) — demand
    distillate_supplied: WDIUPUS2  # product supplied of distillate (kbbl/d) — freight/industrial demand
  supply:                          # oil-page PHYSICAL BALANCE read (display-only, never scored)
    range_lookback_d: 1825         # 5y range for the stocks z / percentile (legacy)
    trend_window_d: 28             # ~4-week stocks/production change
    seasonal_years: 5              # trailing window for the same-week-of-year climatology z
    dos_window_weeks: 4            # trailing demand window for days-of-supply

# =============================================================================
# OFR Financial Stress Index — daily 33-variable global stress with functional +
# regional decomposition (keyless CSV). Feeds engine/conditions.systemic_stress;
# the Funding leg embeds a free offshore-dollar / x-ccy-basis proxy and the EM leg
# is genuinely additive vs the US-centric NFCI. See research/DATA_SIGNAL_EXPANSION_2026.md
# =============================================================================
ofr_fsi:                           # distinct from the OFR funding-rates collector (collectors/ofr.py, group "ofr")
  fsi_url: https://www.financialresearch.gov/financial-stress-index/data/fsi.csv
  retries: 4

rate_futures:                      # Fed policy path — keyless ZQ/SR3 implied curve (research/DATA_SIGNAL_EXPANSION_2026.md #2)
  # Multi-contract futures from Yahoo → a daily implied-policy-path snapshot at fixed
  # horizons (1/3/6/12m). DISPLAY-ONLY: the implied rate IS a market price, not a
  # forecast edge — never scored, never an MRS leg. Yahoo throttles the build sandbox
  # (429) so this is verified by synthetic scaffold; live CI fetches the real curve.
  horizons_m: [1, 3, 6, 12]        # months-ahead the path is interpolated to
  max_months: 18                   # ignore contracts further out than this (illiquid tail)
  roots:
    # ZQ = 30-Day Fed Funds (CBOT), MONTHLY contracts. 100-price = the avg EFFR the
    # market prices for that delivery month.
    zq:   {symbol_root: ZQ,  exchanges: [CBT, NYB], cadence: monthly,  label: "Fed Funds (ZQ)",   months: 14}
    # SR3 = 3-Month SOFR (CME), QUARTERLY IMM contracts (Mar/Jun/Sep/Dec). 100-price =
    # the compounded avg SOFR over the reference quarter. SOFR ≈ EFFR-few-bp.
    sofr: {symbol_root: SR3, exchanges: [CME],      cadence: quarterly, label: "SOFR 3M (SR3)",    months: 18}

uncertainty_indices:                 # EPU + GPR daily text-uncertainty (narrative-quant-framework P0)
  # Two peer-reviewed, free, KEYLESS daily indices that quantify the NARRATIVE REGIME
  # (the manufactured-volatility backdrop). DISPLAY-ONLY context: text-uncertainty has
  # robust content for realized VOL / tail / risk-premia but WEAK content for return
  # DIRECTION, and VIX beats EPU at vol-forecasting — so nothing here is scored. Both
  # endpoints are reachable from the sandbox (unlike FRED).
  retries: 3
  # US daily news-based Economic Policy Uncertainty (Baker-Bloom-Davis), CSV from 1985.
  epu_daily_url: https://www.policyuncertainty.com/media/All_Daily_Policy_Data.csv
  # Daily Geopolitical Risk index (Caldara-Iacoviello, AER 2022) — legacy .xls with the
  # index + THREAT/ACT split (threat reverts ~3mo; acts persist → the reversibility tag).
  gpr_daily_url: https://www.matteoiacoviello.com/gpr_files/data_gpr_daily_recent.xls

