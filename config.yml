fundamentals:
  enabled: true                   # LOW CONFIDENCE module — engine must work without it
  finnhub_key_env: FINNHUB_KEY    # optional, used only if set

# -----------------------------------------------------------------------------
# Crypto collectors (Bitcoin Vector). All free, all verified 2026-06-12/13 —
# see research/VECTOR_DATA_AUDIT.md. Archive-forever policy: bgeo serves only a
# rolling 4y window, so every pulled row is kept permanently (FRED-OAS pattern).
# -----------------------------------------------------------------------------
coinmetrics:
  base_url: https://community-api.coinmetrics.io/v4/timeseries/asset-metrics
  asset: btc
  page_size: 10000
  retries: 3
  start_date: "2010-01-01"
  # community-tier verified ONLY these (others 403): metric -> column name
  metrics:
    PriceUSD: price_usd
    CapMrktCurUSD: mcap_usd
    CapMVRVCur: mvrv            # realized cap = mcap/mvrv; NUPL = 1 - 1/mvrv
    AdrActCnt: active_addresses
    HashRate: hashrate
    SplyCur: supply
    TxCnt: tx_count
    TxTfrCnt: transfer_count
    IssTotUSD: issuance_usd
    BlkCnt: block_count

bgeo:
  base_url: https://bitcoin-data.com
  retries: 2                      # don't burn quota on retries
  window_start: "2022-06-13"      # free tier serves last ~4y only
  daily_request_budget: 14        # of 15/day per IP — leave 1 spare (added coinbase-premium + cdd)
  page_size: 5000
  # priority order: first entries fetched first when quota is tight
  metrics:                        # endpoint -> column name (first = fetched first when quota tight)
    sopr: sopr
    sth-sopr: sth_sopr
    lth-sopr: lth_sopr
    sth-realized-price: sth_realized_price
    realized-price: realized_price
    bitcoin-dominance: btc_dominance   # promoted into the daily-fetched top-10 (API caps 10 req/hr → positions 11+ never run in a daily CI pass); feeds alts_rs + alt_cycle
    # exchange-netflow-btc: 403 on free tier (verified 2026-06-13) — flows are
    # covered by etf_flow + stablecoins + miner_sell_pressure; exchange-reserve-btc
    # is an untested candidate if a slot frees up
    miner-sell-pressure: miner_sell_pressure
    funding-rate: funding_rate
    open-interest-futures: open_interest_futures
    etf-flow-btc: etf_flow_btc
    supply-profit: supply_in_profit   # demoted below the 10/hr cap: slow-moving fraction + already seeded, so daily skips don't lose history
    cdd: cdd                     # coin-days-destroyed -> dormancy/liveliness (now seeded; tops up when quota allows)
    coinbase-premium-index: coinbase_premium   # US institutional demand (Coinbase−Binance); lowest priority → skipped first under quota

coinbase:
  spot_url: https://api.coinbase.com/v2/prices/BTC-USD/spot
  candles_url: https://api.exchange.coinbase.com/products/BTC-USD/candles
  earliest: "2015-07-20"          # BTC-USD on Coinbase Exchange
  hourly_earliest: "2016-01-01"   # hourly backfill floor (~92k rows)
  pace_seconds: 0.25              # public limit ~10 req/s; stay well under
  retries: 3

okx:
  funding_url: https://www.okx.com/api/v5/public/funding-rate-history
  oi_url: https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-volume
  # free/keyless rubik retail-sentiment endpoints (DISPLAY-ONLY positioning context)
  ls_ratio_url: https://www.okx.com/api/v5/rubik/stat/contracts/long-short-account-ratio
  taker_url: https://www.okx.com/api/v5/rubik/stat/taker-volume
  inst_id: BTC-USDT-SWAP
  retries: 3
  # OKX BTC-USDT SPOT daily candles — the keyless offshore-USDT reference price the
  # Coinbase Premium is measured against (Coinbase USD − OKX USDT). OKX works from US
  # runners where Binance is 451-blocked; gives a SELF-OWNED, fresh-daily premium that
  # does not depend on the quota-limited bgeo coinbase-premium-index. Spot history ~2019->.
  spot_candles_url: https://www.okx.com/api/v5/market/candles          # recent (≤300 bars)
  spot_history_url: https://www.okx.com/api/v5/market/history-candles  # paginate older via `after`
  spot_inst_id: BTC-USDT
  spot_bar: "1Dutc"              # UTC-midnight daily candles → aligns with Coinbase btc_daily
  spot_max_pages_first_run: 40   # 100 rows/page → ~4000 days (caps at OKX's BTC-USDT spot floor)

deribit:
  dvol_url: https://www.deribit.com/api/v2/public/get_volatility_index_data
  options_url: https://www.deribit.com/api/v2/public/get_book_summary_by_currency
  dvol_earliest: "2021-03-01"
  retries: 3
  term_tenors_d: [7, 30, 90, 180]   # ATM IV term-structure standardized tenors
  skew_target_d: 30                 # 25-delta skew/RR measured at the ~30d expiry

btc_impulse_radar:
  # Forward IMPULSE-PRESSURE radar (engine/btc_impulse_radar.py) — DISPLAY-ONLY.
  # Legs = adversarially-verified LEADING precursors only (see
  # research/VECTOR_IMPULSE_PREDICTION.md). Each fires on a leak-free threshold
  # cross and DECAYS to quiet; context legs cannot exceed `coiled` (only an
  # act-tier cross reaches warning/trigger). All keys optional — in-code defaults
  # apply when absent.
  enabled: true
  horizon_days: 6        # decay lookback for a leg's most-recent fire
  cbp_z_w: 90            # causal z window — Coinbase premium (D1 context)
  dvol_z_w: 60           # causal z window — DVOL intraday range (D2 act)
  sopr_z_w: 90           # causal z window — aggregate SOPR (D3 down / U1 up act)
  pctile_w: 252          # causal trailing-percentile window — OI / vol-of-vol fuel

farside:
  # Farside Investors — the canonical FREE daily US spot-Bitcoin-ETF flow table,
  # per fund + total, in US$m, since the 2024-01-11 launch (parens = outflow, "-" =
  # not trading). Deeper, fresher, and per-fund vs the quota-limited bgeo aggregate
  # etf-flow-btc. Scraped HTML → fail-safe: a parse/fetch failure leaves the bgeo
  # series as the fallback (etf_flow signal degrades gracefully).
  url: https://farside.co.uk/bitcoin-etf-flow-all-data/
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
  retries: 3
  # canonical fund tickers (lower-cased on store); GBTC is the high-fee incumbent whose
  # one-way unlock outflows distort the net → the model also tracks an ex-GBTC net.
  funds: [ibit, fbtc, bitb, arkb, btco, ezbc, brrr, hodl, btcw, msbt, gbtc, btc]

