# =============================================================================
# Macro Regime & Sector-Flow Dashboard — master configuration
# ALL tunables live here. Nothing is hardcoded in /collectors or /engine.
# =============================================================================

storage:
  data_dir: data
  holdings_dir: data/holdings
  archive_dir: data/archive
  site_dir: site
  reports_dir: reports
  run_status_file: data/run_status.json

# -----------------------------------------------------------------------------
# Collectors
# -----------------------------------------------------------------------------
fred:
  # group -> {series_id: column_name}. Stored one parquet per series under data/fred/.
  api_url: https://api.stlouisfed.org/fred/series/observations
  csv_url: https://fred.stlouisfed.org/graph/fredgraph.csv   # keyless fallback
  retries: 4
  backoff_base_s: 3
  # ALFRED point-in-time vintages (collectors.fred.fetch_vintages). Stores the
  # INITIAL RELEASE per period (output_type=4) into data/fred_vintage/vintages.parquet
  # so a macro backtest can read what was knowable on a date via as_of_series(),
  # not the latest-revised value. Additive — the live regime engine is unchanged.
  # Needs FRED_API_KEY (fredgraph has no vintages). vintage_series defaults to the
  # revision-prone set in collectors/fred.py:DEFAULT_VINTAGE_SERIES; override here.
  vintage_realtime_start: "1997-01-01"   # FRED's real-time archive begins ~1997
  series:
    rates:
      DGS2: us2y
      DGS10: us10y
      T10Y2Y: spread_2s10s
      DFII10: us10y_real
      T10YIE: breakeven_10y
      T5YIFR: breakeven_5y5y
      DFF: fed_funds
    credit:
      BAMLH0A0HYM2: hy_oas        # rolling 3y window on FRED since Apr 2026 — cache forever
      BAMLC0A0CM: ig_oas          # same caveat
      BAMLEMCBPIOAS: em_oas       # ICE BofA EM corporate OAS — EM/RORO risk leg (Forex Vector)
    risk:
      VIXCLS: vix_close
    dollar:
      DTWEXBGS: broad_dollar      # broad trade-weighted USD (2006->); better commodity driver than DXY for copper/oil (EM/China weight)
    liquidity:
      WALCL: fed_balance_sheet    # weekly (Wed), $ millions
      RRPONTSYD: on_rrp           # daily, $ billions
      M2SL: us_m2                 # US M2 broad money ($bn, monthly) — global-M2 leg
    econ_confirm:
      PAYEMS: payrolls            # monthly, thousands
      INDPRO: industrial_prod     # monthly, index
    # --- Quant-factor expansion (research/QUANT_FACTOR_EXPANSION.md) -----------
    # All free on FRED; feed engine/conditions.py + the growth/inflation axes.
    conditions:                   # Financial-conditions indices (Chicago/StL Fed)
      NFCI: nfci                  # National Financial Conditions Index (weekly; +=tight)
      ANFCI: anfci                # Adjusted NFCI (orthogonal to the business cycle)
      NFCIRISK: nfci_risk         # risk subindex (vol + credit spreads)
      NFCICREDIT: nfci_credit     # credit subindex
      NFCILEVERAGE: nfci_leverage # leverage subindex (debt + equity)
      STLFSI4: stlfsi             # St. Louis Fed Financial Stress Index (weekly)
    recession:                    # forward + concurrent recession reads
      SAHMREALTIME: sahm          # real-time Sahm rule (>=0.50 => recession underway)
      RECPROUSM156N: recession_prob   # Chauvet-Piger smoothed recession probability (%)
      THREEFYTP10: term_premium_10y   # NY Fed ACM 10y term premium (low/neg => curve inverts w/o recession)
    nowcast:                      # real-time GROWTH nowcasts (lead the lagging PAYEMS/INDPRO)
      GDPNOW: gdpnow              # Atlanta Fed GDPNow (quarterly SAAR, refreshed intra-quarter)
      WEI: wei                    # Weekly Economic Index (Lewis-Mertens-Stock; weekly, YoY-scaled)
    inflation_nowcast:            # underlying-inflation (persistent vs transitory split)
      STICKCPIM157SFRBATL: sticky_cpi      # Atlanta sticky-price CPI index (persistent)
      CORESTICKM157SFRBATL: core_sticky_cpi
      FLEXCPIM157SFRBATL: flex_cpi         # flexible-price CPI index (transitory)
      MEDCPIM158SFRBCLE: median_cpi        # Cleveland median CPI (1m annualized %)
    survey:                       # consumer sentiment / household inflation expectations
      UMCSENT: umich_sentiment    # UMich consumer sentiment (monthly)
      MICH: umich_infl_exp        # UMich 1y inflation expectations (%)
    curve:                        # fuller Treasury curve (engine only sampled 2y/10y)
      DGS3MO: us3m                # the short leg of the NY Fed recession spread
      DGS6MO: us6m
      DGS5: us5y
      DGS30: us30y
      T10Y3M: spread_10y3m        # exact spread the NY Fed probit uses
    inflation_extra:              # 5y inflation leg (second-tenor real-yield anchor)
      T5YIE: breakeven_5y
      DFII5: us5y_real
    # --- Forex Vector (research/FOREX_DASHBOARD.md) — all keyless via FRED ---------
    fx_rates:                     # daily FX reference rates (H.10) — cross-check + deep history
      DEXUSEU: fx_eur_usd         # USD per EUR  (EUR base, NOT inverted)
      DEXJPUS: fx_jpy_usd         # JPY per USD  (invert for JPY-vs-USD)
      DEXUSUK: fx_gbp_usd         # USD per GBP
      DEXUSAL: fx_aud_usd         # USD per AUD
      DEXCAUS: fx_cad_usd         # CAD per USD  (invert)
      DEXSZUS: fx_chf_usd         # CHF per USD  (invert)
      DEXMXUS: fx_mxn_usd         # MXN per USD  (invert)
      DEXBZUS: fx_brl_usd         # BRL per USD  (invert)
      DEXCHUS: fx_cny_usd         # CNY per USD  (invert; onshore)
    fx_dollar_legs:               # broad-dollar advanced/EM split (master tile)
      DTWEXAFEGS: broad_dollar_afe
      DTWEXEMEGS: broad_dollar_eme
    fx_rates_short:               # short/policy rates -> carry differential vs US (DFF).
      DTB3: us3m                  # piecewise-constant => monthly cadence + ffill is correct
      SOFR: sofr
      ECBDFR: ez_short            # ECB deposit facility (daily, current)
      ECBMRRFR: ez_mrr
      IRSTCI01JPM156N: jp_short   # Japan immediate/call rate (monthly)
      IR3TIB01AUM156N: au_short   # 3m interbank (monthly)
      IR3TIB01GBM156N: gb_short
      IR3TIB01CAM156N: ca_short
      IR3TIB01CHM156N: ch_short
    fx_rates_long:                # 10y govt yields -> term/real-rate differential (Phase 3)
      IRLTLT01EZM156N: ez_10y
      IRLTLT01JPM156N: jp_10y
      IRLTLT01GBM156N: gb_10y
      IRLTLT01AUM156N: au_10y
      IRLTLT01CAM156N: ca_10y
      IRLTLT01CHM156N: ch_10y
    fx_reer:                      # BIS broad real effective exch rates -> value (Phase 3); monthly, lagged
      RBUSBIS: reer_us
      RBXMBIS: reer_ez
      RBJPBIS: reer_jp
      RBGBBIS: reer_gb
      RBAUBIS: reer_au
      RBCABIS: reer_ca
      RBCHBIS: reer_ch
      RBMXBIS: reer_mx
      RBBRBIS: reer_br
      RBCNBIS: reer_cn

yahoo:
  retries: 3
  backoff_base_s: 5
  batch_size: 80
  # All EOD adjusted closes, one parquet per ticker under data/yahoo/.
  tickers:
    sectors: [XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY]
    extras: [SMH, IWM, RSP, SPY, QQQ, "^DJI", "^RUT", IJH]   # ^RUT = true Russell 2000 index level; IJH = S&P MidCap 400 (mid-cap leg of the size spectrum)
    style: [IWF, IWD]             # Russell 1000 Growth / Value — style-rotation read (growth vs value leadership)
    factors: [MTUM, QUAL, USMV, SPHB, SPLV]
    credit: [HYG, LQD]
    vol: ["^VIX", "^VIX9D", "^VIX3M", "^MOVE", "^VVIX"]   # ^VVIX = vol-of-vol (option-implied risk layer)
    fx_commod: ["DX-Y.NYB", "CL=F", "HG=F", "GC=F", "SI=F", "BZ=F"]
    fx: ["EURUSD=X", "USDJPY=X", "GBPUSD=X", "AUDUSD=X", "USDCAD=X", "USDCHF=X", "USDMXN=X", "USDBRL=X", "CNH=X", "CNH=F"]   # Forex Vector spot pairs; CNH=F = offshore CNH futures (2013->, real history vs CNH=X spot's 1 row)
    rate_pricing: ["ZQ=F"]        # 30-day fed funds front contract — LOW CONFIDENCE input
    crypto: [BTC-USD, ETH-USD, SOL-USD]   # deep daily history (BTC 2014->); Coinbase = intraday-quality OHLC

treasury:
  base_url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
  tga_endpoint: /v1/accounting/dts/operating_cash_balance
  debt_txn_endpoint: /v1/accounting/dts/public_debt_transactions
  page_size: 10000
  retries: 3

cboe:
  # put/call is COMPUTED from delayed chains (official stats CSVs moved behind
  # an SPA in 2025/26); chain_url's _SPX is templated per underlying
  chain_url: https://cdn.cboe.com/api/global/delayed_quotes/options/_SPX.json
  retries: 3
  # SKEW = option-implied tail/crash pricing (CBOE CDN serves a clean daily CSV
  # back to 1990 — no API key). Used by engine/conditions.py as a tail-risk gauge.
  skew_url: https://cdn.cboe.com/api/global/us_indices/daily_prices/SKEW_History.csv
  gex:
    contract_multiplier: 100
    pct_move: 0.01               # GEX expressed per 1% move
    strike_window_pct: 0.25      # ignore strikes >25% from spot
    max_expiry_days: 365

fedboard:
  # Excess Bond Premium (Gilchrist-Zakrajšek): the component of corporate credit
  # spreads NOT explained by default risk = a clean credit-risk-appetite / early-
  # warning gauge that forecasts both activity and asset prices. Monthly CSV from
  # the Fed Board (cols: date, gz_spread, ebp, est_prob), history from 1973.
  ebp_url: https://www.federalreserve.gov/econres/notes/feds-notes/ebp_csv.csv
  retries: 3

# =============================================================================
# Cross-sectional equity factor engine (research/QUANT_FACTOR_EXPANSION.md,
# Tier 3). Fundamentals come from the SEC EDGAR XBRL "frames" API — free,
# keyless, one call returns a us-gaap concept across EVERY filer for a period —
# joined to the S&P 1500 price universe already in the breadth close caches.
# Builds value / quality / profitability / investment / accruals / payout +
# (price-only) low-vol & betting-against-beta factor ranks. NEW FEATURE: a
# Factor Rankings page + a factor-leadership tile. House caveats apply (decay,
# crowding, sparse free fundamentals, look-ahead lagged to the filing period).
# =============================================================================
edgar:
  enabled: true
  base_url: https://data.sec.gov/api/xbrl/frames/us-gaap
  shares_url: https://data.sec.gov/api/xbrl/frames/dei   # dei:EntityCommonStockSharesOutstanding fallback
  tickers_url: https://www.sec.gov/files/company_tickers.json
  # SEC fair-access requires a descriptive UA with a contact. Replace the email
  # with your own if you fork this. Rate limit is 10 req/s; we make ~20 calls/run.
  user_agent: "macro-dashboard research (personal; contact via repo issues)"
  retries: 3
  latest_fy: 2025                  # most recent COMPLETE fiscal year on EDGAR; auto-walks-back if sparse
  min_filers_ok: 800              # a frame with fewer than this is treated as not-yet-available
  # Point-in-time panel (collectors.edgar.fetch_panel): one cross-section per FY
  # back to panel_start_fy, each stamped asof_date = period_end + reporting_lag_days
  # so a factor backtest never peeks at a not-yet-filed 10-K. Frames carry the
  # period end but NOT the SEC filed timestamp, so the lag is a CONSERVATIVE proxy
  # (120d ≈ past the 90d 10-K deadline; longer = safer against look-ahead).
  panel_start_fy: 2009            # XBRL financial-statement tagging was mandated ~2009
  reporting_lag_days: 120
  factors:
    winsor_z: 3.0                 # clip cross-sectional z-scores at +/- this
    low_vol_window_d: 252         # trailing window for idiosyncratic/total vol + beta
    min_price_history_d: 150
    page_top_n: 25                # rows per factor leaderboard on factors.html
    # multi-factor composite = equal-weight mean of the available factor z's below
    # (accruals is folded into `quality`; low_beta is a standalone leaderboard,
    # left out of the blend as it is collinear with low_vol)
    composite: [value, quality, profitability, investment, payout, low_vol]

engine_equity_factors:
  # leadership read: which factor's top-quintile has been beating its bottom-
  # quintile over this trailing window (a coarse "what's working now" gauge).
  leadership_window_d: 63

# FINRA consolidated short interest (Phase 3 of the four-phase build-out). Free,
# keyless FINRA Query API — bi-monthly exchange-listed short interest + days-to-
# cover. Feeds a short_interest factor (high days-to-cover negatively predicts
# the cross-section — Hong-Li-Rajan-Sherman). Fetched from build_factors.
finra:
  url: https://api.finra.org/data/group/otcMarket/name/consolidatedShortInterest
  user_agent: "macro-dashboard research (personal; contact via repo issues)"
  page_size: 5000               # FINRA caps a single response at 5000 rows
  max_pages: 8                  # ~40k rows covers a full settlement snapshot
  lookback_dates: 8             # candidate settlement dates to probe (newest-first)

# SEC Form-4 insider transactions (Phase 4 of the four-phase build-out). The SEC
# "Insider Transactions Data Sets" ship one zip per quarter (TSV: SUBMISSION +
# NONDERIV_TRANS) covering EVERY Form 3/4/5 — so a single download aggregates net
# OPEN-MARKET insider buying/selling per issuer. Surfaced as an "insider activity"
# panel on the factors page (latest COMPLETED quarter — the bulk set is published
# quarterly, so it is a slow conviction read, not real-time). Fetched from build_factors.
sec_insider:
  zip_url: https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/{q}_form345.zip
  user_agent: "macro-dashboard research macro-dashboard@users.noreply.github.com"
  retries: 3
  lookback_quarters: 5          # probe the current quarter, then walk back to the latest published
  open_market_codes: [P, S]     # P = open-market purchase, S = open-market sale (exclude grants/exercises)
  min_trade_usd: 10000          # ignore de-minimis transactions
  panel_top_n: 20               # rows on the insider buying/selling leaderboards

# =============================================================================
# EIA petroleum supply (Phase 2 of the four-phase build-out). The single biggest
# missing oil supply-shock driver per COMMODITY_DATA_AUDIT. EIA's keyless dnav
# "Download Series History" .xls endpoints (hist_xls/{ID}w.xls) — no API key —
# give weekly U.S. crude/gasoline/distillate stocks, Cushing, production and
# refinery utilization back to the 1980s/90s. Surfaced as a SUPPLY read on the
# oil page in the Commodity Vector (stocks vs 5y range, production trend).
# =============================================================================
eia:
  hist_xls_url: https://www.eia.gov/dnav/pet/hist_xls/{id}w.xls
  user_agent: "Mozilla/5.0 (macro-dashboard research)"
  retries: 3
  series:                          # column_name -> EIA dnav series id
    crude_stocks: WCESTUS1         # crude oil ending stocks excl SPR (kbbl)
    cushing_stocks: W_EPC0_SAX_YCUOK_MBBL   # Cushing, OK crude stocks (kbbl)
    gasoline_stocks: WGTSTUS1      # total motor gasoline stocks (kbbl)
    distillate_stocks: WDISTUS1    # distillate fuel stocks (kbbl)
    crude_production: WCRFPUS2     # field production of crude (kbbl/d)
    refinery_util: WPULEUS3        # refiner % utilization of capacity
  supply:                          # oil-page supply read
    range_lookback_d: 1825         # 5y range for the stocks z / percentile
    trend_window_d: 28             # ~4-week stocks/production change

cot:
  socrata_url: https://publicreporting.cftc.gov/resource/6dca-aqww.json   # legacy futures-only
  zip_url_template: https://www.cftc.gov/files/dea/history/deacot{year}.zip
  retries: 3
  markets:                        # CFTC name prefixes (lists cover renames over time);
    es_spx: ["E-MINI S&P 500 "]   # trailing space excludes ESG/sector minis
    nasdaq: ["NASDAQ MINI", "NASDAQ-100 STOCK INDEX (MINI)"]
    ust10y: ["UST 10Y NOTE", "10-YEAR U.S. TREASURY NOTES"]
    dollar: ["USD INDEX", "U.S. DOLLAR INDEX"]
    gold: ["GOLD - COMMODITY EXCHANGE"]
    copper: ["COPPER- #1", "COPPER - COMMODITY EXCHANGE", "COPPER-GRADE #1"]
    silver: ["SILVER - COMMODITY EXCHANGE"]   # COMEX 5000oz (1986->); excludes CBOT mini contracts
    oil: ["CRUDE OIL, LIGHT 'SWEET' - NEW YORK", "CRUDE OIL, LIGHT SWEET - NEW YORK", "CRUDE OIL, LIGHT SWEET-WTI - ICE"]   # WTI: NYMEX physical (1986-2022) spliced to ICE Europe WTI (2014->) via per-date max-OI dedup; net_spec_pct_oi normalizes the contract handoff
    bitcoin: ["BITCOIN - C"]      # CME contract; prefix excludes BITCOIN CASH / MICRO BITCOIN
    # Forex Vector — CME currency futures (contrarian spec positioning). dollar (cot_dollar) above.
    euro_fx: ["EURO FX - CHICAGO MERCANTILE EXCHANGE", "EURO FX"]
    yen: ["JAPANESE YEN - CHICAGO MERCANTILE EXCHANGE", "JAPANESE YEN"]
    pound: ["BRITISH POUND - CHICAGO MERCANTILE EXCHANGE", "BRITISH POUND STERLING", "BRITISH POUND"]
    aussie: ["AUSTRALIAN DOLLAR - CHICAGO MERCANTILE EXCHANGE", "AUSTRALIAN DOLLAR"]
    cad: ["CANADIAN DOLLAR - CHICAGO MERCANTILE EXCHANGE", "CANADIAN DOLLAR"]
    swiss: ["SWISS FRANC - CHICAGO MERCANTILE EXCHANGE", "SWISS FRANC"]
    peso: ["MEXICAN PESO - CHICAGO MERCANTILE EXCHANGE", "MEXICAN PESO"]
    real: ["BRAZILIAN REAL - CHICAGO MERCANTILE EXCHANGE", "BRAZILIAN REAL"]

sentiment:
  aaii_url: https://www.aaii.com/sentimentsurvey/sent_results
  naaim_url: https://naaim.org/programs/naaim-exposure-index/
  retries: 2

sponsors:
  # Daily shares-outstanding + NAV for sector SPDRs -> flow = delta(SO) x NAV
  sectorspdr_api: https://www.sectorspdrs.com/api/fundQuote/
  sector_funds: [XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY]
  retries: 3
  user_agent: "macro-dashboard/1.0 (personal research; contact via repo)"

holdings:
  # Watchlist of active/thematic funds tracked daily. Edit freely.
  watchlist:
    ARKK:
      sponsor: ark
      url: https://assets.ark-funds.com/fund-documents/funds-etf-csv/ARK_INNOVATION_ETF_ARKK_HOLDINGS.csv
    ARKW:
      sponsor: ark
      url: https://assets.ark-funds.com/fund-documents/funds-etf-csv/ARK_NEXT_GENERATION_INTERNET_ETF_ARKW_HOLDINGS.csv
    WGMI:
      sponsor: coinshares
      url: ""                     # resolved at runtime by collectors/holdings.py wgmi adapter
  active_change_alert_pct: 20     # alert if manager add/cut >= 20% of position
  active_change_window_d: 5
  retries: 3

holdings_signals:
  # Accumulation/anomaly detection on the sector-SPDR top-10 holdings. Each
  # holding's weight change is decomposed into a price part and a residual
  # ("active_change", in percentage points) = weight growth beyond what the
  # stock's price move explains. On these PASSIVE index funds the residual is
  # index-reconstitution / float flow, NOT discretionary conviction (see D70 /
  # LIMITATIONS.md). Thresholds are UNCALIBRATED — only one snapshot exists today;
  # tune once a few weeks of daily snapshots accumulate.
  lookback_days: 5                # compare latest snapshot to one ~5 days earlier
  active_change_pp: 0.15          # min |residual weight change| (pp) to flag
  active_change_pct: 8            # OR min |residual vs price-implied weight| (%)
  alert_pp: 0.25                  # higher bar to fire an alert (vs merely listing)
  min_price_history: 60           # rows of stock history needed for the cycle read
  panel_top_n: 12                 # rows shown in the dashboard Accumulation Watch panel
  volume_surge_x: 1.5             # recent vs prior avg-volume ratio to flag a surge (📊)

etf_holdings:
  # The "real fund moves" board (site/etfs.html). The collector writes FULL daily
  # holdings (with Shares Held) per fund; the engine diffs consecutive snapshots
  # with flow normalization (share-based active-decision) — no per-stock prices
  # needed. The universe is deliberately THEMATIC / INDUSTRY funds only (not broad
  # index trackers): a thematic basket reflects someone CURATING a slice of the
  # market, so a position add is a meaningful read; a broad-index fund (SPY/QQQ/
  # DIA) just mirrors the whole market and produces no actionable signal. Active
  # funds (ARK) live in the `holdings.watchlist` block and are merged in. Sponsor
  # reliability (recon 2026-06-13, D71): ssga/ark/invesco/globalx VERIFIED;
  # iShares/Schwab BLOCKED (Akamai/JS consent walls); Vanguard NOT supported.
  retries: 3
  active_change_alert_pct: 15     # |flow-normalized share change| (% of position) to flag
  active_change_window_d: 5       # compare latest snapshot to one ~5 snapshots back
  min_position_pct: 0.20          # ignore tiny <0.2%-weight positions (noise)
  min_conviction_pp: 0.05         # ignore moves below 0.05pp of fund weight committed
                                  # (a 0.1%->0.2% double is a big % but trivial conviction)
  min_base_frac: 0.000001         # backstop: drop only positions whose prior base is a
                                  # degenerate near-zero share of the fund (placeholder
                                  # contra-lines / brand-new-from-zero) so the denominator
                                  # can't explode the %. Real small positions are gated by
                                  # min_position_pct (weight), not this share-fraction floor.
  page_top_n: 40                  # accumulation rows on the radar page
  trims_top_n: 12                 # secondary (de-emphasized) trim rows
  universe:
    # --- SPDR / State Street thematic & industry (VERIFIED daily XLSX) ---------
    XBI:  {sponsor: ssga, name: "SPDR S&P Biotech", category: "Biotech"}
    XOP:  {sponsor: ssga, name: "SPDR S&P Oil & Gas E&P", category: "Energy"}
    XHB:  {sponsor: ssga, name: "SPDR S&P Homebuilders", category: "Homebuilders"}
    XRT:  {sponsor: ssga, name: "SPDR S&P Retail", category: "Retail"}
    KRE:  {sponsor: ssga, name: "SPDR S&P Regional Banking", category: "Regional Banks"}
    KBE:  {sponsor: ssga, name: "SPDR S&P Bank", category: "Banks"}
    XME:  {sponsor: ssga, name: "SPDR S&P Metals & Mining", category: "Metals & Mining"}
    XSD:  {sponsor: ssga, name: "SPDR S&P Semiconductor", category: "Semiconductors"}
    XAR:  {sponsor: ssga, name: "SPDR S&P Aerospace & Defense", category: "Aerospace & Defense"}
    # --- Global X (VERIFIED: dated full-holdings CSV; thematic, real equity names) -
    URA:  {sponsor: globalx, name: "Global X Uranium", category: "Uranium"}
    LIT:  {sponsor: globalx, name: "Global X Lithium & Battery Tech", category: "Lithium / Battery"}
    COPX: {sponsor: globalx, name: "Global X Copper Miners", category: "Copper Miners"}
    # Broad-index funds (SPY/DIA/MDY/QQQ/RSP) intentionally DROPPED — they track the
    # whole market, so their "moves" are reconstitution noise, not a curated read.
    # iShares/BlackRock and Invesco non-flagship are Akamai/consent-wall blocked
    # (recon 2026-06-13, D71); _fetch_ishares stays for a future headless path.

fundamentals:
  enabled: true                   # LOW CONFIDENCE module — engine must work without it
  finnhub_key_env: FINNHUB_KEY    # optional, used only if set

# -----------------------------------------------------------------------------
# Crypto collectors (Bitcoin Vector). All free, all verified 2026-06-12/13 —
# see research/VECTOR_DATA_AUDIT.md. Archive-forever policy: bgeo serves only a
# rolling 4y window, so every pulled row is kept permanently (FRED-OAS pattern).
# -----------------------------------------------------------------------------
coinmetrics:
  base_url: https://community-api.coinmetrics.io/v4/timeseries/asset-metrics
  asset: btc
  page_size: 10000
  retries: 3
  start_date: "2010-01-01"
  # community-tier verified ONLY these (others 403): metric -> column name
  metrics:
    PriceUSD: price_usd
    CapMrktCurUSD: mcap_usd
    CapMVRVCur: mvrv            # realized cap = mcap/mvrv; NUPL = 1 - 1/mvrv
    AdrActCnt: active_addresses
    HashRate: hashrate
    SplyCur: supply
    TxCnt: tx_count
    TxTfrCnt: transfer_count
    IssTotUSD: issuance_usd
    BlkCnt: block_count

bgeo:
  base_url: https://bitcoin-data.com
  retries: 2                      # don't burn quota on retries
  window_start: "2022-06-13"      # free tier serves last ~4y only
  daily_request_budget: 14        # of 15/day per IP — leave 1 spare (added coinbase-premium + cdd)
  page_size: 5000
