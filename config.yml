  # -- Engine (uniform across countries) --------------------------------------
  engine:
    scoring: {slope_window: 20, baseline_window: 60, z_threshold: 0.45, min_components: 2}
    quad: {hysteresis_days: 7, shock_override_z: 0.85}
    recession:                      # DISPLAY-ONLY composite (history-anchored bands, no forward edge claimed)
      unemp_window_d: 126           # ~6mo change in unemployment (Sahm-lite uptrend)
      drawdown_window_d: 252        # equity drawdown from 1y high
      elevated_band: 45             # composite >= -> "watch"
      high_band: 65                 # composite >= -> "elevated"
    equity_risk:
      high_window_d: 252
      extension_window: 20          # short-horizon stretch
      extension_baseline_d: 252     # vs own 1y history
      froth_band: 1.5               # extension-z >= -> "stretched"
      bubble_band: 2.0              # extension-z >= -> "parabolic"
    rs_ranking:                     # sector-rotation board (computed from universe baskets)
      momentum_windows: [20, 60]
      trend_window: 120
      percentile_lookback_d: 252
    performance:                    # DISPLAY-ONLY USD-return / rotation desk (engine.intl_performance)
      benchmark: "^GSPC"            # US price index — apples-to-apples vs the intl price indices
      horizons_d: {1m: 21, 3m: 63, 6m: 126, 12m: 252}
      correlation_window_d: 252     # daily-return window for the cross-market correlation map
      rrg_window_d: 63              # relative-strength momentum lookback (US-vs-world rotation)
    rates:                          # rates / curve / carry desk (engine.intl_rates)
      carry_anchor: us_10y          # carry = country 10y - US 10y
      liquidity_impulse_w: [13, 52] # ECB balance-sheet 13/52-week % change

special_situations:                # event-driven Special Situations desk (display-only leaf; SCORED=False)
  enabled: true                    # deterministic collector/engine on; LLM summary is the separate llm_brief flag
  user_agent: "Macro Dashboard special-situations research longr2512@gmail.com"  # SEC fair-access (email required for www.sec.gov)
  retries: 3
  backfill_days: 7                 # on first run / large gap, how many days of daily-index to sweep
  market_cap_floor_musd: 100       # keep covered companies >= $100M (decision 2026-06-20)
  market_cap_floor_high_conf_musd: 25  # relaxed floor for HIGH-confidence situations only
                                       # (structured/LLM-verified/digest) — captures the
                                       # small-cap activist/take-private niche (decision 2026-06-21)
  eight_k_items:                   # special-situations 8-K items (others discarded)
    ["1.01", "1.02", "1.03", "2.01", "3.01", "5.02", "8.01"]
  # LLM 88-word summary touchpoint — ON (DeepSeek; key via DEEPSEEK_API_KEY secret).
  # Generates summaries ONLY for EDGAR-only situations lacking a digest summary,
  # cached per situation id (pays once per new situation). No-op if the key is absent.
  llm_brief: true
  llm_model: "deepseek-chat"
  api_key_env: "DEEPSEEK_API_KEY"
  llm_base_url: "https://api.deepseek.com/anthropic"
  llm_min_confidence: "medium"
  # Per-build work caps — the daily build chips the historical backlog (~23k deferred
  # filings) a bounded slice at a time so one run can never stall the whole engine job.
  # Progress persists in events.parquet (committed), so the backlog converges over days
  # and steady-state only touches new filings. Raise these (or call the collector funcs
  # with a high `limit` in a one-off workflow_dispatch) to burn the backlog down faster.
  text_per_build: 1500             # keyword pre-filter doc fetches per build (cheap, SEC-paced)
  classify_per_build: 150          # P1.1 LLM category-verify calls per build
  summary_per_build: 200           # P1.3 LLM summary calls per build
  filer_per_build: 250             # P3.2 13D cover-page fetches per build
  # P2.1 newswire lane — catches the form-absent categories (Strategic Reviews, Capital
  # Returns, Deal Terminations, Divestitures). ON: the name_resolver now maps the company in
  # a headline to its ticker (Google-News headlines lack "(NASDAQ: XYZ)" tags), so the lane
  # yields real items (live sample: ROKU/PayPal strategic reviews, Yum divestiture, buybacks).
  # display-only, low-confidence; deduped by (ticker, category) on the desk.
  newswire: true
  # Phase 4 international lanes — UK (LSE/RNS) + Canada (TSX). Both use the intl classifier +
  # name_resolver (UK/CA names now resolve via the stock-search libraries).
  # CANADA is ON: it adds a direct GlobeNewswire-Canada RSS source on top of Google-News,
  # strictly gated (spam/French filtered, must classify AND resolve a .TO ticker). LOW yield —
  # there is no clean free Canadian special-situations feed (SEDAR+ direct is ToS/CAPTCHA-
  # barred), so this captures the occasional real TSX deal PR; precision-gated, never noisy.
  # UK stays OFF: no direct RNS feed wired yet, and Google-News alone yields ~0 (feed recall).
  intl_uk: false
  intl_canada: true

# ---------------------------------------------------------------------------
# qual_extraction — citation-verified structured extraction from filing bodies
# (engine/qual_extraction.py, W5 §2.4 / Appendix P5).
# Wired to the 8-K lane in collectors/special_situations.py.
# Model ID is read from llm_models.extraction above (no literal here).
# ---------------------------------------------------------------------------
qual_extraction:
  enabled: true                     # master switch; default ON (Haiku cost is rounding error)
  api_key_env: "ANTHROPIC_API_KEY"  # Anthropic key for Haiku; falls back to DEEPSEEK_API_KEY
  # llm_base_url: null              # set to https://api.deepseek.com/anthropic to use DeepSeek
  max_body_chars: 40000             # truncation cap before sending to model (matches doc_cache)
  max_tokens: 1500                  # max reply tokens
  confidence_floor: "low"           # below this, all interpretive fields collapse to neutral
  importance_percentile: 80         # only extract from filings in the top N% importance slice
                                    # (P5 cost table: "top-importance slice ~20%/day")
  extract_per_build: 100            # hard cap on new extraction calls per build (cost guard)
  reply_cache_dir: "data/qual_extraction/reply_cache"

