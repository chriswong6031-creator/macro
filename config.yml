      "688508.SS": {name_en: "Wuxi Chipown Micro-electronics", name_zh: "芯朋微", sector: "Technology", mktcap_yi: 108}
      "300580.SZ": {name_en: "Wuxi Best Precision Machinery", name_zh: "贝斯特", sector: "Industrials", mktcap_yi: 92}
      "688049.SS": {name_en: "Actions Technology", name_zh: "炬芯科技", sector: "Technology", mktcap_yi: 75}
      "300470.SZ": {name_en: "Sinoseal Holding", name_zh: "中密控股", sector: "Industrials", mktcap_yi: 59}
      "688609.SS": {name_en: "Unionman Technology", name_zh: "九联科技", sector: "Technology", mktcap_yi: 56}
