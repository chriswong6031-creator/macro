    "Insurance":            {tv: "HKEX:2318", members: ["2318.HK","1299.HK","2628.HK","2601.HK","0966.HK"]}
    "Energy":               {tv: "HKEX:883",  members: ["0883.HK","0857.HK","0386.HK","1088.HK","0934.HK"]}
    "Materials":            {tv: "HKEX:2600", members: ["2600.HK","0358.HK","1378.HK","3993.HK","0486.HK"]}
    "Property":             {tv: "HKEX:16",   members: ["0016.HK","1109.HK","0688.HK","0823.HK","0017.HK","1997.HK","0012.HK"]}
    "Consumer":             {tv: "HKEX:2020", members: ["2020.HK","2331.HK","1929.HK","6862.HK","0291.HK","0288.HK","2319.HK","1044.HK"]}
