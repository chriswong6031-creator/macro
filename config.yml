# =============================================================================
# Macro Regime & Sector-Flow Dashboard — master configuration
# ALL tunables live here. Nothing is hardcoded in /collectors or /engine.
# =============================================================================

storage:
  data_dir: data
  holdings_dir: data/holdings
  archive_dir: data/archive
  site_dir: site
  reports_dir: reports
  run_status_file: data/run_status.json

# -----------------------------------------------------------------------------
# Collectors
# -----------------------------------------------------------------------------
fred:
  # group -> {series_id: column_name}. Stored one parquet per series under data/fred/.
  api_url: https://api.stlouisfed.org/fred/series/observations
  csv_url: https://fred.stlouisfed.org/graph/fredgraph.csv   # keyless fallback
  retries: 4
  backoff_base_s: 3
  series:
    rates:
      DGS2: us2y
      DGS10: us10y
      T10Y2Y: spread_2s10s
      DFII10: us10y_real
      T10YIE: breakeven_10y
      T5YIFR: breakeven_5y5y
      DFF: fed_funds
    credit:
      BAMLH0A0HYM2: hy_oas        # rolling 3y window on FRED since Apr 2026 — cache forever
      BAMLC0A0CM: ig_oas          # same caveat
    risk:
      VIXCLS: vix_close
    liquidity:
      WALCL: fed_balance_sheet    # weekly (Wed), $ millions
      RRPONTSYD: on_rrp           # daily, $ billions
    econ_confirm:
      PAYEMS: payrolls            # monthly, thousands
      INDPRO: industrial_prod     # monthly, index

yahoo:
  retries: 3
  backoff_base_s: 5
  batch_size: 80
  # All EOD adjusted closes, one parquet per ticker under data/yahoo/.
  tickers:
    sectors: [XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY]
    extras: [SMH, IWM, RSP, SPY, QQQ, "^DJI"]
    factors: [MTUM, QUAL, USMV, SPHB, SPLV]
    credit: [HYG, LQD]
    vol: ["^VIX", "^VIX9D", "^VIX3M", "^MOVE"]
    fx_commod: ["DX-Y.NYB", "CL=F", "HG=F", "GC=F", "SI=F", "BZ=F"]
    rate_pricing: ["ZQ=F"]        # 30-day fed funds front contract — LOW CONFIDENCE input
    crypto: [BTC-USD, ETH-USD, SOL-USD]   # deep daily history (BTC 2014->); Coinbase = intraday-quality OHLC

treasury:
  base_url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
  tga_endpoint: /v1/accounting/dts/operating_cash_balance
  debt_txn_endpoint: /v1/accounting/dts/public_debt_transactions
  page_size: 10000
  retries: 3

cboe:
  # put/call is COMPUTED from delayed chains (official stats CSVs moved behind
  # an SPA in 2025/26); chain_url's _SPX is templated per underlying
  chain_url: https://cdn.cboe.com/api/global/delayed_quotes/options/_SPX.json
  retries: 3
  gex:
    contract_multiplier: 100
    pct_move: 0.01               # GEX expressed per 1% move
    strike_window_pct: 0.25      # ignore strikes >25% from spot
    max_expiry_days: 365

cot:
  socrata_url: https://publicreporting.cftc.gov/resource/6dca-aqww.json   # legacy futures-only
  zip_url_template: https://www.cftc.gov/files/dea/history/deacot{year}.zip
  retries: 3
  markets:                        # CFTC name prefixes (lists cover renames over time);
    es_spx: ["E-MINI S&P 500 "]   # trailing space excludes ESG/sector minis
    nasdaq: ["NASDAQ MINI", "NASDAQ-100 STOCK INDEX (MINI)"]
    ust10y: ["UST 10Y NOTE", "10-YEAR U.S. TREASURY NOTES"]
    dollar: ["USD INDEX", "U.S. DOLLAR INDEX"]
    gold: ["GOLD - COMMODITY EXCHANGE"]
    copper: ["COPPER- #1", "COPPER - COMMODITY EXCHANGE", "COPPER-GRADE #1"]
    bitcoin: ["BITCOIN - C"]      # CME contract; prefix excludes BITCOIN CASH / MICRO BITCOIN

sentiment:
  aaii_url: https://www.aaii.com/sentimentsurvey/sent_results
  naaim_url: https://naaim.org/programs/naaim-exposure-index/
  retries: 2

sponsors:
  # Daily shares-outstanding + NAV for sector SPDRs -> flow = delta(SO) x NAV
  sectorspdr_api: https://www.sectorspdrs.com/api/fundQuote/
  sector_funds: [XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY]
  retries: 3
  user_agent: "macro-dashboard/1.0 (personal research; contact via repo)"

holdings:
  # Watchlist of active/thematic funds tracked daily. Edit freely.
  watchlist:
    ARKK:
      sponsor: ark
      url: https://assets.ark-funds.com/fund-documents/funds-etf-csv/ARK_INNOVATION_ETF_ARKK_HOLDINGS.csv
    ARKW:
      sponsor: ark
      url: https://assets.ark-funds.com/fund-documents/funds-etf-csv/ARK_NEXT_GENERATION_INTERNET_ETF_ARKW_HOLDINGS.csv
    WGMI:
      sponsor: coinshares
      url: ""                     # resolved at runtime by collectors/holdings.py wgmi adapter
  active_change_alert_pct: 20     # alert if manager add/cut >= 20% of position
  active_change_window_d: 5
  retries: 3

fundamentals:
  enabled: true                   # LOW CONFIDENCE module — engine must work without it
  finnhub_key_env: FINNHUB_KEY    # optional, used only if set

# -----------------------------------------------------------------------------
# Crypto collectors (Bitcoin Vector). All free, all verified 2026-06-12/13 —
# see research/VECTOR_DATA_AUDIT.md. Archive-forever policy: bgeo serves only a
# rolling 4y window, so every pulled row is kept permanently (FRED-OAS pattern).
# -----------------------------------------------------------------------------
coinmetrics:
  base_url: https://community-api.coinmetrics.io/v4/timeseries/asset-metrics
  asset: btc
  page_size: 10000
  retries: 3
  start_date: "2010-01-01"
  # community-tier verified ONLY these (others 403): metric -> column name
  metrics:
    PriceUSD: price_usd
    CapMrktCurUSD: mcap_usd
    CapMVRVCur: mvrv            # realized cap = mcap/mvrv; NUPL = 1 - 1/mvrv
    AdrActCnt: active_addresses
    HashRate: hashrate
    SplyCur: supply
    TxCnt: tx_count
    TxTfrCnt: transfer_count
    IssTotUSD: issuance_usd
    BlkCnt: block_count

bgeo:
  base_url: https://bitcoin-data.com
  retries: 2                      # don't burn quota on retries
  window_start: "2022-06-13"      # free tier serves last ~4y only
  daily_request_budget: 12        # of 15/day per IP — leave 3 spare
  page_size: 5000
  # priority order: first entries fetched first when quota is tight
  metrics:                        # endpoint -> column name
    sopr: sopr
    sth-sopr: sth_sopr
    lth-sopr: lth_sopr
    sth-realized-price: sth_realized_price
    realized-price: realized_price
    supply-profit: supply_in_profit
    # exchange-netflow-btc: 403 on free tier (verified 2026-06-13) — flows are
    # covered by etf_flow + stablecoins + miner_sell_pressure; exchange-reserve-btc
    # is an untested candidate if a slot frees up
    miner-sell-pressure: miner_sell_pressure
    funding-rate: funding_rate
    open-interest-futures: open_interest_futures
    etf-flow-btc: etf_flow_btc
    bitcoin-dominance: btc_dominance

coinbase:
  spot_url: https://api.coinbase.com/v2/prices/BTC-USD/spot
  candles_url: https://api.exchange.coinbase.com/products/BTC-USD/candles
  earliest: "2015-07-20"          # BTC-USD on Coinbase Exchange
  hourly_earliest: "2016-01-01"   # hourly backfill floor (~92k rows)
  pace_seconds: 0.25              # public limit ~10 req/s; stay well under
  retries: 3

okx:
  funding_url: https://www.okx.com/api/v5/public/funding-rate-history
  oi_url: https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-volume
  inst_id: BTC-USDT-SWAP
  retries: 3

deribit:
  dvol_url: https://www.deribit.com/api/v2/public/get_volatility_index_data
  options_url: https://www.deribit.com/api/v2/public/get_book_summary_by_currency
  dvol_earliest: "2021-03-01"
  retries: 3

feargreed:
  url: https://api.alternative.me/fng/
  retries: 3

coingecko:
  global_url: https://api.coingecko.com/api/v3/global
  retries: 3                      # keyless tier ~5-15 req/min; we make 1/day

defillama:
  stablecoins_url: https://stablecoins.llama.fi/stablecoincharts/all
  retries: 3

mempool:
  fees_url: https://mempool.space/api/v1/fees/recommended
  hashrate_url: https://mempool.space/api/v1/mining/hashrate/1m
  hashrate_backfill_url: https://mempool.space/api/v1/mining/hashrate/3y
  retries: 3

breadth:
  constituents_url: https://en.wikipedia.org/wiki/List_of_S%26P_500_companies
  lookback_days_live: 1100        # ~3y: 200DMA/NH-NL plus cycle analysis for stock search
  ma_windows: [50, 200]
  nhnl_window: 252

stock_search:
  enabled: true
  extra_tickers: []               # any extra symbols to include in the search library

# -----------------------------------------------------------------------------
# Regime engine
# -----------------------------------------------------------------------------
engine:
  scoring:
    slope_window: 20              # days for direction-of-change slope
    baseline_window: 60           # z-score the slope against this trailing window of slopes
    z_threshold: 0.45             # |z| below this scores 0 (no signal); tuned 2026-06 (scripts/tune.py)
    min_components: 3             # fewer live components than this -> axis confidence = 0

  growth_axis:
    components:                   # name: {weight}; series construction in engine/axes.py
      copper_gold: {weight: 1.0}
      xly_xlp: {weight: 1.0}
      us2y_direction: {weight: 0.5}   # ambiguous when policy chases inflation (2022) — tuned down
      iwm_spy: {weight: 1.0}
      cyclical_defensive: {weight: 1.0}
      breadth_direction: {weight: 1.0}
      payrolls_trend: {weight: 0.5}     # slow confirmation, lower weight
      indpro_trend: {weight: 0.5}
    cyclical_basket: [XLI, XLB, XLF, XLY]
    defensive_basket: [XLP, XLU, XLV]

  inflation_axis:
    components:
      breakeven_10y_direction: {weight: 1.0}
      breakeven_5y5y_direction: {weight: 1.0}
      energy_rs: {weight: 1.0}
      oil_trend: {weight: 1.0}
      inflation_beta_basket: {weight: 1.0}   # (XLE+XLB)/(XLK+XLU)
      tips_nominal_momentum: {weight: 0.75}
    inflation_long_basket: [XLE, XLB]
    inflation_short_basket: [XLK, XLU]

  quad:
    hysteresis_days: 7            # new quad must hold N consecutive days; tuned from 5 (whipsaw 20%->9%)
    shock_override_z: 0.85        # single-day |axis score| beyond this flips immediately; tuned from 0.7
    recession_hy_oas_min: 5.0     # % level threshold
    recession_oas_widening_days: 20
    inflation_shock_pctile: 0.90  # inflation axis score vs own history

  liquidity:
    roc_window_d: 20              # ~4 trading weeks
    expanding_threshold_bn: 25    # net-liq 4w change > +$25bn -> expanding
    contracting_threshold_bn: -25

  cycle:
    curve_inversion_level: 0.0
    oas_range_lookback_d: 504     # 2y
    oas_low_third: 0.33
    oas_high_third: 0.67

  transition:
    weakening_flags: 2
    transitioning_flags: 3
    breadth_price:
      index_near_high_pct: 2.0    # index within 2% of 60d high
      high_window_d: 60
      breadth_drop_pts: 10        # %>50DMA falls >10pts
      breadth_drop_window_d: 20
    credit_equity:
      ret_window_d: 20
      oas_z_threshold: 1.0
    ratio_inflection:
      slope_window_d: 50
    confidence_decay_window_d: 10
    gex_flip_proximity_pct: 1.0   # spot within 1% of gamma flip

  sector_preferences:             # framework-preferred sectors per quad
    Q1: [XLK, XLC, XLY, QUAL]
    Q2: [XLE, XLF, XLI, XLB, IWM]
    Q3: [XLE, XLP, XLV, GC=F]
    Q4: [XLU, XLP, XLV, LQD]

  rs_ranking:
    benchmark: SPY
    momentum_windows: [20, 60]
    trend_window: 200
    percentile_lookback_d: 252

  confluence:                     # transparent checklist weights (sum path to 100)
    regime_aligned_risk_on: 25    # in current regime's preferred list + risk-on dial
    regime_aligned: 18
    regime_neutral: 8
    tape_leading: 25              # confirmed RS uptrend, not extended
    tape_improving: 15            # momentum up, trend unconfirmed (watch, don't buy)
    tape_weakening: 10
    tape_lagging: 4
    tape_extended: 12             # leading but stretched
    tech_above200: 10
    tech_above50: 7
    tech_macd: 5
    tech_rsi_sweet: 8             # rsi in the healthy-trend zone
    tech_rsi_ok: 4
    rsi_sweet_lo: 45
    rsi_sweet_hi: 70
    rsi_overbought: 75
    crowding_soft_pctile: 85
    crowding_soft_penalty: 5
    crowding_hard_pctile: 92
    crowding_hard_penalty: 10

# -----------------------------------------------------------------------------
# Alerts (Phase 3 — rules defined now, wired after validation checkpoint)
# -----------------------------------------------------------------------------
alerts:
  transition_state_change: true
  axis_confidence_floor: 0.3
  sector_rs_percentile_hi: 90
  sector_rs_percentile_lo: 10
  holdings_active_change_pct: 20
  holdings_active_change_days: 5
  net_liquidity_roc_sign_flip: true
  hy_oas_1d_widening_z: 2.5
  gex_flip_cross: true

notify:
  telegram:
    enabled: true                 # needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID secrets
  discord:
    enabled: false                # needs DISCORD_WEBHOOK_URL secret

validation:
  start_date: "2007-01-01"
  whipsaw_max_days: 10            # regime lasting < this counts as whipsaw
  whipsaw_target_pct: 15
  forward_return_window_d: 60

# -----------------------------------------------------------------------------
# Bitcoin Vector signal engine (Phase 2). Architecture reverse-engineered from
# Swissblock's published panels — see research/VECTOR_SIGNAL_RECON.md.
# Components are VOTE ENSEMBLES (mean of -1/0/+1 votes) and saturating
# composites; every band's forward-return record is measured by
# scripts/calibrate_vector.py and shipped to tooltips.
# -----------------------------------------------------------------------------
vector:
  momentum:                       # vote ensemble -> [-1,+1]; their ±0.5 = triggers
    smooth_days: 3
    rsi_bull: 55
    rsi_bear: 45
    votes:                        # name: weight (mean is weight-normalized)
      ema_trend: 1.0              # close vs EMA50 & EMA50 slope
      ema_cross: 1.0              # EMA20 vs EMA50
      macd_hist: 1.0
      sma200: 1.0
      roc20: 1.0
      rsi_zone: 1.0
      sopr_momentum: 1.0          # SOPR 7d EMA vs 1.0 (selling pressure)
      sth_cost_basis: 1.0         # close vs STH realized price (2022->)
    trigger: 0.5                  # enter bull/bear at ±trigger
    exit: 0.25                    # hysteresis: stay in state until score falls back past ±exit
    confirm_days: 3               # cross must hold N days before regime flip

  risk:                           # saturating composite -> 0..100, threshold 25
    threshold: 25                 # enter high-risk at 25
    exit_threshold: 15            # hysteresis: drop back to low-risk only below 15
    deadband: 0.10                # raw stress below this maps to 0 (their pin-at-zero)
    vol_window_d: 30
    vol_pctile_lookback_d: 730
    drawdown_window_d: 90
    drawdown_full_stress: 0.30    # dd >= 30% from 90d high -> stress 1.0
    sopr_ema_d: 7
    etf_flow_sum_d: 7
    weights:
      vol_pctile: 1.0
      drawdown: 1.0
      sopr_stress: 1.0            # SOPR<1 depth
      interday_ratio: 0.75        # interday vs intraday vol split (Key Risk Elements)
      momentum_deterioration: 0.75
      etf_outflow: 0.5            # 2024-> only
      funding_stress: 0.5
    oscillator_delta_d: 10        # Risk Oscillator = 0.5 + bounded d(risk)/dt
    oscillator_scale: 30          # risk pts per 10d that map to ±0.5

  bfi:                            # Bitcoin Fundamental Index, bands 40/60
    growth_mom_d: 30              # active-address momentum window
    growth_base_d: 365
    pctile_lookback_d: 730
    liq_components_sum_d: 30      # realized-cap delta, stablecoin delta, etf flows
    smooth_d: 14
    band_lo: 40
    band_hi: 60

  structure:                      # structure-shift oscillator [-1,+1]
    swing_window_d: 20
    breakout_lookback_d: 60
    confirm_days: 3
    trigger: 0.5
    exit: 0.25

  gauges:
    vol_low_pctile: 0.30          # below -> Low; above high -> High; between = Sweet spot
    vol_high_pctile: 0.75
    flow_low_pctile: 0.30
    flow_high_pctile: 0.75

  environment:
    bull_min_momentum: 0.0        # mid-term env = trend + momentum sign
    prob_lookback: all            # 7d/3d probabilities from full-history base rates
    scenario_atr_d: 14
    scenario_atr_mult: 1.5

  allocation:                     # strategy grids on (momentum, risk)
    variants:
      conservative: {mom_full: 0.6, risk_full: 15, mom_half: 0.5, risk_half: 25}
      moderate:     {mom_full: 0.5, risk_full: 25, mom_half: 0.0, risk_half: 40}
      aggressive:   {mom_full: 0.3, risk_full: 40, mom_half: -0.2, risk_half: 60}
      optimal:      {mom_full: 0.5, risk_full: 25, mom_half: 0.0, risk_half: 50}  # re-tuned by calibration sweep
    confirm_days: 2               # whipsaw guard on allocation changes

  btc_vs_alts:
    rs_window_d: 30               # relative-strength window across BTC/ETH/alts
    confirm_days: 3

  tactical:
    efficiency_window_d: 30       # |net move| / sum(|daily moves|): high = trending
    strategic_min_efficiency: 0.35
    strategic_max_risk: 40

  calibration:
    start_date: "2015-01-01"      # price-signal backtests (Yahoo BTC 2014-09->)
    split_date: "2021-01-01"      # split-half robustness boundary
    forward_days: [7, 30, 90]
    whipsaw_max_days: 7
    whipsaw_target_pct: 15
