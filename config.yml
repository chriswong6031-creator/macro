# =============================================================================
# Macro Regime & Sector-Flow Dashboard — master configuration
# ALL tunables live here. Nothing is hardcoded in /collectors or /engine.
# =============================================================================

# ---------------------------------------------------------------------------
# llm_models — version-pinned model IDs (§2.4, P5, W5).
# ALL hardcoded model literals in engine/* must read from here.
# Datestamped IDs pin the model version; drift monitor re-scores on any change.
# Three tiers:
#   reasoning   — highest-capability; Opus or DeepSeek-Reasoner; used for the
#                 altdata_brain committee call (per-cluster thesis).
#   extraction  — mid-tier; used for qual_extraction.v1 8-K structured extraction
#                 and catalyst_tone digest.  Haiku or DeepSeek-Flash.
#   classify    — cheapest; used for news_llm batch summaries, tag labeling.
#                 Haiku or DeepSeek-Chat.
# ---------------------------------------------------------------------------
llm_models:
  reasoning:  "claude-opus-4-8"                  # altdata_brain committee thesis
  extraction: "claude-haiku-4-5"                 # qual_extraction.v1 8-K lane + catalyst_tone
  classify:   "claude-haiku-4-5"                 # news_llm batch summaries + tag labels

storage:
  data_dir: data
  holdings_dir: data/holdings
  archive_dir: data/archive
  site_dir: site
  reports_dir: reports
  run_status_file: data/run_status.json

signal_sanity:
  # Output-board correctness tripwire (engine/signal_sanity.py + scripts/signal_sanity.py):
  # validates the per-ticker boards both books select from. Default = WARN (annotate +
  # report + notify); opt-in block-mode (Actions var SIGNAL_SANITY_BLOCK=true) can gate
  # the daily commit. Complements the collect-time INPUT audit (run_quality_audits).
  stale_days: 5          # board as_of older than now by this many days → warn (absolute)
  rel_stale_days: 2      # board lags the freshest sibling by this many days → warn (relative)
  max_drift_pct: 0.5     # primary-score mean moved > this fraction vs prior vintage → warn
  min_pop: 8             # min records in a subset before judging a column degenerate
  require_all: true      # a missing required board is a hard failure
  baseline_file: signal_sanity/baseline.jsonl   # rolling per-vintage stats (under data/)
  # coverage floors — below these a board is almost certainly broken. NOTE: standouts is
  # a BUY-board whose count is market-volatile (~25-60), so its floor is a genuine-break
  # threshold (near-empty), not a "healthy day" count.
  floors:
    standouts: 10
    briefing: 8
    radar: 40
    altdata: 8
    news: 100
    intel_hub: 8

# -----------------------------------------------------------------------------
# Collectors
# -----------------------------------------------------------------------------
# Quiver Quantitative alternative-data API (Trader plan). Token via QUIVER_API_KEY.
# Cross-sectional event feeds (congress/insider/contracts/lobbying/off-exchange/
# flights/patents/13F/CNBC/social/Trump trades) -> data/quiver/*.parquet -> the
# Alternative Data desk (engine/altdata.py) + the brain feed (site/altdata/feed.json).
quiver:
  base_url: https://api.quiverquant.com
  timeout: 60
  retries: 3

# TrumpFlow latent-stake entity graph. The graph is deterministic (curated
# data/trumpflow/intel.json). `extract` gates the OPTIONAL LLM edge-extractor
# (engine/trumpflow/extract.py) that proposes candidate edges from the Quiver news feed
# — default OFF so it never incurs LLM cost without opt-in; needs DEEPSEEK_API_KEY.
trumpflow:
  extract: false
fred:
  # group -> {series_id: column_name}. Stored one parquet per series under data/fred/.
  api_url: https://api.stlouisfed.org/fred/series/observations
  csv_url: https://fred.stlouisfed.org/graph/fredgraph.csv   # keyless fallback
  retries: 4
  backoff_base_s: 3
  # ALFRED point-in-time vintages (collectors.fred.fetch_vintages). Stores the
  # INITIAL RELEASE per period (output_type=4) into data/fred_vintage/vintages.parquet
  # so a macro backtest can read what was knowable on a date via as_of_series(),
  # not the latest-revised value. Additive — the live regime engine is unchanged.
  # Needs FRED_API_KEY (fredgraph has no vintages). vintage_series defaults to the
  # revision-prone set in collectors/fred.py:DEFAULT_VINTAGE_SERIES; override here.
  vintage_realtime_start: "1997-01-01"   # FRED's real-time archive begins ~1997
  # Point-in-time set: DEFAULT_VINTAGE_SERIES (collectors/fred.py) PLUS the revision-
  # prone business-cycle hard-data legs, so a FRED_API_KEY run (CI) auto-upgrades the
  # recession backtest to full point-in-time. Market/rate legs (MPRIME, USREC) are not
  # revised and stay out. NFCI family stays out (re-revises all history, API times out).
  vintage_series: [PAYEMS, INDPRO, M2SL, WEI, GDPNOW, RECPROUSM156N, THREEFYTP10,
    SAHMREALTIME, STICKCPIM157SFRBATL, CORESTICKM157SFRBATL, FLEXCPIM157SFRBATL,
    MEDCPIM158SFRBCLE, STLFSI4, UMCSENT, MICH,
    AWHMAN, ICSA, PERMIT, NEWORDER, W875RX1, CMRMTSPL, UEMPMEAN, ISRATIO, BUSLOANS, CUSR0000SAS,
    # base-effect inflation levels (engine/base_effect.py) — absent from the store per
    # scripts/audit_alfred_depth.py; a keyed collect run backfills them so the base-effect
    # inflation legs upgrade from latest-revision (revised=True) to point-in-time.
    CPIAUCSL, CPILFESL, PCEPILFE, PCEPI, PPIFIS,
    # W3a: bottleneck/power series for the PIT foresight cascade backtest (§3.3).
    # ALFRED vintage coverage for NAICS-detail CAPUTLG/PPI series is plausible but
    # unverified — some detail series have short or no vintage history. On a keyed
    # collect run these land and upgrade the Wave 3a replay from latest-revised
    # (look-ahead-contaminated, labeled) to genuine point-in-time. If ALFRED has no
    # vintage history for a given series it simply returns empty and the backtest
    # falls back to the latest-revised truncated path, labeled `pit: false`.
    # Large-matrix ALFRED warning (see comment above): these are monthly series with
    # ~1 initial-release row per period — bounded, no timeout risk. Economy-wide legs
    # (MNFCTRIRSA, AMTMUO, AMTMVS) are already partially covered above (ISRATIO,
    # NEWORDER) but repeated here for completeness and explicit backtest labeling.
    CAPUTLG3344S, CAPUTLG334S, CAPUTLG331S,
    MNFCTRIRSA, AMTMUO, AMTMVS,
    PCU334413334413, PCU331110331110,
    IPG2211S, CAPUTLG2211S, WPU0543,
    # MRI-PR-A: release-intel legs promoted to PIT vintage (monthly, bounded ~1 row/period).
    # UNRATE + RSAFS: promoted from macro_surprise.py ad-hoc fetches to collected PIT.
    # JTSJOL: JOLTS job openings — labor-context leg for the NFP bridge.
    # ADPMNUSNERSA: ADP monthly SA total-private payrolls; ALFRED vintages available;
    #   note 2022 methodology redesign (Moody's Analytics collaboration) which re-revised
    #   the full history — backtest era-splits at 2022 boundary per MRI-R9.
    UNRATE, RSAFS, JTSJOL, ADPMNUSNERSA]
  series:
    rates:
      DGS2: us2y
      DGS10: us10y
      T10Y2Y: spread_2s10s
      DFII10: us10y_real
      T10YIE: breakeven_10y
      T5YIFR: breakeven_5y5y
      DFF: fed_funds
    credit:
      BAMLH0A0HYM2: hy_oas        # rolling 3y window on FRED since Apr 2026 — cache forever
      BAMLC0A0CM: ig_oas          # same caveat
      BAMLEMCBPIOAS: em_oas       # ICE BofA EM corporate OAS — EM/RORO risk leg (Forex Vector)
      BAMLHYH0A0HYM2TRIV: hy_total_return   # ICE BofA US HY TOTAL-RETURN index (1986->); engine.total_return.hy_tr auto-upgrades to it for a deeper Credit-Carry backtest
    risk:
      VIXCLS: vix_close
      OVXCLS: ovx_oil             # CBOE oil VIX (2007->); energy-sector VRP leg (index_direction)
    housing:
      MORTGAGE30US: mortgage_30y  # 30y mortgage rate (weekly, 1971->); homebuilder affordability leg
      CSUSHPISA: case_shiller_sa  # Case-Shiller national HPI SA (1987->, monthly) — W1.4 deep seed (housing 18y clock + falsifier tripwires)
      HOUST: housing_starts       # housing starts SAAR (1959->, monthly) — W1.4 housing falsifier leg (audit NP-6: only PERMIT was collected)
    energy_cycles:                # W1.4 flagship-cycle spot levels (masterplan D3) — no dividend-basis issues
      DCOILWTICO: wti_crude       # WTI spot (1986->, daily) — oil-cycle tape
      DHHNGSP: henry_hub_spot     # Henry Hub spot (1997->, daily) — nat-gas-cycle tape
    dollar:
      DTWEXBGS: broad_dollar      # broad trade-weighted USD (2006->); better commodity driver than DXY for copper/oil (EM/China weight)
    liquidity:
      WALCL: fed_balance_sheet    # weekly (Wed), $ millions
      RRPONTSYD: on_rrp           # daily, $ billions
      M2SL: us_m2                 # US M2 broad money ($bn, monthly) — global-M2 leg
      ECBASSETSW: ecb_assets      # ECB total assets (€ millions, weekly) — global-CB liquidity leg
      JPNASSETS: boj_assets       # BoJ total assets (¥100M, monthly) — global-CB liquidity leg
    econ_confirm:
      PAYEMS: payrolls            # monthly, thousands
      INDPRO: industrial_prod     # monthly, index
    labor:                        # high-frequency real-activity LABOR nowcast (research/REAL_ACTIVITY_NOWCAST.md)
      ICSA: initial_claims        # weekly initial jobless claims (SA, level) — the leading labor signal
      IC4WSA: initial_claims_4wk  # 4-week MA (the smoothed read used for trend)
      CCSA: continued_claims      # weekly continued claims (insured unemployment) — confirms
      IHLIDXUS: indeed_postings   # Indeed Hiring Lab job-postings index (Feb-1-2020=100) — labor DEMAND
      IHLIDXNEWUS: indeed_new_postings  # NEW postings only (the more-leading variant)
      # NOTE: the Indeed series are copyrighted; FRED states pre-approval is required to
      # USE/redistribute them. Pulled here for PRIVATE dashboard use only — do not publish.
    # All free on FRED; feed engine/conditions.py + the growth/inflation axes.
    conditions:                   # Financial-conditions indices (Chicago/StL Fed)
      NFCI: nfci                  # National Financial Conditions Index (weekly; +=tight)
      ANFCI: anfci                # Adjusted NFCI (orthogonal to the business cycle)
      NFCIRISK: nfci_risk         # risk subindex (vol + credit spreads)
      NFCICREDIT: nfci_credit     # credit subindex
      NFCILEVERAGE: nfci_leverage # leverage subindex (debt + equity)
      STLFSI4: stlfsi             # St. Louis Fed Financial Stress Index (weekly)
    funding_stress:               # commercial-paper credit/funding stress (engine/conditions.systemic_stress)
      RIFSPPNAAD90NB: aa_cp_90d   # 90d AA nonfinancial CP rate (top tier)
      RIFSPPNA2P2D90NB: a2p2_cp_90d  # 90d A2/P2 nonfinancial CP rate (lower tier); A2/P2 spread = a2p2 - aa
    recession:                    # forward + concurrent recession reads
      SAHMREALTIME: sahm          # real-time Sahm rule (>=0.50 => recession underway)
      RECPROUSM156N: recession_prob   # Chauvet-Piger smoothed recession probability (%)
      THREEFYTP10: term_premium_10y   # NY Fed ACM 10y term premium (low/neg => curve inverts w/o recession)
    nowcast:                      # real-time GROWTH nowcasts (lead the lagging PAYEMS/INDPRO)
      GDPNOW: gdpnow              # Atlanta Fed GDPNow (quarterly SAAR, refreshed intra-quarter)
      WEI: wei                    # Weekly Economic Index (Lewis-Mertens-Stock; weekly, YoY-scaled)
    inflation_nowcast:            # underlying-inflation (persistent vs transitory split)
      STICKCPIM157SFRBATL: sticky_cpi      # Atlanta sticky-price CPI index (persistent)
      CORESTICKM157SFRBATL: core_sticky_cpi
      FLEXCPIM157SFRBATL: flex_cpi         # flexible-price CPI index (transitory)
      MEDCPIM158SFRBCLE: median_cpi        # Cleveland median CPI (1m annualized %)
    # --- Official inflation RELEASES (research/RATE_INFLATION_TRANSMISSION.md) -----
    # The actual prints (not the Atlanta/Cleveland model nowcasts above): headline &
    # core CPI, headline & core PCE (the Fed's TARGET is core PCE), PPI, ECI wage
    # growth, plus the shelter / core-services decomposition that drives the
    # disinflation debate. All are index LEVELS — engine/inputs.py derives YoY/MoM.
    # All revision-prone → added to the ALFRED vintage matrix (collectors/fred.py
    # DEFAULT_VINTAGE_SERIES) so point-in-time backtests read what was knowable.
    inflation_releases:
      CPIAUCSL: headline_cpi      # CPI-U all items, SA index (the headline print)
      CPILFESL: core_cpi          # CPI less food & energy, SA (core CPI)
      PCEPI: headline_pce         # PCE price index, SA (headline PCE)
      PCEPILFE: core_pce          # PCE less food & energy — the FOMC's 2% target gauge
      PPIFIS: ppi_final_demand    # PPI final demand, SA (pipeline / margin pressure)
      PPIFES: ppi_core            # PPI final demand less foods & energy (core PPI)
      ECIALLCIV: eci_comp         # Employment Cost Index, total comp (quarterly, SA) — wage inflation
      ECIWAG: eci_wages           # ECI wages & salaries (quarterly, SA)
      CUSR0000SASLE: cpi_core_services  # CPI services less energy (the "core services" / sticky leg)
      CUSR0000SAH1: cpi_shelter   # CPI shelter (the lagging rent component vs core services)
    inflation_expectations:       # the market / survey / MODEL expectations triangle
      # Market = breakevens (T5YIE/T10YIE/T5YIFR, in rates/inflation_extra above);
      # Survey = UMich MICH (below). MODEL = Cleveland Fed expected-inflation curve.
      EXPINF1YR: infl_exp_1y      # Cleveland model 1y expected inflation (%)
      EXPINF5YR: infl_exp_5y      # Cleveland model 5y expected inflation (%)
      EXPINF10YR: infl_exp_10y    # Cleveland model 10y expected inflation (%)
    survey:                       # consumer sentiment / household inflation expectations
      UMCSENT: umich_sentiment    # UMich consumer sentiment (monthly)
      MICH: umich_infl_exp        # UMich 1y inflation expectations (%)
    curve:                        # fuller Treasury curve (engine only sampled 2y/10y)
      DGS3MO: us3m                # the short leg of the NY Fed recession spread
      DGS6MO: us6m
      DGS5: us5y
      DGS30: us30y
      T10Y3M: spread_10y3m        # exact spread the NY Fed probit uses
    inflation_extra:              # 5y inflation leg (second-tenor real-yield anchor)
      T5YIE: breakeven_5y
      DFII5: us5y_real
    # --- Bonds & bond-health dashboard (research/BOND_HEALTH_DASHBOARD.md) --------
    # All free/daily on FRED. The fuller curve feeds the near-term-forward recession
    # read; Moody's DBAA/DAAA give DEEP-history credit (the ICE BofA BAML* series are
    # truncated to a ~3y rolling window on FRED since Apr 2026); IORB/SOFR99 are the
    # funding-plumbing early-warning legs.
    bonds_extra:
      DGS1: us1y                  # 1y CMT — interpolation node for the near-term forward spread
      DGS3: us3y                  # curve fill (butterfly / chart)
      DGS7: us7y
      DBAA: baa_corp              # Moody's Baa corporate yield (daily, 1986->) — deep-history credit
      DAAA: aaa_corp              # Moody's Aaa corporate yield (daily) — Baa-Aaa = the deep credit gauge
      BAMLH0A3HYC: ccc_oas        # CCC & lower OAS — the distress tail (ICE BofA; ~3y rolling, cache forever)
      IORB: iorb                  # interest on reserve balances — the SOFR-IORB plumbing anchor
      SOFR99: sofr_99             # 99th-pctile SOFR — a repo-stress spike gauge
      USRECD: us_recession        # NBER recession indicator (daily) — calibration target ONLY (not in live frame)
    # --- Fed policy path (research/DATA_SIGNAL_EXPANSION_2026.md #2) — DISPLAY-ONLY -
    # The FOMC dot-plot median + the live target range. DISPLAY / LLM-context only —
    # the path LEVEL is a price and repricing is reactive, so there is NO scored leg
    # and NO MRS entry. Pairs with the keyless ZQ/SR3 futures implied path
    # (collectors/rate_futures.py) on bonds.html. FRED is unreachable from the build
    # sandbox (live CI fetches fine) → engine/fed_path.py degrades gracefully.
    fed_path:
      FEDTARMD: fed_dot_median    # FOMC SEP median projection of the fed funds rate (year-end, % annual; quarterly)
      DFEDTARU: fed_target_upper  # fed funds target range — UPPER limit (daily, 2008-12->)
      DFEDTARL: fed_target_lower  # fed funds target range — LOWER limit (daily)
    # --- Business-cycle model (research/BUSINESS_CYCLE_MODEL.md) — Conference-Board
    # style Leading / Coincident / Lagging tiers. All free on FRED (keyless CSV OK).
    # PAYEMS+INDPRO reused from econ_confirm; SPY (yahoo), spread_10y3m (curve),
    # hy_oas (credit) and umich_sentiment (survey) are reused leading legs too, so
    # only the genuinely-missing components are declared here.
    cycle_leading:
      AWHMAN: mfg_hours             # avg weekly hours, manufacturing (leads hiring/firing)
      ICSA: initial_claims          # initial jobless claims (weekly; INVERTED in engine)
      PERMIT: building_permits      # new private housing units authorized (thousands)
      NEWORDER: cap_goods_orders    # new orders, nondefense capital goods ex-aircraft ($M)
    cycle_coincident:
      W875RX1: real_income_ex_transfer  # real personal income less transfer payments ($bn)
      CMRMTSPL: mfg_trade_sales         # real manufacturing & trade industries sales ($M)
    cycle_lagging:
      UEMPMEAN: unemp_duration      # avg (mean) duration of unemployment, weeks (INVERTED)
      ISRATIO: inventory_sales      # total business inventories-to-sales ratio (INVERTED)
      BUSLOANS: ci_loans            # commercial & industrial loans ($bn)
      MPRIME: prime_rate            # bank prime loan rate (%)
      CUSR0000SAS: cpi_services     # CPI for services (lagging-inflation leg)
    cycle_truth:
      USREC: nber_recession         # NBER recession indicator (1=recession) — validation ground truth
    # --- Forex Vector (research/FOREX_DASHBOARD.md) — all keyless via FRED ---------
    fx_rates:                     # daily FX reference rates (H.10) — cross-check + deep history
      DEXUSEU: fx_eur_usd         # USD per EUR  (EUR base, NOT inverted)
      DEXJPUS: fx_jpy_usd         # JPY per USD  (invert for JPY-vs-USD)
      DEXUSUK: fx_gbp_usd         # USD per GBP
      DEXUSAL: fx_aud_usd         # USD per AUD
      DEXCAUS: fx_cad_usd         # CAD per USD  (invert)
      DEXSZUS: fx_chf_usd         # CHF per USD  (invert)
      DEXMXUS: fx_mxn_usd         # MXN per USD  (invert)
      DEXBZUS: fx_brl_usd         # BRL per USD  (invert)
      DEXCHUS: fx_cny_usd         # CNY per USD  (invert; onshore)
    fx_dollar_legs:               # broad-dollar advanced/EM split (master tile)
      DTWEXAFEGS: broad_dollar_afe
      DTWEXEMEGS: broad_dollar_eme
    fx_rates_short:               # short/policy rates -> carry differential vs US (DFF).
      DTB3: us3m                  # piecewise-constant => monthly cadence + ffill is correct
      SOFR: sofr
      ECBDFR: ez_short            # ECB deposit facility (daily, current)
      ECBMRRFR: ez_mrr
      IRSTCI01JPM156N: jp_short   # Japan immediate/call rate (monthly)
      IR3TIB01AUM156N: au_short   # 3m interbank (monthly)
      IR3TIB01GBM156N: gb_short
      IR3TIB01CAM156N: ca_short
      IR3TIB01CHM156N: ch_short
    fx_rates_long:                # 10y govt yields -> term/real-rate differential (Phase 3)
      IRLTLT01EZM156N: ez_10y
      IRLTLT01JPM156N: jp_10y
      IRLTLT01GBM156N: gb_10y
      IRLTLT01AUM156N: au_10y
      IRLTLT01CAM156N: ca_10y
      IRLTLT01CHM156N: ch_10y
    fx_reer:                      # BIS broad real effective exch rates -> value (Phase 3); monthly, lagged
      RBUSBIS: reer_us
      RBXMBIS: reer_ez
      RBJPBIS: reer_jp
      RBGBBIS: reer_gb
      RBAUBIS: reer_au
      RBCABIS: reer_ca
      RBCHBIS: reer_ch
      RBMXBIS: reer_mx
      RBBRBIS: reer_br
      RBCNBIS: reer_cn
    bottleneck:                   # supply-chain / capacity-cycle nowcast (engine/bottleneck.py;
      # research/THEMATIC_FORESIGHT_DESK.md T1). Physical-tightness legs: cap-U high+rising,
      # inv/sales falling, unfilled-orders/shipments rising, industry PPI accelerating,
      # regional-Fed delivery-times & prices-received. Per-NAICS where a clean series exists;
      # economy-wide context otherwise. All keyless-CSV reachable; all live-verified.
      TCU: cap_u_total            # capacity utilization, total index
      MCUMFN: cap_u_mfg           # cap-U manufacturing (NAICS)
      CAPUTLG3344S: cap_u_semi    # cap-U semis & electronic component (NAICS 3344) — the HBM bucket
      CAPUTLG334S: cap_u_electronics  # cap-U computer & electronic product (NAICS 334)
      CAPUTLG331S: cap_u_metal    # cap-U primary metal (NAICS 331) — steel/aluminium/copper
      CAPUTLG211S: cap_u_oilgas   # cap-U oil & gas extraction (NAICS 211)
      IPG3344S: ip_semi           # industrial production, semis (NAICS 3344)
      CAPG3344S: capacity_semi    # industrial capacity LEVEL, semis (production>capacity = squeeze)
      ISRATIO: inv_sales_total    # total business inventories/sales (the headline)
      MNFCTRIRSA: inv_sales_mfg   # manufacturing inventories/sales
      AMTMUO: unfilled_orders     # mfrs' unfilled orders, total mfg — the backlog headline
      AMTMVS: shipments_total     # value of shipments, total mfg (backlog denominator)
      DGORDER: new_orders_durable # new orders, durable goods (headline)
      NEWORDER: new_orders_capex  # new orders, nondefense cap goods ex-aircraft (capex proxy)
      PCU334413334413: ppi_semi   # PPI semiconductor & related device mfg (the memory pricing proxy)
      PCU331110331110: ppi_steel  # PPI iron & steel mills
      DTCISA156MSFRBPHI: deliv_time_philly  # Philly Fed current delivery time, % increases
      DTMUAMFRBDAL: deliv_time_dallas       # Dallas Fed current delivery time diffusion
      PFGIUAMFRBDAL: prices_recv_dallas     # Dallas Fed prices received (pricing-power leg)
    power:                        # electricity scarcity for the POWER cluster (engine/power_scarcity.py;
      # the physical correlate the semis/metals bottleneck can't give data-center-power / grid /
      # nuclear / solar). Keyless FRED; engine uses the first candidate per leg that resolves.
      IPG2211S: ip_electric_power     # IP: electric power generation (NAICS 2211) — demand/output
      IPG2211A2N: ip_electric_power_alt  # IP: electric power alt id (NAICS 2211, annual; engine fallback)
      IPUTIL: ip_utilities            # IP: utilities (broader fallback)
      CAPUTLG2211S: cap_u_utilities   # cap-U electric power generation
      CAPUTLG2211A2S: cap_u_utilities_alt  # cap-U electric power alt id (engine fallback)
      # CAPUTLGMFS: cap_u_mfg_fs     # (non-existent on FRED — 404; kept as comment for audit trail)
      WPU0543: ppi_electric_power     # PPI: electric power
      PCU221122221122: ppi_electric_power_alt  # PPI: electric power alt id (engine fallback)
      APU000072610: price_electricity # avg retail electricity price (US city avg, per kWh)
    # --- Release Intelligence data spine (MRI-PR-A) ----------------------------
    # Legs for the CPI nowcast and NFP labor bridge (engine/release_forecast.py, PR-B).
    # All keyless-CSV reachable; added to vintage_series above so nightly fetches
    # initial-release ALFRED vintages (PIT-correct inputs per MRI-R6).
    release_intel:
      GASREGW: gasoline_regular_weekly  # weekly retail gasoline (US avg, $/gal) — CPI energy leg
      JTSJOL: jolts_openings            # JOLTS job openings (monthly, thousands SA) — labor context
      ADPMNUSNERSA: adp_payrolls        # ADP national employment, monthly SA total-private (PERSONS,
                                        # ~132M level — divide by 1000 for conventional thousands);
                                        # 2022 methodology redesign re-revised full history; era-split at 2022
      UNRATE: unemployment_rate         # unemployment rate (monthly, %) — promoted from macro_surprise ad-hoc
      RSAFS: retail_sales               # advance retail & food services sales (monthly, $M SA) — promoted from macro_surprise ad-hoc
  retries: 3
  backoff_base_s: 5
  batch_size: 80
  # All EOD adjusted closes, one parquet per ticker under data/yahoo/.
  tickers:
    sectors: [XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY]
    extras: [SMH, IWM, RSP, SPY, QQQ, "^DJI", "^RUT", IJH,   # ^RUT = true Russell 2000 index level; IJH = S&P MidCap 400 (mid-cap leg of the size spectrum)
             SOXX, IGV, XBI, IBB, GDX, GDXJ, KRE, KBE, ITB, XHB, XME, XOP, OIH, XRT, TAN]  # deep-history thematic ETFs (directional model — narrow purer-driver exposures)
    style: [IWF, IWD]             # Russell 1000 Growth / Value — style-rotation read (growth vs value leadership)
    factors: [MTUM, QUAL, USMV, SPHB, SPLV]
    ipo: [IPO, FPX]               # Renaissance IPO ETF + First Trust IPOX — aftermarket new-issue basket reality-check (IPO Radar; the "buy IPOs in the secondary market" trade)
    credit: [HYG, LQD]
    bond_etfs: [TLT, IEF, TIP, EMB]   # Bonds dashboard price/flow proxies: long UST, 7-10y UST, TIPS, EM USD sov
    intl_etfs: [FXI,                   # China large-cap (US-hours) — factor-exposure China proxy + holding
                KWEB,                  # KraneShares CSI China Internet (2013->) — offshore internet cohort; onshore/offshore divergence axis
                MCHI,                  # iShares MSCI China (2011->) — broad China offshore benchmark
                ASHR,                  # Xtrackers CSI 300 China A-Shares (2013->) — onshore A-share price discovery; divergence axis anchor
                CQQQ,                  # Invesco China Technology (2009->) — tech-heavy offshore; pre-KWEB era coverage
                GXC]                   # SPDR S&P China (2007->) — longest-history offshore; broadest sector coverage
    country_etfs: [EWG, EWU, EWQ, EWL, EWP, EWI, EWN, EWD,   # World Market Cycles (intl_cycles.html) — USD single-country iShares MSCI ETFs, most back to 1996
                   EWJ, EWA, EWH, EWS, EWC,
                   INDA, EWT, EWY, EIDO, EWZ, EWW, ECH, EZA, TUR, EPOL,
                   EFA, EEM, VGK, VPL, AAXJ, ILF, VXUS]       # + regional/bloc aggregates: Dev ex-US, EM, Europe, Pacific, Asia-xJP, LatAm, All-World ex-US
    vol: ["^VIX", "^VIX9D", "^VIX3M", "^MOVE", "^VVIX"]   # ^VVIX = vol-of-vol (option-implied risk layer)
    fx_commod: ["DX-Y.NYB", "CL=F", "HG=F", "GC=F", "SI=F", "BZ=F"]
    fx: ["EURUSD=X", "USDJPY=X", "GBPUSD=X", "AUDUSD=X", "USDCAD=X", "USDCHF=X", "USDMXN=X", "USDBRL=X", "CNH=X", "CNH=F"]   # Forex Vector spot pairs; CNH=F = offshore CNH futures (2013->, real history vs CNH=X spot's 1 row)
    rate_pricing: ["ZQ=F"]        # 30-day fed funds front contract — LOW CONFIDENCE input
    crypto: [BTC-USD, ETH-USD, SOL-USD]   # deep daily history (BTC 2014->); Coinbase = intraday-quality OHLC
    crypto_fut: ["BTC=F"]                 # CME (regulated) Bitcoin front-month future -> institutional carry / basis (D-vec-CME; daily 2021->)

treasury:
  base_url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
  tga_endpoint: /v1/accounting/dts/operating_cash_balance
  debt_txn_endpoint: /v1/accounting/dts/public_debt_transactions
  # DTS "Deposits and Withdrawals of Operating Cash" (Table II): the daily withheld
  # income & employment taxes deposit ($mn) = a real-time wage/income proxy that
  # leads payrolls and is near-impossible to game. Same keyless API as the TGA.
  deposits_endpoint: /v1/accounting/dts/deposits_withdrawals_operating_cash
  withheld_tax_catg: "Taxes - Withheld Individual/FICA"
  page_size: 10000
  retries: 3

cboe:
  # put/call is COMPUTED from delayed chains (official stats CSVs moved behind
  # an SPA in 2025/26); chain_url's _SPX is templated per underlying
  chain_url: https://cdn.cboe.com/api/global/delayed_quotes/options/_SPX.json
  retries: 3
  # SKEW = option-implied tail/crash pricing (CBOE CDN serves a clean daily CSV
  # back to 1990 — no API key). Used by engine/conditions.py as a tail-risk gauge.
  skew_url: https://cdn.cboe.com/api/global/us_indices/daily_prices/SKEW_History.csv
  # VVIX = vol-of-vol (implied vol of VIX options), keyless daily CSV back to 2006/2007.
  # One fetch carries the whole history (backfill + accrual in one shot). Feeds the
  # engine/vol_regime VVIX-VIX decoupling / peak-fear leg (retires the short yahoo _VVIX).
  vvix_url: https://cdn.cboe.com/api/global/us_indices/daily_prices/VVIX_History.csv
  # VIX-futures settlement (collectors/cboe_vix_futures.py): one keyless CSV/date via the
  # www endpoint serves the FULL VX board. We persist both the front contract (sanitizer)
  # and the standard-monthly M1..M6 curve (vix_curve) — the latter FORWARD-ACCRUING only
  # (no bulk history), so curve slope/carry validates in ~12 months. Defaults live in code:
  # vix_backfill_days=45, vix_recent_days=6, vix_request_pace_s=0.4.
  gex:
    contract_multiplier: 100
    pct_move: 0.01               # GEX expressed per 1% move
    strike_window_pct: 0.25      # ignore strikes >25% from spot
    max_expiry_days: 365

polygon:
  # Polygon.io / massive.com options-OI accrual (GEX FOUNDATION) — the per-strike
  # open interest the free Cboe feed's history discards and that CANNOT be backfilled
  # (OI is point-in-time only). Snapshots the chain each day -> a raw per-strike store
  # so any dealer-gamma variant can be recomputed later from real OI. DISPLAY/RESEARCH
  # ONLY, never scored. Key = POLYGON_API_KEY (.env locally / Actions secret); the
  # plan is stocks+options entitled — index/futures/fx/crypto are NOT.
  base_url: https://api.polygon.io
  api_key_env: POLYGON_API_KEY
  retries: 3
  max_pages: 40                  # snapshot pagination cap per underlying (250/page)
  request_timeout: 60
  workers: 5                     # per-symbol snapshot concurrency (massive.com-safe ceiling
                                 # ~5-6; the broad universe is ~2 I/O calls/name, so threads
                                 # cut a ~16-min serial run to ~3-4 min). 1 => serial.
  gex:
    # ANCHORS — the index-ETF gamma backbone + mega-caps that must always be snapshot
    # (first 10 mirror collectors/cboe.DEFAULT_GEX_SYMBOLS so the two sources stay
    # comparable), plus the 15 sector/industry ETFs the Neural Web options_weather lobe
    # aggregates (OPTIONS_NW masterplan RO-1/W-B; also the W-E1 gauntlet universe).
    # Cost: ~15 roots × ~3 REST calls/day on the measured ~993/day vs ~14K ceiling
    # (options-alpha W1.4 probe) — trivial headroom. SPX excluded: index spot (I:SPX)
    # is not entitled.
    symbols: [SPY, QQQ, IWM, DIA, NVDA, AAPL, TSLA, AMD, META, MSFT,
              XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY,
              SMH, SOXX, XBI, KRE]
    # ALSO snapshot every ACTIVE single name in the thematic baskets we trade
    # (data/baskets/membership.json) so the per-name flow / positioning / GEX reads cover
    # the whole optionable set, not just the 10 anchors. Resolved by engine.options_universe.
    # Pure additional massive.com REST calls on the existing entitlement (NO new cost); the
    # daily raw-chain parquet (committed by build_polygon_gex) grows ~linearly with the
    # universe, so max_underlyings bounds storage/runtime. Set include_baskets:false to revert.
    include_baskets: true
    max_underlyings: 375         # safety cap (anchors kept first; +15 with the sector-ETF anchors so no basket name is evicted)
    strike_window_pct: 0.30      # keep contracts within +/-30% of spot (gamma lives here)
    max_expiry_days: 400         # ~13 months; covers the engine's 365d window + buffer
    contract_multiplier: 100
    pct_move: 0.01
    r: 0.043
  intraday:
    # Hourly US bars -> data/intraday/<T>.parquet (scripts/build_polygon_intraday),
    # shipped as site/intraday/<T>.json and aggregated to 4H client-side by chart.js;
    # also the raw store engine/bar_derive.py resamples to 2D/3D for the signal engine.
    # Universe = deep-history US names (data/stocks/*) + sector/factor ETFs. US-only.
    # APPEND-ONLY / KEY-DEDUPED: each run extends the per-ticker parquet (2-day overlap,
    # dedup on bar ts). HONEST FRESHNESS: the Polygon STANDARD plan is 15-MINUTE-DELAYED
    # (DELAYED_MIN in the collector, stamped to data/intraday/_meta.json) — NOT real-time.
    multiplier: 1
    timespan: hour
    lookback_days: 180           # cold-start window (no prior file); hourly cron passes --lookback-days 5
    sleep: 0.06                  # polite pacing between per-ticker aggregate calls
  # per-underlying dividend yields for the compute_gex summary (single names -> 0)
  div_yield: {SPY: 0.013, QQQ: 0.006, IWM: 0.013, DIA: 0.018}

live:
  # Live intraday overlay (display + Mastermind feed). It recomputes ONLY the cheap
  # price-sensitive "fast leaves" (technicals + a divergence check vs the nightly
  # anticipation cone) from a live last-price. The slow-brain scores
  # (regime / conviction / GTAA allocation) stay NIGHTLY by design — intraday noise
  # must not whipsaw a hysteresis-gated regime. Runs on a SEPARATE intraday cron,
  # never inside the ~45-min daily build. Graceful no-op when no quote source is
  # reachable: the overlay still emits, every leg marked stale, consumers fall back
  # to the nightly baseline. See scripts/build_live_overlay.py + engine/live_overlay.py.
  enabled: true
  poll_seconds: 60             # advisory cadence for the intraday cron / browser poll
  stale_after_min: 20          # a quote older than this is flagged stale (fall back to baseline)
  max_chg_pct: 35              # single-session |move| beyond this = bad print -> stale (limit-move guard)
  max_universe: 150            # cap the fast loop (rate limits + wall-clock)
  us_source: polygon           # polygon (entitled snapshot) -> yahoo spark fallback
  intl_source: yahoo           # yahoo spark (keyless) for CN/HK/CA/commodities/crypto
  # HONEST FRESHNESS — the Polygon STANDARD plan serves 15-MIN DELAYED snapshots, and
  # Yahoo spark is itself ~15-min delayed. So the whole overlay is DELAYED, never
  # "real-time": delayed_min is the vendor floor live.js shows ("≥15-min delayed") and
  # it suppresses the green "live" pulse. Set to 0 ONLY when a real-time/websocket plan
  # is live (see research/LIVE_DATA_POLYGON.md). feed_label is the human caption.
  delayed_min: 15
  feed_label: "≈15-min delayed (Polygon Standard / Yahoo)"
  top_conviction_n: 60         # also include the top-N US names by |conviction| from the search index
  universe_extra: []           # optional extra tickers beyond Mastermind assets + top US conviction
  market_context: [SPY, QQQ, "^VIX"]   # cheap live macro read emitted in overlay.market (VIX gets a band)
  # The deployed Cloudflare Worker the browser live.js calls (worker/quotes.worker.js).
  # Empty string = no Worker; live.js then falls back to the static snapshot below.
  # Override without a commit via the GitHub repo VARIABLE LIVE_QUOTES_WORKER_URL.
  quotes_worker_url: ""
  # SAME-ORIGIN live path (China-safe): live.js fetches quotes.json relative to the
  # page, so it comes from the serving origin — NOT raw.githubusercontent.com, which
  # is blocked in mainland China. The VPS must write this file (have the macro-live
  # cron also run `python -m scripts.build_live_quotes --out site/live/quotes.json`);
  # until it does, live.js gracefully falls back to same-origin live/overlay.json.
  # Override via repo VARIABLE LIVE_QUOTES_SNAPSHOT_URL. Empty = overlay.json only.
  # (Historic: a GitHub Action force-pushed quotes.json to a `live-data` branch and
  # this pointed at raw.githubusercontent — replaced for China reachability.)
  snapshot_url: "live/quotes.json"
  # Extra symbols to always include in the snapshot universe (beyond the CORE
  # index/futures set + every data-sym the built site emits).
  snapshot_extra: []
  # Intraday LIVE risk-state (scripts/build_risk_state.py -> site/live/risk_state.json).
  # Recomputes ONLY the price-driven legs (tape, vol, the radar's equity/vol/credit-proxy
  # legs + the SPY<200dma context gate) on live prices; the slow legs (HY OAS, NFCI, breadth,
  # macro) carry forward stamped with their own as-of. The continuous score moves every tick;
  # the discrete band WORD is debounced this many consecutive ticks before it flips (anti-whipsaw).
  risk_state:
    debounce_ticks: 2

fedboard:
  # Excess Bond Premium (Gilchrist-Zakrajšek): the component of corporate credit
  # spreads NOT explained by default risk = a clean credit-risk-appetite / early-
  # warning gauge that forecasts both activity and asset prices. Monthly CSV from
  # the Fed Board (cols: date, gz_spread, ebp, est_prob), history from 1973.
  ebp_url: https://www.federalreserve.gov/econres/notes/feds-notes/ebp_csv.csv
  retries: 3

frbsf:
  # SF Fed Daily News Sentiment Index (Buckman-Shapiro-Sudhof-Wilson): a daily,
  # lexical-analysis economic-sentiment gauge built from major-newspaper articles,
  # history from 1980. Free .xlsx ('Data' sheet: date, News Sentiment). A QUANT
  # complement to the LLM news digests; feeds engine/conditions.py risk-appetite.
  news_sentiment_url: https://www.frbsf.org/wp-content/uploads/news_sentiment_data.xlsx
  retries: 3

# =============================================================================
# Cross-sectional equity factor engine (research/QUANT_FACTOR_EXPANSION.md,
# Tier 3). Fundamentals come from the SEC EDGAR XBRL "frames" API — free,
# keyless, one call returns a us-gaap concept across EVERY filer for a period —
# joined to the S&P 1500 price universe already in the breadth close caches.
# Ken French Data Library — monthly factor returns (free, Dartmouth). The deep-
# history backbone for FACTOR SEASONALITY (engine/factor_seasonality.py): academic
# total-US-market long/short factors, decades longer than our ~3yr S&P-1500 cache.
# Disclosed as a definition mismatch vs our z-score quintiles (style climate, not
# a forecast). See research notes + the seasonality page banner.
french:
  base_url: "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/"
  retries: 4
  zips:
    factors_3: "F-F_Research_Data_Factors_CSV.zip"        # Mkt-RF, SMB, HML, RF (1926-07+)
    factors_5: "F-F_Research_Data_5_Factors_2x3_CSV.zip"  # adds RMW, CMA (1963-07+)
    momentum: "F-F_Momentum_Factor_CSV.zip"               # Mom (1927-01+)

# =============================================================================
# Builds value / quality / profitability / investment / accruals / payout +
# (price-only) low-vol & betting-against-beta factor ranks. NEW FEATURE: a
# Factor Rankings page + a factor-leadership tile. House caveats apply (decay,
# crowding, sparse free fundamentals, look-ahead lagged to the filing period).
# =============================================================================
edgar:
  enabled: true
  base_url: https://data.sec.gov/api/xbrl/frames/us-gaap
  shares_url: https://data.sec.gov/api/xbrl/frames/dei   # dei:EntityCommonStockSharesOutstanding fallback
  tickers_url: https://www.sec.gov/files/company_tickers.json
  # SEC fair-access requires a descriptive UA with an email contact (enforced by
  # www.sec.gov for company_tickers.json; data.sec.gov is more lenient). Replace
  # with your own contact if you fork this. Rate limit: 10 req/s; ~20 calls/run.
  user_agent: "macro-dashboard/1.0 research longr2512@gmail.com"
  retries: 3
  latest_fy: 2025                  # most recent COMPLETE fiscal year on EDGAR; auto-walks-back if sparse
  min_filers_ok: 800              # a frame with fewer than this is treated as not-yet-available
  # Point-in-time panel (collectors.edgar.fetch_panel): one cross-section per FY
  # back to panel_start_fy, each stamped asof_date = period_end + reporting_lag_days
  # so a factor backtest never peeks at a not-yet-filed 10-K. Frames carry the
  # period end but NOT the SEC filed timestamp, so the lag is a CONSERVATIVE proxy
  # (120d ≈ past the 90d 10-K deadline; longer = safer against look-ahead).
  panel_start_fy: 2009            # XBRL financial-statement tagging was mandated ~2009
  reporting_lag_days: 120
  quarterly_lag_days: 60          # SUE EPS panel (collectors/edgar_eps.py): period_end + this = PIT as-of (10-Q files ~40-45d after q-end; 60 = conservative)
  factors:
    winsor_z: 3.0                 # clip cross-sectional z-scores at +/- this
    low_vol_window_d: 252         # trailing window for idiosyncratic/total vol + beta
    min_price_history_d: 150
    page_top_n: 25                # rows per factor leaderboard on factors.html
    # multi-factor composite = equal-weight mean of the available factor z's below
    # (accruals is folded into `quality`; low_beta is a standalone leaderboard,
    # left out of the blend as it is collinear with low_vol)
    composite: [value, quality, profitability, investment, payout, low_vol]

# -----------------------------------------------------------------------------
# Smart money — curated super-investor 13F-HR holdings (collectors/edgar_13f.py).
# FREE + keyless from SEC EDGAR. A Dataroma/WhaleWisdom-style "who holds this"
# CONTEXT layer (quarterly, ~45d lag, long-only US equity >= $100M; no shorts/
# options/non-US). NEVER wired into any score/allocation. Reuses edgar.user_agent.
# Tracked funds keyed by short slug -> {cik, name}; CIKs verified against live SEC.
# -----------------------------------------------------------------------------
smart_money:
  enabled: true
  # www.sec.gov/Archives ENFORCES SEC fair-access: the UA must carry a real
  # contact email or it 403s (data.sec.gov is laxer). Set this to YOUR email.
  user_agent: "Macro Dashboard 13F research longr2512@gmail.com"
  history_quarters: 6          # snapshots kept per fund — 2 for the live quarter diff + deeper history for the multi-quarter accumulation trend (engine/smart_money.accumulation_trend)
  backfill_quarters: 8         # --full-history depth
  panel_top_n: 12              # holders shown per stock panel
  # 13F Smart-Money TRADE TRACKER (engine/manager_trades.py + scripts/build_smart_money.py)
  # — grades each fund's new/add/trim/exit moves by SPY-relative forward return from the
  # public filing date. Track record / CONTEXT only, never wired into a score.
  tracker:
    horizon_days: 63           # fixed-window leg (≈ one quarter of sessions) for the apples-to-apples skill metric
    min_conviction_pct: 1.0    # a move must be ≥ this % of the book to make the best/worst boards (filters rounding lots)
    board_top_n: 25            # rows on the best-trades / worst-trades boards
    featured_funds: [appaloosa]            # pinned "follow closely" — surfaced/starred on the leaderboard (Tepper)
    featured_pair: [appaloosa, pershing]   # marquee head-to-head: Tepper's semis rotation vs Ackman's Mag-7 concentration
  funds:
    berkshire:   {cik: 1067983, name: "Berkshire Hathaway (Buffett)"}
    scion:       {cik: 1649339, name: "Scion Asset Mgmt (Burry)"}
    pershing:    {cik: 1336528, name: "Pershing Square (Ackman)"}
    appaloosa:   {cik: 1656456, name: "Appaloosa (Tepper)"}
    baupost:     {cik: 1061768, name: "Baupost Group (Klarman)"}
    thirdpoint:  {cik: 1040273, name: "Third Point (Loeb)"}
    duquesne:    {cik: 1536411, name: "Duquesne Family Office (Druckenmiller)"}
    lonepine:    {cik: 1061165, name: "Lone Pine Capital"}
    tigerglobal: {cik: 1167483, name: "Tiger Global (Coleman)"}
    himalaya:    {cik: 1709323, name: "Himalaya Capital (Li Lu)"}
    akre:        {cik: 1112520, name: "Akre Capital Management"}
    gates:       {cik: 1166559, name: "Gates Foundation Trust"}
    viking:      {cik: 1103804, name: "Viking Global (Halvorsen)"}
    valueact:    {cik: 1418814, name: "ValueAct Capital"}
    icahn:       {cik: 921669,  name: "Icahn (Carl Icahn)"}
    pabrai:      {cik: 1549575, name: "Dalal Street (Mohnish Pabrai)"}
    fairholme:   {cik: 1056831, name: "Fairholme Capital (Berkowitz)"}

engine_equity_factors:
  # leadership read: which factor's top-quintile has been beating its bottom-
  # quintile over this trailing window (a coarse "what's working now" gauge).
  leadership_window_d: 63

impulse:
  # Impulse Tracker (engine/impulse.py → scripts/build_impulse.py → impulse.html):
  # a reactive EARLY-IGNITION screen. All keys are OPTIONAL — engine.impulse.
  # ImpulseConfig defaults apply when omitted; only override to retune. The gates
  # encode the product rule: a name stays in the BUY lane only while the move is
  # young (small recent run-up, not stretched above its moving averages). Display/
  # context only; never a scored input elsewhere (short-horizon direction is a
  # coin-flip + momentum is regime-switched — see engine/velocity.py honesty gate).
  accel_early_z: 0.5        # accel_z above this = acceleration is meaningfully up
  vol_confirm: 1.05         # 3d/20d volume ratio above this = participation waking up
  rvol_confirm: 1.30        # OR relative-volume above this confirms
  runup_extended: 0.22      # 20d run-up at/above this = already ran (no entry)
  runup_early_max: 0.15     # BUY lane keeps the recent run-up below this
  ext50_extended: 0.20      # >20% above the 50d avg = stretched
  ext200_extended: 0.40     # >40% above the 200d avg = a sustained runner, demote
  trend_hard_down: -1.5     # slope_z below this = active down-trend → never a buy
  min_dollar_vol: 3000000   # liquidity floor on 20d average dollar volume ($)

engine_residual_alpha:
  # Sector-neutral residual-momentum leg (research/RESIDUAL_ALPHA_MOMENTUM.md).
  # Phase 0 verdict: a modest, regime-decayed edge — a ranking/context leg, NOT a
  # standalone strategy. Each stock's market AND sector beta are stripped (sector
  # orthogonalized to market; causal 252d shrunk betas); the score is the cross-
  # sectional, SECTOR-NEUTRAL z of the residual info-ratio over a 12-1-month window.
  beta_win: 252                   # rolling beta window (d)
  form: 252                       # formation window (d) — 12 months
  skip: 21                        # skip the most recent month (short-term reversal)
  shrink: 0.66                    # Vasicek-lite beta shrink toward the cross-section
  top_n: 15                       # leaders per sector / overall
  min_sector: 6                   # min names for a sector to get its own leader list
  min_names: 20                   # min universe to compute at all

