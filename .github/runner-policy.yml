# Runner-routing policy — the registry of every GitHub-HOSTED job in this repo.
#
# PROVENANCE: operator charter 2026-08-12 ("Mastermind GitHub CI Cost + Flow
# Migration"). Routine trusted CI must consume SELF-HOSTED compute by default;
# GitHub-hosted compute is now an EXCEPTION that has to be written down here.
# Design doc: research/CI_SELFHOSTED_MIGRATION_WAVE1.md.
#
# WHY A REGISTRY AND NOT A RULE: "prefer self-hosted" decays into "whatever the
# last person typed" within a month, and the decay is invisible — a job that
# quietly went back to `ubuntu-latest` still passes every existing check. So the
# default is inverted and made fail-closed: scripts/check_runner_policy.py walks
# .github/workflows/**, resolves every job's `runs-on`, and any job that CAN
# resolve to a hosted label without an entry below is a hard error. An expression
# it cannot decide (no hosted label, no `self-hosted` literal — e.g.
# `${{ inputs.runner || 'render-linux' }}`) is OPAQUE and also requires an entry:
# not being able to prove a job is self-hosted is not evidence that it is.
#
# The measured stake (org billing API, month-to-date 2026-08): 267,066 Actions
# Linux minutes gross-metered, discounted to net $0.00 ONLY because this
# repository is currently PUBLIC. The same volume bills ~$130+/day once the
# operator takes Mastermind private, which is the stated intent. Registered
# hosted debt below is therefore a DOLLAR figure waiting to be charged, not a
# style preference.
#
# HOW TO ADD AN EXCEPTION
#   1. Add a `{workflow, job, class, reason}` entry to `hosted_exceptions`. The
#      workflow path is repo-relative; the job key is the YAML job id, NOT the
#      published check name.
#   2. `class` must be one of:
#        fork-fallback     — untrusted external head; a persistent home runner
#                            must never execute it. This is a SECURITY class and
#                            is not migratable in any wave.
#        recovery          — an operator-selectable hosted path that exists so a
#                            self-hosted outage cannot wedge the fleet.
#        cheap-orchestration — tiny serial head/tail work where hosted pickup
#                            (2-3 s) beats pool queue-wait, and the minutes are
#                            a rounding error.
#        pending-migration — DEBT. Not justified, just not migrated yet. This is
#                            the Wave-2 worklist (charter §11); the list should
#                            only ever shrink.
#   3. `reason` is one sentence a future reader can audit. "Because it was" is
#      not a reason; name the constraint.
#
# Removing the self-hosted DEFAULT, or converting a fork-fallback entry into
# anything else, is an operator decision — not a maintenance edit.

schema: runner_policy.v1
updated: "2026-08-12"

# Every job not registered below must resolve to self-hosted labels.
default: self-hosted

# Any `runs-on` value (or expression substring) matching one of these is a
# GitHub-hosted runner. The guard also treats any bare `^(ubuntu|macos|windows)-`
# label as hosted, so a future `ubuntu-26.04` is caught before it is listed here.
hosted_labels:
  - ubuntu-latest
  - ubuntu-24.04
  - ubuntu-22.04
  - macos-latest
  - macos-14
  - macos-15
  - windows-latest

hosted_exceptions:
  # ── ci.yml ────────────────────────────────────────────────────────────────
  - workflow: .github/workflows/ci.yml
    job: ci-pack
    class: fork-fallback
    reason: >-
      The fork branch of the routing expression resolves a pull_request whose
      head.repo.full_name differs from this repository to ubuntu-latest. This
      repo is PUBLIC, so an untrusted head reaching the persistent 24-core home
      runner would be arbitrary code execution on the fleet; the same expression
      also carries the recovery value below.
  - workflow: .github/workflows/ci.yml
    job: ci-pack
    class: recovery
    reason: >-
      `workflow_dispatch` input runner_pool=hosted forces the packs back onto
      ubuntu-latest when the render-linux host is down or being rebuilt
      (`gh workflow run ci.yml --ref main -f runner_pool=hosted`). Inert on
      non-dispatch events because `inputs` is empty there.
  - workflow: .github/workflows/ci.yml
    job: ci-plan
    class: cheap-orchestration
    reason: >-
      Serial HEAD of every ci.yml run (~4-5 min, one manifest load + one diff).
      Hosted pickup is 2-3 s against a pool queue-wait that would be paid twice
      per PR, and at the measured ~20 ci runs/hr the plan jobs alone would hold
      ~1.7 of the host's 4 runner slots — capacity the packs need. Wave-2
      candidate once the host carries dedicated ci-linux slots.
  - workflow: .github/workflows/ci.yml
    job: ci-gate
    class: cheap-orchestration
    reason: >-
      Serial TAIL of every ci.yml run (<1 min of shell adjudication). Same
      argument as ci-plan; together they are ~2-3% of the workflow's minutes.

  # ── fences.yml ────────────────────────────────────────────────────────────
  - workflow: .github/workflows/fences.yml
    job: fork-self-mod-fence
    class: fork-fallback
    reason: >-
      Runs ONLY for a pull_request from a fork (job `if:` gate) and exists so
      external contributors still publish the required self-mod-fence context.
      Untrusted head — must stay hosted permanently.
  - workflow: .github/workflows/fences.yml
    job: fork-capability-broker
    class: fork-fallback
    reason: >-
      Fork-only fallback publishing the required capability-broker context.
      Untrusted head — must stay hosted permanently.
  - workflow: .github/workflows/fences.yml
    job: fork-grader-manifest
    class: fork-fallback
    reason: >-
      Fork-only fallback publishing the required grader-manifest context.
      Untrusted head — must stay hosted permanently.

  # ── already-routed lanes whose hosted branch is deliberate ────────────────
  - workflow: .github/workflows/integration-baseline.yml
    job: baseline
    class: recovery
    reason: >-
      Main's circuit-breaker proof runs self-hosted; an OFF-MAIN dispatch falls
      back to ubuntu-latest on purpose, because an arbitrary ref must not
      execute inside the production-adjacent persistent workspace.
  - workflow: .github/workflows/engine-render.yml
    job: engine-render
    class: recovery
    reason: >-
      `runs-on: ${{ github.event.inputs.runner || 'render-linux' }}` is an
      operator-selectable label, so a dispatch may legitimately resolve it to a
      hosted runner when the render pool is unavailable. Opaque to static
      analysis, hence registered rather than assumed.
  - workflow: .github/workflows/key-pool-probe.yml
    job: probe
    class: recovery
    reason: >-
      Diagnostic probe with an explicit `inputs.runner == 'ubuntu-latest'`
      branch, so the operator can compare key-pool behaviour from outside the
      home network when the macstudio pool is suspect.

