          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml scipy
      - name: grading_stats library tests (wilson_ci, fdr_bh, cone_coverage, china regression)
        run: python -m pytest tests/test_grading_stats.py -q

  # ── RENDER/ENGINE GUARD LANES (split 2026-08-14) ───────────────────────────
  # The three jobs below were ONE job — `engine-render-guards`, twelve steps and
  # 1036s in OBSERVED_COMMAND_SECONDS, the heaviest legacy job in the manifest and
  # alone in `ci-pack-0` on every 12-pack run, so the pack WAS the lane and no
  # amount of outer-matrix work could shorten it.  Receipt:
  # research/CI_RENDER_GUARD_TIMING_RECEIPT_2026-08-12.md; the merge-control-plane
  # incident that made the critical path urgent:
  # research/CI_MERGE_CONTROL_PLANE_RECOVERY_2026_08_14.md.
  #
  # The measurement dictates the seam, and it also says what the split is NOT for.
  # The lane was never twelve steps of comparable weight; it was one step wearing a
  # job: the rot sweep is 83.4% of it (356.8s of 427.6s measured locally) and the
  # other ten executable steps are 70.8s combined.  So the sweep is irreducible and
  # still carries a pack by itself.  Splitting buys the two things the single job
  # structurally could not:
  #
  #   1. SCOPE.  `infer_job_scopes` derives a job's paths from the test files its
  #      `run:` steps name, so ONE job naming 145 suites is broad by construction —
  #      a PR touching a single prophet-live file paid the entire 1036s.  Three
  #      jobs mean a narrow diff selects only the lane it actually changed.
  #   2. REACHABILITY.  `run_ci_pack._run_job` returns on the FIRST non-zero step,
  #      so every later step in that job is silently skipped.  The express
  #      guards below were hand-ordered ahead of the sweep for exactly that reason,
  #      one incident at a time (see each step's note).  A separate job has a
  #      separate exit status, so a red sweep can no longer skip them — this split
  #      RETIRES that ordering workaround rather than preserving it.
  #
  # Residual, stated plainly: within EACH lane the abandon-on-first-failure rule
  # still holds.  It is bounded now — no lane mixes a 129-suite sweep with a
  # focused guard — not eliminated.  Keep the two small lanes small.
  #
  # Dependency-group note: run_ci_pack prepares one venv per BYTE-IDENTICAL pip
  # line, so three different lines no longer share a group and cost up to three
  # venvs when two lanes land in the same pack.  That is the deliberate price of
  # (1): a narrow diff now installs one lane's packages instead of all fourteen.
  # Each line below is derived, not guessed — a package is present when a suite the
  # lane names imports or `importorskip`s it, when the first-party import-TIME
  # closure of such a suite needs it, or when `git log -L` shows it was added to the
  # old line for a suite this lane inherited.

  engine-render-guards:
    if: ${{ false }}
    # 2026-07-02 rot sweep: these test files silently broke on main because ci.yml only
    # ran a targeted subset. They cover the template render guards (canada / fear↔euphoria /
    # froth merged card / risk-state banner), the froth display-only firewall, the
    # price-basis-flip audit, the risk-gauge honesty layer (base-rate → measured PIT
    # probs, #887), GDELT missing-tape, the commodity MTF ladder (fitted bands, #981),
    # the net-liquidity unit guard (drain-independent since RRP≈0), and the whitehouse
    # qledger import guards (order-dependence cured at the walk_forward leaker).
    #
    # This job keeps the NAME because two records cite it by name and must stay true:
    # `config/house_law_checks.yml` (flow_continuity.statement_tape_schema →
    # `job: engine-render-guards`) and docs/HOUSE_LAW_CI_GUARD_SUITE.md both point the
    # statement-tape guard here, and both its check script and tests/test_statement_tape.py
    # are still in this job. The B4/attested-history cluster moved to
    # `attested-history-guards` and the express guards to `express-render-guards`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        # This is the pre-split line MINUS boto3, and nothing else moved. boto3 was
        # added by #4806 for the Wave 0A attested-history serving boundary, which now
        # lives in `attested-history-guards`; `engine/research_vault/r2_store.py`
        # imports boto3 LAZILY inside its client factory (and says so at its
        # `_client` docstring), so no suite in this sweep needs it at import time and
        # the sweep provably ran green without it before #4806.
        # beautifulsoup4: test_china_news_engine.py patches bs4.BeautifulSoup on the
        # official-pages fetch path, and patch() imports the module.
        # fastapi + httpx: tests/test_forensics_api.py importorskips both (FastAPI's
        # TestClient needs httpx); jsonschema and pillow arrived with the Filing
        # Forensics workbench (#4184) and predate it respectively, are reachable only
        # through lazy first-party paths, and are RETAINED deliberately — nothing here
        # proves those paths unreachable, and a wrong subtraction costs a red lane.
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly pillow requests beautifulsoup4 fastapi httpx jsonschema
      # NEVER put a `#` comment inside the folded `run: >` scalar below. YAML folds it
      # onto ONE shell line, where `#` starts a SHELL comment — everything after it,
      # including every remaining test path and the trailing `-q`, silently vanishes
      # from the run. The step still exits 0, so it reads GREEN while running fewer
      # suites (caught 2026-08-07: a 5-line note added mid-list dropped 24 suites plus
      # the two being added). Annotate the list here, above `- name:`, where YAML
      # comments are real comments.
