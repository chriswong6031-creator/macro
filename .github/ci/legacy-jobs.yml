        run: python -m pytest tests/test_render_flow_desk_scope.py -q
      # Sparse session-worktree profile (policy R8). #5531 landed the suite
      # named by no run: step — the same class the census above now gates —
      # so pack-1 went red on every PR the moment it merged. It belongs HERE
      # with the other worktree/CI-profile steps: its subject is
      # scripts/worktree_sparse.py + the WorktreeCreate hook, and the sibling
      # vacuous-refusal suite below already owns the R8 honesty rule. stdlib +
      # pytest; synthetic git repos under tmp_path, no data/ or site/ reads.
      - name: sparse session-worktree profile (config ↔ fallback, husk detector, hook wiring)
        run: python -m pytest tests/test_sparse_worktree_profile.py -q
      # VACUOUS guards: the same lie audit_unrun_tests.py catches, one layer down.
      # A suite that never runs is caught above; a guard that RUNS, walks a tree
      # that is not checked out, finds nothing and prints its affirmative OK is
      # not — it reports green over an empty set. Session worktrees are sparse by
      # default (policy R8, scripts/worktree_sparse.py), and seven check_*.py
      # guards did exactly that when measured 2026-08-13. The refusal is
      # conditional on an EMPTY result set, never on sparseness alone: the 13
      # lanes that check out partial trees on purpose (live-quotes.yml,
      # marketing-hot-tape.yml and friends) invoke none of these seven and must
      # keep passing regardless. One suite owns that conjunction for all seven
