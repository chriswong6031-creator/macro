  self-mod-fence:
    if: ${{ false }}
    # F2 (Metabolism Phase 0 / R-AUT-5): self-modification fence.
    # Hard-fails any PR whose branch name or commit trailers carry the loop
    # namespace (metabolism/* or claude/loop-*, or 'Loop-Authored:' trailer)
    # AND whose changed-file list touches the IMMUTABLE set.
    # Human/operator PRs pass freely.  Fail-closed: unclassifiable → blocked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml
      - name: self-mod-fence selftest (all four cases proven)
        run: python3 scripts/check_self_mod_fence.py --selftest
      - name: ship-loop guard contract (baseline dirt, render precondition scoping)
        # The Stop hook that enforces commit->merge->render->live had NO CI at all,
        # which is how its render precondition shipped scoped to the whole session
        # range: on a shared main that sweeps in concurrent sessions' templates/
        # merges and demands a render on a merge commit that can never have one.
        run: python -m pytest tests/test_ship_loop_guard.py -q
      - name: self-mod-fence live check (loop PR + immutable → BLOCKED)
        run: |
          git fetch origin ${{ github.base_ref || 'main' }}
          BRANCH="${{ github.head_ref }}"
          TRAILERS=$(git log --format="%B" origin/${{ github.base_ref || 'main' }}..HEAD 2>/dev/null || echo "")
          FILES=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD 2>/dev/null || echo "")
          if [ -z "$FILES" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && \
               git merge-base --is-ancestor HEAD "origin/${{ github.base_ref || 'main' }}" 2>/dev/null; then
              # Dispatch on main itself (the ship-loop guard's E1 unblock lever,
              # `gh workflow run ci.yml --ref main` — hooks #3677): HEAD is main or an
              # ancestor of it, so the empty three-dot diff is VERIFIED-empty — there is
              # no PR and no self-modification to classify. R-AUT-5's fail-closed
              # contract targets UNDETERMINABLE diffs (git errors, shallow clones,
              # base-ref failures), not this case. Before this arm existed every
              # dispatch-at-tip run redded here, which made the green-main E1 evidence
              # unsatisfiable by construction (observed run 30207008917, 2026-07-26).
              # The ancestor form (not tip-equality) keeps the arm valid when main
              # advances between dispatch checkout and this step; a dispatched branch
              # carrying real commits still has a non-empty diff and is classified
              # by the python fence below as always.
              echo "self-mod-fence: workflow_dispatch with HEAD on main — zero changes to classify (pass)"
              exit 0
            fi
            # R-AUT-5 fail-closed contract: an empty file list (git diff error, shallow
            # clone, base-ref resolution failure, or merge-commit HEAD) must BLOCK — not
            # silently pass.  A fence that errors open is worse than no fence.
            echo "::error:: self-mod-fence: could not determine changed files — fail-closed (exit 1)." >&2
            echo "Possible causes: git diff error, shallow clone, or base_ref resolution failure." >&2
            echo "Resolve by ensuring fetch-depth: 0 and a valid base_ref before this step." >&2
            exit 1
          fi
          python3 scripts/check_self_mod_fence.py \
            --branch "$BRANCH" \
            --files $FILES \
            --trailers "$TRAILERS"
      - name: self-mod-fence test suite
        run: python -m pytest tests/test_self_mod_fence.py -q

