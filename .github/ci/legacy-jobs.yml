  # Runtime: the witness-replay test runs engine.signal_gate.gate() on seven
  # full-history series from data/hk_search/closes_deep.parquet — minutes, not
  # seconds.  Documented ~83s on a fast Mac Studio; measured ~2:27 (~1.8×) on
