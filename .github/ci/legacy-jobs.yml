  unrun-government-revenue:
    # Government Revenue Foresight — builder envelope, publication fence,
    # workspace/dossier/briefcase UI contracts, and the federal-award
    # collectors (SAM.gov, USAspending, Census trade) feeding the program.
    # jsonschema and fastapi ride on top of the shared unrun-* install because
    # engine/government_revenue/workspace.py's contract validator fails CLOSED
    # without jsonschema (every payload reads invalid, which presented as 20
    # assertion failures in the 2026-08-03 staging pass) and the dossier /
    # subaward rails import fastapi at module scope. Like unrun-brain-gateway
    # this buys one extra venv in whichever pack it lands.
    if: ${{ false }}
    # 6 -> 8 for the nineteen-suite darkness backfill below (+~20s of tests on
    # top of an install-dominated job); the margin is for a cold wheel cache,
    # not for the suites themselves.
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps plus the schema/API wheels
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests beautifulsoup4 openpyxl scikit-learn jsonschema fastapi httpx2
      # Wave 9D: the admissibility fences on issuer graph expansion — exact
      # identifier + verbatim Exhibit 21 name only, no discovery_query_ticker, no
      # similarity, no LLM assertion; PIT; the proposed-edge-cannot-become-a-
      # candidate boundary driven through engine/government_revenue/candidates.py
      # itself; and the four EDGAR collector regressions found by running the
      # collector against live filings. The suite opens no socket (module-wide
      # socket fence) and reads only tests/fixtures/issuer_evidence/, so it needs
      # nothing beyond this job's existing install line.
      - name: wave 9D — exact-identifier issuer graph expansion fences
        run: python -m pytest tests/test_government_revenue_issuer_graph_expansion.py -q
      - name: builder envelope + publication fence + dossier/subaward rails
        run: python -m pytest tests/test_build_government_revenue.py tests/test_check_government_revenue_projection.py tests/test_government_revenue_dossiers.py tests/test_government_revenue_subaward_api.py -q
      # The prophet↔government-revenue context bridge. Named by NOTHING in
      # .github/ before this line — not this manifest, not any workflow, and not
      # even a ci.yml trigger path — so the one suite proving the Prophet side
      # reads the published govrev artifacts correctly had never executed in CI.
      # It belongs in THIS job rather than alongside test_prophet_bridge.py in
      # unrun-market-plumbing because it reads the v2 procurement contract, and
      # only this job installs jsonschema; without it workspace.py's validator
      # fails CLOSED and every payload reads invalid (the 2026-08-03 staging pass).
      - name: prophet ↔ government-revenue context bridge
        run: python -m pytest tests/test_prophet_government_revenue_context.py -q
      # Waves 9E + 9F: the shadow cross-check packet and the Prophet
      # post-selection annotation — the two seams that connect the lobe to the
      # rest of the platform without giving it signal authority. Both suites
      # carry byte-identity proofs (the candidate queue's wire bytes across four
      # shadow states; Prophet's decision projection with the adapter on/off) and
      # a TRANSITIVE import-boundary walk proving no Prophet module can reach a
      # govrev candidate SOURCE. They belong in THIS job because both read the
      # jsonschema-validated candidate contract, and the live probes read the
      # committed data/{baskets/ohlcv,yahoo,regime,us_prophet_rank} stores plus
      # data/government_revenue/candidate_queue.json — all tracked, so the probes
      # exercise real artifacts here rather than degrading to fixtures. Measured
      # locally under this job's exact dependency set: 103 passed in ~7s.
      - name: waves 9E/9F — shadow context packets + prophet annotation boundary
        run: python -m pytest tests/test_government_revenue_shadow_context.py tests/test_government_revenue_prophet_annotation.py -q
      - name: workspace / dossier / briefcase UI contracts
        run: python -m pytest tests/test_government_revenue_ui.py tests/test_government_revenue_dossier_ui.py tests/test_government_revenue_briefcase_ui.py -q
      - name: federal-award collectors — SAM.gov, USAspending awards + subawards, Census trade
        run: python -m pytest tests/test_sam_gov_opportunities.py tests/test_sam_gov_radar_leg.py tests/test_usaspending_awards.py tests/test_usaspending_subawards.py tests/test_census_trade.py -q
      # The 2026-08-03 backfill wired the builder/fence/UI/collector suites but
      # left nineteen Government Revenue suites enumerated by NOTHING in
      # .github/ — no pack, no workflow, and no catch-all `pytest tests/` sweep
      # exists in this repo to pick them up.  Among them were the two suites
      # that own the forward award-event spine itself
      # (test_government_revenue_award_spine.py, test_government_revenue_award_events.py),
      # so the state machine guarding the event triad was never once executed by
      # CI.  That is how the 2026-08-06 `ledger_write_failed` persistence break
      # reached production: the lobe looked green because its on-point guards
      # were invisible, not because they passed.  Candidate API/projection tests
      # now run in the dedicated bounded job below: their large deterministic
      # fixtures grew beyond this legacy lane's original eight-minute budget,
      # and keeping them here made the entire ownership lane time out.
      - name: award-event spine, candidates, entity + workspace contracts
        run: python -m pytest tests/test_government_revenue.py tests/test_government_revenue_award_events.py tests/test_government_revenue_award_spine.py tests/test_government_revenue_api.py tests/test_government_revenue_api_auth.py tests/test_government_revenue_budget_graph.py tests/test_government_revenue_candidates.py tests/test_government_revenue_contracts.py tests/test_government_revenue_entity_resolution.py tests/test_government_revenue_freshness.py tests/test_government_revenue_idv_bridge.py tests/test_government_revenue_idv_dossiers.py tests/test_government_revenue_neuralweb.py tests/test_government_revenue_opportunities.py tests/test_government_revenue_recipient_graph.py tests/test_government_revenue_subaward_dossiers.py tests/test_government_revenue_wave8_api.py tests/test_government_revenue_workspace.py tests/test_usaspending_idv_graph.py -q
      # Recipient->issuer attribution: the Wave 9D discovery tool that proposes
      # candidates for the reviewed graph. Named by NO run: step until 2026-08-06 —
      # the proposal tool's 60 tests could not go red on main, which is the same
      # shape as a guard that does not exist. jsonschema (installed above) is the
      # suite's only extra import. Its two siblings — the graph runtime
      # (test_government_revenue_recipient_graph.py) and the resolver
      # (test_government_revenue_entity_resolution.py) — are already enumerated by
      # the darkness-backfill step directly above, in this same job with this same
      # dependency set, so they are not repeated here.
      - name: recipient entity graph — the Wave 9D proposal tool
        run: python -m pytest tests/test_propose_government_revenue_recipient_graph.py -q
      # Amount-class conflation gate.  The lobe's central financial-honesty rule —
      # "obligation, outlay, ceiling, bookings, backlog, funded backlog, and GAAP
      # revenue are never conflated" — was written twice as PROSE (the account handoff
      # and the masterplan) and enforced by nothing: `grep -rl 'obligat.*ceiling' tests/`
      # returned no match.  The incumbent publishes the same caution in its own public
      # docs; the difference has to be that ours can go red.  The suite pins all four
      # dangerous mixes (cumulative+delta, obligation+ceiling, obligation+outlay, and a
      # figure published without its class label), and running it found one real defect
      # on main: metrics._concentration's weight ladder fell through to
      # current_award_amount, so a frame arriving without an obligated column produced
      # shares, an HHI and a total computed from a CEILING and published as
      # `covered_obligations`.  Stdlib + the job's existing pandas/pyarrow only.
      - name: amount-class conflation gate — obligation vs ceiling vs outlay vs delta
        run: python -m pytest tests/test_government_revenue_amount_semantics.py -q
      # Unrun backfill 2026-08-09: the SBIR/STTR progression evidence lane
      # (Wave 10 rail 3, #5012) landed named by no run: step — the unrun-suite
      # gate reds main on it.  It belongs HERE because the suite drives
      # collectors/sbir_awards.py and engine/government_revenue/sbir_progression.py,
      # the same federal-award collector family as the SAM.gov/USAspending steps
      # above, under the same jsonschema-bearing install line.
      - name: SBIR/STTR progression evidence lane — collector + engine rail (#5012)
        proof_id: sbir-sttr-progression-evidence-pre-amount-semantics
        run: python -m pytest tests/test_sbir_awards.py -q
      - name: amount-class semantics guard (selftest + live source scan)
        run: |
          python3 scripts/check_government_revenue_amount_semantics.py --selftest
          python3 scripts/check_government_revenue_amount_semantics.py
      # Unrun backfill 2026-08-09: the SBIR/STTR progression evidence lane
      # (Wave 10 rail 3, #5012) landed named by no run: step — the unrun-suite
      # gate reds main on it.  It belongs HERE because the suite drives
      # collectors/sbir_awards.py and engine/government_revenue/sbir_progression.py,
      # the same federal-award collector family as the SAM.gov/USAspending steps
      # above, under the same jsonschema-bearing install line.
      - name: SBIR/STTR progression evidence lane — collector + engine rail (#5012)
        proof_id: sbir-sttr-progression-evidence-post-amount-semantics
        run: python -m pytest tests/test_sbir_awards.py -q

