        # Verified in a clean pytest+pyyaml+numpy+pandas+pyarrow venv (this lane's
        # exact install line): 308 passed, 0 skipped.
        run: python -m pytest tests/test_marketing_approval_desk.py tests/test_marketing_card_earns_pixels.py tests/test_marketing_wire_expiry.py -q

