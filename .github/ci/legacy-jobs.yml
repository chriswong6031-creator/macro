  house-law-registry:
    if: ${{ false }}
    # DECLARED scope, UNIONed with the runtime-derived one (run_ci_pack.infer_job_scopes
    # keeps `set(job.paths) | set(derived)`), and it exists for exactly one entry:
    # root `config.yml`. That file is where BOTH of this repo's timeless rename maps
    # live — `breadth.ticker_fixups` and `quality.ticker_key_migrations` — and the next
    # ticker rename lands the way both modelled ones did, as ONE LINE in one of them.
    # The unmodelled-rename detector that catches it (build_security_master.
    # unmodelled_renames, asserted by tests/test_dataos_security_master.py) could not be
    # REACHED from that edit: scope inference cannot own a repository-ROOT file at all —
    # SCOPE_REFERENCE_RE and ci_scope_dependencies._PATH_LITERAL both require a tracked
    # directory prefix — so a fixups-only PR selected 48 jobs and this was not among
    # them (measured 2026-08-13). Silent gap, in the detector written to close a silent
    # gap. The remaining entries are not new ownership: they are the paths this job's
    # own commands already name, listed because _scope_coverage_findings makes a
    # declared scope that fails to cover them a HARD manifest error. Adding a `run:`
    # step that names a new path means adding it here too.
    paths:
      - config.yml
      - docs/HOUSE_LAW_CI_GUARD_SUITE.md
      - scripts/check_append_only_assertions.py
      - scripts/check_claim_passport.py
      - scripts/check_house_law_registry.py
      - scripts/check_symbol_rename_drift.py
      - tests/test_append_only_assertions.py
      - tests/test_dataos_security_master.py
      - tests/test_house_law_registry.py
      - tests/test_ticker_alias_boundary.py
    # Meta-guard: verifies config/house_law_checks.yml is complete and honest.
    # Three checks in sequence:
    #   1. selftest: synthetic assertions prove the meta-guard catches violations.
    #   2. live check: every scripts/check_*.py is registered, every registered
    #      script exists, all ci_wiring points to real jobs that mention the script.
    #   3. docs-drift: regenerate docs and fail if the committed file is stale.
    #   4. pytest: idempotency + integration tests.
    # Also runs check_claim_passport.py (exit 0 confirmed 2026-07-06; hard gate).
    # Triggers on: config/house_law_checks.yml, the meta-guard script,
    # docs/HOUSE_LAW_CI_GUARD_SUITE.md, and tests/test_house_law_registry.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas pyarrow pyyaml
      - name: meta-guard selftest (synthetic assertions — gate fires on violations)
        run: python3 scripts/check_house_law_registry.py --selftest
      - name: meta-guard live check (census + wiring + selftest truth + ratchets)
        run: python3 scripts/check_house_law_registry.py
      - name: docs-drift check (committed docs must match regen output byte-for-byte)
        run: |
          python3 scripts/check_house_law_registry.py --emit-docs
          git diff --exit-code docs/HOUSE_LAW_CI_GUARD_SUITE.md
      - name: claim-passport lint (no unregistered qual field reaching scored consumer)
        run: python3 scripts/check_claim_passport.py
      - name: stable-key / live-vendor symbol alias boundary
        run: |
          python3 scripts/check_symbol_rename_drift.py
          python -m pytest tests/test_ticker_alias_boundary.py -q
      # Data OS DOS-1.1: the security master + the TIME-SCOPED alias table, which is
      # the general form of the boundary the step above guards. It lives HERE and not
      # in `dataos-foundation` for two reasons, both load-bearing:
      #   * that job installs pytest + pyyaml ONLY, on purpose — "a pandas/numpy import
      #     creeping into lib/dataos/ breaks HERE first" — and adding pandas to its pip
      #     line would switch that canary off. This job already provides pandas+pyarrow.
      #   * that job is pure unit tests that never open data/; this suite reads the
      #     COMMITTED artifacts (data/reference/*.parquet), which is what a consumer
      #     would read and therefore the only honest place to pin them.
      # It is a `run:` step in an EXISTING job rather than a new job because the legacy
      # manifest sits near the narrow-diff ceiling (test_ci_pack.py asserts a
      # representative diff selects <= len(jobs)*4//5); folding suites into a job keeps
      # the job count, and the arithmetic, where it is.
      - name: Data OS security master + time-scoped vendor alias table (MMC/MRSH, SATS/ECHO)
        run: python -m pytest tests/test_dataos_security_master.py -q
      - name: house-law registry tests (idempotency + integration)
        run: python -m pytest tests/test_house_law_registry.py -q
      # data.append_only_assertions — registered at `discipline` with EMPTY
      # ci_wiring, so what runs here PROVES THE GUARD WORKS; it never judges the
      # tree. The bare `--selftest` (no --strict, no tree scan) is the whole
      # point: the guard reports 47 pre-existing findings on main that no PR
      # author wrote, and a gate that reds every PR on day one gets disabled
      # rather than obeyed. See the promotion plan in config/house_law_checks.yml.
      #
      # STEP PLACEMENT IS DELIBERATE. run_ci_pack returns on the first non-zero
      # step, so a step placed FIRST masks every sibling behind it. These two are
      # appended LAST because this job is an always-on fleet control plane: the
      # meta-guard census, the docs-drift check and the claim-passport lint must
      # never be masked by a new guard's own proof. The cost of last placement is
      # that these go dark behind an earlier red — acceptable for a discipline-tier
      # guard, and not acceptable the other way round.
      - name: append-only law selftest (7 known-bad caught, 13 legal clean)
        run: python3 scripts/check_append_only_assertions.py --selftest
      # Negative controls: mutates the detector 10 ways and the fixtures 9 ways.
      # A surviving mutation means the rule it disables is dead code, and the
      # test names it. This is what makes the selftest above evidence rather than
      # a guard printing zero.
      - name: append-only law mutation + negative controls
        run: python -m pytest tests/test_append_only_assertions.py -q

