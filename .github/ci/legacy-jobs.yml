    # W1.5 (W1.1 acceptance): the grading_stats shared library must have exactly one
    # cone_coverage implementation (no silent second definition), and the China-grader
    # refactor must be numerically identical to the pre-refactor path on fixed inputs.
    # Catching a regression here is critical: this library feeds every grader in the
    # measurement engine.
    runs-on: ubuntu-latest
