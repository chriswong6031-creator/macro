  wri-risk-core:
    if: ${{ false }}
    # WRI W3: the watchlist book-structure math (templates/risk_core.js) is a pure
    # ES5 module exercised by shelling `node` over fixture JSON — proves the §7
    # sanity anchors (ENB≈20 pure-idio / →1 single-factor, negative-MCTR hedge,
    # abstain path) + the factor-bet grouping + stress-lens gating. node is on the
    # runner; the suite skips loudly if it ever isn't. No build, no site/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install minimal deps
        # pyyaml: engine.factor_exposure loads the W6.1 factor-model charter (YAML) at
