      - name: watchstore.js store — local books + one-shot folds
        run: python -m pytest tests/test_watchlist_books_js.py -q
      - name: watchstore.js store — registered multi-list seam (W1a)
        run: python -m pytest tests/test_watchstore_multilist_js.py -q
      # W2 workspace layer over that store: the bulk-entry parser (the anonymous
      # funnel's front door), the weighting model, the engine-state -> plain-word
      # stage map (which may only ever DE-ESCALATE), delta-since-visit, and the
      # read-side guard that stops a focus refetch from reverting a just-made edit.
      - name: watchlist workspace — entry parser, stage map, focus-refetch guard (W2)
        run: python -m pytest tests/test_watchlist_workspace_js.py -q
      # Sector names are the one label on this page with no zh twin in the source:
      # they arrive as raw English on stockdata/index.json and are painted
      # client-side, so they rendered in English under data-lang="zh" while
      # everything around them switched. Nothing raises when that regresses — an
      # untranslated name renders perfectly — so the guard covers all four ways it
