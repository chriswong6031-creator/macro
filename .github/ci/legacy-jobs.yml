    # Flow-Surface store: scripts/build_flow_surface materializes per-strike net-premium
    # grids + (Lane G) intraday dealer-exposure greek grids (gex/dex/vanna/charm) +
    # walls/coverage (grids[metric][levelIdx][timeIdx]) into the R2 snapshot store the
    # Terminal surface pane replays. A regression here (grid orientation/dims, idx↔files
    # stamp drift, dishonest poll-floor/observed spacing, non-idempotent append,
    # greek-vs-EOD sign drift, or a
    # greek failure breaking the netprem write) would corrupt or blank the pane. Shapes are
    # asserted against a vendored copy of the Terminal contract (surfaceContract.ts); the
    # greek math is checked against engine/greeks + engine/gex_engine (the EOD source it
    # mirrors), so numpy/pandas/scipy are needed (the greek engine is numpy-vectorized).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        # jinja2 + pyarrow are for the options-screener suite below: the builder imports
        # jinja2 at module scope and reads its inputs from parquet.
        run: pip install pytest pyyaml numpy pandas scipy jinja2 pyarrow jsonschema fastapi httpx requests
      - name: flow surface + dated archive cadence truth (poll floor, observed sparse spacing, retention)
        run: python -m pytest tests/test_flow_surface.py tests/test_flow_archive.py -q
      # PRISM's daily matrix shares this options data-plane lane.  Keep the
      # exact-contract-side volume baseline suite distinct so PIT/no-zero-fill regressions
      # cannot hide inside a broader surface invocation.
      - name: PRISM per-side PIT UNUSUAL lens (observed-session median, sample floor, 3x boundary)
        run: python -m pytest tests/test_options_matrix.py -q
      - name: options PIT episodes (causal clocks, durable stage, H+60 + declared-session-close proxies, R2/checkpoint integrity)
        run: python -m pytest tests/test_options_signal_episode.py -q
      # Pending H+60 rows are never appended, so an episode that never resolves
      # simply never appears in outcomes_h60.jsonl.  This suite pins the census
      # that bounds that hole and the classifier that splits it by remedy —
      # uncovered price universe (fixable) vs cadence-aligned exit (accepted).
      - name: options episode H+60 coverage census (unlabelled bound, structural gap vs accepted cadence class)
        run: python -m pytest tests/test_options_episode_outcome_coverage.py -q
      - name: sparse exact-option selector preregistration (zero denominator, permanent retrospective fence, no authority)
        run: python -m pytest tests/test_options_sparse_selector_prereg.py -q
      - name: bounded sparse selector runtime + private authenticated dictionary (fail-closed authority and cache forgery)
        run: >-
          python -m pytest
          tests/test_options_sparse_selector_runtime.py
          tests/test_private_auth_dict.py
          tests/test_options_market_memory_local_receipts.py
          tests/test_options_market_memory_local_replica.py -q -rs
      - name: sparse selector sealed runtime carrier + bounded paper-only canary runner
        run: >-
          python -m pytest
          tests/test_options_sparse_selector_bootstrap.py
          tests/test_run_options_sparse_selector.py -q
      - name: sparse selector 4,096-candidate full-drain benchmark (1,024 objects, 4 MiB intent caps)
        run: >-
          SPARSE_SELECTOR_PERF=1 python -m pytest
          tests/test_options_sparse_selector_runtime.py::test_4096_candidate_benchmark
          -q -rs
      - name: options signal campaign v2 (immutable revisions, causal anchors, exact checkpoint)
        run: python -m pytest tests/test_options_signal_campaign.py -q
      - name: MSC R2.2-A Light U-CHAIN packets + monotonic R2 discovery publication
        run: python -m pytest tests/test_options_structure_intraday.py tests/test_build_options_structure_intraday.py -q
      - name: W0a-B chain-snapshot durable bucket receipts and source-install proofs
        run: python -m pytest tests/test_chain_snapshot_poller.py -q
      - name: W0b focused vendor-snapshot quote completion and no-repoll proofs
        run: python -m pytest tests/test_options_focused_quote.py -q
      - name: live-flow PIT producer (RTH admission, stable source IDs, root-scoped state, cycle WAL)
        run: python -m pytest tests/test_live_flow.py -q
      - name: flow derivative source clocks (enrich + chain heat, fail-closed provenance)
        run: python -m pytest tests/test_flow_enrich.py tests/test_build_chain_heat.py -q
      - name: ThetaData PIT store (narrow OI projection, exact-date filter, cache bypass)
        run: python -m pytest tests/test_thetadata_store.py -q
      - name: intraday greek engine tests (IV solve round-trip, greek parity vs engine/greeks, dealer-sign parity vs engine/gex_engine, coverage honesty)
        run: python -m pytest tests/test_intraday_greeks.py -q
      # OEU M-XP(b)+(c): the two payloads the Terminal / Options workspace fetch. Both are
      # cross-repo contracts — an unwired suite here rots silently and the consumer 404s.
      - name: Terminal EOD-context R2 mirror (key map pinned, corrupt-file guard, fail-soft)
        run: python -m pytest tests/test_mirror_terminal_context.py -q
      - name: options screener (IV-rank percentile + Scanner-mode rows export shape)
        run: python -m pytest tests/test_build_options_screener.py -q
      # Authorized Oracle history replay is synthetic/aggregate-only in CI: it never
      # reads the private JV source. This lane already owns the parquet adapter closure.
      - name: Oracle replay (PIT cutoffs, R2 plan, privacy and no-signal authority)
        run: python -m pytest tests/test_momoedge_oracle_history_replay.py -q
      # The governed Prophet shadow foundation (#5067), named by NO run: step when it
      # merged. It belongs in THIS job rather than a new one: its subject pair is
      # scripts/build_options_prophet.py plus the R2 key map in scripts/mirror_flow_idx
      # (OPTIONS_PROPHET_R2_KEY), and this job already owns the sibling mirror contract
      # and the options PIT episode/R2-integrity suites above. Both subjects are
      # stdlib-only at module scope; the suite's one non-stdlib import is yaml, and
      # pyyaml is already on the install line.
      - name: governed options Prophet shadow foundation (#5067)
        run: python -m pytest tests/test_build_options_prophet.py -q
      - name: private operator-reviewed Options Issue Desk (R6.2-A)
        run: python -m pytest tests/test_options_issue_desk.py tests/test_options_issue_desk_api.py -q

  cycle-grading-stats:
