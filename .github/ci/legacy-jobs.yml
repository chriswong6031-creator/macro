  dag-conformance:
    if: ${{ false }}
    # W5a (Neural Web): config/dag.yml declares the per-workflow-step lane inventory;
    # scripts/check_dag_conformance.py diffs the declared sequences against the LIVE
    # .github/workflows/ files and exits 1 on any mismatch not covered by a divergences
    # entry.  ANY undeclared drift between dag.yml and the real workflow now reds CI here
    # before merging — ending the hand-sync problem.
    #
    # Three checks in sequence:
    #   1. Hard: check_dag_conformance.py against the repo (exits 1 on undeclared drift)
    #   2. Hard: pytest tests/test_dag_conformance.py (selftest + live conformance assertion)
    #
    # Suspect divergences count as covered (declared), but are PRINTED in every run
    # so they stay visible.  The suspect list may only SHRINK (only-shrinks ratchet).
    #
    # Triggers on: .github/workflows/**, config/dag.yml, the checker, and the test file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml
      - name: DAG conformance check (hard — exits 1 on undeclared lane drift)
        run: python scripts/check_dag_conformance.py --verbose
      - name: DAG conformance selftest + live conformance tests
        run: python -m pytest tests/test_dag_conformance.py -q
      # Same family, one layer down: dag.yml pins WHAT the nightly lane runs,
      # this pins that the lane's timeout still lets it finish. tech_lab_offrender
      # was cancelled at its 40m cap every night 2026-07-19→07-26 — the declared
      # step sequence was perfectly conformant, and the publish tail never ran.
      - name: nightly lane budgets (tech_lab_offrender publish tail)
        run: python -m pytest tests/test_tech_lab_offrender_budget.py -q
      # Third layer of the same family: W2 runtime telemetry (masterplan
      # 2026-08-06). Every self-hosted daily.yml job must carry the job-start
      # mark as its FIRST step and the always() timings/85%-tripwire finish as
      # its LAST, the finish cap argument must equal the job's timeout-minutes
      # (a cap raise that skips the arg silently rescales the tripwire — the
      # tech_lab stale-label class), and a synthetic 86% run must trip the
      # line-start ::warning (masterplan §0.2 acceptance gate).
      - name: nightly runtime telemetry (W2 wiring + 85% tripwire behavior)
        run: python -m pytest tests/test_nightly_timings.py -q
      # Fourth layer, same family: daily.yml's schedule is a DST cron PAIR and the
      # root et_gate job keeps exactly one firing. The suite EXTRACTS the inline gate
      # script out of the live workflow and executes it against instants either side
      # of both DST flips, then pins the cron pair to the script's constants and that
      # every job still reaches the gate. A drifted gate skips the sole authoritative
      # nightly with nothing going red — the same silent class as the two above.
      - name: daily ET regime gate (DST pair disambiguator + wiring pins)
        run: python -m pytest tests/test_daily_et_gate.py -q
      # 2026-08-12 (#5416): a workflow FILE over ~512,000 bytes stops being
      # processed SILENTLY — cron stops firing and dispatched runs queue with
      # zero jobs, uncancellable. The budget test reds growth before the cap.
      - name: workflow file size stays under GitHub's silent processing cap
        run: python -m pytest tests/test_workflow_file_size.py -q
      # Same incident, other half. The size guard stops daily.yml being stranded
      # AGAIN; this one notices when the nightly stops producing runs for ANY
      # reason — strand, cancellation, or a green run that never advances the
      # store. The 2026-08-11/12 outage ran two full sessions unreported because
      # every instrument we had measured DATA staleness on weekend-safe budgets.
      - name: nightly liveness guard selftest (scripts/check_nightly_liveness.py)
        run: python3 scripts/check_nightly_liveness.py --selftest
      - name: nightly liveness dead-man switch (checks + wiring pins)
        run: python -m pytest tests/test_nightly_liveness.py -q

