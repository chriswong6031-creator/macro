          python -m pytest
          tests/test_publish_r2.py
          tests/test_company_intelligence_contracts.py
          tests/test_company_intelligence_views.py
          tests/test_company_intelligence_health.py
          tests/test_publish_company_intelligence_r2.py
          tests/test_company_intelligence_refresh.py
          tests/test_company_intelligence_golden_corpus.py
          tests/test_company_intelligence_golden_corpus_replay.py
          tests/test_company_intelligence_spine.py
          tests/test_company_intelligence_spine_corpus.py
          tests/test_company_theme_exposure.py
          tests/test_publish_company_theme_exposure_r2.py
          tests/test_earnings_story_promotion.py
          tests/test_earnings_story_packets.py
          tests/test_earnings_story_press_workflow.py
          tests/test_earnings_story_press_admission.py
          tests/test_earnings_story_press_ingress.py
          tests/test_earnings_story_press_stage_workflow.py
          tests/test_publish_earnings_story_packets_r2.py
