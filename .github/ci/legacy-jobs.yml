    #     job naming the file.
    #   * test_marketing_live_verify.py:250 importorskip("pandas") — the earnings
    #     guard set read from a parquet the test writes itself. marketing-social-
    #     publisher (pytest+pyyaml) was the only job naming the file, and its own
    #     comment recorded the skip as intentional ("the one pandas-dependent test
    #     importorskips") without noticing that made it run nowhere.
    # pyarrow is installed even though only test_marketing_content names it: the
    # live_verify test calls DataFrame.to_parquet, which needs a parquet engine.
    #
    # The thin lanes keep a real contract. marketing-engine's comment states it
    # ("stdlib + pytest + pyyaml only — no pandas/numpy, verified against a
    # minimal-import env"); a top-level `import pandas` in the marketing engine or
    # the publisher loop must still turn those lanes red at collection.
    #
    # Deps are byte-identical to the 22-job `pytest pandas numpy pyarrow pyyaml`
    # group (trial-budgets, outcome-spine, chart-render-data, …) that run_ci_pack.py
    # keys venv reuse on, so this job provisions NO new environment.
    #
    # Verified locally in clean venvs with each lane's exact install line:
    #   pytest pyyaml                      → 101 passed, 2 skipped
    #   pytest pandas numpy pyarrow pyyaml → 103 passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      # The lane's own tripwire: if a future edit drops pandas or pyarrow from the
      # install line above, these tests would go back to skipping silently and the
      # lane would stay green while guarding nothing. The probe makes that red, and
      # -rs prints every skip reason so a NEW skip is visible in the log.
      - name: prove the data-dependent modules are present
        run: python -c "import pandas, pyarrow, numpy"
      - name: marketing suites (data-dependent tests execute here)
        # test_marketing_breaking.py joins this fat lane 2026-07-27 (PRESS-FEEDS B1):
        # two of its tests (TestUniverseCacheAndEnrichment) build parquet fixtures and
        # were converted from a bare `import pandas` to importorskip("pandas")/("pyarrow")
        # so the thin marketing-engine lane stays pandas-free. That made them SKIP-ONLY
        # (marketing-engine was their only job) — scripts/check_skip_only_suites.py
        # requires a job that actually installs pandas+pyarrow to run them, which is here.
        #
        # test_marketing_weekend_levels.py joins 2026-07-28, same class, third time:
        # it landed named ONLY by marketing-social-publisher (pytest+pyyaml), whose
        # comment recorded the skip as intentional ("its one pandas test importorskips
        # here") — the identical sentence test_marketing_live_verify's entry above was
        # added to fix. An importorskip the thin lane can never satisfy does not make
        # a test optional, it makes it unrun, and that is what turned main red rather
        # than the suite's own lane. The thin lane keeps the file for its pandas-free
        # tests; :105's cited-level round-trip executes here.
        #
        # test_marketing_chart_coverage.py joins 2026-07-28 (#3895), same class,
        # fourth time: three of its tests importorskip pandas/pyarrow because a
        # `chart`/`watchlist` card only exists when render_chart_v2 reads real bars
        # (the tape variant has NO v1 fallback — v1 hard-draws a green "BUY" label,
        # which would contradict a "not buying yet" post). Those three are the ones
        # that actually pin the operator's defect — the widened type filter, the
        # live-gate-picks-the-variant rule, and the data/baskets/ohlcv search order
        # that made 30 of the plan's 43 tickers unchartable. Named in the thin lane
        # only, they would have skipped everywhere and the fix would have shipped
        # unguarded.
        #
        # test_marketing_hot_tape_pack.py joins 2026-07-28 (Hot Tape P1) — but as
        # the OPPOSITE case to the four above, and it belongs here from birth
        # rather than by repair. The nightly context pack is the one half of the
        # program that is deliberately pandas/numpy-heavy (it scans ~20k daily
        # parquets in a ProcessPoolExecutor), so its suite could never run in the
        # thin marketing-engine lane where its two siblings live. Named here, and
        # only here, so the split is explicit instead of a silent skip.
        #
        # test_marketing_filing_lanes.py joins 2026-07-29 (E2 review), same class
        # as the first four, fifth time: its congress/insider/house-pick tests
        # build quiver parquet fixtures behind importorskip("pandas")/("pyarrow"),
