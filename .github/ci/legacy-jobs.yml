      # workflow, so engine/mag7_regime.py and the turn events the notifier emits for it
      # were dark while the notifier itself was covered.  It rides this existing step
      # because a step is the masking unit (run_ci_pack.py returns on the first non-zero
      # step, so a later step goes dark behind an earlier red) while pytest reports
      # EVERY file inside ONE step; no new job — the manifest is at the narrow-diff
      # ceiling.  Appended LAST so a ledger-advance, failstreak or notifier regression
      # is the first failure a reader sees rather than the mag7 regime consumer failing
