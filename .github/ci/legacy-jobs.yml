  prophet-anticipation-intake:
    # ANTICIPATION A1 (status-class admission) + §6.9 R3 (structure-anchored entry
    # zones, wait_reset, zone-with-expiry-to-starter, the EARLY-TURN starter tier).
    # Enumerated at BIRTH: the unrun-suite census proved an unnamed suite is genuinely
    # never executed, and 1,135 of 1,491 suites are already dark — a new acceptance
    # battery that nothing runs is not an acceptance battery.
    #
    # Its OWN job rather than a step on `unrun-vector-*` (which already carries
    # tests/test_prophet_bridge.py): that job is documented STRUCTURALLY AT-CAP at 15
    # minutes and has repeatedly timed out on a busy pool with no regression in the
    # PR. Six of the cases here drive the real `build_prophet.main()` publisher end to
    # end — ~73 s serial on a fast box, and the whole point of them is that the lane
    # gate is exercised through the PRODUCTION caller rather than a hand-fed argument —
    # so adding them to an at-cap job would convert a proof into an unattributable red.
    #
    # engine/us_early_turn.py's indicator reads ride the same suite: the module
    # deliberately owns no arithmetic of its own (it imports confluence_tiers'
    # StochRSI/RSI-MACD/session-anchor helpers), and one test pins that import so a
    # local re-derivation fails immediately.
    if: ${{ false }}
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests beautifulsoup4 openpyxl scikit-learn
      - name: anticipation intake (status-class admission, era stamps, entry zones, shadow-ledger lane gate)
        run: python -m pytest tests/test_prophet_anticipation_intake.py -q
      # UNION ADMISSION (bake-off §A2) — registered in the job that already owns the
      # EARLY-TURN admission gate, because that is what the union re-classes. The suite's
      # load-bearing pin is the SCORED-gate zero-diff: this wiring is display-tier and a
      # verdict that moved would be the failure mode worth catching on every push. Runs off
      # two committed 700-row price fixtures, so it needs no data root and no network.
      - name: union admission (recall spine, badges, scored-gate zero-diff)
        run: python -m pytest tests/test_us_early_turn_union_admission.py -q
      # §6.9 R5 — the per-name "why not" receipts. Enumerated at BIRTH, in the job that
      # already owns the admission gate these receipts REPORT ON: the suite's core law is
      # that the headline reason is specificity-ordered rather than gate-ordered, which is
      # a statement about select_candidates' short-circuit order and would rot the moment
      # that order moved in a job nothing here watches. It also pins the receipts'
      # partition against select_candidates itself, so a gate change that this suite
      # misses cannot leave the shelf quietly disagreeing with the board above it.
      # Browser-free and a few seconds serial (it renders the dashboard template), and it
      # reuses the pip line above — no new dependency enters this job's import closure.
      - name: anticipation why-not receipts (headline specificity, fail-closed status, the shelf partial)
        run: python -m pytest tests/test_prophet_whynot_receipts.py -q
      - name: zone-basis copy (no raw enum/slug/internal state on the published entry_zone; EN+ZH)
        # Same job as the intake because it guards the same payload: `entry_zone` is
        # whitelisted onto site/prophet/index.json, so its `basis`/`conversion_evidence`
        # are user-visible copy. The leader branch used to interpolate the organ's own
        # state enum ("leader pullback (RESET_TURN) — …"); it was unreachable only
        # because nothing published the organ's coverage.
        run: python -m pytest tests/test_prophet_zone_basis_copy.py -q
      # Force-majeure 2026-08-09 outage backfill (operator 2026-08-11; design of
      # record research/PROPHET_OUTAGE_BACKFILL_2026_08.md). Enumerated at BIRTH for
      # the reason this job's header gives, and in THIS job specifically because its
      # two load-bearing cases drive the real `build_prophet.main()` publisher end to
      # end — the §0.7 nightly-passthrough gate is precisely "the production caller
      # neither drops nor rewrites a backfilled plan, and its provenance stamp
      # survives into index.json". Same import closure as the steps above (pandas +
      # the pip line already installed here); the pinned-input tests build throwaway
      # git repos under tmp_path, so nothing in this job writes the real tree.
      #
      # The suite's central law is a BOTH-DIRECTIONS set equality between plans
      # stamped origination_mode=outage_backfill* and the rows enumerated in
      # data/prophet/backfill_disclosures.json. It stays meaningful before the
      # artifact exists (both sets empty = no undisclosed backfill) and becomes the
      # segregation gate the moment it does.
      - name: force-majeure outage backfill (segregation both ways, nightly passthrough, collision rule, idempotence)
        run: python -m pytest tests/test_prophet_outage_backfill.py -q
      # Force-majeure 2026-08-11 outage RECONSTRUCTION (operator 2026-08-13). A STEP in
      # this job rather than a job of its own: it shares this job's import closure and
      # its whole point is that the two windows are checked together — the segregation
      # law above now reads a REGISTRY of chartered windows built from both lanes'
      # constants, so splitting them across jobs would let one half go green against a
      # registry the other half had already widened.
      #
      # What is pinned here and nowhere else: the price truncation (a poisoned 2026-08-12
      # bar must not reach the tree the board builder reads, and the fence that re-proves
      # it must fire when one is planted), the chronology refusal, and the pinned
      # pre-#5370 code vintage. The tests are pure — no board is built in CI.
      - name: force-majeure outage reconstruction 2026-08-11 (price truncation, chronology, pinned vintage)
        run: python -m pytest tests/test_prophet_outage_backfill_20260811.py -q
      # The user-facing half of the same feature (#5301): the plain-word EN/ZH chip,
      # receipt and footnote a reconstructed plan carries, plus the record split.
      # Wired HERE, with the lane that mints those plans, and wired at all because it
      # arrived registered by NO run: step — `scripts/audit_unrun_tests.py` reported
      # it as a dark suite on the merge. The two halves share one subject and one
      # copy source of truth (prophet_bridge's RECONSTRUCTED_* constants), so a change
      # that greens one while reddening the other should fail in a single job.
      - name: reconstructed-origination disclosure (chip + receipt + footnote + record split, EN/ZH)
        run: python -m pytest tests/test_prophet_origination_disclosure.py -q

  coiled-mtf-anchor-era:
    # COILED bonus/fire + mtf trend.d3 absolute session anchor (era
    # coiled-mtf-abs-session-2026-08-06, ruling research/COILED_MTF_SESSION_ANCHOR_
    # REPAIR_BY_FABLE.md). test_coiled.py was named by NO run step in any workflow
    # before this (the unrun-suite hole the washout-turn-organ comment above records
    # for test_mtf_upturn.py) — enumerated here together with the era's invariance
    # battery, which pins start-invariance k=1..6 on real NYSE/CN session fixtures,
    # the one-era-two-modules equality, the payload era stamps, and the CN market
    # threading. The battery reads the tracked CN reference store
    # (data/china/000001.SS.parquet) and skips that single test if absent.
    if: ${{ false }}
    timeout-minutes: 6
    #
    # CURATED SCOPE (2026-08-15 wave 4). `scope: exclusive` makes the paths below
    # REPLACE inference. Like cn-standout-audit above, this job had NO owned tier:
    # all 28 inferred patterns were opaque fallback. Same cause — test_coiled.py
    # imports scripts/build_china_library.py, which #5754 pointed at
    # engine/china_intel_interest.py -> china_intel_hub and the full altdata
    # convergence universe — and the same measured effect: it began matching
    # templates/index.html, a file neither suite reads.
    #
    # SCRIPTS IS ENUMERATED HERE, DELIBERATELY UNLIKE cn-standout-audit. That job
    # globs scripts/** because two of its suites rglob the tree and AST-scan it;
    # these two suites contain no traversal whatsoever (verified 2026-08-15: zero
    # rglob/glob/os.walk/subprocess in either file, and
    # tests/test_coiled_mtf_anchor_invariance.py derives ZERO ambiguities). The
    # only construct that put scripts/** in this job's fallback tier is the
    # dynamic import at scripts/build_china_library.py:1807, whose real targets
    # are all collectors.* — covered by the collectors/** glob below. So the six
    # scripts/ files named here ARE this job's whole scripts/ closure.
    #
    # THE GLOBS ARE EARNED: collectors/** for that dynamic import (its seven
    # tushare_* drip modules are unresolvable by the walker and therefore
    # invisible to the coverage test — enumeration would silently drop them);
    # engine/** because enumeration would rot on every engine import, and
    # engine/risk_radar.py:375 traverses roots=data,engine anyway; config/** and
    # data/** for the roots=config,data parquet/jsonl traversals in
    # engine/smart_money.py, lib/ai_costs.py:417 and collectors/base.py:124, plus
    # the no-suffix data/ traversal at scripts/seed_china_ths_baskets.py:318.
    # data/** is additionally REQUIRED by this job specifically: the invariance
    # battery reads the tracked CN reference store at
    # tests/test_coiled_mtf_anchor_invariance.py:268
    # (config.data_dir()/"china"/"000001.SS.parquet") and SKIPS if absent — a
    # runtime read that resolves through no literal, so under-naming data/ would
    # turn the era's start-invariance guard green-by-skip on the very edits that
    # can break it. Widening is the safe direction; do not add templates/**.
    runs-on: ubuntu-latest
    scope: exclusive
    paths:
      - "engine/**"
      - "collectors/**"
      - "config/**"
      - "data/**"
      - "lib/__init__.py"
      - "lib/ai_costs.py"
      - "lib/closes_panel.py"
      - "lib/cn_calendar.py"
      - "lib/config.py"
      - "lib/filing_value_units.py"
      - "lib/nyse_calendar.py"
      - "lib/store.py"
      - "lib/ticker_aliases.py"
      - "lib/ticker_popularity.py"
      - "research/US_BOARD_MEASUREMENT.md"
      - "scripts/__init__.py"
      - "scripts/build_chart_data.py"
      - "scripts/build_china_library.py"
      - "scripts/seed_china_ths_baskets.py"
      - "scripts/thematic_rotation_phase0.py"
      - "scripts/validate_regime_fwd.py"
      - "site/china_intel/**"
