        # The gates stay; the suites get a lane that satisfies them. The thin lane
        # keeps test_chart_facts and test_marketing_bare_cashtag for their
        # dependency-free tests, which is the split the guard is asking for.
        run: python -m pytest tests/test_marketing_content.py tests/test_marketing_live_verify.py tests/test_marketing_breaking.py tests/test_marketing_weekend_levels.py tests/test_marketing_chart_coverage.py tests/test_marketing_hot_tape_pack.py tests/test_marketing_filing_lanes.py tests/test_chart_facts.py tests/test_marketing_bare_cashtag.py tests/test_confluence_honesty.py tests/test_tech_confluence.py tests/test_news_translate_en.py -q -rs

