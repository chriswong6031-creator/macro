  hub-a11y:
    if: ${{ false }}
    # Hub UX program (W5 — a11y regression guard): six static checks — (a)-(d) on
    # every committed page that embeds the globe deck (gd-stage presence), (e)-(f)
    # on the shared JS assets those pages load:
    #   (a) no focusable element (button/a/input/[tabindex] without tabindex="-1")
    #       statically inside an aria-hidden="true" subtree.
    #   (b) html tag has a non-empty lang= attribute AND the inline boot script in
    #       <head> references data-lang (bilingual language-detection before paint).
    #   (c) the light-theme pill contrast override rule exists with accent share <= 60%.
    #   (d) viewport meta includes viewport-fit=cover; body CSS references
    #       env(safe-area-inset for notch/home-indicator padding.
    #   (e) site/theme.js contains documentElement.lang sync (WCAG 3.1.1 tripwire).
    #   (f) site/mm_brain.js keeps the Brain launcher keyboard-operable: role="button"
    #       + tabindex="0" on #mmb-launch, a keydown handler for Enter AND Space, and
    #       a #mmb-launch:focus-visible ring (WCAG 2.1.1 tripwire — it shipped as a
    #       bare <div> until #3682, unreachable from the keyboard on every page).
    # Pure stdlib / html.parser — no browser, no extra deps, safe on ubuntu CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest
      - name: hub a11y guard (5 checks on globe-deck pages)
        run: python -m scripts.check_hub_a11y site
      - name: hub a11y guard unit tests (violating + passing fixtures per check)
        run: python -m pytest tests/test_check_hub_a11y.py -q

  font-ui-defined:
    if: ${{ false }}
    # Font-UI definition guard (PR #2647 recurrence tripwire): any template whose
    # body-level CSS sets the page font via var(--font-ui) must either link
    # theme.css (<link rel="stylesheet"> href attribute — never the bare string,
    # CSS comments mention theme.css) or define --font-ui: locally (+ warning if
    # the _interfonts.html.j2 include is missing). An undefined custom property
    # makes font-family invalid-at-computed-value -> unset, so the whole page
    # renders in the browser default serif (Times) — the #2195 sweep broke 6
    # standalone page families this way. Partials only warn (token resolves at
    # host-page level). Pure stdlib / re — no browser, no extra deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest
      - name: font-ui definition guard (body-level var(--font-ui) coverage)
        run: python -m scripts.check_font_ui_defined templates
      - name: font-ui guard unit tests (violating + passing fixtures per check)
        run: python -m pytest tests/test_check_font_ui_defined.py -q
