  vintage-pin-fence:
    scope: exclusive
    if: ${{ false }}
    # Fail-closed: a PR must not equality-pin a live nightly store. Measured
    # 2026-08-13: govrev latest/candidates ``assert 23 == 8``, options
    # ``episodes.jsonl`` 384→1206 used as a closed replay, prophet open-keys
    # 10→11, then after #5515 the spine parquet (pack-7 / #5547) and Release
    # Radar inflation-truth artifacts (unrun-release-forecast). Each one
    # reddened main and then, through merge-on-green, the entire armed queue.
    # Legal: a watermarked prefix slice, a census derived from a committed
    # receipt, a named disclosure set, or the #5547 cold-test bind of
    # ``config.data_dir`` to empty tmp. Do not re-type the product literals
    # and do not grandfather by filename — a new ``== N`` in the same file
    # still reds.
    # The rglob over tests/test_*.py is load-bearing for path-aware scope:
    # inference claims tests/**/*.py so this runs on PRs that touch tests,
    # not only after the next jam. Main's full suite still runs it.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    paths:
      - tests/**
      - scripts/check_vintage_pin_fence.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml
      - name: vintage-pin fence selftest (post-5515 detonation classes red, legal green)
        run: python3 scripts/check_vintage_pin_fence.py --selftest
      - name: vintage-pin fence (new live-store equality pins)
        run: python3 scripts/check_vintage_pin_fence.py
      - name: vintage-pin fence unit tests
        run: python -m pytest tests/test_vintage_pin_fence.py -q

  validated-claims:
    if: ${{ false }}
    # BC-2 PR gate: the word "validated" in user-facing surfaces must trace to a
    # backed claim. This is the PR-time companion to the nightly calibration run
    # (cycle-calibration.yml/calibrate). A sibling builder is fixing the current
    # findings — wire it regardless; final verification happens after both land.
    # Law source: CLAUDE.md ("The word 'validated' in user-facing text is CI-enforced").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validated-claims selftest (gate fires on synthetic unearned claim)
        run: python3 scripts/check_validated_claims.py --selftest
      - name: no unearned 'validated' claims in user-facing surfaces
        run: python3 scripts/check_validated_claims.py
      # design.system_ratchet (R0, REPORT-ONLY — always exits 0). Hosted here and
      # not in a job of its own for two reasons: a 181st manifest entry reds the
      # ci_pack narrow-diff ceiling, and this job ALREADY owns templates/** in the
      # derived scope, so the step costs the selector nothing. The checker is
      # stdlib-only, hence no pip install. R1 (blocking) is a later PR that flips
      # the registry severity AND swaps `--mode report` for `--mode enforce
      # --registry data/...` in lockstep — never one without the other.
      - name: design-system ratchet selftest (each rule fires on its own fixture)
        run: python3 scripts/check_design_system.py --self-check
      - name: design-system ratchet R0 (report-only drift census over templates/)
        run: python3 scripts/check_design_system.py --mode report

  template-site-sync:
    if: ${{ false }}  # executed inside ci-pack — NOT a disabled gate; see the ci-pack job.
    # (Which pack runs it is weight-balanced and shifts as jobs are added, so it is
    # deliberately not named here; resolve it with run_ci_pack.py --validate-only.)
    # ui.template_site_sync PR gate: every plain-copy page asset (templates/<name>
    # that also ships as site/<name>) must byte-match at every commit — a one-sided
    # reword creates the divergence window the render lanes then propagate at an
    # unpredictable later time. 2026-07-07 incident: engine-render commit 2ae709f9f0
    # resurrected pre-#1793 "validated" wording in site/sector_cycles.js because the
    # push step's `git pull --rebase -X theirs` favored the run's checkout-time copy
    # over the reword that merged mid-render. The render lanes now re-sync post-rebase
    # (--fix); this job keeps PRs from arming the window in the first place.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # jinja2/markupsafe are for the chat-nav guard below, which RENDERS
      # _site_nav.html.j2 rather than grepping it (CI packs install minimal deps,
      # not requirements.txt — an unlisted import here is an ImportError, not a skip).
      - name: install minimal deps (theme.js bake reads config.yml)
        run: pip install pyyaml pytest jinja2 markupsafe
      - name: template-site-sync selftest (gate fires on synthetic divergence)
        run: python3 scripts/check_template_site_sync.py --selftest
      - name: site copies of template assets must byte-match templates/
        run: python3 scripts/check_template_site_sync.py
      # The other half of plain-copy integrity: byte-matching its site copy says
      # nothing about whether chat.html's HEADER still matches the shared partial.
      # It did not — 12 live pages missing, 17 removed pages still linked — because
      # the block was hand-copied and no gate compared it to anything.
      - name: chat-nav selftest (gate fires on a hand-edited header)
        run: python3 scripts/sync_chat_nav.py --selftest
      - name: chat.html's header must match _site_nav.html.j2
        run: python3 scripts/sync_chat_nav.py
      # ...and the suite itself, which was NAMED in ci.yml's paths trigger but
      # EXECUTED by no job — a trigger fires the pack, it does not run the file, and
      # every pytest invocation in this repo names its files explicitly (there is no
      # tests/ dir-wide sweep to pick it up). The two script steps above only compare
      # the <nav> element, so the four assertions that live OUTSIDE it were dark:
      # the navigation-refresh.css / chat_nav.css stylesheet law, the whole-chrome
      # check, the data-base shim count (in <head> — and chat.html is exempt from the
      # write_page guard precisely because sync_chat_nav writes it raw), and the
      # bilingual render. Deps are already installed above: pyyaml/pytest/jinja2/
      # markupsafe is the whole closure, verified green against exactly that set.
      - name: chat-nav suite (the assertions outside the <nav> element)
        run: python -m pytest tests/test_chat_nav_sync.py -q
      # ui.asset_stamp — the OTHER half of this law, and the reason it bit users. The
      # `--fix` above rewrites the site copy of every plain-copy pair FROM templates/,
      # and it runs AFTER the stamping sweep in every lane, so a ?v= stamp written only
      # site-side was reverted before it could reach main. #3573 fixed the rewrite and
      # still could not move the stamp on these pages: #3617's onboard.css fix sat live
      # at the origin while every returning browser kept the old sheet (site/index.html
      # linked onboard.css?v=cfdca9e2, served `immutable, max-age=1y`); #3624 hand-bumped
      # that one page. optimize_assets now stamps the templates/ side too — which only
      # reaches main if the lane STAGES templates/, and only covers pages a sibling lane
      # lands mid-run if the lane also re-stamps POST-rebase. These pin all three.
      - name: "?v= stamps — paired-page round-trip + lane ordering/staging (ui.asset_stamp)"
        run: >
          python -m pytest
          tests/test_asset_stamp_lane_order.py tests/test_optimize_assets.py
          tests/test_asset_stamp_refresh.py -q
      # closing-bell duplicate-render dedup — the OTHER render-lane contract that only
      # exists in workflow YAML, and the one that shipped broken from day one: the
      # session-day guard dedup'd on the stamp's `as_of` (an ISO timestamp) against a
      # bare ET date, so the DST pair's summer line re-rendered every trading day
      # (median 85.0 min of a two-Mac pool, straight through the nightly's fire window).
      # Same deps as the suite above (pytest + pyyaml); the test executes the workflow's
      # real writer heredoc, so a mirrored copy can never drift green past it.
      - name: "closing-bell dedup — stamp writer/reader field contract (DST pair safety)"
        run: python -m pytest tests/test_closingbell_dedup_contract.py -q
      # ui.interfonts_theme_sync: templates/_interfonts.html.j2 carries the six
      # Inter @font-face blocks copied verbatim from templates/theme.css (#2119,
      # for standalone pages that don't link theme.css). A theme.css font edit
      # that skips the partial silently de-fonts those pages — same drift class,
      # same job.
      - name: interfonts-sync selftest (gate fires on synthetic drift)
        run: python3 scripts/check_interfonts_sync.py --selftest
      - name: _interfonts partial @font-face blocks must match templates/theme.css
        run: python3 scripts/check_interfonts_sync.py
      # ui.data_base_shim: same page-asset drift family, and it had NO CI lane at
      # all — which is how scripts/build_leader_radar.py sat red on main writing
      # site/leader_radar.html with a raw write_text instead of lib.pages.write_page
      # (the render lane's inject_data_base sweep healed the committed copy after
      # the fact, so only a standalone builder run showed the missing shim).
      # test_site_shim carries all three layers: lib.pages units, the committed-page
      # tripwire, and the source guard against raw write_text on an *.html target.
      # NOTE on trigger breadth: the source guard scans scripts/**+engine/** for
      # offenders, but listing those globs under `paths:` would run this pack on
      # nearly every Python PR — a CI-cost call for the operator (same reasoning as
      # the gh-annotation guard above). ci-main-heartbeat.yml runs this job on a
      # schedule against main with NO path filter, which is what keeps the guard
      # from rotting red on main invisibly again.
      - name: data-base shim guard (lib.pages units + committed-page tripwire + source guard)
        run: python -m pytest tests/test_site_shim.py -q
      # Same module, same class of post-render page rewrite: externalize_css lifts
      # inline <style> into hashed sheets via lib.pages.externalize_css_text and
      # writes through write_page. Also unwired until now.
      #
      # The suite also carries the ui.template_site_sync sweep-side guards (#3650):
      # the sweep must SKIP the plain-copy HTML pairs (index.html/chat.html). Every
      # lane runs `check_template_site_sync --fix` after the sweeps and before
      # `git add site/`, re-copying those pages FROM templates/, so a site-only lift
      # is reverted before it reaches main — while still minting the hash file, which
      # the sweep's own prune can never reclaim (it looks referenced in the same run
      # that creates the link). That accreted 3 dead stylesheets / 92,412 bytes.
      # Writing THROUGH to templates/ is deliberately not the fix — see the module
      # docstrings in scripts/externalize_css.py.
      - name: inline-CSS externalization units + pair-skip guards
        run: python -m pytest tests/test_externalize_css.py -q
      # design-system packet PR-0(a)(b): the site --fs-* type ramp at :root and the
      # three shared .mx-* primitives. Same job because it is the same file — a
      # templates/theme.css edit is what breaks all of it, and this job is already the
      # theme.css integrity lane (interfonts sync + plain-copy byte-match above).
      # Browser-free BY DESIGN: the packs install minimal deps, so the language-toggle
      # check resolves the cascade in stdlib rather than importorskip-ing playwright
      # and reporting green while proving nothing. Deps are the set installed above
      # (pytest is the whole closure here — the suite imports only re/pathlib).
      - name: design-system foundations (site type ramp at :root + shared .mx-* primitives)
        run: python -m pytest tests/test_design_system_foundations.py -q

  data-base-shim:
    if: ${{ false }}
    # ui.data_base_shim: every builder must write site/**/*.html through
    # lib.pages.write_page, which injects the depth-aware R2 fetch shim. A raw
    # write_text drops it, so a standalone builder run ships the page with its
    # per-ticker fetches pointed at Pages instead of R2.
    #
    # This had NO CI lane anywhere, and the source guard it did have only matched
    # a LITERAL *.html target on the write line — blind to the two-line form
    # (`out = site_dir / "x.html"` then `out.write_text(...)`) that nine builders
    # actually used. The committed pages looked fine because the render lane's
    # inject_data_base sweep heals them after the fact, so nothing anywhere failed.
    #
    # Its own job rather than a few more steps on template-site-sync: the builder
    # suite RUNS each builder against a fixture root, so it needs the data stack
    # (jinja2/pandas/numpy/pyarrow) that the light sync job deliberately avoids —
    # and a differing install command would split that job's shared venv anyway.
    #
    # NOTE on trigger breadth: the source guard scans scripts/**+engine/**, but
    # listing those globs under `paths:` would run this pack on nearly every Python
    # PR — a CI-cost call for the operator (same reasoning as the gh-annotation
    # guard above). ci-main-heartbeat.yml runs this job on a schedule against main
    # with NO path filter, which is what keeps it from rotting red invisibly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps (the builder suite runs real builders)
        run: pip install pytest pyyaml jinja2 pandas numpy pyarrow
      # test_site_shim.py itself (units + tripwire + source guard) runs on the
      # template-site-sync lane, which #3635 wired and which needs only pyyaml.
      # This job exists for the suite that lane CANNOT host: it RUNS each builder,
      # so it needs the data stack below.
      - name: every page builder emits the shim (runs each against a fixture root)
        run: python -m pytest tests/test_builder_shim_writes.py -q

  grader-manifest:
    if: ${{ false }}
    # F1 (Metabolism Phase 0 / R-AUT-7): grader-immutability manifest guard.
    # The fitness-producing files (grade_thematic, foresight_leadlag, theme_placebo,
    # qledger_falsifier, sample_qledger_placebo) are registered in
    # config/grader_manifest.yml with their SHA-256 content hashes.  Any drift in
    # a grader file — whether from a loop PR or a human PR — fails RED here.
    # Loop-authored PRs are additionally blocked by the F2 self-mod-fence job.
    # Selftest proves the check detects simulated hash drift and missing files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml
      - name: grader-manifest selftest (drift detection + fail-closed proof)
        run: python3 scripts/check_grader_manifest.py --selftest
      - name: grader-manifest live check (hash drift is a hard failure)
        run: python3 scripts/check_grader_manifest.py
      - name: grader-manifest test suite
        run: python -m pytest tests/test_grader_manifest.py -q

  self-mod-fence:
    if: ${{ false }}
    # The Stop hook is itself a release-control subject. Scope inference sees the
    # test imports but not a hook reached by subprocess/path, so an edit under
    # .claude/hooks/ could otherwise skip the job that owns its contract.
    paths:
      - ".claude/hooks/**"
      - scripts/agentos.py
      - scripts/ci_authority.py
      - scripts/ci_authority_paths.py
      - scripts/ci_semantic_proof.py
      - scripts/check_self_mod_fence.py
      - tests/test_agent_worktree_roots.py
      - tests/test_agentos_compile.py
      - tests/test_agentos_schema.py
      - tests/test_agentos_status.py
      - tests/test_self_mod_fence.py
      - tests/test_ci_authority.py
      - tests/test_ci_semantic_proof.py
      - tests/test_ship_loop_guard.py
      - tests/test_ship_loop_semantic.py
      - tests/test_sparse_worktree_profile.py
    # F2 (Metabolism Phase 0 / R-AUT-5): self-modification fence.
    # Hard-fails any PR whose branch name or commit trailers carry the loop
    # namespace (metabolism/* or claude/loop-*, or 'Loop-Authored:' trailer)
    # AND whose changed-file list touches the IMMUTABLE set.
    # Human/operator PRs pass freely.  Fail-closed: unclassifiable → blocked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml
      - name: self-mod-fence selftest (all four cases proven)
        run: python3 scripts/check_self_mod_fence.py --selftest
      - name: ship-loop guard contract (dirt, branch namespace, render scoping)
        # The Stop hook that enforces commit->merge->render->live had NO CI at all,
        # which is how its render precondition shipped scoped to the whole session
        # range: on a shared main that sweeps in concurrent sessions' templates/
        # merges and demands a render on a merge commit that can never have one.
        # It also owns the exact claude/* delivery-branch prefix: a look-alike or
        # codex/* branch must fail before stand-down or GitHub probes can release it.
        run: python -m pytest tests/test_ship_loop_guard.py tests/test_ship_loop_semantic.py tests/test_agent_worktree_roots.py tests/test_sparse_worktree_profile.py -q
      - name: self-mod-fence live check (loop PR + immutable → BLOCKED)
        run: |
          BRANCH="${{ github.head_ref }}"
          TRAILERS=""
          FILES=""
          PARSE_RC=0
          FILES=$(python3 scripts/check_self_mod_fence.py --print-planner-files) || PARSE_RC=$?
          if [ "$PARSE_RC" -eq 2 ]; then
            echo "::error:: self-mod-fence: CI_CHANGED_FILES_FILE/CI_CHANGED_FILES_JSON malformed — fail-closed (exit 1)." >&2
            exit 1
          fi
          if [ "$PARSE_RC" -eq 0 ]; then
            # ci-plan already listed the diff (packs are fetch-depth:1 after #5564;
            # origin/main...HEAD is often a bad revision — measured #5556/#5519/#5499).
            if [ -z "$FILES" ]; then
              echo "self-mod-fence: ci-plan reported no changed files — zero changes to classify (pass)"
              exit 0
            fi
          else
            # Unset env (local / pre-#5564): fall back to git. Fail-closed only when
            # that fallback cannot determine files either.
            git fetch origin ${{ github.base_ref || 'main' }}
            TRAILERS=$(git log --format="%B" origin/${{ github.base_ref || 'main' }}..HEAD 2>/dev/null || echo "")
            FILES=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD 2>/dev/null || echo "")
            if [ -z "$FILES" ]; then
              if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && \
                 git merge-base --is-ancestor HEAD "origin/${{ github.base_ref || 'main' }}" 2>/dev/null; then
                # Dispatch on main itself (the ship-loop guard's E1 unblock lever,
                # `gh workflow run ci.yml --ref main` — hooks #3677): HEAD is main or an
                # ancestor of it, so the empty three-dot diff is VERIFIED-empty — there is
                # no PR and no self-modification to classify. R-AUT-5's fail-closed
                # contract targets UNDETERMINABLE diffs (git errors, shallow clones,
                # base-ref failures), not this case. Before this arm existed every
                # dispatch-at-tip run redded here, which made the green-main E1 evidence
                # unsatisfiable by construction (observed run 30207008917, 2026-07-26).
                # The ancestor form (not tip-equality) keeps the arm valid when main
                # advances between dispatch checkout and this step; a dispatched branch
                # carrying real commits still has a non-empty diff and is classified
                # by the python fence below as always.
                echo "self-mod-fence: workflow_dispatch with HEAD on main — zero changes to classify (pass)"
                exit 0
              fi
              echo "::error:: self-mod-fence: could not determine changed files — fail-closed (exit 1)." >&2
              echo "Possible causes: CI_CHANGED_FILES_FILE/CI_CHANGED_FILES_JSON unset/malformed, git diff error, or base_ref resolution failure." >&2
              exit 1
            fi
          fi
          TRAILERS=$(git log --format="%B" origin/${{ github.base_ref || 'main' }}..HEAD 2>/dev/null || echo "")
          python3 scripts/check_self_mod_fence.py \
            --branch "$BRANCH" \
            --files $FILES \
            --trailers "$TRAILERS"
      - name: self-mod-fence test suite
        run: python -m pytest tests/test_self_mod_fence.py tests/test_ci_authority.py -q
      - name: agent-os record contract (schema fail-closed, join fail-open)
        # ORDERED LAST IN THIS JOB, deliberately. `run_ci_pack.py:_run_job` returns on
        # the FIRST nonzero step, so any step placed before `self-mod-fence live check`
        # can make that fence never run — the F2 fence would go dark for the PR while
        # the job reports a failure that has nothing to do with self-modification.
        # A knowledge-plane record check must never be able to blind a security fence,
        # so it sits behind every fence step in this job.
        #
        # Folded in as a STEP, not a new job, also deliberately: the manifest sits at
        # the narrow-diff ceiling (test_representative_narrow_diffs_skip_at_least_one
        # _quarter_of_jobs asserts selected <= len(jobs)*4//5), so adding a job can red
        # an unrelated pack, and a `paths:` scope cannot fix it — infer_job_scopes()
        # UNIONS declared paths with inferred ones, so a declaration only ever WIDENS.
        # Keeping the job COUNT fixed keeps that arithmetic still.
        run: |
          # Direct invocation FIRST and deliberately: the pytest suite skips itself
          # when agentos/ is outside a sparse cone, so a store that failed to check
          # out would otherwise pass as a skip. This line cannot skip.
          python3 scripts/agentos.py validate
          python -m pytest tests/test_agentos_schema.py tests/test_agentos_status.py \
            tests/test_agentos_compile.py -q

  capability-broker:
    if: ${{ false }}
    # F3 (Metabolism Phase 0 / §3 of masterplan): capability broker + redline scanner.
    # The capability broker (engine/neuralweb/capability_broker.py) resolves capability
    # IDs to ref names only — never secret values.  The redline scanner hard-fails on
    # any high-entropy string or secrets.* value reference in the manifest or broker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        # pandas/numpy: the metabolism v2 suite includes tests/test_metabolism.py, whose
        # TestAdaptCortexAttention imports engine/neuralweb/query.py (numpy+pandas). This
        # job is the ONLY CI runner of that suite — importorskip would silence the tests.
        # anthropic: test_cortex.py's rate-limit resilience test imports anthropic at
        # runtime to patch anthropic.Anthropic.__init__ (real import, not mocked).
        # pyarrow: SA-W3 accountability suite (#2451) reads parquet inside this job
        # requests: the v8 reflex-arc reping tests (#2442) patch scripts.notify.send_telegram,
        # and scripts/notify.py does a real `import requests` at module import — without it
        # the patch target fails to resolve and 5 reflex tests die at import, not on behavior.
        run: pip install pytest pandas numpy pyyaml anthropic pyarrow requests
      - name: capability-redline selftest (planted secret caught; clean real files pass)
        run: python3 scripts/check_capability_redline.py --selftest
      - name: capability-redline live scan (hard fail on secret values or value-capture)
        run: python3 scripts/check_capability_redline.py
      - name: capability broker + redline test suite
        run: python -m pytest tests/test_capability_broker.py -q
      - name: metabolism v2 suite (lifecycle tier-mirror + promotion fence + inertness)
        run: python -m pytest tests/test_metabolism.py tests/test_metabolism_v2a.py tests/test_metabolism_v2b.py tests/test_metabolism_v2c.py tests/test_metabolism_v2d.py -q
      - name: metabolism v3 suite (memory + context + integration)
        run: python -m pytest tests/test_metabolism_v3_memory.py tests/test_metabolism_v3_context.py tests/test_metabolism_v3_integration.py -q
      - name: metabolism propose/adjudicate suite (lobe threading + learning wire)
        run: python -m pytest tests/test_metabolism_propose_adjudicate.py -q
      - name: metabolism v4 W3 suite (mission self-model + kill registry)
        run: python -m pytest tests/test_metabolism_v4_w3_mission.py -q
      # Registry ROW/KEY shape, checked before the drift check below: drift only
      # proves the compiled artifact matches the markdown, never that the markdown
      # is well-formed. This suite was strictly dark until 2026-08-06 — named by no
      # `run:` step in any workflow — and three malformed rows shipped to main
      # underneath it: a §4 row keyed `KILL-` (the #4607 reclaim-veto ruling, a §2
      # kill misfiled as a §4 hold), and two rows whose extra cell shifted every
      # column left so `dict(zip(headers, cells))` DROPPED `Ruling / source`
      # (KILL-PM4-OVERHEAD-SUPPLY compiled to verdict "\" with no source, and the
      # LSR row's generated matcher became `kill.{0,30}liquidity.{0,30}shock` —
      # a blocklist pattern matching its own key text instead of the topic it is
      # supposed to block). A registry guard nothing executes is not a guard.
      - name: DO_NOT_REBUILD registry keys + row shape (cite-by-key contract)
        run: python -m pytest tests/test_dnr_registry_keys.py -q
      - name: blocklist drift check (compiled registry must match DO_NOT_REBUILD.md)
        run: python3 scripts/check_blocklist_drift.py
      # Wired 2026-08-06: named by NO run: step since it landed, and untriggerable
      # (P3, strictly dark) — so the registry every session is told to read before
      # proposing work had no executing guard at all. It was red on main, and while
      # dark it also let two more defects ship that no other check can see: a row
      # whose Key was pasted twice (#4625) and a `\ |` typo for `\|`, both of which
      # overflow the 4-column header. `zip(headers, cells)` truncates the overflow
      # and shifts every column left, so the compiled registry carried a key as a
      # topic, a topic as a verdict, and lost the ruling entirely — while the key
      # still looked well-formed. Sits with the drift check above because it guards
      # the same two files, and needs nothing the install line does not already have.
      - name: DO_NOT_REBUILD key contract — section prefixes, uniqueness, column arity
        run: python -m pytest tests/test_dnr_registry_keys.py -q
      - name: metabolism v4 w1 suite (real BUILD dispatch — R-V4-2)
        run: python -m pytest tests/test_metabolism_v4_w1_dispatch.py tests/test_metabolism_buildlane.py -q
      # tests/test_ollama_provider.py joins its siblings 2026-08-06. It was DARK
      # since it shipped — no `run:` line anywhere in .github named it, so its
      # base-url allowlist and payload-translation guards had never once been
      # executed by CI. It rides here rather than in a marketing pack because
      # the module it covers is a PROVIDER: llm_auth (already on this line) is
