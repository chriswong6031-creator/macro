    # (86.7% of snapshot rows, ~1475 of 1702 names).  Spec §3 says missing
    # dollar_adv_20d must PASS with liq_unknown=True.
    # Fix: adv.isna() | adv.ge(_LIQ_ADV_MIN) in _apply_liquidity().
    # Four suites:
    #   test_pick_lab_liquidity.py — four required cases (null-adv pass,
    #                                below-threshold excluded, above-threshold
    #                                pass, close<5+null-adv excluded) plus
    #                                boundary / multi-row regression pins.
    #   test_pick_lab_core.py      — full core suite must not regress.
    #   test_pick_lab_hk_runner.py — HK runner end-to-end + regression pins
    #                                (catalyst/standouts/stale-cross shapes,
    #                                _col container values, snapshot upsert).
    #   test_pick_lab_hk_render.py — HK lab page renderer suite (needs jinja2).
    # Network-free; no data/ writes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
