  ric-w2-surface:
    if: ${{ false }}
    # RIC W2 SURFACE: whole-market dealer-surface history engine unit tests.
    #   test_options_surface.py — 24 tests covering:
    #     dealer-sign convention (call-heavy +GEX, put-heavy -GEX)
    #     dealer_sign_assumption always printed in every row
    #     |·|-magnitude concentration shares bounded [0,1]
    #     front7_abs_gex/charm_share = 1.0 when all contracts front-week
    #     front7_abs_gex/charm_share = 0.0 when all contracts back-bucket
    #     expiry bucket breakdown: fw+fm+bk == net_gex_bn
    #     root_class mapping: SPY→index_etf, XLK→sector_etf, SMH→industry_etf
    #     zero-OI rows excluded (→ None)
    #     empty/None greeks/OI → None (no exception)
    #     oi_frac bounded [0,1]
    #     SURFACE_ROSTER frozen at 19 roots (XLC excluded, audit 2026-07-17)
    # Zero real-store reads; all inputs are synthetic DataFrames.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: W2 SURFACE engine unit tests
        run: python -m pytest tests/test_options_surface.py -v

  collect-identity:
    if: ${{ false }}
    # Registered-visitor identity capture (app/main.py /api/collect): Supabase session-cookie
    # parsing (single + chunked base64url), secretless cached token verification (monkeypatched),
    # and the EO-Client-IP real-IP precedence. Imports app.main, so fastapi is installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        # pyyaml joined the line when the Earnings Wire router stopped being
        # mounted inside `except ImportError: pass`. app.main now imports
        # app.earnings unconditionally (a paid contract must fail startup
        # loudly), and that pulls engine/earnings_narrative/__init__.py ->
        # promotion.py -> yaml. Under the swallow this job never noticed the
        # dependency because the failed import was silently discarded — the
        # same silence that hid the dropped paid routes. app.main also mounts
        # app.market_memory eagerly now, so this isolated lane must declare its
        # direct requests import just like the other app.main suites.
        run: pip install pytest fastapi pyyaml requests
      - name: identity capture unit tests
        run: python -m pytest tests/test_collect_identity.py -v

  research-vault:
    if: ${{ false }}
    # RV W1 ingestion spine: the sidecar contract normalization + every fallback
    # (missing/blank/bad-JSON, never-drop), catalog upsert ordering + institutions
    # rollup, corpus FTS5 build + a BODY-only search (proves body is searchable) +
    # institution/date facets, and the end-to-end ingest via the LOCAL store backend
    # (idempotency: a 2nd run ingests 0; receipts; needs_metadata path). No R2, no
    # poppler — LocalStore + a monkeypatched pdftotext keep the suite fully offline.
    # RV W3 page build: the SSR shell renders from empty + seeded catalogs (honest
    # empty state / SEO-baked cards), hero + lanes + viewer modal markup, balanced
    # EN/ZH spans, plain-English <title>, compliance copy, and the body-never-leaks
    # projection. jinja2 (already a repo dep) is the only page-build need.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        # Pure stdlib engine (sqlite3 + subprocess) + jinja2 for the W3 page build.
        # pyyaml: build_research_vault imports lib.config (yaml) at module level
        # since #3315 — the lane was red on every PR until it was added here.
        # pypdf: pure-python, so it keeps the suite hermetic while making the probe's
        # PRIMARY rung testable (page count + Info dict). The poppler `pdfinfo` rung —
        # the one production actually uses, since the hourly lane installs neither
        # pypdf nor anything else beyond boto3+pyyaml — needs a system package, so its
        # two tests skip when `pdfinfo` is absent and run on the self-hosted Mac.
        # boto3 (added 2026-07-26 by check_skip_only_suites.py): the r2_store
        # credential-precedence test is `importorskip("boto3")`-gated, and this was
        # the ONLY job naming test_research_vault.py — so it executed nowhere. There
        # is no lazy-import contract to protect here: the production hourly lane
        # installs boto3, and the client is built offline (creds are not validated
        # until a call), so the test stays hermetic. This install line had exactly
        # one member, so extending it costs no extra ci-pack venv.
        run: pip install pytest jinja2 pyyaml pypdf boto3
      - name: research vault ingestion-spine + page unit tests
        run: python -m pytest tests/test_research_vault.py tests/test_research_vault_strict_store.py tests/test_research_vault_page.py tests/test_research_pages.py -q

  research-vault-api:
    if: ${{ false }}
    # RV W2 serving API + download gate (SECURITY-CRITICAL): the app/research.py
    # router — anon→401, free/unknown→402 (fails CLOSED), insider view 200 (no
    # quota), download metering 5/20 (server-authoritative, next-day reset),
    # doc_id traversal/shape/unknown hardening (never a raw R2 fetch), and the
    # watermark degrade path (libs present AND absent both return a body). Uses a
    # LocalStore + dependency-overridden auth + monkeypatched tier resolver, so no
    # live R2/Supabase is hit. Imports app.main, so fastapi + httpx (TestClient)
    # are installed (mirrors the collect-identity job).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        # fastapi + httpx for the TestClient; pypdf + reportlab so the watermark
        # HAPPY path is exercised too (the code degrades if they're absent, but CI
        # proves the real stamp path as well). pyyaml closes the Brain gateway's
        # Fundamental Forensics package import in this isolated environment.
        # requests closes app.main's eager app.market_memory import.
        run: pip install pytest fastapi httpx pypdf reportlab pyyaml requests
      - name: research vault serving-API security tests
        run: python -m pytest tests/test_research_api.py -q

