  marketing-scoring-optional:
    if: ${{ false }}
    # XG-W5 (= IS-W2) optional-dependency lane: the MinHash-LSH near-dup pass in
    # engine/marketing/story_spine.py.
    #
    # WHY THIS LANE EXISTS. The scoring brain's deterministic core is stdlib +
    # pyyaml and runs in marketing-engine, whose minimal env IS its contract. The
    # near-dup pass needs `datasketch` (which pulls numpy + scipy), so it cannot
    # run there. The wrong fix — the one this repo has shipped twice (#3703,
    # #3760) — is `pytest.importorskip("datasketch")` inside the thin lane: main
    # goes green and weaker in the same commit, every census reports the pass as
    # covered, and it executes in zero jobs.
    #
    # So tests/test_marketing_scoring_optional_deps.py imports datasketch at
    # MODULE level with NO importorskip, and this job is the only one that names
    # it. A missing wheel here is a COLLECTION ERROR — red, loud, immediate. The
    # probe step below makes a dropped install line red for the same reason, and
    # -rs surfaces any NEW skip that appears in the suite.
    #
    # model2vec is deliberately absent: the embedding artifact is an
    # operator/R2 step (docs/scoring_brain.md §3) and must never become a CI
    # dependency. The semantic clustering BRANCH is ours and is tested with an
    # injected encoder in the thin lane; model2vec's own inference is theirs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install pytest pyyaml datasketch
      # The lane's own tripwire: if a future edit drops datasketch from the line
      # above, the suite would error at collection anyway — but this step names
      # the cause in one line instead of burying it in a pytest traceback.
      - name: prove the optional dependency is present
        run: python -c "import datasketch, numpy; print(datasketch.__version__)"
      - name: scoring-brain optional-dependency paths
        run: python -m pytest tests/test_marketing_scoring_optional_deps.py -q -rs

  marketing-data:
    if: ${{ false }}
    # The data-dependent half of two marketing suites whose only lanes are
    # deliberately stdlib+pyyaml. Same pairing shape as chart-render /
    # chart-render-data: the thin lanes stay thin because their minimal env IS the
    # contract, and this lane proves the code behind the skips.
    #
    # Added 2026-07-26 by scripts/check_skip_only_suites.py, on its first run:
    #   * test_marketing_content.py:531 importorskip("pandas")/("pyarrow") — the
    #     engine.marketing.chart_render load_closes round-trip against the committed
