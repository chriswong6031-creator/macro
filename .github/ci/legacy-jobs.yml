  press-lane:
    if: ${{ false }}  # executed inside ci-pack; keep the legacy status definition runner-free
    # D14 W1 Media Network press engine (2026-07-26). The press lane emits INTO
    # the free acquisition estate, so its own suite has to run wherever that
    # estate's drift law runs — a press change that breaks the frontmatter
    # contract would otherwise surface as a red free-content-estate job on
    # somebody else's PR. The dependency line follows free-content-estate's
    # minimal-deps convention verbatim (`pytest pyyaml jinja2`) — the same three
    # packages cover the same closure, so there is no reason to spell it
    # differently. (run_ci_pack.py does share a venv between adjacent jobs with
    # byte-identical install lines, but these two land in different packs, so
    # matching buys convention here, not a shared environment.)
    # Network-free: the validator suite is 100% deterministic and the writer
    # (the one module that would make an LLM call) is never invoked by tests.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml jinja2
      - name: press validator suite (paraphrase, fact-anchor, our-value, lexicons)
        run: python -m pytest tests/test_press_validators.py -q
      - name: press planner + writer + orchestrator suites
        run: python -m pytest tests/test_press_planner.py tests/test_press_writer.py tests/test_press_run.py tests/test_earnings_canonical_story.py -q
      - name: press admin panel + workflow shape
        run: python -m pytest tests/test_press_admin.py tests/test_press_workflow.py -q
      # W1.5 property trees + the cutover sync guard. Same lane on purpose: the
      # guard asserts that config/press.yml `cutover` and the commented Caddy
      # block move together, and that pairing is only real if it runs on every
      # press change, not just on a deploy change.
      #
      # HONEST LIMIT ON WHAT REBUILDS properties/. The committed trees are a
      # DERIVED artifact, and the only thing in the repo that regenerates them is
      # the `emit` job in press-publish.yml — which runs ONLY on a
      # workflow_dispatch carrying inputs.emit=true. The daily schedule stages
      # and stops; it never emits. So "the next publish heals it" means the next
      # MANUAL dispatch, which may be never. A template edit, a config edit or a
      # hand-appended ledger row therefore leaves the trees stale until somebody
      # runs `python -m scripts.build_press_properties` and commits the result.
      # This job does NOT run `--check`: the trees do not exist yet, so the check
      # would be red on arrival. Wiring it is a follow-up for the session that
      # generates and commits them.
      - name: press properties + cutover pairing guard
        run: python -m pytest tests/test_press_properties.py -q
      # Derived-tree drift guard: the committed properties/ trees must byte-match
      # a fresh rebuild from templates + config + ledger. A template or config
      # edit that forgets `python -m scripts.build_press_properties` goes red
      # HERE, in the lane that owns it, instead of shipping a stale tree.
      # (press-publish.yml regenerates the trees on every armed emit, so a
      # ledger append direct-pushed to main self-heals on the next publish.)
      - name: property trees match a fresh rebuild (--check)
        run: python -m scripts.build_press_properties --check
      # W2R research triage + tiering + the dark research X lane (XG-W8,
      # 2026-07-28). Same lane on purpose: the triage layer is what decides
      # WHICH vault report the Research Desk covers, so it has to run wherever
      # the desk's own contract runs. Import closure is stdlib + pyyaml (the
      # `pytest pyyaml jinja2` line above already covers it): research_triage
      # keeps every reused module behind LAZY function-level imports, so a heavy
      # top-level import in story_spine/signal_features/garbage_gate turns this
      # job red at collection, which is the point.
      #
      # NOTHING IN THE SUITE IS importorskip-GATED. The near-dup pass's optional
      # `datasketch` dependency is exercised through its DOCUMENTED STATES
      # (`cluster_density` reports `exact-only` and declares the value a floor
      # without the wheel, `measured-alone` with it) rather than by requiring
      # the wheel — so the suite cannot decay into a skip-only one, and the
      # production workflow installs datasketch so the lane itself does not
      # ship the degraded read.
      #
      # BOTH dependency states are FORCED at the availability seam, so the
      # result does not depend on whether THIS env has the wheel (2026-07-29).
      # The earlier assertion took a union of both branches, which passed here —
      # where the pack installs `pytest pyyaml jinja2` and nothing else — and
      # failed on every dev machine with datasketch installed. An env-shaped
      # pass is not a pass; it just moves the red somewhere nobody runs.
      #
      # The veto pass is exercised through its injected `call` seam, so this
      # step makes no network call and needs no credential.
      - name: W2R research triage (W-score, demote-only veto, dark research lane)
        run: python -m pytest tests/test_press_research_triage.py -q

