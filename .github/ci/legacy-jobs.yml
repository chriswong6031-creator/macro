  qledger-cluster-honest-ci:
    if: ${{ false }}
    # altdata-diagnosis PR-A: cluster-honest Wilson CI fix.
    # Proves that _aggregate and promotion_check compute wilson_ci_low on n_dates
    # (independent date clusters), not on the correlated n_obs, per the
    # ticker-cluster time-confound law and the altdata_brain.py article3 convention.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `requests` is load-bearing, not decoration: tests/test_w6_readiness_monitor.py
      # patches `scripts.notify.send_telegram`, and mock.patch RESOLVES its target by
      # importing the module — `scripts/notify.py` imports requests at module level and
      # does not guard it. Measured per-suite before wiring: test_qledger.py and
      # test_grade_qledger.py never load requests, the w6 suite always does, so without
      # this the new step ERRORS on import while every existing step here stays green.
      # WIDENING IS LEGAL HERE, and the distinction is the whole point of the rule it
      # looks like it breaks. "Never widen the pip line" is scoped to lanes whose thin
      # env is a DECLARED canary — dataos-foundation's pytest+pyyaml ("a pandas import
      # creeping into lib/dataos/ breaks HERE first", see house-law-registry below) and
      # the marketing/chart-render thin lanes. This job declares no such contract, and
      # no comment here turns on a dep being absent. What that rule actually forbids is
      # provisioning a new environment to buy green; this line is byte-identical to one
      # three other jobs already declare, so run_ci_pack.py reuses their venv and
      # provisions nothing. The alternative — relocating the w6 suite to one of those
      # three (altdata-new-sources, earnings-release-identity, group-earnings-pulse) —
      # would put the qledger promotion monitor in a job that does not own its subject,
      # which is the failure mode that left it unowned in the first place.
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml requests
      - name: qledger cluster-honest Wilson CI unit tests
        run: python -m pytest tests/test_qledger_cluster_honest_ci.py -q
      # P0a — the explicit horizon-clock contract. STEP PLACEMENT IS DELIBERATE:
      # run_ci_pack.py returns on the FIRST non-zero step, so a step placed first
      # MASKS its siblings and one placed last goes DARK behind an earlier red.
      # These two sit SECOND/THIRD — after the established cluster-honest step
      # (which stays unmaskable and is the broadest existing qledger check) and
      # ahead of the altdata/metric-validity steps, which test different concerns
      # and must not shadow the suite that covers the code this PR rewrote.
      # test_qledger.py is the primary regression suite for engine/qledger.py and
      # was named by NO legacy job, so every grading-path change shipped dark; it
      # is hermetic (tmp_path store + monkeypatched price layer, no data/** reads).
      - name: qledger contract regression suite
        run: python -m pytest tests/test_qledger.py -q
      - name: qledger explicit horizon-clock (P0a) + matched-control policy (P0d) contracts
        run: python -m pytest tests/test_qledger_horizon_clock.py tests/test_qledger_control_policy.py -q
      # P3 — the forward-only desk adapters and the evidence-clock writer. These
      # sit in the qledger job because their subject IS the claim substrate: the
      # adapter's forward-only gate calls `qledger.claim_window` (the same
      # resolver `grade_claim` uses) and its output is a `register_batch` call.
      # Placed AFTER the contract suites deliberately: if the clock contract
      # itself regresses, that must be the failure a reader sees first, not a
      # downstream adapter failing for a borrowed reason.
      # The nightly RUNNER over that substrate joins this step (2026-08-14). Both
      # suites were named by NO run: step in legacy-jobs.yml and appear nowhere in
      # ci.yml, so `scripts/grade_qledger.py` — the grader that writes every grade row
      # and the W6 readiness monitor that decides promotion — had no CI owner at all.
      # The cost was measured, not theorised: the w6 first-cross alert tests were red
      # on main from #5573 (2026-08-14 05:44Z) until #5609 healed them, with zero CI
      # signal for the whole window. They ride this step rather than a new one because
      # a step is the masking unit here (run_ci_pack.py returns on the first non-zero
      # step) while pytest reports EVERY file in one step — so extending the list adds
      # coverage without adding a place for a later step to go dark, and adds no job to
      # a manifest already at the narrow-diff ceiling. Placement inherits the rationale
      # above: strictly downstream of the contract suites, so a clock or _aggregate
      # regression is still the first failure a reader sees, never a runner failing for
      # a borrowed reason.
      - name: qledger forward-only desk adapters + evidence clock (P3) + nightly grader & W6 readiness runner
        run: python -m pytest tests/test_qledger_desk_adapter.py tests/test_qledger_evidence_clock.py tests/test_grade_qledger.py tests/test_w6_readiness_monitor.py -q
      # round 5 MINOR: this file was owned by NO legacy job, so
      # test_register_claims_are_salience_only_macro — which asserts on
      # register_claims()'s "returns the count REGISTERED OPEN" semantics
      # this branch's P0a market-dispatch fix redefined (a refused claim no
      # longer silently inflates the count) — never ran in CI. Sits right
      # after the horizon-clock step it is a direct consequence of.
      - name: communique_diff phrase-book + qledger registration contract
        run: python -m pytest tests/test_communique_diff.py -q
      # test_altdata_ledger_lane_gate.py rides THIS step rather than a new one: it pins
      # the same module (engine/altdata_ledger.py) the family suite already owns, and a
      # single pytest invocation reports every file in one place — extending the list
      # adds coverage without adding a job to a manifest at the narrow-diff ceiling, and
      # without adding a later step that could go dark behind an earlier red one. The
      # sibling altdata suite (tests/test_altdata.py) is grandfathered UNRUN in
      # config/unrun_test_baseline.json, so the gate contract had to land somewhere CI
      # actually executes or it would have shipped dark — which is the exact class of
      # defect it exists to catch.
      - name: altdata reboot W2 — per-channel family routing + placebo tests + HOUSE-U5 ledger lane gate
        run: python -m pytest tests/test_altdata_reboot_families.py tests/test_altdata_ledger_lane_gate.py -q
      # Metric-validity invariants (epistemics.qledger_metric_validity). grades.excess
      # is RAW, not direction-signed, so a pooled signed excess_mean over a
      # mixed-direction family measures universe drift rather than skill; a salience
      # family has no hit rate; a verdict may only be read at the declared horizon.
      # The selftest carries negative controls, so it fails if the auditor flags
      # everything as readily as if it flags nothing.
      - name: qledger metric-validity invariants
        run: python -m pytest tests/test_qledger_validity.py -q
      - name: qledger metric-validity guard selftest
        run: python scripts/check_qledger_metric_validity.py --selftest
      # V1 ENFORCEMENT at the emitter. The two steps above prove the CONTRACT
      # (engine/qledger_validity.py) is correct; this one proves engine.qledger
      # ._aggregate — the single chokepoint feeding site/qledger/track_record.json
      # and, via scripts/grade_qledger.compute_promotion_readiness, the admin
      # Experiments tab — actually OBEYS it, and that a legal single-direction
      # family is unchanged.
      # PLACEMENT (run_ci_pack.py returns on the first non-zero step): deliberately
      # LAST in this job. Placing it above the two metric-validity steps would let a
      # break in the enforcement mask the contract's own verdict, which is the
      # upstream authority; in the reverse order a red contract masks this step, and
      # that is correct — an enforcement result is uninformative while the rule it
      # enforces is itself red. It sits with the other _aggregate step (the
      # cluster-honest CI test) in the same job, so it can never ship dark.
      - name: qledger V1 excess-legality gate at the emitter
        run: python -m pytest tests/test_qledger_excess_legality.py -q

