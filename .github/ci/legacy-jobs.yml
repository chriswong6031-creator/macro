# Legacy CI job manifest executed by scripts/run_ci_pack.py.
# This file is deliberately outside .github/workflows so GitHub does not
# publish one skipped check run for every logical job on every PR.
jobs:
  inline-js:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Seeded-defect round-trip: fixtures with a curly-quote onclick, a broken
      # handler, and a .j2 curly onclick must go RED (plus a clean control that
      # must pass). Guards the guard — a regression that silently stops catching
      # the PR #2321 contamination class fails here, not in production.
      - name: guard self-test (seeded curly-quote onclick must go red)
        run: python3 scripts/check_inline_js.py --selftest
      # Checks <script> blocks AND on*= handler attributes (node --check, handler
      # wrapped as a function body — the #2321 gap), plus a smart-quote
      # contamination scan. templates/ is included so .j2 sources are curly-scanned
      # at PR time instead of riding green until the next render regenerates the
      # site copy (node cannot parse Jinja, so .j2 gets the curly scan only).
      - name: inline JS must parse
        run: python3 scripts/check_inline_js.py site templates
      # Companion guard: standalone site/*.js bundles are loaded via <script src=...>,
      # which the inline-JS guard deliberately skips — a syntax error there (e.g. the
      # smart-quote delimiters that blanked markets.html for ~2 days, PR #1004→#1353)
      # ships silently. This parses every non-vendor bundle with `node --check`.
      - name: standalone site JS must parse
        run: python3 scripts/check_site_js.py site

  nav-gap:
    if: ${{ false }}
    # The shared nav menu (.site-nav / vector-family .topbar) has no built-in top
    # gap — it relies on each page's body top padding. A new page that zeroes its
    # body padding jams the menu against the viewport top ("menu with no padding").
    # This catches that regression BEFORE merge instead of after it ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nav menu must keep a top gap
        run: python3 scripts/check_nav_gap.py site

  nav-mega:
    if: ${{ false }}
    # The Research nav is a shared partial (_navlinks.html.j2) whose Research entry is
    # the grouped 'nav-mega' panel. A page built OUTSIDE the routine render loop (an
    # out-of-loop page builder, or a hand-static page) can render the shared nav but
    # freeze WITHOUT the mega-menu. This catches that drift BEFORE merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shared-nav pages must carry the Research mega-menu
        run: python3 scripts/check_nav_mega.py site

  crypto-shelves:
    if: ${{ false }}
    # W0 lands the governor unarmed against the legacy templates. The first
    # data-shelf marker on each surface arms exact-set enforcement for that page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: governor selftest (partial, duplicate and extra shelves must fail)
        run: python3 scripts/check_crypto_shelves.py --selftest
      - name: vector and crypto Tier-1 shelf governor
        run: python3 scripts/check_crypto_shelves.py

  board-contradictions:
    if: ${{ false }}
    # W2 board invariant guard: validates site/factordata/us_standouts.json for four
    # contradictions that the W8 arbiter + W6-US fix passes must prevent:
    #   (a) FRESH-BUY-ish state with stale cross or extended grade,
    #   (b) urgency=imminent on blocked label or BOTTOMING state,
    #   (c) band high/constructive while verdict is Lagging/no-clear-edge,
    #   (d) slot-1 alpha negative while positive-alpha rows exist in the same lane.
    # A build that violates any invariant fails RED here before merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # On PRs, validate the artifact ONLY when this PR actually changes it. The
      # committed artifact is regenerated by the engine-render pipeline, so a code-only
      # PR (like the one introducing this guard) must not be judged against an artifact
      # built by OLDER code. Fresh renders are graded by the builder's own render-lane
      # self-check (scripts/build_stock_library.py, "board-contradictions self-check"
      # log line — warn-only, added in #2171); pages.yml's twin step is
      # workflow_dispatch-only and guards manual GitHub Pages mirror re-deploys, NOT
      # nightly renders. Before #2171 nothing graded fresh renders at all — an
      # invariant-(d) violation sat latent on main for weeks.
      # 2026-07-04 incident (#1195 run): a PR squash-merged before this job started, so by
      # run time origin/main's tip WAS the squash commit — and the old `--depth=1` fetch
      # shallow-cut it, so `origin/main...HEAD` had NO merge base. `git diff --quiet` then
      # exited fatal (non-zero), the skip branch was not taken, and the checker FAILED OPEN
      # against a stale artifact the PR never touched. Fix: fetch without --depth (checkout
      # is already fetch-depth 0), and treat a missing merge base as SKIP — coverage of
      # the artifact then rests on the render-lane self-check above (warn-only).
      - name: board invariants must hold when this PR ships the standouts artifact
        run: |
          git fetch origin ${{ github.base_ref }}
          if ! mb=$(git merge-base "origin/${{ github.base_ref }}" HEAD); then
            echo "no merge base with ${{ github.base_ref }} (base moved under a fast merge) — fresh renders are graded warn-only by the build_stock_library.py self-check (pages.yml twin is manual-dispatch only); skipping"
            exit 0
          fi
          if git diff --quiet "$mb" HEAD -- site/factordata/us_standouts.json; then
            echo "us_standouts.json untouched by this PR — fresh renders are graded warn-only by the build_stock_library.py self-check (pages.yml twin is manual-dispatch only); skipping"
            exit 0
          fi
          python3 scripts/check_board_contradictions.py site/factordata/us_standouts.json

  ms-board-coherence:
    if: ${{ false }}
    # 2026-07-07 incident: render commit 5bf116a3b3 shipped a hybrid Market State board
    # (score 56 / "Mixed" verdict beside a "Risk Radar forces Risk-off." note + Risk-off
    # thesis) — stitched by the render lane's `git pull --rebase -X theirs` racing the
    # 07:10 engine-render. engine/market_state.py can never emit that pair from one
    # snapshot (the "forces" note requires ceiling < 42, then score = min(score, ceiling)).
    # This job fails RED on any committed board whose verdict/score/thesis/notes/flip
    # cannot come from a single snapshot; the render lanes carry a self-healing twin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: market-state boards must be single-snapshot coherent
        run: python3 scripts/check_ms_board_coherence.py
      - name: guard selftest (synthetic fixtures incl. the 5bf116a3b3 hybrid)
        run: python3 scripts/check_ms_board_coherence.py --selftest
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install test deps (engine cross-check imports market_state)
        run: pip install pytest pandas numpy
      - name: guard constants must match engine/market_state.py
        run: python -m pytest tests/test_check_ms_board_coherence.py -q

  gh-annotation-line-start:
    if: ${{ false }}
    # A "::warning"/"::error" routed through logging NEVER reaches the Actions
    # summary: every builder logs with a prefixing format ("WARNING ::warning …")
    # and GitHub only parses a workflow command at column 0. The call reviews as
    # an alarm, runs clean, and emits nothing — so a fail-soft builder ships
    # degraded output with its only signal silently dropped. Shipped dead five
    # times (#3487, #3515, #3563, #3570, and #3562 which merged a fresh one on
    # 2026-07-26). The guard scans every module that runs inside an Actions step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install test deps
        run: pip install pytest
      - name: annotations must start the line (bare print, never a logger)
        run: python -m pytest tests/test_gh_annotation_line_start.py -q

  admin-js-no-undef:
    if: ${{ false }}
    # admin/static/app.js is a flat top-level browser script and NOTHING in CI
    # read its scopes, so a reference to a name declared in another function
    # parsed clean and threw only on click. PR #3693 shipped exactly that
    # ("ReferenceError: rejBox is not defined") and the admin Outbox panel
    # rendered BLANK in production for ~2 days until #3871 module-scoped it.
    # node --check cannot catch it (an undefined identifier is valid syntax),
    # so this runs eslint with the single rule no-undef over admin/static/*.js.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Provided once by the ci-pack wrapper; declared here so this job stays
      # readable as the standalone job it used to be (see wri-risk-core).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install test deps
        run: pip install pytest
      - name: admin JS must have no out-of-scope references (eslint no-undef)
        run: python3 scripts/check_admin_js.py
      - name: guard tests (real tree + planted #3693 offender, fail-closed in CI)
        run: python -m pytest tests/test_admin_js_no_undef.py -q

  path-prune-lint:
    if: ${{ false }}
    # A tree-walk that prunes on the ABSOLUTE path also matches anything ABOVE
    # its scan root. House law puts every agent session in a
    # `.claude/worktrees/<name>/` checkout, so a guard excluding ".claude" or
    # "worktrees" via `path.parts` skipped EVERY file and scanned nothing —
    # test_press_workflow's kill-switch guard saw 0 of 130 .yml (#3802). It read
    # green in the one checkout everybody works in and was real only in CI: the
    # press suite passed locally at 177 tests while ci-pack-0 went red.
    # A guard that can see nothing can refuse nothing, and nothing at runtime
    # says so — the test passes. So it is caught in the source, like the
    # annotation lint above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install test deps
        run: pip install pytest
      - name: walks must prune on the path RELATIVE to their scan root
        run: python -m pytest tests/test_no_absolute_path_part_prunes.py -q

  rebase-css-autoresolve:
    if: ${{ false }}
    # 2026-07-22 incident: asia-close run 29904079071 committed the day's engine outputs,
    # then every push retry died on the SAME rename/rename conflict — two lanes had
    # renamed a content-hashed site/assets/css/<hash>.css to different hashes, and
    # `pull --rebase -X theirs` can't settle path-level conflicts. The loop gave up with
    # a ::warning under a green run, silently dropping the day (hk_regime stuck 07-21).
    # scripts/rebase_autoresolve_hashed_css.sh now finishes such rebases (keeps both
    # hashed files byte-pure; refuses anything else); these tests replay the incident
    # with real git repos, so a git-version behavior change shows up here, not in prod.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install test deps
        run: pip install pytest
      - name: autoresolver must finish rename/rename rebases on hashed css (and refuse all else)
        run: python -m pytest tests/test_rebase_autoresolve_hashed_css.py -q
      # 2026-08-01 sibling incident: the same push loops' `pull --rebase --autostash`
      # left a CONFLICTED autostash apply in the tree and the broad `git add site/
      # templates/` staged it verbatim — d29e4dd44d shipped conflict markers across
      # 1,704 committed pages, live until c1bfee482a. Every lane now runs
      # scripts/ci/strip_conflict_markers.sh before its broad adds; this replays that.
      - name: a conflicted stash/rebase apply must be stripped, never committed
        run: python -m pytest tests/test_strip_conflict_markers.py -q

  conflict-markers:
    if: ${{ false }}
    # 2026-07-03 incident: a merge commit shipped literal git conflict markers
    # ('<<<<<<< ours' / '=======' / '>>>>>>> theirs') inside templates/dashboard.html.j2
    # and merged GREEN — Jinja parses marker lines as plain text, pytest never rendered
    # that block, and no other guard greps for them. This fails RED on any conflict-marker
    # line in templates/**, engine/**, scripts/**, or shipped site/** files. PRs use a
    # changed-file ratchet because the 2026-08-01 render incident left legacy generated
    # pages damaged on main; the full-tree pages/deploy gate remains unchanged. The
    # self-test proves both full scanning and the ratchet before trusting their OK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard self-test (known-bad flagged, known-good clean)
        run: python3 scripts/check_conflict_markers.py --self-test
      - name: no new git conflict markers in PR content
        run: python3 scripts/check_conflict_markers.py --changed-from "origin/${CI_BASE_REF:-main}"

  title-i18n:
    if: ${{ false }}
    # The i18n rule: translated text NEVER goes in HTML attributes — the dual-span
    # l-en/l-zh mechanism cannot operate there, so a bilingual title= shows both
    # languages mashed together. This scans template SOURCE for CJK, t() calls, or
    # zh-variable interpolations inside title attributes (the fix is data-tip-en/
    # data-tip-zh + the theme.js popover, an English-only title, or no title).
    # Same class, different door (#2705): <title> is RCDATA, so a t()/td() in a
    # template <title>/{% block title %} — or a '<span' in a rendered page title —
    # ships literal markup as the browser-tab text; the sweep covers site/ too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard self-test (known-bad flagged, known-good clean)
        run: python3 scripts/check_title_i18n.py --self-test
      - name: no translated text in title attributes or markup in <title> RCDATA
        run: python3 scripts/check_title_i18n.py templates site

  signal-contract:
    if: ${{ false }}
    # HARD pre-merge gate for the signal→chart §7 contract (research/signal_engine/SCHEMA.json,
    # the single source of truth shared with the charting app). A PR that drifts the engine output
    # from the schema, weakens the validator, or breaks a contract rule fails RED here — the safe
    # place to block (no deploy to stall). The daily build's gate is deliberately resilient
    # (discard-bad-write, never 404 the dashboard); this is where blocking has teeth. The test
    # suite includes an engine-analyze()-conforms-to-schema check that catches forgot-to-update-
    # the-schema drift without needing data fixtures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install jsonschema pytest pandas numpy pyyaml requests
      - name: signal §7 contract tests
        run: python -m pytest tests/test_validate_signals.py -q
      - name: fundamental forensics lineage, normalization, detector, and schema contracts
        run: >
          python -m pytest
          tests/test_fundamental_forensics_ingest.py
          tests/test_fundamental_forensics_normalize.py
          tests/test_fundamental_forensics_detectors.py
          tests/test_fundamental_forensics_contract.py -q

  trial-budgets:
    if: ${{ false }}
    # W1d (audit #21): every multiple-testing harness must REGISTER its trial budget, or the
    # DSR/kill/FDR deflation it feeds is a lie. A NEW validate_*/*_phase0 script that deflates a
    # Sharpe without registering fails RED here (the ~33 pre-existing offenders are grandfathered
    # in an allowlist that only shrinks). Also runs the grading-rebuild + ledger test suites.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: trial-registration lint (no new unregistered harness)
        run: python3 scripts/check_trial_registration.py
      - name: reliability-contract guard (no gated field rendered directionally, audit #46)
        run: python3 scripts/check_reliability_contract.py
      - name: grading rebuild + trial ledger tests
        run: python -m pytest tests/test_grading.py tests/test_trial_ledger.py tests/test_trial_registration_lint.py tests/test_no_literal_ntrials.py tests/test_universe_history.py -q
      - name: promotion-stat DISPLAY gate — the published DSR must be the computed one
        # Registering the trial budget (above) is only half the chain: the number the
        # PAGE shows must equal the number the calibrator produced. The BTC Vector card
        # shipped "DSR 0.9945 (n=68)" while calibration.json carried 0.9661 at n=71 —
        # optimistic against the engine's own output, the one direction a promotion stat
        # must never drift. Skips cleanly when data/vector/*.json is absent.
        run: python -m pytest tests/test_signal_lab_vector_display.py -q

  breakdown-control-seed-determinism:
    if: ${{ false }}
    # BD-4/5/6 control sampling derives a per-ticker RNG sub-seed from the ticker.
    # Until 2026-07-26 that derivation was builtin hash(), which Python salts per
    # process (PYTHONHASHSEED) — control draws differed on EVERY run while the frozen
    # Phase-0/0b preregs promise seeded (reproducible) controls and the surrounding
    # comment claimed "deterministic sub-seed". Same defect class as the chart_render
    # SVG ids (#3785), fixed the same way: bd456_control_seed() now uses zlib.crc32.
    # This lane runs the real derivation in fresh subprocesses under PYTHONHASHSEED
    # 0/1/42 asserting identical seeds, and pins golden values so a silent regime
    # change (mask width, XOR operator, encoding) also fails RED. The subprocess
    # imports scripts.research.dump_breakdown_events wholesale (engine.grading +
    # pandas/numpy/pyarrow closure; pyyaml for the repo conftest), so the install
    # line is byte-identical to the trial-budgets/outcome-spine family and the pack
    # runner can share a venv with any same-pack sibling on that line. Closure
    # verified in a clean venv with exactly this install: 2 passed, plus the full
    # event-tape + AVOID-1 stamper suites below: 122 passed (89+33), zero skips,
    # identical under PYTHONHASHSEED 0/1/42.
    # The second step runs the two breakdown suites that were executed by NO job
    # until 2026-07-27 (every pytest invocation in this repo carries an explicit
    # file list — an unnamed suite is never run). Their fixture seeding was
    # de-flaked first (hash(ticker) → zlib.crc32) so wiring them cannot import
    # the same PYTHONHASHSEED salt this lane exists to prevent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: BD-4/5/6 control seeds must be PYTHONHASHSEED-stable (crc32, never hash())
        run: python -m pytest tests/test_breakdown_seed_determinism.py -q
      - name: breakdown event tape + BD-AVOID1 stamper suites
        run: python -m pytest tests/test_breakdown_events.py tests/test_bd_avoid1_stamper.py -q

  outcome-spine:
    if: ${{ false }}
    # W4 (audit #13/#19/#23/#41/#42): the outcome spine + partial-pooling closed loop. The
    # badge-passport ratchet (#41) fails RED if a desk brief renders a conviction badge with no
    # provenance passport; the spine/pooling tests prove the four safety properties (sign-safety,
    # trust-region, cold-start, arming) that gate grades moving deterministic weights.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: desk → spine wiring — stock_desk's per-thesis outcome ledger
        # The append-only scored.jsonl engine.spine._DESK_SCORED reads for this desk. Pins the
        # properties a track record cannot: a published verdict is never re-graded from a
        # re-based price history, an unpriceable lean stays retryable (this desk emits
        # `expired` with none of desk_scorer.GRACE_BD's slack), and each row carries `subject`
        # so 45 leans do not collapse to 8 effective events in engine.pooling.arming.
        run: python -m pytest tests/test_stock_desk.py -q
      - name: badge-passport ratchet (no new conviction badge without a passport)
        run: python3 scripts/check_badge_passport.py site
      - name: spine contract + partial-pooling safety tests
        run: python -m pytest tests/test_spine.py tests/test_pooling.py -q
      - name: promotion gate — per-desk empirical null + Calibration Hub verdicts
        # The bar a desk is promoted against. The placebo sweeps must mirror the evaluator
        # each desk was actually graded by (price plane, falsification boundary, exit bar),
        # or the null describes a different endpoint than the one on the page.
        run: >
          python -m pytest
          tests/test_desk_placebo.py tests/test_calibration_hub.py tests/test_thematic_desk.py -q
      - name: desk → spine writers — the scored ledgers the pooled weights are built from
        # The producer side of spine._DESK_SCORED. The tests above pin what the spine does
        # with a scored.jsonl; these pin that the file says what it claims: grading is
        # idempotent (an already-scored id is never re-graded, and emit dedupes by vintage),
        # a thesis whose check_by has not passed stays OPEN instead of being resolved early,
        # and a soft/non-directional call is unscored — never counted as a hit or a miss.
        # ai_desk_scorer is load-bearing for three registry keys: radar_scorer reuses its
        # eval + aggregation verbatim for both radar and narrative_brain.
        run: >
          python -m pytest
          tests/test_ai_desk.py tests/test_ai_desk_scorer.py
          tests/test_radar_scorer.py tests/test_narrative_brain.py
          tests/test_demand_ledger.py tests/test_policy_intent_desk.py -q

  chronicle-suite:
    if: ${{ false }}
    # Chronicle W0 (agentic_media program, CHRONICLE_CONTEXT_TIMELINE_MASTERPLAN_BY_FABLE.md):
    # deterministic event spine + rollups + context_pack over 6 sources. No paths filter narrows
    # this beyond the shared top-level trigger above (engine/chronicle/**, scripts/build_chronicle.py,
    # data/chronicle/**, tests/test_chronicle.py, admin/chronicle.py all listed there; config/synapse.yml,
    # config/dag.yml, config/lobe_charters.yml, docs/SIGNAL_BUS.md, engine/neuralweb/** already covered
    # by pre-existing entries).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: chronicle engine tests
        run: python -m pytest tests/test_chronicle.py -q

  cycle-ontology-js:
    if: ${{ false }}
    # W1.5 (A10/A12 ruling): the generated site/cycle_ontology.js must exactly match what
    # engine/cycle_ontology.py produces at HEAD.  A PR that edits the engine but forgets to
    # regenerate the JS — or hand-edits the committed JS — fails RED here.  The flag-day
    # axis-flip (ONTOLOGY_AXIS constant) makes a stale committed JS especially dangerous: it
    # could ship a half-v2 site.  Runs only when relevant files change (paths filter above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        # cycle_ontology.py imports numpy+pandas at module top (canonical_position math),
        # so gen_ontology_js — which imports it — needs them even though it only serialises
        # the vocabulary payload. pyyaml alone made this gate crash-fail whenever triggered.
        run: pip install pyyaml numpy pandas
      - name: ontology JS must not drift from engine (gen_ontology_js --check)
        run: python3 -m scripts.gen_ontology_js --check

  cycle-forward-log:
    if: ${{ false }}
    # W1.5 (W0.2 acceptance): four acceptance criteria for the shared forward-log writer.
    # A regression here silently breaks prospective cone-coverage grading for every cycle
    # family (US sectors + country cycles).  Hard gate: the keep-FIRST invariant and
    # proj_lo/hi columns are structural contracts for W2.3+ measurement.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: forward-log writer contract tests (keep-FIRST, cone edges, never-raise)
        run: python -m pytest tests/test_cycle_forward_log.py -q

  tier-gate:
    if: ${{ false }}
    # Revenue + serving boundary. A paid desk ships as a free preview shell at the
    # page URL plus a separate /premiumdata/ payload that app/paywall.py gates as
    # Insider+ ahead of the site-wide PAYWALL_ENABLED switch
    # (docs/TIER_PREVIEW_PATTERN.md). The regressions this catches: the shell
    # quietly regaining the paid rows (the split IS the gate — a client-side hide
    # is not), /premiumdata/ dropping out of premium.enforced_early (which would
    # re-open the desk to every registered account), the edge's public exclusion
    # list drifting away from config/site_access.yml (which is how a generated
    # artifact silently becomes anonymously fetchable — #3418 drifted it and the
    # boundary test sat red ~17h unwatched because no workflow named it), and the
    # registration wall itself regressing.
    #
    # The serving boundary has three enforcement halves and CI now covers all of
    # them: the Caddy public list (site_access_boundary), the paid stage
    # (paywall/api_paywall), and the anonymous stage (regwall). The regwall pair
