        # for its pandas-free config and gating tests; the parquet-backed tests
        # execute here.
        #
        # FOUR SUITES JOIN 2026-07-30, same class, fifth time — and two of them were
        # wired into the THIN marketing-engine lane hours earlier by the very edit
