      # collector) are now wired by the GEX modeling-core step directly above, which
      # landed on main before this branch rebased. Nothing in the family is dark.
      - name: OIP E3 positioning persistence — oi_delta clusters, wall persistence, index-GEX rebuild routing
        run: python -m pytest tests/test_positioning_persistence.py tests/test_gex_state.py tests/test_index_gex_history.py -q
      # Unrun backfill 2026-08-03: the GEX board's per-ticker state merge and
      # the gex.js IV-rank band color law join the family this lane already
      # owns; the OIP E1 session digest and the flow desk builder are the same
      # market-plane plumbing (live_flow / etf_flows organs).
      # P1 unrun backfill 2026-08-14: the board's SESSION-DATE contract joins the step
      # that already owns the board's state merge.  Placed last in the list so a merge
      # regression (test_gex_board_state_merge.py) is the first failure a reader sees —
      # the session-date suite reads lib/gex_state_index.py and scripts/build_gex_board.py
      # on top of that merge, so it would otherwise fail for a borrowed reason.
      - name: gex board state merge + IV-rank band color + session digest + flow desk
        run: python -m pytest tests/test_gex_board_state_merge.py tests/test_gex_js_iv_rank_color.py tests/test_session_digest.py tests/test_flow_desk.py tests/test_gex_board_session_date.py -q

