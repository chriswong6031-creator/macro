  publish-r2-client:
    if: ${{ false }}
    # scripts/publish_r2._client's retry posture — 10 adaptive attempts and the
    # 15s/60s connect/read bounds that replaced the 4/standard config which died
    # 2026-07-16 mid-nightly. The assertion reads botocore's normalized config, so
    # it is `importorskip("boto3")`-gated and offline (no creds, no network).
    #
    # Added 2026-07-26 by scripts/check_skip_only_suites.py. unrun-publish-ops names
    # test_publish_r2.py, but its install line — the 21-job jinja2/plotly/sklearn
    # group — has no boto3, and it was the only job naming the file, so the retry
    # guard executed nowhere. unrun-publish-ops is deliberately left alone: adding
    # boto3 to ITS line would fork one job out of a 21-member venv group and cost a
    # whole new environment, whereas this install line is byte-identical to
    # flow-signals-ledger's, so this lane provisions NO new environment.
    #
    # Verified locally in a clean venv with this exact install line: 29 passed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install pytest pandas numpy pyarrow pyyaml boto3 scikit-learn joblib
      - name: prove boto3 is present (a silent re-skip is the regression)
        run: python -c "import boto3, botocore"
      - name: R2 publish client + transport tests (boto3 tests execute here)
