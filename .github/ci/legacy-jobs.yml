  research-price-panel:
    if: ${{ false }}
    # The versioned FROZEN research price panel (data/research_panels/).  Two audits
    # measured that our evidence base is not reproducible: the breadth close caches are
    # re-based at a full rebuild and accrue RAW closes after it, so PNC's 2026-06-22 close
    # read 234.71 on 2026-07-01 and 232.8536 on 2026-08-06 with nothing recording the
    # change.  Frozen->cache-today drift moves a decision statistic up to 0.24pp against
    # 0.26-0.98pp decision boundaries, so the infrastructure noise is now the LARGER term.
    #
    # This lane pins the two properties the artifact exists for, both of which are silent
    # failures — a broken freeze looks exactly like a working one until someone re-derives
    # a published number a year later:
    #   1. an existing version is byte-stable across a rebuild whose underlying store MOVED
    #   2. a reader given an unknown version raises instead of quietly resolving elsewhere
    # Every case runs against a synthetic store built in tmp_path (adjusted per-name files
    # shadowing a wide close cache, cache-only names, and a name no source carries), so the
    # job checks out no data fixtures and cannot touch the real data/ tree.
    #
    # Both halves are wired in ci.yml per #3488 — the suite AND the modules it measures
    # (price_panel.py, the vendored price_ladder.py, and the migrated instrument) — so an
    # edit to either can start the job that proves the freeze still holds.
    #
    # Deps: pyarrow is load-bearing (the artifact IS a parquet; a fixture cannot stand in
    # for the bytes under test).  The install string is byte-identical to the
    # trial-budgets/outcome-spine family so the pack runner shares their venv rather than
    # provisioning another.  Measured with exactly this line: 27 passed in ~1.9s, zero
    # skips.  The #4698-ref comparison SKIPS rather than passes when that ref is
    # unfetchable, so a checkout that cannot see the PR branch reads 26 passed / 1 skipped
    # — an unverifiable pin must not report itself green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: frozen price panel — write-once bytes + a reader that never falls back
        run: python -m pytest tests/test_research_price_panel.py -q

  zh-filing-term:
    # ui.zh_filing_term PR gate: 申报 must never reach user-facing Chinese copy.
    # A native reader hears a TAX or CUSTOMS declaration (申报纳税, 海关申报) where
    # the platform means a market DISCLOSURE — an SEC 10-K, a 13F, a congressional
    # STOCK Act report is a 披露. The term recurs 20-50x site-wide because every
    # builder writing a zh filings label reaches for the same wrong word, and it
    # has already been swept BY HAND twice (#4830 Filing Forensics, #4855 site-wide)
    # with nothing to stop the third regression. Hence a gate.
    #
    # The selftest step runs FIRST on purpose: a diction guard whose scan comes back
    # clean is indistinguishable from a diction guard that no longer fires, so the
    # green below only means something because the synthetic insertion above it went
    # red. The pytest step then pins the allowlist's narrowness (phrase AND file) and
    # the pending ratchet, which is what keeps this from turning into a blanket
    # file-level exemption the next time a sweep is in flight.
    if: ${{ false }}  # executed inside ci-pack — NOT a disabled gate; see the ci-pack job.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest
      - name: zh-filing-term selftest (gate fires on a synthetic 申报 insertion)
        run: python3 scripts/check_zh_filing_term.py --selftest
      - name: no unlicensed 申报 in user-facing Chinese copy
        run: python3 scripts/check_zh_filing_term.py
      - name: zh-filing-term guard suite (allowlist narrowness + pending ratchet)
        run: python -m pytest tests/test_zh_filing_term.py -q

  earnings-release-identity:
    # Wave 1B of the Earnings & Company Event suite: the EDGAR identity join and
    # the release binding.
    #
    # TWO OF THESE FOUR SUITES WERE STRICTLY DARK before this job existed —
    # tests/test_edgar_earnings_8k.py and tests/test_marketing_edgar_earnings_wire.py
    # were named by ZERO `run:` steps anywhere in this file and matched by no path
    # glob in ci.yml, so 133 assertions about the two EDGAR readers could not fail
    # a pull request. They guard the exact-token Item-2.02 match (the difference
    # between 2.02 and 12.02), the store's dedup key, the basis check that stops a
    # GAAP figure being posted against an adjusted estimate, and the provider's
    # fail-soft-never-fail-silent annotations. They are wired here.
    #
    # `requests` is in the install line because collectors/edgar_earnings_8k.py
    # imports it at module scope; without it the collector suite errors on import
    # rather than running, which reads as a pack failure rather than a missing dep.
    if: ${{ false }}  # executed inside ci-pack — NOT a disabled gate; see the ci-pack job.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml requests
      - name: EDGAR filing identity join + release binding (Wave 1B)
