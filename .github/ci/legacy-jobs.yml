  prophet-us-context-and-grades:
    # PROPHET US §W7 — the full-population candidate record: the PIT context store that
    # REMEMBERS each night's score, the forward grader that says what those names then did,
    # and the miss-audit that scores the score. All three ship together and all three were
    # dark before this job: test_us_context_vector.py and test_prophet_miss_audit.py were
    # tier-P1 unwired (scripts/audit_unrun_tests.py census), so the stores' PIT discipline,
    # nightly-lane gates and scorecard null-disclosure had no CI eye on them at all.
    # A gate hung on a suite nothing runs is a gate that is already open.
    if: ${{ false }}
    timeout-minutes: 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `yfinance` is load-bearing, not decoration, and it is the dependency trap this
      # lane's new suite walked into.  tests/test_us_scan_tier.py calls a helper that
      # does `import collectors.yahoo`, and collectors/yahoo.py imports yfinance
      # unguarded — a dep NEITHER the suite NOR its declared subjects name.  It is
      # invisible to a local run (yfinance is installed here) and invisible to a
      # sys.modules probe against a fixed candidate list, so the first draft of this
      # PR shipped without it and CI answered precisely: 9 failed, 236 passed,
      # ModuleNotFoundError: No module named 'yfinance' — and because run_ci_pack.py
      # returns on the FIRST non-zero step, this job's own later red (the nightly lane
      # placement step, red on main independently) never even ran.
      # WIDENING IS LEGAL HERE.  "Never widen the pip line" is scoped to lanes whose
      # thin env is a DECLARED canary — dataos-foundation's `pytest pyyaml` and the
      # marketing/chart-render thin lanes, each of which says so in a comment.  This
      # job declares no such contract and no comment here turns on a dep being absent.
      # The resulting line is BYTE-IDENTICAL to the one unrun-russell-breadth already
      # declares — the sibling lane that also owns collectors/yahoo.py — so
      # run_ci_pack.py reuses that venv and provisions nothing new.
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests beautifulsoup4 openpyxl scikit-learn yfinance
      # P1 unrun backfill 2026-08-14: tests/test_us_scan_tier.py joins the step that
      # already owns engine/prophet_miss_audit.py and engine/us_context_vector.py — two
      # of its own subjects — plus engine/confluence_tiers.py, the tiering it asserts
      # on.  It was named by no `run:` step in any workflow, so scripts/run_us_scan_tier.py
      # and scripts/heal_shallow_caches.py, both on the nightly US scan path, had no CI
      # owner.  Appended LAST so a context-vector or miss-audit regression is the first
      # failure a reader sees rather than the scan tier failing for a borrowed reason;
      # it rides this step because a step is the masking unit (run_ci_pack.py returns on
      # the first non-zero step) while pytest reports every file inside one step.
      # Dependencies: requests, bs4 and lxml are all loaded but OPTIONAL — blocking each
      # individually still leaves the suite 49-passed — and requests + beautifulsoup4
      # are on the install line regardless.  yfinance is the one that is NOT optional;
      # see the install-line comment above for why it had to join and why that is not a
      # canary-lane widening.
      - name: US context vector + full-population grades + miss-audit scorecards
        run: python -m pytest tests/test_us_prophet_grades.py tests/test_us_prophet_w3.py tests/test_us_context_vector.py tests/test_prophet_miss_audit.py tests/test_heal_candidates_archetype.py tests/test_us_scan_tier.py -q
      - name: US entry-status full-population remeasurement
        run: python -m pytest tests/test_us_entry_status_remeasure.py -q
      # The candidate-pool lanes ride this job because they ride this STORE: the nine
      # pool_* columns are appended to the very candidates parquet the suites above
      # guard, and the graduation annotations are a read back out of it. Its
      # TestNoAuthorityLeak is the fence that keeps a display tier out of admission —
      # a static token sweep, an import-closure walk and a behavioural invariance
      # check on prophet_bridge.select_candidates.
      - name: US candidate-pool lanes (lossless partition + store columns + no authority leak)
        run: python -m pytest tests/test_us_candidate_lanes.py -q
      # W1.5 board-session anchor (#5303/#5307): the earnings-blackout gate and the
      # display-tier chip read the BOARD's session, never the render host's wall
      # clock — hosts straddling local midnight flipped membership (78 vs 81 buy
      # rows at one identical as_of) and the chip countdown. Rides this job because
      # the gate prunes the same candidate pool the lanes above partition, and the
      # suite imports the same scripts.build_stock_library this job already loads.
      - name: US board-session anchor (earnings gate + display chip, host-clock determinism)
        run: python -m pytest tests/test_earnings_blackout_board_anchor.py -q
      # The candidates store this job guards is TRACKED IN A PUBLIC REPO, and
      # context_api.context_frame flattens each dimension's whole `value` dict
      # with no allowlist — so a dimension that grows a paid body ships it to
      # everyone with `git clone`. That is not hypothetical: entitlement-gated
      # Filing Forensics findings for 722 tickers reached
      # data/us_prophet_rank/candidates/2026-07.parquet exactly that way.
      # Runs beside the store's own suites so the containment and the store's
      # PIT discipline cannot drift apart.
      - name: committed-store payload containment (no paid body may be stamped)
        run: python -m pytest tests/test_us_context_vector_payload_containment.py -q
      # The same three modules' NIGHTLY WIRING (2026-08-06): they moved out of the engine
      # job into daily.yml's us_prophet_ledgers lane, so where they run, what they wait on,
      # and whether COLLECT_LANE still arms their forward advance are now facts a workflow
      # edit can silently break. Rides this job because it imports the same modules (and so
      # needs the same venv) and because the suite above owns their in-process contract —
      # the two halves of "does the ledger actually advance" belong under one eye.
      - name: prophet-us nightly lane placement, ledger gate, and failure isolation
        run: python -m pytest tests/test_prophet_off_engine_lane.py -q

