      - name: CN membership-PIT lane gate — fail-closed, on the production call path
        run: python -m pytest tests/test_cn_membership_pit_lane_gate.py -q
      # GMI W1a — the PRODUCER the two steps above never had. The scraper and the
      # seeder appeared in NO workflow, so membership.json froze on 2026-06-30 and the
      # PIT store held two snapshots for six weeks while the nightly --snapshot step ran
      # green ~35 nights, dedup-skipping every one. These three suites guard the fix and,
      # more importantly, the three ways it can go quiet again: complete-or-fail
      # promotion (a partial dump would read to the seeder as vanished boards), the US
      # suite's own lane gate (per-suite now, so a foreign nightly must be refused in
      # BOTH directions), and the tripwire that makes a stalled plane impossible to
      # mistake for a healthy deduping one. Steps are split so a red names which of the
      # three broke. TZ=UTC because the writers stamp UTC dates the tests read back.
      - name: THS weekly re-scrape — receipts, complete-or-fail promotion, PIT ingest
        run: TZ=UTC python -m pytest tests/test_ths_weekly_rescrape.py -q
      - name: US basket PIT membership store + per-suite lane gate
        run: TZ=UTC python -m pytest tests/test_us_basket_membership_pit.py -q
      - name: membership snapshot freshness tripwire — cadence, source, coherence
        run: TZ=UTC python -m pytest tests/test_membership_snapshot_freshness.py -q
      # GMI W1b — the theme-graph semantic spine built ON TOP of those membership
      # documents. Split into four steps so a red names which contract broke: node
      # identity (permanent company ids, ratified epochs), the materialization
      # (bitemporal intervals, era/date_provenance honesty, the THS join), the guard
      # itself, and the CN limit-rule registry's parity against the canonical engine.
      # TZ=UTC because these writers stamp UTC dates the tests read back.
      - name: theme graph — permanent node identity and ratified epochs
        run: TZ=UTC python -m pytest tests/test_theme_graph_identity.py -q
      - name: theme graph — bitemporal materialization from the membership documents
        run: TZ=UTC python -m pytest tests/test_theme_graph_materialize.py -q
      - name: theme graph — contract guard (incident fixtures + annotation shape)
        run: TZ=UTC python -m pytest tests/test_theme_graph_contracts.py -q
      - name: theme graph — crosswalk v3 additive integrity
        run: TZ=UTC python -m pytest tests/test_theme_graph_crosswalk.py -q
      - name: theme graph — W3A local-theme plane (hostile tests D-M, capability sidecar, rights gate)
        run: TZ=UTC python -m pytest tests/test_theme_graph_local_plane.py -q
      - name: theme graph — source-rights registry shape + F20 grandfather pin
        run: TZ=UTC python -m pytest tests/test_theme_sources_registry.py -q
      - name: CN limit-rule registry — schema, continuity, parity vs china_microstructure
        run: TZ=UTC python -m pytest tests/test_cn_limit_rules.py -q
      # GMI W2 — the exposure-decomposition probe's pure math. The probe script itself is a
      # one-shot research tool that is deliberately NOT wired into any lane, so its estimators
      # would otherwise have no guard at all: a wrong causal shift, a share denominator that
      # divides by an empty month, a coverage floor off by a boundary, or an era label keyed on
      # the month END would all ship silently into the committed receipts under
      # research/theme_graph/w2_probe/ and into whatever W4 charters from them. Every fixture
      # here is synthetic — the suite reads no store, so it stays green on a runner that cannot
      # see the gitignored narrative_flare history the probe reads locally. TZ=UTC to match the
      # rest of this job; nothing in the suite is clock-dependent by construction.
      - name: theme exposure probe — beta/causal shift, share denominator, coverage floor, era
        run: TZ=UTC python -m pytest tests/test_theme_exposure_probe.py -q
      # The guard on the COMMITTED store, not only on its fixtures: --selftest proves it
      # can still see each incident, --strict proves the store shipped in this repo
      # satisfies the contract. A guard that only ever runs against its own fixtures is
      # a guard the guarded artifact cannot trigger.
      - name: theme graph contract guard against the committed store
        run: |
          python -m scripts.check_theme_graph_contracts --selftest
          python -m scripts.check_theme_graph_contracts --strict

  unrun-data-plane:
