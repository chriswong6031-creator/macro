  cn-standout-audit:
    if: ${{ false }}
    # SA-W2: CN PIT regime store + species_id + two-axis attribution + fitness card.
    # Tests: lane fail-closed, keep-first, species_id mapping, axis precedence, us_proxy
    # isolation, premature_stop_noise unimplemented (F5), never-raise, data_gap honesty,
    # F1 regime-stamp sequencing, F2 window-unit Wilson, F6 ticks-based timing.
    # F9: test_china_standout_track added — covers species_id/regime-stamp changes.
    #
    # CURATED SCOPE (2026-08-15 wave 4). `scope: exclusive` makes the paths below
    # REPLACE inference. This job had NO owned tier at all — every one of its 28
    # inferred patterns was opaque fallback, so it selected on `*` and on whole
    # trees it never reads. Cause: #5754 gave scripts/build_china_library.py an
    # import of engine/china_intel_interest.py, which lazy-imports china_intel_hub
    # and reads the full altdata convergence universe. That subtree's own opaque
    # constructs then widened this job's scan roots to the fallback tier, and it
    # began matching templates/index.html — a file no suite here reads. Measured:
    # that smear was one of the two +1s that took the index.html probe from 127
    # to 129 in tests/test_ci_pack.py::test_exclusive_curation_narrows_ordinary_code_prs,
    # which was re-based to absorb it rather than fixed. This is that fix.
    #
    # THE GLOBS ARE EARNED, and each names the construct that earns it:
    #   engine/** + scripts/**  — test_cn_board_lane_gate.py:361 and
    #     test_cn_entry_price_integrity.py:527 rglob("*.py") over BOTH trees and
    #     AST-scan every hit for unlaned CN sink calls. The trees are those two
    #     guards' SUBJECT, not their incidental dependency: a new script carrying
    #     a forgotten `lane=` is exactly what they exist to catch, so enumerating
    #     either one would make this job stop covering the files it is for. This
    #     is why scripts/ is globbed here and ENUMERATED in coiled-mtf-anchor-era,
    #     whose two suites contain no traversal at all.
    #   collectors/**  — scripts/build_china_library.py:1807 runs
    #     importlib.import_module(_mod).refresh() over a tuple of collectors.*
    #     drip modules. The walker cannot resolve the loop variable, so those
    #     seven tushare_* modules are NOT in the static closure and the test below
    #     cannot see them: enumeration would silently drop them. The dynamic
    #     targets are all collectors.*, so this glob is the honest width of that
    #     construct — the rest of its CODE_SCAN_ROOTS widening (templates/**,
    #     site/**/*.py, docs/**, tools/**) is the smear being removed.
    #   config/** + data/**  — engine/smart_money.py (x5), lib/ai_costs.py:417 and
    #     collectors/base.py:124 traverse roots=config,data for .parquet/.jsonl,
    #     and scripts/seed_china_ths_baskets.py:318 traverses data/ with NO suffix
    #     filter. Runtime reads the static closure cannot enumerate.
    #
    # ENUMERATION IS SAFE ONLY WHERE THE TEST CAN SEE. lib/, research/ and the
    # named suites are reached by ordinary static import, so a newcomer is caught
    # loudly by test_curated_exclusive_scopes_cover_their_own_import_closure. The
    # site/ artifacts are runtime JSON the test canNOT re-derive, so the five
    # china-only trees (1-4 files each) stay globbed; only the three files inside
    # the shared basketdata/ (49 files) and factordata/ (310) trees are named, to
    # keep 356 unrelated artifacts out of this job's scope.
    #
    # WIDENING IS THE SAFE DIRECTION. Exclusivity SKIPS inference, so a closure
    # file with no matching pattern is a job that stops running when its own
    # dependency changes and reports green forever. Do not hand-prune this list:
    # when a new import lands, the test above names the exact uncovered file.
    # Do not add templates/**.
    runs-on: ubuntu-latest
    scope: exclusive
    paths:
      - "engine/**"
      - "scripts/**"
      - "collectors/**"
      - "config/**"
      - "data/**"
      - "lib/__init__.py"
      - "lib/ai_costs.py"
      - "lib/closes_panel.py"
      - "lib/cn_calendar.py"
      - "lib/config.py"
      - "lib/filing_value_units.py"
      - "lib/nyse_calendar.py"
      - "lib/store.py"
      - "lib/ticker_aliases.py"
      - "lib/ticker_popularity.py"
      - "research/US_BOARD_MEASUREMENT.md"
      - "site/china_intel/**"
      - "site/chinaaltdata/**"
      - "site/chinanews/**"
      - "site/chinaradar/**"
      - "site/chinaspecialdata/**"
      - "site/basketdata/fear_greed.json"
      - "site/factordata/basket_washout_state.json"
      - "site/factordata/china_standouts.json"
      - "tests/test_china_standout_track.py"
      - "tests/test_cn_board_lane_gate.py"
      - "tests/test_cn_entry_price_integrity.py"
      - "tests/test_cn_standout_audit.py"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        # markupsafe: the integrity step below imports scripts.build_china_library, whose
        # module graph reaches engine/i18n.py -> markupsafe. Absent, pytest dies COLLECTING
        # (exit 2) — locally invisible because dev envs carry it, and the sibling jobs that
        # import the builder (e.g. unrun-picks-boards) get it transitively via jinja2. With
        # it added, every suite in this job passes in a from-scratch minimal venv.
        run: pip install pytest pandas numpy pyarrow pyyaml markupsafe
      - name: SA-W2 CN standout audit tests
        run: python -m pytest tests/test_cn_standout_audit.py tests/test_china_standout_track.py -v -q
      - name: CN entry-price integrity (corrupt-bar gate, PIT latch, fail-closed lane — PR 5000)
        run: python -m pytest tests/test_cn_entry_price_integrity.py -q
      - name: CN board-append lane gate (fail-closed CN_LANE — board/ripening/audit/event-latch)
        run: python -m pytest tests/test_cn_board_lane_gate.py -q

  workflow-yaml:
    if: ${{ false }}
    # Every .github/workflows/* file must load as YAML and carry on: + jobs:.
    # An unparseable workflow file makes GitHub stamp a FAILED zero-job run on
    # every push to every branch carrying it (metabolism-agenda.yml col-0
    # incident: ~325 failed runs 07-10→07-11, introduced #2135, repaired #2260).
    # dag-conformance above only yaml-loads workflows declared as dag.yml lanes,
    # so non-lane workflow files had no parse guard at all — this closes that gap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deps grew 2026-07-30 (#3977). This job was `pytest pyyaml` — right for the
      # workflow-YAML steps — but OIP E8 attached five options suites whose assertions are
      # DATA-layer: they build DataFrames, round-trip parquet, and drive builders that
      # render templates and fetch over HTTP. Only the first added step ran before ci-pack-1
      # died, so its `No module named 'jinja2'` hid four more steps that would have failed
      # the same way on pandas/jinja2/requests. Verified minimal by installing one package
      # at a time in a clean venv (2026-07-30): pytest+pyyaml alone collects none of the
      # four; +pandas leaves parquet writes failing; +pyarrow leaves 15 jinja2 and 11
      # requests failures; the set below runs all five green (31+52+38+33+23 = 177 tests).
      # numpy is transitive via pandas and named for the record, as causal-factory does.
      # NOT patched with importorskip anywhere — a suite that skips in the only job naming
      # it executes NOWHERE while reading green, which is the class the
      # check_skip_only_suites.py steps below exist to catch.
      - name: install minimal deps
        run: pip install pytest pyyaml pandas numpy pyarrow jinja2 requests
      - name: check_workflow_yaml selftest
        run: python scripts/check_workflow_yaml.py --selftest
      - name: "all workflow files must parse with on:/jobs: blocks"
        run: python scripts/check_workflow_yaml.py .github/workflows
      # ci.yml's Wave B job graph (2026-08-11), wired here because the step above is
      # the closest existing owner: both read .github/workflows/ as their subject and
      # both need only pytest+pyyaml, already installed above. A parse gate proves the
      # file LOADS; this proves it still says what it has to say. `ci-plan` now emits
      # the pack matrix, so a PR may publish a SUBSET of ci-pack-0..11 and `ci-gate`
      # is the only name that concludes on every non-closed event — the affirmative
      # success `scripts/merge_on_green.py` requires (#4779, absence of red is not a
      # pass). Deleting `ci-gate`, or swapping the immutable PR base SHA for a branch
      # name in the planner's diff, are both one-token edits that stay green forever
      # without this step. Executes ci-gate's shell for real (inline shell is
      # untested code otherwise); no importorskip, no data/ or site/ reads, so it
      # cannot skip its way to a green on a pack runner.
      - name: ci-plan/ci-pack/ci-gate workflow structure contract
        run: python -m pytest tests/test_ci_plan_workflow.py tests/test_ci_semantic_proof.py tests/test_ci_pack_semantic.py -q
      - name: hosted-runner packing contract
        run: python -m pytest tests/test_ci_pack.py tests/test_merge_on_green.py tests/test_merge_on_green_semantic.py tests/test_check_conflict_markers.py -q
      - name: transitional self-hosted runner policy and canary contracts
        run: python scripts/check_runner_policy.py && python -m pytest tests/test_runner_policy.py tests/test_ci_canary_tools.py tests/test_ci_canary_workflows.py -q
      # The US nightly's cron redundancy (2026-08-13), wired here for the same reason
      # the two steps above are: its subject IS .github/workflows/ — specifically the
      # asymmetry that asia-close.yml carries five cron slots and daily.yml carries one
      # DST pair, which is why CN self-heals a lost fire and the US lane lost two whole
      # sessions on 2026-08-11/12. The backstop is an ACTOR, so its suite is mostly the
      # cases where it must NOT fire; test_primary_still_has_only_the_dst_pair reds if
      # daily.yml ever grows its own backstop crons and this lane becomes double-firing.
      - name: nightly backstop selftest (scripts/nightly_backstop.py)
        run: python3 scripts/nightly_backstop.py --selftest
      - name: nightly backstop dispatch rule (must never fire over a live run)
        run: python -m pytest tests/test_nightly_backstop.py -q
      # 2026-08-12: the terminal-CI-handoff step that used to sit here is GONE with the
      # rule it guarded. A worker no longer stops on an armed pull request — it owns
      # commit -> push -> PR -> CI -> squash-merge -> live verification — so there is no
      # release verdict left to pin and no receipt left to leak. What the retirement
      # must not lose is the sweeper: `tests/test_merge_on_green.py` in the step above
      # still guards the party that PERFORMS the merge, and the Stop hook's own half
      # (an armed pull request blocks rather than releases, and the spurious-check
      # predicate still agrees with the sweeper's copy) is pinned by
      # tests/test_ship_loop_guard.py, wired in its own job below.
      # SUITE DISCOVERY, which all three darkness guards share. It was
      # `tests/`-only until 2026-08-06, so the suites most likely to be dark were
      # the ones no census could see: a research packet fenced to files-only writes
      # its guard suite NEXT TO the instrument under research/, and #4693 measured
      # two such suites (22 tests) named by no `run:` step since they landed —
      # never executed, while every census reported the repo covered. Discovery is
      # now the whole tree, classified by what pytest would COLLECT rather than by
      # filename: three test_-shaped files under research/ are CLI measurement
      # instruments that collect nothing, and reporting those as work items is how
      # a census stops being read. Selftest first, same reason as the two below.
      - name: audit_unrun_tests selftest
        run: python scripts/audit_unrun_tests.py --selftest
      # ARMED 2026-08-09. The census reported for three weeks and the backlog did not
      # move: 969 unrun suites of 2,146 on the day it was armed, while six separate PRs
      # (#4567, #4589, #4709, #4710, #4800, #4826) each un-darkened ONE suite by hand.
      # An enumeration nobody is obliged to read keeps re-creating the trap it measures,
      # so the exit code now carries the finding. RED only for a suite that is unrun and
      # in NEITHER file: config/unrun_test_baseline.json (the pre-gate backlog,
      # shrink-only — rows leave when a suite is wired or deleted, nothing is ever
      # added) or config/unrun_test_waivers.yml (path -> reason, for a suite that must
      # stay unrun with an owner and an argument). Rows in either file that no longer
      # read as unrun WARN to be pruned; they never red, so the PR that wires a suite is
      # never punished for wiring it. Grandfathering the 969 rather than gating them is
      # deliberate — running them all would blow the ci-pack budget; what this buys is
      # the ratchet on the 970th. Enumeration stays EXPLICIT for the same reason the
      # install-line comments above give: a glob runner would auto-run unvetted suites
      # and re-create the ERROR-at-collection class those comments document, so a new
      # suite is wired into the job that owns its subject, by hand, on purpose.
      - name: "no suite may be named by zero run: steps (baseline-gated)"
        run: python scripts/audit_unrun_tests.py
      - name: unrun-census discovery unit tests
        run: python -m pytest tests/test_audit_unrun_tests.py -q
      # SKIP-ONLY suites: a test that skips in every job naming it executes
      # nowhere, so a job list and a green run both lie about it. This is what an
      # `importorskip` added to clear a red lane creates by construction — it
      # happened in #3703 and again in #3722→#3738→#3760 — and no other census
      # measures it: audit_unrun_tests.py asks "is this suite named by a job",
      # never "does that job install what the suite needs to run".
      # The selftest runs FIRST: a detector that has quietly stopped detecting
      # would otherwise report a clean repo forever.
      - name: check_skip_only_suites selftest
        run: python scripts/check_skip_only_suites.py --selftest
      - name: no suite may skip in every job that names it
        run: python scripts/check_skip_only_suites.py
      - name: skip-only detector unit tests
        run: python -m pytest tests/test_check_skip_only_suites.py -q
      # TRIGGER GAPS: the reverse direction of audit_unrun_tests.py. That census
      # asks "can ANY edit start this job" — an any() over the closure, satisfied
      # by the test file itself — so a suite stays "triggerable" while the ONE
      # module it exists to guard is matched by no path entry. The lesson has been
      # written in comments here four times (#3488, #4559, and the "both halves
      # listed on purpose" notes through ci.yml) and never enforced; prose in a
      # 1,700-entry path list is not a guard. Selftest first, same reason as above.
      - name: check_ci_trigger_closure selftest
        run: python scripts/check_ci_trigger_closure.py --selftest
      - name: every guarded suite's subjects must reach its own trigger paths
        run: python scripts/check_ci_trigger_closure.py
      - name: trigger-closure guard unit tests
        run: python -m pytest tests/test_ci_trigger_closure.py -q
      # render.yml's per-scope publish wiring. #3718 fixed the international
      # dashboard never publishing because `intl` was missing from the render
      # lane's scope list, and shipped this suite as the guard — but no `run:`
      # step named it, so the guard for that fix was itself dark from the hour
      # it landed. Same class the unrun-* lanes close; caught by
      # scripts/audit_unrun_tests.py on the very next census.
      - name: render-lane scope contract (intl must stay in the publish scopes)
        run: python -m pytest tests/test_render_intl_scope.py -q
      # A run: scalar over GitHub's length cap makes GitHub DE-REGISTER the workflow.
      # render.yml vanished from the registry on 2026-07-27 (#3826) and the express lane
      # was dead ~1h. yaml.safe_load, check_workflow_yaml.py and actionlint ALL pass on an
      # over-cap file, and the owning PR's checks stay green — the failure only shows in
      # the BRANCH run list, as a zero-job run titled by PATH instead of by `name:`. This
      # is the only gate that can catch it pre-merge. The ownership suite in the
      # same step pins the positive builder allowlist that keeps unrelated entrypoints
      # out of the scarce self-hosted render queue.
      - name: "render workflow size ceiling and builder ownership"
        run: python -m pytest tests/test_render_run_size_cap.py tests/test_render_builder_ownership.py -q
      - name: render publication dead-asset fences
        run: python -m pytest tests/test_render_dead_asset_gate.py -q
      # Same class, second instance (2026-07-27). build_canada was invoked by NO
      # workflow at all: site/canada.html existed only as a side effect of a
      # swallowed try/except inside build_vector, so a canada-only fix could ride a
      # dispatched scope that never calls hub() and ship stale behind a green run —
      # exactly how macro#3820's recovery ended up needing scope=hk. The suite runs
      # render.yml's `region_of` shell function for real (inline shell is untested
      # code otherwise) and pins the daily/weekly step ordering. stdlib + bash only,
      # so the minimal pytest+pyyaml install above is enough.
      - name: render-lane scope contract (canada must be first-class, not a build_vector hook)
        run: python -m pytest tests/test_render_canada_scope.py -q
      # OIP E8 (2026-07-29). Same #3718 class as the intl suite above: this PR shipped
      # five guards and, on first push, NO `run:` step named any of them — the
      # options-workspace suite appeared only in a render.yml YAML COMMENT, which is
      # enough to satisfy audit_unrun_tests.py's text matcher (tightened in the same
      # commit to read `run:` steps only, so a comment can no longer fake coverage).
      # Deps: see the install step's note — these five need the data stack, not just
      # pytest+pyyaml. The express-lane suite itself is stdlib + bash (it shells out to
      # execute render.yml's `region_of` for real) and its one RUNTIME probe stubs jinja2
      # when absent rather than skipping, so it stays runnable in a thin env too.
      - name: options express-lane coverage contract (workspace + screener must stay wired)
        run: python -m pytest tests/test_render_options_workspace_scope.py -q
      # #3721 weekend-row class. The options stores accrue non-session rows that RECOMPUTE
