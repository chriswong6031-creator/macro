  capital-structure-intelligence:
    if: ${{ false }}
    # W0-W3A is an evidence/event/precision/candidate-term contract, not merely a collector.
    # This dedicated offline job keeps schemas, PIT/correction behavior, R2 wrapper,
    # graph linkage, exact fee-table spans, legacy boundary, and SEC fixtures in one
    # hard gate. Document and candidate terms remain pre-instrument transcriptions,
    # never capacity/risk math.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install capital-structure test deps
        run: pip install pytest pandas numpy pyarrow jsonschema==4.26.0 requests pyyaml jinja2 fastapi httpx boto3
      # P1 unrun backfill 2026-08-14: the REGISTRATION-LIFECYCLE compiler joins the step
      # that already owns every other capital-structure compiler and contract.
      # tests/test_compile_capital_structure_registration_lifecycles.py was named by no
      # `run:` step in any workflow, so scripts/compile_capital_structure_registration_
      # lifecycles.py and engine/capital_structure/registration_lifecycle.py had no CI
      # owner, while the source_identity/source_ledger_io modules they build on were
      # covered here.  Appended LAST in the list so a compiler, contract or source-store
      # regression is the first failure a reader sees rather than the lifecycle compiler
      # failing for a borrowed reason.  It rides this existing step because a step is the
      # masking unit (run_ci_pack.py returns on the first non-zero step) while pytest
      # reports every file inside one step, and adds no job to a manifest at the
      # narrow-diff ceiling.  No dependency widened: probed at RUN time it loads
      # pandas/numpy/pyarrow/pyyaml/requests, all already on the install line above.
      - name: capital-structure contracts, compilers, projection, graph, source store, and legacy boundary
        # FOUR nightly-wiring suites ride HERE on purpose, and they only mean
        # anything together — each states one side of the same 2026-08-06 split:
        #   test_daily_collect_commit_path.py    the MARKET side: no capital-structure
        #     step may run in the collect job, the market checkpoint keeps its
        #     named-producer gate, and the handoff that replaced the chain can never
        #     cost the night.
        #   test_daily_capital_structure_job.py  the LANE side: the chain lives in its
        #     own `needs: collect` job, NOTHING needs that job, the compilers stay
        #     fatal, staging stays narrow, and the artifact handoff is verified
        #     against collect's receipt before a compiler reads the ledger.
        #   test_capital_structure_compiler.py   the COMPILER side (::test_nightly_order
        #     _and_render_network_firewall_are_pinned): market checkpoint first —
        #     asserted through `needs:`, not file order — and the compile still fatal
        #     for its own checkpoint.
        #   test_collect_staging_globs.py        the QLEDGER side, and it was named by
        #     no `run:` step at all until 2026-08-06 — so when #4731 added the narrow
        #     capital-structure checkpoint, its "every commit step stages
        #     site/qledger/" assertion went red on main and nothing reported it. It
        #     sat red for two days and was mistaken for cross-file test pollution.
        #     The grader's tracked write must be committed by the FIRST checkpoint,
        #     and a later narrow checkpoint must be gated so it cannot run when that
        #     first one did not.
        # Co-locating means a change to any one surfaces the others; splitting them
        # lets one drift green while the invariant it names is already broken.
        run: >
          python -m pytest
          tests/test_daily_collect_commit_path.py
          tests/test_daily_capital_structure_job.py
          tests/test_collect_staging_globs.py
          tests/test_capital_structure_compiler.py
          tests/test_capital_structure_contracts.py
          tests/test_capital_structure_document_terms.py
          tests/test_capital_structure_instrument_candidates.py
          tests/test_capital_structure_event_spine.py
          tests/test_capital_structure_graph.py
          tests/test_capital_structure_legacy_compat.py
          tests/test_capital_structure_pit.py
          tests/test_capital_structure_projection.py
          tests/test_build_capital_structure_projection.py
          tests/test_capital_structure_page.py
          tests/test_capital_structure_api.py
          tests/test_capital_structure_source_identity.py
          tests/test_capital_structure_source_manifest.py
          tests/test_capital_structure_ingestion_health.py
          tests/test_capital_structure_share_count_truth.py
          tests/test_capital_structure_companyfacts_authenticated_read.py
          tests/test_capital_structure_share_count_materializer_model.py
          tests/test_capital_structure_share_count_publication.py
          tests/test_capital_structure_share_count_retention.py
          tests/test_capital_structure_share_count_materializer.py
          tests/test_capital_structure_share_count_r2_conformance.py
          tests/test_capital_structure_share_count_r2_operator.py
          tests/test_capital_structure_share_count_r2_concurrency.py
          tests/test_capital_structure_share_count_r2_concurrency_operator.py
          tests/test_sec_capital_structure.py
          tests/test_sec_capital_structure_companyfacts.py
          tests/test_nwqs_c_dilution.py
          tests/test_compile_capital_structure_registration_lifecycles.py -q

  stock-seasonality:
    if: ${{ false }}
    # WIRING LAW (#1253 precedent): a suite that NO job names never runs. The
    # foundation suite (tests/test_biopharma_seasonality_foundation.py) landed
    # with no job naming it and has therefore never executed in CI — this job is
    # its home as well as the calendar clock's.
    #
    # What rots here if it is unguarded is not cosmetic. The engine folds ~25
    # complete years onto a 365-slot clock and prices a 2645-window search with a
    # resampling null; a leap-day return quietly dropped, a window that wraps
    # December into January, or a null that shifts every year TOGETHER (which
    # relocates a real seasonal effect instead of removing it) all produce output
    # that looks entirely plausible and is wrong. The calibration test — pure
    # noise must fire at roughly its nominal 5% — is the one that separates a real
    # familywise correction from a decorative one, and nothing else in the repo
    # can catch that regression.
    #
    # Offline: the artifact tests build a synthetic parquet store in tmp_path, so
    # no network and no dependence on the committed data/yahoo/ tree.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install seasonality test deps
        # jinja2: test_seasonality_program_watch.py's public-containment class
        # imports scripts.build_measurement, which does `from jinja2 import
        # Environment` at module scope. run_ci_pack builds a FRESH isolated venv
        # per distinct install string (no --system-site-packages), so a package
        # another job installed is not visible here and the two containment tests
        # — the leak gate itself — error with ModuleNotFoundError.
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2
      - name: seasonality contracts, panel, curve, window family, null, and artifact
        run: >
          python -m pytest
