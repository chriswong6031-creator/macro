      #     had gone FALSE: it promised the polygon row "usually sits in the row stamped
      #     session+1", which #4807 (2026-08-07) ended for every row written after it.
      #     An operator following it would copy the wrong session's gamma into an
      #     authority-adjacent store — the exact off-by-one the message's own last clause
      #     warns against. The text is corrected to pin the session on the spot-vs-yahoo
      #     identity check instead of any offset; this wires the suite that holds it so
      #     the corrected wording is defended rather than merely written.
      # 26 tests, ~20 s serial; hermetic (every store read is redirected to tmp_path) and
      # needs only the deps already installed here.
      #
      # GEX modeling-core wiring (2026-07-29). Three suites, 42 tests, ~3 s serial.
      #
      # These were the three remaining strictly-dark suites in the GEX family — named by
      # no `run:` step in any workflow AND matched by no ci.yml path pattern, so no
      # possible edit could even start CI for them: the walls/surface/smile/term model
      # layer, the finite-difference-verified greeks + dealer-sign engine math, and the
      # Polygon per-strike chain accrual every options read now depends on. The OIP E3
      # wave wired its own three and flagged this family as the follow-up; this closes it.
      #
      # Import closure verified empirically against THIS job's install line: with scipy,
      # sklearn, jinja2, plotly, requests, bs4, openpyxl, statsmodels, matplotlib and
      # fastapi ALL blocked via a builtins.__import__ shim, the only miss is `requests` —
      # it enters at module scope through collectors/base, which the accrual collector
      # rides. pytest + pandas + numpy + pyarrow + pyyaml + requests is the full closure;
      # all six sit in the line above, so the shared venv is unchanged, and the other
      # nine blocked wheels are confirmed unused. All 42 green on main at wiring time.
      #
      # polygon_gex SESSION STAMPING (2026-08-06). Wired at birth, into this step because
      # its import closure is identical (pytest + pandas + numpy + pyarrow + requests via
      # collectors/base) and it guards the same accrual runner. It pins: the stamp is the
      # SESSION the snapshot describes and never the UTC run date; a Friday-evening
      # accrual (a UTC-Saturday instant) is STORED rather than refused — the shape that
      # permanently lost session 2026-07-31; first-writer-wins; and the migrated store's
      # standing invariant that every chains stamp and every summary row is an NYSE
      # session. Reads the committed store, so it also fails if a future writer regresses.
      - name: GEX modeling core — walls/surface model, greeks + dealer-sign engine, polygon per-strike accrual
        run: python -m pytest tests/test_gex_model.py tests/test_gex_engine.py tests/test_polygon_gex.py tests/test_polygon_gex_session_stamps.py -q
      # MSC R2.4 (2026-08-01): the live Level Report Card publisher. Wired at birth —
      # pure pandas/pytest, same import closure as the step above (pandas+pyarrow only).
      # R2.4b (2026-08-02) adds the nulls/index-lane suite AND back-wires the two
      # WP-C1 grader suites that were never CI-named (the named-test-files trap).
      - name: Level Report Card — grade-summary publisher (Wilson CI vs null, coverage honesty)
        run: python -m pytest tests/test_level_grades_summary.py tests/test_levels_grade_nulls.py tests/test_levels_grade.py tests/test_levels_track_record_rebase.py -q
      # Wired 2026-08-06: the ENGINE the four grader suites above grade, and the only
      # one of the family named by no run: step. Red on main — three tests still
      # asserted the pre-retirement contract where an absent gamma_flip was
      # interpolated out of by_strike. `_flip_from_rows` is retired (a flip is the
      # spot at which the RE-PRICED book has zero net dealer gamma, which the ladder
      # cannot express — charting-app gamma-flip-defect-rca.md), so the engine renders
      # an honest null. Nothing went red because nothing ran it. Retargeted to pin the
      # retirement, which is what keeps a fabricated flip from coming back.
      # Same import closure as the step above (engine/levels_engine.py, pytest only).
      - name: Levels engine — anchor/walls/clusters and the retired gamma-flip reconstruction
        run: python -m pytest tests/test_levels_engine.py -q
      # MSC R3.2/R3.3 (2026-08-02): the cross-root gex_state _index.json aggregator
      # (lib/gex_state_index.py, called from build_gex_board). Wired at birth — pure
      # stdlib json/pathlib, no new wheels.
      - name: gex_state cross-root index — glance-tier aggregate (never-blank, field subset)
        run: python -m pytest tests/test_gex_state_index.py -q
      # OIP E3 positioning persistence (2026-07-29). Three suites, ~11 s serial.
      #
      # test_gex_state.py and test_index_gex_history.py were BOTH dark: named by no
      # `run:` step in any of the workflows, so the gex_state emitter and the index
      # dealer-gamma reconstruction had no CI at all. This wave edits both, so leaving
      # them unwired would ship the edits unverified — the unrun-suite rot class.
