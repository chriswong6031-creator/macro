    # 2026-08-15 pack-9 / run 31881072256 on PR #5750: the first semantic step
    # (1253 tests) took 223.76s; the fusion step was SIGKILL'd when this
    # 5-minute logical-job deadline expired at 300s, and the post-kill
    # `git for-each-ref refs/replace` then exited 128 as infrastructure
    # unknown. 12 minutes covers fusion + board-read + era + stage-analysis.
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests beautifulsoup4 openpyxl scikit-learn scipy
      # 2026-08-15 fusion override (WS:PROPHET-CONDITIONAL-FUSION): the C1 ranker
      # suite rides the step that already owns engine/us_board_rank.py rather than
      # opening a new one — it tests the SAME module's rank authority, and a
      # separate step could go green while the board suite went red on the same
      # change.  Placed immediately after test_us_board_rank.py so a shared-pass
      # regression is the first failure a reader sees.  Its byte-parity class
      # imports scripts/prophet_fusion_race.py at TEST time only (the engine
      # module imports nothing from scripts/, pinned by the suite itself), so no
      # dependency widens: pandas/numpy/pyarrow/pyyaml are already installed here.
      # P1 unrun backfill 2026-08-14: tests/test_us_board_grader_honesty.py joins the
      # step that already owns engine/us_board_rank.py (test_us_board_rank.py) and the
      # track ledgers it grades into.  It was named by no `run:` step in any workflow,
      # so the grader's HONESTY contract — that a published grade may not claim more
      # than the ledger supports — was dark on a publish pipeline.  It rides this
      # existing step (the masking unit: run_ci_pack.py returns on the first non-zero
      # step, while pytest reports every file inside one step) and is appended LAST, so
      # a rank or ledger-emitter regression is the first failure a reader sees rather
      # than the honesty guard failing for a borrowed reason.  No dependency widened —
      # probed at RUN time, it loads only pandas/numpy/pyarrow/pyyaml.
      - name: pick lab runners + US/CN board surfaces — shipped picks, outcome ledgers, priority board
        run: python -m pytest tests/test_b3_forex_consumer.py tests/test_board_contradictions.py tests/test_bottom_ledger.py tests/test_china_board_rank.py tests/test_china_board_rank_v4.py tests/test_china_continuation_watch.py tests/test_china_intel_interest.py tests/test_china_prophet_shadow.py tests/test_cn_board_unified_grid.py tests/test_cn_prophet_candidates_schema.py tests/test_cn_track_ledger_eras.py tests/test_opportunity_timeline.py tests/test_pick_lab_book.py tests/test_pick_lab_cn_runner.py tests/test_pick_lab_render.py tests/test_pick_lab_runner.py tests/test_prophet_card_live_change.py tests/test_prophet_card_shared.py tests/test_prophet_verb_ink_contrast.py tests/test_stock_board_v2.py tests/test_track_ledger_emitters.py tests/test_us_board_fail_closed_freshness.py tests/test_us_board_lanes.py tests/test_us_board_priority_ui.py tests/test_us_board_rank.py tests/test_us_prophet_fusion.py tests/test_prophet_fusion_w3_structural.py tests/test_us_board_w3_evidence.py tests/test_us_context_vector.py tests/test_us_context_vector_accrual.py tests/test_confluence_veto_leg_telemetry.py tests/test_us_board_grader_honesty.py -q
      # PR-1a (WS:PROPHET-CONDITIONAL-FUSION): the accrual-regression + veto-leg
      # telemetry suites ride the step above (same store cluster); the fusion arena
      # harness gets its own step below — research-tier scaffolding, zero authority,
      # every suite named because this repo has no catch-all pytest collector and
      # audit_unrun_tests reds any suite no run: step names.
      # PR-1b (WS:PROPHET-CONDITIONAL-FUSION): the baseline-race suite joins the PR-1a
      # step rather than opening a new one — same store cluster, same registry, and the
      # race suite's own fixtures import the PR-1a harness, so a registry edit that reds
      # one should red them together in ONE check rather than in two that can disagree.
      # PR-2 (WS:PROPHET-CONDITIONAL-FUSION): the C2/redundancy suite joins the same
      # step for the same reason — it imports the race's signs and the arena's fold/PIT
      # machinery, so the five suites red together on any registry or harness edit.
      # scipy is pinned EXPLICITLY in this step's install line (not inherited through
      # scikit-learn's dependency tree): scripts/prophet_fusion_c2.py imports
      # scipy.optimize for the bounded elastic-net fit and scipy.stats for the t
      # reference, and a scikit-learn drop must not silently take those imports with
      # it (requirements.txt:17 declares scipy a direct dependency and names this
      # module as a consumer).
      - name: prophet conditional-fusion arena harness + evidence-family registry + baseline race + C2/redundancy (PR-1a/PR-1b/PR-2)
        run: python -m pytest tests/test_prophet_fusion_families.py tests/test_prophet_fusion_arena.py tests/test_prophet_fusion_labels.py tests/test_prophet_fusion_race.py tests/test_prophet_fusion_c2.py -q
      # G-D plan-book board read (#5541). Landed as a collecting suite named by
      # no run: step, so audit_unrun_tests.py painted pack-1 red on every PR.
      # It belongs in THIS job with the other prophet/board surfaces: the join
      # it pins is the actionability + enrichment read those cards consume.
      # stdlib + pytest only (engine.prophet_board_read imports no third-party);
      # synthetic LibraryIndex trees under tmp_path, no data/ or site/ reads.
      - name: prophet board read (G-D actionability join + honest absence)
        run: python -m pytest tests/test_prophet_board_read.py -q
      - name: US track-ledger era boundary and frozen pre-era evidence
        run: python -m pytest tests/test_track_ledger_era.py -q
      # Stage-analysis board + its forward ledger and session-stamp heal
      # (forward-ledger audit 2026-08-05).  test_stage_analysis.py and
