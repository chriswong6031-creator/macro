  session-anchor-era:
    # Absolute session-calendar anchor, both eras. The confluence 2D/3D + fortnight
    # buckets (era abs-session-2026-08-06, ruling research/SESSION_ANCHOR_ABSOLUTE_
    # CALENDAR_ADJUDICATION_BY_FABLE.md, #4732) and the §7 marker engine (era
    # sq-abs-session-2026-08-06, research/SIGNAL_QUALITY_SESSION_ANCHOR_ADJUDICATION_
    # BY_FABLE.md, #4738). Both suites shipped named by NO run step in any workflow, so
    # the START-INVARIANCE guarantee each era rests on — the whole claim of the repair —
    # was never executed in CI (the 2026-07-26 census: every invocation here carries an
    # explicit file list, so an unnamed suite is genuinely never run).
    # audit_unrun_tests.py did list them, at tier P5: they score triggerable=True off
    # subjects that ride engine/**, and they write no ledger, so the ranking that
    # surfaces darkness sorted the guarantee under a PUBLISHED era stamp below 100-odd
    # quieter holes. Enumerating beats ranking. They pin k=1..6 leading-session drops on
    # fixtures built from REAL NYSE sessions (holiday spans, a 3-session halt,
    # shallow-depth caches), the era stamps on the payloads, and for the §7 suite the
    # marker stream dict-for-dict end-to-end through gate(). Self-contained — the
    # fixtures are generated from lib/nyse_calendar.py, nothing is read off disk — so
    # there is no skip path and no data dependency. 239 tests, ~26s locally; the budget
    # below is headroom for a hosted 2-vCPU pack.
    #
    # The §7 half arrives here one PR late, and the reason is worth keeping: #4800 wired
    # the confluence suite while #4738 was still in review, and a run step naming a file
    # the tree does not have aborts the ENTIRE pytest invocation — listing it early would
    # have taken the landed suite down with it, which is exactly what
    # test_every_workflow_test_path_exists pins. That guard matches on raw workflow TEXT,
    # so while #4738 was open the filename could not appear even in this comment.
    #
    # THIS JOB IS THE SINGLE OWNER of the confluence suite. #4833 (cycles anchor era,
    # merged 2026-08-07) independently appended it to engine-render-guards' pytest tail
    # alongside tests/test_cycles_anchor_invariance.py, so main briefly ran it in TWO
    # jobs; that duplicate line is removed in the same PR that adds the §7 half here.
    # A dedicated job is deliberate (the shape #4756 set for coiled-mtf-anchor-era): an
    # anchor regression should red a check named for the anchor, not one named
    # "engine-render-guards" with 60-odd unrelated suites in it. The cycles battery is
    # left where #4833 put it — consolidating all three era batteries here is a sensible
    # follow-up, but it belongs to the cycles lane, not to this PR.
    #
    # Placed beside signal-contract, which owns engine/signal_quality.py's §7 contract
    # one layer up, rather than beside the washout-turn organ: #4756 (coiled-mtf-anchor-
    # era, the sibling anchor-era job this one mirrors) is in flight and appends at
    # exactly that seam, and two jobs landing in one gap is a merge conflict for
    # whichever ships second. Venv sharing is by BYTE-IDENTICAL install command, not by
    # adjacency, so position costs nothing: the pip line below is the 32-job group's.
    if: ${{ false }}
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests beautifulsoup4 openpyxl scikit-learn
      - name: session + §7 anchor invariance (k=1..6 start drops, bucket/marker parity, era stamps)
        run: python -m pytest tests/test_session_anchor_invariance.py tests/test_sq_anchor_invariance.py -q

  trial-budgets:
    if: ${{ false }}
    # W1d (audit #21): every multiple-testing harness must REGISTER its trial budget, or the
    # DSR/kill/FDR deflation it feeds is a lie. A NEW validate_*/*_phase0 script that deflates a
    # Sharpe without registering fails RED here (the ~33 pre-existing offenders are grandfathered
    # in an allowlist that only shrinks). Also runs the grading-rebuild + ledger test suites.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: trial-registration lint (no new unregistered harness)
        run: python3 scripts/check_trial_registration.py
      - name: reliability-contract guard (no gated field rendered directionally, audit #46)
        run: python3 scripts/check_reliability_contract.py
      # A ticker rename is a ledger-key migration, not a fresh company. This
      # suite owns the track-record ingest guard, duplicate detector, and
      # losslessness receipt; keep it ahead of the broader grading invocation
      # so an unrelated grading failure cannot leave identity enforcement dark.
      - name: track-record company-key identity + lossless migration guard
        run: python -m pytest tests/test_ledger_identity.py -q
      - name: grading rebuild + trial ledger tests
        run: python -m pytest tests/test_grading.py tests/test_trial_ledger.py tests/test_trial_registration_lint.py tests/test_no_literal_ntrials.py tests/test_universe_history.py -q
      # Stock Identity W1 (WS:STOCK-IDENTITY): partition seal/reproducibility, metric-block
      # purity, truncation invariance, state totality, episode segmentation, G-8 import
      # firewall, banned-token/authority artifact walk. Minimal-deps safe (no matplotlib);
      # artifact-dependent tests skip cleanly when data/stock_identity is absent.
      # P1 unrun backfill 2026-08-14: tests/test_audit_reused_tickers.py joins the
      # stock-identity family.  It was named by no `run:` step in any workflow, so
      # scripts/audit_reused_tickers.py — the audit that catches a ticker RE-USED for a
      # different company, the failure the identity atlas exists to make visible — had
      # no CI owner while every other identity guard here did.  This job owns the
      # subject: the partition/fingerprint/state-episode/atlas suites above are the
      # identity spine the reuse audit reads.  Appended LAST so a partition or
      # fingerprint regression is the first failure a reader sees rather than the reuse
      # audit failing for a borrowed reason.  It rides this existing step because a step
      # is the masking unit (run_ci_pack.py returns on the first non-zero step) while
      # pytest reports every file inside one step, and adds no job to a manifest at the
      # narrow-diff ceiling.  No dependency widened: probed at RUN time it loads only
      # pandas/numpy/pyarrow/pyyaml, exactly this job's install line.
      - name: stock-identity atlas guards
        run: python -m pytest tests/test_stock_identity_partition.py tests/test_stock_identity_fingerprint.py tests/test_stock_identity_state_episodes.py tests/test_stock_identity_atlas.py tests/test_audit_reused_tickers.py tests/test_stock_identity_replay.py tests/test_stock_identity_replay_leak.py -q
      - name: promotion-stat DISPLAY gate — the published DSR must be the computed one
        # Registering the trial budget (above) is only half the chain: the number the
        # PAGE shows must equal the number the calibrator produced. The BTC Vector card
        # shipped "DSR 0.9945 (n=68)" while calibration.json carried 0.9661 at n=71 —
        # optimistic against the engine's own output, the one direction a promotion stat
        # must never drift. Skips cleanly when data/vector/*.json is absent.
        run: python -m pytest tests/test_signal_lab_vector_display.py -q

  breakdown-control-seed-determinism:
    if: ${{ false }}
    # BD-4/5/6 control sampling derives a per-ticker RNG sub-seed from the ticker.
    # Until 2026-07-26 that derivation was builtin hash(), which Python salts per
    # process (PYTHONHASHSEED) — control draws differed on EVERY run while the frozen
    # Phase-0/0b preregs promise seeded (reproducible) controls and the surrounding
    # comment claimed "deterministic sub-seed". Same defect class as the chart_render
    # SVG ids (#3785), fixed the same way: bd456_control_seed() now uses zlib.crc32.
    # This lane runs the real derivation in fresh subprocesses under PYTHONHASHSEED
    # 0/1/42 asserting identical seeds, and pins golden values so a silent regime
    # change (mask width, XOR operator, encoding) also fails RED. The subprocess
    # imports scripts.research.dump_breakdown_events wholesale (engine.grading +
    # pandas/numpy/pyarrow closure; pyyaml for the repo conftest), so the install
    # line is byte-identical to the trial-budgets/outcome-spine family and the pack
    # runner can share a venv with any same-pack sibling on that line. Closure
    # verified in a clean venv with exactly this install: 2 passed, plus the full
    # event-tape + AVOID-1 stamper suites below: 122 passed (89+33), zero skips,
    # identical under PYTHONHASHSEED 0/1/42.
    # The second step runs the two breakdown suites that were executed by NO job
    # until 2026-07-27 (every pytest invocation in this repo carries an explicit
    # file list — an unnamed suite is never run). Their fixture seeding was
    # de-flaked first (hash(ticker) → zlib.crc32) so wiring them cannot import
    # the same PYTHONHASHSEED salt this lane exists to prevent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: BD-4/5/6 control seeds must be PYTHONHASHSEED-stable (crc32, never hash())
        run: python -m pytest tests/test_breakdown_seed_determinism.py -q
      - name: breakdown event tape + BD-AVOID1 stamper suites
        run: python -m pytest tests/test_breakdown_events.py tests/test_bd_avoid1_stamper.py -q

  outcome-spine:
    if: ${{ false }}
    # W4 (audit #13/#19/#23/#41/#42): the outcome spine + partial-pooling closed loop. The
    # badge-passport ratchet (#41) fails RED if a desk brief renders a conviction badge with no
    # provenance passport; the spine/pooling tests prove the four safety properties (sign-safety,
    # trust-region, cold-start, arming) that gate grades moving deterministic weights.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: desk → spine wiring — stock_desk's per-thesis outcome ledger
        # The append-only scored.jsonl engine.spine._DESK_SCORED reads for this desk. Pins the
        # properties a track record cannot: a published verdict is never re-graded from a
        # re-based price history, an unpriceable lean stays retryable (this desk emits
        # `expired` with none of desk_scorer.GRACE_BD's slack), and each row carries `subject`
        # so 45 leans do not collapse to 8 effective events in engine.pooling.arming.
        run: python -m pytest tests/test_stock_desk.py -q
      - name: badge-passport ratchet (no new conviction badge without a passport)
        run: python3 scripts/check_badge_passport.py site
      - name: spine contract + partial-pooling safety tests
        run: python -m pytest tests/test_spine.py tests/test_pooling.py -q
      - name: promotion gate — per-desk empirical null + Calibration Hub verdicts
        # The bar a desk is promoted against. The placebo sweeps must mirror the evaluator
        # each desk was actually graded by (price plane, falsification boundary, exit bar),
        # or the null describes a different endpoint than the one on the page.
        run: >
          python -m pytest
          tests/test_desk_placebo.py tests/test_calibration_hub.py tests/test_thematic_desk.py -q
      - name: desk → spine writers — the scored ledgers the pooled weights are built from
        # The producer side of spine._DESK_SCORED. The tests above pin what the spine does
        # with a scored.jsonl; these pin that the file says what it claims: grading is
        # idempotent (an already-scored id is never re-graded, and emit dedupes by vintage),
        # a thesis whose check_by has not passed stays OPEN instead of being resolved early,
        # and a soft/non-directional call is unscored — never counted as a hit or a miss.
        # ai_desk_scorer is load-bearing for three registry keys: radar_scorer reuses its
        # eval + aggregation verbatim for both radar and narrative_brain.
        #
        # P1 unrun backfill 2026-08-14: tests/test_desk_thesis_ids.py joins this step.
        # It was named by no `run:` step in any workflow, so the THESIS-ID contract —
        # the identity every row above is keyed by, and the thing that decides whether
        # "already scored" and "dedupe by vintage" can mean anything at all — was dark
        # while the scorers that depend on it were covered.  This job owns the subject
        # (engine/ai_desk.py, engine/ai_desk_scorer.py, engine/stock_desk.py,
        # engine/thematic_desk.py all run here).  Appended LAST so a scorer or ledger
        # regression is the first failure a reader sees rather than the id contract
        # failing for a borrowed reason; it rides this existing step because a step is
        # the masking unit (run_ci_pack.py returns on the first non-zero step) while
        # pytest reports every file inside one step.  No dependency widened: probed at
        # RUN time it loads only pandas/numpy/pyarrow/pyyaml — exactly this job's thin
        # install line — and blocking plotly leaves it 12-passed.
        run: >
          python -m pytest
          tests/test_ai_desk.py tests/test_ai_desk_scorer.py
          tests/test_radar_scorer.py tests/test_narrative_brain.py
          tests/test_demand_ledger.py tests/test_policy_intent_desk.py
          tests/test_desk_thesis_ids.py -q

