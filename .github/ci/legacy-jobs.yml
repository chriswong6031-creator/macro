        # markupsafe: engine.i18n imports Markup at module scope, and the sector-i18n
        # suite below imports engine.i18n for the glossary half. jinja2: that same suite
        # renders the ONE shipped template line that publishes window.WL_SECTOR_ZH, to
        # prove an undefined context still emits `{}` rather than a bare `=`.
        run: pip install pytest pandas numpy pyarrow pyyaml markupsafe jinja2
      - name: risk_core.js math — §7 sanity anchors + structural invariants
