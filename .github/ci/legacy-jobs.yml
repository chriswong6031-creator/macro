  group-pulse:
    # GR0 of the Group Reads program: engine/group_pulse.py, the basket-level
    # participation / direction / arc read plane, plus the two additive extensions
    # it landed in existing organs (engine/coiled.py's washout_ctx_detail and
    # engine/group_flow.py's sign_agreement).
    #
    # Three suites, three different failure classes, deliberately in one job because
    # they guard ONE contract and a partial heal cannot merge a pack anyway:
    #
    #   contract   the frozen group_pulse.v1 shape — a golden object assembled
    #              through the real code path validates, and MUTANTS (unknown key,
    #              a share without its n, an off-ladder arc state, a rewritten
    #              null_disclosure) go red. It also pins washout_ctx_detail as a
    #              pure EXTRACTION: the bool projection must equal the pre-extraction
    #              washout_ctx on every input class, so the additive change to a
    #              graded organ cannot drift.
    #   episodes   the append-only episode ledger: hysteresis, <=2-session gap
    #              joining, 3-inactive closure, persistence math, the nightly lane
    #              gate, and the provisional-bucket law — a closed row is re-emitted
    #              VERBATIM from the store and its recomputed twin discarded, so a
    #              later data revision cannot rewrite a closed episode. It also pins
    #              site/basketdata/episodes.json, the web-readable projection of the
    #              ledger's CLOSED rows (a page cannot read parquet): the published
    #              rows must MATCH the frozen ledger rows and must exclude the
    #              provisional open one.
    #   tripwire   program law R-TIL-3: no fused score / rank / heat number anywhere
    #              in site/basketdata/pulse.json or episodes.json, at any depth, plus
    #              the 1:1 key join the surface indexes blind. It is a SUBSTRING
    #              scan and it carries its own seeded-mutant round trip — a scan that
    #              comes back clean is indistinguishable from a scan that no longer
    #              fires, so the green only means something because the synthetic
    #              insertion goes red.
    #
    # `pyarrow` is in the install line because the episode ledger is a parquet store;
    # `pyyaml` because lib/config.py reads config.yml at import. No `requests`: this
    # plane is an assembler over committed parquet and makes no network call.
    if: ${{ false }}  # executed inside ci-pack — NOT a disabled gate; see the ci-pack job.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: group_pulse contract + episode ledger + no-fused-number tripwire (GR0)
        run: >-
          python -m pytest
          tests/test_group_pulse_contract.py
          tests/test_group_pulse_episodes.py
          tests/test_group_pulse_tripwire.py -q -rs

  group-read-surface:
    # GR1 of the Group Reads program: the USER-FACING basket read surfaces —
    # templates/basket_detail.html.j2's READ band (stance line, four glance tiles, the
    # arc rail, "what we're watching", the episode and earnings sections) and the
    # group-pulse column on the Sector Intelligence board.
    #
    # The suite EXECUTES the shipped JS under node rather than mirroring it in Python: a
    # Python re-implementation of the stance matrix would keep passing while the copy
    # that ships drifted away from it (the mirrored-guard-is-vacuous trap). `setup-node`
    # is therefore load-bearing, not decoration — the suite skips itself without node on
    # PATH, and a silent skip reads exactly like a pass.
    #
    # What goes red here:
    #   stance matrix   any (participation x sign x state_change x arc) combination that
    #                   emits an untranslated slug, an internal state name, "igniting",
    #                   "validated", refutation vocabulary, a missing or English-echoed
    #                   ZH string, a read over the Tier-1 word budget, a directional
    #                   act/buy stance (participation carries no directional authority,
    #                   DNR:KILL-PSS-SR3-PARTICIPATION), or a "moving together" claim
    #                   below the movers floor.
    #   earnings traps  the two group_earnings_pulse.v1 shapes that read plausibly and
    #                   are wrong: `season.next` is a preview CAPPED at 6, so the count
    #                   must come from n_upcoming_14d; and n_beat + n_miss can sit far
    #                   below n_members, so n_no_data is shown rather than divided away
    #                   into a survivor beat rate.
    #   null states     all three artifacts land only after the first post-merge nightly.
    #                   Every panel must render plain-word bilingual copy when its file
    #                   or key is absent, and every fetch must be fail-silent.
    #   surface law     the Oracle P8 null is disclosed verbatim in both languages; no
    #                   score/rank/heat number anywhere (R-TIL-3 / G0-2); the board's
    #                   alternative ordering is a disclosed rule over the artifact's own
    #                   named legs, printed on the surface it orders, with the existing
    #                   default sort untouched; and the desk's re-order resets the
    #                   show-more row cap it would otherwise leave pointing at the old
    #                   card positions.
    #
    # The surface probes import engine/group_pulse.py to exercise its published
    # denominator/arc contract, so NumPy and pandas are real import dependencies.
    # No pyarrow or network — it otherwise reads two templates, one plain-copy JS
    # asset, and shells node.
    if: ${{ false }}  # executed inside ci-pack — NOT a disabled gate; see the ci-pack job.
    timeout-minutes: 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install minimal deps
        run: pip install pytest numpy pandas pyyaml
      - name: basket read band + board group-pulse column (GR1)
        run: python -m pytest tests/test_group_read_surface.py -q -rs

  group-earnings-pulse:
    # Group Reads W-GR2: engine/group_earnings.py -> site/basketdata/earnings_pulse.json,
    # the per-basket earnings layer (season clock, beat rollup, guidance band, revision
    # breadth, post-report drift, earnings sympathy) plus its append-only sympathy ledger.
    #
    # Both suites run against a SYNTHETIC data tree in tmp_path, so they are deterministic,
    # offline, and independent of how full the Nasdaq surprise drip happens to be on the
    # day. What they pin, in order of what would hurt most if it broke:
    #
    #   * the frozen group_earnings_pulse.v1 key set. The validator lives in the test, not
    #     the engine, and is itself mutation-checked: nine deliberate mutants (unknown key
    #     at three nesting depths, four dropped `n` fields, a dropped authority, a malformed
    #     `next` entry) must each make it go red, so a validator that quietly stopped
    #     validating fails here rather than shipping a silent contract break to the GR1
    #     surface builder.
    #   * every floor refusing with a null instead of a survivor-only number. The `thin`
    #     basket carries three members with perfectly good data — a real surprise, a real
    #     analyst reading, a real post-report price path — and must publish nothing but
    #     nulls, because three is below MIN_REPORTED / MIN_COVERED / MIN_DRIFT_N. A
    #     3-of-3 beat share is exactly the number the floors exist to suppress.
    #   * the resolution-conditioned-denominator law: n_beat + n_miss + n_inline +
    #     n_no_data == n_members in every basket, refused or not.
    #   * engine.guidance_gap's >=2-distinct-filers law surviving the generalization from
    #     curated themes to arbitrary basket rosters (one filer -> band null), and the
    #     floor being IMPORTED rather than re-declared so the two can never drift.
    #   * the sympathy ratio, on a fixture where the answer is arithmetic. That fixture is
    #     deliberately MAJORITY report days: the median is robust, so a contaminated
    #     baseline built from a window with only a few report days still reads correct and
    #     the bug hides. At 24 report days against 16 quiet ones a baseline that forgets to
    #     exclude them collapses the ratio from 3.0 to 1.0 — verified by mutation.
    #   * the ledger's immutability: re-advancing identical inputs is a byte-for-byte no-op,
    #     a restated value for an existing key is refused rather than applied, and the
    #     nightly lane gate (engine.ledger_lane) is imported, not a local COLLECT_LANE read.
    #
    # `requests` is in the install line because engine/group_earnings.py's Item-2.02 check
    # prefers collectors.edgar_earnings_8k.has_item_202 and falls back to a local copy when
    # that module (which imports requests at module scope) is unavailable. With requests
    # installed the equivalence test compares the two definitions for real; without it the
    # test would skip and the fallback could drift unnoticed.
    if: ${{ false }}  # executed inside ci-pack — NOT a disabled gate; see the ci-pack job.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml requests
      - name: group earnings pulse contract, floors and sympathy (W-GR2)
        run: >-
          python -m pytest
          tests/test_group_earnings_contract.py
          tests/test_group_earnings_sympathy.py -q -rs

