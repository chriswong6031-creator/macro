    #                             zero-decimal), dual-language bodies, the fail-soft
    #                             contract (an exploding composer never breaks the
    #                             entitlement write), and the trial-ending sweeper's window,
    #                             per-period idem key, restart safety and second-run silence.
    #   test_account_prefs.py   — POST /api/account/prefs: bearer-only identity (a
    #                             client-sent user id is ignored), validation, the
    #                             user_metadata MERGE, the email_prefs lang mirror, and the
    #                             honest partial/total failure statuses.
    #   test_billing_webhook.py — the spine suite that guards _handle_event, which W3 now
    #                             hooks. It matched NO workflow before this job (it needs
    #                             the pinned Stripe SDK, which prelaunch-hardening does not
    #                             install), so the change most able to break it could not
    #                             turn it red — the #3509 failure mode exactly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stripe is PINNED to app/requirements.txt's range on purpose. The webhook suite
      # feeds hand-built event payloads to stripe.Webhook.construct_event, and 13+ made
      # that constructor strict about the envelope (`object: "event"`), so an unpinned
      # install turns three green tests red against code the droplet never runs. CI must
      # test the SDK production actually has.
      - name: install deps
        run: pip install pytest fastapi pydantic pandas numpy pyarrow pyyaml requests "stripe>=11,<13"
      - name: billing + lifecycle email tests (app/billing_emails.py)
        run: python -m pytest tests/test_billing_emails.py -v
      - name: account preference tests (app/account_prefs.py)
        run: python -m pytest tests/test_account_prefs.py -v
      - name: billing webhook spine regression (app/billing.py::_handle_event)
        run: python -m pytest tests/test_billing_webhook.py -v

