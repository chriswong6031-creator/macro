      # ownership_crowding, fund_intelligence, fund_followability, insider_intel,
      # filing_transition, ownership_event_wire) are that builder's inputs. Its
      # regulatory-disclosure sibling test_finra_short_interest_pit.py already runs in
      # the sweep below. NO lane owned this subject before today — the desk is not a
      # census suite looking for the nearest unrun-* lane, it is a producer whose lane
      # is this one. Deliberately NOT split engine-side/surface-side across two jobs:
      # a builder whose engine contract and whose published page disagree is exactly
      # the break that survives a split, and the suites cost 5.7s together.
      #
      # ORDERED BEFORE the ~40-file sweep for the reason stated one step up:
      # run_ci_pack.py abandons a job's remaining steps at the first non-zero exit, so
      # a step behind that sweep would be present rather than wired.
      #
      # Adds NO wheel and NO job: jinja2 (census surface renders templates/), pandas
      # and pytest are already on the install line above; nothing else is imported at
      # module scope. Hermetic — every site/ path the surface suite writes is under
      # pytest's tmp_path, and it reads only committed templates/, so its verdict
      # cannot move with the market. Measured on a full checkout: 24 + 51 + 10 = 85
      # tests in 5.7s, inside this job's 8-minute budget. The census-surface count
      # becomes 15 when #5607 (frozen-census freeze annotation) lands; that PR touches
      # only the builder and its suite, so it inherits this wiring with no edit here.
      - name: 13F smart-money desk — engine contracts, nightly builder, census surface
