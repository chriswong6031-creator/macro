  tier-gate:
    if: ${{ false }}
    # Revenue + serving boundary. A paid desk ships as a free preview shell at the
    # page URL plus a separate /premiumdata/ payload that app/paywall.py gates as
    # Insider+ ahead of the site-wide PAYWALL_ENABLED switch
    # (docs/TIER_PREVIEW_PATTERN.md). The regressions this catches: the shell
    # quietly regaining the paid rows (the split IS the gate — a client-side hide
    # is not), /premiumdata/ dropping out of premium.enforced_early (which would
    # re-open the desk to every registered account), the edge's public exclusion
    # list drifting away from config/site_access.yml (which is how a generated
    # artifact silently becomes anonymously fetchable — #3418 drifted it and the
    # boundary test sat red ~17h unwatched because no workflow named it), and the
    # registration wall itself regressing.
    #
    # The serving boundary has three enforcement halves and CI now covers all of
    # them: the Caddy public list (site_access_boundary), the paid stage
    # (paywall/api_paywall), and the anonymous stage (regwall). The regwall pair
    # was the last one running in no workflow — and it is the expensive one to get
    # wrong in the quiet direction: #3387 had to reopen /stocks/ /tools/ /learn/
    # /blog/ after a wall with no crawler exception 302'd Googlebot off 1,665
    # sitemap URLs. Hermetic — no network, no engine data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        # app.main mounts app.market_memory, whose authenticated stock-data
        # reader imports requests at module scope.  Keep the serving-boundary
        # lane's isolated environment closed over that production import.
        # ETF board synthesis imports the rotation constants from etf_pulse,
        # which imports numpy and pandas at module scope.  Keep this environment
        # closed over the real production import graph.
        run: pip install pytest pyyaml jinja2 fastapi httpx requests numpy pandas
      - name: tier-preview split contract (no paid row in the free shell)
        run: python -m pytest tests/test_special_situations_gate.py tests/test_china_special_situations_gate.py tests/test_etfs_gate.py tests/test_us_board_gate.py -q
      - name: public dashboard preview-tier contracts (anon shell allowlist + controller caps)
        # Found unwired by the 2026-08-02 adversarial review of #4331: the suite
        # pins the public/anon split for the dashboard shells (site_access.yml
        # allowlist, tier_preview.js 1/3/full caps, gate wiring) and ran in NO
        # workflow. tests/test_site_access_boundary.py derives this job's inputs
        # into ci.yml's paths filter, so this line also makes the suite reach.
        run: python -m pytest tests/test_public_dashboard_preview.py -q
      - name: paywall fail-closed contract (incl. enforced-early payload lane)
        run: python -m pytest tests/test_paywall.py tests/test_api_paywall.py tests/test_auth_cache_outage.py -q
      - name: Pro-only host gate (bot.mastermind-x.com -> /api/paywall/check_pro)
        run: python -m pytest tests/test_paywall_pro_gate.py -q
      - name: static serving boundary (Caddy <-> site_access.yml, no leaked artifacts)
        run: python -m pytest tests/test_site_access_boundary.py -q
      - name: delivery-plane census (exact families, alternate origins, consumers, defaults)
        run: python -m pytest tests/test_r2_delivery_plane_classification.py -q
      - name: registration wall (anonymous stage + /factordata /labdata JSON gate)
        run: python -m pytest tests/test_regwall.py tests/test_regwall_json_gate.py -q
      # #4409 shipped the member Earnings Wire API suite named only in
      # unrun-publish-ops, whose 21-job venv line has no fastapi/httpx — so the
      # auth-gate/private-header tests skipped in every job that named them
      # (check_skip_only_suites, same class as the boto3/publish-r2 case above).
      # This job's install line already provides both; verified in a clean venv
      # with exactly `pytest pyyaml jinja2 fastapi httpx`: 10 passed.
      - name: member Earnings Wire API transport (auth gate + private headers)
        run: python -m pytest tests/test_earnings_api.py -q

