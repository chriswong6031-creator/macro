  chart-render:
    if: ${{ false }}
    # chart_render SVG suites — the renderer behind every marketing card and the
    # brain gateway's inline chat chart, and (since #3551) the SVG that is
    # rasterized and posted to the live MastermindX X account.
    #
    # Added 2026-07-26. None of these three suites was referenced by ANY workflow,
    # so test_chart_render_inline sat RED on main from #3088 (which moved the MACD
    # stroke off raw material-blue and left the test's colour probe behind) until
    # it was reported by hand — roughly four months of a guard that could not fail
    # anything. test_marketing_card_parity is #3551's own incident suite pinning
    # which renderer feeds the posted PNG; unwired, that incident could silently
    # recur.
    #
    # Deliberately its OWN job rather than a step on marketing-engine: that job is
    # currently red on main for an unrelated reason (test_marketing_content —
    # `account receipts has empty queue`), and folding these in would mask a
    # chart-render regression behind a failure that has nothing to do with charts.
    #
    # Deps: pytest + pyyaml. chart_render's own top-level imports are stdlib
    # (math/zlib/pathlib/typing) — pandas, PIL and headless Chrome are all lazy,
    # and the tests needing them importorskip cleanly — but the repo-wide
    # conftest imports yaml in EVERY pytest run, so pyyaml is not optional
    # (a pytest-only env dies at collection). Matching marketing-engine's
    # dependency set also lets the pack runner reuse its venv. Verified green
    # against a minimal pytest+pyyaml env: 35 passed, 6 skipped.
    #
    # 2026-07-26: "the tests needing them importorskip cleanly" was NOT true when
    # this lane was wired — test_chart_render_inline's two load_ohlcv tests did a
    # bare `import pandas`, so the lane went red on main the same day with
    # ModuleNotFoundError, not a skip. Fixed by making those two importorskip
    # pandas AND pyarrow (.to_parquet needs an engine). Keep the deps minimal and
    # the tests skip-clean rather than growing this list: a lane that installs the
    # world stops being the cheap guard it was added to be.
    #
    # 2026-07-27: the minimal env is kept, but its REASON is restated, because
    # "cheap" stopped being the reason the day #3754 packed the jobs. The pack
    # runner reuses one venv per byte-identical install line, so joining the fat
    # `pytest pandas numpy pyarrow pyyaml` group would have cost zero extra
    # provisioning — cost is no longer an argument for or against either set.
    # What this lane actually buys is the LAZY-IMPORT CONTRACT: chart_render is
    # imported on the brain gateway's request path, and a future top-level
    # `import pandas` in the renderer (or in one of these suites) turns this lane
    # red at collection. That is worth a job on its own and is why it stays thin.
    #
    # What a thin lane CANNOT do is execute the tests that need those modules.
    # Six of the 41 tests here skip in this env — the two load_ohlcv tests in
    # test_chart_render_inline, three in test_marketing_card_parity, one in
    # test_chart_render_m2 (engine.indicators_m2 needs numpy) — and until
    # 2026-07-27 no other job in any workflow named these files, so the skip was
    # total absence of coverage rather than reduced coverage. chart-render-data
    # below runs the SAME three files with those modules present. The lanes are
    # deliberately paired, not alternatives: thin proves the imports stay lazy,
    # fat proves the code behind them is correct. The ~6s of overlap is the price.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install pytest pyyaml
      - name: chart_render SVG suites
        run: python -m pytest tests/test_chart_render_inline.py tests/test_chart_render_m2.py tests/test_chart_render_grammar.py tests/test_marketing_card_parity.py -q

  chart-render-data:
    if: ${{ false }}
    # The data-dependent half of the chart-render suites (see the job above).
    #
    # Added 2026-07-27. #3722 shipped load_ohlcv's crypto source resolution
    # (data/yahoo/<SYM>-USD.parquet + close-to-close H/L synthesis, the fix for
    # "analyse ETH → 没有可用的日线图表数据") with two regression tests. Those tests
    # imported pandas and wrote parquet; chart-render installs pytest+pyyaml, so
    # they errored the lane red, and #3738 made them importorskip pandas/pyarrow.
    # That was the right fix for the red — but chart-render was the ONLY job in
    # ANY workflow naming these files, so the importorskip did not reduce the
    # coverage to a subset, it removed it outright: #3722's data-source
    # resolution shipped with a guard that could not execute anywhere.
    #
    # Same family as #3703 — an `importorskip` added to clear a red leaves main
    # green AND weaker, and nothing in CI notices, because every existing guard
    # asks "is this suite named by a job" (scripts/audit_unrun_tests.py) and
    # never "does the job that names it install what it needs to run".
    #
    # Deps are byte-identical to the 21-job `pytest pandas numpy pyarrow pyyaml`
    # group (trial-budgets, outcome-spine, site-gate, …), which run_ci_pack.py
    # keys its venv reuse on, so this job provisions NO new environment: both
    # packs already build that venv for jobs they already carry.
    #
    # The import probe is the lane's own tripwire. If a future dependency edit
    # drops pandas or pyarrow from this install line, the six tests would go back
    # to skipping silently and the lane would stay green while guarding nothing —
    # exactly the failure this job exists to close. The probe makes that red.
    # -rs prints every skip reason, so a NEW skip is visible in the log rather
    # than hidden behind a bare pass count.
    #
    # Verified locally in a clean venv with this exact install line:
    #   pytest pyyaml                      → 35 passed, 6 skipped
    #   pytest pandas numpy pyarrow pyyaml → 41 passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: prove the data-dependent modules are present
        run: python -c "import pandas, pyarrow, numpy"
      - name: chart_render SVG suites (data-dependent tests execute here)
        run: python -m pytest tests/test_chart_render_inline.py tests/test_chart_render_m2.py tests/test_chart_render_grammar.py tests/test_marketing_card_parity.py -q -rs

  portfolio-ctx:
    if: ${{ false }}
    # Portfolio-Aware Intelligence W0 + W1 (charter:
    # research/PORTFOLIO_BRIEF_MASTERPLAN_BY_FABLE.md §6). Two unit suites:
    #   * test_build_portfolio_ctx — the portfolio_ctx.v1 bake (build_ctx joins/omission/
    #     verbatim-vocab/congress-window on synthetic dicts + a main() integration smoke
    #     against the real committed sources; reads congress.parquet → pandas+pyarrow).
    #   * test_portfolio_brief — the W1 deterministic brief composer + GET
    #     /api/portfolio/brief endpoint smoke. The composer tests are dependency-free; the
    #     endpoint smoke uses the FastAPI TestClient (fastapi+httpx+pydantic) and
    #     pytest.importorskip's away cleanly if those are absent.
    # Whitelisted so neither rots red on main after nightly first advances the artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        # pyyaml is load-bearing here, not incidental: the theme_lanes side-write reads
        # config/theme_crosswalk.yml for the basket-keyed lane projection. Without it
        # build_state_of_themes.load_primary_basket_ids fail-opens to {} and the
        # projection silently collapses to empty (PR #4300 shipped red on exactly that).
        # The endpoint suite imports app.main, whose eagerly mounted Market Memory
        # router imports requests at module scope.
        run: pip install pytest pandas pyarrow jinja2 fastapi httpx pydantic pyyaml requests
      - name: portfolio-ctx bake unit tests
        run: python -m pytest tests/test_build_portfolio_ctx.py tests/test_portfolio_ctx_chains.py -q
      - name: portfolio-brief composer + endpoint tests
        run: python -m pytest tests/test_portfolio_brief.py -q
      - name: retention spine — change history, digest composer, changes endpoint (W6)
        # engine/portfolio_changes (state digest + diff) and engine/portfolio_digest (the
        # change-triggered email COMPOSER — the send path is deliberately unwired, and a
        # test in here asserts the module imports no mailer so no build can send). Same
        # install set as the brief suite above; the file pins that set from the AST.
        run: python -m pytest tests/test_portfolio_changes.py -q
      - name: theme_lanes side-write contract (source of truth for the Portfolio brief)
        # The theme_lanes.v1 side-artifact + the page-byte-identity invariant that keep
        # the State-of-Themes page and the Portfolio brief's lanes in lockstep. Only the
        # jinja-based subset (no node / no heavy repo state) is selected here.
        run: python -m pytest tests/test_state_of_themes.py -q -k "theme_lanes or byte_identical"

  options-estate-guards:
    if: ${{ false }}  # executed inside ci-pack; keep the legacy status definition runner-free
    # OEU M-FIX wiring (2026-07-25): the flow-leaders / market-structure /
    # options-screener engine+builder suites (plus the neural-web support-map
    # suite, surfaced unwired by the same audit) were run by ZERO GitHub
    # workflows — #3496's regression pins (flow_leaders washout-flip truth,
    # market_structure week_map emission, options_screener denominators) could
    # silently rot without them. All seven suites are network-free and
    # tmp-isolated (MM_DATA_GUARD-clean as one batch: 309 tests, no data/ or
    # site/ writes). The support-map smoke reads only committed inputs
    # (config/synapse.yml + data/neuralweb/confluence_graph.json), so its
    # census bands move only via PRs that themselves trigger this job.
    #
    # CURATED SCOPE (2026-08-14 wave 3). `scope: exclusive` makes the paths
    # below REPLACE inference instead of being unioned under it, so the opaque
    # fallback tier this job used to carry — whole-tree `engine/**`,
    # `scripts/**`, `site/**`, `templates/**`, `tools/**` claims smeared out of
    # a subprocess or traversal deep in its closure — stops selecting it. Every
    # pattern here was generated from the job's OWN import closure (100 files
    # across eleven directories) and audited for zero misses: no file this job
    # demonstrably reads lost its owner.
    #
    # NOTE for anyone re-deriving this in a SPARSE worktree: `site` is in
    # `audit_unrun_tests.FIRST_PARTY`, so site/ path literals ARE closure
    # members — but every literal is admitted through `(ROOT / rel).is_file()`,
    # which answers False for an omitted tree. Derived sparse, this closure is
    # 85 files and silently loses all 15 site/ members; derived against a full
    # checkout it is 100. `data/` is genuinely absent from the closure either
    # way (the builder excludes it from LITERAL_DIRS by policy), which is why
    # the `data/**` row below is hand-declared rather than derived.
    #
    # This job was named in the wave-2 note in tests/test_ci_pack.py as a rider
    # that would "stay inferred" alongside dataos-identity-seams. That call is
    # superseded here, and for the opposite reason to the one that spared
    # dataos-identity-seams: an `engine/`-heavy closure only degenerates to
    # fallback breadth when it needs `engine/**`. This one does not. Its 35
    # engine files are all TOP-LEVEL modules plus four whole subpackages, so
    # `engine/*` + four `engine/<pkg>/**` covers the closure exactly while
    # leaving every other engine subpackage — `engine/prophet/**` among them —
    # outside the declaration. `scripts/` is enumerated file-by-file for the
    # same reason: `scripts/*` would re-acquire `scripts/build_free_content.py`,
    # one of the two probes this curation exists to release.
    #
    # Measured on the pre-curation manifest (193 jobs), this job matched all
    # THREE ratchet probes on the fallback tier and none on the owned tier:
    # templates/index.html, scripts/build_free_content.py, and
    # engine/prophet/plan_book.py each drop it, -1 job / -13 weight-seconds per
    # probe. The `site/...` and `data/**` rows are NOT smear carried forward:
    # engine/neuralweb/*, engine/pick_lab/registry.py, engine/signal_quality.py
    # and config/synapse.yml name those artifact trees in literal reads. The
    # site/ rows are DERIVED closure members (see the sparse note above); the
    # two top-level files are enumerated exactly rather than folded into a
    # `site/*` glob, matching how flow-surface declares site/coming-soon.html
    # and site/master_brief.json. `data/**` is hand-declared: the builder
    # excludes `data` from LITERAL_DIRS by policy, so no data path can ever
    # appear in the derived tier, and the support-map smoke's committed input
    # (data/neuralweb/confluence_graph.json) would otherwise lose its owner.
    scope: exclusive
    paths:
      - "config/**"
      - "data/**"
      - "engine/*"
      - "engine/government_revenue/**"
      - "engine/neuralweb/**"
      - "engine/pick_lab/**"
      - "engine/seasonality/**"
      - "lib/*"
      - "scripts/__init__.py"
      - "scripts/build_flow_leaders.py"
      - "scripts/build_market_structure.py"
      - "scripts/build_market_structure_page.py"
      - "scripts/build_options_command.py"
      - "scripts/build_options_screener.py"
      - "scripts/validate_gex.py"
      - "site/altdata/**"
      - "site/basketdata/**"
      - "site/chinastatedata/**"
      - "site/factordata/**"
      - "site/flow_desk.json"
      - "site/flowleaders/**"
      - "site/intelligence/**"
      - "site/leaderradar/**"
      - "site/neuralwebdata/**"
      - "site/options.html"
      - "templates/options.html.j2"
      - "tests/test_build_flow_leaders.py"
      - "tests/test_build_market_structure_page.py"
      - "tests/test_build_options_command.py"
      - "tests/test_build_options_screener.py"
      - "tests/test_flow_leaders.py"
      - "tests/test_market_structure.py"
      - "tests/test_market_structure_nw.py"
      - "tests/test_options_gap_discipline.py"
      - "tests/test_support_map.py"
      - "tools/index.html"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
