  marketing-social-publisher:
    if: ${{ false }}
    # D02 W1 live social publisher: tweet_length/validate_postable, the Buffer
    # adapter (all HTTP mocked via _transport), and the live runner (kill-switch
    # + --live gating, approved→posting→posted, idempotency, no-double-post).
    # test_marketing_outbox is co-run because W1 extended its status machine.
    # DARK BY DEFAULT: zero live network — every transport path is mocked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        # numpy + pandas + pyarrow joined 2026-08-06. #4646 ("tag the theme's own
        # ticker, and name the most-watched member") added nine theme-proxy tests
        # to test_marketing_publish_time_content whose fixture builds correlated
        # bars — `rng.normal` + `pd.DataFrame(...).to_parquet(...)` under the tree
        # theme_proxy.cohesion reads — so this lane is NOT pandas-free any more.
        # The pack runner gives each dependency group a CLEAN `python -m venv`, so
        # the closure has to be complete or the red just moves: measured on main,
        # `pytest pyyaml` → 9 red on numpy, +numpy → 9 red on pandas, +pandas → 23
        # red because the 14 test_marketing_weekend_levels tests that used to
        # importorskip now WAKE UP and want pyarrow, +pyarrow → 450 pass, 0 skip.
        # Do not trim this back to numpy alone, and do not importorskip the nine —
        # this pack is the only job that runs #4646's guard suite.
        run: pip install pytest pyyaml numpy pandas pyarrow
      - name: social publisher + outbox + wiring-layer unit tests
        # test_marketing_live_verify is co-run: the post-time tape gate ships
        # inside the publisher loop (its earnings guard is fail-soft).
        # test_marketing_metrics_poll: the per-post metrics poller + admin join +
        # publisher media-attach gate (Buffer transport mocked).
        # test_marketing_weekend_levels joins (2026-07-27): it was named by NO
        # run step anywhere (unrun-suite rot) while its lane shipped the $AVGO
        # "POC held" post. Covers the cited-level chart contract + the floor
        # copy's language bar; its pandas tests used to importorskip here and now
        # run for real on the deps above.
        # test_marketing_publish_time_read joins 2026-07-28 (XG-W1). It was named
        # by NO job — an unrun suite guarding the daily-read lane's account
        # eligibility. XG-W1 changed exactly that code path (per-call lanes now
        # resolve liveness through the accounts model and honour a lane
        # allowlist), and the suite went red locally on the first run: two of its
        # multi-account tests were asserting behaviour the fix deliberately
        # narrows. Unrun, that would have been a silent rot. Same deps as the
        # rest of this lane, verified green.
        # test_marketing_metrics_poll_quota joins 2026-08-11 (#5306 follow-up).
        # It shipped WITH the 429 fix and was baselined unrun in the same breath,
        # so the poller's own two bounds — stop-on-first-429 and cap-the-run —
        # had no job at all, and #5306 had to duplicate three coarser pins into
        # test_marketing_metrics_poll.py to get ANY guard that executes. Both
        # halves now run in one step, next to the sibling they were split from.
        # Same deps, zero network: the Buffer publisher is a counting stub and
        # every write goes to tmp_path.
        # test_marketing_market_clock joins (2026-08-11): the publish-time
        # clock + lead-fact fan-out gate suite sat in the unrun baseline, and
        # voice v5 (#5291) rotted seven of its fixtures unseen — first-person
        # tails, the register v5 retired, not the gates under test. It drives
        # scripts/marketing_publisher.py end to end, so it lives with the
        # publisher lane it exercises.
        run: python -m pytest tests/test_marketing_social_publisher.py tests/test_marketing_outbox.py tests/test_marketing_outbox_single_composition.py tests/test_marketing_publisher_autoapprove.py tests/test_marketing_live_verify.py tests/test_marketing_publish_time_content.py tests/test_marketing_publish_time_read.py tests/test_marketing_outbox_garbage.py tests/test_marketing_metrics_poll.py tests/test_marketing_metrics_poll_quota.py tests/test_marketing_weekend_levels.py tests/test_marketing_market_clock.py -q
      - name: stale backlog quarantine + optional publish-time phrase fallback
        run: python -m pytest tests/test_marketing_stale_purge.py tests/test_publish_time_llm_phrase.py -q
      - name: liveness tripwire rule engine (the green-and-dark alarm)
        # 2026-08-06→08-10: Buffer 429'd, the kill-switch went to 0, Buffer was
        # fixed and nobody re-armed — five days of GREEN sweeps posting nothing.
        # scripts/marketing_liveness_tripwire.py is the observer for that shape,
        # so it is named by a run step from the day it lands: an alarm nobody
        # tests is the same silence one layer up. stdlib + pyyaml, tmp_path only.
        run: python -m pytest tests/test_marketing_liveness_tripwire.py -q
      - name: unrun-baseline joins 2026-08-11 — approval desk, card pixels, wire expiry
        # Batch join from the unrun_test_baseline triage that followed #5379's
        # voice-v5 rot discovery (test_marketing_market_clock): all suites below
