  intelligence-registry:
    if: ${{ false }}
    # Eval OS T1 — the Mastermind engine registry. Two laws, one script, both WARN:
    # governance.intelligence_registry_integrity (partition / attribution / overlay
    # allowlist — invariants of the derivation) and epistemics.engine_authority_evidence
    # (pre-existing corpus conditions). --strict is deliberately NOT passed: it reds on
    # ~200 pre-existing content findings, which is a scheduled red on arrival.
    #
    # ISOLATED, NOT FOLDED INTO neural-web. run_ci_pack.py::_run_job RETURNS on the first
    # non-zero step, so inside a shared job there is no safe position: T1 FIRST masks the
    # nine sibling suites behind it, and T1 LAST goes dark behind any of them (#4779 — an
    # absence of red is not a pass). A step-level `if: always()` cannot fix it either;
    # run_ci_pack.py's ALLOWED_STEP_KEYS is {name, run, uses, with}, so `if:` on a step is
    # a hard manifest error. CEO ruling 2026-08-14 authorises the separate job: 188 jobs
    # were measured for consolidation, zero exact-duplicate signatures were found, and no
    # safe merge existed — so the pack rebalance a new job causes is the cheaper of the two
    # costs, and it is paid once.
    #
    # THE REGISTRY IS A DERIVED ON-DEMAND VIEW — nothing is committed, there is no
    # `--check` equality mode and no drift comparison, so this job cannot be reddened by a
    # nightly claim append or by a sibling PR editing config/synapse.yml. Two earlier
    # rounds pinned a generated artifact by equality (against data/qledger/claims.jsonl,
    # then against config/synapse.yml — 70 and 69 commits in the trailing 14 days, measured
    # on full history 2026-08-14 after the clone was unshallowed) and both were scheduled
    # fleet-wide reds. Do not re-add a regeneration lane or a committed file.
    #
    # CURATED SCOPE (2026-08-14 fleet heal). `scope: exclusive` makes the paths
    # below REPLACE inference. This job's inferred fallback tier claimed
    # whole-tree `templates/**` (and docs/research/site) from a subprocess or
    # traversal inside the engine import closure. Measured after #5587: that
    # smear was the +1 that pushed templates/index.html from the pinned 128
    # jobs to 129. The job does not read the landing page; it only
    # fallback-matched it. The declaration is the owned import closure,
    # compacted to directory globs. Do not add templates/**.
    #
    # `scripts/` IS ENUMERATED, NOT GLOBBED (2026-08-14 follow-up). The first
    # curation shipped a whole-directory `scripts/*`, which re-created inside
    # the CURATED tier the very behaviour `scope: exclusive` exists to end: a
    # directory glob makes EVERY ordinary code PR touching ANY script select
    # this job, on no evidence that the job reads it. Measured the same day —
    # `scripts/build_free_content.py` is NOT in this job's import closure, yet
    # `scripts/*` selected it, and that smear alone put the build_free_content
    # probe at 127 jobs against the then-126 ceiling in
    # tests/test_ci_pack.py::test_exclusive_curation_narrows_ordinary_code_prs.
    # A sibling heal re-based that ceiling elsewhere, so this is an
    # OPTIMIZATION rather than a red — but the smear was structural and is what
    # the enumeration removes. The 39 entries below ARE the job's own scripts/
    # import closure, re-derived on this commit via
    # tests/test_ci_pack.py::_inferred_as_if_not_exclusive.
    #
    # WIDENING IS THE SAFE DIRECTION. Exclusivity SKIPS inference, so a closure
    # file with no matching pattern is a job that stops running when its own
    # dependency changes and reports green forever. Do not hand-prune this
    # list: when a new import lands,
    # test_curated_exclusive_scopes_cover_their_own_import_closure names the
    # exact uncovered file — add it here.
    #
    # `collectors/` AND `lib/` ARE ENUMERATED, NOT GLOBBED (2026-08-15
    # follow-up to #5685). Re-derived on this commit via
    # infer_job_scopes([replace(job, exclusive=False)]): collectors/* was
    # 237 tracked / 33 concrete; lib/* was 33 / 19. Same shape `scripts/*`
    # was — small enough to enumerate, and mostly smear. The 33 + 19
    # entries below ARE this job's own collectors/ and lib/ import closure.
    #
    # THE REMAINING GLOBS ARE EARNED and stay globbed: engine/** (enumeration
    # would rot on every engine import), config/** (the registry's declared
    # input surface — a config edit SHOULD select this job), and the
    # data/** / site/** / tests/** trees this job actually owns. Do not
    # narrow those.
    scope: exclusive
    paths:
      # Eval OS T4 additions. app/: reached through scripts/freshness_sentinel.py, which
      # T4's reader-plane adapter imports for the surface table rather than copying it;
      # the sentinel's alert path imports app.mailer lazily and the closure walker sees
      # it. Named files, not `app/**` — the job touches these two and nothing else under
      # app/. lib/dataos/: the WHOLE package, enumerated per the 2026-08-15 lib idiom —
      # lib/dataos/__init__.py re-exports every sibling, so importing the temporal model
      # executes all seven files and all seven are genuinely in this job's closure.
      - "app/__init__.py"
      - "app/mailer.py"
      - "lib/dataos/__init__.py"
      - "lib/dataos/identity.py"
      - "lib/dataos/nulls.py"
