  attested-history-guards:
    if: ${{ false }}
    # Wave 3B-B4 / attested-history cluster, split out of `engine-render-guards`
    # 2026-08-14. These four steps are one dependency story and one security story:
    # they are the ONLY suites in the old job that needed boto3, and they pin the
    # offline materialization seams, the read-only operator foundation, the dedicated
    # serving boundary, and the controlled AAPL pilot.
    #
    # Every one of them used to carry a comment explaining that it was ordered AHEAD
    # of the ~100-file sweep so an unrelated red render guard could not leave it
    # unexecuted (run_ci_pack abandons a job's remaining steps on the first non-zero
    # exit). That workaround is retired: the sweep is a different job now, with a
    # different exit status, so it cannot leave these dark at any position. The
    # protection those comments were reaching for is now structural.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        # boto3 (which brings botocore) is the reason this lane exists as its own
        # dependency group: two tests in the Wave 0A serving boundary below exercise
        # the production boto3 client factory and the real receipt reader, and without
        # the module they importorskip — i.e. they execute in NO job, which
        # check_skip_only_suites.py correctly rejects. #4806 added boto3 to the old
        # single line for exactly these tests.
        # fastapi + httpx: the serving-boundary suite importorskips both and drives
        # FastAPI's TestClient. jsonschema: the read-only operator suite imports
        # Draft202012Validator at module level. pandas/numpy/pyyaml/requests come from
        # the import-time first-party closure of these ten suites. pyarrow is a real
        # runtime dependency of B4D-A: query_snapshots imports it lazily while encoding
        # the deterministic parquet cells exercised by the materializer suite, so an
        # import-only dependency census does not see it.
        # No jinja2/plotly/pillow/beautifulsoup4 here: no suite in this lane imports
        # them and none is needed at runtime.
        run: pip install pytest pandas numpy pyarrow pyyaml requests fastapi httpx jsonschema boto3
      # Wave 3B-B4D-A adds the three offline seams that turn pinned SEC source objects
      # into filing packages, Company Facts ledgers, and deterministic B4 binding plans
      # (wired 2026-08-02).
      - name: B4D-A offline materialization foundation
        run: >-
          python -m pytest
          tests/test_sec_document_spine.py
          tests/test_fundamental_forensics_attestation.py
          tests/test_fundamental_forensics_filing_package_materializer.py
          tests/test_fundamental_forensics_companyfacts_pinned_loader.py
          tests/test_fundamental_forensics_attested_history_materializer.py -q
      - name: read-only attested-history operator foundation
        run: >-
          python -m pytest
          tests/test_fundamental_forensics_attested_history_operator.py -q
      # Wave 0A: the production receipt API's DEDICATED reader. This suite is the
      # only proof that the API addresses the dedicated attested-history bucket
      # rather than the generic Research Vault one, that the read-only store is
      # structurally excluded from every StrictConditionalWriteStore write gate,
      # that the renewal lock is not held across the network GET, and that the
      # VPS delivery workflow carries the read-only half and never a seed writer.
      # deploy-api-secrets.yml's own comment cites this suite as the protection on
      # its credential contract, so that citation must stay true — it now points at
      # a lane whose only failure mode is its own.
      - name: Wave 0A dedicated attested-history serving boundary
        run: >-
          python -m pytest
          tests/test_fundamental_forensics_attested_history_api_store.py -q
      # B4F: the initial issuer seed is allowed to construct only a governed base and
      # a redacted review-only receipt; these tests pin the no-network selection,
      # one-shot credential boundary, storage-control probe, and isolated
      # dimensions-unknown evidence bridge.
      - name: B4F controlled AAPL pilot and seed safety contracts
        run: >-
          python -m pytest
          tests/test_fundamental_forensics_attested_history_pilot.py
          tests/test_fundamental_forensics_attested_history_seed.py
          tests/test_fundamental_forensics_attested_occurrence_governance.py -q

  express-render-guards:
    if: ${{ false }}
    # The express render/engine guards, split out of `engine-render-guards`
    # 2026-08-14. Every step here is a focused, sub-10-second guard that was wired
    # into the old job one incident at a time — and every one of them carried a
    # comment saying it had been ordered BEFORE the ~100-file sweep because
    # run_ci_pack abandons a job's remaining steps once one exits non-zero, so a
    # trailing guard is unreachable whenever anything in that sweep is red. That was
    # never a fix, only a queue position: it protected the step that happened to be
    # first and pushed the hazard onto whatever was last.
    #
    # The split is the fix. A red sweep is now a red in a DIFFERENT job and cannot
    # skip anything here, at any position. Read each step's note for the rot it was
    # written against; the ordering rationale that used to sit in those notes is gone
    # because it no longer describes anything.
    #
    # It is not gone from the lane, though, only bounded: within THIS job the first
    # non-zero step still abandons the rest. That is why this lane stays small and
    # every step is independent — do not grow it into a second sweep.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        # jinja2 (test_etfs_gate, test_group_flow render real templates), plotly and
        # pandas/numpy (the ETF builder assertions), pyarrow (the prophet-live
        # reconciler's parquet round-trip and the flow-desk staleness fixtures),
        # requests + pyyaml from the import-time first-party closure, and jsonschema
        # because tests/test_theme_clinical.py importorskips it — this is the only
        # lane naming that suite, so dropping it would make the contract-checked
        # rollup tests skip-only, which check_skip_only_suites.py rejects.
        # No boto3: engine/prophet_live/r2io.py imports it lazily inside client() and
        # the prophet-live suites monkeypatch that factory; the only boto3 mentions in
        # this lane are string assertions ABOUT another workflow's pip line.
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests jsonschema
      # The import-light tier-gate runs the shell/boundary cases, while the two
      # builder assertions intentionally require pandas + plotly. Pair the suite
      # with this lane's fat deps so those assertions execute instead of skip
      # everywhere.
      # test_us_board_gate.py is the same split in the same shape for the
      # us_stocks board, so it is paired the same way: tier-gate runs its
      # jinja2-only shell/leak cases, and the splitter + payload-writer
      # assertions (which import scripts.build_site, hence plotly) execute
      # HERE. Those are the half that proves the withholding itself, so
      # leaving them to skip would gate the markup and not the gate.
      - name: ETF tier-preview builder assertions (full page stack)
        run: python -m pytest tests/test_theme_clinical.py tests/test_etfs_gate.py tests/test_us_board_gate.py -q
      # Wired 2026-07-26: test_group_flow.py was named by NO job in ANY workflow
      # (`grep -rn test_group_flow .github/` returned nothing), so its baskets.html.j2
      # render guard sat RED on main from 2026-07-24 — #3282's Rotation Map revamp
      # rebuilt the "Flow lens" card into the Money-flow tile and the test's literal
      # `{% if flow %}` source slice raised ValueError from that merge onward. Same
      # unrun-suite darkness as test_nyse_calendar (#3779) and the #3768 sweep. It
      # belongs with the express guards: it is a template render guard, it renders the
      # same baskets.html.j2 as test_theme_scoring_conflicted, and this lane's deps
      # already carry jinja2/pandas/numpy. Path-gated in ci.yml on BOTH the test and
      # templates/baskets.html.j2 — a guard the guarded change cannot trigger is not a
      # guard (#3488).
      - name: group-flow display-only detector + baskets.html.j2 money-flow render guard
        run: python -m pytest tests/test_group_flow.py -q
      # Wired 2026-08-02: neither tests/test_theme_hash_deeplink.py nor
      # tests/test_sector_intelligence_page.py was named by any job in any workflow,
      # so both sat dark while the Sector Intelligence consolidation (#4237) turned
      # baskets.html.j2 into a redirect stub that ATE inbound #theme-<id> hashes —
      # the exact silent deep-link failure the deeplink suite was written against
      # (#4254), invisible because the suite never ran. Both are stdlib text guards
      # over templates this lane already covers. Path-gated in ci.yml on the test
      # files; templates are covered by "templates/**" (#3488).
      - name: theme deep-link contract + sector-intelligence consolidation invariants
        run: python -m pytest tests/test_theme_hash_deeplink.py tests/test_sector_intelligence_page.py -q
      # Wired 2026-08-05: tests/test_flow_velocity.py was named by NO job in ANY
      # workflow (`grep -rn test_flow_velocity .github/` returned nothing), so the
      # suite written specifically to catch a pinned-by-construction flow readout
      # (#3561) has been dark ever since. It stayed green by luck, but its subject
      # went stale invisibly: site/flowdata/desk.json's A-share legs froze at
      # 2026-07-24 and ran 12 days behind a southbound leg dated 08-05, still
      # declaring cadence "daily", with nothing red anywhere.
      # test_flow_desk_staleness.py is the alarm for that class — the relative +
      # wall-clock gates in lib/desk_guard.stale_legs, the column-zero annotation
      # the builder emits, and the ChinaTushareAdapter heartbeat that reported
      # 'ok' for ten nights while every data/tushare store sat frozen.
      # Both are engine/builder contract guards and this lane's deps already carry
      # pandas/numpy/pyarrow/jinja2. Path-gated in ci.yml on BOTH the tests and their
      # subjects (lib/desk_guard.py, engine/flow_velocity.py,
      # scripts/build_flow_velocity.py, collectors/china_tushare.py) — a guard the
      # guarded change cannot trigger is not a guard (#3488).
      - name: flow-velocity measure guards + flow-desk staleness alarm (frozen-leg detection, heartbeat liveness)
        run: python -m pytest tests/test_flow_velocity.py tests/test_flow_desk_staleness.py -q
      # The market-score authority suite spans engine contracts, dashboard projection,
      # and forward-ledger provenance, so the render/engine guard lanes own it. It sits
      # here rather than in the sweep because it is one focused suite and because an
      # unrelated render failure must not leave the veto firewall dark — which is now
      # true by job separation, not by queue position.
      - name: US market-score authority firewall (calendar, Radar, history, provenance)
        run: python -m pytest tests/test_market_score_authority_2026_08_12.py -q
      # #5480 added this express-render ownership guard to main but omitted a
      # run: owner, so audit_unrun_tests correctly found it dark on the very
      # next check-definition refresh. #5481 folded the focused render-lane
      # module into the canonical China Policy Watch suite; keep that canonical
      # suite here because it pins both render workflows and the data-pristine
      # --site-only builder boundary.
      - name: China Policy Watch express-render ownership + data-pristine mode
        run: python -m pytest tests/test_china_policy_watch.py -q
      # Wired 2026-08-13 (#5507): `grep -rn cn_theme_tape .github/` returned NOTHING
      # since the panel landed on 2026-08-05 (#4667), so its 37 guards had never run
      # in CI — and its real-artifact acceptance case was in fact RED, invisibly,
      # from the 2026-08-07 ledger stamp onward: that night moved 002155.SZ (湖南黄金)
      # from a `veto` to `flat: cut`, and the case turned out to pin the night's
      # verdict rather than the accounting. It was rewritten to the charter before
      # wiring, per the standing rule that a previously-unrun suite goes green BEFORE
      # it is armed. It rides this express lane, not a new job: the china render
      # family (test_china_stocks_w1c_render, test_china_act_now, the delayed-board
      # disclosure) still lives in the sweep, and this lane's deps already carry the
      # exact set the suite needs — pandas + pyarrow to read the two parquet ledgers,
      # jinja2 to render the real partial. The old "keep it ahead of the sweep"
      # ordering note is retired: a red sweep is a different job now and cannot skip
      # this step at any position.
      - name: CN Theme Tape — theme/member accounting + the 2026-08-04 narration case
        run: python -m pytest tests/test_cn_theme_tape.py -q
      # PROPHET LIVE P0 gates. These lanes, not a new one: the parity suite drives the
      # REAL engine.signal_gate over seeded close series, so it needs pandas + numpy
      # (present in this lane's install line above) and pyarrow for the reconciler's
      # parquet round-trip. Any importorskip here would be a disarmed test — the deps
      # are provably installed, so there is none.
      #   G0.1 parity  tests/test_prophet_live_pack.py       (~25s, real gate calls)
      #   G0.2/3/5/6   tests/test_prophet_live_evaluator.py
      #   ledger law   tests/test_prophet_live_reconcile.py
      #   VPS lane     tests/test_prophet_live_vps_lane.py — quote source, the atomic
      #                served write, the serving gate (/live/prophet_live.json is NOT
      #                public), the systemd unit/timer, macro-update's reconciliation
      #                and the workflow's self-disabling backstop gate (§4.2a/§4.4a).
      #                Stdlib + pyyaml only, so it rides in this lane rather than
      #                needing one of its own.
      #   one basis    tests/test_prophet_live_basis.py — W-L0 gate 3, the CROSS-MODULE
      #                half: the adjustment vocabulary against engine.price_ladder's,
      #                the pack's own basis stamp, and the per-pass pack-vs-feed audit.
      #                The lane behaviour it feeds is pinned in the evaluator and
      #                reconciler files above. LISTED HERE ON PURPOSE — this job
      #                enumerates its files, so an unlisted new suite never runs.
      #   CN clock     tests/test_cn_live_clock.py — CN-W-L3 PR-0 (#5759): the mainland
      #                session-state contract (lunch = session_break, per-board limit
      #                bands incl. 301/689, the delay-aware quote-age anchor), the
      #                armed_pack calendar threading (calendar=None IS the NYSE path —
      #                this lane's US files prove it stays byte-unchanged), and
      #                lib.cn_calendar.sessions_behind. Same package, same deps
      #                (pandas via armed_pack), so it rides here, not in a new lane.
      #   CN pack      tests/test_cn_live_pack.py — CN-W-L3 PR-1: calendar=cn_calendar,
      #                per-class ±10/±20 probe span, schema cn_prophet_live.armed/v1.
      #   CN evaluator tests/test_cn_live_evaluator.py — close-board coverage, lunch
      #                freeze, quote-age, pending remnant in last minute of post_close.
      #   CN VPS lane  tests/test_cn_live_vps_lane.py — CN timer, served-path gate,
      #                kill switch, health absent-ok, update.sh self-arm.
      # It is LAST in this lane and that is now a cost of ~48s of sibling guards
      # ahead of it, not of a 357-second sweep.
      - name: prophet-live P0 (G0.1 parity, ledger law, debounce, degradation)
        run: >
          python -m pytest
