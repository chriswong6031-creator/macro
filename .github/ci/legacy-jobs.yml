  unrun-import-hygiene:
    # import-time process-global state (logging.disable / warnings filters) across
    # engine, lib, scripts, research.  Both are process-global: a module-level
    # silencer mutes warnings for anything that merely IMPORTS the file — pytest
    # collection, a guarded engine import, a sibling research harness — which is how
    # the #1115 order-dependent flake happened.  The suite AST-parses all four trees,
    # so it costs ~48s wall on its own; 5 minutes leaves headroom on a cold runner.
    if: ${{ false }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests beautifulsoup4 openpyxl scikit-learn
      - name: import-time logging.disable + warnings-filter ratchet over engine, lib, scripts, research
        run: python -m pytest tests/test_no_module_level_logging_disable.py -q
      - name: file-path entry scripts pin this repository before importing it
        run: python -m pytest tests/test_check_script_import_pinning.py -q

  price-basis-census:
    # PRICE-BASIS guard: no production grader may difference an UNADJUSTED name leg against
    # an ADJUSTED benchmark leg (a name's own dividend books as a loss).  An AST walk over
    # engine and scripts holding a FROZEN registry of every module that pairs the two
    # families, fail-closed in BOTH directions — a new pairing fails, and so does a
    # registry line that no longer describes anything.
    #
    # STANDS ALONE ON PURPOSE.  #4715 shipped this suite wired into no workflow, and one
    # day later pristine main already carried three drifts: two unregistered pairings and
    # one registered module the detector had gone blind to when the tier-merging cache
    # accessor moved into lib/closes_panel.py (#4711) — read as "this module was fixed"
    # when nothing had been fixed.  Giving it its own job is the fix for the ROT, not just
    # for the drift: run_ci_pack returns on a job's first failing step, so a step appended
    # to a shared job stops running the moment any earlier suite in that job goes red — a
    # second, quieter way to be dark, and both jobs this could have ridden are red on main
    # today.  A pack continues past a failing JOB, so a job boundary is what actually keeps
    # this eye open.  Same install line as its neighbours, so it shares their venv.
    if: ${{ false }}
    timeout-minutes: 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests beautifulsoup4 openpyxl scikit-learn
      - name: "price-basis census: raw name leg vs adjusted bench (frozen registry, both directions)"
        run: python -m pytest tests/test_price_basis_graders.py -q

  # ── RED-ON-ARRIVAL SWEEP, BATCH A (2026-07-27) ─────────────────────────────
  # The 2026-07-26 census wired the P0–P3 tiers but left P4/P5 (861 suites) as
  # declared backlog, so nobody had measured how many of them were already RED.
  # This lane is the first answer: 870 unrun suites were executed one process per
  # suite, 24 came back red, and these four are the scoring-engine share of that
  # set (docs/UNRUN_TEST_CENSUS.md §"Red on arrival — the P4/P5 sweep").
  #
  # Two of the four were worse than red — they were NON-HERMETIC.  A migration
  # that adds a preferred data source in front of an existing one silently strands
  # the old monkeypatch on a dead branch, so the test stops testing its fixture and
  # starts asserting against the committed production store; its verdict then moves
  # with the market instead of with the code.  Both now pin the branch they
  # exercise, and both gained the coverage the migration's NEW branch never had.
  # Repeats the shared dependency install BYTE-FOR-BYTE so run_ci_pack.py keeps one
  # venv across the unrun-* set.  Measured locally: 4 suites / 45 tests / ~43s,
  # dominated by test_sector_central's compute() over the real store (~40s).
  unrun-scoring-engine:
    if: ${{ false }}
    timeout-minutes: 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        # pandas.read_html is exercised by the ETF sponsor-registry parser;
        # pandas alone does not provide an HTML parser on a clean runner.
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests beautifulsoup4 openpyxl scikit-learn lxml
      - name: spotlight tilt — W9-B US demotion is display-only + the tilt still moves weighted markets
        run: python -m pytest tests/test_spotlight.py -q
      - name: etf_pulse sector leg + analyst delta channel — each pins the data branch it exercises
        run: python -m pytest tests/test_etf_pulse.py tests/test_fix43_analyst_and_whitehouse.py -q
      # test_etf_board ran in ZERO jobs until 2026-08-03 — the etfs.html hero
      # tile's zh leak (bare label_en RISK-ON on an indexed bilingual page) had
      # its natural pin in a suite CI never executed. The suite needs numpy (via
      # engine.etf_pulse constants) + jinja2 for its end-to-end zh render; both
      # are already in this job's venv line.
      - name: etf board synthesis — bilingual backdrop tile + pulse-dated rotation (zh-leak / §B9.6 pins)
        run: python -m pytest tests/test_etf_board.py -q
      # W1 flow-vs-selection (2026-08-12): the decomposition identity plus every
      # robustness guard standing between a raw sponsor file and a published
      # dollar figure — split / duplicate-day / weight-sum / cadence / exit
      # continuity, each with its own adversarial fixture. Registered on arrival
      # rather than added to the unrun census. Needs pandas+pyarrow (parquet
      # fixtures) and imports scripts.build_site for the payload wiring; this
      # job's venv line already carries both.
      - name: etf flow/selection decomposition — identity, $ estimates, robustness guards
        run: python -m pytest tests/test_etf_flow_decomposition.py -q
      # W2a/W3 companions (2026-08-12), registered on arrival — this manifest is
      # explicit-file (no pytest glob), so an unregistered suite runs in ZERO jobs
      # (see the test_etf_board note above). Registry needs pyyaml; the ledger
      # suite needs pandas+pyarrow and pins the nightly lane gate + price freeze;
      # the windows tile renders measurement.html.j2 (jinja2). All deps already
      # on this job's venv line.
      - name: etf fund registry — universe coverage, type enum, sponsor drift pin
        run: python -m pytest tests/test_etf_registry.py -q
      - name: etf board ledger — lane gate, idempotency, frozen-price grading
        run: python -m pytest tests/test_etf_board_ledger.py -q
      - name: etf board windows tile — three states, zh parity, vocab
        run: python -m pytest tests/test_etf_board_windows_tile.py -q
      - name: etf weighting lens — discount identity, golden default ordering, receipts
        run: python -m pytest tests/test_etf_weighting.py -q
      # W3 partial-NAV sleeve support: pins the declared nav_equity_frac bounds,
      # both ranked-consumer call sites, and the conservative sweep/swap filters.
      # Uses pandas+pyarrow for the on-disk sponsor receipt; both are above.
      - name: etf partial-NAV sleeve — declared bounds and sweep/swap guards
        run: python -m pytest tests/test_etf_partial_nav_sleeve.py -q
      - name: sector_central board order — fast-lens rotation rank, failing open to conviction
        run: python -m pytest tests/test_sector_central.py -q

  # ── RED-ON-ARRIVAL SWEEP, BATCH B (2026-07-27) ─────────────────────────────
  # The template-surface share of the 10 reds (docs/UNRUN_TEST_CENSUS.md §"Red on
  # arrival — the P4/P5 sweep").  All three slice shipped markup out of templates/
  # and render it, so they rot whenever copy is rewritten — and the house style is
  # to rewrite copy into plain words (the jargon ban in DESIGN_DOCTRINE.md).  Each
  # now pins the load-bearing NOUN or the honesty invariant rather than a sentence.
  #
  # The sweep also caught a VACUOUS GREEN here, which is the more dangerous half:
