  falsifier-tripwires:
    # The stateful cycle-ontology falsifier engine was triggerable but its focused
    # regression suite was named by no CI command (#5194).  Keep this as a small
    # first-class owner so path-aware selection can remove unrelated packs without
    # making the exact changed behavior dark.  The alert-ZH completeness contract
    # shares the same falsifier engine and ontology inputs, so it stays in this
    # owner as a distinct step instead of adding a second overlapping job that
    # defeats the representative-diff scope ceiling. Price-pressure's inferred
    # ownership closure overlaps this owner too, so its focused suite is a third
    # distinct step here rather than another always-selected logical job.  TOP
    # ANATOMY's point-in-time research engine and the inert Winner Health design
    # freeze are likewise folded in as attributable steps: the dependency install
    # is already a strict superset, and keeping one selected owner preserves the
    # representative-diff job ceiling without leaving either suite dark.
    if: ${{ false }}  # executed inside ci-pack — NOT a disabled gate.
    paths:
      - data/alerts/alerts_log.parquet
      - data/cycle_ontology/falsifiers.json
      - data/cycle_ontology/falsifiers_retired.json
      - data/cycle_ontology/tripwire_state.json
      - data/top_anatomy/library.parquet
      - data/top_anatomy/thresholds.json
      - data/top_maturation/latest.json
      - engine/alerts.py
      - engine/falsifier_tripwires.py
      - engine/i18n.py
      - engine/top_maturation.py
      - scripts/build_top_maturation.py
      - scripts/build_vector.py
      - scripts/build_winner_health_page.py
      - scripts/export_top_anatomy_library.py
      - tests/test_alert_zh_completeness.py
      - tests/test_falsifier_tripwires.py
      - tests/test_json_strict.py
      - tests/test_massive_local_staleness.py
      - tests/test_price_pressure.py
      - tests/test_top_anatomy.py
      - tests/test_top_maturation.py
      - tests/test_winner_health_design_freeze.py
      - tests/test_winner_health_page.py
      - templates/winner_health.html.j2
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install falsifier, alert-zh, and price-pressure test dependencies
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests beautifulsoup4 openpyxl scikit-learn fastapi httpx
      - name: falsifier tripwire state and v2 gate contracts
        run: python -m pytest tests/test_falsifier_tripwires.py -q
      # The zh half of every macro alert body must be fully Chinese. Six rules
      # interpolated an English-valued token straight into message_zh (#4700), and
      # the cycle-falsifier body quoted a curator-written English thesis (#4712).
      # TZ=UTC is inline because env is not an allowed packed-manifest step key.
      - name: zh alert bodies fully Chinese — emitter vs backlog translator vs baked rows
        run: TZ=UTC python -m pytest tests/test_alert_zh_completeness.py -q
      # W1 of the Dislocation & Recovery program (DRL): engine/price_pressure/, the
    # single-name residual-shock detector and its point-in-time event ledger, plus
    # the display artifact and the market-packet block that read them.
    #
    # WHY THIS SUITE IS WORTH A JOB. The lobe imports its whole construction from
    # scripts/research_liquidity_shock_reversal.py, because the frozen base rates
    # it publishes were measured THERE — a re-typed copy of the residual math would
    # drift silently and quietly invalidate every published table. The parity test
    # calls BOTH paths on one synthetic fixture and compares them field by field,
    # so the seam cannot be swapped for a lookalike without going red.
    #
    # The rest of the suite pins the honesty invariants a display-tier ledger dies
    # without: the identity block does not move when t0+1 bars are POISONED; a
    # horizon field is null until its window has fully elapsed; there is NO early
    # close (a 100% retrace on day 3 still grades at 21d and 60d — closing on the
    # good news is upside-only path censoring); a name whose bars stop grades
    # DELISTED_OR_HALTED *inside* the terminal denominator; the nightly-lane gate
    # actually gates the write; era stamps (backfill / gap / forward) are never
    # rewritten and a backfill refuses to touch accrued forward rows; and every
    # emitted list is recency-then-ticker, never |z| — ordering by size of move
    # would be the ranking the artifact's authority block says it cannot do.
    #
    # Everything runs on a SYNTHETIC panel in tmp_path: CI has no
    # data/massive_stock_day (20k vendor parquets, R2-homed), and a test that
    # needed the real store would be a test that never runs.
    #
    # `pyarrow` is in the install line because the ledger is a parquet store;
    # `pyyaml` because lib/config.py reads config.yml at import. No `requests`:
      # this lobe is an assembler over committed stores and makes no network call.
      # The shared install is a strict superset of those wheels and this owner's
      # 12-minute ceiling preserves the former standalone suite's 10-minute bound.
      - name: price-pressure detector, PIT ledger, base rates and artifact (DRL W1)
        run: >-
          python -m pytest
          tests/test_price_pressure.py -q -rs
      # Synthetic-only research guard: labels may look forward, but every feature
      # is point-in-time and all frozen thresholds remain tied to the preregistered
      # Phase-0 contract.  The derived scope follows its engine/script/read closure.
      - name: TOP ANATOMY point-in-time engine and preregistration contracts
        run: python -m pytest tests/test_top_anatomy.py -q
      # The same harness's JSON write path, so it belongs to the same owner rather
      # than a second overlapping job. `default=str` does NOT catch NaN — it only
      # fires for values the encoder cannot serialize — so three shipped
      # top_anatomy summaries carried bare `NaN` tokens that no strict parser will
      # read. This pins the sanitizer and that every summary emitter routes through
      # the one write path; an unregistered encoding guard is a dead guard.
      - name: strict-JSON research summary encoding — non-finite sanitizer and emitter
        run: python -m pytest tests/test_json_strict.py -q
      # Local research entrypoints must refuse a massive_stock_day mirror frozen
      # past the declared trading-session ceiling while staying inert in Actions.
      # The packed selector derives this suite's full import/path-literal closure,
      # so collector, calendar, and all four wired entrypoint edits select this owner.
      - name: massive-stock-day local mirror staleness tripwire
        run: python -m pytest tests/test_massive_local_staleness.py -q
      # Nightly display-only consumer of the frozen TOP ANATOMY library. Keep
      # its point-in-time state machine and generated page beside the research
      # owner so changes to either side cannot leave the shipped read dark.
      - name: Winner Health nightly maturation and render contracts
        run: >-
          TZ=UTC python -m pytest
          tests/test_top_maturation.py
          tests/test_winner_health_page.py -q
      # Source-template render only; templates/winner_health.html.j2 is declared
      # above because Jinja's runtime template lookup is intentionally not inferred
      # as a Python import edge.
      - name: Winner Health inert surface design freeze
        run: python -m pytest tests/test_winner_health_design_freeze.py -q

