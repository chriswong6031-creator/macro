      # handing the map over, the lookup itself, and a print site that bypasses it.
      - name: watchlist sector names — glossary, build wiring, print sites (zh)
        run: python -m pytest tests/test_watchlist_sector_i18n.py -q
      # W4 per-ticker Intelligence Drawer over that workspace. The load-bearing gate is
      # honest absence: every section builder is run over an EMPTY payload and must
      # return a row that NAMES what is missing, because a section that renders nothing
