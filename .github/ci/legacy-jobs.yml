  free-content-estate:
    if: ${{ false }}  # executed inside ci-pack; keep the legacy status definition runner-free
    # Free acquisition estate drift law (2026-07-26). scripts/build_free_content.py
    # and tests/test_free_content.py were wired into ZERO workflows — the D12/W1
    # masterplan flagged `--check` as "currently a manual command" and it was never
    # wired. Both rotted red on main unnoticed: #3592 added the Legal footer column
    # to templates/seo_base.html.j2 and re-rendered only the 3 new legal pages, so 52
    # estate pages silently shipped without the Privacy/Terms/Disclaimer links, and
    # 15 of 26 calculator pages shipped with no CTA at all. Network-free (renders to
    # a tmp dir) and writes nothing under site/.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml jinja2
      - name: free-content builder suite (frontmatter contract, RSS, rendered-output pins)
        run: python -m pytest tests/test_free_content.py -q
      - name: committed estate must match a fresh render (template↔site drift law)
        run: python -m scripts.build_free_content --check
      # i18n split-tag law (2026-07-30). `--check` above pins the committed bytes
      # to a fresh render — it does NOT judge whether those bytes are valid, so it
      # froze 48 t() calls that passed an OPENING `<a href="` through the
      # bilingual macro and shipped `href="</span>` on all 26 calculator pages.
      # check_inline_js only parses <script>/on*=, and check_site_asset_refs
      # deliberately skips refs containing `<`. Scans site/ AND templates/, so it
      # is not scoped to this estate; it lives here because this job already owns
      # the render contract and already installs the deps.
      - name: no split tags across the bilingual t() macro (rendered + source)
        run: python -m pytest tests/test_i18n_split_tag_guard.py -q
      # SECOND home for this suite, and the only one where all of it RUNS.
      # tests/test_externalize_css.py also runs in template-site-sync, whose
      # `pip install pyyaml pytest` deliberately has no jinja2 — so its
      # cross-module test (externalize_css and build_free_content must share ONE
      # HAND_AUTHORED frozenset, never a copy) importorskips there and executed
      # in ZERO jobs: a SKIP-ONLY suite, the #3703 / #3722→#3738→#3760 class that
      # scripts/check_skip_only_suites.py exists to catch. It caught this one.
      # This job already installs jinja2 and already owns the estate contract the
      # shared constant belongs to, so the pairing is free (no new dependency).
      # Do NOT "de-duplicate" this by deleting it because the suite is named
      # above in template-site-sync: that lane runs the other 27 tests in a thin
      # venv and re-darkens the jinja2 one the moment this step goes away.
      - name: inline-CSS externalization units (incl. the jinja2 cross-module gate)
        run: python -m pytest tests/test_externalize_css.py -q

