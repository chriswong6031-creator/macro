        run: python -m pytest tests/test_no_module_level_logging_disable.py -q

  # ── RED-ON-ARRIVAL SWEEP, BATCH A (2026-07-27) ─────────────────────────────
  # The 2026-07-26 census wired the P0–P3 tiers but left P4/P5 (861 suites) as
  # declared backlog, so nobody had measured how many of them were already RED.
  # This lane is the first answer: 870 unrun suites were executed one process per
  # suite, 24 came back red, and these four are the scoring-engine share of that
  # set (docs/UNRUN_TEST_CENSUS.md §"Red on arrival — the P4/P5 sweep").
  #
  # Two of the four were worse than red — they were NON-HERMETIC.  A migration
  # that adds a preferred data source in front of an existing one silently strands
  # the old monkeypatch on a dead branch, so the test stops testing its fixture and
  # starts asserting against the committed production store; its verdict then moves
  # with the market instead of with the code.  Both now pin the branch they
  # exercise, and both gained the coverage the migration's NEW branch never had.
  # Repeats the shared dependency install BYTE-FOR-BYTE so run_ci_pack.py keeps one
  # venv across the unrun-* set.  Measured locally: 4 suites / 45 tests / ~43s,
  # dominated by test_sector_central's compute() over the real store (~40s).
  unrun-scoring-engine:
    if: ${{ false }}
    timeout-minutes: 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests beautifulsoup4 openpyxl scikit-learn
      - name: spotlight tilt — W9-B US demotion is display-only + the tilt still moves weighted markets
        run: python -m pytest tests/test_spotlight.py -q
      - name: etf_pulse sector leg + analyst delta channel — each pins the data branch it exercises
        run: python -m pytest tests/test_etf_pulse.py tests/test_fix43_analyst_and_whitehouse.py -q
      - name: sector_central board order — fast-lens rotation rank, failing open to conviction
        run: python -m pytest tests/test_sector_central.py -q

  # ── RED-ON-ARRIVAL SWEEP, BATCH B (2026-07-27) ─────────────────────────────
  # The template-surface share of the 10 reds (docs/UNRUN_TEST_CENSUS.md §"Red on
  # arrival — the P4/P5 sweep").  All three slice shipped markup out of templates/
  # and render it, so they rot whenever copy is rewritten — and the house style is
  # to rewrite copy into plain words (the jargon ban in DESIGN_DOCTRINE.md).  Each
  # now pins the load-bearing NOUN or the honesty invariant rather than a sentence.
  #
  # The sweep also caught a VACUOUS GREEN here, which is the more dangerous half:
  # three of test_w5b_edge_chips' absence tests asserted `"Sleeve ×" not in html`,
  # and a rename made that trivially true — they passed while no longer able to
  # catch a chip leaking into the wrong mode or surviving a None radar_state.  A
  # renamed sentinel silently disarms every absence assertion keyed to the old one;
  # when a presence marker changes, re-point the absence tests in the same edit.
  # Repeats the shared dependency install BYTE-FOR-BYTE so run_ci_pack.py keeps one
  # venv across the unrun-* set.  The macro-header suite also keeps the glance
  # layer compact while preserving the click-through detail affordances.
  unrun-template-chips:
    if: ${{ false }}
    timeout-minutes: 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests beautifulsoup4 openpyxl scikit-learn
      - name: Macro header — compact glance layer with on-demand detail
        run: python -m pytest tests/test_macro_header_compact.py -q
      - name: OKX retail chip — bilingual + the contrarian framing survives copy edits
        run: python -m pytest tests/test_okx_retail.py -q
      - name: CN risk-backdrop chip — renders, degrades, and stays out of macro mode
        run: python -m pytest tests/test_w5b_edge_chips.py -q
      - name: US board W9-A producer field + cohort math
        run: python -m pytest tests/test_w4_us_board.py -q

  # ── RED-ON-ARRIVAL SWEEP, BATCH C (2026-07-27) ─────────────────────────────
  # The PIT / frozen-tape share of the 10 reds (docs/UNRUN_TEST_CENSUS.md §"Red on
  # arrival — the P4/P5 sweep").  Both suites were red for the same underlying
  # reason: a fixture that encodes a MOMENT rather than a contract.
  #
  #   - test_stock_personality_wiring dated its fires 2024-06-03/2024-06-01, but the
  #     stamper clamps its scan to max(build_date - 30d, "2026-07-06") and never
  #     backfills pre-wire-in history.  The fixture matched no fires, so the stamper
  #     returned early and wrote nothing — the suite failed on a MISSING FILE, which
  #     reads like a broken writer rather than a stale date.  Its dates now straddle
  #     the floor deliberately, so the no-backfill rule is asserted instead of
  #     tripped over.  The "wrong date" row had also gone stale in the other
  #     direction: the filter moved from same-day to a 30-day lookback, so a
  #     build_date-1 row is now legitimately IN window and proved nothing.
  #   - test_setup_tier's probe class read the LIVE china_search store and asserted
  #     relationships about three real tickers.  A relationship about a live tape is
  #     still a claim about the market: two of six probes had gone red as the names
  #     traded on, and the rest were passing on borrowed time.  It now reads a frozen
  #     3-ticker slice truncated at 2026-07-03 — the tape the probes were authored
  #     against and the last date on which all six hold at once — so it tests the
  #     engine, which is what it was always for.  Its skip-if-store-absent guard is
  #     gone with the live read: a skip that fires in CI is a pass you cannot see.
  #
  # Repeats the shared dependency install BYTE-FOR-BYTE so run_ci_pack.py keeps one
  # venv across the unrun-* set. PSS prospective-ledger suites ride the same
  # pandas/numpy/pyarrow environment and remain isolated from product authority.
  unrun-pit-probes:
    if: ${{ false }}
    timeout-minutes: 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests beautifulsoup4 openpyxl scikit-learn
      - name: w_setup probes against the FROZEN tape + the rule ladder
        run: python -m pytest tests/test_setup_tier.py -q
      - name: personality forward-ledger PIT stamp + the no-backfill wire-in floor
        run: python -m pytest tests/test_stock_personality_wiring.py -q
      - name: PSS-RH1 prospective-only detector parity + lifecycle authority fences
        run: python -m pytest tests/test_personality_relief_hazard.py -q
      - name: PSS CR1/CD1/AF1 construction causality + lifecycle authority fences
        run: python -m pytest tests/test_personality_followon_gates.py -q

  # ── THE STRICTLY-DARK SET REOPENED TWICE IN ONE DAY (2026-07-27) ───────────
  # #3636 emptied the strictly-dark set, #3645 emptied it again the same day, and
  # docs/UNRUN_TEST_CENSUS.md says outright that it is not a one-time cleanup — a
  # suite arrives dark whenever it lands without a paths entry.  Two did today:
  #
  #   #3776  tests/test_signup_email_validation.py — the public account-creation
  #          email gate.  The highest-risk shape in the census: a security-adjacent
  #          guard on the signup path, run by nothing.  It pins the email-format
  #          validator AND that the check runs BEFORE sb.auth.signUp.
  #   #3797  tests/test_gh_quota_guard.py — the shared-GitHub-quota hook, itself
  #          added because two watchers on one endpoint drained the 5,000/hr REST
  #          pool to zero and 403'd every session.  36 tests, run by nothing.
  #
  # Neither needs third-party deps, but both repeat the shared install BYTE-FOR-BYTE
  # so run_ci_pack.py keeps one venv across the unrun-* set rather than building a
  # second one for 38 tests.
  #
  # Measurement note for whoever next reads the auditor — BOTH are the same false
  # positive.  audit_unrun_tests.py derives subjects from IMPORTS; neither suite
  # imports its subject.  test_signup_email_validation reads templates/onboard.js as
  # text and regexes it; test_gh_quota_guard invokes .claude/hooks/gh_quota_guard.py
  # as a SUBPROCESS.  So the auditor reports subjects=[] and calls both
  # untriggerable, when templates/** and .claude/** already match their subjects.
  # Only the UNRUN half was real in each case.  Guards that reach their subject by
  # path string or subprocess are a blind spot in the auditor, not a dark corner of
  # ci.yml — check how a suite reaches its subject before believing a dark verdict.
  unrun-dark-guards:
    if: ${{ false }}
    timeout-minutes: 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly requests beautifulsoup4 openpyxl scikit-learn
      - name: signup email gate — format validator + it runs BEFORE supabase signUp
        run: python -m pytest tests/test_signup_email_validation.py -q
      - name: shared-GitHub-quota hook — the guard that keeps polling loops off the REST pool
        run: python -m pytest tests/test_gh_quota_guard.py -q
