  reference-integrity:
    if: ${{ false }}  # executed inside ci-pack — NOT a disabled gate; see the ci-pack job.
    # design.reference_integrity PR gate (RIG V1, research/REFERENCE_INTEGRITY_GATE_V1.md).
    # Stops REFERENCE LAUNDERING: a bad product decision becomes a reference, the reference
    # becomes law, builders reproduce it faithfully, reviewers compare against it instead of
    # against production, CI says compliant, and the regression is institutionalized.
    # CI cannot judge taste and does not try — it proves the judgment HAPPENED (dual
    # independent critics, rationale quarantine, frozen first pass, verdict packet, approval
    # receipt) and left auditable receipts. Unscoped on purpose: L7/L8/L9 are namespace and
    # coupling closures over mockups/design_system, research/migration_packets and the page
    # registry, so a diff that adds a file anywhere in those roots must re-run this.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pyyaml pytest
      - name: reference-integrity selftest (gate fires on synthetic violations)
        run: python3 scripts/check_reference_integrity.py --selftest
      - name: RIG artifact integrity across the checkout (hard gate)
        run: python3 scripts/check_reference_integrity.py
      - name: reference-integrity mutation / anti-vacuity suite
        run: python -m pytest tests/test_check_reference_integrity.py -q
  dataos-foundation:
    scope: exclusive
    # Mastermind Data OS foundation library (lib/dataos/**) — the canonical identity,
    # temporal, price-basis, null, registry and quality spine every later Data OS wave
    # builds on. WITHOUT THIS JOB the six suites are dead code: there is no broad
    # `pytest tests/` anywhere in CI, so a test file no `run:` step names never runs,
    # and the vocabulary would drift from the incidents it encodes with nothing going
    # red. That is not hypothetical here — lib/dataos/nulls.py shipped in the first
    # pass with no suite AND no `run:` entry, and a mutation deleting §D6's headline
    # law outright ("0 may never mean absence" -> `if False:`) failed NOTHING. Every
    # name in the `run:` step below is load-bearing; adding a suite to tests/ without
    # adding it HERE ships it dark. What it pins, concretely: the MMC->MRSH
    # alias table answering DIFFERENTLY
    # either side of 2026-01-14 (the rename that left data/baskets/ohlcv/MMC.parquet
    # nonexistent for seven months while the `insurance` basket quietly rendered
    # 18/19 members); the fail-closed PIT law, whose whole failure mode is a SILENT
    # latest-vintage return; the price-basis naming law and the measured NVDA
    # 2024-06-03 store bases (114.80 / 114.80 / 115.00 / 1150.00, all called some form
    # of "close"); and that config/dataset_registry.yml still validates clean.
    #
    # PURE UNIT TESTS BY CONSTRUCTION: nothing here reads data/, which is not
    # materialized in an agent worktree, so the suite behaves identically on a full
    # checkout and in this thin lane. Deps are pytest + pyyaml only — the library
    # imports stdlib-only and pulls yaml lazily inside registry.load_registry, so a
    # pandas/numpy import creeping into lib/dataos/ breaks HERE first.
    if: ${{ false }}  # executed inside ci-pack — NOT a disabled gate.
    paths:
      - config/delisted_symbols.yml
      - lib/__init__.py
      - lib/config.py
      - lib/delisted_symbols.py
      - lib/ticker_aliases.py
      - scripts/build_security_master.py
      - .github/ci/legacy-jobs.yml
      - .github/workflows/ci.yml
      - config/dataset_registry.yml
      - lib/dataos/**
      - tests/test_dataos_identity.py
      - tests/test_dataos_nulls.py
      - tests/test_dataos_price.py
      - tests/test_dataos_quality.py
      - tests/test_dataos_registry.py
      - tests/test_dataos_temporal.py
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml
      - name: Data OS identity / temporal / price-basis / nulls / registry / quality contracts
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python -m pytest
          tests/test_dataos_identity.py
          tests/test_dataos_temporal.py
          tests/test_dataos_price.py
          tests/test_dataos_nulls.py
          tests/test_dataos_registry.py
          tests/test_dataos_quality.py -q -rs

  dataos-identity-seams:
    # DOS-1.2 — the identity seam gate. `config/identity_seams.yml` declares every surface
    # in this tree that answers "which security is this?", classified ADOPT /
    # ALIAS-INTO-MASTER / KNOWINGLY-DIFFERENT / RETIRE against the DOS-1.1 master, and this
    # suite makes an ADOPT-class DISAGREEMENT fail.
    #
    # WHY IT IS A SEPARATE JOB FROM `dataos-foundation`: that lane is deliberately thin
    # (pytest + pyyaml only) so a pandas/numpy import creeping into lib/dataos/ breaks there
    # FIRST. This suite must read the committed master parquet, so it needs pandas+pyarrow —
    # putting it in the thin lane would destroy that tripwire. Two jobs, two purposes.
    #
    # WITHOUT THIS JOB the registry is prose. The cost of an ungoverned seam is already
    # measured in this repo: MMC->MRSH lived in scripts/fetch_basket_extras but not in its
    # sibling scripts/fetch_basket_ohlcv, so data/baskets/ohlcv/MMC.parquet never existed and
    # for seven months the `insurance` basket rendered 18/19 members and
    # us_sector_financials 75/76 — and NOTHING WENT RED. This suite is the thing that goes red.
    #
    # The gate is mutation-proven, not asserted: making engine/ledger_identity disagree with
    # the master fails the agreement test; blanking a KNOWINGLY-DIFFERENT `reason` fails the
    # schema test; deleting a registry row fails completeness; and silently "fixing" the
    # declared GOOG/GOOGL divergence in config/share_class_equiv.yml fails the divergence
    # test. Non-emptiness guards are explicit, because an agreement gate over zero securities
    # is green forever and means nothing.
    if: ${{ false }}  # executed inside ci-pack — NOT a disabled gate.
    paths:
      - .github/ci/legacy-jobs.yml
      - .github/workflows/ci.yml
      - config.yml
      - config/identity_seams.yml
      - config/share_class_equiv.yml
      - config/theme_graph_identity_breaks.yml
      - config/biocatalyst_sponsor_ticker_map.yml
      - config/us_search_aliases_zh.json
      - config/delisted_symbols.yml
      - data/reference/**
      - lib/dataos/identity.py
      - lib/ticker_aliases.py
      - lib/delisted_symbols.py
      - lib/symbol_directory_receipts.py
      - engine/ledger_identity.py
      - engine/entity_resolver.py
      - engine/name_resolver.py
      - collectors/edgar_deadnames.py
      - collectors/china_universe.py
      - collectors/china_ths_concepts.py
      - collectors/china_analyst.py
      - collectors/china_tushare_spine.py
      - tests/test_identity_seam_agreement.py
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        # pandas+pyarrow: the suite reads the committed security_master/vendor_aliases
        # parquet through lib.dataos.identity.VendorAliasTable. pyyaml: the registry itself.
        run: pip install pytest pyyaml pandas pyarrow
      - name: identity seams — ADOPT surfaces must agree, divergences must stay declared
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python -m pytest
          tests/test_identity_seam_agreement.py -q -rs

  no-client-supplied-identity:
    if: ${{ false }}
    # WS-9 / GATE-6: route handlers must not take user identity from the client.
    # _pg() uses SUPABASE_SERVICE_ROLE_KEY (bypasses RLS); token-derived identity
    # is the only cross-tenant fence. Scoped to app/** — an app-only PR must
    # select this job, a research-only PR must not.
    paths:
      - app/**
      - scripts/check_no_client_supplied_identity.py
      - tests/test_check_no_client_supplied_identity.py
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest
      - name: no-client-supplied-identity selftest (gate fires on planted violations)
        run: python3 scripts/check_no_client_supplied_identity.py --selftest
      - name: no-client-supplied-identity guard (hard fail on client-sourced user_id)
        run: python3 scripts/check_no_client_supplied_identity.py
      - name: no-client-supplied-identity test suite
        run: python3 -m pytest tests/test_check_no_client_supplied_identity.py -q
