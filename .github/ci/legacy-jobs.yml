      - name: watchlist_risk.js chain lane — node-shelled helper tests (TXI W4)
        run: python -m pytest tests/test_watchlist_chains_js.py -q
      # UWP/W1a: the watchlist+portfolio STORE (templates/watchstore.js), same
      # node-shelling idiom as the two steps above. test_watchlist_books_js.py was
      # named by no run: step in any workflow since it landed (P5 in
