name: company-intelligence

# Rebuild the public, context-only company view as soon as its two committed
# source planes move. This runs outside the shared Mac render lane: it reads
# R2 + Terminal's public transcript marker, writes immutable R2 objects, and
# advances exactly one mutable marker only after validation succeeds.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate only; do not promote the R2 root manifest"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # No cancellation: a run which has already uploaded its immutable objects
  # must reach the compare-and-swap marker step, where a concurrent producer
  # resolves safely instead of leaving work half-finished.
  group: company-intelligence-publication
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The CI immutable tree is currently ~227 MB / 3.6k objects. The dependent
    # sidecar re-verifies that exact tree after root promotion, so leave enough
    # headroom for both deterministic publication steps.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            engine/company_intelligence
            engine/earnings_transcript_intake.py
            lib/config.py
            scripts/build_company_intelligence.py
            scripts/fetch_earnings_scores.py
            scripts/publish_company_intelligence_r2.py
            scripts/refresh_company_intelligence.py
            engine/company_theme_exposure
            scripts/build_company_theme_exposure.py
            scripts/publish_company_theme_exposure_r2.py
            data/baskets/membership.json
            config/theme_crosswalk.yml
            data/neuralweb/theme_state.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install only the data-plane dependencies
        run: python -m pip install --quiet pandas pyarrow boto3 pyyaml requests

      - name: publish Company Intelligence, then build its exact sidecar
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          TERMINAL_TX_INDEX_URL: https://app.mastermind-x.com/data/tx/index.json
        run: |
          set -uo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/company-intelligence/output"
          ARGS=(--work-dir "$RUNNER_TEMP/company-intelligence" --out-dir "$OUTPUT_DIR" --terminal-tx-index-url "$TERMINAL_TX_INDEX_URL")
          if [ "${DRY_RUN:-false}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          set +e
          python -m scripts.refresh_company_intelligence "${ARGS[@]}"
          rc=$?
          set -e
          # A producer won the root-marker compare-and-swap after our complete
          # immutable tree uploaded. That is safe: retain its marker and retry
          # on the next schedule rather than reporting a false incident.
          if [ "$rc" -eq 2 ]; then
            echo "::notice title=company-intelligence::root manifest promotion lost a safe compare-and-swap race"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          # This runs only after Company Intelligence returned a true success
          # (never after its safe lost-CAS race). The sidecar reads the exact
          # persistent marker/tree that CIE has just verified and promoted.
          SIDE_ARGS=(
            --company-intelligence-dir "$OUTPUT_DIR"
            --membership data/baskets/membership.json
            --crosswalk config/theme_crosswalk.yml
            --theme-state data/neuralweb/theme_state.json
            --out-dir "$RUNNER_TEMP/company-theme-exposure"
          )
          if [ "${DRY_RUN:-false}" = "true" ]; then
            SIDE_ARGS+=(--as-of "$(date -u +%F)")
          fi
          python -m scripts.build_company_theme_exposure "${SIDE_ARGS[@]}"
          PUBLISH_ARGS=(--out-dir "$RUNNER_TEMP/company-theme-exposure")
          if [ "${DRY_RUN:-false}" = "true" ]; then
            PUBLISH_ARGS+=(--dry-run)
          fi
          set +e
          python -m scripts.publish_company_theme_exposure_r2 "${PUBLISH_ARGS[@]}"
          side_rc=$?
          set -e
          if [ "$side_rc" -eq 2 ]; then
            echo "::notice title=company-theme-exposure::root manifest promotion lost a safe compare-and-swap race"
            exit 0
          fi
          exit "$side_rc"
