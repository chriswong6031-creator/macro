name: daily-engine-setup-retry

# GitHub can rarely double-dispatch a busy self-hosted runner.  The second job
# cancels the first worker during GitHub's own Set up job step, before checkout
# or any repository code runs.  daily.yml's long downstream graph then keeps
# moving, so a green tail can otherwise hide that the sole authoritative engine
# (and therefore Prophet) never ran.
#
# This is not a generic retry lane.  After a daily attempt is fully terminal it
# asks a fail-closed controller to re-run exactly one job only when engine is the
# attempt's sole cancelled job and Set up job is its sole executed step.  GitHub
# re-runs that job plus its dependents.  Timeouts, build failures, mass/operator
# cancellations, untrusted refs, and attempt 2+ are all hard no-ops.
on:
  workflow_run:
    workflows: [daily]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: daily-engine-setup-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-setup-cancelled-engine:
    if: >-
      github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'schedule'
      || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          filter: blob:none
          sparse-checkout: scripts/ci/retry_daily_engine_setup_cancel.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: evaluate setup-only engine cancellation and retry once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/retry_daily_engine_setup_cancel.py
