name: TFG-0 transcript format census spike

on:
  push:
    branches:
      - sol/tfg0-transcript-format-census-20260827

permissions:
  contents: read

jobs:
  freeze-corpus:
    name: Freeze TFG-0 development corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Freeze corpus from production transcript index
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time
          from datetime import date, datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          TX_INDEX = 'https://app.mastermind-x.com/data/tx/index.json'
          UA = 'Mastermind TFG-0 transcript format census admin@macro-dashboard.example.com'
          OPERATION = 'tfg0-transcript-format-census-20260827-v1'
          EXCLUDED = {'AAPL','GOOGL','GOOG','CAT','BAC','SNOW'}
          START = date(2026,5,1)
          END = date(2026,8,26)
          TAKE = 16

          def fetch(url: str, retries: int = 3) -> bytes:
              last = None
              for attempt in range(retries):
                  req = Request(url, headers={'User-Agent': UA, 'Accept': 'application/json', 'Cache-Control': 'no-cache'})
                  try:
                      with urlopen(req, timeout=35) as r:
                          if int(r.status) != 200:
                              raise RuntimeError(f'{url} HTTP {r.status}')
                          return r.read()
                  except (HTTPError, URLError, TimeoutError, OSError) as exc:
                      last = exc
                      if attempt < retries - 1:
                          time.sleep(1.5 * (attempt + 1)); continue
                      raise RuntimeError(f'network failure {url}: {exc}') from exc
              raise RuntimeError(str(last))

          raw = fetch(TX_INDEX)
          index = json.loads(raw.decode('utf-8'))
          if index.get('schema') != 'mastermind.tx-index/v1':
              raise RuntimeError('unexpected transcript index schema')
          symbols = index.get('symbols') or {}
          revisions = index.get('revisions') or {}
          dates = index.get('dates') or {}
          eligible = []
          for raw_ticker, ids in symbols.items():
              ticker = str(raw_ticker or '').strip().upper()
              if ticker in EXCLUDED or not isinstance(ids, list):
                  continue
              for raw_id in ids:
                  txid = str(raw_id or '').strip().upper()
                  if txid not in {'2026Q2','2026Q3'}:
                      continue
                  pair = f'{ticker}/{txid}'
                  sha = str(revisions.get(pair) or '').strip().lower()
                  d = str(dates.get(pair) or '').strip()[:10]
                  if not re.fullmatch(r'[0-9a-f]{64}', sha):
                      continue
                  try:
                      call_date = date.fromisoformat(d)
                  except ValueError:
                      continue
                  if not (START <= call_date <= END):
                      continue
                  sel = hashlib.sha256(f'TFG0|{pair}|{sha}'.encode()).hexdigest()
                  eligible.append({'pair':pair,'ticker':ticker,'transcript_id':txid,'body_sha256':sha,'call_date':call_date.isoformat(),'selection_hash':sel})
          eligible.sort(key=lambda r:(r['selection_hash'],r['pair']))
          selected = eligible[:TAKE]
          if len(selected) != TAKE:
              raise RuntimeError(f'eligible corpus too small: {len(selected)} < {TAKE}')
          out = {
              'schema':'tfg0.development_corpus_selection.v1',
              'operation_key':OPERATION,
              'frozen_at':datetime.now(timezone.utc).isoformat(),
              'selection_law':'sha256(TFG0|pair|body_sha256), ascending; first 16',
              'excluded_symbols':sorted(EXCLUDED),
              'eligibility':{'call_date_start':START.isoformat(),'call_date_end':END.isoformat(),'transcript_ids':['2026Q2','2026Q3'],'requires_advertised_sha256':True},
              'tx_index':{'schema':index.get('schema'),'generated_at':index.get('generated_at'),'body_count':index.get('body_count'),'symbol_count':index.get('symbol_count'),'raw_sha256':hashlib.sha256(raw).hexdigest()},
              'eligible_count':len(eligible),
              'selected':selected,
              'selected_count':len(selected),
              'bodies_inspected_before_freeze':0,
          }
          open('tfg0_selection.json','w',encoding='utf-8').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload frozen corpus
        uses: actions/upload-artifact@v4
        with:
          name: tfg0-selection-${{ github.run_id }}
          path: tfg0_selection.json
          retention-days: 14

  census:
    name: Measure frozen TFG-0 corpus
    needs: freeze-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen corpus
        uses: actions/download-artifact@v4
        with:
          name: tfg0-selection-${{ github.run_id }}
      - name: Measure source-format structure
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import gzip, hashlib, json, re, time
          from collections import Counter
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          from engine.company_intelligence.qa_reconstruction import reconstruct_qa

          TX_BASE = 'https://app.mastermind-x.com/data/tx'
          UA = 'Mastermind TFG-0 transcript format census admin@macro-dashboard.example.com'
          selection = json.load(open('tfg0_selection.json',encoding='utf-8'))
          OPERATION = selection['operation_key']

          def fetch(url: str, retries: int = 3) -> bytes:
              last = None
              for attempt in range(retries):
                  req = Request(url, headers={'User-Agent': UA, 'Accept': 'application/gzip', 'Cache-Control': 'no-cache'})
                  try:
                      with urlopen(req, timeout=35) as r:
                          if int(r.status) != 200:
                              raise RuntimeError(f'{url} HTTP {r.status}')
                          return r.read()
                  except (HTTPError, URLError, TimeoutError, OSError) as exc:
                      last = exc
                      if attempt < retries - 1:
                          time.sleep(1.5 * (attempt + 1)); continue
                      raise RuntimeError(f'network failure {url}: {exc}') from exc
              raise RuntimeError(str(last))

          def canonical_body_sha(payload: dict) -> str:
              raw = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',',':')).encode('utf-8')
              return hashlib.sha256(raw).hexdigest()

          def norm(text: object) -> str:
              return ' '.join(str(text or '').split())

          def clipped(text: object, limit: int = 320) -> str:
              value = norm(text)
              return value if len(value) <= limit else value[:limit-1] + '…'

          rows=[]
          for slot, item in enumerate(selection['selected']):
              pair=item['pair']; ticker=item['ticker']; txid=item['transcript_id']
              url=f"{TX_BASE}/{quote(ticker,safe='.-^')}/{quote(txid,safe='')}.json.gz"
              row={'slot':slot,'pair':pair,'ticker':ticker,'transcript_id':txid,'advertised_sha256':item['body_sha256'],'call_date':item['call_date'],'selection_hash':item['selection_hash'],'url':url}
              try:
                  gz=fetch(url)
                  payload=json.loads(gzip.decompress(gz).decode('utf-8'))
                  actual=canonical_body_sha(payload)
                  row['gzip_bytes']=len(gz); row['actual_sha256']=actual
                  row['sha_match']=(actual==item['body_sha256'])
                  row['schema']=payload.get('schema')
                  row['identity_match']=(str(payload.get('ticker') or '').upper()==ticker and str(payload.get('id') or '').upper()==txid)
                  if not row['sha_match'] or row['schema']!='mastermind.tx/v1' or not row['identity_match']:
                      row['state']='SOURCE_REVISION_MISMATCH'; rows.append(row); continue
                  segs=payload.get('segments') if isinstance(payload.get('segments'),list) else []
                  row['state']='byte_replayed'; row['segment_count']=len(segs)
                  role_counts=Counter(norm(s.get('role')) for s in segs)
                  row['role_counts']=dict(sorted(role_counts.items()))
                  op=[]
                  for i,s in enumerate(segs):
                      role=norm(s.get('role')).casefold(); speaker=norm(s.get('speaker')).casefold(); text=norm(s.get('text')); low=text.casefold()
                      is_op=(role=='operator' or speaker=='operator' or speaker.endswith(' operator'))
                      if not is_op: continue
                      flags={
                          'contains_question':'question' in low,
                          'go_ahead':'go ahead' in low,
                          'line_open':'line is now open' in low or 'line is open' in low,
                          'may_proceed':'may proceed' in low,
                          'next_question':'next question' in low,
                          'first_question':'first question' in low,
                          'question_comes_from':'question comes from' in low,
                          'question_from':'question from' in low,
                      }
                      if flags['contains_question'] or any(v for k,v in flags.items() if k!='contains_question'):
                          op.append({'segment_index':i,'text':clipped(text),'flags':flags})
                  row['operator_candidate_segments']=op
                  row['operator_segment_count']=sum(1 for s in segs if norm(s.get('role')).casefold()=='operator' or norm(s.get('speaker')).casefold()=='operator')
                  qidx=[x['segment_index'] for x in op if x['flags']['contains_question']]
                  first_q=min(qidx) if qidx else len(segs)
                  intro=[]
                  for i,s in enumerate(segs[:min(first_q+1,25)]):
                      role=norm(s.get('role')); speaker=norm(s.get('speaker')); text=norm(s.get('text'))
                      low=text.casefold()
                      if role.casefold() in {'operator','ir','investor relations'} or any(token in low for token in ('chief executive','chief financial','president','investor relations','ceo','cfo','chairman','chairwoman','executive officer')):
                          intro.append({'segment_index':i,'role':role,'speaker':speaker,'text':clipped(text,500)})
                  row['intro_identity_evidence']=intro
                  prepared_speakers=[]
                  seen=set()
                  for i,s in enumerate(segs[:first_q]):
                      sp=norm(s.get('speaker')); role=norm(s.get('role'))
                      if sp and sp.casefold()!='operator' and sp not in seen:
                          prepared_speakers.append({'speaker':sp,'role':role,'first_segment_index':i}); seen.add(sp)
                  row['prepared_speakers']=prepared_speakers
                  result=reconstruct_qa(event_id='evt_cik0000000000_2026q2_results',document_id=f'tx:{pair}',document_sha256=actual,segments=segs)
                  row['current_compiler']={'status':result.get('status'),'exchange_count':len(result.get('exchanges') or []),'qualifying_boundaries':result.get('qualifying_boundaries') or [],'failure':result.get('failure')}
              except Exception as exc:
                  row['state']='FETCH_OR_DECODE_FAILED'; row['error']=f'{type(exc).__name__}: {exc}'
              rows.append(row)

          summary={
              'byte_replayed':sum(r.get('state')=='byte_replayed' for r in rows),
              'source_revision_mismatch':sum(r.get('state')=='SOURCE_REVISION_MISMATCH' for r in rows),
              'fetch_or_decode_failed':sum(r.get('state')=='FETCH_OR_DECODE_FAILED' for r in rows),
              'compiler_ok':sum((r.get('current_compiler') or {}).get('status')=='ok' for r in rows),
              'compiler_failed':sum((r.get('current_compiler') or {}).get('status')=='failed' for r in rows),
              'compiler_empty_or_other':sum((r.get('current_compiler') or {}).get('status') not in {'ok','failed'} for r in rows if r.get('state')=='byte_replayed'),
          }
          out={'schema':'tfg0.transcript_format_census.v1','operation_key':OPERATION,'measured_at':datetime.now(timezone.utc).isoformat(),'selection':selection,'summary':summary,'rows':rows,'model_calls':0,'excluded_oos_bodies_inspected':0}
          open('tfg0_census.json','w',encoding='utf-8').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'schema':out['schema'],'operation_key':OPERATION,'summary':summary,'selected_pairs':[r['pair'] for r in rows]},indent=2))
          PY
      - name: Upload format census
        uses: actions/upload-artifact@v4
        with:
          name: tfg0-format-census-${{ github.run_id }}
          path: |
            tfg0_selection.json
            tfg0_census.json
          retention-days: 14
