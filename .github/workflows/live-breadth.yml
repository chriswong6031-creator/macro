name: live-breadth
# Backstop lane for the live intraday breadth poller (Phase 2 of the Live Tape
# program — research/LIVE_TAPE_SCOREBOARD_MASTERPLAN.md §4, D6/D7).
#
# The PRIMARY producer is the installed `macro-live-breadth` systemd timer
# (app/deploy/macro-live-breadth.service/.timer, wired into
# app/deploy/live-setup.sh — FROZEN CONTRACT §7), polling every ~2 min across
# the US session on the VPS host. GH cron cannot hold a 1-2 min cadence
# (best-effort ~15-45 min), so this workflow is only the COARSE floor: when the
# host lane is down it still refreshes site/live/breadth.json every ~30 min
# during RTH so the surface never goes fully stale. `VPS_LIVE_PRIMARY=true` may
# only be set once production breadth (the systemd lane, not just the backstop)
# is proven live — the truth boundary in engine/live_breadth.py's
# `evaluate_usable` means a degraded/stale run from EITHER producer can never
# overwrite the baked nightly board regardless of which one is primary.
#
# Runs ONE cycle with --publish (the same site/live/*.json commit-to-main path
# the intraday-fastpath uses for overlay.json). site/live/ is gitignored and
# force-tracked; the poller's own git add/commit/push handles the publish and is
# INERT on any git failure.
#
# Feed is ~15-min-delayed Polygon STANDARD (delay_min stamped honestly). Set the
# POLYGON_API_KEY repo secret to arm it; absent a key the poller emits a
# fail-soft empty-tiers payload (the surface falls back to the baked nightly
# numbers).
on:
  schedule:
    # :05 + :35 past the hour, 13:00-20:59 UTC, Mon-Fri (roughly US premarket
    # through the close). Offset from the intraday-fastpath (:00/:30) so the two
    # commit lanes don't collide on the same tick.
    - cron: "5,35 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Only the latest breadth snapshot matters — cancel any in-flight run.
  group: live-breadth
  cancel-in-progress: true

jobs:
  poll:
    # Cutover guard (mirrors intraday-fastpath): the scheduled backstop is
    # disabled once the VPS host loop is primary (VPS_LIVE_PRIMARY=true); manual
    # dispatch always remains as the recovery path.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.VPS_LIVE_PRIMARY != 'true' }}
    runs-on: [self-hosted, macstudio-light]   # light runner: never queue behind nightly/render on the macstudio pool; the baked breadth caches are already on the box
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: poll breadth once + publish
        # RTH/holiday gate is inside session_tag/delay stamping (lib.nyse_calendar); the
        # poller always emits with an honest `session` value. A requested `--publish`
        # that fails now REDS this run (FROZEN CONTRACT §2d/§8) — no more swallowed
        # `|| echo "::warning"` green lie. A poll failure never corrupts the last
        # committed breadth.json (it is a tracked file the poller only replaces on a
        # successful write+commit), so a red run here means "investigate", not "outage".
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MACRO_LIVE_PRODUCER: gh:live-breadth-backstop
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          python -m scripts.live_breadth_poller --once --publish
