name: key-pool-probe
# Operator diagnostics: verify each CLAUDE_CODE_OAUTH_TOKEN_1..7 (+ legacy)
# secret actually authenticates, with one minimal (max_tokens=1) API call per
# present key. Run after setting/rotating keys (arming checklist Act 1).
#
# Deliberately NOT gated on AUTONOMY_PAUSED: this is a read-only credential
# health check, not a loop stage — it authors nothing, writes nothing, and
# never prints a token value (all credential handling stays inside
# engine/llm_auth, the sanctioned boundary). A red run = at least one PRESENT
# key is failing (absent keys don't fail the probe — the pool degrades
# gracefully by design).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner to probe from. Use self-hosted-macstudio for a
          production-shaped answer: the metabolism lanes run there, and
          GitHub-hosted runner IPs can be 429'd by the API even when the
          keys themselves have quota.
        type: choice
        default: self-hosted-macstudio
        options:
          - self-hosted-macstudio
          - ubuntu-latest

permissions:
  contents: write   # narrow-commit key_budget_status.json after probe

jobs:
  probe:
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || fromJSON('["self-hosted","macstudio"]') }}
    timeout-minutes: 30
    steps:
      # Sparse checkout: the probe needs only the auth boundary + its script.
      # A full checkout of this multi-GB repo on the busy macstudio runner
      # blew the old 10-minute timeout during checkout (run 29182955692).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # cone-mode sparse checkout accepts DIRECTORIES only (config.yml
          # broke run 29183504267); the probe never reads config.yml — the
          # auth path (lib.config.secret) is env-var only.
          sparse-checkout: |
            engine
            lib
            scripts
            config
            data/metabolism
      # Homebrew venv, not actions/setup-python: on the self-hosted Macs the
      # hostedtoolcache dir (/Users/runner) doesn't exist and setup-python
      # dies with "mkdir: /Users/runner: Permission denied" (probe run
      # 29303838296 on actions-runner-3). Mirrors metabolism-cycle.yml.
      # macOS-only: /opt/homebrew/bin/python3.12 doesn't exist on ubuntu-latest,
      # so the ubuntu-latest dispatch option gets setup-python instead.
      - name: python 3.12 (Homebrew venv - self-hosted macOS runner)
        if: runner.os == 'macOS'
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - name: python 3.12 (setup-python - ubuntu-latest fallback)
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install --quiet anthropic pyyaml
      - name: probe each key (1-token call; names only, never values)
        env:
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          CLAUDE_CODE_OAUTH_TOKEN_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -m scripts.key_pool_probe
      - name: write budget status snapshot
        env:
          # OAuth pool for budget_gate presence-based key discovery (mirrors probe step above).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          CLAUDE_CODE_OAUTH_TOKEN_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
        run: python -m engine.metabolism.budget_gate --mode manual --write-status 2>/dev/null || true
      - name: narrow-commit key_budget_status.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/metabolism/key_budget_status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "key_budget_status.json unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "probe: update key_budget_status.json [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "pushed key_budget_status.json on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i lost race; re-syncing"
            sleep $((i * 5))
          done
          echo "could not push key_budget_status.json after 5 attempts (non-fatal)"
          exit 0
