name: cycle-calibration
# W1.5 ops lane — cycle-intelligence calibration, validation, and forward-log
# integrity checks. Runs on its own concurrency group so it never blocks (and
# is never blocked by) the main pipeline-batch lane (weekly / backfill /
# special-sits) or the pipeline-daily lane.
#
# Semantics: every step is either:
#   HARD    — failure blocks this lane but never the main pipeline (abort-lane)
#   LOG     — failure is annotated + written to the run summary but the job
#             continues and the exit code stays 0 (log-and-skip / fail-open)
#
# All steps are guarded: if the script or test file doesn't exist, the step
# is a no-op.  This makes the workflow safe to merge before every downstream
# wave has landed.
#
# Future calibration / backfill steps (D2 backfill.py, D5 hazard fits, D4
# basis-audit, epoch-homogeneity check, stale-tape report) slot in below the
# existing steps — each must declare its semantics and runtime estimate.

on:
  schedule:
    - cron: "0 18 1 * *"    # 1st of each month, 18:00 UTC — outside the weekly
                             # Saturday window so the two lanes never queue
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Dedicated lane — completely isolated from pipeline-batch (weekly/backfill/
  # special-sits) and pipeline-daily (daily.yml).  cancel-in-progress:false so
  # a slow calibration run is never silently dropped by a concurrent dispatch.
  group: cycle-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60    # generous: the lane is currently cheap (tests only);
                           # raise when heavy D2/D5 fits are added
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: |
          pip install --quiet "pytest<9" pandas numpy pyarrow pyyaml scipy

      # ── HARD: gen_ontology_js --check ──────────────────────────────────────
      # The generated site/cycle_ontology.js must exactly match what
      # engine/cycle_ontology.py produces.  A drift here means pages could ship
      # stale ontology data.  Semantics: ABORT-LANE (hard failure).
      # Added: W1.5.  Script merged: W1.2 (#940).
      - name: "HARD | gen_ontology_js --check (ontology JS not drifted)"
        run: |
          if [ ! -f scripts/gen_ontology_js.py ]; then
            echo "scripts/gen_ontology_js.py not present — skipping (pre-W1.2)"
            exit 0
          fi
          python3 -m scripts.gen_ontology_js --check

      # ── HARD: forward-log writer tests ─────────────────────────────────────
      # Four acceptance criteria for the W0.2 shared forward-log writer:
      # keep-FIRST invariant, cone-edge ordering, never-raise on empty input,
      # proj_lo/hi populated.  Semantics: ABORT-LANE (hard failure).
      # Added: W1.5.  Tests merged: wave/w0-2-3-forward-logs-and-basis (#913).
      - name: "HARD | forward-log writer tests (keep-FIRST, cone edges)"
        run: |
          if [ ! -f tests/test_cycle_forward_log.py ]; then
            echo "tests/test_cycle_forward_log.py not present — skipping (pre-W0.2)"
            exit 0
          fi
          python -m pytest tests/test_cycle_forward_log.py -q

      # ── HARD: grading_stats library tests ──────────────────────────────────
      # Covers wilson_ci, block_bootstrap_ci, fdr_bh, cone_coverage,
      # effective_n, dd_verdict, entry_pos, assert_convention, and the
      # China-grader regression (refactored == pre-refactor on fixed inputs).
      # Semantics: ABORT-LANE (hard failure).
      # Added: W1.5.  Tests merged: W1.1 (#939).
      - name: "HARD | grading_stats library tests (one implementation, no split)"
        run: |
          if [ ! -f tests/test_grading_stats.py ]; then
            echo "tests/test_grading_stats.py not present — skipping (pre-W1.1)"
            exit 0
          fi
          python -m pytest tests/test_grading_stats.py -q

      # ── HARD: BC-2 'validated' grep gate (W4.6) ────────────────────────────
      # BC-2 (PREREGISTRATION.md §4): the word "validated"/"已验证" may appear in a
      # user-facing surface ONLY where it maps to a backing artifact (validated:true)
      # or a justified entry in data/regime/validated_claims_allowlist.json. A NEW
      # unearned 'validated' claim (EN or zh) fails this step. Structural non-claims
      # (engine-stamped data-field values, CSS class tokens, i18n label pairs) and
      # negated/hedged uses ('no validated edge', 'unvalidated') are skipped by
      # construction. Semantics: ABORT-LANE (hard failure). Added: W4.6.
      - name: "HARD | check_validated_claims (BC-2: no unearned 'validated' EN+zh)"
        run: |
          if [ ! -f scripts/check_validated_claims.py ]; then
            echo "scripts/check_validated_claims.py not present — skipping (pre-W4.6)"
            exit 0
          fi
          python3 -m scripts.check_validated_claims --selftest
          python3 -m scripts.check_validated_claims

      # ── LOG: CPI lake rebuild (monthly; P2) ────────────────────────────────
      # Re-runs the full cycle-pattern lake build (entity registry + state_monthly
      # parquet) from the committed backfill artifacts.  Semantics: LOG-AND-SKIP
      # (fail-open — a lake failure must never block the calibration lane; the
      # last-good parquet stays in place).  Guarded: no-op if the script is absent.
      # Estimated runtime: <2 min on 2-core (committed backfill only).  Added: P2.
      - name: "LOG | build_cycle_pattern_lake (monthly lake rebuild)"
        run: |
          if [ ! -f scripts/build_cycle_pattern_lake.py ]; then
            echo "scripts/build_cycle_pattern_lake.py not present — skipping"
            exit 0
          fi
          python3 -m scripts.build_cycle_pattern_lake || true

      # ── LOG: CPI outcomes rebuild (monthly; P2) ─────────────────────────────
      # Re-runs the cycle-pattern outcomes builder from the committed lake.
      # Semantics: LOG-AND-SKIP (fail-open).  Guarded: no-op if the script is absent.
      # Estimated runtime: <1 min.  Added: P2.
      - name: "LOG | build_cycle_pattern_outcomes (outcomes rebuild)"
        run: |
          if [ ! -f scripts/build_cycle_pattern_outcomes.py ]; then
            echo "scripts/build_cycle_pattern_outcomes.py not present — skipping"
            exit 0
          fi
          python3 -m scripts.build_cycle_pattern_outcomes || true

      # ── HARD: cycle-pattern authority guard (P2) ────────────────────────────
      # No Article-2 money-path module (alert_triage / board_ordering / top_setups)
      # may read data/cycle_pattern/ — the CPI substrate is display-only (context
      # tier).  Mirrors check_research_factory_authority in the research-factory-
      # authority ci.yml job.  Semantics: ABORT-LANE (hard failure).  Added: P2.
      # Guarded: no-op if the script is absent (safe to merge before P2 lands).
      - name: "HARD | check_cycle_pattern_authority (CPI: no money-path reads of cycle-pattern lake)"
        run: |
          if [ ! -f scripts/check_cycle_pattern_authority.py ]; then
            echo "scripts/check_cycle_pattern_authority.py not present — skipping"
            exit 0
          fi
          python3 -m scripts.check_cycle_pattern_authority --selftest
          python3 -m scripts.check_cycle_pattern_authority

      # ── HARD: risk-calibration binding tests (W4.6) ────────────────────────
      # vol-residualization math, embargo IMMUTABILITY, binding fallback byte-identity,
      # null-cell discipline, grep-gate EN+zh firing. Semantics: ABORT-LANE. Added: W4.6.
      - name: "HARD | ladder-risk-calibration tests (vol-resid, embargo, null-cell)"
        run: |
          if [ ! -f tests/test_ladder_risk_calibration.py ]; then
            echo "tests/test_ladder_risk_calibration.py not present — skipping (pre-W4.6)"
            exit 0
          fi
          python -m pytest tests/test_ladder_risk_calibration.py -q

      # ── LOG: refit the risk-channel calibration + DIFF-AND-ALERT (W4.6, R1) ──
      # Re-runs scripts.fit_ladder_risk_calibration on the committed keystone cohort and
      # LOUDLY summarizes any (state x family) risk_size_mult that changed by >10% vs the
      # committed artifact. A refit changes LIVE sizing behavior with NO code diff — this
      # is the R1 reflexivity containment: a silent weight drift becomes a visible run-
      # summary alert. Semantics: LOG-AND-SKIP (never blocks the lane; the last-good
      # artifact stays committed until a human commits the refit). It reads only committed
      # artifacts (keystone backfill + TR close panel) — cheap (<1 min). Added: W4.6.
      - name: "LOG | risk-calibration refit → diff-and-alert (>10% weight change)"
        run: |
          if [ ! -f scripts/fit_ladder_risk_calibration.py ]; then
            echo "scripts/fit_ladder_risk_calibration.py not present — skipping (pre-W4.6)"
            exit 0
          fi
          OLD=data/regime/ladder_risk_calibration.json
          cp -f "$OLD" "$RUNNER_TEMP/ladder_risk_calibration.prev.json" 2>/dev/null || true
          python -m scripts.fit_ladder_risk_calibration || { echo "refit failed (fail-open)"; exit 0; }
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          import json, os
          new = json.load(open("data/regime/ladder_risk_calibration.json"))
          prev_p = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "ladder_risk_calibration.prev.json")
          print("## W4.6 risk-calibration refit — diff-and-alert")
          print()
          if not os.path.exists(prev_p):
              print("No committed artifact to diff against (first run). No alert.")
              raise SystemExit
          prev = json.load(open(prev_p))
          def flat(d):
              out = {}
              for fam, sts in (d.get("risk_size_mult") or {}).items():
                  for st, c in sts.items():
                      out[(fam, st)] = c.get("risk_size_mult", 1.0) if isinstance(c, dict) else float(c)
              return out
          a, b = flat(prev), flat(new)
          changed = []
          for k in sorted(set(a) | set(b)):
              o, n = a.get(k, 1.0), b.get(k, 1.0)
              base = abs(o) if o else 1.0
              if abs(n - o) / base > 0.10:
                  changed.append((k, o, n))
          print(f"- prev version: `{prev.get('version')}`  →  new version: `{new.get('version')}`")
          print(f"- validated: prev={prev.get('validated')} new={new.get('validated')}")
          print(f"- BC-1: prev={prev.get('bc1',{}).get('verdict')} new={new.get('bc1',{}).get('verdict')}")
          if not changed:
              print("- **No (state × family) risk_size_mult changed by >10%.** Behavior stable.")
          else:
              print(f"- ⚠️ **{len(changed)} weight(s) changed by >10% — refit alters LIVE sizing:**")
              print()
              print("| family | state | old | new |")
              print("|---|---|---|---|")
              for (fam, st), o, n in changed:
                  print(f"| {fam} | {st} | {o} | {n} |")
              print()
              print("**Action:** review the refit before committing the new artifact. A weight moved "
                    "with no code diff — confirm the data change that drove it (R1 reflexivity containment).")
          # restore committed artifact so the refit is never silently committed by CI
          import shutil
          shutil.copyfile(prev_p, "data/regime/ladder_risk_calibration.json")
          print()
          print("_(committed artifact restored; CI never commits a refit — a human does)_")
          PY
          cp -f "$RUNNER_TEMP/ladder_risk_calibration.prev.json" "$OLD" 2>/dev/null || true

      # ── Slot: D2 PIT backfill integrity check (planned, W2.3) ──────────────
      # When merged: python -m scripts.check_backfill_integrity --warn
      # Semantics: LOG-AND-SKIP (fail-open; stale backfill stays in place).
      # Estimated runtime: ~5 min on 2-core.
      # - name: "LOG | backfill.parquet epoch homogeneity (planned W2.3)"
      #   run: |
      #     if [ ! -f scripts/check_backfill_integrity.py ]; then exit 0; fi
      #     python -m scripts.check_backfill_integrity --warn || true

      # ── HARD: promise-grader unit tests (W2.4) ─────────────────────────────
      # The three promise-graders (turn P/R, cone coverage, reliability) + the
      # INDEPENDENT realized-extrema turn truth (ruling A6).  Covers: truth
      # independence from ZigZag params, matching-rule correctness, cone-
      # containment math, BACKTEST/LIVE separation, A2 projection dedup.
      # Semantics: ABORT-LANE (hard failure).  Added: W2.4.
      - name: "HARD | promise-grader tests (turn P/R, cone, reliability, A6 truth)"
        run: |
          if [ ! -f tests/test_promise_graders.py ]; then
            echo "tests/test_promise_graders.py not present — skipping (pre-W2.4)"
            exit 0
          fi
          python -m pytest tests/test_promise_graders.py -q

      # ── LOG: run the three promise-graders → refresh the scorecards (W2.4) ──
      # Regrades the 12,519 backfilled monthly PIT stamps + the live cohort and
      # re-emits data/<engine>/scorecards/promises_<epoch>.json,
      # data/cycle_ontology/cone_recalibration.json, and the W24 scorecard MD.
      # Semantics: LOG-AND-SKIP (fail-open — a grader failure must never block the
      # calibration lane; the last-good scorecard stays in place).  It reads only
      # committed artifacts (backfill.parquet + price panel), does NO engine
      # compute, and writes JSON — cheap (<1 min).  Guarded: no-op if the script
      # is absent.  Estimated runtime: ~30 s on 2-core.
      - name: "LOG | promise-graders → refresh scorecards (W2.4)"
        run: |
          if [ ! -f scripts/grade_promises.py ]; then
            echo "scripts/grade_promises.py not present — skipping (pre-W2.4)"
            exit 0
          fi
          python -m scripts.grade_promises --verbose || true
          # NOTE: this lane has permissions: contents: read — it does NOT commit
          # the refreshed scorecard JSONs.  site/measurement.html is rebuilt nightly
          # by daily.yml (cl_misc cluster, scripts.build_measurement step), so the
          # page lags a regrade by at most one night.

      # ── Slot: D4 price-basis audit (planned, W2.2) ─────────────────────────
      # When merged: python -m scripts.audit_price_basis --report
      # Semantics: LOG-AND-SKIP (basis audit informs; never blocks calibration).
      # - name: "LOG | price-basis audit report (planned W2.2)"
      #   run: |
      #     if [ ! -f scripts/audit_price_basis.py ]; then exit 0; fi
      #     python -m scripts.audit_price_basis --report || true

      # ── Slot: D3 stale-tape check (planned, W3.x) ──────────────────────────
      # When merged: python -m scripts.check_cycle_tape_freshness --warn
      # Semantics: LOG-AND-SKIP (stale tape writes DATA_MISSING chip; lane continues).
      # - name: "LOG | stale-tape freshness check (planned W3)"
      #   run: |
      #     if [ ! -f scripts/check_cycle_tape_freshness.py ]; then exit 0; fi
      #     python -m scripts.check_cycle_tape_freshness --warn || true

      # ── HARD: hazard fit gate-math tests (W4.2) ────────────────────────────
      # Protects the skill-gate machinery: logistic gradient check, PAV monotonicity,
      # walk-forward split integrity (no date overlap / expanding origin / embargo),
      # gate math (synthetic PASS + synthetic PRIOR), BH-FDR, no-sklearn guard, and the
      # price-basis EPOCH SANITY invariant (panel turns are close_price, not TR).
      # Semantics: ABORT-LANE (hard failure).  Added: W4.2.  Guarded no-op pre-W4.2.
      - name: "HARD | hazard fit gate-math tests (grad, PAV, walk-forward, FDR, epoch)"
        run: |
          if [ ! -f tests/test_cycle_hazard_fit.py ]; then
            echo "tests/test_cycle_hazard_fit.py not present — skipping (pre-W4.2)"
            exit 0
          fi
          python -m pytest tests/test_cycle_hazard_fit.py -q

      # ── LOG: hazard model freshness / epoch integrity (W4.2) ───────────────
      # Stat-check only (NO refit): a >100d-stale model or a lingering TR-epoch panel
      # warns and downstream degrades to the KM prior.  The heavy monthly refit
      # (scripts/fit_cycle_hazard) is a separate scheduled/manual step — not run here.
      # Semantics: LOG-AND-SKIP (fail-open; warn-only, never blocks the lane).
      # Estimated runtime: <1 min (stat check).  Guarded: no-op if the script is absent.
      - name: "LOG | hazard model freshness (<100d stale, price epoch) (W4.2)"
        run: |
          if [ ! -f scripts/check_hazard_model_freshness.py ]; then
            echo "scripts/check_hazard_model_freshness.py not present — skipping (pre-W4.2)"
            exit 0
          fi
          python -m scripts.check_hazard_model_freshness || true

      # ── Failure summary ─────────────────────────────────────────────────────
      # Runs even when a HARD step above failed so CI gets a readable summary.
      # This is the minimal alert pattern consistent with this repo: the hard
      # steps already annotate via GitHub's ::error:: mechanism; this step adds
      # a structured summary table for the run page.
      #
      # Note: the repo's production alerting path is python -m scripts.notify
      # (Telegram/Discord secrets).  That script reads run_status.json which is
      # only written by the main pipeline; wiring it here would fire on test
      # noise.  Until the calibration lane writes its own status artifact, the
      # GitHub annotation + run-summary is the alert mechanism.  See OPS_GATES.md
      # §5 for the gap registry.
      - name: calibration failure summary
        if: failure()
        run: |
          {
            echo "## cycle-calibration failure summary — $(date -u +%F)"
            echo ""
            echo "One or more HARD gates failed in this run.  Check the step"
            echo "annotations above for details."
            echo ""
            echo "| Gate | Status |"
            echo "|---|---|"
            echo "| gen_ontology_js --check      | see above |"
            echo "| test_cycle_forward_log       | see above |"
            echo "| test_grading_stats           | see above |"
            echo "| check_validated_claims (BC-2) | see above |"
            echo "| check_cycle_pattern_authority (CPI P2) | see above |"
            echo "| test_ladder_risk_calibration | see above |"
            echo ""
            echo "Action: fix the failing script/test and re-dispatch this"
            echo "workflow.  The main pipeline-batch lane is unaffected."
          } >> "$GITHUB_STEP_SUMMARY"
