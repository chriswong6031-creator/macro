name: data-health

# W2 of research/CI_MERGE_GATE_RELIABILITY_ROOT_CAUSE_2026_08_19.md.
#
# The merge gate (ci.yml) now packs only `gate: code` legacy jobs — jobs
# whose verdict is a pure function of the pull request's tree. The other 74
# legacy jobs declare `gate: data`: their verdict can flip on a nightly/wire
# data commit alone, with no code change at all, which is why main was green
# only 44% of the time before this split (W1: research/
# CI_MERGE_GATE_RELIABILITY_ROOT_CAUSE_2026_08_19.md §0/§4). Moving those
# jobs off the merge gate does not delete the receipt they produce — this
# lane still runs every `gate: data` job and still surfaces a red to a human,
# it just does so AFTER the nightly writes the data tree those jobs assert
# against, instead of blocking every pull request on data the PR never
# touched.
#
# Triggered by the nightly (`workflow_run` on `daily` completing) so the pack
# runs against freshly-written data, plus a manual `workflow_dispatch` and a
# `schedule` fallback sweep in case the `workflow_run` trigger is ever missed
# (a `workflow_run` event never fires for a workflow that itself failed to
# start, so the schedule is the backstop, not a duplicate).
#
# GitHub-hosted runners only, deliberately (CLAUDE.md — render/nightly compute
# stays off this pool; self-hosted capacity is reserved for the render path).

on:
  workflow_run:
    workflows: ["daily"]
    types: [completed]
  workflow_dispatch: {}
  schedule:
    # 13:30 UTC: after the nightly's usual completion window, well clear of
    # the render lanes documented in CLAUDE.md. A fallback sweep only — the
    # `workflow_run` trigger above is the normal path.
    - cron: "30 13 * * *"

# One lane at a time, never cancelled mid-run: a cancelled pack would leave a
# false "still investigating" impression on the standing issue, and this lane
# is off the render path so there is no shared-pool reason to prefer a fresh
# run over letting an in-flight one finish (CLAUDE.md — never cancel or
# manually re-run an in-progress lane merely to unblock something else).
#
# The group is the LITERAL name, not suffixed by `github.event_name`. This
# workflow has three independent triggers (workflow_run, workflow_dispatch,
# schedule); an event-suffixed group would put each trigger in its own
# concurrency group, so a schedule firing while a workflow_run-triggered run
# is still in flight would run concurrently with it instead of queuing behind
# it — two `report` jobs racing to open the same standing issue. daily.yml's
# concurrency is deliberately event-split for an unrelated reason (cron must
# never serialize against a manual dispatch); this lane has the opposite
# requirement; one lane, one queue.
concurrency:
  group: data-health
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  data-pack:
    name: data-pack-${{ matrix.pack }}
    # Only run against data the nightly actually finished writing.
    # `types: [completed]` fires on failure/cancelled too, not only success,
    # and daily.yml has a deliberate DST no-op cron that also completes
    # without writing anything — asserting `gate: data` jobs against a tree
    # the nightly did NOT advance would misattribute a stale-data red to this
    # lane. workflow_dispatch and the schedule fallback are unconditional:
    # both are an operator/backstop choice to check the CURRENT tree, whatever
    # advanced it last.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # NEVER self-hosted. This lane is deliberately off the render/nightly
    # pool (CLAUDE.md — render budget is law); it runs on GitHub's hosted
    # capacity exactly like ci.yml's merge-gate packs.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # Sibling packs must finish so every data-gated job gets a chance to
      # report, the same reasoning ci.yml's ci-pack matrix documents for the
      # merge gate: one red pack must not cancel the other five.
      fail-fast: false
      matrix:
        pack: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          # Pinned to the exact patch release ci.yml's pack job pins, for the
          # same reason: engine/capital_structure/document_terms.py seals its
          # parser behind a runtime fingerprint allowlist that a floating
          # "3.12" can silently drift off of (2026-08-19, ci-pack-8). Several
          # `gate: data` jobs (e.g. capital-structure-intelligence) exercise
          # that same parser, so this lane needs the identical pin.
          python-version: "3.12.13"
      - uses: actions/setup-node@v4
        with:
          # Matches ci.yml's pack job exactly, so this lane honors the same
          # RUNNER_CONTRACT (ci-pack/ubuntu-latest/python-3.12/node-20/v1)
          # run_ci_pack.py's semantic digest pins every legacy job to — a
          # `gate: data` job whose steps assume Node 20 must see the same
          # infrastructure here as it would have on the merge gate.
          node-version: "20"
      - name: install isolated pack runner
        run: |
          python -m venv "$RUNNER_TEMP/data-health-runner"
          "$RUNNER_TEMP/data-health-runner/bin/pip" install pyyaml
      - name: run this pack's data-gated legacy jobs
        run: |
          "$RUNNER_TEMP/data-health-runner/bin/python" scripts/run_ci_pack.py \
            --workflow .github/ci/legacy-jobs.yml \
            --gate data \
            --pack-index ${{ matrix.pack }} \
            --pack-count 6 \
            --execute
      # A matrix job's aggregate `needs.<job>.result` tells the report job
      # WHETHER anything failed but not WHICH pack — GitHub does not publish
      # per-matrix-instance detail to a downstream job. Each failing instance
      # drops a small marker artifact instead; the artifact system needs no
      # extra token permission (it is a separate signed-URL upload, not a
      # `permissions:` scope), which keeps this workflow's token to exactly
      # `issues: write, contents: read`. This marker is a NAMING aid only —
      # the report job's pass/fail decision is `needs.data-pack.result`, not
      # marker presence, so a pack that is cancelled/timed-out before this
      # step runs still reds the report (see the report job below).
      - name: record this pack's failure marker
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/data-health-failures"
          echo "data-pack-${{ matrix.pack }}" > "$RUNNER_TEMP/data-health-failures/pack-${{ matrix.pack }}.txt"
      - name: upload failure marker
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-health-fail-${{ matrix.pack }}
          path: ${{ runner.temp }}/data-health-failures/pack-${{ matrix.pack }}.txt
          if-no-files-found: error
          retention-days: 14

  report:
    name: report
    needs: data-pack
    if: always()
    runs-on: ubuntu-latest
    steps:
      # No artifact is uploaded when every pack passes (or when every pack
      # was skipped by the nightly-success gate above), so a pattern download
      # here legitimately finds nothing; do not fail the report job over an
      # empty match. This download only supplies WHICH packs to name in the
      # issue body — the pass/fail DECISION below never reads it.
      - name: download any failure markers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: data-health-fail-*
          path: ${{ runner.temp }}/data-health-failures
          merge-multiple: true
      - name: file or update the standing data-health issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout happens in this job, so `gh` cannot infer the repo
          # from a local .git — every `gh` call here needs it explicit
          # (house pattern: merge-on-green.yml's sweep step).
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The AUTHORITATIVE pass/fail signal. Artifact presence only tells
          # us WHICH packs to name; it must never be the thing that decides
          # green vs red. A pack that is cancelled, times out, or fails to
          # upload its marker would otherwise read as "no failures found" and
          # this job would publish a false green — "absence of red is not a
          # pass" (#4779). `needs.data-pack.result` is GitHub's own aggregate
          # across the whole matrix: "success" only when every instance
          # succeeded, "skipped" when the nightly-success gate skipped every
          # instance, anything else ("failure"/"cancelled") otherwise.
          PACK_RESULT: ${{ needs.data-pack.result }}
        run: |
          set -euo pipefail
          ISSUE_TITLE="data-health: failing data receipts"

          # The nightly-success gate on data-pack means "skipped" is a normal
          # no-op (the nightly itself did not succeed, so this lane correctly
          # did not assert against its tree) — not a data-health finding.
          # Report nothing rather than opening an issue about a lane that
          # never ran.
          if [ "$PACK_RESULT" = "skipped" ]; then
            echo "data-pack was skipped (nightly did not report success); nothing to report"
            exit 0
          fi

          # Ensure the label exists before it is ever referenced — the first
          # failure on a fresh repo must not die on a missing label (house
          # pattern: scripts/prophet_rescue.py ensure_label). --force makes
          # this idempotent (updates color/description rather than erroring)
          # on every later run.
          gh label create data-health --color BFD4F2 \
            --description "failing gate: data receipts" --force || true

          FAILED_DIR="$RUNNER_TEMP/data-health-failures"
          FAILED_PACKS=""
          if [ -d "$FAILED_DIR" ]; then
            FAILED_PACKS=$(cat "$FAILED_DIR"/*.txt 2>/dev/null | sort -u | paste -sd', ' - || true)
          fi

          # Fail CLOSED on a lookup error: a swallowed API error must never
          # read as "no issue exists", or a transient `gh` failure mints a
          # duplicate standing issue every time it happens.
          if ! EXISTING_JSON=$(gh issue list --label data-health --state open --json number,title); then
            echo "::error title=data-health-issue-lookup::gh issue list failed; refusing to guess whether a standing issue exists" >&2
            exit 1
          fi
          EXISTING=$(printf '%s' "$EXISTING_JSON" | jq -r --arg t "$ISSUE_TITLE" '.[] | select(.title==$t) | .number' | head -n1)

          if [ "$PACK_RESULT" != "success" ]; then
            if [ -n "$FAILED_PACKS" ]; then
              SUMMARY="data-health lane ${PACK_RESULT} — failing pack(s): ${FAILED_PACKS}."
            else
              SUMMARY="data-health lane ${PACK_RESULT} — no per-pack marker was recovered (a cancelled or timed-out pack does not always upload one)."
            fi
            BODY="${SUMMARY}"$'\n\n'"Run: ${RUN_URL}"
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create --title "$ISSUE_TITLE" --label data-health --body "$BODY"
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "data-health lane is green — every gate: data pack passed."$'\n\n'"Run: ${RUN_URL}"
          fi
