name: government-revenue-live
# ─────────────────────────────────────────────────────────────────────────────
# Government Revenue Foresight — SAM.gov opportunity evidence fast path.
#
# This is intentionally a bounded, SAM-only change detector.  It polls roughly
# every 30 minutes, but GitHub Actions cron is best-effort rather than a
# hard-real-time service.  The active SAM source itself publishes on a daily
# cadence (archived notices weekly); the useful promise here is prompt
# propagation when a new observable notice, revision, or attachment appears.
#
# The daily collection remains the sole guarded forward-ledger advancer. This
# lane is the sole SAM ledger and canonical Government Revenue projection owner:
# scheduled runs stage first-seen SAM evidence; path-filtered main pushes fold daily
# USAspending evidence and desk changes. The receipt-bound award-event triad is
# intentionally *not* collected on this 30-minute schedule: the official collector's
# default historical sweep is 1,826 days and activation requires a complete
# bounded, receipt-bound baseline. This lane only folds an already committed, complete triad;
# its local guard is bounded (three paths plus a small JSON state) and fails closed
# before a partial source generation can publish. Shared collect byproducts remain
# runner-local and are never committed. The daily collector likewise remains the sole
# writer of the four-file USAspending subaward source bundle; this lane validates its
# generation and publishes only the derived content-addressed subaward twins. Generic
# site-wide render lanes may repeat a
# byte-guarded deterministic rebake so their HTML sweeps cannot overwrite a newer
# embedded bundle, but cannot advance canonical evidence. The closest proven
# commit/push pattern is whitehouse-sentinel.yml, upgraded here to the shared
# push_retry policy because this lane can contend with render and live writers. If a
# true <=15-minute production SLA becomes necessary, move the bounded SAM poll to the
# managed live plane rather than treating GitHub cron as one.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "7,37 * * * *" # 30-minute coarse cadence, offset from common :00/:30 writers
  workflow_dispatch:
    inputs:
      projection_only:
        description: "Fold committed USAspending/source changes without polling SAM"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      projection_only:
        description: "Fold committed evidence without polling SAM"
        required: true
        type: boolean
  push:
    branches: [main]
    # The dedicated lane also folds daily USAspending evidence and source-code /
    # template changes. Generated twins are intentionally absent to avoid a
    # self-trigger loop after this workflow publishes them.
    paths:
      - "data/government_revenue/awards.parquet"
      - "data/government_revenue/award_actions.parquet"
      - "data/government_revenue/award_snapshots.parquet"
      - "data/government_revenue/award_event_snapshots.parquet"
      - "data/government_revenue/award_action_versions.parquet"
      - "data/government_revenue/award_event_projection_state.json"
      - "data/government_revenue/entities.json"
      - "data/government_revenue/recipient_entity_graph.json"
      - "data/government_revenue/ingest_status.json"
      - "data/government_revenue/collection_receipts.jsonl"
      - "data/government_revenue/subaward_snapshots.parquet"
      - "data/government_revenue/subaward_collection_receipts.jsonl"
      - "data/government_revenue/subaward_projection_state.json"
      - "data/government_revenue/subaward_ingest_status.json"
      - "data/government_revenue/subaward_collector_heartbeat.parquet"
      - "data/government_revenue/idv_relationship_snapshots.parquet"
      - "data/government_revenue/idv_collection_receipts.jsonl"
      - "data/government_revenue/idv_projection_state.json"
      - "data/government_revenue/idv_ingest_status.json"
      - "data/government_revenue/idv_collector_heartbeat.parquet"
      - "data/government_revenue/dod_budget_line_snapshots.jsonl"
      - "data/government_revenue/dod_budget_collection_receipts.jsonl"
      - "data/government_revenue/dod_budget_projection_state.json"
      - "data/government_revenue/fms_collection_receipts.jsonl"
      - "data/government_revenue/fms_observations.jsonl"
      - "data/government_revenue/fms_projection_state.json"
      - "data/government_revenue/fms_case_graph.json"
      - "data/government_revenue/opportunities.parquet"
      - "data/government_revenue/opportunity_revisions.parquet"
      - "data/government_revenue/opportunity_documents.parquet"
      - "data/government_revenue/opportunity_ingest_status.json"
      - "data/usaspending/obligations.parquet"
      - "data/usaspending/_meta.json"
      - "contracts/government_revenue/**"
      - "collectors/sam_gov.py"
      - "collectors/usaspending_awards.py"
      - "collectors/usaspending_subawards.py"
      - "collectors/usaspending_idv_graph.py"
      - "collectors/dod_budget.py"
      - "collectors/fms_notifications.py"
      - "collectors/fms_notifications_live.py"
      - "engine/government_revenue/**"
      - "config/government_revenue/budget_program_reviewed_edges.v1.json"
      - "config/government_revenue/candidate_historical_suppressions.v1.json"
      - "config/government_revenue/candidate_issuance_corrections.v1.json"
      - "config/government_revenue/idv_discovery.v1.json"
      - "lib/pages.py"
      - "scripts/ci/validate_government_revenue_award_event_bundle.py"
      - "scripts/build_government_revenue.py"
      - "scripts/build_government_revenue_candidates.py"
      - "scripts/collect.py"
      - "templates/_interfonts.html.j2"
      - "templates/_navlinks.html.j2"
      - "templates/_seo_head.html.j2"
      - "templates/_site_nav.html.j2"
      - "templates/data_base.js"
      - "templates/government-revenue-candidate-radar.js"
      - "templates/government_revenue.html.j2"

permissions:
  contents: write

concurrency:
  # A completed first-seen observation must not be discarded halfway through a
  # persist/publish cycle.  The next 30-minute tick can wait.
  group: government-revenue-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, macstudio-light]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_call follows a daily data push; always begin from the current
          # production ref rather than the caller's checkout-time SHA.
          ref: main
          fetch-depth: 1

      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt

      - name: fingerprint committed SAM evidence
        id: baseline
        if: ${{ github.event_name != 'push' && inputs.projection_only != true }}
        # The collector refreshes last_seen_at and its dated heartbeat on every
        # successful poll. The fingerprint deliberately excludes those clocks so
        # downstream alerting can distinguish semantic evidence from a quiet
        # health receipt. Both are published: otherwise a healthy quiet source
        # would age falsely stale after the 90-minute current-state SLA.
        run: |
          python - "$RUNNER_TEMP/govrev-sam-material-before.sha256" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import sys
          from pathlib import Path

          import pandas as pd

          ROOT = Path(".")
          SPECS = {
              "opportunities": (
                  ROOT / "data/government_revenue/opportunities.parquet",
                  ("notice_id", "revision_id", "content_sha256", "effective_at"),
              ),
              "revisions": (
                  ROOT / "data/government_revenue/opportunity_revisions.parquet",
                  ("notice_id", "revision_id", "content_sha256", "effective_at"),
              ),
              "documents": (
                  ROOT / "data/government_revenue/opportunity_documents.parquet",
                  ("notice_id", "revision_id", "document_key", "content_sha256", "hash_basis", "fetch_status"),
              ),
          }


          def scalar(value):
              if value is None:
                  return None
              try:
                  if pd.isna(value):
                      return None
              except (TypeError, ValueError):
                  pass
              if isinstance(value, pd.Timestamp):
                  return value.isoformat()
              if isinstance(value, (str, int, float, bool)):
                  return value
              return str(value)


          def rows(path: Path, columns: tuple[str, ...]):
              if not path.exists():
                  return []
              try:
                  frame = pd.read_parquet(path, columns=list(columns))
              except Exception:
                  # A missing column in a legacy first-run artifact is harmless:
                  # read it whole and normalize the absent field to null instead.
                  frame = pd.read_parquet(path)
              records = [
                  {column: scalar(row.get(column)) for column in columns}
                  for row in frame.reindex(columns=list(columns)).to_dict(orient="records")
              ]
              return sorted(records, key=lambda row: json.dumps(row, sort_keys=True, default=str))


          # Presence is itself material on the first complete poll.  Without it,
          # a missing legacy artifact and an intentionally empty complete ledger
          # would hash the same and the first good empty state would never publish.
          payload = {
              name: {"present": path.exists(), "rows": rows(path, columns)}
              for name, (path, columns) in SPECS.items()
          }
          raw = json.dumps(payload, sort_keys=True, separators=(",", ":"), default=str).encode("utf-8")
          Path(sys.argv[1]).write_text(hashlib.sha256(raw).hexdigest() + "\n", encoding="utf-8")
          PY

      - name: collect SAM opportunity evidence (last-good gated)
        id: collect
        if: ${{ github.event_name != 'push' && inputs.projection_only != true }}
        # collect.py contains shared health/qledger housekeeping.  This named lane
        # is not the nightly lane, so it cannot advance the guarded forward
        # graders; only the explicit government-revenue paths below may publish.
        #
        # SAM QUOTA GATE (2026-08-05): the free personal SAM key allows ~10
        # requests/DAY total, shared with the nightly radar sam_gov leg
        # (collectors/sam_gov.py — batch-first, ≤7/night, runs from daily.yml at
        # 22:30 UTC). An ungated 30-min cadence spends the whole pool on 429s
        # and starves the nightly. Scheduled runs therefore poll SAM only during
        # 00-01 UTC — AFTER the nightly's spend in the same quota-day — and are
        # quiet-skips otherwise (exit 0 = quiet poll; last-good projection still
        # publishes below). workflow_dispatch stays ungated for operators.
        # Lifting this gate needs a higher-tier (federal system account) key.
        continue-on-error: true
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          COLLECT_LANE: government-revenue-live
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            hh="$(date -u +%H)"
            case "$hh" in
              00|01) ;;
              *)
                echo "SAM quota gate: quiet-skip at ${hh}xx UTC (shared ~10/day key; radar-first allocation — see collectors/sam_gov.py)"
                exit 0
                ;;
            esac
          fi
          python -m scripts.collect --only sam_gov_opportunities --skip-quality --skip-shadow-importance

      - name: gate publication on complete health or material evidence
        id: gate
        if: ${{ always() }}
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          PROJECTION_ONLY: ${{ inputs.projection_only }}
        run: |
          python - "$RUNNER_TEMP/govrev-sam-material-before.sha256" "$GITHUB_OUTPUT" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          import pandas as pd

          ROOT = Path(".")
          STATUS_PATH = ROOT / "data/government_revenue/opportunity_ingest_status.json"
          SPECS = {
              "opportunities": (
                  ROOT / "data/government_revenue/opportunities.parquet",
                  ("notice_id", "revision_id", "content_sha256", "effective_at"),
              ),
              "revisions": (
                  ROOT / "data/government_revenue/opportunity_revisions.parquet",
                  ("notice_id", "revision_id", "content_sha256", "effective_at"),
              ),
              "documents": (
                  ROOT / "data/government_revenue/opportunity_documents.parquet",
                  ("notice_id", "revision_id", "document_key", "content_sha256", "hash_basis", "fetch_status"),
              ),
          }


          def scalar(value):
              if value is None:
                  return None
              try:
                  if pd.isna(value):
                      return None
              except (TypeError, ValueError):
                  pass
              if isinstance(value, pd.Timestamp):
                  return value.isoformat()
              if isinstance(value, (str, int, float, bool)):
                  return value
              return str(value)


          def fingerprint() -> str:
              payload = {}
              for name, (path, columns) in SPECS.items():
                  frame = pd.read_parquet(path, columns=list(columns))
                  records = [
                      {column: scalar(row.get(column)) for column in columns}
                      for row in frame.reindex(columns=list(columns)).to_dict(orient="records")
                  ]
                  payload[name] = {
                      "present": path.exists(),
                      "rows": sorted(
                          records, key=lambda row: json.dumps(row, sort_keys=True, default=str)
                      ),
                  }
              raw = json.dumps(payload, sort_keys=True, separators=(",", ":"), default=str).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()


          event_name = os.environ.get("EVENT_NAME", "unknown")
          projection_only = os.environ.get("PROJECTION_ONLY", "false").lower() == "true"
          outcome = os.environ.get("COLLECT_OUTCOME", "unknown")
          status_name = "missing"
          partial = True
          material_changed = False
          reason = "collect_not_successful"
          records = {}
          if event_name == "push" or projection_only:
              # A path-filtered main push means an upstream evidence generation or
              # desk implementation changed.  This job is the sole canonical
              # projection owner, so fold it even though the SAM collector is intentionally
              # skipped for push-triggered runs.
              status_name = "not_polled"
              partial = False
              material_changed = True
              reason = "main_input_generation_changed"
          elif outcome == "success" and STATUS_PATH.exists() and all(path.exists() for path, _ in SPECS.values()):
              try:
                  status = json.loads(STATUS_PATH.read_text(encoding="utf-8"))
                  status_name = str(status.get("status") or "missing")
                  partial = bool(status.get("partial", True))
                  records = status.get("records") if isinstance(status.get("records"), dict) else {}
                  if status_name == "ok" and not partial:
                      before = Path(sys.argv[1]).read_text(encoding="utf-8").strip()
                      material_changed = fingerprint() != before
                      reason = (
                          "material_evidence"
                          if material_changed
                          else "complete_quiet_health_receipt"
                      )
                  else:
                      reason = "partial_or_failed_source_receipt"
              except Exception:
                  # A malformed receipt is incomplete evidence.  Do not disclose
                  # arbitrary source error text (or environment values) in logs.
                  reason = "unreadable_source_receipt"
          elif outcome == "success":
              reason = "required_last_good_artifact_missing"

          publish = (
              event_name == "push" or projection_only
              or (outcome == "success" and status_name == "ok" and not partial)
          )
          with Path(sys.argv[2]).open("a", encoding="utf-8") as fh:
              fh.write(f"publish={'yes' if publish else 'no'}\n")
              fh.write(f"reason={reason}\n")
          safe_counts = {
              key: records.get(key)
              for key in ("opportunities_seen", "revisions_seen", "documents_seen")
              if isinstance(records.get(key), (int, float))
          }
          print(
              "government-revenue publish gate: "
              f"event={event_name} collect={outcome} status={status_name} partial={str(partial).lower()} "
              f"material_changed={str(material_changed).lower()} publish={'yes' if publish else 'no'} "
              f"counts={safe_counts}"
          )
          PY

      # Keep the reusable reviewed-config guard in the job temp directory so
      # the publication step stays below GitHub's 21,000-character run limit.
      # RUNNER_TEMP persists across steps in this job; the helper is sourced by
      # the commit/retry shell below and never becomes a repository artifact.
      - name: stage reviewed source guards
        if: ${{ steps.gate.outputs.publish == 'yes' }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/govrev-reviewed-source-guards.sh" <<'SH'
          recipient_graph_path=data/government_revenue/recipient_entity_graph.json
          historical_suppression_path=config/government_revenue/candidate_historical_suppressions.v1.json
          historical_suppression_schema_path=contracts/government_revenue/government_revenue_candidate_historical_suppressions.v1.schema.json
          issuance_correction_path=config/government_revenue/candidate_issuance_corrections.v1.json
          issuance_correction_schema_path=contracts/government_revenue/government_revenue_candidate_issuance_corrections.v1.schema.json
          reviewed_controls_fingerprint_path="$RUNNER_TEMP/govrev-reviewed-controls.sha256"

          reviewed_control_paths() {
            printf '%s\n' \
              "$historical_suppression_path" \
              "$historical_suppression_schema_path" \
              "$issuance_correction_path" \
              "$issuance_correction_schema_path"
          }

          write_reviewed_controls_fingerprint() {
            local output_path=$1
            local path
            : > "$output_path"
            while IFS= read -r path; do
              if [ ! -f "$path" ] || ! git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
                echo "::error title=reviewed control missing::required reviewed control is not a tracked file: $path"
                return 1
              fi
              if ! git diff --quiet -- "$path" || ! git diff --cached --quiet -- "$path"; then
                echo "::error title=reviewed control mutation::reviewed control is dirty or staged: $path"
                return 1
              fi
              printf '%s  %s\n' "$(git hash-object -- "$path")" "$path" >> "$output_path"
            done < <(reviewed_control_paths)
          }

          snapshot_reviewed_controls() {
            local snapshot_tmp="${reviewed_controls_fingerprint_path}.tmp"
            write_reviewed_controls_fingerprint "$snapshot_tmp"
            mv -f -- "$snapshot_tmp" "$reviewed_controls_fingerprint_path"
          }

          assert_reviewed_controls_unchanged() {
            local current_tmp="${reviewed_controls_fingerprint_path}.check"
            if [ ! -f "$reviewed_controls_fingerprint_path" ]; then
              echo "::error title=reviewed control snapshot missing::publication cannot proceed without the initial reviewed-control fingerprint"
              return 1
            fi
            write_reviewed_controls_fingerprint "$current_tmp"
            if ! cmp -s "$reviewed_controls_fingerprint_path" "$current_tmp"; then
              echo "::error title=reviewed control changed::a reviewed manifest or schema changed after this workflow began; a fresh workflow must own the new head"
              diff -u "$reviewed_controls_fingerprint_path" "$current_tmp" || true
              rm -f -- "$current_tmp"
              return 1
            fi
            rm -f -- "$current_tmp"
          }

          assert_recipient_graph_source_clean() {
            # Recipient attribution is a separately reviewed exact-ID input.
            # Neither collectors nor builders may infer or stage it.
            if [ ! -f "$recipient_graph_path" ] || ! git ls-files --error-unmatch -- "$recipient_graph_path" >/dev/null 2>&1; then
              echo "::error title=recipient graph missing::the canonical reviewed recipient graph must be committed before publication"
              return 1
            fi
            if ! git diff --quiet -- "$recipient_graph_path" || ! git diff --cached --quiet -- "$recipient_graph_path"; then
              echo "::error title=recipient graph mutation::collectors and projection builders cannot write or stage the curated recipient graph"
              return 1
            fi
          }

          assert_historical_suppression_source_clean() {
            # This is an operator-reviewed exact non-issuance decision. The
            # builder validates and binds it, but must never author or stage it.
            if [ ! -f "$historical_suppression_path" ] || ! git ls-files --error-unmatch -- "$historical_suppression_path" >/dev/null 2>&1; then
              echo "::error title=historical suppression missing::the reviewed candidate suppression manifest must be committed before publication"
              return 1
            fi
            if ! git diff --quiet -- "$historical_suppression_path" || ! git diff --cached --quiet -- "$historical_suppression_path"; then
              echo "::error title=historical suppression mutation::collectors and projection builders cannot write or stage the reviewed suppression manifest"
              return 1
            fi
          }

          assert_issuance_correction_source_clean() {
            # This is an operator-reviewed exact correction to an append-only
            # issuance incident. Builders may validate it, but must never
            # author, weaken, or stage it.
            if [ ! -f "$issuance_correction_path" ] || ! git ls-files --error-unmatch -- "$issuance_correction_path" >/dev/null 2>&1; then
              echo "::error title=issuance correction missing::the reviewed candidate issuance correction must be committed before publication"
              return 1
            fi
            if ! git diff --quiet -- "$issuance_correction_path" || ! git diff --cached --quiet -- "$issuance_correction_path"; then
              echo "::error title=issuance correction mutation::collectors and projection builders cannot write or stage the reviewed issuance correction"
              return 1
            fi
          }
          SH
          . "$RUNNER_TEMP/govrev-reviewed-source-guards.sh"
          snapshot_reviewed_controls

      - name: build Government Revenue projection
        if: ${{ steps.gate.outputs.publish == 'yes' }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/govrev-reviewed-source-guards.sh"
          assert_recipient_graph_source_clean
          assert_historical_suppression_source_clean
          assert_issuance_correction_source_clean
          assert_reviewed_controls_unchanged
          python -m scripts.build_government_revenue --live-materialization
          assert_recipient_graph_source_clean
          assert_historical_suppression_source_clean
          assert_issuance_correction_source_clean
          assert_reviewed_controls_unchanged

      # ── The producer proves itself ───────────────────────────────────────────
      # The step above is the candidate projection's ONLY producer
      # (`build_government_revenue.py:941` -> `project_candidate_artifacts`), and
      # until now it published the candidate ledger with no test ever run against
      # what it wrote.  The suites that assert over these artifacts live in
      # `unrun-government-revenue` / `unrun-government-revenue-candidate-projection`,
      # both `if: ${{ false }}` — so they execute only on a FULL-SUITE run, which
      # happens when someone edits a global invalidator.  Producer and proof sat on
      # different schedules, and the gap is where govrev breakage lives:
      #
      #   1. this lane rewrites data/government_revenue/            (no test runs)
      #   2. the break is invisible for hours or days
      #   3. an unrelated PR touches a global invalidator -> full suite fires
      #   4. that author inherits a red they did not cause and burns a session on it
      #
      # Measured 2026-08-13: commit 40baa147fa2 broke main at 02:18Z; PR #5472
      # (agent-os, unrelated) surfaced it at 02:50Z.  The same shape produced the
      # 2026-08-06 `ledger_write_failed` break — see the comment on the
      # `award-event spine` step in .github/ci/legacy-jobs.yml, which enumerated
      # these suites precisely because "the lobe looked green because its on-point
      # guards were invisible, not because they passed".  Enumerating them into an
      # `if: false` job was half that fix: they became listed, and stayed unrun
      # here, where the bytes are actually minted.
      #
      # Cost is near zero because the gate is the CANDIDATE artifacts, not the
      # lane: this workflow polls every 30 minutes, but candidate_ledger.jsonl has
      # moved 3 times in the measured window (2026-08-03, -09, -12) — roughly once
      # a day, only when a candidate actually issues.
      #
      # ARMED 2026-08-18 (DEC:GOVREV-CANDIDATE-PROOF-GATE-ARMED).  This was born
      # NON-FATAL deliberately, as a ratchet: the suites carried hand-typed
      # GRAPH-VINTAGE constants (`reviewed_issuer_company_count == 19`,
      # `mapping_needed == 21`, a literal 19-ticker list) that detonate on a
      # CORRECT republish, so a fatal gate then would have converted a random-PR
      # ambush into a BLOCKED NIGHTLY — strictly worse.  The precondition written
      # here was "flip to 1 once those constants are derived the way
      # `canonical_frozen_at()` and `canonical_candidate_census()` already are",
      # and it is now MET: `reviewed_issuer_company_count` is asserted
      # `== len(...)` (tests/test_government_revenue_candidates.py:295),
      # `mapping_needed` `== len(canonical_requested_issuer_tickers())` (:265 and
      # tests/test_government_revenue_candidate_projection.py:715), and the
      # 19-ticker list against `list(canonical_requested_issuer_tickers())` (:271).
      # Verified green at the time of arming: 92 passed across the three suites.
      #
      # SCOPE LIMIT, stated so nobody over-trusts this: the gate is sited BEFORE
      # the publish, so it cannot see a corruption introduced AFTER it.  It would
      # NOT have caught the 2026-08-18 incident — the fold published at 04:15:52Z
      # against a coherent tree and the second collection pass clobbered the spine
      # at 04:21:53Z.  That hole is the push-path rebase resolution
      # (DEC:GOVREV-EVENT-IDENTITY-KEEPS-THE-KNOWN-AT-FOLD), not this step.
      #
      # If a spurious red ever blocks a nightly here: set this back to "0" in a
      # same-day PR, record why, and fix the assertion — do not leave it disarmed
      # silently, and do not invent a new precondition without writing it down.
      - name: prove the candidate projection before publishing it
        if: ${{ steps.gate.outputs.publish == 'yes' }}
        env:
          GOVREV_CANDIDATE_PROOF_FATAL: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -uo pipefail
          candidate_paths=(
            data/government_revenue/candidate_ledger.jsonl
            data/government_revenue/candidate_queue.json
            data/government_revenue/candidate_projection_state.json
            data/government_revenue/candidate_projection_status.json
          )
          if [ -z "$(git status --porcelain -- "${candidate_paths[@]}")" ]; then
            echo "govrev candidate proof: candidate artifacts unchanged this run — nothing to prove." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # An absent prover is NOT a pass. Say so at the same volume as a failure.
          # requirements.txt carries no pytest -- this venv is the collector's, not
          # a pack's -- so probe each import rather than assuming the pair.  xdist
          # absent must degrade to a SERIAL run, never to `-n 2` failing and being
          # reported as a broken projection: a tooling gap is not a data defect.
          have() { python -c "import $1" >/dev/null 2>&1; }
          have pytest || pip install --quiet pytest >/dev/null 2>&1 || true
          have xdist  || pip install --quiet pytest-xdist >/dev/null 2>&1 || true
          if ! have pytest; then
            echo "::warning title=govrev candidate proof unavailable::pytest could not be installed on this runner; tonight's candidate projection is publishing UNPROVEN"
            exit 0
          fi
          parallel=""
          if have xdist; then
            parallel="-n 2 --dist load --max-worker-restart=0"
          else
            echo "govrev candidate proof: pytest-xdist unavailable — running serially." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          # `-p no:cacheprovider`: never let the prover leave a .pytest_cache in a
          # tree that is about to be inspected and committed by the next step.
          before="$(git status --porcelain -- data/government_revenue)"
          log="${RUNNER_TEMP}/govrev-candidate-proof.log"
          set +e
          # shellcheck disable=SC2086 -- $parallel is an intentional argument list
          python -m pytest -p no:cacheprovider ${parallel} \
            tests/test_government_revenue_candidates.py \
            tests/test_government_revenue_candidate_projection.py \
            tests/test_government_revenue_candidate_fixture.py \
            -q >"$log" 2>&1
          status=$?
          set -e
          tail -n 40 "$log" >> "$GITHUB_STEP_SUMMARY" || true
          # The prover must not become a writer. `data/` writes belong to the
          # builder above, never to a test run.
          after="$(git status --porcelain -- data/government_revenue)"
          if [ "$before" != "$after" ]; then
            echo "::warning title=govrev candidate proof mutated the tree::the proof step changed data/government_revenue; a prover that writes what it checks cannot prove it"
          fi
          if [ "$status" -eq 0 ]; then
            echo "govrev candidate proof: PASSED against the artifacts about to be committed." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          summary="$(grep -E '^[0-9]+ (failed|error)|failed,|error' "$log" | tail -n 1)"
          echo "::warning title=govrev candidate proof failed::the candidate projection about to be published does not pass its own suites (${summary:-see step summary}) — this is the break that would otherwise surface days later on an unrelated pull request"
          if [ "${GOVREV_CANDIDATE_PROOF_FATAL}" = "1" ]; then
            echo "::error title=govrev candidate proof failed::refusing to publish an unproven candidate projection"
            exit 1
          fi
          exit 0

      # Checkout is pinned to main, every collector-owned source bundle is
      # verified and kept clean, and only governed source/output paths may be
      # staged. The retry loop rebuilds after each rebase so a concurrent daily
      # evidence commit cannot be overwritten by a mixed generation.
      - name: commit complete evidence projection
        if: ${{ steps.gate.outputs.publish == 'yes' }}
        run: |
          set -euo pipefail
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          . "$RUNNER_TEMP/govrev-reviewed-source-guards.sh"
          # The sourced guards prove collectors and projection builders cannot write or stage reviewed inputs.
          PUSH_LABEL="government-revenue evidence"
          if ! push_on_main_ok; then exit 0; fi
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          award_event_bundle_paths=(
            data/government_revenue/award_event_snapshots.parquet
            data/government_revenue/award_action_versions.parquet
            data/government_revenue/award_event_projection_state.json
          )
          award_event_receipt_path=data/government_revenue/collection_receipts.jsonl
          subaward_bundle_paths=(
            data/government_revenue/subaward_snapshots.parquet
            data/government_revenue/subaward_collection_receipts.jsonl
            data/government_revenue/subaward_projection_state.json
            data/government_revenue/subaward_ingest_status.json
          )
          subaward_heartbeat_path=data/government_revenue/subaward_collector_heartbeat.parquet
          idv_bundle_paths=(
            data/government_revenue/idv_relationship_snapshots.parquet
            data/government_revenue/idv_collection_receipts.jsonl
            data/government_revenue/idv_projection_state.json
            data/government_revenue/idv_ingest_status.json
          )
          idv_heartbeat_path=data/government_revenue/idv_collector_heartbeat.parquet
          dod_budget_bundle_paths=(
            data/government_revenue/dod_budget_line_snapshots.jsonl
            data/government_revenue/dod_budget_collection_receipts.jsonl
            data/government_revenue/dod_budget_projection_state.json
          )
          fq() { python scripts/check_fms_bundle.py "$1"; }

          assert_award_event_bundle() {
            local present=0 tracked=0 path
            for path in "${award_event_bundle_paths[@]}"; do
              [ -f "$path" ] && present=$((present + 1))
              git ls-files --error-unmatch -- "$path" >/dev/null 2>&1 && tracked=$((tracked + 1))
            done
            if [ "$present" -eq 0 ]; then
              if [ "$tracked" -ne 0 ]; then
                echo "::error title=award-event bundle missing::tracked receipt-bound award artifacts disappeared from the checkout; refusing a partial projection"
                return 1
              fi
              # Initial deployment before the collector establishes its first baseline.
              AWARD_EVENT_BUNDLE_PRESENT=false
              echo "receipt-bound award-event bundle not initialized yet; keeping forward events unavailable"
              return 0
            fi
            if [ "$present" -ne "${#award_event_bundle_paths[@]}" ] || [ "$tracked" -ne "${#award_event_bundle_paths[@]}" ]; then
              echo "::error title=award-event bundle incomplete::receipt-bound award artifacts must arrive as one committed bundle; refusing a partial projection"
              return 1
            fi
            if [ ! -f "$award_event_receipt_path" ] || ! git ls-files --error-unmatch -- "$award_event_receipt_path" >/dev/null 2>&1; then
              echo "::error title=award-event receipts missing::a receipt-bound award bundle requires the committed canonical receipt ledger"
              return 1
            fi
            # Positional contract is STATE SNAPSHOTS ACTIONS — NOT the bundle
            # array order (snapshots, actions, state): passing the array fed the
            # snapshots parquet to json.loads and killed the lane with
            # "activation state is unreadable" (first surfaced 2026-08-08, the
            # first run ever to reach this step). Wiring pinned by
            # tests/test_government_revenue_award_validator_wiring.py.
            python scripts/ci/validate_government_revenue_award_event_bundle.py \
              data/government_revenue/award_event_projection_state.json \
              data/government_revenue/award_event_snapshots.parquet \
              data/government_revenue/award_action_versions.parquet
            AWARD_EVENT_BUNDLE_PRESENT=true
          }

          assert_award_event_source_clean() {
            if ! git diff --quiet -- "${award_event_bundle_paths[@]}" "$award_event_receipt_path"; then
              echo "::error title=award-event source mutation::the SAM fast path cannot publish a locally changed USAspending award-event source bundle"
              return 1
            fi
            if ! git diff --cached --quiet -- "${award_event_bundle_paths[@]}" "$award_event_receipt_path"; then
              echo "::error title=award-event source staged::the SAM fast path cannot stage a USAspending award-event source mutation"
              return 1
            fi
          }

          assert_subaward_bundle() {
            local present=0 tracked=0 path
            for path in "${subaward_bundle_paths[@]}"; do
              [ -f "$path" ] && present=$((present + 1))
              git ls-files --error-unmatch -- "$path" >/dev/null 2>&1 && tracked=$((tracked + 1))
            done
            if [ "$present" -eq 0 ]; then
              if [ "$tracked" -ne 0 ]; then
                echo "::error title=subaward bundle missing::tracked receipt-bound subaward artifacts disappeared from the checkout; refusing a partial projection"
                return 1
              fi
              # Empty-first is an explicit public state until the daily collector
              # establishes its first complete receipt-bound generation.
              SUBAWARD_BUNDLE_PRESENT=false
              echo "receipt-bound subaward bundle not initialized yet; publishing an unavailable zero-row dossier"
              return 0
            fi
            if [ "$present" -ne "${#subaward_bundle_paths[@]}" ] || [ "$tracked" -ne "${#subaward_bundle_paths[@]}" ]; then
              echo "::error title=subaward bundle incomplete::subaward snapshots, receipts, activation state, and ingest status must arrive as one committed bundle"
              return 1
            fi
            python - \
              data/government_revenue/subaward_projection_state.json \
              data/government_revenue/subaward_snapshots.parquet <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          import pandas as pd

          from collectors.usaspending_subawards import subaward_projection_generation_matches

          try:
              state = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              snapshots = pd.read_parquet(Path(sys.argv[2]))
          except Exception as exc:
              raise SystemExit("subaward source generation could not be read") from exc
          if not isinstance(state, dict) or not subaward_projection_generation_matches(state, snapshots):
              raise SystemExit("subaward source snapshot does not match its activation generation")
          PY
            SUBAWARD_BUNDLE_PRESENT=true
          }

          assert_subaward_source_clean() {
            if ! git diff --quiet -- "${subaward_bundle_paths[@]}" "$subaward_heartbeat_path"; then
              echo "::error title=subaward source mutation::the SAM fast path cannot publish a locally changed USAspending subaward source bundle"
              return 1
            fi
            if ! git diff --cached --quiet -- "${subaward_bundle_paths[@]}" "$subaward_heartbeat_path"; then
              echo "::error title=subaward source staged::the SAM fast path cannot stage a USAspending subaward source mutation"
              return 1
            fi
          }

          assert_idv_bundle() {
            local present=0 tracked=0 path
            for path in "${idv_bundle_paths[@]}"; do
              [ -f "$path" ] && present=$((present + 1))
              git ls-files --error-unmatch -- "$path" >/dev/null 2>&1 && tracked=$((tracked + 1))
            done
            if [ "$present" -eq 0 ]; then
              if [ "$tracked" -ne 0 ]; then
                echo "::error title=idv bundle missing::tracked receipt-bound IDV artifacts disappeared from the checkout; refusing a partial projection"
                return 1
              fi
              echo "receipt-bound IDV bundle not initialized yet; publishing an unavailable relationship dossier"
              return 0
            fi
            if [ "$present" -ne "${#idv_bundle_paths[@]}" ] || [ "$tracked" -ne "${#idv_bundle_paths[@]}" ]; then
              echo "::error title=idv bundle incomplete::IDV snapshots, receipts, activation state, and ingest status must arrive as one committed bundle"
              return 1
            fi
            python - \
              data/government_revenue/idv_projection_state.json \
              data/government_revenue/idv_relationship_snapshots.parquet <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          import pandas as pd

          from collectors.usaspending_idv_graph import idv_projection_generation_matches

          try:
              state = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              snapshots = pd.read_parquet(Path(sys.argv[2]))
          except Exception as exc:
              raise SystemExit("IDV source generation could not be read") from exc
          if not isinstance(state, dict) or not idv_projection_generation_matches(state, snapshots):
              raise SystemExit("IDV source snapshot does not match its activation generation")
          PY
          }

          assert_idv_source_clean() {
            if ! git diff --quiet -- "${idv_bundle_paths[@]}" "$idv_heartbeat_path"; then
              echo "::error title=idv source mutation::the SAM fast path cannot publish a locally changed USAspending IDV source bundle"
              return 1
            fi
            if ! git diff --cached --quiet -- "${idv_bundle_paths[@]}" "$idv_heartbeat_path"; then
              echo "::error title=idv source staged::the SAM fast path cannot stage a USAspending IDV source mutation"
              return 1
            fi
          }

          assert_dod_budget_bundle() {
            local present=0 tracked=0 path
            for path in "${dod_budget_bundle_paths[@]}"; do
              [ -f "$path" ] && present=$((present + 1))
              git ls-files --error-unmatch -- "$path" >/dev/null 2>&1 && tracked=$((tracked + 1))
            done
            if [ "$present" -eq 0 ]; then
              if [ "$tracked" -ne 0 ]; then
                echo "::error title=dod-budget bundle missing::tracked DoD budget source artifacts disappeared from the checkout; refusing a partial graph"
                return 1
              fi
              echo "DoD budget source bundle not initialized yet; keeping the optional graph unavailable"
              return 0
            fi
            if [ "$present" -ne "${#dod_budget_bundle_paths[@]}" ] || [ "$tracked" -ne "${#dod_budget_bundle_paths[@]}" ]; then
              echo "::error title=dod-budget bundle incomplete::DoD budget lines, receipts, and projection state must arrive as one committed bundle"
              return 1
            fi
            python - "${dod_budget_bundle_paths[@]}" <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          from collectors.dod_budget import projection_state_matches

          try:
              lines = [json.loads(row) for row in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()]
              receipts = [json.loads(row) for row in Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()]
              state = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit("DoD budget source generation could not be read") from exc
          if not lines or not receipts or not isinstance(state, dict) or not projection_state_matches(state, lines, receipts):
              raise SystemExit("DoD budget source ledgers do not match their projection generation")
          PY
          }

          assert_dod_budget_source_clean() {
            if ! git diff --quiet -- "${dod_budget_bundle_paths[@]}"; then
              echo "::error title=dod-budget source mutation::the SAM fast path cannot publish a locally changed DoD budget source bundle"
              return 1
            fi
            if ! git diff --cached --quiet -- "${dod_budget_bundle_paths[@]}"; then
              echo "::error title=dod-budget source staged::the SAM fast path cannot stage a DoD budget source mutation"
              return 1
            fi
          }

          assert_idv_dossier_twins() {
            local canonical=data/government_revenue/idv_dossiers.json
            local public=site/government-revenue-data/idv-dossiers.json
            if [ ! -f "$canonical" ] || [ ! -f "$public" ]; then
              echo "::error title=idv dossier twin missing::the build must publish both canonical and public IDV dossier bytes"
              return 1
            fi
            if ! cmp -s "$canonical" "$public"; then
              echo "::error title=idv dossier twin mismatch::canonical and public IDV dossier bytes differ"
              return 1
            fi
          }

          assert_candidate_twins() {
            local canonical=data/government_revenue/candidate_queue.json
            local public=site/government-revenue-data/candidates.json
            if [ ! -f "$canonical" ] || [ ! -f "$public" ]; then
              echo "::error title=candidate queue twin missing::the live build must publish both canonical and public candidate queue bytes"
              return 1
            fi
            if ! cmp -s "$canonical" "$public"; then
              echo "::error title=candidate queue twin mismatch::canonical and public candidate queue bytes differ"
              return 1
            fi
          }

          assert_optional_budget_graph_twins() {
            local canonical=data/government_revenue/budget_program_graph.json
            local public=site/government-revenue-data/budget-program.json
            if [ ! -e "$canonical" ] && [ ! -e "$public" ]; then
              return 0
            fi
            if [ ! -f "$canonical" ] || [ ! -f "$public" ]; then
              echo "::error title=budget graph twin incomplete::DoD budget graph must be absent or present as exact canonical/public twins"
              return 1
            fi
            if ! cmp -s "$canonical" "$public"; then
              echo "::error title=budget graph twin mismatch::canonical and public DoD budget graph bytes differ"
              return 1
            fi
          }

          assert_award_event_bundle
          assert_award_event_source_clean
          assert_subaward_bundle
          assert_subaward_source_clean
          assert_idv_bundle
          assert_idv_source_clean
          assert_dod_budget_bundle
          assert_dod_budget_source_clean
          fq p
          assert_recipient_graph_source_clean
          assert_historical_suppression_source_clean
          assert_issuance_correction_source_clean
          assert_reviewed_controls_unchanged
          assert_idv_dossier_twins
          assert_candidate_twins
          assert_optional_budget_graph_twins
          fq t

          stage_candidates=(
            data/government_revenue/opportunities.parquet
            data/government_revenue/opportunity_revisions.parquet
            data/government_revenue/opportunity_documents.parquet
            data/government_revenue/opportunity_ingest_status.json
            data/government_revenue/sam_opportunity_heartbeat.parquet
            data/government_revenue/latest.json
            data/government_revenue/workspace.json
            data/government_revenue/dossiers.json
            data/government_revenue/subaward_dossiers.json
            data/government_revenue/idv_dossiers.json
            data/government_revenue/budget_program_graph.json
            data/government_revenue/fms_case_graph.json
            data/government_revenue/recipient_resolution_coverage.json
            data/government_revenue/candidate_ledger.jsonl
            data/government_revenue/candidate_queue.json
            data/government_revenue/candidate_projection_state.json
            data/government_revenue/candidate_projection_status.json
            site/government-revenue-data/latest.json
            site/government-revenue-data/workspace.json
            site/government-revenue-data/dossiers.json
            site/government-revenue-data/subaward-dossiers.json
            site/government-revenue-data/idv-dossiers.json
            site/government-revenue-data/budget-program.json
            site/government-revenue-data/fms-cases.json
            site/government-revenue-data/candidates.json
            site/government_revenue.html
          )
          if [ "$AWARD_EVENT_BUNDLE_PRESENT" = true ]; then
            stage_candidates+=("${award_event_bundle_paths[@]}")
          fi
          stage_paths=()
          for path in "${stage_candidates[@]}"; do
            if [ -e "$path" ] || git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              stage_paths+=("$path")
            fi
          done
          git add -- "${stage_paths[@]}"
          if git diff --cached --quiet; then
            echo "no material Government Revenue artifacts to publish"
            exit 0
          fi
          push_staged_clean \
            data/government_revenue/opportunities.parquet \
            data/government_revenue/opportunity_revisions.parquet \
            data/government_revenue/opportunity_documents.parquet \
            data/government_revenue/opportunity_ingest_status.json \
            data/government_revenue/sam_opportunity_heartbeat.parquet \
            data/government_revenue/award_event_snapshots.parquet \
            data/government_revenue/award_action_versions.parquet \
            data/government_revenue/award_event_projection_state.json \
            data/government_revenue/latest.json \
            data/government_revenue/workspace.json \
            data/government_revenue/dossiers.json \
            data/government_revenue/subaward_dossiers.json \
            data/government_revenue/idv_dossiers.json \
            data/government_revenue/budget_program_graph.json \
            data/government_revenue/fms_case_graph.json \
            data/government_revenue/recipient_resolution_coverage.json \
            data/government_revenue/candidate_ledger.jsonl \
            data/government_revenue/candidate_queue.json \
            data/government_revenue/candidate_projection_state.json \
            data/government_revenue/candidate_projection_status.json \
            site/government-revenue-data/latest.json \
            site/government-revenue-data/workspace.json \
            site/government-revenue-data/dossiers.json \
            site/government-revenue-data/subaward-dossiers.json \
            site/government-revenue-data/idv-dossiers.json \
            site/government-revenue-data/budget-program.json \
            site/government-revenue-data/fms-cases.json \
            site/government-revenue-data/candidates.json \
            site/government_revenue.html
          git commit -m "govrev: SAM opportunity evidence $(date -u +%FT%H:%MZ)"

          PUSH_MAX_ATTEMPTS=8
          PUSH_BUDGET_SECS=300
          PUSH_ALARM=90
          push_retry_init "government-revenue evidence"
          while push_attempt; do
            git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            # Append-only base freshness (why: scripts/ci/push_retry.sh). --amend:
            # this loop amends. Non-zero ONLY when a proven withhold failed.
            if ! push_append_only_fence origin/main --amend; then push_backoff; continue; fi
            if git pull --rebase --autostash -X theirs origin main && push_autostash_ok; then
              # Rebuild AFTER every successful rebase; retry loops do the same.
              assert_award_event_bundle
              assert_award_event_source_clean
              assert_subaward_bundle
              assert_subaward_source_clean
              assert_idv_bundle
              assert_idv_source_clean
              assert_dod_budget_bundle
              assert_dod_budget_source_clean
              fq p
              assert_recipient_graph_source_clean
              assert_historical_suppression_source_clean
              assert_issuance_correction_source_clean
              assert_reviewed_controls_unchanged
              python -m scripts.build_government_revenue --live-materialization
              assert_recipient_graph_source_clean
              assert_historical_suppression_source_clean
              assert_issuance_correction_source_clean
              assert_reviewed_controls_unchanged
              assert_idv_dossier_twins
              assert_candidate_twins
              assert_optional_budget_graph_twins
              fq t
              git add \
                data/government_revenue/latest.json \
                data/government_revenue/workspace.json \
                data/government_revenue/dossiers.json \
                data/government_revenue/subaward_dossiers.json \
                data/government_revenue/idv_dossiers.json \
                data/government_revenue/recipient_resolution_coverage.json \
                data/government_revenue/candidate_ledger.jsonl \
                data/government_revenue/candidate_queue.json \
                data/government_revenue/candidate_projection_state.json \
                data/government_revenue/candidate_projection_status.json \
                site/government-revenue-data/latest.json \
                site/government-revenue-data/workspace.json \
                site/government-revenue-data/dossiers.json \
                site/government-revenue-data/subaward-dossiers.json \
                site/government-revenue-data/idv-dossiers.json \
                site/government-revenue-data/candidates.json \
                site/government_revenue.html
              if [ -f data/government_revenue/budget_program_graph.json ]; then
                git add -- \
                  data/government_revenue/budget_program_graph.json \
                  site/government-revenue-data/budget-program.json
              fi
              fq s
              push_staged_clean \
                data/government_revenue/award_event_snapshots.parquet \
                data/government_revenue/award_action_versions.parquet \
                data/government_revenue/award_event_projection_state.json \
                data/government_revenue/latest.json \
                data/government_revenue/workspace.json \
                data/government_revenue/dossiers.json \
                data/government_revenue/subaward_dossiers.json \
                data/government_revenue/idv_dossiers.json \
                data/government_revenue/budget_program_graph.json \
                data/government_revenue/fms_case_graph.json \
                data/government_revenue/recipient_resolution_coverage.json \
                data/government_revenue/candidate_ledger.jsonl \
                data/government_revenue/candidate_queue.json \
                data/government_revenue/candidate_projection_state.json \
                data/government_revenue/candidate_projection_status.json \
                site/government-revenue-data/latest.json \
                site/government-revenue-data/workspace.json \
                site/government-revenue-data/dossiers.json \
                site/government-revenue-data/subaward-dossiers.json \
                site/government-revenue-data/idv-dossiers.json \
                site/government-revenue-data/budget-program.json \
                site/government-revenue-data/fms-cases.json \
                site/government-revenue-data/candidates.json \
                site/government_revenue.html
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi
              if push_do origin HEAD:main; then
                echo "pushed Government Revenue evidence on attempt ${PUSH_ATTEMPT}"
                push_won
                exit 0
              fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning title=government-revenue-live::could not publish complete evidence after ${PUSH_ATTEMPT} attempts; prior live projection remains authoritative"
          exit 0
