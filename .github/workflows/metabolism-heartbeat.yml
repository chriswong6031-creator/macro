name: metabolism-heartbeat
# Metabolism Phase 0 (F0) — inert skeleton + kill switch.
#
# This workflow is the liveness probe for the autonomic loop.  It does exactly
# ONE thing: write a heartbeat row to data/metabolism/heartbeat.jsonl to prove
# the runner, checkout, and AUTONOMY_PAUSED kill-switch are all plumbed.
#
# KILL SWITCH — the AUTONOMY_PAUSED repo variable controls the entire loop:
#
#   gh variable set AUTONOMY_PAUSED --body true    # (re)arm the pause (default-safe)
#   gh variable set AUTONOMY_PAUSED --body false   # arm the loop (operator must do this)
#
# When AUTONOMY_PAUSED is absent OR its value is anything other than the literal
# string 'false', the job is a clean no-op.  Default-safe: if the variable has
# never been set, the loop stays paused.
#
# OPS REQUIRED BEFORE ANY AUTONOMY IS POSSIBLE:
#   1. Create the variable paused first:
#        gh variable set AUTONOMY_PAUSED --body true
#   2. Verify this workflow runs and writes heartbeat rows (Phase 0 green).
#   3. Only then flip to false to arm Phase A (once Phase A is built).
#      This flip is the one irreducible human act (R-AUT-2, §6 of masterplan).
#
# Phase 0 — nothing autonomous runs yet.  The heartbeat is INERT: it writes a
# data row and exits 0.  No signal-path code runs.  No LLM calls.  No merges.
on:
  schedule:
    - cron: "45 * * * *"   # hourly at :45 (offset from whitehouse-sentinel at :12)
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force a heartbeat write even when AUTONOMY_PAUSED=true (for ops verification)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: metabolism-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    # KILL SWITCH — this is the first conditional checked in the entire metabolism.
    # Absent variable → treated as paused (default-safe).
    # The literal string 'true' → paused.
    # Only the literal string 'false' → armed.
    if: vars.AUTONOMY_PAUSED != 'true'
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip

      - name: install minimal deps
        run: pip install --quiet pyyaml

      # Re-check AUTONOMY_PAUSED inside the runner so a race between the job
      # starting and the variable being set is caught immediately.  Also checks
      # the force_run input (ops verification mode).
      - name: write heartbeat row (liveness probe)
        env:
          AUTONOMY_PAUSED: ${{ vars.AUTONOMY_PAUSED }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python - <<'EOF'
          import os, json, pathlib, datetime, sys

          autonomy_paused = os.environ.get("AUTONOMY_PAUSED", "").strip().lower()
          force_run = os.environ.get("FORCE_RUN", "false").strip().lower() == "true"

          # Fail-closed: unset or non-'false' → paused
          is_paused = autonomy_paused != "false"

          if is_paused and not force_run:
              print(
                  "AUTONOMY_PAUSED is not 'false' (current value: "
                  f"{os.environ.get('AUTONOMY_PAUSED', '<unset>')!r}).  "
                  "Loop is paused — no heartbeat written.  "
                  "Set AUTONOMY_PAUSED=false to arm the loop (operator-only action)."
              )
              sys.exit(0)

          row = {
              "schema": "metabolism.heartbeat.v1",
              "ts": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "actor": os.environ.get("GITHUB_ACTOR", ""),
              "autonomy_paused_var": os.environ.get("AUTONOMY_PAUSED", "<unset>"),
              "phase": "P0_inert",
              "note": "Phase 0 liveness probe — no autonomous action taken",
          }

          p = pathlib.Path("data/metabolism/heartbeat.jsonl")
          p.parent.mkdir(parents=True, exist_ok=True)
          with p.open("a") as fh:
              fh.write(json.dumps(row, separators=(",", ":")) + "\n")

          print(f"heartbeat written: {row['ts']} run={row['run_id']} phase={row['phase']}")
          EOF

      - name: commit + push heartbeat row (only on change)
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # Guard: only add the file when it actually exists (paused no-op never writes it;
          # bare `git add <missing-file>` exits 128 and fails the step, turning a clean
          # paused run into a red build — house law §nightly-guard-echo-inversion).
          if [ -f data/metabolism/heartbeat.jsonl ]; then
            git add data/metabolism/heartbeat.jsonl
          fi
          if git diff --cached --quiet; then
            echo "no heartbeat change (AUTONOMY_PAUSED guard exited early or file absent)"
            exit 0
          fi
          git commit -m "metabolism: heartbeat $(date -u +%FT%H:%MZ) [P0-inert]"
          # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
          # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
          # refuses ("untracked working tree files would be overwritten") and --autostash can't
          # clear it (it parks tracked modifications only), so every retry dies identically.
          # Everything this step publishes is already committed above, so a path untracked HERE
          # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
          # Gitignored files and untracked paths origin/main doesn't track never enter the
          # intersection (runner-local stores and caches are untouched).
          git fetch origin main || true
          comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                   <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
            | while IFS= read -r f; do rm -f -- "$f" || true; done
          git pull --rebase --autostash -X theirs origin main && git push
