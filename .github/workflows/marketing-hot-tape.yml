name: marketing-hot-tape
# ─────────────────────────────────────────────────────────────────────────────
# HOT TAPE P1 — the 5-minute intraday attention radar
# (research/MARKETING_HOT_TAPE_MASTERPLAN.md §3.2/§3.4).
#
# Every 5 minutes from 09:25 to 16:05 America/New_York on weekdays it loads the
# live tape + the nightly context pack, runs the detectors, composes wire copy
# (deterministic templates, LLM-phrased when the P2 desk is armed below), draws
# the house tape card, and books what fires as `immediate` outbox items. When
# anything books it dispatches marketing-publish.yml with post_now_item=<ids>,
# so a sector rout crossing at 10:04 ET is at Buffer by ~10:13 (gate 0.1 asks
# for ≤20 min).
#
# TWO-STEP PUBLISH (codex law, §10 E1): an alert at severity ≥90 earns ONE
# follow-up "context brief" — mechanism, affected names, what we are watching —
# filed on a LATER tick out of its own budget. The alert wins speed; the brief
# wins reposts.
#
# THIS RUNS ON ubuntu-latest, NEVER the self-hosted macstudio pool: 81 runs a
# day on the render pool would eat the nightly's budget, which is law.
#
# WHY IT IS SAFE. This workflow only QUEUES posts. Nothing here can publish:
# sending is marketing-publish.yml's job and that runner self-downgrades to
# dry-run unless the operator's kill switch (repo variable
# MARKETING_PUBLISH_ENABLED=1) is on. With the switch off this lane fills the
# outbox and the queue simply sits there — which is also how you watch what it
# WOULD have posted before arming anything.
#
# LEDGER LAW (masterplan §6): the radar writes ONLY the outbox, its own snapshot
# ring and its fired ledger. It never advances a forward ledger — the nightly is
# the sole advancer of those, and this loop runs 81 times a day.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # GITHUB CRON HAS NO TIMEZONE — it is UTC, always. The session window is
    # 09:25-16:05 America/New_York, which is 13:25-20:05Z under EDT and
    # 14:25-21:05Z under EST, so a single UTC pair is wrong for half the year:
    # the shipped 13:25-20:05Z schedule would, from the November clock change,
    # have woken the radar an hour before the open and gone dark for the last
    # hour of every session — the hour that carries the closing print.
    #
    # These crons therefore span BOTH regimes, 13:25Z through 21:05Z, and the
    # ET window guard in engine/marketing/hot_tape.py:in_window trims the
    # off-season edges (an EST 13:25Z tick is 08:25 ET and stands down; an EDT
    # 21:00Z tick is 17:00 ET and stands down). The cost of the overlap is a
    # handful of ~20-second no-op runs a day on ubuntu-latest; the cost of
    # getting it wrong is a dark hour every session for five months.
    #
    # Three crons because GitHub's cron cannot express "every 5 minutes from
    # :25 of one hour to :05 of another".
    - cron: "25,30,35,40,45,50,55 13 * * 1-5"
    - cron: "*/5 14-20 * * 1-5"
    - cron: "0,5 21 * * 1-5"
  workflow_dispatch:
    inputs:
      demo_override:
        description: >-
          DEMO — relax the window, quote-freshness and detector thresholds to the
          `demo:` block in config/hot_tape.yml so the lane can be shown working on
          a quiet tape or outside market hours. THIS STILL BOOKS A REAL POST, and
          with the publisher armed (MARKETING_PUBLISH_ENABLED=1) that post goes
          out — tick dry_run as well if you want a rehearsal. Blast radius is
          bounded: a demo pass books AT MOST ONE item and always on the wire desk
          (mastermind_news), never the flagship. Items are stamped demo
          (provenance.demo = true) all the way onto the outbox item.
        required: false
        type: boolean
        default: false
      dry_run:
        description: >-
          DRY RUN — detect, compose and SIMULATE the chart, writing nothing: no
          ring append, no outbox item, no chart upload, no dispatch. The PR
          receipt mode.
        required: false
        type: boolean
        default: false

permissions:
  contents: write     # commit the outbox + ring + fired ledgers back to main
  actions: write      # dispatch marketing-publish.yml with the booked item ids

concurrency:
  # Two radar passes must never overlap: they would both read the same fired
  # ledger, both see the same event unfired, and double-book it. Never cancel a
  # pass in flight either — it may already have handed a card to R2.
  group: marketing-hot-tape
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest      # OFF the render path — never the macstudio pool
    # A pass is ~1-2 min (Chrome raster ~13s each, up to 3 cards, plus the push
    # race and a possible ~25s self-fetch). A run is now PASSES of those with
    # PASS_INTERVAL_S between them — 3 x 300s = 10 min of sleep plus ~5 min of
    # work — so the old 12 would kill the run mid-third-pass. 20 covers the
    # planned 15 with margin; raise it together with PASSES, never separately.
    timeout-minutes: 20
    steps:
      - name: checkout (shallow + sparse + write token)
        # SHALLOW ON PURPOSE. marketing-publish.yml ran fetch-depth: 0 and on
        # 2026-07-28 the clone of this heavy-churn repo grew past that job's 25m
        # timeout — the 12:58Z sweep spent 12:58:08→13:23:07 inside `checkout`,
        # was cancelled, and the desks published nothing all day. This lane runs
        # 81 times a day on a 12m budget, so a full clone is not survivable here
        # at all. Nothing needs history: the radar reads artifacts at HEAD and
        # the commit step below puts one commit on top of main. The push loop
        # deepens to 20 so `pull --rebase` always has a merge base.
        #
        # SPARSE + BLOBLESS ON TOP OF THAT. fetch-depth alone still materializes
        # the whole tree: ~2.8GB across ~48k tracked files, most of it stores
        # this lane never opens. The cone below is the radar's exact read+write
        # surface (~6.6k files, ~450MB) and cone mode always includes top-level
        # files, so lib/config's root config.yml comes along:
        #   engine, scripts, lib  — the code
        #   app                   — NOT decorative and NOT a read path: the
        #                           radar's live self-fetch imports
        #                           scripts.build_live_quotes, which does
        #                           `from app.tape_symbols import TAPE_SYMBOLS` at
        #                           MODULE scope. Without this entry that import
        #                           raises ModuleNotFoundError, refresh_live_snapshot
        #                           catches it, prints its fail-soft warning, and
        #                           the self-fetch is dead in production while
        #                           looking healthy in every test — the shipped-dark
        #                           class. Verified by materializing this cone and
        #                           importing inside it.
        #   config                — hot_tape.yml + marketing.yml
        #   data/marketing        — pack, ring, fired ledger, outbox, quote
        #                           snapshot, logo cache (all three commit paths
        #                           are inside this one)
        #   data/earnings         — live_verify's earnings guard reads it
        #   data/baskets/ohlcv,
        #   data/stocks           — the card's bars. NOT optional: without them
        #                           every card would fall back to the R2-hydrated
        #                           massive store, which is sessions stale, and
        #                           load_bars would refuse it as "chart-stale".
        #   site/marketdata,
        #   site/live             — the heatmap + the display quote artifacts
        # data/massive_stock_day is gitignored (hydrated at runtime) and needs no
        # entry. Adding a read path to the radar means adding it HERE too.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            app
            engine
            scripts
            lib
            config
            data/marketing
            data/earnings
            data/baskets/ohlcv
            data/stocks
            site/marketdata
            site/live
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        # NO PANDAS, deliberately. The detector path is stdlib+json by design
        # (engine/marketing/hot_tape.py gate 0.6) and pandas is ~40s of install
        # this lane would pay 81 times a day. pyyaml: config/*.yml. requests: the
        # on-demand R2 parquet hydrate for a name outside the committed price
        # trees. pyarrow: the chart card's parquet read — chart_render falls back
        # to pyarrow when pandas is absent (_parquet_rows_pyarrow) — and the
        # earnings calendar read in scripts/hot_tape_radar.load_earnings.
        #
        # anthropic joins for the P2 wire desk (§10 E1). It is NOT optional for
        # that lane: engine/llm_auth builds EVERY provider on anthropic.Anthropic,
        # DeepSeek included (its base URL is api.deepseek.com/anthropic), so
        # without the package an armed lane would print the "armed but mute"
        # ::warning and fall back to the deterministic template on every event —
        # the 2026-07-26 silent-mute shape. The install is seconds, not the ~40s
        # pandas costs, and the module keeps its import LAZY so the thin CI lane
        # (pytest+pyyaml+jinja2, no anthropic) still collects.
        run: pip install --quiet pyyaml requests pyarrow anthropic

      - name: run the radar (multi-pass)
        id: radar
        env:
          # ── MULTI-PASS: why one delivered tick does several passes ────────────
          # The schedule above asks for a pass every 5 minutes. GitHub does not
          # deliver it. Measured across the 8h RTH window on 2026-07-29: 104
          # scheduled runs delivered across ALL 46 scheduled workflows in this
          # repo, of which this lane got 6 of its ~92 ticks (6.5%) — about 1.4
          # passes an hour, a ~43-minute mean detection gap. Gate 0.1 asks for
          # booked-at-Buffer within 20 minutes of the cross; at a 43-minute gap
          # the median event misses that before the radar has even looked.
          #
          # Starvation is a GitHub-side property of this repo's schedule load, so
          # adding crons does not reliably buy delivery (every high-frequency lane
          # here lands at ~1/hour regardless of how many ticks it asks for —
          # live-quotes 8.6%, vps-live-heartbeat 12.5%, merge-on-green 12.5%).
          # What DOES work is spending each delivered tick better: one run does
          # PASSES passes spaced PASS_INTERVAL_S apart, so delivery rate stops
          # being the cadence. 3 passes at 5 minutes turns a ~43-minute mean gap
          # into ~14 minutes for ~13 minutes of runner time per delivered tick.
          #
          # This is a MULTIPLIER, not a fix for the underlying starvation, and it
          # is deliberately bounded rather than session-long: guaranteeing a true
          # 5-minute cadence needs a persistent poller or an off-GitHub ticker,
          # which is a standing-cost decision for the operator, not something to
          # slip in here. See research/MARKETING_HOT_TAPE_MASTERPLAN.md §3.6.
          #
          # LATENCY IS WHY THE LOOP IS HERE AND NOT INSIDE THE SCRIPT: every pass
          # commits and dispatches on its own, so a 10:04 cross still books at
          # ~10:07 rather than waiting for the run to end.
          PASSES: "3"
          PASS_INTERVAL_S: "300"
          # Per-pass dispatch channel. GITHUB_OUTPUT is append-only and collapses
          # to one value per step, so it cannot carry three passes' ids.
          HOT_TAPE_IDS_FILE: /tmp/hot_tape_post_now_ids
          # Empty on every scheduled pass, so the scheduled lane is provably
          # identical to one with no demo input at all.
          HOT_TAPE_DEMO: ${{ (github.event_name == 'workflow_dispatch' && inputs.demo_override) && '1' || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # Chart PNGs ride the existing public data plane (media_publish). Absent
          # creds → no public URL → a single-name event is DROPPED rather than
          # posted bare (operator law: every ticker post carries a chart).
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # ── P2 LLM WIRE DESK (masterplan §3.3, §10 E1) ────────────────────
          # TWO KEYS ARM IT, exactly like the nightly copywriter lane: this env
          # flag AND config.yml's `hot_tape.llm.enabled`. Either one off and
          # engine/marketing/hot_tape_llm.phrase_or_fallback constructs no
          # provider, reads no credential and returns the deterministic wire
          # template — which is also what happens on any gate failure, so the
          # post always exists either way.
          MARKETING_LLM_ENABLED: "1"
          # The credential block is COPIED FROM daily.yml's governor step, not
          # invented here: hot_tape_llm walks the same engine.llm_auth waterfall
          # (oauth pool → anthropic → deepseek) as every other marketing lane,
          # and a lane that is armed with no visible credential is the 2026-07-26
          # silent-mute incident — it prints a ::warning and falls back on every
          # event. Pass the whole pool; llm_auth picks the least-loaded key.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          CLAUDE_CODE_OAUTH_TOKEN_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          # Refresh the shared snapshot from the live-data orphan branch. Cheap
          # (one shallow ref fetch) and it is the SAME merge the post-time tape
          # gate reads, so the radar fires on the tape the rest of the estate
          # reasons about. Note what that does NOT mean: `breaking` items are
          # outside the post-time gate's kind list, so nothing re-verifies this
          # move between booking and sending — freshness is enforced in the
          # radar's own gate. Fail-soft in both directions: without the snapshot
          # the radar falls back to site/live + the heatmap, and if THAT is stale
          # too it self-fetches its own universe (scripts/hot_tape_radar
          # refresh_live_snapshot) rather than standing the pass down.
          refresh_shared_tape() {
            if git fetch --depth 1 origin live-data 2>/dev/null && \
               git show FETCH_HEAD:quotes.json \
                 > data/marketing/live_quotes_snapshot.json 2>/dev/null; then
              echo "live quotes snapshot: $(wc -c < data/marketing/live_quotes_snapshot.json) bytes"
            else
              echo "::warning::live-data quotes unavailable - radar falls back to its own fetch"
              rm -f data/marketing/live_quotes_snapshot.json
            fi
          }

          # ALWAYS run, every pass, eventless included: the ring is the intraday
          # history the "$X added in 3 hours" claims are built from, and the fired
          # ledger is the cooldown memory that stops the NEXT pass re-posting the
          # same event. In a multi-pass run that second role is load-bearing
          # within the run itself, not just across runs. Echoes "pushed" so the
          # caller can gate the dispatch on it.
          commit_and_push() {
            # Stage ONLY this lane's paths (ledger law). data/massive_stock_day is
            # gitignored, so a hydrated parquet can never ride along.
            git add data/marketing/outbox 2>/dev/null || true
            git add data/marketing/hot_tape_ring.jsonl 2>/dev/null || true
            git add data/marketing/hot_tape_fired.jsonl 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "marketing-hot-tape: no radar state to commit"
              return 1
            fi

            git commit -m "hot-tape: radar $(date -u +%FT%H:%MZ) [skip ci]"

            # Retry-rebase push loop, identical in mechanics to marketing-publish's:
            # this lane races the publish sweeps and the nightly on the same outbox
            # paths. All three ledgers carry merge=union (.gitattributes) so a
            # concurrent append resolves instead of conflicting the loop to death.
            for i in 1 2 3 4 5; do
              # --depth 20: the checkout is shallow, so a bare fetch would leave
              # `pull --rebase` without a merge base once main advanced mid-run.
              git fetch --depth 20 origin main || true
              # Drop any untracked file that shadows an origin/main path — a mid-run
              # commit could TRACK a path we wrote as an untracked side-effect,
              # which would make the rebase checkout refuse.
              comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                       <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
                | while IFS= read -r f; do rm -f -- "$f" || true; done
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                echo "marketing-hot-tape: pushed radar state on attempt $i"
                return 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "marketing-hot-tape: push attempt $i lost a race; re-syncing"
              sleep $((i * 7))
            done

            echo "::warning::marketing-hot-tape: could not push radar state after 5 attempts (non-fatal)"
            return 1
          }

          for pass in $(seq 1 "${PASSES:-1}"); do
            if [ "$pass" -gt 1 ]; then
              echo "── sleeping ${PASS_INTERVAL_S}s before pass ${pass}/${PASSES} ──"
              sleep "${PASS_INTERVAL_S}"
            fi
            echo "════════ hot-tape pass ${pass}/${PASSES} $(date -u +%FT%H:%M:%SZ) ════════"

            refresh_shared_tape

            if [ "${DRY_RUN:-}" = "true" ]; then
              # The PR receipt mode: detect, compose, simulate the chart, write
              # nothing. No ring append, no outbox item, no push, no dispatch —
              # so there is nothing for the rest of the loop to do either.
              python -m scripts.hot_tape_radar --dry-run || \
                echo "::warning::marketing-hot-tape: dry-run pass ${pass} exited non-zero"
              continue
            fi

            # A pass that raises must not cost the remaining passes, and must not
            # skip the commit: the ring append and the fired ledger are what keep
            # the NEXT pass honest.
            : > "${HOT_TAPE_IDS_FILE}"
            python -m scripts.hot_tape_radar || \
              echo "::warning::marketing-hot-tape: pass ${pass} exited non-zero"

            if commit_and_push; then
              ids="$(cat "${HOT_TAPE_IDS_FILE}" 2>/dev/null || true)"
              if [ -n "$ids" ]; then
                # ORDER IS LOAD-BEARING: push THEN dispatch. marketing-publish
                # checks out main and folds items.jsonl from HEAD — dispatched
                # before our push lands it would find no such item ids and post
                # nothing, so a failed push means NO dispatch rather than a
                # wasted run.
                #
                # ONE API CALL, no polling (GitHub quota is one shared bucket):
                # fire and forget. The publisher's own run is the receipt.
                echo "marketing-hot-tape: dispatching publisher for $ids"
                gh workflow run marketing-publish.yml \
                  -f post_now_item="$ids" \
                  --repo "$GITHUB_REPOSITORY" \
                  || echo "::warning::marketing-hot-tape: dispatch failed for $ids"
              fi
            elif [ -s "${HOT_TAPE_IDS_FILE}" ]; then
              echo "::warning::marketing-hot-tape: pass ${pass} booked $(cat "${HOT_TAPE_IDS_FILE}") but the push did not land - NOT dispatching (the publisher folds items from main)"
            fi
          done
