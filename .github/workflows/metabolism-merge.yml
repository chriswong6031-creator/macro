name: metabolism-merge
# Metabolism Phase V2-B — SERIALIZED MERGE LANE (R-V2-5).  INERT.
#
# Sweeps EVERY docket riding each propose branch — the base docket
# (<cycle>.json, til) plus per-lobe dockets (<cycle>-<lobe>.json, R-V6-5
# multi-lobe propose).  Reads DRAFT PRs from the build lane that have BOTH:
#   (i)  CI green
#   (ii) A resolve_two_key AUTHORIZED grant in governance.jsonl
#
# Then:
#   1. Marks the PR ready (un-drafts it)
#   2. Merges via git pull --rebase --autostash + retry
#      ONE AT A TIME (concurrency group below) so synapse.yml /
#      ruling_graph.yml / dag.yml / ACTIVE_BUILD_MAP never merge-race.
#
# FENCE ENFORCEMENT (R-AUT-5):
#   REFUSES to merge any PR that check_self_mod_fence would block.
#   No --admin bypass. A loop PR touching the IMMUTABLE set is CI-blocked
#   by check_self_mod_fence on the build PR itself — the merge lane adds
#   a second, independent layer of refusal.
#
# KILL SWITCH (R-AUT-2):
#   gh variable set AUTONOMY_PAUSED --body true    # pause (default-safe)
#   gh variable set AUTONOMY_PAUSED --body false   # arm (operator-only)
# Absent OR anything other than 'false' → clean no-op; ZERO merges.
#
# INERTNESS GUARANTEE:
#   - Double-gated: `if: vars.AUTONOMY_PAUSED != 'true'` AND shell re-check.
#   - Actual merge fires ONLY when:
#       AUTONOMY_PAUSED == 'false'  (operator arming)
#       resolve_two_key returned authorized=True for the proposal
#       CI is green on the build PR
#       check_self_mod_fence passes on the build PR
#   - A paused run returns zero merges (asserted by tests/test_metabolism_buildlane.py).
#   - concurrency group: metabolism-merge-lane ensures SINGLE active run at a time
#     so registries (synapse, ruling_graph, dag, ACTIVE_BUILD_MAP) never race.

on:
  # FIX-1 (BLOCKER-1): auto-chain MERGE after build (10:45).  15 12 * * * = 12:15 UTC
  # (~90 min after build fires; allows build + CI to complete).
  # metabolism_merge scans governance rows itself — no per-cycle input needed; the
  # script self-discovers eligible build PRs from governance.jsonl + GH API.
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:
    inputs:
      cycle_id:
        description: "Cycle id whose build PRs to merge"
        type: string
        required: false
        default: ""
      docket_branch:
        description: "Branch carrying the docket (default: metabolism/propose-<cycle_id>)"
        type: string
        default: ""
      force_run:
        description: "Force even when AUTONOMY_PAUSED=true (ops verification only)"
        type: boolean
        default: false

permissions:
  contents: write        # push merged commits
  pull-requests: write   # mark PRs ready + merge them

# ── SINGLE CONCURRENCY GROUP ────────────────────────────────────────────────
# This is the mechanical registry-race-safety guarantee from R-V2-5:
# only ONE metabolism-merge-lane run is active at any time.
# cancel-in-progress: false ensures a queued merge waits rather than being dropped.
concurrency:
  group: metabolism-merge-lane
  cancel-in-progress: false

jobs:
  merge:
    # KILL SWITCH — absent variable → treated as paused (default-safe).
    if: vars.AUTONOMY_PAUSED != 'true'
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip

      - name: install deps
        run: pip install --quiet pyyaml anthropic

      - name: MERGE (two-key-gated + fence-checked + rebase-autostash)
        env:
          AUTONOMY_PAUSED: ${{ vars.AUTONOMY_PAUSED }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          CYCLE_ID: ${{ github.event.inputs.cycle_id }}
          DOCKET_BRANCH_INPUT: ${{ github.event.inputs.docket_branch }}
          # FIX-5 (MINOR-11): prefer METABOLISM_MERGE_PAT over GITHUB_TOKEN.
          # GITHUB_TOKEN pushes and PR merges do NOT trigger pull_request workflows
          # (GitHub anti-recursion) — loop PRs would never get required CI checks,
          # which is fatal once required status checks are enforced on main.
          # A PAT with no-workflows scope gets CI checks while keeping the loop
          # unable to edit CI files.  Falls back to GITHUB_TOKEN when PAT absent
          # (pre-production / ops-verification mode).
          GH_TOKEN: ${{ secrets.METABOLISM_MERGE_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # Double-gate: runner-side AUTONOMY_PAUSED re-check.
          AP="$(printf '%s' "${AUTONOMY_PAUSED:-}" | tr '[:upper:]' '[:lower:]')"
          FR="$(printf '%s' "${FORCE_RUN:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "$AP" != "false" ] && [ "$FR" != "true" ]; then
            echo "AUTONOMY_PAUSED not 'false' (=${AUTONOMY_PAUSED:-<unset>}) — clean no-op. Zero merges."
            exit 0
          fi

          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          # FIX-1: On schedule (CYCLE_ID empty), discover all pending propose branches and
          # invoke the merge script per-cycle, same discovery idiom as adjudicate.yml.
          # The merge script is already gated on governance authorization + CI status, so
          # iterating all cycles is safe — ineligible cycles are no-ops inside the script.
          if [ -n "${CYCLE_ID:-}" ]; then
            PENDING_CYCLES="$CYCLE_ID"
          else
            PENDING_CYCLES="$(git ls-remote --heads origin 'refs/heads/metabolism/propose-*' \
              | awk '{print $2}' | sed 's|refs/heads/metabolism/propose-||' \
              | sort)"
            if [ -z "$PENDING_CYCLES" ]; then
              echo "no open propose branch found — clean no-op (schedule)."
              exit 0
            fi
            echo "schedule: discovered cycles: $(echo "$PENDING_CYCLES" | tr '\n' ' ')"
          fi

          for _CID in $PENDING_CYCLES; do
            _BRANCH="${DOCKET_BRANCH_INPUT:-metabolism/propose-$_CID}"
            echo "--- merge cycle_id=$_CID branch=$_BRANCH ---"

            git fetch origin "$_BRANCH" || { echo "branch $_BRANCH not on origin — skip"; continue; }
            git checkout "$_BRANCH" 2>/dev/null || git checkout -B "$_BRANCH" "origin/$_BRANCH" 2>/dev/null || { echo "checkout failed $_BRANCH — skip"; continue; }

            # R-V6-5 multi-lobe PROPOSE puts ALL of a cycle's dockets on ONE branch:
            # the base docket ($_CID.json, til) plus per-lobe dockets
            # ($_CID-<lobe>.json).  Enumerate every one (#2481 primitive) — the
            # branch name carries only the base id, so merging $_CID.json alone
            # silently strands authorized per-lobe build PRs.
            # Fallback: a propose branch cut before the primitive merged lacks
            # --list-dockets on its checkout — fall back to the base docket
            # (pre-fan-out behavior) instead of stranding the whole branch.
            _DOCKETS="$(python -m scripts.metabolism_adjudicate --list-dockets --cycle-id "$_CID")" \
              || _DOCKETS="data/metabolism/dockets/$_CID.json"
            if [ -z "$_DOCKETS" ]; then
              echo "no dockets for $_CID on this ref — skip."
              continue
            fi
            echo "dockets for $_CID: $(echo "$_DOCKETS" | tr '\n' ' ')"

            # Per-docket merge sweep — single-threaded by the concurrency group
            # above.  --keep-propose-branch: the branch hosts ALL sibling dockets,
            # so the script's own F3(a) deletion (fires after the FIRST docket's
            # merge) would strand un-merged siblings; the workflow owns deletion
            # at branch granularity below.
            _merged_any=0
            _inflight=0
            _docket_fail=0
            while IFS= read -r _DOCKET; do
              [ -n "$_DOCKET" ] && [ -f "$_DOCKET" ] || continue
              _DCID="$(basename "$_DOCKET" .json)"
              echo "--- merge docket cycle_id=$_DCID file=$_DOCKET ---"
              _OUT="$(python -m scripts.metabolism_merge \
                --cycle-id "$_DCID" \
                --docket-file "$_DOCKET" \
                --keep-propose-branch)" \
                || { echo "merge script failed for $_DCID — continuing"; _docket_fail=1; continue; }
              printf '%s\n' "$_OUT"
              if printf '%s\n' "$_OUT" | grep -q '"status": "merged"'; then
                _merged_any=1
              fi
              if printf '%s\n' "$_OUT" | grep -Eq '"status": "(ci_not_green|ci_not_green_at_audited_sha|audit_not_approved|merge_failed|noop_paused)"'; then
                _inflight=1
              fi
            done <<< "$_DOCKETS"

            # F3(a) at BRANCH granularity: delete the propose branch only when this
            # sweep merged something, saw nothing still in flight (CI pending /
            # audit pending / merge retryable), and no docket invocation crashed.
            # Anything retained is reaped by the GC propose-branch reaper (F3(b))
            # once the cycle journal is terminal and the retention window passes.
            if [ "$_merged_any" -eq 1 ] && [ "$_inflight" -eq 0 ] && [ "$_docket_fail" -eq 0 ]; then
              git push origin --delete "$_BRANCH" \
                && echo "propose branch $_BRANCH deleted (branch sweep terminal)" \
                || echo "could not delete $_BRANCH (non-fatal — GC reaper will catch it)"
            else
              echo "propose branch $_BRANCH retained (merged_any=$_merged_any inflight=$_inflight docket_fail=$_docket_fail)"
            fi
          done
          echo "merge sweep complete."

      - name: notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOKEN" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="[Metabolism] metabolism-merge run failed: ${RUN_URL}" || true
