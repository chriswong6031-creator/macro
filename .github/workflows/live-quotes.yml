name: live-quotes
# Zero-deploy live-price engine for the static GitHub-Pages dashboard.
#
# Every ~10 min on weekdays it fetches a last-price snapshot for the whole
# displayed universe (every data-sym the built site emits + a CORE index/futures
# set) and force-pushes it as a SINGLE commit to the `live-data` branch. The
# browser live.js fetches it from raw.githubusercontent (CORS '*', ~5-min CDN
# cache) — keyless, no Cloudflare Worker required. Force-push keeps main's history
# clean and the `live-data` branch at exactly one commit (no unbounded growth).
#
# Quotes are ~15-min Yahoo-delayed; set the POLYGON_API_KEY repo secret to serve
# real-time US prices from this job instead (the key never reaches the browser).
on:
  schedule:
    # ONE cron, and it ALWAYS runs the job. Every 5 min, Mon–Fri (tightened from
    # */10 per TSU: measured run duration ~80-100s across 2026-07-09/10 at the
    # full universe, >2x headroom in the 5-min slot; concurrency-cancel below
    # guards pile-up). Covers US + Asia + Europe equity sessions and the ~23h
    # weekday futures tape. Weekends fall back to the last close (correct).
    #
    # WHY THE SECOND CRON IS GONE (2026-07-30). This used to be a */5 browser
    # tick gated off by VPS_LIVE_PRIMARY plus an ungated */15 tape-gate tick. The
    # pair interacted badly with GitHub's schedule starvation, which is severe in
    # this repo: in the 8h RTH window on 2026-07-29 GitHub delivered 104 scheduled
    # runs across ALL 46 scheduled workflows, and live-quotes got 11 of its 128
    # ticks (8.6%). Of those 11, roughly half were the */5 tick whose job `if:`
    # evaluated false — so they concluded `skipped` in 1-9 seconds having written
    # nothing. HALF OF THE SCARCE DELIVERED SLOTS PRODUCED NO SNAPSHOT. Collapsing
    # to a single always-running cron therefore roughly DOUBLES the effective
    # writer cadence without asking GitHub for a single extra run.
    #
    # It also removes a live hazard: `concurrency` below is workflow-level with
    # cancel-in-progress, but the old `if:` was JOB-level, so a skipped tick still
    # entered the group and could cancel a real snapshot mid-fetch.
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Only the latest snapshot matters — cancel any in-flight run so a slow fetch
  # can't pile up behind the next tick.
  group: live-quotes
  cancel-in-progress: true

jobs:
  snapshot:
    # NO JOB GATE. `live-data` has three consumers and the VPS writes it for none
    # of them: the browser's fallback, marketing-publish.yml's tape gate (which
    # refuses any signal it cannot verify against a quote younger than
    # publish.live_gate.max_quote_age_min = 45), and — since #3941 — the Hot Tape
    # radar, whose ceiling is far tighter. VPS_LIVE_PRIMARY went true at
    # 2026-07-27T22:50Z and the gate immediately cost more than it saved: it froze
    # the branch head at 22:31:59Z, the tape gate started re-verifying against a
    # SEVENTEEN-HOUR-OLD snapshot ("quote for ROST is 452m old (max 45m)") and
    # held the desk network's whole queue, and after that was patched with the
    # */15 exemption the surviving cadence was still too slow for the radar. The
    # VPS serves the browser; it does not write this branch. Until it does, this
    # job is the only thing that keeps the branch alive, so it always runs.
    runs-on: ubuntu-latest
    # Cap raised 800 → 2200 (2026-07-09) → 3000 (2026-07-12, HK basket pulse:
    # the membership leg joins every US+HK basket member; production universe
    # ~2130). Measured Yahoo rate ~37 symbols/s → ~58 s at today's universe.
    #
    # 8 → 15 (2026-07-30). The fetch was never the problem; `checkout` was. Two of
    # the eleven delivered ticks on 2026-07-29 (runs 30470042079 at 16:17Z and
    # 30487564493 at 20:12Z) spent their ENTIRE budget inside
    # `git fetch --depth=1` and were killed at 8m06s having written nothing — an
    # 18% loss on top of the starvation. The sparse cone below is the real fix;
    # this raise is the margin, because a runner that is slow once will be slow
    # again and a snapshot that arrives late still beats one that never arrives.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        # BLOBLESS + SPARSE. A bare `fetch-depth: 1` still materializes the whole
        # tree — 2827 MB across 49,266 tracked files, and on a slow runner that
        # exceeds the job budget outright (see the timeout note above). The cone
        # is this lane's exact read surface, ~410 MB:
        #   engine, scripts, lib, config,
        #   app                           — the code (~48 MB with the root files).
        #                                   `app` is NOT decorative: build_live_quotes
        #                                   imports app.tape_symbols at module scope,
        #                                   so omitting it does not degrade the
        #                                   universe, it stops the script importing
        #                                   at all. Verified by materializing this
        #                                   exact cone and building the universe in
        #                                   it (2113 symbols, 147 .HK — identical to
        #                                   the full tree).
        #   data/baskets                  — basket_member_symbols() reads
        #                                   membership.json from here. Cone mode is
        #                                   recursive and data/baskets' only child
        #                                   is ohlcv (284 MB), so this leg is the
        #                                   bulk of the cone. It is NOT optional:
        #                                   without it the ~810 US+HK basket
        #                                   members silently leave the universe,
        #                                   which is the GAP-3 regression that the
        #                                   membership leg exists to prevent.
        #   data/baskets_hk               — the HK membership file (~0.1 MB)
        #   site/live                     — a BOUNDARY entry, not a read: cone mode
        #                                   includes every file sitting directly in
        #                                   an ancestor of a listed path, so this is
        #                                   how scrape_site_symbols gets site/*.html
        #                                   (371 files, 74 MB) without dragging in
        #                                   site/stocks (200 MB) and the rest of the
        #                                   9,155-file site tree.
        # top_conviction() reads site/stockdata/index.json, which does not exist in
        # the tree — it already returns [] in production and needs no cone entry.
        # Adding a read path to this script means adding it HERE too.
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            app
            engine
            scripts
            lib
            config
            data/baskets
            data/baskets_hk
            site/live
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Quotes-only: needs just requests (+ pyyaml for lib.config). No pandas/scipy.
      - run: pip install requests pyyaml
      - name: build live-quotes snapshot
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python -m scripts.build_live_quotes --out quotes.json
      - name: force-push snapshot to the live-data branch
        run: |
          set -euo pipefail
          test -s quotes.json
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          # Single-commit orphan branch: stage ONLY quotes.json, never main's tree.
          git checkout --orphan live-data-tmp
          # `git read-tree --empty`, NOT `git rm -rf --cached .` — the sparse
          # checkout above breaks the latter. `git rm` honours sparse rules and
          # silently refuses to touch entries outside the cone, so `.` expands to
          # the handful of in-cone paths and leaves the rest of the index intact:
          # measured 30,896 entries surviving, and the "single-commit orphan
          # branch" then carried the WHOLE REPOSITORY on every 5-minute push.
          # It fails silently in the worst way — quotes.json is still at the top
          # of the tree, so raw.githubusercontent keeps serving it and every
          # consumer looks healthy while the branch grows a full tree per tick.
          # read-tree operates on the index directly and ignores sparse rules:
          # verified 0 entries after, tree == exactly ["quotes.json"], both with
          # the cone set and without it.
          git read-tree --empty
          git add -f quotes.json
          git commit -m "live quotes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin HEAD:live-data
