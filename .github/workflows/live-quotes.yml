name: live-quotes
# Zero-deploy live-price engine for the static GitHub-Pages dashboard.
#
# Every ~10 min on weekdays it fetches a last-price snapshot for the whole
# displayed universe (every data-sym the built site emits + a CORE index/futures
# set) and force-pushes it as a SINGLE commit to the `live-data` branch. The
# browser live.js fetches it from raw.githubusercontent (CORS '*', ~5-min CDN
# cache) — keyless, no Cloudflare Worker required. Force-push keeps main's history
# clean and the `live-data` branch at exactly one commit (no unbounded growth).
#
# Quotes are ~15-min Yahoo-delayed; set the POLYGON_API_KEY repo secret to serve
# real-time US prices from this job instead (the key never reaches the browser).
on:
  schedule:
    # Every 5 min, Mon–Fri (tightened from */10 per TSU: measured run duration
    # ~80-100s across 2026-07-09/10 at the full universe, >2x headroom in the
    # 5-min slot; concurrency-cancel below guards pile-up). Covers US + Asia +
    # Europe equity sessions and the ~23h weekday futures tape. Weekends fall
    # back to the last close (correct).
    - cron: "*/5 * * * 1-5"
    # Every 15 min, Mon–Fri — the TAPE-GATE feed, and it runs even when the VPS
    # is the browser's primary (see the job `if:`). `live-data` has a second
    # consumer the VPS cutover did not account for: marketing-publish.yml fetches
    # it into data/marketing/live_quotes_snapshot.json every sweep, and the
    # publisher's live gate refuses to post any signal it cannot verify against a
    # quote younger than publish.live_gate.max_quote_age_min (45). 15 min keeps
    # that comfortably satisfied at a third of the browser cadence's cost. This
    # is a subset of the */5 slots above, so when BOTH are enabled the duplicate
    # tick is cancelled by the concurrency group below.
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Only the latest snapshot matters — cancel any in-flight run so a slow fetch
  # can't pile up behind the next tick.
  group: live-quotes
  cancel-in-progress: true

jobs:
  snapshot:
    # The BROWSER fallback (*/5) is disabled once the VPS passes its production
    # soak and VPS_LIVE_PRIMARY=true is set. Manual recovery always remains.
    #
    # The */15 tick is NOT gated on that variable, because `live-data` feeds a
    # consumer the VPS cutover did not account for. VPS_LIVE_PRIMARY went true at
    # 2026-07-27T22:50Z; every scheduled run since concluded `skipped`, so the
    # branch head froze at 22:31:59Z. marketing-publish.yml keeps fetching it and
    # the publisher's tape gate kept re-verifying against a SEVENTEEN-HOUR-OLD
    # snapshot ("quote for ROST is 452m old (max 45m)"), holding the desk
    # network's entire queue — the repo's other two quote artifacts
    # (site/live/quotes.json, site/marketdata/sp500_heatmap.json) were equally
    # stale on main, so nothing else could satisfy the gate. The VPS serves the
    # browser; it does not write this branch. Until it does, this tick is the
    # tape gate's only fresh source.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || vars.VPS_LIVE_PRIMARY != 'true'
          || github.event.schedule == '*/15 * * * 1-5' }}
    runs-on: ubuntu-latest
    # Cap raised 800 → 2200 (2026-07-09) → 3000 (2026-07-12, HK basket pulse:
    # the membership leg joins every US+HK basket member; production universe
    # ~2130). Measured Yahoo rate ~37 symbols/s → ~58 s at today's universe,
    # still ~12 % of the 8-min timeout. File size ~300 KB (< 500 KB browser
    # budget). Timeout unchanged.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Quotes-only: needs just requests (+ pyyaml for lib.config). No pandas/scipy.
      - run: pip install requests pyyaml
      - name: build live-quotes snapshot
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python -m scripts.build_live_quotes --out quotes.json
      - name: force-push snapshot to the live-data branch
        run: |
          set -euo pipefail
          test -s quotes.json
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          # Single-commit orphan branch: stage ONLY quotes.json, never main's tree.
          git checkout --orphan live-data-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f quotes.json
          git commit -m "live quotes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin HEAD:live-data
