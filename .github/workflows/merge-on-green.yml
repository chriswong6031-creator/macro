name: merge-on-green
# The account-side substitute for branch protection (operator ruling 2026-07-28).
#
# The merge-on-CONCLUDED-checks law is right, but obeying it by hand made every
# session a CI hostage for 20-60 minutes. Every GitHub-native alternative is
# structurally unavailable on this account:
#   * a user-account ruleset cannot grant the github-actions app a bypass
#     (422 — organization-only), so the lanes cannot be exempted from a rule;
#   * ANY required-status-check rule (ruleset OR classic protection) would also
#     block render.yml / the nightly lanes' direct GITHUB_TOKEN pushes to main,
#     breaking the deploy path in order to fix the merge path;
#   * `gh pr merge --auto --squash` is not a wait — with no branch protection
#     there are no required checks to gate on, so it merges IMMEDIATELY
#     (verified PR #3889, 2026-07-28: merged ~1 min after arming, packs pending).
#
# So a session arms its PR with the `merge-on-green` label and stops; this sweep
# performs the merge it would otherwise have sat there waiting to perform. The
# discipline is unchanged — nothing merges until every check has CONCLUDED clean
# (the known-spurious `Workers Builds: macro` X excluded). A genuine red or a
# conflict gets the `merge-blocked` label plus one explanatory comment instead.
#
# The original ten-minute schedule routinely arrived 1-3 HOURS late under this
# repository's workflow load. `workflow_run` is now the primary trigger: the
# sweeper wakes as soon as either proof workflow or the main-baseline workflow
# concludes. The cron remains only as a recovery net for third-party checks and
# missed events, and it is a WEAK one: measured 2026-08-06, exactly 1 of the last
# 100 sweep runs was a `schedule` event across a 117-minute window (~0.5/hr
# against a nominal 6/hr). Nothing in this lane may lean on the cron alone.
on:
  workflow_run:
    workflows: [ci, fences, integration-baseline]
    types: [completed]
  schedule:
    # Recovery net only. Completed proof workflows provide the normal wake-up.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write         # READ the integration-baseline / ci / fences workflow-run
                         # state, and WRITE one `workflow_dispatch` of ci.yml on main.
                         # The write half is new (2026-08-08) and is load-bearing: the
                         # base-inherited-red refresh can only tell an inherited red
                         # from a real one against a RECENT proof of main, ci.yml has
                         # no `push` trigger, and the nightly/wire lanes push ~24
                         # `[skip ci]` commits per 2 hours — so main's proof was
                         # measured 12 HOURS stale while 48 pull requests sat armed,
                         # waiting for a human to run `gh workflow run ci.yml --ref
                         # main`. The sweeper now orders that baseline itself when its
                         # proof is too old to answer the reds it just saw.
                         #
                         # It dispatches integration-baseline.yml on main for the same
                         # class of reason (2026-08-08). That workflow DOES have a
                         # `push` trigger, but its paths: filter excludes data/site
                         # publisher commits, so only SOURCE pushes re-prove main and
                         # only merges make source pushes — a baseline that ages past
                         # the freshness bound therefore blocks the merges that would
                         # have refreshed it. Both dispatches are rate-floored in
                         # scripts/merge_on_green.py and never fail the sweep.
  contents: write        # squash-merge and merge main into a clean-but-stale
                         # head (update-branch)
  pull-requests: write   # add/remove merge-blocked, post the explanatory comment
  issues: write          # lazily create/add/remove the durable refresh-lease label

# Concurrency belongs on the JOB, after its event gate, and only now that the job
# has a runner no workload can saturate. A former workflow-wide constant group
# livelocked this lane to 0 successes in 100 runs: the shared hosted queue held the
# one pending slot for 25-107 minutes while a new trigger replaced it every ~50 s.
# The job-level group below instead coalesces only redundant FULL reconciliations.
# Failure wake-ups are keyed by head SHA because each one runs a bounded marker pass
# for exactly that head; coalescing different failed heads would recreate #5291's
# invisible-red window. `cancel-in-progress: false` protects a sweep already doing
# work, while the dedicated runner keeps the pending interval to seconds rather
# than hours. The live-state race guards in scripts/merge_on_green.py remain as
# defense in depth for pre-deploy runs and out-of-band callers.

jobs:
  sweep:
    name: sweep
    # Runner-minute control now lives HERE rather than in a concurrency group,
    # because a skipped job costs no runner, no queue slot, and no minutes, while
    # a cancelled one cost us the sweep itself.
    #
    # A merge becomes possible only when a check goes GREEN, so only `success` pays
    # for a full backlog sweep. The other conclusions are admitted only to bounded
    # special passes: `failure` marks one exact red head, while cancelled/skipped/
    # neutral/etc. check whether a durable lease exists and only then request one
    # serialized full reconciliation. Their shared special
    # concurrency key coalesces bursts; special jobs never inspect or mutate the
    # durable lease, eliminating cross-group ownership races.
    #
    # Failure used to be skipped too. That is DISPROVEN (2026-08-11, PR #5291), so
    # it is admitted for a bounded MARK-ONLY pass, never a sweep. "A red PR simply
    # stays armed" assumed nothing else touches the label during the window in which
    # the red is real and unmarked. Measured: ci run 31449929887 concluded FAILURE at
    # 02:05:18Z; at 02:13:34Z another session removed `merge-on-green` with no
    # `merge-blocked` and no comment; the 02:13:41Z sweep listed the ARMED pull
    # requests and #5291 was no longer among them. An external disarm inside the
    # unmarked window (8 minutes here) makes the pull request permanently invisible
    # to a label-filtered sweep, so no later sweep — and no cron, measured at ~0.5/hr
    # against a nominal 6 — can ever deliver the marker. The marker must land BEFORE
    # the window, not after it.
    #
    # COST BOUND, which is why this does not undo the 2026-08-06 arithmetic above: a
    # failure wake-up runs `mark_only_pass`, which never merges, never refreshes,
    # never dispatches a baseline and never walks the backlog. It costs ~4-8 REST
    # calls (listing + one check-run page + at most the proof lookup + two writes)
    # against READ_TOKEN's 1,000/hr PER-REPOSITORY budget, so even at ~26 failure
    # wake-ups/hour it stays far inside the bucket a real sweep needs.
    #
    # Every completed proof conclusion is admitted, but only success performs a
    # full sweep and failure performs a marker pass. Cancelled/skipped/neutral/etc.
    # perform an O(1) lease census and self-wake only for a live durable owner, so a
    # vanished proof cannot strand the high-load lane and unrelated cancellations
    # cannot recreate the sweep storm. Only the resulting serialized full sweep may
    # add or remove the lease label.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion != ''

    concurrency:
      group: >-
        merge-on-green-${{ github.event_name != 'workflow_run'
        && 'sweep'
        || github.event.workflow_run.conclusion == 'failure'
        && format('mark-{0}', github.event.workflow_run.head_sha)
        || github.event.workflow_run.conclusion == 'success'
        && 'sweep'
        || 'lease-reconcile' }}
      cancel-in-progress: false

    # CONTROL PLANE, NOT WORKLOAD. On 2026-08-11 the hosted pool was hard-saturated
    # at 180 running jobs with 91 queued; sweeps waited 4-16 minutes and then finished
    # in 6-39 seconds while mac-builder-4 sat online and idle. The unique
    # `merge-control` label reserves that tiny runner for this arbiter. It carries no
    # render-linux, render-heavy, macstudio, or macstudio-light label, so render,
    # nightly, and light workloads cannot land here. Never replace the unique label
    # with `parked`: mac-builder-5 also carries `parked` and is nightly failover.
    #
    # The job needs only Python, network, a sparse checkout, and PyYAML; no
    # setup-python step or persistent workspace is load-bearing.
    runs-on: [self-hosted, macOS, ARM64, merge-control]
    timeout-minutes: 15

    steps:
      # The sweeper needs a handful of tracked files, not the repository's ~53k-file
      # working tree. The old full checkout took ~100 seconds before the first
      # API call and made a two-minute control-plane action a four-minute one.
      #
      # `.github/workflows/` is here because the tested-surface gate reads every
      # `on.pull_request` workflow's `paths:` filter to decide whether main has moved
      # under a pull request's proof (#4583). The whole directory, never a hardcoded
      # ci.yml/fences.yml pair: a new PR-triggered workflow must be seen the day it
      # is added, not the day someone remembers to edit this list. If it stops being
      # fetched the sweep aborts loudly (`Could not establish the tested-surface
      # gate`) rather than merging on undated greens.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts/merge_on_green.py
            scripts/gh_path_filter.py
            .github/workflows
          sparse-checkout-cone-mode: false

      # PyYAML parses those path filters. Installed EXPLICITLY rather than assumed:
      # whether the runner image ships it is not a contract, and the failure mode of
      # guessing wrong is a sweep that aborts on every run.
      #
      # IMPORT-FIRST, WITH FALLBACKS. The hosted image normally accepts the plain
      # install, but image contents are not a contract: skip when PyYAML is already
      # importable, then retain user/PEP-668 fallbacks so image drift cannot turn every
      # sweep into an outage. Nothing here writes a venv or carries runner state.
      - name: install the yaml parser
        run: |
          if python3 -c "import yaml" 2>/dev/null; then
            echo "pyyaml already importable on ${RUNNER_NAME:-this runner}"
            exit 0
          fi
          python3 -m pip install --quiet --disable-pip-version-check pyyaml \
            || python3 -m pip install --quiet --disable-pip-version-check --user pyyaml \
            || python3 -m pip install --quiet --disable-pip-version-check \
                 --break-system-packages pyyaml
          python3 -c "import yaml"

      - name: sweep merge-on-green pull requests
        env:
          GH_REPO: ${{ github.repository }}
          # READS use the job's own GITHUB_TOKEN. Its quota is per-repository and
          # separate from the shared 5,000/hr account pool that ship_loop_guard.py
          # and every parallel session draw on — a sweep every 10 minutes must not
          # spend the budget those depend on to finish their own work.
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WRITES prefer the PAT, and the reason is load-bearing: a merge made
          # with GITHUB_TOKEN does NOT fire push-triggered workflows (GitHub's
          # anti-recursion rule), so render.yml would never see a sweeper merge
          # and the ?v= re-stamp / .j2 re-bake would silently never happen. With
          # ADMIN_GH_TOKEN the push event fires and render.yml runs normally.
          # On the fallback the merge still lands and the VPS's 3-minute pull of
          # main plus the nightly scope=all re-render still deliver it — degraded,
          # not broken, which is why the fallback is allowed to exist at all.
          #
          # This is also the token that dispatches the main baseline (see the
          # `actions: write` note above), and the PAT is preferred there for the same
          # anti-recursion reason. On the GITHUB_TOKEN fallback the dispatch degrades
          # the same way the merge does: worst case main keeps being proven only by a
          # human dispatch, which is exactly the status quo this repairs — never worse.
          MERGE_TOKEN: ${{ secrets.ADMIN_GH_TOKEN || secrets.GITHUB_TOKEN }}
          # The head the workflow_run that woke this sweep concluded on. The sweeper
          # sizes its pull-request window from READ_TOKEN's live core limit (25 at the
          # historical 1,000/hr, up to 100 after the Enterprise transfer). This puts
          # the pull request the trigger is ABOUT first inside that cap, so the cap
          # costs no latency in the case the workflow_run trigger exists to serve.
          # Empty for schedule/workflow_dispatch, which is harmless — it only reorders
          # within the cap and never passes a gate.
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # HOW that run concluded. `failure` selects the bounded mark-only pass (see
          # the `if:` essay above and `mark_only_pass` in the script); another
          # non-success conclusion only self-wakes a serialized sweep. The empty
          # string a cron or dispatch supplies and `success` run the full sweep.
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # Self-dispatch recovery must ignore the run currently making the
          # decision while still coalescing with any different pending successor.
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/merge_on_green.py
