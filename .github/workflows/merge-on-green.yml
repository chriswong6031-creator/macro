name: merge-on-green
# The account-side substitute for branch protection (operator ruling 2026-07-28).
#
# The merge-on-CONCLUDED-checks law is right, but obeying it by hand made every
# session a CI hostage for 20-60 minutes. Every GitHub-native alternative is
# structurally unavailable on this account:
#   * a user-account ruleset cannot grant the github-actions app a bypass
#     (422 — organization-only), so the lanes cannot be exempted from a rule;
#   * ANY required-status-check rule (ruleset OR classic protection) would also
#     block render.yml / the nightly lanes' direct GITHUB_TOKEN pushes to main,
#     breaking the deploy path in order to fix the merge path;
#   * `gh pr merge --auto --squash` is not a wait — with no branch protection
#     there are no required checks to gate on, so it merges IMMEDIATELY
#     (verified PR #3889, 2026-07-28: merged ~1 min after arming, packs pending).
#
# So a session arms its PR with the `merge-on-green` label and stops; this sweep
# performs the merge it would otherwise have sat there waiting to perform. The
# discipline is unchanged — nothing merges until every check has CONCLUDED clean
# (the known-spurious `Workers Builds: macro` X excluded). A genuine red or a
# conflict gets the `merge-blocked` label plus one explanatory comment instead.
#
# The original ten-minute schedule routinely arrived 1-3 HOURS late under this
# repository's workflow load. `workflow_run` is now the primary trigger: the
# sweeper wakes as soon as either proof workflow or the main-baseline workflow
# concludes. The cron remains only as a recovery net for third-party checks and
# missed events, and it is a WEAK one: measured 2026-08-06, exactly 1 of the last
# 100 sweep runs was a `schedule` event across a 117-minute window (~0.5/hr
# against a nominal 6/hr). Nothing in this lane may lean on the cron alone.
on:
  workflow_run:
    workflows: [ci, fences, integration-baseline]
    types: [completed]
  schedule:
    # Recovery net only. Completed proof workflows provide the normal wake-up.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: read          # read integration-baseline workflow-run state
  contents: write        # squash-merge, delete the merged head ref, and merge
                         # main into a clean-but-stale head (update-branch)
  pull-requests: write   # add/remove merge-blocked, post the explanatory comment

# NO `concurrency:` BLOCK — DELIBERATELY. Do not reintroduce one (2026-08-06).
#
# This lane used to carry `group: merge-on-green` + `cancel-in-progress: false`,
# reasoning that "a sweep that is mid-merge must finish — cancelling it could
# leave a PR labeled but unmerged". The property is right; the mechanism did the
# opposite of protecting it. Measured on the 100 runs before this commit:
#
#   conclusions        cancelled: 98, (in flight): 2, success: 0   <- in ~2 hours
#   94 of 98 cancelled runs died within 3 SECONDS of the NEXT run being created
#   the longest-lived cancelled run (482 s) had ZERO jobs materialised
#
# `cancel-in-progress: false` protects only an IN-PROGRESS run. GitHub keeps
# exactly ONE *pending* run per group and cancels the previous one on every new
# arrival, and the pending state includes the wait for a runner. Triggers arrive
# here every 50 s (median; 0.86/min), so the pending slot was overwritten long
# before it could ever be promoted.
#
# What held the group was not a sweep doing work. `ci` (48 queued / 8 running)
# and `fences` (34 queued / 1 running) are ALSO `ubuntu-latest`, so the sweeper
# queues behind its own triggers on a capacity-capped pool: run 31055861804 sat
# `queued` for 107 minutes, and the last run that ever succeeded (31054326485)
# waited 25m38s for a runner and then did the entire sweep in 46 SECONDS. The
# group therefore serialised a multi-hour queue wait, and every wake-up that
# arrived during it was destroyed. A livelock, not a backlog.
#
# Removing the group cannot reintroduce the labeled-but-unmerged hazard: with no
# group, NOTHING here is ever cancelled by concurrency at all — which protects a
# mid-merge sweep strictly more than `cancel-in-progress: false` did, since that
# setting never protected the pending runs that were the ones actually dying. The
# sweep is a level-triggered reconciler (it re-lists every labeled PR and re-derives
# every verdict from GitHub's live state on each run, carrying nothing across runs),
# so overlapping sweeps are safe; the one genuine race — a second sweep mistaking
# "another sweep already merged this" for a conflict and labelling a MERGED PR
# `merge-blocked` — is guarded in scripts/merge_on_green.py (`already_settled`)
# and pinned by tests/test_merge_on_green.py.

jobs:
  sweep:
    name: sweep
    # Runner-minute control now lives HERE rather than in a concurrency group,
    # because a skipped job costs no runner, no queue slot, and no minutes, while
    # a cancelled one cost us the sweep itself.
    #
    # A merge becomes possible only when a check goes GREEN. A triggering run that
    # concluded `cancelled`, `failure`, or `skipped` cannot make any PR mergeable,
    # and waking for those is what produced 0.86 runs/min. Measured on ci's last
    # 100 completed runs: 51 failure, 25 cancelled, 18 skipped, 6 success — so this
    # gate drops ~94% of the wake-ups while keeping every one that can actually
    # unblock a merge. Expected volume is ~5-6 real sweeps/hour, at or below what
    # the nominal 10-minute cron was always meant to cost.
    #
    # What this trades away: prompt `merge-blocked` labelling on a fresh red. That
    # ride now falls to the cron or to the next green anywhere in the repo. It fails
    # SAFE in the only direction that matters — a red PR simply stays armed and
    # unmerged, which is the correct outcome either way.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'

    # DELIBERATELY GitHub-hosted, never [self-hosted, macstudio]. The mac pool is
    # the render/nightly/engine lane and is routinely saturated; a merge sweep
    # queued behind a 67-minute render would defeat its own purpose. This job is
    # a handful of API calls and needs nothing from that pool. NOTE (2026-08-06):
    # `ubuntu-latest` is now contended too — see the queue measurements above. The
    # light self-hosted pool is NOT an alternative (it is a single runner,
    # mac-builder-3, chartered for the live-tick lanes); choosing a different pool
    # is an operator call, not something this file should decide unilaterally.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The sweeper needs one tracked Python file, not the repository's ~53k-file
      # working tree. The old full checkout took ~100 seconds before the first
      # API call and made a two-minute control-plane action a four-minute one.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts/merge_on_green.py
          sparse-checkout-cone-mode: false

      - name: sweep merge-on-green pull requests
        env:
          GH_REPO: ${{ github.repository }}
          # READS use the job's own GITHUB_TOKEN. Its quota is per-repository and
          # separate from the shared 5,000/hr account pool that ship_loop_guard.py
          # and every parallel session draw on — a sweep every 10 minutes must not
          # spend the budget those depend on to finish their own work.
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WRITES prefer the PAT, and the reason is load-bearing: a merge made
          # with GITHUB_TOKEN does NOT fire push-triggered workflows (GitHub's
          # anti-recursion rule), so render.yml would never see a sweeper merge
          # and the ?v= re-stamp / .j2 re-bake would silently never happen. With
          # ADMIN_GH_TOKEN the push event fires and render.yml runs normally.
          # On the fallback the merge still lands and the VPS's 3-minute pull of
          # main plus the nightly scope=all re-render still deliver it — degraded,
          # not broken, which is why the fallback is allowed to exist at all.
          MERGE_TOKEN: ${{ secrets.ADMIN_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/merge_on_green.py
