name: prophet-live
# ─────────────────────────────────────────────────────────────────────────────
# PROPHET LIVE P0 — the 5-minute provisional-close evaluator
# (research/PROPHET_LIVE_INTRADAY_SIGNALS_MASTERPLAN_BY_FABLE.md §4.2).
#
# Every 5 minutes from 09:25 to 16:15 America/New_York on weekdays it loads the
# nightly armed pack from R2, merges the freshest 15-min-delayed quote view, and
# publishes provisional per-name states plus an event spool. The nightly build
# arms the levels; this lane only compares a price to them. There is no second
# signal engine and nothing here confirms anything — the nightly does that.
#
# MEASURE-DARK (P0). No user surface reads these artifacts. They exist so the
# forward ledger (data/prophet_live/forward.parquet, written by the nightly
# reconciler) can accrue the evidence the §6 promotion gauntlet needs before any
# state earns a place on a page.
#
# THIS RUNS ON ubuntu-latest, NEVER the self-hosted macstudio pool: ~80 runs a
# day on the render pool would eat the nightly's budget, which is law
# (masterplan §3 runner-placement law, hot-tape precedent).
#
# LEDGER LAW (G0.2). This lane writes NO data/ path and commits nothing. Note
# `permissions: contents: read` and the total absence of a git step — the only
# outputs are two R2 keys. The nightly reconciler is the sole writer of
# data/prophet_live/, and the nightly build is the sole advancer of any ledger.
#
# WHY IT IS SAFE. Nothing here can reach a user: no page fetches these keys in
# P0, no alert channel is wired (that is P2), and the kill switch below stands
# the whole lane down without a commit.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # GITHUB CRON HAS NO TIMEZONE — it is UTC, always. The session window is
    # 09:25-16:15 America/New_York, which is 13:25-20:15Z under EDT and
    # 14:25-21:15Z under EST, so a single UTC pair is wrong for half the year:
    # from the November clock change it would wake an hour before the open and
    # go dark for the last hour of every session — the hour whose state matters
    # most, because close-dependence shrinks as the session ends.
    #
    # These crons therefore span BOTH regimes, 13:25Z through 21:15Z, and
    # engine/prophet_live/live_states.in_window trims the off-season edges on
    # the EASTERN clock (an EST 13:25Z tick is 08:25 ET and stands down; an EDT
    # 21:15Z tick is 17:15 ET and stands down). The cost of the overlap is a
    # handful of ~20-second no-op runs a day on ubuntu-latest; the cost of
    # getting it wrong is a dark hour every session for five months.
    #
    # Three crons because GitHub's cron cannot express "every 5 minutes from
    # :25 of one hour to :15 of another".
    - cron: "25,30,35,40,45,50,55 13 * * 1-5"
    - cron: "*/5 14-20 * * 1-5"
    - cron: "0,5,10,15 21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          DRY RUN — load the pack and quotes, evaluate, print the artifact and the
          transitions, and write NOTHING to R2. The PR receipt mode.
        required: false
        type: boolean
        default: false

permissions:
  contents: read      # LEDGER LAW: this lane never commits. Do not widen this.

concurrency:
  # Two passes must never overlap: both would read the same previous artifact,
  # both would see the same pass as the debounce predecessor, and a cross could
  # be promoted on one repeated tick instead of two distinct ones. Never cancel a
  # pass in flight either — it may already have published the state map, and the
  # next tick is only five minutes away.
  group: prophet-live
  cancel-in-progress: false

jobs:
  evaluate:
    # Operator kill switch: set repo variable PROPHET_LIVE_DISABLED=true to stand
    # the lane down with no commit and no code change.
    if: vars.PROPHET_LIVE_DISABLED != 'true'
    runs-on: ubuntu-latest      # OFF the render path — never the macstudio pool
    # A pass is seconds of compute plus two small R2 round trips. 8 minutes is
    # generous head-room and small enough that a wedged run frees the concurrency
    # group before the next cron.
    timeout-minutes: 8
    steps:
      - name: checkout (shallow + sparse + blobless)
        # SHALLOW, SPARSE AND BLOBLESS. This lane runs ~80 times a day and needs
        # no history at all: it reads code plus two committed quote artifacts and
        # publishes to R2. A full clone of this heavy-churn repo is ~2.8GB across
        # ~48k files and has blown a 25-minute job on its own (marketing-publish,
        # 2026-07-28). The cone below is this lane's exact read surface, and cone
        # mode always includes top-level files, so config.yml comes along:
        #   engine, scripts, lib   — the code (live_verify + prophet_live + the
        #                            NYSE session calendar)
        #   site/live              — display quote snapshot (quotes.json)
        #   site/marketdata        — sp500 heatmap (the pct-only fallback)
        # data/marketing/ is NOT in the cone: the quote snapshot below is fetched
        # from the live-data branch into a runner-local path and never committed.
        # Adding a read path to the evaluator means adding it HERE too.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            engine
            scripts
            lib
            site/live
            site/marketdata

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        # NO PANDAS, deliberately — ~40s of install this lane would pay 80 times a
        # day. live_verify imports pandas only inside its earnings helper, which
        # this lane never calls; live_states and the state machine are stdlib.
        # pyyaml: config.yml's prophet_live block. boto3: R2. The two PUTs are
        # S3 API calls — the public r2.dev base is read-only, and reads go through
        # the same authenticated client on purpose so a CDN-cached copy of the
        # previous pass can never corrupt the debounce counters.
        run: pip install --quiet pyyaml boto3

      - name: fetch full-universe live quotes (evaluator input)
        # Copied from marketing-hot-tape.yml / marketing-publish.yml. The live-data
        # orphan branch carries a ~2k-symbol quotes.json refreshed every 5 min in
        # RTH (15-min-delayed prices) — the SAME merge the rest of the estate
        # reasons about, so this lane and the content desks never disagree about
        # the tape. No vendor API call, no key.
        #
        # The destination is runner-local scratch that is never staged: there is no
        # git step in this workflow at all (LEDGER LAW).
        #
        # Fail-soft: without the snapshot load_live_quotes falls back to
        # site/live/quotes.json + the sp500 heatmap, and the per-name freshness
        # gate darks whatever is left stale rather than guessing.
        run: |
          mkdir -p data/marketing
          if git fetch --depth 1 origin live-data && \
             git show FETCH_HEAD:quotes.json > data/marketing/live_quotes_snapshot.json 2>/dev/null; then
            echo "live quotes snapshot: $(wc -c < data/marketing/live_quotes_snapshot.json) bytes"
          else
            echo "::warning title=prophet-live::live-data quotes unavailable — falling back to site/live artifacts"
            rm -f data/marketing/live_quotes_snapshot.json
          fi

      - name: evaluate the armed pack against the live tape
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # The same R2 data plane every build_* script publishes to. Absent creds
          # → the pass still evaluates off the public mirror and publishes nothing,
          # which is honest: the artifact keeps its previous stamp and the next
          # pass sees no debounce predecessor.
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ "${DRY_RUN:-}" = "true" ]; then
            python -m scripts.prophet_live_evaluator --dry-run
          else
            python -m scripts.prophet_live_evaluator
          fi
