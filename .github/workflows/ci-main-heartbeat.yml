name: ci-main-heartbeat
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS EXISTS — the ci.yml main-blind-spot (2026-07-23).
#
# ci.yml triggers on `pull_request` + `workflow_dispatch` ONLY — no `push:` and no
# `schedule:`. So its ~50 guard jobs (nav-gap, font-ui, contract-drift,
# template-site-sync, the engine-render-guards batch, dag-conformance, …) NEVER run
# against a commit that is already on main. A guard can therefore go red ON MAIN and
# nothing re-checks it: a nightly `[skip ci]` bot re-bake trips nav-gap/font-ui, or a
# PR merges while its path-filter didn't re-run a sibling test. The rot only surfaces
# later, as a red X on the next UNRELATED PR that happens to touch a matching path.
#
# The metabolism MAIN-RED SENTINEL (scripts/metabolism_immune.py, cron 15 */2 * * *)
# reads /repos/…/commits/<main_sha>/check-runs to find red checks on main — but it is
# STRUCTURALLY BLIND here: check-runs only exist for workflows that actually ran on the
# commit, and ci.yml never runs on main → zero ci.yml check-runs on main → sentinel
# sees green. (2026-07-23: 5 lanes had rotted red on main invisibly.)
#
# This heartbeat closes the gap. On a `schedule`, GitHub runs it against the default
# branch HEAD (= origin/main), producing check-runs ON the main commit that the immune
# sentinel CAN see — turning "surfaces on an unrelated PR someday" into a direct red
# signal within hours. It runs ONLY pure, cheap guard scripts (seconds-to-minutes); it
# is deliberately OFF the ~67-min nightly render budget and shares no code with it.
#
# SCOPE — this re-runs a curated subset of ci.yml's PURE guards (no network, no engine
# render, no deploy). Job names + steps mirror ci.yml exactly, so "green here" means the
# same thing as "green on the PR gate". It is NOT a substitute for ci.yml on PRs.
#
# FALSE-RED DISCIPLINE — the sentinel flags any check-run whose conclusion is
# failure / timed_out / cancelled / action_required. A CANCELLED or TIMED-OUT job would
# therefore page the operator with a FALSE red. So: `cancel-in-progress: false` (never
# cancel a heartbeat), and generous per-job `timeout-minutes` (never trip a timeout on
# the normal ~4-min engine batch). The 6-hourly cadence dwarfs the ~5-min runtime, so
# overlap is effectively impossible.
#
# CADENCE — every 6h (a few times daily). Detection latency ≈ heartbeat interval + the
# 2h sentinel interval (~6-8h worst case). Tighten to `*/4` or `*/3` if desired; the
# only cost knob that matters is the engine-render-guards batch (~4 min, GitHub-hosted).
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 00:17, 06:17, 12:17, 18:17 UTC. Off the top-of-hour to avoid GitHub's scheduled-run
    # queue lag, and off the immune lane's :15 so its read lands just after a fresh stamp.
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Read-only. The check-run pass/fail IS the signal (the immune sentinel reads it via the
# GitHub API); this lane never commits, pushes, opens PRs, or needs a secret.
permissions:
  contents: read

concurrency:
  group: ci-main-heartbeat
  # NEVER cancel: a cancelled run concludes "cancelled", which the immune sentinel reads
  # as a RED required check — a false alarm. Let any in-flight run finish.
  cancel-in-progress: false

jobs:
  # ── pure static guards (mirror ci.yml: nav-gap) ────────────────────────────
  nav-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: nav menu must keep a top gap (committed site/)
        run: python3 scripts/check_nav_gap.py site

  # ── font-ui definition guard (mirror ci.yml: font-ui-defined) ──────────────
  font-ui-defined:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest
      - name: font-ui definition guard (body-level var(--font-ui) coverage)
        run: python -m scripts.check_font_ui_defined templates
      - name: font-ui guard unit tests (violating + passing fixtures per check)
        run: python -m pytest tests/test_check_font_ui_defined.py -q

  # ── contract drift guard (mirror ci.yml: contract-drift) ───────────────────
  contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: contract drift check (hard-fail — ratchet flipped 2026-07-14)
        run: python scripts/check_contract_drift.py
      - name: contract drift unit tests
        run: python -m pytest tests/test_contract_drift.py -q

  # ── chronicle event spine (mirror ci.yml: chronicle-suite) ─────────────────
  # Added 2026-07-26 after this lane's absence cost the repo five duplicate PRs.
  # chronicle-suite was ci.yml-only, and ci.yml never runs on main — so when gate 1
  # went red there it was invisible to the metabolism main-red sentinel (no check-run
  # exists for a workflow that never ran). Five sessions independently rediscovered it
  # from their own PRs' reds (#3634, #3643, #3647, #3648, #3651, #3660, #3665), and
  # because a PR's red is evidence about its MERGE-BASE rather than main, one of them
  # opened 11 minutes after the real fix had already landed.
  #
  # Its own commit message named the shape: "a gate whose red is repaired by a manual
  # rebuild with a shelf life of one source commit will keep attracting duplicate
  # fixes." A 6-hourly check-run ON main is what turns that into a single signal.
  #
  # Fits this lane's charter exactly: pure, no network, no engine render (~2s locally),
  # nowhere near the ~67-min nightly budget.
  chronicle-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        # jinja2 is REQUIRED here: the M8 links.site derivation imports
        # scripts/build_research_pages (jinja2 at module level); without it the
        # rebuild fail-softs to link-less events and both the links test and the
        # byte-reproducibility gate go red in exactly this venv while staying
        # green in any full env (diagnosed 2026-07-26).
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2
      - name: chronicle engine tests
        run: python -m pytest tests/test_chronicle.py -q

  # ── template↔site + interfonts + data-base shim (mirror ci.yml: template-site-sync) ──
  # The shim steps are the reason this job matters most here: tests/test_site_shim.py
  # had no CI lane anywhere, so build_leader_radar's raw write_text on
  # site/leader_radar.html sat RED on main until a human ran pytest by hand. This
  # lane has no `paths:` filter — it re-checks main HEAD every 6h regardless of what
  # the offending PR happened to touch (#3612 touched only workflow YAML + dag.yml,
  # so no ci.yml path filter would have caught it).
  template-site-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps (theme.js bake reads config.yml)
        run: pip install pyyaml pytest
      - name: template-site-sync selftest (gate fires on synthetic divergence)
        run: python3 scripts/check_template_site_sync.py --selftest
      - name: site copies of template assets must byte-match templates/
        run: python3 scripts/check_template_site_sync.py
      # ui.asset_stamp (mirror ci.yml): a lane edit that drops the templates/ staging or
      # the post-rebase re-stamp silently re-freezes ?v= on the plain-copy pairs and
      # re-ships un-stamped pages — invisible in a green run, and pinned `immutable,
      # max-age=1y` at the edge once it lands. Catch it on main too, not only on the PR.
      - name: "?v= stamps — paired-page round-trip + lane ordering/staging (ui.asset_stamp)"
        run: >
          python -m pytest
          tests/test_asset_stamp_lane_order.py tests/test_optimize_assets.py
          tests/test_asset_stamp_refresh.py -q
      - name: interfonts-sync selftest (gate fires on synthetic drift)
        run: python3 scripts/check_interfonts_sync.py --selftest
      - name: _interfonts partial @font-face blocks must match templates/theme.css
        run: python3 scripts/check_interfonts_sync.py
      - name: data-base shim guard (lib.pages units + committed-page tripwire + source guard)
        run: python -m pytest tests/test_site_shim.py -q
      - name: inline-CSS externalization units
        run: python -m pytest tests/test_externalize_css.py -q

  # ── data-base shim guard (mirror ci.yml: data-base-shim) ──────────────────
  # This lane matters most HERE: ci.yml's copy only fires on its `paths:` list,
  # and the offending write lives in a builder (scripts/build_*.py) that no path
  # filter covers without running the whole pack on most Python PRs. This job has
  # no path filter — it re-checks main HEAD every 6h regardless of what the
  # offending PR happened to touch.
  data-base-shim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps (the builder suite runs real builders)
        run: pip install pytest pyyaml jinja2 pandas numpy pyarrow
      # test_site_shim.py itself (units + tripwire + source guard) runs on the
      # template-site-sync lane, which #3635 wired and which needs only pyyaml.
      # This job exists for the suite that lane CANNOT host: it RUNS each builder,
      # so it needs the data stack below.
      - name: every page builder emits the shim (runs each against a fixture root)
        run: python -m pytest tests/test_builder_shim_writes.py -q

  # ── workflow-yaml parse guard (mirror ci.yml: workflow-yaml) ───────────────
  workflow-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pyyaml
      - name: check_workflow_yaml selftest
        run: python scripts/check_workflow_yaml.py --selftest
      - name: "all workflow files must parse with on:/jobs: blocks"
        run: python scripts/check_workflow_yaml.py .github/workflows
      # Skip-only suites (mirror ci.yml's workflow-yaml job). Worth a heartbeat
      # slot precisely because this guard rots on MAIN, not on a PR: a merge that
      # drops a package from an install line, or a nightly bot edit, can strand a
      # suite whose own path filter no PR happens to touch again. Pure stdlib +
      # pyyaml, ~1s. The pytest-based unit tests stay on the PR lane only — this
      # job installs no pytest, by design.
      - name: check_skip_only_suites selftest
        run: python scripts/check_skip_only_suites.py --selftest
      - name: no suite may skip in every job that names it
        run: python scripts/check_skip_only_suites.py

  # ── DAG conformance (mirror ci.yml: dag-conformance) ───────────────────────
  dag-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml
      - name: DAG conformance check (hard — exits 1 on undeclared lane drift)
        run: python scripts/check_dag_conformance.py --verbose
      - name: DAG conformance selftest + live conformance tests
        run: python -m pytest tests/test_dag_conformance.py -q

  # ── serving boundary (mirror ci.yml: tier-gate) ────────────────────────────
  # Added 2026-07-25. tier-gate was doubly blind: its eleven inputs were absent
  # from ci.yml's paths filter (so a boundary-only PR ran no guard — #3488 merged
  # that way and left the boundary test red on main), AND it was missing here, so
  # nothing re-checked it on main either. That is the exact pair this heartbeat
  # exists for. Hermetic by construction — no network, no engine data.
  tier-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml jinja2 fastapi httpx
      - name: tier-preview split contract (no paid row in the free shell)
        run: python -m pytest tests/test_special_situations_gate.py tests/test_china_special_situations_gate.py -q
      - name: paywall fail-closed contract (incl. enforced-early payload lane)
        run: python -m pytest tests/test_paywall.py tests/test_api_paywall.py -q
      - name: static serving boundary (Caddy <-> site_access.yml, no leaked artifacts)
        run: python -m pytest tests/test_site_access_boundary.py -q
      - name: registration wall (anonymous stage + /factordata /labdata JSON gate)
        run: python -m pytest tests/test_regwall.py tests/test_regwall_json_gate.py -q

  # ── engine + render-guard contract batch (mirror ci.yml: engine-render-guards)
  # The rot-prone one: the 2026-07-02 sweep exists because these test files silently
  # broke on main when ci.yml only ran a targeted subset. ~4 min, GitHub-hosted.
  engine-render-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly pillow requests beautifulsoup4
      - name: render-guard + engine-contract tests (rot sweep 2026-07-02)
        run: >
          python -m pytest
          tests/test_canada_build.py tests/test_commodity_signals.py
          tests/test_commodity_index.py
          tests/test_commodity_confluence.py
          tests/test_commodity_cycle_state.py
          tests/test_fear_euphoria.py tests/test_froth_fragility.py
          tests/test_vol_velocity.py tests/test_fear_greed_honesty.py
          tests/test_archive_context_snapshots.py
          tests/test_ai_breadth_split.py
          tests/test_vsb_surface.py
          tests/test_missing_tape.py tests/test_price_basis_flip.py
          tests/test_risk_lead_lag.py tests/test_anticipation.py
          tests/test_risk_radar_market_catalysts.py tests/test_risk_radar_recovery.py
          tests/test_risk_radar_scorecard.py
          tests/test_vsb_radar_alert.py
          tests/test_risk_radar_intl_profiles.py
          tests/test_risk_state_live_copy_sync.py
          tests/test_build_china_risk_state.py
          tests/test_canon.py tests/test_whitehouse_w5.py
          tests/test_winner_autopsy.py tests/test_admin_long_hold.py
          tests/test_falsifier_packet.py
          tests/test_board_ledger.py tests/test_grade_us_board.py
          tests/test_board_ledger_lane_gates.py
          tests/test_prophet_governor.py
          tests/test_pick_autopsy_selection.py
          tests/test_options_stamp.py tests/test_options_entry_state.py tests/test_sector_pulse_wiring.py
          tests/test_news_page_render.py tests/test_china_lens_hub.py
          tests/test_news_rank_aging.py
          tests/test_build_netliq_daily.py
          tests/test_ignition_radar.py
          tests/test_mag7_regime.py
          tests/test_theme_scoring_leadership_split.py
          tests/test_ignition_persistence.py
          tests/test_mag7_panel.py
          tests/test_stance_matrix.py
          tests/test_theme_scoring_conflicted.py
          tests/test_basket_score_rollover_w4.py
          tests/test_index_momentum.py
          tests/test_cohort_flow_chips.py
          tests/test_statement_tape.py
          tests/test_backfill_options_flow.py
          tests/test_rlt_sector_stance_enrich.py
          tests/test_t0_indicator.py
          tests/test_intraday_flow.py
          tests/test_intraday_flow_stance.py
          tests/test_standout_audit.py
          tests/test_track_record_page.py
          tests/test_altdata_hygiene.py
          tests/test_china_news_engine.py
          tests/test_china_library_limited.py
          tests/test_china_standouts_serialization.py
          tests/test_hk_library_limited.py
          tests/test_canada_library_limited.py
          tests/test_intl_library_limited.py
          tests/test_aibrief_page.py
          tests/test_aibrief_w4_panels.py
          tests/test_sa_w5_v2_grader_hook.py
          tests/test_w8b_macro_prior_entries.py
          tests/test_rr_scorecard_card.py
          tests/test_engine_run_no_regress.py
          tests/test_cycles.py
          tests/test_opex_risk.py -q
      - name: statement-tape schema guard (FL-E / FC-R9)
        run: python -m scripts.check_statement_tape

  free-content-estate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install minimal deps
        run: pip install pytest pyyaml jinja2
      # Mirrors ci.yml's free-content-estate job. The estate rot this closes was
      # invisible for exactly the reason this heartbeat exists: ci.yml never runs on
      # main, and the builder had no workflow anywhere, so 52 pages drifted behind
      # templates/seo_base.html.j2 with every check green.
      - name: free-content builder suite (frontmatter contract, RSS, rendered-output pins)
        run: python -m pytest tests/test_free_content.py -q
      - name: committed estate must match a fresh render (template↔site drift law)
        run: python -m scripts.build_free_content --check
      # Mirrors legacy-jobs.yml::free-content-estate — see the note there. `--check`
      # pins bytes, not validity, and froze `href="</span>` on 26 calculator pages.
      - name: no split tags across the bilingual t() macro (rendered + source)
        run: python -m pytest tests/test_i18n_split_tag_guard.py -q
      # Mirrors legacy-jobs.yml::free-content-estate — see the long note there.
      # Short version: this suite's jinja2-gated cross-module test (externalize_css
      # and build_free_content must share ONE HAND_AUTHORED frozenset) skips in
      # template-site-sync above, whose venv has no jinja2, so without this step it
      # executes in no job at all. This job already installs jinja2; the pairing is
      # free. Deleting it as a duplicate re-creates the SKIP-ONLY class.
      - name: inline-CSS externalization units (incl. the jinja2 cross-module gate)
        run: python -m pytest tests/test_externalize_css.py -q
