name: metabolism-build
# Metabolism Phase V2-B — BUILD lane (write-serialization, R-V2-5).  INERT.
#
# For each ADJUDICATE-granted proposal in the docket:
#   (a) CLAIMS its target_files → data/metabolism/claims.jsonl + regen ACTIVE_BUILD_MAP
#   (b) SKIPS if target_files already claimed this cycle (collision → later cycle)
#   (c) Creates a git worktree on metabolism/build-<lobe>-<cycle> off FRESH origin/main
#   (d) Dispatches a headless Sonnet build session (OAuth key from dispatcher)
#       — IN THIS PR the dispatch is a DOCUMENTED STUB: lane wiring ships here;
#         the live LLM call fires only when armed (AUTONOMY_PAUSED=false + operator grant)
#   (e) Opens a DRAFT PR (never merges)
#   (f) if:always() GCs the worktree (metabolism_gc)
#
# KILL SWITCH (R-AUT-2):
#   gh variable set AUTONOMY_PAUSED --body true    # pause (default-safe)
#   gh variable set AUTONOMY_PAUSED --body false   # arm (operator-only)
# Absent OR anything other than the exact string 'false' → clean no-op.
#
# INERTNESS GUARANTEE:
#   - Double-gated: `if: vars.AUTONOMY_PAUSED != 'true'` AND shell re-check.
#   - Opens DRAFT PRs only — the whole job no-ops when paused.
#   - NO scored-surface writes; any scored-surface change requires T2 metabolism_live flag.
#   - NO autonomous merge (that lives exclusively in metabolism-merge.yml).

on:
  # FIX-1 (BLOCKER-1): auto-chain BUILD after adjudicate (10:15).  45 10 * * * = 10:45 UTC.
  # When running on schedule, cycle_id input is empty; the discovery step below derives
  # the most-recently-adjudicated propose branch exactly as adjudicate.yml does.
  # metabolism_build.py is idempotent via journal claims, so re-running on an already-built
  # cycle is a safe no-op.
  schedule:
    - cron: "45 10 * * *"
  workflow_dispatch:
    inputs:
      cycle_id:
        description: "Cycle id whose docket to build (leave blank on schedule — auto-discovered)"
        type: string
        required: false
        default: ""
      docket_branch:
        description: "Branch carrying the docket (default: metabolism/propose-<cycle_id>)"
        type: string
        default: ""
      force_run:
        description: "Force even when AUTONOMY_PAUSED=true (ops verification only)"
        type: boolean
        default: false

permissions:
  contents: write        # commit claims.jsonl + worktree branches
  pull-requests: write   # open DRAFT PRs

concurrency:
  # Schedule runs land in the same group as each other (single active slot); dispatch
  # is per-cycle so manual re-runs never queue-cancel an in-flight scheduled run.
  group: metabolism-build-${{ github.event_name == 'schedule' && 'scheduled' || github.event.inputs.cycle_id }}
  cancel-in-progress: false

jobs:
  build:
    # KILL SWITCH — absent variable → treated as paused (default-safe).
    if: vars.AUTONOMY_PAUSED != 'true'
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip

      - name: install deps
        run: pip install --quiet pyyaml anthropic

      - name: BUILD (claim + worktree + dispatch-stub + draft PR + GC)
        if: always()
        env:
          AUTONOMY_PAUSED: ${{ vars.AUTONOMY_PAUSED }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          CYCLE_ID: ${{ github.event.inputs.cycle_id }}
          DOCKET_BRANCH_INPUT: ${{ github.event.inputs.docket_branch }}
          # OAuth pool (capability_ids only — dispatcher reads env-var NAMES)
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          # Fallback single-key (V2-A compat)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # FIX-5 (MINOR-11): prefer METABOLISM_MERGE_PAT for draft PR creation so the
          # resulting PR triggers pull_request CI workflows.  GITHUB_TOKEN-created PRs are
          # exempt from the anti-recursion rule ONLY for the creator, not for CI checks —
          # so GITHUB_TOKEN PRs never get required status checks, which is fatal once
          # required checks are enforced on main.  A PAT with no-workflows scope fixes
          # this while keeping the loop unable to edit CI files.
          GH_TOKEN: ${{ secrets.METABOLISM_MERGE_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # Double-gate: runner-side AUTONOMY_PAUSED re-check (defends against race).
          AP="$(printf '%s' "${AUTONOMY_PAUSED:-}" | tr '[:upper:]' '[:lower:]')"
          FR="$(printf '%s' "${FORCE_RUN:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "$AP" != "false" ] && [ "$FR" != "true" ]; then
            echo "AUTONOMY_PAUSED not 'false' (=${AUTONOMY_PAUSED:-<unset>}) — clean no-op."
            exit 0
          fi

          # FIX-1: When running on schedule (cycle_id input is empty), discover the most-recent
          # adjudicated propose branch.  The build script is idempotent via journal claims, so
          # re-running on an already-built cycle is a safe no-op.
          if [ -z "${CYCLE_ID:-}" ]; then
            CYCLE_ID="$(git ls-remote --heads origin 'refs/heads/metabolism/propose-*' \
              | awk '{print $2}' | sed 's|refs/heads/metabolism/propose-||' \
              | sort | tail -n 1)"
            if [ -z "$CYCLE_ID" ]; then
              echo "no open propose branch found — clean no-op (schedule)."
              exit 0
            fi
            echo "schedule: discovered cycle_id=$CYCLE_ID"
          fi

          BRANCH="${DOCKET_BRANCH_INPUT:-metabolism/propose-$CYCLE_ID}"
          echo "cycle_id=$CYCLE_ID docket_branch=$BRANCH"

          # Check out the docket branch
          git fetch origin "$BRANCH" || echo "branch $BRANCH not on origin — using current ref"
          git checkout "$BRANCH" 2>/dev/null || git checkout -B "$BRANCH" "origin/$BRANCH" 2>/dev/null || true

          DOCKET="data/metabolism/dockets/$CYCLE_ID.json"
          if [ ! -f "$DOCKET" ]; then
            echo "docket $DOCKET not found on this ref — clean no-op."
            exit 0
          fi

          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          # Run BUILD lane
          python -m scripts.metabolism_build \
            --cycle-id "$CYCLE_ID" \
            --docket-file "$DOCKET"

          # Commit any new claims.jsonl rows + ACTIVE_BUILD_MAP updates.
          # FIX-4: key_ledger.jsonl included — key pool durability (no prior workflow committed it).
          git add data/metabolism/claims.jsonl data/metabolism/key_ledger.jsonl docs/ACTIVE_BUILD_MAP.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "metabolism: BUILD claims + ACTIVE_BUILD_MAP $CYCLE_ID [Phase V2-B]" \
                       -m "Loop-Authored: build run=${GITHUB_RUN_ID:-local}"
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/$BRANCH can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/$BRANCH is a throwaway local write — origin/$BRANCH is authoritative.
            # Gitignored files and untracked paths origin/$BRANCH doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            git fetch origin "$BRANCH" || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only "origin/$BRANCH" 2>/dev/null | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            git pull --rebase --autostash origin "$BRANCH" 2>/dev/null || true
            git push origin HEAD:"$BRANCH"
          else
            echo "no claim changes staged — no commit needed."
          fi

      - name: GC orphan worktrees (if:always)
        if: always()
        run: |
          python -m scripts.metabolism_gc || echo "GC completed (any errors above are non-fatal)"

      - name: notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOKEN" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="[Metabolism] metabolism-build run failed: ${RUN_URL}" || true
