name: EXK Turn 3 exact replay scratch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install replay dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow numpy

      - name: Run exact repository-price replay
        run: python scratch/exk_turn3_replay.py

      - name: Commit compact scratch outputs to the PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "exk-turn3-scratch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scratch_outputs/
          if git diff --cached --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "scratch(exk): exact Turn-3 replay outputs [skip ci]"
          git push origin "HEAD:${HEAD_REF}"
