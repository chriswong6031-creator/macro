name: vector-sentinel
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (Actions cron is best-effort ~15-45 min)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel
  cancel-in-progress: false

jobs:
  flash-crash:
    runs-on: [self-hosted, macstudio-light]   # light runner — 30-min flash-crash watch must not queue behind the heavy pool
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: flash-crash sentinel (price-only, ~30 min cadence)
        id: sentinel
        run: |
          set +e
          python -m scripts.vector_sentinel
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      # Commit ONLY on a flash-state change (design: no heartbeat spam). The
      # state is recomputed deterministically from candle data each run — the
      # sentinel re-fetches the last 300h live, so it never needs the persisted
      # state to know the CURRENT state, only to detect a transition.
      - name: rebuild vector + hub and commit (only on flash-state change)
        if: steps.sentinel.outputs.rc == '10'
        env:
          # CBF_INTRADAY=1 tells build_intl to skip history.parquet accrual (a
          # forward-ledger advance); nightly is the sole advancer (CLAUDE.md law).
          # compose()+latest.json still run so vector.html has fresh cross-refs.
          CBF_INTRADAY: "1"
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          python -m scripts.build_vector
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # normalize the pages this step stages (P0 2026-08-04, 9a997e9da3f): a lane
          # that commits site/ HTML without the shim/externalize/stamp chain publishes
          # a RAW page — inline <style>, no assets/css/<hash>.css ref, stale ?v= — and
          # holds it until the next full-tree render re-bakes vector.html. All three
          # passes are idempotent (~20s over the tree) and non-blocking: a flash-crash
          # alert must still publish even if a sweep fails.
          python -m scripts.inject_data_base || echo "data-base shim inject skipped (additive)"
          python -m scripts.externalize_css || echo "::warning title=externalize::pre-commit css externalize FAILED — pages may ship un-externalized (9a997e9da3f)"
          python -m scripts.optimize_assets || echo "::warning title=stamp::asset optimize FAILED — ?v= stamps may be stale"
          git add data/vector data/coinbase/btc_hourly.parquet site/vector.html site/index.html
          # index.html is a plain-copy PAIR (templates/index.html ships byte-identically
          # as site/index.html) and this is the only lane here that stages a pair's site
          # copy. Both sweeps above write the TEMPLATE side too — deliberately, so
          # `check_template_site_sync --fix` cannot revert a site-only stamp (#3617/#3624)
          # — so staging site/index.html alone would land the pair DIVERGED and red the
          # pages.yml publish gate. Stage the template side with it. Tolerant form: a bare
          # add exits 128 on a pathspec that matches nothing and would kill the alert.
          git add templates/index.html 2>/dev/null || true
          # ...and the content-hashed assets vector.html now links: externalize_css
          # rewrites it to <link> site/assets/css/<hash>.css, so staging the page without
          # the asset ships a 404 stylesheet. --ignore-removal never stages a DELETION —
          # the orphan prune reasons only from pages it can see, and this lane has no
          # post-rebase normalize to re-mint an asset a sibling still links.
          git add --ignore-removal site/assets/css 2>/dev/null || true
          git add --ignore-removal site/assets/js 2>/dev/null || true
          git diff --cached --quiet || git commit -m "vector: flash-crash alert $(date -u +%FT%H:%MZ)"
          # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
          # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
          # refuses ("untracked working tree files would be overwritten") and --autostash can't
          # clear it (it parks tracked modifications only), so every retry dies identically.
          # Everything this step publishes is already committed above, so a path untracked HERE
          # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
          # Gitignored files and untracked paths origin/main doesn't track never enter the
          # intersection (runner-local stores and caches are untouched).
          git fetch origin main || true
          comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                   <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
            | while IFS= read -r f; do rm -f -- "$f" || true; done
          git pull --rebase --autostash -X theirs origin main && push_autostash_ok
          git push
