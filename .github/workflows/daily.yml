          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_RESEARCH_ENDPOINT: ${{ secrets.R2_RESEARCH_ENDPOINT }}
          R2_RESEARCH_ACCESS_KEY_ID: ${{ secrets.R2_RESEARCH_ACCESS_KEY_ID }}
          R2_RESEARCH_SECRET_ACCESS_KEY: ${{ secrets.R2_RESEARCH_SECRET_ACCESS_KEY }}
          R2_RESEARCH_BUCKET: ${{ secrets.R2_RESEARCH_BUCKET }}
        run: python -m scripts.build_fundamental_forensics --publish-only
      - name: backfill regime stamps (nw-macro-rail R5)
        # Calls engine.qledger.backfill_regime_stamps() — stamps regime columns onto qledger
        # rows that have as_of within regime_vector.parquet coverage.  Near-term yield ≈ 2 rows
        # (coverage starts 2026-07-01).  Non-fatal: if the function does not yet exist in
        # engine.qledger the step exits 0 with a warning.  Runs AFTER engine.run (regime
        # artifacts are fresh) and BEFORE build_spine_index (index reads the stamped rows).
        run: |
          set +e
          python -m scripts.backfill_regime_stamps > "$RUNNER_TEMP/backfill_regime_stamps.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/backfill_regime_stamps.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=backfill_regime_stamps::rc=$rc (non-fatal)"; fi
          exit 0  # PR-2 fix: missing exit 0 caused [ "$rc" -ne 0 ] to exit 1 when rc=0, skipping all downstream kernel steps
      - name: Sector-flip confirmation lens (Policy-Shock W1-C)
        # Detects violent defensive/offense spread flips (|z| >= 2.5 vs 252d), appends the
        # keep-first event ledger at data/flip_confirmation/events.jsonl, registers one
        # CRAWL_BOUNDED (gradeable) qledger claim per CONFIRMED/FADED event at horizon_d=21
        # on the priceable XLP-vs-XLK proxy pair (chassis grades at 5d + 21d automatically;
        # MIXED events abstain). Emits site/flip_confirmation_data.json for the market-state card.
        # AFTER engine.run (market_drivers_log.parquet must be updated for absorption_delta)
