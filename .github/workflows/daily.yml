name: daily
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC (~6pm PST / 7pm PDT) — after the US close AND the ~6pm-ET FINRA short-vol file; all US econ for the day is out. China/HK split to asia-close.yml (08:30 UTC).
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Daily runs in its OWN lane so a long-running backfill / weekly job can never
  # queue-cancel or starve the daily data refresh (the bug: a 2-3h special-sits
  # backfill held the shared "pipeline" lane and the data on the site froze for
  # hours while feature deploys kept happening). Every push step in this workflow
  # uses a rebase-retry loop, so running concurrently with a batch job is race-safe.
  # cancel-in-progress stays false: a queued daily still runs (two simultaneous
  # dailies would simply dedup to the latest).
  group: pipeline-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: restore breadth close cache
        uses: actions/cache@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) breadth close cache
        uses: actions/cache@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) breadth close cache
        uses: actions/cache@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: restore china breadth close cache
        uses: actions/cache@v4
        with:
          path: data/china_breadth/_closes_cache.parquet
          key: china-breadth-closes-${{ github.run_id }}
          restore-keys: china-breadth-closes-
      - name: restore hk breadth close cache
        uses: actions/cache@v4
        with:
          path: data/hk_breadth/_closes_cache.parquet
          key: hk-breadth-closes-${{ github.run_id }}
          restore-keys: hk-breadth-closes-
      - name: restore china per-name OHLC store (signal-engine deep store; nightly backfill grows it)
        # Per-name daily OHLC (collectors/china_stock_prices.py → data/china_stocks/<T>.parquet).
        # data/china_stocks is git-TRACKED and written by asia-close (sole owner). daily.yml's
        # collect job excludes the asia group (--exclude-group asia) so it never advances this
        # store. Removing restore-keys prevents daily from overlaying a stale GHA cache on top
        # of the fresh data asia-close committed — that overlay + `-X theirs` on the rebase-push
        # was the root cause of the 5-day lag regression (CN-SYS W5a fix).
        uses: actions/cache@v4
        with:
          path: data/china_stocks
          key: china-stocks-ohlc-${{ github.run_id }}
      - name: restore hk per-name OHLC store (signal-engine deep store; nightly backfill grows it)
        uses: actions/cache@v4
        with:
          path: data/hk_stocks
          key: hk-stocks-ohlc-${{ github.run_id }}
          restore-keys: hk-stocks-ohlc-
      - name: restore intraday (4H) cache
        # Polygon hourly bars: regenerable + daily-changing, so cached cross-job (like the
        # breadth caches) instead of committed, to keep the repo from bloating. The collect
        # job populates it; the engine job restores it to emit site/intraday.
        uses: actions/cache@v4
        with:
          path: data/intraday
          key: intraday-${{ github.run_id }}
          restore-keys: intraday-
      - name: restore data-quality revision baselines
        # The end-of-collect audit (scripts/audit_macro) needs the PRIOR run's macro values to
        # detect backwards-revisions. The baselines are a daily-changing full copy of the macro
        # series — pure machine state — so they are cached cross-run (like the breadth caches),
        # not committed, to keep the repo from bloating. Absent on the first run => the audit just
        # seeds them (no detection that day) and revision-checking is active from the next run.
        uses: actions/cache@v4
        with:
          path: data/quality/baselines
          key: quality-baselines-${{ github.run_id }}
          restore-keys: quality-baselines-
      - name: restore attention store from R2 (deep history is git-ignored)
        # data/attention/*.parquet (SLF-048 Wikipedia pageviews, 2015-07→) moved to the
        # R2 data plane 2026-07-06 — a fresh checkout holds NONE of them. Restore FIRST
        # so the wiki_pageviews collector's ~120d fetch upserts ON TOP of deep history
        # (lib.store.upsert keeps disk-only rows) instead of rebuilding a shallow window.
        # continue-on-error: on restore failure the collector still produces a usable
        # ~120d store (the display chip needs ~95d) — but the publish-back step after
        # "commit data" is GATED on this step's outcome, so a shallow rebuild can never
        # clobber the deep store on R2 (publish_r2's bytes floor is the second fence).
        id: attention_restore
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.fetch_r2 --dirs attention
      - name: run collectors (graceful degradation — never fails the build on one source)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}   # massive.com options-OI accrual (GEX foundation)
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}   # accepted alias (same key, prior .env name)
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}     # Quiver alt-data suite (collectors/quiver.py); absent -> 'blocked', non-fatal
          GRANTS_GOV_API_KEY: ${{ secrets.GRANTS_GOV_API_KEY }}  # Simpler Grants.gov pre-award FOA flow (collectors/grants_gov.py); free Login.gov key; absent -> 'blocked', non-fatal
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}           # openFDA higher rate limit (collectors/openfda.py); OPTIONAL — keyless works at 1k/day
          HF_TOKEN: ${{ secrets.HF_TOKEN }}                 # Hugging Face higher rate limit (collectors/huggingface.py); OPTIONAL — anon tier suffices
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}   # Finnhub analyst/insider-MSPR/earnings trio (collectors/finnhub_altdata.py); free tier; FINNHUB_KEY also accepted
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}           # SAM.gov pre-award solicitations (collectors/sam_gov.py); free key (entity reg); absent -> 'blocked', non-fatal
          GITHUB_TOKEN: ${{ github.token }}                 # GitHub star velocity (collectors/github_repos.py); the auto-injected workflow token reads public-repo metadata at 1000/hr — no new secret needed
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}       # gated CN moneyflow/chips/margin plane (collectors/tushare_*.py); silently no-ops absent — was frozen 2026-06-21→ (CHINA_ENGINE_REASSESSMENT)
          COLLECT_LANE: nightly  # lane sentinel: forward-ledger graders (grade_breadth_divergence,
                                 # grade_policy_calendar) check COLLECT_LANE==nightly before writing;
                                 # asia-close/weekly/intl_etf leave it unset → no-op in those lanes.
        run: |
          if [ -n "$FRED_API_KEY" ]; then echo "::notice::FRED_API_KEY present — using official API"; else echo "::warning::FRED_API_KEY ABSENT — check repo Settings > Secrets and variables > Actions > Repository secrets"; fi
          # --exclude-group asia: China/HK collectors run in their own asia-close shard
          # (after the Asia cash close), not here — keeps this US-evening run lean.
          python -m scripts.collect --exclude-group asia
      - name: ThetaData Terminal — health-check / start (non-fatal)
        # The ThetaData Terminal v3 is a local Java daemon that must be running before
        # any tape_flow steps can pull trade+NBBO data.  This step:
        #   1. Probes localhost:25503 — if already up, logs OK and exits immediately.
        #   2. If not up AND THETA_API_KEY is set: launches scripts/run_theta_terminal.sh
        #      (nohup'd, starts in ~5-10s) then polls until healthy or 30s timeout.
        #   3. If not up AND key is absent: logs a warning and skips (tape_flow steps
        #      then self-exit via reachable() gate — non-fatal).
        # Non-fatal: failure is a warning; downstream tape_flow steps handle absence.
        env:
          THETA_API_KEY: ${{ secrets.THETA_API_KEY }}
        run: |
          HEALTH_URL="http://127.0.0.1:25503/v3/option/list/symbols"
          if curl -sf --connect-timeout 3 "$HEALTH_URL" >/dev/null 2>&1; then
            echo "ThetaData Terminal already running — OK"
          elif [ -z "${THETA_API_KEY:-}" ]; then
            echo "::warning::THETA_API_KEY not set — ThetaData Terminal not started; tape_flow steps will self-skip"
          else
            echo "ThetaData Terminal not running — launching…"
            bash scripts/run_theta_terminal.sh || true
            # Poll until healthy (max 30s)
            for i in $(seq 1 10); do
              sleep 3
              if curl -sf --connect-timeout 3 "$HEALTH_URL" >/dev/null 2>&1; then
                echo "ThetaData Terminal healthy after ${i}×3s"
                break
              fi
              echo "  waiting for terminal… attempt $i/10"
            done
            if ! curl -sf --connect-timeout 3 "$HEALTH_URL" >/dev/null 2>&1; then
              echo "::warning::ThetaData Terminal did not become healthy in 30s — tape_flow steps will self-skip"
            fi
          fi
      - name: T2a tape-flow features — forward accrual (collect lane, non-fatal)
        # Pulls prior-trading-day trade+NBBO tape for the full gex_symbols() universe
        # (~360 roots) via wildcard-bulk ThetaData endpoint (2 requests/root-day).
        # Aggregates inline to signed-flow features; discards raw tape for single names.
        # Requires ThetaData Terminal running on the self-hosted runner (port 25503).
        # Budget: 25 min default (hard-coded in script; overridable via --budget-minutes).
        #   At 6-concurrent: ~13 min (T2A_THROUGHPUT_PROBE.md §6a) — all 375 roots.
        #   At 2-concurrent (backfill alive): ~30 min → 25 min budget covers ~180 roots/night;
        #   round-robin cursor in state ensures remaining roots accrue on subsequent nights.
        # Non-fatal: terminal absent or any error logs a warning and does not fail the build.
        # run_status.json registration: sources["tape_flow_forward"] (P0.7 pattern).
        env:
          # 3s default connect timeout false-fails under concurrent bulk load
          # (measured 2026-07-11: 352/375 false 'not reachable' at 3s; 20s → 375/375).
          THETA_CONNECT_TIMEOUT: "20"
        run: |
          python -m scripts.build_tape_flow_daily --mode forward \
            || echo "::warning::T2a tape-flow forward accrual failed (non-fatal)"
      - name: T2a tape-flow features — episode-window backfill (non-fatal, budgeted)
        # Tier-S episode windows 2022→, ±15d, ETF anchors only (≈11 nodes post-2022).
        # Runs AFTER the forward step so the daily row always lands first.
        # Hard-stop at 30 min (budget_deadline): state is persisted after every
        # completed root-day; the next nightly run resumes from remaining work.
        # Budget: 30 min — sized so episodes(30) + etf-history(20) + forward(~13)
        # + collectors + Finviz (~35) < 100-min job timeout, ensuring "commit data"
        # is always reached before GitHub Actions cancels the collect job.
        # Outputs (data/tape_flow/daily/*.parquet + data/tape_flow/_state.json)
        # are covered by the "commit data" step's `git add data/` below.
        # Non-fatal: terminal absent or any error logs a warning and continues.
        env:
          THETA_CONNECT_TIMEOUT: "20"   # see forward step note
        run: |
          python -m scripts.build_tape_flow_daily --mode episodes --budget-minutes 30 \
            || echo "::warning::T2a tape-flow episodes backfill failed (non-fatal)"
      - name: T2a tape-flow features — ETF history backfill (non-fatal, budgeted)
        # 20 ETF anchors, full history 2017→. R6 priority 3 — runs last, after forward
        # and episodes, so earlier steps are never delayed by the large backlog.
        # Hard-stop at 20 min (budget_deadline): state resumes each night until done.
        # Budget: 20 min — see episodes comment above for the joint ceiling rationale.
        # Outputs covered by `git add data/` in the commit step below (same as above).
        # Non-fatal: terminal absent or any error logs a warning and continues.
        env:
          THETA_CONNECT_TIMEOUT: "20"   # see forward step note
        run: |
          python -m scripts.build_tape_flow_daily --mode etf-history --budget-minutes 20 \
            || echo "::warning::T2a tape-flow ETF-history backfill failed (non-fatal)"
      - name: refresh Finviz themes snapshot (subsector-rotation feed; non-fatal)
        # The only network leg for the themes map + Subsector Rotation. Refreshes
        # data/themes_heatmap/perf_snapshot.json (stamped with asof) so the rotation
        # read is fresh-daily and its forward track-record accrues a real daily
        # history. Keyless, can be rate-limited from CI IPs — strictly non-fatal:
        # on failure the build keeps the last committed snapshot.
        run: |
          python scripts/fetch_finviz_themes.py \
            || echo "::warning::Finviz themes fetch failed (non-fatal) — keeping committed snapshot"
      - name: collect ZORI national rent index (MRI shelter leg; non-fatal)
        # Fetches Zillow's public ZORI CSV (keyless) and writes data/zori/national.parquet.
        # data/zori/national.parquet is git-tracked (un-ignored by .gitignore negation);
        # metro-level parquet files under data/zori/ remain untracked (size).
        # collect_zori.py raises RuntimeError on HTTP failure — shell-level guard mandatory.
        run: |
          python scripts/collect_zori.py \
            || echo "::warning::ZORI collection failed (non-fatal) — shelter leg will use cached parquet"
      - name: commit data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # site/qledger: the qledger grader (scripts/collect.py -> grade_qledger)
          # writes the TRACKED site/qledger/track_record.json (un-ignored by #1139).
          # Left unstaged it blocks `git pull --rebase` ("unstaged changes") and the
          # whole data push silently dies after 5 attempts — 07-03/07-04 collections
          # were lost exactly this way (the sentinel staging-gap pattern). The
          # --autostash on the rebase below is the durable guard: it survives ANY
          # stray tracked write collect leaves outside data/+site/qledger/ (e.g.
          # reports/*.md graders), not just the qledger paths we happen to stage here.
          git add data/ site/qledger/
          # W0b (2026-07-08 stale-HK incident): US collect job must NOT commit asia-owned
          # data that it never produced. The GHA cache restore steps above may lay stale
          # data/hk_stocks (restore-keys: hk-stocks-ohlc-) and breadth caches on top of
          # the fresh files asia-close already committed.  After the broad `git add data/`
          # above, unstage every asia-close-owned path so -X theirs on the rebase-push
          # cannot clobber asia's fresh commit with this job's stale copy.
          # Derived from asia-close.yml: collect --group asia = adapters starting with
          # `china` or `hk` (scripts/collect.py group_members), so excludes cover all
          # data/china*, data/hk*, and data/hkma (adapter key `hkma` starts with `hk`).
          git reset -q -- data/hk data/hk_* data/hkma data/china data/china_* 2>/dev/null || true
          if git diff --cached --quiet; then echo "no data changes to commit"; exit 0; fi
          git commit -m "data: daily collection $(date -u +%F)"
          # best-effort push: losing a race with a concurrent push must NOT fail the
          # pipeline (the data is collected; the next run re-syncs). Retry rebase+push,
          # preferring our freshly-collected data on any conflict.
          for i in 1 2 3 4 5; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            # (Asia paths unstaged above: when newly tracked on main, deleting the local stale
            # copy lets the rebase materialize asia-close's fresh commit — the W0b intent.)
            git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if git pull --rebase --autostash -X theirs origin main && git push; then
              echo "pushed data on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "data push attempt $i lost a race; re-syncing"; sleep $((i * 7))
          done
          echo "::warning::could not push collected data after 5 attempts (non-fatal)"
      - name: publish attention store back to R2 (gated on the restore)
        # The day's upserted increments ride back to R2 so tomorrow's restore (and the
        # engine job's render-side restore) reads a CURRENT deep store — a frozen R2
        # copy would slowly starve the chip's trailing-5d window. Gated on the restore
        # step's outcome: if the restore failed, the local tree is a shallow ~120d
        # rebuild whose file count matches the deep store, and publishing it would
        # clobber 11y of history. Gaps self-heal: the collector's ~120d fetch window
        # re-covers any missed days on the next successful cycle. Runs AFTER "commit
        # data" so the commit is never delayed by the upload. Non-fatal.
        if: steps.attention_restore.outcome == 'success'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.publish_r2 --dirs attention || echo "::warning::attention R2 publish failed (non-fatal — R2 store goes stale, chip self-heals within the 120d fetch window)"

  engine:
    needs: collect
    if: always()            # a scraper failure must still produce a dashboard from cached data
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 120    # was 70 — observed the job hitting exactly 70m on a congested runner and getting CANCELLED at the special-situations step (~step 30 of 50), AFTER it had successfully rebuilt every page (china/gex/vol-regime/etc.) but BEFORE the "commit engine outputs" step (50). Because pages.yml deploys the COMMITTED main tree, a skipped commit means the fresh build never lands and the live site serves a stale dashboard (missing nav links, new heroes, new JSON) until a run happens to finish under the cap. 120m gives real headroom to always reach the commit. residual-alpha measured ~1s (never the bottleneck the old comment guessed). DONE: the ~22 regional/desk builders between build_site and the hub now run as parallel independent clusters (the "regional + desk builders (parallelised)" step) instead of serially — band wall-clock dropped from ~75m to ~its longest single cluster (special-situations' ~28m EDGAR sweep, now the long pole). Next lever if more is needed: speed up that EDGAR sweep.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: restore attention store from R2 (wiki chip reads it at render)
        # build_site.build_attention_data reads data/attention/*.parquet — git-ignored
        # since 2026-07-06, R2-hosted, kept current by the collect job's publish-back.
        # Non-fatal: an absent store means the attention chip is silently absent for
        # one render (build_attention_data degrades to None); nothing else reads it.
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.fetch_r2 --dirs attention || echo "::warning::attention restore failed (non-fatal — attention chip absent/stale this render)"
      - name: restore breadth close cache (stock search library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-engine-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) breadth close cache (stock library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-engine-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) breadth close cache (stock library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-engine-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: restore hk breadth close cache (hk stock search library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/hk_breadth/_closes_cache.parquet
          key: hk-breadth-closes-engine-${{ github.run_id }}
          restore-keys: hk-breadth-closes-
      - name: restore china per-name OHLC store (build_china_library overlays it for US parity)
        # restore-keys intentionally removed: data/china_stocks is git-tracked and owned by
        # asia-close. Restoring a stale GHA cache here was causing the 5-day lag regression
        # (the engine job's git add data/ + -X theirs rebase-push overwrote the fresh
        # asia-close data with cache-restored stale parquets). CN-SYS W5a fix.
        uses: actions/cache@v4
        with:
          path: data/china_stocks
          key: china-stocks-ohlc-engine-${{ github.run_id }}
      - name: restore hk per-name OHLC store (build_hk_library overlays it for US parity)
        uses: actions/cache@v4
        with:
          path: data/hk_stocks
          key: hk-stocks-ohlc-engine-${{ github.run_id }}
          restore-keys: hk-stocks-ohlc-
      - name: restore intraday (4H) cache (build_chart_data emits site/intraday from it)
        uses: actions/cache@v4
        with:
          path: data/intraday
          key: intraday-engine-${{ github.run_id }}
          restore-keys: intraday-
      - name: price-store freshness gate (last SPY bar vs expected NYSE session; keyless self-heal)
        # 2026-07-07 incident: collect fetched Monday's bars but its non-fatal push died 5x
        # (pre-#1823 unstaged-changes rebase bug) and went GREEN with a ::warning:: — this job
        # then fresh-checked-out a store frozen at 07-02 and persisted a faithful-but-stale
        # RISK_OFF as the canonical market_state, which the live feed carried all session.
        # Every committed store froze in the SAME dead push, so only the exchange calendar
        # (lib/nyse_calendar — zero data dependencies) can see the missing session. --heal
        # re-pulls the yahoo group (keyless, ~16s) so the regime engine below reads real bars
        # and "commit engine outputs" carries them to main. continue-on-error: a red gate must
        # not kill the cached-data dashboard (this job's if:always() philosophy) — it shows RED
        # on the run page while engine.market_state.persist stamps the snapshot freshness.stale.
        continue-on-error: true
        run: python -m scripts.check_price_store_freshness --heal
      - name: MTF buy-filter signals + §7 contract gate (build_signal_quality → validate_signals)
        # Compute the per-ticker chart markers (site/signals/<T>.json) + the brain leaf
        # (data/signal_archive/mtf_signals_latest.json), THEN validate both against
        # research/signal_engine/SCHEMA.json — the §7 signal→chart contract, the single source of
        # truth shared verbatim with the charting app. Runs BEFORE the regime engine so a clean,
        # freshly written leaf is what engine.run loads into latest["mtf_signals"].
        #
        # ABORT-THE-WRITE, NOT-THE-DEPLOY: a contract drift/malformed write must NOT ship, but —
        # like every other builder here — must NOT 404 the dashboard either. So on a validation
        # failure we QUARANTINE the bad write (restore the last-good committed leaf; drop the
        # untracked per-ticker files so the chart safe-degrades to no-markers) and surface a loud
        # red ::error:: annotation + run-summary, then exit 0 so the deploy continues. The bad
        # write never reaches main (leaf reverted, per-ticker files gone) and the violation is
        # recorded in the committed data/quality/signals_audit.json. The HARD red gate for
        # contract-breaking PRs lives in ci.yml (signal-contract job) where blocking is safe.
        # Compute is cheap (reads the committed data/stocks/*.parquet deep-history panel).
        run: |
          set +e
          echo "::group::build + validate MTF signals"
          python -m scripts.build_signal_quality > "$RUNNER_TEMP/sigq.log" 2>&1; bq=$?
          cat "$RUNNER_TEMP/sigq.log"
          if [ "$bq" -ne 0 ]; then
            echo "::error title=build_signal_quality failed (rc=$bq)::signal compute failed — leaf left at last-good"
          fi
          python -m scripts.validate_signals > "$RUNNER_TEMP/sigv.log" 2>&1; vrc=$?
          cat "$RUNNER_TEMP/sigv.log"
          echo "::endgroup::"
          if [ "$vrc" -ne 0 ]; then
            # Discard the drifted/malformed write so neither the commit-to-main nor the Pages
            # artifact can ship it. Leaf is tracked -> restore last-good; per-ticker files are
            # untracked -> remove (chart renders no markers until the next clean run).
            git checkout -- data/signal_archive/mtf_signals_latest.json 2>/dev/null || true
            rm -f site/signals/*.json 2>/dev/null || true
            echo "::error title=signal §7 contract gate FAILED::malformed/drifted signal write discarded (last-good leaf restored); see data/quality/signals_audit.json"
            { echo "### ❌ signal §7 contract gate failed — bad write discarded";
              echo '<details><summary>validator output</summary>'; echo; echo '```';
              tail -n 40 "$RUNNER_TEMP/sigv.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: build signal track-record ledger (w0-stageB)
        # Incremental + cheap (reads site/signals/ + data/stocks/ — both already
        # written by the step above). Runs AFTER build_signal_quality so both
        # site/signals/*.json and mtf_signals_latest.json are fresh. Resilient:
        # any error is logged to stderr and the step exits 0 (never aborts deploy).
        # data/signal_archive/track_record.parquet is git-tracked (un-ignored,
        # w0-stageB) and is staged by the "commit engine outputs" step's
        # `git add data/` below.
        run: |
          echo "::group::build_track_record"
          python -m scripts.build_track_record 2>&1 | tee "$RUNNER_TEMP/tr.log"
          echo "::endgroup::"
          python -m scripts.audit_sizes || echo "::warning::track_record size tripwire fired �� check data/quality/sizes_audit.json"
          exit 0
      - name: export cross-repo signal contracts (golden_signals + artifact_manifest)
        # Writes site/factordata/contracts/golden_signals.json + artifact_manifest.json --
        # the oracle the Terminal's golden_gate.py + artifact_conformance.py consume as a
        # conformance check (audit #7 #9). Runs after build_signal_quality (engine.canon is
        # confirmed working) + after the china/hk OHLC cache restores. Window is FIXED
        # (2015-2024) so output is deterministic and the step is cheap (~5s). Resilient.
        run: |
          python -m scripts.export_signal_contracts \
            || echo "::warning::export_signal_contracts failed (non-fatal) -- keeping last committed contract"
      - name: S&P 500 heatmap real-cap reference (weekly Polygon refresh; committed)
        # (Re)builds data/sp500_heatmap/reference.parquet (~503 rows: ticker → shares +
        # SIC) so build_site's S&P heatmap sizes tiles by REAL market cap (shares × latest
        # close) on EVERY lane. Since site/stockdata left git for R2, the render /
        # engine-render / earlyclose lanes run on fresh checkouts with no cap source and
        # size_basis silently degraded to the ETF weight_proxy. The parquet is small and
        # git-tracked — `git add data/` in "commit engine outputs" below lands it, so all
        # other lanes read real caps at checkout. Runs BEFORE build_site so tonight's
        # payload already sizes by market cap. The script self-gates to a weekly Polygon
        # sweep via the cache's embedded asof stamp (shares move slowly; ~1-2 min when it
        # does sweep). Non-fatal: a failed refresh leaves the previous cache in place and
        # build_sp500_heatmap falls back to site/stockdata caps, then to the last
        # committed marketcap payload's sizes.
        continue-on-error: true
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python -m scripts.build_sp500_heatmap --refresh-caps-only || echo "::warning title=sp500 heatmap cap refresh::rc!=0 (non-fatal — previous cache/fallbacks remain)"
      - name: run regime engine + build dashboard + daily brief (resilient)
        # Self-diagnosing + deploy-resilient: each builder runs isolated; a failure
        # is surfaced as a ::error:: annotation (readable on the run page + via the
        # public check-runs API) AND appended to the run Summary with its traceback,
        # but NEVER aborts the job — so the site still deploys (via the always()
        # artifact upload) and one broken builder can't 404 the whole dashboard.
        env:
          # catalyst_tone (Tier-A FOMC/dislocation digest) runs INSIDE engine.run, so it
          # needs the DeepSeek key here too — not only on the master_brain step below.
          # No-op (degrades to neutral) when the secret is absent.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Live intraday layer: set repo VARIABLE LIVE_QUOTES_WORKER_URL (Settings ->
          # Secrets and variables -> Actions -> Variables) to your deployed Cloudflare
          # quotes-worker URL to turn ON browser live prices — build_site bakes it into
          # site/live_config.js. Empty -> live layer stays dormant (no-op). No code edit needed.
          LIVE_QUOTES_WORKER_URL: ${{ vars.LIVE_QUOTES_WORKER_URL }}
        run: |
          set +e
          # Marker for the libraries-rebuild guard further down. The four non-US search
          # libraries are each built by their dashboard step (build_china / build_hk, and
          # build_canada / build_intl via build_vector) AND again by the resilient rebuild
          # step at the end — duplicate per-name analyze() work (~11m/run). Any
          # <mkt>stockdata/index.json newer than this marker was (re)built FRESH this run,
          # so the rebuild step skips it; a market whose dashboard failed keeps its older
          # (pulled) index.json and is still rebuilt. Set BEFORE any builder runs.
          touch "$RUNNER_TEMP/engine_libs_marker"
          run_py() {
            local label="$1"; local mod="$2"
            echo "::group::$label"
            python -m "$mod" > "$RUNNER_TEMP/step.log" 2>&1; local rc=$?
            cat "$RUNNER_TEMP/step.log"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$label failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/step.log" | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ $label failed (rc=$rc)"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 60 "$RUNNER_TEMP/step.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          run_py "regime engine (engine.run)" engine.run
          # Shock de-escalation protocol (policy-shock W2-E / D3) — must run AFTER engine.run
          # so market_drivers.append_log has written coherence_state to the log.  Writes
          # data/reflexes/shock_deescalation/firings.jsonl (keep-first) + site/live/shock_state.json.
          # Non-fatal: exits 0 on any error so this can NEVER break the render. PS-R7 guard
          # is enforced inside engine.shock_deescalation.build_nightly().
          run_py "shock de-escalation (shock_deescalation)" engine.shock_deescalation
          # S&P allocation deep-dive (spvector.html) + data/regime/spvector_latest.json,
          # BEFORE build_site so the macro page's allocation card reads live numbers.
          run_py "S&P allocation vector (build_spvector)" scripts.build_spvector
          # Deep-history (2011-2026) leak-free IC scorecard -> data/edgar/ic_scorecard.json, read by
          # build_site's factors page. --deep reads the offline deep close panel (data/edgar/
          # sue_deep_closes.parquet — gitignored, NOT rebuilt in daily CI); when it is absent the step
          # exits WITHOUT writing, keeping the committed deep scorecard rather than clobbering it with a
          # shallow ~3y run. Regenerate offline: python -m scripts.sue_deep_phase0 (backfill the panel)
          # then python -m scripts.factor_ic_scorecard --deep --start 2011. Additive (never blocks build).
          python -m scripts.factor_ic_scorecard --deep || echo "ic scorecard skipped (additive)"
          # NOTE: build_factor_series (the ~22-min month-end walk = compute_factors x ~38
          # month-ends x 2 universes) was MOVED to its own parallel `factor_series` job
          # below — it, NOT residual-alpha, was the real engine bottleneck. build_site reads
          # the COMMITTED factor_series.json (degrade-never-raise), so a <=1-run-old series
          # is fine and the deep walk no longer gates the daily dashboard/deploy.
          # Alt-data desk BEFORE build_site so today's convergence alerts are already in
          # data/altdata/alerts.jsonl when build_site assembles the Alert Center. Reads the
          # collect job's committed data/quiver/* (no API key needed here); returns 0 on error.
          run_py "alternative data desk (build_alt_data)" scripts.build_alt_data
          # 13F Smart-Money Trade Tracker — grades curated super-investor 13F moves by
          # SPY-relative forward return (engine.manager_trades). Reads the committed
          # data/smart_money/* snapshots + the breadth/yahoo price caches; returns 0 on error.
          run_py "13F smart-money tracker (build_smart_money)" scripts.build_smart_money
          # Policy-Shock W2-F — ARMED/QUIET conditions-arming card (site artifact only, PS-R7).
          # Reads CL=F via yahoo store + data/whitehouse/alerts.jsonl (READ ONLY).
          # Non-fatal: main() always returns 0; a missing artifact degrades gracefully on the page.
          run_py "policy-lever card (build_policy_lever)" scripts.build_policy_lever
          run_py "macro dashboard + US stocks (build_site)" scripts.build_site
          # Buy Board 2.0 — SHADOW (W6-US, us_standouts_v2). AFTER build_site: it REUSES the
          # freshly-written factordata/us_standouts.json + setups.json (no recompute, ~0.4s) and
          # the rotation artifacts (sector_central / subsector_confluence / index_leadership /
          # subsector_rotation / baskets) through tolerant readers. Writes an UNLINKED preview
          # (us_stocks_v2.html) + the shadow JSON — nothing live consumes it. main() swallows all
          # failures and returns 0, so this can NEVER break the render.
          run_py "buy board 2.0 shadow (build_stock_board_v2)" scripts.build_stock_board_v2
          # Flow Leaders Desk — BEFORE pick-lab (plab_flow_leader/plab_flow_washout consume
          # leaders.json artifact). Reads flow_store/tape_flow/chains/options-entry stores;
          # writes site/flowleaders/leaders.json + renders site/flow_leaders.html.
          # Display-only; exit 0 always; never breaks the render.
          run_py "flow leaders desk (build_flow_leaders)" scripts.build_flow_leaders
          # Leader Radar — LR W2a. AFTER build_flow_leaders (independent stores), BEFORE
          # build_pick_lab (plab_leader_precipice/plab_leader_onset consume radar.json).
          # Resolves universe (mag7+AI+Dow-30+NDX ∩ ohlcv); builds/appends
          # data/rs_series/<T>.parquet (full-history backfill on first run);
          # persists data/leader_radar/state_history.parquet + revisions_history.parquet;
          # writes site/leaderradar/radar.json (schema leader_radar.v1).
          # Absent stores → honest nulls. Always exits 0; never breaks the render.
          run_py "leader radar (build_leader_radar)" scripts.build_leader_radar
          # Pick Lab nightly runner — AFTER build_stock_board_v2 (producer-core snapshot already
          # written by build_stock_library, which runs inside build_site above). Enriches the
          # snapshot from tonight's regime/latest.json, fires all 27 books with refire lockout,
          # grades matured picks from the breadth close caches, computes scoreboards, and writes
          # site/labdata/pick_lab.json + pick_lab_longhold.json + renders site/us_stocks_lab.html.
          # Outputs are covered by the existing `git add data/ site/` commit step.
          # main() swallows all failures and returns 0, so this can NEVER break the render.
          run_py "pick lab nightly runner (build_pick_lab)" scripts.build_pick_lab
          # Reflexivity overlay — W4, Signal Commons. Runs AFTER build_stock_board_v2 (reads
          # us_standouts_v2.json) and AFTER build_site (reads factor_betas.json). Writes
          # site/factordata/reflexivity_overlay.json — display-only duplicate-exposure read.
          # returns 0 always, never breaks the render.
          run_py "reflexivity overlay (build_reflexivity_overlay)" scripts.build_reflexivity_overlay
          # Impulse Tracker — AFTER build_site (a US-stocks sibling page): writes impulse.html +
          # factordata/impulse.json from the breadth close/volume caches + the regime read
          # (engine.run, above). Reactive early-ignition momentum screen; display/context only.
          # Reads only committed/cached data; returns 0 on error so it can never break the site.
          run_py "impulse tracker (build_impulse)" scripts.build_impulse
          # L3 dispersion regime lens — NW Rails W2 PR-4 (§5). Emits data/dispersion/regime.json
          # from the breadth close caches (same panel as build_stock_library). Display-only;
          # gross_mult_live clamped 1.0. Seconds; never fatal.
          run_py "L3 dispersion regime lens (build_dispersion_regime)" scripts.build_dispersion_regime
          # DT-NW-1: aggregate per-ticker dt_contra chip state into data/neuralweb/dt_contra_state.json.
          # AFTER build_site (which calls build_stock_library to write site/stockdata/*.json).
          # Display-only NW artifact; degrades gracefully if stockdata absent. Seconds; never fatal.
          run_py "DT-NW-1 dt_contra state aggregator (build_dt_contra_state)" scripts.build_dt_contra_state
          # Congressional / politician disclosed-trades desk — AFTER build_alt_data (refreshes
          # data/quiver/congress.parquet) + build_site (refreshes per-name stockdata + regime +
          # allocation that the watchlist scores against). Reads only committed data; returns 0 on error.
          run_py "congressional trades desk (build_congress)" scripts.build_congress
          # Technical Lab hub — screener + lab profile page. Reads site/factordata/tech_screener.json
          # + tech_lab.json (written by nightly tech signal engine). Falls back to sample fixture if
          # absent; returns 0 on error — never breaks the build.
          run_py "technical lab hub (build_tech_lab)" scripts.build_tech_lab
          # Thematic Foresight Desk — AFTER build_site (regime latest.json carries the
          # dislocation entry-overlay) + the engines' bottleneck/revision/demand leaves.
          # Reads only committed data; returns 0 on error.
          run_py "thematic foresight desk (build_foresight)" scripts.build_foresight
          exit 0
      - name: backfill regime stamps (nw-macro-rail R5)
        # Calls engine.qledger.backfill_regime_stamps() — stamps regime columns onto qledger
        # rows that have as_of within regime_vector.parquet coverage.  Near-term yield ≈ 2 rows
        # (coverage starts 2026-07-01).  Non-fatal: if the function does not yet exist in
        # engine.qledger the step exits 0 with a warning.  Runs AFTER engine.run (regime
        # artifacts are fresh) and BEFORE build_spine_index (index reads the stamped rows).
        run: |
          set +e
          python -m scripts.backfill_regime_stamps > "$RUNNER_TEMP/backfill_regime_stamps.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/backfill_regime_stamps.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=backfill_regime_stamps::rc=$rc (non-fatal)"; fi
          exit 0  # PR-2 fix: missing exit 0 caused [ "$rc" -ne 0 ] to exit 1 when rc=0, skipping all downstream kernel steps
      - name: Sector-flip confirmation lens (Policy-Shock W1-C)
        # Detects violent defensive/offense spread flips (|z| >= 2.5 vs 252d), appends the
        # keep-first event ledger at data/flip_confirmation/events.jsonl, registers one
        # CRAWL_BOUNDED (gradeable) qledger claim per CONFIRMED/FADED event at horizon_d=21
        # on the priceable XLP-vs-XLK proxy pair (chassis grades at 5d + 21d automatically;
        # MIXED events abstain). Emits site/flip_confirmation_data.json for the market-state card.
        # AFTER engine.run (market_drivers_log.parquet must be updated for absorption_delta)
        # and AFTER backfill_regime_stamps (qledger consistency). Non-fatal.
        continue-on-error: true
        run: |
          set +e
          python -m scripts.build_flip_confirmation > "$RUNNER_TEMP/flip_confirmation.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/flip_confirmation.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=build_flip_confirmation::rc=$rc (non-fatal)"; fi
          exit 0
      - name: Prophet nightly (plan refresh + ledger advancement + R2 mirror)
        # AFTER build_site: reads site/factordata/us_standouts.json (just written).
        # Originates new prophet.trade_plan/v1 envelopes, runs the management engine
        # for every active plan, advances the forward outcome ledger (nightly is the
        # SOLE advancer — idempotent per plan ID), and optionally mirrors
        # site/prophet/index.json to R2 key "prophet/index.json".
        # Artifacts committed by "commit engine outputs" below (site/ + data/ covers
        # site/prophet/** and data/prophet/ledger.jsonl — no extra git add needed).
        # continue-on-error: true — a prophet failure must never abort the nightly deploy.
        # R2 creds: passed when present; build_prophet skips upload gracefully when absent.
        # Wall-time: seconds (no heavy compute; reads committed parquets + standouts JSON).
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set +e
          echo "::group::build_prophet (plan refresh + ledger advancement)"
          python -m scripts.build_prophet --publish > "$RUNNER_TEMP/prophet.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/prophet.log"
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then echo "::warning title=build_prophet::rc=$rc (non-fatal — prophet artifacts degrade gracefully)"; fi
          exit 0
      - name: regional + desk builders (parallelised — independent clusters, barrier before the hub)
        # The ~22 builders between build_site and the landing hub split into mutually
        # INDEPENDENT clusters (each internally ordered by its own data deps). They used
        # to run strictly serially (~75 min of wall-clock); here each cluster runs in the
        # background and we barrier (`wait`) before build_vector, which reads every
        # cluster's latest.json. That collapses the band to ~its longest single cluster
        # (special-situations' EDGAR sweep, ~28 min) instead of the serial sum. Every
        # builder stays individually resilient via brun(): a non-zero exit is annotated
        # (::error::) and appended to the run summary with its traceback, but NEVER aborts
        # the job — so the site still deploys and one broken builder can't 404 the
        # dashboard. Each builder owns its OWN scratch files ($ART/<slug>.{log,rc,sec}) so
        # the parallel subshells never write the same file; output is replayed GROUPED + in
        # a stable order AFTER the barrier (never interleaved) and per-builder wall-times go
        # to the step summary. Builders read build_site's output (spine, above) + the
        # collect job's data; the only cross-builder reads are kept INSIDE one cluster
        # (news after baskets; crossasset/transmission after commodity/forex/bonds;
        # policy_watch after policy_intent). special_situations stays IN this job (not a
        # sibling job like factor_series) because it writes a PAGE + hub card that must be
        # in THIS run's deploy artifact — it is event-driven, so a one-run lag is wrong.
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MASSIVE_S3_ENDPOINT: ${{ secrets.MASSIVE_S3_ENDPOINT }}
          MASSIVE_S3_ACCESS_KEY_ID: ${{ secrets.MASSIVE_S3_ACCESS_KEY_ID }}
          MASSIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.MASSIVE_S3_SECRET_ACCESS_KEY }}
          MASSIVE_S3_BUCKET: ${{ secrets.MASSIVE_S3_BUCKET }}
          COLLECT_LANE: nightly  # lane sentinel: basket_turn_watch.stamp_ledger + other engine
                                 # nightly-only ledger writers check COLLECT_LANE==nightly before
                                 # writing; render/earlyclose/asia-close lanes leave it unset → no-op.
          # FTR W10: build_baskets.py calls notify_turn_events at the end of main().
          # Without these env vars the hook hits dark mode (no webhook → exit 0).
          DISCORD_WEBHOOK_WATCHLIST: ${{ secrets.DISCORD_WEBHOOK_WATCHLIST }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set +e
          ART="$RUNNER_TEMP/band"; rm -rf "$ART"; mkdir -p "$ART"
          # brun <slug> <label> <module> [args…] — run one builder resiliently into its
          # OWN scratch files (never shared across the parallel subshells), recording the
          # exit code + wall-seconds. Output (incl. stderr) is buffered, replayed later.
          brun() {
            local slug="$1" label="$2" mod="$3"; shift 3
            local t0 t1 rc
            t0=$(date +%s)
            { echo "$label"; python -m "$mod" "$@" 2>&1; } > "$ART/$slug.log"; rc=$?
            t1=$(date +%s)
            echo "$rc"          > "$ART/$slug.rc"
            echo "$((t1 - t0))" > "$ART/$slug.sec"
          }
          # --- clusters: each internally ORDERED by its data deps; clusters mutually independent ---
          cl_markets() {
            brun commodities  "build commodity vector (build_commodities)"         scripts.build_commodities
            brun spr          "build strategic reserves (build_spr)"               scripts.build_spr
            brun forex        "build forex vector (build_forex)"                   scripts.build_forex
            brun bonds        "build bonds & bond-health (build_bonds)"            scripts.build_bonds
            brun crossasset   "cross-asset vector (build_crossasset)"              scripts.build_crossasset
            brun transmission "rate & inflation transmission (build_transmission)" scripts.build_transmission
            brun discovery    "discovery leaderboard (build_discovery)"            scripts.build_discovery
          }
          # cl_china / cl_hk MOVED to .github/workflows/asia-close.yml — rebuilt after the
          # Asia cash close (~08:30 UTC) so CN/HK render SETTLED marks, not the stale ones a
          # US-evening run would lock in. They are self-recomputing (no US-regime dependency).
          cl_gex() {
            brun gex_board    "GEX magnets board (build_gex_board)"        scripts.build_gex_board
            brun vol_regime   "index vol-regime (build_vol_regime)"        scripts.build_vol_regime
            brun darkpool     "dark pool desk (build_darkpool_desk)"        scripts.build_darkpool_desk
            brun options_flow "options flow desk (build_options_flow)"     scripts.build_options_flow
            brun flow_desk    "group flow heatmap & market tide (build_flow_desk)" scripts.build_flow_desk
            brun options_skew "single-name IV skew (build_options_skew)"   scripts.build_options_skew
            brun options_ivspread "single-name IV spread (build_options_ivspread)" scripts.build_options_ivspread
            brun options_screener "US options screener page (build_options_screener)" scripts.build_options_screener
            brun options_entry "options entry state fusion table (build_options_entry_state)" scripts.build_options_entry_state
            brun intraday_flow "intraday flow tracker nightly base (build_intraday_flow)" scripts.build_intraday_flow --mode nightly
          }
          cl_baskets() {
            brun baskets     "thematic baskets (build_baskets)"        scripts.build_baskets
            brun subsector_conf "subsector confluence desk + double-gated funnel (build_subsector_confluence)" scripts.build_subsector_confluence
            brun subsector_conf_ndx "nasdaq-100 subsector confluence desk (build_subsector_confluence --nasdaq)" scripts.build_subsector_confluence --nasdaq
            brun subsector_conf_rut "russell-2000 subsector confluence desk (build_subsector_confluence --russell)" scripts.build_subsector_confluence --russell
            # W0.4 Setup-Species: cohort-context metrics (display-only; reads committed subsector_confluence.json)
            brun cohort_metrics "W0.4 cohort metrics — peer washout/reclaim/MACD-turn + Rubber-Band Score (build_cohort_metrics)" scripts.build_cohort_metrics
            brun news        "news suite (build_news)"                 scripts.build_news
            # output: data/news/event_log.parquet + site/news/calibration.json — both covered by the git add data/ site/ commit step
            brun news_calib  "news event calibration (grade_news_events)" scripts.grade_news_events
            brun methodology "methodology page (build_methodology)"    scripts.build_methodology
            brun nasdaq_internals "nasdaq-100 archetype-group internals (build_nasdaq_internals)" scripts.build_nasdaq_internals
          }
          cl_special() { brun special "special situations desk (build_special_situations)" scripts.build_special_situations; }
          cl_misc() {
            brun seasonality   "factor seasonality (build_seasonality)"      scripts.build_seasonality
            brun reports       "research reports section (build_reports)"     scripts.build_reports
            brun cycle         "cycle intelligence page (build_cycle)"        scripts.build_cycle
            brun sectorcyc     "sector cycle intelligence (build_sector_cycles)" scripts.build_sector_cycles
            brun countrycyc    "country cycle intelligence (build_country_cycles)" scripts.build_country_cycles
            brun measurement   "cycle measurement hub (build_measurement)"    scripts.build_measurement
            brun sync_gauge    "sync gauge appender (append_sync_gauge)"      scripts.append_sync_gauge
            brun policy_intent "policy intent desk (policy_intent_desk)"      engine.policy_intent_desk
            brun policy_watch  "fed & policy watch (build_policy_watch)"      scripts.build_policy_watch
            brun index_changes "S&P index changes (build_index_changes)"     scripts.build_index_changes
            # CPI P2: live-view rebuild runs LAST in cl_misc so today's forward-log stamps
            # from build_sector_cycles and build_country_cycles (both above) are present.
            # Placement inside cl_misc (not post-band) is intentional: the dependency is
            # only on these two intra-cluster steps; the band barrier would be correct but
            # wastes the ~28-min special-situations wait. cl_misc is fully sequential so
            # the ordering guarantee holds without any additional wait.
            brun cycle_pattern_live "CPI live-view adapter (build_cycle_pattern_live)" scripts.build_cycle_pattern_live
            # CPI P6: the NW adapter artifact compacts the live view + hazard gate
            # ledger + truth registry, so it runs AFTER cycle_pattern_live (sequential
            # within cl_misc — same ordering guarantee as the live-view step above).
            brun cycle_pattern_state "CPI NW adapter (build_cycle_pattern_state)" scripts.build_cycle_pattern_state
          }
          # launch every cluster concurrently, then barrier before the hub (build_vector, below)
          cl_markets & cl_gex & cl_baskets & cl_special & cl_misc &
          wait
          # --- replay each builder's output GROUPED + in a stable order (post-barrier, so
          #     nothing interleaves), surface failures as annotations, summarise wall-times ---
          ORDER="commodities spr forex bonds crossasset transmission discovery gex_board vol_regime darkpool options_flow flow_desk options_skew options_ivspread options_screener options_entry intraday_flow baskets subsector_conf subsector_conf_ndx subsector_conf_rut cohort_metrics news methodology nasdaq_internals seasonality reports measurement sync_gauge policy_intent policy_watch special index_changes cycle_pattern_live cycle_pattern_state"
          echo "### ⏱ parallel band — per-builder wall-time" >> "$GITHUB_STEP_SUMMARY"
          for slug in $ORDER; do
            [ -f "$ART/$slug.log" ] || continue
            label=$(head -n1 "$ART/$slug.log")
            rc=$(cat "$ART/$slug.rc" 2>/dev/null || echo "?")
            sec=$(cat "$ART/$slug.sec" 2>/dev/null || echo "?")
            echo "::group::$label  [${sec}s, rc=$rc]"
            tail -n +2 "$ART/$slug.log"
            echo "::endgroup::"
            echo "- ${label} — ${sec}s (rc=${rc})" >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" != "0" ] && [ "$rc" != "?" ]; then
              echo "::error title=${label} failed (rc=${rc})::$(tail -n 2 "$ART/$slug.log" | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ ${label} failed (rc=${rc})"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 40 "$ART/$slug.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 0
      - name: US sector central intelligence (build_sector_central)
        # The US Sector Central hub fuses the cycle spine + baskets + narrative rotation + heatmap.
