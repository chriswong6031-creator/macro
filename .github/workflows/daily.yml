name: daily
on:
  schedule:
    - cron: "40 22 * * *"   # 22:40 UTC every day, after the US close (16:00 ET = 20:00/21:00 UTC across DST); off-hour minute avoids scheduler congestion
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Daily runs in its OWN lane so a long-running backfill / weekly job can never
  # queue-cancel or starve the daily data refresh (the bug: a 2-3h special-sits
  # backfill held the shared "pipeline" lane and the data on the site froze for
  # hours while feature deploys kept happening). Every push step in this workflow
  # uses a rebase-retry loop, so running concurrently with a batch job is race-safe.
  # cancel-in-progress stays false: a queued daily still runs (two simultaneous
  # dailies would simply dedup to the latest).
  group: pipeline-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: restore breadth close cache
        uses: actions/cache@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) breadth close cache
        uses: actions/cache@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) breadth close cache
        uses: actions/cache@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: restore china breadth close cache
        uses: actions/cache@v4
        with:
          path: data/china_breadth/_closes_cache.parquet
          key: china-breadth-closes-${{ github.run_id }}
          restore-keys: china-breadth-closes-
      - name: restore hk breadth close cache
        uses: actions/cache@v4
        with:
          path: data/hk_breadth/_closes_cache.parquet
          key: hk-breadth-closes-${{ github.run_id }}
          restore-keys: hk-breadth-closes-
      - name: restore china per-name OHLC store (signal-engine deep store; nightly backfill grows it)
        # Per-name daily OHLC (collectors/china_stock_prices.py → data/china_stocks/<T>.parquet).
        # Regenerable from yfinance + incremental (store.upsert), so cached cross-run like the
        # breadth caches rather than committed in full (only the ~12-name seed is committed); the
        # collect job grows it nightly, the engine job restores it to lift CN names to US parity.
        uses: actions/cache@v4
        with:
          path: data/china_stocks
          key: china-stocks-ohlc-${{ github.run_id }}
          restore-keys: china-stocks-ohlc-
      - name: restore hk per-name OHLC store (signal-engine deep store; nightly backfill grows it)
        uses: actions/cache@v4
        with:
          path: data/hk_stocks
          key: hk-stocks-ohlc-${{ github.run_id }}
          restore-keys: hk-stocks-ohlc-
      - name: restore intraday (4H) cache
        # Polygon hourly bars: regenerable + daily-changing, so cached cross-job (like the
        # breadth caches) instead of committed, to keep the repo from bloating. The collect
        # job populates it; the engine job restores it to emit site/intraday.
        uses: actions/cache@v4
        with:
          path: data/intraday
          key: intraday-${{ github.run_id }}
          restore-keys: intraday-
      - name: restore data-quality revision baselines
        # The end-of-collect audit (scripts/audit_macro) needs the PRIOR run's macro values to
        # detect backwards-revisions. The baselines are a daily-changing full copy of the macro
        # series — pure machine state — so they are cached cross-run (like the breadth caches),
        # not committed, to keep the repo from bloating. Absent on the first run => the audit just
        # seeds them (no detection that day) and revision-checking is active from the next run.
        uses: actions/cache@v4
        with:
          path: data/quality/baselines
          key: quality-baselines-${{ github.run_id }}
          restore-keys: quality-baselines-
      - name: run collectors (graceful degradation — never fails the build on one source)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}   # massive.com options-OI accrual (GEX foundation)
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}   # accepted alias (same key, prior .env name)
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}     # Quiver alt-data suite (collectors/quiver.py); absent -> 'blocked', non-fatal
          GRANTS_GOV_API_KEY: ${{ secrets.GRANTS_GOV_API_KEY }}  # Simpler Grants.gov pre-award FOA flow (collectors/grants_gov.py); free Login.gov key; absent -> 'blocked', non-fatal
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}           # openFDA higher rate limit (collectors/openfda.py); OPTIONAL — keyless works at 1k/day
          HF_TOKEN: ${{ secrets.HF_TOKEN }}                 # Hugging Face higher rate limit (collectors/huggingface.py); OPTIONAL — anon tier suffices
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}   # Finnhub analyst/insider-MSPR/earnings trio (collectors/finnhub_altdata.py); free tier; FINNHUB_KEY also accepted
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}           # SAM.gov pre-award solicitations (collectors/sam_gov.py); free key (entity reg); absent -> 'blocked', non-fatal
          GITHUB_TOKEN: ${{ github.token }}                 # GitHub star velocity (collectors/github_repos.py); the auto-injected workflow token reads public-repo metadata at 1000/hr — no new secret needed
        run: |
          if [ -n "$FRED_API_KEY" ]; then echo "::notice::FRED_API_KEY present — using official API"; else echo "::warning::FRED_API_KEY ABSENT — check repo Settings > Secrets and variables > Actions > Repository secrets"; fi
          python -m scripts.collect
      - name: refresh Finviz themes snapshot (subsector-rotation feed; non-fatal)
        # The only network leg for the themes map + Subsector Rotation. Refreshes
        # data/themes_heatmap/perf_snapshot.json (stamped with asof) so the rotation
        # read is fresh-daily and its forward track-record accrues a real daily
        # history. Keyless, can be rate-limited from CI IPs — strictly non-fatal:
        # on failure the build keeps the last committed snapshot.
        run: |
          python scripts/fetch_finviz_themes.py \
            || echo "::warning::Finviz themes fetch failed (non-fatal) — keeping committed snapshot"
      - name: commit data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data changes to commit"; exit 0; fi
          git commit -m "data: daily collection $(date -u +%F)"
          # best-effort push: losing a race with a concurrent push must NOT fail the
          # pipeline (the data is collected; the next run re-syncs). Retry rebase+push,
          # preferring our freshly-collected data on any conflict.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "pushed data on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "data push attempt $i lost a race; re-syncing"; sleep $((i * 7))
          done
          echo "::warning::could not push collected data after 5 attempts (non-fatal)"

  engine:
    needs: collect
    if: always()            # a scraper failure must still produce a dashboard from cached data
    runs-on: ubuntu-latest
    timeout-minutes: 120    # was 70 — observed the job hitting exactly 70m on a congested runner and getting CANCELLED at the special-situations step (~step 30 of 50), AFTER it had successfully rebuilt every page (china/gex/vol-regime/etc.) but BEFORE the "commit engine outputs" step (50). Because pages.yml deploys the COMMITTED main tree, a skipped commit means the fresh build never lands and the live site serves a stale dashboard (missing nav links, new heroes, new JSON) until a run happens to finish under the cap. 120m gives real headroom to always reach the commit. residual-alpha measured ~1s (never the bottleneck the old comment guessed). DONE: the ~22 regional/desk builders between build_site and the hub now run as parallel independent clusters (the "regional + desk builders (parallelised)" step) instead of serially — band wall-clock dropped from ~75m to ~its longest single cluster (special-situations' ~28m EDGAR sweep, now the long pole). Next lever if more is needed: speed up that EDGAR sweep.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: restore breadth close cache (stock search library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-engine-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) breadth close cache (stock library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-engine-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) breadth close cache (stock library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-engine-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: restore hk breadth close cache (hk stock search library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/hk_breadth/_closes_cache.parquet
          key: hk-breadth-closes-engine-${{ github.run_id }}
          restore-keys: hk-breadth-closes-
      - name: restore china per-name OHLC store (build_china_library overlays it for US parity)
        uses: actions/cache@v4
        with:
          path: data/china_stocks
          key: china-stocks-ohlc-engine-${{ github.run_id }}
          restore-keys: china-stocks-ohlc-
      - name: restore hk per-name OHLC store (build_hk_library overlays it for US parity)
        uses: actions/cache@v4
        with:
          path: data/hk_stocks
          key: hk-stocks-ohlc-engine-${{ github.run_id }}
          restore-keys: hk-stocks-ohlc-
      - name: restore intraday (4H) cache (build_chart_data emits site/intraday from it)
        uses: actions/cache@v4
        with:
          path: data/intraday
          key: intraday-engine-${{ github.run_id }}
          restore-keys: intraday-
      - name: MTF buy-filter signals + §7 contract gate (build_signal_quality → validate_signals)
        # Compute the per-ticker chart markers (site/signals/<T>.json) + the brain leaf
        # (data/signal_archive/mtf_signals_latest.json), THEN validate both against
        # research/signal_engine/SCHEMA.json — the §7 signal→chart contract, the single source of
        # truth shared verbatim with the charting app. Runs BEFORE the regime engine so a clean,
        # freshly written leaf is what engine.run loads into latest["mtf_signals"].
        #
        # ABORT-THE-WRITE, NOT-THE-DEPLOY: a contract drift/malformed write must NOT ship, but —
        # like every other builder here — must NOT 404 the dashboard either. So on a validation
        # failure we QUARANTINE the bad write (restore the last-good committed leaf; drop the
        # untracked per-ticker files so the chart safe-degrades to no-markers) and surface a loud
        # red ::error:: annotation + run-summary, then exit 0 so the deploy continues. The bad
        # write never reaches main (leaf reverted, per-ticker files gone) and the violation is
        # recorded in the committed data/quality/signals_audit.json. The HARD red gate for
        # contract-breaking PRs lives in ci.yml (signal-contract job) where blocking is safe.
        # Compute is cheap (reads the committed data/stocks/*.parquet deep-history panel).
        run: |
          set +e
          echo "::group::build + validate MTF signals"
          python -m scripts.build_signal_quality > /tmp/sigq.log 2>&1; bq=$?
          cat /tmp/sigq.log
          if [ "$bq" -ne 0 ]; then
            echo "::error title=build_signal_quality failed (rc=$bq)::signal compute failed — leaf left at last-good"
          fi
          python -m scripts.validate_signals > /tmp/sigv.log 2>&1; vrc=$?
          cat /tmp/sigv.log
          echo "::endgroup::"
          if [ "$vrc" -ne 0 ]; then
            # Discard the drifted/malformed write so neither the commit-to-main nor the Pages
            # artifact can ship it. Leaf is tracked -> restore last-good; per-ticker files are
            # untracked -> remove (chart renders no markers until the next clean run).
            git checkout -- data/signal_archive/mtf_signals_latest.json 2>/dev/null || true
            rm -f site/signals/*.json 2>/dev/null || true
            echo "::error title=signal §7 contract gate FAILED::malformed/drifted signal write discarded (last-good leaf restored); see data/quality/signals_audit.json"
            { echo "### ❌ signal §7 contract gate failed — bad write discarded";
              echo '<details><summary>validator output</summary>'; echo; echo '```';
              tail -n 40 /tmp/sigv.log; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: run regime engine + build dashboard + daily brief (resilient)
        # Self-diagnosing + deploy-resilient: each builder runs isolated; a failure
        # is surfaced as a ::error:: annotation (readable on the run page + via the
        # public check-runs API) AND appended to the run Summary with its traceback,
        # but NEVER aborts the job — so the site still deploys (via the always()
        # artifact upload) and one broken builder can't 404 the whole dashboard.
        env:
          # catalyst_tone (Tier-A FOMC/dislocation digest) runs INSIDE engine.run, so it
          # needs the DeepSeek key here too — not only on the master_brain step below.
          # No-op (degrades to neutral) when the secret is absent.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Live intraday layer: set repo VARIABLE LIVE_QUOTES_WORKER_URL (Settings ->
          # Secrets and variables -> Actions -> Variables) to your deployed Cloudflare
          # quotes-worker URL to turn ON browser live prices — build_site bakes it into
          # site/live_config.js. Empty -> live layer stays dormant (no-op). No code edit needed.
          LIVE_QUOTES_WORKER_URL: ${{ vars.LIVE_QUOTES_WORKER_URL }}
        run: |
          set +e
          # Marker for the libraries-rebuild guard further down. The four non-US search
          # libraries are each built by their dashboard step (build_china / build_hk, and
          # build_canada / build_intl via build_vector) AND again by the resilient rebuild
          # step at the end — duplicate per-name analyze() work (~11m/run). Any
          # <mkt>stockdata/index.json newer than this marker was (re)built FRESH this run,
          # so the rebuild step skips it; a market whose dashboard failed keeps its older
          # (pulled) index.json and is still rebuilt. Set BEFORE any builder runs.
          touch /tmp/engine_libs_marker
          run_py() {
            local label="$1"; local mod="$2"
            echo "::group::$label"
            python -m "$mod" > /tmp/step.log 2>&1; local rc=$?
            cat /tmp/step.log
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$label failed (rc=$rc)::$(tail -n 2 /tmp/step.log | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ $label failed (rc=$rc)"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 60 /tmp/step.log; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          run_py "regime engine (engine.run)" engine.run
          # S&P allocation deep-dive (spvector.html) + data/regime/spvector_latest.json,
          # BEFORE build_site so the macro page's allocation card reads live numbers.
          run_py "S&P allocation vector (build_spvector)" scripts.build_spvector
          # Deep-history (2011-2026) leak-free IC scorecard -> data/edgar/ic_scorecard.json, read by
          # build_site's factors page. --deep reads the offline deep close panel (data/edgar/
          # sue_deep_closes.parquet — gitignored, NOT rebuilt in daily CI); when it is absent the step
          # exits WITHOUT writing, keeping the committed deep scorecard rather than clobbering it with a
          # shallow ~3y run. Regenerate offline: python -m scripts.sue_deep_phase0 (backfill the panel)
          # then python -m scripts.factor_ic_scorecard --deep --start 2011. Additive (never blocks build).
          python -m scripts.factor_ic_scorecard --deep || echo "ic scorecard skipped (additive)"
          # NOTE: build_factor_series (the ~22-min month-end walk = compute_factors x ~38
          # month-ends x 2 universes) was MOVED to its own parallel `factor_series` job
          # below — it, NOT residual-alpha, was the real engine bottleneck. build_site reads
          # the COMMITTED factor_series.json (degrade-never-raise), so a <=1-run-old series
          # is fine and the deep walk no longer gates the daily dashboard/deploy.
          # Alt-data desk BEFORE build_site so today's convergence alerts are already in
          # data/altdata/alerts.jsonl when build_site assembles the Alert Center. Reads the
          # collect job's committed data/quiver/* (no API key needed here); returns 0 on error.
          run_py "alternative data desk (build_alt_data)" scripts.build_alt_data
          # 13F Smart-Money Trade Tracker — grades curated super-investor 13F moves by
          # SPY-relative forward return (engine.manager_trades). Reads the committed
          # data/smart_money/* snapshots + the breadth/yahoo price caches; returns 0 on error.
          run_py "13F smart-money tracker (build_smart_money)" scripts.build_smart_money
          run_py "macro dashboard + US stocks (build_site)" scripts.build_site
          # Impulse Tracker — AFTER build_site (a US-stocks sibling page): writes impulse.html +
          # factordata/impulse.json from the breadth close/volume caches + the regime read
          # (engine.run, above). Reactive early-ignition momentum screen; display/context only.
          # Reads only committed/cached data; returns 0 on error so it can never break the site.
          run_py "impulse tracker (build_impulse)" scripts.build_impulse
          # Congressional / politician disclosed-trades desk — AFTER build_alt_data (refreshes
          # data/quiver/congress.parquet) + build_site (refreshes per-name stockdata + regime +
          # allocation that the watchlist scores against). Reads only committed data; returns 0 on error.
          run_py "congressional trades desk (build_congress)" scripts.build_congress
          # Thematic Foresight Desk — AFTER build_site (regime latest.json carries the
          # dislocation entry-overlay) + the engines' bottleneck/revision/demand leaves.
          # Reads only committed data; returns 0 on error.
          run_py "thematic foresight desk (build_foresight)" scripts.build_foresight
          exit 0
      - name: regional + desk builders (parallelised — independent clusters, barrier before the hub)
        # The ~22 builders between build_site and the landing hub split into mutually
        # INDEPENDENT clusters (each internally ordered by its own data deps). They used
        # to run strictly serially (~75 min of wall-clock); here each cluster runs in the
        # background and we barrier (`wait`) before build_vector, which reads every
        # cluster's latest.json. That collapses the band to ~its longest single cluster
        # (special-situations' EDGAR sweep, ~28 min) instead of the serial sum. Every
        # builder stays individually resilient via brun(): a non-zero exit is annotated
        # (::error::) and appended to the run summary with its traceback, but NEVER aborts
        # the job — so the site still deploys and one broken builder can't 404 the
        # dashboard. Each builder owns its OWN scratch files ($ART/<slug>.{log,rc,sec}) so
        # the parallel subshells never write the same file; output is replayed GROUPED + in
        # a stable order AFTER the barrier (never interleaved) and per-builder wall-times go
        # to the step summary. Builders read build_site's output (spine, above) + the
        # collect job's data; the only cross-builder reads are kept INSIDE one cluster
        # (news after baskets; crossasset/transmission after commodity/forex/bonds;
        # policy_watch after policy_intent). special_situations stays IN this job (not a
        # sibling job like factor_series) because it writes a PAGE + hub card that must be
        # in THIS run's deploy artifact — it is event-driven, so a one-run lag is wrong.
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MASSIVE_S3_ENDPOINT: ${{ secrets.MASSIVE_S3_ENDPOINT }}
          MASSIVE_S3_ACCESS_KEY_ID: ${{ secrets.MASSIVE_S3_ACCESS_KEY_ID }}
          MASSIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.MASSIVE_S3_SECRET_ACCESS_KEY }}
          MASSIVE_S3_BUCKET: ${{ secrets.MASSIVE_S3_BUCKET }}
        run: |
          set +e
          ART=/tmp/band; rm -rf "$ART"; mkdir -p "$ART"
          # brun <slug> <label> <module> [args…] — run one builder resiliently into its
          # OWN scratch files (never shared across the parallel subshells), recording the
          # exit code + wall-seconds. Output (incl. stderr) is buffered, replayed later.
          brun() {
            local slug="$1" label="$2" mod="$3"; shift 3
            local t0 t1 rc
            t0=$(date +%s)
            { echo "$label"; python -m "$mod" "$@" 2>&1; } > "$ART/$slug.log"; rc=$?
            t1=$(date +%s)
            echo "$rc"          > "$ART/$slug.rc"
            echo "$((t1 - t0))" > "$ART/$slug.sec"
          }
          # --- clusters: each internally ORDERED by its data deps; clusters mutually independent ---
          cl_markets() {
            brun commodities  "build commodity vector (build_commodities)"         scripts.build_commodities
            brun spr          "build strategic reserves (build_spr)"               scripts.build_spr
            brun forex        "build forex vector (build_forex)"                   scripts.build_forex
            brun bonds        "build bonds & bond-health (build_bonds)"            scripts.build_bonds
            brun crossasset   "cross-asset vector (build_crossasset)"              scripts.build_crossasset
            brun transmission "rate & inflation transmission (build_transmission)" scripts.build_transmission
            brun discovery    "discovery leaderboard (build_discovery)"            scripts.build_discovery
          }
          cl_china() { brun china "build china a-share dashboard (build_china)" scripts.build_china; brun china_sector_desk "build china sector desk (build_china_sector_desk)" scripts.build_china_sector_desk; brun china_sector_cyc "china sector cycles (build_china_sector_cycles)" scripts.build_china_sector_cycles; brun china_sector_central "china sector central intelligence (build_china_sector_central)" scripts.build_china_sector_central; brun flow_velocity "capital flow velocity — CN/HK (build_flow_velocity)" scripts.build_flow_velocity; }
          cl_hk()    { brun hk    "build hong kong / hang seng (build_hk)"      scripts.build_hk; }
          cl_gex() {
            brun gex_board    "GEX magnets board (build_gex_board)"        scripts.build_gex_board
            brun vol_regime   "index vol-regime (build_vol_regime)"        scripts.build_vol_regime
            brun options_flow "options flow desk (build_options_flow)"     scripts.build_options_flow
            brun options_skew "single-name IV skew (build_options_skew)"   scripts.build_options_skew
            brun options_ivspread "single-name IV spread (build_options_ivspread)" scripts.build_options_ivspread
          }
          cl_baskets() {
            brun baskets     "thematic baskets (build_baskets)"        scripts.build_baskets
            brun news        "news suite (build_news)"                 scripts.build_news
            brun methodology "methodology page (build_methodology)"    scripts.build_methodology
          }
          cl_special() { brun special "special situations desk (build_special_situations)" scripts.build_special_situations; }
          cl_misc() {
            brun seasonality   "factor seasonality (build_seasonality)"      scripts.build_seasonality
            brun reports       "research reports section (build_reports)"     scripts.build_reports
            brun cycle         "cycle intelligence page (build_cycle)"        scripts.build_cycle
            brun sectorcyc     "sector cycle intelligence (build_sector_cycles)" scripts.build_sector_cycles
            brun policy_intent "policy intent desk (policy_intent_desk)"      engine.policy_intent_desk
            brun policy_watch  "fed & policy watch (build_policy_watch)"      scripts.build_policy_watch
            brun index_changes "S&P index changes (build_index_changes)"     scripts.build_index_changes
          }
          # launch every cluster concurrently, then barrier before the hub (build_vector, below)
          cl_markets & cl_china & cl_hk & cl_gex & cl_baskets & cl_special & cl_misc &
          wait
          # --- replay each builder's output GROUPED + in a stable order (post-barrier, so
          #     nothing interleaves), surface failures as annotations, summarise wall-times ---
          ORDER="china hk flow_velocity commodities spr forex bonds crossasset transmission discovery gex_board vol_regime options_flow options_skew options_ivspread baskets news methodology seasonality reports policy_intent policy_watch special index_changes"
          echo "### ⏱ parallel band — per-builder wall-time" >> "$GITHUB_STEP_SUMMARY"
          for slug in $ORDER; do
            [ -f "$ART/$slug.log" ] || continue
            label=$(head -n1 "$ART/$slug.log")
            rc=$(cat "$ART/$slug.rc" 2>/dev/null || echo "?")
            sec=$(cat "$ART/$slug.sec" 2>/dev/null || echo "?")
            echo "::group::$label  [${sec}s, rc=$rc]"
            tail -n +2 "$ART/$slug.log"
            echo "::endgroup::"
            echo "- ${label} — ${sec}s (rc=${rc})" >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" != "0" ] && [ "$rc" != "?" ]; then
              echo "::error title=${label} failed (rc=${rc})::$(tail -n 2 "$ART/$slug.log" | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ ${label} failed (rc=${rc})"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 40 "$ART/$slug.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 0
      - name: US sector central intelligence (build_sector_central)
        # The US Sector Central hub fuses the cycle spine + baskets + narrative rotation + heatmap.
        # It reads baskets.json (cl_baskets) + sector_cycles_data.js (cl_misc → sectorcyc) + the
        # heatmap json (build_site spine) — those deps live in DIFFERENT parallel clusters, so this
        # MUST be a serial step AFTER the band `wait` barrier (the US analog of china_sector_central,
        # which could run inside cl_china only because both its deps lived in that one cluster).
        # Additive (the builder returns 0 on any failure), so it can never break the deploy.
        run: python -m scripts.build_sector_central
      - name: build bitcoin vector + landing hub
        # installs the landing hub at index.html (rendered from stored engine
        # state, so ordering vs build_site no longer matters — build_site writes
        # the macro dashboard straight to macro.html). Self-sufficient (recomputes
        # signals); returns 0 even if the crypto engine errors, so it can never
        # break the macro site.
        run: python -m scripts.build_vector
      - name: master brain scorer (durability loop; deterministic, resilient)
        # Grades the brain's own past-due cross-asset leans in data/master_brain/theses.jsonl
        # against realized closes (reuses engine.desk_scorer) -> data/master_brain/
        # {scored.jsonl,track_record.json}. Runs BEFORE the master_brain generator so today's
        # brief reflects the freshest track record. Deterministic, no API key, never aborts.
        run: |
          set +e
          python -m engine.master_brain_scorer > /tmp/mb_score.log 2>&1; rc=$?
          cat /tmp/mb_score.log
          [ "$rc" -ne 0 ] && echo "::warning title=master_brain_scorer::rc=$rc (non-fatal)"
          exit 0
      - name: master brain (multi-lens LLM synthesis; default-off, resilient)
        # Runs LAST among the builders — it reads EVERY dashboard's latest.json
        # (macro/china/hk/commodity/forex + BTC) plus the catalyst digest, and writes
        # one brief per configured lens (master_brain.lenses, default macro+china+btc):
        #   site/master_brief.json (US dashboard) · site/china_brief.json (china.html)
        #   · site/btc_brief.json (vector.html) — each client-fetched by its AI brief
        # panel. NO-OP unless BOTH config master_brain.enabled is true AND the
        # DEEPSEEK_API_KEY secret is set. Self-sufficient; never aborts the deploy.
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python -m engine.master_brain > /tmp/mb.log 2>&1; rc=$?
          cat /tmp/mb.log
          [ "$rc" -ne 0 ] && echo "::warning title=master_brain::rc=$rc (non-fatal)"
          exit 0
      - name: AI desk scorer (durability loop; deterministic, resilient)
        # Grades past-due theses in data/ai_desk/theses.jsonl against realized closes,
        # appends data/ai_desk/scored.jsonl, and writes data/ai_desk/track_record.json
        # which the desk step below reads back to calibrate conviction. Deterministic
        # (no API key); runs BEFORE the desk so today's note sees the freshest record.
        run: |
          set +e
          python -m engine.ai_desk_scorer > /tmp/aidesk_score.log 2>&1; rc=$?
          cat /tmp/aidesk_score.log
          [ "$rc" -ne 0 ] && echo "::warning title=ai_desk_scorer::rc=$rc (non-fatal)"
          exit 0
      - name: Demand-chain ledger (Demand Desk Phase 2; deterministic, resilient)
        # Appends falsifiable demand-chain divergence theses (data/demand_chain/theses.jsonl)
        # and scores past-due ones vs SPY into data/demand_chain/{scored.jsonl,track_record.json},
        # which the Demand Context panel reads back as its accountability line. Rule-derived
        # (no API key) — turns the "customer capex ahead of consensus" read into a scored
        # forward record. Reuses the ai_desk_scorer predicate evaluators. Never aborts.
        run: |
          set +e
          python -m engine.demand_ledger > /tmp/demand_ledger.log 2>&1; rc=$?
          cat /tmp/demand_ledger.log
          [ "$rc" -ne 0 ] && echo "::warning title=demand_ledger::rc=$rc (non-fatal)"
          exit 0
      - name: Demand-chain Phase-0 validation (forward placebo test; resilient)
        # Reads the demand_chain ledger and, once enough theses are DECIDED, tests the
        # hit-rate vs a coin flip (exact binomial) → data/demand_chain/phase0.json.
        # Honest by design: the signal is NOT historically back-testable (annual cadence,
        # no PIT consensus history), so the forward ledger is the only path; verdict stays
        # PENDING until ≥20 decided. Deterministic; never aborts.
        run: |
          set +e
          python -m scripts.demand_chain_phase0 > /tmp/demand_phase0.log 2>&1; rc=$?
          cat /tmp/demand_phase0.log
          [ "$rc" -ne 0 ] && echo "::warning title=demand_chain_phase0::rc=$rc (non-fatal)"
          exit 0
      - name: Demand Desk page (build_demand)
        # market-wide view of the L2 demand layer (site/demand.html): the ranked
        # ahead-of-consensus / at-risk names across all chains + chain signals + the
        # scored-ledger track record + Phase-0 verdict. Runs AFTER the ledger/phase0
        # steps (fresh track_record/phase0) and build_site (rpo dripped). Resilient.
        run: python -m scripts.build_demand
      - name: AI desk (accountable analyst layer; context-only, resilient)
        # Runs right after master_brain (shares the keyed LLM step family). Reads the
        # TRUST-GRADED detectors — site/basketdata/flow.json (from build_baskets) +
        # data/regime/regime_snap.json (when Engine-2 is present) — and writes a
        # FALSIFIABLE desk note (data/regime/ai_desk.json + site/ai_desk.json) while
        # appending data/ai_desk/theses.jsonl for the Phase-C scorer to grade. NO-OP
        # unless BOTH config ai_desk.enabled is true AND DEEPSEEK_API_KEY is set.
        # Context-only (never scored/sized); self-sufficient; never aborts the deploy.
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python -m engine.ai_desk > /tmp/aidesk.log 2>&1; rc=$?
          cat /tmp/aidesk.log
          [ "$rc" -ne 0 ] && echo "::warning title=ai_desk::rc=$rc (non-fatal)"
          exit 0
      - name: Narrative Brain (Claude radar-reasoning desk; context-only, resilient)
        # Reads the deterministic radar (site/basketdata/radar.json from build_baskets) as an
        # evidence pack and writes a FALSIFIABLE durability + rotation read (site/basketdata/
        # narrative_brain.json) + appends data/narrative_brain/theses.jsonl. Claude via the
        # user's Claude-Code OAuth token (Bearer + oauth beta header), ANTHROPIC_API_KEY fallback.
        # NO-OP unless narrative_brain.enabled AND a token is set. Context-only; never aborts.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python -m engine.narrative_brain > /tmp/nbrain.log 2>&1; rc=$?
          cat /tmp/nbrain.log
          [ "$rc" -ne 0 ] && echo "::warning title=narrative_brain::rc=$rc (non-fatal)"
          exit 0
      - name: Risk Brain (Claude/Opus daily drawdown-risk officer; context-only, resilient)
        # Reads the engine's own deterministic risk stack (data/regime/latest.json.risk_state,
        # site/riskdata/mtf_monitor.json, GEX, baskets, narrative rotation, standouts) and writes
        # a FALSIFIABLE risk read + a CODE-clamped de-risk DIRECTIVE (site/riskdata/risk_brain.json)
        # + appends data/risk_brain/theses.jsonl. Runs AFTER build_site/build_baskets so its evidence
        # exists. Claude via the OAuth token / ANTHROPIC_API_KEY fallback. NO-OP unless
        # risk_brain.enabled AND a token is set. Context-only; never aborts.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python -m engine.risk_brain > /tmp/rbrain.log 2>&1; rc=$?
          cat /tmp/rbrain.log
          [ "$rc" -ne 0 ] && echo "::warning title=risk_brain::rc=$rc (non-fatal)"
          exit 0
      - name: Risk Radar self-correction (Opus reviews graded mistakes -> bounded recalibration)
        # Reads the radar's realized forward-outcome scorecard (data/risk_radar/forward_log.jsonl),
        # lets Opus propose calibration nudges to cut false positives + catch misses, CLAMPS them and
        # applies ONLY if a do-no-harm backtest confirms F1 improves (full + 2020) without breaking the
        # evidence gate. Writes data/risk_radar/calibration.json + review_log.jsonl. NO-OP unless
        # risk_radar_review.enabled AND a token is set AND >=30 calls graded. Never aborts.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python -m engine.risk_radar_review > /tmp/rrev.log 2>&1; rc=$?
          cat /tmp/rrev.log
          [ "$rc" -ne 0 ] && echo "::warning title=risk_radar_review::rc=$rc (non-fatal)"
          exit 0
      - name: Radar + Brain ledger scorer (grade the falsifiable theses vs SPY; context-only)
        # Grades data/{radar,narrative_brain}/theses.jsonl once each check_by passes (reuses
        # engine.ai_desk_scorer) -> track_record.json + a site copy. Idempotent; context-only
        # (never feeds a score); needs no key. Runs after the brain so fresh theses are logged.
        run: |
          set +e
          python -m engine.radar_scorer > /tmp/radar_score.log 2>&1; rc=$?
          cat /tmp/radar_score.log
          [ "$rc" -ne 0 ] && echo "::warning title=radar_scorer::rc=$rc (non-fatal)"
          exit 0
      - name: Calibration Hub (unified self-improvement observability; display-only)
        # Consolidates every Phase-C desk's track_record + the Trial Ledger into one
        # surface (data/calibration/summary.json + site/calibration.html). Runs after the
        # deterministic scorers so it reads fresh track records; never feeds a score.
        run: python -m scripts.build_calibration || true
      - name: Alt-Data Brain (Claude-Opus convergence analyst; actionable + falsifiable)
        # Reads the deterministic weighted-convergence substrate + influence graph (written by
        # build_alt_data above) as an evidence pack and writes an ACTIONABLE scored read
        # (action/conviction/direction + a falsifiable thesis graded vs SPY) -> site/altdata/
        # brain.json + data/altdata/brain_theses.jsonl, then re-runs build_alt_data to re-emit
        # mastermind.json + re-render alt_data.html with the fresh read. Claude via the user's
        # Claude-Code OAuth token (Bearer + oauth beta), ANTHROPIC_API_KEY fallback — the SAME
        # auth as the Narrative Brain step (the build_alt_data step above only carries the
        # DeepSeek key, so the Opus/Haiku calls must run HERE). NO-OP unless altdata_brain.enabled
        # AND a token is set. A hard CODE clamp blocks ACCUMULATE on an extended name; never aborts.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python -m engine.altdata_brain > /tmp/altbrain.log 2>&1; rc=$?
          cat /tmp/altbrain.log
          # re-emit the Mastermind feed + re-render the page with the fresh Opus read
          python -m scripts.build_alt_data > /tmp/altbrain_render.log 2>&1
          tail -3 /tmp/altbrain_render.log
          [ "$rc" -ne 0 ] && echo "::warning title=altdata_brain::rc=$rc (non-fatal)"
          exit 0
      - name: radar upgrade (build_radar_plus + IC)
        # ADDITIVE Phase-2 radar: enrich site/basketdata/radar.json with edge_score +
        # cross-source confirmation legs (alt/flows/options) + regime + decay (no edits to
        # the radar kernel), emit site/basketdata/radar_ticker.json (per-name divergence),
        # accrue the edge-snapshot IC ledger, then re-render radar.html with the mounts.
        # Runs after build_baskets (radar.json) + build_alt_data + the Alt-Data Brain, and
        # BEFORE build_intelligence (which absorbs radar_ticker.json). Resilient.
        run: |
          set +e
          python -m scripts.build_radar_plus > /tmp/radarplus.log 2>&1; tail -4 /tmp/radarplus.log
          python -m scripts.build_radar_ic   > /tmp/radaric.log   2>&1; tail -3 /tmp/radaric.log
          python -m scripts.build_radar_page  > /tmp/radarpage.log 2>&1; tail -1 /tmp/radarpage.log
          exit 0
      - name: unified intelligence bundle (build_intelligence)
        # AFTER build_news (news/by_ticker.json) + build_alt_data + the Alt-Data Brain re-emit
        # (altdata/mastermind.json) + build_radar_plus (radar_ticker.json): merges all per-ticker
        # facets — news flow + alt-data signal + radar divergence + factor buy-board — into ONE
        # site/intelligence/by_ticker.json (v2) the Mastermind bot pulls. Facts side by side,
        # never pre-blended. No keys needed; pure JSON merge; never aborts.
        run: python -m scripts.build_intelligence || echo "intelligence skipped (additive)"
      - name: brain briefing tunnel (build_briefing)
        # AFTER build_intelligence: reduces the per-ticker bundle to a RANKED, brain-facing
        # triage — site/intelligence/briefing.json — that the Mastermind brain (Claude Opus)
        # pulls once per cycle: priority queue (confidence × strength), the demand-vs-supply
        # divergence subset, and a regime/catalyst macro frame. Pure; resilient; never aborts.
        run: python -m scripts.build_briefing || echo "briefing skipped (additive)"
      - name: Intelligence Hub (build_intel_hub)
        # AFTER build_intelligence + build_briefing + build_policy_watch + build_radar_plus:
        # fuses ALL FIVE desks (news · alt-data · radar · buy-board · policy) into one central
        # command — site/intel_hub/hub.json + site/intelligence_hub.html — with cross-source
        # confirmation, composite conviction (docked by an unanswered falsifier), 2nd/3rd-order
        # flags (stealth_accumulation / early_edge / crowded_top / …), and the sector heat.
        # The US analogue of the China intel hub; pure, resilient, never aborts.
        run: python -m scripts.build_intel_hub || echo "intel hub skipped (additive)"
      - name: AI Daily Brief page (build_aibrief)
        # consolidated page (site/aibrief.html) surfacing the three client-fetched AI
        # briefs (master/china/btc) as toggle tabs. Pure render — order-independent;
        # resilient (returns 0). Replaces the retired deterministic daily_brief.
        run: python -m scripts.build_aibrief
      - name: Mastermind snapshot page (build_mastermind)
        # static page (site/mastermind.html) that renders a daily snapshot of the LOCAL
        # Mastermind AI paper-trading desk. Pure chrome — the data (site/mastermind/
        # mastermind_snapshot.json) is pushed out-of-band twice a day by the local
        # Mastermind server (the cloud build can't reach localhost); mastermind.js fetches
        # it client-side and degrades to "snapshot pending" when absent. Order-independent;
        # resilient (returns 0).
        run: python -m scripts.build_mastermind
      - name: AI Desk page (build_ai_desk_page)
        # static page (site/ai_desk.html) surfacing the accountable analyst desk
        # (site/ai_desk.json: falsifiable leans + dissent + falsifier + track record +
        # the analyst panel). Pure render — order-independent; resilient (returns 0).
        run: python -m scripts.build_ai_desk_page
      - name: rebuild stock-search libraries (resilient — guarantees the analyzers ship)
        # build_china/build_hk (and build_canada/build_intl via build_vector hooks)
        # render their dashboards but SWALLOW errors (return 0), so a failure there
        # silently 404s the per-stock search. This rebuilds the search JSON
        # (site/chinastockdata, site/hkstockdata, site/canadastockdata,
        # site/intlstockdata) directly from the committed caches — independent of the
        # dashboard render — and surfaces any failure as an annotation without
        # aborting the deploy. Idempotent.
        run: |
          set +e
          libdir() {
            case "$1" in
              scripts.build_china_library) echo site/chinastockdata;;
              scripts.build_hk_library) echo site/hkstockdata;;
              scripts.build_canada_library) echo site/canadastockdata;;
              scripts.build_intl_library) echo site/intlstockdata;;
            esac
          }
          for mod in scripts.build_china_library scripts.build_hk_library scripts.build_canada_library scripts.build_intl_library; do
            idx="$(libdir "$mod")/index.json"
            # Skip a market whose dashboard step already built its library FRESH this run
            # (index.json newer than the job-start marker). This rebuild is a FAILURE-PATH
            # safety net — on the success path the same heavy analyze() over the whole
            # universe already ran, so rebuilding is pure duplicate work. A dashboard that
            # swallowed an error leaves an older (pulled) index.json => marker is newer =>
            # we still rebuild and the library ships.
            if [ -f /tmp/engine_libs_marker ] && [ "$idx" -nt /tmp/engine_libs_marker ]; then
              echo "::notice::$mod — already built fresh this run ($idx); skipping redundant rebuild"
              continue
            fi
            echo "::group::$mod"; python -m "$mod" > /tmp/lib.log 2>&1; rc=$?; cat /tmp/lib.log; echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$mod failed (rc=$rc)::$(tail -n 2 /tmp/lib.log | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ $mod failed (rc=$rc)"; echo '```'; tail -n 40 /tmp/lib.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 0
      - name: notify (telegram/discord; skips when secrets absent)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scripts.notify
      - name: archive signal layer (append-only point-in-time model outputs; resilient)
        # LAST data-producing step: append today's latest.json / bond_health.json /
        # regime_snap.json / forex + commodity reads to data/signal_archive/<label>.parquet
        # (keep-first per as-of date). A clean, queryable, point-in-time record of what
        # each model SAID each day — distinct from regime_history.parquet, which is
        # RECOMPUTED from scratch every run (so it carries data revisions + today's code
        # backwards = lookahead). Lossless via a snapshot_json column. Display/research-
        # only, never read back into a score; the script always exits 0.
        run: python -m scripts.archive_signals || true
      - name: signal sanity (correctness tripwire — warn mode)
        if: always()   # validate whatever DID build, even if an earlier optional builder failed
        # The CORRECTNESS dead-man's switch over the per-ticker boards BOTH books select from
        # (coverage floor / score-column degeneracy / content-freeze / staleness / drift — see
        # engine/signal_sanity.py). Liveness (healthcheck) catches "pipeline stopped"; this catches
        # "pipeline ran and published WRONG numbers". WARN mode: it annotates, writes
        # reports/signal-sanity.md, updates the rolling baseline, and pings Telegram/Discord on a
        # trip, but never blocks the build (|| true). Opt-in deploy-gating (skip the commit when it
        # trips) is a deliberate follow-up — keep the daily commit unconditional for now.
        run: python -m scripts.signal_sanity || true
      - name: White House Watch — re-render page + inject site-wide alert banner
        # PAGE-ONLY here: re-render site/wh_banner.json + site/whitehouse.html from the
        # already-committed ledger (no feed poll, no Opus call, no ledger/state writes) — the
        # hourly `whitehouse-sentinel` workflow is the SOLE brain-caller / ledger-writer, so
        # the two workflows can never race to append-then-clobber an alert. Then inject the
        # alert-ticker <script> into EVERY generated page (depth-aware, idempotent) so the
        # banner shows site-wide. MUST be the last page-mutating step so no later builder
        # strips the tag. Resilient: rc 10 = "changed" (the desk's success signal, not an
        # error); each script leaves prior output in place on any real failure.
        run: |
          python -m scripts.build_whitehouse --page-only; rc=$?; [ $rc -eq 0 ] || [ $rc -eq 10 ] || echo "whitehouse desk skipped (additive)"
          python -m scripts.inject_wh_banner || echo "banner inject skipped (additive)"
      - name: commit engine outputs
        if: always()   # commit the freshly-built pages even if a LATER optional builder times out or is cancelled. pages.yml deploys the COMMITTED main tree, so a skipped commit = stale live site. The builders are individually resilient (each leaves the prior page in place on its own error), so partial output is never broken — committing what built beats shipping nothing.
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/ reports/
          # LLM stock briefs (site/stockbrief) are gitignored for local-dev cleanliness
          # but must be TRACKED on main so the committed-tree deploy (pages.yml) ships
          # them — same as the force-tracked stock-search libraries. -f overrides the
          # ignore; || true so an empty/absent dir (feature off) never fails the commit.
          git add -f site/stockbrief 2>/dev/null || true
          # China stock-search library: gitignored like the other markets' libraries —
          # force-add it so the committed-tree deploy ships every indexed A-share detail
          # JSON, not just the old tracked subset.
          git add -f site/chinastockdata 2>/dev/null || true
          # Canada stock-search library: gitignored like the other markets' libraries,
          # but (unlike them) force-added here so the committed-tree deploy ships it —
          # otherwise canada_stock.html's search 404s on canadastockdata/index.json.
          git add -f site/canadastockdata 2>/dev/null || true
          # International stock-search library: same gitignore situation — force-add so
          # the committed-tree deploy ships it (else intl_stock.html search 404s).
          git add -f site/intlstockdata 2>/dev/null || true
          # US stock-search library (built by build_site -> build_stock_library): only a
          # ~534-name legacy subset was ever tracked while the index lists ~1595, so the
          # untracked long tail 404'd on click. Force-add the whole dir so every name ships.
          git add -f site/stockdata 2>/dev/null || true
          # Bespoke single-stock chart OHLC (built by build_site -> build_chart_data):
          # gitignored like the search libraries, so force-add it or the committed-tree
          # deploy ships no price data and every stock chart renders empty.
          git add -f site/ohlc 2>/dev/null || true
          # Non-US bespoke chart OHLC (built by build_{china,canada,intl}_library): same
          # gitignore + force-add situation as their stockdata libraries. HK now also ships
          # reconstructed candles (build_hk_library -> build_chart_data.build_hk -> site/hkohlc),
          # imputed from its close-only per-stock JSON so the chart draws candlesticks.
          git add -f site/chinaohlc site/canadaohlc site/intlohlc site/hkohlc 2>/dev/null || true
          # US 4H intraday chart data (built by build_site -> build_chart_data.emit_intraday
          # from the cached data/intraday) — gitignored, force-add so the deploy ships it.
          git add -f site/intraday 2>/dev/null || true
          if git diff --cached --quiet; then echo "no engine output changes"; exit 0; fi
          git commit -m "engine: regime update $(date -u +%F)"
          # best-effort push (see commit-data). The deploy below uses the uploaded
          # artifact, so it never depends on this commit landing.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "pushed engine outputs on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "engine push attempt $i lost a race; re-syncing"; sleep $((i * 7))
          done
          echo "::warning::could not push engine outputs after 5 attempts (non-fatal — site still deploys via artifact)"
      - name: upload pages artifact
        if: always()   # deploy must not hinge on the commit-push above succeeding
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # The factor-portfolio RETURN SERIES (factors-page chart) is a ~22-min month-end
  # walk (compute_factors x ~38 month-ends x 2 universes) — it was the real engine
  # bottleneck that pushed the job past its cap on congested runners. It only moves
  # at month-ends, build_site reads the COMMITTED factor_series.json
  # (degrade-never-raise), and the deploy uses the engine artifact — so it runs here
  # ISOLATED, in parallel with engine, can never gate/slow the daily deploy, and its
  # refresh lands on main for the next run (<=1 run stale = fine for a ~3y month-end
  # chart whose fundamental ranks refresh ~yearly). `publish` needs ONLY engine, so a
  # slow/failed factor_series can never block the dashboard going live.
  factor_series:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # build_factor_series._closes() reads these breadth close caches (broad =
      # breadth+smallcap+midcap, narrow = breadth). Restore-only — the collect job
      # produces/saves them.
      - name: restore breadth (S&P 500) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-fseries-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-fseries-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-fseries-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: factor return series (build_factor_series)
        run: python -m scripts.build_factor_series || echo "factor series skipped (additive)"
      - name: commit factor series
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/factordata/factor_series.json
          if git diff --cached --quiet; then echo "no factor-series changes"; exit 0; fi
          git commit -m "factor-series: month-end walk $(date -u +%F)"
          # best-effort push (different file from engine's outputs → rebases clean)
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "pushed factor series on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "factor-series push attempt $i lost a race; re-syncing"; sleep $((i * 7))
          done
          echo "::warning::could not push factor series after 5 attempts (non-fatal — daily reads the last committed json)"

  # AI stock-research briefs = ~30 DeepSeek calls (~20 min) — the heaviest single
  # step in the build, and what pushed the engine job past its timeout. build_site
  # now only writes the target ticker list (data/catalyst/brief_targets.json); the
  # LLM calls run HERE, isolated and in parallel with `publish`. The stock page
  # fetches site/stockbrief/<T>.json client-side, so the briefs land on main for
  # the next run (<=1-run stale is fine) and the LLM never gates the daily deploy.
  # `publish` needs ONLY engine, so a slow/failed briefs job can't block go-live.
  stock_briefs:
    needs: engine
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # the per-stock technical-signal leg reads constituent closes; restore-only.
      - name: restore breadth (S&P 500) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-briefs-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-briefs-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-briefs-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: precompute AI stock briefs (build_stock_briefs)
        run: python -m scripts.build_stock_briefs || echo "stock briefs skipped (additive)"
      - name: commit stock briefs
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # site/stockbrief is gitignored for local-dev cleanliness but must be TRACKED
          # on main so the committed-tree deploy ships it (-f overrides the ignore).
          git add -f site/stockbrief 2>/dev/null || true
          git add data/catalyst/stockbrief_cache 2>/dev/null || true
          # stock_desk (T9): the accountable-lean notes + the graded track record are written
          # by build_stock_briefs in THIS job (after the engine job's force-add of site/stockdata
          # already ran), so they must be force-added HERE or they never land on main → the
          # aidesk_lean.js panel 404s. The ledger (data/stock_desk, NOT gitignored) must also be
          # committed or the track record can never accumulate past-due leans. (Same gitignore/
          # force-add trap as the per-market stock libraries.)
          git add -f site/stockdata/ai_desk_notes.json site/stockdata/ai_desk_track.json 2>/dev/null || true
          git add data/stock_desk 2>/dev/null || true
          if git diff --cached --quiet; then echo "no stock-brief changes"; exit 0; fi
          git commit -m "stock-briefs: AI research briefs + accountable leans $(date -u +%F)"
          # best-effort push (own files → rebases clean against engine/factor_series)
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "pushed stock briefs on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "stock-briefs push attempt $i lost a race; re-syncing"; sleep $((i * 7))
          done
          echo "::warning::could not push stock briefs after 5 attempts (non-fatal — the stock page falls back to the last committed briefs)"

  publish:
    # GitHub Pages can't serve a /site folder from a branch — deploy the
    # artifact instead (repo Settings -> Pages -> Source: GitHub Actions)
    needs: engine
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
