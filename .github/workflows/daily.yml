        # Additive — never breaks the deploy.
        run: python -m scripts.build_portfolio_ctx || echo "::warning::build_portfolio_ctx failed (non-fatal — last committed portfolio_ctx.json stands)"
      - name: MLC W2b stance matrix (build_stance_matrix)
        # MLC-W2b coherence layer: per-basket stance matrix collecting sector/theme/confluence/
        # allocation/m7c verdicts mapped to a signed tier scale (-2..+2). Reads
        # baskets.json (build_baskets), sector_central.json (build_sector_central above),
        # basket_confluence.json, allocation.json, and mag7_regime latest.json.
        # Output site/mlcdata/stance_matrix.json rides the existing `git add data/ site/` commit.
        # Additive (always exits 0 — never breaks the deploy).
        run: python -m scripts.build_stance_matrix || echo "::warning::build_stance_matrix non-fatal failure"
      - name: FTR W9 grading pack (basket_turn.v1 cohort claims + tape_disagreement.v1)
        # basket_turn.v1: one qledger claim per IGNITION-day cohort (equal-weight basket EW vs
        # SPY, 21d horizon, expected-NULL forward meter per FT-R9). Reads
        # data/basket_turn/ledger.jsonl (written by basket_turn_watch in cl_baskets → build_baskets).
        # tape_disagreement.v1: disagreement-day records (basket IGNITION while slow reco not in
        # {enter,accumulate}), outcome tracking with explicit right-censoring at +10/+21 sessions.
        # Both families gated on COLLECT_LANE=nightly. Keep-first idempotent. Exit-0-always.
        # Runs AFTER the parallel band (cl_baskets writes the source ledger).
        continue-on-error: true
        env:
          COLLECT_LANE: nightly
        run: |
          set +e
          python -m scripts.build_basket_turn_grading > "$RUNNER_TEMP/basket_turn_grading.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/basket_turn_grading.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=build_basket_turn_grading::rc=$rc (non-fatal)"; fi
          exit 0
      - name: Polygon reference-universe cache (GICS sector + market cap for heatmap manifest)
        # Builds data/polygon_universe/reference.parquet — ticker → GICS sector + USD market cap.
        # Consumed by the charting-app's ingest/build_universe.py when it rebuilds the
        # heatmap manifest (~8.7k rows); enriches US names with real sector + cap sizing.
        # Refreshes NIGHTLY, judged from the parquet's asof column (never mtime — CI
