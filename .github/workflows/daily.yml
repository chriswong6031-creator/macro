name: daily
on:
  schedule:
    - cron: "40 22 * * 1-5"   # 22:40 UTC weekdays, after US close; off-hour minute avoids scheduler congestion
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: restore breadth close cache
        uses: actions/cache@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) breadth close cache
        uses: actions/cache@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) breadth close cache
        uses: actions/cache@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: restore china breadth close cache
        uses: actions/cache@v4
        with:
          path: data/china_breadth/_closes_cache.parquet
          key: china-breadth-closes-${{ github.run_id }}
          restore-keys: china-breadth-closes-
      - name: restore hk breadth close cache
        uses: actions/cache@v4
        with:
          path: data/hk_breadth/_closes_cache.parquet
          key: hk-breadth-closes-${{ github.run_id }}
          restore-keys: hk-breadth-closes-
      - name: run collectors (graceful degradation — never fails the build on one source)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          if [ -n "$FRED_API_KEY" ]; then echo "::notice::FRED_API_KEY present — using official API"; else echo "::warning::FRED_API_KEY ABSENT — check repo Settings > Secrets and variables > Actions > Repository secrets"; fi
          python -m scripts.collect
      - name: commit data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data changes to commit"; exit 0; fi
          git commit -m "data: daily collection $(date -u +%F)"
          # best-effort push: losing a race with a concurrent push must NOT fail the
          # pipeline (the data is collected; the next run re-syncs). Retry rebase+push,
          # preferring our freshly-collected data on any conflict.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "pushed data on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "data push attempt $i lost a race; re-syncing"; sleep $((i * 7))
          done
          echo "::warning::could not push collected data after 5 attempts (non-fatal)"

  engine:
    needs: collect
    if: always()            # a scraper failure must still produce a dashboard from cached data
    runs-on: ubuntu-latest
    timeout-minutes: 40     # search libraries grew (US ~1500 + China ~800 + HK); headroom vs the 20m cap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: restore breadth close cache (stock search library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-engine-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) breadth close cache (stock library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-engine-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) breadth close cache (stock library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-engine-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: restore hk breadth close cache (hk stock search library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/hk_breadth/_closes_cache.parquet
          key: hk-breadth-closes-engine-${{ github.run_id }}
          restore-keys: hk-breadth-closes-
      - name: run regime engine + build dashboard + daily brief (resilient)
        # Self-diagnosing + deploy-resilient: each builder runs isolated; a failure
        # is surfaced as a ::error:: annotation (readable on the run page + via the
        # public check-runs API) AND appended to the run Summary with its traceback,
        # but NEVER aborts the job — so the site still deploys (via the always()
        # artifact upload) and one broken builder can't 404 the whole dashboard.
        env:
          # catalyst_tone (Tier-A FOMC/dislocation digest) runs INSIDE engine.run, so it
          # needs the DeepSeek key here too — not only on the master_brain step below.
          # No-op (degrades to neutral) when the secret is absent.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          run_py() {
            local label="$1"; local mod="$2"
            echo "::group::$label"
            python -m "$mod" > /tmp/step.log 2>&1; local rc=$?
            cat /tmp/step.log
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$label failed (rc=$rc)::$(tail -n 2 /tmp/step.log | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ $label failed (rc=$rc)"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 60 /tmp/step.log; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          run_py "regime engine (engine.run)" engine.run
          run_py "macro dashboard (build_site)" scripts.build_site
          run_py "daily brief (daily_brief)" scripts.daily_brief
          exit 0
      - name: build china a-share dashboard
        # after build_site, before build_vector (which writes the landing hub last):
        # writes china.html + china_regime/latest.json so the hub picks up the China
        # card. Self-sufficient; returns 0 on any error (can't break the macro/vector site).
        run: python -m scripts.build_china
      - name: build hong kong / hang seng dashboard
        # after build_site/build_china, before build_vector (which writes the hub
        # last): writes hk.html + hk_regime/latest.json so the hub picks up the
        # Hong Kong card. Self-sufficient; returns 0 on any engine error.
        run: python -m scripts.build_hk
      - name: build commodity vector dashboard
        # after build_site/build_china, before build_vector (which writes the hub
        # last): writes commodities.html + commodity/latest.json so the hub picks up
        # the Commodity card. Self-sufficient; returns 0 on any engine error.
        run: python -m scripts.build_commodities
      - name: build forex vector dashboard
        # after build_commodities, before build_vector (which writes the hub last):
        # writes forex.html + forex/latest.json so the hub picks up the Forex card.
        # Self-sufficient; returns 0 on any engine error.
        run: python -m scripts.build_forex
      - name: build bonds & bond-health dashboard
        # after build_site/build_forex, before build_vector (which writes the hub
        # last): writes bonds.html + bonds/latest.json (hub card) + bonds/
        # bond_health.json (the cross-asset AI signal vector). Reuses the macro
        # feature frame + conditions layer; returns 0 on any engine error.
        run: python -m scripts.build_bonds
      - name: discovery leaderboard (build_discovery)
        # after build_site (reads site/factordata/alpha.json) and build_forex,
        # before build_vector (which writes the hub last): writes the discovery
        # leaderboard. Self-sufficient; returns 0 on any engine error.
        run: python -m scripts.build_discovery
      - name: GEX magnets board (build_gex_board)
        # after build_site; live Cboe chains -> site/gex.html. Self-sufficient (returns 0 on engine error).
        run: python -m scripts.build_gex_board
      - name: cross-asset vector (build_crossasset)
        # after the commodity/forex/bonds pages, before build_vector (hub last):
        # TSMOM trend + intermarket ratios + correlation regime over keyless
        # price stores -> site/crossasset.html + data/crossasset/latest.json.
        # Self-sufficient; returns 0 on any engine error.
        run: python -m scripts.build_crossasset
      - name: build bitcoin vector + landing hub
        # installs the landing hub at index.html (rendered from stored engine
        # state, so ordering vs build_site no longer matters — build_site writes
        # the macro dashboard straight to macro.html). Self-sufficient (recomputes
        # signals); returns 0 even if the crypto engine errors, so it can never
        # break the macro site.
        run: python -m scripts.build_vector
      - name: master brain (cross-asset LLM synthesis; default-off, resilient)
        # Runs LAST among the builders — it reads EVERY dashboard's latest.json
        # (macro/china/hk/commodity/forex + BTC) plus the catalyst digest. Writes
        # data/regime/master_brief.json + site/master_brief.json (client-fetched by
        # the dashboard's Master Brief panel). NO-OP unless BOTH config
        # master_brain.enabled is true AND the DEEPSEEK_API_KEY secret is set.
        # Self-sufficient; never aborts the deploy.
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python -m engine.master_brain > /tmp/mb.log 2>&1; rc=$?
          cat /tmp/mb.log
          [ "$rc" -ne 0 ] && echo "::warning title=master_brain::rc=$rc (non-fatal)"
          exit 0
      - name: rebuild stock-search libraries (resilient — guarantees the analyzers ship)
        # build_china/build_hk render their dashboards but SWALLOW errors (return 0),
        # so a failure there silently 404s the per-stock search. This rebuilds the
        # search JSON (site/chinastockdata, site/hkstockdata) directly from the
        # committed caches — independent of the dashboard render — and surfaces any
        # failure as an annotation without aborting the deploy. Idempotent.
        run: |
          set +e
          for mod in scripts.build_china_library scripts.build_hk_library; do
            echo "::group::$mod"; python -m "$mod" > /tmp/lib.log 2>&1; rc=$?; cat /tmp/lib.log; echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$mod failed (rc=$rc)::$(tail -n 2 /tmp/lib.log | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ $mod failed (rc=$rc)"; echo '```'; tail -n 40 /tmp/lib.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 0
      - name: notify (telegram/discord; skips when secrets absent)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scripts.notify
      - name: commit engine outputs
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/ reports/
          # LLM stock briefs (site/stockbrief) are gitignored for local-dev cleanliness
          # but must be TRACKED on main so the committed-tree deploy (pages.yml) ships
          # them — same as the force-tracked stock-search libraries. -f overrides the
          # ignore; || true so an empty/absent dir (feature off) never fails the commit.
          git add -f site/stockbrief 2>/dev/null || true
          if git diff --cached --quiet; then echo "no engine output changes"; exit 0; fi
          git commit -m "engine: regime update $(date -u +%F)"
          # best-effort push (see commit-data). The deploy below uses the uploaded
          # artifact, so it never depends on this commit landing.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "pushed engine outputs on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "engine push attempt $i lost a race; re-syncing"; sleep $((i * 7))
          done
          echo "::warning::could not push engine outputs after 5 attempts (non-fatal — site still deploys via artifact)"
      - name: upload pages artifact
        if: always()   # deploy must not hinge on the commit-push above succeeding
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  publish:
    # GitHub Pages can't serve a /site folder from a branch — deploy the
    # artifact instead (repo Settings -> Pages -> Source: GitHub Actions)
    needs: engine
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
