      - name: Prophet nightly (plan refresh + ledger advancement + R2 mirror)
        # AFTER build_site: reads site/factordata/us_standouts.json (just written).
        # Originates new prophet.trade_plan/v1 envelopes, runs the management engine
        # for every active plan, advances the forward outcome ledger (nightly is the
        # SOLE advancer — idempotent per plan ID), and optionally mirrors
        # site/prophet/index.json to R2 key "prophet/index.json".
        # Artifacts committed by "commit engine outputs" below (site/ + data/ covers
        # site/prophet/** and data/prophet/ledger.jsonl — no extra git add needed).
        # continue-on-error: true — a prophet failure must never abort the nightly deploy.
        # R2 creds: passed when present; build_prophet skips upload gracefully when absent.
