      - name: Chronicle — market context timeline spine
        if: always()
        continue-on-error: true
        # if: always() is load-bearing, NOT decoration (M12): this step sits deep
        # in the job's tail, and ~19 upstream steps here can still hard-fail
        # (build_aibrief, build_mastermind, build_sector_central, notify, ...).
        # Once any of them fails, GitHub SKIPS every later step lacking always()
        # — observed on 3 of the 5 scheduled nights 2026-07-21→07-25 (runs
        # 29877186502 / 29966266057 / 30053251096, where e.g. "White House Watch"
        # was skipped while its always() neighbours ran). continue-on-error does
        # NOT cover this: it protects a step that RUNS and fails, not one that is
        # never reached. Without always() the state_log — a forward-only capture
        # that is unrecoverable for any night it misses — would advance on
        # roughly 1 night in 5.
        # M10 fix: moved from standout_audit_us (which needs: engine, i.e. runs
        # AFTER this whole job finishes) into engine, ahead of "build mastermind
        # context" below — the chronicle lobe was permanently serving the
        # PREVIOUS night's store because it built after the very context that
        # was supposed to read it fresh. This placement also gives the build a
        # COLLECT_LANE=nightly sentinel (job-level env above) — required by the
        # B2 lane gate on the state_log write path. Measured cost 0.396s;
        # negligible against the 200-minute cap.
        run: |
          set +e
          python -m scripts.build_chronicle; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=chronicle_governor::rc=$rc (chronicle events/state_log/rollups may be stale)"
          fi
          exit 0
      - name: commit chronicle artifacts
        if: always()
        # always() for the same reason as the build step above — and it matters
        # more here: a build that ran but whose commit was skipped leaves the
        # appended state_log row on the runner's disk only, so the capture is
        # lost exactly as if the build had never run.
        # Scoped to data/chronicle only (not folded into "commit engine
        # outputs" below): an early, dedicated commit+push means the chronicle
        # store survives even if the rest of this job later times out (this
        # job has a documented cancellation history — see its timeout-minutes
        # comment above). Own files — no other job writes these paths.
        # METADATA-ONLY PUSH — this step must NEVER run `git pull` (P0 2026-08-01,
        # d29e4dd44d / #4167). It is the one push in this job that runs while the
        # whole night's render sits DIRTY in the working tree: on 2026-08-01 its
        # `pull --rebase --autostash` parked ~5.7k uncommitted files, the re-apply
        # conflicted against three sibling cache-rotation merges (#4151/#4155/#4158,
        # 1,895 pages each), git left `Updated upstream / Stashed changes` blocks in
        # 1,707 pages AND STILL EXITED 0 — and "commit engine outputs" below swept
        # them into main via its broad `git add`. push_metadata_replay_commit builds
        # the rebased chronicle commit in a temporary index (data/chronicle has a
        # single writer, so a true replay conflict is a genuine anomaly) and pushes
        # the object id; the dirty render tree is never touched. Local main stays on
        # the original chronicle commit — the engine push loop below rebases it out
        # as an already-applied patch, exactly as the old porcelain flow did.
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/chronicle 2>/dev/null || true
          if git diff --cached --quiet; then echo "no chronicle changes"; exit 0; fi
          CHRONICLE_PARENT=$(git rev-parse HEAD)
          git commit -m "chronicle: nightly event spine + state_log + rollups $(date -u +%F)"
          CHRONICLE_COMMIT=$(git rev-parse HEAD)
          CHRONICLE_MESSAGE=$(git log -1 --format=%B "$CHRONICLE_COMMIT")
          PUSH_ALARM=420
          push_retry_init "chronicle artifacts"
          while push_attempt; do
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            if CHRONICLE_PUBLISH=$(push_metadata_replay_commit "$CHRONICLE_PARENT" origin/main \
                "$CHRONICLE_COMMIT" "$CHRONICLE_MESSAGE" "${RUNNER_TEMP:-/tmp}/chronicle-replay.idx"); then
              # A replay whose tree equals origin/main means the chronicle content
              # already landed (e.g. a prior attempt's push worked but its alarm
              # misread it) — pushing it would create an empty duplicate commit.
              if [ "$(git rev-parse "$CHRONICLE_PUBLISH^{tree}")" = "$(git rev-parse origin/main^{tree})" ]; then
                echo "chronicle content already on origin/main — nothing to push"
                push_won; exit 0
              fi
              if push_do origin "$CHRONICLE_PUBLISH:refs/heads/main"; then
                echo "pushed chronicle artifacts on attempt $PUSH_ATTEMPT (metadata replay — dirty render tree untouched)"
                push_won; exit 0
              fi
            else
              # data/chronicle is single-writer: a replay conflict means another
              # writer touched it on main — anomalous, surface it while retrying.
              echo "::warning title=chronicle replay conflict::newer main changed data/chronicle differently (single-writer contract broken?) — retrying"
              PUSH_FAIL_CLASS="rebase-conflict"
            fi
            push_backoff
          done
          push_lost
          echo "::warning::could not push chronicle artifacts after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal — the local chronicle commit still rides the engine push loop below)"
      - name: build mastermind context (NW bridge)
        if: always()
        # NW → Mastermind bridge W1: compile data/neuralweb/mastermind_context.json and
        # site/neuralwebdata/mastermind_context.json from committed NW outputs.
        # Must run AFTER build world state so world_state.json is fresh.
        # Resilient: fail-open; kept last committed context on error; never blocks the commit.
