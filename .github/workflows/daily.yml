      - name: Prophet Live arming pass (provisional-close trigger pack -> R2)
        # AFTER build_site (same close stores the board was built from). Probes the
        # SAME close-only admission gate (engine/signal_gate.py) with candidate
        # provisional closes and publishes per-name trigger/fade levels to R2 key
        # live_flow/prophet_live_armed.json, so the */5 prophet-live.yml lane can
        # compare a delayed price to a level instead of re-deriving a signal
        # (research/PROPHET_LIVE_INTRADAY_SIGNALS_MASTERPLAN_BY_FABLE.md §4.1).
        #
        # WRITES NO data/ PATH — the pack is runtime-tier and lives only in R2.
        # The local --out copy goes to RUNNER_TEMP so it can feed the reconciler
        # step below without a network round trip; nothing is committed here.
        #
        # BUDGET: one gate call is ~250 ms over the ~1,740-name universe, so the
        # pass pays a full centre census plus a priority-ordered probe phase and an
        # edge-verification phase, ALL THREE bounded by one wall-clock budget
        # (config.yml prophet_live.max_seconds) plus max_probe. Whatever the budget
        # cuts is disclosed in meta.skipped, never re-labelled dormant. The measured
        # build_seconds and per-phase timings print on every run — watch them here.
        #
        # timeout-minutes AND continue-on-error together: the step timeout bounds a
        # wedge, continue-on-error keeps the bound non-fatal. Without the step cap a
        # hung pass eats the ENGINE JOB's 200m cap (worst observed 190m), and that
        # cap does not fail the job — it skips the commit step, silently losing the
        # night's engine outputs. Belt (in-script deadline) and braces (this).
        timeout-minutes: 9
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # The box is 4-core-bound (asia-close.yml pins the same knob for the same
          # reason). The stock library's default would take os.cpu_count() capped at
          # 8 and oversubscribe against whatever else the engine job is running.
          STOCK_LIB_WORKERS: "4"
        run: |
          set +e
          echo "::group::build_prophet_live_pack (arm the provisional-close triggers)"
          python -m scripts.build_prophet_live_pack --publish \
            --out "$RUNNER_TEMP/prophet_live_armed.json" > "$RUNNER_TEMP/prophet_live_pack.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/prophet_live_pack.log"
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then echo "::warning title=build_prophet_live_pack::rc=$rc (non-fatal — the intraday lane darks on a missing pack)"; fi
          exit 0
      - name: Prophet Live reconciler (intraday event spool -> forward ledger)
        # AFTER the arming pass, which is what supplies tonight's verdict set. VINTAGE
        # IS ENFORCED, not assumed: `confirmed` is written only from a verdict whose
        # basis IS the row's own session — tonight's pack when its as_of matches, else
        # the gate re-run on the close series truncated through that session — and once
        # written it is never revised by a later night.
        #
        # SOLE WRITER of data/prophet_live/forward.parquet (G0.2 / RUL-P10). The
        # */5 lane writes R2 only; this step lists the day's event objects, joins
        # confirmed? + same-day close + the next-session close fill (mirroring
        # engine.grading.fill_index, the grade_us_board convention), and union-merges
        # on (date, ticker, kind) so a rebake or a double run is idempotent and can
        # only ever ADD information. The parquet rides the "commit engine outputs"
        # git add below (data/ is already covered — no extra add needed).
        #
        # MEASURE-DARK: nothing reads this ledger. It exists so the §6 promotion
        # gauntlet has an evidence base to be pre-registered on. Seconds; non-fatal,
        # with a step cap for the same reason as the pack step above (a replay over a
        # long open-row backlog is the one path that could stretch).
        timeout-minutes: 3
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          STOCK_LIB_WORKERS: "4"
        run: |
          set +e
          echo "::group::reconcile_prophet_live (accrue today's provisional crosses)"
          python -m scripts.reconcile_prophet_live --nightly \
            --pack "$RUNNER_TEMP/prophet_live_armed.json" > "$RUNNER_TEMP/prophet_live_reconcile.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/prophet_live_reconcile.log"
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then echo "::warning title=reconcile_prophet_live::rc=$rc (non-fatal — the R2 spool is durable, tomorrow picks the day back up)"; fi
          exit 0
      - name: regional + desk builders (parallelised — independent clusters, barrier before the hub)
        # The ~22 builders between build_site and the landing hub split into mutually
        # INDEPENDENT clusters (each internally ordered by its own data deps). They used
        # to run strictly serially (~75 min of wall-clock); here each cluster runs in the
        # background and we barrier (`wait`) before build_vector, which reads every
        # cluster's latest.json. That collapses the band to ~its longest single cluster
        # (special-situations' EDGAR sweep, ~28 min) instead of the serial sum. Every
        # builder stays individually resilient via brun(): a non-zero exit is annotated
        # (::error::) and appended to the run summary with its traceback, but NEVER aborts
        # the job — so the site still deploys and one broken builder can't 404 the
        # dashboard. Each builder owns its OWN scratch files ($ART/<slug>.{log,rc,sec}) so
        # the parallel subshells never write the same file; output is replayed GROUPED + in
        # a stable order AFTER the barrier (never interleaved) and per-builder wall-times go
        # to the step summary. Builders read build_site's output (spine, above) + the
        # collect job's data; the only cross-builder reads are kept INSIDE one cluster
        # (crossasset/transmission after commodity/forex/bonds;
        # policy_watch after policy_intent). special_situations stays IN this job (not a
        # sibling job like factor_series) because it writes a PAGE + hub card that must be
        # in THIS run's deploy artifact — it is event-driven, so a one-run lag is wrong.
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          CLAUDE_CODE_OAUTH_TOKEN_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
          METAB_KEYS_ENABLED: ${{ vars.METAB_KEYS_ENABLED }}
          MASSIVE_S3_ENDPOINT: ${{ secrets.MASSIVE_S3_ENDPOINT }}
          MASSIVE_S3_ACCESS_KEY_ID: ${{ secrets.MASSIVE_S3_ACCESS_KEY_ID }}
          MASSIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.MASSIVE_S3_SECRET_ACCESS_KEY }}
          MASSIVE_S3_BUCKET: ${{ secrets.MASSIVE_S3_BUCKET }}
          # SGA (Stage Analysis): earnings-call scores arrive via R2 from the standalone
          # Qwen worker (SGA-R6, producer-only — research/STAGE_ANALYSIS_MASTERPLAN.md).
          # fetch_earnings_scores inside cl_stage no-ops gracefully when these are absent.
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          COLLECT_LANE: nightly  # lane sentinel: basket_turn_watch.stamp_ledger + other engine
                                 # nightly-only ledger writers check COLLECT_LANE==nightly before
                                 # writing; render/earlyclose/asia-close lanes leave it unset → no-op.
          # FTR W10: build_baskets.py calls notify_turn_events at the end of main().
          # Without these env vars the hook hits dark mode (no webhook → exit 0).
          DISCORD_WEBHOOK_WATCHLIST: ${{ secrets.DISCORD_WEBHOOK_WATCHLIST }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set +e
          ART="$RUNNER_TEMP/band"; rm -rf "$ART"; mkdir -p "$ART"
          # brun <slug> <label> <module> [args…] — run one builder resiliently into its
          # OWN scratch files (never shared across the parallel subshells), recording the
          # exit code + wall-seconds. Output (incl. stderr) is buffered, replayed later.
          brun() {
            local slug="$1" label="$2" mod="$3"; shift 3
            local t0 t1 rc
            t0=$(date +%s)
            { echo "$label"; python -m "$mod" "$@" 2>&1; } > "$ART/$slug.log"; rc=$?
            t1=$(date +%s)
            echo "$rc"          > "$ART/$slug.rc"
            echo "$((t1 - t0))" > "$ART/$slug.sec"
          }
          # --- clusters: each internally ORDERED by its data deps; clusters mutually independent ---
          cl_markets() {
            brun commodities  "build commodity vector (build_commodities)"         scripts.build_commodities
            brun spr          "build strategic reserves (build_spr)"               scripts.build_spr
            brun forex        "build forex vector (build_forex)"                   scripts.build_forex
            brun bonds        "build bonds & bond-health (build_bonds)"            scripts.build_bonds
            brun crossasset   "cross-asset vector (build_crossasset)"              scripts.build_crossasset
            brun transmission "rate & inflation transmission (build_transmission)" scripts.build_transmission
            # TXI W1: staged-cascade chain episode tracker. Runs AFTER build_transmission
            # (reads data/transmission/latest.json + forex/regime latest.json + the parquet
            # store). Display-only; nightly is the sole advancer of chain_episodes.jsonl.
            # Cheap (<10s wall). No-ops gracefully when upstream artifacts are absent.
            brun transmission_chains "TXI W1 — transmission chain episodes (run_transmission_chains)" scripts.run_transmission_chains
            brun discovery    "discovery leaderboard (build_discovery)"            scripts.build_discovery
          }
          # cl_china / cl_hk MOVED to .github/workflows/asia-close.yml — rebuilt after the
          # Asia cash close (~08:30 UTC) so CN/HK render SETTLED marks, not the stale ones a
          # US-evening run would lock in. They are self-recomputing (no US-regime dependency).
          cl_gex() {
            brun gex_board    "GEX magnets board (build_gex_board)"        scripts.build_gex_board
            brun vol_regime   "index vol-regime (build_vol_regime)"        scripts.build_vol_regime
            # build_market_structure MOVED OUT of this band to just BEFORE build_site
            # (OEU M-FIX). It ran here, i.e. AFTER build_site had already rendered
            # market_structure.html from build_site.py's MSP block — so the page
            # always shipped the PREVIOUS run's data/market_structure/latest.json.
            # Its only inputs (data/cboe/gex_SPX.parquet, data/yahoo/_GSPC.parquet)
            # come from the collect job, so nothing in this band feeds it.
            # W4 EVW: event-window snapshot + forward-log stamp (RIC program, P3).
            # Runs AFTER vol_regime so site/vol/regime.json (gamma_regime proxy) is present.
            # No ThetaData reads; cheap committed-artifact join (~15s wall).
            brun event_windows "W4 EVW — event-window calendar (build_event_windows)" scripts.build_event_windows
            brun darkpool     "dark pool desk (build_darkpool_desk)"        scripts.build_darkpool_desk
            brun options_flow "options flow desk (build_options_flow)"     scripts.build_options_flow
            brun flow_desk    "group flow heatmap & market tide (build_flow_desk)" scripts.build_flow_desk
            brun options_skew "single-name IV skew (build_options_skew)"   scripts.build_options_skew
            brun options_ivspread "single-name IV spread (build_options_ivspread)" scripts.build_options_ivspread
            brun options_screener "US options screener page (build_options_screener)" scripts.build_options_screener
            brun options_entry "options entry state fusion table (build_options_entry_state)" scripts.build_options_entry_state
            brun intraday_flow "intraday flow tracker nightly base (build_intraday_flow)" scripts.build_intraday_flow --mode nightly
          }
          cl_baskets() {
            brun baskets     "thematic baskets (build_baskets)"        scripts.build_baskets
            brun subsector_conf "subsector confluence desk + double-gated funnel (build_subsector_confluence)" scripts.build_subsector_confluence
            brun subsector_conf_ndx "nasdaq-100 subsector confluence desk (build_subsector_confluence --nasdaq)" scripts.build_subsector_confluence --nasdaq
            brun subsector_conf_rut "russell-2000 subsector confluence desk (build_subsector_confluence --russell)" scripts.build_subsector_confluence --russell
            # W0.4 Setup-Species: cohort-context metrics (display-only; reads committed subsector_confluence.json)
            brun cohort_metrics "W0.4 cohort metrics — peer washout/reclaim/MACD-turn + Rubber-Band Score (build_cohort_metrics)" scripts.build_cohort_metrics
            # Rotation Command W1 (RC-R1/R6): first-class rotation events + sector-fragmentation board (display-only)
            brun rotation_events "Rotation Command W1 — rotation events + sector fragmentation (build_rotation_events)" scripts.build_rotation_events
            # RLT-R2 Rebalance Pulse: mechanical volume day-classifier (display/context, off render path)
            brun rebalance_pulse "RLT-R2 rebalance pulse — calendar × volume classifier (build_rebalance_pulse)" scripts.build_rebalance_pulse
            # build_news + news_calib moved BEFORE build_site (NWS-01 fix — see above)
            brun methodology "methodology page (build_methodology)"    scripts.build_methodology
            brun nasdaq_internals "nasdaq-100 archetype-group internals (build_nasdaq_internals)" scripts.build_nasdaq_internals
          }
          cl_special() { brun special "special situations desk (build_special_situations)" scripts.build_special_situations; }
          cl_stage() {
            # SGA W1 (research/STAGE_ANALYSIS_MASTERPLAN.md): Weinstein stage engine over
            # the ~2.8k-name baskets/ohlcv ∪ SP1500 universe (~10 min at 4 cores), hidden
            # under the special-sits cluster's ~28-min ceiling — zero critical-path cost.
            # Reads TONIGHT's signal_gate.json (build_site above) for the T-tier chip and
            # joins earnings-call scores fetched from R2 (fail-open: absent scores just
            # print the plain-word null). Page renders from the fresh context artifact.
            python -m scripts.fetch_earnings_scores || echo "::warning title=fetch_earnings_scores::rc≠0 (non-fatal — earnings context absent this render)"
            brun stage_analysis "Stage Analysis context engine (build_stage_analysis)" scripts.build_stage_analysis
            brun stage_analysis_page "Stage Analysis page (build_stage_analysis_page)" scripts.build_stage_analysis_page
          }
          cl_misc() {
            brun seasonality   "factor seasonality (build_seasonality)"      scripts.build_seasonality
            brun stock_seasonality_page "stock seasonality page (build_stock_seasonality_page)" scripts.build_stock_seasonality_page
            brun reports       "research reports section (build_reports)"     scripts.build_reports
            brun research_vault "research vault page (build_research_vault)"   scripts.build_research_vault
            brun cycle         "cycle intelligence page (build_cycle)"        scripts.build_cycle
            brun sectorcyc     "sector cycle intelligence (build_sector_cycles)" scripts.build_sector_cycles
            brun countrycyc    "country cycle intelligence (build_country_cycles)" scripts.build_country_cycles
            # markets_engine.js is a pure splice of country_cycles.json, so it must re-run
            # whenever countrycyc does — otherwise markets.html freezes on the previous
            # vintage and the cycle-consistency PR gate fails on same-tape pos/phase skew
            # (render.yml already pairs them; cl_misc is sequential so ordering holds).
            brun markets       "global market cycles shell (build_markets)"    scripts.build_markets
            brun measurement   "cycle measurement hub (build_measurement)"    scripts.build_measurement
            brun sync_gauge    "sync gauge appender (append_sync_gauge)"      scripts.append_sync_gauge
            brun policy_intent "policy intent desk (policy_intent_desk)"      engine.policy_intent_desk
            brun policy_watch  "fed & policy watch (build_policy_watch)"      scripts.build_policy_watch
            brun index_changes "S&P index changes (build_index_changes)"     scripts.build_index_changes
            # CPI P2: live-view rebuild runs LAST in cl_misc so today's forward-log stamps
            # from build_sector_cycles and build_country_cycles (both above) are present.
            # Placement inside cl_misc (not post-band) is intentional: the dependency is
            # only on these two intra-cluster steps; the band barrier would be correct but
            # wastes the ~28-min special-situations wait. cl_misc is fully sequential so
            # the ordering guarantee holds without any additional wait.
            brun cycle_pattern_live "CPI live-view adapter (build_cycle_pattern_live)" scripts.build_cycle_pattern_live
            # CPI P6: the NW adapter artifact compacts the live view + hazard gate
            # ledger + truth registry, so it runs AFTER cycle_pattern_live (sequential
            # within cl_misc — same ordering guarantee as the live-view step above).
            brun cycle_pattern_state "CPI NW adapter (build_cycle_pattern_state)" scripts.build_cycle_pattern_state
            # Stock seasonality calendar clock (research/STOCK_SEASONALITY_LANE2_DESIGN_SPEC.md).
            # DAILY-ONLY and LAST in cl_misc: the 2645-window family and its independent
            # circular year-shift null (B=2000, raw + market-neutral) are the heavy leg, and
            # the render budget is law. The null is cached against the complete-year panel
            # hash, so a normal night is a panel re-fold plus a JSON rewrite (~1 min) and the
            # full recompute lands once a year when the panels roll over. Per-symbol entity
            # JSON is gitignored and rides the R2 publish below; index/methodology are the
            # committed half.
            brun stock_seasonality "stock seasonality calendar clock (build_stock_seasonality)" scripts.build_stock_seasonality
            brun biopharma_seasonality "seasonality methodology manifest (build_biopharma_seasonality)" scripts.build_biopharma_seasonality
          }
          # launch every cluster concurrently, then barrier before the hub (build_vector, below)
          cl_markets & cl_gex & cl_baskets & cl_special & cl_misc & cl_stage &
          wait
          # --- replay each builder's output GROUPED + in a stable order (post-barrier, so
          #     nothing interleaves), surface failures as annotations, summarise wall-times ---
          # transmission_chains added 2026-07-25: it was brun'd at :1133 but absent
          # here, and this loop is what prints a builder's log + raises its rc!=0
          # ::error. Milder here than in the render lanes (this lane also runs
          # check_builder_failstreaks, which globs *.rc and so catches a >=2-night
          # streak regardless of ORDER) — but a FIRST failure still passed silently,
          # with no log and no step-summary line for the TXI W1 chain tracker.
          ORDER="commodities spr forex bonds crossasset transmission transmission_chains discovery gex_board vol_regime market_structure event_windows darkpool options_flow flow_desk options_skew options_ivspread options_screener options_entry intraday_flow baskets subsector_conf subsector_conf_ndx subsector_conf_rut cohort_metrics rotation_events rebalance_pulse methodology nasdaq_internals seasonality reports research_vault cycle sectorcyc countrycyc markets measurement sync_gauge policy_intent policy_watch special index_changes cycle_pattern_live cycle_pattern_state stock_seasonality stock_seasonality_page biopharma_seasonality stage_analysis stage_analysis_page"
          echo "### ⏱ parallel band — per-builder wall-time" >> "$GITHUB_STEP_SUMMARY"
          for slug in $ORDER; do
            [ -f "$ART/$slug.log" ] || continue
            label=$(head -n1 "$ART/$slug.log")
            rc=$(cat "$ART/$slug.rc" 2>/dev/null || echo "?")
            sec=$(cat "$ART/$slug.sec" 2>/dev/null || echo "?")
            echo "::group::$label  [${sec}s, rc=$rc]"
            tail -n +2 "$ART/$slug.log"
            echo "::endgroup::"
            echo "- ${label} — ${sec}s (rc=${rc})" >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" != "0" ] && [ "$rc" != "?" ]; then
              echo "::error title=${label} failed (rc=${rc})::$(tail -n 2 "$ART/$slug.log" | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ ${label} failed (rc=${rc})"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 40 "$ART/$slug.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 0
      - name: builder fail-streak escalation (consecutive-night freeze detector)
        # brun() (above) BY DESIGN never aborts on a broken builder — but that makes a
        # builder failing MANY CONSECUTIVE nightlies look identical to a one-off at a
        # glance (2026-07-16/17: build_cycle aborted two nights running, cycle.html
        # silently froze at the 07-13 render while the run stayed green — PR #2732 fixed
        # the builder; this step fixes the visibility gap). Reads the band's per-builder
        # scratch rc files ($RUNNER_TEMP/band/<slug>.rc), advances a per-builder streak
        # ledger (data/ci/builder_failstreaks.json — covered by 'git add data/' in
        # 'commit engine outputs' below), and at streak >=2 escalates loudly: a distinct
        # ::error:: per frozen page + step-summary section + one W6b ops alert
        # (engine/alert_triage.push_ops_alert, dispatch-always — same spine as the
        # nw_health streak escalation, PR #2621 precedent). --lane nightly gates the
        # ledger WRITE (nightly = sole advancer of THIS ledger); asia-close.yml runs the
        # ported step as its own write lane on its own ledger (--lane asia ->
        # data/ci/builder_failstreaks_asia.json — it is the sole nightly for the CN/HK
        # pages); any other port (closing-bell) stays report-only — the script binds
        # each write lane to exactly one ledger path. rc==0 resets a streak; a >4-day
        # gap (nightly itself dead) starts a fresh streak. Resilient: always exits 0 —
        # never blocks the deploy, never changes brun()'s never-abort semantics.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scripts.check_builder_failstreaks --art-dir "$RUNNER_TEMP/band" --lane nightly || echo "::warning::builder fail-streak check failed (non-fatal)"
      - name: OEU M-CMD — the Options workspace (build_options_command)
        # OEU M-CMD: options.html, the canonical options surface (4 modes). It is a
        # pure re-serialisation of stores four OTHER builders write, and those deps
        # straddle both phases — build_market_structure and build_flow_leaders are
        # serial-spine steps above, while build_flow_desk and build_options_screener
        # live inside cl_gex in the parallel band. Cross-phase deps ⇒ this MUST be a
        # serial step AFTER the band `wait` barrier (same reasoning as
        # build_sector_central below). O(seconds): JSON reads only, no engine work.
        # Additive — the builder catches its own render failures and exits 0, so the
        # last committed options.html stands and the deploy is never broken.
        run: python -m scripts.build_options_command || echo "::warning::build_options_command non-fatal failure"
      - name: OIP E1 — session digest, the Terminal→EOD bridge (build_session_digest)
        # OIP E1: digests the intraday options plane's R2 archives
        # (live_flow/surface/{ROOT}/{DATE}/ per-minute stamps + the dated tide/dte archives)
        # into one settled per-root session record — data only, ZERO UI.
        # Writes data/options_session/{DATE}/{ROOT}.json + site/session/{ROOT}.json +
        # data/options_session/ledger.parquet (one row per date×root). All three ride the
        # existing `git add data/ site/` in "commit engine outputs" below — no new commit path.
        # MUST be a serial step AFTER the band `wait` barrier: it reads
        # site/options_structure/gex_state/{ROOT}.json for the EOD flip/wall levels, and
        # build_gex_board writes those inside the cl_gex cluster of the parallel band — the
        # same cross-phase reasoning that puts build_options_command immediately above.
        # Ledger + all data/ writes are lane-gated on COLLECT_LANE=nightly (job-level env);
        # dedup on (date, root) keeps FIRST, so a replay adds sessions and never rewrites one,
        # and a dated record is only replaced by a read covering MORE minutes.
        #
        # COST, measured at the CONFIGURED 120s cadence (196 stamps x ~600 strikes x 3 roots):
        #   602 reads, 4.06 MB, 1.13-1.20s wall clock on a local replay (3 runs).
        # Each per-stamp file is the session TRUNCATED to that stamp, so fetching them all is
        # quadratic in bytes — 124.8 MB per root, 374 MB a night. The day is therefore read from
        # the NEWEST frame alone (it already carries the full session), and only the per-stamp
        # `spot` needs a request each, taken as a ~256-byte Range read of the frame head. That
        # is the 92x difference between 4.06 MB and 374 MB. R2 round-trips put the nightly
        # estimate at ~15-40s, inside the ~1-2 min budgeted for this join (OIP §7).
        #
        # TAIL RISK IS BOUNDED BOTH WAYS: the engine job was CANCELLED at its 200-minute cap in
        # 5 of 8 recent nightlies, so this step may not run long. `timeout-minutes: 8` is the
        # hard stop; the builder's own BUDGET_SECONDS=180 wall-clock budget fires first and
        # writes honest partial records (the shortfall printed in each record's coverage block)
        # plus a ::warning, which a killed step could not do.
        # Non-fatal: absent archives/creds degrade to printed nulls and the builder exits 0.
        timeout-minutes: 8
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.build_session_digest || echo "::warning::build_session_digest non-fatal failure"
      - name: XSR W1 — US fast-sector rotation lens (build_us_sector_rotation)
        # XSR W1 (XSR-R2): display-tier fast rotation score for the 11 SPDR sector ETFs and
        # named US thematic baskets. Ported from China #2634. Reads sector_cycles
