      - name: Portfolio-Aware context artifact (build_portfolio_ctx)
        # Portfolio-Aware Intelligence W1 (charter:
        # research/PORTFOLIO_BRIEF_MASTERPLAN_BY_FABLE.md §2). Bakes the full-universe
        # per-ticker context blob site/data/portfolio_ctx.json that the mastermind-terminal
        # Portfolio page joins against per-user off the render path. RE-EXPRESSES existing
        # nightly reads (no new signal); reads committed source artifacts ONLY (never advances
