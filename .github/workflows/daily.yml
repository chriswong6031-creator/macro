          cat "$RUNNER_TEMP/prophet_stage_shadow.log"
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then echo "::warning title=build_prophet_stage_shadow::rc=$rc (non-fatal)"; fi
