      - name: publish Filing Forensics private state
        # Publish only after the full workbench build returned. The publisher validates
        # gzip/schema, writes the existing PRIVATE Research Vault bucket, reads it back,
        # and byte-verifies it. Failure is loud but retains the last-good private object;
        # no premium state is ever staged by the broad site/data commit below.
