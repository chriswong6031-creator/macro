name: daily
on:
  schedule:
    # Build B — the sole authoritative / ledger-advancing build (two-build design 2026-07).
    # 22:30 UTC = 18:30 EDT: ~30 min after the ~6pm-ET FINRA CNMSshvol post (the file's
    # window spans ~5-7pm ET; a 6:00pm-ET trigger races it — safe-earliest is ~18:15 ET).
    # Was "0 2 * * *" (10pm ET nominal, ~1-3am actual with dispatch lag) — moved 3.5h
    # earlier so authoritative data + ledger advance land the same evening. The 16:05-ET
    # closing-bell.yml lane (Build A) ships a full provisional site ~17:55 ET beforehand.
    # ⚠ DST (November flip): this becomes 17:30 EST which RACES the FINRA file — change
    # to "30 23 * * *" (18:30 EST) at the flip. Single-cron on purpose: a year-round DST
    # pair would fire a second full multi-hour nightly every day (too expensive to no-op,
    # unlike closing-bell's cheap gated skip). 7-day cadence retained (weekend runs do
    # accrual/self-heals, unchanged behavior from the old 02:00 slot).
    # China/HK remain split to asia-close.yml (08:30 UTC).
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Daily runs in its OWN lane so a long-running backfill / weekly job can never
  # queue-cancel or starve the daily data refresh (the bug: a 2-3h special-sits
  # backfill held the shared "pipeline" lane and the data on the site froze for
  # hours while feature deploys kept happening). Every push step in this workflow
  # uses a rebase-retry loop, so running concurrently with a batch job is race-safe.
  # cancel-in-progress stays false: a queued daily still runs (two simultaneous
  # dailies would simply dedup to the latest).
  group: pipeline-daily
  cancel-in-progress: false

jobs:
  # collect (a.k.a. collect-core since the 2026-07-14 split): the main adapter
  # sweep + in-collect graders/audits, committing as early as possible so the
  # engine job (needs: collect) starts ~30-75m sooner. The slow post-adapter
  # accrual band — ThetaData tape-flow, TIL organs, shadow-importance, qledger
  # backfill — runs in the sibling collect_tail job below. Engine never read
  # those outputs same-night (≤1-run-stale contract, same as factor_series;
  # verified 2026-07-14: flow_leaders/flow_desk/options_screener are absent-safe
  # display legs, stamp_options_state is PIT-anchored, grade_qledger grades only
  # claims matured ≥5d, TIL lobes carry 2160h freshness SLAs).
  collect:
    runs-on: [self-hosted, macstudio]
    # was 100 — the collectors step's real baseline has grown to ~60-67m (the old "~35m"
    # budget), and on 2026-07-11 it spiked to 98.5m (EDGAR 8-K velocity ~18m, OpenFIGI
    # ~10m, shadow-importance ~14m on a Friday close). The job was CANCELLED at exactly
    # 100m while still ahead of "commit data", so the whole night's collections were
    # thrown away and engine built the dashboards from the previous day's committed
    # store (us_standouts stuck on 07-09). Same silent-timeout class as the asia-close
    # freeze (#2193) and the engine job's own 70→120 bump below. 150m = spike ×1.5.
    # 2026-07-14 split: the 98.5m spike basis included shadow-importance (~14m), which
    # moved to collect_tail — 150m is now ≥1.7× the residual spike and is deliberately
    # kept: an undersized cap costs a whole night's collections (bitten twice).
    # 2026-07-17: bitten a THIRD time — the first 18:30-ET (22:30 UTC) Build B run's
    # collect ran 150.4m and was cancelled AT the final "commit data" step, seconds from
    # landing ~148m of freshly-pulled collections (run 29542087837; downstream engine/
    # publish all green but the day's collector data never committed). Runtime grew
    # ~115m→~148m after the schedule moved 02:00 UTC → 22:30 UTC — suspected early-
    # evening source retry loops (under forensics). 185m buys survival at the observed
    # pace + commit headroom while the growth is root-caused.
    timeout-minutes: 185
    outputs:
      government_revenue_projection_needed: ${{ steps.pushdata.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: restore breadth close cache
        uses: actions/cache@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) breadth close cache
        uses: actions/cache@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) breadth close cache
        uses: actions/cache@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: restore Russell 2000 breadth close cache
        uses: actions/cache@v4
        with:
          path: data/russell_breadth/_closes_cache.parquet
          key: russell-closes-${{ github.run_id }}
          restore-keys: russell-closes-
      - name: restore china breadth close cache
        uses: actions/cache@v4
        with:
          path: data/china_breadth/_closes_cache.parquet
          key: china-breadth-closes-${{ github.run_id }}
          restore-keys: china-breadth-closes-
      - name: restore hk breadth close cache
        uses: actions/cache@v4
        with:
          path: data/hk_breadth/_closes_cache.parquet
          key: hk-breadth-closes-${{ github.run_id }}
          restore-keys: hk-breadth-closes-
      - name: restore china per-name OHLC store (signal-engine deep store; nightly backfill grows it)
        # Per-name daily OHLC (collectors/china_stock_prices.py → data/china_stocks/<T>.parquet).
        # data/china_stocks is git-TRACKED and written by asia-close (sole owner). daily.yml's
        # collect job excludes the asia group (--exclude-group asia) so it never advances this
        # store. Removing restore-keys prevents daily from overlaying a stale GHA cache on top
        # of the fresh data asia-close committed — that overlay + `-X theirs` on the rebase-push
        # was the root cause of the 5-day lag regression (CN-SYS W5a fix).
        uses: actions/cache@v4
        with:
          path: data/china_stocks
          key: china-stocks-ohlc-${{ github.run_id }}
      - name: restore hk per-name OHLC store (signal-engine deep store; nightly backfill grows it)
        uses: actions/cache@v4
        with:
          path: data/hk_stocks
          key: hk-stocks-ohlc-${{ github.run_id }}
          restore-keys: hk-stocks-ohlc-
      - name: restore intraday (4H) cache
        # Polygon hourly bars: regenerable + daily-changing, so cached cross-job (like the
        # breadth caches) instead of committed, to keep the repo from bloating. The collect
        # job populates it; the engine job restores it to emit site/intraday.
        uses: actions/cache@v4
        with:
          path: data/intraday
          key: intraday-${{ github.run_id }}
          restore-keys: intraday-
      - name: restore data-quality revision baselines
        # The end-of-collect audit (scripts/audit_macro) needs the PRIOR run's macro values to
        # detect backwards-revisions. The baselines are a daily-changing full copy of the macro
        # series — pure machine state — so they are cached cross-run (like the breadth caches),
        # not committed, to keep the repo from bloating. Absent on the first run => the audit just
        # seeds them (no detection that day) and revision-checking is active from the next run.
        uses: actions/cache@v4
        with:
          path: data/quality/baselines
          key: quality-baselines-${{ github.run_id }}
          restore-keys: quality-baselines-
      - name: restore attention store from R2 (deep history is git-ignored)
        # data/attention/*.parquet (SLF-048 Wikipedia pageviews, 2015-07→) moved to the
        # R2 data plane 2026-07-06 — a fresh checkout holds NONE of them. Restore FIRST
        # so the wiki_pageviews collector's ~120d fetch upserts ON TOP of deep history
        # (lib.store.upsert keeps disk-only rows) instead of rebuilding a shallow window.
        # continue-on-error: on restore failure the collector still produces a usable
        # ~120d store (the display chip needs ~95d) — but the publish-back step after
        # "commit data" is GATED on this step's outcome, so a shallow rebuild can never
        # clobber the deep store on R2 (publish_r2's bytes floor is the second fence).
        id: attention_restore
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.fetch_r2 --dirs attention
      - name: restore massive_stock_day store from R2 (whole-market daily store; incremental upserts on top)
        # data/massive_stock_day (~617 MB, ~20k per-ticker parquets) is R2-CANONICAL: a
        # checkout holds only the two committed JSON sidecars. Restore FIRST so
        # collectors/massive_stock_day.py run_incremental() upserts the new trading days
        # ON TOP of the full store instead of tripping its store-absent fence (that fence
        # exists because fetching into a throwaway tree would mark days processed in the
        # COMMITTED resume state and lose them permanently).
        # continue-on-error: the publish-back step after "commit data" is GATED on this
        # step's outcome, so a failed or partial restore can never clobber the deep store
        # on R2 — fetch_r2 exits 1 on any download failure, and publish_r2's
        # _DATA_DIR_MIN_FILES floor is the second fence. On failure the adapter blocks
        # loudly (::warning) and the night self-heals tomorrow.
        # Incident: the store froze 2026-07-04→07-29 (run_status no_creds ×21) with the
        # secrets never wired into this job at all — see the collector step below.
        id: massive_restore
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.fetch_r2 --dirs massive_stock_day --workers 24
      - name: run collectors (graceful degradation — never fails the build on one source)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINRA_API_CLIENT_ID: ${{ secrets.FINRA_API_CLIENT_ID }}      # CCW-W5: FINRA breadth/sentiment/capped-vol (collectors/finra_corp_bonds.py); absent -> skip-clean, non-fatal
          FINRA_API_CLIENT_SECRET: ${{ secrets.FINRA_API_CLIENT_SECRET }}  # CCW-W5: see FINRA_API_CLIENT_ID
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}   # massive.com options-OI accrual (GEX foundation)
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}   # accepted alias (same key, prior .env name)
          # Massive S3 flat-file entitlement — gates the whole-market daily store's
          # incremental (collectors/massive_stock_day.py). These four were only ever set
          # on the ENGINE job's builder step; their absence HERE is what froze the store
          # 2026-07-04→07-29: run_incremental() returned {"blocked": "no_creds"} every
          # night, the adapter raised, and graceful degradation swallowed it under a
          # green run (21 consecutive breaker increments in data/run_status.json).
          MASSIVE_S3_ENDPOINT: ${{ secrets.MASSIVE_S3_ENDPOINT }}
          MASSIVE_S3_ACCESS_KEY_ID: ${{ secrets.MASSIVE_S3_ACCESS_KEY_ID }}
          MASSIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.MASSIVE_S3_SECRET_ACCESS_KEY }}
          MASSIVE_S3_BUCKET: ${{ secrets.MASSIVE_S3_BUCKET }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}     # Quiver alt-data suite (collectors/quiver.py); absent -> 'blocked', non-fatal
          GRANTS_GOV_API_KEY: ${{ secrets.GRANTS_GOV_API_KEY }}  # Simpler Grants.gov pre-award FOA flow (collectors/grants_gov.py); free Login.gov key; absent -> 'blocked', non-fatal
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}           # openFDA higher rate limit (collectors/openfda.py); OPTIONAL — keyless works at 1k/day
          HF_TOKEN: ${{ secrets.HF_TOKEN }}                 # Hugging Face higher rate limit (collectors/huggingface.py); OPTIONAL — anon tier suffices
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}   # Finnhub analyst/insider-MSPR/earnings trio (collectors/finnhub_altdata.py); free tier; FINNHUB_KEY also accepted
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}           # SAM.gov pre-award solicitations (collectors/sam_gov.py); free key (entity reg); absent -> 'blocked', non-fatal
          GITHUB_TOKEN: ${{ github.token }}                 # GitHub star velocity (collectors/github_repos.py); the auto-injected workflow token reads public-repo metadata at 1000/hr — no new secret needed
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}       # gated CN moneyflow/chips/margin plane (collectors/tushare_*.py); silently no-ops absent — was frozen 2026-06-21→ (CHINA_ENGINE_REASSESSMENT)
          AMPLIFY_FIREBASE_KEY: ${{ secrets.AMPLIFY_FIREBASE_KEY }}  # Amplify public Firestore holdings feed (collectors/etf_holdings.py); absent -> amplify funds skip, non-fatal (was a source literal — CXI tripwire 2026-07-18)
          EASTMONEY_WEB_TOKEN: ${{ secrets.EASTMONEY_WEB_TOKEN }}    # Eastmoney legacy-datacenter web token (collectors/china_property.py cgb); asia-lane collector — here for manual/full runs
          EASTMONEY_UT_TOKEN: ${{ secrets.EASTMONEY_UT_TOKEN }}      # Eastmoney push2ex ut token (collectors/china_flows.py limit_breadth); asia-lane collector — here for manual/full runs
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}                    # content-addressed SEC filing evidence store
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Activation gate for the authenticated Company Facts head. This has no
          # fallback: provision the repository secret before merging this lane.
          CAPITAL_STRUCTURE_COMPANYFACTS_HEAD_HMAC_KEY: ${{ secrets.CAPITAL_STRUCTURE_COMPANYFACTS_HEAD_HMAC_KEY }}
          # Optional dedicated guard bucket; absent uses R2_CAPITAL_STRUCTURE_BUCKET,
          # then the existing shared R2_BUCKET with the same R2 credentials.
          COMPANYFACTS_HEAD_GUARD_BUCKET: ${{ secrets.COMPANYFACTS_HEAD_GUARD_BUCKET }}
          # Optional dedicated account/bucket. Each credential falls back to the
          # shared R2_* value in source_store.py, so same-account deployments need
          # only the dedicated bucket secret while isolated accounts can set all four.
          R2_CAPITAL_STRUCTURE_ENDPOINT: ${{ secrets.R2_CAPITAL_STRUCTURE_ENDPOINT }}
          R2_CAPITAL_STRUCTURE_ACCESS_KEY_ID: ${{ secrets.R2_CAPITAL_STRUCTURE_ACCESS_KEY_ID }}
          R2_CAPITAL_STRUCTURE_SECRET_ACCESS_KEY: ${{ secrets.R2_CAPITAL_STRUCTURE_SECRET_ACCESS_KEY }}
          R2_CAPITAL_STRUCTURE_BUCKET: ${{ secrets.R2_CAPITAL_STRUCTURE_BUCKET }}
          R2_RESEARCH_ENDPOINT: ${{ secrets.R2_RESEARCH_ENDPOINT }}
          R2_RESEARCH_ACCESS_KEY_ID: ${{ secrets.R2_RESEARCH_ACCESS_KEY_ID }}
          R2_RESEARCH_SECRET_ACCESS_KEY: ${{ secrets.R2_RESEARCH_SECRET_ACCESS_KEY }}
          R2_RESEARCH_BUCKET: ${{ secrets.R2_RESEARCH_BUCKET }}
          COLLECT_LANE: nightly  # lane sentinel: forward-ledger graders (grade_breadth_divergence,
                                 # grade_policy_calendar) check COLLECT_LANE==nightly before writing;
                                 # asia-close/weekly/intl_etf leave it unset → no-op in those lanes.
        run: |
          if [ -n "$FRED_API_KEY" ]; then echo "::notice::FRED_API_KEY present — using official API"; else echo "::warning::FRED_API_KEY ABSENT — check repo Settings > Secrets and variables > Actions > Repository secrets"; fi
          # --exclude-group asia: China/HK collectors run in their own asia-close shard
          # (after the Asia cash close), not here — keeps this US-evening run lean.
          # --skip-shadow-importance: the ~13-14m shadow passes run standalone in
          # collect_tail (2026-07-14 split) — off the engine job's critical path.
          # sec_capital_structure_companyfacts is serially registered immediately
          # after sec_capital_structure in scripts.collect's shared SEC host group.
          # It can therefore consume only same-run verified complete-submission
          # anchors, while retaining raw Company Facts JSON separately and without
          # invoking any share-count consumer. Immutable Parquet generations and
          # chained receipts are installed/read back before its tiny current pointer
          # advances; any failure leaves the prior authenticated generation selected.
          # sam_gov_opportunities is excluded because government-revenue-live.yml
          # is its sole serialized ledger owner. Two workflows must never merge and
          # overwrite the same revision/document Parquets concurrently.
          python -m scripts.collect --exclude-group asia --exclude sam_gov_opportunities --skip-shadow-importance
      - name: compile capital-structure event spine (offline, context-only)
        # AFTER collection so today's verified SEC manifests are visible, and BEFORE
        # the data commit so immutable event versions/edges ride the same checkpoint.
        # This compiler is network-free by contract and has no Prophet/rank authority.
        # Any source-bundle, ledger, or generation-receipt integrity failure blocks
        # the checkpoint; a partial capital-structure generation is never committed.
        run: python -m scripts.compile_capital_structure_events
      - name: compile capital-structure direct document terms (SEC-network-free, context-only)
        # The fee-table compiler reads only source-manifest-addressed complete
        # submissions through their exact R2 namespace. The collector's source-store
        # environment is step-local, so wire it again here rather than pretending a
        # manifest object key is independently resolvable. It transcribes direct SEC
        # cells only: no aggregate capacity, instrument, risk, probability, or Prophet
        # claim may originate in this step. A missing/mismatched source aborts instead
        # of committing a partial term ledger.
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_CAPITAL_STRUCTURE_ENDPOINT: ${{ secrets.R2_CAPITAL_STRUCTURE_ENDPOINT }}
          R2_CAPITAL_STRUCTURE_ACCESS_KEY_ID: ${{ secrets.R2_CAPITAL_STRUCTURE_ACCESS_KEY_ID }}
          R2_CAPITAL_STRUCTURE_SECRET_ACCESS_KEY: ${{ secrets.R2_CAPITAL_STRUCTURE_SECRET_ACCESS_KEY }}
          R2_CAPITAL_STRUCTURE_BUCKET: ${{ secrets.R2_CAPITAL_STRUCTURE_BUCKET }}
          R2_RESEARCH_ENDPOINT: ${{ secrets.R2_RESEARCH_ENDPOINT }}
          R2_RESEARCH_ACCESS_KEY_ID: ${{ secrets.R2_RESEARCH_ACCESS_KEY_ID }}
          R2_RESEARCH_SECRET_ACCESS_KEY: ${{ secrets.R2_RESEARCH_SECRET_ACCESS_KEY }}
          R2_RESEARCH_BUCKET: ${{ secrets.R2_RESEARCH_BUCKET }}
        run: python -m scripts.compile_capital_structure_document_terms
      - name: build capital-structure projection (offline, context-only)
        # Reads only the verified telemetry-last event generation. It publishes an
        # observed-filing-state artifact and byte-identical public twin; terms,
        # capacity, runway, scores, probabilities, and Prophet authority stay absent.
        run: python -m scripts.build_capital_structure_projection
      - name: refresh Finviz themes snapshot (subsector-rotation feed; non-fatal)
        # The only network leg for the themes map + Subsector Rotation. Refreshes
        # data/themes_heatmap/perf_snapshot.json (stamped with asof) so the rotation
        # read is fresh-daily and its forward track-record accrues a real daily
        # history. Keyless, can be rate-limited from CI IPs — strictly non-fatal:
        # on failure the build keeps the last committed snapshot.
        run: |
          python scripts/fetch_finviz_themes.py \
            || echo "::warning::Finviz themes fetch failed (non-fatal) — keeping committed snapshot"
      - name: collect ZORI national rent index (MRI shelter leg; non-fatal)
        # Fetches Zillow's public ZORI CSV (keyless) and writes data/zori/national.parquet.
        # data/zori/national.parquet is git-tracked (un-ignored by .gitignore negation);
        # metro-level parquet files under data/zori/ remain untracked (size).
        # collect_zori.py raises RuntimeError on HTTP failure — shell-level guard mandatory.
        run: |
          python scripts/collect_zori.py \
            || echo "::warning::ZORI collection failed (non-fatal) — shelter leg will use cached parquet"
      - name: audit massive_stock_day store (content tripwire — loud, never blocks the night)
        # This lane runs --exclude-group asia, and scripts/collect.py skips the WHOLE
        # run_quality_audits gate on any partial run (--only/--group/--exclude-group) —
        # so the store's content audit has never executed nightly. The 2026-07 freeze
        # ran 18 sessions with zero audit coverage behind that hole. Hence its own step.
        # The module bare-prints ::error/::warning annotations and exits 1 on a content
        # fail; continue-on-error keeps the night's commit safe while the annotations
        # plus the engine job's strict audit_r2 anchor carry the alarm. Writes
        # data/quality/massive_store_audit.json, picked up by "commit data" below.
        continue-on-error: true
        env:
          COLLECT_LANE: nightly   # load-bearing: the skip path only annotates on this lane
                                  # (elsewhere an absent store is normal). Without it the
                                  # "restore failed -> store did not advance" warning — the
                                  # single loudest signal here — would never be emitted.
        run: python -m scripts.audit_massive_store
      - name: commit data (local checkpoint — no network ops in this step)
        id: commitdata
        run: |
          echo "committed=false" >> "$GITHUB_OUTPUT"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # site/qledger: the qledger grader (scripts/collect.py -> grade_qledger)
          # writes the TRACKED site/qledger/track_record.json (un-ignored by #1139).
          # Left unstaged it blocks `git pull --rebase` ("unstaged changes") and the
          # whole data push silently dies after 5 attempts — 07-03/07-04 collections
          # were lost exactly this way (the sentinel staging-gap pattern). The
          # --autostash on the rebase below is the durable guard: it survives ANY
          # stray tracked write collect leaves outside data/+site/qledger/ (e.g.
          # reports/*.md graders), not just the qledger paths we happen to stage here.
          # (site/basketdata moved with the TIL steps to collect_tail's commit —
          # 2026-07-14 split; nothing left in this job writes site/basketdata.)
          git add data/ site/qledger/ site/capital-structure-data/
          # W0b (2026-07-08 stale-HK incident): US collect job must NOT commit asia-owned
          # data that it never produced. The GHA cache restore steps above may lay stale
          # data/hk_stocks (restore-keys: hk-stocks-ohlc-) and breadth caches on top of
          # the fresh files asia-close already committed.  After the broad `git add data/`
          # above, unstage every asia-close-owned path so -X theirs on the rebase-push
          # cannot clobber asia's fresh commit with this job's stale copy.
          # Derived from asia-close.yml: collect --group asia = adapters starting with
          # `china` or `hk` (scripts/collect.py group_members), so excludes cover all
          # data/china*, data/hk*, and data/hkma (adapter key `hkma` starts with `hk`).
          git reset -q -- data/hk data/hk_* data/hkma data/china data/china_* 2>/dev/null || true
          if git diff --cached --quiet; then echo "no data changes to commit"; exit 0; fi
          git commit -m "data: daily collection $(date -u +%F)"
          echo "committed=true" >> "$GITHUB_OUTPUT"
      # COMMIT/PUSH SPLIT (2026-07-17, run 29542087837 postmortem): the local commit above
      # is atomic and integrity-complete (fully-staged tree, asia paths reset out, empty-
      # guarded) — everything below is pure network publish. It lives in a SEPARATE
      # always()-guarded step so a job-timeout cancel during the push can never again
      # discard an already-committed night of collections (a hung git push ate 57m and
      # the 150m cap killed the step mid-publish; the commit existed only on the runner).
      # Every git network op is alarm-bounded (macOS runners have no GNU timeout;
      # perl alarm survives execve — SIGALRM kills a hung op, the loop retries).
      - name: push data (survives a job-cap cancel; alarm-bounded git ops)
        id: pushdata
        if: always() && steps.commitdata.outputs.committed == 'true'
        run: |
          echo "published=false" >> "$GITHUB_OUTPUT"
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          # best-effort push: losing a race with a concurrent push must NOT fail the
          # pipeline (the data is collected; the next run re-syncs). Retry rebase+push,
          # preferring our freshly-collected data on any conflict.
          PUSH_ALARM=420
          push_retry_init "collected data"
          while push_attempt; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            # (Asia paths unstaged above: when newly tracked on main, deleting the local stale
            # copy lets the rebase materialize asia-close's fresh commit — the W0b intent.)
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if perl -e 'alarm 420; exec @ARGV or die' -- git pull --rebase --autostash -X theirs origin main && push_autostash_ok; then
              if push_do; then
                echo "pushed data on attempt $PUSH_ATTEMPT"
                echo "published=true" >> "$GITHUB_OUTPUT"
                push_won
                exit 0
              fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning::could not push collected data after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal)"
      # Last-ditch publish if the job was CANCELLED mid-push (cap timeout): one bounded
      # attempt inside the post-cancel grace window. The commit already exists locally;
      # losing it costs the whole night's collections (2026-07-16 incident).
      - name: salvage push (job cancelled mid-publish — one bounded attempt)
        if: cancelled() && steps.commitdata.outputs.committed == 'true'
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          perl -e 'alarm 90; exec @ARGV or die' -- git fetch origin main || true
          { perl -e 'alarm 180; exec @ARGV or die' -- git pull --rebase --autostash -X theirs origin main && push_autostash_ok; } || true
          perl -e 'alarm 120; exec @ARGV or die' -- git push \
            && echo "salvage push landed the collections" \
            || echo "::warning::salvage push failed — tonight's collections stay uncommitted"
      - name: publish attention store back to R2 (gated on the restore)
        # The day's upserted increments ride back to R2 so tomorrow's restore (and the
        # engine job's render-side restore) reads a CURRENT deep store — a frozen R2
        # copy would slowly starve the chip's trailing-5d window. Gated on the restore
        # step's outcome: if the restore failed, the local tree is a shallow ~120d
        # rebuild whose file count matches the deep store, and publishing it would
        # clobber 11y of history. Gaps self-heal: the collector's ~120d fetch window
        # re-covers any missed days on the next successful cycle. Runs AFTER "commit
        # data" so the commit is never delayed by the upload. Non-fatal.
        if: steps.attention_restore.outcome == 'success'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.publish_r2 --dirs attention || echo "::warning::attention R2 publish failed (non-fatal — R2 store goes stale, chip self-heals within the 120d fetch window)"
      - name: publish massive_stock_day store back to R2 (gated on the restore)
        # The incremental's delta rides back to the canonical copy (content-hash skip, so
        # only tonight's new/changed parquets upload). The manifest object is put LAST and
        # unconditionally on a full publish — that Last-Modified is exactly what the
        # engine job's audit_r2 anchor keys on, so this step is what keeps that anchor
        # green. Gated on massive_restore for the same reason as attention above: a
        # shallow or partial local tree must never overwrite the deep store, and here the
        # collector's store-absent fence means such a tree would not even have advanced.
        # Runs after "commit data" so the upload never delays the commit. Non-fatal.
        if: steps.massive_restore.outcome == 'success'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.publish_r2 --dirs massive_stock_day || echo "::warning::massive_stock_day R2 publish failed (non-fatal — R2 copy goes stale; the engine job's strict audit_r2 anchor goes red within 26h)"

  government_revenue_projection:
    # A GITHUB_TOKEN push intentionally cannot recursively launch a push workflow.
    # Call the serialized owner synchronously instead, so the engine checkout and
    # its Neural Web/Prophet readers cannot race the prior procurement generation.
    needs: collect
    if: needs.collect.outputs.government_revenue_projection_needed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/government-revenue-live.yml
    with:
      projection_only: true

  # collect_tail: the slow post-adapter accrual band, split out of `collect`
  # (2026-07-14) so the engine job starts as soon as the adapter sweep commits
  # (~30-75m earlier; the 'run collectors' step was 89-91m of a 94m median job,
  # with tape-flow budgeted up to 75m more on backlog nights).
  # needs: collect → this job's checkout+pull reads TONIGHT's committed stores
  # (qbus for shadow-importance, github stars for the W9 join, altdata theses
  # for the qledger backfill). The engine job does NOT wait on this job: every
  # same-night reader of these outputs tolerates ≤1-run-stale data — the same
  # contract as the factor_series sibling (flow_leaders/flow_desk/
  # options_screener are absent-safe display legs, stamp_options_state is
  # PIT-anchored to historical fire dates, grade_qledger grades only claims
  # matured ≥5d, TIL lobes carry 2160h freshness SLAs).
  # if: always() — accrual is idempotent and must not stop because a collector
  # crashed core (tape-flow pulls from ThetaData, TIL organs from external APIs;
  # a failed core just means tonight's pass re-scores yesterday's stores).
  # Runner budget: PINNED to theta-m1 (mac-builder-1/2/3, the M1 host) since
  # 2026-07-26 — the ThetaData Terminal (:25503, launchd com.macro.theta-terminal)
  # and the 60GB thetadata_eod store are machine-local on the M1 after the
  # 2026-07-25 M2→M1 data-plane migration, while the wider `macstudio` label
  # spans TWO machines (M1 builders 1/2/3 + M2 builders 4/5). Un-pinned, this
  # job landed on an M2 runner ~2/5 nights and every tape_flow step self-skipped
  # (probe-only Terminal law, #3644 — CI must never launch a second Terminal;
  # the single-session license kicks the M1 session). Contention (2026-07-26
  # audit): the other heavy jobs stay 5-slot-eligible and 4 slots remain free
  # while this job holds one M1 slot; the only new exposure is THIS job
  # queueing when long jobs happen to occupy all 3 M1 slots — acceptable for a
  # state-resumable accrual job whose commit has a full night of runway. The
  # macstudio-light lane (own runner) is unaffected.
  # Forward-ledger law: untouched — the nightly graders stay inside
  # scripts.collect (collect core, COLLECT_LANE=nightly); this job only accrues
  # stores + registers idempotent claims, and its commit lands hours before the
  # next day's collect.
  collect_tail:
    needs: collect
    if: always()
    # theta-m1 ⊂ macstudio: custom runner label on mac-builder-1/2/3 only (added
    # via the runners API 2026-07-26). The probe-only health-check below stays
    # as defense in depth — if the label set or the Terminal host ever drifts,
    # tape_flow still degrades to a warning + self-skip, never a second Terminal.
    runs-on: [self-hosted, theta-m1]
    # Budget arithmetic: tape-flow budgets 25+30+20=75m (hard-stopped in-script)
    # + census ≤8m (--max-requests 450) + W11 options witness ~5m (real-path on
    # the store-bearing M1 — measured 4m35s on mac-builder-1, 2026-07-26; was a
    # 0.5s no-op when the job landed store-less) + other TIL organs ~seconds
    # + shadow-importance ~13-14m (the spike leg of the old collect job's 98.5m
    # night) + qledger backfill + setup ≈ ~115m worst case. 150m keeps the
    # silent-timeout class (#2193 / the 2026-07-11 collect cancel) away.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: ThetaData Terminal — health-check (probe-only, non-fatal)
        # The ThetaData Terminal v3 is a local Java daemon the tape_flow steps need.
        # Since the 2026-07-25 M2→M1 data-plane migration it is launchd-managed on the
        # M1 (com.macro.theta-terminal keepalive), and the ThetaData license allows ONE
        # upstream-connected Terminal per account — the `macstudio` runner label now
        # spans TWO machines, so this step must never launch its own Terminal: a second
        # instance on the other host kicks the M1 session off the account (server-side
        # MDDS/FPSS kick-out) and breaks the store writer lanes. Probe-only:
        #   - :25503 up (job landed on the Terminal host) → OK.
        #   - down (job landed on a non-Terminal macstudio host) → warning; tape_flow
        #     steps self-skip via their reachable() gate — non-fatal, and the
        #     round-robin cursor accrues the skipped roots on subsequent nights.
        run: |
          HEALTH_URL="http://127.0.0.1:25503/v3/option/list/symbols"
          if curl -sf --connect-timeout 3 "$HEALTH_URL" >/dev/null 2>&1; then
            echo "ThetaData Terminal already running — OK"
          else
            echo "::warning::ThetaData Terminal not reachable on this runner host — tape_flow steps will self-skip (Terminal is launchd-managed on the M1 since 2026-07-25; CI must never launch one)"
          fi
      - name: T2a tape-flow features — forward accrual (collect-tail lane, non-fatal)
        # Pulls prior-trading-day trade+NBBO tape for the full gex_symbols() universe
        # (~360 roots) via wildcard-bulk ThetaData endpoint (2 requests/root-day).
        # Aggregates inline to signed-flow features; discards raw tape for single names.
        # Requires ThetaData Terminal running on the self-hosted runner (port 25503).
        # Budget: 25 min default (hard-coded in script; overridable via --budget-minutes).
        #   At 6-concurrent: ~13 min (T2A_THROUGHPUT_PROBE.md §6a) — all 375 roots.
        #   At 2-concurrent (backfill alive): ~30 min → 25 min budget covers ~180 roots/night;
        #   round-robin cursor in state ensures remaining roots accrue on subsequent nights.
        # Non-fatal: terminal absent or any error logs a warning and does not fail the build.
        # run_status.json registration: sources["tape_flow_forward"] (P0.7 pattern).
        env:
          # 3s default connect timeout false-fails under concurrent bulk load
          # (measured 2026-07-11: 352/375 false 'not reachable' at 3s; 20s → 375/375).
          THETA_CONNECT_TIMEOUT: "20"
        run: |
          python -m scripts.build_tape_flow_daily --mode forward \
            || echo "::warning::T2a tape-flow forward accrual failed (non-fatal)"
      - name: T2a tape-flow features — episode-window backfill (non-fatal, budgeted)
        # Tier-S episode windows 2022→, ±15d, ETF anchors only (≈11 nodes post-2022).
        # Runs AFTER the forward step so the daily row always lands first.
        # Hard-stop at 30 min (budget_deadline): state is persisted after every
        # completed root-day; the next nightly run resumes from remaining work.
        # Budget: 30 min — sized so episodes(30) + etf-history(20) + forward(~13)
        # + shadow-importance (~13-14m) + census (≤8m) stay well under this job's
        # 150-min timeout, ensuring "commit tail data" is always reached before
        # GitHub Actions cancels the job.
        # Outputs (data/tape_flow/daily/*.parquet + data/tape_flow/_state.json)
        # are covered by the "commit tail data" step's `git add data/` below.
        # Non-fatal: terminal absent or any error logs a warning and continues.
        env:
          THETA_CONNECT_TIMEOUT: "20"   # see forward step note
        run: |
          python -m scripts.build_tape_flow_daily --mode episodes --budget-minutes 30 \
            || echo "::warning::T2a tape-flow episodes backfill failed (non-fatal)"
      - name: T2a tape-flow features — ETF history backfill (non-fatal, budgeted)
        # 20 ETF anchors, full history 2017→. R6 priority 3 — runs last, after forward
        # and episodes, so earlier steps are never delayed by the large backlog.
        # Hard-stop at 20 min (budget_deadline): state resumes each night until done.
        # Budget: 20 min — see episodes comment above for the joint ceiling rationale.
        # Outputs covered by `git add data/` in the commit step below (same as above).
        # Non-fatal: terminal absent or any error logs a warning and continues.
        env:
          THETA_CONNECT_TIMEOUT: "20"   # see forward step note
        run: |
          python -m scripts.build_tape_flow_daily --mode etf-history --budget-minutes 20 \
            || echo "::warning::T2a tape-flow ETF-history backfill failed (non-fatal)"
      # ── TIL collect-lane organs (W8/W9/W10/W11) ───────────────────────────
      # Moved here from the collect job (2026-07-14 split); placement and order
      # follow the declared dag.yml collect_tail lane. W7 (dol_certs) stays
      # unwired by design (accrual gate) — its divergence remains declared.
      # Measured 2026-07-12 (Mac Studio, warm venv): W9-W11 6.6s + 0.5s + 0.5s
      # + 1.4s ≈ 9s total; W8 keyless/invalid-key no-op 0.8s + 0.6s; W8 keyed
      # runs hard-capped (see step comment) — no material claim on the budget.
      - name: TIL W8 — Census HS-code import-flow ingest (non-fatal)
        # Requires the CENSUS_API_KEY repo secret (API is NOT keyless — verified
        # 2026-07-09; keyless/invalid key 302s and the run no-ops honest-null in
        # ~1s, exit 0). --max-requests 450 hard-bounds every run to ~7-8 min
        # (measured ~0.5s/request + 0.5s pacing) AND honors the documented
        # 500 req/day/key API limit; the ~2,900-request 2018-01 first backfill
        # self-chunks across ~7 nights via data/trade_flows/census_state.json
        # (state-resume covered in tests/test_census_trade.py::TestRequestCap).
        # Writes data/trade_flows/imports_monthly.parquet (git-stored via
        # `git add data/` below).
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          python -m collectors.census_trade --max-requests 450 \
            || echo "::warning::census_trade ingest failed (non-fatal)"
      - name: TIL W8 — theme trade-flow rollup (non-fatal)
        # Rolls the parquet above into per-theme YoY/accel/confirmation reads
        # (measured 0.6s on the honest-null path). Emits honest null with a
        # fresh as_of when the parquet is absent — keeps both W8 lobes' as_of
        # current on committee.html Web Health while data accrues. Writes
        # data/neuralweb/theme_trade_flows.json + site/basketdata/trade_flows.json
        # (staged via `git add data/ ... site/basketdata/` below).
        run: |
          python -m engine.theme_trade_flows \
            || echo "::warning::theme_trade_flows rollup failed (non-fatal)"
      - name: TIL W10 — ClinicalTrials.gov theme pipeline ingest (non-fatal)
        # Keyless CT.gov v2 full fetch (9 modalities, ~2.5k rows, measured 6.6s).
        # Writes data/clinical_trials/modality_monthly.parquet (git-stored via
        # `git add data/` below). Per-modality isolation; always exits 0.
        run: |
          python -m collectors.clinicaltrials_themes \
            || echo "::warning::clinicaltrials_themes ingest failed (non-fatal)"
      - name: TIL W10 — theme clinical rollup (non-fatal)
        # Pure in-memory aggregation of the parquet above (measured 0.5s).
        # Produces data/neuralweb/theme_clinical.json + site/basketdata/clinical_pipeline.json.
        run: |
          python -m engine.theme_clinical \
            || echo "::warning::theme_clinical rollup failed (non-fatal)"
      - name: TIL W11 — options-tape crowding witness (non-fatal)
        # Since the theta-m1 pin (2026-07-26) this job runs on the store-bearing
        # M1 host: the canonical resolver finds the thetadata_eod store via the
        # ops-wt path (engine/thetadata_store.py), so this step takes the REAL
        # compute path nightly — measured 4m35s on mac-builder-1 (2026-07-26),
        # budgeted in the job's arithmetic above. Two-writer coexistence with
        # the launchd lane (ops/launchd/com.macro.theme-options-witness.plist,
        # also on the M1 post-migration) is by design: both writers score the
        # SAME store, so last-writer-wins is content-stable; the keep-last-real
        # law (engine keep-last-real: a store-LESS run must not overwrite real
        # legs newer than 6d, and discloses a dead real lane past 6d via the
        # honest null) still guards any future store-less landing — e.g. if the
        # theta-m1 label set or the store path ever drifts.
        run: |
          python -m engine.theme_options_witness \
            || echo "::warning::theme_options_witness failed (non-fatal)"
      - name: TIL W9 — discovery-confluence join (non-fatal)
        # Two-source join (measured 1.4s): EDGAR phrase velocity over the
        # git-tracked data/edgar/{bottleneck,emergence}_hits.parquet (dripped by
        # the engine job) × GitHub star velocity over data/github/repo_stars.parquet
        # (collected by tonight's collect core and read here from its committed
        # push, so the leg still reads today's stars).
        # Produces site/basketdata/{phrase_velocity,github_adoption}.json +
        # data/neuralweb/discovery_confluence.json.
        run: |
          python -m scripts.build_discovery_confluence \
            || echo "::warning::discovery confluence join failed (non-fatal)"
      # ── importance_v0 SHADOW lanes (W3 + W4) ──────────────────────────────
      # Moved out of scripts.collect (2026-07-14 split; collect core passes
      # --skip-shadow-importance). Both passes score the FULL US+CN qbus store
      # from tonight's collect-core commit (~13-14m combined, the spike leg of
      # the old 98.5m collectors step). Claims register with stable idempotent
      # ids; grade_qledger (inside collect core's scripts.collect) grades only
      # claims matured ≥5d, so registering one job later never changes grading
      # arithmetic — the old "register BEFORE the grader" ordering was never
      # load-bearing same-night. Non-fatal either way.
      - name: importance_v0 shadow tape — W3 scorer (non-fatal)
        run: |
          python -m scripts.shadow_importance_v0 \
            || echo "::warning::shadow_importance_v0 failed (non-fatal)"
      - name: importance_v0 shadow tape — W4 PIT-correct scorer (non-fatal)
        run: |
          python -m scripts.shadow_importance_v0_pit \
            || echo "::warning::shadow_importance_v0_pit failed (non-fatal)"
      - name: qledger backfill (altdata + radar + policy → claims.jsonl)
        # ALTDATA_REBOOT W2 (2026-07-12): routes new altdata theses to per-channel
        # claim families with pre-registered horizon rulers; emits 2 placebo claims
        # per real altdata claim. Also registers new radar edge_snapshots and policy
        # theses as qledger claims. Idempotent — stable claim_ids prevent duplicates.
        # Reads data/altdata/theses.jsonl from tonight's collect-core commit; runs
        # BEFORE "commit tail data" so claims.jsonl is committed in the same push.
        # Non-fatal.
        run: |
          set +e
          python -m scripts.backfill_qledger_us \
            > "$RUNNER_TEMP/backfill_qledger_us.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/backfill_qledger_us.log"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=backfill_qledger_us::rc=$rc (non-fatal)"
          fi
          exit 0
      - name: CCW W2 — corporate credit g-spread engine (non-fatal)
        # Reads tonight's holdings from collect-core's commit (data/corp_bonds/holdings/*)
        # plus data/fred/DGS*.parquet (CMT curve pillars) and
        # data/corp_bonds/issuer_themes.json (issuer registry from W1).
        # Writes data/corp_bonds/series/*.parquet (6 files: issuer_daily, theme_daily,
        # sector_daily, market_daily, maturity_wall, bond_panel_latest) plus
        # data/corp_bonds/latest.json and data/corp_bonds/validation.json.
        # All outputs are covered by `git add data/` in the "commit tail data" step below.
        # Wall time measured locally 2026-07-14: 3.8s ([timing] corp_credit.snapshot,
        # single holdings date, ~10.2k bonds, incl. the convention re-solve pass).
        # Full-history recompute scales ~linearly in dates; revisit if it nears ~2m.
        # Non-fatal: a missing holdings store or solver failure logs a warning only.
        run: |
          python -m engine.corp_credit \
            || echo "::warning::corp_credit engine failed (non-fatal)"
      - name: CCW W3 — credit momentum organ (non-fatal)
        # Runs AFTER corp_credit so theme/market series are fresh.
        # Reads: archive-merged FRED spreads (hy_oas/ig_oas 1996→, ladder ~3y),
        #   Moody's DBAA/DAAA, FINRA breadth/sentiment (W5), yahoo ETF prices,
        #   corp_credit series output, holdings snapshots (own-store breadth).
        # Writes: data/corp_bonds/credit_momentum.json + forward_log.jsonl.
        # Spread velocity-percentile PRIMARY; oscillator crosses SECONDARY (CCW-R15).
        # Display-tier; authority all-false. Non-fatal (CCW-R16).
        run: |
          python -m engine.credit_momentum \
            || echo "::warning::credit_momentum engine failed (non-fatal)"
      - name: MLC-W5 — US earnings calendar sweep (non-fatal)
        # Root-cause fix (MLC postmortem 07-14): collectors/equity_earnings.py was never
        # wired into the nightly pipeline — earnings.parquet was permanently empty/missing,
        # making the W1.5 blackout gate and the W5 display chips always stale-fail-open.
        # Sweeps Nasdaq's public calendar for the next 66 weekdays (~one quarter), writing
        # data/earnings/earnings.parquet (ticker-indexed: next_date, next_time, eps_forecast,
        # surprises_json, surprises_as_of, as_of). Bot-wall-aware: if the first calendar call
        # is blocked (Akamai 403), the existing cache is kept untouched and the step exits 0.
        # MUST run in collect_tail, NOT collect (house law: new accrual steps go in collect_tail).
        # KEEP THIS LINE BARE. No-args means "sweep the whole breadth universe"; passing
        # --tickers collapses the universe to that subset and every other row keeps a frozen
        # as_of. That is exactly the 2026-06-19 freeze: the collector's __main__ used to fall
        # through to a 3-name demo default, so for six weeks the nightly refreshed only
        # AAPL/NVDA/JPM while 1361 of 1364 rows sat at as_of 2026-06-19 — and the tripwire
        # below read the store-level max() as_of and reported sla_ok the whole time.
        # Pinned by tests/test_earnings_w5.py::TestNightlyEntryPointSweepsWholeUniverse.
        # Wall time (measured 2026-07-29): calendar sweep 66 calls ≈ 155s (round-trip
        # dominates, not the 0.25s pacing sleep) + surprise drip capped at max_new=120
        # names ≈ 60s → ~3.5m per night, well within the 150m budget.
        # Writes data/earnings/earnings.parquet — covered by `git add data/` below.
        run: |
          python -m collectors.equity_earnings \
            || echo "::warning::equity_earnings sweep failed (non-fatal)"
      - name: MLC-W5 — earnings freshness tripwire (non-fatal)
        # Reads the just-written data/earnings/earnings.parquet and checks that
        # the store's as_of is within the expected SLA (2 trading days).
        # Writes data/quality/earnings_freshness_audit.json for observability.
        # Emits ::warning:: when stale so CI surfaces the gap without failing the build.
        run: |
          python -m scripts.audit_earnings_freshness \
            || echo "::warning::audit_earnings_freshness crashed (non-fatal)"
      - name: commit tail data
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # Everything this job writes is under data/ (tape_flow, trade_flows,
          # clinical_trials, neuralweb, qledger claims, run_status) or
          # site/basketdata/ (TIL site projections). No cache-restore steps run
          # in this job, so the W0b asia unstage sweep from the collect job is
          # not needed here — a fresh checkout+pull can only differ where THIS
          # job's steps wrote. (The adapter sweep + qledger grader never run in
          # this job, so site/qledger/track_record.json is never touched here;
          # tests/test_collect_staging_globs.py keys on the grader-bearing
          # module's dotted name, which this comment deliberately avoids.)
          # data/run_status.json is co-written by the concurrent engine job
          # (flow_signals registration) — whole-file -X theirs means one side's
          # sources[] update can lose a race and go 1-run stale. Display-only
          # and self-healing (healthcheck's hard-fail keys last_run/
          # circuit_breaker are written solely by collect-core's adapter sweep,
          # present in every job's base) — accepted at the 07-14 split review.
          git add data/ site/basketdata/
          if git diff --cached --quiet; then echo "no tail data changes to commit"; exit 0; fi
          git commit -m "data: collect-tail accrual $(date -u +%F)"
          # best-effort push: same 5-retry rebase loop as the collect job's
          # "commit data" (see the pre-sync collision-sweep rationale there —
          # render.yml / #2252). -X theirs prefers THIS job's freshly-accrued
          # data on any conflict; exhausting the retry budget is non-fatal (the
          # stores are state-resumable and re-accrue next night).
          PUSH_ALARM=420
          push_retry_init "tail data"
          while push_attempt; do
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if perl -e 'alarm 420; exec @ARGV or die' -- git pull --rebase --autostash -X theirs origin main && push_autostash_ok; then
              if push_do; then echo "pushed tail data on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning::could not push collect-tail data after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal)"

  engine:
    needs: [collect, government_revenue_projection]
    if: always()            # a scraper failure must still produce a dashboard from cached data
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 200    # was 150 — 5 of the 8 nightlies 2026-07-16→07-23 got CANCELLED at exactly the 150m cap (the greens finished 133m/147m/148.6m — success had become a coin flip). Measured step timings (07-21 green vs 07-24 cancelled jobs): checkout 3s→14.5m (huge variance on the 14k-file tree), R2 restores + signal/ledger preamble ~10–20m, "run regime engine + build dashboard + daily brief" 74–84m (inside it: build_site ~33m, build_news ~26–29m incl. GDELT 429-backoff stalls, share_cards ~7m), parallel regional/desk builders 31–33m normal with one >61m blowout (07-23 night, cut mid-step), tail band (NW/LLM desks → hub) ~35m. Normal total 135–160m; worst observed combination ≈190m. The timeout-cancel grace window does NOT reliably save the deploy: 07-24's "commit engine outputs" (if: always) ran post-cancel but the pages-artifact upload still failed → publish red; 07-23 was hard-killed before commit → stale site. So the cap must cover the whole job: 200m clears the worst observed night with headroom. Next lever if creep resumes: build_news (~26–29m even on green nights, largely GDELT rate-limit backoff — cache/de-rate the sweep or move the news suite into the parallel builders band). Prior history: was 120 (crept 61m→116m→125m, breached 07-13/07-14); was 70 (cancelled at special-situations pre-commit; fixed by parallelising the ~22 regional/desk builders — serial band ~75m → longest cluster, special-situations' ~28m EDGAR sweep). pages.yml deploys the COMMITTED main tree, so any cancel before "commit engine outputs" leaves the live site serving a stale dashboard until a later run lands.
    env:
      COLLECT_LANE: nightly   # job-level sentinel: inherited by every step; ensures all
                              # forward-ledger writers in this job (build_track_record,
                              # build_flip_confirmation, oracle_nightly, demand_ledger,
                              # build_confluence_strength, archive_signals,
                              # archive_context_snapshots, build_thematic_state,
                              # grade_thematic) can advance their ledgers.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: restore, acquire, project, and snapshot Filing Forensics SEC sources (hard gate)
        # This is intentionally BEFORE every broad Filing Forensics state build.
        # The SEC source cache is private/ignored, so a clean nightly checkout has
        # no accession evidence until this step restores the last read-back-verified
        # R2 snapshot. A restore, strict-acquisition, projection, or source-sync
        # failure must skip the later broad build/publish rather than silently
        # replace entitled disclosure coverage with an empty/shallow state.
        #
        # The first call is restore -> acquire and refuses partial target coverage.
        # The second is projection -> sync, with computed_at sampled only after
        # source retrieval so its explicit clock cannot precede a receipt. The
        # commands never render the public shell or publish private browser state.
        env:
          R2_RESEARCH_ENDPOINT: ${{ secrets.R2_RESEARCH_ENDPOINT }}
          R2_RESEARCH_ACCESS_KEY_ID: ${{ secrets.R2_RESEARCH_ACCESS_KEY_ID }}
          R2_RESEARCH_SECRET_ACCESS_KEY: ${{ secrets.R2_RESEARCH_SECRET_ACCESS_KEY }}
          R2_RESEARCH_BUCKET: ${{ secrets.R2_RESEARCH_BUCKET }}
        run: |
          set -euo pipefail
          targets=(
            --target SMCI=0001375365
            --target NVDA=0001045810
            --target AAPL=0000320193
            --target MSFT=0000789019
            --target GOOGL=0001652044
            --target AMZN=0001018724
            --target META=0001326801
            --target TSLA=0001318605
            --target AVGO=0001730168
            --target PLTR=0001321655
            --target AMD=0000002488
            --target ORCL=0001341439
          )
          utc_now() { python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"))'; }
          as_of="$(utc_now)"          # SEC acceptance-time cutoff, fixed before network I/O.
          recorded_at="$(utc_now)"    # explicit snapshot/receipt recording clock.

          python -m scripts.run_fundamental_forensics_wave2 \
            "${targets[@]}" --restore --acquire --require-complete-acquisition \
            --max-tickers 12 --as-of "$as_of" --recorded-at "$recorded_at" --computed-at "$recorded_at"

          computed_at="$(utc_now)"   # sampled after all retained SEC receipts exist.
          python -m scripts.run_fundamental_forensics_wave2 \
            "${targets[@]}" --build-projections --sync \
            --max-tickers 12 --as-of "$as_of" --recorded-at "$recorded_at" --computed-at "$computed_at"
      - name: restore attention store from R2 (wiki chip reads it at render)
        # build_site.build_attention_data reads data/attention/*.parquet — git-ignored
        # since 2026-07-06, R2-hosted, kept current by the collect job's publish-back.
        # Non-fatal: an absent store means the attention chip is silently absent for
        # one render (build_attention_data degrades to None); nothing else reads it.
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.fetch_r2 --dirs attention || echo "::warning::attention restore failed (non-fatal — attention chip absent/stale this render)"
      - name: restore odds desk OHLCV store from R2 (engine hops runners; store is runner-local)
        # data/odds_ohlcv/*.parquet is gitignored + R2-backed (published back by this job's
        # R2 publish step) but was never restored, so every runner hop cold-started the
        # store and build_odds re-fetched all 119 tickers at period="max" nightly — and a
        # single-night yfinance flake dropped that ticker from site/oddsdata/catalog.json
        # entirely (AMAT 2026-07-21). With the store restored, build_odds takes its 1mo
        # upsert path (adjustment-basis guard: tests/test_upsert_basis_guard.py), so a
        # flaked ticker degrades to one-day-stale-but-present instead of absent. Non-fatal:
        # on restore failure build_odds cold-backfills exactly as before. Publish-back
        # needs no gate on this step (unlike attention): a cold rebuild is a COMPLETE
        # deep store, and publish_r2 never prunes R2 keys absent locally.
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.fetch_r2 --dirs odds_ohlcv || echo "::warning::odds_ohlcv R2 restore failed (non-fatal — build_odds cold-backfills)"
      - name: restore breadth close cache (stock search library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-engine-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) breadth close cache (stock library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-engine-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) breadth close cache (stock library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-engine-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: restore Russell 2000 breadth close cache (stock library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/russell_breadth/_closes_cache.parquet
          key: russell-closes-engine-${{ github.run_id }}
          restore-keys: russell-closes-
      - name: restore hk breadth close cache (hk stock search library needs constituent closes)
        uses: actions/cache@v4
        with:
          path: data/hk_breadth/_closes_cache.parquet
          key: hk-breadth-closes-engine-${{ github.run_id }}
          restore-keys: hk-breadth-closes-
      - name: restore china per-name OHLC store (build_china_library overlays it for US parity)
        # restore-keys intentionally removed: data/china_stocks is git-tracked and owned by
        # asia-close. Restoring a stale GHA cache here was causing the 5-day lag regression
        # (the engine job's git add data/ + -X theirs rebase-push overwrote the fresh
        # asia-close data with cache-restored stale parquets). CN-SYS W5a fix.
        uses: actions/cache@v4
        with:
          path: data/china_stocks
          key: china-stocks-ohlc-engine-${{ github.run_id }}
      - name: restore hk per-name OHLC store (build_hk_library overlays it for US parity)
        uses: actions/cache@v4
        with:
          path: data/hk_stocks
          key: hk-stocks-ohlc-engine-${{ github.run_id }}
          restore-keys: hk-stocks-ohlc-
      - name: restore intraday (4H) cache (build_chart_data emits site/intraday from it)
        uses: actions/cache@v4
        with:
          path: data/intraday
          key: intraday-engine-${{ github.run_id }}
          restore-keys: intraday-
      - name: price-store freshness gate (last SPY bar vs expected NYSE session; keyless self-heal)
        # 2026-07-07 incident: collect fetched Monday's bars but its non-fatal push died 5x
        # (pre-#1823 unstaged-changes rebase bug) and went GREEN with a ::warning:: — this job
        # then fresh-checked-out a store frozen at 07-02 and persisted a faithful-but-stale
        # RISK_OFF as the canonical market_state, which the live feed carried all session.
        # Every committed store froze in the SAME dead push, so only the exchange calendar
        # (lib/nyse_calendar — zero data dependencies) can see the missing session. --heal
        # re-pulls the yahoo group (keyless, ~16s) so the regime engine below reads real bars
        # and "commit engine outputs" carries them to main. continue-on-error: a red gate must
        # not kill the cached-data dashboard (this job's if:always() philosophy) — it shows RED
        # on the run page while engine.market_state.persist stamps the snapshot freshness.stale.
        continue-on-error: true
        run: python -m scripts.check_price_store_freshness --heal
      - name: MTF buy-filter signals + §7 contract gate (build_signal_quality → validate_signals)
        # Compute the per-ticker chart markers (site/signals/<T>.json) + the brain leaf
        # (data/signal_archive/mtf_signals_latest.json), THEN validate both against
        # research/signal_engine/SCHEMA.json — the §7 signal→chart contract, the single source of
        # truth shared verbatim with the charting app. Runs BEFORE the regime engine so a clean,
        # freshly written leaf is what engine.run loads into latest["mtf_signals"].
        #
        # ABORT-THE-WRITE, NOT-THE-DEPLOY: a contract drift/malformed write must NOT ship, but —
        # like every other builder here — must NOT 404 the dashboard either. So on a validation
        # failure we QUARANTINE the bad write (restore the last-good committed leaf; drop the
        # untracked per-ticker files so the chart safe-degrades to no-markers) and surface a loud
        # red ::error:: annotation + run-summary, then exit 0 so the deploy continues. The bad
        # write never reaches main (leaf reverted, per-ticker files gone) and the violation is
        # recorded in the committed data/quality/signals_audit.json. The HARD red gate for
        # contract-breaking PRs lives in ci.yml (signal-contract job) where blocking is safe.
        # Compute is cheap (reads the committed data/stocks/*.parquet deep-history panel).
        run: |
          set +e
          echo "::group::build + validate MTF signals"
          python -m scripts.build_signal_quality > "$RUNNER_TEMP/sigq.log" 2>&1; bq=$?
          cat "$RUNNER_TEMP/sigq.log"
          if [ "$bq" -ne 0 ]; then
            echo "::error title=build_signal_quality failed (rc=$bq)::signal compute failed — leaf left at last-good"
          fi
          python -m scripts.validate_signals > "$RUNNER_TEMP/sigv.log" 2>&1; vrc=$?
          cat "$RUNNER_TEMP/sigv.log"
          echo "::endgroup::"
          if [ "$vrc" -ne 0 ]; then
            # Discard the drifted/malformed write so neither the commit-to-main nor the Pages
            # artifact can ship it. Leaf AND per-ticker files are tracked on main (per-ticker
            # tracked since 2026-06-28 via the render lane) -> restore last-good committed
            # copies; git clean sweeps only untracked strays (e.g. a new ticker's first write).
            # NEVER `rm` the tracked per-ticker files here: the 226 staged deletions ride the
            # broad `git add site/` into the engine commit and modify/delete-conflict with the
            # intraday render lane's signal commits — the rebase-push then fails every retry
            # and the WHOLE nightly engine commit (regime update + forward ledgers) is dropped
            # (2026-07-12 incident: pick-lab ledgers lost).
            git checkout -- data/signal_archive/mtf_signals_latest.json 2>/dev/null || true
            git checkout -- site/signals/ 2>/dev/null || true
            git clean -fq -- site/signals/ 2>/dev/null || true
            echo "::error title=signal §7 contract gate FAILED::malformed/drifted signal write discarded (leaf + per-ticker files restored to last-good committed copies); see data/quality/signals_audit.json"
            { echo "### ❌ signal §7 contract gate failed — bad write discarded";
              echo '<details><summary>validator output</summary>'; echo; echo '```';
              tail -n 40 "$RUNNER_TEMP/sigv.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: build signal track-record ledger (w0-stageB)
        # Incremental + cheap (reads site/signals/ + data/stocks/ — both already
        # written by the step above). Runs AFTER build_signal_quality so both
        # site/signals/*.json and mtf_signals_latest.json are fresh. Resilient:
        # any error is logged to stderr and the step exits 0 (never aborts deploy).
        # data/signal_archive/track_record.parquet is git-tracked (un-ignored,
        # w0-stageB) and is staged by the "commit engine outputs" step's
        # `git add data/` below.
        run: |
          echo "::group::build_track_record"
          python -m scripts.build_track_record 2>&1 | tee "$RUNNER_TEMP/tr.log"
          echo "::endgroup::"
          python -m scripts.audit_sizes || echo "::warning::track_record size tripwire fired �� check data/quality/sizes_audit.json"
          exit 0
      - name: export cross-repo signal contracts (golden_signals + artifact_manifest)
        # Writes site/factordata/contracts/golden_signals.json + artifact_manifest.json --
        # the oracle the Terminal's golden_gate.py + artifact_conformance.py consume as a
        # conformance check (audit #7 #9). Runs after build_signal_quality (engine.canon is
        # confirmed working) + after the china/hk OHLC cache restores. Window is FIXED
        # (2015-2024) so output is deterministic and the step is cheap (~5s). Resilient.
        run: |
          python -m scripts.export_signal_contracts \
            || echo "::warning::export_signal_contracts failed (non-fatal) -- keeping last committed contract"
      - name: S&P 500 heatmap real-cap reference (weekly Polygon refresh; committed)
        # (Re)builds data/sp500_heatmap/reference.parquet (~503 rows: ticker → shares +
        # SIC) so build_site's S&P heatmap sizes tiles by REAL market cap (shares × latest
        # close) on EVERY lane. Since site/stockdata left git for R2, the render /
        # engine-render / earlyclose lanes run on fresh checkouts with no cap source and
        # size_basis silently degraded to the ETF weight_proxy. The parquet is small and
        # git-tracked — `git add data/` in "commit engine outputs" below lands it, so all
        # other lanes read real caps at checkout. Runs BEFORE build_site so tonight's
        # payload already sizes by market cap. The script self-gates to a weekly Polygon
        # sweep via the cache's embedded asof stamp (shares move slowly; ~1-2 min when it
        # does sweep). Non-fatal: a failed refresh leaves the previous cache in place and
        # build_sp500_heatmap falls back to site/stockdata caps, then to the last
        # committed marketcap payload's sizes.
        continue-on-error: true
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python -m scripts.build_sp500_heatmap --refresh-caps-only || echo "::warning title=sp500 heatmap cap refresh::rc!=0 (non-fatal — previous cache/fallbacks remain)"
      - name: run regime engine + build dashboard + daily brief (resilient)
        # Self-diagnosing + deploy-resilient: each builder runs isolated; a failure
        # is surfaced as a ::error:: annotation (readable on the run page + via the
        # public check-runs API) AND appended to the run Summary with its traceback,
        # but NEVER aborts the job — so the site still deploys (via the always()
        # artifact upload) and one broken builder can't 404 the whole dashboard.
        env:
          # catalyst_tone (Tier-A FOMC/dislocation digest) runs INSIDE engine.run, so it
          # needs the DeepSeek key here too — not only on the master_brain step below.
          # No-op (degrades to neutral) when the secret is absent.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # NWS-01 (#2658) moved build_news INTO this step (pre-build_site) from the
          # parallel cluster below — the financial_news polygon/finnhub legs need the
          # provider keys HERE now, or the keyed nightly itself would ship a dark feed
          # (and after 36h the never-darken guard would lapse into permanent darkness).
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          # Live intraday layer: set repo VARIABLE LIVE_QUOTES_WORKER_URL (Settings ->
          # Secrets and variables -> Actions -> Variables) to your deployed Cloudflare
          # quotes-worker URL to turn ON browser live prices — build_site bakes it into
          # site/live_config.js. Empty -> live layer stays dormant (no-op). No code edit needed.
          LIVE_QUOTES_WORKER_URL: ${{ vars.LIVE_QUOTES_WORKER_URL }}
        run: |
          set +e
          # Marker for the libraries-rebuild guard further down. The four non-US search
          # libraries are each built by their dashboard step (build_china / build_hk /
          # build_canada, and build_intl via build_vector) AND again by the resilient rebuild
          # step at the end — duplicate per-name analyze() work (~11m/run). Any
          # <mkt>stockdata/index.json newer than this marker was (re)built FRESH this run,
          # so the rebuild step skips it; a market whose dashboard failed keeps its older
          # (pulled) index.json and is still rebuilt. Set BEFORE any builder runs.
          touch "$RUNNER_TEMP/engine_libs_marker"
          run_py() {
            local label="$1"; local mod="$2"
            echo "::group::$label"
            python -m "$mod" > "$RUNNER_TEMP/step.log" 2>&1; local rc=$?
            cat "$RUNNER_TEMP/step.log"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$label failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/step.log" | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ $label failed (rc=$rc)"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 60 "$RUNNER_TEMP/step.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          run_py "regime engine (engine.run)" engine.run
          # Shock de-escalation protocol (policy-shock W2-E / D3) — must run AFTER engine.run
          # so market_drivers.append_log has written coherence_state to the log.  Writes
          # data/reflexes/shock_deescalation/firings.jsonl (keep-first) + site/live/shock_state.json.
          # Non-fatal: exits 0 on any error so this can NEVER break the render. PS-R7 guard
          # is enforced inside engine.shock_deescalation.build_nightly().
          run_py "shock de-escalation (shock_deescalation)" engine.shock_deescalation
          # S&P allocation deep-dive (spvector.html) + data/regime/spvector_latest.json,
          # BEFORE build_site so the macro page's allocation card reads live numbers.
          run_py "S&P allocation vector (build_spvector)" scripts.build_spvector
          # Deep-history (2011-2026) leak-free IC scorecard -> data/edgar/ic_scorecard.json, read by
          # build_site's factors page. --deep reads the offline deep close panel (data/edgar/
          # sue_deep_closes.parquet — gitignored, NOT rebuilt in daily CI); when it is absent the step
          # exits WITHOUT writing, keeping the committed deep scorecard rather than clobbering it with a
          # shallow ~3y run. Regenerate offline: python -m scripts.sue_deep_phase0 (backfill the panel)
          # then python -m scripts.factor_ic_scorecard --deep --start 2011. Additive (never blocks build).
          python -m scripts.factor_ic_scorecard --deep || echo "ic scorecard skipped (additive)"
          # NOTE: build_factor_series (the ~22-min month-end walk = compute_factors x ~38
          # month-ends x 2 universes) was MOVED to its own parallel `factor_series` job
          # below — it, NOT residual-alpha, was the real engine bottleneck. build_site reads
          # the COMMITTED factor_series.json (degrade-never-raise), so a <=1-run-old series
          # is fine and the deep walk no longer gates the daily dashboard/deploy.
          # Alt-data desk BEFORE build_site so today's convergence alerts are already in
          # data/altdata/alerts.jsonl when build_site assembles the Alert Center. Reads the
          # collect job's committed data/quiver/* (no API key needed here); returns 0 on error.
          run_py "alternative data desk (build_alt_data)" scripts.build_alt_data
          # 13F Smart-Money Trade Tracker — grades curated super-investor 13F moves by
          # SPY-relative forward return (engine.manager_trades). Reads the committed
          # data/smart_money/* snapshots + the breadth/yahoo price caches; returns 0 on error.
          run_py "13F smart-money tracker (build_smart_money)" scripts.build_smart_money
          # Policy-Shock W2-F — ARMED/QUIET conditions-arming card (site artifact only, PS-R7).
          # Reads CL=F via yahoo store + data/whitehouse/alerts.jsonl (READ ONLY).
          # Non-fatal: main() always returns 0; a missing artifact degrades gracefully on the page.
          run_py "policy-lever card (build_policy_lever)" scripts.build_policy_lever
          # NWS-01 fix: build_news must run BEFORE build_site so that build_site
          # renders news.html against the CURRENT macro_releases.json (not the
          # previous run's artifact).  build_news is display-tier/leaf (context-only);
          # it adds ~1-3 min serial wall-time here (FRED fetches cached 12h; LLM
          # enrichment ~20-60s with DeepSeek; worst-case cold ~3-4 min).  The
          # site no longer ships a desync'd board.
          # news_calib (grade_news_events) runs immediately after — it writes
          # site/news/calibration.json which build_site also reads (W3 side-artifact).
          run_py "news suite (build_news)" scripts.build_news
          run_py "news event calibration (grade_news_events)" scripts.grade_news_events
          # OEU M-FIX (same class as the NWS-01 fix above): MSP W1 data spine must
          # run BEFORE build_site, because build_site renders market_structure.html
          # from data/market_structure/latest.json. It used to sit in the parallel
          # cl_gex band AFTER build_site, so the page was always one generation
          # stale — the Weekly Range / gamma / systematic blocks described the
          # previous night. Cheap (<10s wall); reads gex_SPX.parquet + _GSPC.parquet,
          # both committed by the collect job, so it has no dependency on the band.
          # Lane-gated ledger (COLLECT_LANE=nightly) is unaffected by the move.
          run_py "MSP W1 — market structure data spine (build_market_structure)" scripts.build_market_structure
          # Filing Forensics broad-universe projection — deterministic, display/context only.
          # Reads the committed SEC quarterly/annual panels, atomically writes a gitignored
          # private state plus public shell/assets, and never fetches network data here. The
          # accession-aware raw engine is advanced separately once object storage is bound.
