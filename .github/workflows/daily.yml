        # Reads every review-clock source (experiments, qledger, research_factory,
        # trial_ledger, governance, rule_experiments, cycle_pattern, species, freshness)
        # and writes data/neuralweb/evidence_clock.json.
        # No LLM, no mutations, always exits 0. Covered by 'git add data/' below.
        run: python -m scripts.build_evidence_clock || echo "::warning::evidence clock build failed"
      - name: options_flow_attention reflex trigger (W-D — nightly EOD fold)
        if: always()
        # Neural Web W-D (RO-8): direction-free reflex that fires when an on-board
        # name shows a vol>OI magnitude burst (z-score ≥ 2.0 on fresh_contracts /
        # premium_mn) or is within 1% of a GEX wall/flip.  Reads EOD parquets from
        # data/options_flow/ + data/polygon_gex/ (written by the collect job) and
        # board membership from site/factordata/us_standouts*.json (written by
        # build_site above — both artifacts are present by this step).
        # Appends to data/reflexes/options_flow_attention/firings.jsonl.
        # Covered by 'git add data/' in 'commit engine outputs' below.
        # Fail-soft: dormant until flow summaries accumulate ≥5 rows of history;
        # never kills the nightly.
        run: python -m scripts.build_options_flow_attention || echo "::warning::build_options_flow_attention failed (non-fatal — reflex dormant this run)"
      - name: commit engine outputs
        if: always()   # commit the freshly-built pages even if a LATER optional builder times out or is cancelled. pages.yml deploys the COMMITTED main tree, so a skipped commit = stale live site. The builders are individually resilient (each leaves the prior page in place on its own error), so partial output is never broken — committing what built beats shipping nothing.
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # pre-commit template↔site re-sync (ui.template_site_sync): the shim/externalize
          # step above rewrites the site/ copies of the ~48 templates/-paired plain-copy
          # assets, and only the post-rebase --fix in the push loop heals the divergence —
          # a cancellation/failure between this commit and that heal ships it (engine-render
          # 2026-07-24: run 30057066815 cancelled mid-push-loop landed b6386adb4af, sync gate
          # red on every PR until #3358). Heal BEFORE staging so the first commit is never
          # diverged; the post-rebase --fix stays for the -X theirs mid-render-merge case.
          python -m scripts.check_template_site_sync --fix || true
          python3 scripts/check_conflict_markers.py --file site/start.html
          # start runtimes single-instance (ui.start_runtime_single_instance): a stale-
          # checkout render re-emits doubled live tags with ZERO markers (adad513bdfe),
          # so the marker gate above can't see it — heal from HEAD (the last committed
          # page, at most one render old) rather than forfeit the whole render.
          python3 scripts/check_start_runtime.py --heal-from HEAD
          # templates/ too, and ONLY for the plain-copy HTML pairs (index.html, chat.html):
          # optimize_assets re-stamps their templates/ side because the --fix above rewrites
          # their site copy FROM templates/ — a stamp staged site-only is reverted before it
          # reaches main (#3617's fix never reached one returning browser), and staging site/
          # alone would land the pair diverged and red the publish gate. Nothing else in the
          # build path writes templates/. See render.yml.
          # refuse stash/rebase wreckage (2026-08-01 d29e4dd44d: a conflicted
          # autostash apply from an earlier push loop in THIS job was staged
          # wholesale — 1,704 pages shipped markers)
          bash "${GITHUB_WORKSPACE:-.}/scripts/ci/strip_conflict_markers.sh"
          git add data/ site/ reports/
          # separate + tolerant: `git add site/ templates/` exits 128 when a pathspec
          # matches nothing, and this step runs under `-eo pipefail` — a missing
          # templates/ would abort the commit and lose the whole render rather than
          # just the stamp. Staging site/ keeps its hard-fail semantics.
          git add templates/ 2>/dev/null || true
          # W0b (2026-07-08 stale-HK incident): US engine job must NOT commit asia-owned
          # data/ paths — asia-close.yml is the sole writer of all china*/hk* stores.
          # The GHA cache restore above (data/hk_stocks, restore-keys: hk-stocks-ohlc-)
          # can overlay stale parquets on top of what asia-close committed; combined with
          # -X theirs on the rebase-push, the US job would overwrite fresh HK data with
          # its stale checkout-time copy.  Unstage all asia-owned paths immediately after
          # the broad git add so they are never included in the engine commit.
          # Path derivation: asia group = adapters starting with `china` or `hk`
          # (scripts/collect.py group_members); data/hkma adapter key `hkma` also starts
          # with `hk`.  US fallback builders (build_vector: baskets_china/hk idempotent
          # by as_of) write data/ only when asia lane skipped — those writes ride inside
          # data/china_* / data/hk_* so they are protected by asia-close on normal runs
          # and correctly excluded here on a fallback run (no double-commit hazard since
          # asia-close won't push a commit for those paths on a fallback day).
          git reset -q -- data/hk data/hk_* data/hkma data/china data/china_* 2>/dev/null || true
          # W6b per-lane push dedup ledgers: covered by 'git add data/' above since
          # data/alert_triage/ is under data/. Explicit add as staging-law documentation:
          # basket_freeze lane (single-writer: engine/basket_freeze.py),
          # signal_sanity lane (single-writer: scripts/signal_sanity.py),
          # healthcheck lane (single-writer: scripts/healthcheck.py).
          # SENTINEL STAGING LAW: all three per-lane JSONL paths are synapse-registered
          # (ops-push-basket-freeze, ops-push-signal-sanity, ops-push-healthcheck).
          git add data/alert_triage/ 2>/dev/null || true
          # SA-R15: US pick-lab ledgers — fires.jsonl, grades.jsonl, monthly snapshot
          # parquets. These are runner-local today (CN's equivalents are committed).
          # Force-add so they ride the engine commit and are visible to the off-render
          # standout_audit_us job (which reads committed stores only, SA-R15).
          git add data/pick_lab/fires.jsonl 2>/dev/null || true
          git add data/pick_lab/grades.jsonl 2>/dev/null || true
          git add data/pick_lab/etf_closes.parquet 2>/dev/null || true
          # m1 fix: long-hold ledgers written by engine/pick_lab/profile.py:186-190
          git add data/pick_lab/lh_fires.jsonl 2>/dev/null || true
          git add data/pick_lab/lh_grades.jsonl 2>/dev/null || true
          git add data/pick_lab/snapshots/ 2>/dev/null || true
          # LLM stock briefs (site/stockbrief) are gitignored for local-dev cleanliness
          # but must be TRACKED on main so the committed-tree deploy (pages.yml) ships
          # them — same as the force-tracked stock-search libraries. -f overrides the
          # ignore; || true so an empty/absent dir (feature off) never fails the commit.
          git add -f site/stockbrief 2>/dev/null || true
          # FTR W10: persist nightly dedup state so the first intraday tick of the same day
          # does not double-fire an IGNITION/shock alert that the nightly already sent.
          # notify_state.json is site/live/ (gitignored); force-add with || true so an
          # absent file (no alert fired, dark mode) never fails the commit.
          git add -f site/live/notify_state.json 2>/dev/null || true
          # China stock-search library: gitignored like the other markets' libraries —
          # force-add it so the committed-tree deploy ships every indexed A-share detail
          # JSON, not just the old tracked subset.
          # Canada stock-search library: gitignored like the other markets' libraries,
          # but (unlike them) force-added here so the committed-tree deploy ships it —
          # otherwise canada_stock.html's search 404s on canadastockdata/index.json.
          # International stock-search library: same gitignore situation — force-add so
          # the committed-tree deploy ships it (else intl_stock.html search 404s).
          # US stock-search library (built by build_site -> build_stock_library): only a
          # ~534-name legacy subset was ever tracked while the index lists ~1595, so the
          # untracked long tail 404'd on click. Force-add the whole dir so every name ships.
          # Bespoke single-stock chart OHLC (built by build_site -> build_chart_data):
          # gitignored like the search libraries, so force-add it or the committed-tree
          # deploy ships no price data and every stock chart renders empty.
          # Non-US bespoke chart OHLC (built by build_{china,canada,intl}_library): same
          # gitignore + force-add situation as their stockdata libraries. HK now also ships
          # reconstructed candles (build_hk_library -> build_chart_data.build_hk -> site/hkohlc),
          # imputed from its close-only per-stock JSON so the chart draws candlesticks.
          # US 4H intraday chart data (built by build_site -> build_chart_data.emit_intraday
          # from the cached data/intraday) — gitignored, force-add so the deploy ships it.
          if git diff --cached --quiet; then echo "no engine output changes"; exit 0; fi
          # Fail-closed conflict gate (P0 2026-08-01, d29e4dd44d / #4167): a conflicted
          # autostash apply anywhere upstream of this step leaves `Updated upstream /
          # Stashed changes` blocks that the broad `git add` above stages VERBATIM —
          # 1,707 pages reached main exactly that way. push_staged_heal restores
          # display-tier offenders (site/, templates/, reports/) wholesale from HEAD
          # (same restore semantic as #4167) and FAILS CLOSED on ledger-tier data/
          # offenders or a still-dirty re-scan — sweeping the polluted files from the
          # tree first, because the Pages artifact upload below runs on always() and
          # must never ship marker bytes.
          if ! push_staged_heal data/ site/ reports/ templates/; then
            exit 1
          fi
          if git diff --cached --quiet; then echo "no engine output changes after conflict heal"; exit 0; fi
          git commit -m "engine: regime update $(date -u +%F)"
          # best-effort push (see commit-data). The deploy below uses the uploaded
          # artifact, so it never depends on this commit landing.
          PUSH_ALARM=420
          PUSH_BUDGET_SECS=600   # a dropped push here costs the nightly's forward-ledger DAY (sole-advancer law) — worth waiting 10 min for the ref
          PUSH_MAX_ATTEMPTS=20   # let the 600s DEADLINE stop this loop, not the attempt count: 10 contention
                                 # retries burn only ~2 min, so the raised budget above would never bind
          push_retry_init "engine outputs"
          while push_attempt; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            # (Asia paths unstaged above: when newly tracked on main, deleting the local stale
            # copy lets the rebase materialize asia-close's fresh commit — the W0b intent.)
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            # rename/rename on content-hashed site/assets/css/* is deterministic across
            # retries (path conflict; -X theirs can't settle it — 2026-07-22 asia-close
            # run 29904079071 dropped a day's outputs this way). The autoresolver keeps
            # both sides' hashed files (next externalize_css prunes the orphan) and
            # finishes the rebase; anything else is left for the abort+retry below.
            if { perl -e 'alarm 420; exec @ARGV or die' -- git pull --rebase --autostash -X theirs origin main || bash scripts/rebase_autoresolve_hashed_css.sh; } && push_autostash_ok; then
              # post-rebase template↔site re-sync (ui.template_site_sync): -X theirs can
              # resurrect this run's checkout-time template copies over a reword that merged
              # mid-nightly (2026-07-07: engine-render commit 2ae709f9f0 reverted #1793's
              # site-side de-escalation in sector_cycles.js this way). templates/ is now
              # fresh post-rebase main — re-copy and fold any delta into a follow-up commit.
              # re-stamp POST-rebase (ui.asset_stamp): the tree this loop PUSHES is not the tree
              # the normalizer step stamped — pages a sibling lane lands mid-run arrive here
              # un-stamped and unseen by that pass (2026-07-26 render 6260e5ac8c0 shipped
              # site/us_track_record.html with a bare `theme.css` this way). Idempotent, ~11s over
              # 3.2k pages, and BEFORE the --fix so the pairs heal from a re-stamped templates/.
              python -m scripts.optimize_assets || echo "::warning::post-rebase asset optimize FAILED — ?v= stamps may be stale"
              python -m scripts.check_template_site_sync --fix || true
              # ms-board coherence guard (ui.ms_board_coherence): -X theirs resolves whole
              # conflict REGIONS toward this run's replayed render, so racing a mid-nightly
              # render can stitch a hybrid Market State board (2026-07-07: commit 5bf116a3b3
              # baked upstream's score 56/"Mixed" beside a stale "Risk Radar forces
              # Risk-off." note). Restore any incoherent page WHOLESALE from post-rebase
              # origin/main (coherent, at most one render old).
              python3 scripts/check_ms_board_coherence.py --heal-from origin/main \
                || echo "::warning::ms-board coherence heal incomplete (incoherent board may predate this run)"
              # refuse stash/rebase wreckage (2026-08-01 d29e4dd44d: a conflicted
              # autostash apply was staged wholesale — 1,704 pages shipped markers)
              bash "${GITHUB_WORKSPACE:-.}/scripts/ci/strip_conflict_markers.sh"
              python3 scripts/check_conflict_markers.py --file site/start.html
              python3 scripts/check_start_runtime.py --heal-from origin/main
              if ! git diff --quiet -- site/ templates/; then
                # push_staged_clean: never bake conflict markers into the follow-up
                # commit (P0 d29e4dd44d/#4167). On a dirty scan: unstage and push the
                # guarded engine commit alone — same forfeit as a failed render-sync.
                git add site/
                git add templates/ 2>/dev/null || true
                if push_staged_clean site/ templates/; then
                  git commit -m "render-sync: post-rebase guards (template re-copy + ms-board coherence)" \
                    || echo "::warning::render-sync commit failed (non-fatal — pages publish gate backstops divergence)"
                else
                  git reset -q -- site/ templates/ || true
                  # restore the offenders' worktree bytes too — the always()
                  # Pages artifact below ships the WORKING TREE, not the commit
                  # (word-split is safe: no tracked path contains whitespace)
                  for f in $PUSH_STAGED_OFFENDERS; do git checkout HEAD -- "$f" 2>/dev/null || true; done
                  echo "::warning title=render-sync skipped::post-rebase site/templates scanned dirty (conflict markers) — follow-up commit skipped and offenders restored from HEAD; pushing the guarded engine commit only"
                fi
              fi
              if push_do; then echo "pushed engine outputs on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          # Loud but non-fatal: publish/oracle/tech-lab/briefs jobs `needs: engine`, so a
          # hard fail here would cascade-skip the deploy. The real loss is the data/
          # forward-ledger day (sole-advancer law) — surface it where eyes are.
          echo "::error title=nightly engine outputs NOT pushed::$PUSH_ATTEMPT rebase/push attempts failed ($PUSH_STOP) — the nightly's data/ forward ledgers + rendered site/ exist only on this runner and are lost at the next checkout (the site still deploys via artifact, the LEDGER DAY does not). See scripts/rebase_autoresolve_hashed_css.sh."
          echo "### ❌ nightly engine outputs NOT pushed after $PUSH_ATTEMPT attempts ($PUSH_STOP) — forward-ledger day at risk (site still deploys via artifact)" >> "$GITHUB_STEP_SUMMARY"
      - name: assemble machine-consumable feeds (site/feeds -> R2)
        if: always()
        # Handoff H4 (2026-07-02 incident): risk_radar snapshot, froth/dislocation
        # logs, group_flow meta, RRG rotation, event calendar, intl spillover,
        # per-sector breadth — one flat dir whose _manifest.json bulk consumers
        # (Mastermind bot) sync against. Never fatal; missing sources are skipped.
        run: python -m scripts.build_feeds || echo "::warning::build_feeds failed (non-fatal)"
      - name: publish heavy per-ticker stores to R2 (additive; no-op without creds)
        if: always()
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # US-evening shard owns the US/intl/canada/subsector stores; CN/HK go via asia-close.yml.
        # Content-hash skip -> only deltas upload. Still committed to git for now (Pages fallback);
        # the git de-bloat + Pages slim-down is the follow-up increment once the client reads R2.
        # massive_stock_day moved to the COLLECT job (2026-07-29) — it is restored, advanced and
        # published there. An engine checkout never holds that store, so listing it here only ever
        # produced a nightly publish_r2 refusal warning (under the _DATA_DIR_MIN_FILES floor).
        run: python -m scripts.publish_r2 --dirs ohlc,intlohlc,canadaohlc,subsectorohlc,subsectorohlc_russell,subsectorohlc_nasdaq,stockdata,intlstockdata,canadastockdata,intraday,feeds,stock_personality,oddsmatrix,odds_ohlcv,seasonalitydata/entities || echo "::warning::R2 publish failed (non-fatal)"
      - name: verify R2 data plane freshness (loud tripwire — the publish above is non-fatal)
        # The publish step swallows every failure (incl. the exit-0 no-op when the R2_*
        # secrets are absent/expired), so the live site would serve stale per-ticker data
        # under a green run. HEAD the PUBLIC anchors instead: if stockdata/ohlc weren't
        # touched within 26h (was 2h — too strict; content-unchanged anchors on no-delta
        # weekend/holiday runs keep the prior day's Last-Modified and falsely tripped, e.g.
        # the 2026-07-13 Sunday run at 18.8h. 26h matches scripts/healthcheck.py), this run's
        # publish did not land -> red run + step summary.
        # Deploy is unaffected (artifact steps below are if:always()); the scheduled
        # heartbeat (scripts/healthcheck.py) independently re-probes with a 26h limit.
        # massive_stock_day joined the strict anchors 2026-07-29: its manifest is re-put by
        # the COLLECT job's publish earlier in this same run, so a dead feed, a failed
        # restore or a skipped publish turns this step red within 26h instead of freezing
        # the store silently for weeks (07-04→07-29). Safe to anchor only because that
        # manifest now carries coverage.max_missing_run_weekdays_recent — audit_r2's
        # coverage probe keys the hole test on that trailing-window figure, so only a NEW
        # tip-adjacent gap reds this step; a large full-history run (a stale/mid-backfill
        # state snapshot, or a remainder the capped incremental is still chipping) stays
        # reported without failing the build.
        if: always()
        run: |
          if ! python -m scripts.audit_r2 --strict --anchors stockdata,ohlc,massive_stock_day --max-age-hours 26; then
            echo "### ❌ R2 data plane STALE/DARK — publish_r2 failed or was skipped (expired R2_* secrets?); the live site keeps serving OLD per-ticker data. See scripts/audit_r2.py." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: strip heavy per-ticker stores from the Pages artifact (served from R2 now)
        if: always()
        run: |
          rm -rf site/ohlc site/chinaohlc site/hkohlc site/intlohlc site/canadaohlc site/subsectorohlc site/subsectorohlc_china site/subsectorohlc_russell site/subsectorohlc_nasdaq site/stockdata site/chinastockdata site/hkstockdata site/canadastockdata site/intlstockdata site/intraday site/feeds site/oddsmatrix 2>/dev/null || true
      - name: upload pages artifact
        if: always()   # deploy must not hinge on the commit-push above succeeding
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # The factor-portfolio RETURN SERIES (factors-page chart) is a ~22-min month-end
  # walk (compute_factors x ~38 month-ends x 2 universes) — it was the real engine
  # bottleneck that pushed the job past its cap on congested runners. It only moves
  # at month-ends, build_site reads the COMMITTED factor_series.json
  # (degrade-never-raise), and the deploy uses the engine artifact — so it runs here
  # ISOLATED, in parallel with engine, can never gate/slow the daily deploy, and its
  # refresh lands on main for the next run (<=1 run stale = fine for a ~3y month-end
  # chart whose fundamental ranks refresh ~yearly). `publish` needs ONLY engine, so a
  # slow/failed factor_series can never block the dashboard going live.
  factor_series:
    needs: collect
    if: always()
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      # build_factor_series._closes() reads these breadth close caches (broad =
      # breadth+smallcap+midcap, narrow = breadth). Restore-only — the collect job
      # produces/saves them.
      - name: restore breadth (S&P 500) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-fseries-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-fseries-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-fseries-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: factor return series (build_factor_series)
        run: python -m scripts.build_factor_series || echo "factor series skipped (additive)"
      - name: commit factor series
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/factordata/factor_series.json
          if git diff --cached --quiet; then echo "no factor-series changes"; exit 0; fi
          git commit -m "factor-series: month-end walk $(date -u +%F)"
          # best-effort push (different file from engine's outputs → rebases clean)
          PUSH_ALARM=420
          push_retry_init "factor series"
          while push_attempt; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if perl -e 'alarm 420; exec @ARGV or die' -- git pull --rebase --autostash -X theirs origin main && push_autostash_ok; then
              if push_do; then echo "pushed factor series on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning::could not push factor series after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal — daily reads the last committed json)"

  # Factor Intelligence panel — incremental nightly append (RULING-C).
  #
  # Runs AFTER factor_series (needs factor_series.json for style_regime L/S leader
  # input from chart_data.spread). Writes data/factordata/panel/ which is GITIGNORED
  # — no commit step, no sentinel git-add changes required. Fail-soft (additive):
  # a missing/bad panel NEVER blocks the dashboard going live.
  #
  # Incremental mode: only dates missing from the existing panel are built.
  # One-shot deep backfill (--start 2020-01-01, ~25 min) runs SEPARATELY via
  # `python -m scripts.build_factor_panel --backfill` — NOT in this nightly loop.
  # See §RULING-C in research/FACTOR_INTELLIGENCE_MASTERPLAN_BY_FABLE.md.
  factor_panel:
    needs: [factor_series]
    if: always()
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: restore breadth (S&P 500) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-fseries-${{ github.run_id }}
          restore-keys: breadth-closes-
      # FIX-8 (RULING-C nightly bounds): pin to 10 trading days back so a cold
      # runner never silently rebuilds a year. The one-shot deep backfill
      # (--start 2020-01-01, ~25 min) MUST be run once manually before the panel
      # has usable history depth. See build_factor_panel.py module docstring.
      - name: factor panel (incremental — bounded 10-day window)
        run: |
          START=$(python -c "import pandas as pd; print((pd.Timestamp.today() - pd.tseries.offsets.BDay(10)).date())")
          python -m scripts.build_factor_panel --start "$START" || echo "factor panel skipped (additive)"
      # P1-D: Pair G borrowed_strength detector. Runs AFTER factor_panel step (needs
      # today's panel partition). Fail-soft: a dormant detector emits no records and
      # logs a gap note; it never kills the nightly. Output is data/neuralweb/
      # factor_contradictions.jsonl — explicitly gitignored (R2-candidate; single-copy
      # runner-local pending R2 sync); NOT gitignored implicitly via default untracked
      # behavior. The sentinel commit step does not stage it.
      - name: factor contradictions detector (Pair G borrowed_strength — P1-D)
        run: |
          set +e
          python -m engine.neuralweb.factor_contradictions > "$RUNNER_TEMP/factor_contradictions.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/factor_contradictions.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=factor_contradictions::rc=$rc (non-fatal — dormant behavior expected until panel backfill)"; fi
          exit 0
      # RUL-NW1: factor_panel job is the sole advancer of factor-namespace artifacts.
      # Builds factor_intelligence_state.json + site mirror + history digest +
      # fire_coordinates. Fail-open: always exits 0.
      - name: build factor intelligence state
        run: |
          python -m scripts.build_factor_intelligence_state || echo "::warning::build_factor_intelligence_state failed (non-fatal — fail-open)"
      # RUL-NW1: narrow allowlisted commit — stages ONLY these six paths.
      # Never adds anything else (no git add data/).
      # Firings staged here (not in cortex job) to fix the cross-job hole where
      # factor_attention firings are written in THIS job's tree but the cortex
      # job's commit step runs in a different tree where they never exist.
      - name: commit factor intelligence outputs
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/neuralweb/factor_intelligence_state.json
          git add site/neuralwebdata/factor_intelligence_state.json
          git add data/factordata/factor_state_history.jsonl
          git add data/factordata/fire_coordinates.jsonl
          git add data/neuralweb/factor_contradictions.jsonl || true  # dormant until panel backfill ≥60d; absent = expected
          git add data/reflexes/factor_attention/firings.jsonl || true  # absent until first factor_attention firing
          git add site/factordata/dna_class.json
          if git diff --cached --quiet; then echo "no factor intelligence changes"; exit 0; fi
          git commit -m "factor-intelligence: nightly state artifact + pool $(date -u +%F)"
          # best-effort push (own files -> rebases clean against engine/factor_series)
          PUSH_ALARM=420
          push_retry_init "factor intelligence"
          while push_attempt; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if perl -e 'alarm 420; exec @ARGV or die' -- git pull --rebase --autostash -X theirs origin main && push_autostash_ok; then
              if push_do; then echo "pushed factor intelligence outputs on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning::could not push factor intelligence after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal)"

  # ── Oracle Rotation Time Machine feed (OFF-RENDER) ─────────────────────────
  # The Time Machine (site/subsector_rotation.html) reads site/oracledata/tm_*.json.
  # That feed is rebuilt by build_oracle_timemachine, which needs the oracle PANEL +
  # EPISODE parquets. build_oracle_panel is explicitly FORBIDDEN on the render path
  # (needs the heavy massive_stock_day store; a missing PIT parquet hard-crashes), so
  # the render `engine` job skips the export (--skip-timemachine) and this dedicated
  # off-render job owns the rebuild + commit. Every other input (PIT membership,
  # constituents, yahoo, themes_tree, baskets) is committed; only massive_stock_day
  # is fetched from R2 (engine publishes it earlier this run).
  # needs: engine → today's massive_stock_day is in R2 before we fetch. Off the render
  # critical path: `publish` needs only engine, so a slow/failed rebuild here can never
  # block go-live; the feed lands on main for the next deploy (<=1-run stale, same
  # contract as stock_briefs). Before this job existed the export FAILED (rc=1) every
  # render and the committed feed sat frozen at its last manual rebuild.
  oracle_offrender:
    needs: engine
    if: always()
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: fetch massive_stock_day store from R2 (the one heavy oracle input not committed)
        if: always()
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # No-op (exit 0) when creds absent; panel build then uses whatever store is on the
        # runner and the freshness guard below flags any resulting staleness.
        run: python -m scripts.fetch_r2 --dirs massive_stock_day || echo "::warning::massive_stock_day R2 fetch failed (non-fatal — panel build may use stale/partial store)"
      - name: rebuild oracle panels + episodes + Time Machine feed
        # Strict order: build_oracle_episodes reads panel_{tier}.parquet; build_oracle_timemachine
        # reads both panels + episodes. Panel/episode failures are warned; the TM export failing
        # is a loud ::error:: (feed won't refresh). The freshness guard is the final tripwire.
        run: |
          set +e
          python -m scripts.build_oracle_panel --tier all;    rc1=$?
          python -m scripts.build_oracle_episodes --tier all; rc2=$?
          python -m scripts.build_oracle_timemachine;         rc3=$?
          if [ "$rc1" -ne 0 ]; then echo "::warning title=oracle_panel::rc=$rc1 (panels may be stale)"; fi
          if [ "$rc2" -ne 0 ]; then echo "::warning title=oracle_episodes::rc=$rc2 (episode overlay may be stale)"; fi
          if [ "$rc3" -ne 0 ]; then echo "::error title=oracle_timemachine::export rc=$rc3 — Time Machine feed NOT refreshed"; fi
          exit 0
      - name: rebuild oracle ratio lens feed (RL-R13 — off-render, non-fatal)
        env:
          COLLECT_LANE: nightly
        run: python -m scripts.build_oracle_ratio_lens || echo "::warning::ratio_lens build failed (non-fatal — surface keeps last artifact)"
      - name: rebuild washout counter-read feed (RC-R11 — off-render, non-fatal)
        env:
          COLLECT_LANE: nightly
        run: python -m scripts.build_oracle_washout_counterread || echo "::warning::washout_counterread build failed (non-fatal — surface keeps last artifact)"
      - name: publish oracle panels to R2 (refreshes render-path sponsorship inputs)
        if: always()
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.publish_oracle_panels || echo "::warning::publish_oracle_panels failed (non-fatal — sponsorship keeps last R2 panels)"
      - name: Time Machine freshness tripwire (loud — the feed must advance daily)
        # Reads the just-built manifest; date_to older than 4 calendar days means the store
        # fetch or panel build produced stale data. Loud, never silent-rot; never blocks.
        run: |
          python - <<'PY' || echo "::warning::TM freshness guard errored (non-fatal)"
          import json, datetime, pathlib, sys
          mf = pathlib.Path("site/oracledata/tm_manifest.json")
          if not mf.exists():
              print("::error::tm_manifest.json missing — Time Machine feed not built"); sys.exit(0)
          m = json.loads(mf.read_text())
          today = datetime.date.today()
          for tier, info in (m.get("tiers") or {}).items():
              dt = info.get("date_to")
              if not dt:
                  print(f"::warning::TM tier {tier}: date_to is null"); continue
              age = (today - datetime.date.fromisoformat(dt)).days
              line = f"tier {tier}: date_to={dt} ({age}d old)"
              print(f"::error::TM STALE — {line}" if age > 4 else f"TM fresh — {line}")
          PY
      - name: commit oracle Time Machine feed + ratio lens
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/oracledata/ data/oracle/ratio_lens_ledger.jsonl
          # washout_counterread_ledger.jsonl is only written on days the signal FIRES
          # (build_oracle_washout_counterread.py show=True); on non-firing days it is absent
          # and a hard `git add` exits 128, aborting this whole step (this failed the nightly
          # on 2026-07-13 and 2026-07-14). The commit is gated below by `git diff --cached
          # --quiet`, so tolerating the file's absence is safe.
          git add data/oracle/washout_counterread_ledger.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then echo "no oracle Time Machine or ratio lens changes"; exit 0; fi
          git commit -m "oracle-tm: nightly Time Machine feed + ratio lens refresh $(date -u +%F)"
          # best-effort push (own files -> rebases clean; no other job writes site/oracledata/)
          PUSH_ALARM=420
          push_retry_init "oracle Time Machine feed"
          while push_attempt; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if perl -e 'alarm 420; exec @ARGV or die' -- git pull --rebase --autostash -X theirs origin main && push_autostash_ok; then
              if push_do; then echo "pushed oracle Time Machine feed on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning::could not push oracle Time Machine feed after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal)"

  # ── TLT-R2: Technical Lab data refresh (off-render) ─────────────────────
  # build_tech_lab_data.py is heavy (231 tickers × 195 signals, ~57 min) and
  # writes ONLY site/factordata/tech_screener.json + tech_lab.json (+ the
  # optional site/factordata/tech_events/ subtree when that sibling PR lands).
  # build_tech_confluence.py (multi-signal combo miner, 654.4s ≈ 11 min measured
  # end-to-end on the full universe — the "~8 min" this comment used to claim is
  # stale) runs after it → site/factordata/tech_confluence.json.
  # Kept off the main render path so it never adds to the ~67min render budget.
  # Needs: engine (data/stocks/ parquets, site/factordata/us_standouts.json).
  tech_lab_offrender:
    needs: engine
    if: always()
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 120    # was 40 — EVERY nightly 2026-07-19→07-26 was CANCELLED at exactly the 40m cap, mid-way through the first heavy step, so steps 2-5 (incl. the confluence-screener page render AND the commit) were skipped and NOTHING published for 8 days. Cause: #3013 (merged 2026-07-19T01:40, ~4.5h before #3061 added the screener render here) expanded the single-pass build from 64 signals to 195 on a 231-ticker universe — a ~3x workload increase with no re-budget. Measured from the 07-26 job log: 50 tickers/12m28s then 50/11m50s ≈ 14.6s/ticker → 231 tickers ≈ 56m for build_tech_lab_data alone. Whole-job worst case: checkout up to ~15m (the 14k-file tree, see the engine job's note) + 57m lab data + 11m combo miner + ~1m screener page + ~2m m2_profiles + up to ~10m commit/push-retry band ≈ 96m. 120 clears that with headroom. The combo-miner figure is measured end-to-end, not inherited and not extrapolated: this job's own comment claimed "~8 min", and a full 2026-07-27 run on the runner host logged `panel: 323.4s` + `mine_long: 187.7s` + `mine_short: 140.9s` + `artifact: 1.7s` = **654.4s ≈ 11m**. Note mine_short is ~25% CHEAPER than mine_long (58 vs 59 legs but far fewer surviving combos) — an earlier symmetry estimate put the total at ~13m, so even the arithmetic shortcut was wrong. A stale step-cost label is precisely what produced this outage; re-measure, never inherit, and never extrapolate one half from the other. NOTE the per-step `set +e … exit 0` wrappers make a *script* error non-fatal but do NOTHING for a job timeout: the cap hard-cancels the running step, skips every later step, and the `::warning` alarm the step would have printed never fires — the job just reports "cancelled", which reads like this repo's known-benign cancellations. That is why an 8-day publish outage went unnoticed. If the signal count or universe grows again, re-measure and re-budget HERE.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: rebuild Technical Lab screener + lab data (195-signal, ~231-ticker, ~57 min)
        run: |
          set +e
          python -m scripts.build_tech_lab_data; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=tech_lab_data::build_tech_lab_data rc=$rc (artifacts may be stale)"
          fi
          exit 0
      - name: rebuild Technical Lab combo miner (tech_confluence, ~8 min)
        run: |
          set +e
          python scripts/build_tech_confluence.py; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=tech_confluence::build_tech_confluence rc=$rc (combo artifact may be stale)"
          fi
          exit 0
      - name: render free confluence screener page (+ share card)
        run: |
          set +e
          python -m scripts.build_confluence_screener; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=confluence_screener::build_confluence_screener rc=$rc (page may be stale)"
          fi
          exit 0
      - name: build M2 VWAP/volume-profile level cache (~1-2 min)
        run: |
          set +e
          python scripts/build_m2_profiles.py; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=m2_profiles::build_m2_profiles rc=$rc (M2 artifact may be stale)"
          fi
          exit 0
      # DELIBERATELY NOT `if: always()`, unlike the engine and ledger_heartbeat
      # commit steps. Those salvage completed work when the job is cancelled;
      # here that would be a downgrade. build_tech_lab_data writes its payloads
      # with a bare `json.dump` into an open handle at the very END of the ~57min
      # pass (scripts/build_tech_lab_data.py:735-820) — no temp-file-and-rename —
      # so a cancel landing inside that narrow write window leaves a TRUNCATED
      # tech_screener.json / tech_lab.json on disk, and an always() commit would
      # publish it to the live site. Committing nothing beats committing corrupt
      # JSON. Make the writes atomic first if you want always() here.
      - name: commit Technical Lab artifacts
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/factordata/tech_screener.json site/factordata/tech_lab.json
          if [ -f site/factordata/tech_confluence.json ]; then
            git add site/factordata/tech_confluence.json
          fi
          if [ -f site/factordata/m2_profiles.json ]; then
            git add site/factordata/m2_profiles.json
          fi
          # tech_events is written by a sibling PR (TLT-W3); pick it up once present.
          if [ -d site/factordata/tech_events ]; then
            git add site/factordata/tech_events
          fi
          if [ -f site/confluence_screener.html ]; then
            git add site/confluence_screener.html
          fi
          if [ -f site/premiumdata/confluence_screener.json ]; then
            git add site/premiumdata/confluence_screener.json
          fi
          if [ -f site/og/confluence_screener.png ]; then
            git add site/og/confluence_screener.png
          fi
          if git diff --cached --quiet; then echo "no tech-lab artifact changes"; exit 0; fi
          git commit -m "tech-lab: nightly 64-signal screener + lab refresh $(date -u +%F)"
          # best-effort rebase-push (own files → clean rebases; no other job writes these paths)
          PUSH_ALARM=420
          push_retry_init "tech-lab artifacts"
          while push_attempt; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if perl -e 'alarm 420; exec @ARGV or die' -- git pull --rebase --autostash -X theirs origin main && push_autostash_ok; then
              if push_do; then echo "pushed tech-lab artifacts on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning::could not push tech-lab artifacts after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal)"

  # SA-W1 — US standout attribution organ (off-render, ~40 min budget)
  # Reads the committed retro_grades.parquet produced by the engine job, runs
  # deterministic two-axis attribution, writes evidence packs, stratified scoreboard,
  # coverage monitor, missed-mover census, upstream concordance, and the US fitness
  # card. Never touches asia-owned paths. Must NOT gate publish.
  # Pattern: oracle_offrender / tech_lab_offrender (needs: engine, if: always()).
  standout_audit_us:
    needs: engine
    if: always()
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: SA-W1 — US standout attribution + fitness card
        run: |
          set +e
          python -m engine.standout_audit --us; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=standout_audit_us::rc=$rc (attribution artifacts may be stale)"
          fi
          exit 0
      - name: Prophet Trade Memory — accrue matured pick autopsies
        # Observation/reflection only: this explicitly arms the old metabolism
        # guard for this one process, but the writer remains research-only and
        # cannot rank, size, gate, suppress, or escalate a live signal.
        env:
          AUTONOMY_PAUSED: "false"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          CLAUDE_CODE_OAUTH_TOKEN_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python -m scripts.run_prophet_pick_autopsies --market us; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=prophet_trade_memory::pick autopsy lane failed (rc=$rc)"
          fi
          exit 0
      - name: Prophet Trade Memory — review private operator episodes
        # Personal facts/autopsies remain in owner-scoped Supabase rows. The
        # runner prints counts only and commits no private artifact.
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_OPERATOR_USER_ID: ${{ secrets.SUPABASE_OPERATOR_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          CLAUDE_CODE_OAUTH_TOKEN_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python -m scripts.run_trade_memory --cap 8; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=prophet_trade_memory::private episode lane failed (rc=$rc)"
          fi
          exit 0
      - name: Prophet W1 — US track record page
        run: |
          set +e
          python -m scripts.build_track_record_page; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=build_track_record_page::rc=$rc (track record page may be stale)"
          fi
          exit 0
      - name: Prophet W2 — cross-market governor
        run: |
          set +e
          python -m engine.neuralweb.prophet_governor; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=prophet_governor::rc=$rc (prophet_status/suggestions may be stale)"
          fi
          exit 0
      - name: restore massive_stock_day store from R2 (hot-tape pack wide-tail source)
        # engine/marketing/hot_tape_pack.py scans this store as the ~20k-name WIDE TAIL,
        # unioned freshest-source-per-ticker with the curated data/baskets/ohlcv +
        # data/stocks trees. This job's checkout never held it, so the nightly pack has
        # been quietly covering only the ~3k curated names — the pack degrades by design
        # (a name present only in the massive store just drops out), which is exactly why
        # nothing ever reported it. Read-only here: no publish-back, and the marketing
        # step is deliberately NOT gated on this — a failed restore costs coverage, never
        # the job. `needs: engine` (which needs collect) puts this after the collect job's
        # publish, so the restore picks up tonight's tip.
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.fetch_r2 --dirs massive_stock_day --workers 24
      - name: Marketing — NW lobe governor
        continue-on-error: true
        env:
          # Arms the nightly LLM copywriter lane (persona posts). Double-guarded
          # (config copywriter.llm.enabled AND this env var); any LLM failure or
          # per-post validation failure falls back to the deterministic templates.
          MARKETING_LLM_ENABLED: "1"
          # …and the credentials that arming actually needs. WITHOUT THESE THE
          # FLAG ABOVE IS A LIE: lib.config.secret() reads env only, so
          # llm_auth.build_providers() returned [] on every nightly,
          # write_posts_llm hit `if not providers: return None`, and EVERY post
          # silently fell back to the deterministic templates. The whole voice
          # layer — personas, copy laws, the "sound like a real person" prompt —
          # had never once run in production, which is what made the flagship
          # account read machine-written (2026-07-26 incident). copywriter.py now
          # also emits a ::warning:: when armed-but-credential-less, so this
          # cannot fail silently again.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          CLAUDE_CODE_OAUTH_TOKEN_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          METAB_KEYS_ENABLED: ${{ vars.METAB_KEYS_ENABLED }}
          # Emits the current D1 content-plan items into the outbox queue
          # (status=queued). Posting stays gated by approval + MARKETING_PUBLISH_ENABLED.
          MARKETING_OUTBOX_ENABLED: "1"
          # D02 chart-image pipeline: content_studio uploads the rendered PNG to the
          # public R2 data plane so the post can attach a chart (Buffer hosts no
          # uploads; X rejects SVG). Same creds the oracle/data lanes use — absent
          # them media_publish no-ops and the post degrades to text-only.
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set +e
          python -m scripts.build_marketing; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=marketing_governor::rc=$rc (marketing_state/lobe may be stale)"
          fi
          exit 0
      # Ad Central Plane O: fold the browser's ad_exposure beacons into the arena
      # ledgers (research/AD_CENTRAL_MASTERPLAN.md §2). Nightly is the SOLE advancer
      # of a forward ledger, so this is the only writer — an intraday lane may
      # compute with --dry-run and must never write.
      #
      # The Management API PAT pair, same one scripts/geo_enrich.py uses. WITHOUT
      # THEM THIS IS A NO-OP, not a failure: the script prints "skipping" and exits
      # 0, so provisioning the secret is what turns the lane on. (daily.yml carries
      # SUPABASE_SERVICE_KEY for other steps — that is a DIFFERENT credential and
      # does not reach the Management API's SQL endpoint.)
      - name: ad central — ingest split-test exposures
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set +e
          python -m scripts.ad_ingest_run --days 7; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=ad_ingest::rc=$rc (arena ledgers may not have advanced)"
          fi
          exit 0
      # Persona memory consolidation (XG-W3). Emission-time counters — phrase
      # fatigue, open promises, relationship touches — accumulate all day in the
      # GITIGNORED host spool under data/marketing/personas_host/ (zero
      # tracked-repo writes intraday, the same posture as the outbox's
      # items-host.jsonl). Nightly is the SOLE advancer of the tracked ledgers
      # under data/marketing/personas/, so this is the only writer — charter §2
      # amendment 13. It is idempotent: records dedup on a stable key, because a
      # retried nightly that double-counted would silently TIGHTEN every
      # per-quirk frequency cap those counters bound.
      #
      # A host with no spool is a no-op that exits 0 and prints a ::notice, not a
      # failure — most runners never emit anything.
      - name: marketing — consolidate persona memory
        env:
          MARKETING_PERSONA_MEMORY_ENABLED: "1"
        run: |
          set +e
          python -m engine.marketing.persona_memory; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=persona_memory::rc=$rc (persona ledgers may not have advanced)"
          fi
          exit 0
      # XG-W6 learning loop. TWO ordered actions in one step, and the order is
      # load-bearing: labels.consolidate advances the tracked label ledger +
      # scorecard from the LIVE metrics poll (data/marketing/post_metrics.jsonl,
      # written by marketing-publish.yml), the reply desk's host store, and the
      # gitignored intraday spool; health_monitor.run then READS that store to
      # grade every account and run the network tripwire. Evaluating first would
      # grade yesterday's corpus and call it today's health.
      #
      # Nightly is the SOLE advancer of data/marketing/learning/ (charter §2
      # amendment 13). The host spool (data/marketing/learning_host/) is
      # gitignored and must never appear in a git add.
      #
      # A tripwire trip writes ONE HALT ROW PER IMPLICATED ACCOUNT — a halted
      # desk stops on both rails (publisher + reply export) while the other six
      # keep running. Only an operator clears a halt, from the admin health
      # panel. With no telemetry this is a clean no-op that exits 0.
      - name: marketing — labels + account health (XG-W6)
        env:
          MARKETING_LEARNING_ENABLED: "1"
        run: |
          set +e
          python -m scripts.marketing_learning_nightly; rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=marketing_learning::rc=$rc (label ledger / health report may not have advanced)"
          fi
          exit 0
      # XG-W6 learning artifacts get their OWN commit, not a ride on the
      # standout-audit subject line. These are marketing-desk safety and
      # measurement records — labels.jsonl, scorecard.json, health.json,
      # halts.json and the learned-rule version log — and a HALT landing under
      # "standout-audit-us: nightly US attribution" is a commit message that
      # actively misleads whoever goes looking for when a desk went dark.
      #
      # halts.json is also written by the operator's admin clear, which commits
      # it separately; last writer wins and both are recorded in the registry's
      # own log. The host spool (data/marketing/learning_host/) is gitignored
      # and must never appear here.
      - name: commit marketing learning artifacts (XG-W6)
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/marketing/learning 2>/dev/null || true
          if git diff --cached --quiet; then echo "no marketing learning changes"; exit 0; fi
          HALTED=$(python3 -c "import json,pathlib;p=pathlib.Path('data/marketing/learning/halts.json');d=json.loads(p.read_text()) if p.exists() else {};print(','.join(sorted(a for a,r in (d.get('accounts') or {}).items() if isinstance(r,dict) and r.get('state')=='halted')) or 'none')" 2>/dev/null || echo "unknown")
          # METADATA-ONLY PUSH (P0 d29e4dd44d/#4167, same shape as the chronicle
          # step): this push runs while the SIBLING data/marketing/ paths that
          # "commit standout audit US artifacts" broad-adds NEXT are still dirty
          # — a `pull --rebase --autostash` here could conflict its re-apply,
          # exit 0, and hand that step a marker-polluted tree. Replay in a temp
          # index and push the object id; the dirty tree is never touched.
          LEARNING_PARENT=$(git rev-parse HEAD)
          git commit -m "marketing-learning: labels + scorecard + desk health $(date -u +%F) (halted: ${HALTED})"
          LEARNING_COMMIT=$(git rev-parse HEAD)
          LEARNING_MESSAGE=$(git log -1 --format=%B "$LEARNING_COMMIT")
          PUSH_ALARM=420
          push_retry_init "marketing learning artifacts"
          while push_attempt; do
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            if LEARNING_PUBLISH=$(push_metadata_replay_commit "$LEARNING_PARENT" origin/main \
                "$LEARNING_COMMIT" "$LEARNING_MESSAGE" "${RUNNER_TEMP:-/tmp}/learning-replay.idx"); then
              if [ "$(git rev-parse "$LEARNING_PUBLISH^{tree}")" = "$(git rev-parse origin/main^{tree})" ]; then
                echo "marketing learning content already on origin/main — nothing to push"
                push_won; exit 0
              fi
              if push_do origin "$LEARNING_PUBLISH:refs/heads/main"; then
                echo "pushed marketing learning artifacts on attempt $PUSH_ATTEMPT (metadata replay — dirty marketing tree untouched)"
                push_won; exit 0
              fi
            else
              PUSH_FAIL_CLASS="rebase-conflict"
            fi
            push_backoff
          done
          push_lost
          echo "::warning title=marketing_learning::could not push learning artifacts (they advance again tomorrow)"
          exit 0
      - name: commit standout audit US artifacts
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/standout_audit/us_attribution.parquet 2>/dev/null || true
          git add data/standout_audit/us_evidence.jsonl 2>/dev/null || true
          git add data/standout_audit/us_audit_state.json 2>/dev/null || true
          git add data/standout_audit/pick_autopsies/us 2>/dev/null || true
          git add site/factordata/us_audit_scoreboard.json 2>/dev/null || true
          git add data/metabolism/fitness/standouts_us.json 2>/dev/null || true
          git add site/factordata/us_track_history.json 2>/dev/null || true
          git add site/us_track_record.html 2>/dev/null || true
          git add data/neuralweb/prophet_status.json 2>/dev/null || true
          git add data/neuralweb/prophet_suggestions.json 2>/dev/null || true
          git add data/neuralweb/marketing_state.json 2>/dev/null || true
          git add site/neuralwebdata/marketing_lobe.json 2>/dev/null || true
          git add data/marketing/sentinel_report.json 2>/dev/null || true
          git add data/marketing/content_plan.json 2>/dev/null || true
          git add data/marketing/hot_tape_pack.json 2>/dev/null || true
          git add data/marketing/cashtag_tiers.json 2>/dev/null || true
          git add data/marketing/radar_report.json 2>/dev/null || true
          git add data/marketing/opportunities.jsonl 2>/dev/null || true
          git add data/marketing/radar_plan_history.json 2>/dev/null || true
          git add data/marketing/outbox 2>/dev/null || true
          # Ad Central arena ledgers — forward-only, advanced by the ingest step above.
          git add data/marketing/ad_central 2>/dev/null || true
          # Persona memory ledgers (XG-W3) — forward-only, advanced by the
          # consolidate step above. The host spool (data/marketing/personas_host/)
          # is gitignored and must never appear here.
          git add data/marketing/personas 2>/dev/null || true
          if git diff --cached --quiet; then echo "no standout audit US changes"; exit 0; fi
          # Fail-closed conflict gate (P0 d29e4dd44d/#4167): the marketing
          # learning push above runs while these paths sit dirty — if its pull
          # machinery ever regresses to a conflicted autostash apply, this add
          # would stage the markers. Heal display paths, die on ledger paths.
          push_staged_heal data/ site/ || exit 1
          if git diff --cached --quiet; then echo "no standout audit US changes after conflict heal"; exit 0; fi
          git commit -m "standout-audit-us: nightly US attribution + fitness card $(date -u +%F)"
          # best-effort rebase-push (own files — no other job writes these paths)
          PUSH_ALARM=420
          push_retry_init "standout audit US artifacts"
          while push_attempt; do
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if perl -e 'alarm 420; exec @ARGV or die' -- git pull --rebase --autostash -X theirs origin main && push_autostash_ok; then
              if push_do; then echo "pushed standout audit US artifacts on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning::could not push standout audit US artifacts after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal)"

  # AI stock-research briefs = ~30 DeepSeek calls (~20 min) — the heaviest single
  # step in the build, and what pushed the engine job past its timeout. build_site
  # now only writes the target ticker list (data/catalyst/brief_targets.json); the
  # LLM calls run HERE, isolated and in parallel with `publish`. The stock page
  # fetches site/stockbrief/<T>.json client-side, so the briefs land on main for
  # the next run (<=1-run stale is fine) and the LLM never gates the daily deploy.
  # `publish` needs ONLY engine, so a slow/failed briefs job can't block go-live.
  stock_briefs:
    needs: engine
    if: always()
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 45
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      # the per-stock technical-signal leg reads constituent closes; restore-only.
      - name: restore breadth (S&P 500) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-briefs-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-briefs-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-briefs-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: precompute AI stock briefs (build_stock_briefs)
        run: python -m scripts.build_stock_briefs || echo "stock briefs skipped (additive)"
      - name: commit stock briefs
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # site/stockbrief is gitignored for local-dev cleanliness but must be TRACKED
          # on main so the committed-tree deploy ships it (-f overrides the ignore).
          git add -f site/stockbrief 2>/dev/null || true
          git add data/catalyst/stockbrief_cache 2>/dev/null || true
          # stock_desk (T9): the accountable-lean notes + the graded track record are written
          # by build_stock_briefs in THIS job (after the engine job's force-add of site/stockdata
          # already ran), so they must be force-added HERE or they never land on main → the
          # aidesk_lean.js panel 404s. The ledger (data/stock_desk, NOT gitignored) must also be
          # committed or the track record can never accumulate past-due leans. (Same gitignore/
          # force-add trap as the per-market stock libraries.)
          git add data/stock_desk 2>/dev/null || true
          if git diff --cached --quiet; then echo "no stock-brief changes"; exit 0; fi
          git commit -m "stock-briefs: AI research briefs + accountable leans $(date -u +%F)"
          # best-effort push (own files → rebases clean against engine/factor_series)
          PUSH_ALARM=420
          push_retry_init "stock briefs"
          while push_attempt; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if perl -e 'alarm 420; exec @ARGV or die' -- git pull --rebase --autostash -X theirs origin main && push_autostash_ok; then
              if push_do; then echo "pushed stock briefs on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning::could not push stock briefs after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal — the stock page falls back to the last committed briefs)"
      - name: sync stock_briefs stockdata writes to R2 (post-flip freshness)
        if: always()
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # stock_briefs writes stockdata/ai_desk_notes.json + ai_desk_track.json AFTER the engine
        # job's R2 upload, so sync them here or the shim fetches a stale copy from R2.
        # --no-manifest: this checkout holds ONLY the two git-committed stockdata files (the
        # heavy store is R2-only), so a manifest built here would clobber the engine job's
        # full ~5000-name one — and bulk consumers prune against that list.
        run: python -m scripts.publish_r2 --dirs stockdata --no-manifest || echo "::warning::R2 stockdata sync failed (non-fatal)"

  # ── Neural Web W7b: cortex deliberation job ──────────────────────────────
  # Runs after the engine job; own checkout + own commit lane.
  # A slow or failed cortex can never gate the deploy (publish needs: engine, not cortex).
  # Shadow probation: A2 refused today — attention queue and memo are shadow-tier.
  cortex:
    needs: engine
    if: always()
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
      CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
      CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
      CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
      CLAUDE_CODE_OAUTH_TOKEN_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
      CLAUDE_CODE_OAUTH_TOKEN_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
      METAB_KEYS_ENABLED: ${{ vars.METAB_KEYS_ENABLED }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Dedicated metered API key for the cortex job — decouples deliberation from
      # the shared OAuth session quota (root cause of 429 rate_limit_error runs).
      # OPERATOR ACTION: create a GitHub secret CORTEX_ANTHROPIC_API_KEY with a
      # metered Anthropic API key.  Absent/empty = transparent fallback to the
      # shared ANTHROPIC_API_KEY above; nothing breaks if the secret is not set.
      CORTEX_ANTHROPIC_API_KEY: ${{ secrets.CORTEX_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      # Factor Intelligence P2 — registration persistence fix. Operator hypothesis
      # registrations MUST be written in the tree that commits machine_registry.jsonl
      # (this job): the factor_ops.yml dispatch actions wrote to a different
      # workflow's checkout and were wiped by the next fresh checkout (git clean)
      # before any commit step could see them — same cross-job visibility class as
      # the factor_attention firings hole (PR #1583). The W27 h1-h3 and W28 h4-h5
      # dispatch registrations were both lost this way. Idempotent (skips
      # already-registered hypothesis text); --defer-on-budget exits 0 when the
      # metabolism weekly budget (3/ISO-week) can't absorb a batch, so the step
      # retries nightly until a week with budget. Runs BEFORE cortex deliberation
      # so operator batches claim budget ahead of cortex-proposed hypotheses.
      - name: build context risk lens (nw-context-intelligence W3, R-CI7, display-only)
        # Personality risk lens: board/universe archetype exposure profile x regime matrices.
        # All inputs git-tracked (us_standouts, stock_personality, regime_timeline).
        # Outputs: data/neuralweb/context_risk.json + site/neuralwebdata/context_risk.json.
        # Covered by the narrow git add block in 'commit cortex outputs' below. Always exits 0.
        run: |
          set +e
          python -m scripts.build_context_risk > "$RUNNER_TEMP/context_risk.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/context_risk.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=build_context_risk::rc=$rc (non-fatal)"; fi
          exit 0
      - name: register factor hypotheses (P2 — idempotent, budget-deferred)
        run: |
          set +e
          python -m scripts.register_factor_hypotheses --only h1,h2,h3 --defer-on-budget > "$RUNNER_TEMP/factor_hyp_reg.log" 2>&1; rc1=$?
          python -m scripts.register_factor_hypotheses --only h4,h5 --defer-on-budget >> "$RUNNER_TEMP/factor_hyp_reg.log" 2>&1; rc2=$?
          cat "$RUNNER_TEMP/factor_hyp_reg.log"
          if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then
            echo "::warning title=register_factor_hypotheses::rc=($rc1,$rc2) (non-fatal)"
          fi
          exit 0
      - name: build context candidates (W4 — nightly context scanner, CORTEX JOB)
        # R-CI5: three FROZEN v1 template families (T1/T2/T3) with declared budget.
        # Refuses to run without budget row (GovernorRefusal); budget is idempotently
        # registered on first run.  Output is display/context tier only (R-CI6).
        run: |
          set +e
          python -m scripts.build_context_candidates > "$RUNNER_TEMP/context_candidates.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/context_candidates.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=context_candidates::rc=$rc (non-fatal — last committed context_candidates.jsonl remains valid)"; fi
          exit 0
      - name: cortex deliberation (Opus-class tool loop — attention queue, memo, hypothesis metabolism)
        run: |
          set +e
          python -m engine.neuralweb.cortex > "$RUNNER_TEMP/cortex.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/cortex.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=cortex::rc=$rc (non-fatal — last committed outputs remain valid)"; fi
          exit 0
      - name: grade cortex attention + A2 earn-in (W7b PR2)
        run: |
          set +e
          python -m scripts.grade_cortex_attention > "$RUNNER_TEMP/cortex_grade.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/cortex_grade.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=cortex_grade::rc=$rc (non-fatal)"; fi
          exit 0
      # P1-D: grade factor_attention reflex firings. Parallel grader to grade_cortex_attention;
      # owns data/reflexes/factor_attention/grades.jsonl + probation.json (NOT cortex paths).
      - name: grade factor attention + A2 earn-in (P1-D)
        run: |
          set +e
          python -m scripts.grade_factor_attention > "$RUNNER_TEMP/factor_attention_grade.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/factor_attention_grade.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=factor_attention_grade::rc=$rc (non-fatal)"; fi
          exit 0
      - name: evaluate due cortex hypotheses (W7b PR2)
        run: |
          set +e
          python -m scripts.evaluate_cortex_hypotheses > "$RUNNER_TEMP/cortex_eval.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/cortex_eval.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=cortex_eval::rc=$rc (non-fatal)"; fi
          exit 0
      - name: refresh neuralweb health — cortex section (PR-C)
        if: always()
        run: |
          set +e
          python -m scripts.build_neuralweb_health --refresh-cortex > "$RUNNER_TEMP/nw_health_refresh.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/nw_health_refresh.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=nw_health_refresh::rc=$rc (non-fatal — keeping previous health.json)"; fi
          exit 0
      - name: build neuralweb daily brief — finalize (PR-D, cortex phase)
        if: always()
        # PR-D cortex phase: rebuild brief with phase='final' using post-refresh-cortex
        # health.json, rewrite both copies, and upsert compact history row keyed by as_of.
        # Fail-open: any missing input → brief with explicit gap notes, exit 0.
        run: |
          set +e
          python -m scripts.build_neuralweb_brief --finalize > "$RUNNER_TEMP/nw_brief_finalize.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/nw_brief_finalize.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=nw_brief_finalize::rc=$rc (non-fatal — keeping previous daily_brief.json)"; fi
          exit 0
      - name: record orchestrator run log (W-AI)
        if: always()
        # W-AI: one deterministic run-log entry per pipeline run (+ every-N-runs review) composed
        # from health.json + daily_brief.json + mastermind_feedback_summary.json — runs AFTER the
        # brief finalize so it records the run's final state. Fail-open, exit 0.
        run: |
          set +e
          python -m scripts.build_orchestrator_log --workflow daily > "$RUNNER_TEMP/orchestrator_log.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/orchestrator_log.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=orchestrator_log::rc=$rc (non-fatal)"; fi
          exit 0
      - name: commit cortex outputs
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # Own commit lane (W7b PR2 + P1-D): all cortex + factor_attention subtrees — STAGING LAW
          git add data/reflexes/cortex_attention/ 2>/dev/null || true
          git add data/reflexes/factor_attention/grades.jsonl 2>/dev/null || true
          git add data/reflexes/factor_attention/probation.json 2>/dev/null || true
          git add data/neuralweb/cortex/ 2>/dev/null || true
          git add data/neuralweb/machine_registry.jsonl 2>/dev/null || true
          git add data/neuralweb/governance.jsonl 2>/dev/null || true
          # trial_ledger: metabolism declares 1 budget row per accepted registration
          # (log_declared_budget family='cortex'); unstaged it dies with this checkout
          # and the DSR haircut undercounts.
          git add data/trial_ledger.jsonl 2>/dev/null || true
          git add site/neuralweb/ 2>/dev/null || true
          # PR-C: NW health refresh (cortex_source=current_run) — two-phase health surface
          git add data/neuralweb/health.json 2>/dev/null || true
          git add site/neuralwebdata/health.json 2>/dev/null || true
          # PR-D: NW daily brief finalize (phase=final + history row) — two-phase brief surface
          git add data/neuralweb/daily_brief.json 2>/dev/null || true
          git add site/neuralwebdata/daily_brief.json 2>/dev/null || true
          git add data/neuralweb/daily_brief_history.jsonl 2>/dev/null || true
          # W-AI: orchestrator run log + N-run reviews (recorded in THIS job — same commit lane)
          git add data/neuralweb/orchestrator_runlog.jsonl 2>/dev/null || true
          git add data/neuralweb/orchestrator_reviews.jsonl 2>/dev/null || true
          git add site/neuralwebdata/orchestrator_runlog.json 2>/dev/null || true
          # R-CI7: nw-context-intelligence W3 personality risk lens (display-only)
          git add data/neuralweb/context_risk.json 2>/dev/null || true
          git add site/neuralwebdata/context_risk.json 2>/dev/null || true
          # W4 context scanner: narrow git-add of context_candidates.jsonl only (R-CI6)
          git add data/neuralweb/context_candidates.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then echo "no cortex output changes"; exit 0; fi
          git commit -m "cortex: attention grades + A2 earn-in + hypothesis metabolism $(date -u +%F)"
          # Retry-rebase push loop (stock_briefs pattern)
          PUSH_ALARM=420
          push_retry_init "cortex outputs"
          while push_attempt; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            # F3 FIX: plain rebase (no -X theirs) so an adjacent-append conflict
            # on shared JSONL paths (trial_ledger, governance, machine_registry)
            # surfaces as a conflict → the retry re-runs cleanly instead of
            # silently dropping the causal job's committed rows.
            if perl -e 'alarm 420; exec @ARGV or die' -- git pull --rebase --autostash origin main && push_autostash_ok; then
              if push_do; then echo "pushed cortex outputs on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning::could not push cortex after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal — downstream reads last committed)"

  # ──────────────────────────────────────────────────────────────────────────
  # CHF W3 — Causal Hypothesis Factory: nightly drift + weekly bounded battery
  # CHF-R11: runs AFTER engine (needs: engine, if: always(), timeout-minutes: 45)
  # Never writes asia-owned paths. Never touches Article-2 surfaces. Never reads
  # kernel cells. Entry-quality target family gated on REPLAY_BOARDED_PATH var.
  # ──────────────────────────────────────────────────────────────────────────
  causal:
    needs: engine
    if: always()
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 45
    env:
      REPLAY_BOARDED_PATH: ${{ vars.REPLAY_BOARDED_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: build causal feature inventory (CHF W1 refresh, nightly)
        # Refreshes config/causal_priors.yml kill-mask mirror and
        # data/neuralweb/causal_feature_inventory.json. Non-fatal (exits 0).
        run: |
          set +e
          python -m scripts.build_causal_inventory > "$RUNNER_TEMP/causal_inventory.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/causal_inventory.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=build_causal_inventory::rc=$rc (non-fatal)"; fi
          exit 0
      - name: build causal frontier + surprise queue + lab state (CHF W3 nightly, CHF-R8)
        # Drift-only step: no batteries, no TrialLedger writes, no LLM.
        # Produces: causal_frontier.json, causal_surprise_queue.jsonl,
        #           causal_lab_state.json (data/ + site/ copies). Non-fatal.
        run: |
          set +e
          python -m scripts.build_causal_frontier > "$RUNNER_TEMP/causal_frontier.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/causal_frontier.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=build_causal_frontier::rc=$rc (non-fatal)"; fi
          exit 0
      - name: build causal confluence audit (CHF W6 nightly, CHF-R10)
        # Anti-mirage auditor: deterministic rule application over committed
        # artifacts. Zero R-ORTH recomputation (RUL-ORTH-9); zero LLM content.
        # Reads: causal_feature_inventory.json, confluence_graph.json,
        #        covariance_spine.json, causal_priors.yml, causal_mechanisms.jsonl.
        # Outputs: data/neuralweb/causal_confluence_audit.json. Non-fatal.
        run: |
          set +e
          python -m scripts.build_causal_confluence_audit > "$RUNNER_TEMP/causal_audit.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/causal_audit.log"
          if [ "$rc" -ne 0 ]; then echo "::warning title=build_causal_confluence_audit::rc=$rc (non-fatal)"; fi
          exit 0
      - name: run causal battery (CHF W3 weekly, CHF-R8, Tuesday gate, K<=40)
        # Weekly bounded battery over top-K unexplored/accruing frontier cells.
        # Tuesday-gated (date +%u == 2): no-op on other days.
        # CHF-R5 estimator suite: HAC, cross-ticker permutation, lag placebo,
        # time-shift placebo (DT-R14), circular block bootstrap, era split (DT-R16).
        # Non-fatal (exits 0 even if battery fails).
        run: |
          set +e
          if [ "$(date +%u)" = "2" ]; then
            python -m scripts.build_causal_edges --weekly > "$RUNNER_TEMP/causal_edges.log" 2>&1; rc=$?
            cat "$RUNNER_TEMP/causal_edges.log"
            if [ "$rc" -ne 0 ]; then echo "::warning title=build_causal_edges::rc=$rc (non-fatal)"; fi
          else
            echo "causal battery: skipping (not Tuesday, date +%u=$(date +%u))"
          fi
          exit 0
      - name: run causal LLM brainstorm (CHF W5 weekly, Tuesday gate, auto_loop gate)
        # Weekly LLM brainstorm step (CHF-R8): runs AFTER build_causal_edges.
        # Tuesday-gated (date +%u == 2): the full run happens Tuesdays only.
        # The runner checks auto_loop in config/causal_llm.yml; if false,
        # degrades to pack-only mode (operator-paste workflow; no LLM calls).
        # Identity: CLAUDE_CODE_OAUTH_TOKEN ONLY (operator ruling 2026-07-09,
        # overriding the W-AUTO service-key line for CHF — masterplan §9).
        # Non-Tuesday nights run --status-only: refresh causal_llm_lane.json
        # from config truth (no pack, no LLM) so the lane artifact never
        # misreports the auto_loop state between weekly runs (stale-lane fix
        # 2026-07-11: the #2061 arming was invisible in the artifact for days).
        # Non-fatal (exits 0 even if LLM chain fails — pack-only degradation is expected).
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          CLAUDE_CODE_OAUTH_TOKEN_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
          METAB_KEYS_ENABLED: ${{ vars.METAB_KEYS_ENABLED }}
        run: |
          set +e
          if [ "$(date +%u)" = "2" ]; then
            python -m scripts.run_causal_brainstorm --trigger scheduled > "$RUNNER_TEMP/causal_brainstorm.log" 2>&1; rc=$?
            cat "$RUNNER_TEMP/causal_brainstorm.log"
            if [ "$rc" -ne 0 ]; then echo "::warning title=run_causal_brainstorm::rc=$rc (non-fatal)"; fi
          else
            echo "causal LLM brainstorm: skipping full run (not Tuesday, date +%u=$(date +%u)); refreshing lane status"
            python -m scripts.run_causal_brainstorm --status-only > "$RUNNER_TEMP/causal_lane_status.log" 2>&1; rc=$?
            cat "$RUNNER_TEMP/causal_lane_status.log"
            if [ "$rc" -ne 0 ]; then echo "::warning title=run_causal_brainstorm_status::rc=$rc (non-fatal)"; fi
          fi
          exit 0
      - name: commit causal outputs (CHF-R11 narrow git-add)
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # CHF-R11 narrow git-add block (pre-written in masterplan)
          git add data/neuralweb/causal_feature_inventory.json 2>/dev/null || true
          git add data/neuralweb/causal_edges.jsonl data/neuralweb/causal_nulls.jsonl 2>/dev/null || true
          git add data/neuralweb/causal_mechanisms.jsonl 2>/dev/null || true
          git add data/neuralweb/causal_frontier.json data/neuralweb/causal_surprise_queue.jsonl 2>/dev/null || true
          git add data/neuralweb/causal_confluence_audit.json 2>/dev/null || true
          git add data/neuralweb/causal_lab_state.json site/neuralwebdata/causal_lab_state.json 2>/dev/null || true
          git add data/neuralweb/causal_brainstorm_runs.jsonl data/neuralweb/causal_llm_lane.json 2>/dev/null || true
          git add data/trial_ledger.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then echo "no causal output changes"; exit 0; fi
          git commit -m "causal: frontier drift + lab state $(date -u +%F)"
          # Retry-rebase push loop with --autostash (stranded-data law #1823)
          PUSH_ALARM=420
          push_retry_init "causal outputs"
          while push_attempt; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if perl -e 'alarm 420; exec @ARGV or die' -- git pull --rebase --autostash origin main && push_autostash_ok; then
              if push_do; then echo "pushed causal outputs on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning::could not push causal outputs after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal — downstream reads last committed)"

      - name: signal foundry forward accrual (SF-R4, nightly-ledger law)
        # Accrues realized (feature, target) rows for every registered Foundry spec
        # where today > registered_at (forward evidence only — SF-R4).
        # Non-fatal: exits 0 regardless of internal errors.
        run: |
          python -m scripts.signal_foundry_accrue > "$RUNNER_TEMP/sf_accrue.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/sf_accrue.log"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=signal_foundry_accrue::rc=$rc (non-fatal)"
          fi
          exit 0

      - name: commit signal foundry forward outputs (SF-R10 narrow git-add)
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # SF-R10 narrow git-add: only data/signal_foundry/forward and lane_status
          git add data/signal_foundry/forward 2>/dev/null || true
          git add data/signal_foundry/lane_status.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no signal foundry forward changes"; exit 0; fi
          git commit -m "signal-foundry: forward accrual $(date -u +%F)"
          # Retry-rebase push loop with --autostash (stranded-data law #1823)
          PUSH_ALARM=420
          push_retry_init "sf forward outputs"
          while push_attempt; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if perl -e 'alarm 420; exec @ARGV or die' -- git pull --rebase --autostash origin main && push_autostash_ok; then
              if push_do; then echo "pushed sf forward outputs on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning::could not push sf forward outputs after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal)"
          exit 0

  # Light advisory job: generates docs/ACTIVE_BUILD_MAP.md and
  # data/governance/active_builds.json — a map of open PRs, file collisions,
  # and recent merges for multi-agent session air-traffic control.
  # ADVISORY ONLY: fail-open, no merge gating, exit 0 even if gh errors.
  active_build_map:
    needs: collect
    if: always()
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: generate active build map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.build_active_build_map || echo "::warning::active_build_map generation failed (non-fatal — fail-open)"
      - name: commit active build map outputs
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ACTIVE_BUILD_MAP.md data/governance/active_builds.json
          if git diff --cached --quiet; then echo "no active build map changes"; exit 0; fi
          git commit -m "docs: active build map $(date -u +%F)"
          PUSH_ALARM=420
          push_retry_init "active build map"
          while push_attempt; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            perl -e 'alarm 120; exec @ARGV or die' -- git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if perl -e 'alarm 420; exec @ARGV or die' -- git pull --rebase --autostash -X theirs origin main && push_autostash_ok; then
              if push_do; then echo "pushed active build map on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning::could not push active build map after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal)"

  publish:
    # GitHub Pages can't serve a /site folder from a branch — deploy the
    # artifact instead (repo Settings -> Pages -> Source: GitHub Actions)
    needs: engine
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # CSP-W6: forward-ledger heartbeat — runs AFTER publish so we know whether
  # the site committed fresh pages for today (render_happened detection).
  # if: always() so this detection step runs even on partial nights — it is a
  # pure detector, never a gate (CSP-R1 forbids fail-dark).
  # daily.yml also touched by other open lanes today (merge-order conflicts
  # expected — keep this diff minimal and rebased on fresh main).
  ledger_heartbeat:
    needs: [engine, publish]
    if: always()
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: check forward-ledger advance (CSP-W6 heartbeat)
        # Detection only — never gates or fails the deploy (CSP-R1).
        # --render-happened: the engine job committed and the publish job ran
        # (both needed: engine always() = may have committed even on partial
        # night; publish always() = deployed whatever the engine left).
        # The flag is always passed unconditionally here — run_check() is itself
        # trading-day-aware (skips weekends/holidays) and idempotent per date.
        run: |
          python -m scripts.check_ledger_advance --render-happened || echo "::warning::check_ledger_advance failed (non-fatal — CSP-R1 fail-open)"
      - name: commit ledger heartbeat state
        if: always()
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ci/ledger_heartbeat_state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no heartbeat state change"; exit 0; fi
          git commit -m "ops: ledger heartbeat state $(date -u +%F)"
          PUSH_ALARM=120
          PUSH_MAX_ATTEMPTS=6      # a one-line ops state file, non-fatal — a shorter budget than the render lanes is right, but 3 was not enough to outlast main's commit rate
          push_retry_init "ledger heartbeat state"
          while push_attempt; do
            perl -e 'alarm 60; exec @ARGV or die' -- git fetch origin main || true
            if perl -e 'alarm 120; exec @ARGV or die' -- git pull --rebase --autostash -X theirs origin main && push_autostash_ok; then
              if push_do; then echo "heartbeat state pushed on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::warning::could not push heartbeat state after $PUSH_ATTEMPT attempts ($PUSH_STOP) (non-fatal)"
