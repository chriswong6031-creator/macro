        # FS-0 (FLOW_SIGNAL_ML_MASTERPLAN_BY_FABLE §5): append-only per-event
        # flow ledger (collectors/flow_signals.py) + outcome grader
        # (engine/flow_signals_grade.py). Runs AFTER the flow_idx mirror steps
        # so that R2 archive blobs from the live_flow poller are available.
        # US engine job, R2-creds-gated, no-ops without creds. (There is no
        # us_scope gate in this job — step is unconditional but gracefully
        # degrades when R2_ENDPOINT/R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY are
        # absent.) Nightly is the sole advancer of this ledger (forward-ledger
        # law): intraday lanes must not write to data/flow_signals/. Output
        # covered by 'git add data/' in the 'commit engine outputs' step below.
        # Graceful: absent R2 creds → clean no-op (harvest returns 0). Never
        # fails the nightly.
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python -m scripts.build_flow_signals || echo "::warning::build_flow_signals failed (non-fatal — keeping last committed ledger)"
      - name: build canada dashboard (S&P/TSX)
        # FIRST-CLASS STEP (2026-07-27) — build_canada used to run ONLY as a swallowed
        # try/except inside build_vector (a workaround from PR #81, whose PAT lacked
        # `workflow` scope). Two defects came with that: the failure went through
        # log.error, whose "%(levelname)s " prefix pushes "::" off the line start so
        # GitHub DROPPED the annotation and a dead builder shipped a stale canada.html
        # behind a green nightly; and the builder had no workflow of its own to be
        # scoped or timed by. Both found shipping macro#3820 (HK/Canada rebuild).
        # ORDERING IS LOAD-BEARING: this MUST stay above the build_vector step below —
        # the landing hub's _canada_state() reads the data/canada_regime/latest.json
        # written here (and the hub card is presence-gated on site/canada.html).
        # Resilient like every other builder in this job: build_canada never raises, a
        # non-zero rc is annotated + summarised here, and the step always exits 0 so one
        # broken dashboard can never abort the nightly.
        # SKIP_CANADA_HOOK=1 goes to $GITHUB_ENV so build_vector's surviving fallback
        # hook no-ops for the rest of this job — set UNCONDITIONALLY (even on failure):
        # build_canada is a pure function of the committed store, so a retry would burn
        # ~10 min of a 150m-capped nightly to fail identically. The annotation is the
        # recovery signal, not a second attempt.
        run: |
          set +e
          python -m scripts.build_canada > "$RUNNER_TEMP/canada.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/canada.log"
