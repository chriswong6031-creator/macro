name: asia-close
# China A-share + Hong Kong dashboards, rebuilt AFTER the Asia cash close (mainland
# ~07:00 UTC, HK ~08:00 UTC) so they render SETTLED closes instead of the stale marks
# a US-evening run would lock in. Split out of daily.yml (time-sharding): this runs
# `collect --group asia` (only china*/hk* adapters) then the CN/HK builders. It reads
# the committed `yahoo` cross-asset series (SPY/VIX/DXY/copper/gold/USDCNY/EEM) that
# the US-evening build already collected for HK's global-risk hero — no need to
# re-collect it. The CN/HK regimes are self-recomputed, so there is NO ordering
# dependency on the US regime write.
on:
  schedule:
    # GitHub fires this repo's schedules VERY late (measured 07-01..07-12: every scheduled
    # run of the old single "30 8" slot was created +86..+233 min after it, i.e. 09:56-12:22
    # UTC — and even */5 crons like live-quotes get coalesced to a handful of fires/day).
    # So: several slots race to be the first fire, and the `gate` job below turns every
    # slot after the day's first real run into a seconds-long green no-op. The EARLY-BIRD
    # slots (06:00-07:20) exist because a fire is never early, only late: fired +86m they
    # land 07:26-08:46, and the gate holds the start until the 08:25 UTC data floor
    # (HK closing auction prints ~08:10 UTC = 16:10 HKT; mainland vendor EOD ~08:00-08:30)
    # instead of waiting for a late 08:30-slot fire at ~10:00. The late slots are
    # backstops for dropped/coalesced fires. Net effect: start ≈ the close, not +2-4h.
    - cron: "0 6 * * *"    # early bird — expected to LAND ~07:30-10:00 given fire lag
    - cron: "40 6 * * *"   # early bird
    - cron: "20 7 * * *"   # early bird
    - cron: "30 8 * * *"   # the original on-time slot (fires ~10:00-12:20 in practice)
    - cron: "30 9 * * *"   # backstop
    - cron: "30 10 * * *"  # backstop
    - cron: "15 11 * * *"  # last-chance backstop
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # gate job lists today's runs of this workflow for dedup

jobs:
  gate:
    # Dedup + data-floor + retry-cap for the multi-slot schedule above. Decides whether
    # THIS fire should run the lane: skips if an older run is already alive or a real run
    # already succeeded today; allows one same-day retry after a real failure (the 07-11
    # R2-tripwire failure would have been retried the same day); holds early-bird fires
    # until the 08:25 UTC floor. workflow_dispatch bypasses everything (operator intent).
    # Fails OPEN (run=true) on API errors — a duplicate idempotent run beats a dead lane;
    # the job-level pipeline-asia concurrency group still serializes the real work.
    # Dead-lane monitoring is UNAFFECTED by the extra quick green runs: the heartbeat
    # watches R2 anchor freshness (scripts/audit_r2.py, 26h), not run conclusions.
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 60    # ≥ MAX_FLOOR_WAIT (45m hold) + slack
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: decide (no checkout needed — pure GitHub API + clock)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /opt/homebrew/bin/python3.12 - <<'PY'
          import json, os, sys, time, urllib.request
          from datetime import datetime, timezone

          def out(decision, reason):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"run={'true' if decision else 'false'}\n")
              print(f"::notice title=asia-close gate::run={decision} — {reason}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(f"gate: `run={decision}` — {reason}\n")
              sys.exit(0)

          FLOOR_H, FLOOR_M = 8, 25    # 08:25 UTC — HK closing auction settled (~08:10)
          # 45m, not 90m: the repo has only THREE runner slots total (mac-builder-1..3,
          # one shared `macstudio` label pool) — a sleeping gate burns 1/3 of repo
          # capacity. At the observed >=86m fire lag the 06:40 slot lands 08:06+ (hold
          # <=19m) and the 07:20 slot lands 08:46+ (no hold), so a 45m cap keeps the
          # ~08:25 start; only the 06:00 slot's long holds are dropped, and a later
          # slot always covers.
          MAX_FLOOR_WAIT_S = 45 * 60
          REAL_RUN_MIN_S = 600        # <10m completed run = a gate skip, not a real attempt
          MAX_REAL_ATTEMPTS = 2       # first try + one same-day retry, then stop

          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              out(True, "workflow_dispatch — operator override, gate bypassed")

          now = datetime.now(timezone.utc)
          reason = "first real run of the day"
          try:
              my_id = int(os.environ["GITHUB_RUN_ID"])
              my_number = int(os.environ["GITHUB_RUN_NUMBER"])
              url = (f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                     f"/actions/workflows/asia-close.yml/runs"
                     f"?created=%3E%3D{now.strftime('%Y-%m-%d')}&per_page=100")
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json"})
              runs = json.load(urllib.request.urlopen(req, timeout=60)).get("workflow_runs", [])

              def dur_s(r):
                  try:
                      a = datetime.fromisoformat((r.get("run_started_at") or r["created_at"]).replace("Z", "+00:00"))
                      b = datetime.fromisoformat(r["updated_at"].replace("Z", "+00:00"))
                      return (b - a).total_seconds()
                  except Exception:
                      return 0.0

              # Oldest-alive-wins: exactly one winner even when several slots fire together
              # (the newer of two simultaneous gates always sees the older one alive).
              alive_older = [r for r in runs if r["id"] != my_id
                             and r["status"] in ("queued", "in_progress", "waiting", "pending", "requested")
                             and r["run_number"] < my_number]
              if alive_older:
                  out(False, f"older run #{alive_older[0]['run_number']} already alive — it owns today")

              real = [r for r in runs if r["id"] != my_id and r["status"] == "completed"
                      and dur_s(r) >= REAL_RUN_MIN_S]
              if any(r["conclusion"] == "success" for r in real):
                  out(False, "a real run already succeeded today")
              if len(real) >= MAX_REAL_ATTEMPTS:
                  print(f"::warning title=asia-close gate::{len(real)} real attempts today, none succeeded — retry budget spent, lane needs eyes")
                  out(False, f"{len(real)} failed real attempts today — no more retries")
          except Exception as e:  # noqa: BLE001 — fail OPEN: duplicate idempotent run > dead lane
              print(f"::warning title=asia-close gate::gate check failed ({e!r}) — failing OPEN")
              reason = f"gate error, fail-open ({e!r})"

          # Data floor applies to every scheduled GO (including fail-open): never start
          # collecting before the HK close has settled prints.
          floor = now.replace(hour=FLOOR_H, minute=FLOOR_M, second=0, microsecond=0)
          wait = (floor - now).total_seconds()
          if wait > MAX_FLOOR_WAIT_S:
              out(False, f"{wait/60:.0f}m before the 08:25 UTC floor — too early to hold a runner; a later slot covers")
          if wait > 0:
              print(f"::notice title=asia-close gate::early-bird fire — holding {wait/60:.0f}m until the 08:25 UTC data floor")
              time.sleep(wait)
          out(True, reason)
          PY

  asia:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    concurrency:
      # its own lane; the rebase-retry push loop makes concurrent commits with the
      # US-evening / slow shards race-safe. JOB-level (not workflow-level) so the
      # multi-slot gate jobs above never queue/cancel behind a 90-150m real run.
      group: pipeline-asia
      cancel-in-progress: false
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 165   # was 90 -> 120 -> 165. EVERY run 07-03..07-10 died at the cap: measured 07-10 (run 29089281652) collect --group asia = 68m + build_china alone = 36m, so the kill lands mid-chain — everything after build_subsector_confluence (build_hk, build_china_news ingest, all CN-SYS lobes, masterminds) had been DEAD for 8 days while the run reads "cancelled" not "failed". Last natural success 07-02 at ~86m; the lane grew ~+35m in a week as W8/CN-SYS modules landed. 165m restores the full chain; the runtime diet landed 2026-07-11 — collect-path (us_scope tail gate + pure-REST pool moves + CNInfo caps, #2199) and build-path (skip the duplicate library rebuild + [timing] section ticks in build_china_library, this PR). Target ~110m steady-state; keep 165m as headroom against CNInfo/GDELT bad days.
    steps:
      # Default ref (the branch that triggered this) — NOT a hard `ref: main`. On the
      # feat/time-shards branch this pulls the collect.py that HAS --group; on main
      # after merge it is main. `git push` (no args) then pushes the CURRENT branch to
      # its origin counterpart, so a branch test commits to the branch, never to main.
      - uses: actions/checkout@v4
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: restore china breadth close cache
        uses: actions/cache@v4
        with:
          path: data/china_breadth/_closes_cache.parquet
          key: china-breadth-closes-${{ github.run_id }}
          restore-keys: china-breadth-closes-
      - name: restore hk breadth close cache
        uses: actions/cache@v4
        with:
          path: data/hk_breadth/_closes_cache.parquet
          key: hk-breadth-closes-${{ github.run_id }}
          restore-keys: hk-breadth-closes-
      - name: save china per-name OHLC store (post-collect snapshot for daily engine job)
        # Scope-1 lag fix (CN-SYS W5a): the prior step used restore-keys to restore the
        # most-recent cache here. That caused a regression loop: a stale cache was restored
        # BEFORE collect ran, the collect overwrote it in-tree, but daily.yml's later
        # cache-restore pulled the stale save and then committed it via "git add data/" —
        # re-introducing the staleness that the asia-close collect just fixed. Removing
        # restore-keys means no restore happens (primary key always misses on unique run_id),
        # but the SAVE at job end still captures the freshly-collected parquets so daily.yml's
        # engine job cache-restore always gets today's fresh data.
        # All 1599 parquets are now committed to git; the cache is only needed so daily.yml's
        # ENGINE job (a separate GHA job with its own checkout) can read the per-name OHLC
        # without re-running collect. The asia-close collect step itself doesn't need the
        # prior cache — it fetches fresh data and store.upsert merges it into the checkout.
        uses: actions/cache@v4
        with:
          path: data/china_stocks
          key: china-stocks-ohlc-${{ github.run_id }}
      - name: restore hk per-name OHLC store
        uses: actions/cache@v4
        with:
          path: data/hk_stocks
          key: hk-stocks-ohlc-${{ github.run_id }}
          restore-keys: hk-stocks-ohlc-
      - name: collect China/HK data (graceful degradation — never fails on one source)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}  # unfreezes the gated tushare plane (dead since 2026-06-21: collectors silently no-op without it — see CHINA_ENGINE_REASSESSMENT)
        run: python -m scripts.collect --group asia
      - name: commit collected asia data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # Stage collected data + the qledger grader's tracked
          # site/qledger/track_record.json. The --autostash on the rebase below is the
          # real guard, though: scripts.collect also dirties OTHER tracked files (e.g.
          # reports/*.md graders) that no `git add` here covers — left unstaged they
          # abort `git pull --rebase` ("unstaged changes") and the push silently dies
          # after 5 retries, discarding the whole collection (froze 2026-07-02..07).
          git add data/ site/qledger/
          if git diff --cached --quiet; then echo "no asia data changes"; else
            git commit -m "data: asia collection $(date -u +%F)"
            for i in 1 2 3 4 5; do
              # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
              # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
              # refuses ("untracked working tree files would be overwritten") and --autostash can't
              # clear it (it parks tracked modifications only), so every retry dies identically.
              # Everything this step publishes is already committed above, so a path untracked HERE
              # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
              # Gitignored files and untracked paths origin/main doesn't track never enter the
              # intersection (runner-local stores and caches are untouched).
              git fetch origin main || true
              comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                       <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
                | while IFS= read -r f; do rm -f -- "$f" || true; done
              if git pull --rebase --autostash -X theirs origin main && git push; then echo "pushed asia data (attempt $i)"; break; fi
              git rebase --abort 2>/dev/null || true; echo "asia data push attempt $i lost a race"; sleep $((i * 7))
            done
          fi
      - name: build China + Hong Kong dashboards (resilient — mirrors daily.yml cl_china/cl_hk)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CN_LANE: asia   # explicit asia-lane gate: the ONLY lane that may persist the board ledger
                          # (this job runs after the A-share close and commits data/). Render lanes
                          # leave CN_LANE unset/non-asia so china_standout_track.append_board refuses.
        run: |
          set +e
          # Job-start marker for the library rebuild step's skip-if-fresh check below
          # (same pattern as daily.yml's canada/intl library rebuild). $RUNNER_TEMP is
          # per-job: /tmp is SHARED across the box's runners — the 07-10 run's
          # build_china log group contained another runner's build_congress output
          # because both jobs wrote /tmp/step.log concurrently.
          touch "$RUNNER_TEMP/asia_libs_marker"
          run_py() {
            local label="$1" mod="$2"; shift 2
            echo "::group::$label"
            python -m "$mod" "$@" > "$RUNNER_TEMP/step.log" 2>&1; local rc=$?
            cat "$RUNNER_TEMP/step.log"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$label failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/step.log" | tr '\n' ' ' | tail -c 500)"
              { echo "### ❌ $label failed (rc=$rc)"; echo '```'; tail -n 40 "$RUNNER_TEMP/step.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          # Order per daily.yml cl_china: china -> sector_desk -> sector_cycles ->
          # sector_central (reads the cycles' data JS + the china regime gate) ->
          # flow_velocity; then cl_hk (independent, self-recomputes its regime).
          run_py "build china a-share dashboard (build_china)"        scripts.build_china
          run_py "china sector desk (build_china_sector_desk)"        scripts.build_china_sector_desk
          run_py "china sector cycles (build_china_sector_cycles)"    scripts.build_china_sector_cycles
          # grade the cycles' own forward log (falsifiability loop) — AFTER the cycles build
          # so today's stamp is already appended; reads committed data/, writes site/ only.
          run_py "china cycles forward-log grader (build_china_cycles_scorecard)" scripts.build_china_cycles_scorecard
          run_py "china sector central (build_china_sector_central)"  scripts.build_china_sector_central
          run_py "capital flow velocity — CN/HK (build_flow_velocity)" scripts.build_flow_velocity
          run_py "china subsector confluence (build_subsector_confluence --china)" scripts.build_subsector_confluence --china
          run_py "build hong kong / hang seng (build_hk)"             scripts.build_hk
          run_py "hk rotation events (build_rotation_events_hk)"  scripts.build_rotation_events_hk  # RC-R14 display-tier, reads hkbasketdata/baskets.json in-process
          # W6-CN Fix 4 (lane unification): baskets_china/_ths/baskets_hk previously built
          # in the nightly 02:00 UTC lane (via build_vector.py) on the PRIOR asia close, making
          # them one full CN session behind their sibling pages ~19.5h/day. Moved here so all
          # five China surfaces share one session. build_vector.py's hook skips gracefully if
          # as_of already matches (idempotent guard). See research/CHINA_ENGINE_REASSESSMENT.md.
          run_py "china A-share thematic baskets (build_baskets_china)"    scripts.build_baskets_china
          run_py "china THS concept baskets (build_baskets_china_ths)"     scripts.build_baskets_china_ths
          run_py "hong kong thematic baskets (build_baskets_hk)"           scripts.build_baskets_hk
          # W6-CN CN-5: CN Reversal Sleeve (SHADOW). Runs AFTER the china builds so the
          # china_search plane + risk_radar_intl chip are fresh; asia lane so the forward
          # ledger persists (lane-gated). Failure-isolated: the script always exits 0.
          CN_SLEEVE_LANE=asia run_py "cn reversal sleeve (build_cn_reversal_sleeve)" scripts.build_cn_reversal_sleeve
          # ── CN-SYS W5a Scope 2: intel sub-builders extracted from build_china.py ────────
          # Behavior-preserving extraction of the importlib chain at the end of build_china
          # main(). Order is preserved: validation → news → policy_watch → altdata → radar →
          # synthesis (intel_analysis) → analogs → special_sits → intel_hub → intel_bus.
          # Each step is non-fatal (matching the try/except semantics from build_china.py).
          run_py "china validation scorecard (build_china_validation)"             scripts.build_china_validation
          run_py "china news powerhouse (build_china_news)"                        scripts.build_china_news
          run_py "china policy watch (build_china_policy_watch)"                   scripts.build_china_policy_watch
          run_py "china alt-data desk (build_china_altdata)"                       scripts.build_china_altdata
          run_py "china divergence radar (build_china_radar)"                      scripts.build_china_radar
          run_py "china central analysis (build_china_synthesis)"                  scripts.build_china_synthesis
          run_py "china historical analogs (build_china_analogs)"                  scripts.build_china_analogs
          run_py "china special situations (build_china_special_situations)"       scripts.build_china_special_situations
          run_py "china intel hub command apparatus (build_china_intel_hub)"       scripts.build_china_intel_hub
          run_py "china intel bus / mastermind fan-in (build_china_intel)"         scripts.build_china_intel
          # ── CN-SYS W5a Scope 3: Batch-1 lobes wiring ────────────────────────────────────
          # W1 / W2 / W4 parallel builds land at merge time; wired here by module name.
          # All non-fatal (~2 min each; CN-SYS-R11). Run after reversal_sleeve so the
          # china_search plane + risk_radar_intl chip are fresh for these lobes.
          run_py "china microstructure lobe (build_china_microstructure)"          scripts.build_china_microstructure   # ~2m W1
          run_py "china participation lobe (build_china_participation)"            scripts.build_china_participation    # ~2m W2
          run_py "china policy transmission lobe (build_china_policy_transmission)" scripts.build_china_policy_transmission  # ~2m W4
          run_py "china THS snapshot side-car (build_baskets_china_ths --snapshot)" scripts.build_baskets_china_ths --snapshot  # ~2m W1 PIT
          # ── CN-SYS Batch-2 lobe wiring (W3 + W6) ────────────────────────────────────
          # W3 (cycle_phase) lands from a parallel PR; wired here by module name.
          # W6 (market_state spine) runs AFTER W3 so cycle_phase.json is fresh.
          # Both non-fatal (~2 min each; CN-SYS-R11); spine degrades to phase=null
          # when W3 artifact is missing (handled inside build_china_market_state).
          run_py "china cycle phase lobe (build_china_cycle_phase)"               scripts.build_china_cycle_phase      # ~2m W3
          run_py "china market state spine (build_china_market_state)"            scripts.build_china_market_state     # ~2m W6
          run_py "china mechanics cockpit (build_china_mechanics)"              scripts.build_china_mechanics        # W8 cockpit — reads spine artifacts
          # ── CN-SYS W9: lane unification ──────────────────────────────────────────────────
          # china_masterminds / china_strategies / subsector_rotation_china were previously
          # built in the US-evening lane (build_vector.py / build_site.py), making them
          # ~19.5h stale vs the settled Asia close. Moved here so all CN surfaces share one
          # session. build_vector.py and build_site.py retain idempotent fallback hooks that
          # skip when as_of/built already matches today's UTC date (asia lane ran first).
          # Order: masterminds BEFORE strategies (strategies imports mastermind card builder).
          run_py "china mastermind flagships (build_china_masterminds)"            scripts.build_china_masterminds            # W9 lane unification
          run_py "china strategy scorecards (build_china_strategies)"              scripts.build_china_strategies             # W9 lane unification
          run_py "china subsector rotation data (build_subsector_rotation_china)"  scripts.build_subsector_rotation_china     # W9 lane unification
          run_py "china subsector rotation pages (build_subsector_rotation_china_pages)"  scripts.build_subsector_rotation_china_pages  # W9 lane unification
          run_py "china rotation events (build_rotation_events_china)"  scripts.build_rotation_events_china  # RC-R14 display-tier, reads baskets.json in-process
          exit 0
      - name: rebuild China/HK stock-search libraries (resilient — guarantees the analyzers ship)
        # FAILURE-PATH safety net (asia-lane runtime diet, 2026-07-11): build_china
        # already runs build_china_library.main() IN-PROCESS (~17-30+ min — the single
        # heaviest block in the lane), so on the success path this step was pure
        # duplicate work, building the same library TWICE per lane. Mirror of
        # daily.yml's canada/intl rebuild skip: if the library's index.json is newer
        # than the job-start marker, the dashboard step built it fresh this run —
        # skip. A build_china crash BEFORE its library call leaves an old index.json
        # => marker is newer => we still rebuild and the analyzers ship.
        run: |
          set +e
          libdir() {
            case "$1" in
              scripts.build_china_library) echo site/chinastockdata;;
              scripts.build_hk_library) echo site/hkstockdata;;
            esac
          }
          for mod in scripts.build_china_library scripts.build_hk_library; do
            idx="$(libdir "$mod")/index.json"
            if [ -f "$RUNNER_TEMP/asia_libs_marker" ] && [ "$idx" -nt "$RUNNER_TEMP/asia_libs_marker" ]; then
              echo "::notice::$mod — already built fresh this run ($idx); skipping redundant rebuild"
              continue
            fi
            echo "::group::$mod"; python -m "$mod" > "$RUNNER_TEMP/lib.log" 2>&1; rc=$?; cat "$RUNNER_TEMP/lib.log"; echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then echo "::error title=$mod failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/lib.log" | tr '\n' ' ' | tail -c 500)"; fi
          done
          exit 0
      - name: CN Pick Lab — fire books + grade + render (CNPL-R8 asia lane, ≤2 min)
        # Runs AFTER build_china_library (above) so tonight's CN snapshot is on disk.
        # CN_LANE=asia is the ledger-write gate (CNPL-R8); the step always exits 0
        # (never-break contract). Artifacts committed in the "commit engine outputs"
        # step below via 'git add data/ site/' which covers:
        #   data/china_pick_lab/  (snapshots/, fires.jsonl, grades.jsonl)
        #   site/labdata/china_pick_lab.json
        #   site/china_stocks_lab.html
        #   site/factordata/china_reversion_desk.json  (produced by build_china_library)
        env:
          CN_LANE: asia
        run: |
          echo "::group::CN Pick Lab (build_china_pick_lab)"
          python -m scripts.build_china_pick_lab > "$RUNNER_TEMP/cnlab.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/cnlab.log"
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=build_china_pick_lab failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/cnlab.log" | tr '\n' ' ' | tail -c 500)"
          fi
          exit 0
      - name: HK Pick Lab — fire books + grade + render (HKPL-R8 asia lane, ≤2 min)
        # Runs AFTER build_hk_library (above) so tonight's HK snapshot is on disk.
        # CN_LANE=asia is the ledger-write gate (HKPL-R8); the step always exits 0
        # (never-break contract). Artifacts committed in the "commit engine outputs"
        # step below via 'git add data/ site/' which covers:
        #   data/hk_pick_lab/  (snapshots/, fires.jsonl, grades.jsonl)
        #   site/labdata/hk_pick_lab.json
        #   site/hk_stocks_lab.html
        #   site/factordata/hk_1d_velocity_desk.json  (enriched second pass)
        env:
          CN_LANE: asia
        run: |
          echo "::group::HK Pick Lab (build_hk_pick_lab)"
          python -m scripts.build_hk_pick_lab > "$RUNNER_TEMP/hklab.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/hklab.log"
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=build_hk_pick_lab failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/hklab.log" | tr '\n' ' ' | tail -c 500)"
          fi
          exit 0
      - name: inject data-base shim into CN/HK pages (site-wide, no-op while DATA_BASE empty)
        run: python -m scripts.inject_data_base || echo "data-base shim inject skipped (additive)"
      - name: commit engine outputs
        if: always()
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/
          # force-add the gitignored per-market search libraries + reconstructed candles
          if git diff --cached --quiet; then echo "no engine output changes"; exit 0; fi
          git commit -m "engine: asia dashboards $(date -u +%F)"
          for i in 1 2 3 4 5; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if git pull --rebase --autostash -X theirs origin main; then
              # ms-board coherence guard (ui.ms_board_coherence): this lane re-renders the
              # CN/HK dashboards, so -X theirs racing another render can stitch a hybrid
              # Market State board (see the 2026-07-07 macro.html incident, commit
              # 5bf116a3b3). Restore any incoherent page WHOLESALE from post-rebase
              # origin/main and fold it into a follow-up commit.
              python3 scripts/check_ms_board_coherence.py --heal-from origin/main \
                || echo "::warning::ms-board coherence heal incomplete (incoherent board may predate this run)"
              if ! git diff --quiet -- site/; then
                git add site/ && git commit -m "render-heal: restore coherent ms-board post-rebase (ui.ms_board_coherence)" \
                  || echo "::warning::render-heal commit failed (non-fatal)"
              fi
              if git push; then echo "pushed asia engine outputs (attempt $i)"; exit 0; fi
            fi
            git rebase --abort 2>/dev/null || true; echo "asia engine push attempt $i lost a race"; sleep $((i * 7))
          done
          echo "::warning::could not push asia engine outputs after 5 attempts (non-fatal)"
      - name: publish CN/HK stores to R2 (additive; no-op without creds)
        if: always()
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.publish_r2 --dirs chinaohlc,hkohlc,subsectorohlc_china,chinastockdata,hkstockdata || echo "::warning::R2 publish failed (non-fatal)"
      - name: verify R2 data plane freshness (loud tripwire — the publish above is non-fatal)
        # The publish step swallows every failure (incl. the exit-0 no-op when the R2_*
        # secrets are absent/expired), so the live site would serve stale CN/HK per-ticker
        # data under a green run. HEAD the PUBLIC anchors instead: if the CN/HK stores
        # weren't touched within 2h, this run's publish did not land -> red run + step
        # summary. The scheduled heartbeat (scripts/healthcheck.py) independently
        # re-probes with a 26h limit.
        if: always()
        run: |
          if ! python -m scripts.audit_r2 --strict --anchors chinastockdata,hkstockdata --max-age-hours 2; then
            echo "### ❌ R2 data plane STALE/DARK — publish_r2 failed or was skipped (expired R2_* secrets?); the live site keeps serving OLD CN/HK per-ticker data. See scripts/audit_r2.py." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
