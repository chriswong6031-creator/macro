name: asia-close
# China A-share + Hong Kong dashboards, rebuilt AFTER the Asia cash close (mainland
# ~07:00 UTC, HK ~08:00 UTC) so they render SETTLED closes instead of the stale marks
# a US-evening run would lock in. Split out of daily.yml (time-sharding): this runs
# `collect --group asia` (only china*/hk* adapters) then the CN/HK builders. It reads
# the committed `yahoo` cross-asset series (SPY/VIX/DXY/copper/gold/USDCNY/EEM) that
# the US-evening build already collected for HK's global-risk hero — no need to
# re-collect it. The CN/HK regimes are self-recomputed, so there is NO ordering
# dependency on the US regime write.
on:
  schedule:
    # GitHub fires this repo's schedules VERY late (measured 07-01..07-12: every scheduled
    # run of the old single "30 8" slot was created +86..+233 min after it, i.e. 09:56-12:22
    # UTC — and even */5 crons like live-quotes get coalesced to a handful of fires/day).
    # So: several slots race to be the first fire, and the `gate` job below turns every
    # slot after the day's first real run into a seconds-long green no-op. The EARLY-BIRD
    # slots (06:00-07:20) exist because a fire is never early, only late: fired +86m they
    # land 07:26-08:46, and the gate holds the start until the 08:25 UTC data floor
    # (HK closing auction prints ~08:10 UTC = 16:10 HKT; mainland vendor EOD ~08:00-08:30)
    # instead of waiting for a late 08:30-slot fire at ~10:00. The late slots are
    # backstops for dropped/coalesced fires. Net effect: start ≈ the close, not +2-4h.
    - cron: "0 6 * * *"    # early bird — expected to LAND ~07:30-10:00 given fire lag
    - cron: "40 6 * * *"   # early bird
    - cron: "20 7 * * *"   # early bird
    - cron: "30 8 * * *"   # the original on-time slot (fires ~10:00-12:20 in practice)
    - cron: "30 9 * * *"   # backstop
    - cron: "30 10 * * *"  # backstop
    - cron: "15 11 * * *"  # last-chance backstop
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # gate job lists today's runs of this workflow for dedup

jobs:
  gate:
    # Dedup + data-floor + retry-cap for the multi-slot schedule above. Decides whether
    # THIS fire should run the lane: skips if an older run is already alive or a real run
    # already succeeded today; allows one same-day retry after a real failure (the 07-11
    # R2-tripwire failure would have been retried the same day); holds early-bird fires
    # until the 08:25 UTC floor. workflow_dispatch bypasses everything (operator intent).
    # Fails OPEN (run=true) on API errors — a duplicate idempotent run beats a dead lane;
    # the job-level pipeline-asia concurrency group still serializes the real work.
    # Dead-lane monitoring is UNAFFECTED by the extra quick green runs: the heartbeat
    # watches R2 anchor freshness (scripts/audit_r2.py, 26h), not run conclusions.
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 60    # ≥ MAX_FLOOR_WAIT (45m hold) + slack
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: decide (no checkout needed — pure GitHub API + clock)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /opt/homebrew/bin/python3.12 - <<'PY'
          import json, os, sys, time, urllib.request
          from datetime import datetime, timezone

          def out(decision, reason):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"run={'true' if decision else 'false'}\n")
              print(f"::notice title=asia-close gate::run={decision} — {reason}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(f"gate: `run={decision}` — {reason}\n")
              sys.exit(0)

          FLOOR_H, FLOOR_M = 8, 25    # 08:25 UTC — HK closing auction settled (~08:10)
          # 45m, not 90m: the repo has only THREE runner slots total (mac-builder-1..3,
          # one shared `macstudio` label pool) — a sleeping gate burns 1/3 of repo
          # capacity. At the observed >=86m fire lag the 06:40 slot lands 08:06+ (hold
          # <=19m) and the 07:20 slot lands 08:46+ (no hold), so a 45m cap keeps the
          # ~08:25 start; only the 06:00 slot's long holds are dropped, and a later
          # slot always covers.
          MAX_FLOOR_WAIT_S = 45 * 60
          REAL_RUN_MIN_S = 600        # <10m completed run = a gate skip, not a real attempt
          MAX_REAL_ATTEMPTS = 2       # first try + one same-day retry, then stop

          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              out(True, "workflow_dispatch — operator override, gate bypassed")

          now = datetime.now(timezone.utc)
          reason = "first real run of the day"
          try:
              my_id = int(os.environ["GITHUB_RUN_ID"])
              my_number = int(os.environ["GITHUB_RUN_NUMBER"])
              url = (f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                     f"/actions/workflows/asia-close.yml/runs"
                     f"?created=%3E%3D{now.strftime('%Y-%m-%d')}&per_page=100")
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json"})
              runs = json.load(urllib.request.urlopen(req, timeout=60)).get("workflow_runs", [])

              def dur_s(r):
                  try:
                      a = datetime.fromisoformat((r.get("run_started_at") or r["created_at"]).replace("Z", "+00:00"))
                      b = datetime.fromisoformat(r["updated_at"].replace("Z", "+00:00"))
                      return (b - a).total_seconds()
                  except Exception:
                      return 0.0

              # Oldest-alive-wins: exactly one winner even when several slots fire together
              # (the newer of two simultaneous gates always sees the older one alive).
              alive_older = [r for r in runs if r["id"] != my_id
                             and r["status"] in ("queued", "in_progress", "waiting", "pending", "requested")
                             and r["run_number"] < my_number]
              if alive_older:
                  out(False, f"older run #{alive_older[0]['run_number']} already alive — it owns today")

              real = [r for r in runs if r["id"] != my_id and r["status"] == "completed"
                      and dur_s(r) >= REAL_RUN_MIN_S]
              if any(r["conclusion"] == "success" for r in real):
                  out(False, "a real run already succeeded today")
              if len(real) >= MAX_REAL_ATTEMPTS:
                  print(f"::warning title=asia-close gate::{len(real)} real attempts today, none succeeded — retry budget spent, lane needs eyes")
                  out(False, f"{len(real)} failed real attempts today — no more retries")
          except Exception as e:  # noqa: BLE001 — fail OPEN: duplicate idempotent run > dead lane
              print(f"::warning title=asia-close gate::gate check failed ({e!r}) — failing OPEN")
              reason = f"gate error, fail-open ({e!r})"

          # Data floor applies to every scheduled GO (including fail-open): never start
          # collecting before the HK close has settled prints.
          floor = now.replace(hour=FLOOR_H, minute=FLOOR_M, second=0, microsecond=0)
          wait = (floor - now).total_seconds()
          if wait > MAX_FLOOR_WAIT_S:
              out(False, f"{wait/60:.0f}m before the 08:25 UTC floor — too early to hold a runner; a later slot covers")
          if wait > 0:
              print(f"::notice title=asia-close gate::early-bird fire — holding {wait/60:.0f}m until the 08:25 UTC data floor")
              time.sleep(wait)
          out(True, reason)
          PY

  asia:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    concurrency:
      # its own lane; the rebase-retry push loop makes concurrent commits with the
      # US-evening / slow shards race-safe. JOB-level (not workflow-level) so the
      # multi-slot gate jobs above never queue/cancel behind a 90-150m real run.
      group: pipeline-asia
      cancel-in-progress: false
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 165   # was 90 -> 120 -> 165. EVERY run 07-03..07-10 died at the cap: measured 07-10 (run 29089281652) collect --group asia = 68m + build_china alone = 36m, so the kill lands mid-chain — everything after build_subsector_confluence (build_hk, build_china_news ingest, all CN-SYS lobes, masterminds) had been DEAD for 8 days while the run reads "cancelled" not "failed". Last natural success 07-02 at ~86m; the lane grew ~+35m in a week as W8/CN-SYS modules landed. 165m restores the full chain; the runtime diet landed 2026-07-11 — collect-path (us_scope tail gate + pure-REST pool moves + CNInfo caps, #2199) and build-path (skip the duplicate library rebuild + [timing] section ticks in build_china_library, this PR). Target ~110m steady-state; keep 165m as headroom against CNInfo/GDELT bad days. 2026-07-14: the post-build_china builder chain went parallel (band A/B below, engine-job cluster pattern) — expected ~18-25m further off the steady state; timeout deliberately UNTOUCHED until the bands' step-summary wall-times confirm it.
    steps:
      # Default ref (the branch that triggered this) — NOT a hard `ref: main`. On the
      # feat/time-shards branch this pulls the collect.py that HAS --group; on main
      # after merge it is main. `git push` (no args) then pushes the CURRENT branch to
      # its origin counterpart, so a branch test commits to the branch, never to main.
      - uses: actions/checkout@v4
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: restore china breadth close cache
        uses: actions/cache@v4
        with:
          path: data/china_breadth/_closes_cache.parquet
          key: china-breadth-closes-${{ github.run_id }}
          restore-keys: china-breadth-closes-
      - name: restore hk breadth close cache
        uses: actions/cache@v4
        with:
          path: data/hk_breadth/_closes_cache.parquet
          key: hk-breadth-closes-${{ github.run_id }}
          restore-keys: hk-breadth-closes-
      - name: save china per-name OHLC store (post-collect snapshot for daily engine job)
        # Scope-1 lag fix (CN-SYS W5a): the prior step used restore-keys to restore the
        # most-recent cache here. That caused a regression loop: a stale cache was restored
        # BEFORE collect ran, the collect overwrote it in-tree, but daily.yml's later
        # cache-restore pulled the stale save and then committed it via "git add data/" —
        # re-introducing the staleness that the asia-close collect just fixed. Removing
        # restore-keys means no restore happens (primary key always misses on unique run_id),
        # but the SAVE at job end still captures the freshly-collected parquets so daily.yml's
        # engine job cache-restore always gets today's fresh data.
        # All 1599 parquets are now committed to git; the cache is only needed so daily.yml's
        # ENGINE job (a separate GHA job with its own checkout) can read the per-name OHLC
        # without re-running collect. The asia-close collect step itself doesn't need the
        # prior cache — it fetches fresh data and store.upsert merges it into the checkout.
        uses: actions/cache@v4
        with:
          path: data/china_stocks
          key: china-stocks-ohlc-${{ github.run_id }}
      - name: restore hk per-name OHLC store
        uses: actions/cache@v4
        with:
          path: data/hk_stocks
          key: hk-stocks-ohlc-${{ github.run_id }}
          restore-keys: hk-stocks-ohlc-
      - name: collect China/HK data (graceful degradation — never fails on one source)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}  # unfreezes the gated tushare plane (dead since 2026-06-21: collectors silently no-op without it — see CHINA_ENGINE_REASSESSMENT)
          EASTMONEY_WEB_TOKEN: ${{ secrets.EASTMONEY_WEB_TOKEN }}  # legacy-datacenter web token (collectors/china_property.py cgb); absent -> series skips (was a source literal — CXI tripwire 2026-07-18)
          EASTMONEY_UT_TOKEN: ${{ secrets.EASTMONEY_UT_TOKEN }}    # push2ex ut token (collectors/china_flows.py limit_breadth); absent -> leg skips and ~2wk-retention days are LOST — keep this secret set
        run: python -m scripts.collect --group asia
      - name: commit collected asia data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # Stage collected data + the qledger grader's tracked
          # site/qledger/track_record.json. The --autostash on the rebase below is the
          # real guard, though: scripts.collect also dirties OTHER tracked files (e.g.
          # reports/*.md graders) that no `git add` here covers — left unstaged they
          # abort `git pull --rebase` ("unstaged changes") and the push silently dies
          # after 5 retries, discarding the whole collection (froze 2026-07-02..07).
          git add data/ site/qledger/
          if git diff --cached --quiet; then echo "no asia data changes"; else
            git commit -m "data: asia collection $(date -u +%F)"
            for i in 1 2 3 4 5; do
              # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
              # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
              # refuses ("untracked working tree files would be overwritten") and --autostash can't
              # clear it (it parks tracked modifications only), so every retry dies identically.
              # Everything this step publishes is already committed above, so a path untracked HERE
              # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
              # Gitignored files and untracked paths origin/main doesn't track never enter the
              # intersection (runner-local stores and caches are untouched).
              git fetch origin main || true
              comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                       <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
                | while IFS= read -r f; do rm -f -- "$f" || true; done
              if git pull --rebase --autostash -X theirs origin main && git push; then echo "pushed asia data (attempt $i)"; break; fi
              git rebase --abort 2>/dev/null || true; echo "asia data push attempt $i lost a race"; sleep $((i * 7))
            done
          fi
      - name: build china a-share dashboard (spine — serial head, every CN surface reads it)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          CLAUDE_CODE_OAUTH_TOKEN_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
          METAB_KEYS_ENABLED: ${{ vars.METAB_KEYS_ENABLED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CN_LANE: asia   # explicit asia-lane gate: the ONLY lane that may persist the board ledger
                          # (this job runs after the A-share close and commits data/). Render lanes
                          # leave CN_LANE unset/non-asia so china_standout_track.append_board refuses.
        run: |
          set +e
          # Job-start marker for the library rebuild step's skip-if-fresh check below
          # (same pattern as daily.yml's canada/intl library rebuild). $RUNNER_TEMP is
          # per-job: /tmp is SHARED across the box's runners — the 07-10 run's
          # build_china log group contained another runner's build_congress output
          # because both jobs wrote /tmp/step.log concurrently.
          touch "$RUNNER_TEMP/asia_libs_marker"
          # build_china stays a SERIAL head, NOT in the parallel bands below: it writes
          # data/china_regime/latest.json + regime_history.parquet, site/factordata/
          # china_standouts.json and data/risk_radar_intl/cn_forward_log.jsonl +
          # cn_calibration.json — inputs read (hard or best-effort) by nearly every
          # builder in band A. It also runs build_china_library.main() in-process
          # (ProcessPool fan-out, the single heaviest block in the lane) — running it
          # alone gives that pool the whole box, and keeps its store.write_status()
          # read-modify-write on data/run_status.json out of the concurrent window.
          echo "::group::build china a-share dashboard (build_china)"
          python -m scripts.build_china > "$RUNNER_TEMP/step.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/step.log"
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=build china a-share dashboard (build_china) failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/step.log" | tr '\n' ' ' | tail -c 500)"
            { echo "### ❌ build china a-share dashboard (build_china) failed (rc=$rc)"; echo '```'; tail -n 40 "$RUNNER_TEMP/step.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: CN/HK builder band A (parallelised — 5 independent clusters, barrier before cross-cluster consumers)
        # The ~30 builders after build_china used to run strictly serially (~55 min of
        # wall-clock). They split into mutually INDEPENDENT clusters (each internally
        # ordered by its own data deps) using the same background-cluster pattern as
        # daily.yml's engine job: brun() buffers each builder's output into its OWN
        # scratch file under "$RUNNER_TEMP/band/" — NEVER /tmp, which is shared across
        # this box's runners (the 07-10 log-interleaving incident, see the marker
        # comment in the spine step above). 5 concurrent clusters mirrors the engine
        # job's cap on this 4-core-bound box; STOCK_LIB_WORKERS=4 additionally bounds
        # build_hk's in-process library ProcessPool while the other clusters run
        # (the CN library already built at full width in the solo spine step).
        #
        # Cross-builder dependency audit (2026-07-14, per-module read/write sweep of all
        # 34 builders — the asia analog of the engine-job audit). HARD edges, each kept
        # INSIDE one cluster:
        #   sector_cycles → cycles_scorecard     data/china_sector_cycles/forward_log.parquet
        #   microstructure → participation       data/china_microstructure/limit_tape.parquet (zt_breadth leg)
        #   baskets_china → baskets_china_ths    site/chinabasketdata/basket_turn_cn.json (turn annotation)
        #   baskets_china(+ths) → subsector_rotation → _pages; rotation_events_china needs baskets.json
        #   baskets_hk → rotation_events_hk      site/hkbasketdata/baskets.json — the serial chain ran
        #                                        rotation_events_hk BEFORE baskets_hk (it read the PRIOR
        #                                        session's committed file); now same-session fresh.
        #   validation → altdata                 data/china_validation/scorecard.json (signal-lab weights)
        #   news → policy_watch → synthesis      events.parquet freshness; synthesis fans in the
        #                                        news/policy/altdata/radar surface JSONs.
        # Cross-CLUSTER consumers do NOT run here — they run in band B after the `wait`
        # barrier (same reasoning as daily.yml's post-band build_sector_central):
        # sector_central, cycle_phase → market_state → mechanics, intel_hub → intel_bus.
        # Accepted soft-staleness (best-effort reads, same class as build_china reading the
        # prior session's baskets.json): baskets_china may read the prior committed
        # sector_cycles_basket_map.json when cl_sector hasn't rewritten it yet (structural
        # mapping, self-heals next run). Shared static asset copies (lightweight-charts.js,
        # baskets_desk.js, forming_narratives.js; theme.css/theme.js via lib/site_assets
        # from special_sits ∈ cl_flowconf and altdata/radar ∈ cl_intel) are byte-identical
        # sources — concurrent copies converge to the same bytes and no builder reads
        # them back mid-run.
        #
        # Every builder stays individually resilient via brun(): a non-zero exit is
        # annotated (::error::) + appended to the run summary with its traceback but NEVER
        # aborts the job. Output is replayed GROUPED in stable order after the barrier
        # (never interleaved); per-builder wall-times go to the step summary — that plus
        # build_china_library's [timing] section ticks is the measurement plane for this
        # change (compare the summary table against the pre-band serial runs).
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          CLAUDE_CODE_OAUTH_TOKEN_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
          METAB_KEYS_ENABLED: ${{ vars.METAB_KEYS_ENABLED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CN_LANE: asia            # same lane gate as the spine step (ledger writers in this band:
                                   # baskets_china turn ledger, radar accrue, special_sits qledger)
          STOCK_LIB_WORKERS: "4"   # bound build_hk_library's ProcessPool inside the band
        run: |
          set +e
          ART="$RUNNER_TEMP/band"; rm -rf "$ART"; mkdir -p "$ART"
          # brun <slug> <label> <module> [args…] — one builder, resilient, into its OWN
          # scratch files (never shared across the parallel subshells), recording exit
          # code + wall-seconds. Output (incl. stderr) is buffered, replayed post-barrier.
          brun() {
            local slug="$1" label="$2" mod="$3"; shift 3
            local t0 t1 rc
            t0=$(date +%s)
            { echo "$label"; python -m "$mod" "$@" 2>&1; } > "$ART/$slug.log"; rc=$?
            t1=$(date +%s)
            echo "$rc"          > "$ART/$slug.rc"
            echo "$((t1 - t0))" > "$ART/$slug.sec"
          }
          # --- clusters: each internally ORDERED by its own data deps; clusters mutually independent ---
          cl_sector() {
            brun sector_desk      "china sector desk (build_china_sector_desk)"        scripts.build_china_sector_desk
            brun sector_cycles    "china sector cycles (build_china_sector_cycles)"    scripts.build_china_sector_cycles
            # grade the cycles' own forward log (falsifiability loop) — AFTER the cycles build
            # so today's stamp is already appended; reads committed data/, writes site/ only.
            brun cycles_scorecard "china cycles forward-log grader (build_china_cycles_scorecard)" scripts.build_china_cycles_scorecard
            # W4 lobe: collect-fed only (RRR/LPR/FR007 + communiques); parked in this cluster
            # so its live tail is on disk before band B's cycle_phase reads it.
            brun policy_transmission "china policy transmission lobe (build_china_policy_transmission)" scripts.build_china_policy_transmission
            # CN-SYS W9 lane unification (see research/CHINA_ENGINE_REASSESSMENT.md): masterminds/
            # strategies read only collected parquets. strategies re-runs the mastermind backtests
            # via a code import (no file dep) — kept ordered to avoid duplicating that CPU in
            # parallel, not for correctness.
            brun masterminds      "china mastermind flagships (build_china_masterminds)" scripts.build_china_masterminds
            brun strategies       "china strategy scorecards (build_china_strategies)"   scripts.build_china_strategies
          }
          cl_flowconf() {
            brun flow_velocity    "capital flow velocity — CN/HK (build_flow_velocity)" scripts.build_flow_velocity
            brun subsector_conf_cn "china subsector confluence (build_subsector_confluence --china)" scripts.build_subsector_confluence --china
            # CN-SYS W1 → W2 (hard edge): participation's zt_breadth leg reads the limit tape
            # that microstructure appends this run.
            brun microstructure   "china microstructure lobe (build_china_microstructure)" scripts.build_china_microstructure
            brun participation    "china participation lobe (build_china_participation)"   scripts.build_china_participation
            # analogs + special_sits feed band B's intel_hub; both read only the spine's
            # regime_history + collected stores, so they ride this cluster's tail.
            brun analogs          "china historical analogs (build_china_analogs)"          scripts.build_china_analogs
            brun special_sits     "china special situations (build_china_special_situations)" scripts.build_china_special_situations
          }
          # W6-CN Fix 4 (lane unification): baskets_china/_ths/baskets_hk previously built
          # in the nightly 02:00 UTC lane (via build_vector.py) on the PRIOR asia close, making
          # them one full CN session behind their sibling pages ~19.5h/day. Built here so all
          # five China surfaces share one session. build_vector.py's hook skips gracefully if
          # as_of already matches (idempotent guard). See research/CHINA_ENGINE_REASSESSMENT.md.
          cl_cn_baskets() {
            brun baskets_cn       "china A-share thematic baskets (build_baskets_china)"    scripts.build_baskets_china
            brun baskets_ths      "china THS concept baskets (build_baskets_china_ths)"     scripts.build_baskets_china_ths
            brun ths_snapshot     "china THS snapshot side-car (build_baskets_china_ths --snapshot)" scripts.build_baskets_china_ths --snapshot
            # W6-CN CN-5: CN Reversal Sleeve (SHADOW). Needs only the spine's china_search
            # plane + risk_radar_intl chip (fresh — spine step above); asia lane so the
            # forward ledger persists (lane-gated). Kept AFTER baskets_cn so the sleeve-stats
            # card baskets_cn reads stays deterministically prior-session (unchanged behavior).
            CN_SLEEVE_LANE=asia brun reversal_sleeve "cn reversal sleeve (build_cn_reversal_sleeve)" scripts.build_cn_reversal_sleeve
            brun subsector_rot    "china subsector rotation data (build_subsector_rotation_china)"  scripts.build_subsector_rotation_china
            brun subsector_rot_pages "china subsector rotation pages (build_subsector_rotation_china_pages)" scripts.build_subsector_rotation_china_pages
            COLLECT_LANE=nightly brun rotation_events_cn "china rotation events (build_rotation_events_china)"  scripts.build_rotation_events_china  # RC-R14 display-tier, reads baskets.json in-process
          }
          cl_hk() {
            brun hk               "build hong kong / hang seng (build_hk)"             scripts.build_hk
            # hk_ignition.jsonl advancer: asia-close IS the HK ignition forward-ledger nightly
            # (only fresh-HKEX lane that commits data/). engine/ignition_audit.py writers
            # self-gate on COLLECT_LANE=nightly, so arm it for THIS module only — the inline
            # `VAR=val fn` form reaches the python child and does NOT leak to later brun
            # calls (verified; same idiom as CN_SLEEVE_LANE above). Nothing else reachable
            # from build_baskets_hk reads COLLECT_LANE (verified 2026-07-16), so this arms
            # exactly the ignition ledger. daily.yml's build_vector hook re-runs the module
            # armed from the same committed store (idempotent dedup / rescue if this band
            # dies). Guarded by tests/test_ignition_lane_gate.py.
            COLLECT_LANE=nightly brun baskets_hk "hong kong thematic baskets (build_baskets_hk)" scripts.build_baskets_hk
            COLLECT_LANE=nightly brun rotation_events_hk "hk rotation events (build_rotation_events_hk)"    scripts.build_rotation_events_hk  # RC-R14 display-tier, reads hkbasketdata/baskets.json in-process
          }
          # CN-SYS W5a Scope 2 intel chain head (behavior-preserving extraction from
          # build_china.py main(); order preserved). The chain's fan-in tail (intel_hub →
          # intel_bus) moved to band B — it reads analogs/special_sits from cl_flowconf.
          cl_intel() {
            brun validation       "china validation scorecard (build_china_validation)"  scripts.build_china_validation
            brun news             "china news powerhouse (build_china_news)"             scripts.build_china_news
            brun policy_watch     "china policy watch (build_china_policy_watch)"        scripts.build_china_policy_watch
            brun altdata          "china alt-data desk (build_china_altdata)"            scripts.build_china_altdata
            brun radar            "china divergence radar (build_china_radar)"           scripts.build_china_radar
            brun synthesis        "china central analysis (build_china_synthesis)"       scripts.build_china_synthesis
          }
          # launch every cluster concurrently, then barrier before band B (cross-cluster consumers)
          cl_sector & cl_flowconf & cl_cn_baskets & cl_hk & cl_intel &
          wait
          # --- replay each builder's output GROUPED + in a stable order (post-barrier, so
          #     nothing interleaves), surface failures as annotations, summarise wall-times ---
          ORDER="sector_desk sector_cycles cycles_scorecard policy_transmission masterminds strategies flow_velocity subsector_conf_cn microstructure participation analogs special_sits baskets_cn baskets_ths ths_snapshot reversal_sleeve subsector_rot subsector_rot_pages rotation_events_cn hk baskets_hk rotation_events_hk validation news policy_watch altdata radar synthesis"
          echo "### ⏱ asia band A — per-builder wall-time" >> "$GITHUB_STEP_SUMMARY"
          for slug in $ORDER; do
            [ -f "$ART/$slug.log" ] || continue
            label=$(head -n1 "$ART/$slug.log")
            rc=$(cat "$ART/$slug.rc" 2>/dev/null || echo "?")
            sec=$(cat "$ART/$slug.sec" 2>/dev/null || echo "?")
            echo "::group::$label  [${sec}s, rc=$rc]"
            tail -n +2 "$ART/$slug.log"
            echo "::endgroup::"
            echo "- ${label} — ${sec}s (rc=${rc})" >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" != "0" ] && [ "$rc" != "?" ]; then
              echo "::error title=${label} failed (rc=${rc})::$(tail -n 2 "$ART/$slug.log" | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ ${label} failed (rc=${rc})"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 40 "$ART/$slug.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 0
      - name: CN/HK builder band B (post-barrier — cross-cluster consumers)
        # Builders whose inputs live in DIFFERENT band-A clusters, so they must wait for
        # the band-A barrier (the asia analog of daily.yml's serial build_sector_central
        # after its band). Three short clusters, same brun pattern, own scratch dir.
        #   cl_state:      CN-SYS spine chain — cycle_phase (W3: reads the W1/W2 tapes +
        #                  W4 policy_transmission tail + sector_cycles context) → market_state
        #                  (W6: reads cycle_phase.json + the W1/W2/W4 lobe JSONs +
        #                  sector_cycles leg context + baskets_china_ths latest; degrades to
        #                  phase=null if W3 missed) → mechanics (W8 cockpit: reads W3+W6
        #                  artifacts + the W1/W2 tapes).
        #   cl_intel_tail: intel_hub (fan-in over news/altdata by_ticker + radar +
        #                  special.json + analogs.json + the spine's china_standouts) →
        #                  intel_bus (reads command.json + synthesis analysis.json + every
        #                  intel surface).
        #   cl_central:    sector_central (cycles data JS from cl_sector + the china regime
        #                  gate from the spine + basket membership) — kept after the baskets
        #                  builds per the sector-central dependency rule.
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          CLAUDE_CODE_OAUTH_TOKEN_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          CLAUDE_CODE_OAUTH_TOKEN_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
          METAB_KEYS_ENABLED: ${{ vars.METAB_KEYS_ENABLED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CN_LANE: asia   # intel_hub's signal-snapshot ledger append is lane-gated
        run: |
          set +e
          ART="$RUNNER_TEMP/band2"; rm -rf "$ART"; mkdir -p "$ART"
          brun() {
            local slug="$1" label="$2" mod="$3"; shift 3
            local t0 t1 rc
            t0=$(date +%s)
            { echo "$label"; python -m "$mod" "$@" 2>&1; } > "$ART/$slug.log"; rc=$?
            t1=$(date +%s)
            echo "$rc"          > "$ART/$slug.rc"
            echo "$((t1 - t0))" > "$ART/$slug.sec"
          }
          cl_state() {
            # CN-SYS Batch-2 wiring: W6 runs AFTER W3 so cycle_phase.json is fresh; spine
            # degrades to phase=null when the W3 artifact is missing (handled inside
            # build_china_market_state). W8 reads both. All non-fatal (CN-SYS-R11).
            brun cycle_phase    "china cycle phase lobe (build_china_cycle_phase)"    scripts.build_china_cycle_phase
            brun market_state   "china market state spine (build_china_market_state)" scripts.build_china_market_state
            brun mechanics      "china mechanics cockpit (build_china_mechanics)"     scripts.build_china_mechanics
          }
          cl_intel_tail() {
            brun intel_hub      "china intel hub command apparatus (build_china_intel_hub)" scripts.build_china_intel_hub
            brun intel_bus      "china intel bus / mastermind fan-in (build_china_intel)"   scripts.build_china_intel
          }
          cl_central() {
            brun sector_central "china sector central (build_china_sector_central)"   scripts.build_china_sector_central
          }
          cl_state & cl_intel_tail & cl_central &
          wait
          ORDER="cycle_phase market_state mechanics intel_hub intel_bus sector_central"
          echo "### ⏱ asia band B — per-builder wall-time" >> "$GITHUB_STEP_SUMMARY"
          for slug in $ORDER; do
            [ -f "$ART/$slug.log" ] || continue
            label=$(head -n1 "$ART/$slug.log")
            rc=$(cat "$ART/$slug.rc" 2>/dev/null || echo "?")
            sec=$(cat "$ART/$slug.sec" 2>/dev/null || echo "?")
            echo "::group::$label  [${sec}s, rc=$rc]"
            tail -n +2 "$ART/$slug.log"
            echo "::endgroup::"
            echo "- ${label} — ${sec}s (rc=${rc})" >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" != "0" ] && [ "$rc" != "?" ]; then
              echo "::error title=${label} failed (rc=${rc})::$(tail -n 2 "$ART/$slug.log" | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ ${label} failed (rc=${rc})"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 40 "$ART/$slug.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 0
      - name: builder fail-streak escalation (consecutive-run freeze detector — CN/HK)
        # Port of daily.yml's #2738 step. asia-close is the SOLE nightly for the CN/HK
        # pages, so this lane legitimately advances its OWN forward ledger
        # (data/ci/builder_failstreaks_asia.json — committed by 'git add data/' in
        # 'commit engine outputs' below). It must NEVER share daily.yml's ledger: the
        # script binds each write lane to exactly one ledger path and degrades to
        # report-only on any mismatch (sole-advancer law). Covers BOTH bands' scratch
        # dirs (band A "$RUNNER_TEMP/band" + band B "$RUNNER_TEMP/band2"; slug sets are
        # disjoint — on a collision the later --art-dir wins). The lane is passed
        # EXPLICITLY as a CLI flag: this workflow sets NO job-wide COLLECT_LANE (arming
        # one would un-gate other ledger writers — see the baskets_hk inline-arm
        # comment above); never infer lanes from env here. Alert dedup:
        # push_ops_alert dedups on (source, type_) across lanes, so this lane emits
        # type_=fail_streak_asia — distinct from daily.yml's fail_streak — on the
        # shared builder_failstreak ops lane. Always exits 0 — never blocks the
        # deploy; brun() semantics untouched.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scripts.check_builder_failstreaks --art-dir "$RUNNER_TEMP/band" --art-dir "$RUNNER_TEMP/band2" --ledger data/ci/builder_failstreaks_asia.json --lane asia || echo "::warning::builder fail-streak check failed (non-fatal)"
      - name: rebuild China/HK stock-search libraries (resilient — guarantees the analyzers ship)
        # FAILURE-PATH safety net (asia-lane runtime diet, 2026-07-11): build_china
        # already runs build_china_library.main() IN-PROCESS (~17-30+ min — the single
        # heaviest block in the lane), so on the success path this step was pure
        # duplicate work, building the same library TWICE per lane. Mirror of
        # daily.yml's canada/intl rebuild skip: if the library's index.json is newer
        # than the job-start marker, the dashboard step built it fresh this run —
        # skip. A build_china crash BEFORE its library call leaves an old index.json
        # => marker is newer => we still rebuild and the analyzers ship.
        run: |
          set +e
          libdir() {
            case "$1" in
              scripts.build_china_library) echo site/chinastockdata;;
              scripts.build_hk_library) echo site/hkstockdata;;
            esac
          }
          for mod in scripts.build_china_library scripts.build_hk_library; do
            idx="$(libdir "$mod")/index.json"
            if [ -f "$RUNNER_TEMP/asia_libs_marker" ] && [ "$idx" -nt "$RUNNER_TEMP/asia_libs_marker" ]; then
              echo "::notice::$mod — already built fresh this run ($idx); skipping redundant rebuild"
              continue
            fi
            echo "::group::$mod"; python -m "$mod" > "$RUNNER_TEMP/lib.log" 2>&1; rc=$?; cat "$RUNNER_TEMP/lib.log"; echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then echo "::error title=$mod failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/lib.log" | tr '\n' ' ' | tail -c 500)"; fi
          done
          exit 0
      - name: CN Pick Lab — fire books + grade + render (CNPL-R8 asia lane, ≤2 min)
        # Runs AFTER build_china_library (above) so tonight's CN snapshot is on disk.
        # CN_LANE=asia is the ledger-write gate (CNPL-R8); the step always exits 0
        # (never-break contract). Artifacts committed in the "commit engine outputs"
        # step below via 'git add data/ site/' which covers:
        #   data/china_pick_lab/  (snapshots/, fires.jsonl, grades.jsonl)
        #   site/labdata/china_pick_lab.json
        #   site/china_stocks_lab.html
        #   site/factordata/china_reversion_desk.json  (produced by build_china_library)
        env:
          CN_LANE: asia
        run: |
          echo "::group::CN Pick Lab (build_china_pick_lab)"
          python -m scripts.build_china_pick_lab > "$RUNNER_TEMP/cnlab.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/cnlab.log"
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=build_china_pick_lab failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/cnlab.log" | tr '\n' ' ' | tail -c 500)"
          fi
          exit 0
      - name: HK Pick Lab — fire books + grade + render (HKPL-R8 asia lane, ≤2 min)
        # Runs AFTER build_hk_library (above) so tonight's HK snapshot is on disk.
        # CN_LANE=asia is the ledger-write gate (HKPL-R8); the step always exits 0
        # (never-break contract). Artifacts committed in the "commit engine outputs"
        # step below via 'git add data/ site/' which covers:
        #   data/hk_pick_lab/  (snapshots/, fires.jsonl, grades.jsonl)
        #   site/labdata/hk_pick_lab.json
        #   site/hk_stocks_lab.html
        #   site/factordata/hk_1d_velocity_desk.json  (enriched second pass)
        env:
          CN_LANE: asia
        run: |
          echo "::group::HK Pick Lab (build_hk_pick_lab)"
          python -m scripts.build_hk_pick_lab > "$RUNNER_TEMP/hklab.log" 2>&1; rc=$?
          cat "$RUNNER_TEMP/hklab.log"
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=build_hk_pick_lab failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/hklab.log" | tr '\n' ' ' | tail -c 500)"
          fi
          exit 0
      - name: inject data-base shim into CN/HK pages (site-wide, no-op while DATA_BASE empty)
        run: python -m scripts.inject_data_base || echo "data-base shim inject skipped (additive)"; python -m scripts.optimize_assets || echo "asset optimize skipped (additive)"
      - name: commit engine outputs
        if: always()
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/
          # force-add the gitignored per-market search libraries + reconstructed candles
          if git diff --cached --quiet; then echo "no engine output changes"; exit 0; fi
          git commit -m "engine: asia dashboards $(date -u +%F)"
          for i in 1 2 3 4 5; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if git pull --rebase --autostash -X theirs origin main; then
              # ms-board coherence guard (ui.ms_board_coherence): this lane re-renders the
              # CN/HK dashboards, so -X theirs racing another render can stitch a hybrid
              # Market State board (see the 2026-07-07 macro.html incident, commit
              # 5bf116a3b3). Restore any incoherent page WHOLESALE from post-rebase
              # origin/main and fold it into a follow-up commit.
              python3 scripts/check_ms_board_coherence.py --heal-from origin/main \
                || echo "::warning::ms-board coherence heal incomplete (incoherent board may predate this run)"
              if ! git diff --quiet -- site/; then
                git add site/ && git commit -m "render-heal: restore coherent ms-board post-rebase (ui.ms_board_coherence)" \
                  || echo "::warning::render-heal commit failed (non-fatal)"
              fi
              if git push; then echo "pushed asia engine outputs (attempt $i)"; exit 0; fi
            fi
            git rebase --abort 2>/dev/null || true; echo "asia engine push attempt $i lost a race"; sleep $((i * 7))
          done
          echo "::warning::could not push asia engine outputs after 5 attempts (non-fatal)"
      - name: publish CN/HK stores to R2 (additive; no-op without creds)
        if: always()
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.publish_r2 --dirs chinaohlc,hkohlc,subsectorohlc_china,chinastockdata,hkstockdata || echo "::warning::R2 publish failed (non-fatal)"
      - name: verify R2 data plane freshness (loud tripwire — the publish above is non-fatal)
        # The publish step swallows every failure (incl. the exit-0 no-op when the R2_*
        # secrets are absent/expired), so the live site would serve stale CN/HK per-ticker
        # data under a green run. HEAD the PUBLIC anchors instead: if the CN/HK stores
        # weren't touched within 2h, this run's publish did not land -> red run + step
        # summary. The scheduled heartbeat (scripts/healthcheck.py) independently
        # re-probes with a 26h limit.
        if: always()
        run: |
          if ! python -m scripts.audit_r2 --strict --anchors chinastockdata,hkstockdata --max-age-hours 2; then
            echo "### ❌ R2 data plane STALE/DARK — publish_r2 failed or was skipped (expired R2_* secrets?); the live site keeps serving OLD CN/HK per-ticker data. See scripts/audit_r2.py." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
