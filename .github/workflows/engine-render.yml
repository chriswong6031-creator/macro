name: engine-render
# ENGINE express lane — like `render.yml`, but ALSO re-runs the regime engine first,
# so an `engine/**` code change ships in ~50-90m (engine.run ~6m + a scope=all render
# ~40-85m) WITHOUT the nightly `daily` pipeline's ~100m of collectors, its LLM brains,
# or the ~28m special-situations EDGAR sweep.
#
# render.yml renders pages from COMMITTED engine output (it deliberately skips engine.run);
# this lane is for when the ENGINE LOGIC changed and you need the recompute reflected now.
# It regenerates the MTF signal leaf, runs engine.run, then renders — all pure functions of
# the data ALREADY committed on main (NO collectors, NO secrets, so nothing hits the network).
#
# SAFETY — why re-running engine.run here cannot corrupt anything: engine.run advances
# append-only forward-grading ledgers in the working tree (market_drivers / turning_point /
# dislocation / vol_shock append_logs, regime_history.parquet). This lane commits **site/ ONLY**
# (exactly like render.yml) — every data/ write is DISCARDED, so the nightly `daily` stays the
# single source of truth that advances each ledger exactly once. The rendered HTML reflects the
# new engine logic; the next nightly fully recomputes + commits data/.
#
# NO-REGRESS WINDOW (2026-07-13 flip-flop fix): in the post-close window the committed
# data/regime/latest.json + data/market_state/latest.json are AHEAD of the committed price
# store (the earlyclose lane / intraday fast-path heal the store ephemerally and commit only
# those snapshot pointers; the store advances at nightly). engine.run's built-in no-regress
# guard detects this (latest.json asof > store's last SPY close) and SKIPS the recompute,
# so this lane re-renders from the committed provisional snapshot instead of regressing
# every market-state surface to the prior session (the 56/MIXED ↔ 81/RISK_ON clobber).
# Consequence: an engine/** push in that window renders the new templates/builders against
# the committed regime output; the recompute itself lands at the nightly. If you truly need
# the new engine logic recomputed on the OLD session now, dispatch with force_recompute.
#
# DELIBERATELY skipped (belong to the nightly): collectors (scripts.collect), the master /
# ai_desk / narrative / altdata LLM brains + their scorers, build_special_situations (EDGAR),
# factor_series / stock_briefs, notify / archive_signals.
#
# NOTE: the render builder list below MUST stay in sync with render.yml's (spine/band/us_pages).
# If you add a page builder there, mirror it here. (A future DRY refactor could make render.yml a
# reusable workflow gated by a `run_engine` input; kept as a separate file for now to isolate the
# proven fast lane from this heavier one.)
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which pages to rebuild after the engine recompute (all = every page)"
        type: choice
        default: all
        options: [all, macro, china, hk, markets, gex, baskets, fast]
      force_recompute:
        description: "Bypass engine.run's no-regress guard (REGIME_FORCE_RECOMPUTE=1) — recompute even when the committed regime snapshot is ahead of the price store"
        type: boolean
        default: false
      runner:
        description: "Runner label — re-dispatch with macstudio if the render PC (pc-render-1) is down (GHA has no automatic label fallback)"
        type: choice
        default: render-linux
        options: [render-linux, macstudio]
  push:
    branches: [main]
    # A change to ENGINE code auto-recomputes + redeploys. Disjoint from render.yml's paths
    # (templates/** , scripts/build_*.py), so the two lanes never double-fire on one commit.
    # The nightly bot only touches data/ + site/ + reports/, so its commits never match engine/**.
    paths:
      - "engine/**"

permissions:
  contents: write   # commit the rendered site/ to main; the VPS (Caddy) serves from main

concurrency:
  # Its OWN lane — NEVER shares a group with `pipeline-daily` (so it can't cancel the nightly)
  # nor `pipeline-render` (so a template render and an engine recompute don't kill each other;
  # both commit site/ with rebase-retry, so a race is safe).
  # cancel-in-progress: FALSE — a running engine-render always finishes (never starved by the
  # next engine push); GitHub still supersedes redundant *pending* runs so only the latest
  # queued recompute runs next. (Same fix as render.yml — `true` starved the lane under bursts.)
  group: pipeline-engine-render
  cancel-in-progress: false

jobs:
  engine-render:
    # render-linux = pc-render-1, the WSL2 PC (#2771). GHA has no OR-label fallback —
    # if the PC is down, re-dispatch with runner=macstudio (the venv bootstrap and the
    # setup-node step below are portable both ways).
    runs-on: ${{ github.event.inputs.runner || 'render-linux' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 venv (self-hosted runner; Linux render-linux, Homebrew fallback)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          # render-linux (WSL2 PC) has python3.12 on PATH; a Mac fallback runner uses the Homebrew path.
          PYBIN="$(command -v python3.12 || echo /opt/homebrew/bin/python3.12)"
          [ -x "$VENV/bin/python" ] || "$PYBIN" -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - name: zstd parity for actions/cache (breadth caches are macOS-saved)
        run: |
          # actions/cache versions include the compression method: the collect lanes
          # (macOS) save the breadth close caches with zstd, so a runner WITHOUT zstd
          # computes a different cache version and every restore silently misses —
          # 2026-07-18: render-linux had no zstd, builders saw no close panel, and the
          # HK standout board shipped 0 buys. Heal if passwordless sudo allows; warn
          # loudly either way so the miss is never silent again.
          if ! command -v zstd >/dev/null 2>&1; then
            sudo -n apt-get install -y zstd >/dev/null 2>&1 || true
            command -v zstd >/dev/null 2>&1 && echo "installed zstd" || \
              echo "::warning::zstd missing on ${RUNNER_NAME:-this runner} — breadth-cache restores WILL miss (cache version mismatch vs macOS-saved entries). Install zstd in the runner distro."
          fi
      - run: pip install -r requirements.txt
      - name: restore attention store from R2 (wiki chip reads it at render)
        # data/attention/*.parquet are git-ignored (R2 data plane; deep history 2015-07→,
        # kept current by daily.yml's collect job). Non-fatal: absent store = the
        # attention chip is silently absent this render (build_attention_data -> None).
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.fetch_r2 --dirs attention || echo "::warning::attention restore failed (non-fatal — attention chip absent/stale this render)"
      # Restore the gitignored breadth/intraday caches (restore-only; the nightly `collect`
      # job produces/saves them — we fall back via restore-keys to the most recent daily's).
      - name: restore breadth (S&P 500) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-engine-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-engine-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-engine-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: restore china breadth close cache
        uses: actions/cache/restore@v4
        with:
          path: data/china_breadth/_closes_cache.parquet
          key: china-breadth-closes-engine-${{ github.run_id }}
          restore-keys: china-breadth-closes-
      - name: restore hk breadth close cache
        uses: actions/cache/restore@v4
        with:
          path: data/hk_breadth/_closes_cache.parquet
          key: hk-breadth-closes-engine-${{ github.run_id }}
          restore-keys: hk-breadth-closes-
      - name: restore intraday (4H) cache
        uses: actions/cache/restore@v4
        with:
          path: data/intraday
          key: intraday-engine-${{ github.run_id }}
          restore-keys: intraday-
      - name: price-store freshness check (last SPY bar vs expected NYSE session; check-only)
        # Same calendar assertion as daily.yml's engine gate, WITHOUT --heal: this lane is
        # deliberately network-free, so a stale committed store is annotated loudly (red step,
        # continue-on-error) rather than re-pulled. The regime recompute below then proceeds on
        # cached bars — engine.market_state.persist stamps the snapshot freshness.stale, and the
        # intraday fast-path's refresh_regime_if_stale self-heal (which IS allowed network) is
        # the healing lane. 2026-07-07 incident guard (see scripts/check_price_store_freshness).
        continue-on-error: true
        run: python -m scripts.check_price_store_freshness
      - name: recompute signals + regime from committed data (no collect / no LLM / no network)
        # The ENGINE half of the lane. Pure functions of committed data on disk: regenerate the
        # MTF signal leaf (engine.run loads it into latest["mtf_signals"]), then run engine.run.
        # NO secrets → no network. engine.run's ledger/parquet writes land in the working tree and
        # are DISCARDED by the site/-only commit below. Resilient: a failure is annotated, never
        # aborts (the render still ships whatever recomputed).
        # engine.run self-skips via its no-regress guard when the committed regime snapshot is
        # ahead of the price store (post-close provisional window — see header); the dispatch
        # input force_recompute=true overrides via REGIME_FORCE_RECOMPUTE=1.
        env:
          REGIME_FORCE_RECOMPUTE: ${{ github.event.inputs.force_recompute == 'true' && '1' || '' }}
        run: |
          set +e
          run_py() {
            local label="$1"; local mod="$2"; shift 2
            echo "::group::$label"
            python -m "$mod" "$@" > "$RUNNER_TEMP/e.log" 2>&1; local rc=$?
            cat "$RUNNER_TEMP/e.log"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$label failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/e.log" | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ $label failed (rc=$rc)"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 60 "$RUNNER_TEMP/e.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          run_py "MTF signal-quality leaf (build_signal_quality)" scripts.build_signal_quality
          run_py "§7 signal contract gate (validate_signals)"     scripts.validate_signals
          run_py "regime engine (engine.run)"                     engine.run
          exit 0
      - name: build world state (neural-web W1 — express lane)
        # Neural Web N1: recompose data/neuralweb/world_state.json from the
        # freshly recomputed engine outputs (regime/latest.json was just
        # updated by engine.run above).  O(50ms) — negligible on the render
        # budget.  Resilient: a failure keeps the last committed world_state
        # and never blocks the render.
        # git add site/ in the commit step below does NOT cover data/neuralweb/;
        # the express lane commits site/ only, so world_state.json is NOT
        # committed here — it is a working-tree side-effect that gets discarded
        # exactly like the other data/ writes (regime_history, ledger appends).
        # The nightly daily.yml run recomputes and commits it under data/.
        # This step exists so world_state is FRESH in memory for any builder
        # that reads it during the render (the builders run after this step and
        # read data/neuralweb/world_state.json from the working tree).
        run: python -m scripts.build_world_state || echo "::warning::build_world_state failed (non-fatal) — keeping last committed world_state"
      - name: build mastermind context (NW bridge)
        if: always()
        # NW → Mastermind bridge W1: compile data/neuralweb/mastermind_context.json and
        # site/neuralwebdata/mastermind_context.json from committed NW outputs.
        # Must run AFTER build world state so world_state.json is fresh.
        # Resilient: fail-open; kept last committed context on error; never blocks the render.
        run: python -m scripts.build_nw_mastermind_context || echo "::warning::build_nw_mastermind_context failed (non-fatal) — keeping last committed mastermind_context"
      # DELIBERATELY omitted from this lane (vetted 2026-07-25) — moved out of the `run:`
      # scalar 2026-07-29 (OIP E8): it is pure prose about builders this lane does NOT call,
      # and the scalar is at its GitHub length ceiling (see the NOTE ON LENGTH below).
      #  • build_odds — a collector wearing a builder's name: refetches all 119 universe
      #    tickers from yfinance on EVERY run (odds.stale_trading_days: 0) with no timeout —
      #    the same violation of this lane's "NO network" invariant that keeps
      #    build_gex_board out of the band — and its data/odds_ohlcv store is gitignored →
      #    wiped by this job's clean checkout, so every express run would COLD-START a
      #    full-history backfill (5-15+ min of third-party network). Its site/oddsmatrix
      #    payloads are gitignored and R2-published by daily.yml only, so advancing
      #    catalog.json here would silence the page's staleness banner over stale R2
      #    matrices. odds.html keeps the last nightly's values.
      #  (build_leader_radar was omitted here for the same 2026-07-25 vetting; its three
      #   named bake-side blockers — the unguarded pick_lab as_of consumption, the
      #   built_at/elapsed_s churn, and the undisclosed rs_series vintage skew — were fixed
      #   in #3578, so the builder is now admitted as a serial post-band step.)
      # ── OIP E8 express-lane coverage (2026-07-29) ──────────────────────────────
      # NOTE ON LENGTH: everything below is a YAML comment ABOVE the step, because the
      # `run:` scalar of this step is within ~350 chars of the length GitHub has been
      # observed to accept (tests/test_render_run_size_cap.py — exceed it and GitHub
      # DE-REGISTERS the workflow). Prose inside `run:` costs the scalar; prose here
      # costs nothing. Keep new explanation HERE.
      #
      # build_options_command (options.html, the canonical options surface) and
      # build_options_screener (options_screener.html + the workspace's Scanner payload
      # site/screenerdata/rows.json) were BOTH daily.yml-only. So every express render
      # refreshed the stores those pages describe and then committed the pages unchanged —
      # the flow_leaders (#3515) / research_vault (#3487) freeze class — and an edit to
      # build_options_command.py or templates/options.html.j2 never baked until the
      # nightly, because scope=all did not run the builder either.
      #
      # PLACEMENT LAW. build_options_command re-serialises six stores whose producers
      # STRADDLE the phases: vol_regime and options_screener are cl_gex members (parallel
      # band) while build_flow_leaders is the post-band flowleaders() step. So it is a
      # SERIAL POST-BAND step (optionscmd(), immediately after flowleaders()) and never a
      # cl_gex member — inside the band it would re-serialise leaders.json BEFORE
      # flowleaders() rewrote it, baking a generation-stale Leaders mode every run. Same
      # reasoning daily.yml:1314-1324 records for the same builder.
      # build_options_screener sits INSIDE cl_gex, after options_skew/options_ivspread, so
      # it reads this run's snapshots; it must not be a sibling cluster because
      # build_options_skew rewrites snapshots.parquet non-atomically (see leaderradar).
      # Both are pure functions of committed data/: zero network, site/-only writes,
      # Measured: screener 4.6s, options_command 0.4s, flowleaders ~27s -> narrow gex)
      # about +32s, cl_gex +4.6s, scope=all +0.4s (flowleaders already ran there).
      # Anti-rot: tests/test_render_options_workspace_scope.py.
      #
      # M11: build_options_entry_state is NOT in the narrow gex) case — its only output is
      # data/options_entry/state.parquet and this lane commits site/ ONLY, so it would be
      # 6.3s of discarded compute. It stays in cl_gex and in daily.yml (the lane that
      # persists it).  M10: the narrow case calls flowleaders BEFORE optionscmd, because
      # optionscmd re-serialises site/flowleaders/leaders.json and would otherwise bake a
      # silently-stale Leaders block.
      #
      # ── FD-EXP: flow_desk express-lane coverage (2026-07-30) ──────────────────
      # NOTE ON LENGTH: this prose is a YAML comment ABOVE the step, not inside `run:`.
      # The scalar has a hard ceiling GitHub enforces by DE-REGISTERING the workflow
      # (tests/test_render_run_size_cap.py); comments cost it nothing. engine-render.yml's
      # twin scalar has ~340 chars of headroom — keep new explanation HERE, in both lanes.
      #
      # build_flow_desk was the last options-family builder wired in daily.yml ONLY, so
      # site/flow_desk.html + site/flow_desk.json + site/flowdata/cohorts.json refreshed
      # once a night while every express render rebuilt the stores around them — the
      # flow_leaders (#3515) / research_vault (#3487) freeze class. An edit to the builder
      # or templates/flow_desk.html.j2 sat unbaked until the next nightly.
      #
      # ADMISSION PRECONDITION (#4007, merged 2026-07-30): the builder's three data/ write
      # paths — the broad + sector flow proxies (data/flows/*.parquet) and the cohort
      # accrual upserts (data/options_flow/cohorts_<key>.parquet, via engine.flow_cohorts)
      # — are now COLLECT_LANE=nightly-gated in code (HOUSE-U5, the build_leader_radar
      # pattern). Off-nightly the bake is a pure site/-only function of committed data/:
      # zero network, ~2.6-2.9s measured. That gate is what makes this admission safe; it
      # also closed a measured corruption where an off-nightly run appended an all-None
      # coverage=0 row to all four cohort forward ledgers.
      # Pinned by tests/test_flow_desk.py::TestProxyLaneGate and
      # tests/test_flow_cohorts.py::TestCohortAccrualLaneGate.
      #
      # PLACEMENT: inside cl_gex, immediately AFTER build_options_flow — the desk reads
      # site/flow/index.json, which build_options_flow rewrites in this same band, so it
      # must read THIS run's manifest. Mirrors daily.yml's cl_gex order exactly. The narrow
      # `gex)` case gets it in the same position.
      # The two invocation lines here carry a TERSER label than daily.yml/render.yml use
      # for the same builder ('flow desk' vs 'group flow heatmap & market tide') purely to
      # spend fewer characters of this scalar's remaining headroom. The `flow_desk` SLUG —
      # what ORDER matches and what names the log group — is identical across all lanes.
      # Anti-rot: tests/test_render_flow_desk_scope.py.
      - name: re-render pages from the freshly recomputed engine output (resilient)
        # IDENTICAL to render.yml's render step — reads the engine output just recomputed above
        # (regime/latest.json + the MTF leaf, now in the working tree) and re-renders every page.
        # Keep this builder set in sync with render.yml. NO API/LLM secrets (one flag-gated
        # exception below) — only the live-quotes worker URL (a repo VARIABLE) so
        # live_config.js keeps browser live prices wired.
        env:
          LIVE_QUOTES_WORKER_URL: ${{ vars.LIVE_QUOTES_WORKER_URL }}
          # render-only lane: commits site/ ONLY and discards every data/ write, so the
          # per-build SEC/Wikipedia drip fetches (equity_profile / edgar_rpo / edgar_headcount
          # in build_stock_library) are wasted network here — their parquet is thrown away and
          # the page renders from the committed caches. Skip them (~3-4 min off the spine, and
          # one less third-party hammer per push). The nightly `daily` leaves this unset.
          RENDER_NO_DRIP: "1"
          # The flag-gated exception: build_news title_zh cache fill (engine/news_translate.py),
          # so ZH mode isn't stuck with English titles on fresh intraday headlines. INERT unless
          # config news_translation.render_lanes is true (default off) — the RENDER_NO_DRIP=1
          # sentinel gates the call in code, so with the flag off this lane makes zero LLM calls.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          SCOPE="${{ github.event.inputs.scope }}"; SCOPE="${SCOPE:-all}"
          echo "::notice::engine-render scope = $SCOPE"
          touch "$RUNNER_TEMP/render_libs_marker"

          run_py() {
            local label="$1"; local mod="$2"; shift 2
            echo "::group::$label"
            python -m "$mod" "$@" > "$RUNNER_TEMP/step.log" 2>&1; local rc=$?
            cat "$RUNNER_TEMP/step.log"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$label failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/step.log" | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ $label failed (rc=$rc)"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 60 "$RUNNER_TEMP/step.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          spine() {
            run_py "S&P allocation vector (build_spvector)"        scripts.build_spvector
            run_py "alternative data desk (build_alt_data)"        scripts.build_alt_data
            run_py "13F smart-money tracker (build_smart_money)"   scripts.build_smart_money
            run_py "policy-lever card (build_policy_lever)"        scripts.build_policy_lever
            run_py "macro dashboard + US stocks (build_site)"      scripts.build_site
            # Buy Board 2.0 SHADOW (W6-US) — AFTER build_site, reuses its us_standouts.json +
            # setups.json + the rotation artifacts (tolerant readers). Unlinked preview + shadow
            # JSON only; main() returns 0 on any failure so it can never break the render.
            run_py "buy board 2.0 shadow (build_stock_board_v2)"   scripts.build_stock_board_v2
            run_py "reflexivity overlay (build_reflexivity_overlay)" scripts.build_reflexivity_overlay
            run_py "congressional trades desk (build_congress)"    scripts.build_congress
          }

          us_pages() {
            run_py "radar upgrade (build_radar_plus)"   scripts.build_radar_plus
            run_py "radar IC ledger (build_radar_ic)"   scripts.build_radar_ic
            run_py "radar page (build_radar_page)"      scripts.build_radar_page
            run_py "intelligence bundle (build_intelligence)" scripts.build_intelligence
            run_py "brain briefing tunnel (build_briefing)"   scripts.build_briefing
            run_py "intelligence hub (build_intel_hub)" scripts.build_intel_hub
            run_py "demand desk page (build_demand)"    scripts.build_demand
            run_py "calibration hub (build_calibration)" scripts.build_calibration
            run_py "AI daily brief page (build_aibrief)" scripts.build_aibrief
            run_py "mastermind snapshot page (build_mastermind)" scripts.build_mastermind
            run_py "AI desk page (build_ai_desk_page)"  scripts.build_ai_desk_page
          }

          hub() { run_py "bitcoin vector + landing hub (build_vector)" scripts.build_vector; }
          crypto() { run_py "crypto intelligence cockpit (build_crypto)" scripts.build_crypto; }

          # US Sector Central hub — reads baskets.json (cl_baskets) + sector_cycles_data.js
          # (sector_cycles/country_cycles, both present in render/daily cl_misc but intentionally
          # omitted from engine-render cl_misc per the suspect divergence) + the committed heatmap.
          # W5a fix: sector_central was absent from engine-render (runtime ~34s per 2026-07-03
          # daily run log — well under the 3-minute threshold). Its two direct deps
          # (baskets.json from cl_baskets, regime/latest.json from engine.run) ARE satisfied
          # by the time the band barrier fires. sector_cycles_data.js is consumed from the
          # COMMITTED artifact on disk (the last daily's write); the page renders the last
          # nightly's cycle data rather than a fresh recompute — matching the express lane's
          # stated contract ("re-render from committed data"). Call AFTER band so cl_baskets
          # has completed. Additive (returns 0 on any failure), so it can never break the deploy.
          # Ledger-safe: this lane's commit step is `git add site/` ONLY (engine-render.yml:340),
          # so data/sector_central/calls.parquet is discarded; the nightly daily.yml run is the
          # sole advancer of that forward ledger.
          central() { run_py "US sector central intelligence (build_sector_central)" scripts.build_sector_central; }

          # Flow Leaders Desk — page-only re-render from COMMITTED stores (options_flow /
          # tape_flow / polygon_gex / options_entry parquets are git-tracked; stockdata +
          # personality JSONs come fresh from spine's build_site). Display-tier by design:
          # zero data/ writes, absent-safe inputs, exit 0 — can never break the deploy.
          # WHY (2026-07-25): the builder ran ONLY in daily.yml, and 3 straight dead
          # nightlies (150m-cap cancels 07-22/23, runner loss 07-24) froze the baked page
          # at its pre-#3224 render — banned-vocab slugs live on a doctrine surface —
          # while every express lane refreshed the rest of the site around it (nav sweeps
          # editing baked chrome masked the freeze). Same daily-lane-only class + heal as
          # research_vault (#3487) / sector_central (W5a). ~27s measured on committed
          # stores. Called AFTER band(): cl_gex's build_options_entry_state rewrites
          # data/options_entry/state.parquet, an input here — serial post-band placement
          # instead of cl_misc dodges that parallel read/write window.
          flowleaders() { run_py "flow leaders desk (build_flow_leaders)" scripts.build_flow_leaders; }

          # options.html — SERIAL POST-BAND (never cl_gex): see the OIP E8 note above.
          optionscmd() { run_py "options workspace (build_options_command)" scripts.build_options_command; }

          # Leader Radar — page-only rebake from COMMITTED stores (LR-EXP). Pure function of
          # committed data (~40s measured): no network, no LLM. Consumes the stores this lane
          # has just recomputed upstream, exactly like flow_leaders above (rs_series /
          # leader_radar state+fire parquets are git-tracked; stockdata + revisions JSONs come
          # fresh from spine's build_site). Every data/ write is COLLECT_LANE=nightly-gated in
          # code (HOUSE-U5, CI-pinned by tests/test_build_leader_radar.py), so this lane's
          # site/-only commit is doubly safe. WHY (2026-07-25): daily-lane-only membership +
          # 3 dead nightlies (07-22..24) froze the baked page while express lanes refreshed
          # everything around it — same class + heal as flow_leaders / research_vault (#3487).
          # MUST run AFTER spine(): _load_stockdata reads the gitignored site/stockdata/*.json
          # that spine's build_site writes in-lane. Serial post-band, never inside band():
          # cl_gex's build_options_skew rewrites data/options_skew/snapshots.parquet
          # non-atomically — a concurrent read drops every call_skew_rich chip. Byte-stable on
          # unchanged inputs (built_at carried from the committed artifact off-nightly), so an
          # untouched radar commits nothing and the nightly dead-man reading of built_at stays
          # honest. pick_lab gates radar.json on as_of == tonight's price-through (#3578), so
          # an express commit can never advance the forward pick ledger.
          # SCOPE: called from `all` only (below). This lane has no scope picker — a push to
          # engine/** carries no inputs.scope, so SCOPE falls back to `all` and an engine
          # change (e.g. engine/leader_lifecycle.py) always re-bakes the radar. Only a
          # HAND-DISPATCHED narrow scope skips it.
          leaderradar() { run_py "leader radar desk (build_leader_radar)" scripts.build_leader_radar; }

          # Thematic Foresight desk — page-only re-render from COMMITTED stores. Express-safe
          # via two sentinels this step already arms: RENDER_NO_DRIP=1 skips the three keyless
          # collector drips (EDGAR guidance/emergence, openFDA — the FDA one fetched on EVERY
          # run) AND the analyst LLM call — this step's env carries DEEPSEEK_API_KEY for the
          # news-title exception, so env starvation alone would NOT stop a real model call;
          # the page replays the last COMMITTED theses instead (marked from_ledger, disclosed
          # PARTIAL by foresight_health). With COLLECT_LANE unset, every foresight ledger
          # appender self-gates (engine.ledger_lane, the #2598 sweep gap closed 2026-07-25),
          # so baked track/grade/monitor/ENB numbers derive from COMMITTED rows only — the
          # nightly daily.yml stays the sole forward-ledger advancer (this lane's commit is
          # `git add site/` ONLY). WHY: daily-lane-only membership + the 07-22..24 dead
          # nightlies froze foresight.html at its pre-revamp render (same class + heal as
          # research_vault #3487 / flow_leaders #3515). ~11s measured on committed stores
          # (was ~83s with the drips). Serial post-band, same slot as flowleaders; also
          # rewrites site/basketdata/foresight_cascade.json in the same pass as its page.
          foresightpage() { run_py "thematic foresight desk (build_foresight)" scripts.build_foresight; }


          band() {
            local ART="$RUNNER_TEMP/band"; rm -rf "$ART"; mkdir -p "$ART"
            brun() {
              local slug="$1" label="$2" mod="$3"; shift 3
              local t0 t1 rc
              t0=$(date +%s)
              { echo "$label"; python -m "$mod" "$@" 2>&1; } > "$ART/$slug.log"; rc=$?
              t1=$(date +%s)
              echo "$rc"          > "$ART/$slug.rc"
              echo "$((t1 - t0))" > "$ART/$slug.sec"
            }
            cl_markets() {
              brun commodities  "build commodity vector (build_commodities)"         scripts.build_commodities
              brun spr          "build strategic reserves (build_spr)"               scripts.build_spr
              brun forex        "build forex vector (build_forex)"                   scripts.build_forex
              brun bonds        "build bonds & bond-health (build_bonds)"            scripts.build_bonds
              brun crossasset   "cross-asset vector (build_crossasset)"              scripts.build_crossasset
              brun transmission "rate & inflation transmission (build_transmission)" scripts.build_transmission
              brun discovery    "discovery leaderboard (build_discovery)"            scripts.build_discovery
            }
            cl_china() { brun china "build china a-share dashboard (build_china)" scripts.build_china; }
            cl_hk()    { brun hk    "build hong kong / hang seng (build_hk)"      scripts.build_hk; }
            cl_gex() {
              # NOTE: build_gex_board is DELIBERATELY omitted from the auto (push-triggered)
              # render. Unlike every other builder here it is NOT a pure function of committed
              # data — it fetches ~700 live option chains from the free Cboe CDN (5 workers,
              # 429-rate-limited w/ multi-second backoff → ~22 min, the band's longest lane).
              # An engine/** code change cannot affect options chains, and GEX's consumers
              # (build_site, radar, engine.run) all read the COMMITTED data/gex/latest.json, so
              # skipping it here staled nothing — site/gex/* simply keeps the last nightly's
              # values until the nightly `daily` (or a manual `scope=gex` dispatch) refreshes
              # them. This also restores the lane's "NO network" invariant. See header comment.
              brun vol_regime   "index vol-regime (build_vol_regime)"        scripts.build_vol_regime
              brun options_flow "options flow desk (build_options_flow)"     scripts.build_options_flow
              brun flow_desk "flow desk (build_flow_desk)" scripts.build_flow_desk
              brun options_skew "single-name IV skew (build_options_skew)"   scripts.build_options_skew
              brun options_ivspread "single-name IV spread (build_options_ivspread)" scripts.build_options_ivspread
              # OIP E8 (note above): AFTER skew/ivspread, inside cl_gex — not a sibling.
              brun options_screener "US options screener page (build_options_screener)" scripts.build_options_screener
              # options_entry_state IS a pure function of committed data/ (polygon_gex,
              # options_skew/ivspread snapshots, options_flow, site/flow JSON) — no
              # network, ~2s — so unlike gex_board it belongs in this lane.
              brun options_entry "options entry state fusion table (build_options_entry_state)" scripts.build_options_entry_state
            }
            cl_baskets() {
              brun baskets     "thematic baskets (build_baskets)"        scripts.build_baskets
              brun news        "news suite (build_news)"                 scripts.build_news
              brun methodology "methodology page (build_methodology)"    scripts.build_methodology
            }
            cl_misc() {
              # NOTE: policy_intent_desk is DELIBERATELY omitted here. It is an LLM builder
              # (needs DEEPSEEK_API_KEY, reuses engine.master_brain's client) — exactly the
              # "master / ai_desk / narrative / altdata LLM brains" this lane's header says it
              # skips. With no secrets it cannot brief, and rather than degrade silently it was
              # exiting rc=134 (SIGABRT) every render (the LLM client aborts on init). It writes
              # a COMMITTED artifact (site/policy_intent.json), so skipping it just keeps the
              # last nightly's brief until the nightly `daily` (which HAS the key) refreshes it.
              brun seasonality   "factor seasonality (build_seasonality)"      scripts.build_seasonality
              brun reports       "research reports section (build_reports)"     scripts.build_reports
              # RV SEO (#3392 heal): vault page + per-report /research/ landing pages re-render
              # from the COMMITTED catalog (research-ingest commits it). Was daily-engine-only,
              # so the SEO pages stayed dark whenever the nightly died. Keep in render.yml too.
              brun research_vault "research vault page + report SEO pages (build_research_vault)" scripts.build_research_vault
              brun policy_watch  "fed & policy watch (build_policy_watch)"      scripts.build_policy_watch
              brun index_changes "S&P index changes (build_index_changes)"     scripts.build_index_changes
              # SGA: page-only re-render from the committed data/stage_analysis/context/latest.json
              # (mirrors render.yml cl_misc — keep the two bands in sync). Engine is daily-only.
              brun stage_analysis_page "Stage Analysis page (build_stage_analysis_page)" scripts.build_stage_analysis_page
              # TLT: page-only rebake from the COMMITTED site/factordata/tech_screener.json +
              # tech_lab.json — the page is a shell (tables fetch those JSONs client-side), so
              # this is ~0.5s and site/-only. The DATA generator (build_tech_lab_data,
              # ~219 tickers × 64 signals, + the ~8m confluence miner) is daily-offrender by
              # budget — NEVER add it here. Was engine-job-only, so the #3371 numeral fix sat
              # unbaked whenever the nightly died (07-22..25 freeze class). Mirrors render.yml.
              brun tech_lab "technical lab hub (build_tech_lab)" scripts.build_tech_lab
              # Impulse tracker: pure recompute from the tier close/volume caches (closes come
              # from this job's actions/cache restore, volume caches are git-tracked) + the
              # regime read; ZERO data/ writes; ~10-40s. In THIS lane the regime band reads
              # the engine.run-recomputed, uncommitted state from the step above — the same
              # freshness boundary build_site already crosses here. The builder self-truncates
              # both panels to their common last session (::warns on skew), so a
              # fresher-than-git closes cache can never pair positionally against stale
              # volume rows. Mirrors render.yml cl_misc.
              brun impulse "impulse tracker (build_impulse)" scripts.build_impulse
            }
            cl_markets & cl_china & cl_hk & cl_gex & cl_baskets & cl_misc &
            wait
            # research_vault added 2026-07-25 — see the twin note in render.yml: this
            # loop is what surfaces a builder's log + its rc!=0 ::error, so #3487's
            # new brun call was running unwatched in both intraday lanes.
            local ORDER="china hk commodities spr forex bonds crossasset transmission discovery vol_regime options_flow flow_desk options_skew options_ivspread options_screener options_entry baskets news methodology seasonality reports research_vault policy_watch index_changes stage_analysis_page tech_lab impulse"
            echo "### ⏱ parallel band — per-builder wall-time" >> "$GITHUB_STEP_SUMMARY"
            for slug in $ORDER; do
              [ -f "$ART/$slug.log" ] || continue
              local label rc sec
              label=$(head -n1 "$ART/$slug.log")
              rc=$(cat "$ART/$slug.rc" 2>/dev/null || echo "?")
              sec=$(cat "$ART/$slug.sec" 2>/dev/null || echo "?")
              echo "::group::$label  [${sec}s, rc=$rc]"
              tail -n +2 "$ART/$slug.log"
              echo "::endgroup::"
              echo "- ${label} — ${sec}s (rc=${rc})" >> "$GITHUB_STEP_SUMMARY"
              if [ "$rc" != "0" ] && [ "$rc" != "?" ]; then
                echo "::error title=${label} failed (rc=${rc})::$(tail -n 2 "$ART/$slug.log" | tr '\n' ' ' | tail -c 600)"
                { echo "### ❌ ${label} failed (rc=${rc})"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 40 "$ART/$slug.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          }

          libs() {
            libdir() {
              case "$1" in
                scripts.build_china_library) echo site/chinastockdata;;
                scripts.build_hk_library) echo site/hkstockdata;;
                scripts.build_canada_library) echo site/canadastockdata;;
                scripts.build_intl_library) echo site/intlstockdata;;
              esac
            }
            for mod in scripts.build_china_library scripts.build_hk_library scripts.build_canada_library scripts.build_intl_library; do
              local idx="$(libdir "$mod")/index.json"
              if [ -f "$RUNNER_TEMP/render_libs_marker" ] && [ "$idx" -nt "$RUNNER_TEMP/render_libs_marker" ]; then
                echo "::notice::$mod — already built fresh this run ($idx); skipping redundant rebuild"
                continue
              fi
              echo "::group::$mod"; python -m "$mod" > "$RUNNER_TEMP/lib.log" 2>&1; local rc=$?; cat "$RUNNER_TEMP/lib.log"; echo "::endgroup::"
              if [ "$rc" -ne 0 ]; then
                echo "::error title=$mod failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/lib.log" | tr '\n' ' ' | tail -c 600)"
                { echo "### ❌ $mod failed (rc=$rc)"; echo '```'; tail -n 40 "$RUNNER_TEMP/lib.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          }

          case "$SCOPE" in
            all)
              spine; band; central; flowleaders; optionscmd; leaderradar; foresightpage; hub; crypto; us_pages; libs ;;
            macro)
              spine; hub; crypto; us_pages ;;
            china)
              run_py "build china a-share dashboard (build_china)" scripts.build_china; hub; crypto ;;
            hk)
              run_py "build hong kong / hang seng (build_hk)" scripts.build_hk; hub; crypto ;;
            markets)
              run_py "build commodity vector (build_commodities)"         scripts.build_commodities
              run_py "build strategic reserves (build_spr)"               scripts.build_spr
              run_py "build forex vector (build_forex)"                   scripts.build_forex
              run_py "build bonds & bond-health (build_bonds)"            scripts.build_bonds
              run_py "cross-asset vector (build_crossasset)"              scripts.build_crossasset
              run_py "rate & inflation transmission (build_transmission)" scripts.build_transmission
              run_py "discovery leaderboard (build_discovery)"            scripts.build_discovery
              hub; crypto ;;
            gex)
              run_py "GEX magnets board (build_gex_board)"      scripts.build_gex_board
              run_py "index vol-regime (build_vol_regime)"      scripts.build_vol_regime
              run_py "options flow desk (build_options_flow)"   scripts.build_options_flow
              run_py "flow desk (build_flow_desk)" scripts.build_flow_desk
              run_py "single-name IV skew (build_options_skew)" scripts.build_options_skew
              run_py "single-name IV spread (build_options_ivspread)" scripts.build_options_ivspread
              run_py "US options screener page (build_options_screener)" scripts.build_options_screener
              # flowleaders BEFORE optionscmd (M10) — see the OIP E8 note above the step.
              flowleaders; optionscmd
              hub; crypto ;;
            baskets)
              run_py "thematic baskets (build_baskets)"     scripts.build_baskets
              run_py "news suite (build_news)"              scripts.build_news
              run_py "methodology page (build_methodology)" scripts.build_methodology
              run_py "radar upgrade (build_radar_plus)"     scripts.build_radar_plus
              run_py "radar IC ledger (build_radar_ic)"     scripts.build_radar_ic
              run_py "radar page (build_radar_page)"        scripts.build_radar_page
              hub; crypto ;;
            fast)
              # Early-close provisional render (FTR W6, PR-7).
              # Runs the macro+baskets clusters only — the smallest set that gives a
              # meaningful provisional EOD state within the 30-45 min budget.
              # Explicitly excluded: gex (live network fetches), special-situations
              # (EDGAR), LLM brains (policy_intent_desk/ai_desk), collectors,
              # china/hk/markets clusters (not changed by intraday US session moves),
              # us_pages (intel-hub/briefings — LLM-dependent), libs (stock libraries).
              # Steps reused verbatim from the macro and baskets scope branches above.
              spine
              run_py "thematic baskets (build_baskets)"     scripts.build_baskets
              run_py "news suite (build_news)"              scripts.build_news
              run_py "methodology page (build_methodology)" scripts.build_methodology
              run_py "radar upgrade (build_radar_plus)"     scripts.build_radar_plus
              run_py "radar IC ledger (build_radar_ic)"     scripts.build_radar_ic
              run_py "radar page (build_radar_page)"        scripts.build_radar_page
              hub; crypto ;;
            *)
              echo "::error::unknown scope '$SCOPE'"; exit 1 ;;
          esac
          exit 0
      - name: render ticker dossiers from rebuilt US stockdata
        env:
          # Keep the express lane network-free. Cached logos still render; cache misses
          # wait for the nightly instead of reaching the logo CDN from this job.
          RENDER_NO_DRIP: "1"
        run: |
          set -euo pipefail
          SCOPE="${{ github.event.inputs.scope }}"; SCOPE="${SCOPE:-all}"
          case "$SCOPE" in
            all|macro) ;;
            *) echo "::notice title=ticker_dossiers::scope=$SCOPE does not run the full dossier pass — skipped"; exit 0 ;;
          esac

          LOG="$RUNNER_TEMP/ticker-pages.log"
          MANIFEST="$RUNNER_TEMP/ticker-pages-manifest.json"
          python -m scripts.build_ticker_pages --manifest-out "$MANIFEST" 2>&1 | tee "$LOG"
          COUNT=$(sed -nE 's/.*ticker_pages::rendered=([0-9]+).*/\1/p' "$LOG" | tail -n 1)
          if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
            echo "::error title=ticker_dossiers::builder emitted no ticker pages"
            exit 1
          fi

          python - "$MANIFEST" "$COUNT" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path("site/stocks")
          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          logged_count = int(sys.argv[2])
          tickers = manifest.get("tickers") or []
          pages = [root / f"{ticker}.html" for ticker in tickers]
          markers = ("data-company-intelligence", "company-intelligence-dossier.js")
          missing = [
              path.name
              for path in pages
              if not path.is_file()
              or any(marker not in path.read_text(encoding="utf-8") for marker in markers)
          ]
          if manifest.get("schema") != "ticker-page-render-manifest.v1":
              print("::error title=ticker_dossiers::render manifest schema is invalid", flush=True)
              raise SystemExit(1)
          if manifest.get("failure_count") or manifest.get("failed_tickers"):
              failures = manifest.get("failed_tickers") or []
              sample = ", ".join(str(ticker) for ticker in failures[:20])
              print(
                  f"::error title=ticker_dossiers::{len(failures)} admitted ticker pages failed to render; "
                  f"sample: {sample}",
                  flush=True,
              )
              raise SystemExit(1)
          if manifest.get("index_written") is not True:
              print("::error title=ticker_dossiers::ticker index did not render", flush=True)
              raise SystemExit(1)
          if (not tickers or manifest.get("rendered_count") != len(tickers)
                  or manifest.get("rendered_count") != logged_count):
              print("::error title=ticker_dossiers::render manifest is empty or inconsistent", flush=True)
              raise SystemExit(1)
          if missing:
              sample = ", ".join(missing[:20])
              print(
                  f"::error title=ticker_dossiers::{len(missing)} of {len(tickers)} rendered ticker pages "
                  f"lack the Company Intelligence shell; sample: {sample}",
                  flush=True,
              )
              raise SystemExit(1)
          print(
              f"::notice title=ticker_dossiers::{len(tickers)} rendered ticker pages carry the Company Intelligence shell",
              flush=True,
          )
          PY
      - name: ensure node for the inline-JS guard
        # check_inline_js shells out to `node --check`. pc-render-1 (WSL2, #2771) shipped
        # WITHOUT node, so this guard failed on every render there 07-18; the historical
        # always-publish path still shipped that unverified JS. Publication is now gated.
        # setup-node installs into the runner tool cache: works on Linux AND a Mac fallback.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: guard — inline JS must parse
        # Same gate as render.yml/pages.yml: a JS syntax error keeps the last-good site live.
        run: python3 scripts/check_inline_js.py site
      - name: guard — no dead site references
        run: python3 scripts/check_site_asset_refs.py site
      - name: guard — market-state board coherence (ui.ms_board_coherence)
        # A freshly rendered board whose verdict/score/thesis/notes disagree means the
        # render itself is broken (engine or template regression) — restore last-good
        # boards from checkout HEAD, then fail RED for visibility. The rebase-race
        # hybrid variant (2026-07-07,
        # commit 5bf116a3b3) is healed separately inside the push loop below.
        # !cancelled() keeps the heal visible even when an earlier guard failed; the
        # success-gated finalization/commit steps still refuse to publish that tree.
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/check_ms_board_coherence.py && exit 0
          python3 scripts/check_ms_board_coherence.py --heal-from HEAD || true
          exit 1
      - name: publish rebuilt US stockdata to R2 (browser data plane)
        # engine.run can change per-name display payloads without changing a template.
        # spine rebuilds the complete US stockdata tree for all/macro/fast scopes, and
        # the browser consumes that tree from R2. Publish it before the working tree is
        # discarded so a green engine-render cannot leave new engine output stranded
        # until the nightly. --no-manifest protects the multi-market remote manifest.
        # Credentials and the three-attempt sync are deliberately hard gates here.
        if: ${{ success() }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          SCOPE="${{ github.event.inputs.scope }}"; SCOPE="${SCOPE:-all}"
          case "+$SCOPE+" in
            *"+all+"*|*"+macro+"*|*"+fast+"*) ;;
            *) echo "::notice::scope=$SCOPE did not rebuild US stockdata — R2 sync skipped"; exit 0 ;;
          esac
          for V in R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!V}" ]; then
              echo "::error title=engine-render stockdata publish unavailable::$V is unset"
              exit 1
            fi
          done
          if [ ! -s site/stockdata/index.json ]; then
            echo "::error title=engine-render stockdata publish refused::site/stockdata/index.json is absent or empty"
            exit 1
          fi
          for ATTEMPT in 1 2 3; do
            if python -m scripts.publish_r2 --dirs stockdata --no-manifest; then
              echo "::notice::engine-render stockdata published to R2 on attempt $ATTEMPT"
              exit 0
            fi
            echo "::warning::engine-render stockdata R2 attempt $ATTEMPT failed; retrying"
            sleep $((ATTEMPT * 10))
          done
          echo "::error title=engine-render stockdata publish failed::R2 sync failed after 3 attempts"
          exit 1
      - name: inject data-base shim (site-wide; a re-render would strip it otherwise)
        # A cancelled, timed-out, or guard-failed engine render must keep the last-good
        # committed site live. Normalize only a tree whose builders and first-pass guards
        # succeeded, then re-run the dead-reference guard on the finalized bytes below.
        if: ${{ success() }}
        run: |
          # Keep the embedded procurement bundle tied to this checkout's canonical
          # evidence before the site-wide normalizers rewrite every HTML page.
          python -m scripts.build_government_revenue --site-only
          if ! git diff --quiet -- \
            data/government_revenue/latest.json \
            data/government_revenue/workspace.json \
            data/government_revenue/dossiers.json \
            data/government_revenue/subaward_dossiers.json \
            data/government_revenue/idv_dossiers.json \
            data/government_revenue/budget_program_graph.json; then
            echo "::error title=government-revenue projection drift::engine-render would publish non-canonical procurement site twins"
            exit 1
          fi
          python -m scripts.inject_data_base || echo "data-base shim inject skipped (additive)"
          python -m scripts.externalize_css || echo "css externalize skipped (additive)"
          # ::warning::, not a bare echo — this step is the only thing that moves a ?v=
          # stamp, and the edge serves versioned assets `immutable, max-age=1y`, so a failure
          # swallowed into a green run pins returning browsers to the old bytes for a year
          # (#3617/#3624). See render.yml for the full rationale.
          python -m scripts.optimize_assets || echo "::warning::asset optimize FAILED — ?v= stamps may be stale"
      - name: guard — finalized site has no dead references
        # externalize_css can create and prune content-addressed stylesheets. Validate the
        # exact post-normalization tree that would be committed, not only the pre-pass.
        if: ${{ success() }}
        run: |
          python3 scripts/check_site_asset_refs.py site
          python -m scripts.check_government_revenue_projection
      - name: commit rendered site (site/ ONLY — never data/, so every ledger stays pristine)
        # Fail closed: no cancelled run or failed guard is allowed to mutate main.
        if: ${{ success() }}
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # ONLY site/ — never data/ or reports/. engine.run + the builders touch data/ in the
          # working tree (regime recompute, ledger appends, cache writes); committing NONE of it
          # keeps the nightly the single advancer of every forward-accountability ledger.
          # pre-commit template↔site re-sync (ui.template_site_sync): inject_data_base +
          # externalize_css above rewrite the site/ copies of the ~48 templates/-paired
          # plain-copy assets, so this FIRST commit always carried the divergence and only
          # the post-rebase --fix inside the push loop below healed it, one follow-up commit
          # later. Any cancellation/failure between the two ships the divergence: 2026-07-24
          # run 30057066815 was cancelled mid-push-loop and landed b6386adb4af (externalized
          # site/index.html + site/chat.html, no heal commit) — main's sync gate went red on
          # every PR until #3358. Heal BEFORE staging so the first commit is never diverged;
          # the post-rebase --fix below STAYS (it re-copies from fresh post-rebase templates/,
          # guarding the -X theirs mid-render-merge reword case, 2026-07-07 incident).
          python -m scripts.check_template_site_sync --fix || true
          python3 scripts/check_conflict_markers.py --file site/start.html
          # start runtimes single-instance (ui.start_runtime_single_instance): a stale-
          # checkout render re-emits doubled live tags with ZERO markers (adad513bdfe),
          # so the marker gate above can't see it — heal from HEAD (the last committed
          # page, at most one render old) rather than forfeit the whole render.
          python3 scripts/check_start_runtime.py --heal-from HEAD
          # templates/ too, and ONLY for the plain-copy HTML pairs (index.html, chat.html):
          # optimize_assets re-stamps their templates/ side because the --fix above rewrites
          # their site copy FROM templates/ — a stamp staged site-only is reverted before it
          # reaches main (#3617's fix never reached one returning browser), and staging site/
          # alone would land the pair diverged and red the publish gate. Nothing else in the
          # build path writes templates/. See render.yml.
          # refuse stash/rebase wreckage (2026-08-01 d29e4dd44d: a conflicted
          # autostash apply was staged wholesale — 1,704 pages shipped markers)
          bash "${GITHUB_WORKSPACE:-.}/scripts/ci/strip_conflict_markers.sh"
          git add site/
          # separate + tolerant: `git add site/ templates/` exits 128 when a pathspec
          # matches nothing, and this step runs under `-eo pipefail` — a missing
          # templates/ would abort the commit and lose the whole render rather than
          # just the stamp. Staging site/ keeps its hard-fail semantics.
          git add templates/ 2>/dev/null || true
          git add -f site/stockbrief 2>/dev/null || true
          if git diff --cached --quiet; then echo "no rendered-site changes to commit"; exit 0; fi
          # Fail-closed conflict gate (P0 2026-08-01, d29e4dd44d / #4167): refuse to
          # commit staged `Updated upstream / Stashed changes` blocks or unmerged
          # index entries — a conflicted autostash apply is the known source.
          push_staged_heal site/ templates/ || exit 1
          # The sync/runtime/marker heals above can replace pages after the standalone
          # finalized-tree step. Validate the exact healed tree represented by the index.
          python3 scripts/check_site_asset_refs.py site
          python -m scripts.check_government_revenue_projection
          git commit -m "engine-render: regime recompute + re-render $(date -u +%F) (scope=${{ github.event.inputs.scope || 'all' }})"
          # --autostash: we commit site/ ONLY, leaving the render's throwaway data/ writes
          # unstaged; a plain `pull --rebase` refuses on a dirty tree and silently failed
          # EVERY push. Autostash parks them, rebases, restores. This push is the only path
          # to the live site (VPS serves committed main; no Pages-artifact fallback).
          PUSH_BUDGET_SECS=600     # this push is the ONLY path to the live site — worth 10 min of waiting for the ref
          PUSH_MAX_ATTEMPTS=20   # let the 600s DEADLINE stop this loop, not the attempt count: 10 contention
                                 # retries burn only ~2 min, so the raised budget above would never bind
          push_retry_init "engine-rendered site"
          while push_attempt; do
            # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
            # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
            # refuses ("untracked working tree files would be overwritten") and --autostash can't
            # clear it (it parks tracked modifications only), so every retry dies identically.
            # Everything this step publishes is already committed above, so a path untracked HERE
            # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
            # Gitignored files and untracked paths origin/main doesn't track never enter the
            # intersection (runner-local stores and caches are untouched).
            git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            # rename/rename on content-hashed site/assets/css/* is deterministic across
            # retries (path conflict; -X theirs can't settle it — 2026-07-22 asia-close
            # run 29904079071 dropped a day's outputs this way). The autoresolver keeps
            # both sides' hashed files (next externalize_css prunes the orphan) and
            # finishes the rebase; anything else is left for the abort+retry below.
            if { git pull --rebase --autostash -X theirs origin main || bash scripts/rebase_autoresolve_hashed_css.sh; } && push_autostash_ok; then
              # Prove the rebased render commit itself before any optional heal. If a
              # later follow-up commit is skipped, this is the exact HEAD we still push.
              python3 scripts/check_site_asset_refs.py site
              # Refresh from the post-rebase evidence generation so a long-running
              # express render cannot overwrite a newer SAM projection with its
              # checkout-time embedded bundle.
              python -m scripts.build_government_revenue --site-only
              if ! git diff --quiet -- \
                data/government_revenue/latest.json \
                data/government_revenue/workspace.json \
                data/government_revenue/dossiers.json \
                data/government_revenue/subaward_dossiers.json \
                data/government_revenue/idv_dossiers.json \
                data/government_revenue/budget_program_graph.json; then
                echo "::error title=government-revenue projection drift::post-rebase canonical and rebuilt procurement bundles differ"
                exit 1
              fi
              # post-rebase template↔site re-sync (ui.template_site_sync). -X theirs can
              # resurrect this run's checkout-time template copies over a reword that merged
              # MID-RENDER: 2026-07-07 incident — run 28835838497 (110 min, checkout
              # 9208ef4920) pushed 2ae709f9f0, whose site/sector_cycles.js was byte-identical
              # to the CHECKOUT-TIME template blob, reverting #1793's de-escalation merged
              # 20 min earlier. templates/ is now fresh post-rebase main — re-copy the
              # plain-copy page assets from it and fold any delta into a follow-up commit.
              # re-stamp POST-rebase (ui.asset_stamp): the tree this loop PUSHES is not the tree
              # the normalizer step stamped — pages a sibling lane lands mid-render arrive here
              # un-stamped and unseen by that pass (2026-07-26 render 6260e5ac8c0 shipped
              # site/us_track_record.html with a bare `theme.css` this way). Idempotent, ~11s over
              # 3.2k pages, and BEFORE the --fix so the pairs heal from a re-stamped templates/.
              python -m scripts.optimize_assets || echo "::warning::post-rebase asset optimize FAILED — ?v= stamps may be stale"
              python -m scripts.check_template_site_sync --fix || true
              # ms-board coherence guard (ui.ms_board_coherence): -X theirs resolves whole
              # conflict REGIONS toward this run's replayed render, so racing another
              # mid-render lane can stitch a hybrid Market State board — 2026-07-07 commit
              # 5bf116a3b3 (render.yml racing THIS lane's 7a1c30ced4) baked upstream's
              # score 56/"Mixed" beside the replayed run's stale "Risk Radar forces
              # Risk-off." note. Restore any incoherent page WHOLESALE from post-rebase
              # origin/main (coherent, at most one render old).
              python3 scripts/check_ms_board_coherence.py --heal-from origin/main \
                || echo "::warning::ms-board coherence heal incomplete (incoherent board may predate this run)"
              # refuse stash/rebase wreckage (2026-08-01 d29e4dd44d: a conflicted
              # autostash apply was staged wholesale — 1,704 pages shipped markers)
              bash "${GITHUB_WORKSPACE:-.}/scripts/ci/strip_conflict_markers.sh"
              python3 scripts/check_conflict_markers.py --file site/start.html
              python3 scripts/check_start_runtime.py --heal-from origin/main
              # A rebase can combine this run's stale page with main's newer deletion of
              # its content-addressed asset (2026-08-01 crypto.html -> 94a4f2e3.css).
              # Recheck the actual post-rebase tree before creating a heal commit or push.
              python3 scripts/check_site_asset_refs.py site
              python -m scripts.check_government_revenue_projection
              if ! git diff --quiet -- site/ templates/; then
                # push_staged_clean: never bake conflict markers into the follow-up
                # commit (P0 d29e4dd44d/#4167). On a dirty scan: unstage and push the
                # guarded render commit alone — same forfeit as a failed render-sync.
                git add site/
                git add templates/ 2>/dev/null || true
                if push_staged_clean site/ templates/; then
                  git commit -m "render-sync: post-rebase guards (re-stamp + template re-copy + ms-board coherence)" \
                    || echo "::warning::render-sync commit failed (non-fatal — pages publish gate backstops divergence)"
                else
                  git reset -q -- site/ templates/ || true
                  # restore offenders' worktree bytes too (word-split safe:
                  # no tracked path contains whitespace)
                  for f in $PUSH_STAGED_OFFENDERS; do git checkout HEAD -- "$f" 2>/dev/null || true; done
                  echo "::warning title=render-sync skipped::post-rebase site/templates scanned dirty (conflict markers) — follow-up commit skipped; pushing the guarded render commit only"
                fi
              fi
              if ! git diff --quiet HEAD -- \
                site/government_revenue.html \
                site/government-revenue-data/latest.json \
                site/government-revenue-data/workspace.json \
                site/government-revenue-data/dossiers.json \
                site/government-revenue-data/subaward-dossiers.json \
                site/government-revenue-data/idv-dossiers.json \
                site/government-revenue-data/budget-program.json; then
                echo "::error title=government-revenue projection uncommitted::refusing to push a HEAD older than the validated procurement projection"
                exit 1
              fi
              python -m scripts.check_government_revenue_projection
              if push_do; then echo "pushed engine-rendered site on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::error title=engine-rendered site NOT pushed::$PUSH_ATTEMPT rebase/push attempts failed ($PUSH_STOP) — this push is the ONLY path to the live site (VPS serves committed main; no Pages-artifact fallback), so live pages stay stale until the next render lane re-lands. Check the per-attempt [class] tags above: repeated [contention] means main is simply busier than this budget, repeated [rebase-conflict] means a NEW deterministic conflict class — see scripts/rebase_autoresolve_hashed_css.sh."
          echo "### ❌ engine-rendered site NOT pushed after $PUSH_ATTEMPT attempts — live site stale until the next render/nightly re-lands" >> "$GITHUB_STEP_SUMMARY"
