name: weekly
on:
  schedule:
    - cron: "0 14 * * 6"    # Saturday 14:00 UTC — deep-dive report
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: weekly collectors (COT, sentiment refresh — the daily brief covers reporting)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python -m scripts.collect --only cot,sentiment_naaim,sentiment_aaii,fundamentals,stock_fundamentals
          python -m scripts.recalibrate
          python -m engine.run
          python -m scripts.build_site
          python -m scripts.daily_brief
          python -m scripts.calibrate_china    # weekly: refresh China regime/ladder forward-return calibration
          python -m scripts.build_china        # after build_site, before build_vector (hub)
          python -m scripts.calibrate_commodities  # weekly: refresh commodity split-half forward verdicts
          python -m scripts.build_commodities      # after build_site/build_china, before build_vector (hub)
          python -m scripts.calibrate_vector   # weekly: refresh vector forward-return verdicts + backtests
          python -m scripts.build_vector       # after build_site: macro->macro.html, hub->index.html
      - name: commit
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ reports/ site/
          if git diff --cached --quiet; then echo "no weekly changes"; exit 0; fi
          git commit -m "weekly: deep-dive $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "pushed weekly outputs on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "weekly push attempt $i lost a race; re-syncing"; sleep $((i * 7))
          done
          echo "::warning::could not push weekly outputs after 5 attempts (non-fatal — site still deploys via artifact)"
      - name: upload pages artifact
        if: always()   # deploy must not hinge on the commit-push above succeeding
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  publish:
    needs: weekly-report
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
