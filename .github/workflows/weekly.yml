name: weekly
on:
  schedule:
    - cron: "0 14 * * 6"    # Saturday 14:00 UTC — deep-dive report
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: weekly collectors (COT, sentiment refresh) + report
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python -m scripts.collect --only cot,sentiment_naaim,sentiment_aaii,fundamentals
          python -m engine.run
          python -m scripts.weekly_report
      - name: notify weekly summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scripts.notify
      - name: commit
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ reports/ site/
          git diff --cached --quiet || git commit -m "weekly: deep-dive $(date -u +%F)"
          git pull --rebase origin main
          git push
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  publish:
    needs: weekly-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
