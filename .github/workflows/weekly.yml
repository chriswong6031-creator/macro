name: weekly
on:
  schedule:
    - cron: "0 14 * * 6"    # Saturday 14:00 UTC — deep-dive report
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Serialized batch lane shared with backfill / special-sits-backfill. daily has its own
  # "pipeline-daily" lane, so weekly never blocks (and is never blocked by) the daily refresh.
  group: pipeline-batch
  cancel-in-progress: false

jobs:
  weekly-report:
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 120    # weekly does collectors + all calibrations + every dashboard build; 45m was too tight on congested 2-core runners
    steps:
      - uses: actions/checkout@v4
      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: restore attention store from R2 (wiki chip reads it at render)
        # data/attention/*.parquet are git-ignored (R2 data plane; deep history 2015-07→,
        # kept current by daily.yml's collect job). Non-fatal: absent store = the
        # attention chip is silently absent this render (build_attention_data -> None).
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.fetch_r2 --dirs attention || echo "::warning::attention restore failed (non-fatal — attention chip absent/stale this render)"
      # The library build (build_site) needs every S&P 1500 constituent close
      # matrix present. Weekly does not re-collect them, so restore from the
      # cache the daily run saved (caches are gitignored, not committed).
      - name: restore breadth (S&P 500) close cache
        uses: actions/cache@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-weekly-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) close cache
        uses: actions/cache@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-weekly-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) close cache
        uses: actions/cache@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-weekly-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: weekly collect + recalibrate + build (resilient, self-diagnosing)
        # Same hardening as daily: each step runs isolated; a failure becomes a
        # ::error:: annotation (readable on the run page + via the public check-runs
        # API) + a traceback in the run Summary, but NEVER aborts the job — so one
        # broken calibration/builder can't kill the whole weekly deploy. A failed
        # calibration just leaves last week's (stale) calibration in place.
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # see daily.yml: turns ON browser live prices when the repo var is set.
          LIVE_QUOTES_WORKER_URL: ${{ vars.LIVE_QUOTES_WORKER_URL }}
        run: |
          set +e
          run_py() {
            local label="$1"; shift
            echo "::group::$label"
            python -m "$@" > /tmp/step.log 2>&1; local rc=$?
            cat /tmp/step.log
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$label failed (rc=$rc)::$(tail -n 2 /tmp/step.log | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ $label failed (rc=$rc)"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 60 /tmp/step.log; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          run_py "weekly collectors" scripts.collect --only cot,sentiment_naaim,sentiment_aaii,fundamentals,stock_fundamentals
          # Phase-1+ survivorship de-bias, CIK long tail: lift the dead names that
          # company_tickers.json/Polygon can't reach (acquired/renamed → dropped from the
          # current ticker map) via the windowed EDGAR full-text crawl (efts.sec.gov +
          # data.sec.gov submissions confirm). Resolve-only + drip-capped (~200 tickers
          # /run, SEC-paced); resilient (efts 5xx retry next run). Runs FIRST so newly
          # resolved CIKs feed the companyfacts pull below in the same run. Honest,
          # partial yield by design — see data/edgar/_dead_name_coverage.json fts_funnel.
          run_py "dead-name CIK crawl (EDGAR full-text)" scripts.build_dead_name_fundamentals --resolve-only --fts-max 200
          # Phase-1B survivorship de-bias: resolve dead S&P names -> CIK (needs
          # www.sec.gov/Polygon, reachable from CI; cached) + drip companyfacts into
          # data/edgar/dead_name_panel.parquet stamped with the true filed date.
          # Resilient (run_py tolerates SEC hiccups); ~200 filers/run accrue coverage.
          run_py "dead-name fundamentals (de-bias)" scripts.build_dead_name_fundamentals --max-new 200
          # Phase-1A dead-name PRICES: recover delisted daily closes (Stooq/Polygon,
          # reachable from CI; yfinance ~0) so the merged panel can compute dead-name
          # forward returns. Resilient + drip-capped; nothing depends on it.
          run_py "dead-name prices (de-bias)" scripts.build_dead_name_prices --max-new 150
          # Phase-1A+ bankruptcy tail: classify each dead CIK acquisition/bankruptcy/
          # unknown from its 8-K Item 1.03 (data.sec.gov, reachable everywhere) and
          # impute a −100% terminal close for flagged bankruptcies that have a price
          # anchor, so the leak-free backtest realizes the wipe instead of a survivorship
          # gap. Resilient + drip-capped; softens the price-coverage residual-bias caveat.
          run_py "dead-name bankruptcy imputation (8-K 1.03)" scripts.build_dead_name_delisting --max-new 200
          # De-biased factor IC scorecard over the survivor+dead MERGED universe ->
          # data/edgar/ic_scorecard_debiased.json. Self-gating (equals the survivor
          # scorecard until dead-name prices accrue); never clobbers ic_scorecard.json.
          run_py "de-biased IC scorecard" scripts.factor_ic_scorecard --debiased --horizon 63
          # Phase-4 breadth honesty: leak-free PIT IC test of the new fundamental-trend
          # legs -> BH-FDR + VIF prune + inverse-corr shrinkage -> data/strategies/
          # signal_factory.json. Ledger-logged (idempotent — dedups by config).
          run_py "signal factory (breadth honesty)" scripts.signal_factory
          run_py "recalibrate (macro)" scripts.recalibrate
          run_py "regime engine (engine.run)" engine.run
          run_py "S&P allocation vector (build_spvector)" scripts.build_spvector
          run_py "policy-lever card (build_policy_lever)" scripts.build_policy_lever
          run_py "macro dashboard + US stocks (build_site)" scripts.build_site
          # descriptive A-share fundamentals (akshare, keyless) — refresh high-value
          # names + widen the universe ~150/run; the China build reads the cache.
          run_py "china fundamentals (subset)" collectors.china_fundamentals
          run_py "china fundamentals (widen)" collectors.china_fundamentals --all --limit 150
          run_py "calibrate china" scripts.calibrate_china
          run_py "build china" scripts.build_china
          run_py "hk fundamentals" collectors.hk_fundamentals
          run_py "calibrate hk" scripts.calibrate_hk
          run_py "build hk" scripts.build_hk
          run_py "calibrate commodities" scripts.calibrate_commodities
          run_py "research commodity conviction" scripts.research_commodity_conviction
          run_py "build commodities" scripts.build_commodities
          run_py "calibrate bonds" scripts.calibrate_bonds
          run_py "build bonds" scripts.build_bonds
          run_py "calibrate rate/inflation transmission" scripts.calibrate_rate_inflation
          run_py "build transmission" scripts.build_transmission
          run_py "calibrate vector" scripts.calibrate_vector
          run_py "validate gex (forward-RV gate)" scripts.validate_gex
          run_py "build vector + landing hub" scripts.build_vector
          run_py "AI brief page (build_aibrief)" scripts.build_aibrief
          exit 0
      - name: rebuild stock-search libraries (resilient — guarantees the analyzers ship)
        # build_china/build_hk (and build_canada/build_intl via build_vector hooks)
        # swallow errors; rebuild the per-stock search JSON (site/chinastockdata,
        # site/hkstockdata, site/canadastockdata, site/intlstockdata) directly from
        # committed caches so the A-Share / HK / TSX / intl analyzers always ship.
        # Idempotent; non-fatal.
        run: |
          set +e
          for mod in scripts.build_china_library scripts.build_hk_library scripts.build_canada_library scripts.build_intl_library; do
            echo "::group::$mod"; python -m "$mod" > /tmp/lib.log 2>&1; rc=$?; cat /tmp/lib.log; echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$mod failed (rc=$rc)::$(tail -n 2 /tmp/lib.log | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ $mod failed (rc=$rc)"; echo '```'; tail -n 40 /tmp/lib.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 0
      - name: inject data-base shim (site-wide; a re-render would strip it otherwise)
        run: python -m scripts.inject_data_base || echo "data-base shim inject skipped (additive)"
      - name: commit weekly outputs
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ reports/ site/
          # W0b sibling fix (#1963, 2026-07-08 stale-HK incident): asia-close.yml runs
          # daily at 08:30 UTC INCLUDING Saturdays and is the sole authoritative writer
          # of all china*/hk*/hkma data stores. Weekly runs at 14:00 UTC — AFTER the
          # Saturday asia-close has already committed fresh HK/China data. This job runs
          # build_china/build_hk/calibrate_china/calibrate_hk (which write to
          # data/china_regime/, data/hk_regime/ etc.), but a checkout-time stale copy of
          # data/china_stocks/, data/hk_stocks/, data/china_breadth/, data/hk_breadth/
          # etc. can also be staged by the broad `git add data/` above. Combined with
          # `-X theirs` on the rebase-push, this would clobber asia-close's fresh commit
          # with the checkout's stale snapshot — the same bug class as the 2026-07-08
          # daily.yml incident (fixed in #1963).
          # Guard: unstage every asia-close-owned path after the broad add so `-X theirs`
          # is harmless for the asia data plane. Path derivation matches #1963: asia group
          # = adapters starting with `china` or `hk` (scripts/collect.py group_members);
          # data/hkma adapter key `hkma` also starts with `hk`.
          # Trade-off: weekly's calibration outputs at data/china_regime/ and
          # data/hk_regime/ are also excluded, so they stay at last Saturday's state on
          # main until next Saturday. This is acceptable: calibration is designed to be
          # weekly-stable, and preventing a stale-overwrite of fresh market data is the
          # higher-priority safety invariant. (asia-close does not run calibrate_china/
          # calibrate_hk, so there is no daily lane to carry these forward.)
          git reset -q -- data/hk data/hk_* data/hkma data/china data/china_* 2>/dev/null || true
          # Stock-search libraries are gitignored — force-add so the committed-tree
          # deploy ships their index/detail JSON. See daily.yml.
          if git diff --cached --quiet; then echo "no weekly changes to commit"; exit 0; fi
          git commit -m "weekly: deep-dive $(date -u +%F)"
          # best-effort push: losing a race with a concurrent push must NOT fail the
          # pipeline (the deploy below uses the uploaded artifact). Retry rebase+push,
          # preferring our freshly-built outputs on any conflict.
          # --autostash: parity with daily.yml (#1823 fix); prevents an "unstaged changes"
          # rebase halt when builders leave stray tracked writes outside staged paths
          # (e.g. reports/*.md graders, site/qledger/) — without it, the push dies after
          # 5 attempts and the weekly commit is silently discarded.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs origin main && git push; then
              echo "pushed weekly outputs on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "weekly push attempt $i lost a race; re-syncing"; sleep $((i * 7))
          done
          echo "::warning::could not push weekly outputs after 5 attempts (non-fatal — site still deploys via artifact)"
      - name: strip heavy per-ticker stores from the Pages artifact (served from R2 now)
        if: always()
        run: |
          rm -rf site/ohlc site/chinaohlc site/hkohlc site/intlohlc site/canadaohlc site/subsectorohlc site/subsectorohlc_china site/subsectorohlc_russell site/subsectorohlc_nasdaq site/stockdata site/chinastockdata site/hkstockdata site/canadastockdata site/intlstockdata site/intraday 2>/dev/null || true
      - name: upload pages artifact
        if: always()   # deploy must not hinge on the commit-push above succeeding
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  publish:
    needs: weekly-report
    if: always()            # deploy the artifact even if a builder/commit step warned
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
