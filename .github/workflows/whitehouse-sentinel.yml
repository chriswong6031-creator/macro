name: whitehouse-sentinel
# Constant monitoring of the White House feed. Every hour this polls the WH RSS
# feeds; any genuinely NEW announcement is judged by the Claude-Opus brain for
# market significance. An activated alert drives the site-wide ticker banner
# (site/wh_banner.json) and a report on site/whitehouse.html — committed + deployed
# immediately. A quiet hour writes nothing (idempotent artifacts) → no commit, no
# spam, and no LLM call beyond the cheap feed poll.
on:
  schedule:
    - cron: "12 * * * *"   # hourly at :12 (Actions cron is best-effort ~15-45 min late)
  workflow_dispatch:
    inputs:
      reeval:
        description: "Re-evaluate ALL recent items (ignore the processed-state cache)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: whitehouse-sentinel
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt

      - name: poll White House feed + Opus alert desk
        id: wh
        env:
          # AUTH order: Claude-Code OAuth (Opus) -> ANTHROPIC_API_KEY (Opus) ->
          # DeepSeek reasoning. Absent every one -> the desk is a clean no-op.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          ARGS=""
          if [ "${{ github.event.inputs.reeval }}" = "true" ]; then ARGS="--reeval"; fi
          python -m scripts.build_whitehouse $ARGS
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # Commit ONLY when the artifacts actually changed (new alert or a banner that
      # crossed its expiry). The idempotent writes mean a quiet hour is a clean no-op.
      - name: commit + push (only on change)
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # data/qledger: the W5 adapter appends each activated alert's claim to the
          # TRACKED data/qledger/claims.jsonl — it must ship with the alert, and any
          # unstaged tracked change would abort the rebase below.
          git add data/whitehouse data/qledger site/wh_banner.json site/whitehouse.html site/whdata 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no White House changes this run"
            exit 0
          fi
          git commit -m "whitehouse: alert update $(date -u +%FT%H:%MZ)"
          # --rebase inverts ours/theirs: -X theirs keeps OUR freshly-built WH artifacts
          # on the rare conflict (matches the daily pipeline's convention). --autostash
          # so a stray write to a tracked file outside the staged paths (the failure
          # mode of a new build adapter) can never brick the publish again.
          # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/main can
          # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
          # refuses ("untracked working tree files would be overwritten") and --autostash can't
          # clear it (it parks tracked modifications only), so every retry dies identically.
          # Everything this step publishes is already committed above, so a path untracked HERE
          # but tracked on origin/main is a throwaway local write — origin/main is authoritative.
          # Gitignored files and untracked paths origin/main doesn't track never enter the
          # intersection (runner-local stores and caches are untouched).
          git fetch origin main || true
          comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                   <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
            | while IFS= read -r f; do rm -f -- "$f" || true; done
          git pull --rebase --autostash -X theirs origin main && git push
