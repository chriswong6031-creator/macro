name: whitehouse-sentinel
# Constant monitoring of the White House feed. Every hour this polls the WH RSS
# feeds; any genuinely NEW announcement is judged by the Claude-Opus brain for
# market significance. An activated alert drives the site-wide ticker banner
# (site/wh_banner.json) and a report on site/whitehouse.html — committed + deployed
# immediately. A quiet hour writes nothing (idempotent artifacts) → no commit, no
# spam, and no LLM call beyond the cheap feed poll.
on:
  schedule:
    - cron: "12 * * * *"   # hourly at :12 (Actions cron is best-effort ~15-45 min late)
  workflow_dispatch:
    inputs:
      reeval:
        description: "Re-evaluate ALL recent items (ignore the processed-state cache)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: whitehouse-sentinel
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt

      - name: poll White House feed + Opus alert desk
        id: wh
        env:
          # AUTH order: Claude-Code OAuth (Opus) -> ANTHROPIC_API_KEY (Opus) ->
          # DeepSeek reasoning. Absent every one -> the desk is a clean no-op.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          ARGS=""
          if [ "${{ github.event.inputs.reeval }}" = "true" ]; then ARGS="--reeval"; fi
          python -m scripts.build_whitehouse $ARGS
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # Commit ONLY when the artifacts actually changed (new alert or a banner that
      # crossed its expiry). The idempotent writes mean a quiet hour is a clean no-op.
      - name: commit + push (only on change)
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/whitehouse site/wh_banner.json site/whitehouse.html site/whdata 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no White House changes this run"
            exit 0
          fi
          git commit -m "whitehouse: alert update $(date -u +%FT%H:%MZ)"
          # --rebase inverts ours/theirs: -X theirs keeps OUR freshly-built WH artifacts
          # on the rare conflict (matches the daily pipeline's convention).
          git pull --rebase -X theirs origin main && git push
