name: close-pass
# DEMOTED TO A BOUNDED BACKSTOP, 2026-08-15 (Breathing PR-B). THE PRIMARY CLOCK
# IS NOT THIS FILE. It is `com.macro.closepass`, a launchd agent on the Mac
# Studio firing 13:00 local (PT) Mon-Fri — 16:00 ET in both DST regimes, because
# PT and ET flip together — running `scripts/close_pass_host_runner.py`
# (installer: `scripts/install_closepass_launchd.sh`, plist:
# `ops/launchd/com.macro.closepass.plist`).
#
# WHY THE SWAP. GitHub cron is not purchasable as a product clock. MEASURED
# Friday 2026-08-14 on this very lane: the 20:25 UTC line's run was CREATED at
# 20:52 — 27 minutes of scheduler drift before a runner was even asked for — and
# its DST sibling at 21:47 then sat 95 minutes in the queue on the two-host pool
# below. The board published ~19:20 ET against a 16:15 ET product target.
# Estate-wide the same instrument measures worse: cron gaps of 90 min to 3h12m
# (agentos/decisions/DEC-LER-LIVE-LANE-VPS-5MIN-REST.md), which is why Live
# Entry Radar's live lane runs off a VPS timer rather than Actions. Everything
# below this paragraph — the schedule pair, the DST reasoning, the pool capacity
# measurement, the minute choice — is UNCHANGED and still correct; it is simply
# describing a rescue lane now rather than the clock.
#
# WHAT A BACKSTOP OWES. Two things, and the first step in the job is both:
#   * STAND DOWN when the primary already landed the session's board (a keyless
#     read of the public R2 mirror). GitHub has no early-exit, so the check sets
#     one output and every later step is guarded on it.
#   * FAIL OPEN. An unreadable mirror, an unreachable config, a broken probe —
#     all PROCEED. A backstop that stands itself down on its own failure is not
#     a backstop, and the pass's own dedup (`already_published`) is the second
#     net underneath: republishing the same session is a no-op, not a fault.
# And when it does publish, it says so as a ::warning — a primary that quietly
# stopped firing is otherwise invisible, because a lane that never ran and a
# lane that was killed leave the same trace: nothing.
#
# THE VPS MIRROR IS UNCHANGED. Whichever lane publishes, `live_flow/us_board_provisional.json`
# lands in R2 and app/deploy/macro-live-closepass.timer pulls it to the live
# plane every five minutes through 23:00 UTC. Neither clock touches the served
# copy directly (CLOSE_PASS_SERVED_PATH is "" on both).
#
# W-L1a — the evening PROVISIONAL US board, off every render critical path.
#
# WHY THIS IS NOT A STEP IN closing-bell.yml. That lane (Build A) already ships a
# full provisional site from 16:05 ET, but it takes a MEASURED 109 minutes behind
# an 81-minute spine and lands ~17:55 ET against an 18:30 SLA — 35 minutes of
# margin. It also deliberately EXCLUDES build_prophet / grade_us_board / us_pages,
# so the one thing it does not refresh is exactly the US Prophet picks this lane
# is about. Bolting the board onto the end of that spine would spend the whole
# margin to publish the thing the spine does not compute. This is a separate
# ~10-20 minute job in its own concurrency group, publishing to the RUNTIME plane
# (R2 → the VPS live plane) rather than through a render, so the board lands ~30
# minutes after the close no matter what the spine is doing.
#
# WHAT THE SURFACE CONSUMES. The dashboard's provisional-board stamp (#5148)
# reads an optional top-level `board_state` key on live/prophet_live.json — the
# artifact the live strip already polls — so the page keeps one artifact, one
# poll, one client. This lane publishes the FULL board to R2; the VPS mirror
# (app/deploy/macro-live-closepass.*) lands both the full copy and that derived
# key. `board_state.board.tickers` is the ordered board, and the client paints
# nothing unless it matches the cards actually in the grid — which is what makes
# "rel == ahead only when the rendered cards came from the evening board" a
# property of the code rather than a promise.
#
# LEDGER LAW (G0.2, DNR:KILL-INTRADAY-CHRONICLE). This lane COMMITS nothing and
# nothing it touches ever reaches a ledger; `contents: read` is the enforcement,
# not a comment. CORRECTED 2026-08-13: this paragraph used to add "and writes no
# data/ path — so it needs none of closing-bell's `git checkout -- .` discard
# contract, because it never creates the writes that contract exists to discard."
# That was false from day one. The `--heal` prefetch below refreshes the price
# store into data/yahoo/*.parquet, so the proof step at the end of the job failed
# on EVERY run from 2026-08-09 (when both steps shipped together) until the
# discard was added — the lane has never been green. The board itself published
# to R2 fine throughout; only the self-check was red, which is worse than an
# honest failure because a permanently-red lane teaches everyone to ignore it.
# COLLECT_LANE is deliberately UNSET (every engine ledger writer self-gates on
# it; unset means non-ledger lane) and RENDER_NO_DRIP=1 is set job-wide, both in
# the closing-bell idiom.
#
# SCHEDULE — DST pair, one window, no second definition of "when is the market
# open". Both lines fire year-round and the guards self-skip the wrong-season one,
# exactly as closing-bell.yml does:
#   '25 20 * * 1-5'  20:25 UTC = 16:25 ET under EDT (Mar-Nov)
#                             = 15:25 ET under EST  → PRE-CLOSE, session guard skips
#   '25 21 * * 1-5'  21:25 UTC = 16:25 ET under EST (Nov-Mar)
#                             = 17:25 ET under EDT  → already published, dedup skips
# The pass fires at the START of the 16:15-17:30 ET window in BOTH regimes, never
# at its end, and that is deliberate: under EST the window's end (17:30 ET) is
# 22:30 UTC, which is daily.yml's cron TO THE MINUTE. Scheduling anywhere near it
# would put this lane and the multi-hour nightly on the same two-host pool at the
# same instant. At 21:25 UTC the pass is capped at 45 min, so it is finished by
# 22:10 UTC — 20 minutes clear — and daily.yml's own comment plans to move to
# 23:30 UTC at the November flip, which widens the gap rather than closing it.
#
# MEASURED POOL CAPACITY (2026-08-09, pool re-measured 2026-08-17), because the
# masterplan's "five hosts idle through the session" is false and the minute
# matters:
#   * plain `macstudio` is TWO live hosts. RE-MEASURED 2026-08-17 against
#     `gh api repos/{owner}/{repo}/actions/runners`: mac-builder-5
#     (`macstudio,parked` — `parked` never prevented routing) and
#     mac-builder-light (`macstudio,render-heavy`). mac-builder-3 is still the
#     separate single-host `macstudio-light`. render.yml says the same thing in
#     its own words above its `render` job.
#     SUPERSEDED: this bullet used to name mac-builder-1/2 "which also serve the
#     `codex` and `theta-m1` labels". That is the retired M1 host, deregistered
#     ~2026-08-15. `codex` now has no live runner, and `theta-m1` was restored
#     onto mac-builder-3 (`macstudio-light`), so neither shares capacity with
#     this lane any more. The checked-in model is `.github/runner-policy.yml`
#     `label_registry`; the cost of letting it rot is
#     research/PROPHET_OUTAGE_2026_08_17_POSTMORTEM.md.
#   * closing-bell.yml holds ONE of those two slots for the WHOLE window, every
#     weekday (64-86 min observed across three sampled runs; ~109 min per its own
#     header). So this lane is one slot deep, not idle.
#   * the minute was chosen against the other macstudio crons in the window:
#     smart-money-13f-census at :10 (was :07 and :37 — see below),
#     smart-money-filings at :17, metabolism-cycle at :35 and
#     metabolism-heartbeat at :45. :25 is the widest gap between them.
#     codex-research still fires at :20 but no longer contends for this pool:
#     its `codex` label has had NO live runner since mac-builder-1/2 were
#     deregistered, so that lane has been dark since 2026-08-13. Recorded as
#     orphaned-with-waiver in `.github/runner-policy.yml` `label_registry`
#     rather than left as a silent gap in this map.
#   * observed queue waits on this pool range 2s to 71 min. Even the worst case
#     lands 16:25 + 71 + 20 = ~17:56 ET, still inside the 18:30 SLA — which is
#     the whole reason this fires at the window's start rather than its end.
#   * RESOLVED 2026-08-18, and the warning below was right. smart-money-13f-census
#     turned out to be BOTH long and dense: 7-15 min of real work per run (47.8
#     min on the 2026-08-14 Q2 13F deadline) fired every 30 min for 12 hours
#     under a 180m cap. It saturated the pool — queue waits reached 116 min and
#     20 of its 86 runs were cancelled while still pending, never executing —
#     and starved the nightly (research/PROPHET_OUTAGE_2026_08_17_POSTMORTEM.md).
#     It is now hourly at :10, hours 12-20 only, capped at 60m on the fast lane,
#     so it cannot run past 21:10Z. This lane's queue wait was indeed the right
#     thing to watch; the two-host pool has no spare capacity for a third dense
#     lane, and `macstudio` today is mac-builder-5 + mac-builder-light.
# tests/test_close_pass_lane.py pins both regimes and the no-second-window rule.
#
# The session-day guard lives in the SCRIPT (close_pass_publish.session_date), not
# in a shell step, so the schedule and the pass cannot disagree about what a
# session is — and it uses is_session() rather than expected_last_session() for
# the reason closing-bell documents: this fires before the 17:00 ET settle buffer,
# so expected_last_session() still resolves to YESTERDAY.

on:
  workflow_dispatch:
    inputs:
      force:
        description: republish even if this session's board is already up
        type: boolean
        default: false
  schedule:
    - cron: '25 20 * * 1-5'
    - cron: '25 21 * * 1-5'
#
# WHERE THE CONFIRMATION RECEIPT WENT (W-L1 gate, 2026-08-10). This file used to
# carry a second `reconcile` job on a `workflow_run: [daily] completed` trigger.
# It computed the right number at the wrong moment: the receipt for session N
# could only be published AFTER the nightly render for session N had already
# gone out, so the render could never show it — the surface (#5148) sat wired,
# correct and permanently dark, and anything that later READ the published key
# would have printed session N-1's arithmetic under session N's cards. The
# grading now happens inside the nightly itself, where both halves are in hand
# at once: `scripts.build_site` computes it for the render (via
# close_pass_reconcile.board_state_for) and daily.yml's engine job publishes the
# artifact with `python -m scripts.close_pass_reconcile` right after the board
# of record is built. The job is DELETED rather than left armed — two lanes
# writing one receipt key on two different clocks is exactly the disagreement
# the "no receipt is better than a wrong one" rule exists to prevent.

permissions:
  contents: read

concurrency:
  # Own group: never shares with pipeline-daily, pipeline-closingbell or
  # pipeline-render. cancel-in-progress false so a running pass always finishes —
  # a cancelled pass is a missed SLA session in the sentinel's record.
  #
  # PER-CRON, not per-event (2026-08-17 — the #5723 daily.yml fix applied here).
  # Both DST lines used to share one `pipeline-closepass-schedule` group, and
  # GitHub cancels a PENDING run in a group even when cancel-in-progress is
  # false. Observed queue waits on this pool run 2s to 71 min, so a 20:25 run
  # still queued at 21:25 is superseded by its own DST sibling. Under EDT that
  # is survivable — the 21:25 survivor finds no published board and publishes at
  # 17:25 ET. Under EST the superseding firing is the NEXT DAY's 20:25 line,
  # which is pre-close and SKIPS: a silently lost backstop session. Only
  # distinct groups save a queued slot; event-conditional cancel-in-progress
  # cannot.
  # ACCEPTED TRADE: the split allows a rare concurrent double-publish (a
  # long-queued 20:25 still running when 21:25 starts). Benign by construction —
  # the pass dedups on `already_published`, and two passes over the same
  # session's closes compute the same board — whereas the lost EST session it
  # replaces is not.
  group: ${{ github.event_name == 'schedule' && format('pipeline-closepass-cron-{0}', github.event.schedule) || format('pipeline-closepass-{0}', github.event_name) }}
  cancel-in-progress: false

jobs:
  # ── the evening board ────────────────────────────────────────────────────────
  publish:
    runs-on: [self-hosted, macstudio]
    # Measured cost is the gate over the universe plus one extension panel. The
    # cap is deliberately well inside the window rather than generous: a pass
    # still running at 17:30 ET has already missed the point of being early.
    timeout-minutes: 45
    env:
      RENDER_NO_DRIP: "1"
      # COLLECT_LANE deliberately UNSET — see the header.
    steps:
      - uses: actions/checkout@v4

      # ── THE BACKSTOP'S FIRST QUESTION ────────────────────────────────────────
      # Did the host-native primary already land this session's board? If so this
      # whole job is ~20 minutes of the two-host pool spent recomputing an
      # artifact that is already correct, so it stands down before the venv, the
      # pip install and the price-store heal — i.e. before it costs anything.
      #
      # KEYLESS on purpose: the public R2 mirror answers with no credential, so
      # the cheap check needs none of the secrets the expensive step does. The
      # base comes from config.yml's r2_data_plane.public_base (the authority
      # engine/prophet_live/r2io.public_base reads), parsed with stdlib regex
      # because pip has not run yet and there is no pyyaml on this interpreter.
      #
      # FAIL-OPEN, TWICE OVER. Inside the script every failure path sets
      # stand_down=0, and `continue-on-error` makes that structural rather than a
      # promise: a step that dies outright leaves the output EMPTY, which is
      # `!= '1'`, which proceeds. The only thing that stands this lane down is a
      # positive reading — the published board's `as_of` equals today's ET
      # session, or today is not a session at all.
      - name: backstop fast-exit (has the host-native primary already landed?)
        id: standdown
        continue-on-error: true
        run: |
          set -uo pipefail
          BASE="$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("config.yml").read_text(encoding="utf-8")
          _, _, tail = text.partition("\nr2_data_plane:")
          match = re.search(r'^\s+public_base:\s*"?([^"\s#]+)', tail, re.M)
          print((match.group(1) if match else "").rstrip("/"))
          PY
          )"
          if [ -z "$BASE" ]; then
            echo "::notice title=close-pass::public R2 base unreadable from config.yml — backstop proceeding"
            echo "stand_down=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The body goes through a FILE, never a pipe. `python3 - <<'PY'` already
          # takes its script from stdin, so a pipe into it is silently discarded
          # and the reader sees an empty board — which reads as "mirror
          # unreadable" and would make this check permanently fail-open. Caught
          # by executing this step body locally before merge (rc=141, SIGPIPE).
          BOARD_FILE="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/us_board_provisional.json"
          curl -fsS --max-time 20 "$BASE/live_flow/us_board_provisional.json" \
            -o "$BOARD_FILE" || : > "$BOARD_FILE"
          BOARD_FILE="$BOARD_FILE" python3 - <<'PY'
          import json, os, pathlib, sys
          from datetime import datetime, timezone

          sys.path.insert(0, ".")
          stand, reason = "0", "no reading"
          try:
              # The SAME session discipline the pass uses (close_pass_publish.session_date):
              # today's ET date when it is a session, never expected_last_session(),
              # which still resolves to YESTERDAY before the 17:00 ET settle buffer.
              from lib.nyse_calendar import ET, is_session
              today = datetime.now(timezone.utc).astimezone(ET).date()
              session = today.isoformat() if is_session(today) else None
              body = pathlib.Path(os.environ["BOARD_FILE"]).read_text(
                  encoding="utf-8", errors="replace").strip()
              if session is None:
                  stand, reason = "1", "not a NYSE session day"
              elif not body:
                  reason = "public mirror unreadable — fail-open"
              else:
                  as_of = (json.loads(body) or {}).get("as_of")
                  if as_of == session:
                      stand, reason = "1", f"primary already landed {session}"
                  else:
                      reason = f"published board is as_of={as_of!r}, this session is {session}"
          except Exception as exc:                       # noqa: BLE001 — fail-open
              reason = f"stand-down check failed ({type(exc).__name__}) — fail-open"
          out = os.environ.get("GITHUB_OUTPUT")
          if out:
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(f"stand_down={stand}\nreason={reason}\n")
          tail = "backstop standing down" if stand == "1" else "backstop proceeding"
          print(f"::notice title=close-pass::{reason} — {tail}", flush=True)
          PY

      - name: python 3.12 (Homebrew venv — self-hosted runner)
        if: steps.standdown.outputs.stand_down != '1'
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - if: steps.standdown.outputs.stand_down != '1'
        run: pip install -r requirements.txt

      # Best-effort, non-fatal: at 16:20 ET the daily bar may not be finalized
      # yet. Names without today's close are SKIPPED and counted, never carried
      # at yesterday's price — so a partial heal degrades coverage, never truth.
      - name: price-store freshness prefetch (--heal, keyless, best-effort)
        if: steps.standdown.outputs.stand_down != '1'
        continue-on-error: true
        run: python -m scripts.check_price_store_freshness --heal

      - name: publish the provisional board (R2 only — the VPS mirrors it)
        if: steps.standdown.outputs.stand_down != '1'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Same-day close truth. The keyless prefetch above refreshes the index
          # group only, so without this the pass evaluates ~14% of the universe
          # (measured 2026-08-14: 253 of 1,763). Unset = store-only + a warning,
          # never a wrong board.
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          # No live plane on a runner: the served copy belongs to the VPS.
          CLOSE_PASS_SERVED_PATH: ""
        run: |
          # pipefail is load-bearing: without it `tee` reports success and a
          # failed pass ships as a green step.
          set -o pipefail
          python -m scripts.close_pass_publish \
            ${{ inputs.force && '--force' || '' }} 2>&1 \
            | tee "$RUNNER_TEMP/close_pass_publish.log"

      # A backstop that publishes silently is indistinguishable from a primary
      # that is working. This is the ONLY place the swap is observable from
      # GitHub, so it is loud — and it distinguishes the two shapes rather than
      # crying wolf on the harmless one: reaching this step having DEDUPED means
      # the primary landed between the fast-exit read and the publish (seconds),
      # while reaching it having genuinely published means the primary did not
      # fire at all for this session.
      - name: announce a backstop publish (the primary missed this session)
        if: steps.standdown.outputs.stand_down != '1'
        run: |
          LOG="$RUNNER_TEMP/close_pass_publish.log"
          if grep -q "board already published" "$LOG" 2>/dev/null; then
            echo "::notice title=close-pass::the pass deduped — the host-native primary had already landed this session (the fast-exit read missed it by seconds)"
          else
            echo "::warning title=close-pass::BACKSTOP publish — the host-native primary missed this session"
          fi

      # DISCARD, then prove. Added 2026-08-13 after this lane was found to have
      # FAILED EVERY RUN since it shipped (2026-08-09, commit 5b083a2a73e — the
      # prefetch step and the proof step arrived together, so there has never been
      # a green close-pass).
      #
      # The header's claim that this lane "never creates the writes that contract
      # exists to discard" was false the day it was written: the `--heal` prefetch
      # above refreshes the price store, which lands in data/yahoo/*.parquet. Every
      # failed run reported the same set — _MOVE, _RUT, _SOX, _VIX, _VIX3M, _VIX9D,
      # _VVIX and friends, all ` M`.
      #
      # The heal itself is CORRECT and stays: it is what gives the board current
      # prices to compute on. What was missing is the discard every other non-ledger
      # lane already performs (closing-bell.yml, earlyclose.yml, intraday-fastpath.yml
      # all `git checkout -- .` + `git clean -fdq data/`). This lane stages nothing
      # and holds `contents: read`, so the discard is unconditional and carries none
      # of closing-bell's stage-BEFORE-checkout ordering hazard — there is nothing to
      # stage, and nothing here could be pushed even if there were.
      - name: discard the prefetch's data/ writes (this lane commits nothing)
        if: steps.standdown.outputs.stand_down != '1'
        run: |
          git checkout -- data/ 2>/dev/null || true
          git clean -fdq data/ 2>/dev/null || true

      # A lane that writes no data/ path should be able to prove it on every run,
      # not only in a unit test. This is the same evidence the guard suite asserts
      # by AST, taken against the real working tree after the real pass.
      #
      # This step is NOT weakened by the discard above — it still fails on anything
      # the discard could not undo, which is the case that would mean a genuine
      # ledger write. What it no longer does is red the whole lane over a price-cache
      # refresh the lane itself asked for.
      - name: prove the pass wrote no data/ path
        if: steps.standdown.outputs.stand_down != '1'
        run: |
          if [ -n "$(git status --porcelain -- data/)" ]; then
            echo "::error title=close-pass::the pass modified data/ — G0.2 violation"
            git status --porcelain -- data/
            exit 1
          fi
          echo "data/ clean — the nightly remains the sole writer of record"
