name: prophet-d12-finalize

on:
  push:
    branches:
      - sol/prophet-us-d12-pack-tip-20260827

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/prophet-d12-finalize.yml
            /.github/workflows/prophet-d12-red.yml
            /.github/ci/legacy-jobs.yml
            /scripts/d12_finalize_records.py
            /scripts/build_prophet_live_pack.py
            /tests/test_prophet_live_pack_d12.py
            /engine/prophet_live/**
            /lib/nyse_calendar.py
            /agentos/handoffs/WS-PROPHET-US-AVAILABILITY-2026-08-26-live-force-majeure.md
            /research/PROPHET_US_LIVE_FORCE_MAJEURE_2026_08_26_EVIDENCE.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply durable records and P0 wiring
        run: python scripts/d12_finalize_records.py
      - name: Verify focused D12 suite on finalized tree
        run: |
          pip install --quiet pytest pandas
          python -m pytest tests/test_prophet_live_pack_d12.py -q
      - name: Seal reviewed branch and delete temporary machinery
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('.github/ci/legacy-jobs.yml').read_text()
          assert s.count('          tests/test_prophet_live_pack_d12.py\n') == 1
          h = Path('agentos/handoffs/WS-PROPHET-US-AVAILABILITY-2026-08-26-live-force-majeure.md').read_text()
          assert 'BUILT_NOT_PROVEN' in h and 'invalid_series_tip' in h
          r = Path('research/PROPHET_US_LIVE_FORCE_MAJEURE_2026_08_26_EVIDENCE.md').read_text()
          assert 'D12 repair implemented — BUILT_NOT_PROVEN' in r
          PY
          git config user.name "Sol D12 finalizer"
          git config user.email "audit@invalid.local"
          git rm .github/workflows/prophet-d12-finalize.yml .github/workflows/prophet-d12-red.yml scripts/d12_finalize_records.py
          git add .github/ci/legacy-jobs.yml agentos/handoffs/WS-PROPHET-US-AVAILABILITY-2026-08-26-live-force-majeure.md research/PROPHET_US_LIVE_FORCE_MAJEURE_2026_08_26_EVIDENCE.md
          git diff --cached --check
          git commit -m "records(prophet-live): hand D12 to natural production proof"
          git push origin HEAD:sol/prophet-us-d12-pack-tip-20260827
