name: prophet-d12-red

on:
  push:
    branches:
      - sol/prophet-us-d12-pack-tip-20260827

permissions:
  contents: read

jobs:
  d12-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/test_prophet_live_pack_d12.py
            /engine/prophet_live/**
            /lib/nyse_calendar.py
            /scripts/build_prophet_live_pack.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: pip install --quiet pytest pandas
      - name: Run D12 regression
        run: python -m pytest tests/test_prophet_live_pack_d12.py -q
