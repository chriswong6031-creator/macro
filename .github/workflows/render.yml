      # Anti-rot: tests/test_render_flow_desk_scope.py.
      # ---- leader radar: page-only rebake from committed stores (LR-EXP) ----
      # Admitted to this lane 2026-07-26 (#3612), once #3578 landed the bake-side
      # fixes. Pure function of committed data (~40s measured): no network, no LLM;
      # every data/ write is COLLECT_LANE=nightly-gated in code (HOUSE-U5, CI-pinned
      # by tests/test_build_leader_radar.py), so this lane's site/-only commit is
      # doubly safe. WHY (2026-07-25): daily-lane-only membership + 3 dead nightlies
      # (07-22..24) froze the baked page while express lanes refreshed everything
      # around it — same class + heal as flow_leaders/research_vault (#3487).
      # MUST run AFTER spine(): _load_stockdata reads the gitignored
      # site/stockdata/*.json that spine's build_site writes in-lane. Serial
      # post-band, never inside band(): cl_gex's build_options_skew rewrites
      # data/options_skew/snapshots.parquet non-atomically — a concurrent read drops
      # every call_skew_rich chip. Byte-stable on unchanged inputs (built_at carried
      # from the committed artifact off-nightly), so an untouched radar commits
      # nothing and the nightly dead-man reading of built_at stays honest. pick_lab
      # gates radar.json on as_of == tonight's price-through (#3578), so an express
      # commit can never advance the forward pick ledger.
      # SCOPE: called from `all` only (below) — but region_of maps BOTH
      # scripts/build_leader_radar.py and templates/leader_radar.html.j2 to `all`, and
      # one `all`-mapped dirty file forces scope=all, so a leader-radar change always
      # carries its own rebake here. An unrelated narrow scope does not re-bake it.
      # (This block was collateral damage in #3834's stale-base clobber, which deleted
      # it without mentioning it; restored 2026-07-30.)
      # ---- Canada / S&P-TSX dashboard: first-class step (was a build_vector hook) ----
      # WHY: build_canada was invoked ONLY as a swallowed try/except inside build_vector,
      # so (a) it had no scope of its own — a canada-only template fix fell through
