name: render
# FAST site re-render + deploy from ALREADY-COMMITTED data — the express lane for
# shipping a template / CSS / JS bug fix WITHOUT waiting on the nightly `daily`
# pipeline's data collection (up to ~100m), its LLM "brain" layers (~20m), or the
# special-situations EDGAR sweep (~28m). Recent dailies ran 1h12m–2h31m; a render
# is a handful of minutes.
#
# How it stays fast AND correct: every page builder reads COMMITTED engine output
# (regime/latest.json, each desk's latest.json, the brains' committed *.json) and
# re-renders its template — build_site itself "never refetches and never recomputes
# the classifier", so the rendered site is a pure function of data already on main.
# This workflow therefore DELIBERATELY does NOT run, in render mode:
#   • the collectors (scripts.collect)            — the API data pull
#   • engine.run                                  — preserves the COMMITTED regime +
#                                                   catalyst digest exactly as deployed
#   • the master / ai_desk / narrative / altdata LLM brains and their thesis
#     ledgers + scorers                           — those APPEND to forward-accountability
#                                                   ledgers; only the nightly may advance them
#   • build_special_situations                    — the slow EDGAR fetch (page stays as last built)
#   • factor_series / stock_briefs                — their own isolated daily jobs
#   • notify / archive_signals                    — side-effects that belong to the nightly
# and it carries NO API/LLM secrets, so nothing reaches the network — pages render
# straight from the committed snapshots on disk.
#
# It commits ONLY site/ (never data/ or reports/), so the nightly `daily` pipeline
# stays the single source of truth for every data ledger. daily.yml is untouched.
#
# Note: static assets directly under site/ (e.g. live.js, *.css) already deploy in
# ~1 min via pages.yml on any push to site/** — you only need THIS workflow for
# template (.html.j2) fixes that must be re-rendered through a builder.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which pages to rebuild from committed data (all = every page)"
        type: choice
        default: all
        options: [all, macro, china, hk, markets, gex, baskets]
  push:
    branches: [main]
    # A HUMAN pushing a template or builder change auto-renders + deploys. The
    # nightly bot only ever touches data/ + site/ + reports/, so its commits never
    # match these paths — no loop, no double-fire. (The site/ commit this workflow
    # makes triggers pages.yml's committed-tree deploy once more; idempotent.)
    paths:
      - "templates/**"
      - "scripts/build_*.py"

permissions:
  contents: write   # commit the rendered site/ to main; the VPS (Caddy) serves from main

concurrency:
  # Its OWN lane, isolated from `pipeline-daily` so a render can never starve (or be
  # starved by) the nightly.
  # cancel-in-progress: FALSE — do NOT cancel a render that's already running. With many
  # sessions merging every few minutes, `true` cancelled 27 of 30 renders (each new push
  # killed the in-flight one) so the site almost never re-rendered. With `false`, a running
  # render always FINISHES and ships; GitHub still supersedes redundant *pending* runs
  # (only the latest queued one runs next), so the site stays current without starving.
  group: pipeline-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull origin main
      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: restore attention store from R2 (wiki chip reads it at render)
        # data/attention/*.parquet are git-ignored (R2 data plane; deep history 2015-07→,
        # kept current by daily.yml's collect job). Non-fatal: absent store = the
        # attention chip is silently absent this render (build_attention_data -> None).
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.fetch_r2 --dirs attention || echo "::warning::attention restore failed (non-fatal — attention chip absent/stale this render)"
      # Restore the gitignored breadth close caches (the stock-search libraries +
      # build_site's per-name analyze read constituent closes) and the intraday cache
      # (chart data). Restore-only — the nightly `collect` job produces/saves them; we
      # fall back via restore-keys to the most recent daily's cache.
      - name: restore breadth (S&P 500) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-render-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-render-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-render-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: restore china breadth close cache
        uses: actions/cache/restore@v4
        with:
          path: data/china_breadth/_closes_cache.parquet
          key: china-breadth-closes-render-${{ github.run_id }}
          restore-keys: china-breadth-closes-
      - name: restore hk breadth close cache
        uses: actions/cache/restore@v4
        with:
          path: data/hk_breadth/_closes_cache.parquet
          key: hk-breadth-closes-render-${{ github.run_id }}
          restore-keys: hk-breadth-closes-
      - name: restore intraday (4H) cache
        uses: actions/cache/restore@v4
        with:
          path: data/intraday
          key: intraday-render-${{ github.run_id }}
          restore-keys: intraday-
      - name: pick render scope from changed files (push narrows; dispatch honors its input)
        id: pick
        # SAFE scope detection: narrow to ONE region ONLY when every changed file is in that
        # region's whitelist AND render.yml's scope for it fully rebuilds those pages. Anything
        # shared (_partials, *_base), multi-region, a sub-page no narrow scope covers, or
        # unknown -> 'all' (today's behavior, zero regression). A wrong scope can only FAIL a
        # render (recoverable — the render step's `case` exits on an unknown scope), never
        # silently stale a page. Cuts a single-desk/dashboard edit from a ~28m full render to
        # a few minutes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scope=${{ github.event.inputs.scope }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FILES=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.event.after }}" --jq '.files[].filename' 2>/dev/null)
          if [ -z "$FILES" ]; then echo "::notice::no changed-file list -> full render"; echo "scope=all" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$FILES" | sed 's/^/  changed: /'
          region_of() {
            case "$1" in
              templates/china.html.j2|scripts/build_china.py) echo china;;
              templates/hk.html.j2|scripts/build_hk.py) echo hk;;
              templates/commodities.html.j2|templates/spr.html.j2|templates/forex.html.j2|templates/bonds.html.j2|templates/crossasset.html.j2|templates/transmission.html.j2|templates/discovery.html.j2|templates/macro_context.html.j2|scripts/build_commodities.py|scripts/build_spr.py|scripts/build_forex.py|scripts/build_bonds.py|scripts/build_crossasset.py|scripts/build_transmission.py|scripts/build_discovery.py|scripts/build_macro_context.py) echo markets;;
              templates/gex.html.j2|scripts/build_gex_board.py|scripts/build_options_flow.py|scripts/build_options_skew.py|scripts/build_vol_regime.py) echo gex;;
              templates/baskets.html.j2|templates/methodology.html.j2|scripts/build_baskets.py|scripts/build_methodology.py) echo baskets;;
              templates/dashboard.html.j2|templates/stock.html.j2|scripts/build_site.py) echo macro;;
              templates/*|scripts/build_*.py|config.yml|lib/*) echo all;;
              *) echo skip;;
            esac
          }
          REGIONS=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            r=$(region_of "$f")
            [ "$r" = "skip" ] && continue   # build output (site/), data/, engine/, app/ — not a scope input
            case " $REGIONS " in *" $r "*) ;; *) REGIONS="$REGIONS $r";; esac
          done <<< "$FILES"
          REGIONS=$(echo $REGIONS | xargs)
          read -ra _arr <<< "$REGIONS"
          if [ "${#_arr[@]}" -ne 1 ] || echo " $REGIONS " | grep -q " all "; then S=all; else S="$REGIONS"; fi
          echo "::notice::changed regions=[$REGIONS] -> render scope=$S"
          echo "scope=$S" >> "$GITHUB_OUTPUT"
      - name: re-render pages from committed data (resilient; no collect / no LLM / no EDGAR)
        # Mirrors the RENDER steps of daily.yml's `engine` job, minus the collectors,
        # engine.run, the LLM brains + their scorers/ledgers, the EDGAR special-sits
        # sweep, notify and archive_signals. Each builder is individually resilient
        # (a non-zero exit is annotated + summarised but NEVER aborts the job), exactly
        # like the nightly — so one broken page can't 404 the whole deploy.
        env:
          # Only the live-quotes worker URL (a repo VARIABLE, baked into live_config.js so
          # browser live prices stay wired) — NO API/LLM secrets, so the render is a pure
          # function of the committed data on disk.
          LIVE_QUOTES_WORKER_URL: ${{ vars.LIVE_QUOTES_WORKER_URL }}
          # This lane commits site/ ONLY and discards every data/ write, so build_stock_library's
          # per-build SEC/Wikipedia drip fetches (equity_profile / edgar_rpo / edgar_headcount)
          # are wasted network here — their parquet is thrown away and the page renders from the
          # committed caches. Skipping them keeps the "no network calls" claim above honest and
          # trims ~3-4 min. The nightly `daily` (which commits data/) leaves this unset.
          RENDER_NO_DRIP: "1"
        run: |
          set +e
          SCOPE="${{ steps.pick.outputs.scope }}"; SCOPE="${SCOPE:-all}"
          echo "::notice::render scope = $SCOPE"
          # marker for the library-rebuild guard (same as daily): only libraries whose
          # dashboard didn't build them fresh this run get rebuilt by the safety net.
          touch "$RUNNER_TEMP/render_libs_marker"

          run_py() {   # resilient serial builder (spine, page-renderers, narrow scopes)
            local label="$1"; local mod="$2"; shift 2
            echo "::group::$label"
            python -m "$mod" "$@" > "$RUNNER_TEMP/step.log" 2>&1; local rc=$?
            cat "$RUNNER_TEMP/step.log"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$label failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/step.log" | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ $label failed (rc=$rc)"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 60 "$RUNNER_TEMP/step.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          # ---- spine: the macro/US dashboard + the desks its pages embed ----
          # build_site reads the COMMITTED regime/latest.json (no engine.run needed) and
          # renders macro.html + the US stock pages + news.html + the stock library.
          spine() {
            run_py "S&P allocation vector (build_spvector)"        scripts.build_spvector
            run_py "alternative data desk (build_alt_data)"        scripts.build_alt_data
            run_py "13F smart-money tracker (build_smart_money)"   scripts.build_smart_money
            run_py "policy-lever card (build_policy_lever)"        scripts.build_policy_lever
            run_py "macro dashboard + US stocks (build_site)"      scripts.build_site
            run_py "congressional trades desk (build_congress)"    scripts.build_congress
          }

          # ---- US page-renderers: deterministic JSON merges + chrome (NO LLM) ----
          us_pages() {
            run_py "radar upgrade (build_radar_plus)"   scripts.build_radar_plus
            run_py "radar IC ledger (build_radar_ic)"   scripts.build_radar_ic
            run_py "radar page (build_radar_page)"      scripts.build_radar_page
            run_py "intelligence bundle (build_intelligence)" scripts.build_intelligence
            run_py "brain briefing tunnel (build_briefing)"   scripts.build_briefing
            run_py "intelligence hub (build_intel_hub)" scripts.build_intel_hub
            run_py "demand desk page (build_demand)"    scripts.build_demand
            run_py "calibration hub (build_calibration)" scripts.build_calibration
            run_py "AI daily brief page (build_aibrief)" scripts.build_aibrief
            run_py "mastermind snapshot page (build_mastermind)" scripts.build_mastermind
            run_py "AI desk page (build_ai_desk_page)"  scripts.build_ai_desk_page
          }

          hub() { run_py "bitcoin vector + landing hub (build_vector)" scripts.build_vector; }

          # US Sector Central hub — reads baskets.json + sector_cycles_data.js + the heatmap json
          # (all committed or freshly rebuilt by band/spine). Call AFTER band so its deps exist.
          central() { run_py "US sector central intelligence (build_sector_central)" scripts.build_sector_central; }

          # ---- the parallel regional/desk band (mirrors daily, MINUS special-sits) ----
          band() {
            local ART="$RUNNER_TEMP/band"; rm -rf "$ART"; mkdir -p "$ART"
            brun() {
              local slug="$1" label="$2" mod="$3"; shift 3
              local t0 t1 rc
              t0=$(date +%s)
              { echo "$label"; python -m "$mod" "$@" 2>&1; } > "$ART/$slug.log"; rc=$?
              t1=$(date +%s)
              echo "$rc"          > "$ART/$slug.rc"
              echo "$((t1 - t0))" > "$ART/$slug.sec"
            }
            cl_markets() {
              brun commodities  "build commodity vector (build_commodities)"         scripts.build_commodities
              brun spr          "build strategic reserves (build_spr)"               scripts.build_spr
              brun forex        "build forex vector (build_forex)"                   scripts.build_forex
              brun bonds        "build bonds & bond-health (build_bonds)"            scripts.build_bonds
              brun crossasset   "cross-asset vector (build_crossasset)"              scripts.build_crossasset
              brun transmission "rate & inflation transmission (build_transmission)" scripts.build_transmission
              brun discovery    "discovery leaderboard (build_discovery)"            scripts.build_discovery
              brun macro_context "build macro-context page (build_macro_context)" scripts.build_macro_context
            }
            cl_china() { brun china "build china a-share dashboard (build_china)" scripts.build_china; }
            cl_hk()    { brun hk    "build hong kong / hang seng (build_hk)"      scripts.build_hk; }
            cl_gex() {
              brun gex_board    "GEX magnets board (build_gex_board)"        scripts.build_gex_board
              brun vol_regime   "index vol-regime (build_vol_regime)"        scripts.build_vol_regime
              brun options_flow "options flow desk (build_options_flow)"     scripts.build_options_flow
              brun options_skew "single-name IV skew (build_options_skew)"   scripts.build_options_skew
              brun options_ivspread "single-name IV spread (build_options_ivspread)" scripts.build_options_ivspread
              brun options_entry "options entry state fusion table (build_options_entry_state)" scripts.build_options_entry_state
            }
            cl_baskets() {
              brun baskets     "thematic baskets (build_baskets)"        scripts.build_baskets
              brun news        "news suite (build_news)"                 scripts.build_news
              # news_calib (grade_news_events) is intentionally ABSENT from render.yml.
              # render is a data-pristine site-only lane; event_log.parquet is never committed here,
              # so the grader always sees zero matured events and would overwrite the nightly's
              # accrued calibration.json with an all-insufficient artifact on every push-to-main render.
              # grade_news_events belongs only in daily.yml where the accrued event_log lives.
              brun methodology "methodology page (build_methodology)"    scripts.build_methodology
            }
            cl_misc() {
              brun seasonality   "factor seasonality (build_seasonality)"      scripts.build_seasonality
              brun reports       "research reports section (build_reports)"     scripts.build_reports
              brun sectorcyc     "sector cycle intelligence (build_sector_cycles)" scripts.build_sector_cycles
              brun countrycyc    "country cycle intelligence (build_country_cycles)" scripts.build_country_cycles
              brun cycle         "cycle intelligence shell (build_cycle)"        scripts.build_cycle
              brun measurement   "cycle measurement hub (build_measurement)"    scripts.build_measurement
              brun markets       "global market cycles shell (build_markets)"    scripts.build_markets
              brun policy_intent "policy intent desk (policy_intent_desk)"      engine.policy_intent_desk
              brun policy_watch  "fed & policy watch (build_policy_watch)"      scripts.build_policy_watch
              brun index_changes "S&P index changes (build_index_changes)"     scripts.build_index_changes
            }
            cl_markets & cl_china & cl_hk & cl_gex & cl_baskets & cl_misc &
            wait
            local ORDER="china hk commodities spr forex bonds crossasset transmission discovery macro_context gex_board vol_regime options_flow options_skew options_ivspread baskets news methodology seasonality reports sectorcyc countrycyc cycle measurement markets policy_intent policy_watch index_changes"
            echo "### ⏱ parallel band — per-builder wall-time" >> "$GITHUB_STEP_SUMMARY"
            for slug in $ORDER; do
              [ -f "$ART/$slug.log" ] || continue
              local label rc sec
              label=$(head -n1 "$ART/$slug.log")
              rc=$(cat "$ART/$slug.rc" 2>/dev/null || echo "?")
              sec=$(cat "$ART/$slug.sec" 2>/dev/null || echo "?")
              echo "::group::$label  [${sec}s, rc=$rc]"
              tail -n +2 "$ART/$slug.log"
              echo "::endgroup::"
              echo "- ${label} — ${sec}s (rc=${rc})" >> "$GITHUB_STEP_SUMMARY"
              if [ "$rc" != "0" ] && [ "$rc" != "?" ]; then
                echo "::error title=${label} failed (rc=${rc})::$(tail -n 2 "$ART/$slug.log" | tr '\n' ' ' | tail -c 600)"
                { echo "### ❌ ${label} failed (rc=${rc})"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 40 "$ART/$slug.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          }

          # ---- the failure-path library safety net (verbatim from daily) ----
          libs() {
            libdir() {
              case "$1" in
                scripts.build_china_library) echo site/chinastockdata;;
                scripts.build_hk_library) echo site/hkstockdata;;
                scripts.build_canada_library) echo site/canadastockdata;;
                scripts.build_intl_library) echo site/intlstockdata;;
              esac
            }
            for mod in scripts.build_china_library scripts.build_hk_library scripts.build_canada_library scripts.build_intl_library; do
              local idx="$(libdir "$mod")/index.json"
              if [ -f "$RUNNER_TEMP/render_libs_marker" ] && [ "$idx" -nt "$RUNNER_TEMP/render_libs_marker" ]; then
                echo "::notice::$mod — already built fresh this run ($idx); skipping redundant rebuild"
                continue
              fi
              echo "::group::$mod"; python -m "$mod" > "$RUNNER_TEMP/lib.log" 2>&1; local rc=$?; cat "$RUNNER_TEMP/lib.log"; echo "::endgroup::"
              if [ "$rc" -ne 0 ]; then
                echo "::error title=$mod failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/lib.log" | tr '\n' ' ' | tail -c 600)"
                { echo "### ❌ $mod failed (rc=$rc)"; echo '```'; tail -n 40 "$RUNNER_TEMP/lib.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          }

          case "$SCOPE" in
            all)
              spine; band; central; hub; us_pages; libs ;;
            macro)
              spine; hub; us_pages; central ;;
            china)
              run_py "build china a-share dashboard (build_china)" scripts.build_china; hub ;;
            hk)
              run_py "build hong kong / hang seng (build_hk)" scripts.build_hk; hub ;;
            markets)
              run_py "build commodity vector (build_commodities)"         scripts.build_commodities
              run_py "build strategic reserves (build_spr)"               scripts.build_spr
              run_py "build forex vector (build_forex)"                   scripts.build_forex
              run_py "build bonds & bond-health (build_bonds)"            scripts.build_bonds
              run_py "cross-asset vector (build_crossasset)"              scripts.build_crossasset
              run_py "rate & inflation transmission (build_transmission)" scripts.build_transmission
              run_py "discovery leaderboard (build_discovery)"            scripts.build_discovery
              run_py "build macro-context page (build_macro_context)"     scripts.build_macro_context
              hub ;;
            gex)
              run_py "GEX magnets board (build_gex_board)"      scripts.build_gex_board
              run_py "index vol-regime (build_vol_regime)"      scripts.build_vol_regime
              run_py "options flow desk (build_options_flow)"   scripts.build_options_flow
              run_py "single-name IV skew (build_options_skew)" scripts.build_options_skew
              run_py "single-name IV spread (build_options_ivspread)" scripts.build_options_ivspread
              hub ;;
            baskets)
              run_py "thematic baskets (build_baskets)"     scripts.build_baskets
              run_py "news suite (build_news)"              scripts.build_news
              run_py "methodology page (build_methodology)" scripts.build_methodology
              run_py "radar upgrade (build_radar_plus)"     scripts.build_radar_plus
              run_py "radar IC ledger (build_radar_ic)"     scripts.build_radar_ic
              run_py "radar page (build_radar_page)"        scripts.build_radar_page
              central; hub ;;
            *)
              echo "::error::unknown scope '$SCOPE'"; exit 1 ;;
          esac
          exit 0
      - name: guard — inline JS must parse
        # Same gate as pages.yml: refuse to deploy if a committed inline <script> has a
        # JS syntax error (e.g. an empty template var rendering the page blank), so a bad
        # render keeps the last-good site live instead of shipping a broken page.
        run: python3 scripts/check_inline_js.py site
      - name: guard — market-state board coherence (ui.ms_board_coherence)
        # A freshly rendered board whose verdict/score/thesis/notes disagree means the
        # render itself is broken (engine or template regression) — restore last-good
        # boards from checkout HEAD so the commit step (if: always()) can't ship them,
        # then fail RED for visibility. The rebase-race hybrid variant (2026-07-07,
        # commit 5bf116a3b3) is healed separately inside the push loop below.
        run: |
          python3 scripts/check_ms_board_coherence.py && exit 0
          python3 scripts/check_ms_board_coherence.py --heal-from HEAD || true
          exit 1
      - name: inject data-base shim (site-wide; a re-render would strip it otherwise)
        run: python -m scripts.inject_data_base || echo "data-base shim inject skipped (additive)"
      - name: commit rendered site (site/ ONLY — never data/, so ledgers stay pristine)
        if: always()
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # ONLY site/ — never data/ or reports/. The render may touch data/ as a build
          # side-effect (cache writes, alert appends), but committing none of it keeps the
          # nightly the single source of truth for every forward-accountability ledger.
          git add site/
          # force-add the gitignored-but-tracked-on-main site subtrees (search libraries,
          # chart OHLC, intraday, stock briefs) so the committed-tree deploy ships them —
          # a no-op for any subtree this scope didn't rebuild.
          git add -f site/stockbrief 2>/dev/null || true
          if git diff --cached --quiet; then echo "no rendered-site changes to commit"; exit 0; fi
          git commit -m "render: site re-render $(date -u +%F) (scope=${{ github.event.inputs.scope || 'all' }})"
          # This push is now the ONLY way the render reaches the live site (the VPS serves
          # committed main; there is no Pages-artifact fallback), so it MUST land.
          # --autostash parks the render's throwaway data/ writes (we commit site/ ONLY) so
          # `pull --rebase` doesn't refuse on a dirty tree — that refusal silently failed
          # EVERY render push before. `-X theirs` keeps the commits being REPLAYED (our
          # fresh render) on conflict.
          for i in 1 2 3 4 5; do
            # pre-sync collision sweep: a commit landing mid-render can TRACK a path this
            # run wrote as an UNTRACKED side-effect (run 29146200009: data/ news caches +
            # event_log.parquet, landed on main during a 60-min scope=all render) — the
            # rebase's checkout then refuses ("untracked working tree files would be
            # overwritten") and every retry dies identically, because --autostash parks
            # TRACKED modifications only. Delete exactly the paths that are untracked here
            # AND tracked on origin/main: the local copy is a throwaway lane write (this
            # step commits site/ ONLY; the nightly owns data/), main's copy is
            # authoritative. Everything else is untouched — tracked-file edits (ledgers)
            # still ride the autostash, and untracked paths main doesn't know about
            # (runner-local stores, gitignored caches) never enter the intersection.
            git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if git pull --rebase --autostash -X theirs origin main; then
              # post-rebase template↔site re-sync (ui.template_site_sync): -X theirs can
              # resurrect this run's checkout-time template copies over a reword that merged
              # mid-render (2026-07-07: engine-render commit 2ae709f9f0 reverted #1793's
              # site-side de-escalation in sector_cycles.js this way). templates/ is now
              # fresh post-rebase main — re-copy and fold any delta into a follow-up commit.
              python -m scripts.check_template_site_sync --fix || true
              # ms-board coherence guard (ui.ms_board_coherence): -X theirs resolves whole
              # conflict REGIONS toward this run's replayed render, so racing a mid-render
              # engine-render can stitch a hybrid Market State board — 2026-07-07 commit
              # 5bf116a3b3 baked upstream's score 56/"Mixed" beside this run's stale
              # "Risk Radar forces Risk-off." note, a pair market_state_snapshot can never
              # emit. Restore any incoherent page WHOLESALE from post-rebase origin/main
              # (coherent, at most one render old; the next render re-lands freshness).
              python3 scripts/check_ms_board_coherence.py --heal-from origin/main \
                || echo "::warning::ms-board coherence heal incomplete (incoherent board may predate this run)"
              if ! git diff --quiet -- site/; then
                git add site/ && git commit -m "render-sync: post-rebase guards (template re-copy + ms-board coherence)" \
                  || echo "::warning::render-sync commit failed (non-fatal — pages publish gate backstops divergence)"
              fi
              if git push; then echo "pushed rendered site on attempt $i"; exit 0; fi
            fi
            git rebase --abort 2>/dev/null || true
            echo "render push attempt $i failed (rebase/race); re-syncing"; sleep $((i * 7))
          done
          echo "::warning::could not push rendered site after 5 attempts — the next render or the nightly will re-land it"
