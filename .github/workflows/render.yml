      # here makes build_vector's surviving fallback hook a no-op for the rest of this
      # step, so scope=all does not pay for the ~10m builder twice.
      # (Restored 2026-07-30: #3834's stale-base clobber deleted this block one day
      #  after #3826 added it, along with the leaderradar/foresight/omission blocks.)
      # ---- thematic foresight desk: page-only re-render from committed stores ----
      # Express-safe via two sentinels this step already arms: RENDER_NO_DRIP=1 skips
      # the three keyless collector drips (EDGAR guidance/emergence, openFDA — the FDA
