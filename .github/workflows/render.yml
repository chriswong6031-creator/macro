permissions:
  contents: write   # commit the rendered site/ to main; the VPS (Caddy) serves from main

concurrency:
  # Its OWN lane, isolated from `pipeline-daily` so a render can never starve (or be
  # starved by) the nightly.
  # cancel-in-progress: FALSE — do NOT cancel a render that's already running. With many
  # sessions merging every few minutes, `true` cancelled 27 of 30 renders (each new push
  # killed the in-flight one) so the site almost never re-rendered. With `false`, a running
  # render always FINISHES and ships; GitHub still supersedes redundant *pending* runs
  # (only the latest queued one runs next), so the site stays current without starving.
  # The COVERAGE half of that supersede behavior lives in the `pick` step (scope-union):
  # the surviving run diffs against per-region "(scope=X, from=SHA)" render-commit
  # watermarks, so superseded runs' pages — and merges landing mid-render — are still
  # rendered by whichever run eventually executes (2026-07-17 starvation postmortem).
  group: pipeline-render
  cancel-in-progress: false

jobs:
  render:
    # `macstudio` currently represents logical agents on only two physical Macs.
    # General daily/asia/codex jobs could therefore run beside this serial renderer
    # and turn a 40-71m quiet-box build into a 2h+ run. `render-heavy` reserves one
    # M2 host for this lane. The dispatch input retains the shared Mac pool and
    # render-linux as explicit operator fallbacks; bootstrap remains portable.
    runs-on:
      - self-hosted
      - ${{ github.event.inputs.runner || 'render-heavy' }}
    # was 75 — a scope=all render now takes 40-71m when the box is quiet (measured
    # 2026-07-11: run 29155365959 = 40m, run 29169451233 = 71.4m) and blew straight
    # through 75m under the evening merge-spree congestion (run 29172926033 CANCELLED
    # at exactly 75.5m, 2026-07-11 23:57 → 01:12 — all its work wasted, site stayed
    # stale). Same silent-timeout budget-rot class as daily.yml collect (100→150,
    # #2271) and asia-close (#2193). Run 30699186793 completed a 100m builder pass,
    # every guard, R2 publish, and asset shim, then lost the render at 115m while the
    # guarded push hydrated a 47k-object partial-clone pack after main advanced.
    # 180m covers the measured build plus the push loop's explicit 10m contention
    # budget without weakening any guard or publishing a partial tree.
    timeout-minutes: 180
    steps:
      - name: bound persisted render checkout
        id: bound
        # Self-hosted workspaces persist between jobs. The generated site history made
        # their .git directories grow without bound (measured 2026-07-30: 4.5–26 GB
        # across the local Mac pool; run 30530156302 then spent >20m in checkout's
        # index-pack before one builder ran). Once the object store crosses 1 GiB,
        # quarantine the oversized Git store, but RETAIN the clean current working tree:
        # main contains ~2.85 GB / 49.7k tracked files, so deleting the tree merely trades
        # the 26 GB history problem for a 25m+ cold download. A local metadata-only clone
        # gives the runner a shallow partial repository whose index already describes the
        # retained tree. A local config marker keeps later runs on that managed path:
        # fetch/reset only real main deltas and keep skipping actions/checkout, whose
        # unconditional detach would re-download all 49.7k current-tree blobs. The exact
        # workspace shape is validated before any destructive command. The quarantined
        # store lives under RUNNER_TEMP, which the runner also cleans after the job.
        shell: bash
        run: |
          set -euo pipefail
          [ -d .git ] || exit 0
          GIT_KIB=$(du -sk .git | awk '{print $1}')
          GIT_MAX_KIB="${CHECKOUT_GIT_MAX_KIB:-1048576}"
          validate_workspace() {
            case "${GITHUB_WORKSPACE:-}" in
              */_work/*/*) ;;
              *) echo "::error::refusing checkout reset outside a runner _work repository: ${GITHUB_WORKSPACE:-unset}"; exit 1 ;;
            esac
            [ "$PWD" = "$GITHUB_WORKSPACE" ] || {
              echo "::error::refusing checkout reset because PWD is not GITHUB_WORKSPACE"
              exit 1
            }
          }
          MANAGED=$(git config --local --get macro.renderMetadataCheckout || true)
          if [ "$MANAGED" != "true" ] \
            && [ "$(git rev-parse --is-shallow-repository 2>/dev/null || true)" = "true" ] \
            && [ "$(git config --local --get remote.origin.partialclonefilter || true)" = "blob:none" ]; then
            # One-time adoption for workspaces compacted by the immediately preceding
            # workflow revision, before the persistent marker existed. It is also safe
            # for checkout-created shallow partial clones: reset below repairs missing or
            # dirty paths while the stat-valid retained tree avoids unchanged blob fetches.
            git config --local macro.renderMetadataCheckout true
            MANAGED=true
            echo "::notice::adopted existing shallow blobless render checkout"
          fi
          if [ "$MANAGED" = "true" ] && [ "${GIT_KIB:-0}" -le "$GIT_MAX_KIB" ]; then
            validate_workspace
            git fetch --no-tags --depth=1 origin main
            SEED_SHA=$(git rev-parse FETCH_HEAD)
            # Successful renders leave site/ clean but may leave throwaway data/ writes;
            # timed-out renders can leave either namespace dirty. A hard reset with a
            # stat-populated index fetches only dirty or main-changed paths from the
            # promisor remote, not every unchanged working-tree blob.
            git reset --hard "$SEED_SHA"
            git clean -ffdx
            git update-index --refresh
            echo "checkout_ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice::refreshed managed render checkout to $SEED_SHA with a $(du -sh .git | awk '{print $1}') metadata store"
            exit 0
          fi
          [ "${GIT_KIB:-0}" -gt "$GIT_MAX_KIB" ] || {
            echo "::notice::persisted checkout is $((GIT_KIB / 1024)) MiB; below the reset bound"
            exit 0
          }
          validate_workspace
          CHECKOUT_TRASH="${RUNNER_TEMP:?}/macro-git-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
          CHECKOUT_META="${RUNNER_TEMP:?}/macro-meta-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
          case "$CHECKOUT_TRASH $CHECKOUT_META" in
            "$RUNNER_TEMP"/macro-git-"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT $RUNNER_TEMP"/macro-meta-"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT") ;;
            *) echo "::error::refusing unexpected checkout quarantine paths"; exit 1 ;;
          esac
          [ ! -e "$CHECKOUT_TRASH" ] && [ ! -e "$CHECKOUT_META" ] || {
            echo "::error::refusing to overwrite an existing checkout quarantine"
            exit 1
          }
          REMOTE_URL=$(git remote get-url origin)
          # Update with the complete old store BEFORE replacing its metadata. Running
          # actions/checkout against a blobless index invokes `checkout --detach`,
          # which lazy-fetches every tracked blob even when the retained files match
          # (live validation 30543197076 requested 48,877 objects). The old store
          # already owns nearly every blob, so this fetch/reset downloads only deltas.
          git fetch --no-tags --depth=1 origin main
          SEED_SHA=$(git rev-parse FETCH_HEAD)
          echo "::notice::compacting oversized persisted checkout ($((GIT_KIB / 1024)) MiB) at $SEED_SHA"
          # A timed-out render can leave tracked and ignored builder outputs dirty.
          # Restore the retained tree while its complete old object store is available.
          git reset --hard "$SEED_SHA"
          git clean -ffdx
          echo "CHECKOUT_TRASH=$CHECKOUT_TRASH" >> "$GITHUB_ENV"
          mv .git "$CHECKOUT_TRASH"
          # Serve a metadata-only depth-1 clone locally. The old tree's blobs stay on
          # disk as regular working files; they are not copied into the new object store.
          git --git-dir="$CHECKOUT_TRASH" config uploadpack.allowFilter true
          git clone --quiet --no-checkout --single-branch --branch main --depth=1 \
            --filter=blob:none "file://$CHECKOUT_TRASH" "$CHECKOUT_META"
          mv "$CHECKOUT_META/.git" "$GITHUB_WORKSPACE/.git"
          rmdir "$CHECKOUT_META"
          git remote set-url origin "$REMOTE_URL"
          git config --local macro.renderMetadataCheckout true
          # Populate index stat data from the retained clean files without checking out
          # (and therefore without lazy-fetching) all ~49.7k current-tree blobs.
          git reset --mixed HEAD
          git update-index --refresh
          echo "checkout_ready=true" >> "$GITHUB_OUTPUT"
          echo "::notice::retained current tree with a $(du -sh .git | awk '{print $1}') shallow metadata store"
      - uses: actions/checkout@v4
        # checkout@v4 unconditionally detaches an existing branch before fetching its
        # requested ref. On the managed blobless checkout that operation asks the
        # promisor remote for the entire 2.85 GB current tree. The bound step has already
        # updated/reset-cleaned main, both on initial compaction and every managed reuse.
        if: steps.bound.outputs.checkout_ready != 'true'
        with:
          ref: main
          # Keep the complete current tree (all builders need committed data + site),
          # but never download historical generated-site blobs. Combined with the
          # bounded reset above, each runner retains one useful tree, not tens of GB
          # of obsolete HTML generations.
          filter: blob:none
          fetch-depth: 1
          # The publish step installs one process-local token. Persisting checkout's
          # header as well sends duplicate Authorization headers and GitHub intermittently
          # answers HTTP 400 (run 30566352541: eight failed fetches before attempt 9).
          persist-credentials: false
      - run: |
          git pull origin main
          # A checkout-created partial clone is safe to reuse on the next render even
          # when this run did not enter through the managed fast path.
          git config --local macro.renderMetadataCheckout true
      - name: python 3.12 venv (self-hosted runner; Linux render-linux, Homebrew fallback)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          # render-linux (WSL2 PC) has python3.12 on PATH; a Mac fallback runner uses the Homebrew path.
          PYBIN="$(command -v python3.12 || echo /opt/homebrew/bin/python3.12)"
          [ -x "$VENV/bin/python" ] || "$PYBIN" -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - name: zstd parity for actions/cache (breadth caches are macOS-saved)
        run: |
          # actions/cache versions include the compression method: the collect lanes
          # (macOS) save the breadth close caches with zstd, so a runner WITHOUT zstd
          # computes a different cache version and every restore silently misses —
          # 2026-07-18: render-linux had no zstd, builders saw no close panel, and the
          # HK standout board shipped 0 buys. Heal if passwordless sudo allows; warn
          # loudly either way so the miss is never silent again.
          if ! command -v zstd >/dev/null 2>&1; then
            sudo -n apt-get install -y zstd >/dev/null 2>&1 || true
            command -v zstd >/dev/null 2>&1 && echo "installed zstd" || \
              echo "::warning::zstd missing on ${RUNNER_NAME:-this runner} — breadth-cache restores WILL miss (cache version mismatch vs macOS-saved entries). Install zstd in the runner distro."
          fi
      - run: pip install -r requirements.txt
      - name: restore attention store from R2 (wiki chip reads it at render)
        # data/attention/*.parquet are git-ignored (R2 data plane; deep history 2015-07→,
        # kept current by daily.yml's collect job). Non-fatal: absent store = the
        # attention chip is silently absent this render (build_attention_data -> None).
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.fetch_r2 --dirs attention || echo "::warning::attention restore failed (non-fatal — attention chip absent/stale this render)"
      # Restore the gitignored breadth close caches (the stock-search libraries +
      # build_site's per-name analyze read constituent closes) and the intraday cache
      # (chart data). Restore-only — the nightly `collect` job produces/saves them; we
      # fall back via restore-keys to the most recent daily's cache.
      - name: restore breadth (S&P 500) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-render-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: restore smallcap (S&P 600) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/smallcap_breadth/_closes_cache.parquet
          key: smallcap-closes-render-${{ github.run_id }}
          restore-keys: smallcap-closes-
      - name: restore midcap (S&P 400) close cache
        uses: actions/cache/restore@v4
        with:
          path: data/midcap_breadth/_closes_cache.parquet
          key: midcap-closes-render-${{ github.run_id }}
          restore-keys: midcap-closes-
      - name: restore china breadth close cache
        uses: actions/cache/restore@v4
        with:
          path: data/china_breadth/_closes_cache.parquet
          key: china-breadth-closes-render-${{ github.run_id }}
          restore-keys: china-breadth-closes-
      - name: restore hk breadth close cache
        uses: actions/cache/restore@v4
        with:
          path: data/hk_breadth/_closes_cache.parquet
          key: hk-breadth-closes-render-${{ github.run_id }}
          restore-keys: hk-breadth-closes-
      - name: restore intraday (4H) cache
        uses: actions/cache/restore@v4
        with:
          path: data/intraday
          key: intraday-render-${{ github.run_id }}
          restore-keys: intraday-
      - name: pick render scope (union of everything un-rendered since each region's last covering render)
        id: pick
        # SCOPE-UNION detection (2026-07-17 starvation fix). The old logic diffed ONLY the
        # triggering push (event.before..after). Under a merge burst the pipeline-render
        # group keeps a single PENDING run (cancel-in-progress: false; older pending runs
        # are superseded = shown "cancelled"), so the one surviving run rendered just its
        # own push's scope and silently dropped the superseded merges' pages (2026-07-17
        # 08:32-11:49Z: 3.2h of narrowed coverage during a live crash while display fixes
        # sat merged-but-undeployed). Same hole for merges landing DURING a 40-71m render.
        #
        # Fix: every COMPLETED render commits "(scope=X, from=SHA)" where SHA is the main
        # tree it actually rendered (captured here, post-pull — see the commit step). A
        # region R is DIRTY iff any R-relevant file changed between the newest render
        # commit whose scope covered R (scope=all, or R listed in a composite scope) and
        # HEAD. Final scope = union of dirty regions: 1-3 regions -> "r1+r2" (the render
        # step runs each sequentially), 4+ regions or any shared/unmapped file -> all.
        # Cancelled/timed-out renders commit WITHOUT from= and so never advance a
        # watermark. Per-region whitelists are unchanged from the ratified narrow-scope
        # design: a wrong scope can only FAIL a render (unknown-scope exit, recoverable),
        # never silently stale a page — and ANY fetch/parse/diff failure here falls back
        # to scope=all, so this step can only ever OVER-render.
        run: |
          set +e
          FROM_SHA=$(git rev-parse HEAD 2>/dev/null | cut -c1-12)
          echo "rendered_from=$FROM_SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scope=${{ github.event.inputs.scope }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          region_of() {
            case "$1" in
              templates/china.html.j2|templates/china_news.html.j2|scripts/build_china.py) echo china;;
              templates/china_special_situations.html.j2|templates/_china_special_situations_*.html.j2|scripts/build_china_special_situations.py) echo china;;
              templates/intl.html.j2|scripts/build_intl.py) echo intl;;
              templates/international_macro.html.j2|scripts/build_international_macro.py|engine/international_macro_dashboard.py|collectors/intl_macro.py|data/intl_risk/cb_calendar.yml|docs/INTERNATIONAL_MACRO_DATA_CONTRACT.md) echo intl;;
              templates/hk.html.j2|scripts/build_hk.py) echo hk;;
              templates/canada.html.j2|templates/canada_stock.html.j2|templates/canada_history.html.j2|templates/canada_sector.html.j2|scripts/build_canada.py|scripts/build_canada_library.py) echo canada;;
              templates/commodities.html.j2|templates/spr.html.j2|templates/forex.html.j2|templates/bonds.html.j2|templates/crossasset.html.j2|templates/transmission.html.j2|templates/discovery.html.j2|templates/macro_context.html.j2|scripts/build_commodities.py|scripts/build_spr.py|scripts/build_forex.py|scripts/build_bonds.py|scripts/build_crossasset.py|scripts/build_transmission.py|scripts/build_discovery.py|scripts/build_macro_context.py) echo markets;;
              templates/gex.html.j2|scripts/build_gex_board.py|scripts/build_options_flow.py|scripts/build_options_skew.py|scripts/build_vol_regime.py) echo gex;;
              # OIP E8 leaf-page narrowing — rationale in the step's YAML comment block.
              templates/options.html.j2|templates/options_screener.html.j2|scripts/build_options_command.py|scripts/build_options_screener.py) echo gex;;
              templates/baskets.html.j2|templates/methodology.html.j2|templates/government_revenue.html.j2|scripts/build_baskets.py|scripts/build_methodology.py|scripts/build_government_revenue.py|scripts/check_government_revenue_projection.py) echo baskets;;
              templates/dashboard.html.j2|templates/stock.html.j2|templates/news.html.j2|templates/ticker.html.j2|templates/ticker_index.html.j2|templates/fundamental_forensics.*|templates/biocatalyst.*|scripts/build_site.py|scripts/build_ticker_pages.py|scripts/build_fundamental_forensics.py|scripts/build_biocatalyst.py) echo macro;;
              templates/special_situations.html.j2|templates/_special_situations_*.html.j2|scripts/build_special_situations.py) echo sits;;
              templates/*|scripts/build_*.py|config.yml|lib/*) echo all;;
              *) echo skip;;
            esac
          }
          # checkout@v4 is depth-1: deepen enough to reach recent watermarks (main runs
          # ~215 commits/day and renders land ~10x/day, so 900 covers >3 days; a watermark
          # beyond the window just means scope=all once, which re-primes it at HEAD).
          [ -f "$(git rev-parse --git-dir)/shallow" ] && git fetch -q --deepen=900 origin main 2>/dev/null
          # Newest-first "(scope, from)" pairs from prior completed renders.
          WATERMARKS=$(git log -n 900 --format='%s' 2>/dev/null \
            | sed -n -E 's/^render: site re-render [0-9-]+ \(scope=([a-z+]+), from=([0-9a-f]{7,40})\)$/\1 \2/p')
          covering_from() {   # $1=region -> newest from= SHA of a render whose scope covered it
            local sc fr
            while read -r sc fr; do
              case "+$sc+" in *"+all+"*|*"+$1+"*) echo "$fr"; return 0;; esac
            done <<< "$WATERMARKS"
            return 1
          }
          DIRTY="" NEED_ALL=""
          for R in macro intl china hk canada markets gex baskets sits; do
            FR=$(covering_from "$R")
            if [ -z "$FR" ]; then NEED_ALL="no from=-tagged render covers '$R' in the log window"; break; fi
            CH=$(git diff --name-only "$FR..HEAD" -- templates scripts config.yml lib 2>/dev/null)
            if [ $? -ne 0 ]; then NEED_ALL="git diff $FR..HEAD failed for '$R' (rewritten/expired watermark)"; break; fi
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$(region_of "$f")" in
                "$R") DIRTY="$DIRTY $R"; break;;
                all)  NEED_ALL="'$f' (shared/unmapped) changed since '$R' watermark $FR"; break;;
              esac
            done <<< "$CH"
            [ -n "$NEED_ALL" ] && break
          done
          DIRTY=$(echo $DIRTY | tr ' ' '\n' | awk 'NF && !s[$0]++' | paste -sd+ -)
          N=$(echo "$DIRTY" | tr '+' '\n' | grep -c .)
          if [ -n "$NEED_ALL" ]; then S=all; echo "::notice::scope=all ($NEED_ALL)"
          elif [ "$N" -eq 0 ]; then S=all; echo "::notice::scope=all (push fired but no region resolved dirty — defensive full render)"
          elif [ "$N" -ge 4 ]; then S=all; echo "::notice::scope=all ($N regions dirty [$DIRTY] — full render is comparable cost)"
          else S="$DIRTY"; echo "::notice::dirty since last covering renders -> scope=$S"
          fi
          echo "scope=$S" >> "$GITHUB_OUTPUT"
      # ── OIP E8 express-lane coverage (2026-07-29) ──────────────────────────────
      # NOTE ON LENGTH: this prose lives in a YAML comment ABOVE the step, not inside
      # `run:`. The scalar has a hard ceiling GitHub enforces by DE-REGISTERING the
      # workflow (tests/test_render_run_size_cap.py); comments here cost it nothing.
      # engine-render.yml's twin scalar sits ~350 chars from that ceiling, so keep new
      # explanation for BOTH lanes here and in its mirror block.
      #
      # build_options_command (options.html, the canonical options surface) and
      # build_options_screener (options_screener.html + the workspace's Scanner payload
      # site/screenerdata/rows.json) were BOTH daily.yml-only. So every express render
      # refreshed the stores those pages describe and committed the pages unchanged — the
      # flow_leaders (#3515) / research_vault (#3487) freeze class — and an edit to
      # build_options_command.py or templates/options.html.j2 never baked until the
      # nightly, because scope=all did not run the builder either.
      #
      # PLACEMENT LAW. build_options_command re-serialises six stores whose producers
      # STRADDLE the phases: gex_board / vol_regime / options_screener are cl_gex members
      # (parallel band) while build_flow_leaders is the post-band flowleaders() step. So it
      # is a SERIAL POST-BAND step (optionscmd(), immediately after flowleaders()) and
      # never a cl_gex member — inside the band it would re-serialise leaders.json BEFORE
      # flowleaders() rewrote it, baking a generation-stale Leaders mode every run. Same
      # reasoning daily.yml:1314-1324 records for the same builder.
      # build_options_screener sits INSIDE cl_gex, after options_skew/options_ivspread, so
      # it reads this run's snapshots; not a sibling cluster, because build_options_skew
      # rewrites snapshots.parquet non-atomically (see the leaderradar note).
      # The narrow `gex)` case additionally gained build_options_entry_state: it had
      # drifted from cl_gex, refreshing the skew/ivspread snapshots without re-running the
      # fusion that consumes them.
      # All three are pure functions of committed data/: zero network, site/-only page
      # writes. Measured on the real stores: build_options_screener 4.6s,
      # build_options_command 0.4s, build_flow_leaders ~27s. Narrow gex) therefore costs
      # about +32s (screener + flowleaders + optionscmd) and cl_gex +4.6s; scope=all pays
      # only +0.4s because it already ran flowleaders. build_options_entry_state (6.3s) was
      # REMOVED from the narrow case by M11 — its only output is under data/, which this
      # lane discards.
      # Anti-rot: tests/test_render_options_workspace_scope.py.
      #
      # region_of() NARROWING. templates/options.html.j2, templates/options_screener.html.j2,
      # scripts/build_options_command.py and scripts/build_options_screener.py map to `gex`:
      # they are LEAF pages (no other builder reads their HTML) and the `gex` scope now
      # rebuilds both. DELIBERATELY NOT mapped: build_options_ivspread.py and
      # build_options_entry_state.py — their stores also feed build_flow_leaders and
      # build_site (stock_score), which `gex` does NOT run, so narrowing them would trade
      # one staleness class for another. They keep falling through to `all`.
      #
      # M11: build_options_entry_state is NOT in the narrow gex) case. Its only output is
      # data/options_entry/state.parquet and this lane commits site/ ONLY, so running it
      # here was 6.3s of compute whose result is discarded. It stays in cl_gex (where the
      # same is true, but the cluster is the daily-mirroring band) and in daily.yml, which
      # is the lane that actually persists it — the drift it fixes is a daily-cadence one.
      #
      # M10: the narrow case calls flowleaders BEFORE optionscmd. optionscmd re-serialises
      # site/flowleaders/leaders.json, and this scope is now reachable by a template edit
      # via region_of, so without it a gex-scope render would bake options.html with a
      # silently-stale Leaders block. build_flow_leaders is documented express-safe: zero
      # data/ writes, absent-safe, exit 0, ~27s.
      #
      # ── FD-EXP: flow_desk express-lane coverage (2026-07-30) ──────────────────
      # NOTE ON LENGTH: this prose is a YAML comment ABOVE the step, not inside `run:`.
      # The scalar has a hard ceiling GitHub enforces by DE-REGISTERING the workflow
      # (tests/test_render_run_size_cap.py); comments cost it nothing. engine-render.yml's
      # twin scalar has ~340 chars of headroom — keep new explanation HERE, in both lanes.
      #
      # build_flow_desk was the last options-family builder wired in daily.yml ONLY, so
      # site/flow_desk.html + site/flow_desk.json + site/flowdata/cohorts.json refreshed
      # once a night while every express render rebuilt the stores around them — the
      # flow_leaders (#3515) / research_vault (#3487) freeze class. An edit to the builder
      # or templates/flow_desk.html.j2 sat unbaked until the next nightly.
      #
      # ADMISSION PRECONDITION (#4007, merged 2026-07-30): the builder's three data/ write
      # paths — the broad + sector flow proxies (data/flows/*.parquet) and the cohort
      # accrual upserts (data/options_flow/cohorts_<key>.parquet, via engine.flow_cohorts)
      # — are now COLLECT_LANE=nightly-gated in code (HOUSE-U5, the build_leader_radar
      # pattern). Off-nightly the bake is a pure site/-only function of committed data/:
      # zero network, ~2.6-2.9s measured. That gate is what makes this admission safe; it
      # also closed a measured corruption where an off-nightly run appended an all-None
      # coverage=0 row to all four cohort forward ledgers.
      # Pinned by tests/test_flow_desk.py::TestProxyLaneGate and
      # tests/test_flow_cohorts.py::TestCohortAccrualLaneGate.
      #
      # PLACEMENT: inside cl_gex, immediately AFTER build_options_flow — the desk reads
