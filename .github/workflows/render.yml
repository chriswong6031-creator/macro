      # COLLECT_LANE unset, every foresight ledger appender self-gates
      # (engine.ledger_lane, the #2598 sweep gap closed 2026-07-25), so the baked
      # track/grade/monitor/ENB numbers derive from COMMITTED rows only — the nightly
      # stays the sole forward-ledger advancer, and this lane's `git add site/` has
      # nothing to discard. WHY: the builder ran ONLY in daily.yml as the LAST of 22
      # serial builders; the 07-22..24 dead nightlies froze foresight.html at its
      # pre-revamp render while express lanes refreshed everything around it (same
      # class + heal as research_vault #3487 / flow_leaders #3515). ~11s measured on
      # committed stores (was ~83s with the drips). Serial post-band: same slot and
      # race posture as flowleaders above; also rewrites
      # site/basketdata/foresight_cascade.json in the same pass as the page it pairs
      # with. (Also restored 2026-07-30 after #3834's stale-base clobber.)
      - name: re-render pages from committed data (resilient; no collect / no LLM / no EDGAR)
        id: render_pages
        # Mirrors the RENDER steps of daily.yml's `engine` job, minus the collectors,
        # engine.run, the LLM brains + their scorers/ledgers, the EDGAR special-sits
        # sweep, notify and archive_signals. Each builder is individually resilient
        # (a non-zero exit is annotated + summarised but NEVER aborts the job), exactly
        # like the nightly — so one broken page can't 404 the whole deploy.
        env:
          # Only the live-quotes worker URL (a repo VARIABLE, baked into live_config.js so
          # browser live prices stay wired) — NO API/LLM secrets (one flag-gated exception
          # below), so the render is a pure function of the committed data on disk.
          LIVE_QUOTES_WORKER_URL: ${{ vars.LIVE_QUOTES_WORKER_URL }}
          # This lane commits site/ ONLY and discards every data/ write, so build_stock_library's
          # per-build SEC/Wikipedia drip fetches (equity_profile / edgar_rpo / edgar_headcount)
          # are wasted network here — their parquet is thrown away and the page renders from the
          # committed caches. Skipping them keeps the "no network calls" claim above honest and
          # trims ~3-4 min. The nightly `daily` (which commits data/) leaves this unset.
          RENDER_NO_DRIP: "1"
          # The flag-gated exception: build_news title_zh cache fill (engine/news_translate.py),
          # so ZH mode isn't stuck with English titles on fresh intraday headlines. INERT unless
          # config news_translation.render_lanes is true (default off) — the RENDER_NO_DRIP=1
          # sentinel gates the call in code, so with the flag off this lane makes zero LLM calls.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          SCOPE="${{ steps.pick.outputs.scope }}"; SCOPE="${SCOPE:-all}"
          echo "::notice::render scope = $SCOPE"
          # Composite scopes ("macro+china" from the pick step's union) run each region's
          # branch sequentially; hub/central are guarded to run at most once per job.
          # marker for the library-rebuild guard (same as daily): only libraries whose
          # dashboard didn't build them fresh this run get rebuilt by the safety net.
          touch "$RUNNER_TEMP/render_libs_marker"

          run_py() {   # resilient serial builder (spine, page-renderers, narrow scopes)
            local label="$1"; local mod="$2"; shift 2
            echo "::group::$label"
            python -m "$mod" "$@" > "$RUNNER_TEMP/step.log" 2>&1; local rc=$?
            cat "$RUNNER_TEMP/step.log"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=$label failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/step.log" | tr '\n' ' ' | tail -c 600)"
              { echo "### ❌ $label failed (rc=$rc)"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 60 "$RUNNER_TEMP/step.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          # ---- spine: the macro/US dashboard + the desks its pages embed ----
          # build_site reads the COMMITTED regime/latest.json (no engine.run needed) and
          # renders macro.html + the US stock pages + news.html + the stock library.
          spine() {
            run_py "S&P allocation vector (build_spvector)"        scripts.build_spvector
            run_py "alternative data desk (build_alt_data)"        scripts.build_alt_data
            run_py "13F smart-money tracker (build_smart_money)"   scripts.build_smart_money
            run_py "policy-lever card (build_policy_lever)"        scripts.build_policy_lever
            run_py "macro dashboard + US stocks (build_site)"      scripts.build_site
            run_py "congressional trades desk (build_congress)"    scripts.build_congress
          }

          # ---- US page-renderers: deterministic JSON merges + chrome (NO LLM) ----
          us_pages() {
            run_py "radar upgrade (build_radar_plus)"   scripts.build_radar_plus
            run_py "radar IC ledger (build_radar_ic)"   scripts.build_radar_ic
            run_py "radar page (build_radar_page)"      scripts.build_radar_page
            run_py "intelligence bundle (build_intelligence)" scripts.build_intelligence
            run_py "brain briefing tunnel (build_briefing)"   scripts.build_briefing
            run_py "intelligence hub (build_intel_hub)" scripts.build_intel_hub
            run_py "demand desk page (build_demand)"    scripts.build_demand
            run_py "calibration hub (build_calibration)" scripts.build_calibration
            run_py "AI daily brief page (build_aibrief)" scripts.build_aibrief
            run_py "mastermind snapshot page (build_mastermind)" scripts.build_mastermind
            run_py "AI desk page (build_ai_desk_page)"  scripts.build_ai_desk_page
          }

          hub() { [ -n "$HUB_DONE" ] && return 0; HUB_DONE=1; run_py "bitcoin vector + landing hub (build_vector)" scripts.build_vector; }
          crypto() { [ -n "$CRYPTO_DONE" ] && return 0; CRYPTO_DONE=1; run_py "crypto intelligence cockpit (build_crypto)" scripts.build_crypto; }
          intl() { [ -n "$INTL_DONE" ] && return 0; INTL_DONE=1; run_py "international macro dashboard (build_intl)" scripts.build_intl; }

          # Canada / S&P-TSX: rationale + restore provenance in the comment block above
          # this step (moved out of the run script 2026-08-01: 21,000-char run limit).
          canada() { [ -n "$CANADA_DONE" ] && return 0; CANADA_DONE=1; export SKIP_CANADA_HOOK=1; run_py "canada / S&P-TSX dashboard (build_canada)" scripts.build_canada; }

          # US Sector Central hub — reads baskets.json + sector_cycles_data.js + the heatmap json
          # (all committed or freshly rebuilt by band/spine). Call AFTER band so its deps exist.
          central() { [ -n "$CENTRAL_DONE" ] && return 0; CENTRAL_DONE=1; run_py "US sector central intelligence (build_sector_central)" scripts.build_sector_central; }

          # ---- flow leaders desk: page-only re-render from committed stores ----
          # Inputs are git-tracked parquet stores + build_site's JSONs; zero data/
          # writes, absent-safe, exit 0 — can never break the deploy. Daily-lane-only
          # until 2026-07-25: 3 dead nightlies (150m-cap cancels 07-22/23, runner loss
          # 07-24) froze the baked page at its pre-#3224 render (banned-vocab slugs
          # live on a doctrine surface) while express lanes refreshed everything else —
          # same class + heal as research_vault (#3487). ~27s. Called AFTER band():
          # cl_gex's build_options_entry_state rewrites data/options_entry/state.parquet
          # (an input here); serial post-band dodges the parallel read/write window.
          flowleaders() { [ -n "$FLOWLEADERS_DONE" ] && return 0; FLOWLEADERS_DONE=1; run_py "flow leaders desk (build_flow_leaders)" scripts.build_flow_leaders; }

          # options.html — SERIAL POST-BAND, after flowleaders(). Never a cl_gex member.
          # Rationale + ordering law: the OIP E8 comment block above this step.
          optionscmd() { [ -n "$OPTIONSCMD_DONE" ] && return 0; OPTIONSCMD_DONE=1; run_py "options workspace (build_options_command)" scripts.build_options_command; }

          # leader radar (LR-EXP): full rationale, ordering law and SCOPE note live in
          # the leader-radar comment block above this step (moved out of the run script
          # 2026-08-01: GitHub hard-fails a run expression over 21,000 chars).
          leaderradar() { [ -n "$LEADERRADAR_DONE" ] && return 0; LEADERRADAR_DONE=1; run_py "leader radar desk (build_leader_radar)" scripts.build_leader_radar; }

          # thematic foresight desk: rationale + express-safety sentinels in the comment
          # block above this step (moved out 2026-08-01: 21,000-char run limit).
          foresightpage() { [ -n "$FORESIGHT_DONE" ] && return 0; FORESIGHT_DONE=1; run_py "thematic foresight desk (build_foresight)" scripts.build_foresight; }

          # DELIBERATELY omitted from this lane (vetted 2026-07-25):
          #  • build_odds — a collector wearing a builder's name: refetches all 119
          #    universe tickers from yfinance on EVERY run (odds.stale_trading_days: 0)
          #    with no timeout, and its data/odds_ohlcv store is gitignored → wiped by
          #    this job's clean checkout, so every express run would COLD-START a
          #    full-history backfill (5-15+ min of third-party network on the render
          #    path — the gdelt-stall class). Its site/oddsmatrix payloads are gitignored
          #    and R2-published by daily.yml only, so advancing catalog.json here would
          #    silence the page's staleness banner over stale R2 matrices. Same class as
          #    the gex_board omission in engine-render; odds.html keeps the last
          #    nightly's values. (daily.yml's build_odds step points at this bullet.)
          #  (build_leader_radar was omitted here for the same 2026-07-25 vetting; its
          #   three named bake-side blockers — the unguarded pick_lab as_of consumption,
          #   the built_at/elapsed_s churn, and the undisclosed rs_series vintage skew —
          #   were fixed in #3578, so the builder is now admitted above (#3612) as a
          #   serial post-band step.)
          # (This block was collateral damage in #3834's stale-base clobber; restored
          #  2026-07-30 — daily.yml's build_odds comment had been pointing at nothing.)

          # ---- special situations: page-only rebake, NO EDGAR sweep ----
          # The nightly owns the ~28m filing sweep; this lane re-renders the desk
          # from the COMMITTED event store so a template/builder fix ships in
          # minutes. --no-refresh reuses the last real build's `built` stamp, so an
          # untouched desk rebakes byte-for-byte and commits nothing. It also emits
          # site/premiumdata/special_situations.json — the Insider+ payload behind
          # the page's free preview (docs/TIER_PREVIEW_PATTERN.md), which MUST be
          # rebuilt in the same pass as the shell it pairs with.
          sits() { [ -n "$SITS_DONE" ] && return 0; SITS_DONE=1; run_py "special situations desk, page only (build_special_situations --no-refresh)" scripts.build_special_situations --no-refresh; }

          # ---- china special situations: page-only rebake, NO collector sweep ----
          # The asia-close lane owns the collectors and the qledger claims; this lane
          # re-renders the desk from the COMMITTED site/chinaspecialdata/special.json so a
          # template or tier-gate fix ships in minutes. --no-refresh reuses that snapshot
          # verbatim (countdowns and `built` included), so an untouched desk rebakes
          # byte-for-byte and commits nothing. It also emits site/premiumdata/
          # china_special_situations.json — the Insider+ payload behind the page's free
          # preview (docs/TIER_PREVIEW_PATTERN.md), which MUST be rebuilt in the same pass
          # as the shell it pairs with.
          csits() { [ -n "$CSITS_DONE" ] && return 0; CSITS_DONE=1; run_py "china special situations desk, page only (build_china_special_situations --no-refresh)" scripts.build_china_special_situations --no-refresh; }

          # ---- the parallel regional/desk band (mirrors daily, MINUS special-sits) ----
          band() {
            local ART="$RUNNER_TEMP/band"; rm -rf "$ART"; mkdir -p "$ART"
            brun() {
              local slug="$1" label="$2" mod="$3"; shift 3
              local t0 t1 rc
              t0=$(date +%s)
              { echo "$label"; python -m "$mod" "$@" 2>&1; } > "$ART/$slug.log"; rc=$?
              t1=$(date +%s)
              echo "$rc"          > "$ART/$slug.rc"
              echo "$((t1 - t0))" > "$ART/$slug.sec"
            }
            cl_markets() {
              brun commodities  "build commodity vector (build_commodities)"         scripts.build_commodities
              brun spr          "build strategic reserves (build_spr)"               scripts.build_spr
              brun forex        "build forex vector (build_forex)"                   scripts.build_forex
              brun bonds        "build bonds & bond-health (build_bonds)"            scripts.build_bonds
              brun crossasset   "cross-asset vector (build_crossasset)"              scripts.build_crossasset
              brun transmission "rate & inflation transmission (build_transmission)" scripts.build_transmission
              brun discovery    "discovery leaderboard (build_discovery)"            scripts.build_discovery
              brun macro_context "build macro-context page (build_macro_context)" scripts.build_macro_context
            }
            cl_china() { brun china "build china a-share dashboard (build_china)" scripts.build_china; }
            cl_hk()    { brun hk    "build hong kong / hang seng (build_hk)"      scripts.build_hk; }
            cl_gex() {
              brun gex_board    "GEX magnets board (build_gex_board)"        scripts.build_gex_board
              brun vol_regime   "index vol-regime (build_vol_regime)"        scripts.build_vol_regime
              brun options_flow "options flow desk (build_options_flow)"     scripts.build_options_flow
              brun flow_desk    "group flow heatmap & market tide (build_flow_desk)" scripts.build_flow_desk
              brun options_skew "single-name IV skew (build_options_skew)"   scripts.build_options_skew
              brun options_ivspread "single-name IV spread (build_options_ivspread)" scripts.build_options_ivspread
              # OIP E8: AFTER skew/ivspread so it reads this run's snapshots; inside cl_gex
              # because build_options_skew rewrites snapshots.parquet non-atomically.
              brun options_screener "US options screener page (build_options_screener)" scripts.build_options_screener
              brun options_entry "options entry state fusion table (build_options_entry_state)" scripts.build_options_entry_state
            }
            cl_baskets() {
              brun baskets     "thematic baskets (build_baskets)"        scripts.build_baskets
              brun news        "news suite (build_news)"                 scripts.build_news
              # news_calib (grade_news_events) is intentionally ABSENT from render.yml.
              # render is a data-pristine site-only lane; event_log.parquet is never committed here,
              # so the grader always sees zero matured events and would overwrite the nightly's
              # accrued calibration.json with an all-insufficient artifact on every push-to-main render.
              # grade_news_events belongs only in daily.yml where the accrued event_log lives.
              brun methodology "methodology page (build_methodology)"    scripts.build_methodology
            }
            cl_misc() {
              brun seasonality   "factor seasonality (build_seasonality)"      scripts.build_seasonality
              brun reports       "research reports section (build_reports)"     scripts.build_reports
              # RV SEO (#3392 heal): vault page + per-report /research/ landing pages re-render
              # from the COMMITTED catalog (research-ingest commits it). Was daily-engine-only,
              # so the SEO pages stayed dark whenever the nightly died. Keep in engine-render too.
              brun research_vault "research vault page + report SEO pages (build_research_vault)" scripts.build_research_vault
              brun sectorcyc     "sector cycle intelligence (build_sector_cycles)" scripts.build_sector_cycles
              brun countrycyc    "country cycle intelligence (build_country_cycles)" scripts.build_country_cycles
              brun cycle         "cycle intelligence shell (build_cycle)"        scripts.build_cycle
              brun measurement   "cycle measurement hub (build_measurement)"    scripts.build_measurement
              brun markets       "global market cycles shell (build_markets)"    scripts.build_markets
              brun policy_intent "policy intent desk (policy_intent_desk)"      engine.policy_intent_desk
              brun policy_watch  "fed & policy watch (build_policy_watch)"      scripts.build_policy_watch
              brun index_changes "S&P index changes (build_index_changes)"     scripts.build_index_changes
              # SGA: page-only re-render from the committed data/stage_analysis/context/latest.json.
              # The stage ENGINE is daily-only (forward-ledger single-writer law) — never add it here.
              brun stage_analysis_page "Stage Analysis page (build_stage_analysis_page)" scripts.build_stage_analysis_page
              # TLT: page-only rebake from the COMMITTED site/factordata/tech_screener.json +
              # tech_lab.json — the page is a shell (tables fetch those JSONs client-side), so
              # this is ~0.5s and site/-only. The DATA generator (build_tech_lab_data,
              # ~219 tickers × 64 signals, + the ~8m confluence miner) is daily-offrender by
              # budget — NEVER add it here. Was engine-job-only, so the #3371 numeral fix sat
              # unbaked whenever the nightly died (07-22..25 freeze class).
              brun tech_lab "technical lab hub (build_tech_lab)" scripts.build_tech_lab
              # Impulse tracker: pure recompute from the tier close/volume caches (closes come
              # from this job's actions/cache restore, volume caches are git-tracked) + the
              # committed regime read; ZERO data/ writes; ~10-40s. The builder self-truncates
              # both panels to their common last session (::warns on skew), so a
              # fresher-than-git closes cache can never pair positionally against stale
              # volume rows. Nothing else in the band writes its inputs.
              brun impulse "impulse tracker (build_impulse)" scripts.build_impulse
            }
            cl_markets & cl_china & cl_hk & cl_gex & cl_baskets & cl_misc &
            wait
            # research_vault added 2026-07-25: #3487 put `brun research_vault` in
            # cl_misc but not here, and THIS loop is what prints a builder's log and
            # raises the ::error on rc!=0 — so the builder it had just lit up could
            # fail silently in the very lanes it added (its own /research/ SEO pages
            # going dark again with no annotation). Band membership without ORDER
            # membership is a builder that runs unwatched.
            local ORDER="china hk commodities spr forex bonds crossasset transmission discovery macro_context gex_board vol_regime options_flow flow_desk options_skew options_ivspread options_screener options_entry baskets news methodology seasonality reports research_vault sectorcyc countrycyc cycle measurement markets policy_intent policy_watch index_changes stage_analysis_page tech_lab impulse"
            echo "### ⏱ parallel band — per-builder wall-time" >> "$GITHUB_STEP_SUMMARY"
            for slug in $ORDER; do
              [ -f "$ART/$slug.log" ] || continue
              local label rc sec
              label=$(head -n1 "$ART/$slug.log")
              rc=$(cat "$ART/$slug.rc" 2>/dev/null || echo "?")
              sec=$(cat "$ART/$slug.sec" 2>/dev/null || echo "?")
              echo "::group::$label  [${sec}s, rc=$rc]"
              tail -n +2 "$ART/$slug.log"
              echo "::endgroup::"
              echo "- ${label} — ${sec}s (rc=${rc})" >> "$GITHUB_STEP_SUMMARY"
              if [ "$rc" != "0" ] && [ "$rc" != "?" ]; then
                echo "::error title=${label} failed (rc=${rc})::$(tail -n 2 "$ART/$slug.log" | tr '\n' ' ' | tail -c 600)"
                { echo "### ❌ ${label} failed (rc=${rc})"; echo '<details><summary>traceback</summary>'; echo; echo '```'; tail -n 40 "$ART/$slug.log"; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          }

          # ---- the failure-path library safety net (verbatim from daily) ----
          libs() {
            libdir() {
              case "$1" in
                scripts.build_china_library) echo site/chinastockdata;;
                scripts.build_hk_library) echo site/hkstockdata;;
                scripts.build_canada_library) echo site/canadastockdata;;
                scripts.build_intl_library) echo site/intlstockdata;;
              esac
            }
            for mod in scripts.build_china_library scripts.build_hk_library scripts.build_canada_library scripts.build_intl_library; do
              local idx="$(libdir "$mod")/index.json"
              if [ -f "$RUNNER_TEMP/render_libs_marker" ] && [ "$idx" -nt "$RUNNER_TEMP/render_libs_marker" ]; then
                echo "::notice::$mod — already built fresh this run ($idx); skipping redundant rebuild"
                continue
              fi
              echo "::group::$mod"; python -m "$mod" > "$RUNNER_TEMP/lib.log" 2>&1; local rc=$?; cat "$RUNNER_TEMP/lib.log"; echo "::endgroup::"
              if [ "$rc" -ne 0 ]; then
                echo "::error title=$mod failed (rc=$rc)::$(tail -n 2 "$RUNNER_TEMP/lib.log" | tr '\n' ' ' | tail -c 600)"
                { echo "### ❌ $mod failed (rc=$rc)"; echo '```'; tail -n 40 "$RUNNER_TEMP/lib.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          }

          for SC in ${SCOPE//+/ }; do
          case "$SC" in
            all)
              spine; intl; canada; band; central; flowleaders; optionscmd; leaderradar; foresightpage; hub; crypto; us_pages; libs; sits; csits ;;
            macro)
              spine; hub; crypto; us_pages; central ;;
            intl)
              intl ;;
            sits)
              sits ;;
            china)
              run_py "build china a-share dashboard (build_china)" scripts.build_china; csits; hub; crypto ;;
            hk)
              run_py "build hong kong / hang seng (build_hk)" scripts.build_hk; hub; crypto ;;
            canada)
              canada; hub; crypto ;;
            markets)
              run_py "build commodity vector (build_commodities)"         scripts.build_commodities
              run_py "build strategic reserves (build_spr)"               scripts.build_spr
              run_py "build forex vector (build_forex)"                   scripts.build_forex
              run_py "build bonds & bond-health (build_bonds)"            scripts.build_bonds
              run_py "cross-asset vector (build_crossasset)"              scripts.build_crossasset
              run_py "rate & inflation transmission (build_transmission)" scripts.build_transmission
              run_py "discovery leaderboard (build_discovery)"            scripts.build_discovery
              run_py "build macro-context page (build_macro_context)"     scripts.build_macro_context
              hub; crypto ;;
            gex)
              run_py "GEX magnets board (build_gex_board)"      scripts.build_gex_board
              run_py "index vol-regime (build_vol_regime)"      scripts.build_vol_regime
              run_py "options flow desk (build_options_flow)"   scripts.build_options_flow
              run_py "group flow heatmap & market tide (build_flow_desk)" scripts.build_flow_desk
              run_py "single-name IV skew (build_options_skew)" scripts.build_options_skew
              run_py "single-name IV spread (build_options_ivspread)" scripts.build_options_ivspread
              run_py "US options screener page (build_options_screener)" scripts.build_options_screener
              # flowleaders BEFORE optionscmd: options.html re-serialises
              # site/flowleaders/leaders.json (M10). See the OIP E8 note above the step.
              flowleaders; optionscmd
              hub; crypto ;;
            baskets)
              run_py "thematic baskets (build_baskets)"     scripts.build_baskets
              run_py "news suite (build_news)"              scripts.build_news
              run_py "methodology page (build_methodology)" scripts.build_methodology
              run_py "radar upgrade (build_radar_plus)"     scripts.build_radar_plus
              run_py "radar IC ledger (build_radar_ic)"     scripts.build_radar_ic
              run_py "radar page (build_radar_page)"        scripts.build_radar_page
              central; hub; crypto ;;
            *)
              echo "::error::unknown scope '$SC'"; exit 1 ;;
          esac
          done
          # Watermark gate: only a render that ran every scoped builder to the end may stamp
          # from= on its commit (see commit step) — a cancelled/timed-out job skips this line.
          echo "RENDER_OK=1" >> "$GITHUB_ENV"
          echo "complete=true" >> "$GITHUB_OUTPUT"
          exit 0
      - name: render ticker dossiers from rebuilt US stockdata
        if: steps.render_pages.outputs.complete == 'true'
        env:
          # Keep the express lane network-free. Cached logos still render; cache misses
          # wait for the nightly instead of reaching the logo CDN from this job.
          RENDER_NO_DRIP: "1"
        run: |
          set -euo pipefail
          SCOPE="${{ steps.pick.outputs.scope }}"; SCOPE="${SCOPE:-all}"
          case "+$SCOPE+" in
            *+all+*|*+macro+*) ;;
            *) echo "::notice title=ticker_dossiers::scope=$SCOPE does not rebuild US stockdata — skipped"; exit 0 ;;
          esac

          LOG="$RUNNER_TEMP/ticker-pages.log"
          MANIFEST="$RUNNER_TEMP/ticker-pages-manifest.json"
          python -m scripts.build_ticker_pages --manifest-out "$MANIFEST" 2>&1 | tee "$LOG"
          COUNT=$(sed -nE 's/.*ticker_pages::rendered=([0-9]+).*/\1/p' "$LOG" | tail -n 1)
          if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
            echo "::error title=ticker_dossiers::builder emitted no ticker pages"
            exit 1
          fi

          python - "$MANIFEST" "$COUNT" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path("site/stocks")
          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          logged_count = int(sys.argv[2])
          tickers = manifest.get("tickers") or []
          pages = [root / f"{ticker}.html" for ticker in tickers]
          markers = ("data-company-intelligence", "company-intelligence-dossier.js")
          missing = [
              path.name
              for path in pages
              if not path.is_file()
              or any(marker not in path.read_text(encoding="utf-8") for marker in markers)
          ]
          if manifest.get("schema") != "ticker-page-render-manifest.v1":
              print("::error title=ticker_dossiers::render manifest schema is invalid", flush=True)
              raise SystemExit(1)
          if manifest.get("failure_count") or manifest.get("failed_tickers"):
              failures = manifest.get("failed_tickers") or []
              sample = ", ".join(str(ticker) for ticker in failures[:20])
              print(
                  f"::error title=ticker_dossiers::{len(failures)} admitted ticker pages failed to render; "
                  f"sample: {sample}",
                  flush=True,
              )
              raise SystemExit(1)
          if manifest.get("index_written") is not True:
              print("::error title=ticker_dossiers::ticker index did not render", flush=True)
              raise SystemExit(1)
          if (not tickers or manifest.get("rendered_count") != len(tickers)
                  or manifest.get("rendered_count") != logged_count):
              print("::error title=ticker_dossiers::render manifest is empty or inconsistent", flush=True)
              raise SystemExit(1)
          if missing:
              sample = ", ".join(missing[:20])
              print(
                  f"::error title=ticker_dossiers::{len(missing)} of {len(tickers)} rendered ticker pages "
                  f"lack the Company Intelligence shell; sample: {sample}",
                  flush=True,
              )
              raise SystemExit(1)
          print(
              f"::notice title=ticker_dossiers::{len(tickers)} rendered ticker pages carry the Company Intelligence shell",
              flush=True,
          )
          PY
      - name: ensure node for the inline-JS guard
        # check_inline_js shells out to `node --check`. pc-render-1 (WSL2, #2771) shipped
        # WITHOUT node, so this guard failed on every render there 07-18; the old
        # always-publish path still shipped that unverified JS. Publication is now gated.
        # setup-node installs into the runner tool cache: works on Linux AND a Mac fallback.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: guard — inline JS must parse
        # Same gate as pages.yml: refuse to deploy if a committed inline <script> has a
        # JS syntax error (e.g. an empty template var rendering the page blank), so a bad
        # render keeps the last-good site live instead of shipping a broken page.
        run: python3 scripts/check_inline_js.py site
      - name: guard — no dead site references
        run: python3 scripts/check_site_asset_refs.py site
      - name: guard — market-state board coherence (ui.ms_board_coherence)
        # A freshly rendered board whose verdict/score/thesis/notes disagree means the
        # render itself is broken (engine or template regression) — restore last-good
        # boards from checkout HEAD so the commit step (if: always()) can't ship them,
        # then fail RED for visibility. The rebase-race hybrid variant (2026-07-07,
        # commit 5bf116a3b3) is healed separately inside the push loop below.
        # !cancelled(): the commit below ships even when the JS guard fails, so this heal
        # must not be skippable by an earlier step failure (07-18: a failing JS guard
        # silently skipped both this guard and the shim inject).
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/check_ms_board_coherence.py && exit 0
          python3 scripts/check_ms_board_coherence.py --heal-from HEAD || true
          exit 1
      - name: publish rebuilt US stockdata to R2 (browser data plane)
        # build_site creates a complete, fresh site/stockdata tree for every scope
        # containing macro (including all). The browser reads that tree from R2, not
        # from the committed site/, so discarding it here left engine/template changes
        # wired into the page but inert until the next successful nightly. Publish the
        # exact tree that just passed the render guards. --no-manifest is mandatory:
        # this lane owns the rebuilt US objects, not the full multi-market manifest.
        # Unlike the nightly's best-effort sync, missing credentials or exhausted
        # retries are a hard red signal: a green express render must mean its browser
        # data plane advanced too.
        if: ${{ success() }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          SCOPE="${{ steps.pick.outputs.scope }}"; SCOPE="${SCOPE:-all}"
          case "+$SCOPE+" in
            *"+all+"*|*"+macro+"*) ;;
            *) echo "::notice::scope=$SCOPE did not rebuild US stockdata — R2 sync skipped"; exit 0 ;;
          esac
          for V in R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!V}" ]; then
              echo "::error title=render stockdata publish unavailable::$V is unset"
              exit 1
            fi
          done
          if [ ! -s site/stockdata/index.json ]; then
            echo "::error title=render stockdata publish refused::site/stockdata/index.json is absent or empty"
            exit 1
          fi
          for ATTEMPT in 1 2 3; do
            if python -m scripts.publish_r2 --dirs stockdata --no-manifest; then
              echo "::notice::render stockdata published to R2 on attempt $ATTEMPT"
              exit 0
            fi
            echo "::warning::render stockdata R2 attempt $ATTEMPT failed; retrying"
            sleep $((ATTEMPT * 10))
          done
          echo "::error title=render stockdata publish failed::R2 sync failed after 3 attempts"
          exit 1
      - name: inject data-base shim (site-wide; a re-render would strip it otherwise)
        # Never normalize/publish a cancelled, timed-out, or guard-failed tree. The
        # next render's watermark union keeps every unfinished scope dirty.
        if: ${{ success() && steps.render_pages.outputs.complete == 'true' }}
        run: |
          # Government Revenue carries an embedded first-paint bundle. Rebuild it
          # from this checkout's committed evidence before any site-wide rewrite;
          # build_baskets intentionally no longer owns this projection.
          python -m scripts.build_government_revenue --site-only
          if ! git diff --quiet -- \
            data/government_revenue/latest.json \
            data/government_revenue/workspace.json \
            data/government_revenue/dossiers.json \
            data/government_revenue/subaward_dossiers.json \
            data/government_revenue/idv_dossiers.json \
            data/government_revenue/budget_program_graph.json; then
            echo "::error title=government-revenue projection drift::render would publish site twins from evidence that is not already committed canonically"
            exit 1
          fi
          python -m scripts.inject_data_base || echo "data-base shim inject skipped (additive)"
          python -m scripts.externalize_css || echo "css externalize skipped (additive)"
          # ::warning::, not a bare echo — this step is the only thing that moves a ?v=
          # stamp, and the edge serves versioned assets `immutable, max-age=1y`. A failure
          # swallowed into a green run ships stamps that pin returning browsers to the old
          # bytes for a year (#3617/#3624), which is exactly the state we cannot see.
          python -m scripts.optimize_assets || echo "::warning::asset optimize FAILED — ?v= stamps may be stale"
      - name: guard — finalized site has no dead references
        # externalize_css can create and prune content-addressed stylesheets. Validate the
        # exact post-normalization tree that would be committed, not only the pre-pass.
        if: ${{ success() && steps.render_pages.outputs.complete == 'true' }}
        run: |
          python3 scripts/check_site_asset_refs.py site
          python -m scripts.check_government_revenue_projection
      - name: commit rendered site (site/ ONLY — never data/, so ledgers stay pristine)
        if: ${{ success() && steps.render_pages.outputs.complete == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # checkout@v4 historically persisted this header. Remove any survivor before
          # installing the process-local token below; two Authorization headers produced
          # repeated HTTP 400s instead of authenticating more strongly.
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            GIT_AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\r\n')
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $GIT_AUTH"
          fi
          commit_index() {
            local message="$1" parent tree commit
            parent=$(git rev-parse HEAD)
            tree=$(git write-tree --missing-ok)
            commit=$(printf '%s\n' "$message" | git commit-tree "$tree" -p "$parent")
            git update-ref HEAD "$commit" "$parent"
          }
          # ONLY site/ — never data/ or reports/. The render may touch data/ as a build
          # side-effect (cache writes, alert appends), but committing none of it keeps the
          # nightly the single source of truth for every forward-accountability ledger.
          # pre-commit template↔site re-sync (ui.template_site_sync): the shim/externalize
          # step above rewrites the site/ copies of the ~48 templates/-paired plain-copy
          # assets, and only the post-rebase --fix in the push loop heals the divergence —
          # a cancellation/failure between this commit and that heal ships it (engine-render
          # 2026-07-24: run 30057066815 cancelled mid-push-loop landed b6386adb4af, sync gate
          # red on every PR until #3358). Heal BEFORE staging so the first commit is never
          # diverged; the post-rebase --fix stays for the -X theirs mid-render-merge case.
          python -m scripts.check_template_site_sync --fix || true
          python3 scripts/check_conflict_markers.py --file site/start.html
          # start runtimes single-instance (ui.start_runtime_single_instance): a stale-
          # checkout render re-emits doubled live tags with ZERO markers (adad513bdfe),
          # so the marker gate above can't see it — heal from HEAD (the last committed
          # page, at most one render old) rather than forfeit the whole render.
          python3 scripts/check_start_runtime.py --heal-from HEAD
          # templates/ is staged too, and ONLY because of the plain-copy HTML pairs
          # (index.html, chat.html): optimize_assets re-stamps their templates/ side, because
          # the --fix above rewrites their site copy FROM templates/ — a stamp staged
          # site-only is reverted before it can reach main, which is why #3617's onboard.css
          # fix never reached a single returning browser. Staging site/ alone would land the
          # pair diverged and red the publish gate. Nothing else in the build path writes
          # templates/ (every commit that ever touched it is a human PR), so this adds nothing else.
          # refuse stash/rebase wreckage (2026-08-01 d29e4dd44d: a conflicted
          # autostash apply was staged wholesale — 1,704 pages shipped markers)
          bash "${GITHUB_WORKSPACE:-.}/scripts/ci/strip_conflict_markers.sh"
          git add site/
          # separate + tolerant: `git add site/ templates/` exits 128 when a pathspec
          # matches nothing, and this step runs under `-eo pipefail` — a missing
          # templates/ would abort the commit and lose the whole render rather than
          # just the stamp. Staging site/ keeps its hard-fail semantics.
          git add templates/ 2>/dev/null || true
          # force-add the gitignored-but-tracked-on-main site subtrees (search libraries,
          # chart OHLC, intraday, stock briefs) so the committed-tree deploy ships them —
          # a no-op for any subtree this scope didn't rebuild.
          git add -f site/stockbrief 2>/dev/null || true
          if git diff --cached --quiet; then echo "no rendered-site changes to commit"; exit 0; fi
          # Stamp the ACTUAL scope (the old inputs.scope||'all' recorded every push-narrowed
          # render as "all" — an audit-trail lie) plus from= = the main SHA this run actually
          # rendered (captured post-pull in the pick step). The NEXT run's scope union diffs
          # against from=, so merges that landed DURING this render are correctly seen as
          # un-rendered. The step-level completion+success gate above excludes cancelled,
          # timed-out, and guard-failed trees, so every commit is a valid watermark.
          SCOPE="${{ steps.pick.outputs.scope }}"; SCOPE="${SCOPE:-all}"
          FROM="${{ steps.pick.outputs.rendered_from }}"
          RENDER_MESSAGE="render: site re-render $(date -u +%F) (scope=$SCOPE, from=$FROM)"
          # Fail-closed conflict gate (P0 2026-08-01, d29e4dd44d / #4167): commit_index
          # writes the INDEX verbatim, so staged `Updated upstream / Stashed changes`
          # blocks (a conflicted autostash apply) would ship to main. Refuse instead.
          push_staged_heal site/ templates/ || exit 1
          # The sync/runtime/marker heals above can replace pages after the standalone
          # finalized-tree step. Validate the exact healed tree represented by the index.
          python3 scripts/check_site_asset_refs.py site
          python -m scripts.check_government_revenue_projection
          commit_index "$RENDER_MESSAGE"
          RENDER_COMMIT=$(git rev-parse HEAD)
          RENDER_PARENT=$(git rev-parse "$RENDER_COMMIT^")
          PUBLISH_INDEX="${RUNNER_TEMP:?}/render-publish-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}.index"
          PUBLISH_REF="refs/heads/render-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # This push is now the ONLY way the render reaches the live site (the VPS serves
          # committed main; there is no Pages-artifact fallback), so it MUST land.
          # --autostash parks the render's throwaway data/ writes (we commit site/ ONLY) so
          # `pull --rebase` doesn't refuse on a dirty tree — that refusal silently failed
          # EVERY render push before. `-X theirs` keeps the commits being REPLAYED (our
          # fresh render) on conflict.
          #
          # Retry policy lives in scripts/ci/push_retry.sh (shared by every lane that
          # carries this loop). 2026-07-25 run 30167139398: a correct scope=all render
          # — 1121 locked special-situations rows — lost all 5 attempts to
          # "cannot lock ref 'refs/heads/main'" and ~95 min of work was discarded. That
          # is a lost RACE for the ref, not a conflict; the old 5-attempt / 70s-total
          # deterministic ladder could not outlast a main that takes a commit every
          # 1-2 minutes. push_do tells contention from a real rebase conflict and
          # push_backoff spends the matching remedy, jittered, inside a hard deadline.
          # 2026-08-01 run 30703819996 measured the blobless checkout's cold
          # porcelain fallback at 13m24s: it rebased successfully, then lost one
          # ordinary fetch-first race, but the old 600s deadline had already
          # expired and discarded the validated all-site render. Forty minutes
          # admits that one cold hydration plus multiple warm contention retries,
          # while the 180m job cap still preserves ~35m of cleanup headroom.
          PUSH_BUDGET_SECS=2400
          PUSH_MAX_ATTEMPTS=20   # the deadline governs cold hydration; attempts cap warm ref races
          push_retry_init "rendered site"
          while push_attempt; do
            # Fetch the exact named ref we will rebase onto, then quarantine only the
            # untracked paths it tracks.  `git fetch origin main` updates FETCH_HEAD but
            # may leave origin/main stale; `git pull` then fetched a newer tree and made
            # run 30727439896 fail 20 times on the same generated cache files.  The helper
            # is Actions-only, keeps staged render output and tracked ledgers untouched,
            # and writes proven collisions under RUNNER_TEMP for postmortem recovery.
            if ! push_fetch_main_for_rebase; then
              push_backoff
              continue
            fi
            GOVREV_PROJECTION_INPUTS=(
              data/government_revenue/
              lib/pages.py
              scripts/build_government_revenue.py
              scripts/check_government_revenue_projection.py
              scripts/inject_data_base.py
              scripts/externalize_css.py
              scripts/optimize_assets.py
              scripts/check_template_site_sync.py
            )
            # Common path: main advanced only in code/data while this run changed
            # site/templates. Keep the metadata shortcut inside that exact contract:
            # a newer site/template delta needs the guarded porcelain path below,
            # because an asset deletion can invalidate a page without a path conflict.
            if git diff --quiet "$RENDER_PARENT" origin/main -- site/ templates/ "${GOVREV_PROJECTION_INPUTS[@]}" && \
              PUBLISH_COMMIT=$(push_metadata_replay_commit \
                "$RENDER_PARENT" origin/main "$RENDER_COMMIT" \
                "$RENDER_MESSAGE" "$PUBLISH_INDEX"); then
              echo "::notice::metadata-only replay onto $(git rev-parse --short=12 origin/main)"
              # Referencing the replay commit locally lets push negotiation exclude
              # promised objects already present on origin. Pushing an anonymous object
              # ID makes Git hydrate those unchanged blobs before packing.
              git update-ref "$PUBLISH_REF" "$PUBLISH_COMMIT"
              python -m scripts.check_government_revenue_projection
              if push_do origin "$PUBLISH_REF:refs/heads/main"; then
                git update-ref HEAD "$PUBLISH_COMMIT"
                git update-ref -d "$PUBLISH_REF"
                echo "pushed rendered site on attempt $PUSH_ATTEMPT (metadata-only replay)"
                push_won
                exit 0
              fi
              git update-ref -d "$PUBLISH_REF"
              push_backoff
              continue
            fi
            echo "::notice::render output overlaps newer main; using guarded porcelain fallback"
            # rename/rename on content-hashed site/assets/css/* is deterministic across
            # retries (path conflict; -X theirs can't settle it — 2026-07-22 asia-close
            # run 29904079071 dropped a day's outputs this way). The autoresolver keeps
            # both sides' hashed files (next externalize_css prunes the orphan) and
            # finishes the rebase; anything else is left for the abort+retry below.
            if { git rebase --autostash -X theirs origin/main || bash scripts/rebase_autoresolve_hashed_css.sh; } && push_autostash_ok; then
              # Prove the rebased render commit itself before any optional heal. If a
              # later follow-up commit is skipped, this is the exact HEAD we still push.
              python3 scripts/check_site_asset_refs.py site
              # A SAM evidence commit may have landed after this render began. Rebuild
              # from the just-rebased canonical generation before site-wide normalizers
              # can replay the checkout-time embedded bundle over that newer evidence.
              python -m scripts.build_government_revenue --site-only
              if ! git diff --quiet -- \
                data/government_revenue/latest.json \
                data/government_revenue/workspace.json \
                data/government_revenue/dossiers.json \
                data/government_revenue/subaward_dossiers.json \
                data/government_revenue/idv_dossiers.json \
                data/government_revenue/budget_program_graph.json; then
                echo "::error title=government-revenue projection drift::post-rebase canonical and rebuilt procurement bundles differ"
                exit 1
              fi
              # post-rebase template↔site re-sync (ui.template_site_sync): -X theirs can
              # resurrect this run's checkout-time template copies over a reword that merged
              # mid-render (2026-07-07: engine-render commit 2ae709f9f0 reverted #1793's
              # site-side de-escalation in sector_cycles.js this way). templates/ is now
              # fresh post-rebase main — re-copy and fold any delta into a follow-up commit.
              # re-stamp POST-rebase (ui.asset_stamp): the tree this loop PUSHES is not the
              # tree the normalizer step stamped. Pages a sibling lane lands mid-render arrive
              # here, un-stamped and unseen by that pass — 2026-07-26 render 6260e5ac8c0 shipped
              # site/us_track_record.html with a bare `theme.css` because standout-audit-us
              # committed it 14 min AFTER this run's checkout (from=83004e1e9b0). Idempotent and
              # ~11s over 3.2k pages; runs BEFORE the --fix below so the plain-copy pairs are
              # healed from an already-re-stamped templates/ rather than reverting to a stale one.
              python -m scripts.optimize_assets || echo "::warning::post-rebase asset optimize FAILED — ?v= stamps may be stale"
              python -m scripts.check_template_site_sync --fix || true
              # ms-board coherence guard (ui.ms_board_coherence): -X theirs resolves whole
              # conflict REGIONS toward this run's replayed render, so racing a mid-render
              # engine-render can stitch a hybrid Market State board — 2026-07-07 commit
              # 5bf116a3b3 baked upstream's score 56/"Mixed" beside this run's stale
              # "Risk Radar forces Risk-off." note, a pair market_state_snapshot can never
              # emit. Restore any incoherent page WHOLESALE from post-rebase origin/main
              # (coherent, at most one render old; the next render re-lands freshness).
              python3 scripts/check_ms_board_coherence.py --heal-from origin/main \
                || echo "::warning::ms-board coherence heal incomplete (incoherent board may predate this run)"
              # refuse stash/rebase wreckage (2026-08-01 d29e4dd44d: a conflicted
              # autostash apply was staged wholesale — 1,704 pages shipped markers)
              bash "${GITHUB_WORKSPACE:-.}/scripts/ci/strip_conflict_markers.sh"
              python3 scripts/check_conflict_markers.py --file site/start.html
              python3 scripts/check_start_runtime.py --heal-from origin/main
              # A rebase can combine this run's stale page with main's newer deletion of
              # its content-addressed asset. Recheck the actual post-rebase tree before
              # creating a heal commit or pushing it to the live branch.
              python3 scripts/check_site_asset_refs.py site
              python -m scripts.check_government_revenue_projection
              if ! git diff --quiet -- site/ templates/; then
                # push_staged_clean: never bake conflict markers into the follow-up
                # commit (P0 d29e4dd44d/#4167). On a dirty scan: unstage and push the
                # guarded render commit alone — same forfeit as a failed render-sync.
                git add site/
                git add templates/ 2>/dev/null || true
                if push_staged_clean site/ templates/; then
                  commit_index "render-sync: post-rebase guards (re-stamp + template re-copy + ms-board coherence)" \
                    || echo "::warning::render-sync commit failed (non-fatal — pages publish gate backstops divergence)"
                else
                  git reset -q -- site/ templates/ || true
                  # restore offenders' worktree bytes too (word-split safe:
                  # no tracked path contains whitespace)
                  for f in $PUSH_STAGED_OFFENDERS; do git checkout HEAD -- "$f" 2>/dev/null || true; done
                  echo "::warning title=render-sync skipped::post-rebase site/templates scanned dirty (conflict markers) — follow-up commit skipped; pushing the guarded render commit only"
                fi
              fi
              if ! git diff --quiet HEAD -- \
                site/government_revenue.html \
                site/government-revenue-data/latest.json \
                site/government-revenue-data/workspace.json \
                site/government-revenue-data/dossiers.json \
                site/government-revenue-data/subaward-dossiers.json \
                site/government-revenue-data/idv-dossiers.json \
                site/government-revenue-data/budget-program.json; then
                echo "::error title=government-revenue projection uncommitted::refusing to push a HEAD older than the validated procurement projection"
                exit 1
              fi
              python -m scripts.check_government_revenue_projection
              if push_do; then echo "pushed rendered site on attempt $PUSH_ATTEMPT"; push_won; exit 0; fi
            fi
            push_abort_rebase
            push_backoff
          done
          push_lost
          echo "::error title=rendered site NOT pushed::$PUSH_ATTEMPT rebase/push attempts failed ($PUSH_STOP) — main does not carry this render (the next render or the nightly re-lands it). Check the per-attempt [class] tags above: repeated [contention] means main is simply busier than this budget, repeated [rebase-conflict] means a NEW deterministic conflict class — see scripts/rebase_autoresolve_hashed_css.sh."
          echo "### ⚠️ rendered site NOT pushed after $PUSH_ATTEMPT attempts (next render/nightly re-lands main)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: remove oversized-checkout quarantine
        if: ${{ always() }}
        shell: bash
        run: |
          [ -n "${CHECKOUT_TRASH:-}" ] || exit 0
          case "$CHECKOUT_TRASH" in
            "${RUNNER_TEMP:?}"/macro-git-"${GITHUB_RUN_ID:?}"-"${GITHUB_RUN_ATTEMPT:?}") ;;
            *) echo "::error::refusing unexpected checkout quarantine path: $CHECKOUT_TRASH"; exit 1 ;;
          esac
          rm -rf -- "$CHECKOUT_TRASH"
