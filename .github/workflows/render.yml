name: render
# FAST site re-render + deploy from ALREADY-COMMITTED data — the express lane for
# shipping a template / CSS / JS bug fix WITHOUT waiting on the nightly `daily`
# pipeline's data collection (up to ~100m), its LLM "brain" layers (~20m), or the
# special-situations EDGAR sweep (~28m). Recent dailies ran 1h12m–2h31m; a scope=all
# render is ~40–85m (Mac quiet-box 40–71m measured 07-11; pc-render-1 ~81m measured
# 07-18) — a narrowed single-region scope (see the scope picker) is minutes.
#
# How it stays fast AND correct: every page builder reads COMMITTED engine output
# (regime/latest.json, each desk's latest.json, the brains' committed *.json) and
# re-renders its template — build_site itself "never refetches and never recomputes
# the classifier", so the rendered site is a pure function of data already on main.
# This workflow therefore DELIBERATELY does NOT run, in render mode:
#   • the collectors (scripts.collect)            — the API data pull
#   • engine.run                                  — preserves the COMMITTED regime +
#                                                   catalyst digest exactly as deployed
#   • the master / ai_desk / narrative / altdata LLM brains and their thesis
#     ledgers + scorers                           — those APPEND to forward-accountability
#                                                   ledgers; only the nightly may advance them
#   • build_special_situations' EDGAR/newswire sweep — the slow fetch stays nightly;
#     the desk PAGE is still rebaked here via --no-refresh (scope `sits`), so a
#     template fix ships in minutes. An unchanged desk rebakes byte-identically.
#   • factor_series / stock_briefs                — their own isolated daily jobs
#   • notify / archive_signals                    — side-effects that belong to the nightly
# and it carries NO API/LLM secrets, so nothing reaches the network — pages render
# straight from the committed snapshots on disk.
#
# It commits ONLY site/ (never data/ or reports/), so the nightly `daily` pipeline
# stays the single source of truth for every data ledger. daily.yml is untouched.
#
# Note: static assets directly under site/ (e.g. live.js, *.css) already deploy in
# ~1 min via pages.yml on any push to site/** — you only need THIS workflow for
# template (.html.j2) fixes that must be re-rendered through a builder.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which pages to rebuild from committed data (all = every page)"
        type: choice
        default: all
        options: [all, macro, intl, china, hk, canada, markets, gex, baskets, sits]
      runner:
        description: "Runner label — render-heavy is reserved; macstudio/render-linux are manual fallbacks"
        type: choice
        default: render-heavy
        options: [render-heavy, render-linux, macstudio]
  push:
    branches: [main]
    # A HUMAN pushing a template or builder change auto-renders + deploys. The
    # nightly bot only ever touches data/ + site/ + reports/, so its commits never
    # match these paths — no loop, no double-fire. (The site/ commit this workflow
    # makes triggers pages.yml's committed-tree deploy once more; idempotent.)
    #
    # The POST-RENDER SWEEPS are listed too. They rewrite every page in site/ (shim
    # injection, inline-CSS externalization, ?v= stamping, CSS preload hints), so a
    # change to one of them alters all 3154 pages — yet none of them live under
    # templates/ or match scripts/build_*.py, so a sweep change used to reach main
    # and trigger NOTHING. #3558 shipped exactly that and had to wait for an
    # unrelated engine-render to carry it. Still disjoint from engine-render.yml's
    # engine/** , so the two lanes never double-fire on one commit. These files
    # change rarely, so this adds no meaningful render load.
    paths:
      - "templates/**"
      # Public/marketing surfaces have a dedicated GitHub-hosted fast lane. These
      # exclusions are ordered after templates/** so they do not occupy the scarce
      # self-hosted market renderer merely to copy an asset, re-stamp URLs, or render
      # the three data-free public pages.
      - "!templates/*.html"
      - "!templates/*.css"
      - "!templates/*.js"
      - "!templates/*.json"
      - "!templates/*.txt"
      - "!templates/*.svg"
      - "!templates/_public_chrome_css.html.j2"
      - "!templates/_public_chrome_js.html.j2"
      - "!templates/_public_footer.html.j2"
      - "!templates/_public_nav.html.j2"
      - "!templates/plans.html.j2"
      - "!templates/seo_base.html.j2"
      - "!templates/support.html.j2"
      - "!templates/unsubscribe.html.j2"
      # Explicit builder ownership. This lane executes these entrypoints directly
      # or imports them transitively; every other top-level build_*.py belongs to a
      # different lane and must not occupy pipeline-render. The ownership contract
      # is executable in tests/test_render_builder_ownership.py.
      - "scripts/build_ai_adjacency_tag.py"
      - "scripts/build_ai_desk_page.py"
      - "scripts/build_aibrief.py"
      - "scripts/build_allocation.py"
