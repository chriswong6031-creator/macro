name: factor-ops
# Factor Intelligence Program P2 — operational dispatch workflow.
#
# Actions:
#   backfill      — deep panel backfill (2020-01-01 forward, ~25 min, runner-local)
#   register_h123 — register H1/H2/H3 in metabolism (W27 budget batch)
#   register_h45  — register H4/H5 in metabolism (W28+ budget batch)
#   replay        — run replay_standout_pipeline.py over available history (P3-ready)
#
# OPERATIONAL FACTS (per masterplan §7-P2 context brief):
#   - Self-hosted runner FS is virtualized/isolated.  Panel data
#     (data/factordata/panel/) and metabolism registry
#     (data/neuralweb/machine_registry.jsonl) live on the RUNNER workspace.
#   - Panel is not committed (R2-rule; first build measures partitions to decide).
#   - machine_registry.jsonl and governance.jsonl ARE git-tracked (see REGISTRY
#     TRACKING FINDING note below).
#   - BUDGET_PER_WEEK=3: register_h123 and register_h45 must run in separate
#     ISO weeks.
#
# REGISTRY TRACKING FINDING (P2 investigation):
#   daily.yml lines 1278-1279 explicitly git-add machine_registry.jsonl and
#   governance.jsonl after every cortex run:
#     git add data/neuralweb/machine_registry.jsonl
#     git add data/neuralweb/governance.jsonl
#   The broad "git add data/ site/ reports/" at line 920 also sweeps
#   data/neuralweb/ on the ENGINE job.  Both files ARE tracked by design.
#   RECOMMENDATION: do NOT add .gitignore for machine_registry.jsonl.
#   Evidence: the module docstring (metabolism.py line 20-24) states
#   "machine_registry.jsonl and governance.jsonl are both git-tracked files"
#   and "Ledger-evidence tamper detection rests on git history."  Tracking is
#   intentional: git history is the tamper-detection substrate.
#   Factor Intelligence registrations filed by this workflow will be swept into
#   the next ENGINE job's git add data/ and committed automatically.  This is
#   DESIRABLE — it preserves the governance audit trail.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        type: choice
        options:
          - backfill
          - register_h123
          - register_h45
          - replay

permissions:
  contents: write

concurrency:
  group: factor-ops-${{ github.event.inputs.action }}
  cancel-in-progress: false

jobs:
  factor-ops:
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip

      - run: pip install -r requirements.txt

      # ── ACTION: backfill ──────────────────────────────────────────────────
      - name: factor panel deep backfill
        if: github.event.inputs.action == 'backfill'
        timeout-minutes: 90
        run: |
          echo "=== Factor Panel Deep Backfill ===" >&2
          echo "start: $(date -u)" >&2
          python -m scripts.build_factor_panel \
            --start 2020-01-01 \
            --backfill \
            2>&1 | tee /tmp/factor_panel_backfill.log; rc=${PIPESTATUS[0]}
          echo "=== Backfill exit code: $rc ===" >&2
          # Print partition size summary (fail-soft: always exit 0 on size check)
          echo "--- Partition sizes ---" >&2
          du -sh data/factordata/panel/*/panel.parquet 2>/dev/null \
            || echo "No panel partitions found (normal if backfill failed)" >&2
          # Print stream coverage summary from log
          echo "--- Stream coverage (from log) ---" >&2
          grep -E "coverage|partition|n_tickers|streams|alibi" /tmp/factor_panel_backfill.log \
            | tail -30 >&2 || true
          # Fail-soft: report but do not block on non-zero exit
          if [ "$rc" -ne 0 ]; then
            echo "::warning::factor panel backfill exited $rc — check /tmp/factor_panel_backfill.log"
          fi
          exit 0  # fail-soft per masterplan §7-P2 (data lives on runner; no commit gate needed)

      # ── ACTION: register_h123 ─────────────────────────────────────────────
      - name: register H1/H2/H3 — dry run first
        if: github.event.inputs.action == 'register_h123'
        run: |
          echo "=== H1/H2/H3 Registration — DRY RUN ===" >&2
          python -m scripts.register_factor_hypotheses --only h1,h2,h3 --dry-run

      - name: register H1/H2/H3 — real run
        if: github.event.inputs.action == 'register_h123'
        run: |
          echo "=== H1/H2/H3 Registration — REAL RUN ===" >&2
          python -m scripts.register_factor_hypotheses --only h1,h2,h3
          echo "--- Registry state after registration ---" >&2
          python -c "
          from engine.neuralweb.metabolism import _load_registry
          import json
          rows = _load_registry(None)
          factor_rows = [r for r in rows if 'factor_intelligence' in r.get('notes','') or 'H1:' in r.get('hypothesis','') or 'H2:' in r.get('hypothesis','') or 'H3:' in r.get('hypothesis','')]
          for r in factor_rows:
              print(json.dumps({'id': r.get('id'), 'status': r.get('status'), 'claim_shape': r.get('claim_shape'), 'hypothesis': r.get('hypothesis','')[:80]}, indent=2))
          " 2>&1 || echo "Could not print registry state" >&2

      - name: commit registry updates (H1/H2/H3)
        if: github.event.inputs.action == 'register_h123'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@mastermind-x.com"
          git add data/neuralweb/machine_registry.jsonl 2>/dev/null || true
          git add data/neuralweb/governance.jsonl 2>/dev/null || true
          git diff --cached --quiet && {
            echo "No registry changes to commit (idempotent run or files not tracked yet)"
            exit 0
          }
          git commit -m "factor-intel: register H1/H2/H3 in metabolism (P2, W27 budget batch)"
          # rebase-retry push (matches daily.yml pattern)
          for attempt in 1 2 3; do
            git push && break
            echo "push attempt $attempt failed, rebasing..."
            git fetch origin && git rebase origin/main && sleep 5
          done

      # ── ACTION: register_h45 ──────────────────────────────────────────────
      - name: register H4/H5 — dry run first
        if: github.event.inputs.action == 'register_h45'
        run: |
          echo "=== H4/H5 Registration — DRY RUN ===" >&2
          python -m scripts.register_factor_hypotheses --only h4,h5 --dry-run

      - name: register H4/H5 — real run
        if: github.event.inputs.action == 'register_h45'
        run: |
          echo "=== H4/H5 Registration — REAL RUN ===" >&2
          python -m scripts.register_factor_hypotheses --only h4,h5
          echo "--- Registry state after registration ---" >&2
          python -c "
          from engine.neuralweb.metabolism import _load_registry
          import json
          rows = _load_registry(None)
          factor_rows = [r for r in rows if 'H4:' in r.get('hypothesis','') or 'H5:' in r.get('hypothesis','')]
          for r in factor_rows:
              print(json.dumps({'id': r.get('id'), 'status': r.get('status'), 'claim_shape': r.get('claim_shape'), 'hypothesis': r.get('hypothesis','')[:80]}, indent=2))
          " 2>&1 || echo "Could not print registry state" >&2

      - name: commit registry updates (H4/H5)
        if: github.event.inputs.action == 'register_h45'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@mastermind-x.com"
          git add data/neuralweb/machine_registry.jsonl 2>/dev/null || true
          git add data/neuralweb/governance.jsonl 2>/dev/null || true
          git diff --cached --quiet && {
            echo "No registry changes to commit (idempotent run or files not tracked yet)"
            exit 0
          }
          git commit -m "factor-intel: register H4/H5 in metabolism (P2, W28+ budget batch)"
          for attempt in 1 2 3; do
            git push && break
            echo "push attempt $attempt failed, rebasing..."
            git fetch origin && git rebase origin/main && sleep 5
          done

      # ── ACTION: replay ────────────────────────────────────────────────────
      # OPTIONAL: replay generation via scripts/replay_standout_pipeline.py.
      # The replay pipeline's CLI is non-trivial (--start-year, --end-year,
      # --source, --max-universe, --skip-recall flags with inter-dependencies).
      # Specifically:
      #   - --source=massive requires the massive stock day store (Mac-local;
      #     may not be present on the runner after a fresh checkout).
      #   - --skip-recall requires a prior recall-passing run to be asserted;
      #     omitting it runs the exhaustive recall check (can take hours).
      #   - The default --start-year 2012 + full universe is multi-hour.
      # JUDGMENT CALL (P2, flagged for P3):
      #   Invoking the replay pipeline without knowing the runner's price store
      #   state could silently produce a partial or empty replay.  The invocation
      #   below uses --source yahoo (always available from git-cached parquets),
      #   --start-year 2020 (manageable horizon), and --skip-recall (post-warning).
      #   P3 should: (a) verify runner has massive store, (b) run with --source
      #   massive for the ERA-LAW-compliant replay, (c) not use --skip-recall on
      #   first run.  This action produces a PRELIMINARY yahoo-sourced replay only.
      - name: replay generation (preliminary — yahoo source, 2020+)
        if: github.event.inputs.action == 'replay'
        timeout-minutes: 90
        run: |
          echo "=== Replay Generation (P2 preliminary) ===" >&2
          echo "WARNING: using --source yahoo (not massive). ERA LAW requires massive." >&2
          echo "P3 should re-run with --source massive on a runner with the price store." >&2
          python -m scripts.replay_standout_pipeline \
            --start-year 2020 \
            --source yahoo \
            --skip-recall \
            2>&1 | tee /tmp/replay.log; rc=${PIPESTATUS[0]}
          echo "=== Replay exit code: $rc ===" >&2
          if [ "$rc" -ne 0 ]; then
            echo "::warning::replay exited $rc — see /tmp/replay.log"
          fi
          exit 0  # fail-soft: replay is P3-gated; partial output is informational
