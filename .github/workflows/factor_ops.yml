name: factor-ops
# Factor Intelligence Program P2 — operational dispatch workflow.
#
# Actions:
#   backfill — deep panel backfill (2020-01-01 forward, ~25 min, runner-local)
#
# REGISTER ACTIONS REMOVED (2026-07-06 persistence fix):
#   register_h123 / register_h45 wrote machine_registry.jsonl to THIS workflow's
#   checkout and relied on the next nightly's git add to commit it.  That relay
#   NEVER WORKED: every job starts from a fresh actions/checkout (git clean
#   -ffdx), so the rows were wiped before any commit step could see them — the
#   same cross-job visibility hole as the factor_attention firings bug (PR
#   #1583).  The W27 register_h123 and W28 register_h45 dispatch registrations
#   were both lost this way (verified 2026-07-06: machine_registry.jsonl has no
#   git history).  H1–H5 registration now runs as an idempotent, budget-deferred
#   step INSIDE the nightly cortex job (daily.yml), whose commit lane stages
#   machine_registry.jsonl + governance.jsonl + trial_ledger.jsonl.  See
#   research/factor_intelligence/NW_INTEGRATION_ADJUDICATION_BY_FABLE.md §E.
#
# OPERATIONAL FACTS (per masterplan §7-P2 context brief):
#   - Self-hosted runner FS is virtualized/isolated.  Panel data
#     (data/factordata/panel/) lives on the RUNNER workspace.
#   - Panel is not committed (R2-rule; first build measures partitions to decide).
#
# NIGHTLY-SOLE-ADVANCER LAW (FIX-1):
#   A dispatchable workflow MUST NOT push to main.  This workflow keeps
#   permissions: contents: read.  Anything that must persist to main belongs in
#   a nightly job whose commit lane stages it (see the register-actions note
#   above for what happens otherwise).
#
# REPLAY ACTION REMOVED (FIX-2):
#   The yahoo-sourced preliminary replay was removed because writing to the
#   canonical data/replay/ path with a non-massive (non-ERA-LAW-compliant)
#   source could be mistaken for the study substrate.  P3 owns replay
#   generation using the massive store on a runner with the full price history.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        type: choice
        options:
          - backfill

permissions:
  contents: read

concurrency:
  group: factor-ops-${{ github.event.inputs.action }}
  cancel-in-progress: false

jobs:
  factor-ops:
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip

      - run: pip install -r requirements.txt

      # ── ACTION: backfill ──────────────────────────────────────────────────
      - name: factor panel deep backfill
        if: github.event.inputs.action == 'backfill'
        timeout-minutes: 90
        run: |
          echo "=== Factor Panel Deep Backfill ===" >&2
          echo "start: $(date -u)" >&2
          python -m scripts.build_factor_panel \
            --start 2020-01-01 \
            --backfill \
            2>&1 | tee "$RUNNER_TEMP/factor_panel_backfill.log"; rc=${PIPESTATUS[0]}
          echo "=== Backfill exit code: $rc ===" >&2
          # Print partition size summary (fail-soft: always exit 0 on size check)
          echo "--- Partition sizes ---" >&2
          du -sh data/factordata/panel/*/panel.parquet 2>/dev/null \
            || echo "No panel partitions found (normal if backfill failed)" >&2
          # Print stream coverage summary from log
          echo "--- Stream coverage (from log) ---" >&2
          grep -E "coverage|partition|n_tickers|streams|alibi" "$RUNNER_TEMP/factor_panel_backfill.log" \
            | tail -30 >&2 || true
          # Fail-soft: report but do not block on non-zero exit
          if [ "$rc" -ne 0 ]; then
            echo "::warning::factor panel backfill exited $rc — check $RUNNER_TEMP/factor_panel_backfill.log"
          fi
          exit 0  # fail-soft per masterplan §7-P2 (data lives on runner; no commit gate needed)
