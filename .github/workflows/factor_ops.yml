name: factor-ops
# Factor Intelligence Program P2 — operational dispatch workflow.
#
# Actions:
#   backfill      — deep panel backfill (2020-01-01 forward, ~25 min, runner-local)
#   register_h123 — register H1/H2/H3 in metabolism (W27 budget batch)
#   register_h45  — register H4/H5 in metabolism (W28+ budget batch)
#
# OPERATIONAL FACTS (per masterplan §7-P2 context brief):
#   - Self-hosted runner FS is virtualized/isolated.  Panel data
#     (data/factordata/panel/) and metabolism registry
#     (data/neuralweb/machine_registry.jsonl) live on the RUNNER workspace.
#   - Panel is not committed (R2-rule; first build measures partitions to decide).
#   - machine_registry.jsonl and governance.jsonl are NOT yet tracked on the
#     runner workspace at dispatch time; they BECOME tracked when first written
#     and swept by daily.yml:1278's explicit git add on the next nightly ENGINE
#     job.  Do NOT add .gitignore for machine_registry.jsonl.
#
# NIGHTLY-SOLE-ADVANCER LAW (FIX-1):
#   A dispatchable workflow MUST NOT push to main.  Registrations written by
#   this workflow ride the next ENGINE job's explicit git add (daily.yml:1278):
#     git add data/neuralweb/machine_registry.jsonl
#     git add data/neuralweb/governance.jsonl
#   The broad "git add data/ site/ reports/" at line 920 also sweeps
#   data/neuralweb/ on the ENGINE job.  Both files are tracked by design;
#   git history is the tamper-detection substrate (metabolism.py line 20-24).
#   Factor Intelligence registrations committed via the nightly ENGINE job
#   preserve the governance audit trail without violating the sole-advancer law.
#
# REPLAY ACTION REMOVED (FIX-2):
#   The yahoo-sourced preliminary replay was removed because writing to the
#   canonical data/replay/ path with a non-massive (non-ERA-LAW-compliant)
#   source could be mistaken for the study substrate.  P3 owns replay
#   generation using the massive store on a runner with the full price history.
#
# BUDGET_PER_WEEK=3: register_h123 and register_h45 must run in separate
#   ISO weeks.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        type: choice
        options:
          - backfill
          - register_h123
          - register_h45

permissions:
  contents: read

concurrency:
  group: factor-ops-${{ github.event.inputs.action }}
  cancel-in-progress: false

jobs:
  factor-ops:
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip

      - run: pip install -r requirements.txt

      # ── ACTION: backfill ──────────────────────────────────────────────────
      - name: factor panel deep backfill
        if: github.event.inputs.action == 'backfill'
        timeout-minutes: 90
        run: |
          echo "=== Factor Panel Deep Backfill ===" >&2
          echo "start: $(date -u)" >&2
          python -m scripts.build_factor_panel \
            --start 2020-01-01 \
            --backfill \
            2>&1 | tee /tmp/factor_panel_backfill.log; rc=${PIPESTATUS[0]}
          echo "=== Backfill exit code: $rc ===" >&2
          # Print partition size summary (fail-soft: always exit 0 on size check)
          echo "--- Partition sizes ---" >&2
          du -sh data/factordata/panel/*/panel.parquet 2>/dev/null \
            || echo "No panel partitions found (normal if backfill failed)" >&2
          # Print stream coverage summary from log
          echo "--- Stream coverage (from log) ---" >&2
          grep -E "coverage|partition|n_tickers|streams|alibi" /tmp/factor_panel_backfill.log \
            | tail -30 >&2 || true
          # Fail-soft: report but do not block on non-zero exit
          if [ "$rc" -ne 0 ]; then
            echo "::warning::factor panel backfill exited $rc — check /tmp/factor_panel_backfill.log"
          fi
          exit 0  # fail-soft per masterplan §7-P2 (data lives on runner; no commit gate needed)

      # ── ACTION: register_h123 ─────────────────────────────────────────────
      - name: register H1/H2/H3 — dry run first
        if: github.event.inputs.action == 'register_h123'
        run: |
          echo "=== H1/H2/H3 Registration — DRY RUN ===" >&2
          python -m scripts.register_factor_hypotheses --only h1,h2,h3 --dry-run

      - name: register H1/H2/H3 — real run
        if: github.event.inputs.action == 'register_h123'
        run: |
          echo "=== H1/H2/H3 Registration — REAL RUN ===" >&2
          python -m scripts.register_factor_hypotheses --only h1,h2,h3
          echo "--- Registry state after registration ---" >&2
          python -c "
          from engine.neuralweb.metabolism import _load_registry
          import json
          rows = _load_registry(None)
          factor_rows = [r for r in rows if 'factor_intelligence' in r.get('notes','') or 'H1:' in r.get('hypothesis','') or 'H2:' in r.get('hypothesis','') or 'H3:' in r.get('hypothesis','')]
          for r in factor_rows:
              print(json.dumps({'id': r.get('id'), 'status': r.get('status'), 'claim_shape': r.get('claim_shape'), 'hypothesis': r.get('hypothesis','')[:80]}, indent=2))
          " 2>&1 || echo "Could not print registry state" >&2
          echo "=== Registrations are runner-local; nightly ENGINE job (daily.yml:1278) will git-add and commit them. ===" >&2

      # ── ACTION: register_h45 ──────────────────────────────────────────────
      - name: register H4/H5 — dry run first
        if: github.event.inputs.action == 'register_h45'
        run: |
          echo "=== H4/H5 Registration — DRY RUN ===" >&2
          python -m scripts.register_factor_hypotheses --only h4,h5 --dry-run

      - name: register H4/H5 — real run
        if: github.event.inputs.action == 'register_h45'
        run: |
          echo "=== H4/H5 Registration — REAL RUN ===" >&2
          python -m scripts.register_factor_hypotheses --only h4,h5
          echo "--- Registry state after registration ---" >&2
          python -c "
          from engine.neuralweb.metabolism import _load_registry
          import json
          rows = _load_registry(None)
          factor_rows = [r for r in rows if 'H4:' in r.get('hypothesis','') or 'H5:' in r.get('hypothesis','')]
          for r in factor_rows:
              print(json.dumps({'id': r.get('id'), 'status': r.get('status'), 'claim_shape': r.get('claim_shape'), 'hypothesis': r.get('hypothesis','')[:80]}, indent=2))
          " 2>&1 || echo "Could not print registry state" >&2
          echo "=== Registrations are runner-local; nightly ENGINE job (daily.yml:1278) will git-add and commit them. ===" >&2
