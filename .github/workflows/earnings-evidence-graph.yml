name: earnings-evidence-graph

# The index is Terminal's reader-visible commit marker.  This worker discovers
# only its advertised bodies.  R2's root marker is the append-only catalog of
# record; this cache only accelerates bounded full-history backfill batches.
on:
  schedule:
    # One serialized, receipt-verified batch per hour: this is a backfill
    # throttle, not a claim that any one bounded batch is complete.
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      max_bodies:
        description: "Maximum full-history index deltas fetched per run (1..500)"
        required: false
        default: "500"
        type: string
      promote:
        description: "Append this verified bounded batch to the public catalog"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: earnings-evidence-graph-publication
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            engine/earnings_narrative
            engine/earnings_transcript_intake.py
            scripts/build_earnings_evidence_graph.py
            scripts/refresh_earnings_evidence_graph.py
            scripts/publish_earnings_evidence_graph_r2.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `pyyaml` is NOT optional and is NOT an R2 dependency — it is an IMPORT
      # dependency of the very first line this lane executes.  The refresh script
      # imports `engine.earnings_narrative.contracts`, which runs the package
      # `engine/earnings_narrative/__init__.py`, which re-exports `.promotion`,
      # which does `import yaml` at module scope.  With `pyyaml` absent the lane
      # dies with `ModuleNotFoundError: No module named 'yaml'` BEFORE it fetches
      # a single transcript body.
      #
      # This shipped missing and stayed missing from 2026-08-02T09:30Z (last
      # green run 30741902772) to 2026-08-14 — twelve days, every hourly run red,
      # 1,631 transcript bodies dated >= 2026-07-30 left unprocessed, and
      # /stocks/earnings frozen at call date 2026-07-29.  The outage was invisible
      # because this is the ONLY lane that ingests: `earnings-story-packets` and
      # `earnings-public-wire` both stayed green downstream, faithfully projecting
      # and republishing a frozen evidence root once an hour.  Three green lanes
      # and 24 commits a day read exactly like a healthy wire.
      #
      # Every sibling earnings lane already installs it (`earnings-public-wire`:
      # boto3 jinja2 pyyaml requests; `earnings-story-packets`: boto3 pyyaml in
      # all three jobs).  This lane was the one that was missed.  Pinned by
      # tests/test_earnings_evidence_graph_deps.py.
      - name: install R2 client and the contracts import chain
        run: python -m pip install --quiet boto3 requests pyyaml

      - name: restore non-authoritative intake cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          # The public catalog is R2-only. Never cache output/, objects/, or
          # generations/: append-only CAS data can grow to tens of gigabytes.
          path: |
            ${{ runner.temp }}/earnings-evidence/intake-state.json
            ${{ runner.temp }}/earnings-evidence/bodies
          key: earnings-evidence-v2-${{ github.run_id }}
          restore-keys: |
            earnings-evidence-v2-

      - name: append a bounded full-history Terminal delta
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MAX_BODIES: ${{ inputs.max_bodies || '500' }}
          SHOULD_PROMOTE: ${{ github.event_name == 'schedule' || inputs.promote }}
        run: |
          set -euo pipefail
          ARGS=(
            --work-dir "$RUNNER_TEMP/earnings-evidence"
            --out-dir "$RUNNER_TEMP/earnings-evidence/output"
            --max-bodies "$MAX_BODIES"
          )
          if [ "${SHOULD_PROMOTE}" = "true" ]; then
            ARGS+=(--promote)
          fi
          set +e
          python -m scripts.refresh_earnings_evidence_graph "${ARGS[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::notice title=earnings-evidence::root manifest promotion lost a safe compare-and-swap race"
            exit 0
          fi
          exit "$rc"

      - name: save non-authoritative intake cache
        if: always() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/earnings-evidence/intake-state.json
            ${{ runner.temp }}/earnings-evidence/bodies
          key: earnings-evidence-v2-${{ github.run_id }}
