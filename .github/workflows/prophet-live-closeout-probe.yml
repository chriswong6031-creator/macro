name: prophet-live-closeout-probe

on:
  push:
    branches:
      - sol/prophet-live-closeout-20260827

permissions:
  contents: read

jobs:
  package-verified-output:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical reconciler and bounded evidence
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config.yml
            /scripts/**
            /engine/**
            /lib/**
            /collectors/**
            /data/prophet_live/forward.parquet
            /data/pit_replay/prophet_live_recovery/journal_2026-07-30_2026-08-25.txt.gz
            /data/pit_replay/prophet_live_recovery/_recovery_receipt.json
            /data/breadth/_closes_cache.parquet
            /data/breadth/constituents.parquet
            /data/smallcap_breadth/_closes_cache.parquet
            /data/smallcap_breadth/constituents.parquet
            /data/midcap_breadth/_closes_cache.parquet
            /data/midcap_breadth/constituents.parquet
            /data/russell_breadth/_closes_cache.parquet
            /data/russell_breadth/constituents.parquet
            /data/baskets/extras.parquet
            /data/stocks/*.parquet
            /data/yahoo/*.parquet

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical path dependencies
        run: pip install --quiet pandas pyarrow pyyaml boto3 requests jinja2 yfinance scipy scikit-learn

      - name: Package canonical reconciliation result
        env:
          SOURCE_HEAD: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          import re
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import pandas as pd
          from scripts import reconcile_prophet_live as RC

          ledger = Path('data/prophet_live/forward.parquet')
          before_bytes = ledger.read_bytes()
          before = pd.read_parquet(ledger)
          if len(before) != 598 or int(before.duplicated(RC.KEY).sum()) != 0:
              raise SystemExit('baseline ledger identity drifted')
          if int(before['next_close_fill'].isna().sum()) != 86:
              raise SystemExit('baseline open-fill cardinality drifted')

          open_pairs = RC.open_rows(ledger)
          want = {ticker for _day, ticker in open_pairs}
          closes, adjustment = RC.load_closes(want)
          missing = sorted(want - set(closes))
          if missing:
              raise SystemExit(f'missing canonical close series: {missing}')

          now = datetime.now(timezone.utc)
          pair_updates = RC.maturing_rows(
              ledger, closes=closes, now=now, close_adjustment=adjustment
          )
          updates = RC._expand_maturing(ledger, pair_updates)
          matured = RC.merge_ledger(ledger, updates)

          before_first = before.set_index(RC.KEY)[list(RC.FIRST_WINS)].sort_index()
          after_first = matured.set_index(RC.KEY)[list(RC.FIRST_WINS)].sort_index()
          changed = []
          for col in RC.FIRST_WINS:
              a, b = before_first[col], after_first[col]
              same = (a == b) | (a.isna() & b.isna())
              if not bool(same.all()):
                  changed.append(col)
          before_entered = before.set_index(RC.KEY)['entered'].sort_index()
          after_entered = matured.set_index(RC.KEY)['entered'].sort_index()
          entered_same = (before_entered == after_entered) | (before_entered.isna() & after_entered.isna())

          out = Path('/tmp/prophet-live-closeout')
          out.mkdir()
          generated = out / 'forward.parquet'
          matured.to_parquet(generated, index=False)

          journal = Path('data/pit_replay/prophet_live_recovery/journal_2026-07-30_2026-08-25.txt.gz')
          raw = gzip.open(journal, 'rt', encoding='utf-8', errors='replace').read()
          passes = []
          event_lines = 0
          for line in raw.splitlines():
              if 'prophet-live EVENT ' in line:
                  event_lines += 1
              if 'prophet-live pass=' not in line:
                  continue
              mts = re.search(r'prophet-live pass=(\S+)', line)
              mev = re.search(r'events=(\d+)', line)
              if not (mts and mev):
                  raise SystemExit('unparseable committed pass line')
              ts = datetime.fromisoformat(mts.group(1).replace('Z', '+00:00'))
              session = ts.astimezone(ZoneInfo('America/New_York')).date().isoformat()
              passes.append((session, int(mev.group(1))))
          pass_counts = Counter(s for s, _ in passes)
          event_counts = Counter()
          for session, count in passes:
              event_counts[session] += count

          receipt = {
              'schema': 'prophet_live.force_majeure_closeout/v1',
              'source_head': os.environ['SOURCE_HEAD'],
              'workflow_run_id': int(os.environ['RUN_ID']),
              'reconciliation_code': 'scripts/reconcile_prophet_live.py:maturing_rows+_expand_maturing+merge_ledger',
              'reconciled_at': now.isoformat(),
              'ledger_before_sha256': hashlib.sha256(before_bytes).hexdigest(),
              'ledger_after_sha256': hashlib.sha256(generated.read_bytes()).hexdigest(),
              'rows_before': int(len(before)),
              'rows_after': int(len(matured)),
              'duplicate_keys_after': int(matured.duplicated(RC.KEY).sum()),
              'open_fills_before': 86,
              'open_fills_after': int(matured['next_close_fill'].isna().sum()),
              'maturing_pair_updates': len(pair_updates),
              'maturing_row_updates': len(updates),
              'next_close_dates_for_2026_08_25': sorted({str(v) for v in matured.loc[matured['date'].astype(str).eq('2026-08-25'), 'next_close_date'].dropna()}),
              'first_wins_changed': changed,
              'entered_changed': not bool(entered_same.all()),
              'entered_null_rows_after': int(matured['entered'].isna().sum()),
              'journal_sha256': hashlib.sha256(journal.read_bytes()).hexdigest(),
              'journal_pass_lines': len(passes),
              'journal_event_lines': event_lines,
              'journal_declared_event_sum': sum(n for _s, n in passes),
              'journal_passes_by_et_session': dict(sorted(pass_counts.items())),
              'journal_declared_events_by_et_session': dict(sorted(event_counts.items())),
          }
          if receipt['rows_after'] != 598 or receipt['duplicate_keys_after'] != 0:
              raise SystemExit('post-maturation ledger identity failed')
          if receipt['open_fills_after'] != 0 or receipt['maturing_pair_updates'] != 38 or receipt['maturing_row_updates'] != 86:
              raise SystemExit('post-maturation fill proof failed')
          if receipt['next_close_dates_for_2026_08_25'] != ['2026-08-26']:
              raise SystemExit('next-close date failed')
          if receipt['first_wins_changed'] or receipt['entered_changed']:
              raise SystemExit('immutable evidence changed during maturation')
          if receipt['journal_pass_lines'] != 588 or receipt['journal_event_lines'] != 25958 or receipt['journal_declared_event_sum'] != 25958:
              raise SystemExit('committed recovery corpus counters drifted')

          (out / 'closeout_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload generated closeout
        uses: actions/upload-artifact@v4
        with:
          name: prophet-live-closeout-generated
          path: /tmp/prophet-live-closeout
          retention-days: 1
