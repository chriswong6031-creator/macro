name: prophet-live-closeout-probe

on:
  push:
    branches:
      - sol/prophet-live-closeout-20260827

permissions:
  contents: read

jobs:
  generate-records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/prophet_closeout_patch.py
            /scripts/prophet_live_journal_recovery.py
            /research/PROPHET_US_LIVE_FORCE_MAJEURE_2026_08_26_EVIDENCE.md
            /agentos/handoffs/WS-PROPHET-US-AVAILABILITY-2026-08-26-live-force-majeure.md

      - name: Generate corrected durable records
        run: python .github/prophet_closeout_patch.py

      - uses: actions/upload-artifact@v4
        with:
          name: prophet-live-final-records
          path: /tmp/final
          retention-days: 1
