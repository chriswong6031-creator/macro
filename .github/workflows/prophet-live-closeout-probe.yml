name: prophet-live-closeout-probe

on:
  push:
    branches:
      - sol/prophet-live-closeout-20260827

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config.yml
            /.github/prophet_closeout_patch.py
            /.github/prophet_closeout_finalize.py
            /.github/workflows/prophet-live-closeout-probe.yml
            /scripts/**
            /engine/**
            /lib/**
            /collectors/**
            /research/PROPHET_US_LIVE_FORCE_MAJEURE_2026_08_26_EVIDENCE.md
            /agentos/handoffs/WS-PROPHET-US-AVAILABILITY-2026-08-26-live-force-majeure.md
            /data/prophet_live/forward.parquet
            /data/pit_replay/prophet_live_recovery/**
            /data/breadth/_closes_cache.parquet
            /data/breadth/constituents.parquet
            /data/smallcap_breadth/_closes_cache.parquet
            /data/smallcap_breadth/constituents.parquet
            /data/midcap_breadth/_closes_cache.parquet
            /data/midcap_breadth/constituents.parquet
            /data/russell_breadth/_closes_cache.parquet
            /data/russell_breadth/constituents.parquet
            /data/baskets/extras.parquet
            /data/stocks/*.parquet
            /data/yahoo/*.parquet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical reconciler dependencies
        run: pip install --quiet pandas pyarrow pyyaml boto3 requests jinja2 yfinance scipy scikit-learn

      - name: Generate and verify final bounded payload
        run: python .github/prophet_closeout_finalize.py

      - name: Verify only the reviewed closeout surface will land
        run: |
          python -m py_compile scripts/prophet_live_journal_recovery.py
          git diff --check
          git status --short
          test "$(git status --short | wc -l | tr -d ' ')" = "5"
          git status --short | grep -F 'data/prophet_live/forward.parquet'
          git status --short | grep -F 'data/pit_replay/prophet_live_recovery/_closeout_receipt.json'
          git status --short | grep -F 'scripts/prophet_live_journal_recovery.py'
          git status --short | grep -F 'research/PROPHET_US_LIVE_FORCE_MAJEURE_2026_08_26_EVIDENCE.md'
          git status --short | grep -F 'agentos/handoffs/WS-PROPHET-US-AVAILABILITY-2026-08-26-live-force-majeure.md'

      - name: Commit exact closeout payload and remove temporary probe machinery
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'Sol Closeout Bot'
          git config user.email 'sol-closeout@invalid.local'
          git add data/prophet_live/forward.parquet
          git add data/pit_replay/prophet_live_recovery/_closeout_receipt.json
          git add scripts/prophet_live_journal_recovery.py
          git add research/PROPHET_US_LIVE_FORCE_MAJEURE_2026_08_26_EVIDENCE.md
          git add agentos/handoffs/WS-PROPHET-US-AVAILABILITY-2026-08-26-live-force-majeure.md
          git rm .github/prophet_closeout_patch.py .github/prophet_closeout_finalize.py .github/workflows/prophet-live-closeout-probe.yml
          git diff --cached --check
          git commit -m 'records(prophet-live): mature force-majeure evidence closeout'
          git push origin "HEAD:${BRANCH}"
