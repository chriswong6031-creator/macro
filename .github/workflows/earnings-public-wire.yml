name: earnings-public-wire

# Public, token-free projection of the receipt-bound earnings story catalog.
# The source-packet and Company Intelligence lanes move independently. Follow
# either successful promotion, then keep the :47 backstop so a missed
# workflow_run cannot leave the public archive waiting for a manual backfill.
on:
  push:
    branches: [main]
    paths:
      - "scripts/build_earnings_public_wire.py"
      - "scripts/publish_earnings_private_store.py"
      - "scripts/audit_earnings_wire_freshness.py"
      - "engine/earnings_narrative/**"
      - "app/earnings.py"
      - "templates/earnings_wire/**"
      - ".github/workflows/earnings-public-wire.yml"
  workflow_run:
    workflows: ["earnings-story-packets", "company-intelligence"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: earnings-public-wire
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # A fully verified build + private read-back takes about 13 minutes. Leave
    # room for one complete fresh-main regeneration after a ref-lock race, and
    # keep a seven-minute job-timeout reserve beyond the push-loop deadline.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deterministic wire dependencies
        run: python -m pip install --quiet boto3 jinja2 pyyaml requests

      - name: regenerate current wire from latest main and publish
        env:
          # Member continuations and exact context use the existing private
          # Research Vault bucket. These credentials never enter the public
          # static tree; the workflow fails before staging HTML if publication
          # or read-back verification cannot complete.
          R2_RESEARCH_ENDPOINT: ${{ secrets.R2_RESEARCH_ENDPOINT }}
          R2_RESEARCH_ACCESS_KEY_ID: ${{ secrets.R2_RESEARCH_ACCESS_KEY_ID }}
          R2_RESEARCH_SECRET_ACCESS_KEY: ${{ secrets.R2_RESEARCH_SECRET_ACCESS_KEY }}
          R2_RESEARCH_BUCKET: ${{ secrets.R2_RESEARCH_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          . "${GITHUB_WORKSPACE:-.}/scripts/ci/push_retry.sh"
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # Every attempt rebuilds and privately verifies the publication before
          # it can push. Two 13-minute generations fit in this 33-minute loop;
          # the second is a fresh-main regeneration after a ref race, never a
          # replay of stale generated output.
          PUSH_BUDGET_SECS=1980
          PUSH_MAX_ATTEMPTS=2
          push_retry_init "earnings public wire"
          if ! push_on_main_ok; then exit 0; fi
          while push_attempt; do
            # Generated pages cannot be safely replayed onto a newer render:
            # even a one-byte asset-stamp change can conflict across every
            # article, while a conflict-free template change can still make
            # the old render stale. Fetch the named ref, discard only this
            # ephemeral runner's prior attempt, and regenerate on the exact
            # main tree that will be the new commit's parent.
            if ! push_fetch_main_for_rebase; then
              push_backoff
              continue
            fi
            if ! git reset --hard origin/main; then
              PUSH_FAIL_CLASS="sync"
              push_backoff
              continue
            fi
            # A failed push can leave newly generated routes untracked after
            # the hard reset. This literal, lane-owned scope is the only clean
            # target; unrelated main files are never removed or staged.
            git clean -fd -- site/stocks/earnings
            WIRE_BASE=$(git rev-parse HEAD)

            PRIVATE_STAGE="$RUNNER_TEMP/earnings-wire-private-${PUSH_ATTEMPT}"
            python -m scripts.build_earnings_public_wire --private-out-dir "$PRIVATE_STAGE"
            python -m scripts.publish_earnings_private_store --source-dir "$PRIVATE_STAGE"

            # normalize the EXACT tree this step stages (P0 2026-08-04, 9a997e9da3f):
            # the same defect class as daily.yml's, reached by a different road —
            # daily SKIPPED its normalize chain on a timeout-cancel, this lane never
            # had one at all. Every publication since the launch (#4298) shipped ~25KB
            # of inline <style> per page with no assets/css/<hash>.css ref, and
            # site/stocks/earnings/ is in NO render lane's rebuild scope, so unlike the
            # nightly's 5,895 pages nothing ever re-baked these: 444 raw pages stood for
            # 527 commits. Run the chain here, immediately before staging, so the tree is
            # normalized by construction; all three passes are idempotent (~20s total).
            python -m scripts.inject_data_base || echo "data-base shim inject skipped (additive)"
            python -m scripts.externalize_css || echo "::warning title=externalize::pre-commit css externalize FAILED — earnings pages may ship un-externalized (9a997e9da3f)"
            python -m scripts.optimize_assets || echo "::warning title=stamp::asset optimize FAILED — ?v= stamps may be stale"

            # Git owns only the redacted public shells. Member continuations,
            # receipts, and context were promoted privately above and are never
            # added from RUNNER_TEMP or emitted anywhere under site/.
            git add site/stocks/earnings
            # ...and the content-hashed assets those shells now link. externalize_css
            # lifts each page's inline CSS into site/assets/css/<hash>.css and rewrites
            # the page to <link> it, so staging the page WITHOUT the asset ships a link
            # to a file that was never committed — a 404 stylesheet, strictly worse than
            # the inline block it replaced. Separate lines because a single `git add a b`
            # exits 128 when either pathspec matches nothing, and this runs under
            # `set -euo pipefail` (same reasoning as the render lanes' templates/ add).
            # --ignore-removal stages mints and updates but never a DELETION: the orphan
            # prune reasons only from pages it can SEE, and this lane has no post-rebase
            # normalize to re-mint an asset that a page landed mid-run still links.
            # Pruning stays owned by the full-tree render lanes, which can re-mint.
            git add --ignore-removal site/assets/css 2>/dev/null || true
            git add --ignore-removal site/assets/js 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "earnings-public-wire: latest main already carries the current publication"
              exit 0
            fi
            # containment: the redacted earnings estate, plus exactly the content-hashed
            # assets its own pages link (see the staging note above). Nothing else — no
            # data/, no templates/, no other site page — may ride out on this lane.
            if git diff --cached --name-only | grep -Ev '^site/(stocks/earnings|assets/(css|js))/' >/dev/null; then
              echo "::error title=earnings-public-wire containment::refusing to commit outside the redacted earnings public estate"
              exit 1
            fi
            # scan every path the staging above can reach — a conflict-marker gate
            # scoped narrower than the staging scope is a gate with a hole in it.
            if ! push_staged_clean site/stocks/earnings site/assets/css site/assets/js; then
              echo "::error title=earnings-public-wire conflict markers::refusing to commit an unsafe publication"
              exit 1
            fi
            git commit -m "earnings-wire: publish current verified records [skip ci]"
            if [ "$(git rev-parse HEAD^)" != "$WIRE_BASE" ]; then
              echo "::error title=earnings-public-wire parent drift::generated commit is not based on the fetched main snapshot"
              exit 1
            fi
            if push_do origin HEAD:main; then
              echo "earnings-public-wire: pushed regenerated publication on attempt ${PUSH_ATTEMPT}"
              push_won
              exit 0
            fi
            # A ref race is retried by resetting to the winner and running the
            # builder again. Never rebase/replay the stale generated commit.
            push_backoff
          done
          push_lost
          echo "::error title=earnings-public-wire::could not publish after ${PUSH_ATTEMPT} attempts"
          exit 1

      # DEAD-MAN'S SWITCH (2026-08-14). Everything above can succeed while the
      # archive is dead. This lane is DOWNSTREAM of the only ingest lane
      # (earnings-evidence-graph), so when that lane dies this one keeps
      # regenerating and republishing a frozen evidence root once an hour, exits 0,
      # and commits a `verified_at` bump that reads as a healthy cadence. That is
      # exactly what happened from 2026-08-02 to 2026-08-14: twelve days, ~24
      # green commits a day, 1,631 unprocessed transcript bodies, and no alarm.
      #
      # Runs LAST and with `always()` so publication is never gated on the audit —
      # publishing correct-but-stale bytes is still better than not publishing —
      # but the job then goes RED once the archive is >=7 days behind upstream.
      # A red hourly lane is the signal that was missing; an ::error annotation on
      # a green job is not, because a green job is what nobody looks at.
      - name: earnings archive staleness tripwire
        if: always()
        run: python -m scripts.audit_earnings_wire_freshness --strict
