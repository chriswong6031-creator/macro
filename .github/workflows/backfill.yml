name: backfill
on:
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated adapter keys (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: fetch archived OAS history (idempotent)
        run: python -m scripts.fetch_archive
      - name: full-history collection
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python -m scripts.collect --full-history --only "${{ github.event.inputs.only }}"
          else
            python -m scripts.collect --full-history
          fi
      - name: commit
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: backfill $(date -u +%F)"
          git pull --rebase origin main
          git push
