name: E3-B production proof spike

on:
  push:
    branches:
      - sol/e3b-production-proof-20260826

permissions:
  contents: read

jobs:
  proof:
    name: Read-only E3-B production proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live public surfaces
        id: fetch
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p proof
          UA='Mozilla/5.0 E3BProductionProof/1.0'

          fetch_surface() {
            local name="$1"
            local url="$2"
            local status
            status=$(curl -sS -L --retry 2 --retry-all-errors --connect-timeout 10 --max-time 45 \
              -A "$UA" -D "proof/${name}.headers" -o "proof/${name}.json" -w '%{http_code}' "$url")
            printf '%s\n' "$status" > "proof/${name}.status"
            printf '%s %s\n' "$name" "$status"
          }

          fetch_surface r2_aapl 'https://pub-f7ffb4441c5f4ad983ca56ec7c651c61.r2.dev/company_intelligence/event_workspaces/generations/5517b178afbab673bc8c7c5f/workspaces/evt_cik0000320193_2026q3_results.json'
          fetch_surface public_aapl 'https://mastermind-x.com/api/event-workspace/AAPL'
          fetch_surface public_lmnd 'https://mastermind-x.com/api/event-workspace/LMND'
          fetch_surface tx_index 'https://app.mastermind-x.com/data/tx/index.json'

      - name: Validate live machine contract
        id: machine
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path
          from typing import Any

          PROOF = Path('proof')
          PROOF.mkdir(exist_ok=True)
          EXPECTED_EVENT = 'evt_cik0000320193_2026q3_results'
          EXPECTED_GENERATION = '5517b178afbab673bc8c7c5f'
          EXPECTED_SHA = 'a8ff5d03e875fef5604791edbf625186c447af049e6e02f55bb89c68c7cc9f9f'
          EXPECTED_DOC = 'tx:AAPL/2026Q3'

          errors: list[str] = []

          def fail(message: str) -> None:
              errors.append(message)

          def status(name: str) -> int:
              try:
                  return int((PROOF / f'{name}.status').read_text().strip())
              except Exception:
                  return 0

          def load_json(name: str) -> Any:
              try:
                  return json.loads((PROOF / f'{name}.json').read_text())
              except Exception as exc:
                  fail(f'{name}: invalid or missing JSON: {exc}')
                  return None

          def walk(value: Any):
              yield value
              if isinstance(value, dict):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          def find_dict(root: Any, **wanted: Any) -> dict[str, Any] | None:
              for node in walk(root):
                  if isinstance(node, dict) and all(node.get(k) == v for k, v in wanted.items()):
                      return node
              return None

          summary: dict[str, Any] = {
              'schema': 'e3b.production_proof.v1',
              'generation_id': EXPECTED_GENERATION,
              'expected_transcript_sha256': EXPECTED_SHA,
              'statuses': {name: status(name) for name in ('r2_aapl', 'public_aapl', 'public_lmnd', 'tx_index')},
          }

          if status('r2_aapl') != 200:
              fail(f'R2 immutable AAPL object HTTP {status("r2_aapl")}, expected 200')
          if status('public_aapl') != 200:
              fail(f'public AAPL API HTTP {status("public_aapl")}, expected 200')
          if status('public_lmnd') != 404:
              fail(f'public LMND API HTTP {status("public_lmnd")}, expected 404')
          if status('tx_index') != 200:
              fail(f'Terminal transcript index HTTP {status("tx_index")}, expected 200')

          workspace = load_json('r2_aapl')
          public_aapl = load_json('public_aapl')
          public_lmnd = load_json('public_lmnd')
          tx_index = load_json('tx_index')

          if isinstance(workspace, dict):
              if workspace.get('schema') != 'event_workspace.v1':
                  fail(f'workspace schema={workspace.get("schema")!r}')
              if workspace.get('event_id') != EXPECTED_EVENT:
                  fail(f'workspace event_id={workspace.get("event_id")!r}')
              if workspace.get('generation_id') != EXPECTED_GENERATION:
                  fail(f'workspace generation_id={workspace.get("generation_id")!r}')
              if workspace.get('authority') != 'context_only':
                  fail(f'workspace authority={workspace.get("authority")!r}')
              expected_flags = {'may_rank': False, 'may_size': False, 'may_gate': False, 'prophet_authority': False}
              if workspace.get('prophet_flags') != expected_flags:
                  fail(f'workspace prophet_flags={workspace.get("prophet_flags")!r}')

              sources = workspace.get('sources') if isinstance(workspace.get('sources'), list) else []
              transcript = next((s for s in sources if isinstance(s, dict) and s.get('kind') == 'transcript'), None)
              transcript_sha = transcript.get('source_sha256') if isinstance(transcript, dict) else None
              transcript_doc = transcript.get('document_id') if isinstance(transcript, dict) else None
              summary['transcript_sha256'] = transcript_sha
              summary['transcript_document_id'] = transcript_doc
              if transcript_sha != EXPECTED_SHA:
                  fail(f'AAPL_TRANSCRIPT_REVISION_DIVERGED: {transcript_sha!r} != {EXPECTED_SHA}')
              if transcript_doc != EXPECTED_DOC:
                  fail(f'transcript document_id={transcript_doc!r}')

              qas = workspace.get('qa_exchanges')
              if not isinstance(qas, list):
                  fail('qa_exchanges is not a list')
                  qas = []
              summary['qa_exchange_count'] = len(qas)
              summary['answer_turn_count'] = sum(len(q.get('respondents') or []) for q in qas if isinstance(q, dict))
              summary['replay_span_count'] = sum(
                  len(q.get('question_spans') or []) + len(q.get('answer_spans') or [])
                  for q in qas if isinstance(q, dict)
              )
              summary['questioners'] = []
              summary['respondents'] = []

              if len(qas) != 7:
                  fail(f'qa_exchanges length={len(qas)}, expected 7')
              if summary['answer_turn_count'] != 26:
                  fail(f'answer turns={summary["answer_turn_count"]}, expected 26')
              if summary['replay_span_count'] != 68:
                  fail(f'replay spans={summary["replay_span_count"]}, expected 68')

              gold_path = Path('research/earnings_intelligence/e3/gold/aapl_fy2026_q3_qa_gold.json')
              gold = json.loads(gold_path.read_text()) if gold_path.exists() else None
              gold_exchanges = gold.get('exchanges') if isinstance(gold, dict) else None
              if not isinstance(gold_exchanges, list) or len(gold_exchanges) != 7:
                  fail('current repository gold does not contain seven exchanges')
                  gold_exchanges = []

              forbidden_keys = {'rank', 'gate', 'trade', 'prophet', 'evasiveness', 'sentiment', 'deflection', 'beat', 'miss', 'beat_miss', 'candidate_id'}
              for ordinal, q in enumerate(qas):
                  if not isinstance(q, dict):
                      fail(f'qa[{ordinal}] is not an object')
                      continue
                  if q.get('schema') != 'qa_exchange.v1':
                      fail(f'qa[{ordinal}] schema={q.get("schema")!r}')
                  if q.get('ordinal') != ordinal:
                      fail(f'qa[{ordinal}] ordinal={q.get("ordinal")!r}')
                  expected_id = f'qx_{EXPECTED_EVENT}_{EXPECTED_SHA[:12]}_{ordinal:02d}'
                  if q.get('exchange_id') != expected_id:
                      fail(f'qa[{ordinal}] exchange_id={q.get("exchange_id")!r}')
                  if q.get('event_id') != EXPECTED_EVENT or q.get('document_id') != EXPECTED_DOC or q.get('document_sha256') != EXPECTED_SHA:
                      fail(f'qa[{ordinal}] event/document/revision binding mismatch')
                  if q.get('topics') != ['unavailable']:
                      fail(f'qa[{ordinal}] topics={q.get("topics")!r}, expected unavailable-only')

                  questioner = q.get('questioner') if isinstance(q.get('questioner'), dict) else {}
                  summary['questioners'].append({'name': questioner.get('name'), 'affiliation': questioner.get('affiliation')})
                  if questioner.get('name_state') != 'source_supported':
                      fail(f'qa[{ordinal}] questioner name_state={questioner.get("name_state")!r}')
                  if questioner.get('affiliation_state') != 'source_supported':
                      fail(f'qa[{ordinal}] questioner affiliation_state={questioner.get("affiliation_state")!r}')

                  respondents = q.get('respondents') if isinstance(q.get('respondents'), list) else []
                  respondent_pairs = []
                  for r_index, respondent in enumerate(respondents):
                      if not isinstance(respondent, dict):
                          fail(f'qa[{ordinal}] respondent[{r_index}] is not an object')
                          continue
                      respondent_pairs.append({'name': respondent.get('name'), 'role': respondent.get('role')})
                      if respondent.get('identity_state') != 'source_supported':
                          fail(f'qa[{ordinal}] respondent[{r_index}] identity_state={respondent.get("identity_state")!r}')
                  summary['respondents'].append(respondent_pairs)

                  if ordinal < len(gold_exchanges):
                      gold_q = gold_exchanges[ordinal]
                      gold_questioner = gold_q.get('questioner') or {}
                      if (questioner.get('name'), questioner.get('affiliation')) != (gold_questioner.get('name'), gold_questioner.get('affiliation')):
                          fail(f'qa[{ordinal}] questioner identity differs from current adjudicated gold')
                      gold_pairs = [
                          {'name': row.get('name'), 'role': row.get('role')}
                          for row in (gold_q.get('respondents') or []) if isinstance(row, dict)
                      ]
                      if respondent_pairs != gold_pairs:
                          fail(f'qa[{ordinal}] respondent turn order differs from current adjudicated gold')

                  provenance = q.get('provenance') if isinstance(q.get('provenance'), dict) else {}
                  if provenance.get('provider') is not None or provenance.get('model') is not None or provenance.get('prompt_version') is not None:
                      fail(f'qa[{ordinal}] carries model/provider/prompt authority')
                  if provenance.get('validation_state') != 'accepted':
                      fail(f'qa[{ordinal}] validation_state={provenance.get("validation_state")!r}')
                  if provenance.get('source_available_at') is not None or provenance.get('clock_state') != 'unknown':
                      fail(f'qa[{ordinal}] source clock is not lawful unknown/null: {provenance.get("source_available_at")!r}/{provenance.get("clock_state")!r}')
                  validation = q.get('validation') if isinstance(q.get('validation'), dict) else {}
                  for key in ('replayed', 'unique_span', 'event_match', 'revision_match', 'rights_ok'):
                      if validation.get(key) is not True:
                          fail(f'qa[{ordinal}] validation.{key}={validation.get(key)!r}')

                  for node in walk(q):
                      if isinstance(node, dict):
                          bad = forbidden_keys.intersection({str(k).lower() for k in node})
                          if bad:
                              fail(f'qa[{ordinal}] forbidden keys present: {sorted(bad)}')

              for node in walk(workspace):
                  if isinstance(node, dict):
                      keys = {str(k).lower() for k in node}
                      if 'beat' in keys or 'miss' in keys or 'beat_miss' in keys:
                          fail('workspace contains forbidden beat/miss field')
          else:
              fail('R2 workspace body is not an object')

          if isinstance(public_aapl, dict):
              if public_aapl.get('schema') != 'event_workspace_public_glance.v1':
                  fail(f'public AAPL schema={public_aapl.get("schema")!r}')
              if public_aapl.get('plane') != 'event_workspace.v1':
                  fail(f'public AAPL plane={public_aapl.get("plane")!r}')
              if public_aapl.get('event_id') != EXPECTED_EVENT:
                  fail(f'public AAPL event_id={public_aapl.get("event_id")!r}')
              if public_aapl.get('authority') != 'context_only':
                  fail(f'public AAPL authority={public_aapl.get("authority")!r}')
              questions = find_dict(public_aapl, label='Analyst questions', state='7 exchanges')
              if questions is None:
                  fail('public AAPL does not expose Analyst questions: 7 exchanges')
              revenue = next((n for n in walk(public_aapl) if isinstance(n, dict) and n.get('label') == 'Revenue'), None)
              if not isinstance(revenue, dict) or '$109.4B' not in str(revenue.get('value')):
                  fail(f'public AAPL E2 Revenue regression: {revenue!r}')
              guidance = next((n for n in walk(public_aapl) if isinstance(n, dict) and n.get('label') == 'Q4 revenue growth'), None)
              if not isinstance(guidance, dict) or str(guidance.get('value')) != '9–11%':
                  fail(f'public AAPL E2 guidance regression: {guidance!r}')

              forbidden_public_key_fragments = ('sha256', 'hash', 'receipt', 'r2_url', 'score_overlay', 'beat_miss', 'prophet_authority', 'may_rank', 'may_size', 'may_gate')
              for node in walk(public_aapl):
                  if isinstance(node, dict):
                      for key in node:
                          low = str(key).lower()
                          if any(fragment in low for fragment in forbidden_public_key_fragments):
                              fail(f'public AAPL exposes forbidden key {key!r}')
              serialized = json.dumps(public_aapl, sort_keys=True).lower()
              if 'r2.dev' in serialized or '/event_workspaces/generations/' in serialized:
                  fail('public AAPL exposes R2/storage locator')
              summary['public_questions_state'] = questions.get('state') if questions else None
          else:
              fail('public AAPL body is not an object')

          if isinstance(public_lmnd, dict):
              code = next((n.get('code') for n in walk(public_lmnd) if isinstance(n, dict) and n.get('code') == 'event_workspace_not_covered'), None)
              ticker = next((n.get('ticker') for n in walk(public_lmnd) if isinstance(n, dict) and n.get('ticker') == 'LMND'), None)
              if code != 'event_workspace_not_covered' or ticker != 'LMND':
                  fail(f'LMND fallback contract mismatch: code={code!r} ticker={ticker!r}')
          else:
              fail('public LMND body is not an object')

          for name in ('public_aapl', 'public_lmnd'):
              try:
                  headers = (PROOF / f'{name}.headers').read_text().lower()
                  expected_cache = 'cache-control: public, max-age=60, stale-while-revalidate=240'
                  if expected_cache not in headers:
                      fail(f'{name} cache policy mismatch')
              except Exception as exc:
                  fail(f'{name} headers missing: {exc}')

          if isinstance(tx_index, dict):
              raw = json.dumps(tx_index, sort_keys=True)
              if 'AAPL' not in raw or '2026Q3' not in raw:
                  fail('Terminal transcript index does not expose AAPL/2026Q3')

          summary['errors'] = errors
          summary['machine_state'] = 'PASS' if not errors else 'FAIL'
          (PROOF / 'machine-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          if errors:
              raise SystemExit(1)
          PY

      - name: Install browser probe
        if: steps.machine.outcome == 'success'
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Probe live Terminal browser
        id: browser
        if: steps.machine.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          PROOF = Path('proof')
          machine = json.loads((PROOF / 'machine-summary.json').read_text())
          expected_questioners = machine.get('questioners') or []
          expected_respondents = machine.get('respondents') or []
          target = 'https://app.mastermind-x.com/analysis?symbol=AAPL&page=intelligence'
          cases = [
              ('1440en', 1440, 900, 'en', 'Results', 'ANALYST Q&A · 7 exchanges'),
              ('820en', 820, 900, 'en', 'Results', 'ANALYST Q&A · 7 exchanges'),
              ('390zh', 390, 844, 'zh', '业绩', '分析师问答 · 7 轮'),
          ]
          results = []
          global_errors = []

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              for name, width, height, lang, results_label, qa_heading in cases:
                  entry = {'case': name, 'width': width, 'height': height, 'lang': lang, 'target': target}
                  console_errors = []
                  page_errors = []
                  context = browser.new_context(viewport={'width': width, 'height': height})
                  context.add_init_script(f"localStorage.setItem('mm.lang', {lang!r}); document.documentElement?.setAttribute('data-lang', {lang!r});")
                  page = context.new_page()
                  page.on('console', lambda msg, sink=console_errors: sink.append(msg.text) if msg.type == 'error' else None)
                  page.on('pageerror', lambda exc, sink=page_errors: sink.append(str(exc)))
                  try:
                      response = page.goto(target, wait_until='domcontentloaded', timeout=45_000)
                      entry['http_status'] = response.status if response else None
                      try:
                          page.wait_for_load_state('networkidle', timeout=12_000)
                      except PlaywrightTimeoutError:
                          pass
                      entry['final_url'] = page.url
                      entry['title'] = page.title()
                      body_text = page.locator('body').inner_text(timeout=10_000)
                      entry['body_prefix'] = body_text[:1200]
                      entry['screenshot'] = f'{name}.png'
                      page.screenshot(path=str(PROOF / f'{name}.png'), full_page=True)

                      has_ci = page.locator('.ci-page').count() > 0
                      lower_url = page.url.lower()
                      auth_words = ('sign in', 'log in', 'login', 'authenticate')
                      auth_required = (not has_ci) and (
                          any(token in lower_url for token in ('/login', '/signin', '/auth'))
                          or any(token in body_text.lower() for token in auth_words)
                      )
                      entry['auth_required'] = auth_required
                      if auth_required:
                          entry['state'] = 'AUTH_REQUIRED'
                          global_errors.append(f'{name}: authenticated Terminal session unavailable on hosted runner')
                          results.append(entry)
                          context.close()
                          continue

                      page.locator('.ci-page').wait_for(state='visible', timeout=30_000)
                      tab = page.get_by_role('tab', name=results_label, exact=True)
                      tab.click(timeout=10_000)
                      qa = page.locator('[data-ci-results-region="analyst-qa"]')
                      qa.wait_for(state='visible', timeout=20_000)
                      header_text = qa.locator('.ci-qa-head').inner_text()
                      entry['qa_heading'] = header_text
                      if qa_heading not in header_text:
                          raise AssertionError(f'{name}: QA heading mismatch: {header_text!r}')

                      rows = qa.locator('.ci-qa-row')
                      row_count = rows.count()
                      entry['qa_row_count'] = row_count
                      if row_count != 7:
                          raise AssertionError(f'{name}: QA row count={row_count}')

                      rendered = []
                      for i in range(row_count):
                          row = rows.nth(i)
                          summary_text = row.locator('summary').inner_text().strip()
                          row.locator('summary').click()
                          question_text = row.locator('.ci-qa-question').inner_text().strip()
                          if 'operator' in question_text.lower() or 'go ahead and take our' in question_text.lower():
                              raise AssertionError(f'{name}: row {i} renders Operator intro as analyst question')
                          turns = [text.strip() for text in row.locator('.ci-qa-turn > span').all_inner_texts()]
                          expected_name = (expected_questioners[i] or {}).get('name') if i < len(expected_questioners) else None
                          if expected_name and expected_name not in summary_text:
                              raise AssertionError(f'{name}: row {i} missing questioner {expected_name!r}')
                          expected_turns = expected_respondents[i] if i < len(expected_respondents) else []
                          expected_labels = [f"{r.get('name')} · {r.get('role')}" if r.get('role') else str(r.get('name')) for r in expected_turns]
                          if turns != expected_labels:
                              raise AssertionError(f'{name}: row {i} respondent order {turns!r} != {expected_labels!r}')
                          rendered.append({'summary': summary_text, 'question': question_text[:400], 'turns': turns})
                      entry['rendered_exchanges'] = rendered

                      overflow = page.evaluate('() => ({viewport: document.documentElement.clientWidth, document: document.documentElement.scrollWidth})')
                      entry['overflow'] = overflow
                      if overflow['document'] > overflow['viewport'] + 1:
                          raise AssertionError(f'{name}: horizontal overflow {overflow}')

                      unavailable_chips = page.locator('.ci-qa [class*="chip"]:has-text("Unavailable"), .ci-qa [class*="tag"]:has-text("Unavailable")').count()
                      entry['fake_unavailable_chip_count'] = unavailable_chips
                      if unavailable_chips:
                          raise AssertionError(f'{name}: fake unavailable chips={unavailable_chips}')

                      first_jump = qa.locator('.ci-qa-open').first
                      if first_jump.count() != 1:
                          raise AssertionError(f'{name}: transcript jump control missing')
                      before_url = page.url
                      before_dialogs = page.get_by_role('dialog').count()
                      first_jump.click(timeout=10_000)
                      page.wait_for_timeout(1000)
                      after_dialogs = page.get_by_role('dialog').count()
                      transcript_surface = (
                          page.locator('[data-transcript-id], .tx-drawer, .transcript-drawer, .tx-overlay').count() > 0
                          or after_dialogs > before_dialogs
                          or page.url != before_url
                      )
                      entry['transcript_jump'] = {
                          'before_url': before_url,
                          'after_url': page.url,
                          'dialog_count_before': before_dialogs,
                          'dialog_count_after': after_dialogs,
                          'surface_observed': transcript_surface,
                      }
                      if not transcript_surface:
                          raise AssertionError(f'{name}: transcript jump produced no observable transcript surface')

                      entry['console_errors'] = console_errors
                      entry['page_errors'] = page_errors
                      if console_errors or page_errors:
                          raise AssertionError(f'{name}: browser errors console={console_errors!r} page={page_errors!r}')
                      entry['state'] = 'PASS'
                  except Exception as exc:
                      entry['state'] = entry.get('state') or 'FAIL'
                      entry['error'] = f'{type(exc).__name__}: {exc}'
                      entry['console_errors'] = console_errors
                      entry['page_errors'] = page_errors
                      global_errors.append(f'{name}: {entry["error"]}')
                      try:
                          if 'screenshot' not in entry:
                              entry['screenshot'] = f'{name}.png'
                              page.screenshot(path=str(PROOF / f'{name}.png'), full_page=True)
                      except Exception:
                          pass
                  results.append(entry)
                  context.close()
              browser.close()

          browser_summary = {
              'schema': 'e3b.browser_proof.v1',
              'target': target,
              'cases': results,
              'errors': global_errors,
              'browser_state': 'PASS' if not global_errors and all(r.get('state') == 'PASS' for r in results) else 'FAIL',
          }
          (PROOF / 'browser-summary.json').write_text(json.dumps(browser_summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(browser_summary, indent=2, sort_keys=True))
          if browser_summary['browser_state'] != 'PASS':
              raise SystemExit(1)
          PY

      - name: Upload proof packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e3b-production-proof-${{ github.run_id }}
          path: proof
          if-no-files-found: warn
          retention-days: 14

      - name: Final E3-B proof verdict
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          proof = Path('proof')
          machine = json.loads((proof / 'machine-summary.json').read_text()) if (proof / 'machine-summary.json').exists() else {'machine_state': 'MISSING', 'errors': ['machine summary missing']}
          browser = json.loads((proof / 'browser-summary.json').read_text()) if (proof / 'browser-summary.json').exists() else {'browser_state': 'MISSING', 'errors': ['browser summary missing']}
          verdict = {
              'schema': 'e3b.production_proof_verdict.v1',
              'machine_state': machine.get('machine_state'),
              'browser_state': browser.get('browser_state'),
              'machine_errors': machine.get('errors') or [],
              'browser_errors': browser.get('errors') or [],
          }
          if verdict['machine_state'] == 'PASS' and verdict['browser_state'] == 'PASS':
              verdict['verdict'] = 'FULL_PASS'
          elif verdict['machine_state'] == 'PASS' and any('authenticated Terminal session unavailable' in str(e) for e in verdict['browser_errors']):
              verdict['verdict'] = 'MACHINE_PASS_BROWSER_AUTH_BLOCKED'
          else:
              verdict['verdict'] = 'PRODUCTION_PROOF_FAILED'
          print(json.dumps(verdict, indent=2, sort_keys=True))
          (proof / 'verdict.json').write_text(json.dumps(verdict, indent=2, sort_keys=True) + '\n')
          if verdict['verdict'] != 'FULL_PASS':
              raise SystemExit(1)
          PY
