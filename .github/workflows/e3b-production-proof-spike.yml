name: E3-B production proof spike

on:
  push:
    branches:
      - sol/e3b-production-proof-20260826

permissions:
  contents: read

jobs:
  proof:
    name: Read-only E3-B Terminal proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch immutable AAPL workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          curl -sS -L --retry 2 --retry-all-errors --connect-timeout 10 --max-time 45 \
            -A 'Mozilla/5.0 E3BProductionProof/4.0' \
            -o proof/workspace.json \
            'https://pub-f7ffb4441c5f4ad983ca56ec7c651c61.r2.dev/company_intelligence/event_workspaces/generations/5517b178afbab673bc8c7c5f/workspaces/evt_cik0000320193_2026q3_results.json'
          python - <<'PY'
          import json
          from pathlib import Path
          w=json.loads(Path('proof/workspace.json').read_text())
          assert w['generation_id']=='5517b178afbab673bc8c7c5f'
          assert len(w['qa_exchanges'])==7
          print('immutable workspace prerequisite PASS')
          PY

      - name: Install browser probe
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Probe canonical Terminal deep-link
        shell: bash
        continue-on-error: true
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          P=Path('proof')
          workspace=json.loads((P/'workspace.json').read_text())
          qas=workspace['qa_exchanges']
          questioners=[q['questioner'] for q in qas]
          respondents=[q['respondents'] for q in qas]
          target='https://app.mastermind-x.com/terminal?symbol=AAPL&pane=intelligence'
          cases=[
              ('1440en',1440,900,'en','Results','ANALYST Q&A · 7 EXCHANGES'),
              ('820en',820,900,'en','Results','ANALYST Q&A · 7 EXCHANGES'),
              ('390zh',390,844,'zh','业绩','分析师问答 · 7 轮'),
          ]
          results=[]; blocking=[]
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              for name,w,h,lang,result_label,heading in cases:
                  ctx=browser.new_context(viewport={'width':w,'height':h})
                  ctx.add_init_script(f"localStorage.setItem('mm.lang',{lang!r});")
                  page=ctx.new_page(); console=[]; pageerrs=[]; bad=[]
                  page.on('console',lambda msg,s=console:s.append(msg.text) if msg.type=='error' else None)
                  page.on('pageerror',lambda exc,s=pageerrs:s.append(str(exc)))
                  def on_response(resp, sink=bad):
                      if resp.status >= 400:
                          sink.append({'status':resp.status,'url':resp.url,'resource_type':resp.request.resource_type})
                  page.on('response',on_response)
                  entry={'case':name,'width':w,'height':h,'lang':lang,'target':target}
                  ui_error=None
                  try:
                      resp=page.goto(target,wait_until='domcontentloaded',timeout=40_000)
                      entry['http_status']=resp.status if resp else None
                      try: page.wait_for_load_state('networkidle',timeout=10_000)
                      except PWTimeout: pass
                      entry['final_url']=page.url
                      page.locator('.ci-page').wait_for(state='visible',timeout=25_000)
                      page.get_by_role('tab',name=result_label,exact=True).click(timeout=10_000)
                      qa=page.locator('[data-ci-results-region="analyst-qa"]'); qa.wait_for(state='visible',timeout=20_000)
                      header=qa.locator('.ci-qa-head').inner_text(); entry['qa_heading']=header
                      if heading.casefold() not in header.casefold(): raise AssertionError(f'heading={header!r}')
                      rows=qa.locator('.ci-qa-row'); count=rows.count(); entry['qa_row_count']=count
                      if count!=7: raise AssertionError(f'qa_count={count}')
                      rendered=[]
                      for i in range(count):
                          row=rows.nth(i); summary=row.locator('summary').inner_text().strip(); row.locator('summary').click()
                          qtext=row.locator('.ci-qa-question').inner_text().strip()
                          if 'operator' in qtext.lower() or 'go ahead and take our' in qtext.lower(): raise AssertionError(f'row {i}: Operator intro rendered')
                          turns=[x.strip() for x in row.locator('.ci-qa-turn > span').all_inner_texts()]
                          expected_name=questioners[i]['name']
                          expected=[f"{r['name']} · {r['role']}" if r.get('role') else r['name'] for r in respondents[i]]
                          if expected_name not in summary: raise AssertionError(f'row {i}: missing questioner {expected_name}')
                          if turns!=expected: raise AssertionError(f'row {i}: respondent order {turns!r} != {expected!r}')
                          rendered.append({'summary':summary,'question_prefix':qtext[:220],'turns':turns})
                      entry['rendered_exchanges']=rendered
                      overflow=page.evaluate('() => ({viewport:document.documentElement.clientWidth,document:document.documentElement.scrollWidth})')
                      entry['overflow']=overflow
                      if overflow['document']>overflow['viewport']+1: raise AssertionError(f'horizontal overflow {overflow}')
                      if page.locator('.ci-qa .fin-tag:has-text("Unavailable"), .ci-qa .fin-tag:has-text("不可用")').count()>0: raise AssertionError('fake unavailable topic chip rendered')
                      jump=qa.locator('.ci-qa-open').first
                      if jump.count()!=1: raise AssertionError('transcript jump missing')
                      before=page.url; jump.click(timeout=10_000); page.wait_for_timeout(1200)
                      drawer=page.locator('.fin-tx-drawer')
                      entry['transcript_jump']={'before_url':before,'after_url':page.url,'drawer_count':drawer.count()}
                      if drawer.count()!=1 or page.url==before: raise AssertionError('transcript jump did not open drawer')
                      if drawer.locator('.fin-tx-error').count()>0: raise AssertionError('transcript drawer revision/fetch validation failed')
                      drawer.locator('.fin-tx-seg').first.wait_for(state='visible',timeout=15_000)
                      entry['ui_state']='PASS'
                  except Exception as exc:
                      ui_error=f'{type(exc).__name__}:{exc}'
                      entry['ui_state']='FAIL'; entry['ui_error']=ui_error
                  entry['console_errors']=console
                  entry['page_errors']=pageerrs
                  entry['bad_responses']=bad
                  if entry['ui_state']=='PASS' and not console and not pageerrs:
                      entry['state']='FULL_PASS'
                  elif entry['ui_state']=='PASS':
                      entry['state']='UI_PASS_WITH_GUEST_ERRORS'
                  else:
                      entry['state']='FAIL'
                  if entry['state']!='FULL_PASS': blocking.append({'case':name,'state':entry['state'],'ui_error':ui_error,'console_errors':console,'page_errors':pageerrs,'bad_responses':bad})
                  try: page.screenshot(path=str(P/f'{name}-terminal.png'),full_page=True)
                  except Exception: pass
                  results.append(entry); ctx.close()
              browser.close()
          all_ui=all(r.get('ui_state')=='PASS' for r in results)
          full=all(r.get('state')=='FULL_PASS' for r in results)
          out={'schema':'e3b.terminal_browser_diagnostic.v4','target':target,'ui_state':'PASS' if all_ui else 'FAIL','state':'FULL_PASS' if full else 'UI_PASS_GUEST_ERRORS' if all_ui else 'FAIL','cases':results,'blocking':blocking}
          (P/'browser-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload proof packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e3b-production-proof-${{ github.run_id }}
          path: proof
          retention-days: 14

      - name: Enforce browser acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('proof/browser-summary.json').read_text())
          if b.get('state')!='FULL_PASS': raise SystemExit(f"E3-B browser not fully accepted: {b.get('state')}")
          print('E3-B Terminal browser FULL_PASS')
          PY
