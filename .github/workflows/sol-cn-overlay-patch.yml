name: Sol CN stale-overlay one-shot patch

on:
  push:
    branches:
      - sol/cn-prophet-stale-deep-overlay-20260827

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(sol): apply CN stale-overlay patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/cn-prophet-stale-deep-overlay-20260827
          fetch-depth: 0
      - name: Apply bounded producer patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_china_library.py')
          src = path.read_text()
          start = src.index('def _overlay_deep_ohlc(')
          end = src.index('\n\ndef compute_china_alpha', start)
          replacement = '''def _overlay_deep_ohlc(out: list[tuple], group: str, min_rows: int = 300) -> int:
              """Upgrade names to the deep per-name OHLC store without regressing freshness.

              The deep store is enrichment authority for real high/low + longer history, not
              permission to move the settled close clock backward.  A name keeps its cache
              tuple whenever that cache has a later valid session than the deep store; equal
              or newer deep data may replace it.  This preserves the broad search panel's
              freshest truthful close while still gaining deep OHLC as soon as it catches up.
              """
              n = 0
              stale = 0
              for i, (t, _close, _high, name, sector) in enumerate(out):
                  df = store.read(group, t)
                  if df is None or "close" not in df.columns or len(df["close"].dropna()) < min_rows:
                      continue

                  deep_close = df["close"].dropna()
                  cache_close = _close.dropna() if _close is not None else pd.Series(dtype=float)
                  deep_last = deep_close.last_valid_index()
                  cache_last = cache_close.last_valid_index()
                  if cache_last is not None:
                      try:
                          deep_session = pd.Timestamp(deep_last).date() if deep_last is not None else None
                          cache_session = pd.Timestamp(cache_last).date()
                      except (TypeError, ValueError):
                          # If freshness cannot be compared, enrichment has not earned
                          # replacement authority. Preserve the known cache tuple.
                          stale += 1
                          continue
                      if deep_session is None or deep_session < cache_session:
                          stale += 1
                          continue

                  out[i] = (t, df["close"], df.get("high"), name, sector)
                  n += 1
              if stale:
                  log.warning(
                      "china library: kept fresher cache for %d stale/unverifiable deep OHLC overlay(s) (%s)",
                      stale, group,
                  )
              if n:
                  log.info("china library: upgraded %d names to the deep OHLC store (%s)", n, group)
              return n
          '''
          path.write_text(src[:start] + replacement + src[end:])
          PY

          # The same RED case was temporarily duplicated into an unowned test file while
          # locating the real CI carrier. Keep only the existing code-gated suite.
          git checkout origin/main -- tests/test_china_library_limited.py

          # This workflow is a one-shot edit carrier, not a durable repository plane.
          rm .github/workflows/sol-cn-overlay-patch.yml

          python -m py_compile scripts/build_china_library.py tests/test_cn_board_lane_gate.py
          git diff --check
          git status --short

          git config user.name 'Mastermind Sol'
          git config user.email 'team2@mastermind-x.com'
          git add scripts/build_china_library.py tests/test_china_library_limited.py .github/workflows/sol-cn-overlay-patch.yml
          git commit -m 'fix(cn): reject stale deep OHLC overlays'
          git push origin HEAD:sol/cn-prophet-stale-deep-overlay-20260827
