name: fences
# ALWAYS-ON metabolism cage fences behind one stable `fence-pack` aggregate.
#
# WHY A SEPARATE WORKFLOW: the same three guards also live in ci.yml, but ci.yml
# is `on: pull_request` with a large `paths:` filter — it does NOT run on a PR
# that touches only, say, site/ or engine/. A branch-protection rule that
# REQUIRES a path-gated check blocks every PR that does not trigger it (the
# required context never reports → "Expected — Waiting for status"). This
# workflow has NO paths filter, so the aggregate reports on EVERY PR and every
# push to main.
#
# One read-only runner executes the guards. A second checkout-free job publishes
# the stable `fence-pack` result from the first job's native conclusion. Candidate
# tests/templates therefore never share a runner or environment with the required
# aggregate, and no pull-request code receives check-writing authority.
on:
  pull_request:
    branches: [main, codex/merge-queue-pilot]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Only the newest commit on a PR (or newest descendant on main) needs to prove
  # these read-only fences.  This coalesces agent push bursts before they consume
  # hosted runner slots.
  group: fences-${{ github.event.pull_request.number || github.ref }}
  # cancel-in-progress became EVENT-CONDITIONAL 2026-08-09. On a PR it is still
  # `true` — a newer commit obsoletes the older fence result, and coalescing agent
  # push bursts is the whole reason this line exists. On MAIN and merge_group it
  # must be `false`: main can be pushed faster than a fence concludes, while GitHub
  # itself owns queue-ref obsolescence and needs one durable synthetic-head proof.
  #
  # THE MEASUREMENT. This workflow is one of the two main proofs that
  # merge_on_green.main_proof reads (MAIN_PROOF_WORKFLOWS, scripts/merge_on_green.py),
  # and it is the only one with a `push` trigger — so it is the proof that is
  # supposed to stay continuously fresh. But main receives wire/nightly pushes
  # every ~30-90 seconds, and every one of them landed in `fences-refs/heads/main`
  # and killed its predecessor: five runs between 11:40:38Z and 11:43:04Z on
  # 2026-08-09, each cancelling the one before. Over the sweeper's 10-run walk that
  # is not "a large minority superseded" (the 2 of 8 measured 2026-08-08) but ALL
  # TEN — the sweep at 11:44:42Z reported main's fences proof as "NO clean name …
  # (fences.yml's newest 10 completed run(s) on main were all cancelled)". A run
  # that takes longer than the gap between pushes can NEVER conclude. That is
  # structural, not load-dependent.
  #
  # With `false` the running fence finishes while the pending slot keeps coalescing
  # the burst (GitHub replaces the one PENDING run per group regardless of this
  # flag), so main gets a concluded fence proof every few minutes. Each one
  # refreshes the sweeper's resolver, which in steady state removes the need for
  # ci.yml baseline dispatches altogether. The cost is bounded and already handled:
  # the concluded run may be for a main SHA one or two pushes behind the tip, and
  # the sweeper's ancestry check accepts an older main SHA by design.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fence-evaluation:
    name: fence-evaluation
    # This read-only evaluation executes for forks too. The required aggregate is
    # a separate job below and consumes only this job's native conclusion.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository keeps generated site releases in Git. The fences
          # need the commit graph and current tree, not historical site blobs.
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # jinja2/markupsafe are for the chat-nav guard below, which RENDERS
      # _site_nav.html.j2 rather than grepping it. CI packs install minimal deps,
      # not requirements.txt — an unlisted import here is an ImportError, not a
      # skip, and the --selftest path additionally imports lib.pages (which pulls
      # lib.config → pyyaml).
      - name: install minimal deps
        run: pip install pytest pyyaml jinja2 markupsafe

      - name: self-mod-fence selftest (all four cases proven)
        id: self_mod_selftest
        run: python3 scripts/check_self_mod_fence.py --selftest
      - name: self-mod-fence live check (loop PR + immutable → BLOCKED)
        id: self_mod_live
        # Main pushes carry no review diff. Pull requests and native merge groups
        # do; the latter must prove the queued latest-main synthetic commit too.
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          SELF_MOD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          SELF_MOD_HEAD_REF: ${{ github.head_ref || github.event.merge_group.head_ref }}
        run: |
          BASE_SHA="$SELF_MOD_BASE_SHA"
          BRANCH="$SELF_MOD_HEAD_REF"
          TRAILERS=$(git log --format="%B" "$BASE_SHA"..HEAD 2>/dev/null || echo "")
          python3 scripts/check_self_mod_fence.py \
            --branch "$BRANCH" \
            --base-sha "$BASE_SHA" \
            --trailers "$TRAILERS"
      - name: capability-redline selftest (planted secret caught; clean real files pass)
        id: capability_selftest
        run: python3 scripts/check_capability_redline.py --selftest
      - name: capability-redline live scan (hard fail on secret values or value-capture)
        id: capability_live
        run: python3 scripts/check_capability_redline.py

      - name: grader-manifest selftest (drift detection + fail-closed proof)
        id: grader_selftest
        run: python3 scripts/check_grader_manifest.py --selftest
      - name: grader-manifest live check (hash drift is a hard failure)
        id: grader_live
        run: python3 scripts/check_grader_manifest.py

      # chat-nav drift: HERE because the ci-pack copy is too SLOW, not missing.
      # templates/chat.html cannot {% include %} the shared nav (plain-copy page,
      # byte-matched to site/chat.html), so its header is GENERATED from
      # _site_nav.html.j2 by scripts/sync_chat_nav.py. The same guard already runs
      # in ci-pack pack 0 — ci.yml's paths: filter has covered templates/** since
      # 2026-07-03 and names both nav partials explicitly. Coverage was never the
      # gap: ci-pack takes ~2h, so the red lands AFTER the merge. #4666's ci run
      # started 03:43:06Z and the PR merged 03:51:36Z, 8m30s later; #4637 merged
      # ~6 min before its pack-0 failed. Both times the drift reddened MAIN, not
      # the PR (three occurrences: #4637, #4666, #4721).
      #
      # This workflow is the always-on fast lane — no paths: filter, ~1-2 min —
      # and the guard is a pure static check (render a Jinja template, compare
      # strings, ~1s), so the red now arrives while the PR is still open. The
      # ci-pack copy stays as defence in depth; it costs nothing there.
      #
      # These feed the native job conclusion, which the isolated fence-pack job
      # below turns into the single ruleset context.
      - name: chat-nav selftest (gate fires on a hand-edited header; --fix keeps ?v=/defer)
        id: chat_nav_selftest
        run: python3 scripts/sync_chat_nav.py --selftest
      - name: chat.html's header must match _site_nav.html.j2
        id: chat_nav_live
        run: python3 scripts/sync_chat_nav.py

      # Candidate-owned pytest code runs last. Even if it writes runner command
      # files, no later security check or required aggregate shares this job.
      - name: self-mod-fence test suite
        id: self_mod_tests
        run: python -m pytest tests/test_self_mod_fence.py -q

  fence-pack:
    name: fence-pack
    if: always()
    needs: [fence-evaluation]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: require the isolated fence evaluation
        env:
          FENCE_EVALUATION: ${{ needs.fence-evaluation.result }}
        run: |
          set -euo pipefail
          if [ "$FENCE_EVALUATION" != success ]; then
            echo "::error::isolated fence evaluation ended $FENCE_EVALUATION"
            exit 1
          fi

  # Fork fallback: GitHub itself creates these named job check runs, so no
  # checks:write token is needed. Public contributors retain the historical
  # compatibility contexts while the stable aggregate remains fail closed.
  # behavior instead of being stuck on missing required contexts.
  fork-self-mod-fence:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'self-mod-fence' || 'fork-self-mod-fence-unused' }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python3 scripts/check_self_mod_fence.py --selftest
      - name: self-mod-fence live check (loop PR + immutable → BLOCKED)
        if: github.event_name == 'pull_request'
        env:
          SELF_MOD_HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin ${{ github.base_ref || 'main' }}
          BRANCH="$SELF_MOD_HEAD_REF"
          TRAILERS=$(git log --format="%B" origin/${{ github.base_ref || 'main' }}..HEAD 2>/dev/null || echo "")
          python3 scripts/check_self_mod_fence.py \
            --branch "$BRANCH" \
            --base-sha "origin/${{ github.base_ref || 'main' }}" \
            --trailers "$TRAILERS"
      - run: python -m pytest tests/test_self_mod_fence.py -q

  fork-capability-broker:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'capability-broker' || 'fork-capability-broker-unused' }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python3 scripts/check_capability_redline.py --selftest
      - run: python3 scripts/check_capability_redline.py

  fork-grader-manifest:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'grader-manifest' || 'fork-grader-manifest-unused' }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python3 scripts/check_grader_manifest.py --selftest
      - run: python3 scripts/check_grader_manifest.py
