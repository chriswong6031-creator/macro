name: E3-C source completeness census spike

on:
  push:
    branches:
      - sol/e3c-source-census-20260826

permissions:
  contents: read

jobs:
  census:
    name: Read-only E3-C source census
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run frozen source-completeness selection
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import gzip, hashlib, html, json, re, time
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          TX_BASE = 'https://app.mastermind-x.com/data/tx'
          SEC_SUB = 'https://data.sec.gov/submissions/CIK{cik:010d}.json'
          SEC_ARCH = 'https://www.sec.gov/Archives/edgar/data'
          UA = 'Mastermind E3-C source census admin@macro-dashboard.example.com'
          RIGHTS_PROFILE = 'rp_public_primary_v1'

          CANDIDATES = [
              {'ticker':'GOOGL','cik':1652044,'preferred_tx':'2026Q2','expected_event_id':'evt_cik0001652044_2026q2_results','siblings':['GOOGL','GOOG']},
              {'ticker':'CAT','cik':18230,'preferred_tx':'2026Q2','expected_event_id':'evt_cik0000018230_2026q2_results','siblings':['CAT']},
              {'ticker':'BAC','cik':70858,'preferred_tx':'2026Q2','expected_event_id':'evt_cik0000070858_2026q2_results','siblings':['BAC']},
              {'ticker':'SNOW','cik':1640147,'preferred_tx':'2027Q1','expected_event_id':'evt_cik0001640147_2027q1_results','siblings':['SNOW']},
          ]

          def http_bytes(url:str, accept:str='*/*', retries:int=3, timeout:int=35):
              last=None
              for attempt in range(retries):
                  req=Request(url,headers={'User-Agent':UA,'Accept':accept,'Cache-Control':'no-cache'})
                  try:
                      with urlopen(req,timeout=timeout) as r:
                          return int(r.status), r.read(), dict(r.headers.items())
                  except HTTPError as e:
                      if e.code in {429,500,502,503,504} and attempt<retries-1:
                          time.sleep(1.5*(attempt+1)); last=e; continue
                      try: body=e.read()
                      except Exception: body=b''
                      return int(e.code),body,dict(e.headers.items()) if e.headers else {}
                  except (URLError,TimeoutError,OSError) as e:
                      last=e
                      if attempt<retries-1:
                          time.sleep(1.5*(attempt+1)); continue
                      raise RuntimeError(f'network failure {url}: {e}') from e
              raise RuntimeError(f'network failure {url}: {last}')

          def load_json_url(url:str):
              status,body,headers=http_bytes(url,'application/json')
              if status!=200: raise RuntimeError(f'{url} HTTP {status}')
              return json.loads(body.decode('utf-8')),headers

          def at(block,key,i):
              v=block.get(key) or []
              return str(v[i] or '') if isinstance(v,list) and i<len(v) else ''

          def recent_rows(subs,cik10):
              filings=subs.get('filings') or {}; recent=filings.get('recent') or {}
              accs=recent.get('accessionNumber') or []
              rows=[]
              if not isinstance(accs,list): return rows
              for i,acc in enumerate(accs):
                  form=at(recent,'form',i).strip().upper(); items=at(recent,'items',i)
                  if form not in {'8-K','8-K/A'} or '2.02' not in items: continue
                  rows.append({'cik':cik10,'accession':str(acc),'form':form,'filing_date':at(recent,'filingDate',i),'acceptance_datetime':at(recent,'acceptanceDateTime',i),'report_date':at(recent,'reportDate',i),'primary_document':at(recent,'primaryDocument',i),'items':items})
              rows.sort(key=lambda r:(r['acceptance_datetime'],r['filing_date']),reverse=True)
              return rows

          def sgml_manifest(text):
              out=[]
              for block in html.unescape(text or '').split('<DOCUMENT>')[1:]:
                  kind=re.search(r'<TYPE>([^<\r\n]+)',block); name=re.search(r'<FILENAME>([^<\r\n]+)',block)
                  if kind and name: out.append((kind.group(1).strip().upper(),name.group(1).strip()))
              return out

          def select_ex99(manifest):
              textish=[(k,n) for k,n in manifest if n.lower().endswith(('.htm','.html','.txt'))]
              exact=[n for k,n in textish if k=='EX-99.1']
              if exact:return exact[0]
              pref=[n for k,n in textish if re.match(r'^EX-99\.1(?:\b|$)',k,re.I)]
              if pref:return pref[0]
              hinted=[n for _,n in textish if re.search(r'ex[-_]?99[-_.]?1',n,re.I)]
              return hinted[0] if hinted else None

          def acquire_sec(c):
              cik=int(c['cik']); cik10=f'{cik:010d}'
              subs,_=load_json_url(SEC_SUB.format(cik=cik))
              rows=recent_rows(subs,cik10)
              errors=[]
              for row in rows:
                  acc=row['accession']; base=f"{SEC_ARCH}/{cik}/{acc.replace('-','')}"
                  s,hdr,_=http_bytes(f'{base}/{acc}-index-headers.html','text/html')
                  if s!=200: errors.append(f'{acc}:index HTTP {s}'); continue
                  ex=select_ex99(sgml_manifest(hdr.decode('utf-8',errors='replace')))
                  if not ex: errors.append(f'{acc}:EX-99.1 absent'); continue
                  ex_url=f'{base}/{ex}'; es,eb,_=http_bytes(ex_url,'text/html,application/xhtml+xml,text/plain')
                  if es!=200 or not eb.strip(): errors.append(f'{acc}:EX-99.1 HTTP {es}'); continue
                  primary_url=f"{base}/{row['primary_document']}" if row['primary_document'] else None
                  filing_state='address_only'; filing_sha=None; filing_bytes=None
                  if primary_url:
                      ps,pb,_=http_bytes(primary_url,'text/html,application/xhtml+xml,text/plain')
                      if ps==200 and pb.strip():
                          filing_state='byte_replayed'; filing_sha=hashlib.sha256(pb).hexdigest(); filing_bytes=len(pb)
                  return {
                      'release':{'state':'byte_replayed','url':ex_url,'sha256':hashlib.sha256(eb).hexdigest(),'bytes':len(eb),'rights_profile':RIGHTS_PROFILE},
                      'filing':{'state':filing_state,'url':primary_url,'sha256':filing_sha,'bytes':filing_bytes,'cik':cik10,'accession':acc,'form':row['form'],'filing_date':row['filing_date'],'report_date':row['report_date'],'acceptance_datetime':row['acceptance_datetime'],'rights_profile':RIGHTS_PROFILE},
                      'errors':errors,
                  }
              return {'release':{'state':'typed_absence','reason':'no_current_results_exhibit'},'filing':{'state':'typed_absence','reason':'no_current_results_filing'},'errors':errors or ['no Item 2.02 8-K/A candidates']}

          def canonical_body_sha(payload):
              raw=json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')
              return hashlib.sha256(raw).hexdigest()

          def choose_tx_ref(index,c):
              ticker=c['ticker']; ids=(index.get('symbols') or {}).get(ticker) or []
              rev=index.get('revisions') or {}; dates=index.get('dates') or {}
              preferred=c.get('preferred_tx')
              if preferred in ids:
                  return {'ticker':ticker,'id':preferred,'pair':f'{ticker}/{preferred}','sha256':str(rev.get(f"{ticker}/{preferred}") or '').lower(),'call_date':str(dates.get(f"{ticker}/{preferred}") or '')}
              rows=[]
              for txid in ids:
                  pair=f'{ticker}/{txid}'
                  rows.append({'ticker':ticker,'id':str(txid),'pair':pair,'sha256':str(rev.get(pair) or '').lower(),'call_date':str(dates.get(pair) or '')})
              rows.sort(key=lambda r:(r['call_date'],r['id']),reverse=True)
              return rows[0] if rows else None

          def operator_intro_indices(segments):
              out=[]
              for i,seg in enumerate(segments):
                  speaker=str(seg.get('speaker') or '').strip().lower(); role=str(seg.get('role') or '').strip().lower(); text=str(seg.get('text') or '').strip().lower()
                  is_op=(speaker=='operator' or role=='operator' or speaker.endswith(' operator'))
                  if not is_op: continue
                  if 'question' in text and any(p in text for p in ('go ahead','next question','first question','question comes from','question from','take our')):
                      out.append(i)
              return out

          def acquire_tx(index,c):
              ref=choose_tx_ref(index,c)
              if not ref:
                  return {'state':'typed_absence','reason':'not_in_terminal_index','pair':None,'operator_intro_count':0}
              if not re.fullmatch(r'[0-9a-f]{64}',ref['sha256'] or ''):
                  return {'state':'typed_absence','reason':'advertised_hash_missing_or_invalid','pair':ref['pair'],'operator_intro_count':0}
              url=f"{TX_BASE}/{quote(ref['ticker'],safe='.-^')}/{quote(ref['id'],safe='')}.json.gz"
              s,b,_=http_bytes(url,'application/gzip')
              if s!=200:
                  return {'state':'typed_absence','reason':f'transcript_http_{s}','pair':ref['pair'],'operator_intro_count':0}
              try: payload=json.loads(gzip.decompress(b).decode('utf-8'))
              except Exception as e: return {'state':'typed_absence','reason':f'decode_failed:{type(e).__name__}','pair':ref['pair'],'operator_intro_count':0}
              actual=canonical_body_sha(payload)
              if payload.get('schema')!='mastermind.tx/v1' or str(payload.get('ticker') or '').upper()!=ref['ticker'] or str(payload.get('id') or '').upper()!=ref['id']:
                  return {'state':'typed_absence','reason':'transcript_identity_or_schema_invalid','pair':ref['pair'],'operator_intro_count':0}
              if actual!=ref['sha256']:
                  return {'state':'typed_absence','reason':'transcript_sha_mismatch','pair':ref['pair'],'advertised_sha256':ref['sha256'],'actual_sha256':actual,'operator_intro_count':0}
              segs=payload.get('segments') if isinstance(payload.get('segments'),list) else []
              intros=operator_intro_indices(segs)
              return {'state':'byte_replayed','url':url,'pair':ref['pair'],'sha256':actual,'gzip_bytes':len(b),'segment_count':len(segs),'operator_intro_count':len(intros),'operator_intro_indices':intros,'call_date':ref['call_date'] or str(payload.get('date') or ''),'period':str(payload.get('period') or ''),'rights_profile':RIGHTS_PROFILE,'source_available_at':None,'clock_state':'unknown'}

          def make_event_id(c,tx):
              txid=(tx or {}).get('pair','').split('/')[-1] if (tx or {}).get('pair') else c.get('preferred_tx')
              m=re.fullmatch(r'(\d{4})Q([1-4])',str(txid or ''))
              if not m:return None
              return f"evt_cik{int(c['cik']):010d}_{m.group(1)}q{m.group(2)}_results"

          index,index_headers=load_json_url(f'{TX_BASE}/index.json')
          out={'schema':'e3c.source_completeness_census.v1','operation_key':'e3c-source-census-20260826-v1','run_at':datetime.now(timezone.utc).isoformat(),'tx_index':{'schema':index.get('schema'),'generated_at':index.get('generated_at'),'body_count':index.get('body_count'),'symbol_count':index.get('symbol_count')},'selection_order':[c['ticker'] for c in CANDIDATES],'candidates':[],'selected':None,'stopped_after':None}
          for c in CANDIDATES:
              sec=acquire_sec(c); tx=acquire_tx(index,c); event_id=make_event_id(c,tx)
              axes={'release':sec['release']['state'],'filing':sec['filing']['state'],'transcript':tx['state'],'slides':'typed_absence','consensus':'typed_absence','reaction':'typed_absence'}
              rights_ok=(sec['release'].get('rights_profile')==RIGHTS_PROFILE and tx.get('rights_profile')==RIGHTS_PROFILE)
              qna_ok=(tx.get('operator_intro_count') or 0)>=1
              current_period_ok=True
              if c['ticker'] in {'GOOGL','CAT','BAC'}:
                  current_period_ok=(tx.get('pair')==f"{c['ticker']}/2026Q2")
              qualifies=(axes['release']=='byte_replayed' and axes['transcript']=='byte_replayed' and rights_ok and qna_ok and current_period_ok and bool(sec['filing'].get('accession')))
              row={'ticker':c['ticker'],'cik':f"{int(c['cik']):010d}",'siblings':c['siblings'],'canonical_event_id':event_id,'axes':axes,'release':sec['release'],'filing':sec['filing'],'transcript':tx,'rights_ok':rights_ok,'operator_delimited_qna_ok':qna_ok,'current_period_ok':current_period_ok,'qualifies':qualifies,'sec_acquisition_notes':sec['errors']}
              if c['ticker']=='GOOGL':
                  row['dual_class_identity']={'canonical_listing':'GOOGL','collapsed_sibling':'GOOG','company_id':'cik:0001652044','one_event_required':True,'event_id':event_id}
              out['candidates'].append(row)
              if qualifies:
                  out['selected']=c['ticker']; out['stopped_after']=c['ticker']; break
          out['decision']='SELECTED_FIRST_QUALIFYING' if out['selected'] else 'NO_QUALIFYING_PACKAGE_STOP_ACQUIRE'
          print(json.dumps(out,indent=2,sort_keys=True))
          open('census.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload census receipt
        uses: actions/upload-artifact@v4
        with:
          name: e3c-source-census-${{ github.run_id }}
          path: census.json
          retention-days: 14
