name: pages
# DISABLED auto-trigger: mastermind-x.com is served by the VPS (Caddy behind
# Cloudflare, pulling main every ~3 min), NOT GitHub Pages (Pages is dormant —
# no custom domain). This workflow used to fire on EVERY site/** commit only to
# deploy to the `github-pages` environment, whose one-deploy-at-a-time
# serialization CANCELLED concurrent renders during merge-sprees (the 1-2h freeze).
# Kept manual-only in case Pages is ever revived. See render.yml (renders + commits
# site/ to main, which the VPS serves).
on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Guard: refuse to deploy if any committed inline <script> has a JS syntax
      # error (e.g. an empty template var like `var DISP = ;` that renders the
      # page BLANK). A failed guard aborts this deploy, so GitHub Pages keeps the
      # last-good site live instead of shipping a broken page. See PRs #152/#155.
      - name: guard — inline JS must parse
        run: python3 scripts/check_inline_js.py site
      # Guard: refuse to deploy if the shared nav menu jams against the viewport
      # top on any page (a page that zeroed its body top padding). Keeps the
      # last-good site live instead of shipping a "menu with no padding". See PR #471.
      - name: guard — nav menu must keep a top gap
        run: python3 scripts/check_nav_gap.py site
      # Guard: refuse to deploy if a page renders the shared nav but is missing the
      # Research mega-menu (a frozen nav from an out-of-loop builder or hand-static
      # page). Keeps the last-good site live instead of shipping an inconsistent menu.
      - name: guard — shared-nav pages must carry the Research mega-menu
        run: python3 scripts/check_nav_mega.py site
      # Guard (W2): refuse to deploy a standout board whose loud labels contradict
      # its own quiet fields (FRESH on stale/extended cross, imminent on blocked,
      # green band on lagging verdict, negative-alpha slot-1). The W1 arbiter
      # prevents these at build time; this is the tripwire if it regresses.
      # Keeps the last-good site live instead of shipping a dishonest board.
      - name: guard — standout board labels must not contradict their fields
        run: python3 scripts/check_board_contradictions.py site/factordata/us_standouts.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
