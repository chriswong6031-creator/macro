name: pages
# MANUAL-ONLY re-deploy button for the GitHub Pages MIRROR. mastermind-x.com is
# served via Tencent EdgeOne (DNSPod nameservers; apex/www/admin/app all CNAME to
# *.eo.dnse3.com — verified 2026-07-05), with the VPS Caddy (pulling main every
# ~3 min) as origin — NOT GitHub Pages and NOT Cloudflare. GitHub Pages
# (chriswong6031-creator.github.io/macro, no custom domain) is a live mirror that
# daily.yml and weekly.yml deploy on every nightly/weekly run (their deploy-pages
# steps); this workflow only exists to re-deploy that mirror on demand. Auto-trigger
# stays OFF: the `github-pages` environment's one-deploy-at-a-time serialization
# CANCELLED concurrent renders during merge-sprees (the 1-2h freeze). NB a one-off
# "Deployment failed, try again later" from actions/deploy-pages (e.g. run
# 28734041930, 2026-07-05) is the Pages backend being transient — the daily.yml
# deploy of the same tree succeeded 19 minutes later; re-dispatch before debugging.
on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Guard: refuse to deploy if any committed inline <script> has a JS syntax
      # error (e.g. an empty template var like `var DISP = ;` that renders the
      # page BLANK). A failed guard aborts this deploy, so GitHub Pages keeps the
      # last-good site live instead of shipping a broken page. See PRs #152/#155.
      - name: guard — inline JS must parse
        run: python3 scripts/check_inline_js.py site
      # Guard: the inline-JS guard skips external `src=` bundles, so a syntax error
      # in a standalone site/*.js file (e.g. curly smart-quote delimiters — the
      # markets.html regression, PR #1004→#1353) sails past it and blanks the page.
      # A failed guard aborts this deploy, keeping the last-good site live.
      - name: guard — standalone site JS must parse
        run: python3 scripts/check_site_js.py site
      # Guard: refuse to deploy if the shared nav menu jams against the viewport
      # top on any page (a page that zeroed its body top padding). Keeps the
      # last-good site live instead of shipping a "menu with no padding". See PR #471.
      - name: guard — nav menu must keep a top gap
        run: python3 scripts/check_nav_gap.py site
      # Guard: refuse to deploy if a page renders the shared nav but is missing the
      # Research mega-menu (a frozen nav from an out-of-loop builder or hand-static
      # page). Keeps the last-good site live instead of shipping an inconsistent menu.
      - name: guard — shared-nav pages must carry the Research mega-menu
        run: python3 scripts/check_nav_mega.py site
      # Guard (W2): refuse to deploy a standout board whose loud labels contradict
      # its own quiet fields (FRESH on stale/extended cross, imminent on blocked,
      # green band on lagging verdict, negative-alpha slot-1). The W1 arbiter
      # prevents these at build time; this is the tripwire if it regresses.
      # Keeps the last-good site live instead of shipping a dishonest board.
      - name: guard — standout board labels must not contradict their fields
        run: python3 scripts/check_board_contradictions.py site/factordata/us_standouts.json
      # Guard: no translated text in title= attributes (template source). The dual-span
      # l-en/l-zh mechanism cannot operate inside attributes — bilingual tooltips must
      # use data-tip-en/data-tip-zh + the theme.js popover instead.
      - name: guard — no translated text in title attributes
        run: python3 scripts/check_title_i18n.py templates
      # Guard: refuse to deploy if any committed template/engine/script/site file still
      # carries literal git conflict markers ('<<<<<<<' / '=======' / '>>>>>>>'). A merge
      # once shipped marker lines inside templates/dashboard.html.j2 and every page
      # rendered them as visible text — Jinja treats them as plain text, so only this
      # guard goes red. Keeps the last-good site live instead.
      - name: guard — no git conflict markers in committed content
        run: python3 scripts/check_conflict_markers.py
      # Guard (BC-2): refuse to deploy if any user-facing surface carries an affirmative
      # "validated" claim that cannot be traced to a stored, leak-free artifact or an
      # allowlisted justification. Negated/hedged uses ("no validated edge", "unvalidated")
      # are ignored automatically. Law source: CLAUDE.md §Epistemics.
      - name: guard — no unearned 'validated' claims in user-facing surfaces
        run: python3 scripts/check_validated_claims.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
