name: pages
# DISABLED auto-trigger: mastermind-x.com is served by the VPS (Caddy behind
# Cloudflare, pulling main every ~3 min), NOT GitHub Pages (Pages is dormant —
# no custom domain). This workflow used to fire on EVERY site/** commit only to
# deploy to the `github-pages` environment, whose one-deploy-at-a-time
# serialization CANCELLED concurrent renders during merge-sprees (the 1-2h freeze).
# Kept manual-only in case Pages is ever revived. See render.yml (renders + commits
# site/ to main, which the VPS serves).
on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Guard: refuse to deploy if any committed inline <script> has a JS syntax
      # error (e.g. an empty template var like `var DISP = ;` that renders the
      # page BLANK). A failed guard aborts this deploy, so GitHub Pages keeps the
      # last-good site live instead of shipping a broken page. See PRs #152/#155.
      - name: guard — inline JS must parse
        run: python3 scripts/check_inline_js.py site
      # Guard: refuse to deploy if the shared nav menu jams against the viewport
      # top on any page (a page that zeroed its body top padding). Keeps the
      # last-good site live instead of shipping a "menu with no padding". See PR #471.
      - name: guard — nav menu must keep a top gap
        run: python3 scripts/check_nav_gap.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
