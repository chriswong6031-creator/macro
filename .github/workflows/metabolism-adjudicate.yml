name: metabolism-adjudicate
# Metabolism Phase A (A5) — ADJUDICATE row-pair (the two-key, R-AUT-6).  INERT.
#
# Rules on EVERY PROPOSE docket riding the propose branch — the base docket
# (<cycle>.json, til) plus per-lobe dockets (<cycle>-<lobe>.json, R-V6-5
# multi-lobe propose) — with THREE distinct-run_id passes each and writes the
# governance ROW-PAIR to data/neuralweb/governance.jsonl:
#   1. orchestrator  → grant/deny rows
#   2. adversary     → veto/non-veto rows + data/metabolism/adversary_ledger.jsonl
#   3. resolve       → two-key resolution rows (T0=orch grant; T1/T2=orch grant
#                      AND adversary non-veto)
# It writes governance rows only.  It NEVER merges the proposal PR — that stays
# gated on operator arming (AUTONOMY_PAUSED=false) and the BUILD pipeline.
#
# Triggering: workflow_dispatch over the propose branch (metabolism/propose-<id>).
# Auto-chaining PROPOSE→ADJUDICATE is wired in Phase B (masterplan stage graph);
# until then this runs on demand and as a paused-by-default scheduled no-op.
on:
  schedule:
    # daily 10:15 UTC — ~30 min after propose (09:45) so the docket is ready.
    # When AUTONOMY_PAUSED is not 'false' this is a clean no-op (double-gated).
    # cycle_id is derived from the most-recent open propose branch when running
    # on schedule (the shell step discovers it via git ls-remote).
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      cycle_id:
        description: "Cycle id whose docket to adjudicate"
        type: string
        required: false
        default: ""
      branch:
        description: "Branch carrying the docket (default: metabolism/propose-<cycle_id>)"
        type: string
        default: ""
      force_run:
        description: "Force even when AUTONOMY_PAUSED=true (ops verification only)"
        type: boolean
        default: false

permissions:
  contents: write        # commit governance rows to the docket's branch
  pull-requests: write

concurrency:
  # Use event-name to differentiate schedule (single active slot) from dispatch (per-cycle).
  group: metabolism-adjudicate-${{ github.event_name == 'schedule' && 'scheduled' || github.event.inputs.cycle_id }}
  cancel-in-progress: false

jobs:
  adjudicate:
    if: vars.AUTONOMY_PAUSED != 'true'
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip

      - name: install deps
        run: pip install --quiet pyyaml anthropic

      - name: ADJUDICATE (orchestrator + adversary + resolve → governance row-pair)
        env:
          AUTONOMY_PAUSED: ${{ vars.AUTONOMY_PAUSED }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          CYCLE_ID: ${{ github.event.inputs.cycle_id }}
          BRANCH_INPUT: ${{ github.event.inputs.branch }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          AP="$(printf '%s' "${AUTONOMY_PAUSED:-}" | tr '[:upper:]' '[:lower:]')"
          FR="$(printf '%s' "${FORCE_RUN:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "$AP" != "false" ] && [ "$FR" != "true" ]; then
            echo "AUTONOMY_PAUSED not 'false' (=${AUTONOMY_PAUSED:-<unset>}) — clean no-op."
            exit 0
          fi

          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          # FIX-2 (MINOR-10): When running on schedule (no cycle_id), iterate ALL pending
          # metabolism/propose-* branches, not just the most-recent one.  Per-branch failures
          # are independent (|| continue) so one bad branch never strands the rest.
          # workflow_dispatch with an explicit cycle_id retains the single-cycle fast path.
          if [ -n "${CYCLE_ID:-}" ]; then
            # Single-cycle mode (workflow_dispatch).
            PENDING_CYCLES="$CYCLE_ID"
          else
            PENDING_CYCLES="$(git ls-remote --heads origin 'refs/heads/metabolism/propose-*' \
              | awk '{print $2}' | sed 's|refs/heads/metabolism/propose-||' \
              | sort)"
            if [ -z "$PENDING_CYCLES" ]; then
              echo "no open propose branch found — clean no-op (schedule)."
              exit 0
            fi
            echo "schedule: discovered cycles: $(echo "$PENDING_CYCLES" | tr '\n' ' ')"
          fi

          _adjudicate_ok=0
          for _CID in $PENDING_CYCLES; do
            _BRANCH="${BRANCH_INPUT:-metabolism/propose-$_CID}"
            echo "--- adjudicating cycle_id=$_CID branch=$_BRANCH ---"

            # Check out the branch carrying the docket.
            git fetch origin "$_BRANCH" || { echo "branch $_BRANCH not on origin — skip"; continue; }
            git checkout "$_BRANCH" 2>/dev/null || git checkout -B "$_BRANCH" "origin/$_BRANCH" 2>/dev/null || { echo "checkout failed $_BRANCH — skip"; continue; }

            # R-V6-5 multi-lobe PROPOSE puts ALL of a cycle's dockets on ONE branch:
            # the base docket ($_CID.json, til) plus per-lobe dockets
            # ($_CID-<lobe>.json).  Enumerate every one — the branch name carries
            # only the base id, so ruling on $_CID.json alone silently strands the
            # per-lobe dockets (first armed cycle 2026-07-13, run 29223044833:
            # us/cn standout dockets never adjudicated).
            _DOCKETS="$(python -m scripts.metabolism_adjudicate --list-dockets --cycle-id "$_CID")" \
              || { echo "docket enumeration failed for $_CID — skip"; continue; }
            if [ -z "$_DOCKETS" ]; then
              echo "no dockets for $_CID on this ref — skip."
              continue
            fi
            echo "dockets for $_CID: $(echo "$_DOCKETS" | tr '\n' ' ')"

            # Per-docket isolation: one bad docket never strands its siblings.
            _docket_ok=0
            while IFS= read -r _DOCKET; do
              [ -n "$_DOCKET" ] && [ -f "$_DOCKET" ] || continue
              _DCID="$(basename "$_DOCKET" .json)"
              echo "--- docket cycle_id=$_DCID file=$_DOCKET ---"

              # Three DISTINCT-run_id passes (R-AUT-6 row-pair + two-key resolution).
              python -m scripts.metabolism_adjudicate --cycle-id "$_DCID" --role orchestrator \
                --docket-file "$_DOCKET" --run-id "${GITHUB_RUN_ID}-orchestrator" \
                || { echo "orchestrator pass failed $_DCID — skip docket"; continue; }
              python -m scripts.metabolism_adjudicate --cycle-id "$_DCID" --role adversary \
                --docket-file "$_DOCKET" --run-id "${GITHUB_RUN_ID}-adversary" \
                || { echo "adversary pass failed $_DCID — skip docket"; continue; }
              python -m scripts.metabolism_adjudicate --cycle-id "$_DCID" --role resolve \
                --docket-file "$_DOCKET" \
                || { echo "resolve pass failed $_DCID — skip docket"; continue; }
              _docket_ok=$((_docket_ok + 1))
            done <<< "$_DOCKETS"

            if [ "$_docket_ok" -eq 0 ]; then
              echo "no docket completed the row-pair for $_CID — skip commit."
              continue
            fi
            echo "row-pair passes done for $_docket_ok docket(s) on $_CID"

            # FIX-4: `data/metabolism` glob covers key_ledger.jsonl (key pool durability).
            git add data/neuralweb/governance.jsonl data/metabolism 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "no governance changes for $_CID (already adjudicated — resume no-op)."
            else
              git commit -m "metabolism: ADJUDICATE row-pair $_CID ($_docket_ok docket(s)) [Phase A]" \
                         -m "Loop-Authored: til run=${GITHUB_RUN_ID:-local}"
              # pre-sync collision sweep (render.yml / #2252): a mid-run commit on origin/$_BRANCH can
              # TRACK a path this job wrote as an UNTRACKED side-effect — the rebase checkout then
              # refuses ("untracked working tree files would be overwritten") and --autostash can't
              # clear it.  Everything this step publishes is already committed above.
              git fetch origin "$_BRANCH" || true
              comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                       <(git ls-tree -r --name-only "origin/$_BRANCH" 2>/dev/null | LC_ALL=C sort) \
                | while IFS= read -r f; do rm -f -- "$f" || true; done
              git pull --rebase --autostash origin "$_BRANCH" 2>/dev/null || true
              git push origin HEAD:"$_BRANCH" || { echo "push failed $_CID — continuing"; continue; }
              echo "ADJUDICATE row-pair written for $_CID"
            fi
            _adjudicate_ok=$((_adjudicate_ok + 1))
          done
          echo "adjudicate sweep complete: $_adjudicate_ok cycle(s) processed."

      - name: notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOKEN" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="[Metabolism] metabolism-adjudicate run failed: ${RUN_URL}" || true
