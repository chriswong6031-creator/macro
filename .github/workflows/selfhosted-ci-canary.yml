name: infrastructure-selfhosted-ci-canary

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Same-repository PR whose exact merge ref is tested; 0 tests the dispatch main SHA."
        type: string
        default: "0"
      slots:
        description: "1 = parity/contamination canary; 3 = bounded CI capacity plus render reservation probe."
        type: choice
        options: ["1", "3"]
        default: "1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: infrastructure-selfhosted-ci-canary
  cancel-in-progress: false

jobs:
  trust-gate:
    name: diagnostic-trusted-main-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: refuse a workflow definition outside main
        env:
          TRUSTED_REF: ${{ github.ref }}
        run: |
          test "$TRUSTED_REF" = refs/heads/main || {
            echo "::error title=ci-canary-trust::dispatch must use the main workflow definition"
            exit 1
          }

  plan:
    name: diagnostic-plan-current-heavy-pack
    needs: trust-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      primary_pack: ${{ steps.select.outputs.primary_pack }}
      primary_jobs: ${{ steps.select.outputs.primary_jobs }}
      selected_packs: ${{ steps.select.outputs.selected_packs }}
      plan_sha: ${{ steps.plan.outputs.plan_sha }}
      tested_ref: ${{ steps.ref.outputs.tested_ref }}
      tested_sha: ${{ steps.ref.outputs.tested_sha }}
      base_sha: ${{ steps.ref.outputs.base_sha }}
      head_sha: ${{ steps.ref.outputs.head_sha }}
      contamination_sha: ${{ steps.ref.outputs.contamination_sha }}
      control_sha: ${{ github.sha }}
      # The identity actually handed to the planner, distinct from the
      # resolver's raw `base_sha` above (#6351 P0R bridge addendum). For a PR
      # candidate (pr_number>0) the two agree: the resolver's base_sha IS the
      # PR base. For the pr_number=0 / main dispatch, `role: main` requires
      # tested_tree_sha == subject_head_sha == base_sha, but the resolver's
      # own base_sha is the PARENT of the tested SHA (kept only so the
      # contamination probe has a genuinely different second tree to detach
      # to) — feeding that parent to the planner as `base_sha` would violate
      # the main-role invariant and ManifestError. `head_sha` needs no
      # equivalent: the resolver already returns head_sha == tested_sha for
      # pr_number=0, so it is already the correct planned subject_head_sha in
      # both cases and is reused as-is by the consumer steps below.
      planned_base_sha: ${{ inputs.pr_number != '0' && steps.ref.outputs.base_sha || steps.ref.outputs.tested_sha }}
    steps:
      - name: checkout trusted canary control code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          fetch-depth: 2
      - name: preserve trusted control helpers outside the candidate workspace
        run: |
          mkdir -p "$RUNNER_TEMP/ci-canary-control"
          cp scripts/resolve_ci_canary_ref.py \
             scripts/select_ci_canary_packs.py \
             "$RUNNER_TEMP/ci-canary-control/"
          mkdir -p "$RUNNER_TEMP/ci-canary-compare-control/scripts"
          cp scripts/__init__.py \
             scripts/compare_ci_canary_receipts.py \
             scripts/ci_semantic_proof.py \
             "$RUNNER_TEMP/ci-canary-compare-control/scripts/"
      # Publish the immutable main-defined comparator before checking out or
      # executing any candidate-authored code. The package-shaped bundle is
      # runtime-complete without a repository checkout in the compare jobs.
      - name: publish trusted receipt comparator
        uses: actions/upload-artifact@v4
        with:
          name: ci-canary-compare-control
          path: ${{ runner.temp }}/ci-canary-compare-control
          if-no-files-found: error
          retention-days: 14
      - id: ref
        name: resolve an immutable trusted candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 "$RUNNER_TEMP/ci-canary-control/resolve_ci_canary_ref.py" \
            --repository "${{ github.repository }}" \
            --github-sha "${{ github.sha }}" \
            --pr-number "${{ inputs.pr_number }}" \
            --github-output "$GITHUB_OUTPUT"
      - name: checkout the exact candidate tree on hosted control
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tested_sha }}
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0
      - name: prove the planner is on the frozen tree
        run: test "$(git rev-parse HEAD)" = "${{ steps.ref.outputs.tested_sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: install isolated planner
        run: |
          python -m venv "$RUNNER_TEMP/ci-canary-plan-runner"
          "$RUNNER_TEMP/ci-canary-plan-runner/bin/pip" install pyyaml
      # Full explicit provenance (#6351 P0R bridge, spec item C.2). The
      # engine's diagnostic pair is admitted ONLY for
      # (role, event) == ("pr_head", "workflow_dispatch") with
      # workflow == "infrastructure-selfhosted-ci-canary", or the ordinary
      # ("main", "workflow_dispatch") pair — every other shape ManifestErrors
      # before a single legacy job runs. The two branches below are the two
      # lawful shapes: a same-repository PR candidate diffs and replays its
      # exact base; the main dispatch (pr_number=0) is one identical
      # tree/head/base SHA with no --changed-from at all. The prior version
      # of this step passed --changed-from unconditionally, including for
      # pr_number=0 — an unsupported shape that ManifestErrors under current
      # law (role=main forbids changed_from). This is a fix, not preserved
      # behavior.
      - id: plan
        name: freeze the current logical plan
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_PY="$RUNNER_TEMP/ci-canary-plan-runner/bin/python"
          COMMON_ARGS=(
            --workflow .github/ci/legacy-jobs.yml
            --gate code
            --pack-count 12
            --scope-mode active
            --matrix-mode active
            --plan-only
            --github-output "$GITHUB_OUTPUT"
            --emit-plan-json "$RUNNER_TEMP/ci-canary-plan/plan.json"
            --emit-changed-files "$RUNNER_TEMP/ci-canary-plan/changed-files.json"
            --workflow-run-id "$GITHUB_RUN_ID"
            --workflow-name infrastructure-selfhosted-ci-canary
            --event workflow_dispatch
            --tested-tree-sha "${{ steps.ref.outputs.tested_sha }}"
          )
          if [ "${{ inputs.pr_number }}" != "0" ]; then
            "$RUNNER_PY" scripts/run_ci_pack.py \
              "${COMMON_ARGS[@]}" \
              --role pr_head \
              --subject-head-sha "${{ steps.ref.outputs.head_sha }}" \
              --base-sha "${{ steps.ref.outputs.base_sha }}" \
              --changed-from "${{ steps.ref.outputs.base_sha }}"
          else
            "$RUNNER_PY" scripts/run_ci_pack.py \
              "${COMMON_ARGS[@]}" \
              --role main \
              --subject-head-sha "${{ steps.ref.outputs.tested_sha }}" \
              --base-sha "${{ steps.ref.outputs.tested_sha }}"
          fi
      - id: select
        name: select the current heaviest non-empty pack or top three
        run: |
          python3 "$RUNNER_TEMP/ci-canary-control/select_ci_canary_packs.py" \
            --plan "$RUNNER_TEMP/ci-canary-plan/plan.json" \
            --count "${{ inputs.slots }}" \
            --github-output "$GITHUB_OUTPUT"
      - name: publish frozen plan and changed-file handle
        uses: actions/upload-artifact@v4
        with:
          name: ci-canary-plan
          path: ${{ runner.temp }}/ci-canary-plan
          if-no-files-found: error
          retention-days: 14

  hosted-control:
    # slots=3 (spec item C.5): this becomes a matrix over the SAME selected
    # packs the self-hosted matrix below runs, instead of a single job pinned
    # to the heaviest pack — three hosted controls for three self-hosted
    # packs, so `compare` can require strict parity for every pack the run
    # actually selected, not only the primary one.
    name: diagnostic-hosted-control-pack-${{ matrix.pack }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: mark hosted job start
        run: date +%s.%N > "$RUNNER_TEMP/job-start"
      - name: checkout trusted receipt control code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.control_sha }}
          persist-credentials: false
          filter: blob:none
          fetch-depth: 1
      - name: preserve trusted receipt helpers outside the candidate workspace
        run: |
          mkdir -p "$RUNNER_TEMP/ci-canary-control"
          cp scripts/monitor_ci_host_resources.py \
             scripts/capture_ci_canary_receipt.py \
             "$RUNNER_TEMP/ci-canary-control/"
      - name: mark candidate checkout start
        run: date +%s.%N > "$RUNNER_TEMP/checkout-start"
      - name: checkout exact candidate tree
        uses: actions/checkout@v4
        env:
          GIT_TRACE2_EVENT: ${{ runner.temp }}/git-trace2.json
        with:
          ref: ${{ needs.plan.outputs.tested_sha }}
          persist-credentials: false
          filter: blob:none
          fetch-depth: 1
      - name: close candidate checkout timing
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.plan.outputs.tested_sha }}"
          git cat-file -e "${{ needs.plan.outputs.base_sha }}^{commit}"
          checkout_end=$(date +%s.%N)
          awk -v start="$(cat "$RUNNER_TEMP/checkout-start")" -v end="$checkout_end" 'BEGIN {print end-start}' > "$RUNNER_TEMP/checkout-seconds"
          date +%s.%N > "$RUNNER_TEMP/dependency-start"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install isolated pack runner
        run: |
          python -m venv "$RUNNER_TEMP/ci-canary-pack-runner"
          "$RUNNER_TEMP/ci-canary-pack-runner/bin/pip" install pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: ci-canary-plan
          path: ${{ runner.temp }}/ci-canary-plan
      # Single-plan consumption (#6351 P0R bridge, spec item C.3), mirroring
      # ci.yml's ci-pack step: --plan-json/--changed-files-file/--expect-*
      # /--gate code, never re-planning from --changed-from. The prior
      # version of this step re-derived its own plan on every runner via
      # --changed-from + --expect-plan-sha, which only coincidentally agreed
      # with the published plan when nothing raced; the published plan is now
      # the sole authority every consumer loads and verifies bytewise.
      - name: execute the frozen logical pack and retain its actual result
        env:
          CI_CHANGED_FILES_FILE: ${{ runner.temp }}/ci-canary-plan/changed-files.json
        shell: bash
        run: |
          set -uo pipefail
          dependency_end=$(date +%s.%N)
          awk -v start="$(cat "$RUNNER_TEMP/dependency-start")" -v end="$dependency_end" 'BEGIN {print end-start}' > "$RUNNER_TEMP/dependency-seconds"
          test_start=$(date +%s.%N)
          mkdir -p "$RUNNER_TEMP/ci-semantic-fragments"
          python3 "$RUNNER_TEMP/ci-canary-control/monitor_ci_host_resources.py" \
            --output "$RUNNER_TEMP/resources.jsonl" --path "$GITHUB_WORKSPACE" &
          monitor_pid=$!
          set +e
          "$RUNNER_TEMP/ci-canary-pack-runner/bin/python" scripts/run_ci_pack.py \
            --workflow .github/ci/legacy-jobs.yml \
            --gate code \
            --plan-json "$RUNNER_TEMP/ci-canary-plan/plan.json" \
            --changed-files-file "$CI_CHANGED_FILES_FILE" \
            --expect-plan-sha "${{ needs.plan.outputs.plan_sha }}" \
            --expect-tested-tree-sha "${{ needs.plan.outputs.tested_sha }}" \
            --expect-subject-head-sha "${{ needs.plan.outputs.head_sha }}" \
            --expect-base-sha "${{ needs.plan.outputs.planned_base_sha }}" \
            --pack-index "${{ matrix.pack }}" \
            --pack-count 12 \
            --emit-semantic-fragment "$RUNNER_TEMP/ci-semantic-fragments/hosted-fragment.json" \
            --execute 2>&1 | tee "$RUNNER_TEMP/pack.log"
          pack_rc=${PIPESTATUS[0]}
          set -e
          test_end=$(date +%s.%N)
          awk -v start="$test_start" -v end="$test_end" 'BEGIN {print end-start}' > "$RUNNER_TEMP/test-seconds"
          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          echo "$pack_rc" > "$RUNNER_TEMP/pack.rc"
      - name: write hosted receipt
        run: |
          wall_end=$(date +%s.%N)
          awk -v start="$(cat "$RUNNER_TEMP/job-start")" -v end="$wall_end" 'BEGIN {print end-start}' > "$RUNNER_TEMP/wall-seconds"
          object_bytes=$(du -sk .git/objects | awk '{print $1 * 1024}')
          python3 "$RUNNER_TEMP/ci-canary-control/capture_ci_canary_receipt.py" \
            --log "$RUNNER_TEMP/pack.log" \
            --plan "$RUNNER_TEMP/ci-canary-plan/plan.json" \
            --pack "${{ matrix.pack }}" \
            --exit-code "$(cat "$RUNNER_TEMP/pack.rc")" \
            --tested-sha "${{ needs.plan.outputs.tested_sha }}" \
            --base-sha "${{ needs.plan.outputs.base_sha }}" \
            --runner-kind hosted \
            --runner-name "${RUNNER_NAME:-github-hosted}" \
            --trace2 "$RUNNER_TEMP/git-trace2.json" \
            --metrics "$RUNNER_TEMP/resources.jsonl" \
            --checkout-seconds "$RUNNER_TEMP/checkout-seconds" \
            --dependency-seconds "$RUNNER_TEMP/dependency-seconds" \
            --test-seconds "$RUNNER_TEMP/test-seconds" \
            --wall-seconds "$RUNNER_TEMP/wall-seconds" \
            --workspace-object-bytes "$object_bytes" \
            --fragment "$RUNNER_TEMP/ci-semantic-fragments/hosted-fragment.json" \
            --output "$RUNNER_TEMP/hosted-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-canary-hosted-${{ matrix.pack }}
          path: ${{ runner.temp }}/hosted-receipt.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ci-canary-hosted-fragment-${{ matrix.pack }}
          path: ${{ runner.temp }}/ci-semantic-fragments/hosted-fragment.json
          if-no-files-found: error
          retention-days: 14

  selfhosted-pack:
    name: diagnostic-selfhosted-pack-${{ matrix.pack }}
    needs: plan
    runs-on: ${{ fromJSON(inputs.slots == '1' && '["self-hosted","ci-linux-canary"]' || '["self-hosted","ci-linux"]') }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.slots) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: mark self-hosted job start
        run: date +%s.%N > "$RUNNER_TEMP/job-start"
      - name: refuse unsafe resources before shared cache use
        run: /usr/local/libexec/mastermind-ci-resource-guard --path "$GITHUB_WORKSPACE"
      - name: mark cache and checkout start
        run: |
          du -sb /var/cache/mastermind-ci/macro.git | awk '{print $1}' > "$RUNNER_TEMP/cache-before"
          date +%s.%N > "$RUNNER_TEMP/checkout-start"
      - name: prewarm exact base from the read-only shared cache
        shell: bash
        run: |
          set -o pipefail
          /usr/local/libexec/mastermind-ci-prewarm \
            --cache /var/cache/mastermind-ci/macro.git \
            --workspace "$GITHUB_WORKSPACE" \
            --repository "${{ github.repository }}" \
            --repository-url "https://github.com/${{ github.repository }}.git" \
            --base-sha "${{ needs.plan.outputs.control_sha }}" \
            | tee "$RUNNER_TEMP/prewarm.log"
          GIT_NO_LAZY_FETCH=1 git -C "$GITHUB_WORKSPACE" \
            cat-file -e "${{ needs.plan.outputs.base_sha }}^{commit}"
      - name: preserve root-owned-control-compatible receipt helpers
        run: |
          mkdir -p "$RUNNER_TEMP/ci-canary-control"
          cp scripts/monitor_ci_host_resources.py \
             scripts/capture_ci_canary_receipt.py \
             "$RUNNER_TEMP/ci-canary-control/"
      - name: materialize exact candidate with negotiated incremental fetch
        env:
          GIT_TRACE2_EVENT: ${{ runner.temp }}/git-trace2.json
          TESTED_SHA: ${{ needs.plan.outputs.tested_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git config --get-regexp '^http\..*\.extraheader$' || true)"
          GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false \
          git -c credential.helper= -c fetch.negotiationAlgorithm=skipping fetch \
            --no-tags --no-write-fetch-head --recurse-submodules=no \
            --filter=blob:none --depth=1 origin "$TESTED_SHA"
          GIT_NO_LAZY_FETCH=0 git checkout --force --detach "$TESTED_SHA"
          git reset --hard "$TESTED_SHA"
          git clean -ffdx
          test -z "$(git config --local --get-regexp '^http\..*\.extraheader$' || true)"
      - name: verify exact checkout and close timing
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.plan.outputs.tested_sha }}"
          test "$(cat .git/objects/info/alternates)" = "/var/cache/mastermind-ci/macro.git/objects"
          checkout_end=$(date +%s.%N)
          awk -v start="$(cat "$RUNNER_TEMP/checkout-start")" -v end="$checkout_end" 'BEGIN {print end-start}' > "$RUNNER_TEMP/checkout-seconds"
          date +%s.%N > "$RUNNER_TEMP/dependency-start"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install isolated pack runner
        run: |
          python -m venv "$RUNNER_TEMP/ci-canary-pack-runner"
          "$RUNNER_TEMP/ci-canary-pack-runner/bin/pip" install pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: ci-canary-plan
          path: ${{ runner.temp }}/ci-canary-plan
      - name: execute the frozen logical pack and retain its actual result
        env:
          CI_CHANGED_FILES_FILE: ${{ runner.temp }}/ci-canary-plan/changed-files.json
        shell: bash
        run: |
          set -uo pipefail
          dependency_end=$(date +%s.%N)
          awk -v start="$(cat "$RUNNER_TEMP/dependency-start")" -v end="$dependency_end" 'BEGIN {print end-start}' > "$RUNNER_TEMP/dependency-seconds"
          test_start=$(date +%s.%N)
          mkdir -p "$RUNNER_TEMP/ci-semantic-fragments"
          expected_home="$(dirname "$RUNNER_TEMP")/_home"
          test "$HOME" = "$expected_home"
          touch .ci-canary-contamination-sentinel
          touch "$RUNNER_WORKSPACE/.ci-canary-outside-sentinel"
          touch "$HOME/.ci-canary-home-sentinel"
          setsid env -u RUNNER_TRACKING_ID bash -c \
            "exec -a mastermind-ci-leak-$GITHUB_RUN_ID sleep 1800" \
            </dev/null >/dev/null 2>&1 &
          leak_pid=$!
          if ! kill -0 "$leak_pid"; then
            echo "::error title=process-contamination::failed to plant abandoned child"
            exit 1
          fi
          echo "intentionally abandoned untracked process pid=$leak_pid"
          python3 "$RUNNER_TEMP/ci-canary-control/monitor_ci_host_resources.py" \
            --output "$RUNNER_TEMP/resources.jsonl" --path "$GITHUB_WORKSPACE" &
          monitor_pid=$!
          set +e
          "$RUNNER_TEMP/ci-canary-pack-runner/bin/python" scripts/run_ci_pack.py \
            --workflow .github/ci/legacy-jobs.yml \
            --gate code \
            --plan-json "$RUNNER_TEMP/ci-canary-plan/plan.json" \
            --changed-files-file "$CI_CHANGED_FILES_FILE" \
            --expect-plan-sha "${{ needs.plan.outputs.plan_sha }}" \
            --expect-tested-tree-sha "${{ needs.plan.outputs.tested_sha }}" \
            --expect-subject-head-sha "${{ needs.plan.outputs.head_sha }}" \
            --expect-base-sha "${{ needs.plan.outputs.planned_base_sha }}" \
            --pack-index "${{ matrix.pack }}" \
            --pack-count 12 \
            --emit-semantic-fragment "$RUNNER_TEMP/ci-semantic-fragments/selfhosted-fragment.json" \
            --execute 2>&1 | tee "$RUNNER_TEMP/pack.log"
          pack_rc=${PIPESTATUS[0]}
          set -e
          test_end=$(date +%s.%N)
          awk -v start="$test_start" -v end="$test_end" 'BEGIN {print end-start}' > "$RUNNER_TEMP/test-seconds"
          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          echo "$pack_rc" > "$RUNNER_TEMP/pack.rc"
      - name: write self-hosted receipt
        run: |
          wall_end=$(date +%s.%N)
          awk -v start="$(cat "$RUNNER_TEMP/job-start")" -v end="$wall_end" 'BEGIN {print end-start}' > "$RUNNER_TEMP/wall-seconds"
          cat "$RUNNER_TEMP/prewarm.log" "$RUNNER_TEMP/pack.log" > "$RUNNER_TEMP/combined.log"
          du -sb /var/cache/mastermind-ci/macro.git | awk '{print $1}' > "$RUNNER_TEMP/cache-after"
          object_bytes=$(du -sk .git/objects | awk '{print $1 * 1024}')
          python3 "$RUNNER_TEMP/ci-canary-control/capture_ci_canary_receipt.py" \
            --log "$RUNNER_TEMP/combined.log" \
            --plan "$RUNNER_TEMP/ci-canary-plan/plan.json" \
            --pack "${{ matrix.pack }}" \
            --exit-code "$(cat "$RUNNER_TEMP/pack.rc")" \
            --tested-sha "${{ needs.plan.outputs.tested_sha }}" \
            --base-sha "${{ needs.plan.outputs.base_sha }}" \
            --runner-kind selfhosted \
            --runner-name "${RUNNER_NAME:-unknown}" \
            --trace2 "$RUNNER_TEMP/git-trace2.json" \
            --metrics "$RUNNER_TEMP/resources.jsonl" \
            --checkout-seconds "$RUNNER_TEMP/checkout-seconds" \
            --dependency-seconds "$RUNNER_TEMP/dependency-seconds" \
            --test-seconds "$RUNNER_TEMP/test-seconds" \
            --wall-seconds "$RUNNER_TEMP/wall-seconds" \
            --cache-before "$RUNNER_TEMP/cache-before" \
            --cache-after "$RUNNER_TEMP/cache-after" \
            --workspace-object-bytes "$object_bytes" \
            --fragment "$RUNNER_TEMP/ci-semantic-fragments/selfhosted-fragment.json" \
            --output "$RUNNER_TEMP/selfhosted-${{ matrix.pack }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-canary-selfhosted-${{ matrix.pack }}
          path: ${{ runner.temp }}/selfhosted-${{ matrix.pack }}.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ci-canary-selfhosted-fragment-${{ matrix.pack }}
          path: ${{ runner.temp }}/ci-semantic-fragments/selfhosted-fragment.json
          if-no-files-found: error
          retention-days: 14
      - name: surface a red pack after preserving its three-slot receipt
        if: inputs.slots == '3'
        run: test "$(cat "$RUNNER_TEMP/pack.rc")" -eq 0

  cache-negative-control:
    name: diagnostic-cache-disabled-negative-control
    if: inputs.slots == '1'
    needs: plan
    runs-on: [self-hosted, ci-linux-canary]
    timeout-minutes: 8
    steps:
      - name: prove a missing cache refuses before checkout
        shell: bash
        run: |
          set +e
          /usr/local/libexec/mastermind-ci-prewarm \
            --cache "$RUNNER_TEMP/intentionally-absent-cache" \
            --workspace "$RUNNER_TEMP/cache-negative-workspace" \
            --repository "${{ github.repository }}" \
            --repository-url "https://github.com/${{ github.repository }}.git" \
            --base-sha "${{ needs.plan.outputs.control_sha }}"
          rc=$?
          set -e
          test "$rc" -eq 66
          test ! -e "$RUNNER_TEMP/cache-negative-workspace/.git"
          echo "cache-disabled control refused with rc=$rc; no origin checkout attempted"

  contamination-probe:
    name: diagnostic-persistent-workspace-contamination
    if: inputs.slots == '1'
    needs: [plan, selfhosted-pack]
    runs-on: [self-hosted, ci-linux-canary]
    timeout-minutes: 20
    steps:
      - name: prewarm trusted control tree from shared cache
        run: |
          /usr/local/libexec/mastermind-ci-prewarm \
            --cache /var/cache/mastermind-ci/macro.git \
            --workspace "$GITHUB_WORKSPACE" \
            --repository "${{ github.repository }}" \
            --repository-url "https://github.com/${{ github.repository }}.git" \
            --base-sha "${{ needs.plan.outputs.control_sha }}"
      - name: detach the second different exact tree from the shared cache
        env:
          GIT_NO_LAZY_FETCH: "1"
        run: |
          git checkout --force --detach "${{ needs.plan.outputs.contamination_sha }}"
          git reset --hard "${{ needs.plan.outputs.contamination_sha }}"
          git clean -ffdx
      - name: prove the persistent workspace is clean and isolated
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.plan.outputs.contamination_sha }}"
          test "${{ needs.plan.outputs.contamination_sha }}" != "${{ needs.plan.outputs.tested_sha }}"
          test -z "$(git status --porcelain)"
          test ! -e .ci-canary-contamination-sentinel
          test ! -e "$RUNNER_WORKSPACE/.ci-canary-outside-sentinel"
          test ! -e "$HOME/.ci-canary-home-sentinel"
          test ! -e .git/index.lock
          test ! -w /var/cache/mastermind-ci/macro.git
          ! pgrep -f '[m]onitor_ci_host_resources.py'
          ! pgrep -f "[m]astermind-ci-leak-${{ github.run_id }}"
          test ! -e /mnt/c/Users/longr
          echo "second_tree=${{ needs.plan.outputs.contamination_sha }} runner=${RUNNER_NAME:-unknown} clean=true"

  render-reservation-probe:
    name: diagnostic-render-reserved-slot
    if: inputs.slots == '3'
    needs: plan
    runs-on: [self-hosted, Linux, X64, render-linux]
    timeout-minutes: 10
    steps:
      - name: prove the render-only listener remains independently routable
        run: |
          echo "runner=${RUNNER_NAME:-unknown} hostname=$(hostname)"
          echo "render reservation probe: read-only, no checkout, no publication"
          free -h
          df -h "$RUNNER_WORKSPACE"
          sleep 30

  compare:
    # Runs for BOTH slots (spec item C.6: "slots=3 comparison covers all
    # three packs"), as a matrix over the same selected packs hosted-control
    # and selfhosted-pack ran. `always()` at job level because
    # cache-negative-control/contamination-probe are slots==1-only and would
    # otherwise SKIP this job by default propagation; the first step makes
    # the real gating explicit instead, so a slots=3 run is not silently
    # waiting on two jobs that never ran.
    name: diagnostic-hosted-selfhosted-result-parity-pack-${{ matrix.pack }}
    if: always()
    needs: [plan, hosted-control, selfhosted-pack, cache-negative-control, contamination-probe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: require every infrastructure leg to conclude
        env:
          PLAN: ${{ needs.plan.result }}
          HOSTED: ${{ needs.hosted-control.result }}
          SELFHOSTED: ${{ needs.selfhosted-pack.result }}
          NEGATIVE: ${{ needs.cache-negative-control.result }}
          CONTAMINATION: ${{ needs.contamination-probe.result }}
          SLOTS: ${{ inputs.slots }}
        run: |
          for result in "$PLAN" "$HOSTED" "$SELFHOSTED"; do
            test "$result" = success
          done
          if [ "$SLOTS" = "1" ]; then
            test "$NEGATIVE" = success
            test "$CONTAMINATION" = success
          fi
      # Receipt comparison needs one trusted helper, not a multi-gigabyte
      # repository worktree. The planner published this helper from the
      # main-defined control checkout in the same run.
      - uses: actions/download-artifact@v4
        with:
          name: ci-canary-compare-control
          path: ${{ runner.temp }}/control
      - uses: actions/download-artifact@v4
        with:
          name: ci-canary-hosted-${{ matrix.pack }}
          path: ${{ runner.temp }}/hosted
      - uses: actions/download-artifact@v4
        with:
          name: ci-canary-hosted-fragment-${{ matrix.pack }}
          path: ${{ runner.temp }}/hosted
      - uses: actions/download-artifact@v4
        with:
          name: ci-canary-selfhosted-${{ matrix.pack }}
          path: ${{ runner.temp }}/selfhosted
      - uses: actions/download-artifact@v4
        with:
          name: ci-canary-selfhosted-fragment-${{ matrix.pack }}
          path: ${{ runner.temp }}/selfhosted
      # Diagnostic-only: compare_ci_canary_receipts.py never calls
      # scripts/merge_on_green.py or scripts/ci_semantic_proof.reconcile_evidence
      # (#6351 spec item C.6) — strict fragment equality here is evidence FOR
      # the bridge's own promotion decision, never a merge-gating verdict
      # itself.
      - name: compare logical jobs, failures, receipts, and semantic fragments
        run: |
          python3 "$RUNNER_TEMP/control/scripts/compare_ci_canary_receipts.py" \
            --hosted "$RUNNER_TEMP/hosted/hosted-receipt.json" \
            --selfhosted "$RUNNER_TEMP/selfhosted/selfhosted-${{ matrix.pack }}.json" \
            --hosted-fragment "$RUNNER_TEMP/hosted/hosted-fragment.json" \
            --selfhosted-fragment "$RUNNER_TEMP/selfhosted/selfhosted-fragment.json"
