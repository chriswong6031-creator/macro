name: TFG-0 frozen transcript format measurement

on:
  push:
    branches:
      - sol/tfg0-transcript-format-census-20260827

permissions:
  contents: read

jobs:
  measure:
    name: Measure frozen TFG-0 corpus without checkout
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch frozen corpus and measure held source structure
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import gzip, hashlib, json, os, time
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          REPO='mastermindx-market-intelligence/macro'
          SHA=os.environ['GITHUB_SHA']
          RAW=f'https://raw.githubusercontent.com/{REPO}/{SHA}'
          TX='https://app.mastermind-x.com/data/tx'
          UA='Mastermind TFG-0 transcript format census admin@macro-dashboard.example.com'
          SEL_PATH='research/earnings_intelligence/e3/tfg0_transcript_format_development_corpus_selection.json'
          TITLE_TOKENS=('chief executive','chief financial','chief operating','ceo','cfo','coo','president','chairman','chairwoman','executive officer','investor relations','head of')

          def fetch(url:str, accept='*/*', retries=3):
              last=None
              for attempt in range(retries):
                  req=Request(url,headers={'User-Agent':UA,'Accept':accept,'Cache-Control':'no-cache'})
                  try:
                      with urlopen(req,timeout=35) as r:
                          if int(r.status)!=200: raise RuntimeError(f'{url} HTTP {r.status}')
                          return r.read()
                  except (HTTPError,URLError,TimeoutError,OSError) as exc:
                      last=exc
                      if attempt<retries-1:
                          time.sleep(1.2*(attempt+1)); continue
                      raise RuntimeError(f'network failure {url}: {exc}') from exc
              raise RuntimeError(str(last))

          def canonical_sha(payload):
              return hashlib.sha256(json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          def norm(v): return ' '.join(str(v or '').split())
          def clip(v,n=360):
              s=norm(v); return s if len(s)<=n else s[:n-1]+'…'

          selection=json.loads(fetch(f'{RAW}/{SEL_PATH}','application/json').decode())
          if selection.get('operation_key')!='tfg0-transcript-format-census-20260827-v1': raise RuntimeError('selection operation mismatch')
          if selection.get('bodies_inspected_before_freeze')!=0 or selection.get('selected_count')!=16: raise RuntimeError('selection freeze invalid')
          excluded=set(selection.get('excluded_symbols') or [])
          if not {'AAPL','GOOGL','GOOG','CAT','BAC','SNOW'}.issubset(excluded): raise RuntimeError('OOS exclusion set weakened')

          rows=[]
          for slot,item in enumerate(selection['selected']):
              ticker=item['ticker']; txid=item['transcript_id']; pair=item['pair']
              if ticker in excluded: raise RuntimeError(f'excluded symbol leaked into corpus: {ticker}')
              url=f"{TX}/{quote(ticker,safe='.-^')}/{quote(txid,safe='')}.json.gz"
              row={'slot':slot,'pair':pair,'ticker':ticker,'transcript_id':txid,'call_date':item['call_date'],'advertised_sha256':item['body_sha256'],'selection_hash':item['selection_hash'],'url':url}
              try:
                  gz=fetch(url,'application/gzip'); payload=json.loads(gzip.decompress(gz).decode())
                  actual=canonical_sha(payload); row['actual_sha256']=actual; row['gzip_bytes']=len(gz)
                  row['sha_match']=actual==item['body_sha256']; row['schema']=payload.get('schema'); row['identity_match']=str(payload.get('ticker') or '').upper()==ticker and str(payload.get('id') or '').upper()==txid
                  if not row['sha_match'] or row['schema']!='mastermind.tx/v1' or not row['identity_match']:
                      row['state']='SOURCE_REVISION_MISMATCH'; rows.append(row); continue
                  segs=payload.get('segments') if isinstance(payload.get('segments'),list) else []
                  row['state']='byte_replayed'; row['segment_count']=len(segs)
                  row['role_counts']=dict(sorted(Counter(norm(s.get('role')) for s in segs).items()))

                  speaker_roles=defaultdict(Counter); speaker_occ=Counter()
                  for s in segs:
                      sp=norm(s.get('speaker')); role=norm(s.get('role'))
                      if sp:
                          speaker_occ[sp]+=1; speaker_roles[sp][role]+=1
                  speakers=[]
                  for sp in sorted(speaker_occ):
                      title_evidence=[]; needle=sp.casefold()
                      for i,s in enumerate(segs):
                          text=norm(s.get('text')); low=text.casefold()
                          if needle and needle in low and any(tok in low for tok in TITLE_TOKENS):
                              title_evidence.append({'segment_index':i,'speaker':norm(s.get('speaker')),'role':norm(s.get('role')),'text':clip(text,520)})
                      speakers.append({'speaker':sp,'segment_roles':dict(sorted(speaker_roles[sp].items())),'occurrences':speaker_occ[sp],'same_transcript_title_evidence':title_evidence[:4]})
                  row['speaker_evidence']=speakers

                  operator=[]
                  for i,s in enumerate(segs):
                      role=norm(s.get('role')).casefold(); speaker=norm(s.get('speaker')).casefold(); text=norm(s.get('text')); low=text.casefold()
                      is_op=(role=='operator' or speaker=='operator' or speaker.endswith(' operator'))
                      if not is_op: continue
                      flags={
                          'contains_question':'question' in low,
                          'go_ahead':'go ahead' in low,
                          'line_open':'line is now open' in low or 'line is open' in low,
                          'may_proceed':'may proceed' in low,
                          'next_question':'next question' in low,
                          'first_question':'first question' in low,
                          'question_comes_from':'question comes from' in low,
                          'question_from':'question from' in low,
                          'take_question':'take a question' in low or 'take our first' in low or 'take the next' in low,
                      }
                      if flags['contains_question'] or any(flags.values()):
                          operator.append({'segment_index':i,'text':clip(text,440),'flags':flags})
                  row['operator_segment_count']=sum(1 for s in segs if norm(s.get('role')).casefold()=='operator' or norm(s.get('speaker')).casefold()=='operator')
                  row['operator_candidates']=operator

                  intro=[]
                  for i,s in enumerate(segs[:30]):
                      text=norm(s.get('text')); low=text.casefold(); role=norm(s.get('role'))
                      if role.casefold() in {'operator','ir','investor relations'} or any(tok in low for tok in TITLE_TOKENS):
                          intro.append({'segment_index':i,'speaker':norm(s.get('speaker')),'role':role,'text':clip(text,520)})
                  row['opening_identity_evidence']=intro
              except Exception as exc:
                  row['state']='FETCH_OR_DECODE_FAILED'; row['error']=f'{type(exc).__name__}: {exc}'
              rows.append(row)

          summary={
              'byte_replayed':sum(r.get('state')=='byte_replayed' for r in rows),
              'source_revision_mismatch':sum(r.get('state')=='SOURCE_REVISION_MISMATCH' for r in rows),
              'fetch_or_decode_failed':sum(r.get('state')=='FETCH_OR_DECODE_FAILED' for r in rows)
          }
          out={'schema':'tfg0.transcript_format_census.v1','operation_key':selection['operation_key'],'measured_at':datetime.now(timezone.utc).isoformat(),'probe_head_sha':SHA,'selection':selection,'summary':summary,'rows':rows,'model_calls':0,'excluded_oos_bodies_inspected':0}
          open('tfg0_census.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'schema':out['schema'],'operation_key':out['operation_key'],'probe_head_sha':SHA,'summary':summary,'pairs':[r['pair'] for r in rows]},indent=2))
          PY
      - name: Upload census
        uses: actions/upload-artifact@v4
        with:
          name: tfg0-fast-census-${{ github.run_id }}
          path: tfg0_census.json
          retention-days: 14
