name: special-sits-backfill
# Roadmap Tier-2.2: burn down the ~23k-deferred Special-Situations backlog faster than the
# bounded daily build can, and refresh the category x stage backtest priors. Runs in the
# serialized batch lane (with backfill/weekly) — NOT the daily lane — so this long job can
# never starve the daily data refresh. Manual, or a modest weekly cron.
on:
  workflow_dispatch:
    inputs:
      # defaults sized to finish inside timeout-minutes (180): measured ~13 LLM calls/min, so
      # classify+summary <= ~1500 leaves margin for the doc fetches. A run that overruns the
      # timeout is KILLED before the commit step -> all enrichment lost (no mid-run checkpoint),
      # so keep the cron defaults conservative; raise them on a manual dispatch if needed.
      classify_limit: { description: "LLM category-verify calls this run", default: "1000" }
      summary_limit:  { description: "LLM summary calls this run",         default: "500" }
      text_limit:     { description: "keyword pre-filter doc fetches",      default: "6000" }
      filer_limit:    { description: "13D cover-page fetches",              default: "3000" }
  schedule:
    - cron: "30 6 * * 0"     # Sunday 06:30 UTC — modest weekly burn-down + priors refresh

permissions:
  contents: write

concurrency:
  group: pipeline-batch      # serialized with backfill/weekly; daily has its own lane now
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      # the priors backtest prices situations off the breadth close caches (gitignored,
      # saved by the daily run) + the committed bt_prices.parquet; restore best-effort.
      - name: restore breadth close cache
        uses: actions/cache@v4
        with:
          path: data/breadth/_closes_cache.parquet
          key: breadth-closes-backfill-${{ github.run_id }}
          restore-keys: breadth-closes-
      - name: enrich backlog (bounded by the inputs; LLM lanes no-op without a key)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SS_CLASSIFY_LIMIT: ${{ github.event.inputs.classify_limit || '1000' }}
          SS_SUMMARY_LIMIT: ${{ github.event.inputs.summary_limit || '500' }}
          SS_TEXT_LIMIT: ${{ github.event.inputs.text_limit || '6000' }}
          SS_FILER_LIMIT: ${{ github.event.inputs.filer_limit || '3000' }}
        run: python -m scripts.special_sits_backfill
      - name: refresh backtest priors (category x stage, filing-date entry)
        run: python -m scripts.backtest_special_situations || true
      - name: refresh W3 event-intelligence priors (catalyst taxonomy; off render path)
        # Writes to data/special_situations/event_priors/<type>.json — covered by
        # `git add data/special_situations` below (B3 sentinel-staging-gap fix).
        run: python -m scripts.backtest_event_priors || true
      - name: re-render desk from the enriched store
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        # hard_exit: this one-shot's last act reads parquet; pyarrow's ThreadPool
        # static destructor can deadlock at exit on macOS (~1-in-3 observed for
        # short parquet-reading one-shots) and stall the lane so the commit step
        # below never runs. See lib/procutil.py for the full post-mortem.
        run: |
          python - <<'PY'
          from lib.procutil import hard_exit
          from scripts.build_special_situations import build
          try:
              build(refresh=False)
          except BaseException:
              import traceback; traceback.print_exc()
              hard_exit(1)
          hard_exit(0)
          PY
      - name: commit
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # data/special_situations is staged recursively — covers event_priors/*.json (B3 fix)
          git add data/special_situations site/special_situations.html site/allocationdata/special_situations.json data/regime/special_situations_latest.json
          if git diff --cached --quiet; then echo "no special-sits changes to commit"; exit 0; fi
          git commit -m "special-sits: backlog burn-down + priors refresh $(date -u +%F)"
          # best-effort push: daily now runs in its own lane and may push concurrently.
          # The old `git push || echo` SILENTLY DROPPED this commit on a lost race — retry
          # rebase+push instead, preferring our freshly-enriched store on conflict.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "pushed special-sits on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "special-sits push attempt $i lost a race; re-syncing"; sleep $((i * 7))
          done
          echo "::warning::could not push special-sits after 5 attempts (non-fatal)"
