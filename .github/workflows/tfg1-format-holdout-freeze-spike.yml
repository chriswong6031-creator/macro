name: TFG-1 unseen format holdout freeze spike

on:
  push:
    branches:
      - sol/tfg0-transcript-format-census-20260827

permissions:
  contents: read

jobs:
  freeze:
    name: Freeze TFG-1 holdout identities only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select ranks 17 through 24 without opening bodies
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time
          from datetime import date, datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          URL='https://app.mastermind-x.com/data/tx/index.json'
          UA='Mastermind TFG-1 holdout freeze admin@macro-dashboard.example.com'
          EXCLUDED={'AAPL','GOOGL','GOOG','CAT','BAC','SNOW'}
          START=date(2026,5,1); END=date(2026,8,26)

          def fetch():
              last=None
              for attempt in range(3):
                  try:
                      req=Request(URL,headers={'User-Agent':UA,'Accept':'application/json','Cache-Control':'no-cache'})
                      with urlopen(req,timeout=35) as r:
                          if int(r.status)!=200: raise RuntimeError(f'HTTP {r.status}')
                          return r.read()
                  except (HTTPError,URLError,TimeoutError,OSError) as exc:
                      last=exc
                      if attempt<2: time.sleep(1.5*(attempt+1)); continue
                      raise
              raise RuntimeError(str(last))

          raw=fetch(); idx=json.loads(raw.decode())
          if idx.get('schema')!='mastermind.tx-index/v1': raise RuntimeError('index schema mismatch')
          rows=[]
          for rticker, ids in (idx.get('symbols') or {}).items():
              ticker=str(rticker or '').strip().upper()
              if ticker in EXCLUDED or not isinstance(ids,list): continue
              for rid in ids:
                  txid=str(rid or '').strip().upper()
                  if txid not in {'2026Q2','2026Q3'}: continue
                  pair=f'{ticker}/{txid}'
                  sha=str((idx.get('revisions') or {}).get(pair) or '').strip().lower()
                  ds=str((idx.get('dates') or {}).get(pair) or '')[:10]
                  if not re.fullmatch(r'[0-9a-f]{64}',sha): continue
                  try: cd=date.fromisoformat(ds)
                  except ValueError: continue
                  if not START<=cd<=END: continue
                  selection_hash=hashlib.sha256(f'TFG0|{pair}|{sha}'.encode()).hexdigest()
                  rows.append({'pair':pair,'ticker':ticker,'transcript_id':txid,'body_sha256':sha,'call_date':cd.isoformat(),'selection_hash':selection_hash})
          rows.sort(key=lambda r:(r['selection_hash'],r['pair']))
          if len(rows)<24: raise RuntimeError(f'eligible corpus too small: {len(rows)}')
          out={
            'schema':'tfg1.format_holdout_selection.v1',
            'parent_operation_key':'tfg0-transcript-format-census-20260827-v1',
            'frozen_at':datetime.now(timezone.utc).isoformat(),
            'selection_law':'same TFG0 eligible ordering; ranks 17-24 (1-indexed)',
            'rank_start':17,'rank_end':24,'holdout_count':8,
            'eligible_count':len(rows),'excluded_symbols':sorted(EXCLUDED),
            'tx_index':{'schema':idx.get('schema'),'generated_at':idx.get('generated_at'),'body_count':idx.get('body_count'),'symbol_count':idx.get('symbol_count'),'raw_sha256':hashlib.sha256(raw).hexdigest()},
            'selected':rows[16:24],
            'bodies_inspected':0
          }
          open('tfg1_holdout_selection.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tfg1-holdout-selection-${{ github.run_id }}
          path: tfg1_holdout_selection.json
          retention-days: 14
