name: metabolism-cycle
# Metabolism V10 — Chain Runner.  INERT by default.
#
# Orchestrates the full agenda→propose→adjudicate→build chain by dispatching
# the existing stage workflows sequentially (R-V10-5: no stage logic duplicated).
#
# Inputs:
#   lobe   — single lobe id (empty = all loop-managed lobes; "til" = main lobe)
#   stages — full | sense | through-adjudicate (default: full)
#   force_run — bypass AUTONOMY_PAUSED (ops verification only)
#
# Cron: every 6h at :35 (offset from the daily chain) — gated by METAB_PACE:
#   single → extra crons always no-op (today's behavior preserved)
#   2x     → 1 extra cycle per day
#   4x     → 3 extra cycles per day
# Per-cycle budget caps (IMMUTABLE from V9) still bound each cycle.
#
# KILL SWITCH — the AUTONOMY_PAUSED repo variable (R-AUT-2):
#   gh variable set AUTONOMY_PAUSED --body true    # re-arm the pause (default-safe)
#   gh variable set AUTONOMY_PAUSED --body false   # arm the loop (operator-only)
# Absent OR anything other than the literal 'false' → clean no-op.
#
# Double-gated: if: vars.AUTONOMY_PAUSED != 'true' in the job condition
# AND the script itself re-checks AUTONOMY_PAUSED=='false' before proceeding.

on:
  schedule:
    # Hourly at :35 — budget gate controls actual run frequency
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      lobe:
        description: "Single lobe id; empty = all loop-managed lobes; til = main lobe"
        type: string
        default: ""
      stages:
        description: "Which stages to run"
        type: choice
        options:
          - full
          - sense
          - through-adjudicate
        default: full
      force_run:
        description: "Force even when AUTONOMY_PAUSED=true (ops verification only)"
        type: boolean
        default: false
      run_until_continue:
        description: "Internal: continuation trigger from auto-run mode"
        type: boolean
        default: false
      depth:
        description: "Internal: auto-run recursion depth (max 30)"
        type: string
        default: "0"

permissions:
  actions: write    # dispatch sub-workflows + poll run list + re-trigger
  contents: write   # narrow-commit key_budget_status.json

concurrency:
  group: metabolism-cycle
  cancel-in-progress: false

jobs:
  cycle:
    # KILL SWITCH — absent variable → treated as paused (default-safe).
    if: vars.AUTONOMY_PAUSED != 'true'
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: python 3.12 (Homebrew venv - self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip

      - name: install deps
        run: pip install --quiet pyyaml anthropic

      - name: CYCLE (chain runner — agenda→propose→adjudicate→build)
        env:
          AUTONOMY_PAUSED: ${{ vars.AUTONOMY_PAUSED }}
          METAB_PACE: ${{ vars.METAB_PACE }}
          METAB_INTENSITY: ${{ vars.METAB_INTENSITY }}
          METAB_KEYS_ENABLED: ${{ vars.METAB_KEYS_ENABLED }}
          METAB_RUN_UNTIL: ${{ vars.METAB_RUN_UNTIL }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          LOBE_INPUT: ${{ github.event.inputs.lobe }}
          STAGES_INPUT: ${{ github.event.inputs.stages }}
          RUN_UNTIL_CONTINUE: ${{ github.event.inputs.run_until_continue }}
          DEPTH_INPUT: ${{ github.event.inputs.depth }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # ── Gate 1: AUTONOMY_PAUSED double-gate ─────────────────────────
          AP="$(printf '%s' "${AUTONOMY_PAUSED:-}" | tr '[:upper:]' '[:lower:]')"
          FR="$(printf '%s' "${FORCE_RUN:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "$AP" != "false" ] && [ "$FR" != "true" ]; then
            echo "AUTONOMY_PAUSED not 'false' (=${AUTONOMY_PAUSED:-<unset>}) — clean no-op."
            exit 0
          fi

          # ── Gate 2: PACE / BUDGET GATE ────────────────────────────────────────
          EVENT="${GITHUB_EVENT_NAME:-}"
          _RUN_UNTIL="${METAB_RUN_UNTIL:-off}"
          _RU_CONTINUE="${RUN_UNTIL_CONTINUE:-false}"
          _DEPTH="${DEPTH_INPUT:-0}"
          # Clamp depth to integer; bash 3.2 safe arithmetic
          _DEPTH="$(python -c "import sys; d=int('${_DEPTH}' or 0) if '${_DEPTH}'.isdigit() else 0; print(d)")"

          if [ "$EVENT" = "schedule" ] || [ "$_RU_CONTINUE" = "true" ]; then
            # Auto-run mode active?
            if [ "$_RUN_UNTIL" = "5h_max" ] || [ "$_RUN_UNTIL" = "weekly_max" ]; then
              echo "METAB_RUN_UNTIL=$_RUN_UNTIL — consulting budget gate..."
              _VERDICT_FILE="${RUNNER_TEMP:-/tmp}/budget_verdict_$$.json"
              python -m engine.metabolism.budget_gate --mode "$_RUN_UNTIL" --write-status > "$_VERDICT_FILE" 2>/dev/null || echo '{}' > "$_VERDICT_FILE"
              echo "budget gate verdict: $(cat "$_VERDICT_FILE")"
              _ALL_DONE="$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('all_done','false'))" "$_VERDICT_FILE" 2>/dev/null || echo false)"
              _ELIGIBLE="$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d.get('eligible_keys',[])))" "$_VERDICT_FILE" 2>/dev/null || echo 1)"
              _REASON="$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('reason',''))" "$_VERDICT_FILE" 2>/dev/null || echo '')"
              if [ "$_ALL_DONE" = "True" ] || [ "$_ALL_DONE" = "true" ]; then
                echo "::notice::Budget target reached ($_RUN_UNTIL) — auto-run disarmed."
                gh variable set METAB_RUN_UNTIL --body "off" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
                echo "### Auto-run complete" >> "$GITHUB_STEP_SUMMARY"
                echo "Target reached for mode \`$_RUN_UNTIL\`. METAB_RUN_UNTIL reset to off." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if [ "${_ELIGIBLE:-0}" -eq 0 ]; then
                echo "No eligible keys (reason: $_REASON) — waiting on window reset; no-op."
                exit 0
              fi
              echo "Budget gate: $_ELIGIBLE eligible key(s) — proceeding with chain."
            else
              # Not armed: fall back to LOOPS-per-5h-window pace gate
              _ALLOWED="$(python -c "from engine.metabolism.throttle import pace_loops_per_window; print(pace_loops_per_window())" 2>/dev/null || echo 1)"
              # Count schedule-event runs in the trailing 5 hours (excluding current run)
              _NOW_EPOCH="$(python -c "import time; print(int(time.time()))")"
              _CURRENT_RUN="${GITHUB_RUN_ID:-}"
              _GH_JSON="$(gh run list --workflow metabolism-cycle.yml --json createdAt,event,databaseId --limit 50 2>/dev/null || echo '[]')"
              _COUNT="$(python -c "import json,sys; rows=json.loads(sys.argv[1]); now=int(sys.argv[2]); cur=sys.argv[3]; cutoff=now-5*3600; n=sum(1 for r in rows if r.get('event')=='schedule' and str(r.get('databaseId',''))!=cur and r.get('createdAt') and __import__('datetime').datetime.fromisoformat(r.get('createdAt','').replace('Z','+00:00')).timestamp()>=cutoff); print(n)" "$_GH_JSON" "$_NOW_EPOCH" "$_CURRENT_RUN" 2>/dev/null || echo 0)"
              echo "METAB_PACE loops_per_window=$_ALLOWED runs_in_trailing_5h=$_COUNT"
              if [ "${_COUNT:-0}" -ge "${_ALLOWED:-1}" ]; then
                echo "pace gate: $_COUNT/$_ALLOWED loops already run in trailing 5h — no-op."
                exit 0
              fi
              echo "pace gate: $_COUNT/$_ALLOWED — proceeding."
            fi
          else
            # dispatch event (not a continuation): manual floor gate
            echo "dispatch event — checking manual floor..."
            _MANUAL_VERDICT_FILE="${RUNNER_TEMP:-/tmp}/budget_manual_$$.json"
            python -m engine.metabolism.budget_gate --mode manual > "$_MANUAL_VERDICT_FILE" 2>/dev/null || echo '{}' > "$_MANUAL_VERDICT_FILE"
            _BLOCKED="$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('blocked','false'))" "$_MANUAL_VERDICT_FILE" 2>/dev/null || echo false)"
            if [ "$_BLOCKED" = "True" ] || [ "$_BLOCKED" = "true" ]; then
              _REASON="$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('reason',''))" "$_MANUAL_VERDICT_FILE" 2>/dev/null || echo '')"
              echo "::error::All keys are >=90% of weekly limits — a loop likely cannot finish. Blocked until a weekly window resets. (reason: $_REASON)"
              exit 1
            fi
            echo "Manual floor gate: not blocked — proceeding."
          fi

          # ── Mint CYCLE_ID ─────────────────────────────────────────────────
          CYCLE_ID="$(python -c 'from scripts.metabolism_journal import new_cycle_id; print(new_cycle_id())')"
          echo "cycle_id=$CYCLE_ID"

          STAGES="${STAGES_INPUT:-full}"
          LOBE="${LOBE_INPUT:-}"
          echo "stages=$STAGES lobe=${LOBE:-<all>}"

          # ── Helper: dispatch a stage workflow and poll to completion ──────
          # dispatch_and_wait <workflow_file> [<key=value> ...]
          # Passes key=value pairs as -f flags to gh workflow run.
          # Polls every 30s; times out after ~35 min (70 iterations).
          # On failure: logs and continues (never silently wedges the chain).
          _STAGE_CONCLUSIONS=""

          dispatch_and_wait() {
            local _WF="$1"
            shift
            local _FLAGS=""
            for _kv in "$@"; do
              _FLAGS="$_FLAGS -f $_kv"
            done

            echo "--- dispatching $_WF $_FLAGS ---"
            local _BEFORE
            _BEFORE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            # shellcheck disable=SC2086
            gh workflow run "$_WF" $_FLAGS --repo "$GITHUB_REPOSITORY" || {
              echo "::warning::dispatch failed for $_WF — skipping wait"
              _STAGE_CONCLUSIONS="${_STAGE_CONCLUSIONS}${_WF}=dispatch_failed "
              return 0
            }

            # Brief pause so the run appears in the list
            sleep 15

            # Find the newest run of this workflow created after $_BEFORE.
            # NOTE: a bare timestamp in --created is an EXACT-instant match;
            # the ">=" prefix makes it a created-at-or-after range filter.
            local _RUN_ID=""
            local _ATTEMPTS=0
            while [ -z "$_RUN_ID" ] && [ "$_ATTEMPTS" -lt 10 ]; do
              _RUN_ID="$(gh run list \
                --workflow "$_WF" \
                --repo "$GITHUB_REPOSITORY" \
                --created ">=$_BEFORE" \
                --json databaseId,createdAt,status \
                --jq 'sort_by(.createdAt) | reverse | .[0].databaseId // empty' \
                2>/dev/null || true)"
              _ATTEMPTS=$((_ATTEMPTS + 1))
              [ -z "$_RUN_ID" ] && sleep 10
            done

            if [ -z "$_RUN_ID" ]; then
              echo "::warning::could not find run for $_WF — assuming dispatched"
              _STAGE_CONCLUSIONS="${_STAGE_CONCLUSIONS}${_WF}=run_not_found "
              return 0
            fi

            echo "found run id=$_RUN_ID for $_WF — polling..."

            # Poll to completion (30s interval, max 70 iterations = ~35 min)
            local _ITER=0
            local _CONCLUSION=""
            while [ "$_ITER" -lt 70 ]; do
              local _STATUS
              _STATUS="$(gh run view "$_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --json status,conclusion \
                --jq '[.status, (.conclusion // "")] | join(":")' \
                2>/dev/null || echo "unknown:")"
              local _S
              _S="${_STATUS%%:*}"
              _CONCLUSION="${_STATUS##*:}"

              if [ "$_S" = "completed" ]; then
                echo "$_WF run=$_RUN_ID completed conclusion=$_CONCLUSION"
                _STAGE_CONCLUSIONS="${_STAGE_CONCLUSIONS}${_WF}=${_CONCLUSION} "
                return 0
              fi

              echo "$_WF run=$_RUN_ID status=$_S (iter=$_ITER)..."
              _ITER=$((_ITER + 1))
              sleep 30
            done

            echo "::warning::$_WF run=$_RUN_ID timed out after ~35 min — continuing chain"
            _STAGE_CONCLUSIONS="${_STAGE_CONCLUSIONS}${_WF}=timeout "
          }

          # ── Stage chain ───────────────────────────────────────────────────
          # force_run propagates to every stage (each re-gates on
          # AUTONOMY_PAUSED itself; without propagation a forced cycle would
          # dispatch four clean no-ops — misleading for ops verification).
          # Plain string + unquoted expansion (word-splits away when empty):
          # macOS bash 3.2 errors on empty-array "${a[@]}" under set -u.
          _FR_FLAG=""
          if [ "$FR" = "true" ]; then
            _FR_FLAG="force_run=true"
          fi

          # agenda always runs (sense stage = stop after agenda)
          # shellcheck disable=SC2086
          dispatch_and_wait "metabolism-agenda.yml" \
            "cycle_id=$CYCLE_ID" $_FR_FLAG

          if [ "$STAGES" = "sense" ]; then
            echo "stages=sense — stopping after agenda."
          else
            # propose: pass lobe when non-empty
            # shellcheck disable=SC2086
            if [ -n "$LOBE" ]; then
              dispatch_and_wait "metabolism-propose.yml" \
                "cycle_id=$CYCLE_ID" \
                "lobe=$LOBE" $_FR_FLAG
            else
              dispatch_and_wait "metabolism-propose.yml" \
                "cycle_id=$CYCLE_ID" $_FR_FLAG
            fi

            # shellcheck disable=SC2086
            dispatch_and_wait "metabolism-adjudicate.yml" \
              "cycle_id=$CYCLE_ID" $_FR_FLAG

            if [ "$STAGES" = "through-adjudicate" ]; then
              echo "stages=through-adjudicate — stopping after adjudicate."
            else
              # shellcheck disable=SC2086
              dispatch_and_wait "metabolism-build.yml" \
                "cycle_id=$CYCLE_ID" $_FR_FLAG
            fi
          fi

          # ── Final summary ─────────────────────────────────────────────────
          echo "--- metabolism-cycle $CYCLE_ID complete ---"
          echo "stage conclusions: ${_STAGE_CONCLUSIONS:-none}"

          # ── Auto-run continuation ──────────────────────────────────────────
          # Re-read METAB_RUN_UNTIL live so that STOP button wins mid-run.
          _RUN_UNTIL_LIVE="$(gh variable get METAB_RUN_UNTIL --repo "$GITHUB_REPOSITORY" 2>/dev/null | tr -d '[:space:]' || echo 'off')"
          if [ "$_RUN_UNTIL_LIVE" = "5h_max" ] || [ "$_RUN_UNTIL_LIVE" = "weekly_max" ]; then
            if [ "${_DEPTH:-0}" -lt 30 ]; then
              # Re-check budget gate before scheduling next iteration
              _NEXT_VERDICT_FILE="${RUNNER_TEMP:-/tmp}/budget_next_$$.json"
              python -m engine.metabolism.budget_gate --mode "$_RUN_UNTIL_LIVE" > "$_NEXT_VERDICT_FILE" 2>/dev/null || echo '{}' > "$_NEXT_VERDICT_FILE"
              _NEXT_ALL_DONE="$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('all_done','false'))" "$_NEXT_VERDICT_FILE" 2>/dev/null || echo false)"
              _NEXT_ELIGIBLE="$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d.get('eligible_keys',[])))" "$_NEXT_VERDICT_FILE" 2>/dev/null || echo 0)"
              if [ "$_NEXT_ALL_DONE" = "True" ] || [ "$_NEXT_ALL_DONE" = "true" ]; then
                echo "::notice::Auto-run target reached after chain — disarming METAB_RUN_UNTIL."
                gh variable set METAB_RUN_UNTIL --body "off" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
              elif [ "${_NEXT_ELIGIBLE:-0}" -gt 0 ]; then
                _NEXT_DEPTH="$(python -c "print(int('${_DEPTH}' or 0) + 1)")"
                echo "Auto-run: scheduling continuation at depth $_NEXT_DEPTH..."
                # Depth cap is per continuation-origin chain (depth resets to 0 on
                # each fresh hourly cron trigger, which always starts a new chain).
                # The all_done disarm above is what bounds total work — depth cap is
                # a safety backstop only.  The concurrency group serializes runs so
                # at most one chain is active at any moment.
                gh workflow run metabolism-cycle.yml \
                  -f "run_until_continue=true" \
                  -f "depth=$_NEXT_DEPTH" \
                  --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
              else
                echo "No eligible keys for next iteration — waiting for window reset."
              fi
            else
              echo "Auto-run depth limit (30) reached — stopping auto-run chain."
            fi
          fi

      - name: publish budget status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Write fresh status snapshot
          python -m engine.metabolism.budget_gate --mode manual --write-status 2>/dev/null || true

          # Narrow-commit: ONLY data/metabolism/key_budget_status.json
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/metabolism/key_budget_status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "key_budget_status.json unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "metab: update key_budget_status.json [skip ci]"

          # Rebase-tolerant push (same idiom as signal-foundry.yml)
          for i in 1 2 3 4 5; do
            git fetch origin main || true
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "pushed key_budget_status.json on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i lost race; re-syncing"
            sleep $((i * 5))
          done
          echo "could not push key_budget_status.json after 5 attempts (non-fatal)"
          exit 0

      - name: notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOKEN" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="[Metabolism] metabolism-cycle run failed: ${RUN_URL}" || true
