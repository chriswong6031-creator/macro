name: marketing-publish
# ─────────────────────────────────────────────────────────────────────────────
# D02 W1 — scheduled LIVE social publisher. DARK BY DEFAULT.
#
# Runs on ubuntu-latest (NOT the self-hosted macstudio): this must stay OFF the
# nightly render path. It posts APPROVED, DUE outbox items to X via Buffer using
# scripts.marketing_publisher.
#
# WHY IT IS SAFE / DARK: the runner self-downgrades to DRY-RUN unless the global
# kill-switch is on (engine.marketing.sentinel.publish_enabled() reads env
# MARKETING_PUBLISH_ENABLED ∈ {1,true,yes}). The kill-switch is a repo VARIABLE
# (vars.MARKETING_PUBLISH_ENABLED) — the single source of truth; `1` = armed,
# `0`/absent = dark. With it off the run posts NOTHING and the ledger does not
# change, so the commit-back step is a clean no-op. `--live` is passed
# unconditionally BECAUSE that downgrade guard makes it harmless until the
# operator opts in (scripts/marketing_publisher.py: `live = bool(args.live) and
# kill_on`).
#
# HOW TO ARM IT (operator — one click in the admin Publisher panel; the panel
# writes the variable for you, see docs/marketing_publisher_runbook.md §6):
#   1. Repo secret    BUFFER_TOKEN              = a Buffer personal API token
#      (the panel's token paste-box sets this via `gh secret set BUFFER_TOKEN`)
#   2. Repo VARIABLE  MARKETING_PUBLISH_ENABLED = 1   (the kill-switch; the panel
#      ARM toggle sets it — `0` or absent to disarm). This is a VARIABLE, not a
#      secret; any lingering old SECRET of the same name is IGNORED by this run.
#   3. config/marketing.yml  publish.channels.flagship = the Buffer channel id
#      (discover it: BUFFER_TOKEN=... python -m scripts.marketing_publisher --list-channels)
# Set MARKETING_PUBLISH_ENABLED to 0 (or the panel DISARM) at any time to
# instantly revert every path to dry-run — that is the kill switch / rollback.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # 30-minute Pacific signal ladder — 28 rungs, S1=4:00 AM … S28=5:30 PM PT
    # (cadence masterplan §5; operator re-spec 2026-07-27, widened from 19 rungs
    # at 45 min on 2026-07-28, #3904). Sweep every 30 min across the 00:00–23:30
    # UTC window that covers that grid in BOTH PDT and PST — 30 sweeps/day, EVERY
    # day. The window spans 00:00,00:30 and 01:00..23:30 because the last rung
    # lands at 00:30Z in PDT and 01:30Z in PST.
    #
    # A sweep is NO LONGER capped at one post (#3913). It used to be: an item
    # inside the 10-min global floor deferred to the next sweep, which made the
    # CRON GRID the unit of volume — 30 sweeps/day meant 30 posts/day
    # network-wide however many the desks generated, and every dropped sweep cut
    # into that. publish.max_forward_book_min now books such an item at the
    # moment the floor clears (Buffer customScheduled) instead of deferring, so
    # the spacing is unchanged and the floor is the real governor: ~6 posts/hr,
    # bounded by a tape-freshness horizon. The humanizing jitter still scatters
    # off the round minute. Breaking/news fire via event-driven dispatch
    # (workflow_dispatch below), unlimited and off the cron.
    #
    # The ~22:30 UTC nightly (daily.yml) also commits the outbox ledger; the
    # sweeps overlapping it use a retry-rebase push loop, and the ledgers carry
    # merge=union (.gitattributes) so a concurrent append resolves instead of
    # conflicting the loop to death. The checkout is SHALLOW — see the step.
    - cron: "0,30 0,1,11-23 * * *"
  workflow_dispatch:          # manual runs (still dark unless the secret is set)
    inputs:
      post_now_item:
        description: >-
          BREAKING DISPATCH — outbox item id(s), comma-separated. Restricts the
          run to those items, approves them regardless of publish.auto_approve,
          and sends them immediately (ignoring their ladder slot). Every safety
          gate still runs. Leave blank for a normal sweep. The admin Outbox
          "Post now" button fills this in.
        required: false
        default: ""
      skip_jitter:
        description: >-
          Skip the humanizing jitter sleep. Automatic for a post_now_item
          dispatch — a breaking post should not wait out a random delay.
        required: false
        type: boolean
        default: false

permissions:
  contents: write             # commit changed outbox ledgers back to main

concurrency:
  # Never let two publisher runs overlap (double-post guard is also in the
  # runner, but non-overlapping runs keep the ledger writes serialized too).
  group: marketing-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest    # OFF the render path — never the macstudio pool
    # 25m is plenty NOW THAT THE CHECKOUT IS SHALLOW (see fetch-depth below).
    # It was not before: on 2026-07-28 the full-history checkout ran the entire
    # 25m and was CANCELLED mid-clone, so `run publisher` never executed and the
    # desk network published nothing all day. Raising the cap is the wrong lever
    # — the clone grows nightly, so any fixed wall is a future outage. Keep the
    # checkout shallow and this budget stays generous.
    timeout-minutes: 25
    env:
      BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
      # Kill-switch: a repo VARIABLE (single source of truth), NOT a secret. The
      # admin Publisher panel's ARM/DISARM toggle writes it. `1` = armed; `0` or
      # absent = dark. No secrets.* fallback on purpose — a lingering old secret
      # of this name must NOT keep the publisher live after the toggle is off.
      MARKETING_PUBLISH_ENABLED: ${{ vars.MARKETING_PUBLISH_ENABLED }}
    steps:
      - name: checkout (shallow + write token)
        # SHALLOW ON PURPOSE (2026-07-28). This was fetch-depth: 0 and the clone
        # of this heavy-churn repo grew past the 25m job timeout — the 12:58Z
        # sweep spent 12:58:08→13:23:07 inside `checkout` and was cancelled with
        # every later step skipped, so the publisher never ran and NOTHING went
        # out that day. Nothing here needs history: the runner reads the outbox
        # ledgers at HEAD, and the commit step below commits one row on top of
        # main and pushes it. The push loop deepens to 20 so `pull --rebase`
        # always has a merge base even when main advanced mid-run.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        # pyyaml: config/marketing.yml load. pandas+pyarrow: the tape gate's
        # earnings-day guard reads data/earnings/earnings.parquet (fail-soft —
        # the guard degrades open if the import or file is missing).
        run: pip install --quiet pyyaml pandas pyarrow

      - name: humanizing jitter
        # Spread posts off perfectly round cron times (Actions cron is already
        # best-effort ~0-15m late; this adds a little scatter so the account never
        # posts on the exact same wall-clock minute). Capped at 2m (was 5m, was
        # 10m): now that the ladder runs 30 sweeps/day, a big per-sweep sleep is
        # wasted runner time AND the 10-min global floor already paces posting, so
        # 2m is plenty of de-sync. Well clear of the 25m job timeout.
        #
        # SKIPPED on a breaking dispatch (masterplan §6): a "post now" click must
        # not sit out a random sleep. Any post_now_item implies skip_jitter.
        #
        # The event_name guard is deliberate belt-and-braces: on a `schedule` run
        # the `inputs` context is empty, and rather than depend on how GitHub
        # coerces a missing property against '' (it compares as equal, so the
        # bare form also works), this makes the scheduled lane provably identical
        # to before this input existed. The scheduled lane is not a place to be
        # clever about expression semantics we cannot run locally.
        if: >-
          ${{ !(github.event_name == 'workflow_dispatch'
                && (inputs.skip_jitter || inputs.post_now_item != '')) }}
        run: sleep $((RANDOM % 120))

      - name: fetch full-universe live quotes (tape gate input)
        # AFTER the jitter sleep so the snapshot is as fresh as possible at post
        # time. The live-data orphan branch carries a ~2k-symbol quotes.json
        # refreshed every 5 min in RTH (15-min-delayed prices). The publisher's
        # tape gate (engine/marketing/live_verify.py) uses it to re-verify every
        # item against TODAY's tape before posting — the content plan was
        # written off yesterday's close. Fail-soft: without the snapshot the
        # gate falls back to site/live/quotes.json + the sp500 heatmap, and
        # holds any signal it cannot verify.
        run: |
          if git fetch --depth 1 origin live-data && \
             git show FETCH_HEAD:quotes.json > data/marketing/live_quotes_snapshot.json 2>/dev/null; then
            echo "live quotes snapshot: $(wc -c < data/marketing/live_quotes_snapshot.json) bytes"
          else
            echo "::warning::live-data quotes unavailable — tape gate falls back to site/live artifacts"
            rm -f data/marketing/live_quotes_snapshot.json
          fi

      - name: run publisher (dark until the kill-switch secret is set)
        env:
          # Breaking dispatch: empty on every scheduled sweep, so the normal
          # ladder run is byte-identical to before this input existed.
          POST_NOW_ITEM: ${{ inputs.post_now_item }}
        run: |
          # --live is safe here: with MARKETING_PUBLISH_ENABLED unset the runner
          # runs DRY-RUN, posts nothing, and writes no status transitions.
          if [ -n "${POST_NOW_ITEM:-}" ]; then
            echo "breaking dispatch — restricting this run to: $POST_NOW_ITEM"
            python -m scripts.marketing_publisher --live --post-now "$POST_NOW_ITEM"
          else
            python -m scripts.marketing_publisher --live
          fi

      - name: poll post metrics (dark until BUFFER_TOKEN is set)
        # Reads back per-post analytics (impressions/likes/reposts/… + the x.com
        # permalink) for items posted in the last 7 days and appends them to
        # data/marketing/post_metrics.jsonl. Metrics refresh ~daily, so this runs
        # every slot to keep the console current. Fully independent of the
        # kill-switch: with BUFFER_TOKEN unset it prints one line and exits 0
        # (no network, no write) — so it is harmless while the publisher is dark.
        run: python -m scripts.marketing_metrics_poll

      - name: commit changed outbox ledgers (no-op when nothing changed)
        # Only persist ledger state when ARMED. While dark the dry-run writes a
        # throwaway activity row we must NOT commit to main — else every dark run
        # would spam main with no-op commits. The kill-switch is now a repo
        # VARIABLE whose disarmed value is the literal "0" (non-empty), so this
        # guard tests `== '1'` (armed), NOT `!= ''` — otherwise a disarmed "0"
        # would wrongly commit the dry-run's audit row.
        if: always() && env.MARKETING_PUBLISH_ENABLED == '1'
        run: |
          set -uo pipefail
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          # Stage ONLY the marketing ledgers — never touch other paths. A dry-run
          # (dark mode) still appends a publisher_dry_run activity row, which is a
          # legitimate audit trail; a live run additionally advances statuses AND
          # appends posted receipts to publications.jsonl (the Channels page
          # reader). post_metrics.jsonl (one level up from outbox/) is the metrics
          # poller's append-only ledger — staged alongside so a fetched analytics
          # row lands on main with the same commit. Absent (poller dark) → no-op.
          git add data/marketing/outbox 2>/dev/null || true
          git add data/marketing/publications.jsonl 2>/dev/null || true
          git add data/marketing/post_metrics.jsonl 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "marketing-publish: no ledger changes to commit"
            exit 0
          fi

          git commit -m "marketing-publish: outbox run $(date -u +%FT%H:%MZ) [skip ci]"

          # Retry-rebase push loop to tolerate races with the nightly/other lanes
          # (mirrors seo-director.yml push mechanics). --autostash parks nothing
          # here since everything is already committed above.
          for i in 1 2 3 4 5; do
            # --depth 20: the checkout is shallow, so a bare fetch would leave
            # `pull --rebase` without a merge base once main advances. 20 covers
            # any realistic mid-run drift; the ledgers themselves carry
            # merge=union (.gitattributes) so a concurrent nightly commit to the
            # same JSONL resolves instead of conflicting.
            git fetch --depth 20 origin main || true
            # Drop any untracked file that shadows an origin/main path (a mid-run
            # commit could TRACK a path we wrote as an untracked side-effect,
            # which would make the rebase checkout refuse). Everything we publish
            # is already committed, so such a path is a throwaway local write.
            comm -12 <(git ls-files --others --exclude-standard | LC_ALL=C sort) \
                     <(git ls-tree -r --name-only origin/main | LC_ALL=C sort) \
              | while IFS= read -r f; do rm -f -- "$f" || true; done
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "marketing-publish: pushed ledger on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "marketing-publish: push attempt $i lost a race; re-syncing"
            sleep $((i * 7))
          done

          echo "::warning::marketing-publish: could not push ledger after 5 attempts (non-fatal)"
          exit 0
