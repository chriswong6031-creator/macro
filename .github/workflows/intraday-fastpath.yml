name: intraday-fastpath
# The LIVE FAST-PATH (the fast/slow split): recompute the cheap price-sensitive leaves
# + mark the nightly GTAA allocations to a live(-ish) price -> site/live/overlay.json.
# The slow regime/conviction/brain layer stays in the nightly US build; THIS refreshes
# only the price-driven layer intraday. Reads the nightly baselines (site/stockdata/*,
# masterminds_latest.json) committed by the US-evening build.
#
# FEED: 15-min-delayed Polygon/Yahoo today (build_live_overlay stamps delayed_min +
# marks stale legs honestly). When a real-time/websocket plan (Alpaca / Polygon
# advanced) lands, flip config `live.delayed_min: 0` — NO code change here.
#
# CADENCE: every 30 min during US RTH (enabled 2026-07-02). The small live artifacts
# (overlay.json + risk_state.json) commit to main -> each run fires a Pages deploy; this is
# the accepted trade-off for a live Market State on the static deploy. If the deploy volume
# ever becomes a problem, the next step is to move these OFF main to a side branch (like
# live-quotes.yml pushes quotes.json to `live-data`); at a true 10-min / real-time cadence
# it graduates to a native systemd timer on the box (Actions cron is best-effort ~15-45 min).
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 11-21 * * 1-5"   # :00 + :30, 11:00-21:30 UTC, Mon-Fri.
                                    # Extended from 13:00 to 11:00 UTC (= 07:00 ET) to cover the
                                    # US premarket window (07:00–09:30 ET).
                                    # Extended from 20:30 to 21:30 UTC so the post-close ticks
                                    # exist YEAR-ROUND: in EST (winter) the 16:00 ET closing bell
                                    # is 21:00 UTC, which the old 20:30 cutoff missed entirely —
                                    # the S&P heatmap's closing-bell refresh (step below) needs a
                                    # tick after the close in both EDT and EST.
                                    # Steps 1–3 (regime/overlay/risk-state) are RTH-gated below
                                    # and remain no-ops before 13:00 UTC, preserving today's
                                    # behavior exactly. Step 4 (basket pulse) runs on ALL ticks.

permissions:
  contents: write

concurrency:
  group: intraday-fastpath
  cancel-in-progress: true

jobs:
  fastpath:
    runs-on: [self-hosted, macstudio]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: python 3.12 (Homebrew venv — self-hosted runner)
        run: |
          VENV="$HOME/.cache/mm-venv-${RUNNER_NAME:-default}"
          [ -x "$VENV/bin/python" ] || /opt/homebrew/bin/python3.12 -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
      - run: pip install -r requirements.txt
      - name: regime freshness self-heal (re-stamp latest.json if the store advanced past it)
        # Fast (~25s), cancellation-proof catch-up for the nightly staleness bug: when the price
        # store's last SPY close is newer than data/regime/latest.json's date (a late daily-collection
        # commit, or the heavy nightly build cancelled at its timeout before the engine commit), this
        # re-runs the regime engine so the macro.html regime badge + Market State board as-of follow
        # the latest close. No-ops when already fresh. See scripts/refresh_regime_if_stale.py.
        # RTH-gated: premarket ticks (UTC < 13:00) skip this step; behavior unchanged vs prior cron.
        run: |
          UTC_HOUR=$(date -u +%H)
          if [ "$UTC_HOUR" -lt 13 ]; then
            echo "UTC hour $UTC_HOUR < 13 — premarket tick, skipping regime self-heal (RTH gate)"
            exit 0
          fi
          python -m scripts.refresh_regime_if_stale
      - name: build live overlay (fast leaves + live-marked GTAA allocations)
        # RTH-gated: premarket ticks (UTC < 13:00) skip this step; behavior unchanged vs prior cron.
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          UTC_HOUR=$(date -u +%H)
          if [ "$UTC_HOUR" -lt 13 ]; then
            echo "UTC hour $UTC_HOUR < 13 — premarket tick, skipping live overlay (RTH gate)"
            exit 0
          fi
          python -m scripts.build_live_overlay
      - name: build live risk-state (fast Market State on live prices -> live/risk_state.json)
        # Recomputes ONLY the price-driven Market State legs on live(-ish) prices and carries the slow
        # legs from the freshened nightly baseline (runs AFTER the self-heal so nightly_asof is current).
        # risk_state_live.js polls the output to patch the macro.html headline/score/date + live pill.
        # RTH-gated: premarket ticks (UTC < 13:00) skip this step; behavior unchanged vs prior cron.
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          UTC_HOUR=$(date -u +%H)
          if [ "$UTC_HOUR" -lt 13 ]; then
            echo "UTC hour $UTC_HOUR < 13 — premarket tick, skipping risk-state build (RTH gate)"
            exit 0
          fi
          python -m scripts.build_risk_state
      - name: S&P 500 heatmap live refresh (15-min-delayed splice -> site/marketdata/sp500_heatmap.json)
        # The committed heatmap feed was otherwise only rebuilt inside the nightly render
        # (~23:45 ET), so macro.html / sector_heatmap.html showed the PRIOR day's close for
        # the whole session. This rebuilds it with the live Polygon splice (source=polygon-live,
        # fresh 1D) every 30 min through RTH; the post-close ticks (16:0x/16:3x ET) capture the
        # settled closing-bell print. Offline-safe: with no key or a failed fetch the build
        # falls back to the close cache, and any failure is non-fatal — the last committed
        # payload keeps serving. Market-cap sizing on this fresh checkout comes from the
        # committed payload itself (caps recycle, see _load_caps_from_prev_payload).
        # RTH-gated: premarket ticks (UTC < 13:00) skip this step.
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          UTC_HOUR=$(date -u +%H)
          if [ "$UTC_HOUR" -lt 13 ]; then
            echo "UTC hour $UTC_HOUR < 13 — premarket tick, skipping heatmap refresh (RTH gate)"
            exit 0
          fi
          python -m scripts.build_sp500_heatmap || \
            echo "::warning::sp500 heatmap live refresh failed (non-fatal; nightly payload keeps serving)"
      - name: restore intraday bars cache (read-only — no save; fastpath reads but never writes data/)
        # Mirrors the intraday-` restore-key used by intraday.yml and daily.yml.
        # Restore-only: this job never writes back (HOUSE-U5 — intraday writes site/live/ only).
        uses: actions/cache/restore@v4
        with:
          path: data/intraday
          key: intraday-${{ github.run_id }}-fastpath-readonly
          restore-keys: intraday-
      - name: intraday flow fastpath (site/live/flow_pulse.json — all ticks)
        # Computes VWAP, volume durability, higher-lows from today's cached hourly bars.
        # Zero data/ writes (HOUSE-U5). Exit-0-always — never breaks the deploy.
        run: |
          set +e
          python -m scripts.build_intraday_flow --mode fastpath
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::build_intraday_flow fastpath failed (rc=$rc, non-fatal)"
          fi
          exit 0
      - name: basket pulse (all ticks — pre|RTH|post session; site/live/basket_pulse.json)
        # Consumes the already-fetched live-quotes snapshot from the live-data branch.
        # Runs on EVERY tick (07:00 ET through the post-close ticks), not just RTH, so the premarket
        # basket tape is available from 07:00 ET. Exit-0-always per FT-R5/FT-R8.
        run: |
          # Fetch the full live-quotes snapshot from the live-data branch (written every
          # 10 min by live-quotes.yml on ubuntu-latest). Pipe into /tmp so we don't stage it.
          git fetch origin live-data:refs/remotes/origin/live-data 2>/dev/null || true
          git show origin/live-data:quotes.json > /tmp/quotes_live.json 2>/dev/null || echo '{"quotes":{}}' > /tmp/quotes_live.json
          LIVE_QUOTES_PATH=/tmp/quotes_live.json python -m scripts.build_basket_pulse || \
            echo "::warning::basket_pulse build failed (non-fatal)"
      - name: notify turn events (FTR W10 — Discord alerts on IGNITION / shock / tape disagreement)
        # Evaluates three event sources (turn_watch.json, shock_state.json, basket_pulse.json)
        # and sends Discord messages via DISCORD_WEBHOOK_WATCHLIST.
        # Absent webhook → dark mode (exit 0). Own try/except inside the script.
        # Dedup: site/live/notify_state.json (site-only write, FT-R5). Staged below.
        env:
          DISCORD_WEBHOOK_WATCHLIST: ${{ secrets.DISCORD_WEBHOOK_WATCHLIST }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m scripts.notify_turn_events || \
            echo "::warning::notify_turn_events failed (non-fatal)"
      - name: commit live overlay + risk-state + refreshed regime as-of
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # Stage the served live artifacts (site/live/* is gitignored -> force-track, like site/stockdata)
          # + the (maybe) refreshed regime as-of + Market State snapshot that the page reads its date from.
          git add -f site/live/overlay.json site/live/risk_state.json site/live/market_drivers.json site/live/shock_state.json site/live/basket_pulse.json site/live/flow_pulse.json site/live_config.js
          # S&P heatmap live refresh (tracked file; guard for the premarket ticks that skip the build)
          git add site/marketdata/sp500_heatmap.json 2>/dev/null || true
          # TS-U0: stage the lastgood sidecar so it survives the next checkout and
          # is available to the post-close tick's last_rth serve path. Guard with
          # || true since it may not exist on a tick that produced no live/delayed compute.
          git add -f site/live/basket_pulse_lastgood.json 2>/dev/null || true
          git add -f site/live/flow_pulse_lastgood.json 2>/dev/null || true
          # notify_state.json is only written when an alert actually fires (or webhook is absent on
          # first tick — dark mode never creates the file). Guard with || true so a missing file on
          # the common no-event / dark-mode tick does NOT abort the commit step under bash -eo pipefail.
          git add -f site/live/notify_state.json 2>/dev/null || true
          git add -f data/regime/latest.json data/market_state/latest.json
          # W6a SENTINEL STAGING LAW: regime_stale_selfheal writes to data/reflexes/
          # when it fires. Stage the directory so a self-heal firing commit is never
          # left as unstaged tracked changes (which would cause git pull --rebase to
          # abort with "unstaged changes" and silently lose the data).
          git add -f data/reflexes/ 2>/dev/null || true
          # Discard the forward-grading byproducts engine.run also touches (regime_history.parquet,
          # regime_one.json, base_effect_fwd.jsonl, *_log.jsonl, *_log.parquet ...). The NIGHTLY build is
          # their canonical once-per-session writer; committing them from a 30-min fast path would append
          # duplicate intraday rows and corrupt the forward measurement. Reverting the unstaged tracked
          # changes also leaves a clean tree so `git pull --rebase` below can never fail on a dirty tree.
          git checkout -- . 2>/dev/null || true
          git clean -fdq data/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "no live/regime change"; exit 0; fi
          git commit -m "live: intraday overlay + risk-state + heatmap + regime freshness $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then echo "pushed (attempt $i)"; exit 0; fi
            git rebase --abort 2>/dev/null || true; echo "push attempt $i lost a race"; sleep $((i * 5))
          done
          echo "::warning::could not push live artifacts after 5 attempts (non-fatal)"
