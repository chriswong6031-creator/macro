      # month (2026-06-14 → 2026-07-10, TypeError on every collect run) — the upsert
      # must keep accepting aware timestamps against the naive parquet columns.
      - "engine/universe_history.py"
      - "tests/test_universe_history.py"
      # W4 outcome spine: the shared signal-id→outcome contract + partial-pooling + badge passport.
