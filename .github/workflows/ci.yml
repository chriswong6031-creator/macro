name: ci
# Pre-merge guards for the committed site. Runs on PRs that touch site/ so a
# blank-page regression (a malformed inline <script> that aborts the page IIFE)
# shows up as a red check BEFORE it reaches main — complementing the same guard
# that gates the Pages deploy in pages.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check_inline_js.py"
      - "scripts/check_site_js.py"
      - "scripts/check_nav_gap.py"
      - "scripts/check_nav_mega.py"
      - "scripts/check_board_contradictions.py"
      # title-i18n guard: bilingual/CJK text must never sit in a title= attribute.
      - "scripts/check_title_i18n.py"
      # conflict-marker guard: a merge must never ship literal <<<<<<< / ======= / >>>>>>> lines.
      - "scripts/check_conflict_markers.py"
      - "templates/**"
      - ".github/workflows/ci.yml"
      # Signal→chart §7 contract: any change to the schema, validator, engine, or build script
      # must re-prove the contract still holds (see the signal-contract job below).
      - "research/signal_engine/SCHEMA.json"
      - "scripts/validate_signals.py"
      - "scripts/build_signal_quality.py"
      - "engine/signal_quality.py"
      - "tests/test_validate_signals.py"
      # W1d trial-budget gate: any new multiple-testing harness must register its budget.
      - "scripts/*_phase0.py"
      - "scripts/*_phase1.py"
      - "scripts/validate_*.py"
      - "scripts/check_trial_registration.py"
      - "engine/trial_ledger.py"
      - "engine/grading.py"
      - "engine/track_record.py"
      - "engine/sector_signals.py"
      - "engine/meta_label.py"
      - "tests/test_grading.py"
      - "tests/test_trial_ledger.py"
      - "tests/test_trial_registration_lint.py"
      # W4 outcome spine: the shared signal-id→outcome contract + partial-pooling + badge passport.
      - "engine/spine.py"
      - "engine/pooling.py"
      - "engine/passport.py"
      - "engine/desk_scorer.py"
      - "engine/alert_triage.py"
      - "engine/altdata_signals.py"
      - "scripts/check_badge_passport.py"
      - "tests/test_spine.py"
      - "tests/test_pooling.py"
      # audit #46 reliability-contract guard: a gated-out field must not render directionally.
      - "scripts/check_reliability_contract.py"
      - "engine/btc_leverage_cascade.py"
      - "engine/options_flow.py"
      - "templates/**"
      # W1.5 cycle-intelligence gates: ontology JS drift, forward-log writer, grading_stats.
      - "scripts/gen_ontology_js.py"
      - "engine/cycle_ontology.py"
      - "site/cycle_ontology.js"
      - "engine/cycle_forward_log.py"
      - "tests/test_cycle_forward_log.py"
      - "engine/grading_stats.py"
      - "tests/test_grading_stats.py"
      # W3.6 cross-page cycle-consistency gate (R3-M3): same instrument must show the
      # same pos_v2/phase_v2 across every page (cycle/country/markets/sector) or carry a
      # declared basis label.  Also the phase-coherence regression (pos_v2 vs phase_v2).
      - "scripts/check_cycle_consistency.py"
      - "tests/test_cycle_consistency.py"
      - "tests/test_cycle_ontology.py"
      # 2026-07-02 rot sweep (engine-render-guards job): these files broke silently on
      # main because no CI job ran them. engine/** is broad on purpose — most of these
      # tests pin engine contracts (display-only firewalls, unit guards, honesty layer).
      - "engine/**"
      - "scripts/build_site.py"
      - "scripts/audit_price_basis.py"
      - "research/signal_engine/walk_forward.py"
      - "tests/test_canada_build.py"
      - "tests/test_commodity_signals.py"
      - "tests/test_fear_euphoria.py"
      - "tests/test_froth_fragility.py"
      - "tests/test_missing_tape.py"
      - "tests/test_price_basis_flip.py"
      - "tests/test_risk_lead_lag.py"
      - "tests/test_anticipation.py"
      - "tests/test_canon.py"
      - "tests/test_whitehouse_w5.py"
      # CPI net-liquidity artifact (data infrastructure): builder + contract tests
      # must re-run together so a canon-formula or stale-guard regression fails RED.
      - "scripts/build_netliq_daily.py"
      - "tests/test_build_netliq_daily.py"
      # collector-registry tripwire (#1052 post-mortem): scripts/collect.py shipped as a
      # 0-byte file and merged green because nothing here covered the collection entrypoint.
      # lib/** is included because the registry import chain runs through lib.config/lib.store.
      - "scripts/collect.py"
      - "collectors/**"
      - "lib/**"
      - "tests/test_china_news.py"
      # sector_pulse wiring tripwire (#1193 post-mortem): PR #1170 injected sector_pulse
      # into build_stock_library.py; an unrelated refactor 90 min later silently deleted
      # the block and merged green because nothing here covered the builder. The wiring
      # test pins producer (AST) + template consumer, so the builder must trigger CI.
      - "scripts/build_stock_library.py"
      - "tests/test_sector_pulse_wiring.py"
      # China Lens / Intel Hub W0.2: builder + test must re-run together so a
      # headline crash or schema drift fails RED before merging.
      - "scripts/build_intel_hub.py"
      - "tests/test_china_lens_hub.py"
      # W5a DAG conformance: any change to a workflow, the dag.yml, the checker, or
      # the test file must re-prove the conformance check still holds.
      - ".github/workflows/**"
      - "config/dag.yml"
      - "scripts/check_dag_conformance.py"
      - "tests/test_dag_conformance.py"
      # W0 PR3 synapse read-gate: any change to engine, scripts, collectors, the registry,
      # the gate script, the test, or the baseline must re-run the read-gate + Article-2 check.
      - "config/synapse.yml"
      - "scripts/check_synapse_reads.py"
      - "data/neuralweb/read_gate_baseline.json"
      - "tests/test_synapse_read_gate.py"
      - "tests/test_horizon_firewall.py"
      # neural-web program (W0): synapse.yml registry, gen_signal_bus_doc generator,
      # committed SIGNAL_BUS.md, and the three test files must all trigger the gate so a
      # config edit that produces a stale doc — or an envelope refactor that breaks
      # conformance — fails RED here before merging.  research/neuralweb/** is included
      # because the census_w0.json evidence file lives there and documents the program.
      - "scripts/gen_signal_bus_doc.py"
      - "docs/SIGNAL_BUS.md"
      - "engine/neuralweb/**"
      - "research/neuralweb/**"
      - "tests/test_signal_bus_doc.py"
      - "tests/test_synapse_registry.py"
      - "tests/test_neuralweb_envelope.py"
      # NW Rails PR-7 R4 contract governance: schema drift check + test suite.
      - "scripts/check_contract_drift.py"
      - "scripts/export_signal_contracts.py"
      - "site/factordata/contracts/artifact_manifest.json"
      - "tests/test_contract_drift.py"
      # Research Factory W1 (RF-11): authority guard, ledger schemas, state machine.
      - "scripts/research_factory*.py"
      - "scripts/*research_factory*.py"
      - "data/research_factory/**"
      - "tests/test_research_factory*.py"
      - "config/synapse.yml"
      # CPI P2 authority guard: no money-path module may read cycle-pattern lake.
      - "scripts/check_cycle_pattern_authority.py"
      - "config/cycle_pattern/**"
      - "tests/test_check_cycle_pattern_authority.py"
      # Mastermind Feedback Contract PR-A (FB-R12/R13): privacy-boundary guard.
      # Any change to the guard script, its tests, committed governance/feedback
      # artifacts, .gitignore, or operator_grading must re-prove the rail holds.
      - "scripts/check_private_boundary.py"
      - "tests/test_check_private_boundary.py"
      - "data/governance/*.json"
      - "site/mastermind/*.json"
      - ".gitignore"
      - "engine/operator_grading.py"
      - "research/MASTERMIND_FEEDBACK_CONTRACT_PROGRAM.md"
      # Ruling Graph v1: canonical case-law store, conflict checker, tests, generated docs.
      - "config/ruling_graph.yml"
      - "scripts/build_ruling_graph.py"
      - "scripts/check_ruling_conflicts.py"
      - "tests/test_ruling_graph.py"
      - "docs/NEURAL_WEB_CASE_LAW.md"
      - "site/neuralwebdata/ruling_graph.json"
      - "data/neuralweb/ruling_conflicts_allowlist.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inline-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: inline JS must parse
        run: python3 scripts/check_inline_js.py site
      # Companion guard: standalone site/*.js bundles are loaded via <script src=...>,
      # which the inline-JS guard deliberately skips — a syntax error there (e.g. the
      # smart-quote delimiters that blanked markets.html for ~2 days, PR #1004→#1353)
      # ships silently. This parses every non-vendor bundle with `node --check`.
      - name: standalone site JS must parse
        run: python3 scripts/check_site_js.py site

  nav-gap:
    # The shared nav menu (.site-nav / vector-family .topbar) has no built-in top
    # gap — it relies on each page's body top padding. A new page that zeroes its
    # body padding jams the menu against the viewport top ("menu with no padding").
    # This catches that regression BEFORE merge instead of after it ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nav menu must keep a top gap
        run: python3 scripts/check_nav_gap.py site

  nav-mega:
    # The Research nav is a shared partial (_navlinks.html.j2) whose Research entry is
    # the grouped 'nav-mega' panel. A page built OUTSIDE the routine render loop (an
    # out-of-loop page builder, or a hand-static page) can render the shared nav but
    # freeze WITHOUT the mega-menu. This catches that drift BEFORE merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shared-nav pages must carry the Research mega-menu
        run: python3 scripts/check_nav_mega.py site

  board-contradictions:
    # W2 board invariant guard: validates site/factordata/us_standouts.json for four
    # contradictions that the W8 arbiter + W6-US fix passes must prevent:
    #   (a) FRESH-BUY-ish state with stale cross or extended grade,
    #   (b) urgency=imminent on blocked label or BOTTOMING state,
    #   (c) band high/constructive while verdict is Lagging/no-clear-edge,
    #   (d) slot-1 alpha negative while positive-alpha rows exist in the same lane.
    # A build that violates any invariant fails RED here before merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # On PRs, validate the artifact ONLY when this PR actually changes it. The
      # committed artifact is regenerated by the engine-render pipeline, so a code-only
      # PR (like the one introducing this guard) must not be judged against an artifact
      # built by OLDER code. The always-on tripwire for freshly rendered artifacts
      # lives in pages.yml (deploy gate) — see the twin step there.
      # 2026-07-04 incident (#1195 run): a PR squash-merged before this job started, so by
      # run time origin/main's tip WAS the squash commit — and the old `--depth=1` fetch
      # shallow-cut it, so `origin/main...HEAD` had NO merge base. `git diff --quiet` then
      # exited fatal (non-zero), the skip branch was not taken, and the checker FAILED OPEN
      # against a stale artifact the PR never touched. Fix: fetch without --depth (checkout
      # is already fetch-depth 0), and treat a missing merge base as SKIP — fail closed to
      # the always-on deploy-gate twin in pages.yml, which grades every fresh render.
      - name: board invariants must hold when this PR ships the standouts artifact
        run: |
          git fetch origin ${{ github.base_ref }}
          if ! mb=$(git merge-base "origin/${{ github.base_ref }}" HEAD); then
            echo "no merge base with ${{ github.base_ref }} (base moved under a fast merge) — deploy-gate twin covers fresh renders; skipping"
            exit 0
          fi
          if git diff --quiet "$mb" HEAD -- site/factordata/us_standouts.json; then
            echo "us_standouts.json untouched by this PR — deploy-gate twin covers fresh renders; skipping"
            exit 0
          fi
          python3 scripts/check_board_contradictions.py site/factordata/us_standouts.json

  conflict-markers:
    # 2026-07-03 incident: a merge commit shipped literal git conflict markers
    # ('<<<<<<< ours' / '=======' / '>>>>>>> theirs') inside templates/dashboard.html.j2
    # and merged GREEN — Jinja parses marker lines as plain text, pytest never rendered
    # that block, and no other guard greps for them. This fails RED on any conflict-marker
    # line in templates/**, engine/**, scripts/**, or shipped site/** files. The self-test
    # proves the guard itself still catches known-bad fixtures before trusting its OK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard self-test (known-bad flagged, known-good clean)
        run: python3 scripts/check_conflict_markers.py --self-test
      - name: no git conflict markers in committed content
        run: python3 scripts/check_conflict_markers.py

  title-i18n:
    # The i18n rule: translated text NEVER goes in HTML attributes — the dual-span
    # l-en/l-zh mechanism cannot operate there, so a bilingual title= shows both
    # languages mashed together. This scans template SOURCE for CJK, t() calls, or
    # zh-variable interpolations inside title attributes (the fix is data-tip-en/
    # data-tip-zh + the theme.js popover, an English-only title, or no title).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no translated text in title attributes
        run: python3 scripts/check_title_i18n.py templates

  signal-contract:
    # HARD pre-merge gate for the signal→chart §7 contract (research/signal_engine/SCHEMA.json,
    # the single source of truth shared with the charting app). A PR that drifts the engine output
    # from the schema, weakens the validator, or breaks a contract rule fails RED here — the safe
    # place to block (no deploy to stall). The daily build's gate is deliberately resilient
    # (discard-bad-write, never 404 the dashboard); this is where blocking has teeth. The test
    # suite includes an engine-analyze()-conforms-to-schema check that catches forgot-to-update-
    # the-schema drift without needing data fixtures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install jsonschema pytest pandas numpy pyyaml
      - name: signal §7 contract tests
        run: python -m pytest tests/test_validate_signals.py -q

  trial-budgets:
    # W1d (audit #21): every multiple-testing harness must REGISTER its trial budget, or the
    # DSR/kill/FDR deflation it feeds is a lie. A NEW validate_*/*_phase0 script that deflates a
    # Sharpe without registering fails RED here (the ~33 pre-existing offenders are grandfathered
    # in an allowlist that only shrinks). Also runs the grading-rebuild + ledger test suites.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: trial-registration lint (no new unregistered harness)
        run: python3 scripts/check_trial_registration.py
      - name: reliability-contract guard (no gated field rendered directionally, audit #46)
        run: python3 scripts/check_reliability_contract.py
      - name: grading rebuild + trial ledger tests
        run: python -m pytest tests/test_grading.py tests/test_trial_ledger.py tests/test_trial_registration_lint.py -q

  outcome-spine:
    # W4 (audit #13/#19/#23/#41/#42): the outcome spine + partial-pooling closed loop. The
    # badge-passport ratchet (#41) fails RED if a desk brief renders a conviction badge with no
    # provenance passport; the spine/pooling tests prove the four safety properties (sign-safety,
    # trust-region, cold-start, arming) that gate grades moving deterministic weights.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: badge-passport ratchet (no new conviction badge without a passport)
        run: python3 scripts/check_badge_passport.py site
      - name: spine contract + partial-pooling safety tests
        run: python -m pytest tests/test_spine.py tests/test_pooling.py -q

  cycle-ontology-js:
    # W1.5 (A10/A12 ruling): the generated site/cycle_ontology.js must exactly match what
    # engine/cycle_ontology.py produces at HEAD.  A PR that edits the engine but forgets to
    # regenerate the JS — or hand-edits the committed JS — fails RED here.  The flag-day
    # axis-flip (ONTOLOGY_AXIS constant) makes a stale committed JS especially dangerous: it
    # could ship a half-v2 site.  Runs only when relevant files change (paths filter above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        # cycle_ontology.py imports numpy+pandas at module top (canonical_position math),
        # so gen_ontology_js — which imports it — needs them even though it only serialises
        # the vocabulary payload. pyyaml alone made this gate crash-fail whenever triggered.
        run: pip install pyyaml numpy pandas
      - name: ontology JS must not drift from engine (gen_ontology_js --check)
        run: python3 -m scripts.gen_ontology_js --check

  cycle-forward-log:
    # W1.5 (W0.2 acceptance): four acceptance criteria for the shared forward-log writer.
    # A regression here silently breaks prospective cone-coverage grading for every cycle
    # family (US sectors + country cycles).  Hard gate: the keep-FIRST invariant and
    # proj_lo/hi columns are structural contracts for W2.3+ measurement.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: forward-log writer contract tests (keep-FIRST, cone edges, never-raise)
        run: python -m pytest tests/test_cycle_forward_log.py -q

  cycle-grading-stats:
    # W1.5 (W1.1 acceptance): the grading_stats shared library must have exactly one
    # cone_coverage implementation (no silent second definition), and the China-grader
    # refactor must be numerically identical to the pre-refactor path on fixed inputs.
    # Catching a regression here is critical: this library feeds every grader in the
    # measurement engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml scipy
      - name: grading_stats library tests (wilson_ci, fdr_bh, cone_coverage, china regression)
        run: python -m pytest tests/test_grading_stats.py -q

  engine-render-guards:
    # 2026-07-02 rot sweep: these test files silently broke on main because ci.yml only
    # ran a targeted subset. They cover the template render guards (canada / fear↔euphoria /
    # froth merged card / risk-state banner), the froth display-only firewall, the
    # price-basis-flip audit, the risk-gauge honesty layer (base-rate → measured PIT
    # probs, #887), GDELT missing-tape, the commodity MTF ladder (fitted bands, #981),
    # the net-liquidity unit guard (drain-independent since RRP≈0), and the whitehouse
    # qledger import guards (order-dependence cured at the walk_forward leaker).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly pillow requests
      - name: render-guard + engine-contract tests (rot sweep 2026-07-02)
        run: >
          python -m pytest
          tests/test_canada_build.py tests/test_commodity_signals.py
          tests/test_fear_euphoria.py tests/test_froth_fragility.py
          tests/test_missing_tape.py tests/test_price_basis_flip.py
          tests/test_risk_lead_lag.py tests/test_anticipation.py
          tests/test_canon.py tests/test_whitehouse_w5.py
          tests/test_board_ledger.py tests/test_grade_us_board.py
          tests/test_options_stamp.py tests/test_sector_pulse_wiring.py
          tests/test_news_page_render.py tests/test_china_lens_hub.py
          tests/test_build_netliq_daily.py -q

  collector-registry:
    # 2026-07-03 (#1052 post-mortem): PR #1052's squash-merge shipped scripts/collect.py as
    # a 0-BYTE file. An empty module imports fine and exits 0, so every scheduled collect
    # run (daily / asia-close / weekly / backfill / intl_etf all invoke `python -m
    # scripts.collect`) became a silent no-op until #1093 restored it — and the truncation
    # merged GREEN because no CI job covered the collection entrypoint. This is the
    # tripwire: tests/test_china_news.py imports all_adapters() from scripts.collect (and
    # proves china_news registers even without akshare), and the breadth assert fails RED
    # if the registry is emptied or gutted. 105 of ~132 adapters register under these
    # minimal deps — the yfinance/akshare ones drop out by design via the registry's
    # per-module try/except — so the >100 floor holds without heavyweight installs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyyaml requests
      - name: china_news collector tests (incl. adapter-registered-without-akshare)
        run: python -m pytest tests/test_china_news.py -q
      - name: adapter registry must stay populated
        run: |
          python -c "from scripts.collect import all_adapters; n = len(all_adapters()); assert n > 100, f'adapter registry gutted: only {n} adapters registered'; print(f'{n} adapters registered')"

  cycle-consistency:
    # W3.6 (R3-M3): the SAME instrument must show the SAME pos_v2/phase_v2 across every
    # page that renders it (cycle.html flagship / country_cycles / markets.html / sector),
    # within tolerance, OR carry a declared basis label explaining the difference.  A page
    # that recomputes or freezes a stale value fails RED here.  Also runs the phase-coherence
    # regression (no pos_v2 ≥ 85 with a Trough/Recovery phase_v2 without divergence) — the
    # guard against the mixed-vocabulary bug the W3.6 kernel fix closed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: same instrument agrees across pages (or declares its basis)
        run: python3 scripts/check_cycle_consistency.py site
      - name: consistency + phase-coherence regression tests
        run: python -m pytest tests/test_cycle_consistency.py tests/test_cycle_ontology.py -q

  synapse-read-gate:
    # W0 PR3: literal-path scan over engine/*.py, scripts/*.py, collectors/*.py.
    # WARN tier (exit 0): any undeclared reader of a registered artifact.
    # HARD FAIL (exit 1): an undeclared reader that is an Article-2 money-path
    # surface (alert_triage / board_ordering / top_setups).
    # Baseline: data/neuralweb/read_gate_baseline.json (only-shrinks ratchet).
    # Runs check_synapse_registry.py (integrity, hard) first, then
    # check_synapse_reads.py (warn + Article-2 hard) + the unit test suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml
      - name: synapse registry integrity (hard gate)
        run: python3 scripts/check_synapse_registry.py
      - name: synapse read-gate — warn tier + Article-2 hard fail
        run: python3 scripts/check_synapse_reads.py
      - name: factor boundary guard (RUL-NW9/NW11 — hard fail on Article-2 writes or forbidden fields)
        run: python3 scripts/check_factor_boundaries.py
      - name: factor boundary selftest (guard fires on planted violations)
        run: python3 scripts/check_factor_boundaries.py --selftest
      - name: synapse read-gate unit tests
        run: python -m pytest tests/test_synapse_read_gate.py tests/test_horizon_firewall.py -q
      - name: factor deescalation shadow + boundary guard tests
        run: python -m pytest tests/test_factor_deescalation_shadow.py -q

  neural-web:
    # neural-web program (W0, #1253 post-mortem): three test files were run by ZERO
    # GitHub workflows before this job was added.  Without CI wiring, an edit to
    # config/synapse.yml (not under any prior ci.yml path glob) could merge GREEN with a
    # stale committed SIGNAL_BUS.md — precisely the 'merged green because no CI job
    # covered X' failure class documented in #1052 / #1193 / #1195.
    #
    # Three suites, one job:
    #   test_synapse_registry.py   — synapse.yml integrity (YAML parses, paths exist,
    #                                enums valid, duplicate-path check, validator unit tests)
    #   test_neuralweb_envelope.py — envelope helper (sibling-not-wrapper, hash stability,
    #                                stamp_if_changed byte-identity, sidecar round-trip)
    #   test_signal_bus_doc.py     — SIGNAL_BUS.md freshness gate (regenerated bytes must
    #                                match committed doc byte-for-byte; determinism; all 64
    #                                artifact ids present; Mermaid block plausible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: neural-web registry + envelope + bus-doc freshness tests
        run: python -m pytest tests/test_synapse_registry.py tests/test_neuralweb_envelope.py tests/test_signal_bus_doc.py -q

  dag-conformance:
    # W5a (Neural Web): config/dag.yml declares the per-workflow-step lane inventory;
    # scripts/check_dag_conformance.py diffs the declared sequences against the LIVE
    # .github/workflows/ files and exits 1 on any mismatch not covered by a divergences
    # entry.  ANY undeclared drift between dag.yml and the real workflow now reds CI here
    # before merging — ending the hand-sync problem.
    #
    # Three checks in sequence:
    #   1. Hard: check_dag_conformance.py against the repo (exits 1 on undeclared drift)
    #   2. Hard: pytest tests/test_dag_conformance.py (selftest + live conformance assertion)
    #
    # Suspect divergences count as covered (declared), but are PRINTED in every run
    # so they stay visible.  The suspect list may only SHRINK (only-shrinks ratchet).
    #
    # Triggers on: .github/workflows/**, config/dag.yml, the checker, and the test file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml
      - name: DAG conformance check (hard — exits 1 on undeclared lane drift)
        run: python scripts/check_dag_conformance.py --verbose
      - name: DAG conformance selftest + live conformance tests
        run: python -m pytest tests/test_dag_conformance.py -q

  research-factory-authority:
    # RF-11 (Research Factory W1): authority guard — no Article-2 money-path
    # module (alert_triage / board_ordering / top_setups) may read
    # data/research_factory/ or import engine.research_factory.  The factory
    # is display-only (A0-A2 ceiling); factory outputs must never reach the
    # scored / board-rank / alert pipeline.  Runs alongside synapse-read-gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml
      - name: authority guard (hard fail on Article-2 forbidden reads)
        run: python scripts/check_research_factory_authority.py
      - name: authority guard selftest (gate fires on planted violation)
        run: python scripts/check_research_factory_authority.py --selftest
      - name: research-factory state + schema tests
        run: python -m pytest tests/test_research_factory_state.py tests/test_research_factory_schema.py -q

  cycle-pattern-authority:
    # CPI P2: authority guard — no Article-2 money-path module (alert_triage /
    # board_ordering / top_setups) may read data/cycle_pattern/ or import the
    # cycle-pattern lake.  The CPI substrate is display-only (context tier);
    # lake outputs must never reach the scored / board-rank / alert pipeline.
    # Mirrors research-factory-authority (line 509).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml
      - name: authority guard (hard fail on money-path forbidden reads)
        run: python scripts/check_cycle_pattern_authority.py
      - name: authority guard selftest (gate fires on planted violation)
        run: python scripts/check_cycle_pattern_authority.py --selftest
      - name: cycle-pattern authority test suite
        run: python -m pytest tests/test_check_cycle_pattern_authority.py -q

  private-boundary:
    # Mastermind Feedback Contract PR-A (FB-R12/R13): privacy-boundary guard.
    # Verifies that data/private/ and data/operator/ are gitignored, and that
    # committed feedback artifacts carry only counts — no tickers, fill/position/
    # decision IDs, host paths, dollar amounts, or secret env-var patterns.
    # Mirrors cycle-pattern-authority structure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest
      - name: privacy-boundary guard selftest (gate fires on planted violations)
        run: python3 scripts/check_private_boundary.py --selftest
      - name: privacy-boundary guard (hard fail on committed private fields or missing rail)
        run: python3 scripts/check_private_boundary.py
      - name: privacy-boundary test suite
        run: python3 -m pytest tests/test_check_private_boundary.py -q

  ruling-graph:
    # Ruling Graph v1 (RUL-CL-1/6/7/8/11/12): canonical case-law registry guard.
    # Checks that:
    #   - committed site JSON + case-law doc match YAML regeneration (--check)
    #   - conflict checker finds no hard violations in changed files
    #   - conflict checker selftest fires on planted violations
    #   - all test_ruling_graph.py assertions pass
    # The graph is display-only (RUL-CL-12: authority_ceiling A1_EXPLAIN).
    # Mirrors cycle-pattern-authority pattern.
    # fetch-depth 0 + explicit base fetch: the checker needs `git merge-base HEAD
    # origin/main` for its diff-scoped H1/H2/W1 scans. On a shallow checkout there
    # is no base ref, the checker degrades to skip-diff-checks, and the job goes
    # green while guarding nothing — the #1195 shallow-cut incident class (see the
    # board-contradictions job above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml
      - name: build check (committed outputs match YAML regeneration byte-for-byte)
        run: python scripts/build_ruling_graph.py --check
      - name: conflict checker (hard fail on new FDR family or privacy boundary violations)
        run: |
          git fetch origin ${{ github.base_ref || 'main' }}
          RULING_DIFF_BASE="origin/${{ github.base_ref || 'main' }}" python scripts/check_ruling_conflicts.py
      - name: conflict checker selftest (gate fires on planted violations)
        run: python scripts/check_ruling_conflicts.py --selftest
      - name: ruling graph test suite
        run: python -m pytest tests/test_ruling_graph.py -q

  contract-drift:
    # NW Rails PR-7 (R4 contract governance): checks that each artifact in
    # site/factordata/contracts/artifact_manifest.json has not drifted from the
    # live artifact's actual top-level JSON fields.  A bot consuming china_standouts
    # with a stale schema contract has no handshake — this makes drift visible at PR
    # merge time rather than at trade time.
    #
    # Warn-first ratchet: exits 0 even on drift during the initial accrual week so
    # this never blocks a deploy on its first day.  Flip --warn-only to hard-fail
    # after one clean week: 2026-07-13.
    #
    # Wildcard artifacts (per_stock_intel, per_stock_signal) are skipped when no
    # live sample is present (normal on CI runners without the full stockdata store).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: contract drift check (warn-only ratchet — flip to hard-fail 2026-07-13)
        run: python scripts/check_contract_drift.py --warn-only
      - name: contract drift unit tests
        run: python -m pytest tests/test_contract_drift.py -q
