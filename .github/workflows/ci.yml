      # Tech-Lab parity fixtures: the ~24 STRUCTURAL checks (fields, warmup
      # nulls, RSI range, band ordering, value-area >=70%) are platform-
      # independent and run here.  TestFixtureDeterminism is DESELECTED: it
      # regenerates the fixtures and demands byte-identity, which holds on
      # macOS (where the committed fixtures were generated) but NOT on
      # ubuntu-latest — expected_ribbon.json and expected_bollinger.json
      # differ in float tails (rolling std / EMA accumulation) under a
      # different numpy/BLAS build.  docs/TECH_LAB_TESTING.md asserts
      # byte-identity as a contract, so the contract itself is
      # platform-dependent; regenerating on ubuntu would just break macOS.
      # Picking a resolution (tolerance vs pinned numpy vs per-platform
      # fixtures) is an owner decision, not a wiring decision — see
      # docs/UNRUN_TEST_CENSUS.md.  Found by running this suite in CI for
      # the first time (it was named by no workflow before #3636).
      - name: tech-lab parity fixtures — structure only (determinism is platform-dependent)
        run: python -m pytest tests/test_tech_parity_fixtures.py -q
          --deselect tests/test_tech_parity_fixtures.py::TestFixtureDeterminism
