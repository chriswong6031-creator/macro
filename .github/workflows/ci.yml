        run: pip install pytest pandas numpy pyarrow pyyaml jinja2 plotly pillow requests beautifulsoup4
      - name: render-guard + engine-contract tests (rot sweep 2026-07-02)
        run: >
          python -m pytest
          tests/test_canada_build.py tests/test_commodity_signals.py
          tests/test_commodity_index.py
          tests/test_commodity_confluence.py
          tests/test_commodity_cycle_state.py
          tests/test_fear_euphoria.py tests/test_froth_fragility.py
          tests/test_missing_tape.py tests/test_price_basis_flip.py
          tests/test_risk_lead_lag.py tests/test_anticipation.py
          tests/test_risk_radar_market_catalysts.py tests/test_risk_radar_recovery.py
          tests/test_canon.py tests/test_whitehouse_w5.py
          tests/test_winner_autopsy.py tests/test_admin_long_hold.py
          tests/test_falsifier_packet.py
          tests/test_board_ledger.py tests/test_grade_us_board.py
          tests/test_options_stamp.py tests/test_sector_pulse_wiring.py
          tests/test_news_page_render.py tests/test_china_lens_hub.py
          tests/test_build_netliq_daily.py
          tests/test_ignition_radar.py
          tests/test_mag7_regime.py
          tests/test_theme_scoring_leadership_split.py
          tests/test_ignition_persistence.py
          tests/test_mag7_panel.py
          tests/test_index_momentum.py
          tests/test_cohort_flow_chips.py
          tests/test_statement_tape.py
          tests/test_backfill_options_flow.py
          tests/test_rlt_sector_stance_enrich.py
          tests/test_t0_indicator.py
          tests/test_intraday_flow.py
          tests/test_intraday_flow_stance.py
          tests/test_standout_audit.py
          tests/test_altdata_hygiene.py
          tests/test_china_news_engine.py
          tests/test_aibrief_page.py
          tests/test_aibrief_w4_panels.py
          tests/test_sa_w5_v2_grader_hook.py -q
      # house-law registry census (post-#2297 fix): run the statement-tape schema
      # guard itself against the committed registry, not just its pytest coverage.
      - name: statement-tape schema guard (FL-E / FC-R9)
        run: python -m scripts.check_statement_tape

  collector-registry:
    # timeout: this job had none (6h GitHub default) — a wedged one-shot (e.g. the
    # pyarrow exit deadlock documented in lib/procutil.py) would block PRs for hours.
    timeout-minutes: 15
    # 2026-07-03 (#1052 post-mortem): PR #1052's squash-merge shipped scripts/collect.py as
    # a 0-BYTE file. An empty module imports fine and exits 0, so every scheduled collect
    # run (daily / asia-close / weekly / backfill / intl_etf all invoke `python -m
    # scripts.collect`) became a silent no-op until #1093 restored it — and the truncation
    # merged GREEN because no CI job covered the collection entrypoint. This is the
    # tripwire: tests/test_china_news.py imports all_adapters() from scripts.collect (and
    # proves china_news registers even without akshare), and the breadth assert fails RED
    # if the registry is emptied or gutted. 105 of ~132 adapters register under these
    # minimal deps — the yfinance/akshare ones drop out by design via the registry's
    # per-module try/except — so the >100 floor holds without heavyweight installs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyyaml requests
      - name: china_news collector tests (incl. adapter-registered-without-akshare)
        run: python -m pytest tests/test_china_news.py -q
      - name: adapter registry must stay populated
        run: |
          python -c "from scripts.collect import all_adapters; n = len(all_adapters()); assert n > 100, f'adapter registry gutted: only {n} adapters registered'; print(f'{n} adapters registered')"

  cycle-consistency:
    # W3.6 (R3-M3): the SAME instrument must show the SAME pos_v2/phase_v2 across every
    # page that renders it (cycle.html flagship / country_cycles / markets.html / sector),
    # within tolerance, OR carry a declared basis label explaining the difference.  A page
    # that recomputes or freezes a stale value fails RED here.  Also runs the phase-coherence
    # regression (no pos_v2 ≥ 85 with a Trough/Recovery phase_v2 without divergence) — the
    # guard against the mixed-vocabulary bug the W3.6 kernel fix closed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: same instrument agrees across pages (or declares its basis)
        run: python3 scripts/check_cycle_consistency.py site
      - name: consistency + phase-coherence regression tests
        run: python -m pytest tests/test_cycle_consistency.py tests/test_cycle_ontology.py -q

  synapse-read-gate:
    # W0 PR3: literal-path scan over engine/*.py, scripts/*.py, collectors/*.py.
    # WARN tier (exit 0): any undeclared reader of a registered artifact.
    # HARD FAIL (exit 1): an undeclared reader that is an Article-2 money-path
    # surface (alert_triage / board_ordering / top_setups).
    # Baseline: data/neuralweb/read_gate_baseline.json (only-shrinks ratchet).
    # Runs check_synapse_registry.py (integrity, hard) first, then
    # check_synapse_reads.py (warn + Article-2 hard) + the unit test suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pyyaml pandas pyarrow requests
      - name: synapse registry integrity (hard gate)
        run: python3 scripts/check_synapse_registry.py
      - name: synapse read-gate — warn tier + Article-2 hard fail
        run: python3 scripts/check_synapse_reads.py
      - name: factor boundary guard (RUL-NW9/NW11 — hard fail on Article-2 writes or forbidden fields)
        run: python3 scripts/check_factor_boundaries.py
      - name: factor boundary selftest (guard fires on planted violations)
        run: python3 scripts/check_factor_boundaries.py --selftest
      - name: synapse read-gate unit tests
        run: python -m pytest tests/test_synapse_read_gate.py tests/test_horizon_firewall.py tests/test_delivery_waterfall.py tests/test_pricing_power_monitor.py -q
      - name: factor deescalation shadow + boundary guard tests
        run: python -m pytest tests/test_factor_deescalation_shadow.py -q
      - name: edgar 8-K item-code expansion unit tests (LHB-R7)
        run: python -m pytest tests/test_edgar_8k_items.py -q
      - name: LHB-R6 quarterly-store enrichment tag tests (no network)
        run: python -m pytest tests/test_edgar_quarterly_tags.py -q
      - name: symbol-directory archival collector tests (LHB-W2c / LHB-R8)
        run: python -m pytest tests/test_symbol_directory.py -q
      - name: winner autopsy B-family feature column tests (LHB-W3)
        run: python -m pytest tests/test_winner_autopsy.py -q

  neural-web:
    # neural-web program (W0, #1253 post-mortem): three test files were run by ZERO
    # GitHub workflows before this job was added.  Without CI wiring, an edit to
    # config/synapse.yml (not under any prior ci.yml path glob) could merge GREEN with a
    # stale committed SIGNAL_BUS.md — precisely the 'merged green because no CI job
    # covered X' failure class documented in #1052 / #1193 / #1195.
    #
    # Three suites, one job:
    #   test_synapse_registry.py   — synapse.yml integrity (YAML parses, paths exist,
    #                                enums valid, duplicate-path check, validator unit tests)
    #   test_neuralweb_envelope.py — envelope helper (sibling-not-wrapper, hash stability,
    #                                stamp_if_changed byte-identity, sidecar round-trip)
    #   test_signal_bus_doc.py     — SIGNAL_BUS.md freshness gate (regenerated bytes must
    #                                match committed doc byte-for-byte; determinism; all 64
    #                                artifact ids present; Mermaid block plausible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: neural-web registry + envelope + bus-doc freshness tests
        run: python -m pytest tests/test_synapse_registry.py tests/test_neuralweb_envelope.py tests/test_signal_bus_doc.py tests/test_admin_neural_web.py tests/test_admin_metabolism.py tests/test_admin_metabolism_history.py tests/test_entity_thesis_registry.py tests/test_check_entity_thesis_registry.py -q
      - name: "HARD | entity/thesis/mechanism registry integrity (ETM-C1..C7)"
        run: |
          python3 -m scripts.check_entity_thesis_registry --selftest
          python3 -m scripts.check_entity_thesis_registry

  neural-web-core:
    # NW Macro Context Rail R5 (PR-A): wires the five orphan NW test files that were
    # previously run by ZERO GitHub workflows.  Path-gated on engine/neuralweb/** and
    # the five test files (workflow-level on.pull_request.paths covers engine/neuralweb/**).
    # Runs: test_mastermind_context, test_confluence, test_spine_query, test_ask_brain,
    # test_world_state — all 163 tests green on origin/main e0e9f71cc6 (red-team lens 1).
    # Also: test_neuralweb_health (PR-C health builder — weekend-aware staleness,
    # collect-cadence as_of exclusion, staleness_from override, placeholder rollup).
