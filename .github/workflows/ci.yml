      - "engine/factor_exposure.py"
      - "tests/test_factor_exposure.py"
      - "tests/test_factor_exposure_stress.py"
      # audit #46 reliability-contract guard: a gated-out field must not render directionally.
      - "scripts/check_reliability_contract.py"
      - "engine/btc_leverage_cascade.py"
      - "engine/options_flow.py"
      - "templates/**"
      # W1.5 cycle-intelligence gates: ontology JS drift, forward-log writer, grading_stats.
