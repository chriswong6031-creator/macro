name: ci
# Pre-merge guards for the committed site. Runs on PRs that touch site/ so a
# blank-page regression (a malformed inline <script> that aborts the page IIFE)
# shows up as a red check BEFORE it reaches main — complementing the same guard
# that gates the Pages deploy in pages.yml.
on:
  pull_request:
    branches: [main]
    paths:
      # repo-wide pytest conftest: session fixtures/guards run in EVERY pytest
      # job, so a conftest edit must trigger the full suite (2026-07-16 #2636
      # fixture import broke 14 minimal-lane jobs without triggering ci.yml).
      - "tests/conftest.py"
      - "site/**"
      - "scripts/check_inline_js.py"
      - "scripts/check_site_js.py"
      - "scripts/check_nav_gap.py"
      - "scripts/check_nav_mega.py"
      - "scripts/check_board_contradictions.py"
      # ms-board coherence guard: a rendered Market State board must be single-snapshot
      # coherent (2026-07-07 -X theirs hybrid incident, commit 5bf116a3b3).
      - "scripts/check_ms_board_coherence.py"
      - "tests/test_check_ms_board_coherence.py"
      - "engine/market_state.py"
      # hub-a11y guard: five static a11y regressions on globe-deck pages.
      - "scripts/check_hub_a11y.py"
      - "tests/test_check_hub_a11y.py"
      # hashed-css rebase autoresolver: every render lane's push loop leans on it to not
      # silently drop a day's engine outputs (2026-07-22 asia-close run 29904079071).
      - "scripts/rebase_autoresolve_hashed_css.sh"
      - "tests/test_rebase_autoresolve_hashed_css.py"
      # font-ui guard: body-level var(--font-ui) must resolve (theme.css or local def) — #2647.
      - "scripts/check_font_ui_defined.py"
      - "tests/test_check_font_ui_defined.py"
      - "site/theme.js"
      # analytics identity capture — registered-visitor email attribution (server reads the
      # shared Supabase session cookie off the beacon) + read-side coalescing.
      - "app/main.py"
      - "admin/analytics_first_party.py"
      - "tests/test_collect_identity.py"
      # Pre-launch hardening guards (P1): the anonymous /api/collect per-IP throttle
      # (app/main.py, above), the /ws/tape per-IP connection cap, and generic
      # billing/auth 5xx errors (no raw-exception leak). Neither app/billing.py nor
      # app/tape.py triggers any other job, so a billing/tape-only PR must list them
      # here to reach the prelaunch-hardening guard below.
      - "app/billing.py"
      - "app/tape.py"
      - "tests/test_collect_throttle.py"
      - "tests/test_tape_relay.py"
      - "tests/test_billing_subscribe.py"
      # title-i18n guard: bilingual/CJK text must never sit in a title= attribute.
      - "scripts/check_title_i18n.py"
      # conflict-marker guard: a merge must never ship literal <<<<<<< / ======= / >>>>>>> lines.
      - "scripts/check_conflict_markers.py"
      # GH-annotation guard: a "::warning" behind logging's level prefix never parses as
      # an annotation. NOTE: this only fires when ci.yml is already triggered — making it
      # fire on EVERY python change needs "scripts/**"/"engine/**" here, which is a
      # CI-cost call for the operator (it would run the whole pack on most PRs).
      - "tests/test_gh_annotation_line_start.py"
      # template↔site sync guard: plain-copy page assets must byte-match their templates.
      - "scripts/check_template_site_sync.py"
      # ?v= stamp lane guard (ui.asset_stamp): the sweep that moves a stamp, and the
      # ordering/staging contract the lanes must keep for it to survive to main. The
      # lane YAMLs themselves already reach this via ".github/workflows/**" below.
      - "scripts/optimize_assets.py"
      - "tests/test_optimize_assets.py"
      - "tests/test_asset_stamp_lane_order.py"
      - "tests/test_asset_stamp_refresh.py"
      # interfonts guard: _interfonts.html.j2 @font-face blocks must match theme.css.
      - "scripts/check_interfonts_sync.py"
      # data-base shim guard: every builder writes site/**/*.html via lib.pages.write_page,
      # or the page's per-ticker fetches miss the R2 reroute in a standalone run. Unwired
      # until now, which let build_leader_radar's raw write_text sit red on main.
      - "lib/pages.py"
      - "tests/test_site_shim.py"
      - "scripts/inject_data_base.py"
      # inline-CSS externalization units (same lib/pages page-rewrite family).
      - "tests/test_externalize_css.py"
      - "scripts/externalize_css.py"
      - "templates/**"
      # inline-CSS externalization sweep: it must never touch the plain-copy HTML
      # pairs (index.html/chat.html). Without these two entries a PR that edits
      # only the sweep or its tests never triggers ci.yml, and the guard below is
      # decorative — the trap that left 1135 suites run by no workflow (#3509).
      - "scripts/externalize_css.py"
      - "tests/test_externalize_css.py"
      # SEO meta rollout guard (D12A): template-source SEO head/desc contract.
      - "tests/test_seo_meta_rollout.py"
      - ".github/workflows/ci.yml"
      # Research Vault (RV W1) ingestion spine: sidecar contract, corpus FTS,
      # catalog, and the idempotent never-raise ingest pipeline. (RV W3) adds the
      # SSR page builder + its render test + the page template.
      - "engine/research_vault/**"
      - "scripts/ingest_research.py"
      - "scripts/build_research_vault.py"
      - "tests/test_research_vault.py"
      # Research Vault (RV W2) serving API + download gate: quota ledger, view
      # rate-limit, watermark, the app/research.py router + its security tests.
      - "app/research.py"
      - "app/main.py"
      - "tests/test_research_api.py"
      # Research Vault (RV W3) page + viewer: page test + template.
      - "tests/test_research_vault_page.py"
      - "templates/research_vault.html.j2"
      # Research Vault SEO landing pages (programmatic SEO): per-report page
      # generator + its templates + test.
      - "scripts/build_research_pages.py"
      - "templates/research_report.html.j2"
      - "templates/research_index.html.j2"
      - "tests/test_research_pages.py"
      # Signal→chart §7 contract: any change to the schema, validator, engine, or build script
      # must re-prove the contract still holds (see the signal-contract job below).
      - "research/signal_engine/SCHEMA.json"
      - "scripts/validate_signals.py"
      - "scripts/build_signal_quality.py"
      - "engine/signal_quality.py"
      - "tests/test_validate_signals.py"
      # W1d trial-budget gate: any new multiple-testing harness must register its budget.
      - "scripts/*_phase0.py"
      - "scripts/*_phase1.py"
      - "scripts/validate_*.py"
      - "scripts/check_trial_registration.py"
      - "engine/trial_ledger.py"
      - "engine/grading.py"
      - "engine/track_record.py"
      - "engine/sector_signals.py"
      - "engine/meta_label.py"
      - "tests/test_grading.py"
      - "tests/test_trial_ledger.py"
      - "tests/test_trial_registration_lint.py"
      - "tests/test_no_literal_ntrials.py"
      # membership-ledger tz guard: a tz-aware asof froze the PIT universe ledger for a
      # month (2026-06-14 → 2026-07-10, TypeError on every collect run) — the upsert
      # must keep accepting aware timestamps against the naive parquet columns.
      - "engine/universe_history.py"
      - "tests/test_universe_history.py"
      # W4 outcome spine: the shared signal-id→outcome contract + partial-pooling + badge passport.
      - "engine/spine.py"
      - "engine/pooling.py"
      - "engine/passport.py"
      - "engine/desk_scorer.py"
      # The desk that FEEDS the spine. engine/spine.py registers data/stock_desk/scored.jsonl
      # in _DESK_SCORED, but nothing wrote that file, so 45 decided outcomes never reached
      # engine.pooling and the cross-desk family was one member (ai_desk) in practice. Neither
      # the module nor its suite carried a trigger — the file that decides what a desk
      # contributes to the pooled weights could not start ci.yml at all (same class as the
      # tier-gate hole, #3509). Its suite runs in the outcome-spine job below.
      - "engine/stock_desk.py"
      - "tests/test_stock_desk.py"
      - "engine/alert_triage.py"
      - "engine/altdata_signals.py"
      - "scripts/check_badge_passport.py"
      - "tests/test_spine.py"
      - "tests/test_pooling.py"
      # Promotion gate (#3495/#3523): the per-desk empirical null and the Calibration Hub
      # verdicts it feeds. These files carried NO trigger — a change to the module that
      # decides whether a desk is "calibrated" could not start ci.yml at all, so its own
      # suites never ran on the PR that changed it (same class as the tier-gate hole, #3509).
      - "engine/desk_placebo.py"
      - "engine/calibration_hub.py"
      - "engine/thematic_desk.py"
      - "tests/test_desk_placebo.py"
      - "tests/test_calibration_hub.py"
      - "tests/test_thematic_desk.py"
      # The Phase-C desks that WRITE the scored ledgers spine._DESK_SCORED reads. The engine
      # modules are already covered by engine/**, but no job ran these suites at all, so a
      # silent break in any of them moved the deterministic desk-weight vector
      # (spine.adapt_desk_scorer → desk_scorer.desk_weights → pooling.arming) with zero CI
      # signal — and a test-only edit could not even start ci.yml (ci-test-whitelist-rot
      # guard). Registry coverage: ai_desk (ai_desk + ai_desk_scorer), radar + narrative_brain
      # (radar_scorer reuses ai_desk_scorer's eval verbatim), demand_chain (demand_ledger),
      # policy_intent. Run in the outcome-spine job below.
      - "tests/test_ai_desk.py"
      - "tests/test_ai_desk_scorer.py"
      - "tests/test_radar_scorer.py"
      - "tests/test_narrative_brain.py"
      - "tests/test_demand_ledger.py"
      - "tests/test_policy_intent_desk.py"
      # WRI W3: watchlist book-structure math + its node-shelled unit tests. templates/**
      # already covers risk_core.js/watchlist_risk.js; list the test file so a test-only
      # edit still triggers CI (ci-test-whitelist-rot guard).
      - "tests/test_risk_core_js.py"
      - "templates/risk_core.js"
      - "templates/watchlist_risk.js"
      # TXI W4 watchlist chain lane: the node-shelled chain-lane helper tests (furthest chain
