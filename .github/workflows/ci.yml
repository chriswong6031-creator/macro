      # collectors/** already covers edgar_facts.py; backfill script and test
      # need explicit paths so a test-only or script-only change still re-runs.
      - "scripts/backfill_edgar_quarterly.py"
      - "tests/test_edgar_quarterly_tags.py"
      # IRD-W2 engines: EM stress, contagion/DY spillover, CB desk
