concurrency:
  # A newer commit on the same PR makes every older result obsolete.  Cancelling
  # it here prevents rapid agent pushes from leaving full packed runs in queue.
  # Manual full-CI dispatches are also deduplicated per ref; several ship-loop
  # sessions may request the same main proof at once, but only the newest matters
  # — how that dedup survives WITHOUT killing a running proof is the 2026-08-09
  # block below.
  #
  # A MERGED close is fenced into its own group (2026-07-28). The operator and
  # sessions routinely squash-merge 0-8 minutes after opening while a pack run
  # takes ~35, and the `closed` event landing in the live group cancelled the
  # PR's own in-flight proof run — the merged head then carried `cancelled`
  # packs FOREVER (PR #3867: merged at +3 min, both packs died, no verdict
  # possible), which is how unproven merges stack up on main and every
  # ship-loop session pins on the next full-CI dispatch. Measured 2026-07-28:
  # 100 ci.yml runs in 8h, 6 successes, 67 cancelled/skipped. A close WITHOUT
  # merge keeps the old behaviour — its packs are obsolete and cancelling them
  # is pure savings; only a merge's evidence is worth finishing.
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'closed' && github.event.pull_request.merged && '-merged' || '' }}
  # cancel-in-progress became EVENT-CONDITIONAL 2026-08-09, after the flat `true`
  # livelocked main's proof path fleet-wide (12 merge-blocked + 56 cap-deferred
  # pull requests; sweep run 31311549150 reported "0 main commit(s) classified …
  # main proof: NO clean name at unknown-sha, undated").
  #
  # THE LIVELOCK. This workflow has no `push` trigger, so main is proven ONLY by
  # a workflow_dispatch. Every main-ref dispatch lands in `ci-refs/heads/main`,
  # and with a flat `true` each new one KILLED the proof already running: run
  # 31309720615 (11:00:26Z) was cancelled at 11:44:49Z — 44 minutes in, near the
  # end of a 30-34 minute-per-pack run — by dispatch 31311537537, which was
  # itself cancelled four minutes later by 31311693575. No proof ever concludes,
  # so merge_on_green's base-inherited-red refresh stays closed, so more sessions
  # pin and re-fire the documented `gh workflow run ci.yml --ref main` lever, so
  # the next proof dies too. The recovery lever WAS the disease.
  #
  # The fix keeps both behaviours because they belong to different events:
  #   pull_request  -> true.  A newer push obsoletes the older packs; cancelling
  #                    them is pure savings, and the merged-close fence above
  #                    (2026-07-28, PR #3867) still decides which close cancels.
  #   workflow_dispatch -> false.  A dispatch is an ORDER FOR EVIDENCE. Evidence
  #                    that is 44 minutes old is nearly evidence; discarding it
  #                    for an identical run that starts from zero is never right.
  # Dedup is NOT lost: GitHub allows one PENDING run per group and replaces it
  # regardless of this flag, so N racing dispatches still collapse to "the one
  # running + the newest queued". Only the kill is gone. Progress is therefore
  # guaranteed — the same argument that flipped integration-baseline.yml to
  # `false` on 2026-08-07, and the same shape as the sweeper's own anti-stampede
  # bound (`MAIN_BASELINE_MIN_INTERVAL_MINUTES`, scripts/merge_on_green.py).
  #
  # Note the group expression partitions by event type: a pull_request run always
  # has `pull_request.number`, a dispatch never does, so `ci-refs/heads/main`
  # holds dispatches ONLY. Every run in a given group evaluates this expression
  # to the same value, which is why the fix does not depend on whether GitHub
  # reads the flag from the arriving run or the in-progress one.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # PLAN ONCE, EXECUTE MANY, ADJUDICATE ONCE. `ci-plan` is the sole selection and
  # partition authority. Its v2 artifact binds the exact tested tree, PR subject
  # head, tested base, changed-file digest, logical jobs, semantic proof IDs, and
  # execution-spec digests. Packs consume that artifact verbatim and emit raw
  # bounded observations; they never recompute the proof universe or declare
  # causality. `ci-gate` reconciles complete accounting into the one stable
  # `ci.semantic_evidence.v1` verdict. Pack indices remain transport only.
  #
  # This is a proof-semantics boundary, not the CI SPEED wave. Pack count,
  # weighting, runner fleet, dependency caching, and existing scope selection are
  # deliberately unchanged here.
  ci-plan:
    # Same closed-event fence as `ci-pack` below: a closed PR needs only the
    # workflow-level concurrency side effect above.
    if: github.event.action != 'closed'
    name: ci-plan
    runs-on: ubuntu-latest
    # Planning loads one manifest and diffs one base; 30 minutes is a hang bound,
    # not a budget. `ci-pack` keeps its own 180.
    timeout-minutes: 30
    # NOTHING UNBOUNDED MAY BE AN OUTPUT (2026-08-14, run 31775693780). A job
    # output becomes an `env:` string in the consuming job, and execve caps a
    # single one at 131,072 bytes on Linux; the retired `changed_files` output
    # measured 350,264 bytes on PR #5578 and killed all twelve packs at launch
    # with "Argument list too long" before one test ran. Its replacement is the
    # 64-character digest below, which is also inside the hashed plan payload —
    # so the list travels as the `ci-changed-files` artifact while its identity
    # still rides this trusted channel and `--expect-plan-sha` still pins it.
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      plan_sha: ${{ steps.plan.outputs.plan_sha }}
      reason: ${{ steps.plan.outputs.reason }}
      changed_files_sha256: ${{ steps.plan.outputs.changed_files_sha256 }}
      changed_files_count: ${{ steps.plan.outputs.changed_files_count }}
      plan_artifact_name: ${{ steps.identity.outputs.plan_artifact_name }}
      tested_tree_sha: ${{ steps.identity.outputs.tested_tree_sha }}
      subject_head_sha: ${{ steps.identity.outputs.subject_head_sha }}
      tested_base_sha: ${{ steps.identity.outputs.tested_base_sha }}
      semantic_role: ${{ steps.identity.outputs.semantic_role }}
    steps:
      # NO sparse-clear step and NO setup-node here, unlike `ci-pack` below. Both of
      # those exist for conditions this job cannot meet: the sparse-clear guards a
      # SHARED self-hosted workspace, and this job is hosted-only (one `runs-on`, no
      # self-hosted branch), so it gets a fresh VM and can never inherit a sibling's
      # `core.sparseCheckout`; and setup-node exists for the legacy jobs' Node steps,
      # which planning never executes. Adding either would be cargo cult.
      - uses: actions/checkout@v4
        with:
          # Semantic evidence binds the exact tree this runner executes. A PR
          # run proves GitHub's synthetic merge commit, not a later API-resolved
          # branch tip, so make the event SHA explicit.
          ref: ${{ github.sha }}
          # `fetch-depth: 0` is REQUIRED, not an optimisation. The planner derives
          # the tested base from parent 1 of this exact synthetic merge commit, and
          # a shallow clone may not contain that commit — the diff would fail, the planner would widen to the full
          # suite by law, and the plan would be meaningless on every PR. The
          # blob:none filter keeps full history cheap. Packs do NOT repeat this
          # fetch: they download the `ci-changed-files` artifact and
          # shallow-checkout.
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: identity
        name: bind the exact tested tree and base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_DISPATCH_SHA: ${{ inputs.expected_sha || '' }}
        run: |
          set -euo pipefail
          tested_tree_sha=$(git rev-parse HEAD)
          if [ "$tested_tree_sha" != "$GITHUB_SHA" ]; then
            echo "::error title=ci-tested-tree::checkout $tested_tree_sha does not match event SHA $GITHUB_SHA"
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$EXPECTED_DISPATCH_SHA" ]; then
            if ! [[ "$EXPECTED_DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$GITHUB_SHA" != "$EXPECTED_DISPATCH_SHA" ]; then
              echo "::error title=ci-tested-tree::dispatch expected $EXPECTED_DISPATCH_SHA but main resolved to $GITHUB_SHA"
              exit 1
            fi
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            read -r merge_sha tested_base_sha subject_head_sha extra < <(git rev-list --parents -n 1 "$GITHUB_SHA")
            if [ "$merge_sha" != "$GITHUB_SHA" ] || [ -z "${tested_base_sha:-}" ] || [ -z "${subject_head_sha:-}" ] || [ -n "${extra:-}" ]; then
              echo "::error title=ci-tested-base::PR event SHA is not an exact two-parent merge commit"
              exit 1
            fi
            if [ "$subject_head_sha" != "$EVENT_HEAD_SHA" ]; then
              echo "::error title=ci-tested-base::merge parent 2 $subject_head_sha does not match event head $EVENT_HEAD_SHA"
              exit 1
            fi
            semantic_role=pr_head
          else
            subject_head_sha=$GITHUB_SHA
            tested_base_sha=$GITHUB_SHA
            semantic_role=main
          fi
          {
            echo "tested_tree_sha=$tested_tree_sha"
            echo "subject_head_sha=$subject_head_sha"
            echo "tested_base_sha=$tested_base_sha"
            echo "semantic_role=$semantic_role"
            echo "plan_artifact_name=ci-semantic-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"
      - name: install isolated pack runner
        run: |
          python -m venv "$RUNNER_TEMP/ci-plan-runner"
          "$RUNNER_TEMP/ci-plan-runner/bin/pip" install pyyaml
      # Same `env`-built, UNQUOTED shell-argument idiom as the pack step below, and
      # for the same two reasons: a folded `>-` scalar tolerates no `#` and no
      # varying indent, and an empty `CI_SCOPE_ARG` must word-split away to nothing
      # so main's baseline and every workflow_dispatch stay full-suite.
      #
      # The authoritative tested base is parent 1 of the exact synthetic merge
      # commit checked out above. The event's base SHA is trigger provenance and may
      # be stale by runner pickup; a branch name is mutable and is never substituted.
      # Parent 2 must equal the signed event head before this value is published.
      - id: plan
        name: plan the CI packs once
        env:
          # Scope mode governs WHICH jobs are eligible; matrix mode governs only
          # which pack indices are EMITTED. They are deliberately separate switches.
          # Both are active unless the matching repository variable is exactly
          # `off` (2026-08-13). A leftover `shadow` from the first deployment
          # would otherwise keep copying every main-red onto every pull request
          # — a nightly data pin in one legacy job failed all twelve packs on
          # every armed head. `off` is each one's emergency full-suite kill
          # switch. Main's workflow_dispatch still omits --changed-from and
          # therefore still audits the complete manifest.
          CI_SCOPE_MODE: ${{ vars.CI_SCOPE_MODE == 'off' && 'off' || 'active' }}
          CI_DYNAMIC_MATRIX_MODE: ${{ vars.CI_DYNAMIC_MATRIX_MODE == 'off' && 'off' || 'active' }}
          CI_SCOPE_ARG: ${{ github.event_name == 'pull_request' && format('--changed-from {0}', steps.identity.outputs.tested_base_sha) || '' }}
          TESTED_TREE_SHA: ${{ steps.identity.outputs.tested_tree_sha }}
          SUBJECT_HEAD_SHA: ${{ steps.identity.outputs.subject_head_sha }}
          TESTED_BASE_SHA: ${{ steps.identity.outputs.tested_base_sha }}
          SEMANTIC_ROLE: ${{ steps.identity.outputs.semantic_role }}
        run: >-
          "$RUNNER_TEMP/ci-plan-runner/bin/python" scripts/run_ci_pack.py
          --workflow .github/ci/legacy-jobs.yml
          --pack-count 12
          --plan-only
          --github-output "$GITHUB_OUTPUT"
          --emit-plan-json "$RUNNER_TEMP/ci-semantic-plan/ci-plan.json"
          --emit-changed-files "$RUNNER_TEMP/ci-changed-files/changed-files.json"
          --workflow-run-id "$GITHUB_RUN_ID"
          --workflow-name ci
          --event "$GITHUB_EVENT_NAME"
          --role "$SEMANTIC_ROLE"
          --tested-tree-sha "$TESTED_TREE_SHA"
          --subject-head-sha "$SUBJECT_HEAD_SHA"
          --base-sha "$TESTED_BASE_SHA"
          $CI_SCOPE_ARG
      # THE CHANGED-FILE LIST'S TRANSPORT (2026-08-14, run 31775693780). An
      # artifact rather than a job output, because a job output becomes an `env:`
      # string in the consuming job and execve caps a single one at 131,072
      # bytes; this list is unbounded by nature — 350,264 bytes on PR #5578,
      # which killed all twelve packs at launch before one test ran.
      #
      # UNCONDITIONAL, deliberately. `run_ci_pack.py` writes the file on BOTH
      # exits of the plan step: the resolved list on success, the token `null` on
      # the planner-fallback path where it swallows its exception and exits 0.
      # Packs launch only when this whole job succeeded, so "a pack is running"
      # implies "this artifact exists" — which is what lets the pack-side
      # download be a hard failure instead of a silent widen.
      #
      # `if-no-files-found: error` is the fail-closed half: a missing file must
      # red the planner, not hand twelve packs an empty download and a scope
      # nobody chose. 14 days outlives any armed PR's useful life.
      - name: publish the changed-file list
        uses: actions/upload-artifact@v4
        with:
          name: ci-changed-files
          path: ${{ runner.temp }}/ci-changed-files/changed-files.json
          if-no-files-found: error
          retention-days: 14
      - name: publish the authoritative semantic plan
        if: steps.plan.outputs.plan_sha != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.identity.outputs.plan_artifact_name }}
          path: ${{ runner.temp }}/ci-semantic-plan/ci-plan.json
          if-no-files-found: error
          retention-days: 14
  ci-pack:
    needs: ci-plan
    # A closed PR needs only the workflow-level concurrency side effect above.
    # Skipping here cancels the obsolete pack without allocating a replacement.
    #
    # The `has_work` clause is the Wave B addition, and it is safe only because
    # `has_work: false` is an AFFIRMATIVE planner proof that no legacy job is
    # selected. Every uncertainty widens instead: a planner exception, an unknown
    # top-level path, a global invalidator, or a failed git diff all emit all twelve
    # indices with `has_work: true`. And a no-work PR is still PROVEN, because
    # `ci-gate` below publishes a real success on that path — the merge-on-green
    # sweeper requires an affirmative pass, since absence of red is not a pass
    # (#4779), so a PR whose only packs were skipped would otherwise read unproven
    # and never merge.
    if: github.event.action != 'closed' && needs.ci-plan.outputs.has_work == 'true'
    # The logical jobs in .github/ci/legacy-jobs.yml remain the reviewable
    # source of truth, but GitHub sees only this matrix. Twelve pack runners
    # execute every legacy run step against a clean working tree, sharing one
    # checkout and reusing only identical dependency sets instead of
    # provisioning more than one hundred separate VMs/check records.
    #
    # Four, up from two (operator 2026-07-28): two packs put ~35 minutes
    # between a PR opening and a verdict, and the operator + sessions merge in
    # 0-8 — the whole merge-outruns-CI class lives in that gap. The greedy
    # partition balances 4x619 weight against 2x1238 (run_ci_pack.py
    # --validate-only), so wall-clock to green roughly halves; GitHub-hosted
    # pickup is 2-3 s per job, so two more runners cost queue nothing. These
    # Twelve, up from four (operator 2026-08-10): paid Enterprise capacity now
    # starts the whole hosted matrix within seconds, while four full packs still
    # took 40-55 minutes. Twelve keeps every legacy job gated and cuts the
    # measured balanced critical-path weight roughly in half; the remaining
    # floor is one deliberately indivisible render-guard lane. These names are
    # the intended required-checks set (ci-pack-0..11) for any future branch
    # protection; renaming or renumbering them must update that setting too.
    #
    # AMENDED Wave B (2026-08-11), because the last two sentences are no longer the
    # whole truth. The matrix is now the plan's, so a PR may legitimately publish a
    # SUBSET of ci-pack-0..11 — a required-checks rule naming all twelve would hang
    # forever on the packs the plan never launched. `ci-gate` (bottom of this file)
    # is the stable aggregate name for any future branch protection; the per-pack
    # names remain the useful diagnostics and are still what main's full-suite
    # workflow_dispatch baseline publishes, all twelve of them, unchanged. Nothing
    # about the twelve-way PARTITION moved: `--pack-count 12` is still passed here
    # and in `ci-plan`, and the same greedy balance produces the same packs.
    name: ci-pack-${{ matrix.pack }}
    # EVERY event runs on the hosted pool. The self-hosted detour is retired.
    #
    # History, because the reversal is the point: main's proof was moved to
    # `["self-hosted","render-linux"]` earlier on 2026-08-09 because it sat `queued`
    # 30+ minutes behind 133 queued runs and never started, while `pc-render-1..4`
    # idled. That starved run blocked the whole fleet — `merge_on_green.main_proof`
    # answers "is main green on ci-pack-N" from the newest CONCLUDED ci.yml run on
    # main, so with no fresh proof the base-inherited-red refresh cannot fire and every
    # armed pull request that inherited a since-healed red stays blocked.
    #
    # That fix was correct for its constraint, and the constraint is now GONE. The
    # repository moved to the MastermindX enterprise organization on 2026-08-09 and its
    # paid Enterprise plan now carries GitHub's 500-standard-hosted-job ceiling instead
    # of the 20-job Free ceiling. The measured backlog that caused the starvation was
    # ~195 hosted jobs, so it now fits inside one wave; observed four-pack jobs begin
    # within the same second. There is no longer anything to escape.
    #
    # Routing back is strictly better than leaving it:
    #   * `render-linux` is FOUR runners shared with `render.yml`, `engine-render.yml`
    #     and, at the time, `merge-on-green.yml`. Main's four packs took the entire
    #     pool, starving both renders and the sweeper. The packs and sweeper now use
    #     hosted runners; all four self-hosted slots are back with render workloads.
    #   * The `max-parallel: 2` that bounded that damage is deleted with it — on hosted
    #     runners the hosted packs run concurrently again. With paid Enterprise
    #     capacity, twelve balanced packs reduce the measured 40-55 minute
    #     four-pack tail without competing with render workers.
    #   * One `runs-on` for every event removes the event-dependent routing entirely,
    #     so main's baseline and a pull request now prove the packs the SAME way.
    #
    # NOT the macstudio pool, unchanged: that is the render/nightly lane and is
    # routinely saturated (CLAUDE.md — render budget is law).
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # Sibling packs must FINISH so their proofs survive a single red. A
      # pull_request fail-fast (2026-08-13) cancelled the other eleven the
      # moment one pack died; ci-gate then went red on `cancelled`/`failure`,
      # the sweeper had nothing to merge, and a heal had to rerun every pack
      # from zero. execute_pack already continues after a red INSIDE a pack
      # so one run reports every legacy failure; the matrix must do the same
      # BETWEEN packs. A real red remains present in the raw fragment and the
      # reconciled semantic evidence still blocks merge. workflow_dispatch was already
      # fail-fast:false. Do not add max-parallel (#5465).
      #
      # Literal boolean, not an expression. `fail-fast: "${{ ... }}"` evaluates
      # to the strings "true"/"false"; some Actions parsers treat any non-empty
      # string as true.
      fail-fast: false
      # NO `max-parallel`. It existed only to stop main's four packs from taking all
      # four `render-linux` runners and starving `merge-on-green.yml`, then co-resident
      # on that pool. With both control/proof lanes hosted there is no shared pool to
      # protect, and throttling would only make main's proof twice as slow (~26 min
      # unthrottled vs ~50 min at 2). Do not reintroduce one without a shared-pool
      # reason; the hosted ceiling is an ACCOUNT-wide limit that this key cannot help.
      #
      # The literal `pack: [0..11]` list that stood here until Wave B (2026-08-11) is
      # now the PLAN's, emitted by `ci-plan` as {"include": [{"pack": N}, ...]} over
      # the non-empty pack indices. `matrix.pack` keeps exactly the meaning the
      # literal gave it — the index handed to `--pack-index` below — and the
      # partition arithmetic is unchanged because `--pack-count 12` is still passed
      # here and in `ci-plan`. Under `CI_DYNAMIC_MATRIX_MODE=active` the plan emits
      # only the non-empty pack indices; `shadow`/`off` still launch all twelve.
      matrix: ${{ fromJSON(needs.ci-plan.outputs.matrix) }}
    steps:
      # A self-hosted runner REUSES its workspace between jobs, and a sibling job that
      # checked out sparsely leaves `core.sparseCheckout=true` behind in the SAME
      # directory. `actions/checkout@v4` does not clear that when its own
      # `sparse-checkout` input is absent, so the next job silently gets a partial tree.
      #
      # Measured 2026-08-09, the first main baseline on this pool: checkout, setup-python
      # and setup-node all reported SUCCESS and the pack died 2-3 minutes later on
      # `scripts/run_ci_pack.py: [Errno 2] No such file or directory`. The sweeper
      # (#5095) had moved to these same runners and checks out exactly three paths for
      # speed, so `scripts/` was simply not materialised. A green "Set up job" plus a
      # missing source file is the signature of an inherited sparse checkout, not of a
      # broken runner or a bad ref.
      #
      # DO NOT DELETE THE `config --unset-all` LINE BECAUSE CHECKOUT "ALREADY DISABLES
      # SPARSE". It does — run 31304933108 shows checkout@v4 running
      # `git sparse-checkout disable` itself — and the workspace was partial anyway.
      # `disable` clears the WORKTREE-scoped flag; checkout then unsets
      # `extensions.worktreeConfig`, and that makes the repo-scoped `core.sparseCheckout`
      # visible, and effective, again. The config unset is the half that ends the outage.
      # The `disable` in front of it is what re-materialises the missing paths for a job
      # whose own checkout is skipped or conditional (render.yml) — keep both.
      #
      # Hosted runners get a fresh VM per job and cannot hit this, hence the guard.
      - name: clear any sparse checkout a sibling job left in this shared workspace
        if: runner.environment != 'github-hosted'
        shell: bash
        run: |
          if [ -d "${{ github.workspace }}/.git" ]; then
            git -C "${{ github.workspace }}" sparse-checkout disable || echo "::warning title=sparse-clear::sparse-checkout disable failed — this workspace may still hold a partial tree"
            # `--unset-all` exits 5 when there is nothing to unset: that is the normal
            # clean case and must never fail the job. Exit 0 means this workspace really
            # WAS poisoned, which is worth one line in the run summary.
            rc=0
            git -C "${{ github.workspace }}" config --unset-all core.sparseCheckout || rc=$?
            if [ "$rc" = 0 ]; then
              echo "::notice title=sparse-clear::cleared an inherited core.sparseCheckout in this shared workspace"
            elif [ "$rc" != 5 ]; then
              echo "::warning title=sparse-clear::core.sparseCheckout unset exited $rc — this workspace may still be sparse"
            fi
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # Packs consume ci-plan's changed-file list and only need the current
          # tree. fetch-depth: 0 on all twelve packs at once was the 56-minute
          # wall-clock: measured PR #5550 / run 31729769728, ci-pack-1 spent
          # 31 minutes in "Checking out the ref" (18:22:54Z–18:54:04Z) while
          # ci-plan, fetching the same history alone, finished in 7 minutes.
          # A missed diff here would fail-safe-widen every PR; the
          # `ci-changed-files` artifact downloaded below is the substitute, and an
          # unreadable or malformed handle still widens on the unpinned path.
          # (It rode a job output into this step's `env:` until 2026-08-14, when
          # 350,264 bytes of paths met execve's 131,072-byte MAX_ARG_STRLEN and
          # killed all twelve packs at launch — run 31775693780.)
          filter: blob:none
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install isolated pack runner
        run: |
          python -m venv "$RUNNER_TEMP/ci-pack-runner"
          "$RUNNER_TEMP/ci-pack-runner/bin/pip" install pyyaml
      - name: download the authoritative semantic plan
        if: needs.ci-plan.outputs.plan_sha != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.ci-plan.outputs.plan_artifact_name }}
          path: ${{ runner.temp }}/ci-semantic-plan
      # THE CHANGED-FILE LIST ARRIVES AS A FILE (2026-08-14, run 31775693780).
      # ci-plan uploads it; this step downloads it and the next exports only the
      # PATH. Both halves of that sentence are the repair: the list is what the
      # legacy guards scope themselves to (conflict-markers, self-mod-fence,
      # run_ci_pack's own selection), and it is also the one value that grows
      # with the PR — 350,264 bytes on PR #5578 against execve's 131,072-byte
      # per-string cap, which is why every pack died before its first test.
      #
      # A FAILED DOWNLOAD FAILS THIS JOB, deliberately. ci-plan uploads the list
      # unconditionally and packs launch only when ci-plan succeeded, so a pack
      # running without this artifact is not a widen to reason about — it is
      # evidence that the control plane is broken. And a pack that somehow got
      # here with the wrong bytes still cannot run: `changed_files_sha256` is
      # inside the hashed plan payload, so it would recompute a different plan
      # sha and `--expect-plan-sha` refuses below.
      - name: download the planner's changed-file list
        uses: actions/download-artifact@v4
        with:
          name: ci-changed-files
          path: ${{ runner.temp }}/ci-changed-files
      - name: publish the changed-file handle
        run: echo "CI_CHANGED_FILES_FILE=$RUNNER_TEMP/ci-changed-files/changed-files.json" >> "$GITHUB_ENV"
      # Pack index is transport only. Each runner consumes the one hashed plan,
      # verifies the exact tree/head/base identities, and emits raw semantic facts.
      # Causality is computed later by ci-gate; a pack never labels itself inherited.
      - name: validate and run legacy CI pack
        if: needs.ci-plan.outputs.plan_sha != ''
        id: execute_semantic_pack
        env:
          CI_BASE_REF: ${{ github.base_ref || 'main' }}
          CI_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          EXPECTED_PLAN_SHA: ${{ needs.ci-plan.outputs.plan_sha }}
          TESTED_TREE_SHA: ${{ needs.ci-plan.outputs.tested_tree_sha }}
          SUBJECT_HEAD_SHA: ${{ needs.ci-plan.outputs.subject_head_sha }}
          TESTED_BASE_SHA: ${{ needs.ci-plan.outputs.tested_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-semantic-fragments"
          "$RUNNER_TEMP/ci-pack-runner/bin/python" scripts/run_ci_pack.py \
            --workflow .github/ci/legacy-jobs.yml \
            --plan-json "$RUNNER_TEMP/ci-semantic-plan/ci-plan.json" \
            --changed-files-file "$CI_CHANGED_FILES_FILE" \
            --expect-plan-sha "$EXPECTED_PLAN_SHA" \
            --expect-tested-tree-sha "$TESTED_TREE_SHA" \
            --expect-subject-head-sha "$SUBJECT_HEAD_SHA" \
            --expect-base-sha "$TESTED_BASE_SHA" \
            --pack-index ${{ matrix.pack }} \
            --pack-count 12 \
            --base-replay-budget-seconds 900 \
            --emit-semantic-fragment "$RUNNER_TEMP/ci-semantic-fragments/pack-${{ matrix.pack }}.json" \
            --execute
      # Planner uncertainty still widens to the full suite. It cannot mint
      # semantic authority because no exact plan exists, so ci-gate will block
      # even if these compatibility packs happen to pass.
      - name: fail-safe full suite when no authoritative plan was produced
        if: needs.ci-plan.outputs.plan_sha == ''
        env:
          CI_BASE_REF: ${{ github.base_ref || 'main' }}
          CI_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: >-
          "$RUNNER_TEMP/ci-pack-runner/bin/python" scripts/run_ci_pack.py
          --workflow .github/ci/legacy-jobs.yml
          --pack-index ${{ matrix.pack }}
          --pack-count 12
          --execute
      - name: publish this pack's raw semantic fragment
        if: always() && needs.ci-plan.outputs.plan_sha != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-semantic-pack-${{ github.run_id }}-${{ matrix.pack }}
          path: ${{ runner.temp }}/ci-semantic-fragments/pack-${{ matrix.pack }}.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
  # ONE STABLE NAME FOR "CI SAID YES" (Wave B, 2026-08-11). Every other check name
  # in this workflow is now conditional: `ci-pack-N` exists only when the plan
  # selected pack N, and the whole matrix is skipped on a proven no-work PR. That
  # is fine for diagnostics and fatal for anything that has to ADJUDICATE, because
  # the merge-on-green sweeper (scripts/merge_on_green.py) requires an affirmative
  # success on the head — absence of red is not a pass (#4779) — so a head whose
  # packs were all skipped would read `unproven` and never merge. `ci-gate` is the
  # one name that publishes a real conclusion on every non-closed event, and it is
  # the name to point any future branch-protection rule at.
  ci-gate:
    # `always()` is what makes this job publish even when `ci-pack` was skipped or
    # failed — WITHOUT it the aggregate would vanish exactly when it is needed.
    #
    # `&& github.event.action != 'closed'` is not decoration and must not be
    # dropped: `always()` alone would run this job on every merged-close event too,
    # where `ci-plan` is fenced off and therefore SKIPPED, so PLAN_RESULT would be
    # `skipped`, the first branch below would exit 1, and every merged PR in the
    # repository would publish a red `ci-gate` — blocking the sweeper fleet-wide.
    if: always() && github.event.action != 'closed'
    name: ci-gate
    needs: [ci-plan, ci-pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out the one shared semantic-proof law
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci_semantic_proof.py
          sparse-checkout-cone-mode: false
      - name: download the authoritative semantic plan
        if: needs.ci-plan.outputs.plan_sha != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.ci-plan.outputs.plan_artifact_name }}
          path: ${{ runner.temp }}/ci-semantic-plan
      - name: download every raw semantic pack fragment
        if: needs.ci-plan.outputs.plan_sha != '' && needs.ci-plan.outputs.has_work == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ci-semantic-pack-${{ github.run_id }}-*
          path: ${{ runner.temp }}/ci-semantic-fragments
          merge-multiple: true
      # This is the one causal decision. Pack conclusions are scheduling and
      # transport facts only; complete plan accounting, exact-base comparison,
      # and missing/malformed refusal all live in ci_semantic_proof.py.
      - id: semantic_reconcile
        name: reconcile complete semantic evidence
        continue-on-error: true
        env:
          PLAN_RESULT: ${{ needs.ci-plan.result }}
          PLAN_REASON: ${{ needs.ci-plan.outputs.reason }}
          FALLBACK_RUN_ID: ${{ github.run_id }}
          FALLBACK_EVENT: ${{ github.event_name }}
          FALLBACK_ROLE: ${{ needs.ci-plan.outputs.semantic_role }}
          FALLBACK_TESTED_TREE: ${{ needs.ci-plan.outputs.tested_tree_sha }}
          FALLBACK_SUBJECT_HEAD: ${{ needs.ci-plan.outputs.subject_head_sha }}
          FALLBACK_BASE: ${{ needs.ci-plan.outputs.tested_base_sha }}
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/ci-semantic-fragments" "$RUNNER_TEMP/ci-semantic-final"
          fallback_args=()
          if [ -n "$FALLBACK_ROLE" ] && [ -n "$FALLBACK_TESTED_TREE" ] && [ -n "$FALLBACK_SUBJECT_HEAD" ] && [ -n "$FALLBACK_BASE" ]; then
            fallback_args=(
              --fallback-workflow-run-id "$FALLBACK_RUN_ID"
              --fallback-workflow ci
              --fallback-event "$FALLBACK_EVENT"
              --fallback-role "$FALLBACK_ROLE"
              --fallback-tested-tree-sha "$FALLBACK_TESTED_TREE"
              --fallback-subject-head-sha "$FALLBACK_SUBJECT_HEAD"
              --fallback-base-sha "$FALLBACK_BASE"
            )
          fi
          python3 scripts/ci_semantic_proof.py reconcile \
            --plan "$RUNNER_TEMP/ci-semantic-plan/ci-plan.json" \
            --fragments-dir "$RUNNER_TEMP/ci-semantic-fragments" \
            --planner-outcome "$PLAN_RESULT" \
            --planner-detail "$PLAN_REASON" \
            --output "$RUNNER_TEMP/ci-semantic-final/ci-semantic-evidence.json" \
            "${fallback_args[@]}"
      # Published on success AND failure. The fixed run-scoped name plus
      # overwrite prevents reruns from leaving two apparently authoritative
      # artifacts; consumers reject duplicates anyway.
      - name: publish final semantic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-semantic-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-semantic-final/ci-semantic-evidence.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: summarize semantic verdict
        if: always()
        env:
          EVIDENCE: ${{ runner.temp }}/ci-semantic-final/ci-semantic-evidence.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["EVIDENCE"])
          if not path.is_file():
              print("Semantic evidence was not materialized.")
              raise SystemExit(0)
          doc = json.loads(path.read_text(encoding="utf-8"))
          counts = {}
          for job in doc.get("jobs", []):
              for step in job.get("steps", []):
                  key = step.get("classification", "unknown")
                  counts[key] = counts.get(key, 0) + 1
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          text = (
              "## CI semantic proof\n\n"
              f"- status: `{doc.get('status', 'failure')}`\n"
              f"- evidence: `{doc.get('evidence_sha256', 'missing')}`\n"
              f"- classifications: `{json.dumps(counts, sort_keys=True)}`\n"
              f"- infrastructure findings: `{len(doc.get('infrastructure', []))}`\n"
          )
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(text)
          print(text)
          PY
      - name: enforce semantic verdict
        if: always()
        env:
          RECONCILE_OUTCOME: ${{ steps.semantic_reconcile.outcome }}
        run: |
          if [ "$RECONCILE_OUTCOME" != "success" ]; then
            echo "::error title=ci-gate::semantic proof is blocking ($RECONCILE_OUTCOME)"
            exit 1
          fi
          echo "::notice title=ci-gate::complete semantic proof is clear"
