name: ci
# Pre-merge guards for the committed site. Runs on PRs that touch site/ so a
# blank-page regression (a malformed inline <script> that aborts the page IIFE)
# shows up as a red check BEFORE it reaches main — complementing the same guard
# that gates the Pages deploy in pages.yml.
on:
  pull_request:
    # The closed event starts a zero-runner replacement in the same concurrency
    # group, cancelling a long CI pack when its PR merges or closes. Without it,
    # auto-merged PRs kept both hosted runners busy for up to another hour.
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      # Start on every repository path. The selector, not this event filter, owns
      # cost; this catch-all is what makes a brand-new top-level directory fail
      # closed instead of bypassing CI before the ownership audit can see it.
      - "**"
      - "*"
      # Path-aware pack ownership makes broad START coverage cheap.  These roots
      # ensure an edit to any suite or first-party dependency can start the job
      # whose derived scope owns it; the pack selector then runs only that owner
      # family.  Keep the detailed entries below as executable provenance for
      # non-code artifacts and special cross-root contracts.
      - "app/**"
      - "admin/**"
      - "collectors/**"
      - "config/**"
      - "content/**"
      - "contracts/**"
      - "data/**"
      - "docs/**"
      - "engine/**"
      - "lib/**"
      - "ops/**"
      - "research/**"
      - "scripts/**"
      - "site/**"
      - "templates/**"
      - "tests/**"
      - "tools/**"
      - "worker/**"
      - "wrangler.toml"
      # repo-wide pytest conftest: session fixtures/guards run in EVERY pytest
      # job, so a conftest edit must trigger the full suite (2026-07-16 #2636
      # fixture import broke 14 minimal-lane jobs without triggering ci.yml).
      - "tests/conftest.py"
      # the data spine itself: config.yml decides which FRED series are collected and,
      # via fred.vintage_series, which survive in the ALFRED point-in-time store — that
      # key OVERRIDES collectors/fred.py:DEFAULT_VINTAGE_SERIES and fetch_vintages()
      # rewrites vintages.parquet wholesale, so a one-line deletion here silently drops
      # series from the store on the next keyed collect. That has now happened twice
      # (IC4WSA/CCSA, restored #3710; then PPIFES/ECIALLCIV/ECIWAG, #3735). Until this line,
      # config.yml matched no pattern in this list at all — a PR touching only config.yml
      # got no ci run, so no guard placed anywhere could have caught either round.
      # tests/test_mri_config_spine.py now asserts the superset invariant; this line is
      # what lets that guard fire on the edit it guards.
      - "config.yml"
      - "site/**"
      - "scripts/check_inline_js.py"
      # dead-reference guard: a page linking a file that isn't in the tree is a
      # silent 404 (pruned stylesheet #3988/#4042; the 605-page ../baskets/ typo).
      - "scripts/check_site_asset_refs.py"
      - "tests/test_check_site_asset_refs.py"
      - "scripts/check_site_js.py"
      - "scripts/check_nav_gap.py"
      - "scripts/check_nav_mega.py"
      - "scripts/check_board_contradictions.py"
      # ms-board coherence guard: a rendered Market State board must be single-snapshot
      # coherent (2026-07-07 -X theirs hybrid incident, commit 5bf116a3b3).
      - "scripts/check_ms_board_coherence.py"
      - "tests/test_check_ms_board_coherence.py"
      - "engine/market_state.py"
      # hub-a11y guard: six static a11y regressions on globe-deck pages + shared assets.
      - "scripts/check_hub_a11y.py"
      - "tests/test_check_hub_a11y.py"
      # hashed-css rebase autoresolver: every render lane's push loop leans on it to not
      # silently drop a day's engine outputs (2026-07-22 asia-close run 29904079071).
      - "scripts/rebase_autoresolve_hashed_css.sh"
      - "tests/test_rebase_autoresolve_hashed_css.py"
      # conflict-wreckage strip gate: the push loops' other failure mode — a conflicted
      # autostash apply staged wholesale (2026-08-01 d29e4dd44d, 1,704 marker pages).
      - "scripts/ci/strip_conflict_markers.sh"
      - "tests/test_strip_conflict_markers.py"
      # font-ui guard: body-level var(--font-ui) must resolve (theme.css or local def) — #2647.
      - "scripts/check_font_ui_defined.py"
      - "tests/test_check_font_ui_defined.py"
      - "tests/test_fund_page_typography.py"
      - "site/theme.js"
      # analytics identity capture — registered-visitor email attribution (server reads the
      # shared Supabase session cookie off the beacon) + read-side coalescing.
      - "app/main.py"
      - "admin/analytics_first_party.py"
      - "tests/test_collect_identity.py"
      # Pre-launch hardening guards (P1): the anonymous /api/collect per-IP throttle
      # (app/main.py, above), the /ws/tape per-IP connection cap, and generic
      # billing/auth 5xx errors (no raw-exception leak). Neither app/billing.py nor
      # app/tape.py triggers any other job, so a billing/tape-only PR must list them
      # here to reach the prelaunch-hardening guard below.
      - "app/billing.py"
      - "app/tape.py"
      - "tests/test_collect_throttle.py"
      - "tests/test_tape_relay.py"
      - "tests/test_billing_subscribe.py"
      # title-i18n guard: bilingual/CJK text must never sit in a title= attribute.
      - "scripts/check_title_i18n.py"
      # conflict-marker guard: a merge must never ship literal <<<<<<< / ======= / >>>>>>> lines.
      - "scripts/check_conflict_markers.py"
      # Crypto Cockpit governor: W0 lands warn-until-marked shelf checks; W1/W2 arm
      # exact S1-S6 / H1-H8 sets and the one-verdict law.
      - "scripts/check_crypto_shelves.py"
      # Crypto Cockpit suites (unrun backfill 2026-08-03): cockpit contract,
      # wave-2/wave-3 organs, house-style partial. Subjects covered by
      # engine/** + collectors/** + scripts/*.py entries; test halves added.
      - "tests/test_crypto_cockpit_contract.py"
      - "tests/test_crypto_wave2.py"
      - "tests/test_crypto_wave3.py"
      - "tests/test_crypto_house_style.py"
      # GH-annotation guard: a "::warning" behind logging's level prefix never parses as
      # an annotation. NOTE: this only fires when ci.yml is already triggered — making it
      # fire on EVERY python change needs "scripts/**"/"engine/**" here, which is a
      # CI-cost call for the operator (it would run the whole pack on most PRs).
      - "tests/test_gh_annotation_line_start.py"
      # __all__ guard: a listed name the module never binds is a dormant
      # AttributeError under `from m import *`. Same trigger posture as the
      # annotation guard above — an edit to the scan runs the scan; it fires
      # for source changes whenever ci.yml is already triggered.
      - "tests/test_all_exports_resolve.py"
      # sys.modules leak guard. Its RUNTIME half lives in tests/conftest.py (already
      # listed at the top of this block, which triggers the full suite), so this line
      # covers the STATIC half: an edit to the scan itself must run the scan. Same
      # both-halves reasoning as the collect-checkpoint pair below.
      - "tests/test_no_module_leak.py"
      # collect-lane qledger staging guard. Its SUBJECT — daily.yml / asia-close.yml —
      # reaches CI via ".github/workflows/**"; this line is the other direction. The
      # suite was named by no `run:` step at all until 2026-08-06, which is how #4731's
      # second checkpoint left it red on main for two days looking like test flake.
      - "tests/test_collect_staging_globs.py"
      # admin-js no-undef guard: admin/static/app.js is a flat top-level script, so a
      # name declared in one function and read from another parses clean and throws
      # only on click (#3693 blanked the Outbox panel for ~2 days; fixed in #3871).
      # The glob is listed alongside app.js (already here via the SEE W1 block below)
      # because the checker itself globs admin/static/*.js — a SECOND admin bundle
      # would otherwise be guarded by a job its own edits could never trigger.
      - "admin/static/*.js"
      - "scripts/check_admin_js.py"
      - "tests/test_admin_js_no_undef.py"
      # Same file, second failure mode: `onclick="fn(${JSON.stringify(v)})"` emits
      # double quotes that close the attribute, so the browser stores `fn(` and the
      # control is dead on click. Six sites shipped that way — the entitlements tier
      # and status chips, the support status chips, and the ticket thread's Resolve,
      # Close and Send-reply buttons (support replies could not be sent at all).
      # Listed by name so a test-only edit still triggers the lane that runs it.
      - "tests/test_admin_inline_handler_attrs.py"
      # Absolute-path prune guard (#3802): a walk excluding ".claude"/"worktrees"
      # via `path.parts` also matches the checkout's own path and scans nothing.
      # Named so a test-only edit still triggers the lane that runs it.
      - "tests/test_no_absolute_path_part_prunes.py"
      # template↔site sync guard: plain-copy page assets must byte-match their templates.
      - "scripts/check_template_site_sync.py"
      # chat.html header guard: the one product page that cannot {% include %} the
      # shared nav (it is a plain-copy pair) has its header RENDERED from
      # _site_nav.html.j2 instead. Named here, not just reached via templates/**,
      # so a PR touching only the generator still runs the job that checks it.
      - "scripts/sync_chat_nav.py"
      - "tests/test_chat_nav_sync.py"
      # ?v= stamp lane guard (ui.asset_stamp): the sweep that moves a stamp, and the
      # ordering/staging contract the lanes must keep for it to survive to main. The
      # lane YAMLs themselves already reach this via ".github/workflows/**" below.
      - "scripts/optimize_assets.py"
      - "tests/test_optimize_assets.py"
      - "tests/test_asset_stamp_lane_order.py"
      - "tests/test_asset_stamp_refresh.py"
      # closing-bell duplicate-render dedup contract. The SUBJECT (the guard + stamp
      # heredocs) already reaches CI via ".github/workflows/**"; this line is the other
      # direction, so an edit to the test alone still runs the job that executes it.
      - "tests/test_closingbell_dedup_contract.py"
      # interfonts guard: _interfonts.html.j2 @font-face blocks must match theme.css.
      - "scripts/check_interfonts_sync.py"
      # data-base shim guard: every builder must write site/**/*.html through
      # lib.pages.write_page, or the page's per-ticker fetches miss the R2 reroute
      # in a standalone run. Unwired until #3635 — which is how nine builders shipped
      # shim-less pages under a green guard (the render lane's inject_data_base
      # sweep healed the committed copies, hiding it everywhere but a direct run).
      - "lib/pages.py"
      - "tests/test_site_shim.py"
      # ...and the suite that RUNS each builder against a fixture root (#3652) —
      # the only layer that can catch a target whose ".html" is never a source literal.
      - "tests/test_builder_shim_writes.py"
      - "scripts/inject_data_base.py"
      # inline-CSS externalization units (same lib/pages page-rewrite family).
      - "tests/test_externalize_css.py"
      - "scripts/externalize_css.py"
      - "templates/**"
      # SEO meta rollout guard (D12A): template-source SEO head/desc contract.
      - "tests/test_seo_meta_rollout.py"
      - ".github/workflows/ci.yml"
      - ".github/ci/legacy-jobs.yml"
      # Research Vault (RV W1) ingestion spine: sidecar contract, corpus FTS,
      # catalog, and the idempotent never-raise ingest pipeline. (RV W3) adds the
      # SSR page builder + its render test + the page template.
      - "engine/research_vault/**"
      - "scripts/ingest_research.py"
      - "scripts/build_research_vault.py"
      - "tests/test_research_vault.py"
      - "tests/test_research_vault_strict_store.py"
      # Research Vault (RV W2) serving API + download gate: quota ledger, view
      # rate-limit, watermark, the app/research.py router + its security tests.
      - "app/research.py"
      - "app/main.py"
      - "tests/test_research_api.py"
      # Research Vault (RV W3) page + viewer: page test + template.
      - "tests/test_research_vault_page.py"
      - "templates/research_vault.html.j2"
      # Research Vault SEO landing pages (programmatic SEO): per-report page
      # generator + its templates + test.
      - "scripts/build_research_pages.py"
      - "templates/research_report.html.j2"
      - "templates/research_index.html.j2"
      - "tests/test_research_pages.py"
      # Authorized competitor-history Wave 0: strict contracts + synthetic replay/R2
      # inventory tests and an aggregate-only receipt. The private history and targeted
      # restore plan stay outside the repository; tests/** is deliberately not broad.
      - "contracts/research/momoedge_oracle_*.schema.json"
      - "contracts/research/momoedge_theta_remote_inventory_aggregate.v1.schema.json"
      - "scripts/research/momoedge_oracle_history_replay.py"
      - "tests/test_momoedge_oracle_history_replay.py"
      - "research/momoedge/history_replay_wave0_receipt.json"
      # Host-private prospective same-basis OPRA NBBO cohort. Raw capture and
      # quote bytes never enter git; this trigger owns only code/contracts/tests.
      - "contracts/options/options.prospective_nbbo_cohort.v1.schema.json"
      - "engine/options_nbbo_cohort.py"
      - "scripts/capture_options_nbbo_cohort.py"
      - "ops/launchd/com.mastermind.optionsnbbocohort.plist"
      - "ops/launchd/run_options_nbbo_cohort_loop.sh"
      - "docs/runbooks/OPTIONS_NBBO_COHORT.md"
      - "tests/test_options_nbbo_cohort.py"
      - "tests/test_options_nbbo_cohort_deploy.py"
      # Authenticated-page MomoEdge companion: observe-only extension, private
      # native receiver, immutable contracts, and synthetic security tests.
      - "browser/momoedge_capture/**"
      - "contracts/options/options.momoedge_browser_observation.v1.schema.json"
      - "contracts/options/options.momoedge_browser_observe_journal.v1.schema.json"
      - "engine/options_momoedge_browser_adapter.py"
      - "scripts/momoedge_browser_receiver.py"
      - "ops/native_messaging/com.mastermind.optionsnbbocohort.momoedge_observe.json"
      - "ops/native_messaging/run_momoedge_browser_host.sh"
      - "docs/runbooks/MOMOEDGE_BROWSER_COMPANION.md"
      - "tests/test_momoedge_browser_adapter.py"
      - "tests/test_momoedge_capture_extension_static.py"
      - "tests/test_momoedge_capture_deploy.py"
      # Signal→chart §7 contract: any change to the schema, validator, engine, or build script
      # must re-prove the contract still holds (see the signal-contract job below).
      - "research/signal_engine/SCHEMA.json"
      - "scripts/validate_signals.py"
      - "scripts/build_signal_quality.py"
      - "engine/signal_quality.py"
      - "tests/test_validate_signals.py"
      # The §7 marker-date look-ahead guard on _buy_filter (wired into the
      # signal-contract job 2026-08-05, dark before that). engine/** above
      # already triggers on the subject module; this is the test half, which
      # nothing matched — the #3488/#4559 lesson that a guard whose own edit
      # cannot start the workflow is only half wired.
      - "tests/test_signal_quality_no_leak.py"
      # Absolute session-calendar anchor invariance (job session-anchor-era): the
      # confluence buckets' era abs-session-2026-08-06 (#4732) and the §7 marker
      # engine's era sq-abs-session-2026-08-06 (#4738). Their subjects —
      # engine/session_anchor.py, engine/confluence_tiers.py, engine/signal_quality.py,
      # engine/signal_gate.py — all ride the "engine/**" trigger above, so these two
      # entries are the OTHER half: a PR editing ONLY a suite (a new fixture shape, a
      # widened k) must still start the pack that executes it. Both suites were UNRUN
      # (audit_unrun_tests.py tier P5 — named by no run step in any workflow or the
      # legacy manifest) while scoring triggerable=True off those same subjects, so
      # neither census flagged them: an era stamp shipped resting on a start-invariance
      # guarantee that CI had never once executed. The suite files matched no path entry
      # either — the #4559 "test half unreachable" shape these lines close.
      - "tests/test_session_anchor_invariance.py"
      - "tests/test_sq_anchor_invariance.py"
      # W-F reclaim-veto decision packet (2026-08-05). Both halves per #3488: the suite AND
      # the module it measures, so an edit to either can trigger the job that proves the
      # flip-isolation construction still isolates exactly one leg.
      - "research/prophet_us_audit/reclaim_veto_packet.py"
      - "tests/test_us_reclaim_veto_packet.py"
      # The RATIFIED sibling of that packet (us_prophet_v2, 2026-08-10): the counter-trend
      # reclaim waiver and its era fence. Both halves per #3488 — the suite, plus the
      # AUTHORITY it reads. engine/** already covers signal_quality/signal_gate/us_board_rank
      # and site/** does not exist as a trigger, so the prereg is named explicitly: this
      # suite pins the shipped NOTCH ("20"), and a PR that moves the operator's dial in the
      # ratification log without moving the constant must be able to start the job that
      # would catch it.
      - "tests/test_us_reclaim_waiver_prophet_v2.py"
      - "research/RECLAIM_VETO_CONDITIONAL_PREREG.md"
      # Versioned FROZEN research price panel (research-price-panel job). Both halves per
      # #3488: the suite AND every module it measures. The writer/reader own the write-once
      # and never-fall-back properties; price_ladder.py is the adjusted-first resolver they
      # reuse from #4698 (vendored byte-identical — a drifted copy is a silent basis change);
      # relay_position_standin.py is the worked migration whose pinned version the suite's
      # contract documents. An edit to any of them must be able to start the job.
      - "research/research_panels/price_panel.py"
      - "research/prophet_us_audit/price_ladder.py"
      - "research/prophet_us_audit/relay_position_standin.py"
      - "tests/test_research_price_panel.py"
      # NOT the packet's .md/.json artifacts. #4733 added them here to clear a
      # check_ci_trigger_closure.py finding against tests/test_merge_on_green.py,
      # but that suite never opens them — they are members of INCIDENT_4607_FILES,
      # file NAMES handed to a fake GitHub API to reconstruct one commit. The entries
      # encoded a dependency that does not exist and armed the full 4-pack run on
      # every edit to two decision-packet files. The fixture now carries a
      # `# ci-trigger-closure: data` marker instead.
      # research/-RESIDENT suites (2026-08-06). Same job, same lesson, one directory over.
      # The packets that introduced these were fenced to files-only, so each suite was
      # written NEXT TO its instrument under research/ instead of in tests/. Nothing in
      # this repo runs pytest over research/ — no workflow collects that tree and no
      # `run:` step named either file — so both were UNRUN from birth: green locally,
      # and unable to fail a PR that broke the very instrument they pin.
      # They were NOT untriggerable: `research/**/*.py` (added far below for the
      # import-hygiene ratchet, an unrelated concern) already starts this workflow on
      # any research/ .py edit. These four entries are the #3488 "both halves BY NAME"
      # idiom anyway — exactly as reclaim_veto_packet.py directly above is named
      # explicitly despite that same catch-all covering it — so the trigger survives if
      # the ratchet's glob is ever narrowed to its own subject. The engine/lib modules
      # these suites import reach this workflow through the engine/** and lib/**
      # subtrees below. Wired into signal-contract, which already owns this family
      # (the reclaim-veto packet directly above).
      #   * label-grading battery (#4547): the veto-day label classifier + the ran-lane
      #     numpy-bool trap the entry gauge is written against.
      #   * buy_filters: the canonical reclaim-and-hold / bearish-divergence / 200-MA
      #     bar-raiser math — the same buy-side §7 machinery
      #     tests/test_signal_quality_no_leak.py pins one layer up.
      - "research/prophet_us_audit/label_grading_battery.py"
      - "research/prophet_us_audit/test_label_grading_battery.py"
      #   * earnings-ignition cohort logic: the derived knowability convention, the
      #     EDGAR-roll-aware announcement window, and the single reaction-session anchor
      #     both the reaction and the forward cells hang from. Rides the same step.
      - "research/prophet_us_audit/earnings_ignition_measurement.py"
      - "research/prophet_us_audit/test_earnings_ignition_measurement.py"
      - "research/signal_engine/buy_filters.py"
      - "research/signal_engine/test_buy_filters.py"
      # W1d trial-budget gate: any new multiple-testing harness must register its budget.
      - "scripts/*_phase0.py"
      - "scripts/*_phase1.py"
      - "scripts/validate_*.py"
      - "scripts/check_trial_registration.py"
      - "engine/trial_ledger.py"
      - "engine/grading.py"
      - "engine/track_record.py"
      # Track-record company identity: one ledger key per company across ticker
      # renames. Name both the executable subjects and the suite explicitly so
      # a test-only or migration-tool edit starts the packed owner (#3488).
      - "engine/ledger_identity.py"
      - "scripts/audit_reused_tickers.py"
      - "scripts/migrate_track_record_keys.py"
      - "tests/test_ledger_identity.py"
      - "engine/sector_signals.py"
      - "engine/meta_label.py"
      - "tests/test_grading.py"
      - "tests/test_trial_ledger.py"
      - "tests/test_trial_registration_lint.py"
      - "tests/test_no_literal_ntrials.py"
      # membership-ledger tz guard: a tz-aware asof froze the PIT universe ledger for a
      # month (2026-06-14 → 2026-07-10, TypeError on every collect run) — the upsert
      # must keep accepting aware timestamps against the naive parquet columns.
      - "engine/universe_history.py"
      - "tests/test_universe_history.py"
      # W4 outcome spine: the shared signal-id→outcome contract + partial-pooling + badge passport.
      - "engine/spine.py"
      - "engine/pooling.py"
      - "engine/passport.py"
      - "engine/desk_scorer.py"
      # The desk that FEEDS the spine. engine/spine.py registers data/stock_desk/scored.jsonl
      # in _DESK_SCORED, but nothing wrote that file, so 45 decided outcomes never reached
      # engine.pooling and the cross-desk family was one member (ai_desk) in practice. Neither
      # the module nor its suite carried a trigger — the file that decides what a desk
      # contributes to the pooled weights could not start ci.yml at all (same class as the
      # tier-gate hole, #3509). Its suite runs in the outcome-spine job below.
      - "engine/stock_desk.py"
      - "tests/test_stock_desk.py"
      - "engine/alert_triage.py"
      - "engine/altdata_signals.py"
      - "scripts/check_badge_passport.py"
      - "tests/test_spine.py"
      - "tests/test_pooling.py"
      # Promotion gate (#3495/#3523): the per-desk empirical null and the Calibration Hub
      # verdicts it feeds. These files carried NO trigger — a change to the module that
      # decides whether a desk is "calibrated" could not start ci.yml at all, so its own
      # suites never ran on the PR that changed it (same class as the tier-gate hole, #3509).
      - "engine/desk_placebo.py"
      - "engine/calibration_hub.py"
      - "engine/thematic_desk.py"
      - "tests/test_desk_placebo.py"
      - "tests/test_calibration_hub.py"
      - "tests/test_thematic_desk.py"
      # The Phase-C desks that WRITE the scored ledgers spine._DESK_SCORED reads. The engine
      # modules are already covered by engine/**, but no job ran these suites at all, so a
      # silent break in any of them moved the deterministic desk-weight vector
