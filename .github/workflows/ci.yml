      - "tests/test_signal_lab_vector_display.py"
      - "data/vector/calibration.json"
      - "data/vector/trial_log.json"
      # regime no-regress guard (2026-07-13 earlyclose↔render flip-flop fix)
      - "tests/test_engine_run_no_regress.py"
      - "scripts/build_site.py"
      - "scripts/audit_price_basis.py"
      - "research/signal_engine/walk_forward.py"
      - "tests/test_canada_build.py"
      - "tests/test_commodity_signals.py"
      - "tests/test_commodity_index.py"
      - "engine/commodity_confluence.py"
