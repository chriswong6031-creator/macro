      - "tests/test_ai_desk.py"
      - "tests/test_ai_desk_scorer.py"
      - "tests/test_radar_scorer.py"
      - "tests/test_narrative_brain.py"
      - "tests/test_demand_ledger.py"
      - "tests/test_policy_intent_desk.py"
      # Honesty-register guards (unrun-suite backfill 2026-08-03): the falsifier
      # vocabulary bans, chat plain-word projection, regime-label/sizing-pill
      # disclosure parity, and forward cycle framing. Subjects live under
      # engine/** and templates/** (broad globs); the register scan also reads
      # the shipped policy intel artifact, which nothing else matches.
      - "data/policy/intel.json"
      - "tests/test_front_facing_register.py"
      - "tests/test_policy_watch_register.py"
      - "tests/test_chat_plain_words.py"
      - "tests/test_regime_label_honesty.py"
      - "tests/test_regime_sizing_disclosure_parity.py"
      - "tests/test_cycle_forward_framing.py"
      # WRI W3: watchlist book-structure math + its node-shelled unit tests. templates/**
      # already covers risk_core.js/watchlist_risk.js; list the test file so a test-only
