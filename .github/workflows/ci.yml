      - "engine/cycle_ontology.py"
      - "site/cycle_ontology.js"
      - "engine/cycle_forward_log.py"
      - "tests/test_cycle_forward_log.py"
      # perf: cycle-map payload splitter (core + lazy series chunk)
      - "scripts/_cycles_payload.py"
      - "tests/test_cycles_payload_split.py"
      # Flow-Surface snapshot store: per-strike net-premium grids materialized in the
