    if: ${{ false }}
    # ui.template_site_sync PR gate: every plain-copy page asset (templates/<name>
    # that also ships as site/<name>) must byte-match at every commit — a one-sided
    # reword creates the divergence window the render lanes then propagate at an
    # unpredictable later time. 2026-07-07 incident: engine-render commit 2ae709f9f0
    # resurrected pre-#1793 "validated" wording in site/sector_cycles.js because the
    # push step's `git pull --rebase -X theirs` favored the run's checkout-time copy
    # over the reword that merged mid-render. The render lanes now re-sync post-rebase
    # (--fix); this job keeps PRs from arming the window in the first place.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps (theme.js bake reads config.yml)
        run: pip install pyyaml pytest
      - name: template-site-sync selftest (gate fires on synthetic divergence)
        run: python3 scripts/check_template_site_sync.py --selftest
      - name: site copies of template assets must byte-match templates/
        run: python3 scripts/check_template_site_sync.py
      # ui.asset_stamp — the OTHER half of this law, and the reason it bit users. The
      # `--fix` above rewrites the site copy of every plain-copy pair FROM templates/,
      # and it runs AFTER the stamping sweep in every lane, so a ?v= stamp written only
      # site-side was reverted before it could reach main. #3573 fixed the rewrite and
      # still could not move the stamp on these pages: #3617's onboard.css fix sat live
      # at the origin while every returning browser kept the old sheet (site/index.html
      # linked onboard.css?v=cfdca9e2, served `immutable, max-age=1y`); #3624 hand-bumped
      # that one page. optimize_assets now stamps the templates/ side too — which only
      # reaches main if the lane STAGES templates/, and only covers pages a sibling lane
      # lands mid-run if the lane also re-stamps POST-rebase. These pin all three.
      - name: "?v= stamps — paired-page round-trip + lane ordering/staging (ui.asset_stamp)"
        run: >
          python -m pytest
          tests/test_asset_stamp_lane_order.py tests/test_optimize_assets.py
          tests/test_asset_stamp_refresh.py -q
      # ui.interfonts_theme_sync: templates/_interfonts.html.j2 carries the six
      # Inter @font-face blocks copied verbatim from templates/theme.css (#2119,
      # for standalone pages that don't link theme.css). A theme.css font edit
      # that skips the partial silently de-fonts those pages — same drift class,
      # same job.
      - name: interfonts-sync selftest (gate fires on synthetic drift)
        run: python3 scripts/check_interfonts_sync.py --selftest
      - name: _interfonts partial @font-face blocks must match templates/theme.css
        run: python3 scripts/check_interfonts_sync.py
      # ui.data_base_shim: same page-asset drift family, and it had NO CI lane at
      # all — which is how scripts/build_leader_radar.py sat red on main writing
      # site/leader_radar.html with a raw write_text instead of lib.pages.write_page
      # (the render lane's inject_data_base sweep healed the committed copy after
      # the fact, so only a standalone builder run showed the missing shim).
      # test_site_shim carries all three layers: lib.pages units, the committed-page
      # tripwire, and the source guard against raw write_text on an *.html target.
      # NOTE on trigger breadth: the source guard scans scripts/**+engine/** for
      # offenders, but listing those globs under `paths:` would run this pack on
      # nearly every Python PR — a CI-cost call for the operator (same reasoning as
      # the gh-annotation guard above). ci-main-heartbeat.yml runs this job on a
      # schedule against main with NO path filter, which is what keeps the guard
      # from rotting red on main invisibly again.
      - name: data-base shim guard (lib.pages units + committed-page tripwire + source guard)
        run: python -m pytest tests/test_site_shim.py -q
      # Same module, same class of post-render page rewrite: externalize_css lifts
      # inline <style> into hashed sheets via lib.pages.externalize_css_text and
      # writes through write_page. Also unwired until now.
      - name: inline-CSS externalization units
        run: python -m pytest tests/test_externalize_css.py -q

  externalize-css:
    if: ${{ false }}
    # ui.template_site_sync, sweep side. The inline-CSS externalizer must skip the
    # plain-copy HTML pairs (templates/<name>.html shipping byte-identically as
    # site/<name>.html — index.html + chat.html). Every render lane runs
    # `check_template_site_sync --fix` AFTER the sweeps and BEFORE `git add site/`,
    # re-copying those pages FROM templates/, so a site-only lift is reverted before
    # it reaches main — silently, every render, forever — while still minting the
    # hash file, which the sweep's own prune can never reclaim (it looks referenced
    # in the same run that creates the link). That accreted 3 dead stylesheets /
    # 92,412 bytes, linked by zero pages, committed and shipped.
    #
    # Writing THROUGH to templates/ (the #3625 resolution for the data-base shim)
    # is deliberately NOT the fix here: the shim is a tag, but externalizing moves
    # 70KB of the landing page's CONTENT, leaving the hand-edited source holding
    # only a <link> to a hash-named file in the derived tree. See the module
    # docstrings in scripts/externalize_css.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
