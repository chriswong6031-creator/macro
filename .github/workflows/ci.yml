      - "scripts/mirror_terminal_context_r2.py"
      - "tests/test_mirror_terminal_context.py"
      - "scripts/build_options_screener.py"
      - "tests/test_build_options_screener.py"
      # Lane G: intraday BS greek engine feeding the surface gex/dex/vanna/charm grids.
