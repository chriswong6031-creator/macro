name: ci
# Pre-merge guards for the committed site. Runs on PRs that touch site/ so a
# blank-page regression (a malformed inline <script> that aborts the page IIFE)
# shows up as a red check BEFORE it reaches main — complementing the same guard
# that gates the Pages deploy in pages.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check_inline_js.py"
      - "scripts/check_nav_gap.py"
      - "scripts/check_nav_mega.py"
      - ".github/workflows/ci.yml"
      # Signal→chart §7 contract: any change to the schema, validator, engine, or build script
      # must re-prove the contract still holds (see the signal-contract job below).
      - "research/signal_engine/SCHEMA.json"
      - "scripts/validate_signals.py"
      - "scripts/build_signal_quality.py"
      - "engine/signal_quality.py"
      - "tests/test_validate_signals.py"
      # W1d trial-budget gate: any new multiple-testing harness must register its budget.
      - "scripts/*_phase0.py"
      - "scripts/*_phase1.py"
      - "scripts/validate_*.py"
      - "scripts/check_trial_registration.py"
      - "engine/trial_ledger.py"
      - "engine/grading.py"
      - "engine/track_record.py"
      - "engine/sector_signals.py"
      - "engine/meta_label.py"
      - "tests/test_grading.py"
      - "tests/test_trial_ledger.py"
      - "tests/test_trial_registration_lint.py"
      # W4 outcome spine: the shared signal-id→outcome contract + partial-pooling + badge passport.
      - "engine/spine.py"
      - "engine/pooling.py"
      - "engine/passport.py"
      - "engine/desk_scorer.py"
      - "engine/alert_triage.py"
      - "engine/altdata_signals.py"
      - "scripts/check_badge_passport.py"
      - "tests/test_spine.py"
      - "tests/test_pooling.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inline-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: inline JS must parse
        run: python3 scripts/check_inline_js.py site

  nav-gap:
    # The shared nav menu (.site-nav / vector-family .topbar) has no built-in top
    # gap — it relies on each page's body top padding. A new page that zeroes its
    # body padding jams the menu against the viewport top ("menu with no padding").
    # This catches that regression BEFORE merge instead of after it ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nav menu must keep a top gap
        run: python3 scripts/check_nav_gap.py site

  nav-mega:
    # The Research nav is a shared partial (_navlinks.html.j2) whose Research entry is
    # the grouped 'nav-mega' panel. A page built OUTSIDE the routine render loop (an
    # out-of-loop page builder, or a hand-static page) can render the shared nav but
    # freeze WITHOUT the mega-menu. This catches that drift BEFORE merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shared-nav pages must carry the Research mega-menu
        run: python3 scripts/check_nav_mega.py site

  signal-contract:
    # HARD pre-merge gate for the signal→chart §7 contract (research/signal_engine/SCHEMA.json,
    # the single source of truth shared with the charting app). A PR that drifts the engine output
    # from the schema, weakens the validator, or breaks a contract rule fails RED here — the safe
    # place to block (no deploy to stall). The daily build's gate is deliberately resilient
    # (discard-bad-write, never 404 the dashboard); this is where blocking has teeth. The test
    # suite includes an engine-analyze()-conforms-to-schema check that catches forgot-to-update-
    # the-schema drift without needing data fixtures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install jsonschema pytest pandas numpy pyyaml
      - name: signal §7 contract tests
        run: python -m pytest tests/test_validate_signals.py -q

  trial-budgets:
    # W1d (audit #21): every multiple-testing harness must REGISTER its trial budget, or the
    # DSR/kill/FDR deflation it feeds is a lie. A NEW validate_*/*_phase0 script that deflates a
    # Sharpe without registering fails RED here (the ~33 pre-existing offenders are grandfathered
    # in an allowlist that only shrinks). Also runs the grading-rebuild + ledger test suites.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: trial-registration lint (no new unregistered harness)
        run: python3 scripts/check_trial_registration.py
      - name: grading rebuild + trial ledger tests
        run: python -m pytest tests/test_grading.py tests/test_trial_ledger.py tests/test_trial_registration_lint.py -q

  outcome-spine:
    # W4 (audit #13/#19/#23/#41/#42): the outcome spine + partial-pooling closed loop. The
    # badge-passport ratchet (#41) fails RED if a desk brief renders a conviction badge with no
    # provenance passport; the spine/pooling tests prove the four safety properties (sign-safety,
    # trust-region, cold-start, arming) that gate grades moving deterministic weights.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install minimal deps
        run: pip install pytest pandas numpy pyarrow pyyaml
      - name: badge-passport ratchet (no new conviction badge without a passport)
        run: python3 scripts/check_badge_passport.py site
      - name: spine contract + partial-pooling safety tests
        run: python -m pytest tests/test_spine.py tests/test_pooling.py -q
