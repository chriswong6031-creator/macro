name: ci
# Pre-merge guards for the committed site. Runs on PRs that touch site/ so a
# blank-page regression (a malformed inline <script> that aborts the page IIFE)
# shows up as a red check BEFORE it reaches main — complementing the same guard
# that gates the Pages deploy in pages.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check_inline_js.py"
      - "scripts/check_site_js.py"
      - "scripts/check_nav_gap.py"
      - "scripts/check_nav_mega.py"
      - "scripts/check_board_contradictions.py"
      # ms-board coherence guard: a rendered Market State board must be single-snapshot
      # coherent (2026-07-07 -X theirs hybrid incident, commit 5bf116a3b3).
      - "scripts/check_ms_board_coherence.py"
      - "tests/test_check_ms_board_coherence.py"
      - "engine/market_state.py"
      # hub-a11y guard: five static a11y regressions on globe-deck pages.
      - "scripts/check_hub_a11y.py"
      - "tests/test_check_hub_a11y.py"
      - "site/theme.js"
      # title-i18n guard: bilingual/CJK text must never sit in a title= attribute.
      - "scripts/check_title_i18n.py"
      # conflict-marker guard: a merge must never ship literal <<<<<<< / ======= / >>>>>>> lines.
      - "scripts/check_conflict_markers.py"
      # template↔site sync guard: plain-copy page assets must byte-match their templates.
      - "scripts/check_template_site_sync.py"
      # interfonts guard: _interfonts.html.j2 @font-face blocks must match theme.css.
      - "scripts/check_interfonts_sync.py"
      - "templates/**"
      - ".github/workflows/ci.yml"
      # Signal→chart §7 contract: any change to the schema, validator, engine, or build script
      # must re-prove the contract still holds (see the signal-contract job below).
      - "research/signal_engine/SCHEMA.json"
      - "scripts/validate_signals.py"
      - "scripts/build_signal_quality.py"
      - "engine/signal_quality.py"
      - "tests/test_validate_signals.py"
      # W1d trial-budget gate: any new multiple-testing harness must register its budget.
      - "scripts/*_phase0.py"
      - "scripts/*_phase1.py"
      - "scripts/validate_*.py"
      - "scripts/check_trial_registration.py"
      - "engine/trial_ledger.py"
      - "engine/grading.py"
      - "engine/track_record.py"
      - "engine/sector_signals.py"
      - "engine/meta_label.py"
      - "tests/test_grading.py"
      - "tests/test_trial_ledger.py"
      - "tests/test_trial_registration_lint.py"
      - "tests/test_no_literal_ntrials.py"
