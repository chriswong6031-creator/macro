name: prophet-d12-nat-apply

on:
  push:
    branches:
      - sol/prophet-us-d12-pack-tip-20260827

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/prophet-d12-nat-apply.yml
            /scripts/d12_fix_nat.py
            /scripts/build_prophet_live_pack.py
            /tests/test_prophet_live_pack_d12.py
            /engine/prophet_live/**
            /lib/nyse_calendar.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply malformed-tip fix
        run: python scripts/d12_fix_nat.py
      - name: Prove focused GREEN
        run: |
          pip install --quiet pytest pandas
          python -m pytest tests/test_prophet_live_pack_d12.py -q
      - name: Commit exact repair and remove one-shot machinery
        run: |
          git config user.name "Sol D12 malformed-tip apply"
          git config user.email "audit@invalid.local"
          git rm .github/workflows/prophet-d12-nat-apply.yml scripts/d12_fix_nat.py
          git add scripts/build_prophet_live_pack.py
          git diff --cached --check
          git commit -m "fix(prophet-live): quarantine malformed pack tips fail-closed"
          git push origin HEAD:sol/prophet-us-d12-pack-tip-20260827
