name: deploy-api-secrets
# Operator-triggered: arms ask-the-brain live mode and the full OAuth pool by
# pushing CLAUDE_CODE_OAUTH_TOKEN_1..7 + METAB_KEYS_ENABLED into the VPS
# macro-api and macro-admin envs, then restarting the services.
# The self-hosted runners execute in an ISOLATED filesystem namespace
# (no host ~/.ssh, no shared paths — verified runs 28728692156 /
# 28728735102 / 28728773840), so the SSH key rides in as the VPS_DEPLOY_KEY
# repo secret, materialized 0600 in RUNNER_TEMP for the job only. All secret
# values travel via stdin (printf) or here-doc lines — never in command args
# or echoed. The legacy CLAUDE_CODE_OAUTH_TOKEN is NOT delivered to the VPS
# (deprecated; pool keys 3..7 replace it).
# Also delivers the Stripe billing secrets (STRIPE_SECRET_KEY /
# STRIPE_WEBHOOK_SECRET, MNZ W2 spine — docs/ops/stripe-setup.md §3) to the
# macro-api env; absent secrets are simply omitted (same _add semantics).
# And the SEE W1 mail relay settings (MAIL_*, docs/ops/email-support-setup.md §2)
# to BOTH envs: macro-api sends the operator's new-ticket alerts, and the admin
# console sends ticket replies through the same app/mailer.py. Every MAIL_ key is
# optional — with none set the estate runs in mail-off mode and says so.
# Filing Forensics private state is served by macro-api from the private Research
# R2 bucket. The four R2_RESEARCH_* values are delivered to macro-api only; they
# are never copied into the public site or the admin service.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: push OAuth pool to VPS macro-api env + restart
        env:
          T1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          T2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          T3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          T4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          T5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          T6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          T7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
          METAB_KEYS_ENABLED: ${{ vars.METAB_KEYS_ENABLED }}
          STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WHSEC: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUB: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          R2_RESEARCH_EP: ${{ secrets.R2_RESEARCH_ENDPOINT }}
          R2_RESEARCH_AK: ${{ secrets.R2_RESEARCH_ACCESS_KEY_ID }}
          R2_RESEARCH_SK: ${{ secrets.R2_RESEARCH_SECRET_ACCESS_KEY }}
          R2_RESEARCH_BUCKET_NAME: ${{ secrets.R2_RESEARCH_BUCKET }}
          # Browser-safe Logo.dev image token. It is stored in the VPS env and
          # materialized into site.served/logo_config.js by macro-update; the
          # server secret is intentionally never delivered.
          LOGO_DEV_PK: ${{ secrets.LOGO_DEV_PUBLISHABLE_KEY }}
          MAIL_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_PASS: ${{ secrets.MAIL_SMTP_PASS }}
          MAIL_FROM_ADDR: ${{ secrets.MAIL_FROM }}
          MAIL_REPLY: ${{ secrets.MAIL_REPLY_TO }}
          MAIL_SUPPORT: ${{ secrets.MAIL_SUPPORT_TO }}
          MAIL_UNSUB: ${{ secrets.MAIL_UNSUB_SECRET }}
          # SEE W3 switches. All optional; absent => the documented defaults (lifecycle
          # OFF, billing mail ON, www host). MAIL_BILLING_ENABLED is separate from the
          # relay creds on purpose: it silences billing receipts WITHOUT stopping support
          # mail, so a misbehaving receipt is one env flip, not a relay teardown.
          MAIL_LIFECYCLE: ${{ secrets.MAIL_LIFECYCLE_ENABLED }}
          MAIL_LIFECYCLE_INT: ${{ secrets.MAIL_LIFECYCLE_INTERVAL_SEC }}
          MAIL_BILLING: ${{ secrets.MAIL_BILLING_ENABLED }}
          MAIL_BASE: ${{ secrets.MAIL_SITE_BASE }}
          # SEE W4 switches. All optional and all default OFF — the marketing sweeper is
          # inert until MAIL_MARKETING_ENABLED is set, and each leg needs its own flag on
          # top of that. MAIL_WELCOME_AFTER is the one with teeth: it is the activation
          # date, and with it UNSET the welcome sweeper sends NOTHING rather than mailing
          # every account that has ever existed. Arming MAIL_WELCOME_ENABLED without
          # setting it is therefore safe, not a mass-mail. MAIL_SITE_BASE above is reused
          # for the unsubscribe links — no second host name.
          MAIL_MKT: ${{ secrets.MAIL_MARKETING_ENABLED }}
          MAIL_MKT_INT: ${{ secrets.MAIL_MARKETING_INTERVAL_SEC }}
          MAIL_WELCOME: ${{ secrets.MAIL_WELCOME_ENABLED }}
          MAIL_WELCOME_AT: ${{ secrets.MAIL_WELCOME_AFTER }}
          MAIL_WELCOME_BACK: ${{ secrets.MAIL_WELCOME_LOOKBACK_HOURS }}
          MAIL_CAMPAIGNS: ${{ secrets.MAIL_CAMPAIGNS_ENABLED }}
          MAIL_THROTTLE: ${{ secrets.MAIL_THROTTLE_PER_MIN }}
          MAIL_UNSUB_MAILTO_ADDR: ${{ secrets.MAIL_UNSUB_MAILTO }}
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # Require at least one non-empty pool key
          _any=""
          for v in "$T1" "$T2" "$T3" "$T4" "$T5" "$T6" "$T7"; do
            [ -n "$v" ] && { _any=1; break; }
          done
          [ -n "$_any" ] || { echo "::error::All seven CLAUDE_CODE_OAUTH_TOKEN_N secrets are empty/absent"; exit 1; }
          [ -n "$SSH_KEY" ] || { echo "::error::VPS_DEPLOY_KEY secret is empty/absent"; exit 1; }
          umask 077
          KEYFILE="$RUNNER_TEMP/vps_key"
          printf '%s\n' "$SSH_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT

          # Build the KEY=VALUE lines to deliver (values via printf, never echoed)
          # One line per present key; absent keys are omitted.
          # We pass the lines as a single stdin blob so no value ever appears
          # in a command argument.
          # _add sanitizes the value (strips \r, \n, spaces) to guarantee one
          # token per line — a multi-line secret pasted into GitHub Secrets
          # would otherwise break the KEY=VALUE line format on the VPS.
          _lines=""
          _add() { local n="$1" v; v="$(printf '%s' "$2" | tr -d '\r\n ')"; if [ -n "$v" ]; then _lines="${_lines}${n}=${v}"$'\n'; fi; }
          # _addv is _add for values that may legitimately CONTAIN spaces — a MAIL_FROM
          # display name ("Mastermind <hello@…>") would be mangled into
          # "Mastermind<hello@…>" by _add's `tr -d ' '`. Newlines are still stripped (one
          # token per line is the file format) and the ends are trimmed.
          _addv() { local n="$1" v; v="$(printf '%s' "$2" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"; if [ -n "$v" ]; then _lines="${_lines}${n}=${v}"$'\n'; fi; }
          _add CLAUDE_CODE_OAUTH_TOKEN_1 "$T1"
          _add CLAUDE_CODE_OAUTH_TOKEN_2 "$T2"
          _add CLAUDE_CODE_OAUTH_TOKEN_3 "$T3"
          _add CLAUDE_CODE_OAUTH_TOKEN_4 "$T4"
          _add CLAUDE_CODE_OAUTH_TOKEN_5 "$T5"
          _add CLAUDE_CODE_OAUTH_TOKEN_6 "$T6"
          _add CLAUDE_CODE_OAUTH_TOKEN_7 "$T7"
          _add METAB_KEYS_ENABLED "${METAB_KEYS_ENABLED:-3,4,5,6,7}"
          _add STRIPE_SECRET_KEY "$STRIPE_KEY"
          _add STRIPE_WEBHOOK_SECRET "$STRIPE_WHSEC"
          _add STRIPE_PUBLISHABLE_KEY "$STRIPE_PUB"
          _add R2_RESEARCH_ENDPOINT "$R2_RESEARCH_EP"
          _add R2_RESEARCH_ACCESS_KEY_ID "$R2_RESEARCH_AK"
          _add R2_RESEARCH_SECRET_ACCESS_KEY "$R2_RESEARCH_SK"
          _add R2_RESEARCH_BUCKET "$R2_RESEARCH_BUCKET_NAME"
          _add LOGO_DEV_PUBLISHABLE_KEY "$LOGO_DEV_PK"
          # SEE W1 mail relay. Absent keys are omitted, which IS mail-off mode.
          _add  MAIL_SMTP_HOST   "$MAIL_HOST"
          _add  MAIL_SMTP_PORT   "$MAIL_PORT"
          _add  MAIL_SMTP_USER   "$MAIL_USER"
          _addv MAIL_SMTP_PASS   "$MAIL_PASS"
          _addv MAIL_FROM        "$MAIL_FROM_ADDR"
          _addv MAIL_REPLY_TO    "$MAIL_REPLY"
          _addv MAIL_SUPPORT_TO  "$MAIL_SUPPORT"
          _addv MAIL_UNSUB_SECRET "$MAIL_UNSUB"
          _add  MAIL_LIFECYCLE_ENABLED      "$MAIL_LIFECYCLE"
          _add  MAIL_LIFECYCLE_INTERVAL_SEC "$MAIL_LIFECYCLE_INT"
          _add  MAIL_BILLING_ENABLED        "$MAIL_BILLING"
          _add  MAIL_SITE_BASE              "$MAIL_BASE"
          _add  MAIL_MARKETING_ENABLED       "$MAIL_MKT"
          _add  MAIL_MARKETING_INTERVAL_SEC  "$MAIL_MKT_INT"
          _add  MAIL_WELCOME_ENABLED         "$MAIL_WELCOME"
          # _addv, NOT _add: this is an ISO DATETIME and `2026-07-26 12:00:00` is a
          # legal one. _add runs `tr -d '\r\n '`, which would deliver
          # `2026-07-2612:00:00` — unparseable, and _parse_dt treats unparseable
          # exactly like unset, so the welcome leg would silently send NOTHING with
          # the secret sitting right there on the box looking correct.
          _addv MAIL_WELCOME_AFTER           "$MAIL_WELCOME_AT"
          _add  MAIL_WELCOME_LOOKBACK_HOURS  "$MAIL_WELCOME_BACK"
          _add  MAIL_CAMPAIGNS_ENABLED       "$MAIL_CAMPAIGNS"
          _add  MAIL_THROTTLE_PER_MIN        "$MAIL_THROTTLE"
          _addv MAIL_UNSUB_MAILTO            "$MAIL_UNSUB_MAILTO_ADDR"

          printf '%s' "$_lines" | ssh -i "$KEYFILE" \
            -o StrictHostKeyChecking=accept-new root@146.190.142.17 '
            set -euo pipefail
            umask 077
            # Read the KEY=VALUE lines from stdin
            INPUT=$(cat)
            touch /etc/macro-api.env
            # Strip any existing pool lines + METAB_KEYS_ENABLED + Stripe (idempotent)
            grep -vE "^CLAUDE_CODE_OAUTH_TOKEN(_[0-9]+)?=" /etc/macro-api.env \
              | grep -v "^METAB_KEYS_ENABLED=" \
              | grep -vE "^STRIPE_(SECRET_KEY|WEBHOOK_SECRET|PUBLISHABLE_KEY)=" \
              | grep -vE "^R2_RESEARCH_(ENDPOINT|ACCESS_KEY_ID|SECRET_ACCESS_KEY|BUCKET)=" \
              | grep -v "^LOGO_DEV_PUBLISHABLE_KEY=" \
              | grep -vE "^MAIL_(SMTP_HOST|SMTP_PORT|SMTP_USER|SMTP_PASS|FROM|REPLY_TO|SUPPORT_TO|UNSUB_SECRET|UNSUB_MAILTO|LIFECYCLE_ENABLED|LIFECYCLE_INTERVAL_SEC|BILLING_ENABLED|SITE_BASE|MARKETING_ENABLED|MARKETING_INTERVAL_SEC|WELCOME_ENABLED|WELCOME_AFTER|WELCOME_LOOKBACK_HOURS|CAMPAIGNS_ENABLED|THROTTLE_PER_MIN)=" \
              > /etc/macro-api.env.new || true
            # Append fresh pool lines
            printf "%s\n" "$INPUT" >> /etc/macro-api.env.new
            chmod 600 /etc/macro-api.env.new
            mv /etc/macro-api.env.new /etc/macro-api.env
            systemctl restart macro-api
            sleep 2
            systemctl is-active macro-api
          '
          echo "deployed: macro-api restarted with OAuth pool env"

      - name: push OAuth pool + ADMIN_GH_TOKEN + private owner scope to VPS admin env + restart
        # Independent step — OAuth step failure above does not block admin delivery.
        # Silently skips (::notice + exit 0) when ADMIN_GH_TOKEN secret is absent.
        # Pool keys + METAB_KEYS_ENABLED are also delivered here (strip-then-append,
        # idempotent) so the admin service can use the pool for orchestrator_chat.
        # The MAIL_* relay settings ride along too: an operator ticket REPLY is sent by
        # the admin process (admin/support_tickets.py -> app/mailer.py), so without them
        # the console records replies but cannot mail them (SEE W1).
        # NEVER echoes any token value.
        if: always()
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_GH_TOKEN }}
          T1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          T2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          T3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          T4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
          T5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
          T6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_6 }}
          T7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_7 }}
          METAB_KEYS_ENABLED: ${{ vars.METAB_KEYS_ENABLED }}
          MAIL_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_PASS: ${{ secrets.MAIL_SMTP_PASS }}
          MAIL_FROM_ADDR: ${{ secrets.MAIL_FROM }}
          MAIL_REPLY: ${{ secrets.MAIL_REPLY_TO }}
          MAIL_SUPPORT: ${{ secrets.MAIL_SUPPORT_TO }}
          MAIL_UNSUB: ${{ secrets.MAIL_UNSUB_SECRET }}
          # SEE W3 switches. All optional; absent => the documented defaults (lifecycle
          # OFF, billing mail ON, www host). MAIL_BILLING_ENABLED is separate from the
          # relay creds on purpose: it silences billing receipts WITHOUT stopping support
          # mail, so a misbehaving receipt is one env flip, not a relay teardown.
          MAIL_LIFECYCLE: ${{ secrets.MAIL_LIFECYCLE_ENABLED }}
          MAIL_LIFECYCLE_INT: ${{ secrets.MAIL_LIFECYCLE_INTERVAL_SEC }}
          MAIL_BILLING: ${{ secrets.MAIL_BILLING_ENABLED }}
          MAIL_BASE: ${{ secrets.MAIL_SITE_BASE }}
          # SEE W4 switches. All optional and all default OFF — the marketing sweeper is
          # inert until MAIL_MARKETING_ENABLED is set, and each leg needs its own flag on
          # top of that. MAIL_WELCOME_AFTER is the one with teeth: it is the activation
          # date, and with it UNSET the welcome sweeper sends NOTHING rather than mailing
          # every account that has ever existed. Arming MAIL_WELCOME_ENABLED without
          # setting it is therefore safe, not a mass-mail. MAIL_SITE_BASE above is reused
          # for the unsubscribe links — no second host name.
          MAIL_MKT: ${{ secrets.MAIL_MARKETING_ENABLED }}
          MAIL_MKT_INT: ${{ secrets.MAIL_MARKETING_INTERVAL_SEC }}
          MAIL_WELCOME: ${{ secrets.MAIL_WELCOME_ENABLED }}
          MAIL_WELCOME_AT: ${{ secrets.MAIL_WELCOME_AFTER }}
          MAIL_WELCOME_BACK: ${{ secrets.MAIL_WELCOME_LOOKBACK_HOURS }}
          MAIL_CAMPAIGNS: ${{ secrets.MAIL_CAMPAIGNS_ENABLED }}
          MAIL_THROTTLE: ${{ secrets.MAIL_THROTTLE_PER_MIN }}
          MAIL_UNSUB_MAILTO_ADDR: ${{ secrets.MAIL_UNSUB_MAILTO }}
          SB_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          SB_OPERATOR_USER_ID: ${{ secrets.SUPABASE_OPERATOR_USER_ID }}
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::notice::ADMIN_GH_TOKEN secret absent — skipping admin env push"
            exit 0
          fi
          [ -n "$SSH_KEY" ] || { echo "::error::VPS_DEPLOY_KEY secret is empty/absent"; exit 1; }
          umask 077
          KEYFILE="$RUNNER_TEMP/vps_admin_key"
          printf '%s\n' "$SSH_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT

          # Build KEY=VALUE lines: GH_TOKEN + pool keys + METAB_KEYS_ENABLED
          # _add sanitizes the value (strips \r, \n, spaces) to guarantee one
          # token per line — mirrors the first step's sanitization.
          _lines=""
          _add() { local n="$1" v; v="$(printf '%s' "$2" | tr -d '\r\n ')"; if [ -n "$v" ]; then _lines="${_lines}${n}=${v}"$'\n'; fi; }
          _addv() { local n="$1" v; v="$(printf '%s' "$2" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"; if [ -n "$v" ]; then _lines="${_lines}${n}=${v}"$'\n'; fi; }
          _add GH_TOKEN "$ADMIN_TOKEN"
          _add CLAUDE_CODE_OAUTH_TOKEN_1 "$T1"
          _add CLAUDE_CODE_OAUTH_TOKEN_2 "$T2"
          _add CLAUDE_CODE_OAUTH_TOKEN_3 "$T3"
          _add CLAUDE_CODE_OAUTH_TOKEN_4 "$T4"
          _add CLAUDE_CODE_OAUTH_TOKEN_5 "$T5"
          _add CLAUDE_CODE_OAUTH_TOKEN_6 "$T6"
          _add CLAUDE_CODE_OAUTH_TOKEN_7 "$T7"
          _add METAB_KEYS_ENABLED "${METAB_KEYS_ENABLED:-3,4,5,6,7}"
          # SEE W1 mail relay — the admin console mails ticket replies.
          _add  MAIL_SMTP_HOST   "$MAIL_HOST"
          _add  MAIL_SMTP_PORT   "$MAIL_PORT"
          _add  MAIL_SMTP_USER   "$MAIL_USER"
          _addv MAIL_SMTP_PASS   "$MAIL_PASS"
          _addv MAIL_FROM        "$MAIL_FROM_ADDR"
          _addv MAIL_REPLY_TO    "$MAIL_REPLY"
          _addv MAIL_SUPPORT_TO  "$MAIL_SUPPORT"
          _addv MAIL_UNSUB_SECRET "$MAIL_UNSUB"
          _add  MAIL_LIFECYCLE_ENABLED      "$MAIL_LIFECYCLE"
          _add  MAIL_LIFECYCLE_INTERVAL_SEC "$MAIL_LIFECYCLE_INT"
          _add  MAIL_BILLING_ENABLED        "$MAIL_BILLING"
          _add  MAIL_SITE_BASE              "$MAIL_BASE"
          _add  MAIL_MARKETING_ENABLED       "$MAIL_MKT"
          _add  MAIL_MARKETING_INTERVAL_SEC  "$MAIL_MKT_INT"
          _add  MAIL_WELCOME_ENABLED         "$MAIL_WELCOME"
          # _addv, NOT _add: this is an ISO DATETIME and `2026-07-26 12:00:00` is a
          # legal one. _add runs `tr -d '\r\n '`, which would deliver
          # `2026-07-2612:00:00` — unparseable, and _parse_dt treats unparseable
          # exactly like unset, so the welcome leg would silently send NOTHING with
          # the secret sitting right there on the box looking correct.
          _addv MAIL_WELCOME_AFTER           "$MAIL_WELCOME_AT"
          _add  MAIL_WELCOME_LOOKBACK_HOURS  "$MAIL_WELCOME_BACK"
          _add  MAIL_CAMPAIGNS_ENABLED       "$MAIL_CAMPAIGNS"
          _add  MAIL_THROTTLE_PER_MIN        "$MAIL_THROTTLE"
          _addv MAIL_UNSUB_MAILTO            "$MAIL_UNSUB_MAILTO_ADDR"
          # The admin process mails ticket replies through app/mailer.py, whose email_log
          # idempotency ledger is a service-role PostgREST write. Without this key the
          # mailer logs "ledger unavailable" and sends WITHOUT the duplicate guard, so the
          # reply lane's idempotency is dark. Optional like every other key here.
          _add  SUPABASE_SERVICE_ROLE_KEY "$SB_SERVICE_ROLE"
          # Explicit owner scope for private operator bridges such as Trade Memory.
          # Multiple auth accounts exist, so absence means fail closed rather than enumerate.
          _add  SUPABASE_OPERATOR_USER_ID "$SB_OPERATOR_USER_ID"

          printf '%s' "$_lines" | ssh -i "$KEYFILE" \
            -o StrictHostKeyChecking=accept-new root@146.190.142.17 '
            set -euo pipefail
            umask 077
            INPUT=$(cat)
            touch /etc/macro-admin.env
            # Strip existing GH_TOKEN + pool lines + METAB_KEYS_ENABLED + MAIL_* (idempotent)
            grep -v "^GH_TOKEN=" /etc/macro-admin.env \
              | grep -vE "^CLAUDE_CODE_OAUTH_TOKEN(_[0-9]+)?=" \
              | grep -v "^METAB_KEYS_ENABLED=" \
              | grep -vE "^MAIL_(SMTP_HOST|SMTP_PORT|SMTP_USER|SMTP_PASS|FROM|REPLY_TO|SUPPORT_TO|UNSUB_SECRET|UNSUB_MAILTO|LIFECYCLE_ENABLED|LIFECYCLE_INTERVAL_SEC|BILLING_ENABLED|SITE_BASE|MARKETING_ENABLED|MARKETING_INTERVAL_SEC|WELCOME_ENABLED|WELCOME_AFTER|WELCOME_LOOKBACK_HOURS|CAMPAIGNS_ENABLED|THROTTLE_PER_MIN)=" \
              | grep -v "^SUPABASE_SERVICE_ROLE_KEY=" \
              | grep -v "^SUPABASE_OPERATOR_USER_ID=" \
              > /etc/macro-admin.env.new || true
            printf "%s\n" "$INPUT" >> /etc/macro-admin.env.new
            chmod 600 /etc/macro-admin.env.new
            mv /etc/macro-admin.env.new /etc/macro-admin.env
            systemctl restart admin
            sleep 2
            systemctl is-active admin
          '
          echo "deployed: admin restarted with GH_TOKEN + OAuth pool env"
