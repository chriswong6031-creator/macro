name: deploy-api-secrets
# Stage 1 of a two-stage, operator/orchestrator-driven secret arm for
# ask-the-brain live mode (W8b): the launchd self-hosted runner is sandboxed
# away from ~/.ssh (two failed direct-SSH attempts, runs 28728692156 /
# 28728735102), so this job only HANDS OFF the token: it writes
# CLAUDE_CODE_OAUTH_TOKEN (masked in logs, 0600, same-user) into its own
# runner workspace parent — a path the job can write and the operator shell
# can read. Stage 2 (orchestrator shell, which has SSH): pipe the file to
# /etc/macro-api.env on the VPS, restart macro-api, and DELETE the handoff
# file. The file must never be committed (path is outside the repo tree).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: write token handoff into runner workspace
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is empty/absent"; exit 1; }
          echo "debug: user=$(id -un) home=$HOME workspace=$GITHUB_WORKSPACE"
          DEST="$GITHUB_WORKSPACE/../oauth_handoff.tmp"
          umask 077
          printf '%s' "$TOKEN" > "$DEST"
          chmod 600 "$DEST"
          echo "handoff written to: $DEST"
