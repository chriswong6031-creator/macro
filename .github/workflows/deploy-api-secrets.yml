name: deploy-api-secrets
# One-shot, operator-triggered: pushes CLAUDE_CODE_OAUTH_TOKEN from the repo's
# Actions secrets into the VPS macro-api service env (/etc/macro-api.env,
# root-only 0600) and restarts the service — arming ask-the-brain live mode
# (W8b PR2; engine/llm_auth resolves OAuth-first). The secret transits the
# self-hosted runner's env + an SSH stdin pipe only: never a file on the
# runner, never a command-line argument, never committed, masked in logs.
# Idempotent: preserves any other keys already in the env file.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: push OAuth token to VPS macro-api env + restart
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is empty/absent"; exit 1; }
          printf '%s' "$TOKEN" | ssh -i "$HOME/.ssh/macro_dashboard_deploy_v2" \
            -o StrictHostKeyChecking=accept-new root@146.190.142.17 '
            set -euo pipefail
            umask 077
            TOKEN=$(cat)
            touch /etc/macro-api.env
            grep -v "^CLAUDE_CODE_OAUTH_TOKEN=" /etc/macro-api.env > /etc/macro-api.env.new || true
            printf "CLAUDE_CODE_OAUTH_TOKEN=%s\n" "$TOKEN" >> /etc/macro-api.env.new
            chmod 600 /etc/macro-api.env.new
            mv /etc/macro-api.env.new /etc/macro-api.env
            systemctl restart macro-api
            sleep 2
            systemctl is-active macro-api
          '
          echo "deployed: macro-api restarted with OAuth env"
