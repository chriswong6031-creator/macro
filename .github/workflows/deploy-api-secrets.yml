name: deploy-api-secrets
# Operator-triggered: arms ask-the-brain live mode (W8b) by pushing
# CLAUDE_CODE_OAUTH_TOKEN into the VPS macro-api env and restarting the
# service. The self-hosted runners execute in an ISOLATED filesystem
# namespace (no host ~/.ssh, no shared paths — verified runs 28728692156 /
# 28728735102 / 28728773840), so the SSH key rides in as the VPS_DEPLOY_KEY
# repo secret, materialized 0600 in RUNNER_TEMP for the job only. Both
# secrets are masked in logs; the env write is idempotent (preserves other
# keys); engine/llm_auth resolves OAuth-first so macro-api picks it up.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: push OAuth token to VPS macro-api env + restart
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is empty/absent"; exit 1; }
          [ -n "$SSH_KEY" ] || { echo "::error::VPS_DEPLOY_KEY secret is empty/absent"; exit 1; }
          umask 077
          KEYFILE="$RUNNER_TEMP/vps_key"
          printf '%s\n' "$SSH_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s' "$TOKEN" | ssh -i "$KEYFILE" \
            -o StrictHostKeyChecking=accept-new root@146.190.142.17 '
            set -euo pipefail
            umask 077
            TOKEN=$(cat | tr -d "\r\n ")   # secret may carry pasted newlines — a token is one line
            touch /etc/macro-api.env
            grep -v "^CLAUDE_CODE_OAUTH_TOKEN=" /etc/macro-api.env > /etc/macro-api.env.new || true
            printf "CLAUDE_CODE_OAUTH_TOKEN=%s\n" "$TOKEN" >> /etc/macro-api.env.new
            chmod 600 /etc/macro-api.env.new
            mv /etc/macro-api.env.new /etc/macro-api.env
            systemctl restart macro-api
            sleep 2
            systemctl is-active macro-api
          '
          echo "deployed: macro-api restarted with OAuth env"

      - name: push ADMIN_GH_TOKEN to VPS admin env + restart
        # FIX-8: independent step so OAuth failure above does not block admin delivery.
        # Silently skips (::notice + exit 0) when ADMIN_GH_TOKEN secret is absent —
        # the OAuth step runs regardless of this step's outcome.
        # NEVER echoes the token value.
        if: always()
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_GH_TOKEN }}
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::notice::ADMIN_GH_TOKEN secret absent — skipping admin env push"
            exit 0
          fi
          [ -n "$SSH_KEY" ] || { echo "::error::VPS_DEPLOY_KEY secret is empty/absent"; exit 1; }
          umask 077
          KEYFILE="$RUNNER_TEMP/vps_admin_key"
          printf '%s\n' "$SSH_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s' "$ADMIN_TOKEN" | ssh -i "$KEYFILE" \
            -o StrictHostKeyChecking=accept-new root@146.190.142.17 '
            set -euo pipefail
            umask 077
            TOKEN=$(cat | tr -d "\r\n ")
            touch /etc/macro-admin.env
            grep -v "^GH_TOKEN=" /etc/macro-admin.env > /etc/macro-admin.env.new || true
            printf "GH_TOKEN=%s\n" "$TOKEN" >> /etc/macro-admin.env.new
            chmod 600 /etc/macro-admin.env.new
            mv /etc/macro-admin.env.new /etc/macro-admin.env
            systemctl restart admin
            sleep 2
            systemctl is-active admin
          '
          echo "deployed: admin restarted with GH_TOKEN env"
