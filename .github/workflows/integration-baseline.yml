name: integration-baseline
# Fast source-main circuit breaker for the merge train.
#
# ci.yml proves each PR head, but a busy main can still become red through a
# missed path trigger, generated sibling drift, or a direct source/control-plane
# push. The six-hourly ci-main-heartbeat discovers that class too late: by then
# dozens of unrelated PRs may have inherited the same failure. This workflow
# publishes one cheap, deterministic verdict after every SOURCE/CONTROL change
# on main. merge-on-green reads the latest run and pauses ordinary merges while
# it is pending or red. Only an explicitly labelled `main-red-repair` PR may
# cross a red baseline, and it must still carry fully green PR checks.
#
# Data/site-only publisher commits deliberately do not retrigger this lane. The
# latest successful source verdict remains valid for those descendants; render
# and live-data health keep their existing dedicated guards.
on:
  push:
    branches: [main]
    paths:
      - ".github/ci/**"
      - ".github/workflows/**"
      - "admin/**"
      - "app/**"
      - "collectors/**"
      - "config/**"
      - "engine/**"
      - "lib/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "**/*.py"
      - "**/*.j2"
      - "**/*.yml"
      - "**/*.yaml"
      - "config.yml"
      - "pyproject.toml"
      - "requirements*.txt"
  # KEEPALIVE — the push trigger alone cannot keep this proof FRESH.
  #
  # merge_on_green pauses every ordinary merge once the newest green baseline
  # crosses BASELINE_MAX_AGE_HOURS (6h), and only a SOURCE push to main
  # re-proves it. Merges are what produce source pushes, so a quiet main is
  # SELF-LOCKING: no merges -> no source push -> proof ages out -> still no
  # merges. Measured over the 3.4 days to 2026-08-19, three green-to-green gaps
  # crossed the bound, every one of them an overnight window:
  #     08-15 17:10Z -> 23:57Z         6.8h
  #     08-16 20:43Z -> 08-17 02:43Z   6.0h
  #     08-18 20:53Z -> 08-19 03:22Z   6.5h
  # Each paused the whole armed backlog ("4 baseline-blocked ... source main
  # baseline is pending") against a main that was green, until the sweeper's own
  # ensure_integration_baseline noticed the staleness and dispatched -- a ~30 min
  # lag bounded only by the sweep interval, and it reads as "the merge train is
  # broken" to anyone watching.
  #
  # Every 4h keeps the proof inside the 6h bound with 2h of margin for a run
  # that has measured 4-14 min. Cost is negligible and lands nowhere sensitive:
  # this job is `runs-on: ubuntu-latest` on the Enterprise hosted pool (500
  # jobs), so the keepalive never competes with the self-hosted render or
  # merge-control lanes. Minute 17 keeps it off the :00 hosted-cron herd.
  #
  # REJECTED ALTERNATIVE -- "skip the age bound when main's SOURCE tree is
  # unchanged since the last green proof". That sounds cheaper and is wrong: the
  # age bound exists precisely because the path filter above is NOT trusted to
  # be complete (see the header -- "a missed path trigger, generated sibling
  # drift"). Deciding freshness with the same path list that missed the change
  # inherits the exact blind spot the bound is there to cover. Re-proving on a
  # clock is the only version that cannot be fooled by a path the filter forgot.
  schedule:
    - cron: "17 1,5,9,13,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the newest source descendant matters. A later source push supersedes
  # the proof for an older one; data-only pushes do not enter this group.
  group: integration-baseline-main
  # cancel-in-progress FLIPPED to false 2026-08-07. `true` cancelled the RUNNING
  # proof, not just superseded pending ones, and under load that means NO proof ever
  # completes: measured over ~3h on 2026-08-07, the last 60 runs were 59 cancelled +
  # 1 running, ZERO success, with the newest success 5h stale. Source pushes land here
  # every 1-2 minutes during a merge drain and the hosted queue sat 100-180 deep, so
  # every run was killed before it ever acquired a runner.
  #
  # That is a livelock with real cost. merge_on_green's circuit breaker reads a
  # never-concluding newest run as `pending`, and pending blocks ordinary merges — so
  # the sweeper reported "11 baseline-blocked" against a main that was in fact green.
  # The armed backlog cannot drain while the thing that proves main is drained is
  # itself being cancelled by the drain's own pushes.
  #
  # `false` still coalesces: GitHub allows ONE pending run per group, so a newer push
  # still supersedes an older PENDING proof. What changes is that the run which already
  # holds a runner is allowed to finish. Progress is then guaranteed — one proof
  # concludes, the breaker opens, and the next queued proof takes over.
  #
  # The cost is bounded and already handled: a concluded proof may be for a SHA one or
  # two source pushes behind main's tip. The sweeper's ancestry check requires the proof
  # to be an ancestor of the PR's base, which an older main SHA is, and #4638's walk
  # already picks the newest CONCLUDED run rather than the newest run. A slightly older
  # proof is strictly better than the permanent absence of one.
  cancel-in-progress: false

jobs:
  baseline:
    name: integration-baseline
    # EVERY event runs on the hosted pool. The self-hosted detour is retired.
    #
    # History, because the reversal is the point: this job was pinned to
    # `["self-hosted","render-linux"]` on main (2026-08-08) so the circuit
    # breaker would not queue behind hosted PR packs. That constraint is gone —
    # the repository is on the MastermindX Enterprise plan (500 hosted jobs)
    # and ci-pack already starts within seconds on ubuntu-latest. The detour
    # now COSTS the merge train: measured 2026-08-13, consecutive main-ref
    # baselines 31667559199 / 31667698650 died inside checkout on render-linux
    # (codeload.github.com HttpClient.Timeout of 100s; git fetch early EOF;
    # promisor-remote cancel). merge-on-green reads a failed conclusion as
    # `red` and pauses EVERY ordinary merge; there was no `main-red-repair`
    # labelled PR, so the whole armed backlog sat behind a runner-network
    # flake. The same class already fired 2026-08-12 21:14Z (checkout action
    # download timed out after 3 attempts).
    #
    # Hosted VMs are fresh, talk to GitHub on GitHub's network, and cannot
    # inherit a sibling's sparse checkout, so the render-linux sparse-clear
    # guard is no longer load-bearing. Do not route this job back onto
    # render-linux without a new measurement that hosted pickup is worse than
    # those checkout failures; that pool is the render lane.
    runs-on: ubuntu-latest
    # Bound the complete job at 30 minutes so a real failure still terminates
    # promptly. The old 12-minute ceiling was a self-hosted-checkout artefact.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          # fetch-depth 0 -> 1 (2026-08-13). NOTHING in this job reads repository
          # history: check_workflow_yaml parses .github/workflows off disk,
          # check_skip_only_suites walks job definitions, and the two pytest
          # modules are unit tests (test_ci_pack's only git use is `git init` on
          # its own tmp fixture). A full-history clone of a ~60k-path tree was
          # therefore pure cost on the persistent render-linux workspace — and it
          # was the cost that kept killing the breaker: run 31707607311 spent its
          # entire 30-minute ceiling INSIDE checkout@v4 (13:57:51Z -> 14:27:49Z,
          # every later step skipped), as did 31700629027 and 31698155510, while
          # the last SUCCESS (31665323888) finished the whole job in 3m57s.
          #
          # This is the third turn of the same screw. The ceiling was already
          # raised 12 -> 30 minutes for "two consecutive post-merge proofs
          # cancelled while still inside checkout" (see timeout-minutes above);
          # raising it again would buy another few weeks. Removing work the job
          # never needed is the fix that does not need a fourth raise.
          #
          # Cost of being wrong is bounded and loud: any step that did need
          # history fails immediately and visibly on this workflow, which is
          # itself the gate everyone watches.
          fetch-depth: 1
          # AND the tree itself (2026-08-13, second attempt — the first was wrong).
          # fetch-depth alone did NOT fix this: run 31723440810 carried
          # `fetch-depth: 1` in its own SHA (verified) and still spent 28m17s in
          # checkout@v4 before dying at the ceiling. So the cost is not history,
          # it is MATERIALISING ~61k paths into the persistent render-linux
          # workspace. Measured split:
          #     data/   41,302 paths
          #     site/   10,958 paths
          #     what this job actually reads  ~9,000
          # This job parses .github/workflows, walks job definitions, and runs two
          # unit-test modules. It opens nothing under site/ or data/ — proven by
          # running its COMPLETE gate set in a worktree that has neither:
          # check_workflow_yaml selftest + 83 workflows parsed, check_skip_only_suites
          # selftest + full run, and pytest test_ci_pack + test_merge_on_green
          # (365 passed). Excluding those two directories drops ~85% of the
          # checkout for zero loss of coverage.
          #
          # Non-cone with negation, deliberately: it states the EXCLUSION, so a new
          # top-level directory is included by default and cannot silently fall out
          # of this job's view the way a cone allowlist would let it.
          sparse-checkout: |
            /*
            !/site/
            !/data/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install control-plane dependencies
        # Every command below is static/manifest analysis; none imports the
        # product data stack. Keep the circuit breaker cheap enough to run after
        # every source merge instead of recreating the full CI bottleneck here.
        run: pip install pytest pyyaml
      - name: workflow grammar selftest
        run: python scripts/check_workflow_yaml.py --selftest
      - name: every workflow must parse
        run: python scripts/check_workflow_yaml.py .github/workflows
      - name: transitional runner-routing policy
        run: python scripts/check_runner_policy.py
      - name: hosted-runner packing and merge-train contracts
        run: python -m pytest tests/test_ci_pack.py tests/test_merge_on_green.py tests/test_runner_policy.py tests/test_ci_canary_tools.py tests/test_ci_canary_workflows.py -q
      - name: skip-only detector selftest
        run: python scripts/check_skip_only_suites.py --selftest
      - name: no named suite may skip in every owning job
        run: python scripts/check_skip_only_suites.py
