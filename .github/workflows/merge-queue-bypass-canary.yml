name: merge-queue bypass canary

# Temporary, deliberately inert proof that repository-owned producers can still
# advance a queue-protected branch through the explicit GitHub Actions App bypass.
# The workflow exists only for the native-queue canary and is removed after the
# pilot receipt. It can run only from trusted main and can push only the fixed
# pilot branch; no input can select a ref or executable payload.
on:
  workflow_dispatch:
    inputs:
      nonce:
        description: "Short audit label for this one pilot receipt"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: merge-queue-bypass-canary
  cancel-in-progress: false

jobs:
  push-pilot-receipt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/merge-queue-pilot
          fetch-depth: 1
      - name: commit one inert receipt to the fixed pilot branch
        env:
          NONCE: ${{ inputs.nonce }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$NONCE" =~ ^[A-Za-z0-9._-]{1,48}$ ]]; then
            echo "::error title=canary-input::nonce must be 1-48 safe audit characters"
            exit 2
          fi
          test "$(git branch --show-current)" = "codex/merge-queue-pilot"
          mkdir -p docs/merge-queue-canary
          receipt="docs/merge-queue-canary/producer-bypass-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          printf '%s\n' \
            '# Native merge-queue producer-bypass canary' \
            '' \
            "- nonce: \`$NONCE\`" \
            "- workflow_run: \`$GITHUB_RUN_ID\`" \
            "- workflow_attempt: \`$GITHUB_RUN_ATTEMPT\`" \
            > "$receipt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$receipt"
          git commit -m "ci-canary: prove protected pilot producer bypass [skip ci]"
          git push origin HEAD:refs/heads/codex/merge-queue-pilot
