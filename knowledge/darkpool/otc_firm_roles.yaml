# Non-ATS OTC firm roles — who is on the other side of internalized off-exchange volume.
#
# WHAT THIS IS
# ------------
# FINRA's OTC Transparency non-ATS feed (OTC_W_SMBL_FIRM) names the FIRM that
# internalized each week's off-exchange share volume. This file maps those firm names
# to their PRIMARY BUSINESS so the desk can separate "retail order flow being
# internalized by a wholesaler" from "an institutional block crossed at a bank desk".
# Both print off-exchange and the old desk called both "dark pool".
#
# WHAT THIS IS NOT
# ----------------
# A LABELLED HEURISTIC on each firm's primary business — NOT a measurement of who was
# actually trading, and NOT a directional signal. Display tier only, no rank/size/gate
# authority. Large firms run several businesses at once (Goldman and Morgan Stanley have
# both institutional desks and market-making arms; Jane Street and HRT do ETF and
# institutional business alongside retail wholesaling), so a firm's row here describes
# where the BULK of its internalized share volume comes from, not every trade it prints.
#
# GROUNDING (measured over data/finra_otc_nonats/ weeks 2026-06-22 and 2026-06-29)
# --------------------------------------------------------------------------------
# The split is visible in the data, not just asserted. Average print PRICE separates the
# two roles cleanly, because retail wholesalers handle high-volume lower-priced names
# while bank desks handle institutional business in higher-priced ones:
#
#   retail_wholesaler   Citadel $29.07 · Virtu $31.11 · HRT $22.38 · Jane St $34.81
#                       · G1 $44.92 · Two Sigma $41.20 · GTS $27.22
#   institutional_desk  Goldman $137.72 · UBS $84.49 · Citi $167.63 · JPM $192.57
#                       · Morgan Stanley $243.03 (avg print 4,646 shares, 11 symbols)
#                       · TD $238.02 · SG Americas $539.86
#   retail_broker       DriveWealth avg print 7 shares (fractional retail)
#                       · Interactive Brokers 76 shares
#
# UNATTRIBUTABLE
# --------------
# "De Minimis Firms" is FINRA's own aggregation bucket for small reporters and is
# 36.4% of non-ATS share volume — the single largest entry. It is genuinely unknowable
# and is NEVER folded into either side; it reports as `unclassified` and the page prints
# it. Any firm absent from this file is also `unclassified` — never defaulted.
#
# MAINTENANCE
# -----------
# Firm names come from FINRA's `marketParticipantName` verbatim (non-ATS rows carry NO
# MPID). Match is exact on the upper-cased name. When FINRA renames a reporter the old
# name simply stops appearing and the new one lands in `unclassified` until added here —
# a visible gap, not a silent misattribution.

schema: darkpool_otc_firm_roles.v1
tier: display
is_context_only: true

roles:
  retail_wholesaler:
    label:
      en: "Retail wholesaler"
      zh: "散户批发商"
