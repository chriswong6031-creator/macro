# TXI seed chain — vol-regime shift → systematic deleveraging → high-beta unwind.
# Seed list §7 ("vol-regime shift → systematic deleveraging → high-beta unwind;
# vol_regime + positioning"). Display-tier. Reads data/regime/latest.json.
chain: vol_regime_deleveraging
rev: 2                      # W4: low_liquidity re-bound + hop display labels (see changelog)
tier: hypothesis
title:
  en: "Vol-regime shift → systematic deleveraging → high-beta unwind"
  zh: "波动率状态转变 → 系统性去杠杆 → 高贝塔平仓"

nodes:
  vol_expansion:
    title: {en: "Vol regime expanding / stress rising", zh: "波动率状态扩张／压力上升"}
    src: regime_state
    # data/regime/latest.json vol_regime block. The engine's 4-state label
    # (engine/vol_regime._regime_label) is {calm-contango, normalizing, warning,
    # backwardation-stress}; the two STRESS states are 'warning' and
    # 'backwardation-stress'. Fire on either, OR on a VIX>=25 floor. Uses the
    # categorical regime label — the engine's own scored-gate-honest state.
    test:
      any:
        - {path: "vol_regime.regime", op: in, value: ["warning", "backwardation-stress"]}
        - {path: "vol_regime.vix", op: gte, value: 25}
  systematic_delever:
    title: {en: "Systematic strategies cutting exposure", zh: "系统性策略削减敞口"}
    src: regime_state
    # vol_regime.vol_target_scalar < 1 = vol-target/risk-parity books scaling DOWN gross
    # (a mechanical deleveraging signal the engine already computes). Deeper cut = <0.85.
    test: {path: "vol_regime.vol_target_scalar", op: lt, value: 0.85}
  highbeta_unwind:
    title: {en: "High-beta cohort unwinding", zh: "高贝塔板块平仓"}
    src: yahoo
    # High-beta cohort RS proxy: SPHB (S&P 500 High Beta) relative to SPLV (Low
    # Volatility) over 21d < 0 — high-beta under-performing low-vol = a beta unwind.
    # Per-name crowding/positioning-HHI resolution is W2.
    test: {series: "SPHB", vs: "SPLV", metric: rs, window: 21, op: lt, value: 0}

hops:
  - from: vol_expansion
    to: systematic_delever
    sign: "+"
    lag_d: [0, 21]
    label:
      en: "Vol stress → books cut gross"
      zh: "波动率压力 → 策略削减总敞口"
    condition:
      en: "realized-vol expansion (not just an implied-vol bid) — vol-target books resize on realized"
      zh: "已实现波动率扩张（而非仅隐含波动率买盘）——波动率目标策略按已实现波动率调整"
    mechanism:
      en: "a higher vol regime pushes vol-target / risk-parity / CTA books above their vol budget → they mechanically cut gross exposure"
      zh: "更高的波动率状态使波动率目标/风险平价/CTA策略超出其波动率预算→机械性削减总敞口"
    prior: "theory (vol-targeting mechanics) — vol_regime.vol_target_scalar is the shipped proxy"
  - from: systematic_delever
    to: highbeta_unwind
    sign: "+"
    lag_d: [0, 42]
    label:
      en: "Deleveraging → high-beta unwinds"
      zh: "去杠杆 → 高贝塔平仓"
    condition:
      en: "crowded high-beta leadership (an unwind needs positioning to unwind FROM)"
      zh: "拥挤的高贝塔领导地位（平仓需要有可平的仓位）"
    mechanism:
      en: "deleveraging is sold pro-rata to beta and liquidity → the highest-beta, most-crowded names unwind hardest relative to low-vol"
      zh: "去杠杆按贝塔与流动性比例卖出→最高贝塔、最拥挤的名字相对低波动股平仓最剧烈"
    prior: "theory (beta-proportional deleveraging) + froth_fragility.unwind_risk co-signal"

falsifiers:
  # deleveraging underway but high-beta is OUTPERFORMING low-vol for 42d — no unwind.
  - when: {series: "SPHB", vs: "SPLV", metric: rs, window: 42, op: gt, value: 0}
    note: "systematic_delever with high-beta cohort RS>0 vs low-vol over 42d — the unwind leg is falsified"

null_model: "does vol-regime conditioning beat unconditional low-vol-factor momentum on the high-beta cohort?"

exposure_screens:            # W2 — structured mini-form, resolved over site/stockdata/<T>.json
  high_beta_proxy:
    label: {en: "High-beta (vol proxy)", zh: "高贝塔（波动率代理）"}
    # PROXY CHANNEL (label says "proxy" in both languages, masterplan §scoping.3): the
    # substrate carries NO market/equity beta field (only macro_sensitivity.rate_beta, which
    # is RATE sensitivity, not market beta). Annualized realized vol (risk_sizing.vol_ann_pct,
    # present ~1610) is the available proxy for "sold hardest in a deleveraging" — high-vol
    # names take the largest pro-rata cut when gross comes down. Named *_proxy so no consumer
    # mistakes it for a true beta screen.
    note: {en: "PROXY (not true beta): the substrate has no market-beta field, so this uses annualized realized volatility (risk_sizing.vol_ann_pct) top-quintile as the deleveraging-exposure proxy — high-vol names are cut hardest pro-rata to risk.",
           zh: "代理（非真实贝塔）：个股数据无市场贝塔字段，故使用年化已实现波动率（risk_sizing.vol_ann_pct）前五分位作为去杠杆敞口代理——高波动名字按风险比例被最先削减。"}
    any:
      - {path: risk_sizing.vol_ann_pct, op: pctile_gte, value: 0.80}   # top-quintile realized vol
  crowded_positioning:
    label: {en: "Crowded positioning", zh: "拥挤持仓"}
    note: {en: "crowded names with concentrated holders or a heavy short — the positioning to unwind FROM",
           zh: "持有人集中或空头沉重的拥挤名字——可平仓的仓位来源"}
    any:
      - {path: smart_money.ownership_hhi, op: pctile_gte, value: 0.80}   # concentrated institutional ownership (HHI)
      - {path: positioning.short.pct_float, op: pctile_gte, value: 0.80} # heavy short interest (forced-cover fuel)
  low_liquidity:
    label: {en: "Low liquidity", zh: "低流动性"}
    # RE-BOUND (W4): the substrate DOES carry a 20-day average dollar-volume field
    # (tech.dollar_vol_20d = 20d-avg volume × price, written by engine/stock_technicals.py).
    # It is a LEVEL-OF-LIQUIDITY screen — the names most exposed to impact cost when a
    # deleveraging forces sales into a thin book — bottom-quintile 20d dollar volume of the
    # evaluable universe. Distinct from the DNR-104-killed volume-SPIKE / abnormal-volume
    # constructions: this is a standing liquidity level (how thick is the book), not a
    # detection of an unusual volume event. Absolute-vs-pctile: a pctile cut so membership
    # tracks the universe's own liquidity distribution; the numeric cut is printed. Names
    # without tech.dollar_vol_20d bucket as unevaluable — never silently safe/unsafe.
    note: {en: "names in the bottom quintile of 20-day average dollar volume (tech.dollar_vol_20d, a level-of-liquidity screen) — a deleveraging forces sales into a thinner book, so the least-liquid names take the largest impact-cost hit. A liquidity LEVEL, not a volume-spike detection (distinct from the killed abnormal-volume constructions). Names without the field bucket as unevaluable.",
           zh: "20日平均成交额（tech.dollar_vol_20d，流动性水平筛选）处于最低五分位的名字——去杠杆迫使卖单进入更薄的盘口，流动性最差的名字承受最大的冲击成本。这是流动性“水平”，而非成交量异动检测（区别于已弃用的异常成交量构造）。无该字段的名字归入无法评估桶。"}
    any:
      - {path: tech.dollar_vol_20d, op: pctile_lte, value: 0.20}   # bottom-quintile 20d avg dollar volume (level, not spike)

provenance:
  theory: ["vol-targeting mechanics", "beta-proportional deleveraging", "crowding unwind"]
  episodes: ["2018-Q1 (volmageddon)", "2020-Q1 (risk-parity unwind)", "2024-08 (carry/vol unwind)"]
  added_by: "TXI-W1"
  added_on: "2026-07-24"

changelog:
  - "rev 1 (W2 2026-07-24): exposure_screens migrated to the structured {all|any} mini-form.
     crowded_positioning resolves to REAL fields (smart_money.ownership_hhi pctile OR
     positioning.short.pct_float pctile). high_beta renamed high_beta_proxy and bound to a
     LABELED proxy — no market-beta field exists, so risk_sizing.vol_ann_pct pctile stands in
     (label + note say 'proxy' in both languages, masterplan §scoping.3). low_liquidity DROPPED
     with a bilingual note (no ADV/dollar-volume field)."
  - "rev 2 (W4 2026-07-25): (a) low_liquidity RE-BOUND — the rev-1 DROP note was wrong; the
     substrate DOES carry tech.dollar_vol_20d (20d avg volume × price, engine/stock_technicals.py).
     Bound to pctile_lte 0.20 = bottom-quintile 20d dollar volume, a LEVEL-of-liquidity screen
     (impact-cost exposure when a deleveraging forces sales into a thin book). Explicitly distinct
     from the DNR-104-killed volume-SPIKE / abnormal-volume constructions: this is a standing
     liquidity level, not an unusual-volume detection. Names without the field bucket unevaluable.
     (b) Added bilingual hop display labels (label:{en,zh}) to both hops for the W4 Cascade Monitor
     + site publication subset."

validator_note: >
  All nodes resolve against data/regime/latest.json (vol_regime.regime / vix /
  vol_target_scalar) and lib.store yahoo series (SPHB vs SPLV, both verified present).
  vol_expansion uses the engine's categorical vol-regime label — the two STRESS states
  ('warning', 'backwardation-stress', verified against engine/vol_regime._regime_label,
  NOT the guessed 'expanding/stressed' vocabulary) — OR a VIX>=25 floor via the `any` op.
  systematic_delever uses vol_target_scalar<0.85 —
  the engine's shipped vol-target deleveraging proxy. highbeta_unwind uses an SPHB-vs-SPLV
  RS proxy for the high-beta cohort; the per-name crowding/beta resolution is the W2
  resolver (froth_fragility.unwind_risk is the co-signal, surfaced there). tier=hypothesis
  (base rates untested until W3).
  W2 SCREENS (rev 1): crowded_positioning resolves to real substrate fields
  (smart_money.ownership_hhi, positioning.short.pct_float — both verified present). high_beta_
  proxy is a LABELED PROXY on risk_sizing.vol_ann_pct (no market-beta field exists in the
  substrate — only macro_sensitivity.rate_beta, a different quantity); low_liquidity is a
  DROPPED channel (no ADV/dollar-volume field), declared with a bilingual note, resolves:false.
