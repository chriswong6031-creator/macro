# TXI seed chain — dollar spike → EM / commodity / multinational-EPS headwind.
# Seed list §7; rides the forex_transmission dollar-channel edges. Display-tier.
chain: dollar_spike_em_multinational
rev: 2                      # W2 re-enable: geo_revenue.* channels live (see changelog)
tier: hypothesis
title:
  en: "Dollar spike → EM & multinational-EPS headwind"
  zh: "美元飙升 → 新兴市场与跨国企业盈利承压"

nodes:
  dollar_spike:
    title: {en: "Dollar strengthening on high real rates", zh: "高实际利率下美元走强"}
    src: forex_state
    # data/forex/latest.json dollar_desk block. Trend up AND crowded-ish positioning.
    test:
      all:
        - {path: "dollar_desk.trend", op: eq, value: up}
        - {path: "dollar_desk.usd_pos_pctile", op: gte, value: 60}
  usd_transmission_on:
    title: {en: "Dollar transmission channel active (EM a headwind)", zh: "美元传导通道启动（新兴市场承压）"}
    src: forex_state
    # forex_transmission writes usd_dir + headwind_for. The channel is 'on' for EM when
    # the dollar is strengthening AND EM equities are in headwind_for.
    test:
      all:
        - {path: "transmission.usd_dir", op: eq, value: strengthening}
        - {path: "transmission.headwind_for", op: in_contains, value: "EM equities"}
  em_derate:
    title: {en: "EM cohort under-performing", zh: "新兴市场板块相对走弱"}
    src: yahoo
    # EM cohort RS proxy: FXI (China large-cap, the transmission engine's own EM proxy)
    # relative to SPY over 63d < 0. Per-name multinational-EPS resolution is W2.
    test: {series: "FXI", vs: "SPY", metric: rs, window: 63, op: lt, value: 0}

hops:
  - from: dollar_spike
    to: usd_transmission_on
    sign: "+"
    lag_d: [0, 20]
    condition:
      en: "real-rate-driven strength (carry/haven bid), not a risk-on reflation dollar"
      zh: "实际利率驱动的走强（套息/避险买盘），而非风险偏好型再通胀美元"
    mechanism:
      en: "higher US real yields pull capital in → the dollar firms → the transmission map flags EM/commodity/gold as headwinds"
      zh: "美国实际收益率走高吸引资本流入→美元走强→传导图将新兴市场/商品/黄金标记为逆风"
    prior: "forex_transmission measured USD→asset correlations (dollar_desk.smile_decomp)"
  - from: usd_transmission_on
    to: em_derate
    sign: "+"
    lag_d: [0, 90]
    condition:
      en: "EM without a domestic-policy offset (no local easing cushioning the FX drag)"
      zh: "新兴市场无国内政策抵消（无本地宽松缓冲汇率拖累）"
    mechanism:
      en: "a firm dollar raises EM dollar-debt service and drags dollar-priced commodities and multinational overseas EPS → EM cohort de-rates"
      zh: "强美元抬高新兴市场美元债务偿付、拖累美元计价商品与跨国企业海外盈利→新兴市场板块下修"
    prior: "forex_transmission headwind_for(EM equities) + theory (dollar-debt channel)"

falsifiers:
  # dollar strengthening for 63d but the EM cohort is OUTPERFORMING — the drag is absent.
  - when: {series: "FXI", vs: "SPY", metric: rs, window: 63, op: gt, value: 0}
    note: "dollar_spike sustained but EM cohort RS>0 over 63d — the EM-drag leg is falsified"

null_model: "does dollar-channel conditioning beat unconditional dollar-momentum on the EM cohort?"

exposure_screens:            # W2 — structured mini-form; geo_revenue channels re-enabled at rev 2
  # rev 2: the three native channels are LIVE — collectors/edgar_geo_revenue.py parses 10-K
  # XBRL geographic disclosures (srt:StatementGeographicalAxis) into a per-ticker geo_revenue
  # block {foreign_pct, em_pct?, by_region?, ...} baked into site/stockdata/<T>.json
  # (PERCENT 0-100; emit-only-when-parseable, never estimated). Coverage is PARTIAL by
  # design (large caps mostly; skip histogram in data/edgar/geo_revenue.json meta) — names
  # without the block bucket as unevaluable in the resolver, never silently safe/unsafe.
  em_revenue_exposure:
    label: {en: "EM revenue exposure", zh: "新兴市场营收敞口"}
    # geo_revenue.em_pct is an explicit LOWER BOUND: only unambiguously-EM-classified
    # disclosed regions count (MSCI-EM-ish country codes + regions like Greater China /
    # Latin America); mixed aggregates (Asia-Pacific, EMEA, "International") never do.
    # Absolute cut (not pctile) so membership doesn't drift as coverage accrues.
    note: {en: "names with >=15% of revenue from explicitly-EM-classified regions in their 10-K geographic note (measured per-name; em_pct is a conservative lower bound — mixed aggregates never counted). Names without a parseable disclosure bucket as unevaluable.",
           zh: "10-K地区披露中明确属新兴市场的营收占比≥15%的名字（逐名实测；em_pct为保守下限——混合地区聚合不计入）。无可解析披露的名字归入无法评估桶。"}
    all:
      - {path: geo_revenue.em_pct, op: ">=", value: 15}   # PERCENT 0-100
  multinational_fx_translation:
    label: {en: "Multinational FX translation", zh: "跨国汇率折算"}
    note: {en: "US multinationals with >=40% foreign revenue (10-K geographic note, measured per-name) — overseas EPS shrinks in dollar terms as USD firms. PERCENT 0-100; unparseable names bucket as unevaluable.",
           zh: "海外营收占比≥40%的美国跨国企业（10-K地区披露，逐名实测）——美元走强时海外每股盈利以美元计缩水。百分比0-100；无法解析的名字归入无法评估桶。"}
    all:
      - {path: geo_revenue.foreign_pct, op: ">=", value: 40}   # PERCENT 0-100
  dollar_debt_burden:
    label: {en: "Dollar-debt burden", zh: "美元债务负担"}
    # STATED ASSUMPTION (not a silent proxy): a US filer's balance-sheet debt is treated as
    # USD-denominated (no currency-of-debt split exists in the substrate — unchanged from
    # rev 1). What rev 2 adds is the other leg, MEASURED: majority-foreign revenue. High
    # leverage + majority non-US revenue ≈ servicing dollar debt against non-dollar cash flows.
    note: {en: "leveraged names (top-third debt_to_assets) whose revenue is majority non-US (>=50%, 10-K geographic note) — dollar-debt service against non-dollar cash flows. Assumes US filers' debt is USD-denominated (stated assumption; no currency-of-debt field exists).",
           zh: "高杠杆（debt_to_assets前三分之一）且营收过半来自美国以外（≥50%，10-K地区披露）的名字——以非美元现金流偿付美元债务。假设美国申报者的债务以美元计价（明示假设；无债务币种字段）。"}
    all:
      - {path: geo_revenue.foreign_pct, op: ">=", value: 50}            # PERCENT 0-100
      - {path: financials.debt_to_assets, op: pctile_gte, value: 0.67}  # top-third leverage of evaluable universe
  em_commodity_sector_proxy:
    label: {en: "EM/commodity sector (proxy)", zh: "新兴市场/商品行业（代理）"}
    # PROXY CHANNEL (label + note say "proxy" in both languages, masterplan §scoping.3):
    # a real field (GICS sector, present ~1625) stood in (rev 1) for the then-missing
    # EM-demand revenue screen; from rev 2 it COMPLEMENTS em_revenue_exposure — sector
    # coverage is ~full while geo disclosure is partial. Materials + Energy are the
    # dollar-priced-commodity sectors whose demand and pricing carry the clearest EM/dollar
    # sensitivity. A SECTOR proxy, NOT a per-name revenue measurement; named *_proxy so no
    # consumer mistakes it for geo-revenue exposure.
    note: {en: "PROXY (sector, not revenue): GICS sector membership stands in for EM-demand exposure — Materials & Energy are the dollar-priced-commodity sectors most EM/dollar-sensitive. Complements em_revenue_exposure (rev 2): sector coverage is ~full, so it also catches names whose 10-K discloses no parseable geography. A coarse sector stand-in, not a revenue measurement.",
           zh: "代理（行业而非营收）：以GICS行业归属代表新兴市场需求敞口——材料与能源是对新兴市场/美元最敏感的美元计价商品行业。与rev 2的em_revenue_exposure互补：行业覆盖近乎全库，故也覆盖10-K无可解析地区披露的名字。粗略的行业替代，非营收测度。"}
    any:
      - {path: sector, op: in, value: ["Materials", "Energy"]}

provenance:
  theory: ["dollar-debt channel", "commodity dollar-pricing", "EPS translation"]
  episodes: ["1997-98 (Asia)", "2014-15 (taper/USD)", "2022 (USD wrecking ball)"]
  added_by: "TXI-W1"
  added_on: "2026-07-24"

changelog:
  - "rev 1 (W2 2026-07-24): exposure_screens migrated to the structured mini-form. This
     chain's native screens all need a per-name geographic-revenue field (geo_revenue.*) which
     is ABSENT from the entire substrate (0 files) — so em_revenue_exposure,
     multinational_fx_translation, and dollar_debt_burden are ALL DROPPED with bilingual notes
     (masterplan §scoping.3: note the gap, do not proxy silently). ONE clearly-labeled sector
     PROXY (em_commodity_sector_proxy: sector in {Materials, Energy}) is added for the
     commodity-dollar leg using a real field (GICS sector)."
  - "rev 2 (TXI geo_revenue re-enable 2026-07-25): the three DROPPED native channels are LIVE.
     collectors/edgar_geo_revenue.py (new) parses 10-K XBRL geographic disclosures
     (srt:StatementGeographicalAxis) → per-ticker geo_revenue {foreign_pct, em_pct?, by_region?}
     baked into site/stockdata (PERCENT 0-100; emit-only-when-parseable, never estimated;
     partial coverage by design — unparseable names bucket unevaluable). em_revenue_exposure
     binds geo_revenue.em_pct>=15 (explicit-EM lower bound); multinational_fx_translation
     binds geo_revenue.foreign_pct>=40; dollar_debt_burden binds foreign_pct>=50 AND
     debt_to_assets top-third (USD-debt as a STATED assumption — currency-of-debt split still
     absent). Absolute cuts (not pctile) so membership does not drift as coverage accrues.
     em_commodity_sector_proxy retained as the labeled sector complement for names without
     parseable disclosure."

validator_note: >
  NODE bindings (unchanged from rev 0): all nodes resolve against data/forex/latest.json
  (dollar_desk.trend / usd_pos_pctile; transmission.usd_dir / headwind_for) and lib.store yahoo
  series (FXI vs SPY). em_derate uses FXI as a cohort RS proxy.
  W2 SCREENS (rev 2): the three native channels are re-enabled against the NEW geo_revenue
  block (collectors/edgar_geo_revenue.py → data/edgar/geo_revenue.json → build_stock_library
  bake; fields are PERCENT 0-100). Coverage is PARTIAL by design (large caps mostly; the skip
  histogram = the printed null, in the store's meta.skips): a name without the block is
  UNEVALUABLE in every geo_revenue clause — never silently safe/unsafe. em_pct is a
  conservative lower bound (only unambiguously-EM regions count; mixed aggregates excluded).
  Cuts are ABSOLUTE (15/40/50), not percentile, so membership is stable as coverage accrues;
  dollar_debt_burden carries the stated USD-debt assumption (no currency-of-debt field). One
  labeled SECTOR proxy (em_commodity_sector_proxy) is retained for the commodity-dollar leg
  and for names without parseable geographic disclosure.
  tier=hypothesis (base rates untested until W3).
