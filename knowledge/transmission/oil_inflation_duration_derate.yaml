# TXI seed chain — the operator's oil→inflation→yields→duration-derate cascade.
# Masterplan §6 worked spec, bound to the REAL collected artifacts (see validator_note
# for the two node→field adjustments vs the prose spec). Display-tier; never scored.
chain: oil_inflation_duration_derate
rev: 2                      # W4: hop display labels (see changelog)
tier: hypothesis            # every node resolves + arms, but per-hop base rates untested (W3)
title:
  en: "Oil shock → inflation → yields → long-duration de-rate"
  zh: "油价冲击 → 通胀 → 收益率 → 长久期估值下修"

nodes:
  oil_shock:
    title: {en: "Oil supply shock", zh: "油价供给冲击"}
    src: yahoo
    # §6: "commodity/signals_oil, ret_60d > +25% AND MA50 slope up".
    # Bound to the WTI front series (yahoo CL=F) directly — same observable, no signals
    # artifact dependency; both legs must hold.
    test:
      all:
        - {series: "CL=F", metric: ret, window: 60, op: gt, value: 25}   # +25% (ret is in PERCENT)
        - {series: "CL=F", metric: ma_slope, window: 50, lookback: 5, op: gt, value: 0}
  breakeven_rise:
    title: {en: "10y breakeven rising", zh: "10年期盈亏平衡上行"}
    src: fred
    # §6: "transmission latest.state, T10YIE Δ30d > +15bp". Bound to the raw T10YIE
    # series (lib.store fred/T10YIE, col breakeven_10y, the permanent FRED breakeven
    # cache); 30d ≈ 22 trading days. Reads the true series, not the pre-binned decomp
    # velocity block (which only carries 20d/63d). ret_bp = absolute Δ in basis points.
    test: {series: "T10YIE", metric: ret_bp, window: 22, op: gt, value: 15}
  yield_rise:
    title: {en: "Real 10y yield rising fast", zh: "实际10年期收益率快速上行"}
    src: transmission_state
    # §6: "real_10y direction=rising AND Δ63d > +30bp". Reads data/transmission/latest.json.
    test:
      all:
        - {path: "state.rates.direction", op: eq, value: rising}
        - {path: "state.rates.real_10y_chg_63d_bp", op: gt, value: 30}
  duration_derate:
    title: {en: "Long-duration cohort de-rating", zh: "长久期板块相对下修"}
    src: yahoo
    # §6: "factor model + cohorts, long-duration cohort RS_63d < 0 vs SPY". Bound to a
    # cheap standalone cohort proxy — QQQ (long-duration growth) relative strength vs SPY
    # over 63d. The per-NAME long-duration resolution is the W2 blast resolver; this NODE
    # test only needs a cohort observable, which the proxy supplies without W2.
    test: {series: "QQQ", vs: "SPY", metric: rs, window: 63, op: lt, value: 0}

hops:
  - from: oil_shock
    to: breakeven_rise
    sign: "+"
    lag_d: [5, 60]
    label:
      en: "Oil shock → breakevens rise"
      zh: "油价冲击 → 盈亏平衡上行"
    condition:
      en: "supply-driven shock (global PMI not accelerating); demand-driven oil is a different chain"
      zh: "供给驱动的冲击（全球PMI未加速）；需求驱动的油价属于另一条链"
    mechanism:
      en: "energy passthrough into headline CPI, then into inflation expectations"
      zh: "能源价格传导至整体CPI，进而影响通胀预期"
    prior: "transmission_matrix[oil→breakevens] IC if present, else theory (cost-push passthrough)"
  - from: breakeven_rise
    to: yield_rise
    sign: "+"
    lag_d: [0, 90]
    label:
      en: "Breakevens rise → real yields rise"
      zh: "盈亏平衡上行 → 实际收益率上行"
    condition:
      en: "Fed not capping the curve (no YCC / large-scale QE regime)"
      zh: "美联储未压制曲线（无YCC/大规模QE环境）"
    mechanism:
      en: "rising inflation compensation lifts the nominal, then the real, 10y as the market reprices the policy path"
      zh: "通胀补偿上升推高名义、进而实际10年期收益率，市场重新定价政策路径"
    prior: "theory (Fisher decomposition) — real = nominal − breakeven"
  - from: yield_rise
    to: duration_derate
    sign: "+"
    lag_d: [0, 120]
    label:
      en: "Real yields rise → long-duration de-rates"
      zh: "实际收益率上行 → 长久期下修"
    condition:
      en: "no offsetting earnings-acceleration in the long-duration cohort"
      zh: "长久期板块无抵消性的盈利加速"
    mechanism:
      en: "a higher discount rate compresses the present value of far-dated cash flows first — long-duration growth de-rates relative to the market"
      zh: "更高的贴现率首先压缩远期现金流的现值——长久期成长相对大盘估值下修"
    prior: "stock_macro_sensitivity calibration (shipped; per-name rate beta + duration tier)"

falsifiers:
  # structured (auto-checked on an armed episode): oil shock but breakevens flat 30d
  # while node 0 is (was) armed → the cost-push leg is not passing through.
  - when: {series: "T10YIE", metric: ret_bp, window: 22, op: lt, value: 5}
    src: fred
    note: "oil +25% with breakevens near-flat over ~30d in a non-QE regime — passthrough absent"
  # structured: yields rose but the long-duration cohort is OUTPERFORMING for 120d.
  - when: {series: "QQQ", vs: "SPY", metric: rs, window: 120, op: gt, value: 0}
    note: "yield_rise with long-duration cohort RS>0 over 120d — the derating leg is falsified"

null_model: "does conditioning on the full oil→breakeven→yield chain beat unconditional yields-momentum on the same long-duration cohort?"

exposure_screens:            # W2 — structured mini-form, resolved over site/stockdata/<T>.json
  long_duration_valuation:
    label: {en: "Long-duration valuation", zh: "长久期估值"}
    note: {en: "names whose value sits in far-dated cash flows — first to de-rate on a discount-rate rise",
           zh: "价值集中于远期现金流的名字——贴现率上行时最先下修"}
    any:
      - {path: macro_sensitivity.duration, op: "==", value: long}   # calibrated duration tier (581 names read 'long')
      - {path: valuation.forward_pe, op: pctile_gte, value: 0.80}   # top-quintile forward P/E of the evaluable universe
  refinancing_channel:
    label: {en: "Refinancing channel", zh: "再融资通道"}
    note: {en: "leveraged names facing a higher cost of refinancing — long-term debt a large share of assets",
           zh: "面临更高再融资成本的高杠杆名字——长期债务占资产比重高"}
    # debt_to_assets is the LEVERAGE RATIO (percent), the right refinancing-exposure axis —
    # NOT raw.debt_lt (absolute $, which would flag mega-caps with huge but well-covered debt
    # books). Top-third of the evaluable universe's leverage. (Ratio present ~660 names; the
    # rest bucket as unevaluable — a missing balance sheet is neither safe nor unsafe.)
    all:
      - {path: financials.debt_to_assets, op: pctile_gte, value: 0.67}
  capex_borrower:
    label: {en: "Capex borrower", zh: "资本开支借款方"}
    note: {en: "capex-heavy names funding growth with external capital (weak investment factor + negative FCF)",
           zh: "以外部资本为增长融资的重资本开支名字（投资因子弱＋自由现金流为负）"}
    all:
      - {path: factors.radar_investment_z, op: "<", value: -1.5}    # investment factor z (lifted flat from factors.radar list, W2)
      - {path: financials.fcf_margin, op: "<", value: 0}            # FCF margin is a PERCENT; <0 = burning
  fcf_burner:
    label: {en: "FCF burner", zh: "现金流消耗"}
    note: {en: "cash-burning names most exposed to a higher cost of capital",
           zh: "现金消耗型名字，对更高资金成本最敏感"}
    all:
      - {path: financials.fcf_margin, op: "<", value: 0}

provenance:
  theory: ["cost-push passthrough", "duration / discount-rate math"]
  episodes: ["1973-74", "1990", "2021-22"]
  added_by: "operator"
  added_on: "2026-07-24"

changelog:
  - "rev 1 (W2 2026-07-24): exposure_screens migrated from prose field_expr to the structured
     {all|any} clause mini-form, every path verified against site/stockdata substrate. All
     four channels resolve to real fields — long_duration_valuation via macro_sensitivity.
     duration + valuation.forward_pe pctile; refinancing_channel via debt_to_assets pctile
     (ratio, not raw $); capex_borrower via factors.radar_investment_z (lifted from the radar
     list) + fcf_margin; fcf_burner via fcf_margin. No dropped/proxy channel on this chain."
  - "rev 2 (W4 2026-07-25): added bilingual hop display labels (label:{en,zh}) to all three hops
     for the W4 Cascade Monitor + site publication subset. No node/screen/tier change."

validator_note: >
  NODE bindings (unchanged from rev 0): two node→field adjustments vs the §6 prose, both
  binding to a REAL observable (never a faked detector): (1) oil_shock and breakeven_rise read
  the raw price/level series via lib.store (yahoo CL=F, fred T10YIE) instead of a commodity/
  signals_oil artifact and the transmission latest.state breakeven field. (2) duration_derate
  uses a QQQ-vs-SPY RS_63d cohort PROXY for "long-duration cohort RS"; the per-name factor-
  model cohort is the W2 resolver below.
  W2 SCREEN bindings (rev 1): all paths verified present in site/stockdata/<T>.json.
  long_duration_valuation.valuation.forward_pe is a BARE SCALAR (present ~1219, nonnull ~165)
  — NOT valuation.forward_pe.v; a pctile_gte(0.80) cut over the evaluable universe with the
  numeric cut printed. capex_borrower reads factors.radar_investment_z, a synthetic scalar the
  resolver lifts from the factors.radar [{key,z}] list (the shipped shape). fcf_margin is a
  PERCENT (so <0 = burning). All four channels resolve to real fields — NO dropped or proxy
  channel on this chain. tier stays hypothesis (per-hop base rates untested until W3).
