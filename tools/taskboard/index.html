<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%233A5BF0'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='white' opacity='.95'/%3E%3Crect x='8' y='15' width='16' height='3' rx='1.5' fill='white' opacity='.6'/%3E%3Crect x='8' y='21' width='10' height='3' rx='1.5' fill='white' opacity='.35'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<header id="topbar">
  <div class="tb-left">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="22" height="22"><rect x="2" y="2" width="28" height="28" rx="8" fill="var(--accent)"/><rect x="8" y="9" width="16" height="3" rx="1.5" fill="white" opacity=".95"/><rect x="8" y="15" width="16" height="3" rx="1.5" fill="white" opacity=".6"/><rect x="8" y="21" width="10" height="3" rx="1.5" fill="white" opacity=".35"/></svg>
    </div>
    <button id="wsSwitcher" class="ws-switcher" title="Switch workspace">
      <span id="wsName" class="ws-name">Workspace</span>
      <svg class="chev" viewBox="0 0 16 16" width="14" height="14"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="tb-right">
    <button id="tidyBtn" class="tb-btn" title="Tidy boards into a grid">
      <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>Tidy</span>
    </button>
    <button id="themeBtn" class="tb-btn icon-only" title="Switch theme">
      <svg id="themeIconSun" viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.4"/><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="8" y1="1" x2="8" y2="2.6"/><line x1="8" y1="13.4" x2="8" y2="15"/><line x1="1" y1="8" x2="2.6" y2="8"/><line x1="13.4" y1="8" x2="15" y2="8"/><line x1="3.05" y1="3.05" x2="4.18" y2="4.18"/><line x1="11.82" y1="11.82" x2="12.95" y2="12.95"/><line x1="3.05" y1="12.95" x2="4.18" y2="11.82"/><line x1="11.82" y1="4.18" x2="12.95" y2="3.05"/></g></svg>
      <svg id="themeIconMoon" viewBox="0 0 16 16" width="15" height="15" style="display:none"><path d="M13.5 9.5A6 6 0 1 1 6.5 2.5a4.8 4.8 0 0 0 7 7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
    <button id="settingsBtn" class="tb-btn icon-only" title="Settings">
      <svg viewBox="0 0 16 16" width="15" height="15"><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="2" y1="4.5" x2="14" y2="4.5"/><line x1="2" y1="11.5" x2="14" y2="11.5"/><circle cx="6" cy="4.5" r="1.9" fill="var(--bg)"/><circle cx="10.5" cy="11.5" r="1.9" fill="var(--bg)"/></g></svg>
    </button>
  </div>
</header>

<main id="viewport">
  <div id="canvas"></div>
</main>

<div id="hint" class="canvas-hint" hidden>Double-click anywhere to start a board</div>

<div id="modalRoot"></div>
<div id="popoverRoot"></div>
<div id="toastRoot"></div>
<div id="lightboxRoot"></div>

<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/interact.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
