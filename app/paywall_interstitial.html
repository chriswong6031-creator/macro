<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,noarchive">
  <title>Member access · Mastermind</title>
  <style>
    :root{color-scheme:light;--ink:#111827;--muted:#667085;--line:#dfe4ea;--blue:#2463eb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
    font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);
    background:radial-gradient(circle at 25% 10%,#eaf1ff 0,transparent 34%),#f7f8fa}
    main{width:min(92vw,620px);padding:42px;border:1px solid var(--line);border-radius:22px;
    background:rgba(255,255,255,.92);box-shadow:0 22px 70px rgba(16,24,40,.12)}
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
    h1{margin:.6rem 0 .7rem;font-size:clamp(30px,6vw,48px);line-height:1.04;letter-spacing:-.04em}
    p{margin:.55rem 0;color:var(--muted)}.zh{padding-top:.65rem;border-top:1px solid var(--line)}
    nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}a{padding:11px 16px;border-radius:10px;
    text-decoration:none;font-weight:750;border:1px solid var(--line);color:var(--ink);background:white}
    a.primary{color:white;background:var(--blue);border-color:var(--blue)}
  </style>
</head>
<body>
<main>
  <div class="eyebrow">Mastermind member access</div>

  <p>Your account is signed in, but it does not currently carry the <strong>Full site access</strong> entitlement. Active subscriptions and trials unlock this page.</p>
  <p class="zh" lang="zh">此研究页面仅向 Insider 会员开放。有效订阅或试用可解锁完整网站内容。</p>
  <nav>
    <a class="primary" href="/plans.html?upgrade=1">View plans · 查看方案</a>
    <a href="/?signin=1">Use another account · 切换账户</a>
  </nav>

</body>
</html>
