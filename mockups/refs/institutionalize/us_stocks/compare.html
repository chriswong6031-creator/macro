<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prophet card — three-way adjudication (production · #5514 v1 · revised)</title>
<!--
  Side-by-side adjudication artifact for the G-C revision (handoff §12).

  TWO real plan rows from the committed payload, each rendered three ways:
    · FTI — the enriched row (chart, name, sector, price, an entry read)
    · RIO — the MODAL row (no chart, no name, no sector, no price, no read)
  Every field comes from board-data.js. Nothing is hardcoded to flatter a
  column: the stance class is derived from R.stance, and where the shipped
  stylesheet and this proposal disagree the shipped values are scoped into
  .cmp-prod so the production column renders in production's own terms.

  ?theme=dark|light   ?lang=en|zh
-->
<link rel="stylesheet" href="board.css">
<style>
  .cmp-wrap { max-width: 1180px; margin: 0 auto; padding: 26px 22px 70px; }
  .cmp-h1 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 6px; }
  .cmp-lede { font-size: 13px; color: var(--muted); line-height: 1.55; max-width: 78ch; margin: 0 0 18px; }
  .cmp-legend { display: grid; gap: 7px; margin: 0 0 24px; padding: 12px 14px;
                border: 1px solid var(--line); border-radius: 10px;
                background: color-mix(in srgb, var(--panel2) 60%, transparent); }
  .cmp-legend p { margin: 0; font-size: 12px; line-height: 1.55;
                  color: color-mix(in srgb, var(--text) 82%, var(--muted)); }
  .cmp-legend b { color: var(--text); font-weight: 800; }
  /* Six shared rows — header, caption, card, caption, card, notes — so the two
     specimens and the cost lists sit at the SAME y across all three columns.
     A comparison whose rows do not line up cannot be read across, which is the
     one thing this page exists to let a reader do. */
  .cmp-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
              grid-template-rows: repeat(6, auto); column-gap: 22px; row-gap: 0; }
  .cmp-col { min-width: 0; display: grid; grid-row: span 6;
             grid-template-rows: subgrid; row-gap: 0; align-items: start; }
  @supports not (grid-template-rows: subgrid) {
    .cmp-grid { grid-template-rows: none; }
    .cmp-col { display: block; grid-row: auto; }
  }
  @media (max-width: 900px) {
    .cmp-grid { grid-template-columns: 1fr; grid-template-rows: none; row-gap: 34px; }
    .cmp-col { display: block; grid-row: auto; }
  }
  .cmp-hd { padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .cmp-tag {
    display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: .09em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 4px; margin-bottom: 6px;
  }
  .cmp-tag--prod { color: var(--muted); background: color-mix(in srgb, var(--muted) 13%, transparent); }
  .cmp-tag--v1   { color: var(--ink-warn); background: color-mix(in srgb, var(--warn) 13%, transparent); }
  .cmp-tag--v2   { color: var(--ink-up); background: color-mix(in srgb, var(--up) 13%, transparent); }
  .cmp-name { font-size: 14px; font-weight: 750; margin: 0; }
  .cmp-sub { font-size: 11.5px; color: var(--muted); margin: 3px 0 0; line-height: 1.45; }
  .cmp-card { max-width: 268px; }
  .cmp-spec { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
              color: var(--muted); margin: 20px 0 6px; }
  .cmp-spec--first { margin-top: 0; }
  .cmp-notes { margin: 18px 0 0; font-size: 11.5px; line-height: 1.6; }
  .cmp-notes b { display: block; font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
                 color: var(--muted); margin: 12px 0 5px; }
  .cmp-notes ul { margin: 0; padding-left: 16px; }
  .cmp-notes li { margin: 2px 0; color: color-mix(in srgb, var(--text) 82%, var(--muted)); }
  .cmp-keep li::marker { color: var(--ink-up); }
  .cmp-drop li::marker { color: var(--ink-down); }
  .cmp-method { margin: 34px 0 0; padding: 14px 16px; border: 1px solid var(--line);
                border-radius: 10px; font-size: 11.5px; line-height: 1.62; color: var(--muted); }
  .cmp-method b { display: block; font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
                  color: var(--text); margin: 0 0 7px; }
  .cmp-method ol { margin: 0; padding-left: 18px; }
  .cmp-method li { margin: 4px 0; }
  .cmp-method code { font-family: var(--font-mono); font-size: 10.5px;
                     color: color-mix(in srgb, var(--text) 78%, var(--muted)); }

  /* ═══════════════════════════════════════════════════════════════════════
     PRODUCTION COLUMN — shown in PRODUCTION's values.

     Two kinds of rule live here and they must not be confused:

     (a) PRODUCTION-ONLY classes, which board.css never defines (the accent
         bar, the four-dot rail, the Edge slot). Lifted verbatim from pv_css()
         in templates/_prophet_card.html.j2.

     (b) DIVERGENT SHARED classes — defined by BOTH stylesheets with different
         values. Left unscoped, the production column silently renders in the
         challenger's terms and an entire class of regression becomes invisible
         by construction. Every one of these carries production's EXPLICIT
         value, never an inherited one, so a later edit to board.css cannot
         quietly repaint this column.
     ═══════════════════════════════════════════════════════════════════════ */

  /* ── (a) production-only ───────────────────────────────────────────────── */
  .cmp-prod .pvcard::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 3;
    pointer-events: none; border-radius: 12px 12px 0 0;
    background: linear-gradient(90deg, var(--pvh), color-mix(in srgb, var(--pvh) 12%, transparent) 90%);
    box-shadow: 0 1px 8px color-mix(in srgb, var(--pvh) 45%, transparent);
  }
  .cmp-prod .pvcard { border-color: color-mix(in srgb, var(--pvh) 30%, var(--line)); }
  .cmp-prod .pv-stp { display: flex; align-items: center; margin: 7px 1px 0; }
  .cmp-prod .pv-dot { width: 6.5px; height: 6.5px; border-radius: 50%; background: var(--line); flex: none; }
  .cmp-prod .pv-seg { flex: 1; height: 2px; background: var(--line); opacity: .75; }
  .cmp-prod .pv-dot.on { background: var(--pvh); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pvh) 18%, transparent); }
  .cmp-prod .pv-dot.pa, .cmp-prod .pv-seg.pa {
    background: color-mix(in srgb, var(--pvh) 45%, var(--line)); opacity: 1;
  }
  .cmp-prod .pv-stl { display: flex; justify-content: space-between; gap: 3px; margin-top: 3px; min-width: 0; }
  .cmp-prod .pv-stl span { font-size: 9.5px; color: var(--muted); opacity: .7; white-space: nowrap; }
  .cmp-prod .pv-stl span.on { color: var(--pvh); opacity: 1; font-weight: 700; }
  .cmp-prod .pv-edge { display: inline-flex; align-items: baseline; gap: 4px; flex: none; }
  .cmp-prod .pv-edl { font-size: 9.5px; font-weight: 700; letter-spacing: .05em;
                      text-transform: uppercase; color: var(--muted); }
  .cmp-prod .pv-edn { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums;
                      color: var(--pvh-ink, var(--pvh)); line-height: 1; }
  .cmp-prod .pv-edn.pv-edna { color: var(--muted); font-weight: 600; font-size: 12px; }

  /* ── (b) divergent shared classes ──────────────────────────────────────── */

  /* ⚡ TRIGGER. Production pins it to the VERB hue in a 999px pill at 10px/800.
     board.css pins it to a fixed --warn amber in a 5px rect at 9px/750. On a
     Buy or Hold row those are visibly different chips; on a WAIT row they land
     on the same ink, because --pv-wait and --warn ship the SAME token value —
     so here the divergence reads as shape, and the hue half of it is only
     visible on a stance whose hue is not amber. Scoped either way: the column
     must be correct, not merely correct on the specimen that happens to show. */
  .cmp-prod .pv-trg {
    display: inline-flex; align-items: center; gap: 2px;
    font-size: 10px; font-weight: 800; line-height: 1.35;
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    background: color-mix(in srgb, var(--pvh) 9%, var(--panel));
    color: var(--pvh-ink, var(--pvh));
    border: 1px solid color-mix(in srgb, var(--pvh-ink, var(--pvh)) 45%, transparent);
  }
  /* MISSING CHART. Production reserves the FULL 74px hero and lets .pv-chart's
     verb wash fill it; board.css collapses it to a 24px near-invisible strip.
     This is the single largest divergence on the modal card, and it is only
     visible because specimen 2 exists. */
  .cmp-prod .pv-nochart { height: 74px; background: transparent; border-bottom: 0; }
  /* OVERLAY BUDGET. Production caps both overlays at a flat 70%; board.css
     reserves the quote's measured width on the left and 60% on the right. */
  .cmp-prod .pv-ov { max-width: 70%; }
  .cmp-prod .pv-ov.pv-ovl { max-width: 70%; flex-wrap: wrap; row-gap: 3px; }
  .cmp-prod .pv-ov.pv-ovr { max-width: 70%; }
  /* ZONE FOOTER. Different alignment, gap, padding and type size — and the
     zone LABEL takes the verb ink in production (--pvh-ink falling back to
     --pvh) where board.css falls back to --muted and adds a --q mute class. */
  .cmp-prod .pv-zn { align-items: center; gap: 5px; padding: 6px 10px 7px; font-size: 10.5px; }
  .cmp-prod .pv-znl { font-size: 9.5px; color: var(--pvh-ink, var(--pvh)); }
  .cmp-prod .pv-dt { font-size: 9.5px; }
  /* IDENTITY TYPE. Production runs the name and sector a full point larger and
     clips them; board.css shrinks the sector and drops the clip. */
  .cmp-prod .pv-idw { overflow: hidden; }
  .cmp-prod .pv-tk { font-size: 13px; }
  .cmp-prod .pv-nm { font-size: 10.5px; }
  .cmp-prod .pv-ind { font-size: 10.5px; white-space: nowrap; overflow: hidden;
                      text-overflow: ellipsis; margin-top: 1px; }
  /* MARKS ROW. Production reserves a min-height so the row never collapses and
     the grid stays flush; board.css lets it vanish. */
  .cmp-prod .pv-mk { gap: 3px 4px; margin-top: 4px; min-height: 18px; align-items: center; }
  .cmp-prod .pv-mk-i { font-size: 9.5px; font-weight: 700; line-height: 1.45;
                       padding: 1px 6px; border-radius: 6px; }
  .cmp-prod .pvcard:hover { border-color: color-mix(in srgb, var(--pvh) 55%, var(--line)); }

  /* ─────────── variant: #5514 v1 (the over-corrected card) ───────────
     Reproduced here so the adjudication has all three designs in one frame.
     These rules were deleted from board.css when the card was revised. */
  .cmp-v1 .pv-chart { display: none; }
  .cmp-v1 .mx-cap { position: absolute; top: 0; left: 0; right: 0; height: 3px; color: var(--text); }
  .cmp-v1 .pv-bd { padding: 12px 11px 10px; gap: 5px; }
  .cmp-v1 .pv-win { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .cmp-v1 .pv-lifegloss { font-size: 10.5px; color: var(--muted); }
  .cmp-v1 .pv-do {
    font-size: 11px; line-height: 1.45; color: color-mix(in srgb, var(--text) 78%, var(--muted));
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cmp-v1 .pv-zi { display: flex; align-items: baseline; gap: 4px; }
  .cmp-v1 .pv-zi--void { margin-left: auto; }
  .cmp-v1 .pv-znl { color: var(--muted); }
</style>
</head>
<body>
  <div class="cmp-wrap">
    <h1 class="cmp-h1" id="h1"></h1>
    <p class="cmp-lede" id="lede"></p>
    <div class="cmp-legend" id="legend"></div>
    <div class="cmp-grid" id="cmp"></div>
    <div class="cmp-method" id="method"></div>
  </div>
  <script src="board-data.js"></script>
  <script>
  (function () {
    var qs = new URLSearchParams(location.search);
    var theme = qs.get("theme") || "dark", lang = qs.get("lang") || "en";
    var root = document.documentElement;
    root.setAttribute("data-theme", theme);
    root.setAttribute("data-lang", lang);
    root.lang = lang === "zh" ? "zh-CN" : "en";

    function t(en, zh) { return '<span class="l-en">' + en + '</span><span class="l-zh">' + (zh || en) + "</span>"; }
    function money(v) { return v == null ? "&mdash;" : "$" + Number(v).toFixed(2); }
    function li(p) { return "<li>" + t(p[0], p[1]) + "</li>"; }
    function ul(cls, items) { return '<ul class="' + cls + '">' + items.map(li).join("") + "</ul>"; }
    function hd(en, zh) { return "<b>" + t(en, zh) + "</b>"; }

    /* ── the population this page is arguing about ─────────────────────────
       Derived, never asserted: LIVE = every row the board carries tonight that
       has not resolved, which is the same 159 the board's own tier gate
       prints. The modal-card claim stands or falls on these counts, so they
       are computed from the payload at render time rather than typed in. */
    var LIVE = window.BOARD.rows.filter(function (x) { return x.life !== "resolved"; });
    var N_LIVE     = LIVE.length;
    var N_CHART    = LIVE.filter(function (x) { return !!x.spark; }).length;
    var N_NOCHART  = N_LIVE - N_CHART;
    var N_NOREAD   = LIVE.filter(function (x) { return x.stance === "blocked_data"; }).length;
    var N_MODAL    = LIVE.filter(function (x) { return !x.spark && x.stance === "blocked_data"; }).length;

    var ROWS = {};
    window.BOARD.rows.forEach(function (x) { ROWS[x.tk] = x; });
    var A = ROWS["FTI"];      /* enriched:  stance "wait",         spark, zone, ⚡ */
    var B = ROWS["RIO"];      /* modal:     stance "blocked_data", no spark, no zone, no price */

    var VERB = { buy: ["Buy", "买入"], near: ["Near", "临近"], wait: ["Wait", "等待"],
                 hold: ["Hold", "持有"], avoid: ["Avoid", "回避"] };
    var LIFE = { watch: ["Watch", "观察"], ready: ["Ready", "就绪"], entered: ["Entered", "入场"],
                 delivering: ["Delivering", "达标"], overtime: ["Overtime", "超时"],
                 invalidated: ["Invalidated", "失效"], resolved: ["Resolved", "已结"] };
    var GLOSS = { watch: ["signal fired, nothing committed", "已出现信号，尚未建仓"],
                  ready: ["plan armed, trigger not fired", "计划就位，尚未触发"],
                  entered: ["in the entry window", "处于入场窗口内"] };
    var LANE = { bottoming: ["Bottoming entry", "底部入场"],
                 continuation: ["Continuation entry", "顺势入场"] };
    var SEC  = { "Energy": ["Energy", "能源"], "Health Care": ["Health Care", "医疗保健"],
                 "Materials": ["Materials", "原材料"], "Industrials": ["Industrials", "工业"] };

    /* The daily % change is the ONE simulated value on this page — no committed
       artifact carries per-ticker intraday change (DESIGN_NOTES §6 Q8). It is
       rendered identically in both columns that draw a quote, so the columns
       differ by design and never by data. */
    var DEMO_CHG = "+0.7%";

    function sec(r) {
      if (!r.sec) return "";
      var s = SEC[r.sec] || [r.sec, r.sec];
      return '<div class="pv-ind">' + t(s[0], s[1]) + "</div>";
    }
    function lane(r, extra) {
      if (!r.lane || !LANE[r.lane]) return "";
      return '<div class="pv-mk"><span class="pv-mk-i' + (extra || "") + '">' +
             t(LANE[r.lane][0], LANE[r.lane][1]) + "</span></div>";
    }
    function chart(r) { return r.spark ? r.spark : '<div class="pv-nochart"></div>'; }
    function quote(r) {
      var live = r.px != null;
      return '<span class="pv-ov pv-ovr"><span class="pv-quote">' +
        '<span class="nb-px pv-px">' + money(r.px) + "</span>" +
        '<span class="nb-chg pv-chg' + (live ? " up" : "") + '"' +
        (live ? ' data-mock-live="1"' : "") + ">" +
        (live ? DEMO_CHG : "&mdash;") + "</span></span></span>";
    }
    function trg(r) {
      if (!r.trg) return "";
      return '<span class="pv-trg">&#9889; ' +
        (r.trg === "imminent" ? t("Imminent", "即将触发") : t("Triggered", "已触发")) + "</span>";
    }
    /* zone footer. `q` is the mute class board.css adds to a non-actionable
       zone label; production has no such class and inks the label with the
       verb hue instead, which is exactly why .cmp-prod .pv-znl is scoped. */
    function zone(r, q) {
      var h = '<div class="pv-zn">', zk = r.zk || "none";
      if (zk === "active") {
        h += '<span class="pv-znl">' + t("Zone", "买区") + "</span>" +
             '<span class="pv-znr fig">' + money(r.zlo) + "&ndash;" + money(r.zhi) + "</span>";
      } else if (zk === "readd") {
        h += '<span class="pv-znl' + q + '">' + t("Re-add", "回补") + "</span>" +
             '<span class="pv-znm fig">' + money(r.zlo) + "&ndash;" + money(r.zhi) + "</span>";
      } else if (zk === "muted") {
        h += '<span class="pv-znl' + q + '">' + t("Zone", "买区") + "</span>" +
             '<span class="pv-znm fig">' + money(r.zlo) + "&ndash;" + money(r.zhi) + "</span>";
      } else if (zk === "confirm") {
        h += '<span class="pv-znm">' + t("Zone sets on confirmation", "买区待确认后生成") + "</span>";
      } else {
        h += '<span class="pv-znm">' + t("No zone — stand aside", "无买区 — 观望") + "</span>";
      }
      if (r.opened) h += '<span class="pv-dt">' + t(r.opened.en, r.opened.zh) + "</span>";
      return h + "</div>";
    }

    /* ── 1. PRODUCTION — as shipped today (four-dot rail, Edge slot) ────────
       _prophet_card.html.j2:373 reads
           {%- set _verb = cx.verb if cx.verb in _VEN else 'wait' -%}
       so a plan whose entry read has NOT published renders as a full WAIT card
       — amber hue, "Wait" chip, a cautious verdict the engine never produced.
       That coercion is reproduced here, not invented: specimen 2's production
       column is what production actually draws for the modal row. */
    function prod(r) {
      var v = VERB[r.stance] ? r.stance : "wait";
      /* The rail's lit step comes from a `stage` field the payload does not
         carry. The only payload value naming a rail step is `lane`, and only
         `bottoming` matches a label — `continuation` matches none. So the rail
         is drawn from what exists rather than lit by hand, and the unreachable
         steps are shown rather than asserted. */
      var stage = r.lane === "bottoming" ? 1 : 0;
      var dots = "", i;
      for (i = 1; i <= 4; i++) {
        if (i > 1) dots += '<span class="pv-seg' + (stage >= i ? " pa" : "") + '"></span>';
        dots += '<span class="pv-dot' + (stage === i ? " on" : stage > i ? " pa" : "") + '"></span>';
      }
      var labels = [["Bottoming", "筑底"], ["Turning", "转向"], ["Ready", "就绪"], ["Trend", "趋势"]]
        .map(function (p, k) {
          return "<span" + (stage === k + 1 ? ' class="on"' : "") + ">" + t(p[0], p[1]) + "</span>";
        }).join("");
      return '<article class="pvcard pv-' + v + '" data-life="' + r.life + '">' +
        '<div class="pv-chart">' + chart(r) +
          '<span class="pv-ov pv-ovl"><span class="pv-chip">' + t(VERB[v][0], VERB[v][1]) + "</span>" +
          trg(r) + "</span>" +
          /* the quote slot renders ONLY when the join supplied a price
             (_prophet_card.html.j2:402), so a priceless row has no node for
             live.js to key on and can never hydrate — visible on specimen 2 */
          (r.px == null ? "" : quote(r)) +
        "</div>" +
        '<div class="pv-bd">' +
          '<div class="pv-hd"><span class="pv-idw"><span class="pv-tk">' + r.tk + "</span>" +
            (r.nm ? '<span class="pv-nm">' + r.nm + "</span>" : "") + "</span>" +
            '<span class="pv-edge"><span class="pv-edl">' + t("Edge", "优势") + "</span>" +
            /* the payload carries no `edge` field at all, so production's own
               missing-value form renders (_prophet_card.html.j2:407) */
            '<span class="pv-edn pv-edna">&mdash;</span></span></div>' +
          sec(r) + lane(r) +
          '<div class="pv-stp">' + dots + "</div>" +
          '<div class="pv-stl">' + labels + "</div>" +
        "</div>" + zone(r, "") + "</article>";
    }

    /* ── 2. #5514 v1 — the over-corrected card ─────────────────────────────
       v1 deleted the stance channel outright, so its column is hue-free on
       BOTH specimens. That is v1's design, not a substitution by this page,
       and it is priced in v1's cost list rather than quietly repaired. */
    function v1(r) {
      var g = GLOSS[r.life];
      var s = r.sec ? (SEC[r.sec] || [r.sec, r.sec]) : null;
      var idline = r.nm
        ? '<div class="pv-nm">' + r.nm + (s ? " &middot; " + t(s[0], s[1]) : "") + "</div>"
        : (s ? '<div class="pv-nm">' + t(s[0], s[1]) + "</div>" : "");
      return '<article class="pvcard" data-life="' + r.life + '">' +
        '<span class="mx-cap mx-cap--' + r.life + '"></span>' +
        '<div class="pv-chart"></div>' +
        '<div class="pv-bd">' +
          '<div class="pv-hd"><span class="pv-tk">' + r.tk + "</span>" +
            '<span class="pv-win fig">' +
            t("day " + r.age + " of " + r.hz, "第 " + r.age + " 天 / 共 " + r.hz + " 天") + "</span></div>" +
          idline +
          '<div class="pv-life"><span class="mx-mark mx-mark--' + r.life + '"></span>' +
            '<span class="pv-life-w">' + t(LIFE[r.life][0], LIFE[r.life][1]) + "</span>" +
            (g ? '<span class="pv-lifegloss">' + t(g[0], g[1]) + "</span>" : "") + "</div>" +
          lane(r) +
          '<div class="pv-do">' + t(r["do"], r.do_zh) + "</div>" +
        "</div>" +
        '<div class="pv-zn">' +
          '<span class="pv-zi"><span class="pv-znl">' + t("Entry", "入场") + "</span>" +
            '<span class="pv-znr fig">' + money(r.entry) + "</span></span>" +
          '<span class="pv-zi"><span class="pv-znl">T1</span>' +
            '<span class="pv-znr fig">' + money(r.t1) + "</span></span>" +
          '<span class="pv-zi pv-zi--void"><span class="pv-znl">' + t("Void", "失效") + "</span>" +
            '<span class="pv-znr fig">' + money(r.inval) + "</span></span></div>" +
        "</article>";
    }

    /* ── 3. REVISED — the amalgamation ─────────────────────────────────────
       Stance comes from the payload with no fallback: an unpublished read gets
       .pv-noread and the dashed "No read yet" chip, never a verb. */
    function v2(r) {
      var v = VERB[r.stance] ? r.stance : null;
      var noRead = r.stance === "blocked_data";
