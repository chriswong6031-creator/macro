    ?theme=dark|light   ?lang=en|zh   ?view=grid|table   ?chrome=0|1

  page reconciles against that payload:
      62 ready + 95 entered + 0 delivering + 0 overtime + 2 invalidated
        = 159 = open_count = live_total
      159 live + 20 resolved = 179 = active_count = grand_total
  These five addends, the two totals and the two as-of dates are asserted by
  tools/verify_r4.py (R30) against board-data.js itself, so this block cannot
  go stale without failing the harness.
