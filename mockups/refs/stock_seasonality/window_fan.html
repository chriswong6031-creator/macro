<!doctype html><meta charset=utf-8><title>window fan</title><style>
:root{--bg:#0f1115;--panel:#181b21;--panel2:#1e222a;--text:#d7dce3;--muted:#8b93a1;--line:#2a2f3a;
--up:#45b873;--down:#e06464;--info:#5b9bf0;--warn:#e0a030;--sx-ink:#8a7fd4;--sx-now:#e0a030;
--font-ui:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;--font-mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:38px 22px 60px}
.eyebrow{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:8px 0 0}
h1 .tk{font-family:var(--font-mono);font-weight:600;font-size:.82em;color:var(--muted);margin-left:6px}
.verdict{font-size:clamp(21px,2.5vw,33px);font-weight:800;letter-spacing:-.02em;line-height:1.18;
  max-width:34ch;margin:18px 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:26px}
.chip{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;color:var(--muted);
  background:color-mix(in srgb,var(--muted) 12%,transparent);border:1px solid transparent;white-space:nowrap}
.chip.mk{color:var(--info);background:color-mix(in srgb,var(--info) 15%,transparent)}
.sxf{width:100%;height:320px;display:block;color:var(--text)}
.sxf-m{stroke:var(--line);stroke-opacity:.55;stroke-width:1;vector-effect:non-scaling-stroke}
.sxf-zero{stroke:var(--line);stroke-opacity:.9;stroke-width:1;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.sxf-band{fill:var(--sx-ink);fill-opacity:.08}
.sxf-y{fill:none;stroke:currentColor;stroke-opacity:.055;stroke-width:1;vector-effect:non-scaling-stroke}
.sxf-gate{fill:var(--sx-ink);fill-opacity:.07}
.sxf-lit{fill:none;stroke-opacity:.55;stroke-width:1.4;vector-effect:non-scaling-stroke}
.sxf-lit.u{stroke:var(--up)}.sxf-lit.d{stroke:var(--down)}
.sxf-med{fill:none;stroke:var(--sx-ink);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.sxf-now{fill:none;stroke:var(--sx-now);stroke-opacity:.9;stroke-width:1.75;vector-effect:non-scaling-stroke}
.sxf-gr{stroke:var(--sx-ink);stroke-width:1;stroke-dasharray:3 3;stroke-opacity:.75;vector-effect:non-scaling-stroke}
.sxf-tod{stroke:var(--sx-now);stroke-width:1;stroke-opacity:.55;vector-effect:non-scaling-stroke}
.sxf-h{fill:var(--sx-ink)}
.sxf-ml{font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:.14em;fill:var(--muted);text-anchor:middle}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:16px 0 30px}
.ctl b{width:1px;height:16px;background:var(--line);margin:0 8px}
.pill{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:8px;color:var(--muted);
  border:1px solid var(--line);background:var(--panel)}
.pill.on{color:var(--text);border-color:color-mix(in srgb,var(--sx-ink) 55%,transparent);
  background:color-mix(in srgb,var(--sx-ink) 14%,var(--panel))}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.big{font-family:var(--font-mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:12px}
.big.u{color:var(--up)}.big.d{color:var(--down)}
.lab{font-size:12.5px;color:var(--muted);margin-top:2px}
.dots{display:flex;gap:5px;margin:16px 0 14px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%}
.dot.u{background:var(--up)}.dot.d{background:var(--down)}
.after{font-size:13.5px;line-height:1.55;color:var(--muted);margin:0}
.track{position:relative;height:4px;border-radius:2px;margin-top:14px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--sx-ink) 40%,transparent),color-mix(in srgb,var(--sx-ink) 8%,transparent))}
.track i{position:absolute;top:-3px;width:2px;height:10px;background:var(--sx-ink);border-radius:1px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px}
td{padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.yr{font-family:var(--font-mono);color:var(--muted);width:48px;font-variant-numeric:tabular-nums}
.rv{font-family:var(--font-mono);font-variant-numeric:tabular-nums;width:72px;text-align:right;padding-right:12px}
.rv.u{color:var(--up)}.rv.d{color:var(--down)}
.bar i{display:block;height:6px;border-radius:2px}
.bar i.u{background:color-mix(in srgb,var(--up) 70%,transparent)}
.bar i.d{background:color-mix(in srgb,var(--down) 70%,transparent)}
@media(max-width:760px){.grid{grid-template-columns:1fr}.sxf{height:260px}}

.fan{width:100%;max-width:480px;height:auto;display:block;margin:14px 0 6px}
.fan .f{fill:none;stroke-opacity:.5;stroke-width:1.25;vector-effect:non-scaling-stroke}
.fan .f.u{stroke:var(--up)}.fan .f.d{stroke:var(--down)}
.fan .fmed{fill:none;stroke:var(--sx-ink);stroke-width:2.2;stroke-linecap:round;vector-effect:non-scaling-stroke}
.fan .z{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.fan .e.u{fill:var(--up)}.fan .e.d{fill:var(--down)}
h2{font-size:13px;font-weight:700;margin:12px 0 2px}.sub{font-size:11.5px;color:var(--muted);margin:0}
