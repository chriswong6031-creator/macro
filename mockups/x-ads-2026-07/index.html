<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MastermindX — mobile-first Category campaign</title>
  <style>
    :root{
      --ink:#182131;
      --muted:#607089;
      --faint:#8e9aad;
      --hair:#dfe5ee;
      --paper:#f5f7fa;
      --white:#fff;
      --blue:#2f65ff;
      --blue2:#6a54ef;
      --teal:#00a296;
      --green:#1e9148;
      --green2:#31c673;
      --red:#d9343b;
      --gold:#b67b05;
      --night:#07101e;
      --night2:#0e192c;
      --night3:#15233a;
      --display:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --mono:"SFMono-Regular",Consolas,monospace;
      --shadow:0 22px 70px rgba(19,34,58,.14),0 4px 14px rgba(19,34,58,.08);
      --shadow-dark:0 28px 100px rgba(0,0,0,.42),0 5px 24px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:#0a111c;color:var(--ink);font-family:var(--display)}
    body{padding:56px}
    button,a{font:inherit}
    .gallery-head{max-width:1440px;margin:0 auto 42px;color:#dfe7f4}
    .gallery-head h1{font-size:42px;line-height:1.05;letter-spacing:-.035em;margin:0 0 12px}
    .gallery-head p{max-width:900px;color:#92a2b8;font-size:18px;line-height:1.55;margin:0}
    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:42px;align-items:start;max-width:2200px;margin:auto}
    .preview{min-width:0}
    .preview-meta{display:flex;justify-content:space-between;align-items:center;color:#aab7ca;margin:0 0 12px;font-weight:700;font-size:14px;letter-spacing:.02em}
    .preview-meta code{font-family:var(--mono);color:#97b3ff;background:#172642;border-radius:8px;padding:7px 10px}
    .scale{width:100%;aspect-ratio:4/5;overflow:hidden;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
    .scale .ad{transform-origin:top left;width:1440px;height:1800px;transform:scale(calc((100vw - 168px) / 1440))}
    @media(min-width:860px){.scale .ad{transform:scale(calc((50vw - 105px) / 1440))}}
    @media(min-width:1500px){.scale .ad{transform:scale(calc((33.333vw - 90px) / 1440))}}

    .ad{
      position:relative;width:1440px;height:1800px;overflow:hidden;
      background:var(--paper);isolation:isolate;
    }
    .ad::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(20,35,60,.05);z-index:50}
    .safe{position:absolute;inset:72px 76px 64px;z-index:3}
    .brandrow{height:66px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:16px;font-size:25px;font-weight:850;letter-spacing:.015em}
    .brandmark{width:47px;height:47px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#2d6dff,#7357ec);color:#fff;font-size:26px;font-weight:900;box-shadow:0 10px 24px rgba(47,101,255,.3)}
    .brand small{display:block;margin-top:2px;color:var(--faint);font-size:11px;letter-spacing:.27em;font-weight:800}
    .livepill{display:flex;align-items:center;gap:10px;padding:12px 18px;border:1px solid rgba(51,76,110,.18);border-radius:999px;background:rgba(255,255,255,.76);box-shadow:0 4px 14px rgba(21,35,55,.07);font-size:15px;letter-spacing:.13em;font-weight:850}
    .livepill i{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px rgba(0,162,150,.12)}
    .kicker{margin:0 0 18px;color:var(--blue);font-size:19px;letter-spacing:.16em;text-transform:uppercase;font-weight:850}
    .headline{margin:0;letter-spacing:-.055em;font-size:94px;line-height:.96;font-weight:820}
    .headline .accent{background:linear-gradient(90deg,var(--blue),var(--blue2),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
    .subhead{margin:26px 0 0;max-width:1180px;color:var(--muted);font-size:34px;line-height:1.32;letter-spacing:-.015em}
    .subhead b{color:var(--ink);font-weight:750}
    .panel{background:rgba(255,255,255,.92);border:1px solid rgba(72,94,124,.17);border-radius:27px;box-shadow:var(--shadow)}
    .panel-h{display:flex;align-items:center;justify-content:space-between;color:#5f6f86;font-size:17px;letter-spacing:.13em;text-transform:uppercase;font-weight:850}
    .demo-tag{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:#edf8f2;color:var(--green);padding:8px 13px;font-size:14px;letter-spacing:.06em;font-weight:850}
    .demo-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}

    .signal-card{position:relative;padding:28px 30px;background:#fff;border:1px solid #d9e1eb;border-radius:25px;box-shadow:var(--shadow);overflow:hidden}
    .signal-card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#22a357,#8ee0b0,transparent)}
    .sig-top{display:flex;align-items:center;gap:16px;margin-top:22px}
    .verb{padding:9px 16px;border-radius:999px;background:#e7f8ee;border:1px solid #8fd8aa;color:var(--green);font-size:18px;letter-spacing:.08em;font-weight:900}
    .ticker{font-size:38px;font-weight:900;letter-spacing:-.02em}
    .price{margin-left:auto;font-family:var(--mono);font-size:27px;font-weight:800}
    .spark{display:block;width:100%;height:165px;margin:22px 0 8px;border-radius:15px;background:linear-gradient(180deg,rgba(35,165,88,.055),rgba(35,165,88,0))}
    .sig-id{display:flex;align-items:baseline;gap:12px;font-size:22px}
    .sig-id .name{color:var(--muted)}
    .edge{margin-left:auto;color:var(--muted);font-size:18px;letter-spacing:.06em;font-weight:800}
    .edge b{color:var(--green);font-size:31px;margin-left:6px}
    .stages{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin-top:23px;padding-top:19px;text-align:center;color:#98a3b3;font-size:17px;font-weight:700}
    .stages::before{content:"";position:absolute;left:8%;right:8%;top:6px;height:3px;background:#dce2e9}
    .stages span::before{content:"";position:absolute;top:0;width:13px;height:13px;border:3px solid white;transform:translateX(18px);border-radius:50%;background:#cbd3df;box-shadow:0 0 0 1px #d8dfe8}
    .stages .on{color:var(--green);font-weight:900}
    .stages .on::before{background:var(--green);box-shadow:0 0 0 6px rgba(30,145,72,.14)}
    .planrow{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid #e2e7ee}
    .planbox{padding:14px 16px;border-radius:14px;background:#f5f8fb;color:#66758a;font-size:15px;text-transform:uppercase;letter-spacing:.08em;font-weight:850}
    .planbox b{display:block;margin-top:5px;color:var(--ink);font-family:var(--mono);font-size:24px;letter-spacing:-.03em}
    .planbox.risk{background:#fff1f1}.planbox.risk b{color:#b92931}

    .suite{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .suite span{display:flex;align-items:center;gap:10px;min-height:51px;padding:0 14px;border:1px solid rgba(72,94,124,.16);border-radius:13px;background:rgba(255,255,255,.76);color:#3c4a5f;font-size:17px;font-weight:760;white-space:nowrap}
    .suite i{width:8px;height:8px;flex:none;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(47,101,255,.10)}
    .suite span:nth-child(3n+1) i{background:var(--green);box-shadow:0 0 0 4px rgba(30,145,72,.10)}
    .suite span:nth-child(3n+2) i{background:var(--blue2);box-shadow:0 0 0 4px rgba(106,84,239,.10)}
    .offerbar{position:absolute;left:0;right:0;bottom:0;height:164px;display:flex;align-items:center;gap:22px;padding:25px 28px 25px 32px;border-radius:26px;background:#101a2c;color:#fff;box-shadow:var(--shadow-dark)}
    .offerflag{align-self:flex-start;padding:7px 12px;border-radius:999px;background:linear-gradient(90deg,#336dff,#7655ee);font-size:13px;letter-spacing:.1em;font-weight:900;white-space:nowrap}
    .offerprice{font-size:20px;color:#aebbd0;white-space:nowrap}
    .offerprice strong{display:inline-block;margin-right:8px;color:#fff;font-size:49px;line-height:.9;letter-spacing:-.04em}
    .offersave{flex:1;color:#9caac1;font-size:15px;line-height:1.32}
    .offersave b{display:block;color:#55d890;font-size:19px}
    .offercta{display:flex;align-items:center;justify-content:center;min-width:270px;height:78px;padding:0 25px;border-radius:17px;background:linear-gradient(135deg,#2e6bff,#526dff);color:#fff;font-size:21px;font-weight:850;box-shadow:0 14px 30px rgba(47,101,255,.28);white-space:nowrap}
    .fineprint{position:absolute;bottom:172px;left:3px;color:rgba(75,88,107,.78);font-size:13px;letter-spacing:.01em}

    /* 01 — everything moving the stock */
    .ad1{background:
      radial-gradient(circle at 90% 15%,rgba(77,103,255,.13),transparent 27%),
      radial-gradient(circle at 8% 66%,rgba(0,162,150,.09),transparent 28%),
      #f7f8fb}
    .ad1 .copy{position:absolute;top:164px;left:0;right:0}
    .ad1 .headline{max-width:1180px}
    .ad1 .visual{position:absolute;left:0;right:0;top:590px;height:680px}
    .ad1 .signal-card{position:absolute;left:0;top:55px;width:760px;z-index:6}
    .context-stack{position:absolute;right:0;top:0;width:488px;display:grid;gap:13px}
    .context{display:flex;align-items:center;gap:16px;min-height:112px;padding:18px 20px;border:1px solid rgba(72,94,124,.16);border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 13px 34px rgba(27,45,73,.09)}
    .context .ico{width:48px;height:48px;display:grid;place-items:center;flex:none;border-radius:14px;background:#eef2ff;color:var(--blue);font-size:22px;font-weight:900}
    .context:nth-child(2) .ico,.context:nth-child(4) .ico{background:#e9f8f2;color:var(--green)}
    .context label{display:block;color:#7a8799;font-size:14px;letter-spacing:.1em;text-transform:uppercase;font-weight:850}
    .context b{display:block;margin-top:5px;font-size:21px;line-height:1.15}
    .context em{margin-left:auto;color:var(--green);font-style:normal;font-family:var(--mono);font-size:17px;font-weight:850}
    .ad1 .suite{position:absolute;left:0;right:0;top:1292px}

    /* 02 — decision pipeline */
    .ad2{color:#eef4ff;background:
      radial-gradient(circle at 12% 20%,rgba(52,105,255,.24),transparent 28%),
      radial-gradient(circle at 90% 53%,rgba(0,162,150,.17),transparent 27%),
      linear-gradient(155deg,#060d18,#0b1526 52%,#101f34)}
    .ad2 .brand small,.ad2 .subhead{color:#9aacc4}
    .ad2 .livepill{background:rgba(13,26,45,.8);border-color:#263852}
    .ad2 .copy{position:absolute;top:164px;left:0;right:0}
    .ad2 .headline{max-width:1160px;font-size:91px}
    .ad2 .headline .accent{background:linear-gradient(90deg,#79a0ff,#61dbca);-webkit-background-clip:text;background-clip:text}
    .ad2 .subhead b{color:#f2f6fc}
    .pipeline{position:absolute;left:0;right:0;top:592px;height:700px;border:1px solid #243651;border-radius:30px;background:rgba(10,21,38,.82);box-shadow:var(--shadow-dark);overflow:hidden}
    .pipe-label{position:absolute;left:31px;top:25px;color:#71839c;font-size:16px;letter-spacing:.13em;text-transform:uppercase;font-weight:850}
    .pipe-steps{position:absolute;left:30px;top:86px;width:372px;bottom:28px;display:grid;grid-template-rows:repeat(5,1fr);gap:10px}
    .pipe-step{position:relative;display:flex;align-items:center;gap:15px;padding:13px 18px;border:1px solid #243550;border-radius:17px;background:#101c2f}
    .pipe-step::after{content:"";position:absolute;right:-53px;width:52px;height:2px;background:linear-gradient(90deg,#354d6f,#2f65ff)}
    .pipe-num{width:37px;height:37px;display:grid;place-items:center;flex:none;border:1px solid #36517c;border-radius:12px;background:#172845;color:#84a6ff;font-family:var(--mono);font-size:15px;font-weight:900}
    .pipe-step label{display:block;color:#72839c;font-size:12px;letter-spacing:.11em;text-transform:uppercase;font-weight:850}
    .pipe-step b{display:block;margin-top:4px;color:#eef4ff;font-size:19px;line-height:1.12}
    .pipe-step em{margin-left:auto;color:#4ed291;font-family:var(--mono);font-size:16px;font-style:normal;font-weight:800}
    .ad2 .signal-card{position:absolute;right:30px;top:64px;width:790px;height:606px;background:#f9fbff;color:var(--ink)}
    .ad2 .signal-card .spark{height:154px}
    .ad2 .suite{position:absolute;left:0;right:0;top:1314px}
    .ad2 .suite span{background:rgba(15,29,49,.88);border-color:#253955;color:#d2dced}
    .ad2 .fineprint{color:#71829a}
    .ad2 .offerbar{background:linear-gradient(120deg,#f2f6ff,#fff);color:var(--ink);box-shadow:0 22px 70px rgba(0,0,0,.35)}
    .ad2 .offerprice strong{color:var(--ink)}
    .ad2 .offerprice{color:#59687e}
    .ad2 .offersave{color:#68778c}

    /* 03 — browser Terminal category contrast */
    .ad3{color:#f3f7ff;background:
      radial-gradient(circle at 84% 7%,rgba(53,106,255,.28),transparent 26%),
      #03070d}
    .ad3 .safe{inset-top:72px}
    .ad3 .brand small,.ad3 .subhead{color:#91a0b5}
    .ad3 .livepill{background:#111a27;border-color:#263246}
    .ad3 .copy{position:absolute;left:0;right:0;top:165px}
    .ad3 .headline{max-width:1220px;font-size:82px}
    .ad3 .headline .accent{background:linear-gradient(90deg,#70a0ff,#58dccb);-webkit-background-clip:text;background-clip:text}
    .ad3 .subhead b{color:#f4f7fc}
    .browser{position:absolute;left:0;right:0;top:680px;height:610px;border:1px solid #293448;border-radius:28px;background:#090e17;box-shadow:0 30px 100px rgba(0,0,0,.55);overflow:hidden}
    .browserbar{height:58px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#1f2229;border-bottom:1px solid #05070a}
    .browserbar i{width:15px;height:15px;border-radius:50%;background:#ff625d}
    .browserbar i:nth-child(2){background:#ffbd44}.browserbar i:nth-child(3){background:#29c941}
    .address{margin:auto;width:520px;padding:9px 18px;text-align:center;border-radius:9px;background:#2b2e36;color:#a8aeb9;font-size:16px}
    .browser-shot{position:absolute;left:0;right:0;top:58px;bottom:0;overflow:hidden}
    .browser-shot img{width:100%;height:100%;object-fit:cover;object-position:31% top;filter:saturate(.92) brightness(.94)}
    .browser-shot::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 43%,rgba(3,7,13,.1) 70%,rgba(3,7,13,.45))}
    .term-signal{position:absolute;right:29px;bottom:29px;width:455px;padding:22px;border:1px solid #385077;border-radius:21px;background:rgba(10,19,34,.96);box-shadow:0 24px 60px rgba(0,0,0,.55)}
    .term-signal .panel-h{color:#7e90ac;font-size:13px}
    .term-call{display:flex;align-items:center;margin-top:17px}
    .term-call .verb{font-size:15px;padding:7px 12px}
    .term-call strong{margin-left:12px;font-size:26px}
    .term-call .edge{color:#7e90ac}.term-call .edge b{font-size:24px}
    .term-plan{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
    .term-plan span{padding:11px;border:1px solid #283951;border-radius:11px;color:#8697b0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
    .term-plan b{display:block;margin-top:5px;color:#eaf0fa;font-family:var(--mono);font-size:17px}
    .term-note{margin-top:14px;color:#8fa0b9;font-size:15px;line-height:1.35}
    .term-note b{color:#61d49b}
    .ad3 .suite{position:absolute;left:0;right:0;top:1305px}
    .ad3 .suite span{background:#0d1522;border-color:#243148;color:#d0dae9}
    .ad3 .fineprint{color:#68778d}
    .ad3 .offerbar{background:linear-gradient(115deg,#14223a,#0d1728)}

    /* 04 — AI with whole-market evidence */
    .ad4{background:
      radial-gradient(circle at 88% 29%,rgba(47,101,255,.15),transparent 31%),
      radial-gradient(circle at 14% 66%,rgba(0,162,150,.10),transparent 25%),
      #f7f8fc}
    .ad4 .copy{position:absolute;left:0;right:0;top:166px}
    .ad4 .headline{max-width:1150px;font-size:92px}
    .ad4 .ai-board{position:absolute;left:0;right:0;top:592px;height:706px;display:grid;grid-template-columns:390px 1fr;gap:23px}
    .evidence{display:grid;grid-template-rows:repeat(6,1fr);gap:10px}
    .evidence-card{position:relative;display:flex;align-items:center;gap:15px;padding:14px 17px;border:1px solid #dfe5ee;border-radius:17px;background:rgba(255,255,255,.92);box-shadow:0 8px 25px rgba(24,40,67,.07)}
    .evidence-card::after{content:"→";position:absolute;right:-31px;color:#97a7bd;font-size:22px;font-weight:800}
    .evidence-card .ico{width:40px;height:40px;display:grid;place-items:center;flex:none;border-radius:12px;background:#edf2ff;color:var(--blue);font-size:18px;font-weight:900}
    .evidence-card:nth-child(even) .ico{background:#eaf8f2;color:var(--green)}
    .evidence-card label{display:block;color:#7e8b9e;font-size:12px;text-transform:uppercase;letter-spacing:.11em;font-weight:850}
    .evidence-card b{display:block;margin-top:3px;font-size:18px}
    .evidence-card em{margin-left:auto;color:var(--green);font-size:14px;font-style:normal;font-weight:850}
    .ai-panel{position:relative;padding:0;border:1px solid #d8e0ec;border-radius:28px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
    .ai-top{height:72px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid #e1e6ee}
    .ai-top strong{color:var(--blue);font-size:17px;letter-spacing:.12em}
    .ai-mode{margin-left:auto;padding:8px 14px;border-radius:999px;background:var(--blue);color:#fff;font-size:14px;font-weight:850}
    .question{margin:24px 24px 18px auto;width:max-content;max-width:82%;padding:15px 20px;border-radius:18px 18px 5px 18px;background:linear-gradient(135deg,#2f65ff,#596ff7);color:#fff;font-size:20px;font-weight:750;box-shadow:0 10px 25px rgba(47,101,255,.2)}
    .reading{margin:0 24px;color:#8593a8;font-size:15px}
    .reading i{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#6f8cff;box-shadow:0 0 0 5px #edf1ff}
    .answer{margin:19px 24px 0;padding:22px;border:1px solid #dfe5ed;border-radius:19px;background:#f8fafc}
    .answer h3{margin:0;color:var(--ink);font-size:28px;letter-spacing:-.02em}
    .answer p{margin:9px 0 0;color:#607089;font-size:17px;line-height:1.4}
    .answer-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-top:16px}
    .answer-grid div{padding:12px 13px;border-radius:12px;background:#fff;border:1px solid #e2e7ee;color:#738198;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:850}
    .answer-grid b{display:block;margin-top:5px;color:var(--ink);font-size:17px;letter-spacing:-.02em}
    .answer-grid .bad b{color:#b72d35}
    .ai-chart{height:126px;margin:16px 24px 22px;border-radius:16px;background:#0c1526;overflow:hidden}
    .ai-chart svg{width:100%;height:100%;display:block}
    .ad4 .suite{position:absolute;left:0;right:0;top:1319px}

    /* 05 — explainable signal / full value stack */
    .ad5{background:
      linear-gradient(140deg,rgba(255,255,255,.7),rgba(255,255,255,0) 48%),
      radial-gradient(circle at 80% 15%,rgba(216,175,75,.17),transparent 28%),
      #f4f1ea}
    .ad5 .livepill{background:rgba(255,255,255,.66)}
    .ad5 .copy{position:absolute;left:0;right:0;top:166px}
    .ad5 .headline{max-width:1120px;font-size:94px}
    .ad5 .headline .accent{background:linear-gradient(90deg,#2f65ff,#00a296);-webkit-background-clip:text;background-clip:text}
    .proof-board{position:absolute;left:0;right:0;top:586px;height:720px}
    .ad5 .signal-card{position:absolute;left:0;top:17px;width:680px;height:675px}
    .ad5 .signal-card .spark{height:190px}
    .reason-card{position:absolute;right:0;top:0;width:577px;height:708px;padding:27px;border:1px solid #d7d4cc;border-radius:28px;background:rgba(255,255,255,.84);box-shadow:var(--shadow)}
    .reason-card h2{margin:15px 0 4px;font-size:38px;letter-spacing:-.035em}
    .reason-card>p{margin:0;color:#6d7787;font-size:17px;line-height:1.4}
    .reason-list{display:grid;gap:10px;margin-top:22px}
    .reason{display:grid;grid-template-columns:45px 1fr auto;align-items:center;gap:13px;min-height:79px;padding:12px 15px;border:1px solid #e0ded8;border-radius:15px;background:#fff}
    .reason .ico{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#eef2ff;color:var(--blue);font-weight:900}
    .reason:nth-child(even) .ico{background:#eaf8f2;color:var(--green)}
    .reason label{display:block;color:#808b9a;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:850}
    .reason b{display:block;margin-top:3px;font-size:17px}
    .reason em{color:var(--green);font-style:normal;font-family:var(--mono);font-size:14px;font-weight:850}
    .record{margin-top:16px;padding:13px 15px;border-radius:14px;background:#f0f4fb;color:#536176;font-size:15px;line-height:1.35}
    .record b{color:var(--ink)}
    .ad5 .suite{position:absolute;left:0;right:0;top:1320px}
    .ad5 .offerflag{position:absolute;left:32px;top:24px}
    .ad5 .offerprice{position:absolute;left:190px;top:64px}
    .ad5 .offersave{position:absolute;left:485px;top:57px}
    .ad5 .offercta{position:absolute;right:28px;top:43px}

    body.single{padding:0;background:transparent;width:1440px;height:1800px;overflow:hidden}
    body.single .gallery-head,body.single .preview-meta{display:none}
    body.single .gallery{display:block;width:1440px;height:1800px;margin:0}
    body.single .preview{display:none}
    body.single .preview.active{display:block}
    body.single .scale{width:1440px;height:1800px;border-radius:0;box-shadow:none}
    body.single .scale .ad{transform:none}
  </style>
</head>
<body>
  <header class="gallery-head">
    <h1>MastermindX — five mobile-first Category ads</h1>
    <p>Five complete product stories at 1440 × 1800. Every concept leads with stock signals, shows the market intelligence behind the call, and carries the Founding Pro offer.</p>
  </header>
  <main class="gallery" id="gallery"></main>

  <script>
    const creatives = [
      {id:"mx-cat-01",label:"01 · Whole-market signal",render:adOne},
      {id:"mx-cat-02",label:"02 · Noise to trade plan",render:adTwo},
      {id:"mx-cat-03",label:"03 · Terminal difference",render:adThree},
      {id:"mx-cat-04",label:"04 · Market-aware AI",render:adFour},
      {id:"mx-cat-05",label:"05 · Signal with receipts",render:adFive},
    ];

    function brand(dark=false){
      return `<div class="brandrow">
        <div class="brand"><span class="brandmark">M</span><span>MASTERMINDX<small>MARKET INTELLIGENCE</small></span></div>
        <span class="livepill"><i></i>LIVE · MARKET READ</span>
      </div>`;
    }

    function suite(){
      return `<div class="suite" aria-label="MastermindX suite">
        <span><i></i>Macro regime</span><span><i></i>Stock signals</span>
        <span><i></i>Options flow</span><span><i></i>Theme rotation</span>
        <span><i></i>Insider + Congress</span><span><i></i>13F funds</span>
        <span><i></i>Browser Terminal</span><span><i></i>Mastermind AI</span>
      </div>`;
    }

    function offer(cta="Start 7-day trial"){
      return `<div class="fineprint">Market intelligence, not individualized investment advice. Product UI examples are illustrative.</div>
        <div class="offerbar">
          <span class="offerflag">FOUNDING RATE</span>
          <span class="offerprice"><strong>$75</strong>/mo billed annually</span>
          <span class="offersave"><b>About 50% less</b>than $149 monthly Pro</span>
          <span class="offercta">${cta} &nbsp;→</span>
        </div>`;
    }

    function spark(){
      return `<svg class="spark" viewBox="0 0 700 165" preserveAspectRatio="none" aria-label="Illustrative price path approaching a Prophet entry zone">
        <defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#28ad62" stop-opacity=".24"/><stop offset="1" stop-color="#28ad62" stop-opacity="0"/></linearGradient></defs>
        <path d="M0 138L0 111L43 120L84 107L126 128L169 113L211 117L254 94L296 103L338 86L380 91L423 69L465 77L507 55L550 62L592 42L635 36L700 18L700 138Z" fill="url(#area)"/>
        <path d="M0 111L43 120L84 107L126 128L169 113L211 117L254 94L296 103L338 86L380 91L423 69L465 77L507 55L550 62L592 42L635 36L700 18" fill="none" stroke="#22a357" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="535" y="22" width="165" height="26" rx="8" fill="rgba(30,145,72,.08)" stroke="#54bd7a" stroke-width="2" stroke-dasharray="7 6"/>
        <circle cx="507" cy="55" r="11" fill="#2f65ff" stroke="#fff" stroke-width="5"/>
      </svg>`;
    }

    function signalCard({ticker="AVGO",sector="Semiconductors",price="$184.20",verb="NEAR",edge="76",entry="$184.20 – $187.10",risk="$176.80"}={}){
      return `<div class="signal-card">
        <div class="panel-h"><span>PROPHET · TONIGHT'S SIGNAL</span><span class="demo-tag">illustrative</span></div>
        <div class="sig-top"><span class="verb">${verb}</span><strong class="ticker">${ticker}</strong><span class="price">${price}</span></div>
        ${spark()}
        <div class="sig-id"><strong>${ticker}</strong><span class="name">${sector}</span><span class="edge">EDGE <b>${edge}</b></span></div>
        <div class="stages"><span>Bottoming</span><span>Turning</span><span class="on">Ready</span><span>Trend</span></div>
        <div class="planrow"><span class="planbox">Entry zone<b>${entry}</b></span><span class="planbox risk">Invalidates below<b>${risk}</b></span></div>
      </div>`;
    }

    function context(icon,label,value,score=""){
      return `<div class="context"><span class="ico">${icon}</span><span><label>${label}</label><b>${value}</b></span>${score?`<em>${score}</em>`:""}</div>`;
    }

    function frame(id,label,html){
      return `<section class="preview ${id===selected?"active":""}" data-id="${id}">
        <div class="preview-meta"><span>${label}</span><code>${id} · 1440×1800</code></div>
        <div class="scale">${html}</div>
      </section>`;
    }

    function adOne(){
      return `<article class="ad ad1"><div class="safe">
        ${brand()}
        <div class="copy"><p class="kicker">The market behind every stock</p>
          <h1 class="headline">Don’t just trade the ticker.<br><span class="accent">Trade the market behind it.</span></h1>
          <p class="subhead">Ranked stock signals built from <b>regime, rotation, flow, filings and fund positioning</b>—with entry and risk already mapped.</p>
        </div>
        <div class="visual">
          ${signalCard({})}
          <div class="context-stack">
            ${context("67","Market regime","Risk On · leaders first","67/100")}
            ${context("↗","Theme rotation","Semiconductors · BUY NOW","77")}
            ${context("◎","Options flow","AVGO calls · ask-side","$2.8M")}
            ${context("13F","Smart money","41 funds added","+")}
            ${context("CEO","Insider activity","3 buyers · clustered","BUY")}
          </div>
        </div>
        ${suite()}${offer("Claim the Founding rate")}
      </div></article>`;
    }

    function adTwo(){
      const steps=[
        ["01","REGIME","Risk On · leaders first","67"],
        ["02","ROTATION","US Energy · Buy Now","71"],
        ["03","SMART MONEY","Funds + insiders accumulating","+"],
        ["04","OPTIONS","XLE calls · ask-side","$2.1M"],
        ["05","PROPHET","Ranked signal + trade plan","EDGE 74"],
      ];
      return `<article class="ad ad2"><div class="safe">
        ${brand(true)}
        <div class="copy"><p class="kicker">The decision engine</p>
          <h1 class="headline">From market noise to<br><span class="accent">one clear trade plan.</span></h1>
          <p class="subhead">MastermindX turns the full market into a ranked signal: <b>what to watch, where to enter, and where the thesis breaks.</b></p>
        </div>
        <div class="pipeline">
          <span class="pipe-label">Every layer resolves into the signal</span>
          <div class="pipe-steps">${steps.map(s=>`<div class="pipe-step"><span class="pipe-num">${s[0]}</span><span><label>${s[1]}</label><b>${s[2]}</b></span><em>${s[3]}</em></div>`).join("")}</div>
          ${signalCard({ticker:"XLE",sector:"Energy Select",price:"$58.50",verb:"BUY",edge:"74",entry:"$57.95 – $58.60",risk:"$55.40"})}
        </div>
        ${suite()}${offer("Start your 7-day trial")}
      </div></article>`;
    }

    function adThree(){
      return `<article class="ad ad3"><div class="safe">
        ${brand(true)}
        <div class="copy"><p class="kicker">A real Terminal. An intelligence layer built in.</p>
          <h1 class="headline">Your chart shows what happened.<br><span class="accent">Your desk should explain what’s next.</span></h1>
          <p class="subhead">Live charting, ranked stock signals and institutional context—<b>together in one browser.</b></p>
        </div>
        <div class="browser">
          <div class="browserbar"><i></i><i></i><i></i><span class="address">app.mastermind-x.com/terminal</span></div>
          <div class="browser-shot"><img src="../landing/assets/terminal_live.png" alt="MastermindX browser Terminal"></div>
          <div class="term-signal">
            <div class="panel-h"><span>INTELLIGENCE LAYER</span><span>LIVE</span></div>
            <div class="term-call"><span class="verb">NEAR</span><strong>NVDA</strong><span class="edge">EDGE <b>81</b></span></div>
            <div class="term-plan"><span>Entry zone<b>$199 – $203</b></span><span>Invalidation<b>$191</b></span></div>
            <div class="term-note"><b>Setup intact; entry gate closed.</b> Regime, theme and flow agree—wait for price.</div>
          </div>
        </div>
        ${suite()}${offer("Open the market desk")}
      </div></article>`;
    }

    function adFour(){
      const evidence=[
        ["67","Regime","Risk On","LIVE"],
        ["P","Prophet signal","NEAR · Edge 81","READY"],
        ["↗","Theme rotation","AI Software leading","74"],
        ["◎","Options flow","Calls · ask-side","$3.1M"],
        ["13F","Fund positioning","36 funds added","+"],
        ["CEO","Insiders + earnings","No conflict found","CLEAR"],
      ];
      return `<article class="ad ad4"><div class="safe">
        ${brand()}
        <div class="copy"><p class="kicker">Mastermind AI</p>
          <h1 class="headline">Ask about a stock.<br><span class="accent">Get the market around it.</span></h1>
          <p class="subhead">AI that reads the signal, regime, flow, insiders, funds and earnings—then returns <b>the setup, entry and risk.</b></p>
        </div>
        <div class="ai-board">
          <div class="evidence">${evidence.map(e=>`<div class="evidence-card"><span class="ico">${e[0]}</span><span><label>${e[1]}</label><b>${e[2]}</b></span><em>${e[3]}</em></div>`).join("")}</div>
          <div class="ai-panel">
            <div class="ai-top"><strong>● &nbsp; MASTERMIND AI</strong><span class="ai-mode">⚡ Flash AI</span></div>
            <div class="question">Build the NVDA trade plan.</div>
            <p class="reading"><i></i>reading every desk · cross-checking the setup</p>
            <div class="answer">
              <h3>Strong tape. Wrong entry—for now.</h3>
              <p>NVDA leads its theme and the broader regime supports risk, but price is above the useful entry gate. Wait for the level.</p>
              <div class="answer-grid"><div>Entry gate<b>$199 – $203</b></div><div>Invalidates<b>$191</b></div><div class="bad">Action now<b>WAIT</b></div></div>
            </div>
            <div class="ai-chart"><svg viewBox="0 0 720 126" preserveAspectRatio="none">
              <path d="M0 74L55 86L110 52L165 67L220 42L275 58L330 69L385 48L440 78L495 54L550 31L605 44L660 24L720 35" fill="none" stroke="#35d18a" stroke-width="5"/>
              <path d="M0 92H720" stroke="#ef5c68" stroke-width="2" stroke-dasharray="8 7"/><text x="610" y="86" fill="#ef7a83" font-size="16" font-family="monospace">STOP 191</text>
              <rect x="486" y="36" width="160" height="26" rx="5" fill="rgba(53,209,138,.16)" stroke="#35d18a" stroke-dasharray="6 5"/><text x="516" y="54" fill="#7ae5b2" font-size="15" font-family="monospace">ENTRY 199–203</text>
            </svg></div>
          </div>
        </div>
        ${suite()}${offer("Ask Mastermind AI")}
      </div></article>`;
    }

    function adFive(){
      const reasons=[
        ["67","Macro regime","Risk On · leaders first","67"],
        ["↗","Theme rotation","Semiconductors · Buy Now","77"],
        ["◎","Options flow","Ask-side calls confirm","$2.8M"],
        ["13F","Fund positioning","41 tracked funds added","+"],
        ["CEO","Insider + Congress","No conflict · cluster scored","CLEAR"],
      ];
      return `<article class="ad ad5"><div class="safe">
        ${brand()}
        <div class="copy"><p class="kicker">Signals with receipts</p>
          <h1 class="headline">Every stock signal<br><span class="accent">should show its work.</span></h1>
          <p class="subhead">See the market case behind every call—then get <b>one honest action, an entry zone and an invalidation level.</b></p>
        </div>
        <div class="proof-board">
          ${signalCard({ticker:"AVGO",price:"$184.20",verb:"NEAR",edge:"76",entry:"$184.20 – $187.10",risk:"$176.80"})}
          <div class="reason-card">
            <div class="panel-h"><span>WHY THIS CALL</span><span class="demo-tag">cross-checked</span></div>
            <h2>The evidence behind AVGO</h2><p>Every desk contributes. Prophet makes the call.</p>
            <div class="reason-list">${reasons.map(r=>`<div class="reason"><span class="ico">${r[0]}</span><span><label>${r[1]}</label><b>${r[2]}</b></span><em>${r[3]}</em></div>`).join("")}</div>
            <div class="record"><b>Timestamped when issued.</b> The live board keeps the wins, losses and autopsies.</div>
          </div>
        </div>
        ${suite()}${offer("See every signal")}
      </div></article>`;
    }

    const selected = new URLSearchParams(location.search).get("ad");
    if(selected) document.body.classList.add("single");
    document.getElementById("gallery").innerHTML=creatives.map(c=>frame(c.id,c.label,c.render())).join("");
  </script>
</body>
</html>
