<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MastermindX — X ad campaign, July 2026</title>
  <style>
    @font-face{font-family:Inter;src:url("../../site/fonts/Inter-400.woff2") format("woff2");font-weight:400;font-display:block}
    @font-face{font-family:Inter;src:url("../../site/fonts/Inter-500.woff2") format("woff2");font-weight:500;font-display:block}
    @font-face{font-family:Inter;src:url("../../site/fonts/Inter-600.woff2") format("woff2");font-weight:600;font-display:block}
    @font-face{font-family:Inter;src:url("../../site/fonts/Inter-700.woff2") format("woff2");font-weight:700;font-display:block}
    @font-face{font-family:Inter;src:url("../../site/fonts/Inter-800.woff2") format("woff2");font-weight:800;font-display:block}
    :root{
      --ink:#1c2430;--ink2:#34404f;--muted:#667489;--faint:#93a0b2;
      --paper:#f7f8fa;--panel:#fff;--line:#dfe4ea;--line2:#eaedf1;
      --blue:#285fff;--blue2:#1d49d5;--bluewash:#edf2ff;
      --green:#1f9148;--greenwash:#e7f5eb;--red:#c53131;--redwash:#faeaea;
      --gold:#ad7a08;--goldwash:#faf2df;--teal:#0c978a;--violet:#735ce0;
      --night:#07101d;--night2:#0c1625;--night3:#111d2e;
      --shadow:0 22px 50px -25px rgba(16,28,48,.36),0 4px 14px -7px rgba(16,28,48,.15);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b121c;color:var(--ink);font-feature-settings:"cv05" 1,"ss01" 1;-webkit-font-smoothing:antialiased}
    body{padding:48px 32px}
    body.render{width:1200px;height:628px;min-height:628px;overflow:hidden;padding:0;background:var(--paper)}
    .gallery-head{max-width:1200px;margin:0 auto 32px;color:#fff;display:flex;justify-content:space-between;align-items:end;gap:24px}
    .gallery-head h1{margin:0;font-size:30px;letter-spacing:-.03em}
    .gallery-head p{margin:8px 0 0;color:#9eacc0;max-width:70ch;line-height:1.55}
    .gallery-head .count{flex:none;border:1px solid #31405a;border-radius:999px;padding:9px 14px;color:#b8c5d8;font-size:13px;font-weight:700}
    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(560px,1fr));gap:28px;max-width:2440px;margin:auto}
    body.render .gallery{display:block;width:1200px;height:628px;margin:0}
    body.render .gallery-head{display:none}
    .frame{position:relative}
    .frame-label{display:flex;justify-content:space-between;align-items:center;color:#aebbd0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 2px 9px}
    body.render .frame-label{display:none}
    .ad{
      position:relative;width:1200px;height:628px;overflow:hidden;background:var(--paper);
      transform-origin:top left;isolation:isolate;
    }
    .gallery .frame{height:328px;overflow:hidden;border-radius:14px;box-shadow:0 20px 55px rgba(0,0,0,.22)}
    .gallery .ad{transform:scale(.47)}
    body.render .frame{width:1200px;height:628px;border-radius:0;overflow:hidden}
    body.render .ad{transform:none}
    .ad::before{content:"";position:absolute;inset:0;z-index:-2;background:
      linear-gradient(rgba(36,55,80,.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(36,55,80,.04) 1px,transparent 1px);
      background-size:44px 44px}
    .ad.night{background:var(--night);color:#f4f7fb}
    .ad.night::before{background:
      radial-gradient(circle at 82% 42%,rgba(40,95,255,.18),transparent 31%),
      linear-gradient(rgba(255,255,255,.032) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.032) 1px,transparent 1px);background-size:auto,44px 44px,44px 44px}
    .ambient{position:absolute;width:460px;height:460px;border-radius:50%;filter:blur(2px);z-index:-1;opacity:.5}
    .ambient.a{right:-150px;top:-210px;background:radial-gradient(circle,rgba(40,95,255,.23),rgba(40,95,255,0) 68%)}
    .ambient.b{left:290px;bottom:-350px;background:radial-gradient(circle,rgba(15,157,143,.15),rgba(15,157,143,0) 67%)}
    .brandbar{position:absolute;left:38px;right:38px;top:28px;height:32px;display:flex;align-items:center;justify-content:space-between;z-index:6}
    .brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;letter-spacing:.04em;color:inherit}
    .mark{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:14px;font-weight:800}
    .night .mark{background:#fff;color:var(--night)}
    .live{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.82);border-radius:999px;padding:7px 12px;font-size:10px;font-weight:800;letter-spacing:.15em;color:var(--ink2);text-transform:uppercase;box-shadow:0 1px 3px rgba(16,28,48,.05)}
    .night .live{background:rgba(12,22,37,.82);border-color:#26344a;color:#dbe5f2}
    .live i{width:7px;height:7px;border-radius:50%;background:#42d6c3;box-shadow:0 0 0 4px rgba(66,214,195,.11)}
    .pairtag{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
    .night .pairtag{color:#718199}
    .content{position:absolute;inset:82px 38px 48px;display:grid;grid-template-columns:43% 57%;gap:30px;align-items:center}
    .copy{position:relative;z-index:3;padding:4px 0 0 4px}
    .kicker{display:flex;align-items:center;gap:8px;margin-bottom:15px;color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
    .night .kicker{color:#6fa4ff}
    .kicker::before{content:"";width:20px;height:2px;border-radius:2px;background:currentColor}
    .headline{max-width:500px;margin:0;font-size:48px;line-height:.98;letter-spacing:-.045em;font-weight:800;text-wrap:balance}
    .headline.compact{font-size:44px}
    .headline .accent{background:linear-gradient(96deg,#2f6bf0 5%,#745fe4 55%,#0f9d8f 108%);background-clip:text;-webkit-background-clip:text;color:transparent}
    .night .headline .accent{background:linear-gradient(96deg,#69a4ff 5%,#9b8cff 55%,#4fd3c2 108%);background-clip:text;-webkit-background-clip:text;color:transparent}
    .sub{max-width:470px;margin:18px 0 0;color:var(--muted);font-size:18px;line-height:1.48;letter-spacing:-.01em}
    .night .sub{color:#a9b6c8}
    .sub b{color:var(--ink);font-weight:700}.night .sub b{color:#f3f6fa}
    .benefits{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
    .benefit{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.78);border-radius:999px;padding:7px 10px;color:var(--ink2);font-size:11px;font-weight:700;white-space:nowrap}
    .night .benefit{background:rgba(17,29,46,.85);border-color:#2a384c;color:#c7d1df}
    .benefit i{width:6px;height:6px;border-radius:50%;background:var(--green)}
    .benefit.blue i{background:var(--blue)}.benefit.violet i{background:var(--violet)}
    .action{display:flex;align-items:center;gap:12px;margin-top:21px}
    .cta{display:inline-flex;align-items:center;gap:9px;background:var(--blue);color:#fff;border-radius:11px;padding:12px 17px;font-size:14px;font-weight:800;box-shadow:0 9px 22px -12px rgba(40,95,255,.85)}
    .cta::after{content:"→";font-size:17px;line-height:1}
    .fine{color:var(--faint);font-size:10.5px;line-height:1.35;max-width:205px}
    .night .fine{color:#7888a0}
    .visual{position:relative;height:466px;display:flex;align-items:center;justify-content:center}
    .panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}
    .night .panel{background:rgba(12,22,37,.97);border-color:#26344a}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .night .panel-head{color:#90a0b6}
    .preview{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--teal);font-size:10px;font-weight:800;letter-spacing:.09em;box-shadow:0 2px 6px rgba(16,28,48,.08)}
    .night .preview{background:#101c2d;border-color:#2c3b50;color:#55d3c2}
    .preview::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
    .num{font-variant-numeric:tabular-nums}
    .stockdot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--bluewash);color:var(--blue);font-size:10px;font-weight:800}
    .night .stockdot{background:#182c4d;color:#7ca9ff}
    .footer{position:absolute;left:42px;right:42px;bottom:17px;display:flex;align-items:center;justify-content:space-between;color:#8d99aa;font-size:9.5px;line-height:1.2;z-index:7}
    .night .footer{color:#66758c}
    .footer .url{font-weight:800;letter-spacing:.04em;color:var(--ink2)}.night .footer .url{color:#96a5ba}

    /* 01 — command centre */
    .command{width:620px;height:420px;position:relative}
    .command .deck{position:absolute;inset:0}
    .mini{position:absolute;border:1px solid var(--line);background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:14px}
    .night .mini{background:#101b2b;border-color:#28364b}
    .mini h4{margin:0;color:var(--muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase}.night .mini h4{color:#8b9bb1}
    .mini.market{left:0;top:105px;width:190px;height:205px;transform:rotate(-2deg)}
    .mini.signal{left:145px;top:44px;width:230px;height:300px;z-index:2}
    .mini.regime{left:315px;top:15px;width:205px;height:360px;z-index:3}
    .mini.themes{right:0;top:70px;width:205px;height:280px;z-index:2;transform:rotate(1.5deg)}
    .tilegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}
    .tile{border-radius:8px;background:var(--greenwash);padding:8px 4px;text-align:center;font-size:9px;font-weight:800}.tile.red{background:var(--redwash)}.tile b{display:block;margin-top:4px;color:var(--green);font-size:11px}.tile.red b{color:var(--red)}
    .sig-status{display:flex;justify-content:space-between;align-items:center;margin:13px 0 8px}.sig-status strong{font-size:18px}.pill{padding:5px 9px;border-radius:999px;background:var(--greenwash);color:var(--green);font-size:9px;font-weight:800}
    .spark{width:100%;height:64px}.spark path.line{fill:none;stroke:#2da35b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.spark path.area{fill:url(#greenArea)}
    .stages{display:flex;justify-content:space-between;margin-top:8px;color:#93a0b1;font-size:8px}.stages b{color:var(--green)}
    .zone{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--line2);font-size:9px;color:var(--muted)}.zone strong{color:var(--ink)}
    .dial{width:124px;height:76px;margin:26px auto 5px;position:relative;overflow:hidden}.dial::before{content:"";position:absolute;left:8px;top:8px;width:106px;height:106px;border:12px solid #dfe4eb;border-bottom-color:transparent;border-left-color:#2d9a55;border-radius:50%;transform:rotate(-45deg)}.dial::after{content:"";position:absolute;left:61px;top:52px;width:43px;height:3px;background:var(--ink2);transform-origin:left center;transform:rotate(-54deg);border-radius:4px}
    .score{text-align:center;font-size:48px;font-weight:800;color:var(--green);line-height:1}.score small{display:block;color:var(--ink2);font-size:12px;margin-top:7px}
    .read{font-size:11px;line-height:1.5;color:var(--muted);margin-top:18px}.read b{color:var(--ink)}
    .lane{margin-top:12px}.lane-title{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:800;color:var(--green);text-transform:uppercase}.lane-row{display:flex;justify-content:space-between;margin-top:7px;background:#f7f9fb;border:1px solid var(--line2);border-radius:7px;padding:7px 8px;font-size:9px;font-weight:700}.lane-row b{color:var(--green)}

    /* 02 — Prophet */
    .prophet{width:590px;padding:21px 22px 18px;position:relative}
    .prophet .name{display:flex;align-items:center;gap:11px}.prophet .ticker{font-size:25px;font-weight:800}.prophet .company{color:var(--muted);font-size:12px}
    .prophet .call{display:flex;align-items:center;justify-content:space-between;margin-top:16px}.callword{display:inline-flex;align-items:center;gap:7px;background:var(--greenwash);color:var(--green);border:1px solid #b9e2c7;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800}.edge{font-size:12px;color:var(--muted)}.edge b{color:var(--green);font-size:20px}
    .prophet .bigchart{height:145px;margin-top:8px;border-bottom:1px solid var(--line2);position:relative}.bigchart svg{width:100%;height:100%}.bigchart .baseline{stroke:#c7d0dc;stroke-width:1.5;stroke-dasharray:5 6}.bigchart .pline{fill:none;stroke:#2ba45b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.bigchart .parea{fill:url(#prophetFill)}.bigchart .entry{fill:#285fff;stroke:#fff;stroke-width:4}
    .lifecycle{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:15px 0 11px;text-align:center;color:#97a3b3;font-size:10px}.lifecycle::before{content:"";position:absolute;left:10%;right:10%;top:5px;height:2px;background:#dfe4ea}.lifecycle span{position:relative;padding-top:15px}.lifecycle span::before{content:"";position:absolute;top:0;left:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:#cbd3de}.lifecycle .on{color:var(--green);font-weight:800}.lifecycle .on::before{background:var(--green);box-shadow:0 0 0 4px rgba(31,145,72,.12)}
    .levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}.level{border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--muted);font-size:10px}.level b{display:block;color:var(--ink);font-size:15px;margin-top:4px}.level.stop b{color:var(--red)}

    /* 03 — themes */
    .themes-board{width:605px;padding:20px}
    .lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}
    .lane-col{min-height:330px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 10px}
    .lane-col .lt{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:800;text-transform:uppercase;margin-bottom:11px}
    .lt.buy{color:var(--green)}.lt.near{color:var(--blue)}.lt.take{color:var(--gold)}.lt.stand{color:#8995a6}
    .theme-row{display:flex;justify-content:space-between;align-items:center;gap:6px;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:10px 8px;margin:7px 0;box-shadow:0 1px 2px rgba(16,28,48,.05);font-size:10px;font-weight:700}.theme-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.theme-row b{font-size:12px;color:var(--muted)}
    .turnline{height:53px;margin-top:5px}.turnline svg{width:100%;height:100%}.turnline path{fill:none;stroke:#2d9a55;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

    /* 04 — filings */
    .filings{width:610px;padding:20px}
    .filings-grid{display:grid;grid-template-columns:1fr 170px;gap:16px;margin-top:15px}
    .filing-row{display:grid;grid-template-columns:40px 1fr 57px 42px;gap:7px;align-items:center;border-bottom:1px solid var(--line2);padding:9px 0;font-size:10px}.role{border-radius:6px;padding:5px 4px;text-align:center;font-weight:800;color:var(--teal);background:#e7f7f5}.role.sen{color:var(--violet);background:#eeebff}.role.cfo{color:var(--gold);background:var(--goldwash)}.person{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person small{display:block;color:var(--muted);font-size:8px;font-weight:500;margin-top:2px}.amount{text-align:right;font-weight:800}.side{border:1px solid var(--line);border-radius:12px;background:#f9fafc;padding:14px}.side .big{font-size:29px;font-weight:800;letter-spacing:-.03em}.side p{font-size:10px;line-height:1.45;color:var(--muted);margin:4px 0 13px}.side .flag{border-top:1px solid var(--line);padding-top:12px;color:var(--green);font-size:24px;font-weight:800}.side .flag small{display:block;color:var(--muted);font-size:9px;font-weight:500;margin-top:3px}

    /* 05 — 13F */
    .funds{width:610px;padding:21px 21px 18px}
    .fund-row{display:grid;grid-template-columns:105px 1fr 92px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2);font-size:10px;font-weight:700}.fund-row:last-child{border-bottom:0}.bar{height:14px;background:#f3f5f8;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#b9dcc5,#56aa73)}.bar i.red{background:linear-gradient(90deg,#edc9c9,#d86b6b)}.holding{text-align:right;color:var(--green);white-space:nowrap}.holding.red{color:var(--red)}
    .fund-foot{display:flex;gap:9px;margin-top:13px}.statbox{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:9px}.statbox b{display:block;color:var(--ink);font-size:17px;margin-bottom:2px}

    /* 06 — flow */
    .flow{width:610px;height:405px;padding:18px 19px;background:#0b1524!important;border-color:#26364e!important}
    .flow .panel-head{color:#8ea0b8}.flow-tabs{display:flex;gap:7px;margin-top:13px}.flow-tab{border:1px solid #283a53;border-radius:7px;padding:6px 9px;color:#7f92aa;font-size:9px;font-weight:700}.flow-tab.on{background:#193567;border-color:#356ee5;color:#dbe8ff}
    .flow-row{display:grid;grid-template-columns:50px 46px 48px 66px 1fr 50px;gap:9px;align-items:center;border-bottom:1px solid #1d2a3d;padding:12px 3px;color:#c4cfdd;font-size:10px}.flow-row.head{color:#6f8199;font-size:8px;font-weight:800;text-transform:uppercase;padding-top:14px}.flow-row .sym{font-weight:800;color:#fff}.type{border-radius:5px;padding:4px 5px;text-align:center;background:#183c2b;color:#60d68a;font-weight:800}.type.put{background:#49232a;color:#ff8585}.premium{font-weight:800;color:#f2f5f9}.flowbar{height:6px;background:#182437;border-radius:4px;overflow:hidden}.flowbar i{display:block;height:100%;background:#356fe3;border-radius:4px}.sweep{color:#62d18a;font-weight:800}.sweep.block{color:#c2a85e}
    .flow-sum{display:flex;justify-content:space-between;margin-top:15px;border:1px solid #26364e;border-radius:10px;padding:12px 14px;color:#8192a8;font-size:9px}.flow-sum b{display:block;color:#f0f4f8;font-size:16px;margin-top:4px}

    /* 07 — AI */
    .ai{width:610px;height:420px;padding:0;overflow:hidden}
    .ai-top{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.1em}.ai-toggle{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}.ai-toggle span{padding:6px 10px;border-radius:999px;color:var(--muted);letter-spacing:0}.ai-toggle .on{background:var(--blue);color:#fff}
    .chat{padding:16px 17px 0}.bubble{max-width:82%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--ink2);font-size:10px;line-height:1.45;margin-bottom:8px}.bubble.q{margin-left:auto;background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}.readline{font-size:9px;color:var(--muted);margin:7px 0 10px}.readline::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-right:7px;box-shadow:0 0 0 4px rgba(40,95,255,.1)}
    .aichart{height:157px;background:#091322;border-radius:11px;padding:8px 10px;position:relative}.aichart svg{width:100%;height:100%}.aichart .grid{stroke:#233149;stroke-width:1}.aichart .ma{fill:none;stroke:#3a88e8;stroke-width:2}.aichart .price{fill:none;stroke:#47ce91;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.aichart .entryline{stroke:#33b99e;stroke-width:1.5;stroke-dasharray:4 4}.aichart .stopline{stroke:#e25555;stroke-width:1.5;stroke-dasharray:4 4}.aichart .label{fill:#50d9c2;font-size:8px;font-weight:800}.ai-input{display:flex;justify-content:space-between;align-items:center;margin:12px 14px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:#98a4b4;font-size:9px}.send{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:var(--blue);color:#fff;font-size:13px}

    /* 08 — terminal */

      const plainHeadline=ad.headline.replace(/<[^>]+>/g,"");
      const compact=plainHeadline.length>56?"compact":"";
      return `<div class="frame">
        <div class="frame-label"><span>${ad.pair} · VARIANT ${ad.variant}</span><span>${ad.id}</span></div>

        </article>
      </div>`;
    }
    const params=new URLSearchParams(location.search);
    const requested=params.get("ad");
    const selected=requested?ads.filter(a=>a.id===requested):ads;
    if(requested) document.body.classList.add("render");
    if(requested && selected.length===0) document.body.innerHTML=`<p style="color:white">Unknown ad: ${requested}</p>`;
    else document.getElementById("gallery").innerHTML=selected.map(renderAd).join("");
    document.fonts.ready.then(()=>document.documentElement.dataset.ready="true");
