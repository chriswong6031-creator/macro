<!-- Neural Web plate — archived from the landing AI section (operator call, 2026-07-22).

<style>
:root{--plate:#0b1120;--r-lg:16px;--sh-plate:0 24px 60px -20px rgba(18,26,45,.34);--muted:#5d6b7e;--faint:#8a95a4}
.web-plate{background:var(--plate);border-radius:var(--r-lg);box-shadow:var(--sh-plate);padding:10px;position:relative}
.web-plate svg{width:100%;height:auto;display:block;border-radius:10px}
.web-cap{margin:12px 4px 4px;font-size:12.5px;color:var(--muted);text-align:center}
/* living synapses: opacity-only flicker on select edges (compositable) */
@keyframes synFlash{0%,100%{opacity:.18}50%{opacity:.6}}
.web-plate .syn-f{animation:synFlash 3s ease-in-out infinite}
.web-plate .syn-f:nth-of-type(7){animation-duration:2.6s;animation-delay:-1.4s}
.web-plate .syn-f:nth-of-type(8){animation-duration:3.4s;animation-delay:-2.1s}
.web-plate .syn-f:nth-of-type(10){animation-duration:4.4s;animation-delay:-.6s}
.web-plate .syn-f:nth-of-type(12){animation-duration:3.8s;animation-delay:-3s}
.web-plate .syn-f.contra{animation-duration:2.9s;animation-delay:-1.1s}
@keyframes nwHaloBreathe{0%,100%{opacity:.5}50%{opacity:.85}}
.web-plate .nw-halo{animation:nwHaloBreathe 4s ease-in-out infinite;transform-origin:280px 200px}
</style>

<script>
const CALM=false, STILL=false;
/* — Neural Web living light: SMIL pulse dots travelling the six main edges —
   Skipped entirely under CALM / .still so captures stay static (CSS flicker /
   halo breathe are opacity-only and already killed by the global .still rule). */
(function(){
  if (CALM || STILL) return;
  const plate = document.querySelector('.web-plate svg'); if (!plate) return;
  const NSx='http://www.w3.org/2000/svg', XL='http://www.w3.org/1999/xlink';
  const HUB=['#4f7ede','#8fa8e8','#d8a33e','#9d8dff','#3fae6d','#5eead4'];
  const DUR=[3.8,7,4.6,6.2,5.4,4.2], REV=[false,false,true,false,true,false];
  const g=document.createElementNS(NSx,'g');
  for(let i=0;i<6;i++){
    const path=plate.querySelector('#nw-e'+i); if(!path) continue;
    const dot=document.createElementNS(NSx,'circle');
    dot.setAttribute('r','2'); dot.setAttribute('fill',HUB[i]); dot.setAttribute('opacity','.9');
    const am=document.createElementNS(NSx,'animateMotion');
    am.setAttribute('dur',DUR[i]+'s'); am.setAttribute('repeatCount','indefinite');
    am.setAttribute('begin',(i*0.6)+'s'); am.setAttribute('calcMode','linear');
    if(REV[i]){ am.setAttribute('keyPoints','1;0'); am.setAttribute('keyTimes','0;1'); }
    const mp=document.createElementNS(NSx,'mpath'); mp.setAttributeNS(XL,'href','#nw-e'+i);
    am.appendChild(mp); dot.appendChild(am); g.appendChild(dot);
  }
  plate.appendChild(g);
})();
</script>
