<!DOCTYPE html>
<!-- OG/social card source — captured headless at exactly 1200x630 to
     site/assets/landing/og_card.png. Not shipped; regenerate on rebrand. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Archivo+Expanded:wght@800;900&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#f7f8fa;font-family:'Inter',sans-serif;color:#1c2430;position:relative}
.grid{position:absolute;inset:0;
  background:
    radial-gradient(46% 52% at 78% 42%,rgba(40,95,255,.10),transparent 70%),
    linear-gradient(rgba(28,36,48,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(28,36,48,.04) 1px,transparent 1px);
  background-size:auto,52px 52px,52px 52px;
  -webkit-mask-image:radial-gradient(85% 85% at 45% 50%,#000 55%,transparent 100%)}
.in{position:relative;height:100%;padding:64px 72px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-family:'Archivo Expanded',sans-serif;font-weight:800;font-size:24px;letter-spacing:.02em}
.brand .m{width:44px;height:44px;border-radius:11px;background:#1c2430;display:grid;place-items:center;color:#fff;font-family:'Archivo',sans-serif;font-weight:800;font-size:23px}
h1{font-family:'Archivo Expanded','Archivo',sans-serif;font-weight:900;letter-spacing:-.02em;line-height:.99;font-size:84px;margin-top:78px}
h1 .dim{color:#8a95a4}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.tag{font-family:'Archivo',sans-serif;font-weight:700;font-size:17px;letter-spacing:.14em;color:#5d6b7e}
.pill{display:inline-flex;align-items:center;gap:10px;background:#1c2430;color:#fff;border-radius:99px;padding:12px 24px;font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;letter-spacing:.1em}
.pill i{width:10px;height:10px;border-radius:50%;background:#5eead4;font-style:normal}
/* mini constellation, right side */
.mini{position:absolute;right:60px;top:96px;width:400px;height:400px}
.mini svg{width:100%;height:100%}
.card{position:absolute;background:#fff;border:1px solid #e6e9ee;border-radius:14px;box-shadow:0 26px 54px -20px rgba(18,26,45,.32),0 6px 16px -8px rgba(18,26,45,.12);padding:14px 16px;font-size:13px}
.card .k{font-family:'Archivo',sans-serif;font-weight:700;font-size:9px;letter-spacing:.14em;color:#5d6b7e}
.c1{right:236px;top:-12px;width:180px;transform:rotate(-4deg)}
.c1 .n{font-family:'Archivo Expanded',sans-serif;font-weight:900;font-size:42px;line-height:1.05}
.c1 .s{font-size:12px;color:#34404f;font-weight:600}
.c2{right:-6px;top:36px;width:172px;transform:rotate(3deg)}
.c2 .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eef0f3;font-weight:600;font-size:12px}
.c2 .row:last-child{border-bottom:0}
.up{color:#1f8b41}.dn{color:#c12f2f}
.c3{right:130px;bottom:-4px;width:196px;transform:rotate(-2deg)}
.c3 .lane{display:flex;justify-content:space-between;font-weight:600;font-size:12px;padding:5px 0;border-bottom:1px solid #eef0f3}
.c3 .lane:last-child{border-bottom:0}
.c3 .b{font-family:'Archivo',sans-serif;font-weight:700;font-size:9px;letter-spacing:.06em;color:#1f8b41;background:#e9f5ec;border-radius:5px;padding:2px 7px}
.c3 .g{color:#b07d05;background:#faf3e2}
</style>
</head>
<body>
<div class="grid"></div>
<div class="mini">
  <svg viewBox="0 0 400 400">
    <g fill="none" stroke-linecap="round">
      <path d="M118 96 Q 150 170 196 196" stroke="#285fff" stroke-width="2.4" opacity=".55"/>
      <path d="M312 118 Q 262 168 216 190" stroke="#7862e0" stroke-width="2.4" opacity=".5"/>
      <path d="M258 330 Q 232 268 206 218" stroke="#b07d05" stroke-width="2.4" opacity=".5"/>
    </g>
    <circle cx="200" cy="204" r="52" fill="#ffffff" stroke="#e3e8f2"/>
    <circle cx="200" cy="204" r="52" fill="none" stroke="rgba(40,95,255,.2)" stroke-width="7" opacity=".6"/>
    <g fill="none" stroke="rgba(40,95,255,.55)" stroke-width="1.4">
      <path d="M200 168 L226 186 L229 214 L208 236 L178 230 L169 200 L184 178 Z"/>
      <path d="M200 168 L200 204 M226 186 L200 204 M229 214 L200 204 M208 236 L200 204 M178 230 L200 204 M169 200 L200 204 M184 178 L200 204"/>
    </g>
    <g>
      <circle cx="200" cy="168" r="5" fill="#285fff"/><circle cx="226" cy="186" r="4.4" fill="#7862e0"/>
      <circle cx="229" cy="214" r="4.4" fill="#0f9d8f"/><circle cx="208" cy="236" r="4.4" fill="#1f8b41"/>
      <circle cx="178" cy="230" r="4.4" fill="#b07d05"/><circle cx="169" cy="200" r="4.4" fill="#c12f2f"/>
      <circle cx="184" cy="178" r="4" fill="#2f63c4"/>
    </g>
    <circle cx="200" cy="204" r="16" fill="rgba(40,95,255,.15)"/>
    <circle cx="200" cy="204" r="9" fill="#285fff"/>
  </svg>
  <div class="card c1"><p class="k">TODAY'S READ · US</p><p class="n">50</p><p class="s">Mixed — trade smaller</p></div>
  <div class="card c2"><p class="k">RISK RADAR</p>
    <div class="row"><span>Pullback odds</span><span class="dn">38%</span></div>
    <div class="row"><span>Correction</span><span>24%</span></div>
  </div>
  <div class="card c3"><p class="k">PROPHET · TODAY</p>
    <div class="lane"><span>XLE</span><span class="b">BUY NOW</span></div>
    <div class="lane"><span>MU</span><span class="b g">ALMOST READY</span></div>
  </div>
</div>
<div class="in">
  <div class="brand"><span class="m">M</span> MASTERMIND</div>
  <h1>Every market.<br>Every signal.<br><span class="dim">One desk.</span></h1>
  <div class="foot">
    <span class="tag">INSTITUTIONAL MARKET INTELLIGENCE</span>
    <span class="pill"><i></i>MASTERMIND-X.COM</span>
  </div>
</div>
</body>
</html>
