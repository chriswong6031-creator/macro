<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Mastermind Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- login gate (shown only when auth is enabled and there's no session) -->
  <div class="login-wrap" id="login">
    <div class="login-card">
      <h1><span style="color:var(--accent)">●</span> Mastermind Admin</h1>
      <div class="sub">Sign in to the control console.</div>
      <form id="loginForm" autocomplete="off">
        <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
        <div class="err" id="loginErr"></div>
        <button class="btn primary" type="submit">Sign in</button>
      </form>
    </div>
  </div>

  <div id="app" style="display:none">
    <div class="app-shell">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <div class="dot"></div>
          Mastermind
        </div>
        <nav id="sidenav"></nav>
      </aside>

      <!-- Right column -->
      <div class="shell-right">
        <!-- Topbar -->
        <div class="topbar" id="topbar">
          <span class="topbar-title" id="topbar-title">Overview</span>
          <span class="spacer"></span>
          <div id="hmeta" class="hmeta" style="margin-left:0"><span class="muted">loading…</span></div>
        </div>

        <!-- Content -->
        <main>
          <div class="banner" id="banner"></div>
          <div class="content" id="view"><div class="spin">Loading…</div></div>
        </main>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
